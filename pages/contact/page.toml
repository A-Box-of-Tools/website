#
# The Contact page. Prose lives next door in body.html; this file is the frame
# around it.
#
# The footer has carried a mailto: for as long as there has been a footer, and
# an address in a footer is not a way of getting in touch - it says where to
# write and nothing about what is worth writing about, what happens next, or
# how long it takes. This page says all three, which is the difference between
# a contact link and a contact page.
#
# Its slug is named in config/site.toml as publisher.contact_slug, because the
# Organization node in the structured data has to point at this page and a slug
# spelled out in the middle of buildlib/site.py is one that gets left behind
# when the page is renamed.
#

slug = "contact"
kind = "site"
schema_type = "ContactPage"
nav = "Contact"

title = "Contact abox.tools &mdash; Report a Bug, Ask, or Suggest a Tool"
description = "Send private feedback without an account, email the maintainer, or use the public issue tracker. People and agents are welcome to report bugs and contribute fixes."

heading = "Contact"
