#
# Guide: the one decision, and how to make it.
#
# Unlike the two JPEG converters' guides, the reader here usually is not stuck.
# They have working PNGs and want them smaller - for a website, usually - so
# this page is about a choice rather than a rescue. The choice is lossless
# against lossy, it has a right answer that depends entirely on what is in the
# picture, and nobody explains it: every other page on this subject says "WebP
# is smaller" and stops.
#
# The second half is the honesty the tool's own page carries: "lossless" is
# read back out of the written file rather than claimed, and it has a measured
# footnote about half-transparent pixels.
#
# Prose lives next door in body.html.
#

