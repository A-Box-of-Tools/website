#
# Guide: is it safe to scan a QR code?
#
# The second guide written to be found rather than to be used. "Quishing" has
# put the question into a lot of heads, and most of the answers online are
# either "never scan anything" or an antivirus advert. The honest answer is
# that the scan is harmless and the danger is one tap later - which is also
# the reason the reader tool on this site refuses to open what it reads.
#
# Prose lives next door in body.html.
#

