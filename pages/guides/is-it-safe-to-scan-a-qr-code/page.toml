heading = "Is it safe to scan a QR code?"
lede = """
    The scan itself is. A QR code is a piece of text, and pointing a camera at
    it does nothing but read that text. Everything that can go wrong happens
    one tap later, when something opens what was read &mdash; and that tap is
    yours to withhold."""

