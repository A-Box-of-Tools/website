#
# Guide: putting a password on a PDF, or restrictions, and knowing which.
#
# Written for somebody about to send a document they would rather not have
# read by the wrong person - a statement, a contract, a medical letter - who
# has typed "password protect pdf" and been offered a page that wants the
# document uploaded first. The guide's first job is to say that the upload is
# the odd part of that arrangement, and its second is the one the unlocker's
# guide makes from the other side: a password and a restriction are not two
# strengths of one lock, and a guide that let them blur would be selling
# something.
#
# Prose lives next door in body.html.
#

