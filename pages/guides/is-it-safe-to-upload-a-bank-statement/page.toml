#
# Guide: is it safe to upload a bank statement?
#
# The guide for /bank-statement-to-csv/, and the one on this site where the
# honest answer is furthest from "it depends". A statement is the densest
# personal document most people own - every payee, every amount, the balance,
# the account number - and the conversion industry around it is almost
# entirely upload-based.
#
# The argument that had to be got right: this is not a scare piece. The
# services are mostly not villains, and saying so is what makes the rest
# credible. What the page does instead is name what you are handing over, what
# the reputable ones actually do with it, and the two questions that decide
# whether the upload had to happen at all - which is the same shape as the
# other guides in this group.
#
# Prose lives next door in body.html.
#

