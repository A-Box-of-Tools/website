#
# Guide: redacting a PDF so the words are actually gone.
#
# Written for the person who is about to file, send or publish a document with
# something private in it, and who has been told - or has worked out - that the
# black rectangle they drew in a reader is not enough. The page leads with how
# to check a file, because that is the part nobody is taught and the part that
# would have caught every published failure of this kind.
#
# The other half of it is the case a PDF has that a picture does not: the text
# in a PDF exists twice over, in the page and in the bookmarks, comments, form
# fields and properties around it, and a redaction that only handles the first
# is the second-most common way this goes wrong.
#
# Prose lives next door in body.html.
#

