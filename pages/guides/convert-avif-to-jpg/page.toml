#
# Guide: the file that will not open, and the decoder already on the machine.
#
# The reader has downloaded something from a web page, got a .avif, and found
# that Windows Photos, Photoshop or an upload form will not take it. The thing
# they have not noticed is that the file opens perfectly in the browser tab
# they are reading this in - which is both why they have it and why no upload
# is needed to convert it.
#
# The contrast with HEIC is the spine of the page and is worth keeping: the two
# formats are near-identical containers and the software situation is exactly
# reversed, which is why one of our converters ships 1.4 MB of codec and the
# other ships none. A reader who understands that pair can work out for
# themselves which converters need a server.
#
# Prose lives next door in body.html.
#

