#
# Guide: formatting JSON, and what a formatter must not change.
#
# Written for the person who has a wall of minified JSON, an error message with
# a character offset in it, and a search box full of sites that will format it
# for them if they paste it in. Three things they are not told anywhere: that
# most formatters quietly reorder their keys, that the number in the file is
# not always the number that comes back, and that pasting a config file into a
# stranger's site is a disclosure.
#
# Prose lives next door in body.html.
#

