heading = "How to trace an image into an SVG"
lede = """
    A PNG enlarged is a staircase. An SVG is instructions for drawing, so it
    is sharp at any size &mdash; and turning one into the other is called
    tracing. It works beautifully on shapes and badly on photographs, and
    the difference is worth understanding before you start."""

