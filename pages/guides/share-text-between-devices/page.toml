#
# Guide: moving text and files between devices without a server keeping them.
#
# Written for the person emailing themselves a note, pasting a password into
# a chat app, or hunting a USB stick because the file is on the wrong
# machine. The thing they are not told anywhere: every "quick share" service
# in the search results stores what they paste and promises to delete it,
# and the promise is the only part they cannot check. The tool next door is
# built so there is nothing to promise about.
#
# Prose lives next door in body.html.
#

