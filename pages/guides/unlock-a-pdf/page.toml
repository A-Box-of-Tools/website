#
# Guide: removing a password or the restrictions from a PDF.
#
# Written for somebody holding a document that will not print, or will not
# copy, or will not open - three complaints that arrive under one word,
# "protected", and have almost nothing to do with each other. The page leads
# with telling them apart, because which one you have decides whether the job
# takes one click or is impossible without a password you do not have.
#
# The half worth getting right is the honest one. The restrictions are not
# cryptography and never were - Adobe documented them as an agreement between
# well-behaved programs from the day they were introduced - and a guide that
# implied otherwise would be either scaremongering or selling something. But
# the open password IS real, and the page has to say that just as plainly,
# because the person who has lost one needs to hear "no" rather than be sold a
# recovery tool.
#
# Prose lives next door in body.html.
#

