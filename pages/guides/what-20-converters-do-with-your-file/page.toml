#
# Guide: what 20 online converters do with your file.
#
# The measured companion to is-it-safe-to-upload-files, which sets out four
# checks a reader can run and then asks them to go and run them. This one runs
# the second of those checks - watch the network - against twenty named sites
# and publishes the numbers, because "most converters upload your file" was an
# assertion this site kept making and had never actually counted.
#
# Everything in the table was measured in a browser on one afternoon and every
# number in it is a byte count taken off the wire, not an estimate. The dates
# matter more here than on any other page: a site can change its uploader or
# its policy the week after, so the page says when it was measured, says what
# the method could not reach, and tells the reader how to redo it rather than
# asking to be believed. That is also why the method section is long enough to
# be repeated by somebody who does not trust us.
#
# Prose lives next door in body.html.
#

