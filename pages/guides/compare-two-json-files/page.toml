heading = "How to compare two JSON files"
lede = """
    Diff two JSON files as they come and most of what lights up is nothing:
    indentation, line wrapping, keys in a different order. The fix is not a
    cleverer diff &mdash; it is putting both files through the same formatter
    first, so that the only differences left are real ones. Both steps run in
    your browser, which is where config files with secrets in them belong."""

