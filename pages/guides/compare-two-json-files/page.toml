#
# Guide: compare two JSON files.
#
# The workflow that made Format and Compare neighbours when they shared a
# page, written down now that they have a page each: put both files through
# the formatter the same way, then diff the results. It exists because a raw
# diff of two JSON files is mostly noise - indentation, line wrapping, key
# order - and the fix is not a smarter diff but a canonical form.
#
# `tool` points at compare-text: the diff is the page this guide ends on, and
# compare-text was the one tool in the chain without a guide.
#

