title = "Does Converting a Photo Remove Its Metadata?"
description = "Sometimes - and both outcomes surprise people. Which operations strip EXIF, which quietly keep it, why the screen shows no difference either way, and how to check a file instead of assuming."

heading = "Does converting a photo remove its metadata?"
lede = """
    Sometimes, and both answers have burned people. Re-encoding through a
    canvas strips everything; a careful converter copies everything over;
    the picture looks identical either way. The only reliable move is to
    stop predicting and look at the file."""

