#
# Guide: does converting a photo remove its metadata?
#
# The answer is "it depends on the tool", which is exactly why the page
# exists: this site's own tools land on both sides on purpose. The
# compressor and resizer cannot help stripping (a canvas carries no tags),
# the HEIC converter goes out of its way to carry the block over, and the
# EXIF tool removes without re-encoding. People assume one behaviour, ship
# the other, and never see the difference on screen - both directions of
# that mistake are worth a page.
#
# Prose lives next door in body.html.
#

