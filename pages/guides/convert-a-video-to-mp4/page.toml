#
# Guide: turning a video into the MP4 that uploads.
#
# Written for somebody whose file has just been refused - by an upload
# form, a chat app, a mail client, a video editor - and who has been told
# "it needs to be MP4" without being told what that means. So the guide
# says what an MP4 that uploads actually is (a container, a picture codec
# and a sound codec, and all three have to be right), which files people
# actually arrive with and what each needs, why a conversion is sometimes a
# copy and sometimes a re-encode, and how to do it in the browser without
# the upload every online converter asks for first.
#
# Prose lives next door in body.html.
#

