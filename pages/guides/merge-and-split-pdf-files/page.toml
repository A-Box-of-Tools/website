#
# Guide: merging, splitting and reordering PDF pages.
#
# The one job where "it went to a server" is worst, because of what people
# merge: a contract and its signature page, a passport and a bank statement, a
# claim form and a medical letter. Already collated, in one place, for someone
# else's server.
#
# It is also the job where every tool loses something without saying so, so the
# useful half of this guide is the part about what survives a reshuffle -
# bookmarks, links, form fields, tagging - and what nothing can carry across.
#
# Prose lives next door in body.html.
#

