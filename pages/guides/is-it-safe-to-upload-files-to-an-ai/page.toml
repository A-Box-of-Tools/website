#
# Guide: is it safe to upload files to an AI?
#
# The flagship question asked again, ten guides later, about the destination
# people actually send files to now. A chat window is an upload form that
# does not look like one, and it differs from a converter in three ways that
# matter: the content is read rather than transformed, an agent may forward
# it onward, and the file people paste is the sensitive one, because the job
# is "explain this". The four checks mostly do not translate - a chatbot
# needs the network by design - so the discipline shifts to sending less and
# sending it clean, which is where this site's redaction and EXIF tools earn
# their place as the pre-flight step.
#
# Prose lives next door in body.html.
#

