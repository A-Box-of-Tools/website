title = "How to Stack Photographs to Reduce Noise, or Remove People"
description = "Stacking combines a burst of frames into one picture. Which method to use depends on what you are trying to lose: noise, passers-by, or the shallow depth of field on a macro shot. How each one works, what it costs, and how RAW files fit in."

heading = "How to stack photographs to reduce noise, or remove people"
lede = """
    A burst of frames holds more information than any one of them. Averaging
    them cancels the noise; taking the middle value of each pixel deletes
    anything that was only there some of the time. Which one you want depends
    entirely on what moved."""

