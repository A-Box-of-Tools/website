#
# Guide: stacking photographs, and what each method is actually for.
#
# Written for the person who has a burst on their card and has been told that
# stacking will "clean it up". The failure this page is about is not doing it
# wrong; it is choosing the method that solves a different problem - averaging a
# scene with people walking through it, or taking a median of a set where
# nothing moved and wondering why it looks the same. So the page leads with the
# question that picks the method, and only then with the arithmetic.
#
# The RAW section exists because it is the thing people expect to be impossible
# in a browser, and because being precise about what comes out of a RAW file
# here - the camera's preview, not the sensor - matters more than being brief.
#
# Prose lives next door in body.html.
#

