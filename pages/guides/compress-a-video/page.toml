#
# Guide: getting a video under a size limit.
#
# Written for somebody whose clip has just been refused - by a chat app, an
# email, a form - and who wants it to send, not to learn video encoding. So
# the guide starts from the number, says what the number costs and where it
# is spent, and only then explains why the upload every online compressor
# asks for is both the slow part and the strange part. The honest half is
# that a compressed video is a re-encoded one; the guide says what is lost
# and how to lose as little as the number allows.
#
# Prose lives next door in body.html.
#

