title = "Is Base64 Encryption?"
description = "No - and the difference matters in practice. Encoding, encryption and hashing solve three different problems: one anybody can reverse, one the key holder can reverse, one nobody can. Which is which, and how to tell on sight."

heading = "Is base64 encryption?"
lede = """
    No. Base64 is a change of costume, not a lock: anyone who recognises it
    can undo it in milliseconds, no key required. But the question deserves
    a real answer, because encoding, encryption and hashing look alike on
    screen and could hardly be more different in what they promise."""

