#
# Guide: is base64 encryption?
#
# The misconception with the steadiest search volume of anything this group
# covers. Base64-looking strings read as scrambled, so people file them
# under "secure", and real systems have shipped with passwords "protected"
# this way. One page to hold the three-way distinction the tools keep
# needing: encoding reverses for everyone, encryption reverses for the key
# holder, hashing reverses for no one.
#
# Prose lives next door in body.html.
#

