#
# Guide: putting a watermark on a PDF, and knowing what it is worth.
#
# Written for somebody about to send a scan of something personal - an ID, a
# statement, a contract - to an agency, a lender or a landlord, who has been
# told to "watermark it" and wants to know why, how, and whether it does what
# they hope. The honest half is the important one: a watermark makes a copy
# say where it went, which is a real and useful thing, and it stops nobody
# from copying the document. The guide says both, and points at the
# protector for the case that needs a lock.
#
# Prose lives next door in body.html.
#

