#
# Guide: get photos ready for the web.
#
# The pipeline nobody names but everybody runs: phone photos out, something
# postable in - the right format, no GPS, a sensible size in pixels, and a
# sensible size in kilobytes. Four tools cover it, and the interesting fact
# the guide is built around is that metadata answers itself along the way:
# anything resized or compressed is redrawn from pixels, and redrawn pixels
# carry no tags.
#
# No `tool` key: all four tools this chains already carry their own guides.
# Prose lives next door in body.html.
#

