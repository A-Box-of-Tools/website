#
# Guide: can an AI agent use these tools?
#
# The first guide written for a visitor who may not be the one pressing the
# buttons. Agents are starting to do file chores for people, and the question
# that matters is not whether they can drive a web page - they can - but
# where the browser they drive is running, because that decides whether the
# site's promise survives the delegation. A local agent driving these pages
# keeps the file on the machine; a cloud agent received the file before any
# tool was opened. The guide also owns up to what the site does for such a
# reader on purpose: labelled controls, no accounts, public source, and
# /llms.txt as the one-fetch map.
#
# Prose lives next door in body.html.
#

