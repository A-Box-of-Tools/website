heading = "When to put a picture inside your CSS, and when not to"
lede = """
    An image written into a stylesheet arrives with it: no second request, no
    waiting. It also stops being a file &mdash; so it cannot be cached on its
    own, and it is downloaded again every time anything around it changes. This
    is where that trade is worth making, and where it quietly is not."""

