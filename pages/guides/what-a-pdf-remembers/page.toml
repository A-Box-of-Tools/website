description = "Author names, the Word file it used to be, comments, attachments - and sometimes every earlier version of itself, deletions included. Where a PDF keeps its memory, and how to send one without its history."

heading = "What a PDF remembers"
lede = """
    More than its pages. A PDF routinely carries the name of its author, the
    software that made it, the file it was before it was a PDF &mdash; and,
    if it was edited a certain common way, every earlier version of itself,
    deletions included. None of it shows on screen."""

