#
# Guide: what a PDF remembers.
#
# The container guide to go with the redaction guide's contents. Three PDF
# tools here quietly strip or supersede a document's memory - the merger
# ships no producer line at all, the compressor's rewrite abandons the
# file's past versions, the redactor scrubs /Info and the XMP packet on
# every run - and none of their pages has room to explain what a PDF was
# remembering in the first place. This page is that explanation.
#
# Prose lives next door in body.html.
#

