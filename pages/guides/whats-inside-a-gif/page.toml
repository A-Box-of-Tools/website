#
# Guide: what is actually inside a GIF file.
#
# The useful content here is the byte arithmetic and the delay clamp, because
# those are the two things that make a GIF behave in a way its maker did not
# intend: a file three times the size it needed to be, and an animation playing
# at a fifth of the speed it asks for. Both are invisible in a viewer and both
# are obvious the moment somebody looks at the structure.
#
# It is also the guide that has to explain disposal, which is the field nobody
# understands and the one that decides whether an animation smears. Prose lives
# next door in body.html.
#

