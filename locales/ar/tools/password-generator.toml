#
# مولّد كلمات المرور والعبارات - Arabic.
#
# Overrides for tools/password-generator/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# The English file names what makes this page different and it holds in Arabic:
# everywhere else "nothing is uploaded" protects a file you already had; here
# there is no file, and the thing protected did not exist until this page made
# it. A generator that sent its output anywhere would not be a weak tool, it
# would be a collection. That sentence is translated as an accusation, because
# that is what it is.
#
# crypto.getRandomValues, Math.random, localStorage and TLS keep their names.
# "diceware" is transliterated once with the English beside it: it is the term
# to search for, and there is no Arabic word that would find the EFF lists.
#
# The example strings - correct horse battery staple, P@ssw0rd! - stay in
# English. They are the passwords being discussed, and translating them would
# discuss different passwords.
#

