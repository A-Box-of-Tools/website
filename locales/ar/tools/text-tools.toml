[[privacy]]
title = "ليس لما تلصقه مكان يذهب إليه."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده رمزٌ مميز ملصوق، ولا في الشيفرة
      ما يرسله إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. وكلُّ محلِّل،
      وكلُّ مرمِّز، والمقارنةُ، دوالُّ في هذه الصفحة تأخذ سلسلة وتعيد
      سلسلة."""

[[privacy]]
title = "المنسِّقات تُبقي على ما أُعطِيته."
body = """
 كائنُ JSON يعود ومفاتيحه
      بالترتيب الذي كتبتها به وأرقامُه مكتوبة كما كتبتها، لأن
      <code>src/json.js</code> محلِّلٌ لا استدعاءٌ لـ
      <code>JSON.parse</code>، وهي تعيد ترتيب المفاتيح الشبيهة بالأعداد الصحيحة
      وتحوّل معرّفاً من عشرين رقماً إلى أقرب عدد عائم مضاعف. والاختبارات في
      <code>tests/js/text-format.test.js</code> تفحص ذلك بالضبط."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها محرفاً واحداً من نصّك. وكل سطر يقرؤه أو يحلّله أو يكتبه يُخدَم من
      هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر العمل."
body = """
 أربعة تبويبات، وتتشارك حقلاً واحداً:
      <em>تنسيق</em> يبسط JSON وXML وHTML وCSS وYAML أو يعصرها؛ و<em>تحويل</em>
      يحوّل JSON إلى YAML أو XML والعكس؛ و<em>ترميز</em> يفعل Base64 والعناوين
      وكيانات HTML والست عشري وهروب الشرطة المائلة الخلفية، في الاتجاهين؛
      و<em>مقارنة</em> تعرض ما تغيّر بين نصّين."""

[[howto]]
title = "الصقه، أو أفلِت الملف."
body = """
 كلُّ ما تستطيع تحديده ونسخه
      يعمل. والملفُّ المُفلَت على المُنتقي يقرؤه متصفحك أنت ويضعه في الحقل
      &mdash; فلا خطوة رفع تُغفَل. وأفلِت ملفين أثناء المقارنة فيحطّ كلٌّ في
      جانب."""

[[howto]]
title = "دعه يستنتج اللغة، أو قلها له."
body = """
 القائمة تقول ماذا قرأ
      النصّ على أنه، وتصحيحُها نقرةٌ واحدة. والتخمين موضع بداية لا غير، ولهذا
      يُعرَض لا يُطبَّق في صمت."""

[[howto]]
title = "اختر المسافة البادئة، أو اعصره مسطَّحاً."
body = """
 مسافتان، أو
      أربع، أو مسافة جدولة. وعصرُه مسطَّحاً هو المستند نفسه وقد أُخرِجت منه كل
      مسافة لم تكن إلا للقراءة، ويقول الناتج كم بايتاً وفّر ذلك."""

[[howto]]
title = "اقرأ الخطأ حيث الخطأ."
body = """
 المحلِّل الذي يفشل هنا يقول ما
      الذي وجده وفي أي سطر وعمود، بدل &laquo;رمز غير متوقَّع عند الموضع
      4193&raquo;. وذلك يكفي عادةً لإصلاح ملف إعدادات دون فتح شيء آخر."""

[[howto]]
title = "خذ الناتج."
body = """
 انسخه، أو نزّله ملفاً. والمقارنة تنزل
      ملفَّ <code>.patch</code> بالصيغة الموحَّدة، وهي ما تتوقّعه مراجعةُ
      الشيفرة و<code>git apply</code> وكلُّ عارض فروق."""

[[faq]]
q = "هل يُرفع نصّي إلى أي مكان؟"
a = """
        لا. كلُّ محلِّل ومرمِّز ومقارنة على هذه الصفحة دالّةٌ تعمل في متصفحك
        أنت، على جهازك أنت. وليست لهذه الأداة وظيفة شبكية من أي نوع &mdash; فهي
        لا تجلب شيئاً ولا ترسل شيئاً أبداً &mdash; و
        <code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل عنوان
        يجوز لها الاتصال به، وليس واحد منها لنا. وذلك هو سبب استعمالها لرمز
        وصول مميز أو كعكة جلسة أو سجلّ عميل: فلصقُ واحد من تلك في منسِّق شخص
        آخر إعطاؤه إياه."""

[[faq]]
q = "هل يغيّر تنسيقُ JSON شيئاً غير التخطيط؟"
a = """
        لا، وذلك أصعب مما يبدو. فالمفاتيح تُبقي الترتيب الذي كتبتها به
        &mdash; والمنسِّق المبنيّ على <code>JSON.parse</code> ينقل المفاتيح
        الشبيهة بالأعداد الصحيحة إلى المقدمة في صمت، فيعود
        <code>{"10":a,"2":b}</code> على هيئة
        <code>{"2":b,"10":a}</code>. والأرقام تُبقي الخانات التي كتبتها، فلا
        يفقد معرّفٌ من عشرين رقماً آخر ثلاث خانات لعدد عائم مضاعف ولا يصير
        <code>1e999</code> هو <code>null</code>. والمفاتيح المكرّرة يُبقى عليها
        كلها، لأن المعيار لا يقول أيّها يفوز وإسقاطُ واحد اختيارٌ نيابةً
        عنك."""

[[faq]]
q = "ما اللغات التي يستطيع تنسيقها؟"
a = """
        JSON وXML وHTML وCSS وYAML. وJSON وXML وHTML وCSS يمكن عصرها مسطَّحة
        كذلك؛ أما YAML فلا، لأن صيغتها القصيرة هي أسلوب التدفّق، وهو غير مقروء،
        وغيرُ المقروء نقيضُ سبب الإبقاء على ملف بصيغة YAML. وJavaScript ليست في
        القائمة عن قصد &mdash; انظر السؤال عنها أدناه."""

[[faq]]
q = "لماذا لا ينسّق JavaScript أو Python أو SQL؟"
a = """
        لأن تبسيط لغة برمجة يعني تحليلها كما ينبغي، والمنسِّقُ الذي يصيب على
        وشك أسوأ من لا منسِّق: فهو ينتج شيفرة تبدو سليمة وتفعل شيئاً آخر. وJSON
        وXML وCSS وYAML قواعدها من الصغر بحيث تُقرأ يدوياً وتُفحَص باختبارات
        تستطيع تشغيلها. أما منسِّق JavaScript فهو Prettier، وهو ميغابايت من
        المحلِّل، وهو ينتمي إلى محرِّرك لا إلى صفحة ويب."""

[[faq]]
q = "ماذا تفعل المقارنة فعلاً؟"
a = """
        تجد أقصر مجموعة تعديلات تحوّل النصّ الأيسر إلى الأيمن، بخوارزمية Myers
        &mdash; التي يستعملها <code>git diff</code>. والأقصرُ هو ما يجعل الفرق
        مقروءاً: فالسطر المُدرَج في الوسط ينبغي أن يظهر إدراجاً واحداً لا أن
        يظهر كأن كل سطر بعده قد تغيّر. وداخل السطر المتغيّر تُعلَّم الكلمات
        المختلفة كذلك، فمقارنةُ فقرتين تعرض الكلمة التي انتقلت لا فقرتين
        كاملتين."""

[[faq]]
q = "هل يستطيع مقارنة ملفين بدل لصقتين؟"
a = """
        نعم. أفلِتهما كليهما على المُنتقي وتبويبُ المقارنة مفتوح فيحطّ كلٌّ في
        جانب، بالترتيب الذي أفلتّهما به. ويقرؤهما متصفحك إلى هذه الصفحة، وهي
        المكان الوحيد الذي يذهبان إليه. وبدِّل الجانبين إن أفلتّهما مقلوبَين."""

[[faq]]
q = "ماذا يخرج من المقارنة، وهل أستطيع تطبيقه؟"
a = """
        التنزيل فرقٌ موحَّد &mdash; صيغة <code>@@ -3,5 +3,5 @@</code> التي
        يقرؤها <code>git apply</code> و<code>patch</code> وكلُّ أداة مراجعة
        شيفرة. و&laquo;انسخ&raquo; يفعل الشيء نفسه إلى حافظتك. أما الذي على
        الشاشة فعرضٌ له: جنباً إلى جنب، أو في عمود واحد، والأجزاءُ غير المتغيّرة
        مطويّة إلى عدد ما لم تطلبها كلها."""

[[faq]]
q = "هل Base64 هنا هو Base64 نفسه الذي في كل مكان؟"
a = """
        نعم &mdash; وهو مفحوص في مقابل متجهات الاختبار في RFC 4648 لا في مقابل
        نفسه. والأبجديتان كلتاهما تُفكّ، فرمزُ JWT المكتوب بـ <code>-</code> و
        <code>_</code> يُقرأ بيسر قراءةِ واحد مكتوب بـ <code>+</code> و
        <code>/</code>، والدخلُ الملفوف عند 64 محرفاً يُفَكّ لفّه عنك. والترميز
        ببايتات UTF-8، فينجو الحرف المشكول أو الرمز التعبيري من الرحلة ذهاباً
        وإياباً."""

[[faq]]
q = "ملف YAML عندي يقول no فخرج JSON سلسلةً نصّية. لماذا؟"
a = """
        لأنها سلسلة نصّية، ولأن هذا يقرأ YAML 1.2 لا 1.1. ففي YAML 1.1 كانت
        <code>yes</code> و<code>no</code> و<code>on</code> و<code>off</code>
        قيماً منطقية، وتلك هي العلّة الشهيرة التي تحوّل رمز دولة النرويج إلى
        <code>false</code>. وقد أسقطت YAML 1.2 ذلك وكذلك هذا: فلا يُقرأ شيئاً
        غير نصّ إلا <code>true</code> و<code>false</code> و<code>null</code> و
        <code>~</code>. وفي الاتجاه الآخر تُكتَب تلك الكلمات <em>بين علامتَي
        اقتباس</em>، مع أن هذا كان سيقرؤها نصّاً دونهما &mdash; لأن ما يفتح
        الملف بعدُ قد لا يفعل. وPyYAML ما زالت تفترض 1.1. والقراءةُ بصرامة
        والكتابةُ بتحفّظ هما التركيبة الوحيدة الصائبة في الحالين."""

[[faq]]
q = "ماذا يُفقَد في تحويل YAML إلى JSON؟"
a = """
        التعليقات، لأن JSON ليس فيها موضع لواحد. أما المراسي والأسماء البديلة
        والوسوم فتُرفَض صراحةً لا تُخمَّن &mdash; فكلٌّ منها يقول شيئاً لا
        تستطيع JSON قوله، والمحوِّلُ الذي يختار تأويلاً في صمت كان سيناولك
        مستنداً ليس ما قاله الملف. والاتجاه الآخر لا يفقد شيئاً: فكلُّ مستند
        JSON مستندُ YAML أصلاً."""

[[faq]]
q = "ماذا يُفقَد في تحويل JSON إلى XML؟"
a = """
        الفرقُ بين كائن فارغ ومصفوفة فارغة وسلسلة فارغة، وكلها تصير عنصراً
        فارغاً، ونوعُ كل قيمة، لأن XML لا أنواع فيها &mdash; ولهذا يترك التحويل
        العكسي كل شيء سلسلةً نصّية بدل أن يقرّر أن <code>8080</code> كان رقماً.
        والمصفوفة تصير عنصراً مكرَّراً، وهي الهيئة الوحيدة التي تُقرأ رجوعاً،
        والمفتاحُ الذي لا يستطيع اسم عنصر حمله تُستبدَل محارفُه العسيرة بدل أن
        يُخرَج مستنداً لن يقرأه أي محلِّل."""

[[faq]]
q = "هل تغيّر إعادةُ المسافة البادئة في HTML منظرَ الصفحة؟"
a = """
        قد تفعل، وهذا صريح في ذلك. فالفراغُ بين عنصرين مضمَّنين مسافةٌ بين
        كلمتين، فتحريكه ليس مجانياً. وشيئان يضبطان ذلك: <code>&lt;pre&gt;</code>
        و<code>&lt;textarea&gt;</code> يُنسَخان كما كانا بالضبط، والعنصرُ الذي
        لا يحمل إلا نصّاً يبقى في سطر واحد. وكلُّ ما عدا ذلك يُبسَط."""

[[faq]]
q = "ما أكبر ملف يستطيع التعامل معه؟"
a = """
        لا حدّ مضبوط هنا، لأنه لا خادم يدفع ثمن واحد. والسقف العملي جهازك أنت:
        فبضعة ميغابايتات من JSON لا بأس بها. والمقارنةُ بين نصّين لا شيء
        بينهما مشترك البتة تتوقف مبكراً وتقول ذلك، بدل أن تنفق دقيقة في إثبات
        ما كان بيّناً أصلاً، والمقارنةُ الطويلة جداً ترسم أول بضعة آلاف من
        الصفوف وتترك الباقي للرقعة المنزَّلة."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لكم تلصق.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        نصّك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل نصّك بعيداً ليُنسَّق
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

