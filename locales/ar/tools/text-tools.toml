# النصّ والشيفرة - Arabic.
#
# Overrides for tools/text-tools/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# Nothing inside <code> is translated, and that is load-bearing on this page
# rather than a convention: {"10":a,"2":b}, 1e999, yes/no/on/off, ~, @@ -3,5
# +3,5 @@, git apply, JSON.parse, PyYAML, RFC 4648. Every one of them is the
# literal thing being discussed, and an Arabic rendering would demonstrate a
# different bug or none at all.
#
# Language names stay Latin - JSON, XML, HTML, CSS, YAML, Base64, JavaScript,
# Python, SQL, Prettier - as do Myers' and the algorithm's name.
#
# The Norway bug is kept whole. "no" becoming false is the reason YAML 1.2
# exists in this page, and it only reads as an argument if the word is the
# English one.
#

