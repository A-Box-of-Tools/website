[[privacy]]
title = "تسجيلاتك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس صوتك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فاكُّ الترميز هو الذي في متصفحك أصلاً."
body = """

      يُناوَل الملف إلى <code>decodeAudioData</code>، وهي الشيفرة نفسها التي
      تشغّل مقطوعة في عنصر <code>&lt;audio&gt;</code>. فلا شيء يُشحَن هنا لقراءة
      صيغتك، ولا شيء يُطلَب من خارج هذه الصفحة لقراءتها كذلك."""

[[privacy]]
title = "صورة الفيديو لا يُفكّ ترميزها البتة."
body = """
 حين تُفلِت فيديو،
      لا يُطلَب إلا مسارُه الصوتي. أما الإطارات فلا تُقرأ ولا يُفكّ ترميزها ولا
      تُرسَم ولا يُنظَر إليها &mdash; فليس في هذه الصفحة شيفرة تستطيع ذلك،
      والملف الذي يخرج يحمل صوتاً ولا شيء غيره."""

[[privacy]]
title = "العيّنات تُكتَب، ولا يُعاد ترميزها."
body = """

      ملف WAV هو العيّنات التي حسبتها هذه الصفحة وأمامها ترويسة. فلا مرمِّز في
      الحلقة يتخذ قرارات بشأن تسجيلك، ولا شيء يمكن وصفه بالرفع كي يحدث
      واحد."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن تسجيلك: لا ملفاً،
      ولا عيّنةً، ولا اسماً، ولا حجماً، ولا مدةً، ولا كم كان عالياً. وكل سطر
      يقرأ ويحرّر ويكتب يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن ملفك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر ملفاً."
body = """
 أفلِت ملف MP3 أو WAV أو FLAC أو M4A أو
      Ogg أو Opus على المُنتقي &mdash; أو فيديو، إن كان مرادك الصوت الذي فيه.
      يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اقلبه، إن كان ذلك ما جئت من أجله."
body = """
 مربع اختيار
      واحد. تُكتَب العيّنات آخرها أولاً، وذلك عكسٌ تامّ: افعله مرتين فيكون عندك
      الملف الذي بدأت به، عيّنةً بعيّنة."""

[[howto]]
title = "اضبط السرعة."
body = """
 اسحب المِزلاج، أو اكتب مضاعفاً، أو اضغط
      أحد الإعدادات الجاهزة. ثم اختر ماذا يحدث لطبقة الصوت: أبقِها حيث هي، وهو
      ما تريده لمحاضرة عند 1.5&times;، أو دعها تتحرّك مع السرعة، وهو ما يفعله
      الشريط وما يجعل الصوت يعلو أو يهبط."""

[[howto]]
title = "اضبط المستوى."
body = """
 إما أن تُسمّي تغييراً بالديسيبل، وإما
      أن تطلب رفع التسجيل حتى تحطّ أعلى لحظة فيه تحت السقف بقليل. وتقول الصفحة
      أين ستحطّ تلك اللحظة قبل أن تضغط شيئاً، وتحذّرك إن كان الإعداد الذي
      اخترته سيدفعها فوق النطاق الكامل."""

[[howto]]
title = "احفظه."
body = """
 يجري العمل على عتادك أنت، فمدّته تتوقّف على
      جهازك لا على طابور. والذي يخرج ملف WAV &mdash; العيّنات نفسها، وأمامها
      ترويسة &mdash; يُشغَّل على الصفحة أولاً، ثم يُناوَل لتنزيلات متصفحك
      مباشرة."""

[[faq]]
q = "هل يُرفع صوتي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويحرّره ويكتبه على جهازك أنت. ولا جانب خادمَ لهذه
        الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل
        عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع اتصالك
        بالإنترنت واعكس مقطوعة رغم ذلك إن كنت تفضّل التحقّق على أن يُقال لك."""

[[faq]]
q = "هل أستطيع إخراج الصوت من فيديو؟"
a = """
        نعم، وهو العمل نفسه هنا الذي هو فتحُ ملف MP3. أفلِت ملف MP4 أو MOV أو
        WebM فلا يُفكّ ترميز إلا مساره الصوتي: فالصورة لا تُقرأ قط، والذي يخرج
        ملفُّ صوت لا فيديو فيه. وهو أيضاً كيف تحفظ صوت مقطع دون أن تحرّره
        البتة &mdash; اترك كل إعداد على حاله واضغط الزر."""

[[faq]]
q = "هل يغيّر تغييرُ السرعة طبقةَ الصوت؟"
a = """
        فقط إن طلبت ذلك. فـ &laquo;أبقِ طبقة الصوت&raquo; يقطّع التسجيل إلى
        نوافذ متداخلة طولها نحو خمسين جزءاً من الألف من الثانية ويعيد رصفها
        أقرب بعضها من بعض أو أبعد، مختاراً موضع كل واحدة بحيث تتحاذى الموجات عند
        تقاطعها &mdash; فيبقى الصوت الصوتَ نفسه عند 1.5&times;. أما &laquo;دعها
        تتحرّك&raquo; فيعيد أخذ العيّنات بدلاً من ذلك، وهو ما يفعله تشغيل شريط
        أسرع: فضِعف السرعة أوكتاف واحد إلى أعلى بالضبط."""

[[faq]]
q = "لماذا يحفظ ملف WAV لا MP3؟"
a = """
        لأن أي متصفح لا يأتي بمرمِّز MP3، وهذه الأداة ترفض إرسال تسجيلك إلى
        خادم عنده واحد. وملف WAV لا يحتاج إلى مرمِّز البتة &mdash; هو العيّنات
        وأمامها ترويسة من أربعة وأربعين بايتاً &mdash; فهو الخيار الصادق
        والوحيد الذي لا يمكن أن يكلّف جودة. وهو أكبر: نحو عشرة ميغابايتات في
        الدقيقة بالستيريو. وكل مشغّل وهاتف ومحرِّر يفتح واحداً، وما أراد MP3
        يستطيع صنع واحد منه."""

[[faq]]
q = "ما الصيغ التي أستطيع فتحها؟"
a = """
        ما يفكّ متصفحك ترميزه، وهو عملياً MP3 وWAV وFLAC وM4A وAAC، وOgg Vorbis
        وOpus، والصوت الذي داخل فيديو MP4 وM4V وMOV وWebM. والذي يُترَك خارجاً
        هو القائمة القصيرة نفسها التي في كل مكان: AVI وWMA ومعظم ملفات MKV.
        والملف الذي لن يقرأه هذا المتصفح يُرفَض برسالة تقول ذلك، بدل أن يفشل
        في منتصف الطريق."""

[[faq]]
q = "هل سيشوّهه رفعُ الصوت؟"
a = """
        فقط إن تجاوزت به النطاق الكامل، والصفحة تخبرك قبل أن تفعل. فللصوت
        الرقمي سقفٌ صلب: لا يمكن أن تكون العيّنة أعلى من النطاق الكامل، فكل ما
        فوقه يُسطَّح على السقف، وذلك هو ما يبدو تشويهاً. و&laquo;أعلى ما
        يمكن&raquo; هو الإعداد الذي لا يستطيع فعل ذلك &mdash; إذ يحسب كم بقي
        للتسجيل من مساحة ويستعمل ذلك القدر بالضبط. وكل ما دون السقف ضربٌ ولا
        شيء غيره: ارفعه 6 dB ثم أنزله 6 dB فتعود العيّنات حيث بدأت."""

[[faq]]
q = "هل يُفقد العكسُ أو إعادةُ التوقيت شيئاً من الجودة؟"
a = """
        العكس لا يفعل: فالعيّنات نفسها تخرج بالترتيب الآخر، وذلك دقيق. أما
        تغيير السرعة فيحرّك كل عيّنة، فهو حسابٌ لا نسخ &mdash; ومُعيد أخذ
        العيّنات يرشّح كما ينبغي في الطريق، فالتسريع لا يطوي النغمات العالية
        راجعةً إلى أسفل رنيناً معدنياً، ونوافذ المُطيل موضوعة حيث تتحاذى
        الموجات لا حيث حطّ الحساب. ولا يعيد أيٌّ من المسارين ترميز شيء، لأنه لا
        مرمِّز هنا يعيد الترميز به."""

[[faq]]
q = "هل ثمّة حدّ لمدة الملف؟"
a = """
        لا حدّ مبنيّاً في الأداة. والسقف العملي الذاكرة: فالتسجيل كله يُفكّ
        ترميزه إلى هذه الصفحة دفعة واحدة، ويُجمَّع ملف WAV في الذاكرة قبل أن
        تنزّله، فساعةٌ بالستيريو تحتاج إلى ما دون غيغابايت للعمل فيه. وملف WAV
        بأربعة غيغابايتات يُرفَض صراحةً، لأن حقل الحجم في الصيغة نفسها لا
        يستطيع وصف واحد."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        تسجيلك."""

