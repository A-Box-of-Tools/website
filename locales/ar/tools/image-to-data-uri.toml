[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والترميز هو
      <code>btoa</code> و<code>encodeURIComponent</code> &mdash; دالّتان
      يملكهما المتصفح منذ البداية، وكلتاهما تأخذ بايتات وتعيد نصّاً دون أن تذهب
      إلى أي مكان."""

[[privacy]]
title = "المعاينة هي البرهان."
body = """
 الصورة التي بجانب كل نتيجة
      مرسومة من الـ Data URI التي بنتها هذه الصفحة للتوّ، لا من ملفك. وهي تظهر
      لأن الـ URI صحيحة، على جهازك، دون أي خادم في الأمر &mdash; وإن لم تظهر
      قالت الصفحة ذلك بدل أن تناولك شيئاً معطوباً."""

[[privacy]]
title = "التحذير من البيانات الوصفية في صفّك."
body = """
 الـ Data URI تنسخ
      الملف بالضبط، فيسافر مع الصورة تحديدُ GPS الذي فيها إلى ورقة أنماطك. وهذه
      الصفحة تقرأ كم من ذلك موجود وتقوله لك، لأن البديل أن تعرفه بعد أن يكون قد
      أُودِع في المستودع."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن صورك. وكل سطر يقرأ ملفاً أو يرمّزه يُخدَم من هذا الأصل نفسه
      ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِتها على المُنتقي أو اخترها يدوياً.
      يقرؤها المتصفح من قرصك مباشرة، ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "قل إلى أين ستذهب النتيجة."
body = """
 الـ URI وحدها، أو قاعدة
      CSS، أو خاصية مخصّصة، أو وسم <code>&lt;img&gt;</code>، أو Markdown. وكل
      واحدة منها تضع الـ URI بين علامتَي اقتباس، وهي التفصيلة التي يسهل الخطأ
      فيها والتي لا تفشل إلا مع ملفات SVG."""

[[howto]]
title = "انظر ماذا كلّف ذلك."
body = """
 تقول كل نتيجة كم حرفاً صارت،
      وكم هي أكبر من الملف، وهل تضمين شيء بهذا الحجم فكرة صائبة. فـ base64
      يضيف الثلث؛ وهل يستحق ذلك الثلثُ طلباً موفَّراً يتوقف كلياً على الحجم،
      فتقول لك الصفحة على أي جانب من الخط أنت."""

[[howto]]
title = "انظر في التحذيرات."
body = """
 إن كانت الصورة تحمل EXIF أو
      ملفَّ ألوان أو XMP، سُمّي ذلك ومعه كم بايتاً من نتيجتك هو. وإن خالف
      الامتداد الصيغةَ الحقيقية، أخذت الصفحة بالصيغة وأخبرتك. وإن عجز متصفحك عن
      رسم النتيجة، قالت ذلك أيضاً."""

[[howto]]
title = "انسخ، أو نزِّل."
body = """
 زرٌّ لكل نتيجة، وزرٌّ لها جميعاً
      دفعة واحدة &mdash; وتخرج الخصائص المخصّصة ملفوفة في كتلة
      <code>:root</code>، جاهزة للّصق في رأس ورقة الأنماط."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويرمّزه على جهازك أنت، بدالّتين يملكهما
        المتصفح أصلاً. لا تملك هذه الأداة أي وظيفة شبكية على الإطلاق &mdash;
        فهي لا تجلب شيئاً ولا ترسل شيئاً &mdash;
        و<code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل عنوان
        يجوز لها الاتصال به، وليس واحد منها لنا."""

[[faq]]
q = "ما الـ Data URI؟"
a = """
        طريقة في كتابة ملف كامل في الموضع الذي يوضع فيه عنوان الويب عادةً. فبدل
        <code>url("logo.png")</code>، التي تقول للمتصفح اذهب وأحضِر شيئاً،
        تكتب <code>url("data:image/png;base64,iVBORw0...")</code>، وهي تحوي
        الصورة نفسها. فيفكّ المتصفح ترميزها في مكانها. والأثر العملي طلبٌ أقل:
        تصل الصورة مع ورقة الأنماط أو الصفحة بدل أن تصل بعدها."""

[[faq]]
q = "لماذا لم يُرمَّز ملف SVG بـ base64؟"
a = """
        لأن base64 هو الترميز الخطأ له. فملف SVG نصّ، والعنوان يستطيع حمل النصّ
        أصلاً &mdash; ولا يحتاج إلى الهروب إلا حفنة من المحارف. وترميزُ تلك
        بالنسبة المئوية وتركُ ما عداها ينتج URI أقصر بنحو الخُمس من base64
        للملف نفسه، وتظل تستطيع قراءتها في ورقة أنماطك: أسماء العناصر والألوان
        و<code>viewBox</code> كلها باقية للتعديل. وثمّة مربع اختيار لفرض
        base64 لسلسلة الأدوات النادرة التي تصرّ عليه."""

[[faq]]
q = "كم يكبّر base64 صورتي؟"
a = """
        الثلث تقريباً. ثلاث بايتات من الملف تصير أربعة محارف من base64، أي 33%
        قبل <code>data:image/png;base64,</code> التي في المقدمة. وهذا هو الحدّ
        الأدنى، ولا مفرّ منه: فهو ثمن كتابة بايتات كيفما كانت بالمحارف التي
        يسمح بها العنوان لا غير. وهو أيضاً سبب عرض الصفحة عددَ المحارف بجانب
        حجم الملف بدل أن تتركك تكتشفه حين تُنشَر ورقة الأنماط."""

[[faq]]
q = "متى يكون تضمين صورة فكرة صائبة فعلاً؟"
a = """
        حين تكون صغيرة والحاجة إليها فورية. فأيقونة بحجم 2 KB في ورقة أنماط
        تحمّلها كل صفحة مكسبٌ بيّن: رحلة ذهاب وإياب أقل، والصورة حاضرة لحظةَ
        حضور الـ CSS. وبعد نحو 10 KB ينقلب الميزان. فالصورة المضمَّنة لم تعد
        ملفاً منفصلاً، فلا يمكن تخبئتها وحدها، ولا جلبها بالتوازي مع غيرها،
        وتُنزَّل كاملة من جديد كلما تغيّر الملف الذي حولها &mdash; وصورة
        فوتوغرافية بحجم 200 KB في ورقة أنماط هي 200 KB مضافة إلى المسار الحرج
        لكل صفحة في الموقع. وتقول لك الصفحة على أي جانب من ذلك الخط تقع كل
        نتيجة."""

[[faq]]
q = "هل يُلغي gzip زيادةَ base64؟"
a = """
        أقلّ مما يتوقّع الناس. فـ base64 لملف مضغوط أصلاً &mdash; وهو حال PNG
        وJPEG وWebP جميعاً &mdash; ينضغط ضغطاً رديئاً، لأنه لم يبقَ فيه من
        التكرار ما يجده الضاغط؛ فتستعيد عادةً شيئاً كعُشر الثلث الذي أضافه
        base64، لا الثلث كله. أما ملف SVG المرمَّز بالنسبة المئوية فالحال فيه
        عكس ذلك: هو نصّ بعد، فينضغط كما كان ينضغط تقريباً، وهذا سبب آخر لألا
        ترمّزه بـ base64."""

[[faq]]
q = "هل يغيّر هذا صورتي أصلاً؟"
a = """
        لا، وهذا فرق مقصود عن معظم الأدوات هنا. فلا شيء يُفكّ ترميزه إلى بكسلات
        ويُعاد ترميزه: البايتات التي خرجت من قرصك هي البايتات التي تدخل في الـ
        URI. فيبقى ملف JPEG هو ملف JPEG نفسه بالضبط، بالجودة نفسها والأبعاد
        نفسها. وهو السبب في أن الناتج يمكن وصفه بأنه الملف نفسه لا نسخة منه."""

[[faq]]
q = "إذن تذهب بيانات EXIF وGPS إلى ورقة الأنماط أيضاً؟"
a = """
        نعم، وهذا هو الجزء الجدير بالتفكير قبل اللصق. فلأن لا شيء يُعاد ترميزه،
        يسافر مع الصورة كلُّ ما كتبته الكاميرا: الموقع، والوقت، والرقم التسلسلي
        للكاميرا. وفي صورة من هاتف قد يكون ذلك 30 KB من الملف، تصير 40 KB من
        base64 على المسار الحرج لصفحتك، وعنوانَ منزل في شيء سيُودَع في مستودع.
        وهذه الصفحة تقرأ كم من البيانات الوصفية في ملف JPEG أو PNG أو WebP
        وتقوله. ولإخراجها أولاً، استخدم
        <a href="../إزالة-بيانات-exif/">عارض EXIF ومُزيله</a>."""

[[faq]]
q = "لماذا استخدم نوعاً غير امتداد ملفي؟"
a = """
        لأن الامتداد قد يكون خطأً والبايتات لا تكون. فملفٌ اسمه
        <code>logo.png</code> وقد صُدِّر في الحقيقة JPEG أمرٌ شائع بما يكفي
        لأن تضطر كل أداة صور إلى التعامل معه، والـ Data URI التي تعلن النوع
        الخطأ لا تظهر ببساطة &mdash; لا بديل ولا رسالة خطأ تستحق القراءة. فيُقرأ
        النوع من أول بايتات الملف، وهي تقول ما هو قولاً قاطعاً في كل صيغة هنا،
        وتخبرك الصفحة حين يختلف الاثنان."""

[[faq]]
q = "المعاينة فارغة. ما الذي حدث؟"
a = """
        على الأرجح لا شيء يخصّ الـ URI. فـ HEIC وTIFF كلتاهما تنتج Data URI
        صحيحة تماماً لا يرسمها متصفح غير Safari، فالصورة غائبة حيثما لصقتها
        كذلك &mdash; حوِّلها إلى PNG أو JPEG أو WebP أولاً بـ
        <a href="../ضغط-الصور/">ضاغط الصور</a> أو
        <a href="../تغيير-حجم-الصورة/">أداة تغيير حجم الصور</a>. وإن كانت
        الصيغة من الصيغ المعتادة، فالأرجح أن الملف نفسه معطوب: فالمعاينة مرسومة
        من الـ URI التي بنتها هذه الصفحة، وفراغها يعني أن الصورة لم يُفكّ
        ترميزها."""

[[faq]]
q = "هل ثمّة حدّ لحجم الـ Data URI؟"
a = """
        ليس حداً ستلقاه في CSS ولا في وسم <code>&lt;img&gt;</code>؛ فالمتصفحات
        الحديثة لا تفرض هناك سقفاً عملياً. أما ما تحدّه المتصفحات فعلاً فهو
        كتابة Data URI في شريط العنوان، وهو ما ترفضه أكثرها الآن لأي شيء غير
        تافه، لأسباب أمنية لا علاقة لها بهذا الاستعمال. والحدّ الحقيقي هو الذي
        سبق: فقبل أن ينكسر شيء تقني بمدة طويلة، تكون الصفحة التي هو فيها قد
        صارت أبطأ مما كانت ستكون بملف صورة عادي."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لعدد الملفات ولا لأحجامها كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً لتُرمَّز
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

