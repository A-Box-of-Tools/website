#
# الصورة إلى Data URI - Arabic.
#
# Overrides for tools/image-to-data-uri/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "Data URI" is kept in Latin letters and not translated. It is a term of art
# that appears verbatim in every stylesheet, specification and error message an
# Arabic-speaking developer will meet, and an invented Arabic equivalent would
# be a word nobody searches for - the same reasoning locale.toml gives for PDF
# and EXIF. The prose around it is Arabic; the term is not.
#

