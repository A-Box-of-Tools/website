[[privacy]]
title = "ما تلصقه ليس له مكان يذهب إليه."
body = """
 تسمّي
      Content-Security-Policy كلّ عنوان يجوز لهذه الصفحة الاتصال به، وليس منها
      واحد لنا. لا توجد هنا نقطة نهاية يمكن أن تُجمَع عندها فاتورةٌ ملصوقة، ولا في
      الشيفرة ما يرسلها إليها لو وُجدت."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في <code>src/</code> كلّه
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code>. المحلّل والطابع دالّتان في هذه الصفحة تأخذان سلسلة
      نصية وتعيدان سلسلة نصية."""

[[privacy]]
title = "لا تُحلَّل الكيانات الخارجية أبداً."
body = """
 إنّ
      <code>DOCTYPE</code> يحوي كياناً خارجياً هو الطريقة التي يُستدرَج بها محلّل
      XML إلى قراءة ملف من الجهاز الذي يحلّل، وهي أقدم ثغرات الصيغة.
      و<code>src/shared/parse-xml.js</code> قارئ مكتوب باليد لا يتضمّن أي تحليل للكيانات على
      الإطلاق &mdash; لا معطَّلاً بل غائباً &mdash; وهذه الصفحة لا تسلّم نصّك
      أبداً إلى <code>DOMParser</code> الخاص بالمتصفّح."""

[[privacy]]
title = "كلّ قيمة تخرج من XML نصّ."
body = """
 <code>&lt;port&gt;8080&lt;/port&gt;</code>
      لا يقول شيئاً عمّا إذا كان ذلك عدداً، فيقول JSON <code>"8080"</code>.
      والبتّ في ذلك نيابةً عنك اختلاقٌ لمعلومة تسافر بعدها كأنها كانت في
      الملف."""

[[privacy]]
title = "ما تحمّله Google، وما لا يُعطى لها."
body = """
 تأتي نصوص الإعلانات
      والقياس من Google، وزرّ التبرّع من Buy Me a Coffee. ولا يُسلَّم أيٌّ منها
      حرفاً من نصّك. وكلّ سطر يقرؤه أو يحلّله أو يكتبه يُقدَّم من هذا الأصل ومُدرَج
      في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 افصل الشبكة وتبقى الأداة كما هي، لأنه لم
      تكن فيها خطوة شبكية أصلاً. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر المهمة."
body = """
 لسانان وصندوق واحد: <em>تنسيق</em> ينشر
      XML أو يضغطه، و<em>تحويل</em> يجعله JSON، أو يعيد JSON إلى XML. وملف XML
      الذي نشرته للتوّ هو نفسه الذي تحوّله، دون لصقه مرّتين."""

[[howto]]
title = "الصقه، أو أفلِت الملف."
body = """
 كلّ ما يمكنك تحديده ونسخه يصلح،
      وملف <code>.xml</code> أو <code>.svg</code> أو <code>.rss</code> أو
      <code>.xsd</code> تُفلته على المُنتقي يقرؤه متصفّحك أنت ويضعه في الصندوق
      &mdash; ولا توجد خطوة رفع حتى تُترَك."""

[[howto]]
title = "اختر الإزاحة، أو اضغطه."
body = """
 مسافتان أو أربع أو مسافة
      جدولة. والضغط يعطي المستند نفسه دون أي مسافة كانت موجودة للقراءة فحسب،
      وتقول النتيجة كم بايتاً وفّر ذلك."""

[[howto]]
title = "اقرأ الخطأ حيث هو."
body = """
 المحلّل الذي يفشل هنا يقول
      <em>أيّ وسم</em> لم يُغلَق قط، وفي أي سطر وأي عمود، بدل &laquo;خطأ في السطر
      1&raquo;، وهو ما يقوله المتصفّح عن مستند قرأه دفعةً واحدة."""

[[howto]]
title = "خذ النتيجة."
body = """
 انسخها، أو نزّلها ملفاً باسم الصيغة التي خرجت
      بها."""

[[faq]]
q = "هل يُرفع ملف XML الخاص بي إلى أي مكان؟"
a = """
        لا. المحلّل والطابع في هذه الصفحة دالّتان تعملان في متصفّحك أنت، على عتادك
        أنت. ولهذه الأداة لا وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً أبداً
        ولا ترسل شيئاً أبداً &mdash; وتسمّي <code>Content-Security-Policy</code>
        الخاصة بالصفحة كلّ عنوان يجوز لها الاتصال به، وليس منها واحد لنا. وهذا
        يزن في XML أكثر مما توحي به سمعة الصيغة: فالذي يصل فيها هو في الغالب
        فاتورة، أو كشف حساب مصرفي، أو سجلّ صحي، أو طلب SOAP تحمل ترويسته بيانات
        اعتماد."""

[[faq]]
q = "هل يحلّل الكيانات الخارجية؟"
a = """
        لا، ولا شيء لتعطيله. تحليل الكيانات الخارجية هو الطريقة التي يُستدرَج بها
        محلّل XML إلى قراءة ملفات من الجهاز الذي يشغّله &mdash; الهجوم الذي يُكتَب
        عادةً XXE &mdash; و<code>src/shared/parse-xml.js</code> قارئ مكتوب باليد بلا أي تحليل
        للكيانات. ولا يُسلَّم نصّك كذلك إلى <code>DOMParser</code> الخاص بالمتصفّح
        أبداً. ويُمرَّر <code>DOCTYPE</code> دون أن يُنفَّذ قط."""

[[faq]]
q = "ماذا يُفقَد عند تحويل XML إلى JSON؟"
a = """
        ترتيب المحتوى المختلط، والتعليقات، والفرق بين السمة والعنصر الابن &mdash;
        وهذا الأخير يُخفَّف لا يُمحى، لأن السمة تصير عضواً يبدأ اسمه بـ
        <code>@</code>. ونصّ العنصر نفسه يصير <code>#text</code> متى اضطرّ إلى
        مشاركة موضعه، والأبناء المتكرّرون يصيرون مصفوفة. وتبقى كلّ قيمة نصاً: فلا
        أنواع في XML، والبتّ بأن <code>8080</code> كان عدداً اختلاقٌ لمعلومة."""

[[faq]]
q = "ماذا يُفقَد عند تحويل JSON إلى XML؟"
a = """
        الفرق بين الكائن الفارغ والمصفوفة الفارغة والنصّ الفارغ، وثلاثتها تصير
        عنصراً فارغاً، ونوع كلّ قيمة، لأن XML بلا أنواع. وتصير المصفوفة عنصراً
        مكرَّراً، وهو الشكل الوحيد الذي يُقرأ رجوعاً، والمفتاح الذي لا يحتمله اسم
        عنصر تُستبدَل حروفه العسيرة بدل إخراج مستند لن يقرأه أي محلّل."""

[[faq]]
q = "هل يستطيع تنسيق ملف SVG أو تغذية RSS أو ملف POM؟"
a = """
        نعم. ثلاثتها XML، وهذا يقرأ XML لا لهجةً بعينها منه. وملف SVG منشور هكذا
        أسهل في التحرير باليد؛ وتغذية RSS أو Atom تُرسَل عادةً مضغوطة ولا تُقرأ
        حتى يفتحها شيء. ولا يغيّر الترتيب شيئاً مما يعنيه المستند."""

[[faq]]
q = "هل تغيير الإزاحة يغيّر معنى XML؟"
a = """
        في مستند تحتوي عناصره عناصر أخرى، لا. أما حيث يمكن أن يهمّ فهو النصّ:
        فالمسافات داخل عنصر يحمل كلمات جزءٌ من ذلك النصّ، ولذلك يُترَك العنصر الذي
        لا يحمل سوى نصّ في سطر واحد بدل أن يُنشَر. وتُنسَخ أقسام
        <code>CDATA</code> تماماً كما كانت."""

[[faq]]
q = "لماذا لا يُستخدَم محلّل XML الخاص بالمتصفّح؟"
a = """
        بسبب ما يقوله حين يكون المستند معطوباً. فـ<code>DOMParser</code> يعيد
        مستند خطأ تختلف صياغته في كلّ متصفّح وكثيراً ما تنتهي إلى &laquo;خطأ في
        السطر 1&raquo;. أما القارئ المكتوب باليد فيستطيع أن يقول أيّ وسم لم
        يُغلَق قط، وأين فُتح، وهو ما كنت تحتاج فعلاً إلى معرفته. وعدم تحليل
        الكيانات الخارجية هو السبب الآخر."""

[[faq]]
q = "ما حجم الملف الذي يستطيع التعامل معه؟"
a = """
        لا حدّ موضوع هنا، لأنه لا خادوم يدفع ثمنه. السقف العملي هو جهازك أنت: بضعة
        ميغابايتات من XML تمرّ على ما يرام، ومع مستند طويل جداً تنتظر الصفحة توقّفاً
        في كتابتك قبل أن تعيد التنسيق، بدل أن تنازعك لوحة المفاتيح."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لما تلصقه. يحمل
        الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا تُعطى تلك الإعلانات شيئاً عن
        نصّك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمّل الصفحة مرة واحدة، ثم افصل الإنترنت وستظلّ تعمل. وهذه أيضاً أبسط
        طريقة لإثبات أن شيئاً لا يُرفَع: فأداة ترسل XML بعيداً لتنسيقه كانت
        ستتوقّف في اللحظة التي تفصل فيها."""

