[[privacy]]
title = "مقاطعك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس فيديوك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فكّ الترميز وإعادته محليّان."
body = """
 تمرّ الإطارات عبر
      WebCodecs في متصفحك أنت، أو عبر محرّك التشغيل نفسه الذي كان سيعرض عليك
      المقطع على أي حال. ويُبنى الملف المنتهي في الذاكرة على هذا الجهاز
      ويُناوَل للتنزيل مباشرة."""

[[privacy]]
title = "وأكثر الملف لا يُقرأ أصلاً."
body = """
 التايم لابس يحتاج إلى إطار
      كل بضع ثوانٍ، فتقرأ الأداة المجرى القصير من الملف حول كل واحدة منها
      وتتخطّى ما عداه. وذلك قرارُ سرعة لا قرارُ خصوصية، وهو جدير بالمعرفة على
      أي حال: فحتى محلياً، أكثرُ فيديوك لا يُفتَح أبداً."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن فيديوك: لا ملفاً،
      ولا إطاراً، ولا اسماً، ولا حجماً، ولا مدةً. وكل سطر يقرأ أو يفكّ ترميزاً
      أو يأخذ عيّنات أو يرمّز يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن فيديوك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر فيديو."
body = """
 أفلِت ملف MP4 أو MOV أو M4V أو WebM على
      المُنتقي، أو اختر واحداً يدوياً. يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل
      شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "قل كم أسرع."
body = """
 اضغط إحدى السرعات، أو اكتب سرعتك أنت.
      وإن كنت تفضّل أن تقول كم ينبغي أن تكون مدة الناتج &mdash; &laquo;اجعل
      هذا يتّسع في عشرين ثانية&raquo; &mdash; فاكتب ذلك بدلاً منها وتتبعُه
      السرعة."""

[[howto]]
title = "تحقّق من الفاصل."
body = """
 السطر الذي تحت السرعة يقول ما
      الأداة على وشك فعله حقاً: إطارٌ كل كذا ثانية من الأصل. وذلك هو الرقم الذي
      كان مصوّر فوتوغرافي سيضبطه على كاميرا، وهو الجدير بالتحقّق من معقوليته
      قبل أن تبدأ."""

[[howto]]
title = "اصنعه ونزِّله."
body = """
 يجري العمل على عتادك أنت، فمدّته
      تتوقّف على جهازك لا على طابور. ويُناوَل الفيديو المنتهي لتنزيلات متصفحك
      مباشرة."""

[[faq]]
q = "هل يُرفع فيديوي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويفكّ ترميزه ويأخذ عيّناته ويرمّزه على جهازك أنت.
        ولا جانب خادمَ لهذه الأداة، و<code>Content-Security-Policy</code>
        الخاصة بالصفحة تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد
        منها لنا. اقطع اتصالك بالإنترنت واصنع تايم لابس رغم ذلك إن كنت تفضّل
        التحقّق على أن يُقال لك."""

[[faq]]
q = "ماذا تعني السرعة فعلاً؟"
a = """
        النسبة بين ما دخل وما يخرج. فعند 60&times; تصير ساعةٌ من التصوير دقيقةً،
        بأي معدّل إطارات شغّلتها. وتحت ذلك، تأخذ الأداة إطاراً كل <em>السرعة
        &divide; معدّل الإطارات</em> ثانية &mdash; فـ 60&times; عند 30 إطاراً
        في الثانية إطارٌ كل ثانيتين &mdash; وتعرض الصفحة ذلك الفاصل قبل أن
        تبدأ، لأنه الرقم الذي يقول ما يحدث حقاً."""

[[faq]]
q = "ما صيغ الفيديو التي أستطيع تسريعها؟"
a = """
        MP4 وM4V وMOV تُقرأ مباشرة، مهما كان بداخلها: H.264 أو HEVC أو AV1 أو
        VP9، ما دام متصفحك يستطيع فكّ ترميز ذلك المرمِّز. وكل ما عداها مما
        يستطيع متصفحك تشغيله &mdash; وWebM أظهرها &mdash; يُقرأ بتخطية مشغّل
        المتصفح نفسه إلى كل لحظة بدلاً من ذلك، وهو يعمل على كل صيغة يشغّلها.
        أما الملف الذي لا يستطيع المتصفح قراءته ولا تشغيله، وهو عملياً AVI
        وWMV وFLV ومعظم ملفات MKV، فيُرفَض برسالة تقول ذلك بدل أن يفشل في منتصف
        الطريق. والذي يخرج دائماً MP4."""

[[faq]]
q = "لماذا لا صوت في التايم لابس؟"
a = """
        لأنه لا شيء يستحق الإبقاء عليه. فالصوت المشغَّل أسرع ثلاثين مرة ليس
        كلاماً ولا موسيقى، بل زقزقة؛ والبديل &mdash; إبقاءُ الصوت بسرعته
        الأصلية تحت صورة سبقته &mdash; كان سيكون مقطعاً آخر غير الذي طلبته.
        فيُسقَط المسار، وهو أيضاً أكثر سبب خروج ساعةٍ من الفيديو ببضعة
        ميغابايتات. وإن أردت الصوت وحده، فـ
        <a href="../تحرير-الصوت/">محرّر الصوت</a> يحفظه."""

[[faq]]
q = "هل هو أسرع من تحويل الفيديو كله؟"
a = """
        أسرع بكثير، وذلك هو مغزى قراءة الملف مباشرة. فالإطار لا يمكن فكّ ترميزه
        إلا بالبدء من الإطار المفتاحي الذي أمامه، لكن ليس ثمّة ما يوجب الإبقاء
        على الإطارات التي بينهما &mdash; فتايم لابس بسرعة 60&times; لساعةٍ يفكّ
        ترميز بضعة آلاف من الإطارات من مئة ألف لا كلَّها. ويقول الملخّص كم
        سيقرأ بالضبط قبل أن تضغط الزر."""

[[faq]]
q = "هل يُفقد شيئاً من الجودة؟"
a = """
        الإطارات التي يُبقيها تُرمَّز مرة ثانية، وذلك يكلّف قليلاً؛ ولا يمكن
        تفاديه، لأن المقطع المنتهي يعرضها في أوقات لم يُرمَّز لها شيء في الملف
        الأصلي. والذي تنفقه هذه الأداة أكثر من أدوات الفيديو الأخرى هنا هو معدّل
        البتّات، عن قصد. فإطاران بينهما ثانيتان أقلّ اشتراكاً بكثير من إطارين
        بينهما جزء من ثلاثين من الثانية، فيجد المرمِّز أقلّ ليعيد استعماله،
        ورقمٌ مضبوط لتصوير عادي كان سيخرج مكعَّباً."""

[[faq]]
q = "هل ثمّة حدّ لحجم الفيديو أو مدّته؟"
a = """
        لا حدّ مبنيّاً في الأداة، ولا يُقرأ الملف إلى الذاكرة دفعة واحدة
        &mdash; بل يُقرأ في مجارٍ قصيرة حول كل لحظة، وتلك وحدها. والسقف العملي
        هو التايم لابس المنتهي، إذ يُجمَّع في الذاكرة قبل أن تنزّله، والتايم
        لابس قصير بحكم تعريفه: ويعرض الملخّص كم سيكون كبيراً تقريباً قبل أن
        تبدأ."""

[[faq]]
q = "هل أستطيع تسريع جزء من مقطع فقط؟"
a = """
        ليس هنا. فهذه الأداة تأخذ الشيء كله من أول إطار إلى آخره. اقطع المقطع
        الذي تريده أولاً بـ <a href="../تقصير-الفيديو/">مقصّ الفيديو</a>
        &mdash; وهو يفعل ذلك دون إعادة ترميز إطار واحد &mdash; ثم سرّع ما يخرج
        منه."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        فيديوك."""

