[[privacy]]
title = "أعمالك الفنية لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والمحوِّل كله
      وسمُ <code>&lt;img&gt;</code> يحمل كائن blob من ملفك أنت، و
      <code>drawImage</code> واحد على لوحة، و<code>canvas.toBlob</code> واحد."""

[[privacy]]
title = "ملف SVG مستند، وهذا هو الوضع الذي لا يستطيع فيه أن يفعل شيئاً."
body = """
 قد يحمل ملف SVG
      وسم <code>&lt;script&gt;</code>، ووسم
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code> بعيداً، وورقة
      أنماط، وخطّ ويب. وحين يُرسَم عبر وسم <code>&lt;img&gt;</code> يكون فيما
      تسمّيه المواصفة <em>الوضع الساكن الآمن</em> (secure static mode): فلا
      يعمل النصّ البرمجي ولا يُجلَب واحد من تلك العناوين. وذلك ضمانٌ من
      المتصفح لا وعدٌ منا، وهو السبب في أن هذه الصفحة تستطيع فتح ملف لم ترَه
      قط دون أن يقدر الملف على الاتصال بأحد."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن رسمك. وكل سطر يقرأ ملفاً أو يحدّد حجمه أو يرسمه يُخدَم من
      هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر ملف SVG."
body = """
 أفلِت واحداً على المُنتقي، أو اختر
      مجلداً منها وحوِّلها كلها دفعة واحدة. يقرأ المتصفح الملف من قرصك مباشرة؛
      ولا يُرسَل شيء إلى أي مكان أثناء ذلك. ويقول كل صف بأي حجم يظن الملف نفسه
      &mdash; ويقوله على نحو مختلف حين يكون ذلك الحجم آتياً من
      <code>viewBox</code>، أو مفترَضاً لأن الملف لا يعلن حجماً أصلاً."""

[[howto]]
title = "قل كم يكون كبيراً."
body = """
 مضاعفٌ لحجم الملف نفسه أسرع
      جواب وأصوبه لدفعة: فكل رسم يُقاس من نقطة بدايته هو، فتبقى مجموعة أيقونات
      متناسبة. وإلا فحدّد عرضاً، أو ارتفاعاً، أو أطول ضلع، أو إطاراً بضلعيه
      معاً. ولا عقوبة على رقم كبير هنا كما هي مع صورة فوتوغرافية &mdash; فالرسم
      يُعاد رسمه بذلك الحجم، لا يُمَطّ إليه."""

[[howto]]
title = "أضِف نُسَخ الكثافة العالية إن احتجت إليها."
body = """
 يرسم الهاتف والحاسوب
      المحمول عالي الدقة بكسلَين أو ثلاثة من بكسلات الجهاز لكل بكسل CSS، فشعار
      بعرض 200 بكسل يحتاج إلى ملف بعرض 400 أو 600 خلفه. اطلب <code>@2x</code>
      و<code>@3x</code> فتخرج مسمّاة كما يتوقّعها Xcode وأدوات Android ودالّة
      <code>image-set()</code> في CSS جميعاً، وكل واحدة ضِعف الأولى أو ثلاثة
      أضعافها بالضبط لا مقرَّبة على حدة."""

[[howto]]
title = "اختر الصيغة واحسم أمر الشفافية."
body = """
 PNG ما لم يكن لديك سبب:
      فهي بلا خسارة، وتحفظ الشفافية، واللون المسطَّح ينضغط فيها جيداً. أما
      JPEG فلا شفافية فيها البتة، فيُطلى لون خلفية شئت أم أبيت &mdash; فبدونه
      يخرج كل بكسل شفاف أسود. وWebP تفعل الأمرين وتنتج ملفاً أصغر، بثمن أن
      البرمجيات القديمة بما يكفي لا تقرؤها."""

[[howto]]
title = "انظر إلى المعاينة قبل أن تنزّل."
body = """
 ترسمها الشيفرة نفسها التي
      تكتب الملف، من ملفك أنت، على جهازك. وشيئان يتغيّران حين يصير الرسم
      بكسلات وكلاهما يظهر هنا: الخط الشعري الذي كان بعرض نصف بكسل يصير رمادياً،
      وأي نصّ يُرسَم بخطّ يملكه هذا الحاسوب لا بخطّ يُجلَب من الويب."""

[[howto]]
title = "خذ الملفات."
body = """
 تنزيلٌ لكل ملف، أو الدفعة كلها في ملف
      zip واحد. وتتبع الأسماء ملفَّ SVG الذي جاءت منه، وعليها <code>@2x</code>
      و<code>@3x</code> في النُّسَخ، وملفان كانا سيحملان الاسم نفسه يُرقَّمان
      بدل أن يحلّ أحدهما محلّ الآخر في صمت."""

[[faq]]
q = "هل يُرفع ملف SVG إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف على جهازك أنت، ويرسمه على لوحة بالمحرّك نفسه
        الذي يعرض كل صورة أخرى تراها، ثم يعيده إليك تنزيلاً. لا تملك هذه
        الأداة أي وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا ترسل
        شيئاً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا."""

[[faq]]
q = "بأي حجم ينبغي أن أحوِّل ملف SVG؟"
a = """
        بأي حجم يطلبه الشيء الذي سيقرؤه، مضروباً في نسبة بكسلات الجهاز للشاشة
        التي سيُرى عليها. فشعارٌ يشغل 200 بكسل CSS يحتاج إلى 400 لحاسوب محمول
        عالي الدقة و600 لهاتف حديث، وهو ما تكون نسختا <code>@2x</code> و
        <code>@3x</code> هنا. أما لأيقونة تطبيق أو لصفحة في متجر، فالمتجر
        يُسمّي رقماً بعينه وهو الرقم. وحين لا يخبرك شيء، فـ 1024 على أطول ضلع
        قيمة افتراضية مفيدة: كبيرة بما يكفي لأي استعمال تقريباً وصغيرة بما
        يكفي لأن تُرسَل بالبريد."""

[[faq]]
q = "هل يُفقد التكبير شيئاً من الجودة؟"
a = """
        لا، وهذا هو الموضع الوحيد الذي يكون فيه هذا الجواب &laquo;لا&raquo;
        بصدق. فالرسم المتجهي تعليمات لا بكسلات، فيرسم المتصفح المنحنيات من جديد
        بأي حجم يُطلَب. و4000 بكسل من أيقونة بحجم 24 بكسلاً حادٌّ تماماً كما
        كان 24. والذي لا تستطيعه هو العكس: فمتى صارت PNG صارت بكسلات كغيرها،
        فحوِّلها بالحجم الذي تحتاجه بدل أن تغيّر حجم الناتج بعد ذلك."""

[[faq]]
q = "ملف SVG عندي بلا عرض ولا ارتفاع. فأي حجم أحصل عليه؟"
a = """
        الـ <code>viewBox</code>، إن وُجد &mdash; فعرضه وارتفاعه وحدات مستخدِم
        لا بكسلات، لكنهما الرقمان الوحيدان في الملف والمتصفح يعاملهما على أنهما
        الحجم الطبيعي للرسم. وإن لم يكن ثمّة viewBox أيضاً، قالت الصفحة
        <em>مفترَض</em> بجانب الصف واستعملت 300&nbsp;&times;&nbsp;150، وهو ما
        كان وسم <code>&lt;img&gt;</code> سيرسمه به. وفي الحالين تستطيع أن
        تُسمّي الحجم الذي تريده فيُرسَم الملف به."""

[[faq]]
q = "لماذا يبدو النصّ مختلفاً في ملف PNG؟"
a = """
        لأن الخطّ ليس داخل ملف SVG. فملف SVG الذي يرسم نصّاً يُسمّي خطّاً
        ويترك للجهاز أن يجده، والملف الذي يجلب واحداً من Google Fonts بـ
        <code>@import</code> لا يحصل على شيء هنا: فملف SVG المرسوم عبر وسم
        <code>&lt;img&gt;</code> لا يُسمح له بجلب أي شيء، وهي القاعدة نفسها
        التي تمنعه من الاتصال بأحد ومعه ملفك. والعلاج هو الذي يعرفه كل مصمّم
        أصلاً &mdash; حوِّل النصّ إلى مسارات في برنامج الرسم قبل التصدير.
        فيصير حينئذ هندسةً، ويبدو كما هو في كل مكان."""

[[faq]]
q = "هل يستطيع تحويل عدة ملفات دفعة واحدة؟"
a = """
        نعم. يُعرَض كل ملف SVG في القائمة بالإعدادات نفسها وتنزل الدفعة في ملف
        zip واحد. والمضاعف &mdash; &laquo;4&times; الحجم الذي يطلبه
        الملف&raquo; &mdash; هو الإعداد الصائب لدفعة عادةً، لأن كل رسم يُقاس من
        حجمه هو بدل أن تُفرَض عليها كلها البكسلات نفسها. وانقر أي صف لتضع ذلك
        الملف في المعاينة."""

[[faq]]
q = "هل ثمّة حدّ للحجم؟"
a = """
        حدُّ المتصفح لا حدُّنا. فاللوحة تستسلم في مكان ما بعد 16,384 بكسلاً على
        الضلع، وSafari على iPhone أو iPad يقف عند نحو 16.7 ميغابكسل من المساحة
        &mdash; أي 4096&nbsp;&times;&nbsp;4096. وفوق ذلك تحذّرك الصفحة بدل أن
        تعيد إليك صورة فارغة، وهو ما يفعله المتصفح حين ينفد ما عنده: تعيد
        <code>toBlob</code> لا شيء البتة، دون خطأ يفسّر نفسه. وبعد 100 ميغابكسل
        ترفض الأداة، لأن ذلك 400&nbsp;MB من اللوحة قبل أن يُرمَّز بايت واحد."""

[[faq]]
q = "ماذا يحدث للشفافية؟"
a = """
        تبقى، في PNG وفي WebP. أما JPEG فليس فيها قناة ألفا البتة، فيُطلى لون
        خلف الصورة كلها سواء طلبته أم لا &mdash; فبدونه يخرج كل شفاف أسود، وهو
        ما يبدو خللاً لا يبدو JPEG. واختيار لون خلفية مع PNG أمر عادي تماماً
        أن تريده كذلك: فهو يُسطِّح الرسم على ذلك اللون بدل أن يترك ثقباً."""

[[faq]]
q = "هل يستطيع قراءة ملف SVG فيه نصّ برمجي أو صورة خارجية؟"
a = """
        يستطيع قراءته، وسيرسم بالضبط الأجزاء التي يقبل المتصفح رسمها. فملف SVG
        المحمَّل عبر وسم <code>&lt;img&gt;</code> في <em>الوضع الساكن
        الآمن</em>: فلا تعمل النصوص البرمجية، ولا تُجلَب المراجع الخارجية، ولا
        تعمل الحركة &mdash; والإطار الأول هو ما تحصل عليه. فملفٌ فيه وسم
        <code>&lt;image&gt;</code> بعيد يخرج وذلك الجزء ناقص منه. وذلك رفضٌ من
        المتصفح نيابةً عنك، وهو سبب قدرة هذه الصفحة على فتح ملف لم ترَه قط
        بأمان."""

[[faq]]
q = "ما الفرق بين هذا وأداة تغيير حجم الصور؟"
a = """
        المصدر. فأداة تغيير حجم الصور تبدأ من بكسلات &mdash; ملف JPEG أو PNG
        &mdash; فتكبيرها لا بدّ أن يخترع تفاصيل لم تكن هناك قط. أما هذه فتبدأ
        من رسم، فلا شيء يُخترَع ولا حدّ أعلى يستحق القلق. فإن كان الذي عندك
        ملف SVG فهذه هي التي تعطيك نتيجة حادّة؛ وإن كان الذي عندك صورة
        فوتوغرافية فتلك هي."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لعدد الملفات ولا لأحجامها كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن ملفاتك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل أعمالك الفنية بعيداً
        لتُعرَض كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

