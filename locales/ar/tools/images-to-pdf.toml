[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. وهذه الأداة لا تضيف شيئاً إلى تلك القائمة: فليست لها وظيفة
      شبكية خاصة بها، ولا حتى اختيارية. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك،
      ولا في الشيفرة ما يرسلها إليه لو وُجد."""

[[privacy]]
title = "ملف PDF يُكتَب هنا."
body = """
 ملف PDF قائمةُ كائنات وجدولٌ بمواضع
      بداية كل واحد، و<code>src/shared/pdf-page-writer.js</code> يكتب الاثنين. ولا مكتبة تُجلَب،
      ولا شيء يُعرَض على خادم، ويُناوَل الملف المنتهي للتنزيل من الذاكرة
      مباشرة."""

[[privacy]]
title = "المستند لا يُخبَر عنك شيئاً."
body = """
 معظم الأدوات تختم ملف PDF
      بوقتٍ وباسم البرنامج الذي صنعه. أما هذه فتكتب عنواناً ومؤلفاً وتاريخاً
      إن كتبتها أنت لا غير؛ ولا تظهر أسماء ملفات صورك في المستند أبداً، ولا
      يظهر شيء عن جهازك."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن صورك: لا ملفاً، ولا
      مصغَّرة، ولا اسماً، ولا حجماً، ولا عدداً. وكل سطر يقرأ صورة أو يفكّ
      ترميزها أو يكتبها يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن صورك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل صورك بعيداً
      لتُصنَع منها مستند كانت ستتوقف."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِت مجلداً على المُنتقي، أو اختر
      الملفات يدوياً. يقرؤها المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان
      أثناء ذلك."""

[[howto]]
title = "رتّب الصفحات، وأدِر ما يحتاج منها."
body = """
 كل صورة تصير
      صفحةً واحدة، بالترتيب المعروض. اسحب مربّعاً من مقبضه لتحريكه، أو استعمل
      الأسهم؛ وأزرارُ الإدارة تدير الصفحة ربع دورة في كل مرة، وهو ما يحتاجه
      المسح الضوئي الذي جاء على جنبه عادةً."""

[[howto]]
title = "اختر مقاس الصفحة."
body = """
 &laquo;لائم الصفحة مع كل
      صورة&raquo; يجعل كل صفحة صورتَها بالضبط، فلا يُقَصّ شيء ولا تظهر أشرطة
      بيضاء. أما المقاسات المسمّاة &mdash; A4 وLetter وLegal وبقيتها &mdash;
      فتضع كل صورة على صفحة ثابتة بدلاً من ذلك، وبهامش إن أردته."""

[[howto]]
title = "أنشئ ملف PDF ونزِّله."
body = """
 يُكتَب المستند على جهازك
      أنت، فمدّته تتوقّف على عتادك لا على طابور. ويُناوَل الملف المنتهي
      لتنزيلات متصفحك مباشرة."""

[[faq]]
q = "هل تُرفع صوري إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت صورك ويكتب ملف PDF على جهازك أنت. ولا جانب خادمَ
        لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. وعلى
        خلاف بعض الأدوات الأخرى هنا، ليست لهذه وظيفة شبكية اختيارية البتة."""

[[faq]]
q = "هل يُفقد التحويل إلى PDF شيئاً من الجودة؟"
a = """
        لا لملف JPEG، على الإعداد الافتراضي. فملف PDF يستطيع حمل بيانات JPEG
        مباشرة، فتُنسَخ الصورة الفوتوغرافية إلى المستند بايتاً بايتاً: فلا يُفكّ
        ترميزها أبداً ولا تُضغَط من جديد، والصورة التي في ملف PDF هي الصورة
        التي في الملف. أما الصيغ الأخرى فلا بدّ من إعادة ترميزها، لأن PDF ليس
        فيه مرشِّح لها &mdash; إلا أن تختار الإعداد بلا خسارة، وهو يخزّنها
        بالضبط بثمن ملف أكبر."""

[[faq]]
q = "ما صيغ الصور التي أستطيع استعمالها؟"
a = """
        أي صورة ساكنة يستطيع متصفحك فكّ ترميزها، وهي عملياً JPG وPNG وWebP
        وGIF وAVIF و&mdash; على أجهزة Apple &mdash; HEIC. ولا قائمة منفصلة
        نحرص على تحديثها هنا، لأن فكّ الترميز عمل المتصفح لا عملنا."""

[[faq]]
q = "هل أستطيع اختيار مقاس الصفحة وترتيب الصفحات؟"
a = """
        نعم. فالصفحات يمكن أن تكون A4 أو Letter أو Legal أو A3 أو A5 أو
        Tabloid، أو مقاساً تكتبه، أو مقاس كل صورة بالضبط. واسحب المربّعات
        لإعادة ترتيبها، ورتّبها بالاسم أو بالتاريخ، وأدِر أياً منها ربع دورة،
        واضبط هامشاً بالمليمترات."""

[[faq]]
q = "كم صورة أستطيع وضعها في ملف PDF واحد؟"
a = """
        لا حدّ مبنيّاً في الأداة. والسقف العملي ذاكرةُ جهازك أنت، لأن المستند
        المنتهي يُجمَّع فيها قبل أن تنزّله. وبضع مئات من صور الهاتف بدقتها
        الكاملة أول ما يشعر بذلك؛ وتصغيرُ الضلع الأطول، في الإعدادات، يزيح ذلك
        السقف بعيداً."""

[[faq]]
q = "هل يحوي ملف PDF أسماء ملفاتي أو وقتاً؟"
a = """
        لا، إلا أن تطلب ذلك. فكتلة معلومات المستند تُترَك فارغة عدا اسم هذه
        الأداة: لا أسماء ملفات، ولا اسم جهاز، ولا اسم مستخدِم، ولا تاريخ إنشاء
        إلا أن تؤشّر على المربع الخاص به. وذلك مقصود &mdash; فملف PDF شيء
        يرسله الناس إلى الناس."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ويحمل الموقع
        إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً لتُصنَع
        منها مستند كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

