<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> الصق النصّين</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">الأصل</label>
          <span class="count" id="input-count">فارغ</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="الصق الأصل هنا - أو أفلِت الملفين في الأعلى."></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">النسخة المتغيرة</label>
          <span class="count" id="input-b-count">فارغ</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="الصق النسخة التي يُقارَن بها."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">جرّب مثالاً</button>
        <button type="button" id="swap" class="ghost">بدِّل الجانبين</button>
        <button type="button" id="clear" class="ghost danger">امسح</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> اختر كيف تقرؤه</h2>

    <div class="settings">
      <div class="field">
        <label for="view">كيف يُعرَض</label>
        <select id="view">
          <option value="split" selected>جنباً إلى جنب</option>
          <option value="unified">عمود واحد</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          اعرض ما تغيّر وحده، وثلاثة أسطر على كل جانب
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          تجاهل المسافات
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          تجاهل الأحرف الكبيرة والصغيرة
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          تجاهل الأسطر الفارغة
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> اقرأ ما تغيّر</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">لا شيء بعد.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>انسخ</button>
        <a id="download" class="ghost as-button" hidden download>نزِّل</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
