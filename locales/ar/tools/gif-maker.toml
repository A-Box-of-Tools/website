[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد. وقد كان هذا يقول <code>connect-src 'none'</code>، وكان
      مطلقاً؛ فكلّفت إضافةُ الإعلانات ذلك، وقولُه جزء من الصفقة."""

[[privacy]]
title = "المرمِّز أربعة ملفات في هذا المستودع."
body = """
 ملف GIF يحتاج إلى
      مُكمِّم ألوان وإلى ضاغط LZW، والمتصفح لا يأتي بواحد منهما &mdash; فكُتِب
      الاثنان هنا، في <code>src/quantize.js</code> و<code>src/lzw.js</code>،
      والحاوية في <code>src/gif.js</code>. ولا شيء يُجلَب لصنع واحد، ولا محرّك
      يُنزَّل عند أول استعمال."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن صورك: لا ملفاً، ولا
      مصغَّرة، ولا اسماً، ولا حجماً، ولا عدداً. وكل سطر يقرأ صورة أو يفكّ
      ترميزها أو يرسمها أو يضغطها يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن صورك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل جزء من هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل صورك بعيداً
      لتُحوَّل إلى ملف GIF كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِت مجلداً على المُنتقي، أو اختر
      الملفات يدوياً. يقرؤها المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان
      أثناء ذلك."""

[[howto]]
title = "رتّبها بالترتيب الذي ينبغي أن تعمل به."
body = """
 اسحب من
      المقبض، أو استعمل الأسهم. و&laquo;رتّب بالاسم&raquo; يعدّ كما تتوقّع أنت،
      فيحطّ <code>frame_2</code> قبل <code>frame_10</code>."""

[[howto]]
title = "اضبط كم يبقى كل إطار."
body = """
 نصف ثانية لكل واحد عرضُ
      شرائح؛ وجزءٌ من عشرين حركةٌ. أعطِ كل إطار مدة البقاء نفسها دفعة واحدة، أو
      أفرِد واحداً منها ليتمهّل."""

[[howto]]
title = "اختر مقاساً، وكيف تُختار الألوان."
body = """
 ملف GIF يكبر
      بمساحته وبعدد إطاراته وليس ثمّة مِزلاج جودة يعيده إلى أسفل، فالمقاس هو
      الإعداد الأهمّ. و256 لوناً لكل إطار أحسن الافتراضات منظراً؛ ولوحةٌ واحدة
      مشتركة أصغر وأثبت."""

[[howto]]
title = "اصنع ملف GIF ونزِّله."
body = """
 يُبنى على عتادك أنت، فمدّته
      تتوقّف على جهازك لا على طابور. وتعمل الحركة المنتهية على الصفحة قبل أن
      تحفظها."""

[[faq]]
q = "هل تُرفع صوري إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت صورك ويرسمها ويكمّم ألوانها ويضغطها على جهازك أنت.
        ولا جانب خادمَ لهذه الأداة، و<code>Content-Security-Policy</code>
        الخاصة بالصفحة تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد
        منها لنا. اقطع الاتصال بالشبكة وسيظل يصنع ملفات GIF."""

[[faq]]
q = "ما صيغ الصور التي أستطيع استعمالها؟"
a = """
        أي صيغة صورة ساكنة يستطيع متصفحك فكّ ترميزها، وهي عملياً JPG وPNG وWebP
        وGIF وAVIF و&mdash; على أجهزة Apple &mdash; HEIC. ولا قائمة منفصلة
        نحرص على تحديثها هنا، لأن فكّ الترميز عمل المتصفح لا عملنا."""

[[faq]]
q = "لماذا ملف GIF عندي بهذا الكبر؟"
a = """
        لأن ملف GIF يخزّن كل إطار بكسلات كاملة. فلا تعويض حركة، ولا شيء يُخزَّن
        على أنه &laquo;كسابقه لكن مزاحاً&raquo;، ولا مقبض جودة: فالحجم تقريباً
        هو المساحة في عدد الإطارات، وثلاثة أشياء لا غير تخفّضه.
        <br><br>
        صغّره &mdash; فتنصيف المقاس يربّع نقصان الملف. واستعمل إطارات أقلّ، أو
        أبقِ كل واحد أطول. وانزل إلى 64 أو 32 لوناً، وأطفئ التوشية، وذلك يكلّف
        على العمل الفنّي المسطَّح أقلّ مما يبدو وعلى الصور الفوتوغرافية كثيراً.
        وإن ظلّ لا يتّسع، فالجواب الصادق أن الذي تصنعه فيديو، وملف MP4 له
        سيكون عُشر الحجم ربما."""

[[faq]]
q = "بأي سرعة يستطيع ملف GIF أن يعمل؟"
a = """
        لا بالسرعة التي يوحي بها الرقم. فالصيغة تخزّن تأخير كل إطار بأجزاء من
        مئة من الثانية، والمتصفحات تحدّ كل ما دون اثنين منها إلى عُشر ثانية منذ
        التسعينيات &mdash; قاعدةٌ كُتِبت لكرات أرضية دوّارة من ذلك الزمن ولم
        تُرفَع قط. فتأخيرُ 0.01 ثانية لا يعمل عند 100 إطار في الثانية؛ بل عند
        10. ولهذا لن تعرض عليك هذه الأداة شيئاً دون 0.02 ثانية، و0.05 ثانية
        (20 إطاراً في الثانية) هي نحو أسرع ما يستحق أن يُطلَب."""

[[faq]]
q = "ماذا يغيّر إعداد لوحة الألوان؟"
a = """
        إطار GIF يحمل 256 لوناً على الأكثر، ولا بدّ لشيء أن يختارها.
        <br><br>
        <strong>أفضل الألوان لكل إطار</strong> يختار 256 لكل صورة على حدة، وهو
        أحدّ منظراً وهو الجواب الصحيح لطقم صور فوتوغرافية لا رابط بينها. أما
        <strong>لوحة واحدة لملف GIF كله</strong> فيبني جدولاً واحداً من كل
        الإطارات دفعة واحدة. وهو ينتج ملفاً أصغر، ويوقف الارتعاش الذي تحصل عليه
        حين تتأرجح اللوحة بين إطارات المشهد الواحد &mdash; فهو ما تلجأ إليه حين
        تكون الإطارات متتابعةً لا مجموعة."""

[[faq]]
q = "هل أستطيع الإبقاء على خلفية شفافة؟"
a = """
        نعم، إن كانت صورك تحملها: حوِّل &laquo;الشفافية&raquo; إلى &laquo;أبقِ
        المناطق الشفافة&raquo;. وثمّة شيء تعرفه قبل أن تفعل. فشفافية GIF بتٌّ
        واحد &mdash; البكسل إما غير مرئي وإما مطليّ تماماً، ولا شيء بينهما
        &mdash; فالحوافّ الملسَّنة والظلال الناعمة وكل ما هو متلاشٍ تصير له
        حافّة حادّة بدلاً من ذلك. فإن كانت حركتك ذاهبة إلى خلفية تعرف لونها،
        فتسطيحُها على ذلك اللون سيبدو أحسن."""

[[faq]]
q = "هل ثمّة حدّ لعدد الصور التي أستطيع استعمالها؟"
a = """
        لا حدّ مبنيّاً في الأداة. والسقف العملي ذاكرةُ جهازك أنت وصبرُك على
        الملف الذي يخرج: فالصور تُقرأ واحدة في كل مرة، فمئة إطار لا بأس بها،
        لكن مئة إطار بعرض 640 بكسلاً ملفُّ GIF كبير جداً كذلك. انظر
        &laquo;لماذا ملف GIF عندي بهذا الكبر؟&raquo; أعلاه."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ولا علامة مائية على
        الخَرج كذلك. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى
        المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً لتُعالَج
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

