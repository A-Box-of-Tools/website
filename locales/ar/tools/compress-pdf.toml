#
# ضغط PDF - Arabic.
#
# Overrides for tools/compress-pdf/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# DPI stays Latin and is not rendered as نقطة/بوصة: it is what the setting is
# called in every other program the reader will meet, and the sentence around
# it explains what it means anyway.
#
# Codec names - JPEG 2000, JBIG2, CCITT, CMYK, XMP - stay Latin for the same
# reason the EXIF tag names do.
#

