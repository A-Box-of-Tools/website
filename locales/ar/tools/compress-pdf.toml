[[privacy]]
title = "مستندك لا سبيل له إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. وهذه الأداة لا تضيف شيئاً إلى تلك القائمة: فليست لها وظيفة
      شبكية خاصة بها، ولا حتى اختيارية. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك،
      ولا في الشيفرة ما يرسله إليه لو وُجد."""

[[privacy]]
title = "الصيغة كلها في هذا المستودع."
body = """
 ملف PDF قائمةُ كائنات
      وجدولٌ بمواضع بداية كل واحد. فـ <code>src/objects.js</code> يقرأ ذلك
      النحو، و<code>src/reader.js</code> يتبع الجدول، و
      <code>src/writer.js</code> يكتب جدولاً جديداً، وليس في واحد من الثلاثة ما
      يستورد شيئاً يستطيع إرسال طلب. ولا مكتبة تُجلَب ولا شيء يُعرَض على
      خادم."""

[[privacy]]
title = "الملفات المشفَّرة تُردّ لا تُفتَح."
body = """

      ملف PDF عليه كلمة مرور يُرفَض، ومن ذلك النوع الذي تنتجه الماسحات بكلمة
      مرور فارغة والذي كان سيُفتَح تقنياً. فنزعُ الحماية عن مستند عملٌ آخر غير
      تصغيره، وفعلُه في صمت شيء يفاجئ من أداة أن تفعله نيابةً عنك."""

[[privacy]]
title = "يُخرِج الأشياء ولا يُدخِلها."
body = """
 الملف المنتهي لا يحمل تاريخ
      إنشاء ولا سطر مُنتِج ولا اسماً للأداة التي صنعته. ومع تأشير المربع يفقد
      كذلك حزمة XMP والكتل الخاصة التي تتركها برامج التنضيد وراءها &mdash; وهي
      الحجّة نفسها التي تقولها أداة EXIF، مطبَّقة على حاوية أخرى."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن مستندك: لا ملفاً،
      ولا صفحةً، ولا اسماً، ولا حجماً، ولا عدد صفحات. وكل سطر يقرأ ملف PDF أو
      يفكّ ترميزه أو يكتبه يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن مستندك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل مستندك بعيداً
      ليُضغَط كانت ستتوقف."""

[[howto]]
title = "اختر ملف PDF."
body = """
 أفلِته على المُنتقي أو اختره يدوياً.
      يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "انظر أين يقع الحجم."
body = """
 التفصيلُ هو مغزى الخطوة
      الثانية. فإن كان الشريط صوراً في أكثره، فعند هذه الأداة ما تعمل عليه.
      وإن كان خطوطاً ومحتوى صفحات في أكثره، قالت ذلك، وكان الكسب الصادق بضعة
      في المئة &mdash; ومعرفةُ ذلك قبل أن تنفق دقيقة عليه أحسن."""

[[howto]]
title = "قل بأي شدّة يُعصَر."
body = """
 والإعدادات المسمّاة دقّاتٌ لا
      درجات مبهمة: 96 DPI للقراءة على شاشة، و130 للإرسال بالبريد، و220 لشيء ما
      زال عليه أن يُطبَع. وكل واحدة تُقاس في مقابل كم تُرسَم الصورة كبيرةً على
      الصفحة فعلاً، فلا تُعامَل صورةٌ موضوعة مصغَّرةً معاملةَ مسحٍ يملأ
      صفحة."""

[[howto]]
title = "اضغطه، وتحقّق من السطر الذي يقول إنه فُحِص."
body = """

      متى تمّت إعادة الكتابة، فُتِح الملف المنتهي من جديد بالقارئ نفسه الذي على
      هذه الصفحة وعُدّت صفحاته. فإن خالف ذلك الأصلَ، أُبلِغ عن الجولة بأنها
      فشلت ولم يُعرَض تنزيل."""

[[faq]]
q = "هل يُرفع ملف PDF عندي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويعيد ضغطه ويكتبه على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. وليست
        لهذه الأداة وظيفة شبكية اختيارية البتة."""

[[faq]]
q = "كم سيصغر ملف PDF عندي؟"
a = """
        يتوقّف ذلك كلياً على ما فيه، ولهذا تقيس الأداة وتعرض عليك قبل أن تضغط
        شيئاً. فالمستند الممسوح ضوئياً صورٌ فوتوغرافية في جميعه تقريباً ويخرج
        عادةً أصغر بـ 60&ndash;90%. أما العقد أو الأطروحة فنصٌّ ورسمٌ متجهي
        وخطوطٌ مضمَّنة، وكلها ضغطها أصلاً ما أنتجها؛ فالكسب هناك بضعة في المئة
        عادةً، من إعادة رصّ الملف وإسقاط ما لم يعد يُشار إليه. وأي أداة تعد
        بنسبة ثابتة دون أن تنظر في ملفك إنما تخمّن."""

[[faq]]
q = "هل يُفقد ضغطُ ملف PDF شيئاً من الجودة؟"
a = """
        الصور التي فيه يُعاد ترميزها، فنعم، لها. وما عداها لا يُمَسّ: فالنصّ
        يبقى نصّاً، قابلاً للتحديد والبحث، والخطوط تبقى كاملة، والرسم المتجهي
        يُنسَخ بالضبط. والأداة كذلك ترفض أن تسيء إلى صورة بلا مقابل &mdash; فإن
        لم تخرج إعادة الترميز أصغر من الأصل، عادت بايتات الأصل إلى المستند دون
        أن تُمَسّ."""

[[faq]]
q = "ما الـ DPI هنا، ولماذا يسأل عنه؟"
a = """
        ملف PDF يسجّل كم تُرسَم كل صورة كبيرةً على الصفحة، فتستطيع الأداة حساب
        دقّتها الفعلية: فمسحٌ بأربعة آلاف بكسل موضوعٌ على ثماني بوصات من الورق
        يحمل 500 بكسل في البوصة. ولا شيء على شاشة ولا كثيرٌ على ورق يستطيع
        استعمال ذلك، فالبكسلات فوق الإعداد الذي تختاره تُرمى أولاً &mdash; فهي
        تكلّف جودةً لا يستطيع أحد رؤيتها. وذلك القياس هو سبب ألا يُعامَل شعارٌ
        موضوع صغيراً معاملةَ مسحٍ يملأ صفحة."""

[[faq]]
q = "هل يستطيع فتح ملف PDF محميّ بكلمة مرور؟"
a = """
        لا، وذلك مقصود. فالمستند المشفَّر يُرفَض برسالة تقول ذلك، حتى حين تكون
        كلمة المرور فارغة &mdash; وهو ما تحفظ به كثير من الماسحات والناسخات.
        فنزعُ الحماية عن ملف عملٌ آخر غير ضغطه، والأداة التي تفعله في صمت تكون
        قد فعلت ما لم تطلبه."""

[[faq]]
q = "هل ثمّة ملفات PDF لا يستطيع ضغطها؟"
a = """
        بعض الصور التي فيها، نعم. فصور JPEG 2000 وJBIG2 والمرمَّزة بترميز
        الفاكس (CCITT) ليس لها فاكُّ ترميز في أي متصفح، فتُمرَّر دون أن تُمَسّ
        ويُبلَّغ عن ذلك &mdash; والأخيرتان مرمِّزتان ثنائيتا المستوى وهما قرب
        أصغر حجم لهما أصلاً عادةً. وصور CMYK تُترَك وشأنها كذلك، لأن إعادة
        ترميزها تخاطر بإزاحة الألوان التي ستنتجها الطابعة. وكل ما تتخطّاه
        الأداة مسمّى على النتائج، ومعه السبب."""

[[faq]]
q = "هل سيُفتَح الملف المضغوط في كل مكان؟"
a = """
        نعم. يُكتَب الخَرج بصيغة PDF 1.5، وهو ما يفهمه كل قارئ شُحِن منذ 2003،
        والأداة تبرهن على ذلك على جهازك أنت: إذ تفتح الملف المنتهي من جديد
        وتعدّ صفحاته قبل أن تعرضه عليك. والاستمارات والروابط والإشارات المرجعية
        وبنية الإتاحة وأي مرفقات مضمَّنة، كلها تُنقَل؛ والذي يُترَك وراءً هو
        المادة التي لم يعد شيء في المستند يشير إليها."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لحجم الملف
        غير ما تسمح به ذاكرة جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع
        تكاليفه؛ ولا يُعطى المعلنون شيئاً عن مستندك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل مستندك بعيداً ليُضغَط
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

