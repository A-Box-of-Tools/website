[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. وتغيير الحجم هو
      <code>drawImage</code> واحد على لوحة و<code>canvas.toBlob</code> واحد
      &mdash; المُحجِّم والمرمِّز المثبَّتان في متصفحك أصلاً."""

[[privacy]]
title = "الملف الذي لم يطلب أحد تغييره لا يُغيَّر."
body = """
 مع عدم وجود قص ولا
      تغيير حجم ولا تبديل صيغة، يُعاد إليك الملف الذي اخترته بايتاً بايتاً بدل
      أن يُحفَظ من جديد. وليس ذلك مجاملة فحسب: هو السبب في أن هذه الأداة لا
      تستطيع أن تعيد ترميز صورة في صمت، ولا أن تُسقط في صمت البيانات الوصفية
      لصورة أردت النظر إليها لا غير."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن صورك. وكل سطر يقرأ ملفاً أو يقصّه أو يحجّمه أو يكتبه يُخدَم
      من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِتها على المُنتقي أو اخترها يدوياً.
      يقرؤها المتصفح من قرصك مباشرة، ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "قُصَّ، إن أردت."
body = """
 يبدأ الإطار على الصورة كلها، فتركُه
      على حاله لا يقصّ شيئاً. اسحبه، أو ثبِّته على نسبة &mdash; 1:1 لصورة
      الملف الشخصي، و9:16 لقصة، و16:9 لمصغَّرة &mdash; واضغط
      &laquo;الأكبر&raquo; لأكبر إطار يتّسع. وتحتفظ كل صورة بإطارها الخاص:
      انقر أي صف في القائمة لترسم على تلك الصورة بدلاً منها. وإن أردتها كلها
      مؤطَّرة الإطار نفسه، فزرٌّ واحد يفعل ذلك أيضاً."""

[[howto]]
title = "قل بأي حجم تخرج."
body = """
 عرضاً، أو ارتفاعاً، أو كليهما؛
      أو أطول ضلع، وهو ما يجعل اللقطات الطولية والعرضية بالحجم نفسه؛ أو نسبة
      مئوية بسيطة. اترك أحد الحقلين فارغاً فتحتفظ الصورة بنسبتها."""

[[howto]]
title = "اختر الصيغة، ثم اضغط الزر."
body = """
 أبقِ كل ملف على ما وصل
      به، أو اكتب الكل بصيغة JPEG أو PNG أو WebP. وتقول كل نتيجة إلامَ صارت وكم
      صغُرت؛ انقر إحداها لتفتحها بالحجم الكامل وأمامك كل الأرقام التي وراءها،
      والأصل بجانبها للمقارنة. وتنزل الدفعة في ملف zip واحد."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يفكّ متصفحك أنت ترميز الملف ويقصّه ويحجّمه ويكتبه على جهازك أنت،
        بمرمِّزات JPEG وPNG وWebP التي يأتي بها المتصفح أصلاً. لا تملك هذه
        الأداة أي وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا ترسل
        شيئاً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا."""

[[faq]]
q = "ماذا يحدث إن أعطيته عرضاً دون ارتفاع؟"
a = """
        يتبع الارتفاعُ نسبةَ الصورة نفسها، وهو المقصود في الغالب الأعم:
        &laquo;عرضه 1920&raquo; تعني &laquo;عرضه 1920 وارتفاعه ما يقتضيه
        ذلك&raquo;. واملأ الحقلين معاً وقد يتعارض الاثنان مع نسبة الصورة، وهي
        المرة الوحيدة التي يظهر فيها خيار &laquo;إن تعارضت النسب&raquo;
        &mdash; احتواءٌ داخل الإطار، أو ملؤه وقطع الفائض، أو حشوه بلون خلفية،
        أو مطُّ الصورة وقبول التشوّه."""

[[faq]]
q = "هل يُفقد تغييرُ حجم الصورة شيئاً من جودتها؟"
a = """
        تصغير الصورة لا يفعل، بأي قدر تراه العين: فالبكسلات الداخلة أكثر من
        الخارجة، والتفاصيل الباقية تفاصيل حقيقية. أما تكبيرها فلا يستطيع أن
        يضيف ما لم يُصوَّر أصلاً &mdash; والناتج نسخة أنعم من الصورة نفسها لا
        أحدّ منها &mdash; ولهذا كان &laquo;لا تكبّر صورة أبداً فوق ما بدأت
        به&raquo; مفعَّلاً افتراضياً. والذي يكلّف شيئاً يسيراً هو إعادة الترميز
        بعد ذلك، إن كانت الصيغة JPEG أو WebP، ومِزلاجُ الجودة هو ما تنفقه هناك."""

[[faq]]
q = "هل أستطيع قصَّ كل صورة على نحو مختلف؟"
a = """
        نعم &mdash; وهذا هو الأصل. تحمل كل صورة في القائمة إطارها الخاص،
        ببكسلاتها هي، ونقرُ صفٍّ يضع تلك الصورة في المعاينة ومعها إطارها
        ونسبتها المثبَّتة. ولا يؤثّر ما تفعله بواحدة في غيرها. كما يبدأ كل
        إطار على الصورة كلها، فالصورة التي لم ترسم عليها قط لا تُقصّ أصلاً."""

[[faq]]
q = "هل يستطيع قصَّ دفعة كاملة القصَّ نفسه دفعة واحدة؟"
a = """
        نعم، بالزر الذي تحت المعاينة. يعطي كل صورة أخرى المساحة النسبية نفسها
        &mdash; الكسور نفسها من عرضها وارتفاعها هي &mdash; وهو لمجموعة لقطات
        شاشة أو تصديرات متساوية الحجم الإطارُ نفسه بالضبط، وتقول الصفحة ذلك.
        ومع نسبة مثبَّتة يعطي كلَّ واحدة أكبرَ إطار بتلك النسبة داخل تلك
        المساحة، فضغطُ 1:1 ثم ذلك الزر يخرج لك مربعات من مجلد فيه لقطات طولية
        وعرضية مختلطة. ويبقى كل إطار قابلاً للتعديل بعدها."""

[[faq]]
q = "ما الصيغ التي يقرؤها ويكتبها؟"
a = """
        يقرأ كل ما يستطيع متصفحك فك ترميزه، وهو عملياً JPEG وPNG وWebP وGIF
        وBMP و&mdash; على معظم المتصفحات الحالية &mdash; AVIF. ويكتب JPEG وPNG
        وWebP، لأن هذه هي المرمِّزات التي تأتي بها المتصفحات. وعلى
        &laquo;أبقِ على الصيغة&raquo; يبقى JPEG على حاله ويبقى PNG على حاله؛ وما
        لا يستطيع المتصفح كتابته، كـ GIF أو BMP، يخرج PNG، وهي الصيغة التي
        تحفظ الشفافية واللون المسطَّح سليمَين."""

[[faq]]
q = "ماذا يحدث للشفافية حين أحفظ بصيغة JPEG؟"
a = """
        تُملأ بلون الخلفية، لأن JPEG ليس فيه قناة ألفا تخزّنها. واللون لك
        تختاره، ويبدأ من الأبيض، وهو ما يريده معظم الناس وما تفعله كل أداة
        أخرى تقريباً دون أن تخبرك. ويُستخدَم اللون نفسه خلف الإطار المحشوّ.
        احفظ بصيغة PNG أو WebP بدلاً من ذلك فتمرّ الشفافية دون أن تُمسّ."""

[[faq]]
q = "هل يزيل بيانات EXIF وGPS؟"
a = """
        كلُّ ما يعالجه فعلاً، نعم، كأثر جانبي: فالقصّ أو تغيير الحجم يعني فكّ
        ترميز الصورة إلى بكسلات وإعادة ترميز تلك البكسلات، ولوحة البكسلات لا
        تحمل وسوماً، فالموقع وطراز الكاميرا والأوقات لا تُكتَب ببساطة في الملف
        الجديد. أما الملف الذي لا تغيّر فيه شيئاً فحالة أخرى &mdash; يُعاد
        إليك بايتاً بايتاً بوسومه كلها. وإن أردت البيانات الوصفية زائلة
        والصورة على حالها، فاستخدم
        <a href="../إزالة-بيانات-exif/">عارض EXIF ومُزيله</a>، فهو يعيد كتابة
        الحاوية دون إعادة ضغط أي شيء."""

[[faq]]
q = "بمَ يختلف هذا عن ضاغط الصور؟"
a = """
        هذا شأنه الأبعاد: تقول كم بكسلاً تريد فيعطيك إياها. أما
        <a href="../ضغط-الصور/">ضاغط الصور</a> فشأنه حجم الملف: تقول كم
        كيلوبايت مسموح لك به فيبحث عن أعلى جودة تتّسع له، ولا يصغّر الأبعاد
        إلا إن عجزت الجودة وحدها عن بلوغه. فإن قيل لك &laquo;عرضها 1200
        بكسل&raquo; فأنت في المكان الصحيح. وإن قيل لك &laquo;دون 500
        KB&raquo; فالأخرى ستقرّبك أكثر."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لعدد الملفات ولا لأحجامها كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً ليُغيَّر
        حجمها كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

