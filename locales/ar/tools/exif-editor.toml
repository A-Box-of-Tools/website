#
# عارض EXIF ومُزيله - Arabic.
#
# Overrides for tools/exif-editor/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# EXIF tag names stay in English - Orientation, ISO, GPS, XMP, IPTC, maker note.
# That is a decision already taken for the whole site and it matters most here,
# where the tags are the bulk of the page: people cross-reference these against
# ExifTool, Lightroom and Windows' own properties dialog, and translating the
# obscure ones makes the tool harder to use rather than easier.
#
# The name matches the one every other tool's FAQ already links to. Do not
# rename it here without changing those.
#

