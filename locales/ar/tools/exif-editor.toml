[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 على خلاف الأدوات الأخرى في هذا
      الصندوق، ليس في هذه خاصية &laquo;حمِّل من عنوان ويب&raquo; ولا خطوة شبكية
      اختيارية البتة. فلا يوجد <code>fetch</code> ولا
      <code>XMLHttpRequest</code> ولا <code>sendBeacon</code> في أي موضع من
      <code>src/</code>."""

[[privacy]]
title = "البيانات الوصفية التي نقرؤها لا تُقرأ على أحد أبداً."
body = """
 موقعك من GPS
      يُعرَض على هذه الصفحة ولا يذهب إلى أي مكان آخر. ولا يوجد في هذا المستودع
      أي حدث تحليلات مخصّص يحمل وسماً أو اسم ملف أو حجماً أو عدداً."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن صورك. وكل سطر يقرأ
      ملفاً أو يحلّله أو يعيد كتابته يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن ملفاتك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِتها على المُنتقي أو اخترها يدوياً.
      يقرؤها المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اقرأ ما فيها، إن أردت."
body = """
 تُسمّي قائمةُ النتائج الأشياءَ
      الجديرة بالمعرفة &mdash; موقع GPS، والأوقات، والأرقام التسلسلية &mdash;
      قبل الجدول الكامل بكل وسم."""

[[howto]]
title = "اضغط &laquo;أزِل كل البيانات الوصفية&raquo;."
body = """
 وهذا هو العمل كله
      عند معظم الناس. فيذهب كل وسم، وكتلتا XMP وIPTC، والتعليقات، والمصغَّرة
      المضمَّنة، من كل صورة في القائمة دفعة واحدة."""

[[howto]]
title = "أو حرِّر بدل أن تزيل."
body = """
 غيّر تاريخاً، أو صحّح سطر حقوق
      نشر، أو أسقِط الموقع وأبقِ على إعدادات الكاميرا &mdash; ثم احفظ تلك
      الصورة وحدها."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويحلّله ويعيد كتابته على جهازك أنت. لا تملك
        هذه الأداة أي وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا
        ترسل شيئاً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا."""

[[faq]]
q = "ما EXIF، وما الذي يختبئ في الصورة غيره؟"
a = """
        EXIF كتلة وسوم تكتبها الكاميرا بجانب الصورة: الصانع والطراز، وإعدادات
        التعريض، والتاريخ والوقت إلى الثانية، وكثيراً موقع GPS، وأحياناً رقم
        تسلسلي. وكثيراً ما تحمل الصور غير ذلك &mdash; حزمة XMP من XML كتبها
        محرِّر، وكتلة IPTC فيها حقول التعليق والتوقيع، وملفَّ ألوان، ونسخة
        ثانية صغيرة من الصورة بوصفها مصغَّرة، وmaker note فيه بيانات صانع غير
        موثَّقة. وهذه الأداة تسرد ذلك كله."""

[[faq]]
q = "هل تُنقص إزالةُ البيانات الوصفية جودةَ الصورة؟"
a = """
        لا، وهذا هو السبب الرئيس لاستعمال أداة كهذه بدل إعادة حفظ الصورة.
        فالبيانات الوصفية تقبع في الحاوية حول الصورة المضغوطة لا داخلها.
        وإزالتها تعني حذف عناصر من قائمة وإعادة كتابة القائمة؛ أما بيانات
        الصورة المضغوطة فتُنسَخ بايتاً بايتاً، فيفكّ الناتجُ ترميزَه إلى
        البكسلات نفسها بالضبط. فلا شيء يُفكّ ترميزه ولا شيء يُعاد ضغطه."""

[[faq]]
q = "ما صيغ الملفات التي يتعامل معها؟"
a = """
        JPEG وPNG وWebP. أما HEIC وAVIF فيتعرّف عليهما ولا يعيد كتابتهما: فهما
        صيغتا حاويات مبنيّتان من ذرّات متداخلة وتحتاجان إلى محلِّل آخر، فتقول
        الأداة ذلك بدل أن تنتج ملفاً معطوباً. وملف TIFF المجرَّد غير متعامَل
        معه كذلك، لأن البيانات الوصفية والبكسلات في TIFF تُعنوَنان بالإزاحات
        نفسها."""

[[faq]]
q = "هل ستظهر صورتي مقلوبة بعد إزالة البيانات الوصفية؟"
a = """
        قد تظهر، وثمّة إعداد لذلك. فالهواتف تسجّل الصورة عادةً كما رآها
        المستشعر وتضيف وسم Orientation يقول كيف تُدار. وإزالة ذلك الوسم تجعل
        بعض العارضات تعرض الصورة على جنبها. أما خيار &laquo;أبقِ على وسم
        الاتجاه&raquo;، وهو مفعَّل افتراضياً، فيكتب كتلة EXIF ضئيلة ليس فيها
        إلا ذلك الوسم الواحد &mdash; وذلك فقط حين تكون الصورة محتاجة إليه
        فعلاً. أطفئه إن كنت تفضّل ألا يحمل الملف EXIF على الإطلاق."""

[[faq]]
q = "هل يزيل موقع GPS؟"
a = """
        نعم. فإزالة كل شيء تزيل دليل GPS كله، وتستطيع كذلك حذف الموقع وحده
        والإبقاء على ما عداه. ويُعرَض الموقع بالدرجات العشرية أولاً، لأن
        &laquo;51 درجة و30 دقيقة و26 ثانية&raquo; لا تجعل من الظاهر أن الصورة
        تُسمّي المبنى الذي التُقطت فيه."""

[[faq]]
q = "هل أستطيع تغيير وسم بدل حذفه؟"
a = """
        نعم. فالوسوم النصّية والتواريخ وISO والاتجاه والدقة يمكن تحريرها كلها،
        وبضعة وسوم شائعة يمكن إضافتها إلى صورة لا وسوم فيها. وثمّة تحفّظ واحد:
        كتابةُ الملف تعيد بناء كتلة EXIF، وmaker note يحوي إزاحات إلى الكتلة
        الأصلية، فقد لا يستطيع برنامج الصانع نفسه قراءة maker note المعاد
        بناؤه بعد ذلك. فاحذفه أو اترك الملف دون تحرير إن كان ذلك يهمّك."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ويحمل الموقع
        إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً لتُعالَج
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

