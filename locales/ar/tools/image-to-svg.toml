[[privacy]]
title = "صورتك لا مكان تذهب إليه."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يمكن لهذه الصفحة الاتصال به، ولا واحد
      منها يخصّ هذا الموقع. لا توجد هنا نقطة تُجمَع فيها ملفاتك، ولا شيء في
      الشيفرة يرسلها إليها لو وُجدت."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا <code>fetch</code>
      ولا <code>XMLHttpRequest</code> ولا <code>sendBeacon</code> في أي موضع
      من <code>src/</code>. الأداة كلها حساب على بكسلات صورة واحدة: عتبة، وطواف
      بحافة ما وجدته، وشيء من ملاءمة المنحنيات."""

[[privacy]]
title = "لا محرّك يُنزَّل."
body = """
 التتبّع عادةً برنامج شخص
      آخر، وعلى الويب يعني ذلك عدة ميغابايتات من الشيفرة المصرَّفة تصل قبل
      النقرة الأولى. لا شيء من ذلك هنا. الأمر كله بضع مئات من أسطر JavaScript
      العادية تُقدَّم من هذا الأصل، ولهذا أيضاً تعمل الصفحة لحظة فتحها لا بعد
      انتظار."""

[[privacy]]
title = "ما يحمّله Google، وما لا يُعطاه."
body = """
 تأتي سكربتات الإعلان
      والقياس من Google، وزرّ التبرّع من Buy Me a Coffee. ولا يُعطى أيّ منها
      شيئاً عن صورتك. فكل سطر يقرؤها أو يُطبّق عليها العتبة أو يتتبّعها يُقدَّم
      من هذا الأصل ومدرج في المستودع."""

[[privacy]]
title = "تعمل دون اتصال."
body = """
 اقطع الشبكة فتبقى الأداة كما هي،
      لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط دليل على الإطلاق."""

[[howto]]
title = "اختر الصورة."
body = """
 شعار، أو قالب، أو توقيع، أو ختم،
      أو رسم ممسوح ضوئياً، أو ظلّ. كل ما فيه شكل واضح يُتتبَّع جيداً؛ أما صورة
      غرفة فلا، وفي الأسفل تحذير صريح بدل مفاجأة في النهاية. يُقرأ الملف من
      قرصك مباشرةً ولا يُرسَل شيء إلى أي مكان في أثناء ذلك."""

[[howto]]
title = "قل ما الشكل."
body = """
 الرسم على الورق يُفصَل بـ<strong>الفاتح
      والداكن</strong>، والمستوى يُحسَب لك. أما صورة شيء ما فلا &mdash; تمثال
      أحمر داكن على حجر رمادي داكن هو داكن على داكن، ولا سطوع يفصل بينهما. تلك
      تريد <strong>الموضوع</strong>، الذي يتعلّم ما الخلفية من شريط على طول حافة
      الصورة ويحتفظ بكل ما ليس منها."""

[[howto]]
title = "انظر إلى الخط الأحمر لا إلى الإعدادات."
body = """
 يُرسَم خط المحيط فوق البكسلات
      التي جاء منها، لأنه الموضع الوحيد الذي يمكن فيه حسم المسألة: خط المحيط
      صائب أو خاطئ بالنسبة إلى تلك البكسلات لا غير. اسحب أياً من الصورتين
      لتحريكهما معاً، وأدر العجلة لتكبّر بما يكفي لترى ما يفعله الخط فعلاً."""

[[howto]]
title = "أزل بنقرة ما لا ينبغي أن يكون هناك."
body = """
 بقعة، أو دبّوس، أو ختم، أو
      تعليق، أو ظلّ. النقرة تلتقط رقعة ذلك اللون كلها لا بكسلاً واحداً، فأنت
      تشير إلى شكل؛ انقره ثانيةً ليعود. أما النقر على قطعة محاطة من الخلفية
      فيملؤها، وهكذا يُسدّ ثقب لا ينبغي أن يكون ثقباً."""

[[howto]]
title = "اضبط النعومة عند الحاجة فقط."
body = """
 <em>التفصيل</em> هو مقدار ما
      يُسمح للخط بالابتعاد عن البكسلات أثناء تبسيطه، ويُحسَب لكل شكل ما لم تقل
      غير ذلك. و<em>حدّة الزوايا</em> تقرّر كم يجب أن ينعطف خط المحيط ليبقى
      الانعطاف زاويةً بدل أن يُستدار. معظم الصور لا تحتاج إلى لمس أيّ منهما."""

[[howto]]
title = "خذ ملف SVG."
body = """
 ملف واحد، و<code>&lt;path&gt;</code>
      واحد، ولا قاعدة تعبئة تقلق بشأنها: تدور خطوط المحيط في اتجاه والثقوب في
      الاتجاه المقابل، وهذا ما يجعل شكلاً فيه أربعون ثقباً عنصراً واحداً. يُفتح
      في Illustrator وInkscape وFigma والمتصفح وآلة القطع."""

[[faq]]
q = "هل تُرفَع صورتي إلى مكان ما؟"
a = """
        لا. يقرأ الملفَ متصفحُك على عتادك، وتتتبّعه بضع مئات من أسطر JavaScript
        المقدَّمة من هذا الأصل، ثم يُعاد إليك تنزيلاً. لا تملك هذه الأداة أي
        وظيفة شبكية على الإطلاق &mdash; لا تجلب شيئاً ولا ترسل شيئاً &mdash;
        وتُسمّي <code>Content-Security-Policy</code> الخاصة بالصفحة كل عنوان
        يمكنها الاتصال به، ولا واحد منها يخصّ هذا الموقع."""

[[faq]]
q = "هل تحوّل صورتي الفوتوغرافية إلى SVG؟"
a = """
        ليس على نحو نافع، والصفحة تخبرك بذلك بدل أن تدعك تكتشفه بعد التنزيل.
        يحوّل التتبّع كل رقعة لون متقارب إلى شكل مستقل، فتعود الصورة
        الفوتوغرافية آلافاً من البقع المتراكبة وملفاً أكبر بمرات من JPEG، يُفتح
        ببطء ولا يشبه الصورة. ما يُتتبَّع جيداً هو صورة فيها <em>شكل</em>: شعار،
        أو قالب، أو توقيع، أو رسم خطي، أو ظلّ. أما صورة فوتوغرافية لشيء واحد
        فيقصّها إعداد <em>الموضوع</em> ظلاً مصمتاً واحداً، وذاك أمر مختلف ونافع
        حقاً."""

[[faq]]
q = "ما الفرق بين طريقتَي إيجاد الشكل؟"
a = """
        السؤال الذي تطرحه كل منهما. <strong>الفاتح والداكن</strong> يسأل هل كل
        بكسل أدكن من مستوى معيّن، وهذا صائب تماماً للحبر على الورق وعديم الجدوى
        حين يكون الموضوع والخلفية على القدر نفسه من الدُّكنة. أما
        <strong>الموضوع</strong> فيسأل ما الخلفية &mdash; يتعلّمها من شريط على
        طول حافة الصورة، ويقيس كل بكسل عليها، ويحتفظ بأكبر شيء ليس منها. ينجح
        ذلك في صورة شيء أمام خلفية متجانسة إلى حدّ ما، ويخفق في صورة مقصوصة
        بإحكام يخرج فيها الموضوع من ثلاث جهات، لأن الحواف التي يتعلّم منها تكون
        حينئذ هي الموضوع نفسه. حين يحدث ذلك، يمكنك أن تشير إلى الخلفية بنفسك."""

[[faq]]
q = "لماذا في الشكل المتتبَّع ثقوب، أو لماذا يفقد الأجزاء الرفيعة؟"
a = """
        لأنها كانت في الصورة حين صارت بتّاً واحداً لكل بكسل. شغّل <em>ما تلقّاه
        المتتبِّع</em> لتراه: دون نحو اثني عشر بكسلاً تكون عين الحرف قد امتلأت
        وساقاه قد التحمتا، ولا تتبّع يستعيد ثقباً غير موجود. العلاج في المنبع
        &mdash; حرّك العتبة، أو ابدأ من مسح ضوئي أكبر. وفي وضع
        <em>الموضوع</em>، يسدّ <em>سدّ الفجوات حتى</em> الثقوب الصغيرة، ويُغلق
        <em>املأه مصمتاً</em> كل ثقب لا تبلغه الخلفية من حافة الصورة."""

[[faq]]
q = "هل يمكنني إصلاح ما أخطأت فيه؟"
a = """
        نعم، ولهذا معظم الخطوة الثالثة. انقر أي شيء لا ينبغي أن يكون في الرسم
        فيختفي؛ انقره ثانيةً فيعود. النقرة تلتقط رقعة ذلك اللون كلها، فتزيل نقرة
        واحدة بقعة بأكملها أو ختماً بأكمله لا بكسلاً واحداً. والنقر على قطعة
        محاطة من الخلفية يملؤها. تُحفظ التصحيحات منفصلةً عن العتبة، فتحريك
        المنزلق بعدها لا يرميها."""

[[faq]]
q = "ما حجم ملف SVG؟"
a = """
        للشكل، أصغر من الصورة: الظلّ المتتبَّع عادةً بين كيلوبايت وخمسة، والشعار
        بضعة كيلوبايتات أكثر. تخبرك الصفحة بالرقم الدقيق إلى جانب التنزيل. أما
        للصورة الفوتوغرافية فسيكون هائلاً، وهذه أوضح علامة على أن الأداة ليست
        الأداة الصحيحة لذلك الملف &mdash; وبعد نحو ألف شكل منفصل تتوقف الصفحة عن
        الرسم وتقول ذلك."""

[[faq]]
q = "هل تتتبّع بالألوان؟"
a = """
        لا. هذه تصنع شكلاً واحداً بلون واحد، وهي الحالة التي يخرج فيها رسماً لا
        نسخة تصوير رديئة. التتبّع بالألوان يعني الاختزال إلى ألوان قليلة وتتبّع
        كل منها طبقةً مستقلة، والنتيجة تخيّب معظم من يطلبها. إن احتجت إلى اللون،
        فتتبّع الشكل هنا ولوّنه في برنامج الرسم الذي تستخدمه."""

[[faq]]
q = "ماذا أفعل بملف SVG بعدها؟"
a = """
        تكبّره إلى أي حجم دون أن يتشوّش، وتغيّر لونه بخاصية واحدة، وتحرّكه،
        وتطبعه، أو ترسله إلى آلة قطع أو ليزر. هو <code>&lt;path&gt;</code> واحد
        بلا قاعدة تعبئة يمكن أن تُضبط خطأً، فيقرؤه Illustrator وInkscape وFigma
        والمتصفح ومعظم برامج CNC على النحو نفسه."""

[[faq]]
q = "هل لحجم الصورة حدّ؟"
a = """
        حدّ جهازك لا حدّنا. صفحة A4 ممسوحة بدقة 300&nbsp;نقطة في البوصة &mdash;
        نحو تسعة ميغابكسل &mdash; تُتتبَّع في جزء من الثانية. والصور الأكبر
        تعمل؛ تستغرق وقتاً أطول فحسب، والعمل يجري على معالجك أنت لا في طابور في
        مكان ما."""

[[faq]]
q = "هل هي مجانية، وهل أحتاج إلى حساب؟"
a = """
        مجانية، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية. ولا
        حدّ لعدد الملفات أو حجمها أيضاً، لأنه لا خادم يدفع ثمنها &mdash; فالعمل
        يجري على جهازك أنت. يحمل الموقع إعلانات وهي التي تموّله؛ ولا تُعطى
        الإعلانات شيئاً عن ملفاتك."""

[[faq]]
q = "هل تعمل دون اتصال؟"
a = """
        نعم. حمّل الصفحة مرة، ثم اقطع الإنترنت، فتستمرّ في العمل. وهذا أيضاً
        أبسط طريقة لإثبات أن شيئاً لا يُرفع: أداة ترسل صورتك بعيداً لتتبّعها
        كانت لتتوقف لحظة نزع الكابل."""

