[[privacy]]
title = "مقاطعك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس فيديوك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فكّ الترميز وإعادته محليّان."
body = """
 تمرّ الإطارات عبر
      WebCodecs في متصفحك أنت، أو عبر محرّك التشغيل نفسه الذي كان سيعرض عليك
      المقطع على أي حال. ويُبنى الملف المنتهي في الذاكرة على هذا الجهاز
      ويُناوَل للتنزيل مباشرة."""

[[privacy]]
title = "الصوت يُنسَخ ولا يُستمَع إليه."
body = """
 على مسار MP4 تُنقَل
      عيّنات الصوت دون أن يُفكّ ترميزها البتة &mdash; فلا شيء هنا يعيدها صوتاً
      قط، ولا شيء يستطيع تمريرها إلى أي مكان لو فعل."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن فيديوك: لا ملفاً،
      ولا إطاراً، ولا اسماً، ولا حجماً، ولا مدةً، ولا النسبة التي اقتصصته
      إليها. وكل سطر يقرأ أو يفكّ ترميزاً أو يقتصّ أو يرمّز يُخدَم من هذا الأصل
      نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن فيديوك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر فيديو."
body = """
 أفلِت ملف MP4 أو MOV أو M4V أو WebM على
      المُنتقي، أو اختر واحداً يدوياً. يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل
      شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اسحب الإطار على الجزء الذي تريد إبقاءه."
body = """
 اسحب
      داخله لتحريكه وأي ركن لتغيير حجمه. وثبِّته على نسبة أولاً &mdash; 1:1
      لمنشور مربّع، و9:16 لهاتف، و16:9 لإطار عريض &mdash; أو اكتب إطار بكسل
      محدّداً في الحقول الأربعة التي تحته.
      شغِّل المقطع، أو اسحب الشريط الذي تحته، لاختيار اللحظة التي تضبط عليها الإطار."""

[[howto]]
title = "اختر كم من الجودة تُنفَق."
body = """
 لا بدّ من إعادة ترميز
      الصورة، لأن الإطار المقتَصّ صورة أخرى. و&laquo;متوازن&raquo; يبقيه
      قريباً مما أنفقه الملف على تلك المساحة أصلاً؛ و&laquo;أفضل جودة&raquo;
      ينفق أكثر. ويبقى الصوت ما لم تطفئه."""

[[howto]]
title = "اقتصصه ونزِّله."
body = """
 يجري العمل على عتادك أنت، فمدّته
      تتوقّف على جهازك لا على طابور. ويُناوَل الفيديو المنتهي لتنزيلات متصفحك
      مباشرة."""

[[faq]]
q = "هل يُرفع فيديوي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويفكّ ترميزه ويقتصّه ويرمّزه على جهازك أنت. ولا
        جانب خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة
        بالصفحة تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا.
        اقطع اتصالك بالإنترنت واقتصص مقطعاً رغم ذلك إن كنت تفضّل التحقّق على أن
        يُقال لك."""

[[faq]]
q = "ما صيغ الفيديو التي أستطيع اقتصاصها؟"
a = """
        MP4 وM4V وMOV تُقرأ مباشرة، مهما كان بداخلها: H.264 أو HEVC أو AV1 أو
        VP9، ما دام متصفحك يستطيع فكّ ترميز ذلك المرمِّز. وكل ما عداها مما
        يستطيع متصفحك تشغيله &mdash; وWebM أظهرها &mdash; يُقتَصّ بتشغيله
        وتسجيل الناتج بدلاً من ذلك، وذلك يعمل لكنه يستغرق مدة المقطع. أما الملف
        الذي لا يستطيع المتصفح قراءته ولا تشغيله، وهو عملياً AVI وWMV وFLV
        ومعظم ملفات MKV، فيُرفَض برسالة تقول ذلك بدل أن يفشل في منتصف
        الطريق."""

[[faq]]
q = "هل ثمّة حدّ لحجم الفيديو أو مدّته؟"
a = """
        لا حدّ مبنيّاً في الأداة، ولا يُقرأ الملف إلى الذاكرة دفعة واحدة
        &mdash; بل يُمشى فيه بضعة ميغابايتات في كل مرة. والسقف العملي هو الفيديو
        المنتهي، إذ يُجمَّع في الذاكرة قبل أن تنزّله، والوقت الذي يستغرقه جهازك
        في ترميزه."""

[[faq]]
q = "هل ينجو الصوت؟"
a = """
        على مسار MP4، بالضبط: يُنسَخ الصوت عيّنةً عيّنة دون أن يُفكّ ترميزه
        قط، فهو بايتاً بايتاً ما كان في الملف. وعلى مسار التسجيل يُلتقَط من
        التشغيل ويُعاد ترميزه، وذلك يكلّف شيئاً يسيراً من الجودة. وفي الحالين
        ثمّة مربع اختيار لتركه بالكلية."""

[[faq]]
q = "هل يُفقد الاقتصاصُ شيئاً من الجودة؟"
a = """
        تُرمَّز الصورة من جديد، لأن الإطار المقتَصّ صورة أخرى ولا سبيل إلى
        تخزينه دون كتابة البكسلات من جديد. والذي لن تفعله الأداة أن تنفق أكثر
        مما أنفق الأصل على المساحة نفسها، إذ إعادة الترميز فوق ذلك لا تزيد إلا
        حجم الملف دون أن تحسّن منظره."""

[[faq]]
q = "هل أستطيع تقصير المدة كذلك؟"
a = """
        ليس هنا، بل في الجوار. فهذه الأداة تغيّر نسبة الصورة ولا شيء غير ذلك:
        والمقطع الذي يخرج بطول الذي دخل بالضبط، بتوقيته وصوته سليمَين. أما
        التقصير فعمل منفصل وأداة منفصلة &mdash; فـ
        <a href="../تقصير-الفيديو/">مقصّ الفيديو</a> يعلّم على الأجزاء التي
        تستحق البقاء من مقطع ويحفظها ملفاً واحداً، دون إعادة ترميز إطار
        واحد."""

[[faq]]
q = "لماذا يتحرّك العرض والارتفاع بخطوات من اثنين؟"
a = """
        H.264، وهو المرمِّز الذي في ملف MP4، يخزّن الصورة كتلاً وليس له سبيل
        إلى وصف إطار عدد بكسلات ضلعه فردي. وبدل أن يقرّب اقتصاصك في صمت بعد أن
        تضبطه، لا يعرض الإطارُ إلا الأعداد الزوجية من أول الأمر."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        فيديوك."""

