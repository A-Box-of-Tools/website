[[privacy]]
title = "تسجيلاتك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس صوتك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فاكُّ الترميز هو الذي في متصفحك أصلاً."
body = """

      يُناوَل الملف إلى <code>decodeAudioData</code>، وهي الشيفرة نفسها التي
      تشغّل مقطوعة في عنصر <code>&lt;audio&gt;</code>. فلا شيء يُشحَن هنا لقراءة
      صيغتك، ولا شيء يُطلَب من خارج هذه الصفحة لقراءتها كذلك."""

[[privacy]]
title = "صورة الفيديو لا يُفكّ ترميزها البتة."
body = """
 حين تُفلِت فيديو،
      لا يُطلَب إلا مسارُه الصوتي. أما الإطارات فلا تُقرأ ولا يُفكّ ترميزها ولا
      تُرسَم ولا يُنظَر إليها &mdash; فليس في هذه الصفحة شيفرة تستطيع ذلك،
      والملف الذي يخرج يحمل صوتاً ولا شيء غيره."""

[[privacy]]
title = "القَصّ نسخٌ، في الذاكرة، على هذا الجهاز."
body = """

      التقصير عمليةُ <code>set</code> واحدة لكل جزء لكل قناة: فالعيّنات التي
      أبقيتها تُنقَل إلى مصفوفة جديدة بالترتيب الذي وضعتها به. والعيّنات
      الوحيدة التي تُضرَب في شيء هي المئات القليلة داخل كل تلاشٍ، وتقول الصفحة
      كم هي قبل أن تضغط الزر."""

[[privacy]]
title = "العيّنات تُكتَب، ولا يُعاد ترميزها."
body = """

      ملف WAV هو العيّنات التي تحملها هذه الصفحة وأمامها ترويسة. فلا مرمِّز في
      الحلقة يتخذ قرارات بشأن تسجيلك، ولا شيء يمكن وصفه بالرفع كي يحدث
      واحد."""

[[privacy]]
title = "ملف العلامات يُصنَع في الصفحة."
body = """
 حفظُ علاماتك يكتب ملفاً
      نصّياً من الأرقام التي على الشاشة أصلاً، إلى تنزيلاتك مباشرة. وتحميلُ
      واحد يقرؤه هنا. ولا يقترب أيٌّ منهما من شبكة، ولا يحمل أيٌّ منهما إلا
      أوقاتاً."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن تسجيلك: لا ملفاً،
      ولا عيّنةً، ولا اسماً، ولا حجماً، ولا مدةً، ولا أين قصصته. وكل سطر يقرأ
      ويقصّ ويكتب يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن تسجيلك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر تسجيلاً."
body = """
 أفلِت ملف MP3 أو WAV أو FLAC أو M4A أو
      Ogg أو Opus على المُنتقي &mdash; أو فيديو، إن كان مرادك قطعةً من صوته.
      يقرؤه المتصفح من قرصك مباشرة ويرسمه شكلاً موجياً؛ ولا يُرسَل شيء إلى أي
      مكان أثناء ذلك."""

[[howto]]
title = "شغّله، وعلّم على الأجزاء التي تريدها."
body = """
 اضغط
      <kbd>I</kbd> حيث ينبغي أن يبدأ الجزء و<kbd>O</kbd> حيث ينبغي أن ينتهي.
      وافعل ذلك بلا حدّ &mdash; فكل زوج يصير صفاً في الجدول الذي تحته، وشريطاً
      على الشكل الموجي. و<kbd>U</kbd> يسترجع آخر واحد، و<kbd>Space</kbd> يشغّل
      ويوقف، ومفاتيح الأسهم تقفز خمس ثوانٍ، وإمساك <kbd>Shift</kbd> مع واحد
      منها يحرّك عشرة أجزاء من الألف من الثانية. وأبطئ التشغيل إن كانت اللحظة
      يصعب اقتناصها."""

[[howto]]
title = "صحّح العلامات."
body = """
 كل صف يمكن تشغيله وحده، أو إعادة
      توقيته بكتابة وقت بعينه فيه، أو تحريكه أعلى الترتيب أو أسفله، أو حذفه.
      وطرفا الجزء المحدَّد يمكن سحبهما على الشكل الموجي، وهو أسرع طريقة لوضع
      علامة على الصمت لا على الشهقة التي قبله. والمجموع في الأعلى هو ما سيبلغه
      التسجيل المنتهي."""

[[howto]]
title = "أبقِها، أو اقطعها."
body = """
 والإبقاء هو الوجه المعتاد:
      فالتسجيل المنتهي هو الأجزاء التي علّمت عليها، موصولةً بترتيبها. أما
      قطعُها فهو العمل الآخر الذي يريده الناس ونادراً ما يجدونه &mdash; علّم
      على التردّدات والهاتف الذي رنّ والبدايات الفاشلة، فيُوصَل ما بقي
      دونها."""

[[howto]]
title = "قُصّه، ونزِّله."
body = """
 كل قَصّة تحطّ عند العيّنة التي
      علّمتها؛ ولا تقريب إلى إطار مفتاحي هنا، لأن الصوت لا مفاتيح له. والشيء
      الوحيد الجدير بالاختيار هو كم من التلاشي يُوضَع على كل وصلة &mdash;
      وخمسة أجزاء من الألف من الثانية تكفي لمنع الطقطقة وهي أقصر بكثير من أن
      تُسمَع تلاشياً. والذي يخرج ملف WAV، يُشغَّل على الصفحة أولاً، ثم
      يُناوَل لتنزيلات متصفحك مباشرة."""

[[faq]]
q = "هل يُرفع صوتي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويعلّم عليه ويقصّه ويكتبه على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع
        اتصالك بالإنترنت وقُصّ تسجيلاً رغم ذلك إن كنت تفضّل التحقّق على أن
        يُقال لك."""

[[faq]]
q = "هل أستطيع الإبقاء على عدة أجزاء من التسجيل نفسه؟"
a = """
        لهذا وُجِد هذا. اضغط <kbd>I</kbd> و<kbd>O</kbd> ما شئت وهو يعمل؛ فكل
        زوج يصير صفاً، والملف المنتهي كل صف موصولاً بترتيبه وقد زال ما عداه.
        ومعظم المقصّات على الإنترنت تعطيك زوج مقابض واحداً وتسألك أي امتداد
        واحد تُبقي، وذلك حسن لتشذيب أول نغمة وآخرها ولا يفيد البتة في الاستماع
        إلى ساعة من مقابلة مرة واحدة والإبقاء على الأجوبة الستة التي تستحق."""

[[faq]]
q = "هل تحطّ القَصّة حيث علّمتها بالضبط؟"
a = """
        نعم، في كل جزء، وفي كل مشغّل. وهذا هو الموضع الوحيد الذي يكون فيه الصوت
        أبسط من الفيديو: فالتسجيل المفكوك ترميزُه مجرى أرقام وكل واحد يقوم
        بنفسه، فلا مقابل لإطار مفتاحي يُقرَّب إليه ولا سبب لأن تبدأ القَصّة
        مبكراً. وتعرض الصفحة رقم العيّنة التي تبدأ عندها النتيجة، وهو العلامة
        التي وضعتها مضروبةً في معدّل العيّنات ومقرَّبة إلى أقرب عيّنة
        كاملة."""

[[faq]]
q = "لماذا قد تطقطق وصلة، وما فائدة التلاشي؟"
a = """
        لأن القَصّ من وسط كلمة إلى وسط أخرى يضع شكلين موجيَّين لا صلة بينهما
        جنباً إلى جنب، والسمّاعةُ المطلوب منها القفز بينهما تُصدِر طقطقة. وليس
        ذلك عيباً في القَصّ &mdash; هو صوت الانقطاع. والعلاج تلاشٍ من بضعة
        أجزاء من الألف من الثانية على جانبَي كل وصلة: طويل بما يكفي كي يصل
        المخروط، وأقصر بكثير من أن يُسمَع تلاشياً. وخمسة أجزاء من الألف هي
        الافتراض ويمكن إطفاؤها. ولا يُوضَع التلاشي إلا على حافّة هي قَصّة
        فعلاً، فالحافّة عند أول التسجيل أو آخره تُترَك كما كانت تماماً."""

[[faq]]
q = "هل أستطيع قطع المقاطع السيّئة بدلاً من ذلك؟"
a = """
        نعم. علّم عليها، ثم اختر &laquo;اقطعها&raquo;: فيُوصَل كل ما
        <em>لم</em> تعلّم عليه بدلاً منها، بترتيبه. وقائمة العلامات نفسها تجيب
        عن السؤالين، فتستطيع التنقّل بينهما ورؤية المدة تتغيّر دون أن تعلّم على
        شيء مرتين."""

[[faq]]
q = "هل أستطيع حفظ علاماتي والعودة إليها؟"
a = """
        نعم. &laquo;احفظ العلامات&raquo; يكتب ملفاً نصّياً صِرفاً &mdash; سطر
        لكل جزء، وبداية ونهاية تفصل بينهما فاصلة &mdash; و&laquo;حمِّل
        العلامات&raquo; يقرأ واحداً. وتُعرَض صيغتان، ثوانٍ صِرفة و
        <code>HH:MM:SS.mmm</code>، وكلتاهما التخطيط الذي يكتبه مقصّ الفيديو على
        هذا الموقع، فالملف المصنوع في مقابل الفيديو يمكن إفلاته على صوته
        والعكس. فالتعليم عمل دقيق ولا ينبغي لأحد أن يفعله مرتين."""

[[faq]]
q = "ما الصيغ التي أستطيع فتحها؟"
a = """
        ما يفكّ متصفحك ترميزه، وهو عملياً MP3 وWAV وFLAC وM4A وAAC، وOgg Vorbis
        وOpus، والصوت الذي داخل فيديو MP4 وM4V وMOV وWebM. والذي يُترَك خارجاً
        هو القائمة القصيرة نفسها التي في كل مكان: AVI وWMA ومعظم ملفات MKV.
        والملف الذي لن يقرأه هذا المتصفح يُرفَض برسالة تقول ذلك، بدل أن يفشل
        في منتصف الطريق."""

[[faq]]
q = "لماذا يحفظ ملف WAV لا MP3؟"
a = """
        لأن أي متصفح لا يأتي بمرمِّز MP3، وهذه الأداة ترفض إرسال تسجيلك إلى
        خادم عنده واحد. وملف WAV لا يحتاج إلى مرمِّز البتة &mdash; هو العيّنات
        وأمامها ترويسة قصيرة &mdash; فهو الخيار الصادق والوحيد الذي لا يمكن أن
        يكلّف جودة في طريق الخروج. وهو أكبر: نحو عشرة ميغابايتات في الدقيقة
        بالستيريو. وكل مشغّل وهاتف ومحرِّر يفتح واحداً، وما أراد MP3 يستطيع
        صنع واحد منه. أما تقصير ملف MP3 بنسخ إطاراته فكان سيبقي الملف صغيراً،
        لكنه كان سينقل كل قَصّة إلى أقرب حدّ إطار، وهو التقريب الذي وُجِدت هذه
        الأداة كي لا تفعله."""

[[faq]]
q = "هل ثمّة حدّ لمدة التسجيل؟"
a = """
        لا حدّ مبنيّاً في الأداة. والسقف العملي الذاكرة: فالتسجيل كله يُفكّ
        ترميزه إلى هذه الصفحة دفعة واحدة، ويُجمَّع ملف WAV في الذاكرة قبل أن
        تنزّله، فساعةٌ بالستيريو تحتاج إلى ما دون غيغابايت للعمل فيه. وملف WAV
        بأربعة غيغابايتات يُرفَض صراحةً، لأن حقل الحجم في الصيغة نفسها لا
        يستطيع وصف واحد."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        تسجيلك."""

[schema]
browser_requirements = "يحتاج إلى JavaScript وإلى متصفح فيه Web Audio، وهو كل متصفح حالي. ولا يحتاج إلى دعم مرمِّزات وراء ما عند المتصفح أصلاً لتشغيل الملف."
description = "علّم على أي عدد من أجزاء تسجيل وهو يعمل، ثم احفظ تلك الأجزاء ملفاً واحداً - أو اقطعها وأبقِ ما عداها. تحطّ القَصّات عند العيّنة المعلَّمة بعينها، مع تلاشٍ اختياري من بضعة أجزاء من الألف من الثانية كي لا تطقطق الوصلات. ولا يُرفع شيء ويُكتَب الناتج WAV، فلا يُعاد ترميز شيء."
