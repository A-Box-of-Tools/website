[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد. وقد كان هذا يقول <code>connect-src 'none'</code>، وكان
      مطلقاً؛ فكلّفت إضافةُ الإعلانات ذلك، وقولُه جزء من الصفقة."""

[[privacy]]
title = "الترميز محليّ."
body = """
 يعمل WebCodecs في متصفحك ويُناوَل الملف
      المنتهي للتنزيل مباشرة. ولا جانب خادمَ لهذا التطبيق."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن صورك: لا ملفاً، ولا
      مصغَّرة، ولا اسماً، ولا حجماً، ولا عدداً. وكل سطر يقرأ صورة أو يفكّ
      ترميزها أو يركّبها أو يرمّزها يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن صورك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "استثناء واحد مقصود."
body = """
 إن استعملت &laquo;أضِف من عنوان
      ويب&raquo;، فسيُتَّصَل بذلك الخادم لجلب الصورة وسيرى عنوان IP الخاص بك.
      ولا يُجلَب إلا الصور التي تلصقها أنت، وواردةً لا غير:
      فـ <code>img-src</code> مفتوح، و<code>connect-src</code> ليس كذلك.
      والعدّاد أدناه يسرد كل أصل خارجي اتُّصِل به."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل شيء يعمل عدا
      التحميل من عنوان ويب. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِت مجلداً على المُنتقي، أو اختر
      الملفات يدوياً. يقرؤها المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان
      أثناء ذلك."""

[[howto]]
title = "رتّبها واضبط كم تبقى كل واحدة."
body = """
 اسحب لإعادة
      الترتيب. ومدة البقاء تُعطى بالإطارات أو بالثواني، لكل الصور دفعة واحدة أو
      لصورة صورة."""

[[howto]]
title = "اختر دقة ومعدّل إطارات."
body = """
 &laquo;طابِق أعلى
      دقة&raquo; يتبع أكبر صورك؛ والإعدادات الجاهزة تغطي 4K و1080p و720p
      والمربّع والطولي، وثمّة مقاس مخصّص إن لم يناسبك واحد منها."""

[[howto]]
title = "أنشئ الفيديو ونزِّله."
body = """
 يجري الترميز على عتادك أنت،
      فمدّته تتوقّف على جهازك لا على طابور. ويُناوَل ملف MP4 المنتهي لتنزيلات
      متصفحك مباشرة."""

[[faq]]
q = "هل تُرفع صوري إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت صورك ويركّبها ويرمّزها على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا.
        والاستثناء الوحيد خاصية &laquo;أضِف من عنوان ويب&raquo; الاختيارية،
        وهي تجلب صورة تلصقها أنت، وذلك الخادم يرى عنوان IP الخاص بك."""

[[faq]]
q = "ما صيغ الصور التي أستطيع استعمالها؟"
a = """
        أي صيغة صورة ساكنة يستطيع متصفحك فكّ ترميزها، وهي عملياً JPG وPNG وWebP
        وGIF وAVIF و&mdash; على أجهزة Apple &mdash; HEIC. ولا قائمة منفصلة
        نحرص على تحديثها هنا، لأن فكّ الترميز عمل المتصفح لا عملنا."""

[[faq]]
q = "ما صيغة الفيديو التي ينتجها؟"
a = """
        MP4 بفيديو H.264، وهو يعمل على كل شيء تقريباً. وفي متصفح بلا WebCodecs
        تتراجع الأداة إلى تسجيل WebM بدلاً منه &mdash; اللقطات نفسها في حاوية
        يقبلها عدد أقلّ من المحرِّرات."""

[[faq]]
q = "هل أستطيع استعمال هذا لمتتالية عرض من Blender أو After Effects؟"
a = """
        نعم &mdash; فمتتالية العرض المرقَّمة هي بالضبط ما وُجِد هذا من أجله.
        أضِف الإطارات التي كتبها برنامج العرض، واترك مدة البقاء إطاراً واحداً
        لكل واحد، واضبط معدّل الإطارات ليطابق العرض. و&laquo;رتّب
        بالاسم&raquo; يعدّ كما تتوقّع أنت، فيحطّ <code>frame_2</code> قبل
        <code>frame_10</code> لا بعده.
        <br><br>
        وثمّة شيء يستحق أن تعرفه قبل أن تبدأ: H.264 ليس فيه قناة ألفا،
        فالشفافية تُسطَّح على لون الخلفية بدل أن تُنقَل. فإن احتجت إلى الإبقاء
        على ألفا، فركّب الإطارات في محرِّرك بدلاً من ذلك."""

[[faq]]
q = "هل أستطيع صنع تايم لابس من صور؟"
a = """
        نعم، وهو العمل نفسه الذي لمتتالية العرض: أبقِ كل صورة إطاراً واحداً
        واختر معدّل إطارات. فعند 30 إطاراً في الثانية تصير كل ثلاثين صورة ثانيةً
        واحدة من الفيديو؛ وعند 12 إطاراً تعمل تلك الصور نفسها ثانيتين ونصفاً.
        <br><br>
        و&laquo;رتّب بالتاريخ&raquo; يعيد لفّة الكاميرا إلى الترتيب الذي
        صُوِّرت به، وذلك يهمّ حين تكون أسماء الملفات قد بدأت من 0001 من جديد.
        ولا بأس بصور مختلفة المقاسات &mdash; فـ &laquo;طابِق أعلى دقة&raquo;
        يجعل مقاس الفيديو بحيث لا تُصغَّر واحدة منها."""

[[faq]]
q = "هل ثمّة حدّ لعدد الصور، أو لمدة الفيديو؟"
a = """
        لا حدّ مبنيّاً في الأداة. والسقف العملي ذاكرةُ جهازك أنت، لأن الفيديو
        المنتهي يُجمَّع فيها قبل أن تنزّله. وعروض الشرائح الكبيرة جداً بدقة 4K
        أول ما يشعر بذلك."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ويحمل الموقع
        إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً لتُعالَج
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

[[faq]]
q = "هل أستطيع إضافة موسيقى أو مسار صوتي؟"
a = """
        ليس بعد. فالأداة تنتج فيديو لا غير: وملف MP4 الذي تكتبه فيه مسار فيديو
        واحد ولا مسار صوت فيه. أضِف المسار الصوتي بعد ذلك في محرِّر فيديو إن
        احتجت إليه."""

