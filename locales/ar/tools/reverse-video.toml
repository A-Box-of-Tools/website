[[privacy]]
title = "مقاطعك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس فيديوك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فكّ الترميز وإعادته محليّان."
body = """
 تمرّ الإطارات عبر
      WebCodecs في متصفحك أنت، أو عبر محرّك التشغيل نفسه الذي كان سيعرض عليك
      المقطع على أي حال. ويُبنى الملف المنتهي في الذاكرة على هذا الجهاز
      ويُناوَل للتنزيل مباشرة."""

[[privacy]]
title = "والصوت يُقلَب هنا كذلك."
body = """
 عكسُ مسار صوتي يعني فكّ ترميزه،
      وذلك الفكّ هو فكُّ المتصفح نفسه، جارياً على هذا الجهاز. ولا شيء يستمع
      إليه، ولا شيء يحتفظ به، ولا شيء يستطيع تمريره إلى أي مكان: فليس هنا مسار
      شيفرة يرسل بايتاً."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن فيديوك: لا ملفاً،
      ولا إطاراً، ولا اسماً، ولا حجماً، ولا مدةً. وكل سطر يقرأ أو يفكّ ترميزاً
      أو يعكس أو يرمّز يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن فيديوك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر فيديو."
body = """
 أفلِت ملف MP4 أو MOV أو M4V أو WebM على
      المُنتقي، أو اختر واحداً يدوياً. يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل
      شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "احسم أمر الصوت."
body = """
 &laquo;اعكس الصوت كذلك&raquo; يقلب
      المسار عيّنةً عيّنة، وهو ما يجعل الكلام يخرج كلاماً مقلوباً لا صمتاً.
      أطفئه لمقطع صامت، وذلك أسرع."""

[[howto]]
title = "اختر كم من الجودة تُنفَق."
body = """
 لا بدّ من إعادة ترميز
      الصورة، لأن الإطارات تخرج بترتيب لم يُرمَّز له شيء في الملف. و
      &laquo;متوازن&raquo; يبقى قريباً مما أنفقه الأصل؛ و&laquo;أفضل
      جودة&raquo; ينفق أكثر."""

[[howto]]
title = "اعكسه ونزِّله."
body = """
 يجري العمل على عتادك أنت، فمدّته
      تتوقّف على جهازك لا على طابور. ويُناوَل الفيديو المنتهي لتنزيلات متصفحك
      مباشرة."""

[[faq]]
q = "هل يُرفع فيديوي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويفكّ ترميزه ويعكسه ويرمّزه على جهازك أنت. ولا
        جانب خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة
        بالصفحة تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا.
        اقطع اتصالك بالإنترنت واعكس مقطعاً رغم ذلك إن كنت تفضّل التحقّق على أن
        يُقال لك."""

[[faq]]
q = "ما صيغ الفيديو التي أستطيع عكسها؟"
a = """
        MP4 وM4V وMOV تُقرأ مباشرة، مهما كان بداخلها: H.264 أو HEVC أو AV1 أو
        VP9، ما دام متصفحك يستطيع فكّ ترميز ذلك المرمِّز. وكل ما عداها مما
        يستطيع متصفحك تشغيله &mdash; وWebM أظهرها &mdash; يُعكَس بتخطية مشغّل
        المتصفح نفسه إلى الوراء عبره، وذلك يعمل لكنه أبطأ. أما الملف الذي لا
        يستطيع المتصفح قراءته ولا تشغيله، وهو عملياً AVI وWMV وFLV ومعظم ملفات
        MKV، فيُرفَض برسالة تقول ذلك بدل أن يفشل في منتصف الطريق. والذي يخرج
        دائماً MP4."""

[[faq]]
q = "هل يُعكَس الصوت كذلك؟"
a = """
        نعم، ما لم تطفئه. يُفكّ ترميز المسار كله، وتُوضَع العيّنات بالترتيب
        الآخر، ويُعاد ترميزه AAC. ولا سبيل إلى تفادي ذلك الترميز الثاني: فحزمة
        الصوت بضع عشرات من الأجزاء من الألف من الثانية مرمَّزة في مقابل الحزمة
        التي قبلها، فكتابةُ الحزم من آخرها إلى أولها كانت ستشغّل قطعاً قصيرة
        إلى الأمام بترتيب خطأ &mdash; وذلك يبدو عطلاً لا عكساً."""

[[faq]]
q = "هل يُفقد العكسُ شيئاً من الجودة؟"
a = """
        تُرمَّز الصورة مرة ثانية، وذلك يكلّف قليلاً. ولا يمكن تفاديه هنا كما
        يمكن عند التقصير: فالمقطع المعكوس يعرض إطاراته بترتيب لم يُرمَّز له شيء
        في الملف الأصلي، فوجب أن يُكتَب كل إطار من جديد. والذي لن تفعله الأداة
        أن تنفق أكثر مما أنفق الأصل، إذ الترميز فوق ذلك لا يزيد إلا حجم
        الملف دون أن يحسّن منظره."""

[[faq]]
q = "هل ثمّة حدّ لحجم الفيديو أو مدّته؟"
a = """
        لا حدّ مبنيّاً في الأداة، ولا يُقرأ الملف إلى الذاكرة دفعة واحدة
        &mdash; بل يُمشى فيه مجموعةَ إطارات بعد مجموعة، إلى الوراء. والسقفان
        العمليان هما الفيديو المنتهي، إذ يُجمَّع في الذاكرة قبل أن تنزّله،
        والصوت، إذ يجب حفظه كاملاً لأن العكس يحتاج إلى آخر عيّنة قبل أن يستطيع
        كتابة أولاها."""

[[faq]]
q = "لماذا هو أبطأ في ملفات منه في أخرى؟"
a = """
        لأن المدخلين اثنان. فملف MP4 أو MOV تقرؤه هذه الأداة مباشرة وتفكّ
        ترميزه مجموعةَ إطارات في كل مرة، وذلك بسرعة جهازك. وما عداه يُعكَس
        بسؤال مشغّل المتصفح نفسه عن لحظة من المقطع بعد لحظة، وكل تخطية من تلك
        تجعل المتصفح يفكّ الترميز من الإطار المفتاحي الذي أمامها. وتقول الصفحة
        أي الطريقين تستعمل، ولماذا، قبل أن تبدأ."""

[[faq]]
q = "هل أستطيع عكس جزء من مقطع فقط؟"
a = """
        ليس هنا. فهذه الأداة تعكس الشيء كله: والمقطع الذي يخرج بطول الذي دخل
        بالضبط، وآخر إطار أولاً. اقطع الجزء الذي تريده أولاً بـ
        <a href="../تقصير-الفيديو/">مقصّ الفيديو</a> &mdash; وهو يفعل ذلك دون
        إعادة ترميز إطار واحد &mdash; ثم اعكس ما يخرج منه."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        فيديوك."""

