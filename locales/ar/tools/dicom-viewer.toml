[[privacy]]
title = "صورتك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد. وقد كان هذا يقول <code>connect-src 'none'</code>، وكان
      مطلقاً؛ فكلّفت إضافةُ الإعلانات ذلك، وقولُه جزء من الصفقة."""

[[privacy]]
title = "هذا هنا أهمّ منه في بقية الصفحات."
body = """

      ملف DICOM ليس صورة عليها بعض البيانات الوصفية. هو سجلّ طبي فيه صورة: فاسم
      المريض، وتاريخ ميلاده، ورقمه في المستشفى، ورقم الطلب، والطبيب المُحيل،
      والمؤسسة، والرقم التسلسلي للجهاز، كلها حقول في الترويسة، وكلها تسافر مع
      الملف حيثما ذهب. ورفعُ واحد منها إلى موقع لتنظر إليه يعني مناولة ذلك كله
      لمن يدير الموقع. وذلك هو الشيء الذي وُجِدت هذه الصفحة كي لا تفعله."""

[[privacy]]
title = "القارئ أربعة عشر ملفاً في هذا المستودع."
body = """
 ولا شيء هنا يستعمل
      مكتبة مجلوبة من أي مكان. فـ <code>src/dicom.js</code> يمشي في الملف، و
      <code>src/dictionary.js</code> يعرف أسماء الوسوم، و
      <code>src/pixels.js</code> يعيد البايتات قياسات، و<code>src/rle.js</code>
      و<code>src/jpeg-lossless.js</code> يفكّان الصيغتين المضغوطتين اللتين
      تستطيع هذه الصفحة فكّهما، و<code>src/window.js</code> يُسقِط ما قِيس على
      رماديّات شاشتك."""

[[privacy]]
title = "المعرِّفات تُسرَد لك أنت، ولا أحد سواك."
body = """

      تطبع الصفحة كل حقل في ملفك يُسمّي الشخص الذي هي له أو يضيّق دائرة مَن قد
      يكون، لأن ذلك سؤالٌ يحتاج من هو على وشك مشاركة شريحة إلى جوابه ولا يجيبه
      عارض. ويُوضَع على الشاشة أمامك ولا يذهب إلى أي مكان آخر: فلا حدث تحليلات
      في هذا المستودع يحمل شيئاً منه، ولا تستطيع الصفحة إرسال واحد لو وُجد."""

[[privacy]]
title = "يقرأ. ولا يكتب."
body = """
 لا يوجد هنا زرٌّ يغيّر ملفك، ولا شيفرة
      تستطيع ذلك. والذي يمكنك أخذه صورةُ PNG للإطار الذي على الشاشة ونسخةٌ نصّية
      من الترويسة، وكلتاهما مبنيّة في الصفحة مما هو عليها أصلاً. وأصلك على قرصك
      لم يُمسّ، وهو أيضاً الجواب الصادق عمّا يحدث إن أغلقت التبويب."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن ملفك: لا البكسلات،
      ولا مصغَّرة، ولا اسم، ولا وسم، ولا مريض، ولا اسم ملف. وكل سطر يحلّل صورة
      أو يفكّ ترميزها أو يرسمها يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن ملفاتك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، ويظل كل جزء من هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل صورتك بعيداً
      لتُعرَض كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

[[howto]]
title = "اختر الملفات."
body = """
 ملف <code>.dcm</code> واحد، أو المجلد كله
      من القرص &mdash; فصورة CT أو MR ملفٌّ لكل شريحة، وإفلاتُها كلها دفعة
      واحدة هو ما يعيد بناء السلسلة. ويقرأ المتصفح الملفات من قرصك مباشرة؛ ولا
      يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اختر السلسلة."
body = """
 الدراسة تحمل عدة سلاسل عادةً: الصورة
      الاستطلاعية، ثم كل اكتساب. وتُرصَف كل واحدة بالترتيب الذي أخذها به
      الجهاز، مستنتَجاً من موضع كل شريحة في المريض لا من الترقيم، فالترقيم ليس
      دائماً في الاتجاه نفسه."""

[[howto]]
title = "اضبط النافذة."
body = """
 هذا هو التحكّم الذي يجعل الصورة
      مقروءة، وهو الذي لا يملكه محرِّر الصور. اسحب عبر الصورة لتوسيع النافذة،
      وإلى أعلى أو أسفل لتحريك مركزها، أو اختر إحدى النوافذ المسمّاة &mdash;
      الرئة، والعظم، والدماغ، والأنسجة الرخوة &mdash; على صورة CT، حيث الوحدات
      هي هي على كل جهاز في العالم."""

[[howto]]
title = "تصفّح الرصّة."
body = """
 المِزلاج تحت الصورة يتنقّل بين
      الشرائح، ومفاتيح الأسهم تفعل الشيء نفسه متى نقرت على الصورة. والملف
      متعدّد الإطارات &mdash; حلقة موجات فوق صوتية، أو تصوير أوعية &mdash;
      يُشغَّل بالزر الذي بجانبه."""

[[howto]]
title = "قِس شيئاً."
body = """
 حوِّل إلى &laquo;قياس&raquo; واسحب خطاً.
      فحيث يقول الملف كم تبعد بكسلاته بعضها عن بعض، يأتي الجواب بالمليمترات
      ويأخذ في حسابه البكسلات غير المربّعة؛ وحيث لا يقول الملف، يأتي الجواب
      بالبكسلات ويقول ذلك بدل أن يخترع مقياساً."""

[[howto]]
title = "اقرأ الترويسة."
body = """
 كل عنصر في الملف، برقمه، وبما يسمّيه
      المعيار، وبما يحمله، قابلاً للبحث. وفوقه قائمةُ ما يعرّف المريض في هذا
      الملف بعينه &mdash; وهو أكثر بكثير من الاسم."""

[[howto]]
title = "خذ ما تحتاجه."
body = """
 الإطار الذي على الشاشة بصيغة PNG،
      بالنافذة التي ضبطتها ولا شيء محروق فيه، أو الترويسة كلها نصّاً صِرفاً.
      وكلاهما مبنيّ في الصفحة مما هو فيها أصلاً."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويفكّ ترميزه ويرسمه على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع
        الاتصال بالشبكة وستظل تفتح الصور.
        <br><br>
        وذلك هنا أثمن منه في أي صفحة أخرى من هذا الموقع. فملف DICOM يحمل اسم
        المريض وتاريخ ميلاده ورقمه في المستشفى في ترويسته، فرفعُ واحد منها إلى
        عارض يعني مناولة غريبٍ سجلّاً طبياً، لا صورة."""

[[faq]]
q = "ما ملفات DICOM التي يستطيع فتحها؟"
a = """
        الملفات غير المضغوطة في أي من صيغ النقل الأساسية الثلاث &mdash; الضمنية
        والصريحة بترتيب البايت الصغير أولاً، والصيغة المتقاعدة بترتيب البايت
        الكبير أولاً &mdash; ومعها المنكمشة، وRLE Lossless، وJPEG الأساسية،
        وJPEG Lossless، وهي التي ضُغِط بها أكثر دراسات CT وMR على أقراص
        المستشفيات.
        <br><br>
        ولا يستطيع فكّ ترميز JPEG 2000 ولا JPEG-LS ولا صيغتَي MPEG وHEVC
        المستعملتين للفيديو. فتلك تحتاج إلى مرمِّزات هي ميغابايتات من مكتبة
        مُصرَّفة، وصفحةٌ تنزّل واحدة عند الطلب لن تكون صفحة تعمل دون اتصال.
        والملف بإحداها يُفتَح رغم ذلك: فتُقرأ الترويسة كلها وتُعرَض، ويُستبدَل
        بالصورة سطرٌ يُسمّي المرمِّز، بدل أيقونة صورة معطوبة لا تقول لك شيئاً."""

[[faq]]
q = "ما &laquo;النافذة والمستوى&raquo;، ولماذا أحتاج إليهما؟"
a = """
        شريحة CT تحمل نحو أربعة آلاف قيمة متمايزة، وشاشتك تعرض ستة وخمسين
        ومئتين من الرماديّات. والنافذة هي اختيار أي شريحة من ذلك المدى تنال
        الرماديّات كلها: فما دونها أسود، وما فوقها أبيض، وما بينهما مبسوط على
        الرماديّات.
        <br><br>
        ولهذا يبدو الملف نفسه صورةً أخرى تحت إعدادين، ولهذا لا يمكن رؤية الرئة
        والعظم معاً. وعلى صورة CT تكون الأرقام وحدات هاونسفيلد، وهي معرَّفة
        تعريفاً مطلقاً &mdash; الماء 0 والهواء &minus;1000 &mdash; فالنوافذ
        المسمّاة على هذه الصفحة هي الأرقام نفسها التي يستعملها أخصائي الأشعة
        على محطة عمله. أما على MR أو الموجات فوق الصوتية فلا مقياس كهذا،
        والنافذة التي تُفتَح هي التي يطلبها الملف نفسه."""

[[faq]]
q = "لماذا يقول إن قياسي بالبكسلات؟"
a = """
        لأن ذلك الملف لا يقول كم يبلغ حجم البكسل. فـ Pixel Spacing (0028,0030)
        هو ما يحمل ذلك، بالمليمترات، وكثير جداً من صور الموجات فوق الصوتية
        والمستندات الممسوحة ضوئياً واللقطات الثانوية لا تحمله ببساطة.
        <br><br>
        وحيث يكون موجوداً، يأتي القياس بالمليمترات ويُقاس كل محور بتباعده هو،
        وذلك مهمّ في الصور التي بكسلاتها ليست مربّعة. وحيث لا يكون، فالجواب
        الصادق عددُ بكسلات، وهذا يقول ذلك بدل أن يختار مقياساً ويقدّم النتيجة
        على أنها طول."""

[[faq]]
q = "فتح مجلدي على أنه عدة سلاسل. لماذا؟"
a = """
        لأن ذلك ما فيه. فالدراسة مكوَّنة من سلاسل &mdash; الصورة الاستطلاعية،
        ثم كل اكتساب أو إعادة بناء &mdash; وكل ملف يقول إلى أيها ينتمي في
        Series Instance UID (0020,000E). والقائمة المنسدلة مبنيّة من ذلك لا من
        المجلد، فالمجلد فيه عادةً كلها مختلطة في قائمة أسماء واحدة.
        <br><br>
        وداخل السلسلة تُرتَّب الشرائح بموضع كل واحدة في المريض، مستنتَجاً من
        Image Position وImage Orientation. أما Instance Number فهو المفتاح
        البديهي وهو البديل لا الخيار الأول: إذ يسنده ما كتب الملفات، وليس عليه
        أن يجري في الاتجاه الذي يجري فيه المريض."""

[[faq]]
q = "ماذا تعني قائمة &laquo;ما يعرّف المريض&raquo;؟"
a = """
        هي كل حقل في ملفك يُسمّي الشخص الذي الصورة له، أو يضيّق دائرة مَن قد
        يكون، مقروءاً من هذا الملف على جهازك. والقائمة مأخوذة من PS3.15 من
        معيار DICOM &mdash; الجزء الذي يقول ما الذي يجب أن يزول قبل أن تُسمّى
        مجموعة بيانات منزوعةَ الهوية.
        <br><br>
        وهي هناك لأن الذي يخطئ فيه الناس ليس أن في الصورة اسماً. بل كم فيها من
        غيره: تاريخ الميلاد، ورقم الطلب، والطبيب المُحيل، والمؤسسة، والرقم
        التسلسلي للجهاز، ومعرِّفات الدراسة، وهي مفاتيح تامّة تعود بك إلى
        الأرشيف الذي صنع الملف. فالصورة التي مُحي منها الاسم لا غير ليست
        مجهولة الهوية.
        <br><br>
        وهذه الأداة تعرض عليك لا أكثر. فهي لا تكتب شيئاً ولا تغيّر شيئاً، فلا
        تستطيع إخراج شيء من ذلك."""

[[faq]]
q = "هل يستطيع نزع هوية صورة؟"
a = """
        لا، وهو لا يتظاهر بذلك عن قصد. فهذه الصفحة تقرأ؛ وليس فيها شيفرة تكتب
        ملف DICOM. والذي تفعله أن تقول لك بالضبط ما في ملفك، وهو الجزء الذي
        يصعب معرفته والجزء الذي يخطئ فيه الناس.
        <br><br>
        أما الأداة التي تُخرِج المعرِّفات فعملٌ منفصل وسقفه أعلى بكثير &mdash;
        عليها أن تعيد كتابة الملف دون أن تمسّ البكسلات، وأن تستبدل المعرِّفات
        استبدالاً متّسقاً عبر دراسة كاملة، وأن تكون مصيبة في العناصر الخاصة
        التي تخبّئ فيها بعض الأجهزة نسخة ثانية من الاسم. وهي على خارطة طريق
        هذا الموقع لا مركَّبة على عارض."""

[[faq]]
q = "هل يستطيع فتح ملف بلا امتداد ‎.dcm‎، أو ملف معطوب؟"
a = """
        نعم للاثنين. فالامتداد لا يُنظَر إليه: والذي يُفحَص الملفُ نفسه.
        ومجموعة البيانات المكتوبة دون المقدّمة المعتادة ذات الـ 128 بايتاً
        &mdash; وهي هيئة الصورة المسحوبة من الشبكة مباشرة &mdash; تُقرأ
        باستنتاج ترميزها من عنصرها الأول، وتقول الصفحة إن ذلك ما فعلته.
        <br><br>
        والملف الذي ينتهي في منتصفه يُقرأ إلى حيث يبلغ. فيُعرَض كل ما قبل
        العطب، ومعه ملاحظة تقول عند أي بايت توقّف. وتلك هي الحالة التي يُطلَب
        فيها العارض أشدّ الطلب، فرميُ الملف كله من أجل بايتاته الاثنتي عشرة
        الأخيرة كان سيكون السلوك الخطأ."""

[[faq]]
q = "هل هذا عارض تشخيصي؟"
a = """
        لا. فهو ليس جهازاً طبياً، ولم يمرّ بأي تقييم تنظيمي، ولا ينبغي أن
        يُستعمَل شيء هنا لاتخاذ قرار سريري. فشاشتك غير معايَرة، والمتصفح ليس
        سلسلة عرض مُصادَقاً عليها، ولا يمكن إصلاح أيٍّ من الاثنين من داخل صفحة
        ويب.
        <br><br>
        والذي يصلح له كلُّ ما عدا ذلك مما يفتح الناس صورةً من أجله: التحقّق مما
        على قرص، وسحب شريحة لعرض تعليمي أو لبحث، وقراءة ترويسة، ومعرفة لماذا
        يرفض برنامج آخر الملف، ورؤية ما تحمله الصورة عن الشخص الذي هي له."""

[[faq]]
q = "هل يغيّر ملفي؟"
a = """
        لا. فهذه الأداة تقرأ لا غير. ولا ملف خَرج ولا إعادة ترميز ولا زرّ هنا
        يكتب ملف DICOM &mdash; والذي يمكنك تنزيله صورةُ PNG للإطار الذي على
        الشاشة ونسخةٌ نصّية صِرفة من الترويسة. وأصلك على قرصك لم يُمسّ."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ولا حدّ لحجم الملف
        ولا لعدد ما تفتحه من الملفات إلا ذاكرة جهازك أنت. ويحمل الموقع
        إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن ملفك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورتك بعيداً لتُعرَض
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

