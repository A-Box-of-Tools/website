#
# عارض DICOM - Arabic.
#
# Overrides for tools/dicom-viewer/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# DICOM element names keep their English and their numbers - Pixel Spacing
# (0028,0030), Series Instance UID (0020,000E), Instance Number, PS3.15. That
# is the same decision the site already took for EXIF tag names and it holds
# for the same reason, more strongly: somebody reading this page is comparing
# it against a header dump, a standard, or another program's error message,
# and all three say the English.
#
# CT, MR and PET stay Latin because that is what Arabic-speaking radiology
# says and writes. X-ray and ultrasound are words rather than acronyms, so
# they are Arabic: الأشعة السينية، الموجات فوق الصوتية.
#

