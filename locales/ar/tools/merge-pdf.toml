[[privacy]]
title = "مستنداتك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. وهذه الأداة لا تضيف شيئاً إلى تلك القائمة: فليست لها وظيفة
      شبكية خاصة بها، ولا حتى اختيارية. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك،
      ولا في الشيفرة ما يرسلها إليه لو وُجد."""

[[privacy]]
title = "الدمج هو العمل الأجدر بألا يُرفَع."
body = """
 فالمستندات التي
      يضمّها الناس بعضها إلى بعض هي التي جاءت من مكان ما: عقدٌ وصفحةُ توقيعه،
      وصورةُ جواز سفر وكشفُ حساب بنكي، ورسالةٌ طبية واستمارةُ مطالبة. والدامج
      الذي على الإنترنت عنده ذلك كله، في مكان واحد، مرتَّباً أصلاً. أما هذا
      فعنده صفحةٌ في متصفحك ولا نصف آخر له."""

[[privacy]]
title = "الصيغة كلها في هذا المستودع."
body = """
 ملف PDF قائمةُ كائنات
      وجدولٌ بمواضع بداية كل واحد. فـ <code>src/objects.js</code> يقرأ ذلك
      النحو، و<code>src/reader.js</code> يتبع الجدول، و
      <code>src/assemble.js</code> ينسخ الصفحات بين المستندات، و
      <code>src/writer.js</code> يكتب الناتج. وليس في واحد من الأربعة ما
      يستورد شيئاً يستطيع إرسال طلب. ولا مكتبة تُجلَب ولا شيء يُعرَض على
      خادم."""

[[privacy]]
title = "الملفات المشفَّرة تُردّ لا تُفتَح."
body = """

      ملف PDF عليه كلمة مرور يُرفَض، ومن ذلك النوع الذي تنتجه الماسحات بكلمة
      مرور فارغة والذي كان سيُفتَح تقنياً. فنزعُ الحماية عن مستند عملٌ آخر غير
      تحريك صفحاته، وفعلُه في صمت شيء يفاجئ من أداة أن تفعله نيابةً عنك."""

[[privacy]]
title = "الملف المنتهي لا يقول شيئاً عن مكان صنعه."
body = """

      لا سطر مُنتِج، ولا تاريخ إنشاء، ولا اسم للأداة. ولا يحمل كذلك حزمة XMP
      ولا الكتل الخاصة التي يتركها برنامج التنضيد وراءه &mdash; فتلك تخصّ
      المستند الذي كان لا الذي بنيته للتوّ. أما ما في الصفحات نفسها فيُنسَخ
      بالضبط: فهذه الأداة تنقل الصفحات ولا تعيد كتابة ما عليها."""

[[privacy]]
title = "الإجراءات التي ليست &laquo;اذهب إلى صفحة&raquo; لا تُنسَخ."
body = """

      قد يحمل ملف PDF تعليمات تعمل عند فتحه: شغّل هذا، وأرسِل هذه الاستمارة إلى
      ذلك العنوان، ونفِّذ هذا الـ JavaScript. والصفحات التي تمرّ بهذه الأداة
      تحتفظ بروابطها إلى صفحات أخرى وإلى عناوين ويب، وتفقد ما عدا ذلك. فإعادةُ
      ترتيب صفحات أحدهم ليست سبباً لحمل برمجة مستنده إلى ملفك الجديد."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن مستنداتك: لا ملفاً،
      ولا صفحةً، ولا اسماً، ولا حجماً، ولا عدد صفحات. وكل سطر يقرأ ملف PDF أو
      ينسخه أو يكتبه يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن مستنداتك. ولا يحدث شيء ما
      لم تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل مستنداتك بعيداً
      لتُدمَج كانت ستتوقف."""

[[howto]]
title = "اختر ملفات PDF."
body = """
 أفلِتها على المُنتقي أو اخترها
      يدوياً، وأضِف غيرها بعد ذلك &mdash; فصفحات كل ملف تذهب إلى آخر الترتيب
      الجاري، وهو ما يجعل دمج مجلدين على حدة ممكناً. ويقرؤها المتصفح من قرصك
      مباشرة."""

[[howto]]
title = "رتّب الصفحات كما تريد."
body = """

      اسحب صفحة من مقبضها، أو ادفعها بالأسهم. أدِر واحدة مُسِحت ضوئياً على
      جنبها، أو أخرِج واحدة، أو اكتب <code>1-3, 8, 12-</code> في الحقل لتُبقي
      مجرىً منها أو تزيله أو تديره دفعة واحدة. وتُعاد الأرقام مع عملك، فيكون ما
      تراه هو ما سيكونه الملف المنتهي دائماً."""

[[howto]]
title = "قل هل يخرج مستنداً واحداً أم عدة."
body = """

      والواحد هو الجواب المعتاد. أما البقية فطرق في القطع: كل كذا صفحة، أو عند
      أرقام صفحات تسمّيها، أو ملف لكل صفحة، أو رجوعاً إلى الملفات التي جاءت
      منها الصفحات. وأكثر من ملف يُناوَل في ملف ZIP واحد، فيكون حفظاً واحداً
      لا خمسين."""

[[howto]]
title = "ابنِه، واقرأ السطر الذي يقول إنه فُحِص."
body = """

      متى كُتِبت المستندات، فُتِح كل واحد من جديد بالقارئ نفسه الذي على هذه
      الصفحة وعُدّت صفحاته. فإن خالف ذلك ما طلبته، أُبلِغ عن الجولة بأنها فشلت
      ولم يُعرَض تنزيل."""

[[faq]]
q = "هل تُرفع ملفات PDF عندي إلى أي مكان؟"
a = """
        لا. يقرؤها متصفحك أنت وينسخها ويكتبها على جهازك أنت. ولا جانب خادمَ
        لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. وليست
        لهذه الأداة وظيفة شبكية اختيارية البتة."""

[[faq]]
q = "كم ملفاً أستطيع دمجه، وما حجمها الأقصى؟"
a = """
        لا حدّ مكتوباً في الأداة. والحدّ جهازك أنت: فالمستندات تُحفَظ في
        الذاكرة أثناء العمل عليها، فحاسوب محمول سيدمج بضع مئات من الميغابايتات
        دون شكوى وسيتعثّر في مكان ما فوق ذلك. ولا شيء يُحاسَب عليه ولا يُخنَق
        ولا يُوسَم بعلامة مائية ولا يُوضَع في طابور، لأنه لا أحد في الطرف الآخر
        ليفعل شيئاً من ذلك."""

[[faq]]
q = "هل يُفقد الدمج أو التقسيم شيئاً من الجودة؟"
a = """
        لا. فلا شيء على صفحة يُعاد ترميزه ولا عرضه ولا ضغطه. ومجرى محتوى كل
        صفحة وكل خطّ وصورة ورسم متجهي تشير إليه، كلها تُنسَخ بايتاً بايتاً،
        فيبقى النصّ قابلاً للتحديد والبحث وتبقى الصورة الفوتوغرافية هي هي.
        والذي يتغيّر ترتيبُ الصفحات والبنيةُ حولها لا غير."""

[[faq]]
q = "ماذا يحدث للإشارات المرجعية والروابط؟"
a = """
        كلاهما يُعاد بناؤه لا يُسقَط. فالإشارة المرجعية التي صفحتها ما زالت في
        الخَرج تشير إلى حيث انتقلت تلك الصفحة؛ والتي أزلت صفحتها تُخرَج، إلا أن
        تكون تحتها مُدخَلات ناجية، فتبقى عنواناً. ودمجُ عدة ملفات يضع إشارات كل
        ملف تحت عنوان مسمّى باسمه. والروابط بين الصفحات تُتبَع على النحو نفسه،
        ومنها الوجهات المسمّاة التي يكتبها Word وLaTeX، والرابط الذي لم يأتِ
        هدفه معه يُترَك بلا شيء وراءه بدل أن يرسل القارئ إلى موضع خطأ. أما
        الروابط إلى عناوين ويب فتبقى كما هي."""

[[faq]]
q = "ما الذي لا يُنقَل؟"
a = """
        أربعة أشياء، وتقولها الأداة على النتائج لا في الحواشي الصغيرة. شجرةُ
        ترتيب القراءة الموسومة التي تستعملها قارئات الشاشة، وتسمياتُ الصفحات
        (ترقيم &laquo;iii، iv، 1، 2&raquo;)، والملفاتُ المرفقة المضمَّنة، وأي
        إجراء ليس &laquo;اذهب إلى صفحة&raquo; ولا &laquo;افتح عنوان ويب&raquo;
        &mdash; ومنه JavaScript المستند. فالأولان يصفان ترتيباً لم يعد قائماً
        متى تحرّكت الصفحات؛ والأخير ليس شيئاً طلبت حمله إلى ملف جديد. فإن كان
        وسمُ مستند يهمّك، فاحتفظ بالأصل كذلك."""

[[faq]]
q = "هل تنجو الاستمارات المملوءة؟"
a = """
        نعم. فحقول الاستمارة وما كُتِب فيها تأتي مع صفحاتها، ويُسجَّل المستند
        الجديد استمارةً فتعامله القارئات على أنه كذلك. وثمّة شيء تعرفه عند
        الدمج: حقلان بالاسم نفسه حقلٌ واحد عند أي قارئ، فإن دمجت نسختين من
        الاستمارة نفسها، فملءُ خانة في صفحة سيملؤها في الأخرى. والأداة تنتبه
        لتلك الحالة وتقولها."""

[[faq]]
q = "هل يستطيع فتح ملف PDF محميّ بكلمة مرور؟"
a = """
        لا، وذلك مقصود. فالمستند المشفَّر يُرفَض برسالة تقول ذلك، حتى حين تكون
        كلمة المرور فارغة &mdash; وهو ما تحفظ به كثير من الماسحات والناسخات.
        فنزعُ الحماية عن ملف عملٌ آخر غير تحريك صفحاته، والأداة التي تفعله في
        صمت تكون قد فعلت ما لم تطلبه."""

[[faq]]
q = "لماذا لا توجد معاينات للصفحات؟"
a = """
        لأن رسم صفحة يعني عارض PDF كاملاً &mdash; خطوطاً وتظليلاً ومجموعات
        شفافية وأنماط مزج &mdash; وهو ميغابايت أو أكثر من المحرّك يُجلَب
        ويُشغَّل من أجل طقم مصغَّرات. والذي تعرضه المربّعات بدلاً من ذلك هو ما
        تعمل عليه إعادة الترتيب فعلاً: رقمُ الصفحة، ونسبةُ الورق ومقاسه،
        والدورةُ التي ستُكتَب بها، ومن أي ملف خرجت. فالمسحُ العرضي في رصّة من
        الطولية يظلّ بيّناً بنظرة."""

[[faq]]
q = "هل سيُفتَح الملف المنتهي في كل مكان؟"
a = """
        نعم. يُكتَب الخَرج بصيغة PDF 1.5 أو بأعلى إصدار احتاجه أيٌّ من الملفات
        التي أعطيتها إياه، و1.5 يفهمه كل قارئ شُحِن منذ 2003. والأداة تبرهن على
        ذلك على جهازك أنت كذلك: إذ تفتح كل ملف منتهٍ من جديد وتعدّ صفحاته
        بالمشي في شجرة الصفحات قبل أن تعرضه عليك."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لحجم الملف
        غير ما تسمح به ذاكرة جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع
        تكاليفه؛ ولا يُعطى المعلنون شيئاً عن مستنداتك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل مستنداتك بعيداً لتُدمَج
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

