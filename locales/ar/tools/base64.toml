[[privacy]]
title = "ليس لما تلصقه مكان يذهب إليه."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده رمزٌ مميز ملصوق، ولا في الشيفرة
      ما يرسله إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. وكلُّ مرمِّز
      وكلُّ مفكِّكٍ دوالُّ في هذه الصفحة تأخذ سلسلة وتعيد سلسلة."""

[[privacy]]
title = "المفكِّك يخبرك حين يكون شيء ما خاطئاً."
body = """
 فـ <code>atob</code> الخاص بالمتصفح
      يقبل مدخلات كان عليه رفضها ويعيد شيئاً معقول الشكل. أما Base64 هنا
      فمكتوب يدوياً ويُختبر على متّجهات اختبار RFC&nbsp;4648، وإذا لم يكن ما
      لصقته Base64 قال ذلك، وقال السبب. والاختبارات في
      <code>tests/js/text-encode.test.js</code> تختبر ذلك بعينه."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها محرفاً واحداً من نصّك. وكل سطر يقرؤه أو يحلّله أو يكتبه يُخدَم من
      هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر الترميز."
body = """
 Base64 بأبجديتَيه، والترميز المئوي لقيمة
      واحدة أو لعنوان كامل، وكيانات HTML الخمسة، والبايتات السداسية عشرية،
      وهروبات الشرطة المائلة العكسية في نصوص الشيفرة. والملاحظة تحت القائمة
      تقول فيمَ يُستعمل كلٌّ منها."""

[[howto]]
title = "اختر الاتجاه."
body = """
 <em>رمِّز</em> يأخذ نصاً صريحاً ويخرج
      الصيغة المرمَّزة؛ و<em>فكِّك</em> يعيد الصيغة المرمَّزة نصاً صريحاً.
      والنتيجة تتبع كتابتك: فتغيير الاتجاه نقرة واحدة، ولا شيء يُكتب من
      جديد."""

[[howto]]
title = "الصقه، أو أفلِت الملف."
body = """
 كلُّ ما تستطيع تحديده ونسخه
      يعمل. والملفُّ المُفلَت على المُنتقي يقرؤه متصفحك أنت ويضعه في الحقل
      &mdash; فلا خطوة رفع تُغفَل."""

[[howto]]
title = "اقرأ الخطأ إن وُجد."
body = """
 المفكِّك الذي يفشل هنا يقول ما وجده
      &mdash; محرفاً لا يستعمله Base64، أو حشواً في غير موضعه، أو بايتات ليست
      نصاً &mdash; بدل أن يعيد شيئاً معقول الشكل وخاطئاً."""

[[howto]]
title = "خذ النتيجة."
body = """
 انسخها، أو نزِّلها ملفاً نصّياً.
      والعدّادات تحت الحقل تقول كم بايتاً دخل وكم بايتاً خرج."""

[[faq]]
q = "هل يُرفع نصّي إلى أي مكان؟"
a = """
        لا. كلُّ مرمِّز وكلُّ مفكِّكٍ على هذه الصفحة دالّةٌ تعمل في متصفحك
        أنت، على جهازك أنت. وليست لهذه الأداة وظيفة شبكية من أي نوع &mdash;
        فهي لا تجلب شيئاً ولا ترسل شيئاً أبداً &mdash; و
        <code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل عنوان
        يجوز لها الاتصال به، وليس واحد منها لنا. وذلك هو سبب استعمالها لرمز
        وصول مميز أو كعكة جلسة: فلصقُ واحد من تلك في مفكِّك شخص آخر إعطاؤه
        إياه."""

[[faq]]
q = "هل Base64 هنا هو Base64 نفسه الذي في كل مكان؟"
a = """
        نعم &mdash; وهو مفحوص في مقابل متجهات الاختبار في RFC 4648 لا في مقابل
        نفسه. والأبجديتان كلتاهما تُفكّ، فرمزُ JWT المكتوب بـ <code>-</code> و
        <code>_</code> يُقرأ بيسر قراءةِ واحد مكتوب بـ <code>+</code> و
        <code>/</code>، والدخلُ الملفوف عند 64 محرفاً يُفَكّ لفّه عنك. والترميز
        ببايتات UTF-8، فينجو الحرف المشكول أو الرمز التعبيري من الرحلة ذهاباً
        وإياباً."""

[[faq]]
q = "هل Base64 تشفير؟"
a = """
        لا، وعدُّه تشفيراً هو الغلط الكلاسيكي. Base64 طريقة كتابة: البايتات
        نفسها مكتوبةً بأبجدية تنجو في عنوان أو بريد إلكتروني أو سلسلة JSON.
        وأيُّ أحد يستطيع قراءتها من جديد &mdash; هذه الصفحة تفعل ذلك في جزء من
        الثانية &mdash; فهو لا يخفي شيئاً ولا يحمي شيئاً. فإن كان ما عندك
        سرّياً فهو يحتاج تشفيراً حقيقياً قبل ترميزه، لا بدلاً منه."""

[[faq]]
q = "لماذا فشل الفكّ؟"
a = """
        لأن الملصوق ليس تماماً ما قيل للمرمِّز إنه هو، والخطأ يقول من أي جهة:
        محرفٌ خارج أبجدية Base64، أو حشوٌ في غير موضعه، أو علامة مئوية لا
        يتبعها رقمان سداسيا عشريان، أو بايتات تُفكّ من Base64 فعلاً لكنها ليست
        نصَّ UTF-8 &mdash; وذلك يعني غالباً أن الأصل كان ملفاً لا سلسلة. وكان
        <code>atob</code> الخاص بالمتصفح سيعيد شيئاً معقول الشكل بدلاً من
        ذلك؛ وأن يُقال لك ما الأمر هو كل الغاية من لصق شيء في مفكِّك."""

[[faq]]
q = "ما الفرق بين ترميزَي عنوان الويب؟"
a = """
        قيمةٌ واحدة، أو العنوان كله. ترميزُ <em>قيمة واحدة</em> يهرُب كلَّ ما
        يعطيه العنوان معنى &mdash; الشُرَط المائلة وعلامات الاستفهام وعلامات
        العطف &mdash; وذلك ما تريده لمعامل واحد في سلسلة الاستعلام. وترميزُ
        <em>عنوان كامل</em> يُبقي العنوان عاملاً: فالشُرَط المائلة و
        <code>?</code> تبقى، ولا يُهرَب إلا المحارف التي لا يستطيع العنوان
        حملها أصلاً. واستعمال الأول على عنوان كامل يكسر العنوان؛ واستعمال
        الثاني على قيمة يضيع موضعَ انتهاء القيمة."""

[[faq]]
q = "ما أكبر ملف يستطيع التعامل معه؟"
a = """
        لا حدّ مضبوط هنا، لأنه لا خادم يدفع ثمن واحد. والسقف العملي جهازك أنت:
        فبضعة ميغابايتات من النصّ لا بأس بها، وفي المستند الطويل جداً تنتظر
        الصفحة هدأةً في كتابتك قبل أن تعيد الترميز، بدل أن تنازعك على لوحة
        المفاتيح."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لكم تلصق.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        نصّك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل نصّك بعيداً ليُفكّ
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

