[[privacy]]
title = "ملف GIF عندك لا سبيل له إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد. وقد كان هذا يقول <code>connect-src 'none'</code>، وكان
      مطلقاً؛ فكلّفت إضافةُ الإعلانات ذلك، وقولُه جزء من الصفقة."""

[[privacy]]
title = "قارئ GIF ملفان في هذا المستودع."
body = """
 المتصفح يشغّل ملف GIF
      لكنه لا يناولك أجزاءه، فتُقرأ الصيغة هنا: <code>src/gif.js</code> هو
      الحاوية وفاكُّ ضغط LZW، و<code>src/compose.js</code> هو قواعد التخلّص
      التي تقرّر كيف يبدو كل إطار متى صار ما قبله تحته. ولا شيء يُجلَب لفتح
      ملف، ولا محرّك يُنزَّل عند أول استعمال."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن صورتك المتحرّكة:
      لا ملفاً، ولا إطاراً، ولا اسماً، ولا حجماً، ولا عدداً. وكل سطر يقرأ صورة
      أو يفكّ ضغطها أو يرسمها أو يرمّزها يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن ملفاتك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل جزء من هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل صورتك المتحرّكة
      بعيداً لتُفكَّك كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

[[howto]]
title = "اختر ملف GIF."
body = """
 أفلِته على المُنتقي، أو اختره يدوياً.
      يقرؤه المتصفح من قرصك مباشرة، وتقول لك الصفحة ما وجدت: المقاس، وعدد
      الإطارات، وكم يعمل، وكم مرة يتكرّر."""

[[howto]]
title = "احسم ماذا يحمل كل ملف PNG."
body = """
 <strong>الإطار كما
      يظهر</strong> هو ما يريده الجميع تقريباً: الصورة كلها عند تلك اللحظة من
      الحركة. أما <strong>البكسلات التي يخزّنها ذلك الإطار وحدها</strong> فهي
      الرقعة التي يحملها الملف فعلاً، بمقاسها هي وفي موضعها هي، وهي سبب بقاء
      ملف GIF صغيراً وليست منظر الحركة."""

[[howto]]
title = "احسم ماذا يحدث للشفافية."
body = """
 يحفظها PNG، وهو الافتراض
      الصادق. واملأها بلون بدلاً من ذلك إن كانت الإطارات ذاهبة إلى مكان يتجاهل
      الشفافية وكان سيجعلها سوداء لولا ذلك."""

[[howto]]
title = "اختر الإطارات التي تريدها."
body = """
 كلها افتراضياً. و
      &laquo;أبقِ إطاراً بعد إطار&raquo; يخفّف تسجيلاً طويلاً، ومربعات
      التأشير على الشبكة تتجاوزه &mdash; والترقيم لا يتغيّر أبداً، فالإطار 42
      يُسمّى الإطار 42 مهما قلّ ما أبقيته من جيرانه."""

[[howto]]
title = "نزِّلها."
body = """
 إطاراً في كل مرة من الشبكة، أو كلها في ملف
      ZIP واحد فتكون نافذة حفظ واحدة بدل مئات. ويستطيع ملف ZIP حمل ملف
      <code>frames.txt</code> يسرد كم بقي كل إطار، وهو الشيء الوحيد الذي لا
      يستطيع مجلد من ملفات PNG قوله وحده."""

[[faq]]
q = "هل يُرفع ملف GIF عندي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويفكّ ضغطه ويرسمه على جهازك أنت، ويُرمَّز كل
        ملف PNG هنا في الذاكرة. ولا جانب خادمَ لهذه الأداة، و
        <code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل عنوان
        يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع الاتصال بالشبكة
        وسيظل يقسّم ملفات GIF."""

[[faq]]
q = "لماذا يبدو إطارٌ قطعةً صغيرة من الصورة؟"
a = """
        لأن ذلك ما يحمله الملف. فملف GIF صورةٌ أولى تتبعها رقع: كل إطار لاحق
        يخزّن المستطيل الذي تغيّر لا غير، وكل ما عداه على الشاشة هو ما تركته
        الإطارات التي قبله هناك. فرأسٌ يتكلّم أمام جدار ساكن يخزّن وجهاً لكل
        إطار لا صورةً لكل إطار، وهو سبب ألا تكون الصيغة هائلة الحجم كله.
        <br><br>
        وأنت ترى ذلك لأن &laquo;البكسلات التي يخزّنها ذلك الإطار وحدها&raquo;
        مختارة. حوِّل إلى &laquo;الإطار كما يظهر&raquo; فيكون كل ملف PNG الصورة
        كلها كما تبدو الحركة عند تلك اللحظة."""

[[faq]]
q = "هل يحفظ الشفافية؟"
a = """
        نعم. فشفافية GIF بتٌّ واحد &mdash; البكسل إما مطليّ وإما غير مرئي، ولا
        شيء بينهما &mdash; وPNG تخزّن ذلك بالضبط، فتخرج الإطارات ومناطقها
        الشفافة سليمة. وإن كنت تفضّل خلفية صمّاء، فاضبط &laquo;المناطق
        الشفافة&raquo; على الملء بلون؛ وذلك يُكتَب في ملف PNG ولا يمكن التراجع
        عنه بعدها."""

[[faq]]
q = "لماذا تأخيرات الإطارات ليست الأرقام التي توقّعتها؟"
a = """
        ملف GIF يخزّن كل تأخير بأجزاء من مئة من الثانية، والمتصفحات تحدّ كل ما
        دون اثنين منها إلى عُشر ثانية منذ التسعينيات &mdash; قاعدةٌ كُتِبت
        لكرات أرضية دوّارة من ذلك الزمن ولم تُرفَع قط. فالإطار الذي يقول ملفه
        0.01 ثانية يُشغَّل عند 0.10 ثانية في كل مكان. وهذه الأداة تعرض التأخير
        كما يُشغَّل فعلاً، وتقول ما يخزّنه الملف بجانبه حين يختلف الاثنان."""

[[faq]]
q = "هل أستطيع إعادة الإطارات إلى بعضها؟"
a = """
        نعم، بـ <a href="../إنشاء-gif/">صانع GIF</a> على هذا الموقع أو بأي شيء
        آخر يقبل مجلداً من الصور. ولهذا وُجِد ملف <code>frames.txt</code> في
        ملف ZIP: فتقسيمُ صورة متحرّكة يرمي بالتوقيت، لأن ملف PNG ليس فيه موضع
        يسجّل كم بقي، فتحمل القائمة تأخير كل إطار وموضعه معها."""

[[faq]]
q = "بأي صيغ يمكن حفظ الإطارات؟"
a = """
        PNG، وPNG وحدها عن قصد. فإطار GIF 256 لوناً على الأكثر ببتّ واحد من
        الشفافية؛ وPNG تخزّن ذلك بالضبط وبلا خسارة، بينما كان JPEG سيرمي
        بالشفافية، ويخترع ألواناً لم تكن في الإطار قط، وينتج ملفاً
        <em>أكبر</em> عادةً من عمل فنّي مسطَّح. وإن احتجت إلى ملفات JPEG،
        فحوِّل ملفات PNG بعد ذلك بـ
        <a href="../تغيير-حجم-الصورة/">أداة تغيير حجم الصور</a>."""

[[faq]]
q = "هل ثمّة حدّ لعدد الإطارات التي يقرؤها؟"
a = """
        لا حدّ ثابت. والسقف العملي ذاكرةُ جهازك أنت: فملف GIF يتمدّد إلى نحو
        بايت لكل بكسل لكل إطار وهو يُقرأ، فقد يكون الملف الصغير قدراً كبيراً
        جداً من الذاكرة، وهذه الصفحة تتوقف عن القراءة بدل أن تدع التبويب يموت.
        وإن حدث ذلك قالته وأعادت إليك الإطارات التي حصلت عليها."""

[[faq]]
q = "هل يفتح ملف GIF معطوباً؟"
a = """
        عادةً. فالتنزيلات المبتورة، وعلامة النهاية الغائبة، والإطار الأخير
        الذي يتوقف في منتصف المجرى، كلها شائعة، والقارئ الذي يرفضها لا يفيد
        البتة في الملفات التي يريد الناس تفكيكها أشدّ الإرادة. فأيُّ إطارات
        كاملة تعود، ومعها ملاحظة تقول ما كان الخطب. ولا يُرفَض صراحةً إلا ملف
        ليس GIF أصلاً."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ولا علامة مائية على
        الإطارات كذلك. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى
        المعلنون شيئاً عن ملفاتك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورتك المتحرّكة بعيداً
        لتُعالَج كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

