[[privacy]]
title = "ليس لفيديوك مكان يذهب إليه."
body = """
 تسمّي
      Content-Security-Policy كلّ عنوان يجوز لهذه الصفحة الاتصال به، وليس منها
      واحد لنا. لا توجد هنا نقطة نهاية يمكن أن يُجمَع عندها ملف، ولا في الشيفرة ما
      يرسله إليها لو وُجدت."""

[[privacy]]
title = "الصورة لا تُفكّ شفرتها البتّة."
body = """
 لا يُطلب سوى المسار
      الصوتي. الإطارات لا تُقرأ ولا تُفَكّ ولا تُرسَم ولا يُنظَر إليها &mdash; ولا
      توجد في هذه الصفحة شيفرة تستطيع ذلك &mdash; والملف الخارج يحمل صوتاً ولا شيء
      غيره. وهذا ليس وعداً بضبط النفس: تُسلَّم البايتات إلى
      <code>decodeAudioData</code> فيعيد صوتاً، ولا يوجد في <code>src/</code> فاكّ
      شفرة فيديو يمكن أن يعمل."""

[[privacy]]
title = "فاكّ الشفرة هو الموجود أصلاً في متصفّحك."
body = """
 لا يُرسَل إلى هنا
      شيء لقراءة صيغتك، ولا يُطلب من شيء خارج هذه الصفحة أن يقرأها. لذلك فالملفات
      التي تعمل هي بالضبط ما يشغّله متصفّحك أصلاً."""

[[privacy]]
title = "العيّنات تُكتَب كما هي، ولا يُعاد ترميزها."
body = """

      ملف WAV هو العيّنات التي أعادها فاكّ الشفرة وأمامها ترويسة. لا مرمِّز في
      الطريق يتّخذ قرارات بشأن تسجيلك، ولا شيء يمكن وصفه برفعٍ ليحدث فيه ذلك."""

[[privacy]]
title = "ما تحمّله Google، وما لا يُعطى لها."
body = """
 تأتي نصوص الإعلانات
      والقياس من Google، وزرّ التبرّع من Buy Me a Coffee. ولا يُسلَّم أيٌّ منها شيئاً
      عن فيديوك: لا ملفاً ولا عيّنة ولا اسماً ولا حجماً ولا مدة."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 افصل الشبكة وتبقى الأداة كما هي، لأنه لم
      تكن فيها خطوة شبكية أصلاً. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "أفلِت الفيديو."
body = """
 ملف MP4 أو MOV أو M4V أو WebM، من
      هاتف أو كاميرا أو مسجّل شاشة أو تنزيل. يقرؤه متصفّحك أنت؛ ولا توجد خطوة رفع
      حتى تُترَك."""

[[howto]]
title = "اقرأ ما وجدته."
body = """
 المدة وعدد القنوات ومعدّل العيّنات،
      مأخوذة من الملف مباشرة. وإن لم يذكر الملف معدّله، قالت الصفحة ذلك، بدل أن
      تعيد أخذ العيّنات في صمت وتزعم أن شيئاً لم يُمسّ."""

[[howto]]
title = "اختر أحادي الصوت إن أردته أصغر."
body = """
 ترك القنوات كما هي يُبقي
      التسجيل تماماً كما كان. والمزج إلى أحادي يخفض الملف إلى النصف، وهو ما يريده
      التفريغ النصّي أو تسجيل الكلام؛ وهو يأخذ متوسّط القناتين بدل أن يرمي
      إحداهما."""

[[howto]]
title = "استمع إليه قبل أن تحفظه."
body = """
 المشغّل يعرض الملف الذي سيُنزَّل
      بعد قليل، لا الفيديو &mdash; فإن بدا سليماً في سمعك، فالتنزيل سليم."""

[[howto]]
title = "خذه، أو مرّره إلى التالي."
body = """
 نزّل ملف WAV، أو أرسله مباشرة
      إلى أداة القصّ أو المحرّر دون حفظه أولاً."""

[[faq]]
q = "هل يُرفع الفيديو الخاص بي إلى أي مكان؟"
a = """
        لا. فكّ الشفرة والكتابة يجريان كلاهما في متصفّحك أنت، على عتادك أنت. ولهذه
        الأداة لا وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً أبداً ولا ترسل
        شيئاً أبداً &mdash; وتسمّي <code>Content-Security-Policy</code> الخاصة
        بالصفحة كلّ عنوان يجوز لها الاتصال به، وليس منها واحد لنا. وإن كنت تفضّل
        التحقّق على أن يُقال لك، فافصل الإنترنت واستخرج الصوت رغم ذلك."""

[[faq]]
q = "هل يمكن أن يعطيني ملف MP3؟"
a = """
        لا، ولن يتظاهر بذلك. لا يأتي أي متصفّح بمرمِّز MP3، والسبيل الوحيد إلى
        مرمِّز هو إرسال فيديوك إلى خادوم يملك واحداً &mdash; وهو الأمر الوحيد الذي
        وُجد هذا الموقع كي لا يفعله. ما تحصل عليه هو WAV: العيّنات وأمامها ترويسة من
        أربعة وأربعين بايتاً، لا تحتاج إلى مرمِّز البتّة ولا يمكن أن تكلّف جودة.
        وهو أكبر حجماً، نحو عشرة ميغابايت للدقيقة في الستيريو، ويفتحه كلّ مشغّل
        وهاتف ومحرّر. وما يريد MP3 يستطيع صنع واحد منه في ثانية."""

[[faq]]
q = "هل يُنظَر إلى الصورة في أي لحظة؟"
a = """
        لا، ولا يوجد هنا ما يستطيع النظر إليها. يُسلَّم الملف إلى فاكّ شفرة المتصفّح
        ويُطلب منه مساره الصوتي؛ أما مسار الفيديو فلا يُفَكّ أبداً ولا يُرسَم أبداً
        ولا يبلغ شيفرة هذه الصفحة أصلاً. ولا يوجد في <code>src/</code> فاكّ شفرة
        فيديو يمكن أن يعمل. والملف الخارج يحمل صوتاً ولا شيء غيره."""

[[faq]]
q = "يقول إنه تعذّرت قراءة أي صوت، لكن الفيديو يعمل جيداً."
a = """
        إذن فالفيديو على الأرجح بلا مسار صوتي أصلاً. تسجيل شاشة أُجري دون اختيار
        ميكروفون يكون صامتاً، وكذلك مقطع صدّره محرّر والصوت مكتوم &mdash; وكلاهما
        يعمل تماماً، لأن هناك صورة تُعرض. والرسالة تذكر هذا أولاً لأنه الأرجح من
        السببين؛ أما الآخر فصيغة لن يقرأها هذا المتصفّح. افتح الملف في مشغّل وابحث
        عن مؤشّر صوت لا يفعل شيئاً: تلك أسرع طريقة لمعرفة أيّهما لديك."""

[[faq]]
q = "ما صيغ الفيديو التي أستطيع فتحها؟"
a = """
        كلّ ما يفكّه متصفّحك، وهو عملياً MP4 وM4V وMOV وWebM، وكلّ الصيغ الصوتية
        إلى جانبها. والذي يبقى خارجاً هو القائمة القصيرة نفسها في كلّ مكان من هذا
        الموقع: AVI وWMV ومعظم ملفات MKV. والملف الذي لن يقرأه متصفّحك يُرفَض
        برسالة تقول ذلك، بدل أن يفشل في منتصف الطريق."""

[[faq]]
q = "هل تضيع أي جودة؟"
a = """
        لا شيء يتجاوز ما فعله الفيديو بصوته هو حين صُنع. العيّنات التي يعيدها فاكّ
        الشفرة تُكتَب كما هي &mdash; فلا ترميز ثانٍ، وبالتالي لا جيل ثانٍ من الفقد.
        الأمر الوحيد الجدير بالمعرفة هو معدّل العيّنات: يُقرأ معدّل الملف نفسه من
        ترويسته أولاً ويجري الفكّ عند ذلك المعدّل، حتى لا يُعاد أخذ عيّنات تسجيلك في
        صمت. وإن لم يذكر ملفٌ معدّلاً، قالت الصفحة أي معدّل افترضته."""

[[faq]]
q = "لماذا ملف WAV أكبر بكثير من الفيديو؟"
a = """
        لأن WAV غير مضغوط، بينما كان المسار الصوتي للفيديو مضغوطاً. الصوت بجودة
        القرص المدمج يشغل نحو عشرة ميغابايت للدقيقة في الستيريو، أياً كان ما يحمله؛
        أما مسار AAC داخل ملف MP4 فربما عُشر ذلك. والمزج إلى أحادي يخفضه إلى النصف.
        هذه كلفة عدم إعادة الترميز، وتُدفَع مرة واحدة: فما تفتح به الملف بعد ذلك
        يستطيع ضغطه."""

[[faq]]
q = "ما أقصى طول فيديو يستطيع التعامل معه؟"
a = """
        لا حدّ موضوع هنا، لأنه لا خادوم يدفع ثمنه. السقف العملي هو ذاكرة جهازك أنت:
        يُقرأ الملف ويُحتفَظ بالمسار الصوتي كلّه على هيئة عيّنات، فقد ينفد المكان مع
        تسجيل طويل جداً على جهاز صغير. وبضع ساعات من الفيديو تمرّ عادةً على ما يرام،
        وسيحتمل الهاتف أقلّ مما يحتمله الحاسوب المحمول."""

[[faq]]
q = "هل أستطيع تقصيره أو رفع صوته؟"
a = """
        نعم، لكن ليس هنا &mdash; فهذه الصفحة تؤدّي عملاً واحداً. وحين تظهر نتيجة،
        يظهر بجوار التنزيل صفّ من الروابط يحملها مباشرة إلى
        <a href="../قص-الصوت/">أداة قصّ الصوت</a> أو
        <a href="../تحرير-الصوت/">محرّر الصوت</a> دون حفظها أولاً، ودون أن يرفعها أيٌّ
        منهما كذلك."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لعدد مقاطع
        الفيديو التي تفتحها. يحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا تُعطى تلك
        الإعلانات شيئاً عن ملفك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمّل الصفحة مرة واحدة، ثم افصل الإنترنت وستظلّ تعمل. وهذه أيضاً أبسط
        طريقة لإثبات أن شيئاً لا يُرفَع: فأداة ترسل فيديوك بعيداً لمعالجته كانت
        ستتوقّف في اللحظة التي تفصل فيها."""

