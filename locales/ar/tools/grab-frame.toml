[[privacy]]
title = "مقاطعك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس فيديوك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فكّ الترميز محليّ."
body = """
 تمرّ الإطارات عبر WebCodecs في
      متصفحك أنت، أو عبر محرّك التشغيل نفسه الذي كان سيعرض عليك المقطع على أي
      حال. وتُرسَم الصورة على لوحة على هذا الجهاز وتُناوَل للتنزيل مباشرة."""

[[privacy]]
title = "الملف يُقرأ بضعة ميغابايتات في كل مرة."
body = """
 الفيديو هو
      الصنف الوحيد من الملفات هنا الذي لا يتّسع في الذاكرة على نحو موثوق، فلا
      يُحمَّل كاملاً أبداً. ويأخذ القارئ نافذة حول أي إطار طلبته &mdash; وهو
      أيضاً سبب فتح مقطع بغيغابايتين بسرعة فتح مقطع صغير."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن فيديوك: لا ملفاً،
      ولا إطاراً، ولا اسماً، ولا حجماً، ولا مدةً، ولا اللحظة التي وقفت عندها.
      وكل سطر يقرأ أو يفكّ ترميزاً أو يرسم يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن فيديوك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر فيديو."
body = """
 أفلِت ملف MP4 أو MOV أو M4V أو WebM على
      المُنتقي، أو اختر واحداً يدوياً. يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل
      شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "جِد اللحظة."
body = """
 شغّله وقف حيث تريد، أو اسحب المِزلاج
      &mdash; وعلى ملف MP4 يتحرّك المِزلاج إطاراً واحداً في كل خطوة، فلا تقريب
      بين ما تراه وما تحفظه. ومفاتيح الأسهم تتنقّل إطاراً في كل مرة، وأمسِك
      <kbd>Shift</kbd> لعشرة."""

[[howto]]
title = "اختر صيغة."
body = """
 PNG تخزّن الإطار كما فُكّ ترميزه بالضبط،
      وذلك ما تعنيه &laquo;الجودة الكاملة&raquo; هنا. أما JPEG وWebP فأصغر
      وهما ضغط ثانٍ فوق ضغط الفيديو نفسه، وذلك حسن لمعاينة ولا يصلح لشيء
      سيُحرَّر بعد ذلك."""

[[howto]]
title = "التقطها، أو التقط سلسلة."
body = """
 لقطة واحدة تذهب إلى
      تنزيلاتك مباشرة. و&laquo;كل N ثانية&raquo; يمشي في المقطع مرة ويأخذ صورة
      عند كل علامة &mdash; وهو مفيد لأوراق التلامس والمصغَّرات &mdash; وتخرج في
      ملف ZIP واحد بدل مئة نافذة حفظ."""

[[faq]]
q = "هل يُرفع فيديوي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويفكّ ترميزه على جهازك أنت. ولا جانب خادمَ لهذه
        الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل
        عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع اتصالك
        بالإنترنت والتقط لقطة رغم ذلك إن كنت تفضّل التحقّق على أن يُقال لك."""

[[faq]]
q = "ماذا تعني &laquo;الجودة الكاملة&raquo; بالضبط؟"
a = """
        شيئان. الصورة الساكنة تُحفَظ بدقة الفيديو نفسها، لا بمقاس المعاينة التي
        على الصفحة &mdash; فمقطع 4K يعطي صورة 3840 × 2160. ومع اختيار PNG
        يُخزَّن الإطار كما خرج من فاكِّ الترميز بالضبط، فيحمل الملف الصورة التي
        يحملها الفيديو، بلا جولة ضغط ثانية فوقها. أما لقطة شاشة لنافذة مشغّل
        فلا تعطيك أياً منهما: هي بمقاس النافذة، مأخوذة بعد أن حجّمها المشغّل
        وأدار ألوانها."""

[[faq]]
q = "من أي صيغ الفيديو أستطيع أخذ لقطة؟"
a = """
        MP4 وM4V وMOV تُقرأ مباشرة، مهما كان بداخلها: H.264 أو HEVC أو AV1 أو
        VP9، ما دام متصفحك يستطيع فكّ ترميز ذلك المرمِّز. وذلك هو المسار
        الدقيق، حيث تخاطب الأداة إطارات بعينها. وكل ما عداها مما يستطيع متصفحك
        تشغيله &mdash; وWebM أظهرها &mdash; يُعالَج بتخطية المشغّل ورسم ما
        يعرضه، وهو يحفظ صورة بالحجم الكامل رغم ذلك لكنه يحطّ على الإطار الذي
        اختاره المشغّل لا الذي طلبته. أما الملف الذي لا يستطيع المتصفح قراءته
        ولا تشغيله، وهو عملياً AVI وWMV وFLV ومعظم ملفات MKV، فيُرفَض برسالة
        تقول ذلك."""

[[faq]]
q = "هل أستطيع التنقّل إطاراً واحداً في كل مرة؟"
a = """
        على ملف MP4، نعم، بالضبط: تقرأ الأداة قائمة الإطارات التي في الملف
        نفسه، فتتنقّل مفاتيح الأسهم بين الصور الموجودة فيه فعلاً &mdash; حتى على
        مقطع يتذبذب معدّل إطاراته، حيث كانت خطوة ثابتة بجزء من ثلاثين من
        الثانية ستنحرف. أما على مسار التشغيل فلا قائمة كهذه، فالخطوة دفعةٌ
        بمقدار إطار تقريباً وتقول الصفحة ذلك."""

[[faq]]
q = "لماذا يظهر فيديو هاتفي الطولي قائماً هنا؟"
a = """
        لأن الدوران طُبِّق عن قصد. فالهاتف يصوّر عرضياً ويكتب ربع دورة في الملف
        بدل أن يدير البكسلات، فالإطار الذي يناوله فاكُّ الترميز على جنبه وكل
        مشغّل يديره في طريقه إلى شاشتك. والأداة التي تتخطّى تلك الخطوة تحفظ
        صورةً معقولة للحظة الصحيحة، على جنبها. وهذه تقرأ الدورة من المسار
        وتطبّقها قبل أن يُرسَم شيء."""

[[faq]]
q = "هل ثمّة حدّ لحجم الفيديو أو مدّته؟"
a = """
        لا حدّ مبنيّاً في الأداة، ولا يُقرأ الملف إلى الذاكرة دفعة واحدة
        &mdash; بل يُمشى فيه بضعة ميغابايتات في كل مرة، ولهذا يُفتَح المقطع
        الطويل بسرعة فتح القصير. أما اللقطات التي تأخذها فتُحفَظ في الصفحة حتى
        تنزّلها، فبضع مئات من صور PNG بدقة 4K هي السقف العملي لا الفيديو
        نفسه."""

[[faq]]
q = "هل أستطيع تغيير حجم الصورة الساكنة أو اقتصاصها بعد ذلك؟"
a = """
        ليس هنا، بل في الجوار. فهذه الأداة تحفظ الإطار كما هو؛ وتغييرُ حجمه أو
        نسبته عمل منفصل له قراراته، و
        <a href="../تغيير-حجم-الصورة/">أداة تغيير حجم الصور</a> تفعل الاثنين،
        ودون رفع أي شيء كذلك. أما تصغير الملف دون تغيير الصورة فهو
        <a href="../ضغط-الصور/">ضاغط الصور</a>."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        فيديوك."""

