#
# البصمة والمجموع التحقّقي - Arabic.
#
# Overrides for tools/hash-checksum/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# The English file opens with the job these words have and it is the one to
# keep: be honest about what a checksum proves. It proves the bytes arrived
# unaltered. It does not prove the publisher is trustworthy, and it proves
# little if the number came down the same wire as the file. The Arabic says
# both out loud, because the visitor most likely to be here is one who has just
# been told to "verify the download" and not told what that is worth.
#
# Algorithm names, command names and file names stay exactly as they are:
# MD5, SHA-1, SHA-256, sha256sum, SHA256SUMS, certutil, integrity. Every one is
# typed or searched for, never read as a word.
#

