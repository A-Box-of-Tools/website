[[privacy]]
title = "ملفك لا سبيل له إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد. وقد كان هذا يقول <code>connect-src 'none'</code>، وكان
      مطلقاً؛ فكلّفت إضافةُ الإعلانات ذلك، وقولُه جزء من الصفقة."""

[[privacy]]
title = "الملف لا يُحفَظ كاملاً أبداً، بأي حجم كان."
body = """

      يُقرأ أربعة ميغابايتات في كل مرة وتُحسَب كل قطعة في الحالة الجارية
      وتُسقَط. فالذاكرة التي تستعملها هذه الصفحة هي هي لصورة قرص بأربعين
      غيغابايتاً كما هي لملف نصّي، وليس ثمّة حجم تستسلم عنده. وذلك أيضاً سبب
      عدم استعمال <code>crypto.subtle.digest</code> الخاصة بالمتصفح: فهي تريد
      الملف كله في الذاكرة دفعة واحدة، وذلك بالضبط السقفُ الذي وُجِدت هذه
      الأداة كي لا يكون لها."""

[[privacy]]
title = "خمس خوارزميات، وخمسة ملفات في هذا المستودع."
body = """
 <code>src/md5.js</code>
      و<code>src/sha1.js</code> و<code>src/sha256.js</code> و
      <code>src/sha512.js</code> هي المواصفات المنشورة مكتوبةً، نحو ستين سطراً
      لكل واحدة، وجداولُ الثوابت مكتوبة صراحةً لا محسوبة كي لا يتوقّف شيء من
      الجواب على متصفحك. وكل واحدة منها تُفحَص في مقابل متجهات الاختبار الرسمية
      وفي مقابل تنفيذ نظام التشغيل نفسه قبل أن تُشحَن."""

[[privacy]]
title = "والمجموع التحقّقي الذي تلصقه لا يُرسَل إلى أي مكان هو الآخر."
body = """

      يُقارَن هنا، في الصفحة، بالبصمة المحسوبة هنا. ولا يُقرأ على أحد شيء من
      المقارنة &mdash; لا القيمة، ولا هل طابقت، ولا اسم الملف. وذلك أهمّ مما قد
      يبدو: فالمجموع التحقّقي مع اسم ملف يقول لمن يجمعه بالضبط أي بناء من أي
      برنامج نزّلت للتوّ."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن ملفك: لا الملف، ولا
      اسمه، ولا حجمه، ولا أيّ من البصمات. وكل سطر يقرأ بايتاً أو يبصمه يُخدَم
      من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن ملفاتك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل جزء من هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل ملفك بعيداً
      ليُبصَم كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

[[howto]]
title = "اختر الملف."
body = """
 أفلِته على المُنتقي، أو اختره يدوياً.
      يُقرأ من قرصك قطعاً مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء ذلك، وليس
      ثمّة حجم تستسلم عنده الصفحة."""

[[howto]]
title = "دعه يُقرأ."
body = """
 يُحسَب MD5 وSHA-256 افتراضياً، في مرور
      واحد. ويعرض الشريط أين بلغ من الملف وبأي سرعة يمضي ذلك &mdash; وصورةُ قرص
      كبيرة تستغرق نحو ما كان سيستغرقه نسخُها، لأنه القدر نفسه من القراءة."""

[[howto]]
title = "الصق ما ينبغي أن يكون."
body = """
 أياً كان ما أعطتك إياه صفحة
      التنزيل، وبأي هيئة: ست عشرية مجرّدة، أو سطراً من خَرج
      <code>sha256sum</code>، أو ملفَّ <code>SHA256SUMS</code> كاملاً، أو خاصية
      <code>integrity</code> من وسم نصّ برمجي. وأيُّ خوارزمية هي يتبع طولَها،
      والمربع الصحيح يؤشّر على نفسه."""

[[howto]]
title = "اقرأ الجواب، لا اللون."
body = """
 تقول الصفحة في جملة هل هذا هو
      الملف الذي يصفه ذلك المجموع التحقّقي. فالمطابقة تعني أن البايتات مطابقة
      للتي قاسها الناشر. وعدمُها يعني أنها ليست كذلك، وأن التنزيل ينبغي أن
      يُجلَب من جديد قبل أن يُفتَح."""

[[howto]]
title = "خذ المجاميع التحقّقية إن احتجت إليها."
body = """

      انسخ واحداً، أو انسخها كلها، أو احفظها ملفاً نصّياً صغيراً بالهيئة
      الموسومة التي تكتبها أدوات سطر الأوامر، فتسافر الخوارزمية مع الرقم."""

[[faq]]
q = "هل يُرفع ملفي إلى أي مكان؟"
a = """
        لا. يُقرأ من قرصك بمتصفحك أنت ويُبصَم على معالجك أنت، أربعة ميغابايتات
        في كل مرة. ولا جانب خادمَ لهذه الأداة، و
        <code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل عنوان
        يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع الاتصال بالشبكة
        وستظل تعمل."""

[[faq]]
q = "هل ثمّة حدّ للحجم؟"
a = """
        لا. فالملف لا يُحفَظ كاملاً أبداً: يُقرأ قطعاً وتُحسَب كل قطعة وتُسقَط،
        فصورةُ قرص بأربعين غيغابايتاً تستعمل الميغابايتات القليلة نفسها التي
        يستعملها ملف نصّي. والذي تكلّفه هو الوقت، والصفحة تقول لك كم وهي تمضي.
        <br><br>
        وهذا هو سبب كتابة الخوارزميات هنا بدل مناولتها إلى
        <code>crypto.subtle.digest</code> الخاصة بالمتصفح، وهي أسرع. فذلك
        الاستدعاء يأخذ الرسالة كلها في مخزن واحد ولا سبيل إلى إطعامه ملفاً
        قطعاً، فاستعمالُه كان سيضع أكبر ملف تستطيع فحصه تحت رحمة قدر الذاكرة
        الذي يُسمَح لهذا التبويب به. وعلى هاتف ذلك بضع مئات من الميغابايتات،
        والملف الذي يريد الناس فحصه أكثر من غيره صورةُ قرص."""

[[faq]]
q = "طابق المجموع التحقّقي. فماذا أثبت ذلك فعلاً؟"
a = """
        أن البايتات التي على قرصك هي البايتات التي قاسها أحدهم حين كتب ذلك
        الرقم. لا أكثر، والدقّة في الحدود جديرة بالذكر.
        <br><br>
        فهو يثبت أن التنزيل لم يُبتَر ولم يُفسده قرص معطوب ولم يُستبدَل به شيء
        في الطريق. ولا يثبت <strong>أن</strong> الملف آمن، لأن الناشر يستطيع
        قياس برمجية خبيثة بالدقة نفسها التي يقيس بها أي شيء. ويثبت القليل جداً
        إن كان المجموع التحقّقي جاء من الصفحة نفسها، عبر الاتصال نفسه، الذي جاء
        منه الملف: فمن استطاع تغيير أحدهما استطاع تغيير الآخر. والمجموع
        التحقّقي أثمن ما يكون حين يصلك بطريق آخر &mdash; ملفُّ
        <code>SHA256SUMS</code> موقَّع، أو إعلانُ إصدار من توزيعة، أو مرآةٌ
        ثانية، أو مدير حزم يعرفه أصلاً."""

[[faq]]
q = "لم يطابق. فماذا الآن؟"
a = """
        نزِّله من جديد أولاً، من المكان نفسه. فالنقلُ المقطوع أو المستأنَف هو
        السبب الأشيع بفارق كبير، والنسخة الثانية تحسم الأمر عادةً.
        <br><br>
        فإن أعطت النسخة الثانية الجواب الخطأ نفسه، فتأكّد أنك تقارن بالسطر
        الصحيح: فصفحات الإصدار تسرد عدة ملفات، والمجموع التحقّقي لبناء ARM لن
        يطابق بناء x86 أبداً. ثم تأكّد من رقم الإصدار. فإن كان ذلك كله صحيحاً
        وما زال لا يطابق، فلا تفتح الملف. اجلبه من مرآة أخرى وقارن المجموعين
        التحقّقيين أحدهما بالآخر."""

[[faq]]
q = "أيّها ينبغي أن أستعمل؟"
a = """
        أيّها نشره الناشر. فمغزى العملية المقارنةُ برقمه، ولا تستطيع أن تختار
        رقمه نيابةً عنه.
        <br><br>
        وإن كنت تنتج مجموعاً تحقّقياً لا تفحص واحداً، فاستعمل SHA-256. فـ MD5
        وSHA-1 مكسوران بالمعنى الذي يهمّ: إذ يمكن بناءُ ملفين مختلفين لهما
        البصمة نفسها عمداً، في ساعات على MD5 وبكلفة معتدلة على SHA-1. ولا يجعلهما
        ذلك عديمَي النفع في مقابل الحوادث &mdash; فالتنزيل المبتور لن يتصادم مع
        الأصل مصادفةً &mdash; لكنه يعني أن أياً منهما لا يستطيع أن يقول لك إن
        أحداً لم يعبث. أما SHA-384 وSHA-512 فلا بأس بهما ولا هما أحسن عملياً؛
        وهما هنا لأن بعض المشاريع تنشرهما."""

[[faq]]
q = "لماذا MD5 هنا أصلاً إن كان مكسوراً؟"
a = """
        لأنه ما زال هو المنشور. فالمرايا وتنزيلاتُ البرامج الثابتة وصفحاتُ
        برمجيات الجامعات وكثيرٌ جداً من مواقع المورّدين نشرت MD5 قبل عشرين سنة
        ولم تعاود النظر في الصفحة منذئذ، والأداةُ التي ترفض حساب واحد كانت
        سترفض الإجابة عن السؤال الذي جاء به زوّارها فعلاً.
        <br><br>
        والذي تستطيعه بدلاً من ذلك أن تقول كم يساوي الجواب، وهو ما تفعله
        الملاحظة التي بجانب مربع الاختيار. فـ MD5 الذي يطابق ما زال يستبعد
        تنزيلاً فاسداً. ولا يستبعد تنزيلاً متعمَّداً."""

[[faq]]
q = "ما الهيئات التي أستطيع لصقها في حقل المقارنة؟"
a = """
        كلُّ الهيئات المعتادة، وهو يستنتج أيّها أيّ بنفسه.
        <br><br>
        ست عشرية مجرّدة، بمسافات فيها أو دونها. أو سطر من خَرج
        <code>md5sum</code> أو <code>sha256sum</code>، واسم الملف بعده. أو ملفُّ
        <code>SHA256SUMS</code> كامل بأربعين سطراً، فيكون السطر الذي يُسمّي ملفك
        هو المستعمَل. أو الهيئة BSD،
        <code>SHA256 (disk.iso) = &hellip;</code>. أو تسمية في المقدمة، كـ
        <code>SHA-256: &hellip;</code>. أو خاصية تكامل مورد فرعي،
        <code>sha384-&hellip;</code>، وهي base64 لا ست عشرية ويُفكّ ترميزها قبل
        المقارنة.
        <br><br>
        وأيُّ خوارزمية هي يأتي من طولها: 32 محرفاً ست عشرياً MD5، و40 SHA-1،
        و64 SHA-256، و96 SHA-384، و128 SHA-512. ولا اثنان منها بالطول نفسه، فلا
        شيء يُختار ولا شيء يُخطأ فيه."""

[[faq]]
q = "هل سيعطي الجواب نفسه الذي يعطيه sha256sum أو certutil؟"
a = """
        نعم، بايتاً بايتاً. فهذه مواصفات دقيقة لها متجهات اختبار منشورة، وكل
        خوارزمية هنا تُفحَص في مقابل تلك المتجهات وفي مقابل تنفيذ نظام التشغيل
        نفسه في كل بناء.
        <br><br>
        والفرق الوحيد الذي ستراه العرض. فـ <code>certutil -hashfile</code> في
        Windows يطبع بالأحرف الكبيرة ويضع مسافات؛ وهذه الصفحة تطبع بالصغيرة،
        وهو ما يستعمله كل ناشر تقريباً. والمقارنة تتجاهل الاثنين، فالمجموع
        التحقّقي المنسوخ من certutil يطابق واحداً بالأحرف الصغيرة ملصوقاً
        هنا."""

[[faq]]
q = "هل أستطيع فحص ملفين أحدهما في مقابل الآخر؟"
a = """
        نعم، بخطوة إضافية واحدة: افحص الأول، وانسخ مجموعه التحقّقي، ثم اختر
        الثاني والصق ذلك المجموع في الحقل. فإن كان الملفان متطابقين قالت الصفحة
        ذلك.
        <br><br>
        وذلك جدير بالمعرفة للحالة التي تُحسِنها المجاميع التحقّقية في صمت
        &mdash; تقريرُ هل النسخة التي على قرص النسخ الاحتياطي هي الملف نفسه
        حقاً الذي على الحاسوب المحمول، حين يدّعي الاثنان الحجم نفسه والتاريخ
        نفسه."""

[[faq]]
q = "هل يغيّر ملفي؟"
a = """
        لا. فهذه الأداة تقرأ لا غير. ولا ملف خَرج ولا إعادة ترميز ولا شيء
        يُكتَب رجوعاً &mdash; والشيء الوحيد الذي تستطيع تنزيله ملفٌّ نصّي صغير
        يسرد المجاميع التحقّقية. وأصلك على قرصك لم يُمسّ، وهو أيضاً الجواب
        الصادق عمّا يحدث إن أغلقت التبويب."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ولا حدّ لحجم الملف
        ولا لعدد الملفات التي تفحصها. ويحمل الموقع إعلانات، وهي ما يدفع
        تكاليفه؛ ولا يُعطى المعلنون شيئاً عن ملفك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل ملفك بعيداً ليُبصَم
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

