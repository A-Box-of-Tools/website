[[privacy]]
title = "مقاطعك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس فيديوك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "فكّ الترميز محليّ."
body = """
 تمرّ الإطارات عبر WebCodecs في
      متصفحك أنت، أو عبر محرّك التشغيل نفسه الذي كان سيعرض عليك المقطع على أي
      حال. وأيُّهما استُعمِل مكتوبٌ في أعلى الصفحة، لأنه يغيّر كيفية اختيار
      الإطارات وينبغي أن تستطيع رؤية ذلك."""

[[privacy]]
title = "ملف GIF يُكتَب هنا، بشيفرة تستطيع قراءتها."
body = """
 لوحةُ
      الألوان والتوشيةُ وضغطُ LZW نحو ستمئة سطر في مجلد هذه الأداة نفسه. ولا
      خدمة ترميز، ولا مكتبة تُجلَب عند التشغيل، ولا موضع في شيء من ذلك يمكن أن
      تُرسَل منه صورة."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن فيديوك: لا ملفاً،
      ولا إطاراً، ولا اسماً، ولا حجماً، ولا مدةً، ولا المقطع الذي علّمت عليه.
      وكل سطر يقرأ أو يأخذ عيّنات أو يكمّم ألواناً أو يرمّز يُخدَم من هذا الأصل
      نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن فيديوك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر فيديو."
body = """
 أفلِت ملف MP4 أو MOV أو M4V أو WebM على
      المُنتقي، أو اختر واحداً يدوياً. يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل
      شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "علّم على المقطع."
body = """
 شغّل المقطع واضغط <kbd>I</kbd> حيث
      ينبغي أن يبدأ و<kbd>O</kbd> حيث ينبغي أن ينتهي، أو اسحب المقبضين على
      الشريط. وملف GIF بضع ثوانٍ &mdash; وهذا هو الإعداد الذي يقرّر هل الملف
      صغير أم هائل، أكثر بكثير من الإعدادين الآخرين."""

[[howto]]
title = "اختر العرض ومعدّل الإطارات."
body = """
 عرضُ 480 بكسلاً و12
      إطاراً في الثانية يناسب معظم ما تُصنَع ملفات GIF من أجله. وتنصيفُ العرض
      يربّع نقصان البكسلات؛ واثنا عشر إطاراً في الثانية تُقرأ حركةً دون أن تدفع
      ثمن التي لا يراها أحد."""

[[howto]]
title = "اصنعه، ونزِّله."
body = """
 تُقرأ الإطارات، وتُختار لوحةُ
      256 لوناً واحدة للحركة كلها، ويُكتَب كل إطار على أنه الجزء الذي تغيّر من
      الصورة لا غير. ويعمل على الصفحة متى انتهى، وهو الملف نفسه الذي يعطيك
      إياه التنزيل."""

[[faq]]
q = "هل يُرفع فيديوي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويأخذ عيّناته ويحوّله على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع
        اتصالك بالإنترنت واصنع ملف GIF رغم ذلك إن كنت تفضّل التحقّق على أن
        يُقال لك."""

[[faq]]
q = "ما صيغ الفيديو التي أستطيع تحويلها؟"
a = """
        MP4 وM4V وMOV تُقرأ مباشرة، مهما كان بداخلها: H.264 أو HEVC أو AV1 أو
        VP9، ما دام متصفحك يستطيع فكّ ترميز ذلك المرمِّز. وكل ما عداها مما
        يستطيع متصفحك تشغيله &mdash; وWebM أظهرها &mdash; يُقرأ بتخطية المشغّل
        إلى كل لحظة بدلاً من ذلك، وهو أبطأ وأقلّ دقة قليلاً في أي إطار يحطّ
        أين. أما الملف الذي لا يستطيع المتصفح قراءته ولا تشغيله، وهو عملياً AVI
        وWMV وFLV ومعظم ملفات MKV، فيُرفَض برسالة تقول ذلك بدل أن يفشل في منتصف
        الطريق."""

[[faq]]
q = "لماذا ملف GIF عندي بهذا الكبر؟"
a = """
        لأن GIF صيغة من 1987 تخزّن صوراً كاملة لا حركة. فلا سبيل إلى صنع واحد
        من مقطع بخمس ثوانٍ يكون بصغر ملف MP4 ذي الخمس ثوانٍ الذي جاء منه
        &mdash; فملف GIF لفيديو عشرة أضعاف حجم الفيديو عادةً. والإعدادات
        الثلاثة التي تقرّر ذلك فعلاً هي، بالترتيب: كم يطول المقطع، وكم يعرض
        الصورة، وكم إطاراً في الثانية. وتنصيفُ العرض يربّع نقصان البكسلات،
        والبكسلات هي التي تكلّف."""

[[faq]]
q = "لماذا 256 لوناً لا غير؟"
a = """
        تلك هي الصيغة: فملف GIF يحمل جدولاً واحداً من 256 لوناً على الأكثر
        ويخزّن كل بكسل رقماً فيه. وهذه الأداة تختار تلك الـ 256 بعدّ الألوان في
        كل إطار من مقطعك وقسمتها إلى 256 مجموعة &mdash; بالقطع الوسيطي
        (median cut)، وهي الطريقة القياسية &mdash; فتلائم اللوحةُ مقطعك بدل أن
        تكون طقماً ثابتاً من الألوان. وحيث يغيب لون، تمزج التوشيةُ أقرب لونين
        إليه فيبقى التدرّج تدرّجاً بدل أن يصير خطوطاً."""

[[faq]]
q = "ماذا يفعل إعداد التوشية؟"
a = """
        يقايض قليلاً من الضجيج بكثير من التشرّط. فمع تفعيله تبقى سماءٌ كانت
        ستصير أربعة أشرطة مسطَّحة تدرّجاً، بثمن نسيج خفيف وملف أكبر. ومع
        إطفائه تكون الصورة أشدّ تسطّحاً والملف أصغر، وذلك يناسب تسجيلات الشاشة
        والرسم الخطّي وكل ما هو مصنوع من لون مسطَّح أصلاً. والتوشية المستعملة
        هنا مرتَّبة لا من صنف نشر الخطأ، فتبقى الخلفية غير المتغيّرة ساكنة
        سكوناً تاماً بين الإطارات بدل أن تتلألأ."""

[[faq]]
q = "هل ثمّة حدّ للمدة أو للحجم؟"
a = """
        المقطع هو المحدود، وبالذاكرة لا بقاعدة: فكل إطار منه يُحفَظ في وقت واحد
        بينما تُختار اللوحة، فتحسب الصفحة ما ستكلّفه إعداداتك وتقوله قبل أن
        تبدأ. وترفض بدل أن تدع التبويب تنفد ذاكرته فيختفي. ومقطعٌ أقصر أو عرضٌ
        أصغر أو معدّل إطارات أقلّ، كلها تخفّض ذلك."""

[[faq]]
q = "هل يحفظ الصوت؟"
a = """
        ملف GIF لا يستطيع حمل صوت. فليس ثمّة إصدار من الصيغة فيه صوت، وهو
        السبب الرئيس في أن الويب استبدل بملفات GIF فيديو صامتاً متكرّراً في
        الغالب. فإن كان الصوت يهمّ، فأبقِ على الفيديو &mdash; و
        <a href="../تقصير-الفيديو/">مقصّ الفيديو</a> يقصّ منه مقطعاً دون إعادة
        ترميز إطار واحد."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        فيديوك."""

