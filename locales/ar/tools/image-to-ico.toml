[[privacy]]
title = "شعارك لا سبيل له إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والتحجيم هو
      <code>drawImage</code> على لوحة؛ وكل أيقونة ترويسةٌ تُكتَب أمام تلك
      البكسلات بـ <code>src/ico.js</code> أو <code>src/icns.js</code>، في هذه
      الصفحة."""

[[privacy]]
title = "الملف يوصَف من بايتاته هو."
body = """
 قائمة الأحجام المعروضة بجانب
      أيقونة منتهية ليست قائمة الأحجام التي طلبتها. بل تُقرأ من الملف الذي
      كُتِب للتوّ، بـ <code>readIcoDirectory</code> أو
      <code>readIcnsElements</code>، فلو خالف كاتبٌ يوماً الإعدادات لقالت
      الصفحة ذلك بدل أن تعرفه أنت حين لا يرسم Windows شيئاً ويرسم macOS ورقة
      بيضاء."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن صورتك. وكل سطر يقرأ ملفاً أو يحجّمه أو يكتبه يُخدَم من هذا
      الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر الصورة."
body = """
 أفلِت ملف PNG أو JPEG أو WebP أو SVG على
      المُنتقي، أو اختر عدة ملفات وحوِّلها دفعة واحدة. والمربّعة أيسرها، وكل ما
      كان من 256 بكسلاً فصاعداً فيه من التفصيل ما يكفي كل حجم. ويقرؤها المتصفح
      من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اختر الملفات التي تحتاجها."
body = """
 يقرأ Windows والمتصفح ملف
      <code>.ico</code>؛ ويقرأ Mac ملف <code>.icns</code> ولا ينظر إلى الآخر.
      أشِّر على أيهما، أو عليهما معاً إن كان ما تصنعه يُشحَن على النظامين.
      والموقع يريد صور Apple وAndroid والمربّعات كذلك، وذلك هو المربع الثالث."""

[[howto]]
title = "قل لماذا الأيقونة."
body = """
 فافيكون الموقع 16 و32 و48 بكسلاً؛
      وتطبيق Windows يريد 256 كذلك؛ والتطبيق الذي عليه أن يبدو سليماً على حاسوب
      محمول عالي الدقة يريد الأحجام الوسطى التي يطلبها Windows عند تحجيم 125%
      و150%. اختر ما يطابق الغرض، أو أشِّر على الأحجام بنفسك. ويقول كل حجم في
      القائمة مَن يطلبه. أما ملف <code>.icns</code> فلا خيار فيه: تُسمّي Apple
      عشر خانات بالضبط وتدخل العشر جميعاً."""

[[howto]]
title = "عالِج أمر النسبة والخلفية."
body = """
 الأيقونة مربّعة ومعظم الشعارات
      ليست كذلك. فالحشو يُبقي الصورة كلها ويترك فراغاً فوقها وتحتها؛ والقص
      يأخذ الوسط؛ والمطّ يضغطها. وتبقى الشفافية شفافيةً ما لم تختر لوناً يقف
      خلفها."""

[[howto]]
title = "انظر إلى ذات الـ 16 بكسلاً قبل أن تنزّل."
body = """
 فهو الحجم الذي
      سترى الأيقونة به في أكثر الأحوال، وهو الموضع الذي تختفي عنده الخطوط
      الرفيعة والحروف الصغيرة. وكل مربع في المعاينة مرسوم بحجمه الحقيقي من ملفك
      أنت. فإن كان أصغرها لطخةً، فالعلاج رسمٌ أبسط لا إعدادٌ آخر."""

[[howto]]
title = "خذ الملفات."
body = """
 ملف ‎.ico‎ واحد بكل الأحجام في جوفه،
      مسمّى <code>favicon.ico</code> حين يكون ذلك ما طلبته، لأن ذلك هو العنوان
      الذي تبحث عنه المتصفحات. وملف ‎.icns‎ بجانبه إن أشّرت عليه، جاهزاً ليدخل
      في حزمة تطبيق Mac. وأشِّر على طقم الموقع كذلك فتحصل أيضاً على صور Apple
      وAndroid ومربّع Windows، والبيان، وكتلة HTML للّصق في صفحتك. وكل ما زاد
      على ملف واحد ينزل في ملف zip واحد."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يفكّ متصفحك أنت ترميز الصورة ويحجّمها على جهازك أنت، ويُجمَّع ملف
        ‎.ico‎ من تلك البكسلات بشيفرة تُخدَم من هذه الصفحة. لا تملك هذه الأداة
        أي وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا ترسل شيئاً
        &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل
        عنوان يجوز لها الاتصال به، وليس واحد منها لنا."""

[[faq]]
q = "ما الأحجام التي ينبغي أن يحويها ملف favicon.ico؟"
a = """
        16 و32 و48. وليس ذلك تفضيلاً: فـ 16 هو ما يرسمه المتصفح في التبويب،
        و32 هو ما يستعمله Windows لاختصار سطح المكتب وما تستعمله عدة متصفحات
        للإشارة المرجعية، و48 هو الحجم الذي تقرأ به Google أيقونة الموقع. وما
        زاد على ذلك مكانه ملف PNG بجانب ملف ‎.ico‎ لا داخله &mdash; وهو ما
        ينتجه طقم الموقع هنا."""

[[faq]]
q = "ما الأحجام التي تحتاجها أيقونة تطبيق Windows؟"
a = """
        16 و32 و48 و256، وهو ما يحويه ملف app.ico الافتراضي في Visual Studio
        نفسه. فـ 16 لشريط العنوان ولعرض Explorer الصغير، و32 لسطح المكتب ولشريط
        المهام، و48 لأيقونات Explorer المتوسطة، و256 لقائمة ابدأ وللعرض الكبير
        جداً. وعلى شاشة عالية الدقة يطلب Windows كذلك 20 و24 و40 و64 و96،
        ويعيد أخذ عيّناتها من أقرب حجم عنده إن لم تكن موجودة &mdash; وإعداد
        &laquo;كل مقاييس التحجيم&raquo; يضعها فيه."""

[[faq]]
q = "لماذا الملف أكبر من الصورة التي بدأت بها؟"
a = """
        لأن ملف ‎.ico‎ ليس صورة واحدة بل عدة صور، والصغيرة منها تُخزَّن دون ضغط
        كي يستطيع أي شيء قراءتها. فمُدخَل 32×32 هو 4,264 بايتاً بالضبط مهما
        كان فيه، ومُدخَل 256×256 غير المضغوط هو 264 KB &mdash; ولهذا تُخزَّن
        الأحجام فوق 64 بصيغة PNG افتراضياً. واختيار &laquo;PNG لكل حجم&raquo;
        ينتج أصغر ملف ممكن؛ واختيار غير المضغوط لكل حجم ينتج أكثرها توافقاً."""

[[faq]]
q = "ما الفرق بين مُدخَلات PNG وغير المضغوطة؟"
a = """
        كيفية تخزين البكسلات داخل ملف ‎.ico‎ لا غير. فالمُدخَل غير المضغوط هو
        الترتيب الأصلي في Windows &mdash; ترويسة صورة نقطية، والبكسلات مقلوبة
        رأساً على عقب، وقناع شفافية ببتّ واحد &mdash; وكل إصدار من Windows صدر
        يوماً يقرؤه. أما مُدخَل PNG فهو ملف PNG كامل مدسوس داخل الأيقونة، وهو
        أصغر بثلاثة إلى عشرة أضعاف عند الأحجام الكبيرة لكنه لم يُفهَم إلا من
        Windows Vista فصاعداً. والافتراضي يستعمل كلاً حيث يفوز: غير المضغوط
        حتى 64 بكسلاً، وPNG فوقها."""

[[faq]]
q = "هل يستطيع صنع أيقونة أكبر من 256 بكسلاً؟"
a = """
        لا، ولا يستطيع ذلك شيء. فالصيغة تخزّن كل ضلع في بايت واحد، والصفر
        محجوز &mdash; إذ يعني 256. فذلك هو السقف، وملف ‎.ico‎ فيه صورة بحجم 512
        بكسلاً ليس أيقونة أكبر بل أيقونة معطوبة. وإن احتجت إلى 512 فأنت تحتاج
        إلى ملف PNG، وهو ما يشمله طقم الموقع لـ Android ولشاشة بدء تطبيق
        الويب."""

[[faq]]
q = "هل يحفظ الشفافية؟"
a = """
        نعم، في نوعَي المُدخَلات كليهما، ويكتب كذلك القناع القديم ذا البتّ
        الواحد بجانب قناة ألفا كي تظل البرمجيات الأقدم من أن تقرأ ألفا تقتطع
        الأيقونة بدل أن ترسم مربعاً أسود. والملف الوحيد الذي يُجعَل معتماً عن
        قصد هو أيقونة Apple اللمسية في طقم الموقع: إذ يركّبها iOS على مربّعه
        هو ويحوّل الشفافية إلى سواد، فتُسطَّح على لون خلفيتك، وهو الأبيض
        افتراضياً."""

[[faq]]
q = "شعاري كلمة عريضة. فماذا يحدث له؟"
a = """
        لا بدّ أن يحدث له شيء، لأن الأيقونة مربّعة. فالحشو يُبقي الشيء كله
        ويجعله صغيراً &mdash; والكلمة المحشوّة في مربع بحجم 16 بكسلاً يصير
        ارتفاعها نحو ثلاثة بكسلات ولا تُقرأ. والقصُّ إلى الوسط أنجح عادةً: خذ
        الرمز من التركيبة واستعمله، كما تفعل كل علامة تجارية تقريباً لفافيكونها.
        والمعاينة تريك أيهما ينجو قبل أن تنزّل شيئاً."""

[[faq]]
q = "ما الذي في طقم الموقع، وهل أحتاج إليه كله؟"
a = """
        سبعة ملفات PNG، وبيان تطبيق ويب، وملف browserconfig.xml، وكتلة HTML
        للّصق. وأنت تحتاج إليها لأن ملف ‎.ico‎ يغطي المتصفحات وWindows ولا شيء
        غيرهما: فشاشة iPhone الرئيسية تقرأ ملف PNG بحجم 180 بكسلاً باسم خاص به،
        وAndroid وكل نافذة تطلب التثبيت تقرأ البيان، والمربّع المثبَّت في قائمة
        ابدأ يقرأ ملف XML. ولن ينظر أيٌّ منها داخل ملف ‎.ico‎. وكلها تُولَّد
        هنا، على جهازك، وفي ملف zip ملاحظةٌ تقول لماذا كل ملف."""

[[faq]]
q = "هل يستطيع صنع أيقونة macOS كذلك؟"
a = """
        نعم &mdash; أشِّر على <em>أيقونة macOS</em> فتحصل على ملف
        <code>.icns</code> بجانب ملف <code>.ico</code>، أو بدلاً منه. وهو حاوية
        أخرى للفكرة نفسها، ولن يقرأ أيُّ النظامين حاويةَ الآخر: فـ Windows يريد
        ‎.ico‎ وحزمةُ تطبيق Mac تريد ‎.icns‎. والأحجام ليست خياراً هناك، لأن
        Apple تنشر عشر خانات بالضبط &mdash; 16 و32 و64 و128 و256 و512 و1024
        بكسلاً، وثلاث منها تظهر مرتين بوصفها نسخة Retina للحجم الذي تحتها.
        وتدخل العشر جميعاً، مرسومةً من سبع عمليات رسم، ولذلك كان ملف ‎.icns‎
        هو الأكبر."""

[[faq]]
q = "كيف أستعمل ملف ‎.icns‎؟"
a = """
        للتطبيق، يوضع في الحزمة عند
        <code>YourApp.app/Contents/Resources/</code> ويُسمّى في
        <code>Info.plist</code> تحت <code>CFBundleIconFile</code>؛ ولكل أداة
        تحزيم على Mac حقلٌ له. ولأي شيء آخر، اختر الملف في Finder، واضغط
        Command-C، ثم Get Info على المجلد أو صورة القرص التي تريد تغييرها،
        وانقر الأيقونة الصغيرة في أعلى اليسار واضغط Command-V."""

[[faq]]
q = "هل ملف ‎.icns‎ هو نفسه ما تصنعه iconutil؟"
a = """
        الخانات العشر نفسها بالأنواع الرباعية الحروف نفسها، وPNG في كل واحدة،
        وهو ما تنتجه <code>iconutil</code> من مجلد <code>.iconset</code>. وثمّة
        فرق واحد مقصود: أداة Apple تكتب كذلك عنصر <code>TOC&nbsp;</code>، وهو
        فهرس للأنواع والأطوال التي تليه. وهو تحسينٌ لا جزءٌ من الصيغة &mdash;
        فالقارئ الذي لا فهرس عنده يمشي على العناصر من أولها إلى آخرها ويصل إلى
        الجواب نفسه &mdash; والفهرس الخاطئ أسوأ من لا فهرس، فتُرِك."""

[[faq]]
q = "هل أستطيع تحويل عدة صور دفعة واحدة؟"
a = """
        نعم. تصير كل صورة في القائمة ملف ‎.ico‎ خاصاً بها بالإعدادات نفسها،
        وتنزل الدفعة في ملف zip واحد فيه مجلد لكل صورة &mdash; وإلا لسُمّي
        اثنان منها favicon.ico وحلّ أحدهما محلّ الآخر. ويُصنَع كل خَرج أشّرت
        عليه لكل صورة. وانقر أي صف لتضع تلك الصورة في المعاينة."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لعدد الملفات ولا لأحجامها كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل شعارك بعيداً ليُحوَّل
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

