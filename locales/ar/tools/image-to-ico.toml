#
# الصورة إلى ICO - Arabic.
#
# Overrides for tools/image-to-ico/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# File names and extensions - favicon.ico, .icns, Info.plist, browserconfig.xml
# - are typed, not read, so they stay exactly as they are. So do the key names
# inside them (CFBundleIconFile) and the shortcuts (Command-C), which is what
# the Mac's own Arabic interface does with them too.
#

