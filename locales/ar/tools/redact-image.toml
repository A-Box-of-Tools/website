#
# طمس الصور - Arabic.
#
# Overrides for tools/redact-image/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "طمس" is the verb throughout, matching the slug, and it is the right one:
# it means obliterating a thing rather than merely hiding it, which is the
# entire claim this tool makes. "حجب" - blocking from view - is what every
# other redaction tool actually does, and is the thing the FAQ warns about,
# so the two words are kept apart deliberately.
#

