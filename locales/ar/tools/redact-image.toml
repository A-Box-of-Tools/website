[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "البكسلات المغطّاة تكفّ عن الوجود هنا، لا في طريق الخروج."
body = """
 يُفكّ ترميز
      الصورة إلى مخزن بكسلات، وتُكتَب المربعات فوق ذلك المخزن، ثم يُناوَل
      المخزنُ المرمِّزَ. ولا توجد في هذه الصفحة نسخة من الصورة والمربعات فيها
      طبقة منفصلة، لأن نسخةً كهذه لا تُصنَع أصلاً &mdash; انظر
      <code>src/redact.js</code>."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والعمل هو
      <code>getImageData</code>، وثلاث حلقات على البايتات، و
      <code>canvas.toBlob</code> &mdash; وكلها مثبَّتة في متصفحك أصلاً."""

[[privacy]]
title = "المربعات لا تُبلَّغ إلى أي مكان أبداً."
body = """
 أين رسمت، وكم
      مربعاً، وبأي حجم، وأي أسلوب اخترت &mdash; كل ذلك محفوظ في ذاكرة هذه
      الصفحة حتى تغلقها. ولا يوجد في هذا المستودع أي حدث تحليلات مخصّص يحمل
      شيئاً منه، والسؤال الوحيد الذي يطرحه هذا الموقع بعد التنزيل يرسل إبهاماً
      إلى أعلى أو إلى أسفل واسم الأداة، لا غير."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق &mdash;
      وهو الذي يستحق أن تجرّبه قبل أن تطمس جواز سفر."""

[[howto]]
title = "اختر الصورة."
body = """
 لقطة شاشة، أو ملفاً ممسوحاً ضوئياً، أو
      صورة فوتوغرافية &mdash; أي شيء يستطيع متصفحك فتحه. تُقرأ من قرصك مباشرة؛
      ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اسحب مربعاً على ما لا ينبغي أن يُرى."
body = """
 ثم اسحب مرة أخرى
      للمربع التالي. ويمكن تحريك المربع، أو تغيير حجمه من مقابضه، أو الوصول
      إليه بمفتاح Tab وتحريكه بالأسهم. وما يظهر تحت المربع هو النتيجة
      الحقيقية، ترسمها الشيفرة نفسها التي تكتب الملف."""

[[howto]]
title = "اختر التسويد أو التبكيل أو التمويه &mdash; وفضِّل التسويد."
body = """
 التعبئة
      بالأسود لا تُبقي شيئاً البتة. أما التبكيل والتمويه فيستبدلان بالبكسلات
      متوسطات لها، وذلك يكفي لوجه في الخلفية ولا يكفي لأي شيء يُقرأ نصّاً."""

[[howto]]
title = "اضغط &laquo;اطمس واحفظ&raquo;، ثم تحقّق من الملف."
body = """
 الصورة
      المعروضة بعد ذلك هي الملف المنتهي، مفكوك الترميز من جديد. افتحه في محرِّر
      وابحث عن طبقة، أو حاول تحديد النصّ المغطّى: ثمّة صورة مسطَّحة واحدة،
      والأجزاء التي غطّيتها طُمِست قبل أن تُكتَب."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يفكّ متصفحك أنت ترميز الملف ويطمسه ويرمّزه على جهازك أنت. لا تملك
        هذه الأداة أي وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا
        ترسل شيئاً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا. حمِّل الصفحة
        مرة، واقطع اتصالك بالإنترنت، وستظل تعمل."""

[[faq]]
q = "هل زال الجزء المغطّى من الملف حقاً؟"
a = """
        نعم، وهذا هو سبب وجود هذه الأداة. يُفكّ ترميز الصورة إلى مخزن بكسلات؛
        وتطمس المربعاتُ البكسلات التي بداخلها؛ ثم يُرمَّز المخزن ملفاً جديداً.
        فتكون القيم الأصلية قد زالت من الذاكرة قبل أن يُناوَل المرمِّز شيئاً،
        فلا طبقة تُخفى ولا تعليق يُزال ولا تاريخ يُتراجَع عنه. وتستطيع التحقق
        من ذلك كما تتحقق من دعوى أي أحد آخر: افتح الناتج في محرِّر صور وابحث عن
        طبقة ثانية، أو حاول تحديد النصّ الذي غطّيته."""

[[faq]]
q = "هل يمكن استعادة منطقة مبكَّلة أو مموَّهة؟"
a = """
        أحياناً، وهذا هو الشيء الوحيد الجدير بالقراءة قبل الاختيار. فالتعبئة
        بالأسود تستبدل بكل ما تحتها لوناً مسطَّحاً واحداً، فلا ينجو شيء &mdash;
        لا حافّة، ولا متوسط، ولا حتى عدد المحارف. أما التبكيل فيستبدل بكل كتلة
        متوسطَ تلك الكتلة، وشبكةُ المتوسطات تظل قياساً لما كان تحتها: فللنصّ
        بخطّ عادي وبحجم يمكن توقّعه، أعادت أعمال منشورة بناء الأصل برسم سلاسل
        مرشَّحة ومقارنة متوسطاتها. والتمويه التفافٌ رياضي، والالتفافات يمكن من
        حيث المبدأ عكسها. فبكِّل أو موِّه وجهاً في الخلفية إن شئت، وسوِّد كل ما
        يُقرأ نصّاً."""

[[faq]]
q = "لماذا لا يكون المستطيل الأسود المرسوم في محرِّر مستندات الشيءَ نفسه؟"
a = """
        لأن معظم المحرِّرات تحفظ المستطيل بجانب الصورة لا داخلها. فالشكل
        المرسوم في قارئ PDF أو في عرض تقديمي أو في معالج نصوص أو في محرِّر صور
        ذي طبقات هو كائن له موضع، يقبع فوق الصفحة &mdash; وتحريكه أو حذفه أو
        فتح الملف ببرنامج آخر يعيد بالضبط ما كان يغطّيه. وقد نشرت الصحف
        والمحاكم والدوائر الحكومية جميعاً مستندات طُمِست على ذلك النحو. أما هنا
        فالمستطيل لا يُحفَظ أصلاً: هو مجموعة قيم بكسلات كُتِبت فوق التي كانت
        هناك."""

[[faq]]
q = "هل يزيل كذلك بيانات EXIF وGPS؟"
a = """
        نعم، كأثر جانبي. فالحفظ يعني ترميز لوحة مملوءة بالبكسلات، واللوحة لا
        تحمل وسوماً، فالموقع وطراز الكاميرا والأوقات والمصغَّرة المضمَّنة لا
        تُكتَب ببساطة في الملف الجديد. والمصغَّرة مهمّة هنا: فهي نسخة ثانية
        صغيرة من الصورة، ولا يُعاد توليدها دائماً حين تُحرَّر صورة، وصورةٌ
        مطموسة تسافر ومعها مصغَّرة غير مطموسة طريقٌ حقيقي لنقض هذا العمل كله.
        وإن أردت البيانات الوصفية زائلة دون إعادة ترميز الصورة البتة، فإن
        <a href="../إزالة-بيانات-exif/">عارض EXIF ومُزيله</a> يعيد كتابة
        الحاوية بدلاً من ذلك."""

[[faq]]
q = "ما الصيغ التي يقرؤها ويكتبها؟"
a = """
        يقرأ كل ما يستطيع متصفحك فك ترميزه، وهو عملياً JPEG وPNG وWebP وGIF
        وBMP و&mdash; على معظم المتصفحات الحالية &mdash; AVIF. ويكتب JPEG وPNG
        وWebP، لأن هذه هي المرمِّزات التي تأتي بها المتصفحات. وعلى وضع
        &laquo;تلقائي&raquo; يعود ملف JPEG ملفَّ JPEG ويعود كل ما عداه PNG،
        وذلك يُبقي الصورة الفوتوغرافية بحجم صورة فوتوغرافية ويُبقي ما بقي من
        نصّ لقطة الشاشة حادّاً. ولا فرق يُحدثه هذا الاختيار في الطمس: فالبكسلات
        زائلة قبل أن يراها المرمِّز."""

[[faq]]
q = "هل أستطيع فعل هذا دون فأرة؟"
a = """
        نعم. &laquo;أضِف مربعاً في الوسط&raquo; يضع واحداً على الصورة، وTab
        ينقلك بين المربعات، والأسهم تحرّك المربع الذي عليه التركيز، وAlt مع
        الأسهم تغيّر حجمه &mdash; وShift يجعل كل خطوة عشرة بكسلات &mdash;
        وDelete يزيله. ولكل مربع كذلك صف تحت الصورة فيه حجمه وموضعه وما يفعله
        وزرٌّ لإزالته، فتكون الأداة كلها قابلة للاستعمال من لوحة المفاتيح
        ومقروءة لقارئ الشاشة."""

[[faq]]
q = "هل يعمل على الهاتف؟"
a = """
        نعم. فالرسم والتحريك وتغيير الحجم كلها أحداث مؤشِّر لا أحداث فأرة،
        فيعمل الإصبع على النحو نفسه، وتُرسَم المقابض أكبر على شاشة لمس.
        وتُعاد الصورة على الشاشة بحجم الشاشة أثناء عملك &mdash; أما الملف نفسه
        فيُطمَس دائماً بدقته الكاملة حين تضغط الزر."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لحجم الصورة كذلك، إذ لا خادم يدفع ثمنها &mdash; فالعمل يجري على
        جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى
        المعلنون شيئاً عن صورك."""

