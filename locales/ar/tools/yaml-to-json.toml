[[privacy]]
title = "ما تلصقه ليس له مكان يذهب إليه."
body = """
 تسمّي
      Content-Security-Policy كلّ عنوان يجوز لهذه الصفحة الاتصال به، وليس منها
      واحد لنا. لا توجد هنا نقطة نهاية يمكن أن يُجمَع عندها إعدادٌ ملصوق، ولا في
      الشيفرة ما يرسله إليها لو وُجدت."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في <code>src/</code> كلّه
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code>. والمحلّلان والطابعان دوالُّ في هذه الصفحة تأخذ
      سلسلة نصية وتعيد سلسلة نصية."""

[[privacy]]
title = "يقرأ YAML 1.2، فتبقى النرويج هي النرويج."
body = """
 في YAML 1.1 كانت
      <code>no</code> قيمةً منطقية، وتلك هي العلّة الشهيرة التي تحوّل رمز النرويج
      إلى <code>false</code>. وهذا يقرأ 1.2، حيث تكون النصّ الذي تبدو عليه. وفي
      الاتجاه الآخر تُكتَب تلك الكلمات <em>بين علامتَي اقتباس</em>، لأن ما سيفتح
      الملف بعد ذلك قد يظلّ قارئ 1.1.
      <code>tests/js/text-convert.test.js</code> يتحقّق من النصفين."""

[[privacy]]
title = "التحويل الذي لا يستطيع أن يكون أميناً يتوقّف بدل ذلك."
body = """
 مرساةٌ أو
      كنيةٌ أو وسمٌ في YAML ينهي التحويل برسالة تقول في أي سطر يقع، بدل مستند JSON
      يعني في صمت شيئاً آخر. فليس لدى JSON طريقة ليقول &laquo;العقدة نفسها
      مرّتين&raquo;، واختيار تأويلٍ اختيارٌ بالنيابة عنك."""

[[privacy]]
title = "ما تحمّله Google، وما لا يُعطى لها."
body = """
 تأتي نصوص الإعلانات
      والقياس من Google، وزرّ التبرّع من Buy Me a Coffee. ولا يُسلَّم أيٌّ منها
      حرفاً من نصّك. وكلّ سطر يقرؤه أو يحلّله أو يكتبه يُقدَّم من هذا الأصل ومُدرَج
      في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 افصل الشبكة وتبقى الأداة كما هي، لأنه لم
      تكن فيها خطوة شبكية أصلاً. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر الاتجاه."
body = """
 <em>من YAML إلى JSON</em> أو <em>من JSON
      إلى YAML</em>. والملاحظة تحت القائمة تقول ما يفقده ذلك الاتجاه قبل أن تلصق
      شيئاً، لا بعده."""

[[howto]]
title = "الصقه، أو أفلِت الملف."
body = """
 كلّ ما يمكنك تحديده ونسخه يصلح.
      والملف الذي تُفلته على المُنتقي يقرؤه متصفّحك أنت ويضعه في الصندوق &mdash;
      ولا توجد خطوة رفع حتى تُترَك &mdash; وامتداد <code>.json</code> أو
      <code>.yaml</code> يضبط لك الاتجاه كذلك."""

[[howto]]
title = "اختر الإزاحة."
body = """
 مسافتان أو أربع أو مسافة جدولة. ولا
      تُعرَض مسافة الجدولة إلا لـ JSON: فـ YAML معرَّف بالمسافات، ومسافة الجدولة
      ليست إزاحةً مشروعة فيه."""

[[howto]]
title = "اقرأ الخطأ حيث هو."
body = """
 المحلّل الذي يفشل هنا يقول ما وجده
      وفي أي سطر وأي عمود، بدل &laquo;رمز غير متوقّع عند الموضع 4193&raquo;. وذلك
      يكفي عادةً لإصلاح ملفّ إعدادات دون فتح شيء آخر."""

[[howto]]
title = "خذ النتيجة."
body = """
 انسخها، أو نزّلها ملفاً باسم الصيغة التي خرجت
      بها."""

[[faq]]
q = "هل يُرفع ملف YAML الخاص بي إلى أي مكان؟"
a = """
        لا. المحلّلان والطابعان في هذه الصفحة دوالُّ تعمل في متصفّحك أنت، على عتادك
        أنت. ولهذه الأداة لا وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً أبداً
        ولا ترسل شيئاً أبداً &mdash; وتسمّي <code>Content-Security-Policy</code>
        الخاصة بالصفحة كلّ عنوان يجوز لها الاتصال به، وليس منها واحد لنا. وهذا هو
        سبب استعمالها مع إعداد نشر بالذات: فتلك الملفات مليئة بأسماء المضيفات
        وأسماء الدِلاء، وأحياناً بسرٍّ نوى أحدهم نقله، ولصق واحدٍ منها في محوّل
        شخصٍ آخر إعطاؤه له."""

[[faq]]
q = "ماذا يُفقَد عند تحويل YAML إلى JSON؟"
a = """
        التعليقات، لأن JSON ليس لديه أين يضعها. أما المراسي والكُنى والوسوم
        فتُرفَض صراحةً بدل أن تُخمَّن &mdash; كلٌّ منها يقول شيئاً لا يستطيع JSON
        قوله، ومحوّلٌ يختار في صمت تأويلاً كان سيسلّمك مستنداً ليس هو ما قاله
        الملف. أما الاتجاه الآخر فلا يفقد شيئاً: فكلّ مستند JSON هو أصلاً مستند
        YAML."""

[[faq]]
q = "ملفّي يقول no وخرج JSON نصاً. لماذا؟"
a = """
        لأنه نصّ فعلاً، ولأن هذا يقرأ YAML 1.2 لا 1.1. ففي YAML 1.1 كانت
        <code>yes</code> و<code>no</code> و<code>on</code> و<code>off</code> قيماً
        منطقية، وتلك هي العلّة الشهيرة التي تحوّل رمز النرويج إلى
        <code>false</code>. وقد تخلّى YAML 1.2 عن ذلك، وتخلّى هذا عنه كذلك: فلا
        يُقرأ شيء على أنه غير نصّ سوى <code>true</code> و<code>false</code>
        و<code>null</code> و<code>~</code>. وفي الاتجاه الآخر تُكتَب تلك الكلمات
        <em>بين علامتَي اقتباس</em>، مع أن هذا كان سيقرؤها نصاً بدونهما &mdash;
        لأن ما سيفتح الملف بعد ذلك قد لا يفعل. ولا يزال PyYAML يفترض 1.1
        افتراضياً. والقراءة بصرامة والكتابة بتحفّظ هما التركيبة الوحيدة الصحيحة في
        الاتجاهين."""

[[faq]]
q = "هل يحافظ على ترتيب مفاتيحي؟"
a = """
        نعم، في الاتجاهين، وهذا أصعب مما يبدو. فمحوّلٌ مبنيّ على
        <code>JSON.parse</code> ينقل في صمت المفاتيح التي تشبه الأعداد الصحيحة إلى
        المقدّمة، فيعود <code>{"10":a,"2":b}</code> على هيئة
        <code>{"2":b,"10":a}</code>. وتحتفظ الأعداد بالأرقام التي كتبتها، فلا يفقد
        معرّفُ حسابٍ من عشرين رقماً أرقامَه الثلاثة الأخيرة لصالح عددٍ عشري مضاعف.
        وإن <em>أردتها</em> مرتَّبة فهناك خانة اختيار، وهي ترتّب بحسب طريقة قراءة
        المفاتيح لا بحسب نقاط ترميزها."""

[[faq]]
q = "هل يستطيع تحويل عدّة مستندات YAML دفعةً واحدة؟"
a = """
        لا، ويقول ذلك بدل أن يختار واحداً. فالملف الذي فيه فواصل
        <code>---</code> يحمل أكثر من مستند، وليس لدى JSON شكلٌ يعني &laquo;عدّة
        مستندات&raquo; &mdash; والمصفوفة ستكون دعوى لم يدّعِها الملف قط. حوّلها
        واحداً تلو الآخر."""

[[faq]]
q = "لماذا لا يوجد هنا منسّق YAML؟"
a = """
        لأن YAML ليس له صورة مضغوطة تستحقّ الكتابة &mdash; القصيرة هي أسلوب التدفّق،
        وهو غير مقروء، وعدم القراءة نقيض السبب الذي من أجله يُحتفَظ بملفٍّ بصيغة
        YAML أصلاً. أما نشر JSON وXML وHTML وCSS فهو عمل
        <a href="../تنسيق-json/">مُنسّق JSON</a>، وهو ينشر YAML أيضاً."""

[[faq]]
q = "ما حجم الملف الذي يستطيع التعامل معه؟"
a = """
        لا حدّ موضوع هنا، لأنه لا خادوم يدفع ثمنه. السقف العملي هو جهازك أنت: بضعة
        ميغابايتات من YAML تمرّ على ما يرام، ومع مستند طويل جداً تنتظر الصفحة
        توقّفاً في كتابتك قبل أن تحوّل، بدل أن تنازعك لوحة المفاتيح."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لما تلصقه. يحمل
        الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا تُعطى تلك الإعلانات شيئاً عن
        نصّك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمّل الصفحة مرة واحدة، ثم افصل الإنترنت وستظلّ تعمل. وهذه أيضاً أبسط
        طريقة لإثبات أن شيئاً لا يُرفَع: فأداة ترسل إعدادك بعيداً لتحويله كانت
        ستتوقّف في اللحظة التي تفصل فيها."""

