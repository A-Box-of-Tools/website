[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "فاكُّ الترميز جاء من هنا، ولا يذهب إلى أي مكان."
body = """
 إن HEIC هي
      إطار HEVC داخل صيغة حاوية، ولا يفكّ ترميزها متصفحٌ غير Safari، فتشحن هذه
      الصفحة <code>libheif</code> مُصرَّفاً إلى WebAssembly &mdash; نحو 1.4 MB،
      مودَعاً في هذا المستودع، يُخدَم من هذا الأصل، وتخبّئه عاملُ الخدمة كما
      تخبّئ كل ملف آخر هنا. ولا يُجلَب من شبكة توصيل محتوى، لأن ذلك يضع طرفاً
      ثالثاً في طريق كل زيارة ويوقف عمل الأداة دون اتصال. والثنائي داخل النص
      البرمجي لا إلى جانبه، وذلك بالضبط كي لا يلزم أي جلب لتشغيله."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي ملف كُتِب لهذه الأداة. أما المحرّك المودَع،
      فهو ككل بناء Emscripten يحوي مسارات التحميل التي كانت ستجلب ملف
      <code>.wasm</code> من عنوان؛ وهي مسارات لا تُسلَك، لأن الثنائي في اليد
      أصلاً &mdash; ولو سُلِكت لكان <code>connect-src</code> يُسمّي نقاط قياس
      Google لا غير، فيرفضها المتصفح. فالسياسة هي البرهان، لا الوعد."""

[[privacy]]
title = "البيانات الوصفية تُقرأ هنا وتُعرَض عليك."
body = """
 تقول القائمة على
      الصفحة ما تحمله كل صورة &mdash; التاريخ، والكاميرا، وهل فيها إحداثيات GPS
      &mdash; لأن ذلك شيء قد تحبّ معرفته قبل أن تناول أحداً ملف JPEG. ويقرؤه
      <code>src/boxes.js</code> من الملف في هذا المتصفح، ويُعرَض على هذه
      الصفحة، ويُكتَب في ملف JPEG أو يُترَك، كما تختار أنت تماماً. ولا يوجد في
      هذا المستودع أي حدث تحليلات مخصّص يحمل اسم ملف أو تاريخاً أو إحداثياً أو
      عدداً."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن صورك. وكل سطر يقرأ ملفاً أو يفكّ ترميزه أو يكتبه يُخدَم من
      هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 حمِّل الصفحة مرة واقطع الاتصال بالشبكة،
      وتبقى الأداة كما هي &mdash; فقد خُبِّئ فاكُّ الترميز معها. وهذا أبسط
      برهان على الإطلاق، وهو هنا أقوى منه في أي موضع آخر من هذا الموقع: فمحوِّلٌ
      يرسل صورك بعيداً ليفكّ ترميزها ما كان له أن يستطيع ذلك أبداً."""

[[howto]]
title = "اختر صور HEIC."
body = """
 أفلِتها على المُنتقي أو اخترها يدوياً،
      من نسخة احتياطية لهاتف أو من مجلد على سطح المكتب مباشرة. يقرؤها المتصفح
      من قرصك، ولا يُرسَل شيء إلى أي مكان أثناء ذلك. وتقول القائمة ما كلُّ
      واحدة منها وما بداخلها."""

[[howto]]
title = "انظر ماذا تحمل الصور."
body = """
 يُسمّي كل صف تاريخ الالتقاط،
      والكاميرا، و&mdash; بالأخضر، لأنه الجزء الجدير بالانتباه &mdash; هل يحمل
      الملف إحداثيات GPS. ويُقرأ ذلك من الحاوية دون فكّ ترميز الصورة، فلا
      يكلّف شيئاً ويظهر في الحال."""

[[howto]]
title = "اختر صيغة، واحسم أمر التفاصيل."
body = """
 JPEG ما لم يكن لديك سبب:
      فهي الصيغة التي تُفتَح في كل مكان، وذلك هو مغزى التحويل كله. ومِزلاج
      الجودة عند 92، وهو الإعداد الذي يصعب عنده تمييز الصورة عن أصلها. أما مربع
      الاختيار فيقرّر هل يأتي معها التاريخ والكاميرا والموقع."""

[[howto]]
title = "اضغط &laquo;حوِّل&raquo;، ثم نزِّل."
body = """
 يصل فاكُّ الترميز عند
      أول تحويل &mdash; نحو 1.4 MB، مرة واحدة &mdash; ثم تُفكّ ترميز كل صورة
      بعدها وتُكتَب على جهازك أنت. ملف واحد يعطيك زر تنزيل؛ وعدة ملفات تعطيك
      ملف zip كذلك."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويفكّ ترميزه ويكتبه على جهازك أنت. لا تملك
        هذه الأداة أي وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا
        ترسل شيئاً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا. والشيء الوحيد
        الذي يُحمَّل فعلاً هو فاكُّ الترميز نفسه، وهو يأتي من هذا الموقع، مرة
        واحدة، قبل أن تدخل صورتك في الأمر أصلاً."""

[[faq]]
q = "لماذا تُنزِّل هذه الصفحة 1.4 MB في المرة الأولى؟"
a = """
        لأن HEIC هي صيغة الصور الوحيدة التي لا يفتحها المتصفح. فهي إطار HEVC في
        حاوية، ولا يملك فاكَّ ترميز لها إلا Safari على عتاد Apple؛ أما Chrome
        وFirefox وEdge فترفض الملف ببساطة. فمحوِّل HEIC يحتاج إلى فاكِّ ترميز
        من مكان ما، والأمكنة اثنان لا ثالث لهما: خادم، أو الصفحة. وقد اختار كل
        محوِّل آخر الخادمَ، وهو بالضبط سبب حاجتهم جميعاً إلى رفع صورك. أما هذا
        فيحمل <code>libheif</code> مُصرَّفاً إلى WebAssembly بدلاً من ذلك.
        يُخدَم من هذا الموقع، ويُخبَّأ بعد أول زيارة، وهو ثمن ألا تذهب صورك إلى
        أي مكان، كل الثمن."""

[[faq]]
q = "هل يحتفظ ملف JPEG بالتاريخ والكاميرا والموقع؟"
a = """
        إن أردت له ذلك، وهو مربع اختيار على الصفحة. فإن تُرِك مفعَّلاً نُسِخت
        كتلة EXIF من ملف HEIC وكُتِبت في ملف JPEG كما كتبها الهاتف تماماً،
        فتظل الصورة المحوَّلة تُرتَّب بيوم التقاطها لا بيوم تحويلها &mdash; وهي
        الشكوى المعتادة من محوِّلات HEIC. ويُغيَّر وسم واحد لا غير: الاتجاه،
        إذ يُضبَط على &laquo;قائم&raquo;، لأن الدوران طُبِّق على البكسلات
        أصلاً، وعارضٌ يطبّقه ثانيةً كان سيقلب كل صورة طولية على جنبها. أطفئ
        مربع الاختيار فيخرج ملف JPEG بالصورة لا غير."""

[[faq]]
q = "هل يزيل إحداثيات GPS؟"
a = """
        يخبرك بوجودها، ثم يفعل ما تطلبه أنت. فصفُّ كل صورة يقول هل يحمل الملف
        إحداثيات قبل أن تحوِّل شيئاً، وهو أكثر مما يفعله الهاتف. وإلغاء
        &laquo;أبقِ على التاريخ والكاميرا والإعدادات&raquo; يتركها خارج ملف
        JPEG مع كل ما عداها؛ وتركُه مفعَّلاً ينقلها معها. وإن كان مرادك أن
        تتصفّح الوسوم بالتفصيل، أو أن تزيلها من صور هي JPEG أصلاً، فـ
        <a href="../إزالة-بيانات-exif/">عارض EXIF ومُزيله</a> هو الأداة لذلك،
        وهو يفعله دون إعادة ضغط الصورة."""

[[faq]]
q = "هل يُعاد ضغط الصورة؟"
a = """
        نعم، ولا بدّ من ذلك: فـ HEIC وJPEG مرمِّزان مختلفان، فلا سبيل إلى
        الانتقال من أحدهما إلى الآخر دون فكّ ترميز الصورة وإعادة ترميزها. وما
        تتحكّم فيه أنت هو كم يكلّف ذلك. فمِزلاج الجودة افتراضه 92، ويصعب عنده
        جداً تمييز الصورة عن أصلها، وPNG موجودة في القائمة للحالة التي لا تريد
        فيها خسارة البتة ولا يضيرك أن يصير الملف خمسة أو عشرة أضعاف حجمه."""

[[faq]]
q = "ماذا لو كان اسم الملف ‎.jpg‎ وهو في الحقيقة HEIC؟"
a = """
        يعمل رغم ذلك. فكل ملف يُفلَت هنا يُعرَّف ببايتاته الأولى لا باسمه، لأن
        الاسم هو ما قرّره آخرُ تطبيق لمس الملف &mdash; وملفُّ HEIC وصل باسم
        &laquo;‎.jpg‎&raquo; من أشيع ما يجعل الناس يبحثون عن أداة كهذه. أما
        الملف الذي هو JPEG أو PNG حقاً فيُرفَض برسالة تقول ذلك، بدل أن يُحوَّل
        إلى نسخة من نفسه."""

[[faq]]
q = "هل يستطيع تحويل صورة حيّة أو لقطة متتابعة؟"
a = """
        الصور الساكنة التي فيها، نعم. فملف HEIC قد يحمل أكثر من صورة، وكل صورة
        يحملها تُحوَّل وتُسمّى باسم الأصل ورقمٌ في آخرها. أما النصف المرئي
        المتحرّك من الصورة الحيّة فملف منفصل يحفظه الهاتف بجانب ملف HEIC،
        فليس هنا كي يُحوَّل. وخرائط العمق والمصغَّرات موجودة في الحاوية لكنها
        ليست صوراً طلبها أحد، فتُترَك وشأنها."""

[[faq]]
q = "لماذا لا يقبل ملف AVIF؟"
a = """
        لأنه لا شيء يُفعَل به. فـ AVIF هي الحاوية نفسها التي لـ HEIC وفيها AV1
        بدل HEVC، وكل متصفح حالي يفكّ ترميزها أصلاً &mdash; فالمحوِّل سيكون
        شاحناً ميغابايتاً من المحرّك لحلّ مشكلة ليست عندك. وإن احتجت إلى AVIF
        بصيغة JPEG، فـ <a href="../ضغط-الصور/">ضاغط الصور</a> و
        <a href="../تغيير-حجم-الصورة/">أداة تغيير حجم الصور</a> كلاهما يقرأ
        AVIF ويكتب JPEG بفاكِّ الترميز الذي في متصفحك أصلاً."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لعدد الملفات ولا لأحجامها كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم، وفاكُّ الترميز معه. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت
        فيظل يعمل على صورك كما كان تماماً. وهذا أيضاً أقوى برهان متاح على أنه
        لا يُرفع شيء: فمحوِّلٌ يرسل ملفات HEIC بعيداً ليفكّ ترميزها كان
        سيتوقف في اللحظة التي تقطع فيها الاتصال، وهذا لا يتوقف."""

