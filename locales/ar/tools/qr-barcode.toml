#
# مولّد رموز QR والباركود - Arabic.
#
# Overrides for tools/qr-barcode/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are. This tool
# has no [picker] table - its input is typed, not dropped.
#
# Symbology names are never translated: EAN-13, EAN-8, UPC-A, ITF-14, Code 128,
# Code 39, Interleaved 2 of 5, GS1, ISO/IEC 18004, Denso Wave, Reed-Solomon.
# Every one of them is either a standard somebody will look up or a name the
# person asking for the barcode will have used, and an Arabic rendering of any
# of them would match nothing.
#
# The uppercase-URL example stays uppercase Latin: it is the point of the
# answer, and a translated one would demonstrate nothing.
#

