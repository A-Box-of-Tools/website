[[privacy]]
title = "ليس لما تكتبه مكان يذهب إليه."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده كلمة مرور Wi-Fi، ولا في الشيفرة
      ما يرسلها إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. فالرمز يُبنى من
      السلسلة بالحساب ويُرسَم SVG، في هذه الصفحة، على جهازك."""

[[privacy]]
title = "الرمز لا يشير إلينا."
body = """
 فما تكتبه هو ما يحمله الرمز.
      وعدةُ مولّدات مجانية تعيد إليك رمزاً فيه رابط إلى موقعها هي، ثم يعيد
      التوجيه إلى موقعك &mdash; فتُحصى كل مسحة عندهم، ويكفّ الرمز عن العمل يوم
      يكفّون عن دفع ثمن النطاق أو يقرّرون أن الطبقة المجانية انتهت. ولا شيء هنا
      يختصر ولا يعيد التوجيه ولا يتتبّع: فالسلسلة المعروضة على الصفحة هي
      السلسلة التي في الصورة."""

[[privacy]]
title = "ملف PNG مصنوع من ملف SVG الذي على الشاشة."
body = """
 فالتنزيل
      ليس عرضاً ثانياً قد يخالف المعاينة. بل تُناوَل الوسوم نفسها للمتصفح
      وتُطلى على لوحة، وذلك أيضاً سبب إمكان فعله دون الاتصال بشيء: فلا خطّ
      يُجلَب ولا صورة تُحمَّل داخله."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً مما تكتبه. وكل سطر يحوّل سلسلة إلى رمز يُخدَم من هذا الأصل
      نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر نوع الرمز."
body = """
 رمزُ QR يحمل أي شيء وهو ما تبحث
      عنه كاميرا الهاتف، فهو الجواب ما لم يقل لك أحد غير ذلك. أما الباركود
      فيحمل رقماً، وأيُّه تحتاج يقرّره من سيمسحه &mdash; فالمتجر يريد EAN-13 أو
      UPC-A، وصندوقُ الشحن ITF-14، وكلُّ ما هو داخلي Code 128 عادةً."""

[[howto]]
title = "قل ما الذي يدخل فيه."
body = """
 الرابط هو الحالة الشائعة،
      والحقول التي فوقه تبني الهيئات الأخرى التي تعرفها الهواتف: شبكةُ Wi-Fi
      تعرض الانضمام إلى نفسها، وبطاقةُ جهة اتصال تعرض أن تُحفَظ، وبريدٌ، ورسالةٌ
      نصّية، ورقمُ هاتف، وموضعٌ على خريطة. وأياً اخترت، تُعرَض السلسلة المنتهية
      على الصفحة &mdash; فذلك كل ما يحمله رمز QR قط."""

[[howto]]
title = "اختر كم من التلف يحتمله."
body = """
 المستويات الأربعة تضع
      تصحيح أخطاء أكثر أو أقلّ، وتصحيحٌ أكثر يعني رمزاً أكبر وأكثف. فـ L يكفي
      لشاشة، وM لورق عادي، وH لشيء سيُتداوَل أو يُطبَع صغيراً أو يُلصَق على
      نافذة في الشمس. والرمز الذي على قائمة طعام تُمسَح كل يوم يستحق Q أو H."""

[[howto]]
title = "اضبط المقاس والهامش والألوان."
body = """
 الهامش جزء من الرمز:
      فأربع وحدات من الفراغ الهادئ حوله هي ما تطلبه المواصفة، وتقليمُها هو
      السبب الأشيع بمفرده في ألا يُمسَح رمز مطبوع. وداكنٌ على فاتح، بتباين
      حقيقي &mdash; فالماسح يقرأ الفرق بين الاثنين، فالرماديُّ الشاحب على
      الأبيض لا يصلح، والفاتحُ على الداكن يفشل صراحةً على كثير من القارئات."""

[[howto]]
title = "افحصه بالهاتف الذي عندك."
body = """
 قبل أن تطبع ألفاً منه، امسح
      الذي على شاشتك. فذلك يستغرق عشر ثوانٍ ويلتقط صنف الأخطاء كله الذي لا
      تلتقطه المعاينة: كلمةُ مرور Wi-Fi فيها محرف كان يحتاج إلى هروب، ورابطٌ
      نقصه <code>https://</code>، وباركودٌ رقمه ناقص رقماً."""

[[howto]]
title = "خذ ملف SVG."
body = """
 هو الرمز تعليماتٍ لا بكسلات، فيُطبَع
      بأي مقاس دون أن ينعم، والحافّةُ الناعمة هي بالضبط ما لا يستطيع الماسح
      تمييزه. وخذ ملف PNG كذلك إن كان ما تلصق فيه لا يقبل SVG؛ وهو مرسوم بعدد
      صحيح من البكسلات لكل وحدة، فلا حوافّ مغبَّشة فيه هو الآخر."""

[[faq]]
q = "هل يُرسَل شيء مما أكتبه إلى أي مكان؟"
a = """
        لا. رمز QR حسابٌ على سلسلة، وذلك الحساب يجري في متصفحك أنت على جهازك
        أنت. وليست لهذه الأداة وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً
        ولا ترسل شيئاً أبداً &mdash; و<code>Content-Security-Policy</code>
        الخاصة بالصفحة تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا.
        وذلك أثمن هنا منه في معظم الصفحات، لأن أكثر ما يضعه الناس في رمز QR
        كلمةُ مرور شبكتهم."""

[[faq]]
q = "هل تنتهي صلاحية هذه الرموز، أو تكفّ عن العمل لاحقاً؟"
a = """
        لا، ولا تستطيع. فما تكتبه هو ما يحمله الرمز، فمسحُه يعيد تلك السلسلة
        بالضبط إلى الأبد. والرموز التي تنتهي صلاحيتها هي التي فيها عنوان شخص
        آخر: فرمزُ QR &laquo;الديناميكي&raquo; يحمل رابطاً إلى خادم المولّد،
        الذي يعيد التوجيه إلى موقعك، وذلك يعني أنهم يستطيعون إحصاء كل مسحة،
        وتغيير وجهتها، وإطفاءها حين تنتهي فترة تجريبية. ولا شيء هنا يعيد
        التوجيه عبر شيء."""

[[faq]]
q = "هل هو مجاني، وهل أستطيع استعماله تجارياً؟"
a = """
        هو مجاني، ولا حساب ولا علامة مائية ولا حدّ لعدد ما تصنعه، وتستطيع وضع
        الناتج على منتج أو ملصق أو واجهة متجر. و&laquo;QR Code&raquo; علامة
        تجارية مسجَّلة لشركة Denso Wave، وقد صرّحوا بأنهم لن يمارسوها في مواجهة
        من يستعمل الرموز &mdash; والمواصفة منشورة بوصفها ISO/IEC 18004 وتنفيذها
        حرّ، وهو ما تفعله هذه الصفحة. ويحمل الموقع إعلانات، وهي ما يدفع
        تكاليفه."""

[[faq]]
q = "أي مستوى تصحيح أخطاء ينبغي أن أختار؟"
a = """
        M ما لم يكن لديك سبب. فـ L يصنع أصغر رمز ولا بأس به على شاشة؛ وM ينجو
        من التداول العادي؛ وQ وH لرمز سيُطبَع صغيراً أو يُغلَّف أو يُلصَق على
        نافذة أو يغطّيه شعار جزئياً. وكل درجة صعوداً تضع بيانات فحص أكثر، وهي
        تحتاج إلى رمز أكبر عند القدر نفسه من النصّ &mdash; فالانتقال من L إلى H
        يضاعف عدد الوحدات تقريباً للسلسلة نفسها."""

[[faq]]
q = "كم يستطيع رمز QR أن يحمل؟"
a = """
        عند أكبر مقاس، 177 وحدة مربّعة، حتى 7,089 رقماً، أو 4,296 حرفاً كبيراً
        ورقماً، أو 2,953 بايتاً من أي شيء آخر &mdash; وذلك عند أضعف تصحيح
        أخطاء؛ وعند أقواه نحو ثلث ذلك. وعملياً ليس الحدُّ الصيغةَ بل الماسح:
        فبعد بضع مئات من المحارف تصير الوحدات من الصغر بحيث لا تستطيع كاميرا
        هاتف عادية تمييزها على بُعد ذراع. والرمزُ الطويل علامةٌ عادةً على أن
        رابطاً قصيراً هو ما ينتمي إليه بدلاً من ذلك."""

[[faq]]
q = "لماذا يكبر رمزي حين أكتب الرابط بأحرف صغيرة؟"
a = """
        لأن لرمز QR نمطاً للأحرف الكبيرة والأرقام يرصّ محرفين في أحد عشر بتّاً،
        ولا نمط كهذا للأحرف الصغيرة، وهي تكلّف ثمانية بتّات لكل واحد. فعنوانٌ
        مكتوب <code>HTTPS://EXAMPLE.COM/PAGE</code> قد يكون أصغر بالثلث من
        العنوان نفسه بأحرف صغيرة. والمخطَّط والمضيف لا يفرّقان بين الحالتين،
        فرفعُ صوتهما لا يغيّر شيئاً إلا الحجم؛ أما المسار بعد المضيف فيفرّق،
        فاتركه وشأنه."""

[[faq]]
q = "هل يستطيع قراءة رمز QR كما يصنع واحداً؟"
a = """
        ليس هذه الصفحة، لكن التي في الجوار تفعل:
        <a href="../مسح-رمز-qr/">القارئ</a> يأخذ صورة أو لقطة شاشة أو كاميرتك
        ويعيد السلسلة. وهو عملٌ أكبر بكثير من رسم واحد &mdash; فإيجادُ الرمز في
        صورة، وتصحيحُ الميل الذي التُقطت به، وإصلاحُ التلف، ثلاثُ مشكلات ليست
        عند هذه الصفحة &mdash; ولهذا كان أداةً قائمة بذاتها لا زراً هنا. وهو
        يعمل بالشروط نفسها التي يعمل بها كل شيء آخر: لا يُرفع شيء، ولا يُحفَظ
        إطارُ كاميرا."""

[[faq]]
q = "ما فائدة الهامش، وهل أستطيع تصغيره؟"
a = """
        الفراغ الأبيض حول رمز QR جزء من الرمز. فالقارئ يستعمله ليجد أين ينتهي
        الرمز، والمواصفة تطلب أربع وحدات على كل جانب؛ والباركود يريد نحو عشر.
        وتستطيع ضبطه على صفر هنا فتبدو الصورة أنظف، وحينئذ سيعجز كثير من
        الماسحات عن رؤيته أصلاً &mdash; ولا سيّما في مقابل خلفية مزدحمة. فإن
        كانت المساحة هي المشكلة، فصغِّر الرمز بدل أن تقلّم هامشه."""

[[faq]]
q = "أي باركود أحتاج؟"
a = """
        أيَّه يطلبه من سيمسحه. فـ EAN-13 هو باركود التجزئة خارج أمريكا
        الشمالية وUPC-A هو باركود أمريكا الشمالية &mdash; وكلاهما يحتاج إلى رقم
        تصدره لك GS1، لأن الرقم يعرّف شركتك لا المنتج وحده. وEAN-8 هو النسخة
        القصيرة للعبوات الصغيرة. وITF-14 يوضَع على صندوق الشحن. وCode 128
        وCode 39 يحملان نصّاً كما يحملان أرقاماً ولا يحتاجان إلى تسجيل البتة،
        وذلك يجعلهما الجواب الصحيح لكل ما هو داخلي: الأصول والرفوف وأوراق
        العمل."""

[[faq]]
q = "ما رقم التحقّق، ولماذا أضافته الأداة؟"
a = """
        هو آخر رقم في باركود التجزئة، محسوبٌ من التي قبله، كي يستطيع الماسح
        تمييز القراءة الخاطئة من الصحيحة. فـ EAN-13 يريد اثني عشر رقماً ويحسب
        الثالث عشر؛ وUPC-A يريد أحد عشر ويحسب الثاني عشر. اكتب الرقم القصير
        فتضيفه هذه الصفحة. واكتب الرقم الكامل فتفحص الذي أعطيته &mdash; وترفض،
        بدل أن تصحّحه في صمت، لأن رقماً خاطئاً يُصلَح بهدوء ملصقٌ يُمسَح على
        أنه منتج شخص آخر."""

[[faq]]
q = "هل أستطيع وضع شعار في وسط رمز QR؟"
a = """
        ليس هنا، لكن سبب نجاح ذلك في غيره جدير بالمعرفة: تصحيحُ الأخطاء هو ما
        يجعله ممكناً. فعند المستوى H يمكن إتلاف نحو 30% من الوحدات ويظل الرمز
        يُقرأ، فالشعارُ الذي يغطي أقلّ من ذلك في الوسط &mdash; حيث لا يجلس نقشُ
        تحديد &mdash; تلفٌ قابل للإصلاح. مرِّر الرمز في محرِّر صورك عند المستوى
        H، وأبقِ الشعار دون خُمس المساحة تقريباً، وافحصه بهاتف حقيقي بدل أن تثق
        به."""

[[faq]]
q = "لماذا ملف SVG أفضل من PNG؟"
a = """
        لأن الرمز حوافّ، ولملف PNG عددٌ ثابت من البكسلات يصنعها منه. فكبِّر
        واحداً فتنعم كل حافّة؛ والحافّةُ الناعمة هي بالضبط ما يعسر على الماسح،
        والطابعةُ عند 1200 نقطة في البوصة إذا أُعطيت ملف PNG بـ 512 بكسلاً
        فإنما يُطلَب منها اختراع الفرق. أما ملف SVG فهو المربّعات تعليماتٍ،
        فيُطبَع حادّاً على بطاقة عمل أو على لوحة إعلانات. وملفُّ PNG هنا مرسوم
        بعدد صحيح من البكسلات لكل وحدة، وهو أحسن ما يستطيعه PNG."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
