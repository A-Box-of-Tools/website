#
# قارئ رموز QR والباركود - Arabic.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# The English file names the sentence that has to be got right: "this page uses
# your camera" is the one line on this site that sounds like the opposite of
# the promise. So the Arabic states the camera clause as an extension of the
# pledge and never as an exception to it - الكاميرا هي الوعد نفسه لا استثناء
# منه - and the frame's fate is said in the same breath: it arrives, it is
# examined, it is gone.
#
# Symbology and algorithm names stay Latin, as in the generator: QR, EAN-13,
# UPC-A, UPC-E, ITF-14, Code 128, Code 39, Reed-Solomon, ECI, Data Matrix,
# PDF417, Aztec, MaxiCode. bit.ly stays too - it is a host name.
#

