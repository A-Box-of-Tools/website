[[privacy]]
title = "الصورة لا تُرفَع أبداً، والكاميرا ليست استثناء."
body = """
 الصورةُ
      التي تفلتها هنا يُفكّ ترميزها على لوحة في هذه الصفحة وتُقرأ هناك. وإطارُ
      الكاميرا هو الشيء نفسه يصل ثلاثين مرة في الثانية: يُرسَم على تلك اللوحة،
      ويُفحَص، ويكتب فوقه الذي يليه. فلا إطار يُسجَّل، ولا واحد يُحفَظ، وانطفاءُ
      ضوء الكاميرا حين تضغط &laquo;أوقِف&raquo; هو الأمر كله."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>، و
      <code>Content-Security-Policy</code> الخاصة بالصفحة لا تترك عنواناً
      يستطيع هذا الأصل الإرسال إليه لو وُجد. ولهذا لا تستطيع هذه الصفحة أن تقول
      لك إلى أين ينتهي رابط مختصَر: فمعرفةُ ذلك تعني السؤال، وهي لا تسأل."""

[[privacy]]
title = "تعرض عليك العنوان. ولا تفتحه أبداً."
body = """
 رمزُ QR المطبوع
      عنوانٌ لا يستطيع أحد قراءته، وذلك بالضبط ما يجعل لصق ملصق فوق واحد يستحق
      عناء أحدهم. ولا يُفتَح شيء هنا. بل تُطبَع السلسلة كلها لتنظر إليها،
      ويُنادى على المضيف الذي ستبلغه فعلاً وحده، وتُسمّى الحيلُ التي تجعل
      عنواناً يبدو عنواناً آخر &mdash; اسمُ مستخدِم قبل <code>@</code>، واسمٌ
      مكتوب بخطّ حروفه على شكل حروفنا، وإعادةُ توجيه &mdash; حيث تظهر."""

[[privacy]]
title = "وتعرض عليك ما أخذت عيّناته كذلك."
body = """
 تحت كل نتيجة QR
      صورةٌ للوحدات التي قرأتها هذه الصفحة فعلاً من صورتك. فإن بدت الرمزَ الذي
      مسحته، فالجواب الذي فوقها سليم؛ وإن بدت تشويشاً، فليس سليماً. ولا يمكن
      فحصُ قارئ يناولك سلسلة ولا شيء غيرها على ذلك النحو."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها صورةً ولا إطاراً ولا شيئاً قُرِئ من واحد. وكل سطر يحوّل بكسلات إلى
      سلسلة يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، والكاميرا معها، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على
      الإطلاق."""

[[howto]]
title = "أعطِه الصورة."
body = """
 أفلِت صورة فوتوغرافية أو لقطة شاشة على
      الصندوق، أو الصق واحدة مباشرة، أو اضغط زر الكاميرا. ولا بأس بعدة صور دفعة
      واحدة &mdash; فكلٌّ تُقرأ وحدها وكلٌّ تنال جوابها. ولقطةُ شاشة لرمز هو
      على شاشتك أصلاً أسرع مدخل وأوثقه، لأنه لا عدسة ولا ميل ولا ضوء في
      الأمر."""

[[howto]]
title = "أدخِل الرمز كله في الإطار، والهامش معه."
body = """
 الفراغ الأبيض حول
      الرمز جزء من الرمز: فهو كيف يجد القارئ أين ينتهي. والصورةُ المقصوصة إلى
      حافّة المربّعات هي السبب الأشيع بمفرده في ألا يُقرأ واحد، وملءُ نحو نصف
      الإطار بالرمز نحو الصواب &mdash; وأقربُ من ذلك تقع الأركان خارج
      الصورة."""

[[howto]]
title = "اقرأ العنوان قبل أن تقرّر شيئاً."
body = """
 مغزى مسح رمز على ملصق أو
      عدّاد وقوف أو رسالة هو معرفةُ إلى أين يذهب، وذلك هو الشيء الوحيد الذي لا
      تدعك كاميرا الهاتف تفعله حقاً. والمضيف مطبوع هنا على سطره وحده. فإن لم
      يكن اسماً كنت تتوقّعه، فقد حصلت على ما جئت من أجله ولم يبقَ ما يُفتَح."""

[[howto]]
title = "خذ التحذيرات مأخذ الجدّ، ولا سيّما الهادئة منها."
body = """
 عنوانٌ
      <code>http://</code> صِرف، أو اسمٌ بأبجدية ليست التي يبدو أنه بها، أو
      مختصِرُ روابط، أو أي شيء قبل <code>@</code> في العنوان &mdash; كلُّ واحد
      من هذه مسمّىً حيث يظهر. ولا واحد منها يثبت شيئاً وحده. وكلها تستحق عشر
      ثوانٍ قبل أن تذهب إلى هناك."""

[[howto]]
title = "إن لم يُقرأ، فغيّر الضوء قبل أن تغيّر أي شيء آخر."
body = """
 كلُّ إخفاق
      تقريباً مشكلةُ عتبة: انعكاسٌ عبر الوسط، أو ظلٌّ على ركن، أو شاشةٌ
      مصوَّرة بميل يلتقط الإضاءة الخلفية. تحرّك حتى يزول الوهج عن الرمز، أو
      شغّل ضوء الكاميرا. وإن لم ينفع، فالتقط صورةً واحدة مسطَّحة مواجِهة
      وأفلِتها &mdash; فالصورةُ الساكنة تنال بحثاً أدقّ بكثير مما يناله إطار
      حيّ."""

[[howto]]
title = "افحص الصورة المأخوذة عيّنتها إن بدا الجواب غريباً."
body = """
 افتح &laquo;كيف
      قُرِئ هذا&raquo; وانظر إلى الشبكة الصغيرة. فهي ما ظنّت هذه الصفحة أن
      الرمز إياه، مرسوماً من الوحدات التي أخذت عيّناتها. والقارئ الذي أساء قراءة
      رمز وأصلحه إلى شيء معقول سيُظهِر ذلك هناك، ولا يُظهِره في أي مكان
      آخر."""

[[faq]]
q = "هل تُرفع الصورة إلى أي مكان؟"
a = """
        لا، ولا يُرفَع شيء قُرِئ منها. فالصورة يُفكّ ترميزها على لوحة في هذه
        الصفحة وتُقرأ هناك، بـ JavaScript يُخدَم من هذا الموقع. وليست لهذه
        الأداة وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً ولا ترسل شيئاً
        أبداً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا. وأبين برهان
        أن تقطع الاتصال بالإنترنت: فستظل تعمل."""

[[faq]]
q = "هل تسجّل الكاميرا شيئاً؟"
a = """
        لا. إطارُ الكاميرا يصل بكسلاتٍ في هذا التبويب، ويُرسَم على لوحة،
        ويُفحَص، ويكتب فوقه الإطارُ التالي بعد نحو عُشر ثانية. ولا شيء يُكتَب
        على قرص ولا شيء يُحفَظ. ويتوقف البثّ في اللحظة التي تضغط فيها
        &laquo;أوقِف&raquo;، وحين يذهب التبويب إلى الخلفية، وحين تغادر الصفحة
        &mdash; والضوءُ الذي على كاميرتك هو المؤشِّر الجدير بالثقة، لأنه لا
        تستطيع صفحةٌ إطفاءه."""

[[faq]]
q = "لماذا تعرض عليّ الرابط بدل أن تفتحه؟"
a = """
        لأن ذلك هو الجزء المفيد. فرمزُ QR عنوانٌ لا تستطيع قراءته، وهو السبب
        كله في نجاح ملصق فوق الرمز الذي على عدّاد وقوف: فبحلول معرفتك إلى أين
        ذهب تكون قد وصلت. وهنا تُطبَع السلسلة كاملة، ويُنادى على المضيف على
        سطره وحده، وفتحُه زرٌّ منفصل تضغطه بعد أن تقرأ. وتلك نقرةٌ إضافية واحدة
        وهي النقرة التي احتاجت إليها الصيغة دائماً."""

[[faq]]
q = "ماذا يستطيع قراءته؟"
a = """
        رموز QR عند كل إصدار من 1 إلى 40، بمستويات تصحيح الأخطاء الأربعة كلها،
        بالأنماط الرقمي والأبجدي الرقمي والبايتي والكانجي، مع الإبلاغ عن مجموعات
        محارف ECI ورموز الإلحاق المهيكَل بدل إسقاطها في صمت. وعلى الجانب
        المخطَّط: EAN-13 وEAN-8 وUPC-A وUPC-E وITF-14 وInterleaved 2 of 5
        وCode 128 وCode 39. ولا يقرأ Data Matrix ولا PDF417 ولا Aztec ولا
        MaxiCode."""

[[faq]]
q = "لا يقرأ رمزي. ما الخطب؟"
a = """
        تسعاً من كل عشر يكون واحداً من ثلاثة. الهامشُ الأبيض مقصوص، والقارئ
        يستعمل ذلك الهامش ليجد أين ينتهي الرمز. أو ثمّة انعكاس أو ظلّ عبر جزء
        من الرمز، فلا عتبة تفصل المربّعات الداكنة عن الفاتحة. أو الرمز أصغر في
        الإطار من أن تكون وحداته أكثر من بكسل أو بكسلين عرضاً. حرِّك الضوء،
        واملأ نحو نصف الإطار، والتقط الصورة مواجِهةً لا بميل."""

[[faq]]
q = "هل يستطيع قراءة رمز تالف أو مغطّى جزئياً؟"
a = """
        كثيراً، نعم، وذلك هو عملُ الصيغة كما صُمِّمت لا شيء بارع هنا. فكل رمز
        QR يحمل بيانات فحص Reed-Solomon، والرمزُ المصنوع عند المستوى H يستطيع
        فقدان نحو 30% من وحداته ويُعاد بناؤه بالضبط رغم ذلك. وتقول الصفحة كم
        كلمة رمزية اضطرّت إلى إصلاحها تحت &laquo;كيف قُرِئ هذا&raquo;، فترى كم
        كان قريباً من الحافّة. والذي لن تفعله أن تخمّن: فالرمزُ التالف فوق ما
        تحتمله الفحوص يُبلَّغ عنه بأنه غير مقروء لا يُجاب عنه خطأً."""

[[faq]]
q = "لماذا تقول إنها لا تستطيع إخباري إلى أين يذهب رابط bit.ly؟"
a = """
        لأن معرفة ذلك تعني سؤال bit.ly، وذلك طلبٌ شبكي. وكلُّ دعوى أخرى على هذه
        الصفحة تقوم على أنه لا شيفرة هنا تتصل بشيء، واستثناءٌ هادئ لهذا كان
        سيساوي أقلّ من الجواب. فيُسمّى المختصِر، ويُترَك ما يخفيه مجهولاً
        بصدق. وإن أردت حلّه، فالصقه في شيء مستعدّ للجلب."""

[[faq]]
q = "هل مسحُ رمز QR آمن أصلاً؟"
a = """
        مسحُه آمن. والتصرّفُ بموجبه هو الخطر، وهو خطر حقيقي: فالرموز الملصوقة
        فوق الرمز الحقيقي على عدّادات الوقوف وعلى طاولات المطاعم وعلى بطاقات
        تسليم الطرود صارت شائعة بما يكفي لأن يكون لها اسم. والذي يجعلها تنجح أن
        لا أحد يستطيع قراءة رمز بالنظر إليه. وقراءتُه دون فتحه &mdash; وهو ما
        تفعله هذه الصفحة &mdash; تزيل تلك الميزة كلها، والعشرُ ثوانٍ التي
        يستغرقها النظر إلى المضيف هي الدفاع كله."""

[[faq]]
q = "ما الشبكة الصغيرة التي تحت كل نتيجة؟"
a = """
        الوحدات التي أخذت هذه الصفحة عيّناتها فعلاً من صورتك، مرسومةً من جديد
        بمربّع لكل وحدة. وهي هناك كي تُفحَص القراءة بالعين لا أن يُوثَق بها:
        فإن بدت تلك الشبكة الرمزَ الذي صوّرته، فالجواب الذي فوقها جاء من
        البكسلات الصحيحة. ولا يعرض عليك هذا قارئٌ تقريباً، وهو الفرق بين أداة
        تستطيع فحصها وأخرى عليك تصديقها."""

[[faq]]
q = "هل يقرأ عدة رموز في صورة واحدة؟"
a = """
        واحداً لكل صورة، في الوقت الحالي. أفلِت عدة صور دفعة واحدة فتُقرأ كلٌّ
        وحدها، والكاميرا تقرأ رمزاً بعد رمز وأنت تحرّكها، محتفظةً بكل جديد لم
        ترَه من قبل. أما صورةٌ واحدة تحمل ورقةً من الرموز فعملٌ لقصّها، أو
        لتصويب الكاميرا نحوها واحداً واحداً."""

[[faq]]
q = "لماذا قالت إن باركودي بصيغة غير التي طلبتها؟"
a = """
        لأن الباركود لا يحمل اسمه. فـ UPC-A هو EAN-13 أول رقم فيه صفر، وITF-14
        هو Interleaved 2 of 5 بأربعة عشر رقماً ورقمِ تحقّق صحيح، وCode 128 في
        نمطه الرقمي لا يشبه شيئاً آخر. والذي تبلّغ عنه هذه الصفحة هو ما تقوله
        الأشرطة زائد ما يؤكّده رقم التحقّق، وهو كل ما يعرفه الرمز نفسه."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل، بالكاميرا
        وكل شيء. وهذه أيضاً أبسط طريقة لإثبات أنه لا يُرفع شيء: فقارئٌ يرسل
        صورتك بعيداً ليُفكّ ترميزها كان سيتوقف في اللحظة التي تقطع فيها
        الاتصال."""

