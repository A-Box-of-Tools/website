[[privacy]]
title = "المحتوى يذهب إلى قارئك، ولا يذهب إلى أي مكان آخر."
body = """
 ينتقل النص والملفات عبر قناة
      بيانات WebRTC: اتصال مباشر مشفّر بـDTLS بين متصفحك ومتصفح كل قارئ. لا
      خادم في ذلك الطريق. وعلى الشبكة نفسها لا تغادر البايتات المبنى أصلاً
      &mdash; حاسوبان محمولان على شبكة Wi-Fi واحدة يتبادلان كل شيء
      محلياً."""

[[privacy]]
title = "ما هو الوسيط، وكل ما يراه."
body = """
 الاتصال المباشر يحتاج إلى
      تعريف، لذا تفتح هذه الصفحة &mdash; وحدها في هذا الموقع &mdash;
      WebSocket واحداً نحو خادم لنا. يُطابق ذلك الخادم بين من كتب اسم رابط
      ومن يشارك تحت ذلك الاسم، ويمرّر بضعة كيلوبايتات من التفاوض، ولا يمسك
      بشيء: لا يُكتب في التخزين شيء أبداً، والغرفة تزول لحظة انقطاع
      المشارك. يستطيع أن يرى أن اسماً ما مستخدم، ومتى يأتي كل طرف ويذهب،
      وعناوين IP. ولا يستطيع أن يرى النص ولا الملفات ولا من سُمح له بالدخول
      ولا ما كتبه أحد &mdash; حتى طرقُ باب المشاركة الخاصة يمرّ عبر القناة
      المباشرة المشفّرة. شيفرته الكاملة في المستودع، بجوار شيفرة هذه
      الأداة. وما يبقى بعد المشاركة شيءٌ واحد: Cloudflare، التي تشغّل الخادم،
      تحتفظ بسجلٍّ لكل اتصال لمدة سبعة أيام &mdash; اسم الرابط والعنوان
      والوقت، ولا حمولة أبداً."""

[[privacy]]
title = "لا شيء يُخزَّن: إغلاق التبويب هو الحذف بعينه."
body = """
 المشاركة موجودة ما دام
      تبويبك مفتوحاً فقط. أغلقه فلا يجد القراء الجدد شيئاً، ويرى من كان
      يقرأ نسخته تختفي &mdash; على أن ما نسخه أحدهم أو نزّله قبل ذلك فهو
      له، شأن كل ما سلّمته بيدك. المسودة التي تكتبها تبقى في تخزين متصفحك
      أنت وحده كي تجدها في المرة القادمة، وهناك فقط؛ وإن وسمتها بأنها لمرة
      واحدة فلا تبقى في أي مكان."""

[[privacy]]
title = "اسم الرابط هو السر الوحيد، والوضع الخاص قفله."
body = """
 كل من يعرف اسماً أو
      يخمّنه يستطيع فتح المشاركة خلفه. لهذا كانت الاقتراحات ثلاث كلمات
      عشوائية، ولهذا يستحق كل حساس اسماً لا يُخمَّن &mdash; أو مفتاح الوضع
      الخاص، المفعّل افتراضياً: على كل قارئ يصل أن يعرّف بنفسه، عبر القناة
      المباشرة، ولا يُرسَل شيء حتى تُدخله أنت."""

[[privacy]]
title = "الاتصال المباشر يُري كل طرف عنوان الآخر."
body = """
 هذا معنى الند للند،
      والقارئ يعلمه قبل حدوثه: فتح رابط مشاركة لا يفعل سوى سؤال الوسيط إن
      كان أحد يشارك؛ ثم تقول الصفحة بوضوح إن الاتصال سيُري كل طرف عنوان IP
      الخاص بالآخر، وتنتظر نقرة. حتى تلك النقرة لا يعلم المشارك حتى بوجود
      القارئ."""

[[privacy]]
title = "ما الذي يحمّله Google، وما الذي لا يصله."
body = """ نصوص الإعلانات والقياس
      تأتي من Google، وزر التبرع من Buy Me a Coffee. لا يصل أياً منها النص
      ولا الملفات ولا أسماءها أو أحجامها ولا من اتصل. الاستثناء هو عنوان هذه
      الصفحة نفسه: رابط القارئ يحمل اسم الرابط، وسكربت الإعلانات يقرأ
      العنوان. وأي مشاركة تستحق الكتمان تستحق مفتاح الوضع الخاص. كل سطر يلمس
      المحتوى يُقدَّم من هذا الأصل وموجود في المستودع."""

[[howto]]
title = "اكتب النص، أو أرفق الملفات."
body = """
 المحرر هو المشاركة نفسها: ما
      فيه لحظة اتصال القارئ هو ما يستلمه، وكل تعديل بعد ذلك يصل إلى القراء
      المتصلين حياً، وأنت تكتب. تنتقل الملفات عبر القناة نفسها، حتى
      200&nbsp;MB للملف؛ يرى القراء القائمة ولا ينزّلون إلا ما طلبوه
      &mdash; فلا يُنفق نطاق أحد على ملف لم يرده."""

[[howto]]
title = "فعّل Markdown إن كان النص يستحق التنسيق."
body = """
 مفتاح واحد. العناوين
      والخط الغليظ والقوائم والشيفرة والروابط تُصيَّر حية بجوار المحرر
      وأنت تكتب، ويستلم القراء العرض المنسّق افتراضياً، مع مبدّل يعود إلى
      الأصل. يأتي المُصيّر مع هذه الصفحة ويهرّب كل شيء: لا يمكن للنص
      المشترك أن يصير سكربتاً على جهاز قارئ، كائناً من كان كاتبه."""

[[howto]]
title = "سمِّ الرابط، أو أبقِ الاقتراح."
body = """
 الاسم هو العنوان:
      <code>brave-otter-42</code> يُنادى به عبر الغرفة، ويُقرأ في الهاتف،
      ويُنقل عن السبورة. وهو السر الوحيد أيضاً: للخاص اختر اسماً لا يخمّنه
      أحد، أو اعتمد على مفتاح الوضع الخاص. الاسم الذي يشارك به غيرك الآن
      يُرفض، واسمك يعود شاغراً لحظة توقفك."""

[[howto]]
title = "قرر من يدخل."
body = """
 الخاص هو الافتراضي: يُطلب من كل
      قارئ أن يعرّف بنفسه &mdash; اسم، إشارة، أي شيء تعرفه &mdash; فترى
      الرسالة ومعها زر يُدخِله للقراءة وزر يصرفه. يمرّ التعريف عبر القناة
      المباشرة، فلا يعرف حتى الوسيط من طرق الباب. أزل العلامة تحصل على
      مشاركة مفتوحة يقرؤها كل من يعرف الاسم."""

[[howto]]
title = "ابدأ المشاركة، وأبقِ التبويب مفتوحاً."
body = """
 التبويب هو الخادم:
      المشاركة في المتناول ما دام مفتوحاً مستيقظاً، ولا لحظة بعد ذلك.
      إغلاق غطاء الحاسوب المحمول ينهيها كذلك. انسخ الرابط، أو قل الاسم
      فحسب &mdash; يستطيع القارئ كتابته على هيئة <code>#الاسم</code> في
      نهاية عنوان هذه الصفحة."""

[[howto]]
title = "في الجهة الأخرى: الموافقة أولاً، ثم طرق الباب."
body = """
 من يفتح الرابط يعلم أن
      أحداً يشارك، ويُنبَّه إلى أن الاتصال المباشر يُري كل طرف عنوان شبكة
      الآخر، ولا يتصل إلا باختياره. في المشاركة الخاصة يعرّف بنفسه
      وينتظرك. وما يستلمه يتحدّث حياً وأنت تحرر، ويختفي حين تغلق
      التبويب."""

[[faq]]
q = "هل يُرفع أي شيء، إلى أي مكان؟"
a = """
        لا. ينتقل النص والملفات من متصفحك إلى متصفح كل قارئ عبر قناة WebRTC
        مشفّرة، مباشرة. الخادم الوحيد المعنيّ يحمل التعريف &mdash; بضعة
        كيلوبايتات من تفاوض الاتصال &mdash; ولا يحمل المحتوى أبداً. ليس
        عنده ما يُسرَّب أو يُصادَر أو يضيع: لا يمسك بايتاً واحداً منك،
        والغرفة تزول لحظة انقطاعك."""

[[faq]]
q = "فلماذا تكلّم هذه الأداة خادماً أصلاً، وفي هذا الموقع بالذات؟"
a = """
        لأن متصفحين لا يستطيعان أن يجد أحدهما الآخر وحدهما: لا بد من شيء
        يُطابق بين من كتب <code>brave-otter-42</code> ومن يشارك تحت ذلك
        الاسم، ويحمل عرض الاتصال بينهما. ذلك الشيء هو الوسيط، الاعتماد
        الشبكي الوحيد لهذه الصفحة، المذكور في
        <code>Content-Security-Policy</code> والمنشور في مستودع الصفحة
        نفسه. إنه أصغر خادم يمكنه إنجاز المهمة: لا يخزّن شيئاً ولا يقرأ
        شيئاً، ويتنحّى لحظة يمسك المتصفحان بقناة مباشرة."""

[[faq]]
q = "ما الذي يستطيع ذلك الخادم رؤيته بالضبط؟"
a = """
        أن اسم رابط ما مستخدم، ومتى يتصل المشارك والقراء ومتى يذهبون،
        وعناوين IP الخاصة بهم، وإعداد الاتصال المشفّر الذي يتبادلونه. لا
        يرى النص ولا الملفات ولا أسماءها أو أحجامها ولا من سُمح له بدخول
        مشاركة خاصة ولا ما كتبه أحد في تعريفه &mdash; كل ذلك يمرّ عبر
        القناة المباشرة المشفّرة من طرف إلى طرف، التي لا تمرّ بالخادم. وتحتفظ
        Cloudflare، التي تشغّل الخادم، بسجلٍّ لكل اتصال لمدة سبعة أيام: اسم
        الرابط والعنوان والوقت. ولا يبقى شيء آخر بعد انتهاء المشاركة."""

[[faq]]
q = "ماذا يحدث حين أغلق التبويب؟"
a = """
        تنتهي المشاركة في كل مكان دفعة واحدة. يتوقف الرابط عن العمل خلال
        ثانية أو اثنتين، ويرى القراء الذين ما تزال صفحتهم مفتوحة نسختهم
        تختفي، مع إشارة إلى أن المشاركة انتهت. هذا ليس طلب حذف يُرسَل إلى
        خادم &mdash; فلا نسخة على خادم لتُحذف. كان التبويب المكان الوحيد
        الذي وُجدت فيه المشاركة، وإغلاقه هو التنظيف كله."""

[[faq]]
q = "هل يستطيع قارئ الاحتفاظ بما شاركته؟"
a = """
        ما دامت المشاركة مفتوحة، نعم &mdash; فهذا معنى المشاركة. يستطيع
        القارئ نسخ النص أو تنزيل ملف، وما أخذه صار له، تماماً كما لو
        سلّمته إياه بأي طريقة أخرى. ما يضمنه الإنهاء هو المستقبل: لا يصل
        إليه جديد، وتكفّ الصفحات المفتوحة عن عرضه. لا أداة تستطيع استرجاع
        ما وصل، وهذه الصفحة لا تدّعي غير ذلك."""

[[faq]]
q = "ما الوضع الخاص؟"
a = """
        الافتراضي. كل قارئ يصل يُخبَر بأن المشاركة خاصة ويُطلب منه أن
        يعرّف بنفسه؛ فترى الرسالة &mdash; &laquo;أنا أليس، من الاجتماع
        الصباحي&raquo; &mdash; ومعها زرا الإدخال والصرف، ولا يُرسَل شيء حتى
        تقرر. يمرّ التعريف عبر القناة المباشرة المشفّرة أصلاً، فلا يعرف
        الخادم أبداً من طرق الباب ولا ما قررت. أزل العلامة قبل المشاركة
        تحصل على مشاركة مفتوحة."""

[[faq]]
q = "لماذا سيرى القارئ عنوان IP الخاص بي؟"
a = """
        لأن الاتصال مباشر حقاً، والاتصال المباشر يجري بين عنوانين: كل طرف
        يعرف بالضرورة عنوان الآخر، كما في مكالمة هاتفية. يُنبَّه القارئ
        قبل أن يوجد أي اتصال ولا يتصل إلا باختياره؛ وحتى ذلك الحين لا تعلم
        أنت حتى أنه فتح الرابط. وإن لم تناسب هذه المقايضة مشاركةً بعينها،
        فالبديل خدمة تمرّر عبر خادم &mdash; بالمقايضة المعاكسة."""

[[faq]]
q = "ما حجم الملفات الأقصى، وما السرعة؟"
a = """
        حتى 200&nbsp;MB للملف الواحد، من أي نوع، وبسرعة أبطأ الاتصالين
        &mdash; فلا خادم في المنتصف يبطئ أو يقنّن. جهازان على شبكة Wi-Fi
        واحدة ينقلان بسرعة الشبكة المحلية، ولا تغادر البايتات المبنى.
        ينزّل القراء كل ملف عند الطلب، فإرفاق شيء كبير لا يكلف شيئاً حتى
        يطلبه أحد فعلاً."""

[[faq]]
q = "هل تعمل دون اتصال؟"
a = """
        نصفها، بصراحة: المحرر نعم &mdash; تُحمَّل الصفحة، ومسودتك موجودة،
        وMarkdown يُصيَّر، والكتابة والحفظ يجريان دون أي شبكة. أما
        المشاركة فلا، ولا يمكنها: بلوغ متصفح شخص آخر فعلٌ شبكي، والتعريف
        يحتاج الوسيط. هذه هي الأداة الوحيدة في هذا الموقع التي تستحيل
        مهمتها دون اتصال، والإيحاء بغير ذلك ليس من الصدق."""

[[faq]]
q = "وإن لم نستطع الاتصال؟"
a = """
        معظم أزواج المتصفحات تصل مباشرة بعد التعريف؛ وقلة لا تصل، عادة حين
        يكون الطرفان كلاهما خلف أشد أنواع شبكات الشركات أو الهاتف المحمول
        صرامة. لا تلجأ هذه الصفحة خفية إلى خادم يمرّر &mdash; فذلك يغيّر
        بصمت ما هي هذه الأداة &mdash; بل تقول بعد عشرين ثانية بوضوح إن
        الاتصال المباشر لم يتم. والمحاولة من شبكة أخرى تحل الأمر
        غالباً."""

[[faq]]
q = "هل تصيير Markdown آمن، وأي أحد يشارك أي شيء؟"
a = """
        هذا السؤال هو سبب كون المُصيّر ثمانين سطراً في شيفرة هذه الصفحة لا
