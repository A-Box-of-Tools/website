[[faq]]
q = "هل يستطيع شخصان المشاركة بالاسم نفسه؟"
a = """
        ليس في آن واحد. مشاركة حية واحدة لكل اسم، يفرضها الوسيط: من يأتي
        ثانياً يُرفض ويُطلب منه اسم آخر. ولحظة تنتهي مشاركة يعود اسمها
        شاغراً &mdash; ما يعني أيضاً أن الرابط المحفوظ لا يكون أحدث من
        المشاركة خلفه: الاسم نفسه قد يكون لغيرك الأسبوع القادم. عامل
        الرابط على أنه ملك لحظة، لا ملك شخص."""

[[faq]]
q = "هل هي مجانية، وهل أحتاج حساباً؟"
a = """
        مجانية، دون حساب ولا تسجيل، ودون حد يستحق الذكر &mdash; ستة عشر
        قارئاً متزامناً لكل مشاركة. يحمل الموقع إعلانات، وهي ما يموّله؛
        ولا يصل الإعلانات شيء عما تشاركه هذه الصفحة، والوسيط يتسع له
        الاشتراك المجاني بسهولة لأنه بالضبط لا يخزّن شيئاً ولا يكاد يفعل
        شيئاً."""

