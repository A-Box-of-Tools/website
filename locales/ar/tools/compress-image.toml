[[privacy]]
title = "صورك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والضغط هو
      <code>canvas.toBlob</code> &mdash; المرمِّز المثبَّت في متصفحك أصلاً."""

[[privacy]]
title = "الأرقام مقيسة، لا مَروِيّة."
body = """
 الأحجام ورقم الجودة
      ومقارنة SSIM كلها تُحسَب على هذه الصفحة وتُعرَض عليك. ولا يوجد في هذا
      المستودع أي حدث تحليلات مخصّص يحمل اسم ملف أو حجماً أو عدداً أو نتيجة."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن صورك. وكل سطر يقرأ ملفاً أو يضغطه أو يقيسه يُخدَم من هذا
      الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر صورك."
body = """
 أفلِتها على المُنتقي أو اخترها يدوياً.
      يقرؤها المتصفح من قرصك مباشرة، ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اكتب الحجم المطلوب منك."
body = """
 100 KB لاستمارة الرفع
      التي ترفض صورتك مرة بعد مرة، و500 KB لبوابة التقديم، و2 MB لصفحة يجب أن
      تُحمَّل بسرعة. والأحجام الأربعة الشائعة أزرار جاهزة."""

[[howto]]
title = "اضغط &laquo;اضغط إلى الحجم المطلوب&raquo;."
body = """
 تُرمَّز كل صورة عدة
      مرات بينما تضيّق الأداة على أعلى جودة تتّسع للحجم. وما كان دون الحجم
      المطلوب أصلاً يُترَك كما هو تماماً."""

[[howto]]
title = "انظر ماذا كلّف ذلك، ثم نزِّل."
body = """
 تقول كل نتيجة بأي صيغة
      كُتِبت، وبأي جودة، وهل تغيّرت الأبعاد، وكم تطابق الأصل حين يُقاس.
      و&laquo;قارِن&raquo; يضع الصورتين جنباً إلى جنب."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يفك متصفحك أنت ترميز الملف ويضغطه ويقيسه على جهازك أنت، بمرمِّزات
        JPEG وPNG وWebP التي يأتي بها المتصفح أصلاً. لا تملك هذه الأداة أي
        وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا ترسل شيئاً
        &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل
        عنوان يجوز لها الاتصال به، وليس واحد منها لنا."""

[[faq]]
q = "كيف يبلغ حجماً محدّداً بالضبط؟"
a = """
        بالمحاولة. لا توجد معادلة تحوّل إعداد الجودة إلى عدد بايتات &mdash; فذلك
        متوقّف على الصورة نفسها تماماً &mdash; فتُرمّز الأداة الصورة عدة مرات
        وتبحث عن الجواب. تبدأ من أعلى مدى الجودة وتضيّق بالتنصيف، فتجد أعلى
        جودة تتّسع للحجم في نحو ثمانية ترميزات. وكل حجم تراه على الصفحة ملف
        مرمَّز فعلاً، لا تقديرٌ له."""

[[faq]]
q = "ماذا تعني &laquo;أقل خسارة ممكنة&raquo; هنا بالضبط؟"
a = """
        ثلاثة أشياء بعينها. أولاً، الصورة التي هي دون حجمك المطلوب أصلاً تمرّ
        بايتاً بايتاً بلا إعادة ترميز. ثانياً، تُنفَق الجودة قبل الدقة، ولا
        تنزل إلا إلى حدٍّ تبدأ عنده آثار الضغط في الظهور &mdash; وبعد تلك
        النقطة تصغّر الأداة الصورة وترفع الجودة من جديد، لأن بكسلات أقل وجيدة
        أحسن منظراً من بكسلات أكثر ومُفسَدة. ثالثاً، متى وُجدت نتيجة تتّسع
        للحجم عاد البحث يصعد حتى تُستهلك الميزانية، فلا تحصل على ملف بحجم
        300 KB وقد طلبت 500 KB."""

[[faq]]
q = "ما رقما SSIM وPSNR على كل نتيجة؟"
a = """
        هما قياس لما كلّفه الضغط، يُؤخذ بفك ترميز النتيجة ومقارنتها بالصورة
        الأصلية. يقارن SSIM السطوع والتباين والبنية موضعياً، وهو أقرب بكثير
        إلى ما تعترض عليه العين من عدّ البكسلات المتغيّرة؛ وفوق 0.98 تقريباً
        يصعب التفريق بين الاثنتين جنباً إلى جنب. أما PSNR فهو الرقم التقليدي
        بالديسيبل. ويُحسَب كلاهما على جهازك، ويُعرَضان معاً حتى يكون ادعاء قلة
        الخسارة قابلاً للتحقق لا مجرد دعوى."""

[[faq]]
q = "ما الصيغ التي يقرؤها ويكتبها؟"
a = """
        يقرأ كل ما يستطيع متصفحك فك ترميزه، وهو عملياً JPEG وPNG وWebP وGIF
        وBMP و&mdash; على معظم المتصفحات الحالية &mdash; AVIF. ويكتب JPEG وPNG
        وWebP، لأن هذه هي المرمِّزات التي تأتي بها المتصفحات. وعلى وضع
        &laquo;تلقائي&raquo; يبقي على الصيغة التي وصل بها ملفك، ولا ينتقل إلى
        WebP إلا حين يكون الإبقاء عليها مؤدياً إلى تصغير أو إلى هبوط ظاهر في
        الجودة."""

[[faq]]
q = "لماذا لا يستطيع ضغط ملف PNG كثيراً؟"
a = """
        لأن PNG بلا خسارة: ليس فيه مقبض جودة يُدار. والسبيل الوحيد إلى تصغير
        ملف PNG هو إعطاؤه بكسلات أقل أو ألواناً أقل، فحين تختار PNG تبلغ
        الأداة الحجم المطلوب بالتصغير وحده. فإن كانت الصورة فوتوغرافية،
        فسيقترب JPEG أو WebP من حجمك المطلوب أكثر بكثير، وبجودة ترى بنفسك
        أنها سليمة &mdash; وإن كانت شعاراً أو لقطة شاشة فيها شفافية، فإن WebP
        يبقي على الشفافية التي كان JPEG سيملؤها بالأبيض."""

[[faq]]
q = "هل يزيل ضغطُ الصورة بياناتِ EXIF وGPS منها؟"
a = """
        نعم، كأثر جانبي. فالضغط يعني فك ترميز الصورة إلى بكسلات ثم إعادة ترميز
        تلك البكسلات، ولوحة البكسلات لا تحمل وسوماً، فالموقع وطراز الكاميرا
        والأوقات وكل ما عداها لا تُكتَب ببساطة في الملف الجديد. وإن أردت
        البيانات الوصفية زائلة والصورة على حالها، فاستخدم
        <a href="../إزالة-بيانات-exif/">عارض EXIF ومُزيله</a> بدلاً من هذا &mdash;
        فهو يعيد كتابة الحاوية دون إعادة ضغط أي شيء."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ولا حدّ لعدد الملفات ولا لأحجامها كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن صورك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورك بعيداً لتُضغَط
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

