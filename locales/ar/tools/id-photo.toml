[[privacy]]
title = "صورة وجهك لا تغادر هذا الجهاز أبداً."
body = """
 وهذا هنا أهمّ منه في
      معظم الأدوات: فالملف الذي تتناوله هذه الصفحة صورةٌ لوجهك، والشيء الذي
      أنت على وشك فعله به يُسمّي البلد الذي تتقدّم بطلب مستنده. وتُسمّي
      <code>Content-Security-Policy</code> كل عنوان يجوز لهذه الصفحة الاتصال
      به، وليس واحد منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده صورتك."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. وكتاب القواعد
      جدولٌ في <code>src/specs.js</code>، يُخدَم مع الصفحة ويُخبَّأ معها
      &mdash; فلا قائمة بلدان تُستعلَم ولا شيء تُقارَن به صورتك عن بُعد."""

[[privacy]]
title = "الوجه يُوجَد دون نموذج وجوه."
body = """
 لا أوزان تُنزَّل، ولا زمن
      تشغيل استدلال، ولا شيء يُجلَب: فالتاج يأتي من الخطّ الخارجي لرأسك في
      مقابل الجدار الذي خلفه، والبؤبؤان من رقعتَي الوجه الأدكن مما حولهما.
      وليس فيه ما يقرأ لون البشرة، وهذا هو سبب كتابته على هذا النحو كله
      &mdash; فالنموذج الذي يخطئ يخطئ على نحو غير متساوٍ، أسوأ في وجوه منه في
      أخرى. وهو موضع بداية لا حُكم: إذ تقول الصفحة أياً من النقاط الأربع عجزت
      عن قياسها، وتبقى كل نقطة قابلة للسحب، والتحويل إلى
      <em>سأضعها بنفسي</em> يطفئه بالكلية."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها شيئاً عن صورتك ولا عن وجهك ولا عن قاعدة أي بلد اخترت. وكل سطر يقرأ
      ملفاً أو يقصّه أو يقيسه أو يكتبه يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر الصورة."
body = """
 صورة بهاتف أمام جدار سادة، في ضوء
      النهار، ملتقَطة من نحو متر ونصف. يقرؤها المتصفح من قرصك مباشرة؛ ولا
      يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اختر البلد والمستند."
body = """
 عندها تعرض اللوحة مقاس الطباعة
      لتلك القاعدة، ونطاق ارتفاع الرأس، وخطّ العينين، ولون الخلفية، وحدود
      الرفع &mdash; ومعها الجهة التي صدر عنها كل رقم وتاريخ قراءته. ولا شيء في
      تلك القائمة مخمَّن، وما أُرسِل إليك وليس فيها يدخل تحت
      &laquo;أي مكان آخر&raquo;."""

[[howto]]
title = "تحقّق من النقاط الأربع على وجهك."
body = """
 التاج، والذقن، وكل
      بؤبؤ &mdash; فتلك النقاط الأربع هي كل ما تقيسه القاعدة. وهي موضوعة بقياس
      الصورة نفسها، والسطر الذي تحتها يقول أياً منها نجح وأياً منها اضطرّ إلى
      استنتاجه؛ فاسحب ما حطّ منها في غير موضعه، أو حوِّل إلى
      <em>سأضعها بنفسي</em> وضَع الأربع كلها بنفسك. ثم اضغط
      <em>اضبط الإطار</em> فيحطّ القصّ حيث يريده ذلك البلد."""

[[howto]]
title = "اقرأ الفحوص الأربعة، والخلفية."
body = """
 ارتفاع الرأس، وخطّ
      العينين، والتوسيط، والميل، كلٌّ مقيسٌ من الإطار كما هو وكلٌّ يقول إلى أي
      جهة تسحب إن كان خارجاً. وتُقرأ الخلفية من أعلى القصّ ومن جانبيه وتُقارَن
      باللون الذي تطلبه القاعدة &mdash; أما التفاوت، وهو ما يردّ الصور فعلاً،
      فيُقاس على حدة عن اللون."""

[[howto]]
title = "خذ الملفات الثلاثة."
body = """
 ملف الطباعة، بالمليمترات
      بالضبط والدقة مكتوبة في الملف كي يطبعه المحلّ بالمقاس الصحيح. وملف
      الورقة، بأكبر عدد من النُّسَخ تحمله ورقة 4&nbsp;&times;&nbsp;6 وعلامات
      قصّ في الفجوات. وملف الرفع، بمقاس البكسل الذي تفرضه البوابة وداخل نطاق
      الـ KB الذي تفرضه من الطرفين."""

[[faq]]
q = "هل تُرفع صورتي إلى أي مكان؟"
a = """
        لا. يفكّ متصفحك أنت ترميز الصورة ويقصّها ويقيسها ويكتبها على جهازك
        أنت، بمرمِّز JPEG الذي يأتي به المتصفح أصلاً. لا تملك هذه الأداة أي
        وظيفة شبكية على الإطلاق &mdash; فهي لا تجلب شيئاً ولا ترسل شيئاً
        &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل
        عنوان يجوز لها الاتصال به، وليس واحد منها لنا. وذلك هنا أثمن منه في
        معظم الأدوات: فالملف صورةٌ لوجهك."""

[[faq]]
q = "ما البلدان المشمولة؟"
a = """
        المواصفات المنقولة حتى الآن هي معيار ICAO نفسه، والولايات المتحدة
        (جواز السفر وطلب تأشيرة التنوّع، ولهما قواعد رفع مختلفة)، والمملكة
        المتحدة، وتأشيرة شنغن، وألمانيا، وكندا، وأستراليا، والهند (جواز
        السفر، ومقاس الطباعة 35&nbsp;&times;&nbsp;45&nbsp;مم، وصورة استمارة
        SSC/UPSC والتوقيع)، والصين، واليابان. ويُسمّي كل مدخل الجهة التي جاء
        منها وتاريخ قراءته. وما عدا ذلك يدخل تحت &laquo;أي مكان آخر&raquo;،
        حيث كل رقم لك تكتبه &mdash; ولأن معظم العالم يُصدر على هندسة ICAO،
        فذلك المدخل يبدأ عليها."""

[[faq]]
q = "كيف يجد التاج والذقن والعينين دون نموذج وجوه؟"
a = """
        باستعمال شيء لا يُسمح لكاشف وجوه عام أن يفترضه وتُسمح به هذه الأداة:
        فكل واحدة من هذه المواصفات تفرض المشهد نفسه &mdash; شخص واحد، مواجهٌ
        للكاميرا، أمام جدار سادة متساوي الإضاءة. فيُقرأ لون الجدار من حافّة
        الصورة، وكل ما ليس ذلك اللون هو الشخص، وأعلاه هو التاج بالشعر. ويُوجَد
        البؤبؤان بوصفهما أفضل زوج من الرقع الأدكن مما حولها، متساويَي المستوى،
        على جانبَي وسط الرأس &mdash; وهي مقارنة موضعية، فليس فيها ما يتوقّف
        على لون الوجه. أما الذقن فهو الذي لا يمكن إيجاده هكذا، لأن الفكّ في
        مقابل العنق حافّة لينة لا تغيّر لون عبرها؛ فيُستنتَج من البؤبؤين،
        وهما يقعان عند نصف ارتفاع الرأس تقريباً بالضبط، ثم يُتحقَّق منه في
        مقابل الخطّ الخارجي. وكل ذلك حسابٌ في <code>src/detect.js</code>: لا
        أوزان، ولا زمن تشغيل استدلال، ولا شيء يُجلَب، والحساب نفسه لكل وجه
        يمرّ به. وذلك الأخير هو المهمّ، لأن الكاشف المشحون يخطئ على نحو غير
        متساوٍ &mdash; أسوأ في وجوه منه في أخرى &mdash; والذين تُردّ صورهم
        أكثر من غيرهم أصلاً هم الذين كان سيخذلهم."""

[[faq]]
q = "كم ينبغي أن أثق بالنقاط التي يضعها؟"
a = """
        ثقةَ من يبدأ منها، لا ثقةَ من يترك النظر إليها. فلكل واحدة من الأربع
        صورةٌ تخطئ فيها: الجدار المزخرف أو رفّ الكتب لا يترك خطاً خارجياً
        يُوجَد الرأس في مقابله، والرأس المقصوص من أعلاه لا تاج له في الصورة
        أصلاً، والنظارة أو الغرّة الكثيفة أو العينان المغمضتان قد تضع
        البؤبؤين على معلم آخر. فتقول الأداة جهراً أياً من الأربع قاست وأياً
        منها اضطرّت إلى استنتاجه، وترفض صراحةً صورةً لا خلفية سادة فيها بدل أن
        تخترع جواباً، وتترك كل نقطة قابلة للسحب. ويُؤخَذ القصّ من حيث تنتهي
        النقاط، لا من حيث بدأت. وإن كنت تفضّل وضع الأربع بنفسك، فالمفتاح فوق
        الصورة يقول <em>سأضعها بنفسي</em>، وتحريكُ أي نقطة بيدك يقلب إليه من
        تلقائه &mdash; ومن تلك اللحظة صارت لك ولن يحرّكها شيء بعد."""

[[faq]]
q = "ما قاعدة ارتفاع الرأس، ولماذا تفشل صورتي فيها دائماً؟"
a = """
        كل واحدة من هذه المواصفات تنصّ على كم يملأ الرأس من الإطار، مقيساً من
        أسفل الذقن إلى أعلى الرأس بالشعر &mdash; وهو عادةً 70 إلى 80 في
        المئة، أي 31.5 إلى 36&nbsp;مم لصورة بارتفاع 45&nbsp;مم. والسبب
        المعتاد للفشل صورةٌ ذاتية: فطول الذراع نحو 60&nbsp;سم، وذلك يشوّه
        الوجه ويجعل الرأس أكبر مما ينبغي في الإطار. والسبب الثاني المعتاد هو
        التاج &mdash; فهو أعلى الشعر لا منبته، ووضعُ العلامة عند منبت الشعر
        يُخرِج كل رأس أصغر مما ينبغي."""

[[faq]]
q = "لماذا يجب ألا يقلّ الملف عن 20 KB، وكيف يمكن حشوه؟"
a = """
        بوابات الامتحانات الهندية واستمارة التأشيرة الصينية ورفع جواز السفر
        البريطاني، كلها تنصّ على حدّ أدنى لحجم الملف كما تنصّ على حدّ أقصى،
        لأن الملف الأصغر منه يكون عادةً مصغَّرة رفعها أحدهم سهواً. وصورةٌ
        بمقاس 200&nbsp;&times;&nbsp;230 هي 46,000 بكسل، وبأعلى جودة يكتبها
        متصفح قد تحطّ عند 15&nbsp;KB، ولا سبيل إلى تكبيرها بضغط أقل. فتضيف
        الأداة مقطع تعليق JPEG مملوءاً بالمسافات. وذلك جزء من معيار JPEG،
        وكل فاكِّ ترميز يتخطّاه، والصورة هي الصورة نفسها بتّاً ببتّ &mdash;
        وإنما طال الملف. ويقول الحشو ذلك بالضبط، بالإنجليزية، داخل الملف."""

[[faq]]
q = "هل يفحص الخلفية، وهل يستطيع استبدالها؟"
a = """
        يفحص ولن يستبدل. يُقرأ اللون من شريط عبر أعلى القصّ ونزولاً على كل
        جانب، فوق الكتفين، ويُقارَن بلون القاعدة في فضاء CIE Lab لا في RGB
        &mdash; فرماديّان يفصل بينهما أربعون وحدة RGB لا يُفرَّق بينهما،
        وأربعون وحدة من الأزرق لون آخر. ويُقاس التفاوت على حدة، لأن الظلّ على
        جدار أبيض هو ما يردّ الصور فعلاً، وليس مشكلة لون. أما استبدال الخلفية
        فيعني اقتطاع شخص من صورة، وذلك نموذج تجزئة، ورديئه يأكل الشعر.
        والوقوف على بُعد قدم أخرى من الجدار يصلح من هذه أكثر مما يصلح أي
        مرشِّح."""

[[faq]]
q = "ما فائدة ورقة 4 × 6؟"
a = """
        الكشك يتقاضى عدة جنيهات مقابل ست صور. ومحلّ الطباعة يطبع ورقة
        6&nbsp;&times;&nbsp;4 بفلوس قليلة وكلهم يفعلها. فتضع الأداة من نُسَخ
        صورتك ما تحمله الورقة &mdash; ثماني نسخ، لصورة
        35&nbsp;&times;&nbsp;45 على ورقة 6&nbsp;&times;&nbsp;4 &mdash; مع
        علامات قصّ في الفجوات ولا شيء مطبوع فوق صورة. ولا شيء يُقاس ليتّسع:
        فكل نسخة بالمقاس الذي تطلبه القاعدة بالضبط، لأن ورقةً صغّرتها اثنين في
        المئة كي تُدخل واحدة أخرى تكون ثماني صور كلها بالمقاس الخطأ. اطبعها
        عند 100 في المئة؛ فـ &laquo;ملاءمة الصفحة&raquo; هو ما يُخرِج الورقة
        خطأً."""

[[faq]]
q = "لماذا يهمّ الـ dpi إن كانت البكسلات هي هي؟"
a = """
        لأن ملف JPEG يستطيع أن يقول ما مقاسه، وإن لم يقل خمّن ما يطبعه.
        والدقة تقبع في ترويسة JFIF، ولوحةُ المتصفح تكتب تلك الترويسة وحقل
        الوحدات فيها مضبوط على &laquo;هذه نسبة أبعاد لا دقة&raquo;. فتعيد هذه
        الأداة كتابة تلك البايتات القليلة كي يقول الملف 300&nbsp;dpi، وهو ما
        يحوّل 413&nbsp;&times;&nbsp;531 بكسلاً إلى صورة
        35&nbsp;&times;&nbsp;45&nbsp;مم بدل صورة بلا مقاس بعينه. ولا شيء
        يُفكّ ترميزه لفعل ذلك ولا جودة تُنفَق."""

[[faq]]
q = "هل يستطيع صنع ملف التوقيع كذلك؟"
a = """
        نعم &mdash; فاستمارتا SSC وUPSC تريدان واحداً بمقاس
        140&nbsp;&times;&nbsp;60 بكسلاً وبين 10 و20&nbsp;KB، وهو في القائمة
        بوصفه مواصفة قائمة بذاتها. وتُطفأ طبقةُ الوجه له، إذ لا خطّ عينين
        لتوقيع، والذي يُفحَص بدلاً منها أن الورق فاتح، وأن عليه حبراً، وأن
        القصّ لم يلتقط سطراً مسطَّراً ولا حافّة الصفحة. وبلوغُ 10&nbsp;KB هو
        الجزء الصعب من تلك القاعدة، لا البقاء تحت 20."""

[[faq]]
q = "هل يضمن هذا قبول طلبي؟"
a = """
        لا، ولا يستطيع ذلك بصدق أي أداة. وإنما يطبّق الأرقام المنشورة بالضبط
        ويعرض عليك كل قياس قاسه، كي تكون الأشياء التي تقيسها الاستمارة آلياً
        &mdash; مقاس البكسل، وحجم الملف، والصيغة &mdash; صحيحةً، وتكون
        الأشياء التي يقيسها فاحص بشري &mdash; ارتفاع الرأس، وخطّ العينين،
        والخلفية &mdash; أمامك وعليها أرقام. والقواعد تتغيّر كذلك: فكل
        مواصفة هنا تقول من أي جهة جاءت ومتى قُرِئت، كي تستطيع مقابلتها
        بالاستمارة التي أمامك بدل أن تثق بجدول."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية
        مطبوعة عبر وجهك. ولا حدّ لعدد الصور التي تصنعها كذلك، إذ لا خادم يدفع
        ثمنها. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون
        شيئاً عن صورتك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل &mdash;
        فكتاب القواعد ملفٌّ يُخدَم مع الصفحة لا استعلام. وهذه أيضاً أبسط
        طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل صورتك بعيداً لتُقَصّ كانت
        ستتوقف في اللحظة التي تقطع فيها الاتصال."""

