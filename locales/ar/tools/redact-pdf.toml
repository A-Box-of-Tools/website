        يُعاد ترميزه: فالخطوط والصور والرسم المتجهي تأتي بايتاً بايتاً، فيبقى
        ما بقي من النصّ قابلاً للتحديد والبحث كما كان تماماً."""

[[faq]]
q = "هل يستطيع فتح ملف PDF محميّ بكلمة مرور؟"
a = """
        لا، وذلك مقصود. فالمستند المشفَّر يُرفَض برسالة تقول ذلك، حتى حين تكون
        كلمة المرور فارغة &mdash; وهو ما تحفظ به كثير من الماسحات والناسخات.
        فنزعُ الحماية عن ملف عملٌ آخر غير إخراج كلمات منه، والأداة التي تفعله
        في صمت تكون قد فعلت ما لم تطلبه."""

[[faq]]
q = "هل ثمّة حدّ للحجم، وهل يكلّف شيئاً؟"
a = """
        لا حدّ مكتوباً في الأداة. والحدّ جهازك أنت: فالمستند يُحفَظ في الذاكرة
        أثناء العمل عليه، فحاسوب محمول سيأخذ بضع مئات من الميغابايتات دون شكوى
        وسيتعثّر في مكان ما فوق ذلك. وهو مجاني، ولا حساب ولا تسجيل دخول ولا
        فترة تجريبية. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى
        المعلنون شيئاً عن مستنداتك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل مستندك بعيداً ليُطمَس
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

