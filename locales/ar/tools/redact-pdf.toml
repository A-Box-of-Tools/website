[[privacy]]
title = "المستطيل الأسود ليس طمساً، وهذا لا يرسم واحداً فوق شيء."
body = """

      في كل برنامج تقريباً يعرض أن يطمس صفحة &mdash; قارئ PDF، أو معالج نصوص،
      أو أداة تصميم &mdash; يكون المستطيل كائناً محفوظاً بجانب النصّ لا فيه.
      فالنصّ ما زال هناك، في الملف نفسه، في الموضع نفسه، وتحديدُ المساحة وضغطُ
      &laquo;نسخ&raquo; يعيده إليك. وذلك الإخفاق نشر مرافعات محاكم وتقارير
      استخبارية، وفي ديسمبر 2025 أسماءً مسوّدةً في إصدار واسع لوثائق وزارة
      العدل قُرِئت خلال ساعات. وهذه الأداة تحذف الحروف من التعليمات التي ترسم
      الصفحة. فلا مستطيل تحته شيء، لأنه لا شيء تحته."""

[[privacy]]
title = "الملف المنتهي يُفتَح من جديد ويُبحَث فيه، هنا، قبل أن يُعرَض عليك."
body = """

      كل دعوى أعلاه هي هذه الأداة تصحّح ورقتها بنفسها حتى يحدث ذلك. فتُناوَل
      البايتات التي هي على وشك أن تصير تنزيلك إلى القارئ نفسه كأنّ غريباً
      أرسلها، وتُقرأ كل صفحة من جديد، وتُجمَع كل إشارة مرجعية وتعليق وحقل
      استمارة وخاصية مستند، ويُبحَث عن الكلمات التي أزلتها. والعدد على
      النتائج. فإن نجا شيء، أُبلِغ عن الجولة بأنها فشلت ولا تنزيل."""

[[privacy]]
title = "الكلمات لا تغادر التبويب، ولا يغادره البحث."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. وهذه الأداة لا تضيف شيئاً إلى تلك القائمة: فليست لها وظيفة
      شبكية خاصة بها، ولا حتى اختيارية. وما تكتبه في حقل البحث سلسلةٌ تُقارَن
      بنصٍّ في ذاكرة هذا التبويب، وليس لأيٍّ منهما مكان يذهب إليه."""

[[privacy]]
title = "الطمس هو العمل الأقلّ احتمالاً للرفع."
body = """

      فالذي يطمسه الناس هو سبب وجوب ألا يُرفَع. إفادةُ شاهد، ورسالةٌ طبية،
      وكشفُ حساب بنكي ذاهب إلى مالك عقار، وعقدٌ فيه اسم عميل ذاهب إلى عميل آخر.
      ومناولةُ ذلك لخادم غريب كي يُزال منه الجزء الخاص تعني أن الجزء الخاص يصل
      أولاً، سليماً، وأنه النسخة التي يحتفظون بها. وهذه الصفحة لا نصف آخر
      لها."""

[[privacy]]
title = "ما يبقى يُنسَخ دون أن يُمَسّ."
body = """

      البايتات الوحيدة التي تتغيّر على صفحة هي تعليمات إظهار النصّ التي كانت
      الحروف المُزالة جزءاً منها. وكلُّ تعليمة أخرى، وكلُّ خطّ وصورة وخطّ رسم
      تشير إليه الصفحة، تُنسَخ كما وصلت بالضبط &mdash; فلا شيء يُعاد عرضه ولا
      ترميزه ولا تنسيقه. ويُقاس عرضُ ما أُخرِج ويُعاد على هيئة تعليمة تباعد،
      فتبقى بقية السطر حيث وضعها المستند."""

[[privacy]]
title = "لا يستطيع إخراج كلمات من صورة، ويقول أي الصفحات تلك."
body = """

      الصفحة الممسوحة ضوئياً صورة. والكلمات عليها بكسلات لا نصّ، ولا شيء هنا
      يستطيع مسّها. فإن كان المسح يحمل طبقة البحث غير المرئية التي ينتجها
      التعرّف الضوئي على الحروف في الماسحة، فهذه الأداة تزيل تلك الطبقة
      &mdash; وهي التي كان البحث والنسخ سيجدانها &mdash; وتقول صراحةً على
      الصفحة إن الصورة ما زالت تعرض الكلمات. وتغطيةُ تلك الصورة عملٌ آخر؛ و
      <a href=\"../طمس-الصورة/\">طمس الصور</a> هو الأداة التي تطمس البكسلات."""

[[privacy]]
title = "المستند يكفّ عن قول مصدره."
body = """

      الخصائص وحزمة XMP تذهبان في كل جولة: فلا سطر مُنتِج، ولا تاريخ إنشاء، ولا
      مؤلف، ولا عنوان، ولا شيء من الكتل الخاصة التي يتركها برنامج التنضيد
      وراءه. فالملف الذي أُخرِج اسمٌ من صفحاته وخصائصه ما زالت تقول
      <code>Smith settlement draft 3.docx</code> لم يُطمَس، وذلك ليس شيئاً
      يُترَك لمربع اختيار."""

[[privacy]]
title = "الملفات المشفَّرة تُردّ لا تُفتَح."
body = """

      ملف PDF عليه كلمة مرور يُرفَض، ومن ذلك النوع الذي تنتجه الماسحات بكلمة
      مرور فارغة والذي كان سيُفتَح تقنياً. فنزعُ الحماية عن مستند عملٌ آخر غير
      إخراج كلمات منه، وفعلُه في صمت شيء يفاجئ من أداة أن تفعله نيابةً عنك."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن مستندك: لا ملفاً،
      ولا صفحةً، ولا اسماً، ولا حجماً، ولا عدد صفحات، ولا كلمةً بحثت عنها. وكل
      سطر يقرأ ملف PDF أو يحرّره أو يكتبه يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن مستنداتك. ولا يحدث شيء ما
      لم تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل مستندك بعيداً
      ليُطمَس كانت ستتوقف."""

[[howto]]
title = "اختر ملف PDF."
body = """
 مستند واحد في كل مرة، عن قصد:
      فالطمس عملٌ لا بدّ من النظر فيه صفحةً صفحة، والأداة التي تدعك تؤشّر على
      كلمات في ملف ثم تطبّقها في صمت على آخر هي بالضبط الطريق الذي يُرسَل به
      الشيء الخطأ. ويقرؤه المتصفح من قرصك مباشرة."""

[[howto]]
title = "قل ما الذي يجب أن يزول."
body = """
 اكتب الكلمات &mdash; اسماً، أو
      عنواناً، أو مرجعاً &mdash; فيُسرَد كل موضع تظهر فيه ومعه السطر الذي تجلس
      عليه ومربعُ تأشير. والباحثات التي بجانب المربع ستبحث عن عناوين البريد
      وأرقام البطاقات وأرقام IBAN وأرقام الضمان الاجتماعي والتأمين الوطني
      وأرقام الهواتف. وتُعرَض هذه ولا يُؤشَّر عليها نيابةً عنك أبداً: فالنمط لا
      يستطيع تمييز رقم هاتف من رقم مرجع."""

[[howto]]
title = "اقرأ الصفحة والتقط الكلمات منها."
body = """

      تعرض اللوحة نصّ المستند كما هو مخزَّن فعلاً، بالترتيب الذي كان قارئ
      سينسخه به. انقر أي كلمة لإخراجها وانقرها ثانيةً لإبقائها. وكل ما هو
      مشطوب هو ما سيزول &mdash; وهذا ما يجعل هذه المراجعةَ والاختيارَ معاً،
      وهي جديرة بأن تُفعَل على كل صفحة قبل أن تضغط الزر."""

[[howto]]
title = "أخرِجها، واقرأ السطر الذي يقول إنه فُحِص."
body = """

      تُحذَف الحروف، وتُترَك الفجوة التي خلّفتها مفتوحة، ويُرسَم صندوق أسود
      فوقها إن طلبته، وتُخرَج الكلماتُ نفسها من الإشارات المرجعية والتعليقات
      وحقول الاستمارات وخصائص المستند. ثم يُفتَح الملف المنتهي من جديد هنا
      ويُبحَث فيه. فإن كانت كلمةٌ أزلتها ما زالت تُوجَد فيه، فلا تنزيل لك
      ورسالةٌ تقول ذلك."""

[[faq]]
q = "بمَ يختلف هذا عن رسم صندوق أسود في قارئ PDF؟"
a = """
        المستطيل المرسوم في قارئ تعليقٌ: كائنٌ له موضع، محفوظ بجانب الصفحة.
        والنصّ الذي تحته لم يُمَسّ. فمن حدّد تلك المساحة وضغط &laquo;نسخ&raquo;،
        أو فتح الملف ببرنامج آخر، أو مرّر عليه أي مستخرِج نصّ، استعاد الكلمات.
        وبعض القارئات تعرض أمر &laquo;طمس&raquo; يطبّق الإزالة كما ينبغي
        &mdash; وعدةٌ منها لا تعرض إلا الرسم. وهذه الأداة لا مستطيل لها
        يُزاح: فالحروف مقتطَعة من تعليمات رسم الصفحة، والصندوق الأسود، إن
        تركته مفعَّلاً، يُرسَم بعد ذلك فوق فجوة فارغة أصلاً."""

[[faq]]
q = "كيف أعرف أن الكلمات زالت حقاً؟"
a = """
        لأن الأداة تفحص، على جهازك، وتريك العدد. فمتى كُتِب الملف فُتِح من جديد
        بالقارئ نفسه الذي على هذه الصفحة، وقُرِئت كل صفحة، وجُمِعت كل إشارة
        مرجعية وتعليق وحقل استمارة وخاصية، وبُحِث عن كل كلمة أزلتها. ويقول سطر
        النتائج كم كانت وكم بقي. فإن لم يكن الجواب ما ينبغي، فشلت الجولة ولم
        يُعرَض شيء للتنزيل. وتستطيع أنت أيضاً فحصه بعد ذلك في أي قارئ: اضغط
        Ctrl+F وابحث عن الكلمة."""

[[faq]]
q = "هل تتحرّك بقية الصفحة حين تُزال كلمة؟"
a = """
        لا. فالنصّ يُرسَم بتقديم قلم عبر الصفحة، فحذفُ خمسة حروف كان سيجرّ بقية
        السطر خمسة حروف إلى اليسار عادةً. ويُقاس عرضُ ما أُزيل بالضبط من
        مقاييس الخطّ نفسه ويُعاد على هيئة تعليمة تباعد، وهي تحرّك القلم دون أن
        ترسم شيئاً. فتبقى الأعمدة محاذية وتبقى المجاميع تحت عناوينها."""

[[faq]]
q = "هل يستطيع طمس مستند ممسوح ضوئياً؟"
a = """
        لا الصورةَ، ويقول ذلك بدل أن يتظاهر. فالمسح صورةٌ فوتوغرافية لصفحة:
        الكلمات فيه بكسلات ولا نصّ ليُزال. والذي يحمله المسح كثيراً هو طبقة نصّ
        غير مرئية كتبها التعرّف الضوئي على الحروف في الماسحة فوق الصورة كي
        يمكن البحث في الصفحة &mdash; وهذه الأداة تجد تلك الطبقة، وتزيل منها ما
        تختاره، وتخبرك على الصفحة أن الصورة لم تتغيّر. فيكفّ البحث والنسخ عن
        إيجاد الكلمة، ويظل من ينظر إلى الصفحة يقرؤها. أما للصورة، فـ
        <a href=\"../طمس-الصورة/\">طمس الصور</a> يطمس البكسلات نفسها."""

[[faq]]
q = "وماذا عن أجزاء المستند التي ليست على صفحة؟"
a = """
        تُعالَج، لأنها الموضع الذي يتسرّب منه الطمس عادةً. فتُخرَج الكلمات
        نفسها من الإشارات المرجعية والتعليقات والملاحظات اللاصقة، ومما كُتِب في
        حقول الاستمارات، ومن النصّ الذي يُعطى لقارئ الشاشة، ومن النصّ البديل
        الذي ينسخه القارئ <em>بدلاً من</em> الحروف التي على الصفحة &mdash;
        وذلك الأخير موجود كي تُنسَخ الحروف المتشابكة والكلمات المفصولة بشرطة
        كما ينبغي، وهو قد يحمل جملة كاملة. أما خصائص المستند وحزمة XMP فتُزالان
        صراحةً. وتُسقَط المرفقات وكل ما يعمل عند فتح الملف، لأنه لا يمكن البحث
        في أيٍّ منهما عن الكلمات التي تزيلها."""

[[faq]]
q = "هل تُرفع مستنداتي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويحرّره ويكتبه على جهازك أنت. ولا جانب خادمَ
        لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. وما
        تكتبه في حقل البحث يُقارَن بنصٍّ في ذاكرة هذا التبويب ولا يذهب إلى أي
        مكان هو الآخر."""

[[faq]]
q = "لماذا لا أستطيع سحب صندوق فوق الصفحة كما في الأدوات الأخرى؟"
a = """
        لأن رسم صفحة يعني عارض PDF كاملاً &mdash; خطوطاً وتظليلاً وشفافية
        وأنماط مزج &mdash; وهو ميغابايت أو أكثر من المحرّك يُجلَب ويُشغَّل،
        وهذا الموقع لا يشحن شيئاً منه. وقد تبيّن أن ذلك يناسب العمل: فسحبُ
        مستطيل يحدّد <em>مساحةً من الورق</em>، ومساحةُ الورق ليست الشيء نفسه
        الذي هو النصّ تحتها، وهكذا يبدأ إخفاقُ الصندوق الأسود. والذي تحصل عليه
        بدلاً منه نصُّ المستند، بترتيب القراءة، وكل كلمة فيه قابلة للنقر. وهو
        أيضاً العرض الوحيد الذي يستطيع أن يقول لك ما لا تستطيع صورةُ الصفحة
        قوله: هل الكلمات التي أمامك نصٌّ أصلاً."""

[[faq]]
