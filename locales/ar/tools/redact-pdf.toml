#
# طمس PDF - Arabic.
#
# Overrides for tools/redact-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# The rule the English file states at the top holds here twice over: this page
# makes a claim other redaction tools cannot make, and the claim is worth
# nothing overstated. Arabic has a verb for each half of the distinction and
# they are used strictly - طمس is deleting the thing, حجب is hiding it from
# view - because the whole page is the difference between them, and the FAQ
# about a rectangle drawn in a PDF reader collapses if a reader cannot feel it.
#
# The link to the image redactor carries that tool's translated slug and the
# name it gives itself.
#

