[[privacy]]
title = "قائمة الأشخاص ليست بالشيء الهيّن كي تُسلَّم."
body = """
 معظم رسوم
      الأطوال تطلب حساباً، والتي لا تطلبه لها مع ذلك خادوم يرى كلّ اسم وكلّ رقم
      تكتبه. وما تكتبه هنا هو من في أسرتك وكم يبلغ طول كلّ واحد، وكثيراً ما يُستدلّ
      على عمر طفل من الشكل الواقف بجوار اسمه. ولا يُرسَل شيء من ذلك إلى أي مكان،
      لأنه لا يوجد هنا مكان يذهب إليه."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في <code>src/</code> كلّه
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code>. وتسمّي Content-Security-Policy كلّ عنوان يجوز لهذه
      الصفحة الاتصال به، وليس منها واحد لنا."""

[[privacy]]
title = "ولا يُحفَظ شيء بين زيارة وأخرى كذلك."
body = """
 يعيش الرسم في الصفحة
      ولا مكان له سواها. أغلِق اللسان تختفِ القائمة: لا حساب يمسكها، ولا كعكة
      تحملها، ولا شيء يُكتَب في تخزين هذا المتصفّح &mdash; ولذلك أيضاً فالرسم الذي
      تريد الاحتفاظ به هو الرسم الذي تنزّله."""

[[privacy]]
title = "الرابط لا يحمل الرسم."
body = """
 أدوات عدّة من هذا النوع تضع القائمة
      كاملةً في شريط العنوان كي تُشارَك، فيتحوّل كلّ اسم وكلّ طول إلى شيء يسجّله كلّ
      ما يمرّ به الرابط &mdash; خادوم محادثة، أو ماسح بريد، أو سجلّ تصفّح أحدهم.
      أما عنوان هذه الصفحة فلا يتغيّر أبداً وأنت تكتب."""

[[privacy]]
title = "ملف PNG يُصنَع من ملف SVG الذي على الشاشة."
body = """
 التنزيل ليس رسماً
      ثانياً قد يخالف المعاينة. فالترميز نفسه يُسلَّم إلى المتصفّح ويُرسَم على لوحة
      canvas، ولهذا أيضاً يمكن أن يتمّ والشبكة مفصولة: لا خطّ يُجلَب ولا صورة
      تُحمَّل بداخله."""

[[privacy]]
title = "صورة تضيفها تُقرأ هنا، ولا تُرسَل أبداً."
body = """
 الملف لا يغادر هذه
      الصفحة أبداً &mdash; يُقرأ بـ<code>FileReader</code> الخاص بالمتصفّح نفسه
      ويُحلَّل إلى مستند خامل لا يشغّل شيئاً. والمرسوم ليس ذلك الملف: إذ يبني
      <code>src/import-svg.js</code> رسمةً جديدة من قائمة سماح بالأشكال
      والهندسة، فيبقى خلفه أيّ نصّ برمجي أو ورقة أنماط أو خطّ أو صورة مرتبطة أو
      إحالة إلى مستند آخر، بدل أن يُنقَل. وهذا يهمّ مرّتين، لأن الرسم الذي تنزّله
      ملفٌّ ترسله إلى آخرين: فأيّ شيء كان سينجو معناه أن متصفّحهم سيتّصل بخادوم
      غريب، بعد أيام، انطلاقاً من شيء كتبته هذه الصفحة.

      الصورة الفوتوغرافية أو ملف PNG ليست برنامجاً وليس فيها ما يُعاد بناؤه:
      يقرؤها مفكّك الترميز الخاص بالمتصفّح نفسه، وتُعاد رسمها على لوحة رسم هنا
      قبل أن توضع على الرسم. وإعادة الرسم هذه هي ما يترك البيانات الوصفية للملف
      خلفه &mdash; الكاميرا، والمكان، وملف تعريف الألوان، وكلّ ما كان فيه
      &mdash; لأن شيئاً من ذلك لا ينجو من لوحة الرسم. والذي ينتهي به المطاف في
      الرسم صورةٌ رمّزتها هذه الصفحة، مكتوبةٌ فيه بوصفها بيانات لا عنواناً،
      فيبقى الرسم لا يشير إلى أيّ شيء."""

[[privacy]]
title = "الأعمال الفنية هنا، لا تُجلَب من الخارج."
body = """
 الأشكال الأربعة
      كلّها أعمالٌ في الملك العام، وتُقدَّم من هذا الأصل مع بقية الصفحة &mdash;
      بلا خطّ أيقونات، وبلا شبكة توصيل محتوى، وبلا ورقة صور تُسحَب من خادوم أحد
      آخر وأنت تكتب. ولهذا أيضاً يظلّ الرسم يُرسَم والشبكة مفصولة."""

[[privacy]]
title = "ما تحمّله Google، وما لا يُعطى لها."
body = """
 تأتي نصوص الإعلانات
      والقياس من Google، وزرّ التبرّع من Buy Me a Coffee. ولا يُسلَّم أيٌّ منها اسماً
      ولا طولاً. وكلّ سطر يحوّل قائمتك إلى صورة يُقدَّم من هذا الأصل ومُدرَج في
      المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 افصل الشبكة وتبقى الأداة كما هي، لأنه لم
      تكن فيها خطوة شبكية أصلاً. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "أضِف الجميع أولاً، ثم اهتمّ بالشكل."
body = """
 الصفّ شكلٌ واسمٌ وطولٌ
      ولون. والاسم اختياري &mdash; فرسمٌ من ظلَّين بلا اسمَين وفوقهما طولاهما هو
      تماماً ما يريده كثيرون &mdash; والسهمان في كلّ صفّ ينقلانه يميناً أو يساراً إن
      كان الترتيب يهمّ."""

[[howto]]
title = "اكتب الطول كما تكتبه أنت."
body = """
 <code>173</code>،
      <code>1.73 m</code>، <code>5'8\"</code>، <code>68 in</code>،
      <code>5 ft 8</code> تُقرأ كلّها قراءةً صحيحة. والسطر تحت الخانة يُظهر ما فُهِم،
      بالنظامَين معاً، فيظهر سوء القراءة قبل الرسم لا بعد الطباعة. والعدد المجرّد
      سنتيمترات على رسم متري وبوصات على رسم إمبراطوري، والعدد المجرّد دون الثلاثة
      أمتار &mdash; فلا أحد طوله 1.73 سنتيمتر."""

[[howto]]
title = "اختر الشكل الذي يناسب الشخص."
body = """
 طول الطفل نحو ستة رؤوس
      والبالغ سبعة ونصف؛ ولذلك يبدو الطفل المرسوم كبالغ مصغَّر خاطئاً على نحو
      يصعب تسميته ويسهل رؤيته. والصبي والفتاة رسمان لطفلَين حقيقيَّين لا لبالغَين
      مصغَّرَين، وذلك هو معظم ما يجعل رسم العائلة يبدو كعائلة. كما يصل كلّ صفّ وفيه
      طولٌ سلفاً، فإضافة شخص ترسم شخصاً &mdash; اكتب فوقه مباشرة."""

[[howto]]
title = "ضع على الرسم شيئاً مألوفاً."
body = """
 العدد مجرَّد، ومدخل الباب ليس
      كذلك. وإضافة شيء واحد يعرف الجميع حجمه &mdash; باب أو نافذة أو سبّورة فصل أو
      آلة بيع &mdash; هي ما يحوّل رسماً يذكر طولَين إلى رسم يُريهما. وتحمل القائمة
      عشرين منها، مجموعةً، وكلّ واحد يصل صفّاً عادياً يمكنك كتابة أرقامك فوقه.
      والأشياء تأخذ عرضاً إلى جانب الارتفاع، فالباب 203 في 81 لا شريط."""

[[howto]]
title = "أو ضع عليه رسمةً من عندك."
body = """
 تأخذ <strong>صورة خاصة بك</strong> ملفاً من جهازك وتضعه على المسطرة بأيّ طولٍ
      تعطيه إياه &mdash; وهو ما تلجأ إليه حين يكون الرسم عن منتَج أو مركبة أو
      مبنى لا عن شخص. يُرسَم ملف SVG بلون الصفّ نفسه كأيّ شكل آخر؛ أما الصورة
      الفوتوغرافية أو ملف PNG فتوضع كما هي. وكلاهما يحتفظ بنسبه، وكلاهما يُقرأ
      هنا بدل أن يُرسَل إلى أيّ مكان."""

[[howto]]
title = "اضبط المسطرة على الوحدات التي يفكّر بها قارئك."
body = """
 التبديل بين
      السنتيمترات والأقدام يعيد كتابة ما في الخانات بدل أن يعيد تأويله، فلا يتحرّك
      الرسم نفسه &mdash; إنما تتغيّر الكتابة وحدها. وإن كان الرسم لجمهورَين، فالطول
      المكتوب فوق كلّ شكل بوحدة الرسم، والسطر تحت كلّ خانة يحمل الاثنين."""

[[howto]]
title = "ملف PNG للّصق، وملف SVG للطباعة."
body = """
 ملف PNG صورة بارتفاع
      البكسل الذي ضبطته، وهو ما تريده نافذة محادثة أو مستند أو شريحة. أما SVG فهو
      الرسم بوصفه تعليمات، فيُطبَع حادّاً بأي حجم ويمكن إعادة تلوينه لاحقاً بأي شيء
      يفتح المتّجهات."""

[[faq]]
q = "هل يُرسَل أي شيء أكتبه إلى مكان ما؟"
a = """
        لا. يرسم الرسمَ كودُ JavaScript في هذه الصفحة، على جهازك أنت، وليس لهذه
        الأداة وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً أبداً ولا ترسل شيئاً
        أبداً. وتسمّي <code>Content-Security-Policy</code> الخاصة بالصفحة كلّ عنوان
        يجوز لها الاتصال به، وليس منها واحد لنا. ويستحقّ هذا أن يُقال صراحةً هنا لأن
        المُدخَل قائمة بأسماء أشخاص وبطول كلّ منهم، وهو أكثر خصوصية من معظم ما
        يتعامل معه هذا الموقع."""

[[faq]]
q = "هل أستطيع تنزيل الرسم؟"
a = """
        نعم، بصيغة PNG أو SVG، بلا علامة مائية وبلا حساب. ويُرسَم ملف PNG بارتفاع
        البكسل الذي تضبطه وهو الذي يُلصَق في مستند أو شريحة أو محادثة. أما SVG فهو
        الرسم بوصفه تعليمات لا بكسلات: يُطبَع حادّاً بأي حجم ويمكن فتحه وإعادة
        تلوينه لاحقاً في أي محرّر متّجهات. وكلاهما مصنوع من الترميز نفسه الذي على
        الشاشة، فلا يمكن لأيٍّ منهما أن يخالف المعاينة."""

[[faq]]
q = "كيف أكتب الطول &mdash; بالسنتيمترات أم بالأقدام؟"
a = """
        بأيّهما شئت، في أي صفّ، بالطريقة التي تكتبه بها عادةً. فـ<code>173</code>
        و<code>173 cm</code> و<code>1.73 m</code> و<code>5'8\"</code>
        و<code>5 ft 8 in</code> و<code>68 in</code> تُفهَم كلّها، والسطر تحت الخانة
        يُظهر ما قُرِئ بالنظامَين. والعدد المجرّد سنتيمترات حين يكون الرسم متريّاً
        وبوصات حين يكون إمبراطورياً؛ والعدد المجرّد دون الثلاثة يُؤخَذ أمتاراً، لأن
        1.73 سنتيمتر ليس طولاً يكتبه أحد."""

[[faq]]
q = "لماذا لا يبدو الأطفال كبالغين مصغَّرين؟"
a = """
        لأن الطفل ليس كذلك. نسب الجسم تتغيّر مع العمر: ابن السنتين طوله نحو
        أربعة رؤوس ونصف، وابن الثامنة ستة، والبالغ سبعة ونصف &mdash; فالرأس إذن
        نحو ربع الطفل الصغير وثُمن البالغ. والصبي والفتاة هنا رسمان لطفلَين
        حقيقيَّين لا ظلاًّ واحداً مصغَّراً، ولهذا يبدو رسم العائلة عائلةً لا أربعة
        بالغين بأحجام مختلفة."""

[[faq]]
q = "من أين جاءت الأشكال؟"
a = """
        الأربعة كلّها أعمالٌ لأشخاص آخرين، وكلّها في الملك العام: الرجل لـpitr،
        والمرأة لـMadeleine Price Ball، والفتاة لـOpenClipart-Vectors، والصبي
        لـRyan Kissinger لمكتبة NIH BioArt. وكلّ ملف يُشحَن مع هذه الصفحة في
        <code>vendor/</code> كما نُشر، فتستطيع مقابلته بالأصل. والملك العام لا
        يطلب شيئاً، وهذا هو المقصود: فالعمل الفني ينتهي داخل صورة تنزّلها أنت،
        ورخصةٌ تشترط النسبة كانت ستُلصِق ذلك الشرط برسمك أنت."""

[[faq]]
q = "هل أستطيع وضع صورة من عندي على الرسم؟"
a = """
        نعم &mdash; تأخذ <strong>صورة خاصة بك</strong> رسمةً أو صورة فوتوغرافية
        وتضعها على المسطرة بأيّ طولٍ تكتبه: شعاراً أو مخطّطاً أو قطعة آلة أو
        سيارة، أو صورةً للشيء نفسه. ونسبها نسبها هي، فليس هناك عرضٌ تملؤه.
        <br><br>
        يُرسَم ملف <strong>SVG</strong> بلونٍ واحد صافٍ، اللون المضبوط عليه ذلك
        الصفّ، لأن هذا ما عليه بقية الرسم &mdash; فالرسمة المصنوعة من حدودٍ
        رفيعة لا من أشكال مملوءة تخرج لطخة، وهذه الأداة خطأٌ لها. ولا يُحتفَظ
        إلا بالـ<em>أشكال</em>: يُعاد بناء الملف من الصفر من مسارات ومستطيلات
        ودوائر، وكلّ ما كان بوسعه بلوغ الشبكة &mdash; صورة مرتبطة أو ورقة أنماط
        أو خطّ أو نصّ برمجي &mdash; يُترَك خلفه.
        <br><br>
        أما <strong>الصورة الفوتوغرافية أو ملف PNG</strong> فتوضع كما هي وتحتفظ
        بألوانها، فلا يعود لون الصفّ إلا اسماً لها. وتُعاد رسمها هنا قبل أن
        توضع، وهو ما يحدّ ممّا تضيفه إلى الرسم ويترك البيانات الوصفية للملف
        خلفه. وتبقى الشفافية، فتقف الصورة المقصوصة على المسطرة نظيفةً &mdash;
        أما الصورة الفوتوغرافية فتجلب خلفيتها معها، ويستحقّ ذلك قصّها أولاً.
        <br><br>
        ولا يذهب أيٌّ من الملفّين إلى أيّ مكان. وهذا يهمّ مرّتين، لأن الرسم الذي
        تنزّله ملفٌّ قد ترسله إلى أحد."""

[[faq]]
q = "لماذا لا يوجد طفل صغير أو رضيع؟"
a = """
        لأن أحداً لم يرسم واحداً ويضعه في الملك العام. في ويكيميديا كومنز طفلٌ حرّ
        صالح واحد بالضبط &mdash; الفتاة &mdash; وفي مكتبة NIH BioArt الصبي؛ أما
        دون سنّ المدرسة فيعود البحث فارغاً، وكلّ مجموعة أشخاص حرّة ومتّسقة هي رمزُ
        دورات مياه بالشكل نفسه في كلّ عمر، وهو الخطأ الذي وُجدت هذه الأداة كلّها
        لتجنّبه. وقد كان هناك طفل صغير ترسمه شيفرة هذه الصفحة نفسها لبعض الوقت،
        وكان الشكل الوحيد على الرسم الذي لم يرسمه أحد: وقد بدا ذلك عليه، واقفاً
        إلى جوار أربعة رسمهم أحد. ولمن هو أصغر من الصبي أو الفتاة، اضبط أحدهما على
        الطول الحقيقي &mdash; فالمسطرة هي التي تحمل المقارنة، وستكون صحيحة."""

[[faq]]
q = "كم شخصاً أستطيع وضعه على رسم واحد؟"
a = """
        اثني عشر. وليس هذا حدّاً تقنياً &mdash; فالرسم سيصنع ثلاثين عن طيب خاطر
        &mdash; لكن بعد الاثني عشر تصير الأعمدة أضيق من الأسماء المكتوبة فوقها
        وتتوقّف الصورة عن أن تكون مقروءة. وإن احتجت أكثر، فإطفاء الأسماء يعيد إليك
        العرض، أو أن رسمَين سيقولان الأمر خيراً من واحد."""

[[faq]]
q = "هل أستطيع وضع شيء على الرسم؟"
a = """
        نعم &mdash; ومعظمها يصل مرسوماً. تحمل القائمة عشرين للبدء، في أربع
        مجموعات: الأبواب والنوافذ، والمدرسة والمكتب (سبّورة، ومكتب، وخزانة
        ملفات، وشاشة عرض)، وأشياء في المدينة (آلة بيع، وحاوية نفايات بعجلات،
        وسلّة كرة سلة، وحاوية شحن مقاس 20&nbsp;قدماً)، وأشياء في البيت. سبعة عشر
        منها تأتي مع صورة &mdash; باب له مقبض، وثلاجة فوقها مجمّدها، وأريكة ترى
        أنها أريكة &mdash; وتُطابَق الصورة على الطول والعرض المكتوبَين في الصفّ،
        فتبقى الأرقام هي التي تقرّر الحجم، وتبقى أرقامك التي تكتبها فوقها نافذة.
        أما الثلاثة الباقية فمستطيلات مجرّدة، لأنه لم تُوجَد لها رسمة حرّة صحيحة
        ومضبوطة النسب معاً، والرسمة الخاطئة أسوأ من كتلة صادقة في رسم موضوعه
        المقياس.
        <br><br>
        بعض هذه المقاسات معايير حقيقية وبعضها مقاسات معتادة، وتقول الصفحة ذلك
        صراحةً. والشيء المألوف الواحد يفعل للرسم أكثر مما يفعله أي عدد من
        الأشخاص الإضافيين: فهو ما يحوّل المقارنة إلى إحساس بالمقياس."""

[[faq]]
q = "هل هناك شكل لكلب أو قطّة؟"
a = """
        لا، وهي فجوة مقصودة لا سهو. فقد بُني الاثنان &mdash; جانبياً، واقفَين، والرأس
        بمستوى الكتف، حتى يكون أعلى الرسمة هو الطول المكتوب بجوارها، وهو الموضع الذي
        يقيس عنده كلّ معيار سلالة حيواناً. لكنهما لم يخرجا جيدَين بما يكفي للشحن:
        فحيوانٌ رباعيّ منظورٌ من الجانب واقفاً إلى جوار أربعة أشخاص منظورين من الأمام
        يُقرأ كخطأ حتى حين تكون الرسمة جيدة. ومستطيلٌ بارتفاع كتف الحيوان أمينٌ في
        هذه الأثناء."""

[[faq]]
q = "هل أستطيع مشاركة الرسم برابط؟"
a = """
        ليس من هنا، وذلك مقصود. فالأدوات التي تتيح ذلك تفعله بوضع القائمة كاملةً في
        العنوان، ما يعني أن كلّ اسم وكلّ طول ينتهي في كلّ ما يسافر الرابط عبره
        &mdash; سجلّات خادوم محادثة، وماسح بريد، وسجلّ تصفّح أحدهم، وخدمة تجلب معاينة
        الروابط. نزّل الصورة وأرسلها بدل ذلك: فهي تقول الشيء نفسه ولا تحمل معها أي
        قائمة."""

[[faq]]
q = "هل هو مجاني، وهل أستطيع استعمال الرسم تجارياً؟"
a = """
        هو مجاني، ولا حساب ولا علامة مائية، ويمكنك وضع النتيجة في تقرير أو عرض
        تقديمي أو إعلان أو منتج. يحمل الموقع إعلانات، وهي ما يدفع تكاليفه. ولا شيء
        في رسمٍ تصنعه هنا يملكه أحد سواك، ولا يُحتفَظ بشيء."""

[[faq]]
q = "لماذا المسطرة بالعشرات لا بالآحاد؟"
a = """
        لأن التباعد يُختار من عدد الخطوط التي تحتملها الصورة لا من رقم ثابت. فرسمٌ
        لبالغَين يأخذ خطاً كلّ عشرة سنتيمترات؛ ضع عليه سلّة كرة سلة فتنتقل الخطوط إلى
        خمسة وعشرين، لأن تسعين خطاً على صورة واحدة غشاوةٌ رمادية لا مسطرة. وفي
        الأقدام والبوصات يكون السُّلَّم بوصةً وثلاثاً وستّاً واثنتي عشرة، فتقع الخطوط
        على بوصات كاملة لا قربها."""

[[faq]]
q = "هل أستطيع وضع الرسم على شريحة داكنة؟"
a = """
        نعم. اضبط الخلفية على اللون الذي سيستقرّ عليه، فتنتقل المسطرة والكتابة بين
        الداكن والفاتح بما يناسبه &mdash; محسوباً من إضاءة اللون لا مخمَّناً. ثم علِّم
        &laquo;بلا خلفية إطلاقاً&raquo; إن أردت الصورة نفسها شفّافة: فاللون الذي
        اخترته يظلّ هو الذي يقرّر الحبر، وبذلك يخرج رسمٌ شفّاف متّجهٌ إلى شريحة
        كحلية مقروءاً عليها."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمّل الصفحة مرة واحدة، ثم افصل الإنترنت وستظلّ تعمل. وهذه أيضاً أبسط
        طريقة لإثبات أن شيئاً لا يُرفَع: فأداة ترسل قائمتك بعيداً ليُرسَم لها رسمٌ
        كانت ستتوقّف في اللحظة التي تفصل فيها."""

