[[privacy]]
title = "ليس لصورك مكان تذهب إليه."
body = """
 تسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد منها
      لهذا الموقع. لا يوجد هنا طرفٌ تُجمَع عنده ملفاتك، ولا في الشيفرة ما يرسلها لو
      وُجد &mdash; لا <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code>، لا في <code>src/</code> ولا في العامل."""

[[privacy]]
title = "ملفات RAW تُقرأ ولا تُرفع &mdash; وتُقرأ بالكاد."
body = """
 يحتوي ملف RAW من الكاميرا سلفاً على
      صورة JPEG بالحجم الكامل صيّرتها الكاميرا لحظة اللقطة. تجدها هذه الأداة بالمرور
      على بضعة مداخل دليل ثم بطلب شريحة واحدة، وهي في ملف حجمه 60&nbsp;ميغابايت أقل
      من مئة كيلوبايت عادةً. وتعرض الصفحة ذلك الرقم إلى جوار حجم ملفاتك وأنت تعمل.
      أما بيانات المستشعر فلا تُقرأ قطّ."""

[[privacy]]
title = "العمل يجري في عاملٍ على هذا الجهاز، لا على خادم."
body = """
 هذه هي الأداة الوحيدة هنا التي
      تستعمل عاملاً، لأن التكديس دقائق من الحساب لا ثوانٍ، والصفحة المتجمّدة لا تُظهر
      تقدماً ولا تُلغى. والعامل خيطٌ ثانٍ داخل هذا المتصفح نفسه &mdash; انظر
      <code>src/worker.js</code>. تُسلَّم إليه الملفات نفسها، وذلك مجّاني لأن مقبض
      الملف ليس هو البايتات؛ وتحكمه Content-Security-Policy نفسها التي تحكم الصفحة،
      أي أنه بلا وجهةٍ يرسل إليها."""

[[privacy]]
title = "لا يُبلَّغ عن هذه المجموعة في أي مكان."
body = """
 كم إطاراً كدّست، وأي كاميرا كتبتها، وكم
      تحرّك كل منها، وأي طريقة اخترت، وكم استغرقت: كل ذلك يبقى في ذاكرة هذه الصفحة
      حتى تغلقها. لا يوجد في هذا المستودع حدث قياس خاص يحمل شيئاً منه، والسؤال الوحيد
      الذي يطرحه هذا الموقع بعد التنزيل يرسل إبهاماً إلى أعلى أو أسفل واسم الأداة،
      ولا شيء سواهما."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 افصل الشبكة ولا يتغير في الأداة شيء، لأنه لم تكن
      فيها خطوة شبكية قط. والعامل وكل وحدة يحمّلها يخزّنها عامل الخدمة الخاص بهذه
      الصفحة، فالنسخة المثبّتة تكدّس ملفات RAW والشبكة مفصولة."""

[[howto]]
title = "اختر الإطارات."
body = """
 سلسلة لقطات، أو مجموعة بتدرّج تعريض،
      أو تسلسل من مؤقّت فواصل، أو مجلد من ملفات RAW. يُفتح كل ملف حين يصل، ويخبرك سطره
      بما خرج منه &mdash; ولملف RAW: الكاميرا، وحجم المعاينة التي وُجدت داخله، وكم
      كان قليلاً ما لزم قراءته من الملف للعثور عليها."""

[[howto]]
title = "اختر الطريقة التي تناسب ما تريد أن تفقده."
body = """
 الضجيج:
      المتوسط، أو قصّ سيغما إن تحرّك شيء. الناس أو السيارات أو طائرة عابرة: الوسيط.
      سماءٌ مظلمة تريدها مسارات نجوم: إضاءة. لقطة ماكرو مأخوذة على امتداد حلقة
      البؤرة: تكديس البؤرة. والملاحظة تحت القائمة تقول ماذا تفعل كل طريقة بعدد
      إطاراتك أنت."""

[[howto]]
title = "قرّر إن كانت الإطارات تحتاج محاذاة."
body = """
 باليد: نعم، إزاحة
      فقط. باليد وكنت تدور أيضاً: إزاحة ودوران وقياس. حاملٌ ثلاثيّ مثبَّت أو مؤقّت
      فواصل: لا، وسيكون أسرع. كل إطار يُقاس قياساً إلى الأول في القائمة، ولذلك يمكن
      ترقية أي إطار ليصير هو الأول."""

[[howto]]
title = "اقرأ الأرقام الأربعة، ثم اضغط الزر."
body = """
 قبل أن يجري أي شيء، تقول
      الصفحة كم سيكون حجم الناتج، وكم ذاكرة سيأخذ تقريباً، وكم مرة ستُفكّ ترميز
      الإطارات، وكم قُرئ من ملفاتك. وإن كانت المجموعة لا تتّسع في الذاكرة دفعةً واحدة
      قالت ذلك، وقالت أي دقة عمل تصلحه."""

[[faq]]
q = "هل تُرفع صوري إلى أي مكان؟"
a = """
        لا. كل إطار يُفتح ويُفكّ ترميزه ويُحاذى ويُكدَّس ويُكتب في متصفحك أنت على
        عتادك أنت. لا تملك هذه الأداة أي وظيفة شبكية على الإطلاق &mdash; لا تجلب شيئاً
        ولا ترسل شيئاً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لهذا الموقع. حمِّل الصفحة
        مرة، وافصل الإنترنت، وستظل تعمل. وهذا هنا أهمّ منه في أكثر الأدوات لسبب واحد
        هو الحجم: كدسة من عشرين إطار RAW نحو غيغابايت، ورفع غيغابايت من الصور لتُؤخذ
        منها متوسطة هو تحديداً ما وُجدت هذه الأداة لتجنّبه."""

[[faq]]
q = "أي صيغ RAW يقرأ، وكيف؟"
a = """
        <span id="faq-raw"></span>CR2 وCR3 وNEF وNRW وARW وSR2 وSRF وDNG وORF وRAF
        وRW2 وPEF وSRW و3FR وIIQ وDCR وKDC وMRW وMEF وRWL وبضع صيغ أخرى &mdash; أي
        أكثر ما تكتبه الكاميرات. والذي يقرؤه منها هو معاينة JPEG بالحجم الكامل التي
        صيّرتها الكاميرا نفسها لحظة اللقطة: الصورة التي تراها على ظهر الكاميرا، والتي
        يرسمها نظام تشغيلك مصغَّرةً. يُعثر عليها بالمرور على بنية دليل الملف، وذلك يكلّف
        بضع قراءات كلٌّ منها بضعة كيلوبايتات، ثم أخذ شريحة واحدة. <strong>وليست هذه
        فكّ تشابك لبيانات المستشعر.</strong> فالناتج يحمل توازن أبيض الكاميرا ونمط
        صورتها بثمانية بتات للقناة، لا اثني عشر أو أربعة عشر بتاً من بيانات مستشعر
        خطّية كما يعطيك محوِّل RAW."""

[[faq]]
q = "ولماذا لا تُفكّ ترميز بيانات المستشعر كما ينبغي؟"
a = """
        لأن ذلك يعني ضمّ LibRaw أو dcraw &mdash; محرّكٌ ثانٍ بعشرات الميغابايتات،
        لعائلة صيغ واحدة، معظمه مخططات ضغط خاصة بكل صانع. وهذه المقايضة محسومة في
        <code>docs/what-can-be-built-here.md</code> في مصدر هذا الموقع، حيث كان RAW
        الكاميرات على قائمة المستبعَد قبل وجود هذه الأداة. والذي تغيّر ليس الجواب عن
        ذلك السؤال، بل اكتشاف أن التكديس لا يحتاجه: فالمعاينات بدقة كاملة، وهي ما
        كانت الكاميرا ستعطيك إياه JPEG على أي حال، وقراءتها أسرع نحو مئة مرة من فكّ
        التشابك. وإن أردت بيانات المستشعر فحمّض الإطارات في محوِّل RAW أولاً وكدّس ما
        ينتجه من TIFF أو JPEG &mdash; فهذه الأداة تأخذها أيضاً."""

[[faq]]
q = "كم إطاراً يحتمل، وبأي حجم؟"
a = """
        ستٌّ من الطرائق السبع تتدفّق: تمسك مُراكِماً واحداً وتقرأ كل إطار مرة واحدة
        بالضبط، فمئة إطار تكلّف من الذاكرة ما يكلّفه إطاران، والذي يكبر هو الوقت وحده.
        والوسيط هو الاستثناء، لأن القيمة الوسطى لمجموعة لا تُعرف حتى تكتمل كلها، فيمسك
        كل الإطارات دفعةً واحدة &mdash; وعشرون إطاراً بأربعة وعشرين ميغابكسل نحو
        1.4&nbsp;غيغابايت، وهو ما لن يمنحك إياه متصفح. وحين يقع ذلك تُقطَع الصورة إلى
        أشرطة أفقية وتُكدَّس شريطاً شريطاً، وثمنه إعادة قراءة الإطارات لكل شريط. تحسب
        الصفحة هذا كله قبل أن تضغط الزر وتعرض عليك الرقم، فلا يكون البطء مفاجأة."""

[[faq]]
q = "ماذا تفعل محاذاة الإطارات فعلاً؟"
a = """
        تجد كم تحرّك كل إطار قياساً إلى الأول وتعيده، إلى كسر من البكسل. والطريقة هي
        الارتباط الطوري: الإزاحة بين صورتين تظهر فرقاً في الطور بين طيفيهما، فتحويل
        فورييه واحد لكلٍّ منهما يجد إزاحة مقدارها مئتا بكسل بثمن إزاحة مقدارها بكسلان.
        والإعداد الثاني يستعيد الدوران والقياس أيضاً، بالحيلة نفسها مطبَّقةً على الطيف
        في إحداثيات لوغاريتمية قطبية. وهذا كله شامل &mdash; إزاحة واحدة وزاوية واحدة
        وقياس واحد للإطار كله &mdash; فهو يصحّح كاميرا تحرّكت ولا يصحّح موضوعاً تحرّك،
        ولا صورةً أُخذت من خطوةٍ إلى اليسار. وله نتيجة مرئية واحدة: إطارٌ أُزيح عشرين
        بكسلاً إلى اليسار لم يعد يبلغ الحافة اليمنى، فيُقصّ الناتج إلى الجزء الذي تغطّيه
        كل الإطارات. ولهذا تعود الكدسة المحاذاة أصغر قليلاً جداً من الإطارات التي دخلت
        فيها، وهو البديل الوحيد عن حافةٍ سوداء مصنوعة من إطارات لم تكن هناك."""

[[faq]]
q = "أي طريقة أستعمل؟"
a = """
        <strong>المتوسط</strong> للضجيج، في مجموعة لم يتحرّك فيها شيء: يقلّ الضجيج
        العشوائي بمقدار الجذر التربيعي لعدد الإطارات تقريباً. و<strong>الوسيط</strong>
        لإزالة ما كان هناك بعض الوقت فقط &mdash; والاستعمال الكلاسيكي تصوير ساحة
        مزدحمة عشر مرات أو نحوها والحصول عليها فارغة. و<strong>قصّ سيغما</strong> حين
        تريد الاثنين: يتعلّم ما يكونه كل بكسل عادةً ثم يأخذ متوسط القيم الموافقة له
        وحدها، فتجتمع له مناعة الوسيط من سيارةٍ عابرة وخفضُ الضجيج الذي للمتوسط.
        و<strong>الإضاءة</strong> لمسارات النجوم والألعاب النارية والرسم بالضوء.
        و<strong>الإعتام</strong> لإزالة أي شيء ساطع تحرّك. و<strong>الجمع</strong>
        لمحاكاة تعريض طويل واحد. و<strong>تكديس البؤرة</strong> للقطة ماكرو مأخوذة على
        امتداد حلقة البؤرة."""

[[faq]]
q = "لماذا ناتجي بثمانية بتات وملفات RAW عندي بأربعة عشر؟"
a = """
        لأن المكدَّس هو معاينة الكاميرا نفسها، وهي JPEG. ويستحق أن يُقال إن التكديس
        يستعيد بعض ثمن ذلك: متوسط ستة عشر إطاراً بثمانية بتات يعطي ناتجاً بتدرّجات
        أدقّ حقاً مما كان في أيٍّ منها، لأن الضجيج نفسه الذي جعل تقريب كل إطار مختلفاً
        هو ما يسمح للمتوسط أن يحطّ بين المستويات. والحساب هنا بفاصلة عائمة ويُقرَّب مرة
        واحدة في النهاية تماماً، فلا يُرمى شيء في الطريق. ومع ذلك فهو ليس كتكديس بيانات
        مستشعر خطّية، وهذه الأداة لا تدّعي غير ذلك."""

[[faq]]
q = "أيمكنني تكديس إطارات بأحجام مختلفة أو من كاميرات مختلفة؟"
a = """
        نعم، وإن كان ذلك خطأً في العادة ويستحق التأكد من أنك قصدته. يأخذ الناتج حجم
        أكبر إطار، ويُقاس كل إطار آخر ليتّسع فيه ويُوسَّط داخله. وخلط الكاميرات يخلط
        أيضاً تفسير الألوان، فمتوسط الاثنين متوسطُ تفسيرين مختلفين لضوءٍ واحد. أما حيث
        ينفع حقاً فهو مجموعة صُوِّرت بدقّتين، أو ملف RAW وJPEG للإطار نفسه."""

[[faq]]
q = "يقول إن التشغيل سيكون بأشرطة. ما معنى ذلك؟"
a = """
        أن ذاكرة العمل التي تحتاجها الطريقة أكثر مما تقبل الأداة حجزه دفعةً واحدة،
        فستُقطَع الصورة إلى أشرطة أفقية وتُكدَّس شريطاً شريطاً. والناتج هو نفسه تماماً؛
        غير أنها تعيد قراءة الإطارات لكل شريط، فتطول المدة، وتخبرك الصفحة كم عملية فكّ
        ترميز ستكون. وخفض دقة العمل درجةً واحدة يقسم الذاكرة على أربعة، وهو ما يحوّل
        التشغيل بالأشرطة إلى مرور واحد في أغلب الأحوال &mdash; والملاحظة تقول أي إعداد
        يفعل ذلك."""

[[faq]]
q = "لماذا تستعمل هذه الأداة عاملاً ولا تستعمله الأخريات؟"
a = """
        لأنها الوحيدة التي يُقاس عملها بالدقائق. كل أداة أخرى هنا تفعل شيئاً يستغرق
        ثانية أو ثانيتين، ونقل العمل خارج الخيط الرئيسي هناك مراسم لا أكثر. أما تكديس
        عشرين إطاراً كبيراً فحسابٌ صلب على مئات الميغابايتات، ومعناه على الخيط الرئيسي
        صفحةٌ متجمّدة: لا شريط تقدّم يتحرّك، وزرّ إلغاء لا يجيب، ومتصفحٌ في النهاية يعرض
        إغلاق اللسان. والعامل خيطٌ ثانٍ في هذا المتصفح نفسه، يشغّل ملفاً من هذا المجلد
        نفسه، تحت هذه السياسة نفسها. ليس خادماً وليس وظيفة شبكية."""

[[faq]]
q = "هل هي مجانية، وهل أحتاج حساباً؟"
a = """
        مجانية، ولا حساب ولا تسجيل دخول ولا فترة تجربة ولا علامة مائية. ولا حدّ لعدد
        الإطارات التي تكدّسها ولا لحجمها، لأنه لا خادم يدفع ثمن ذلك &mdash; فالعمل يجري
        على جهازك أنت والسقف الوحيد ذاكرتك أنت. يعرض الموقع إعلانات، وهي التي تدفع
        تكاليفه؛ ولا يُعطى المعلنون شيئاً عن صورك."""

