[[privacy]]
title = "مستنداتك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ تُجمَع عنده صورك، ولا في الشيفرة ما يرسلها
      إليه لو وُجد."""

[[privacy]]
title = "لا نموذج، فلا شيء يُنزَّل ولا شيء يُسأل عنه."
body = """
 إيجادُ
      أركان الصفحة الأربعة يجري بالحساب: تدرّجُ الصورة، وتصويتٌ للخطوط
      المستقيمة التي فيها، وفحصُ ما تحت كل ضلع من أضلاع المستطيل الفائز فعلاً.
      لا أوزان، ولا زمن تشغيل استدلال، ولا شيء يُجلَب عند أول استعمال، ولا شيء
      يتصرّف على مستند غيرك تصرّفاً غير الذي يتصرّفه على مستندك &mdash; انظر
      <code>src/detect.js</code>."""

[[privacy]]
title = "المستند لا يحمل تاريخاً ولا مؤلفاً ولا اسم جهاز."
body = """
 المسحُ
      شيء يرسله الناس إلى الناس، وغالباً لأن مكتباً طلبه. والشيء الوحيد الذي
      يُكتَب في ملف PDF عدا الصفحات نفسها هو اسم هذه الأداة، وعنوانٌ إن كتبت
      واحداً. فلا تاريخ إنشاء، ولا مؤلف، ولا رقم تسلسلي، ولا شيء مشتقّ من ساعتك
      ولا من أسماء ملفاتك ولا من حاسوبك &mdash; انظر
      <code>src/document.js</code>."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والعمل هو
      <code>getImageData</code>، وبعض الحلقات على البايتات، ومرمِّز JPEG الخاص
      بالمتصفح &mdash; وكلها مثبَّتة على جهازك أصلاً."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق &mdash;
      وهو الذي يستحق أن تجرّبه قبل أن تمسح جواز سفر."""

[[howto]]
title = "صوِّر الصفحة."
body = """
 من فوقها، والصفحة كلها في الإطار
      وأركانها الأربعة ظاهرة أو تكاد. ولا يلزم أن تكون الصورة مواجِهة ولا أن
      تكون الإضاءة متساوية: فالميل والظلّ هما ما وُجِدت هذه الأداة له. والذي
      يهمّ ملءُ الإطار &mdash; فالصفحة المصوَّرة من عرض الغرفة ليس فيها تفصيل
      يُستعاد."""

[[howto]]
title = "تحقّق من الأركان الأربعة."
body = """
 تُوجَد لك حين تُقرأ الصورة،
      وتقول الصفحة ذلك حين لا تكون واثقة &mdash; فالصفحة على مكتب بلون الورق
      نفسه يصعب حقاً رؤية حدّها. اضغط أي موضع على الصورة فيأتي أقرب ركن إلى
      إصبعك، أو صِل إلى واحد بـ <kbd>Tab</kbd> وحرّكه بمفاتيح الأسهم."""

[[howto]]
title = "اختر ماذا يُفعَل بالضوء."
body = """
 &laquo;ملوَّنة، مع تسوية
      الإضاءة&raquo; يقيس الورق عبر الصفحة ويقسمه خارجاً، فيذهب الظلّ ويحتفظ
      الختم أو التوقيع بلونه. و&laquo;أبيض وأسود&raquo; يمضي أبعد وهو ما يجعل
      المسح صغيراً بما يكفي لإرساله بالبريد. وما تراه على الشاشة هو النتيجة
      الحقيقية، تنتجها الشيفرة نفسها التي تكتب الملف."""

[[howto]]
title = "أضِف الصفحات الأخرى."
body = """
 كل صورة تضيفها تصير صفحة أخرى من
      المستند نفسه، بالترتيب الذي تُسرَد به، وكل واحدة تحتفظ بأركانها هي.
      والأسهم التي على صفحة في الشريط تحرّكها أقدم أو أحدث."""

[[howto]]
title = "احفظ ملف PDF، وافتحه قبل أن ترسله."
body = """
 يُكتَب
      المستند هنا، في ذاكرة هذه الصفحة. ولم يُرفَع شيء لصنعه، ولم يُبلَّغ عنه
      شيء إلى أي مكان."""

[[faq]]
q = "هل يُرفع مستندي إلى أي مكان؟"
a = """
        لا. الصورة يُفكّ ترميزها وتُعدَّل وتُنظَّف وتُكتَب في ملف PDF بمتصفحك
        أنت على جهازك أنت. لا تملك هذه الأداة أي وظيفة شبكية على الإطلاق
        &mdash; فهي لا تجلب شيئاً ولا ترسل شيئاً &mdash; و
        <code>Content-Security-Policy</code> الخاصة بالصفحة تُسمّي كل عنوان
        يجوز لها الاتصال به، وليس واحد منها لنا. حمِّل الصفحة مرة، واقطع اتصالك
        بالإنترنت، وستظل تعمل."""

[[faq]]
q = "كيف يجد أركان الصفحة دون نموذج؟"
a = """
        بالبحث عن الحوافّ المستقيمة الطويلة الأربع التي يتألف منها المستطيل.
        تُصغَّر الصورة، ويُؤخَذ التدرّج &mdash; أين تتغيّر الصورة، وفي أي اتجاه
        &mdash; وكل بكسل يقع على حافّة يصوّت للخطّ المستقيم الذي كان سيقع عليه.
        وتُزاوَج الخطوط القوية في مستطيلات مرشَّحة، ويُقيَّم كل مرشَّح بالمشي
        على أضلاعه الأربعة وسؤالِ كم من كل ضلع تحته حافّةٌ حقاً، وهل الأربعة حدُّ
        شيء واحد: فالصفحة أفتح مما حولها، أو أدكن، لكنها الشيء نفسه على الأضلاع
        الأربعة، وهو ما يمنع أن يُحسَب سطرُ نصّ أسفلَ الصفحة. ولا أوزان، ولا
        شيء يُنزَّل، والحساب هو الحساب نفسه لكل مستند يمرّ به."""

[[faq]]
q = "الأركان التي وجدها خطأ. فماذا الآن؟"
a = """
        اسحبها. فالأركان موضع بداية ولا تكون قراراً أبداً: والمسح يُؤخَذ من حيث
        تنتهي الأربعة. اضغط أي موضع على الصورة فيقفز أقرب ركن إلى إصبعك، وذلك
        أيسر من إصابة مقبض صغير، ومفاتيح الأسهم تحرّك الركن الذي عليه التركيز
        بكسلاً في كل مرة. وتقول لك الصفحة كذلك حين تكون الأركان تخميناً لا
        اكتشافاً، وتعلّم على تلك الصفحة في الشريط &mdash; والصفحة الملقاة على
        مكتب بلونها تقريباً هي السبب المعتاد، لأنه لا حافّة هناك تقريباً
        لتُوجَد."""

[[faq]]
q = "لماذا تخرج الصفحة المعدَّلة بالنسبة الصحيحة، لا مضغوطة؟"
a = """
        لأن النسبة تُستعاد من المنظور لا تُقاس من الحوافّ. فالصفحة المصوَّرة
        بميل يكون ضلعها البعيد مختصَراً، فالطريقة البديهية &mdash; خذ أطول زوج
        من الأضلاع المتقابلة وسمِّ ذلك النسبة &mdash; تنتج ورقة A4 قصيرة ظاهرةً
        للعين، وهو ما تعطيك إياه أكثر الماسحات على الويب. والحقيقة أن صورة
        المستطيل تحمل ما يكفي من المعلومات لاستعادة نسبة المستطيل وبُعد الكاميرا
        البؤري معاً، ما دامت الكاميرا عادية؛ وتلك نتيجةٌ لـ Zhang وHe من 2003،
        وهي ما يفعله <code>src/geometry.js</code>. وحيث تكون الصورة مواجِهة فلا
        منظور يُعمَل منه ولا حاجة إليه، لأن الحوافّ تكون حينئذ دقيقة &mdash;
        فيتراجع إليها، وتقول الصفحة أيُّ الاثنين أجاب."""

[[faq]]
q = "ماذا يفعل &laquo;التنظيف&raquo; بالصورة بالضبط؟"
a = """
        يقسم الضوء خارجاً. فيُقاس سطوعُ الورق نفسه عبر الصفحة &mdash; شبكةٌ من
        المربّعات، وفي كل مربّع مئينٌ عالٍ من السطوع، والنصّ أدكن وأندر من أن
        يحرّكه &mdash; ويُقسَم كل بكسل على الورق المقدَّر عند تلك النقطة. فيبقى
        الحبر، متساوي الإضاءة، وقد ذهب الظلّ وذهب الخفوت. وليس ذلك رفعَ
        التباين: فرفعُ تباين صفحة مصوَّرة يجعل الجزء الفاتح أبيض والجزء الداكن
        أسود والكتابةَ التي في الجزء الداكن غير مقروءة، ولهذا تجعل
        &laquo;التسوية التلقائية&raquo; هذه الصور أسوأ لا أحسن."""

[[faq]]
q = "لماذا وضع الأبيض والأسود أصغر بهذا القدر؟"
a = """
        لأن الصورة التي فيها لونان جزءٌ يسير حقاً من بيانات صورة فيها ستة عشر
        مليوناً، وهي مخزَّنة هكذا هنا: بتٌّ واحد لكل بكسل، مرصوصة ثمانيةً في
        البايت ومضغوطة ضغطاً دقيقاً، لا على هيئة JPEG لصورة بالأبيض والأسود.
        وعلى الصفحات نفسها يخرج أصغر بنحو ثمانية عشر ضعفاً من الوضع الملوَّن،
        فيحطّ عقدٌ من عشرين صفحة دون ميغابايت لا عند خمسة عشر أو نحوها. والعتبة
        عتبةُ Sauvola، وهي تقرّر كل بكسل في مقابل متوسط جواره وانتشاره لا في
        مقابل رقم واحد للصفحة كلها &mdash; وذلك ما يبقي الكتابة التي داخل ظلّ.
        وليس فيه درجات وسطى، فالصفحة التي عليها صورة فوتوغرافية ينبغي أن تستعمل
        أحد الوضعين الآخرين."""

[[faq]]
q = "هل أستطيع وضع عدة صفحات في ملف PDF واحد؟"
a = """
        نعم. كل صورة تضيفها تصير صفحة أخرى، بالترتيب الذي تُسرَد به، وكل صفحة
        تحتفظ بأركانها هي &mdash; فرصّةٌ من الصفحات مصوَّرةٌ واحدةً بعد أخرى
        تصير مستنداً واحداً. والأسهم التي على كل صفحة في الشريط تحرّكها أقدم أو
        أحدث. وإعداد التنظيف مشترك بينها كلها عن قصد: فالصفحات في مستند واحد
        نُظِّفت على نحو مختلف تبدو مستندين."""

[[faq]]
q = "هل يقرأ النصّ، فأستطيع البحث في ملف PDF؟"
a = """
        لا. فلا طبقة نصّ ولا تعرّف على الحروف: والذي يخرج صورةٌ لصفحة على صفحة.
        وفعلُ ذلك كما ينبغي يعني محرّك OCR، وهو عشرات الميغابايتات من النموذج
        تُنزَّل &mdash; وماسحُ مستندات يجلب نموذجاً قبل أن يستطيع قراءة كشف
        راتبك كان سيكون ماسحاً له سببٌ للاتصال ببيته عن كشوف الرواتب. فإن احتجت
        إلى النصّ، فوضع الأبيض والأسود ينتج بالضبط صنف الملفات التي تعمل عليها
        برمجيات OCR على جهازك أنت أحسن ما تعمل."""

[[faq]]
q = "خرجت ضبابية. لماذا؟"
a = """
        في الغالب الأعم لأن الصفحة كانت صغيرة في الصورة. واللوحة التي تحت
        المعاينة تقول كم ملأت الصفحةُ من الإطار وكم يبلغ ذلك تقريباً من النقاط
        في البوصة عبر ورقة بذلك المقاس &mdash; ودون نحو 150 DPI يبدو المسح
        المطبوع ناعماً، ولا تستطيع أداةٌ فعل شيء بتفصيل لم يكن في الملف قط.
        اقترب بدل أن تكبّر، واثبت، ودع الكاميرا تركّز على الصفحة قبل أن تضغط
        الزر. واهتزازُ الكاميرا هو السبب الآخر، وهو غير قابل للاستعادة كذلك."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ للصفحات ولا
        علامة مائية. ولا حدّ لحجم الصور كذلك، إذ لا خادم يدفع ثمنها &mdash;
        فالعمل يجري على جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛
        ولا يُعطى المعلنون شيئاً عن مستنداتك."""

