[[privacy]]
title = "ليس لما تلصقه مكان يذهب إليه."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده رمزٌ مميز ملصوق، ولا في الشيفرة
      ما يرسله إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 لا يوجد
      <code>fetch</code> ولا <code>XMLHttpRequest</code> ولا
      <code>sendBeacon</code> في أي موضع من <code>src/</code>. والمقارنةُ
      دالّةٌ في هذه الصفحة تأخذ سلسلتين وتعيد ما تغيّر."""

[[privacy]]
title = "الخوارزمية هي المعيارية، مقروءةً بكاملها."
body = """
 خوارزمية Myers لأقصر نصّ تحرير،
      وهي التي يستعملها <code>git diff</code>، مكتوبةً يدوياً في
      <code>src/diff.js</code> وقراراتُها مشروحة في التعليقات. والاختبارات في
      <code>tests/js/text-diff.test.js</code> تثبت أن المحذوفات تعيد بناء
      النصّ الأيسر وأن المضافات تعيد بناء الأيمن، وذلك هو معنى الصواب في
      المقارنة."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google، وزر التبرّع من Buy Me a Coffee. ولا يُعطى أيٌّ
      منها محرفاً واحداً من نصّك. وكل سطر يقرؤه أو يحلّله أو يكتبه يُخدَم من
      هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة، وتبقى الأداة كما
      هي، لأنه لم تكن فيها خطوة شبكية قط. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "الصق النصّين، أو أفلِت الملفين."
body = """
 الأصل في جهة، والنسخة المتغيرة في
      الجهة الأخرى. وملفان يُفلَتان معاً على المُنتقي يحطّ كلٌّ في جانب،
      بالترتيب الذي أفلتّهما به؛ وبدِّل الجانبين إن كانا مقلوبَين."""

[[howto]]
title = "اختر كيف تقرؤه."
body = """
 جنباً إلى جنب، أو في عمود واحد. والهاتف
      يبدأ بعمود واحد، لأن الجنب إلى جنب يحتاج عمودَي نصّ وفي الهاتف متسعٌ
      لواحد تقريباً؛ والقائمة هناك على كل حال."""

[[howto]]
title = "تجاهل ما لا يهم."
body = """
 المسافات، وحالة الأحرف الكبيرة
      والصغيرة، والأسطر الفارغة &mdash; كلٌّ منها يمكن تجاهله، كي لا يُقرأ ملف
      أعيد تنسيقه كمئة تغيير. والوسطُ الذي لم يتغير يُطوى افتراضياً إلى عدد،
      مع إبقاء ثلاثة أسطر على جانبَي كل تغيير."""

[[howto]]
title = "اقرأ ما تغيّر."
body = """
 الأسطر المحذوفة معلَّمة في جانب الأصل،
      والمضافة في الجانب الآخر، وداخل السطر المتغير تُبرَز الكلمات المختلفة
      &mdash; فمقارنةُ فقرتين تُظهر الكلمة التي انتقلت لا فقرتين
      كاملتين."""

[[howto]]
title = "خذ الرقعة."
body = """
 التنزيل ملفُ <code>.patch</code> بالصيغة
      الموحَّدة، وهي ما تتوقعه مراجعة الشيفرة و<code>git apply</code> وكل
      عارض فروق. والنسخ يضع الشيء نفسه في حافظتك."""

[[faq]]
q = "هل يُرفع نصّاي إلى أي مكان؟"
a = """
        لا. المقارنة دالّةٌ تعمل في متصفحك أنت، على جهازك أنت. وليست لهذه
        الأداة وظيفة شبكية من أي نوع &mdash; فهي لا تجلب شيئاً ولا ترسل شيئاً
        أبداً &mdash; و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به، وليس واحد منها لنا. وذلك هو سبب
        استعمالها لعقد أو ملف إعدادات أو شيفرة غير منشورة: فلصقُ تلك في مقارن
        شخص آخر تسليمُ النسختين معاً دفعة واحدة."""

[[faq]]
q = "ماذا تفعل المقارنة فعلاً؟"
a = """
        تجد أقصر مجموعة تعديلات تحوّل النصّ الأيسر إلى الأيمن، بخوارزمية Myers
        &mdash; التي يستعملها <code>git diff</code>. والأقصرُ هو ما يجعل الفرق
        مقروءاً: فالسطر المُدرَج في الوسط ينبغي أن يظهر إدراجاً واحداً لا أن
        يظهر كأن كل سطر بعده قد تغيّر. وداخل السطر المتغيّر تُعلَّم الكلمات
        المختلفة كذلك، فمقارنةُ فقرتين تعرض الكلمة التي انتقلت لا فقرتين
        كاملتين."""

[[faq]]
q = "هل يستطيع مقارنة ملفين بدل لصقتين؟"
a = """
        نعم. أفلِتهما كليهما معاً على المُنتقي فيحطّ كلٌّ في جانب، بالترتيب
        الذي أفلتّهما به. ويقرؤهما متصفحك إلى هذه الصفحة، وهي المكان الوحيد
        الذي يذهبان إليه. وبدِّل الجانبين إن أفلتّهما مقلوبَين."""

[[faq]]
q = "ماذا يخرج من المقارنة، وهل أستطيع تطبيقه؟"
a = """
        التنزيل فرقٌ موحَّد &mdash; صيغة <code>@@ -3,5 +3,5 @@</code> التي
        يقرؤها <code>git apply</code> و<code>patch</code> وكلُّ أداة مراجعة
        شيفرة. و&laquo;انسخ&raquo; يفعل الشيء نفسه إلى حافظتك. أما الذي على
        الشاشة فعرضٌ له: جنباً إلى جنب، أو في عمود واحد، والأجزاءُ غير المتغيّرة
        مطويّة إلى عدد ما لم تطلبها كلها."""

[[faq]]
q = "هل يستطيع تجاهل المسافات أو حالة الأحرف أو الأسطر الفارغة؟"
a = """
        نعم، كلاً منها على حدة. فتجاهل المسافات يجعل ملفاً أعيد تنسيقه يُقارن
        على أنه بلا تغيير؛ وتجاهل حالة الأحرف يعامل <code>Error</code> و
        <code>error</code> كلمةً واحدة؛ وتجاهل الأسطر الفارغة يتخطى الأسطر
        التي لا تحمل شيئاً. وعندئذ تقول العدّادات فوق النتيجة إن الاثنين
        متساويان متى جرى تجاهلُ الفروق التي طلبتَ تجاهلها &mdash; وهذا ليس
        الادعاء نفسه القائل إنهما متطابقان، والصفحة تُبقي الادعاءين
        منفصلين."""

[[faq]]
q = "ما أكبر مقارنة يستطيع التعامل معها؟"
a = """
        لا حدّ مضبوط هنا، لأنه لا خادم يدفع ثمن واحد. فنصّان من عشرين ألف سطر
        بينهما حفنة تغييرات يُقارنان في لحظة، لأن البداية والنهاية المشتركتين
        تُقصّان قبل أن يبدأ العمل الحقيقي. والمقارنةُ بين نصّين لا شيء بينهما
        مشترك البتة تتوقف مبكراً وتقول ذلك، بدل أن تنفق دقيقة في إثبات ما كان
        بيّناً أصلاً، والمقارنةُ الطويلة جداً ترسم أول بضعة آلاف من الصفوف
        وتترك الباقي للرقعة المنزَّلة."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا حدّ لكم تلصق.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        نصّك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل نصّيك بعيداً ليُقارنا
        كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

