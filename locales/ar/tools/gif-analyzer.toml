[[privacy]]
title = "ملف GIF عندك لا سبيل له إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد. وقد كان هذا يقول <code>connect-src 'none'</code>، وكان
      مطلقاً؛ فكلّفت إضافةُ الإعلانات ذلك، وقولُه جزء من الصفقة."""

[[privacy]]
title = "القارئ أربعة ملفات في هذا المستودع."
body = """
 ولا شيء هنا يستعمل
      فاكَّ ترميز GIF الخاص بالمتصفح لمعرفة ما في الملف، لأن ذلك الفاكّ لن يقول
      أين ذهب بايت. فتُقرأ الصيغة يدوياً: <code>src/gif.js</code> يمشي في
      الكتل، و<code>src/lzw.js</code> يفكّ ضغط البكسلات، و
      <code>src/frames.js</code> يرصفها، و<code>src/budget.js</code> يجمع
      الأجزاء من جديد ويتحقّق أنها تبلغ حجم الملف."""

[[privacy]]
title = "التعليقات والبيانات الوصفية تُعرَض عليك، ولا تُعرَض على أحد سواك."
body = """

      قد يحمل ملف GIF كتلة تعليق، أو حزمة XMP تصف تعديلاً، أو ملفَّ ألوان، وهذه
      الصفحة تطبعها كلها. وتُوضَع على الشاشة أمامك ولا تذهب إلى أي مكان آخر:
      فلا حدث تحليلات في هذا المستودع يحمل شيئاً منها، ولا تستطيع الصفحة إرسال
      واحد لو وُجد."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن ملفك: لا الملف، ولا
      مصغَّرة، ولا اسم، ولا حجم، ولا عدد إطارات، ولا تعليق. وكل سطر يقرأ ملف
      GIF أو يفكّ ضغطه أو يرسمه يُخدَم من هذا الأصل نفسه ومُدرَج في
      المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن ملفاتك. ولا يحدث شيء ما لم
      تنقره، والذي ستنتقل إليه بالنقر موقعُ شخص آخر."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل جزء من هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق: فأداةٌ ترسل ملف GIF عندك بعيداً
      ليُحلَّل كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

[[howto]]
title = "اختر ملف GIF."
body = """
 أفلِته على المُنتقي، أو اختره يدوياً.
      يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء ذلك."""

[[howto]]
title = "اقرأ الملخّص أولاً."
body = """
 مقاسُ اللوحة، وعددُ الإطارات،
      وكم تقول الحركة إنها تعمل وكم تعمل فعلاً. وهذان الأخيران يختلفان أكثر مما
      يتوقّع الناس، والسبب في القسم التالي."""

[[howto]]
title = "انظر إلى ما يبرز."
body = """
 كل سطر هناك مقيسٌ من ملفك:
      تأخيراتٌ لن يحترمها أي متصفح، وكتلةُ تكرار غائبة، وجداولُ ألوان لا يشير
      إليها شيء، وبياناتٌ وصفية أكبر من بعض الإطارات. ولا شيء منها تخمينٌ لما
      قصدت صنعه."""

[[howto]]
title = "انظر أين ذهبت البايتات."
body = """
 كل بايت من الملف في صف
      واحد بالضبط، والصفوف تبلغ الملف. فإن لم يكن أكثره في &laquo;البكسلات
      المضغوطة&raquo;، قالت بقيةُ الجدول أين هو بدلاً من ذلك."""

[[howto]]
title = "امضِ في الإطارات."
body = """
 كلٌّ يعرض تأخيره ومستطيله
      وطريقة التخلّص منه وحجمه. وبدِّل بين &laquo;اللوحة بعد كل إطار&raquo; و
      &laquo;ما يخزّنه كل إطار وحده&raquo; &mdash; والثاني هو كيف ترى هل الملف
      مُحسَّن، لأن ملف GIF المصنوع جيداً يخزّن مستطيلات ضئيلة والمصنوع رديئاً
      يخزّن الصورة كلها في كل مرة."""

[[howto]]
title = "خذ التقرير إن احتجت إليه."
body = """
 التحليل كله نصّاً صِرفاً،
      للصقه في رسالة أو حفظه بجانب الملف. وهو مبنيٌّ في الصفحة مما هو على شاشتك
      أصلاً."""

[[faq]]
q = "هل يُرفع ملف GIF عندي إلى أي مكان؟"
a = """
        لا. يقرأ متصفحك أنت الملف ويفكّ ضغطه ويرسمه على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع
        الاتصال بالشبكة وسيظل يحلّل ملفات GIF."""

[[faq]]
q = "لماذا يعمل ملف GIF عندي أبطأ مما تقول التأخيرات؟"
a = """
        لأن كل متصفح يرفض احترام تأخير دون جزأين من مئة من الثانية ويُبقي
        الإطار عُشر ثانية بدلاً من ذلك. وقد كُتِبت القاعدة في Netscape سنة 1996،
        للكرات الأرضية الدوّارة ولافتات &laquo;تحت الإنشاء&raquo; في ذلك الزمن،
        ونُسِخت في كل متصفح منذئذ؛ ولم يرفعها شيء قط.
        <br><br>
        فملفُّ GIF الذي تقول إطاراته كلها 0.01 ثانية لا يعمل عند 100 إطار في
        الثانية. بل عند 10، وهو أبطأ خمس إلى عشر مرات مما قصده ما صنعه. وهذه
        الصفحة تعرض الرقمين &mdash; ما يقوله الملف وما سيفعله فعلاً &mdash;
        وتعلّم على الإطارات المتأثّرة. والعلاج، في ما صنع الملف، أن يُكتَب 0.02
        لا 0.01."""

[[faq]]
q = "ماذا تعني &laquo;طريقة التخلّص&raquo;؟"
a = """
        ما الذي يُترَك على الشاشة حين ينتهي وقت الإطار، وهو الحقل الذي يقرّر هل
        تبدو الحركة صحيحة أم ملطَّخة.
        <br><br>
        <strong>اتركه في مكانه</strong> تعني أن الإطار التالي يطلي فوق هذا،
        وهو ما تريده حين تكون الإطارات معتمة ويغطّي بعضها بعضاً. و<strong>امسح
        رجوعاً إلى الخلفية</strong> تمسح مستطيل الإطار أولاً، وهو ما تحتاج إليه
        الشفافية &mdash; فبدونه تُظهِر الأجزاء الشفافة من الإطار التالي الإطارَ
        السابق تحتها. و<strong>أعِد ما كان تحته</strong> تعيد ما كان هناك قبل
        أن يرسم هذا الإطار، وهكذا يُخزَّن جسمٌ صغير متحرّك فوق خلفية ساكنة.
        و<strong>غير محدَّدة</strong> تعني أن الملف لم يقل، وكلُّ عارض يعاملها
        على أنها &laquo;اتركه في مكانه&raquo;."""

[[faq]]
q = "لماذا ملف GIF عندي بهذا الكبر؟"
a = """
        جدولُ &laquo;أين ذهبت البايتات&raquo; يجيب عن ذلك لملفك بعينه لا في
        العموم، والأجوبة الممكنة قليلة.
        <br><br>
        فإن كان جميعه تقريباً <strong>بكسلات مضغوطة</strong>، فالملف كثيرٌ من
        الصورة ببساطة: إذ يخزّن GIF كل إطار بكسلاتٍ كاملة، بلا تعويض حركة وبلا
        مقبض جودة، فالحجم تقريباً هو المساحة في عدد الإطارات. وإطاراتٌ أقلّ أو
        مقاسٌ أصغر أو ألوانٌ أقلّ هي الروافع الوحيدة.
        <br><br>
        وإن كانت شريحة كبيرة <strong>جداول ألوان</strong>، فالملف يكتب لوحة لكل
        إطار بـ 768 بايتاً لكل واحدة. وإن كانت شريحة كبيرة <strong>بيانات
        وصفية</strong>، فقد ترك محرِّرٌ حزمة XMP وراءه ويمكن إزالتها دون مسّ
        الصورة. وإن كانت الإطارات كلها تغطي اللوحة كلها، فلم يحسب المرمِّز قط
        أي جزء تغيّر فعلاً &mdash; وذلك في كل ما هو مصوَّر أو مسجَّل أكثرُ
        الملف."""

[[faq]]
q = "ما الفرق بين عرضَي الإطارات؟"
a = """
        <strong>اللوحة بعد كل إطار</strong> هي ما يعرضه العارض عند تلك اللحظة:
        هذا الإطار مرسوماً فوق ما تركته الإطارات التي قبله. و<strong>ما يخزّنه
        كل إطار وحده</strong> هو المستطيل الذي يحمله الملف فعلاً لذلك الإطار،
        وحده، ولا شيء تحته.
        <br><br>
        والثاني هو المثير للاهتمام. فملفُّ GIF قد يخزّن إطاراً على أنه الجزء
        الذي تغيّر من الصورة لا غير، ولهذا يمكن أن يكون تسجيلُ شاشة لنافذة
        ساكنة في أكثرها صغيراً. فإن كان كل إطار في ملفك اللوحةَ كاملةً، فلم
        يفعل شيء ذلك العمل &mdash; ولا تستطيع معرفة ذلك بمشاهدة الحركة، بل
        بالنظر إلى ما هو مخزَّن."""

[[faq]]
q = "يقول إن في ملفي تعليقاً أو XMP. ما ذاك؟"
a = """
        نصٌّ يركب مع الصورة ولا يرسمه أي عارض. فكتلةُ التعليق اسمُ ما كتب الملف
        عادةً. وحزمةُ XMP هي XML يكتبه محرِّر صور ليسجّل ما فعله، وقد تحمل تاريخ
        التعديل وإصدار البرنامج وأحياناً اسم المؤلف.
        <br><br>
        وهذه الصفحة تطبع الاثنين كاملَين، لأن السؤال المثير عن البيانات الوصفية
        هو ماذا تقول لا أنها موجودة. وتُعرَض عليك ولا تُعرَض على أحد سواك: فلا
        شيء في هذا المستودع يقرأ شيئاً منها على أحد."""

[[faq]]
q = "هل يستطيع فتح ملف GIF معطوب؟"
a = """
        يحاول، ويقول لك أين استسلم. فالملفُّ الذي ينتهي في منتصف كتلة، أو فيه
        بايت حيث ينبغي أن تكون علامةُ كتلة، أو يحمل إطاراً تنفد بياناته
        المضغوطة مبكراً، سيعرض رغم ذلك كلَّ ما أمكن قراءته قبل تلك النقطة،
        والمشكلةُ مسمّاة في الأعلى. وتلك هي الحالة التي يُطلَب فيها المحلّل أشدّ
        الطلب، فرميُ الملف كله من أجل بايت واحد سيّئ كان سيكون السلوك الخطأ."""

[[faq]]
q = "هل يغيّر ملفي؟"
a = """
        لا. فهذه الأداة تقرأ لا غير. ولا ملف خَرج ولا إعادة ترميز ولا زرّ هنا
        يكتب ملف GIF &mdash; والشيء الوحيد الذي تستطيع تنزيله نسخةٌ نصّية صِرفة
        من التحليل. وأصلك على قرصك لم يُمسّ، وهو أيضاً الجواب الصادق عمّا يحدث
        إن أغلقت التبويب."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية. ولا حدّ لحجم الملف
        غير ذاكرة جهازك أنت. ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا
        يُعطى المعلنون شيئاً عن ملفك."""

[[faq]]
q = "هل يعمل دون اتصال؟"
a = """
        نعم. حمِّل الصفحة مرة، ثم اقطع اتصالك بالإنترنت وستظل تعمل. وهذه أيضاً
        أبسط طريقة لإثبات أنه لا يُرفع شيء: فأداةٌ ترسل ملف GIF عندك بعيداً
        ليُحلَّل كانت ستتوقف في اللحظة التي تقطع فيها الاتصال."""

