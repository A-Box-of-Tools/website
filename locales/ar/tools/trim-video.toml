[[privacy]]
title = "مقاطعك لا سبيل لها إلى الخروج."
body = """
 تُسمّي
      Content-Security-Policy كل عنوان يجوز لهذه الصفحة الاتصال به، وليس واحد
      منها لنا. فلا يوجد هنا طرفٌ يُجمَع عنده ملفك، ولا في الشيفرة ما يرسله
      إليه لو وُجد."""

[[privacy]]
title = "لا شيء هنا يجلب شيئاً."
body = """
 ليس في هذه الأداة وظيفة شبكية
      البتة: لا عنوان يُلصَق، ولا شيء يُنزَّل، ولا محرّك يُجلَب عند أول
      استعمال. وكل بايت يلمس فيديوك جاء من هذا الأصل حين حُمِّلت الصفحة."""

[[privacy]]
title = "وعلى المسار المعتاد، لا يُفكّ ترميز شيء أصلاً."
body = """

      القصُّ لا يغيّر منظر أي إطار، فتُنقَل الإطارات المرمَّزة للأجزاء التي
      علّمت عليها إلى الملف الجديد كما وُجِدت تماماً. ويُخزَّن كل واحد شريحةً
      من الملف الذي على قرصك &mdash; ملاحظةً تقول أي البايتات، لا البايتات
      نفسها &mdash; ويقرؤها متصفحك أول مرة وهو يكتب التنزيل. فلا شيء هنا يعيد
      فيديوك صورةً قط."""

[[privacy]]
title = "ملف العلامات يُصنَع في الصفحة."
body = """
 حفظُ علاماتك يكتب ملفاً
      نصّياً من الأرقام التي على الشاشة أصلاً، إلى تنزيلاتك مباشرة. وتحميلُ
      واحد يقرؤه هنا. ولا يقترب أيٌّ منهما من شبكة، ولا يحمل أيٌّ منهما إلا
      أوقاتاً."""

[[privacy]]
title = "الصوت يُنسَخ ولا يُستمَع إليه."
body = """
 على مسارَي MP4 كليهما
      تُنقَل عيّنات الصوت دون أن يُفكّ ترميزها البتة &mdash; فلا شيء هنا
      يعيدها صوتاً قط، ولا شيء يستطيع تمريرها إلى أي مكان لو فعل."""

[[privacy]]
title = "وحيث تُفكّ ترميز الإطارات، فذلك يحدث هنا."
body = """
 القصُّ الدقيق،
      والمعاينةُ لملف لن يشغّله هذا المتصفح، يمرّان عبر WebCodecs على جهازك
      أنت. وهو فاكُّ الترميز نفسه الذي كان سيعرض عليك الفيديو على أي حال،
      جارياً في المكان نفسه."""

[[privacy]]
title = "ما تُحمّله Google، وما لا يُعطى لها."
body = """
 نصوص الإعلانات
      والقياس تأتي من Google. ولا يُعطى أيٌّ منهما شيئاً عن فيديوك: لا ملفاً،
      ولا إطاراً، ولا اسماً، ولا حجماً، ولا مدةً، ولا أين قصصته. وكل سطر يقرأ
      ويقصّ ويكتب يُخدَم من هذا الأصل نفسه ومُدرَج في المستودع."""

[[privacy]]
title = "ما يُحمّله زر التبرّع، وما لا يُعطى له."
body = """

      زر &laquo;Buy me a coffee&raquo; في الترويسة يرسمه نصٌّ برمجي من
      cdnjs.buymeacoffee.com ويأخذ حروفه من Google Fonts. وهو رابط لا أكثر:
      لا يبلّغ عن زيارة، ولا يُعطى شيئاً عنك ولا عن فيديوك."""

[[privacy]]
title = "يعمل دون اتصال."
body = """
 اقطع الاتصال بالشبكة ويظل كل ما على هذه
      الصفحة يعمل. وهذا أبسط برهان على الإطلاق."""

[[howto]]
title = "اختر فيديو."
body = """
 أفلِت ملف MP4 أو MOV أو M4V أو WebM على
      المُنتقي. يقرؤه المتصفح من قرصك مباشرة؛ ولا يُرسَل شيء إلى أي مكان أثناء
      ذلك. وأفلِت عدة ملفات فتُوصَل، بالترتيب الذي وضعتها به."""

[[howto]]
title = "شغّله، وعلّم على الأجزاء التي تريدها."
body = """
 اضغط
      <kbd>I</kbd> حيث ينبغي أن يبدأ الجزء و<kbd>O</kbd> حيث ينبغي أن ينتهي.
      وافعل ذلك بلا حدّ &mdash; فكل زوج يصير صفاً في الجدول الذي تحته، وشريطاً
      على الخطّ الزمني. و<kbd>U</kbd> يسترجع آخر واحد، و<kbd>Space</kbd> يشغّل
      ويوقف، ومفاتيح الأسهم تقفز خمس ثوانٍ في كل مرة. وأبطئ التشغيل إن كانت
      اللحظة يصعب اقتناصها."""

[[howto]]
title = "صحّح العلامات."
body = """
 كل صف يمكن تشغيله وحده، أو إعادة
      توقيته بكتابة وقت بعينه فيه، أو تحريكه أعلى الترتيب أو أسفله، أو حذفه.
      وطرفا الجزء المحدَّد يمكن سحبهما على الخطّ الزمني كذلك. والمجموع في
      الأعلى هو ما سيبلغه الفيديو المنتهي."""

[[howto]]
title = "أبقِها، أو اقطعها."
body = """
 والإبقاء هو الوجه المعتاد:
      فالفيديو المنتهي هو الأجزاء التي علّمت عليها، موصولةً بترتيبها. أما
      قطعُها فهو العمل الآخر الذي يريده الناس ونادراً ما يجدونه &mdash; علّم
      على الإعلانات أو الصمت أو البدايات الفاشلة، فيُوصَل ما بقي دونها."""

[[howto]]
title = "قُصّه، ونزِّله."
body = """
 &laquo;أبقِ كل بايت&raquo; ينقل
      الإطارات دون أن تُمَسّ: سريع، ولا يمكن أن يكلّف جودة، لكن كل جزء يبدأ من
      الإطار المفتاحي الذي قبل علامتك. و&laquo;اقصص هنا بالضبط&raquo; يفكّ
      ترميز الصورة ويكتبها من جديد فيبدأ كل جزء عند الإطار الذي اخترته. وتقول
      الصفحة أيهما أنت على وشك الحصول عليه، وماذا يكلّف، قبل أن تضغط الزر."""

[[faq]]
q = "هل يُرفع فيديوي إلى أي مكان؟"
a = """
        لا. يقرؤه متصفحك أنت ويعلّم عليه ويقصّه ويكتبه على جهازك أنت. ولا جانب
        خادمَ لهذه الأداة، و<code>Content-Security-Policy</code> الخاصة بالصفحة
        تُسمّي كل عنوان يجوز لها الاتصال به &mdash; وليس واحد منها لنا. اقطع
        اتصالك بالإنترنت وقُصّ فيديو رغم ذلك إن كنت تفضّل التحقّق على أن يُقال
        لك."""

[[faq]]
q = "هل أستطيع الإبقاء على عدة أجزاء من الفيديو نفسه؟"
a = """
        لهذا وُجِد هذا. اضغط <kbd>I</kbd> و<kbd>O</kbd> ما شئت وهو يعمل؛ فكل
        زوج يصير صفاً، والفيديو المنتهي كل صف موصولاً بترتيبه وقد زال ما عداه.
        ومعظم المقصّات على الإنترنت تعطيك زوج مقابض واحداً وتسألك أي امتداد
        واحد تُبقي، وذلك حسن لتشذيب أول مقطع وآخره ولا يفيد البتة في مشاهدة
        ساعة من التصوير مرة واحدة والإبقاء على اللحظات الست التي تستحق."""

[[faq]]
q = "هل يُفقد القصُّ شيئاً من الجودة؟"
a = """
        لا على المسار المعتاد، ولا بالوجه الذي يهمّ. فالقصّ لا يغيّر منظر أي
        إطار، فتُنقَل الإطارات إلى الملف الجديد كما كانت تماماً: البايتات
        نفسها، وإعدادات المرمِّز نفسها، وكل شيء نفسه. والمسار الوحيد هنا الذي
        يعيد ترميز شيء هو القصّ الدقيق، وهو يقول ذلك على الزرّ."""

[[faq]]
q = "لماذا يبدأ جزءٌ قبل حيث علّمته؟"
a = """
        بسبب كيفية تخزين الفيديو، وعلى المشغّلات التي تتجاهل جزءاً معيارياً من
        الصيغة لا غير. فمعظم الإطارات تُحفَظ وصفاً لكيفية اختلافها عن جيرانها،
        فلا يمكن فكّ ترميزها دونهم؛ والإطار المفتاحي وحده يقوم بنفسه، والإطارات
        المفتاحية تبعد عادةً ثانيةً إلى عشر ثوانٍ. فالقصّ الذي ينسخ الإطارات
        عليه إذن أن يحمل المجرى من الإطار المفتاحي الذي أمام علامتك &mdash;
        ويقول الملف <em>ابدأ التشغيل عند علامتي</em>، وهو ما يحترمه كل مشغّل
        رئيس. فإن احتجت إليه دقيقاً في كل مشغّل، فاختر &laquo;اقصص هنا
        بالضبط&raquo;، وهو يعيد الترميز. وتقول لك الصفحة في أي الحالتين أنت،
        وبكم، قبل أن تصدّر."""

[[faq]]
q = "هل أستطيع قطع الإعلانات بدلاً من ذلك؟"
a = """
        نعم. علّم عليها، ثم اختر &laquo;اقطعها&raquo;: فيُوصَل كل ما
        <em>لم</em> تعلّم عليه بدلاً منها، بترتيبه. وقائمة العلامات نفسها تجيب
        عن السؤالين، فتستطيع التنقّل بينهما ورؤية المدة تتغيّر دون أن تعلّم على
        شيء مرتين."""

[[faq]]
q = "هل أستطيع حفظ علاماتي والعودة إليها؟"
a = """
        نعم. &laquo;احفظ العلامات&raquo; يكتب ملفاً نصّياً صِرفاً &mdash; سطر
        لكل جزء، وبداية ونهاية تفصل بينهما فاصلة &mdash; و&laquo;حمِّل
        العلامات&raquo; يقرأ واحداً. وتُعرَض صيغتان، ثوانٍ صِرفة و
        <code>HH:MM:SS.mmm</code>، وكلتاهما تلتزم التخطيط الذي تستعمله أصلاً
        الأدواتُ الأخرى التي تعمل هكذا، فالملف المكتوب هنا يمكن مناولته
        لواحدة منها والملف المكتوب هناك يمكن إفلاته على هذه الصفحة. فالتعليم
        عمل دقيق ولا ينبغي لأحد أن يفعله مرتين."""

[[faq]]
q = "ما صيغ الفيديو التي أستطيع قصّها؟"
a = """
        MP4 وM4V وMOV تُقرأ مباشرة، مهما كان بداخلها: H.264 أو HEVC أو AV1 أو
        VP9. ونسخُ الإطارات لا يستلزم فكّ ترميزها، فهذا المسار يعمل حتى مع
        مرمِّز لا يملك متصفحك فاكَّ ترميز له البتة. وكل ما عداها مما يستطيع
        متصفحك تشغيله &mdash; وWebM أظهرها &mdash; يُقَصّ بتشغيله وتسجيل
        الناتج بدلاً من ذلك، وذلك يعمل، ويستغرق مدة الناتج، ولا يمكنه الإبقاء
        إلا على جزء واحد. أما الملف الذي لا يستطيع المتصفح قراءته ولا تشغيله،
        وهو عملياً AVI وWMV وFLV ومعظم ملفات MKV، فيُرفَض برسالة تقول ذلك بدل
        أن يفشل في منتصف الطريق."""

[[faq]]
q = "هل ثمّة حدّ لحجم الفيديو أو مدّته؟"
a = """
        لا حدّ مبنيّاً في الأداة، وعلى مسار النسخ لا يكاد الملف يُقرأ أصلاً:
        فالإطارات التي تُبقيها يُشار إليها لا تُحمَّل، فالإبقاء على أربع دقائق
        من تسجيل بأربعة غيغابايت يكلّف نحو ما تكلّفه كتابةُ تلك الدقائق الأربع
        إلى القرص. أما القصّ الدقيق فيمشي في الملف بضعة ميغابايتات في كل مرة.
        وفي الحالين السقف العملي هو الملف المنتهي، إذ يُجمَّع في الذاكرة قبل أن
        تنزّله."""

[[faq]]
q = "هل ينجو الصوت؟"
a = """
        على مسارَي MP4 كليهما يُنسَخ عيّنةً عيّنة دون أن يُفكّ ترميزه قط، فهو
        بايتاً بايتاً ما كان في الملف، وعلامةُ تحرير تُبقي كل جزء محاذياً
        لصورته إلى حدّ جزء من ألف من الثانية. والاستثناء الوحيد وصلُ مقاطع
        منفصلة صوتُها موصوف على نحو مختلف &mdash; بمعدّلات عيّنات مختلفة مثلاً
        &mdash; حيث لا سبيل إلى وضع الاثنين في مسار واحد دون فكّ ترميزهما،
        وتقول الصفحة ذلك قبل أن تفعل. وعلى مسار التسجيل يُلتقَط من التشغيل
        ويُعاد ترميزه. وفي الحالين ثمّة مربع اختيار لتركه بالكلية."""

[[faq]]
q = "هل هو مجاني، وهل أحتاج إلى حساب؟"
a = """
        هو مجاني، ولا حساب ولا تسجيل دخول ولا فترة تجريبية ولا علامة مائية.
        ويحمل الموقع إعلانات، وهي ما يدفع تكاليفه؛ ولا يُعطى المعلنون شيئاً عن
        فيديوك."""

