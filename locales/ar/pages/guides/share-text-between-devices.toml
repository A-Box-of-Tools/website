title = "مشاركة النص والملفات بين الأجهزة &mdash; دون رفعها"
description = "انقل نصاً أو ملفات من متصفح إلى آخر عبر اتصال مباشر مشفّر - دون أن تراسل نفسك بالبريد، ودون سجلّ محادثة، ودون حساب، ودون أن يحتفظ أي خادم بنسخة."

heading = "كيف تشارك النص والملفات بين الأجهزة دون رفعها"
lede = """
    الطرق المعتادة لنقل ملاحظة أو ملف إلى جهاز آخر تترك كلها نسخة وراءها:
    في مجلد المرسَل، أو في سجلّ محادثة، أو على خادم موقع مشاركة، خلف زر حذف
    لا تملك إلا أن تثق به. هناك طريقة لا تترك شيئاً في أي مكان، لأن شيئاً
    لا يُخزَّن أصلاً - وهي أيضاً الوحيدة التي يمكن أن يُنادى باسمها عبر
    الغرفة."""

