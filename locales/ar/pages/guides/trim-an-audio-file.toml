nav = "قصّ ملف صوتي"
title = "كيف تقصّ صوتاً دون أن تفقد جودة"
description = "أين تحطّ قَصّةُ الصوت فعلاً، ولماذا تستطيع أن تكون دقيقة بينما لا تستطيع قَصّةُ الفيديو، ولماذا تطقطق الوصلة أحياناً، وماذا يفعل تلاشٍ من خمسة أجزاء من الألف من الثانية حقاً."
heading = "كيف تقصّ صوتاً دون أن تفقد جودة"
lede = """
    قَصّةُ الصوت تستطيع أن تحطّ عند اللحظة التي علّمتها بعينها، في كل مشغّل،
    دائماً &mdash; وذلك ليس صحيحاً في الفيديو. وهذا شرحٌ لماذا، وما المأخذ
    الحقيقي الوحيد، وماذا تفعل بشأنه."""
