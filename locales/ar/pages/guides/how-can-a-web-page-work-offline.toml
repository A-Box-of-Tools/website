title = "كيف يمكن لصفحة ويب أن تعمل من دون إنترنت؟"
description = "الصفحة التي تواصل العمل والواي فاي مطفأ ليست سحرا - إنها عامل خدمة وذاكرة تخزين، عتاد المتصفح المعتاد. كيف يعمل ذلك، ولماذا العمل دون اتصال أقوى برهان خصوصية تقدمه أداة، وما الذي لا يبرهنه."
heading = "كيف يمكن لصفحة ويب أن تعمل والواي فاي مطفأ؟"
lede = """
    لأن المتصفح احتفظ بنسخة كاملة، ولأن برنامجا صغيرا يصل مع الصفحة يقدم
    تلك النسخة كلما عجزت الشبكة. العتاد معتاد ويستحق الفهم، لأن أداة تعمل
    وهي مفصولة تريك شيئا لا تستطيع أي سياسة خصوصية أن تريك إياه."""
