tagline = "Bir koda doğrultun ya da onun bir resmini bırakın. Burada okunur, başka hiçbir yerde."

title = "QR Kod Okuyucu ve Barkod Tarayıcı &mdash; Bir Görselden, Hiçbir Şey Yüklenmez"
