[[privacy]]
title = "Yapıştırdığınızın gidecek bir yeri yok."
body = """
 Content-Security-Policy,
      bu sayfanın iletişim kurabileceği her adresi tek tek sayar ve bunların
      hiçbiri bize ait değildir. Burada yapıştırılmış bir faturanın
      toplanabileceği hiçbir uç nokta yoktur; olsaydı bile kodda onu oraya
      gönderecek hiçbir şey yoktur."""

[[privacy]]
title = "Burada hiçbir şey bir şey getirmez."
body = """
 <code>src/</code>
      içinde hiçbir yerde ne bir <code>fetch</code>, ne bir
      <code>XMLHttpRequest</code>, ne de bir <code>sendBeacon</code> vardır.
      Ayrıştırıcı ve yazıcı, bu sayfada bir metin alıp bir metin döndüren
      işlevlerdir."""

[[privacy]]
title = "Dış varlıklar hiçbir zaman çözümlenmez."
body = """
 İçinde dış varlık
      bulunan bir <code>DOCTYPE</code>, bir XML ayrıştırıcısının, ayrıştırma
      yapan makinedeki bir dosyayı okumaya ikna edilme yoludur ve biçimin en eski
      açığıdır. <code>src/shared/parse-xml.js</code>, içinde hiç varlık çözümlemesi bulunmayan
      elle yazılmış bir okuyucudur &mdash; kapatılmış değil, hiç yok &mdash; ve
      bu sayfa metninizi tarayıcının kendi <code>DOMParser</code>'ına da asla
      vermez."""

[[privacy]]
title = "XML'den çıkan her değer bir metindir."
body = """
 <code>&lt;port&gt;8080&lt;/port&gt;</code>
      bunun bir sayı olup olmadığı hakkında bir şey söylemez, bu yüzden JSON
      <code>"8080"</code> der. Bunu sizin yerinize kararlaştırmak, sonra dosyada
      yazıyormuş gibi yol alacak bir bilgi uydurmak olurdu."""

[[privacy]]
title = "Google'ın yüklediği ve kendisine verilmeyen şeyler."
body = """
 Reklam ve
      ölçüm betikleri Google'dan, bağış düğmesi ise Buy Me a Coffee'den gelir.
      Hiçbirine metninizden bir karakter verilmez. Onu okuyan, ayrıştıran ve yazan
      her satır bu kaynaktan sunulur ve depoda listelenmiştir."""

[[privacy]]
title = "Çevrimdışı çalışır."
body = """
 Ağ bağlantısını kesin, araç hiç değişmez;
      çünkü içinde zaten hiç ağ adımı olmadı. Bundan daha basit bir kanıt
      yoktur."""

[[howto]]
title = "İşi seçin."
body = """
 İki sekme, tek kutu: <em>Biçimlendir</em>
      XML'i açar ya da sıkıştırır; <em>Çevir</em> onu JSON'a, ya da JSON'u yeniden
      XML'e döndürür. Az önce açtığınız XML, iki kez yapıştırmadan çevirdiğiniz
      XML'dir."""

[[howto]]
title = "Yapıştırın ya da dosyayı bırakın."
body = """
 Seçip kopyalayabildiğiniz her
      şey olur; seçiciye bırakılan bir <code>.xml</code>, <code>.svg</code>,
      <code>.rss</code> ya da <code>.xsd</code> dosyasını kendi tarayıcınız okur ve
      kutuya koyar &mdash; atlanacak bir yükleme adımı yoktur."""

[[howto]]
title = "Girintiyi seçin ya da sıkıştırın."
body = """
 İki boşluk, dört ya da bir
      sekme. Düz sıkıştırmak, yalnızca okunsun diye konmuş her boşluğu çıkarılmış
      aynı belgedir ve sonuç, bunun kaç bayt kazandırdığını söyler."""

[[howto]]
title = "Hatayı hatanın olduğu yerde okuyun."
body = """
 Burada başarısız olan bir
      ayrıştırıcı, tarayıcının bir çırpıda okuduğu bir belge için söylediği
      &bdquo;1. satırda hata&ldquo; yerine, <em>hangi etiketin</em> hiç
      kapatılmadığını ve hangi satır ile sütunda olduğunu söyler."""

[[howto]]
title = "Sonucu alın."
body = """
 Kopyalayın ya da çıktığı biçimin adını taşıyan
      bir dosya olarak indirin."""

[[faq]]
q = "XML'im bir yere yükleniyor mu?"
a = """
        Hayır. Bu sayfadaki ayrıştırıcı ve yazıcı, kendi tarayıcınızda, kendi
        donanımınızda çalışan işlevlerdir. Bu aracın herhangi bir ağ işlevi hiç
        yoktur &mdash; hiçbir zaman bir şey getirmez ve hiçbir zaman bir şey
        göndermez &mdash; ve sayfanın <code>Content-Security-Policy</code>'si
        iletişim kurabileceği her adresi sayar; hiçbiri bize ait değildir. Bu, XML
        için biçimin ününün düşündürdüğünden daha çok önemlidir: içinde gelen şey
        çoğunlukla bir fatura, bir hesap özeti, bir sağlık kaydı ya da başlığında
        kimlik bilgileri duran bir SOAP isteğidir."""

[[faq]]
q = "Dış varlıkları çözümlüyor mu?"
a = """
        Hayır, ve kapatılacak bir şey de yok. Dış varlık çözümlemesi, bir XML
        ayrıştırıcısının kendisini çalıştıran makinedeki dosyaları okumaya ikna
        edilme yoludur &mdash; genellikle XXE diye yazılan saldırı &mdash; ve
        <code>src/shared/parse-xml.js</code> içinde hiç varlık çözümlemesi olmayan elle
        yazılmış bir okuyucudur. Metniniz tarayıcının kendi
        <code>DOMParser</code>'ına da hiçbir zaman verilmez. Bir
        <code>DOCTYPE</code>, hiç işletilmeden olduğu gibi taşınır."""

[[faq]]
q = "XML'i JSON'a çevirirken ne kaybolur?"
a = """
        Karışık içeriğin sırası, yorumlar ve bir öznitelik ile bir alt öge
        arasındaki fark &mdash; sonuncusu silinmekten çok yumuşatılır, çünkü bir
        öznitelik adı <code>@</code> ile başlayan bir üyeye dönüşür. Bir ögenin
        kendi metni, başka bir şeyin yanında durmak zorunda kaldığında
        <code>#text</code> olur ve yinelenen alt ögeler bir diziye dönüşür. Her
        değer metin olarak kalır: XML'in türleri yoktur ve <code>8080</code>'in
        bir sayı olduğuna karar vermek bilgi uydurmak olurdu."""

[[faq]]
q = "JSON'u XML'e çevirirken ne kaybolur?"
a = """
        Boş bir nesne, boş bir dizi ve boş bir metin arasındaki fark &mdash;
        üçü de boş bir ögeye dönüşür &mdash; ve her değerin türü, çünkü XML'in
        türleri yoktur. Bir dizi, geri okunabilen tek biçim olan yinelenen bir
        ögeye dönüşür; bir öge adının taşıyamayacağı bir anahtarın da zor
        karakterleri, hiçbir ayrıştırıcının okumayacağı bir belge üretmek yerine
        değiştirilir."""

[[faq]]
q = "Bir SVG'yi, bir RSS akışını ya da bir POM dosyasını biçimlendirebilir mi?"
a = """
        Evet. Üçü de XML'dir ve bu, XML'in belirli bir lehçesini değil XML'i
        okur. Böyle açılmış bir SVG'yi elle düzenlemek daha kolaydır; bir RSS ya
        da Atom akışı genellikle sıkıştırılmış gönderilir ve bir şey onu açana dek
        okunmaz. Yerleşimin belgenin anlamına hiçbir etkisi yoktur."""

[[faq]]
q = "XML'i yeniden girintilemek anlamını değiştirir mi?"
a = """
        Ögeleri başka ögeler tutan bir belge için hayır. Önemli olabileceği yer
        metindir: sözcük tutan bir ögenin içindeki boşluk o metnin parçasıdır, bu
        yüzden yalnızca metin tutan bir öge açılmak yerine tek satırda bırakılır.
        <code>CDATA</code> bölümleri tam olduğu gibi kopyalanır."""

[[faq]]
q = "Neden tarayıcının kendi XML ayrıştırıcısı kullanılmıyor?"
a = """
        Belge bozuk olduğunda söylediği şey yüzünden. <code>DOMParser</code>,
        ifadesi her tarayıcıda farklı olan ve çoğu zaman &bdquo;1. satırda
        hata&ldquo;ya inen bir hata belgesi döndürür. Elle yazılmış bir okuyucu,
        hangi etiketin hiç kapatılmadığını ve nerede açıldığını söyleyebilir; asıl
        bilmeniz gereken de buydu. Dış varlıkları çözümlememek de öteki
        nedendir."""

[[faq]]
q = "Ne kadar büyük bir dosyayı işleyebilir?"
a = """
        Burada konulmuş bir sınır yoktur, çünkü bunun bedelini ödeyen bir sunucu
        yoktur. Gerçek tavan kendi cihazınızdır: birkaç megabaytlık XML sorun
        çıkarmaz ve çok uzun bir belgede sayfa, klavyeyi sizinle paylaşmamak
        yerine yeniden biçimlendirmeden önce yazmanızda bir duraklama bekler."""

[[faq]]
q = "Ücretsiz mi, hesap gerekiyor mu?"
a = """
        Ücretsizdir; hesap, oturum açma, deneme süresi ve ne kadar
        yapıştıracağınıza dair bir sınır yoktur. Sitede reklam vardır, masrafı
        karşılayan da odur; reklamlara metninizle ilgili hiçbir şey verilmez."""

[[faq]]
q = "Çevrimdışı çalışır mı?"
a = """
        Evet. Sayfayı bir kez yükleyin, sonra internet bağlantısını kesin;
        çalışmayı sürdürür. Bu aynı zamanda hiçbir şeyin yüklenmediğini
        kanıtlamanın en basit yoludur: XML'inizi biçimlendirilmek üzere gönderen
        bir araç, fişi çektiğiniz anda dururdu."""

