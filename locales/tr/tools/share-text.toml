      çalıştığı için her şeyi önce kaçış karakterleriyle işleyen
      işleyici için <code>src/markdown.js</code>. Sunucunun tam kaynak kodu
      aynı depodaki <code>workers/rendezvous/worker.js</code> dosyasıdır:
      bağlantı adı başına bir oda, açık bağlantılardan başka hiçbir şey
      tutmaz."""

