pledge = """
    Burada paylaştıklarınız, uçtan uca şifreli bir WebRTC kanalı üzerinden
    sizin tarayıcınızdan her okuyucunun tarayıcısına gider, başka hiçbir
    yere değil. İşin içindeki tek sunucu &mdash; bu sayfanın
    <code>Content-Security-Policy</code>'sinde adı geçer, kodu depodadır
    &mdash; iki tarayıcıyı birbirine tanıştırır ve kenara çekilir: hiçbir
    şey saklamaz ve içerik asla ondan geçmez. Geçmiş de hesap da yoktur. Bu
    sekmeyi kapatın; paylaşım, okuyucuların açık sayfaları dahil her yerde
    aynı anda sona erer."""

live_hint = """
