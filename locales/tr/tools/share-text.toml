      Aracıya giden, birkaç kilobaytlık bağlantı kurulumu taşıyan tek bir
      WebSocket göreceksiniz &mdash; ve ne kadar yazar ya da eklerseniz
      ekleyin, bunlardan bir şey taşıyan tek bir istek bile yok."""

