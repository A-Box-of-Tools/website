  "Sesi örnek örnek ters çevirir ya da tümüyle dışarıda bırakır",
  "Düzensiz kare hızları dahil, orijinal kare zamanlarını korur",
  "Çevrimdışı çalışır; yükleme yok, hesap yok, filigran yok",
]

