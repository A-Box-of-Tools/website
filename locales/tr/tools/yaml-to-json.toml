[[howto]]
title = "Yönü seçin."
body = """
 <em>YAML'den JSON'a</em> ya da <em>JSON'dan
      YAML'e</em>. Menünün altındaki not, o yönün neyi kaybettirdiğini siz bir şey
      yapıştırmadan önce söyler, sonra değil."""

[[howto]]
title = "Yapıştırın ya da dosyayı bırakın."
