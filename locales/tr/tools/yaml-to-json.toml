body = """
 Burada başarısız olan bir
      ayrıştırıcı, &bdquo;4193. konumda beklenmeyen belirteç&ldquo; demek yerine
      ne bulduğunu ve hangi satır ile sütunda olduğunu söyler. Bu, genellikle bir
      yapılandırma dosyasını başka hiçbir şey açmadan onarmaya yeter."""

[[howto]]
title = "Sonucu alın."
body = """
 Kopyalayın ya da çıktığı biçimin adını taşıyan
      bir dosya olarak indirin."""

[[faq]]
q = "YAML'im bir yere yükleniyor mu?"
a = """
        Hayır. Bu sayfadaki iki ayrıştırıcı da iki yazıcı da, kendi tarayıcınızda,
        kendi donanımınızda çalışan işlevlerdir. Bu aracın herhangi bir ağ işlevi
        hiç yoktur &mdash; hiçbir zaman bir şey getirmez ve hiçbir zaman bir şey
        göndermez &mdash; ve sayfanın <code>Content-Security-Policy</code>'si
        iletişim kurabileceği her adresi sayar; hiçbiri bize ait değildir. Bunu bir
        dağıtım yapılandırması için kullanmanın sebebi de tam olarak budur: o
        dosyalar ana makine adları, kova adları ve arada birinin taşımak istediği
        bir sırla doludur, ve birini başkasının dönüştürücüsüne yapıştırmak onu ona
        vermektir."""

[[faq]]
q = "YAML'i JSON'a çevirirken ne kaybolur?"
a = """
        Yorumlar, çünkü JSON'un onları koyacak bir yeri yoktur. Çıpalar, takma
        adlar ve etiketler tahmin edilmek yerine doğrudan geri çevrilir &mdash;
        her biri JSON'un söyleyemeyeceği bir şey söyler, ve sessizce bir yorum
        seçen bir dönüştürücü size dosyanın söylediği şey olmayan bir belge verirdi.
        Öbür yön hiçbir şey kaybettirmez: her JSON belgesi zaten bir YAML
        belgesidir."""

[[faq]]
q = "YAML'imde no yazıyor ama JSON'da metin olarak çıktı. Neden?"
a = """
        Çünkü o gerçekten bir metin, ve burada 1.1 değil YAML 1.2 okunuyor. YAML
        1.1'de <code>yes</code>, <code>no</code>, <code>on</code> ve
        <code>off</code> mantıksal değerlerdi; Norveç'in ülke kodunu
        <code>false</code>'a çeviren o ünlü hata budur. YAML 1.2 bunu bıraktı,
        burası da bıraktı: metinden başka bir şey olarak okunanlar yalnızca
        <code>true</code>, <code>false</code>, <code>null</code> ve
        <code>~</code>'dir. Öbür yönde bu sözcükler <em>tırnak içinde</em> geri
        yazılır &mdash; burada tırnaksız da metin olarak okunacak olsalar bile
        &mdash; çünkü dosyayı sonra açacak şey öyle okumayabilir. PyYAML hâlâ
        varsayılan olarak 1.1 kullanıyor. Katı okuyup temkinli yazmak, iki yönde
        de doğru olan tek birleşimdir."""

[[faq]]
q = "Anahtarlarımın sırasını koruyor mu?"
a = """
        Evet, iki yönde de, ve bu kulağa geldiğinden daha zordur.
        <code>JSON.parse</code> üzerine kurulmuş bir dönüştürücü, tam sayıya
        benzeyen anahtarları sessizce başa alır; böylece
        <code>{"10":a,"2":b}</code>, <code>{"2":b,"10":a}</code> olarak geri gelir.
        Sayılar yazdığınız basamakları korur, yani yirmi basamaklı bir hesap
        kimliği son üç basamağını bir double'a kaptırmaz. Sıralanmasını
        <em>istiyorsanız</em> bir kutucuk var, ve o, kod noktalarına göre değil,
        anahtarların okunuşuna göre sıralar."""

[[faq]]
q = "Birden çok YAML belgesini bir kerede dönüştürebilir mi?"
a = """
        Hayır, ve birini seçmek yerine bunu söyler. <code>---</code> ayırıcıları
        olan bir dosya birden çok belge taşır, ve JSON'un &bdquo;birkaç
        belge&ldquo; anlamına gelen bir biçimi yoktur &mdash; bir dizi, dosyanın
        hiç öne sürmediği bir iddia olurdu. Onları birer birer dönüştürün."""

[[faq]]
q = "Burada neden bir YAML biçimlendirici yok?"
a = """
        Çünkü YAML'in yazmaya değer sıkıştırılmış bir biçimi yok &mdash; kısa olanı
        akış biçemidir, o da okunmaz, ve okunmazlık bir dosyayı YAML'de tutmanın
        sebebinin tam tersidir. JSON, XML, HTML ve CSS'i açmak
        <a href="../json-bicimlendirme/">JSON biçimlendiricinin</a> işidir, ve o
        YAML'i de açar."""

[[faq]]
q = "Ne kadar büyük bir dosyayı işleyebilir?"
a = """
        Burada konulmuş bir sınır yoktur, çünkü bunun bedelini ödeyen bir sunucu
        yoktur. Gerçek tavan kendi cihazınızdır: birkaç megabaytlık YAML sorun
        çıkarmaz ve çok uzun bir belgede sayfa, klavyeyi sizinle paylaşmamak yerine
        dönüştürmeden önce yazmanızda bir duraklama bekler."""

[[faq]]
q = "Ücretsiz mi, hesap gerekiyor mu?"
a = """
        Ücretsizdir; hesap, oturum açma, deneme süresi ve ne kadar
        yapıştıracağınıza dair bir sınır yoktur. Sitede reklam vardır, masrafı
        karşılayan da odur; reklamlara metninizle ilgili hiçbir şey verilmez."""

[[faq]]
q = "Çevrimdışı çalışır mı?"
a = """
        Evet. Sayfayı bir kez yükleyin, sonra internet bağlantısını kesin;
        çalışmayı sürdürür. Bu aynı zamanda hiçbir şeyin yüklenmediğini
        kanıtlamanın en basit yoludur: yapılandırmanızı dönüştürülmek üzere
        gönderen bir araç, fişi çektiğiniz anda dururdu."""

