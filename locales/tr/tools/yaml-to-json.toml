[[privacy]]
title = "Yapıştırdığınızın gidecek bir yeri yok."
body = """
 Content-Security-Policy,
      bu sayfanın iletişim kurabileceği her adresi tek tek sayar ve bunların
      hiçbiri bize ait değildir. Burada yapıştırılmış bir yapılandırmanın
      toplanabileceği hiçbir uç nokta yoktur; olsaydı bile kodda onu oraya
      gönderecek hiçbir şey yoktur."""

[[privacy]]
title = "Burada hiçbir şey bir şey getirmez."
body = """
 <code>src/</code>
      içinde hiçbir yerde ne bir <code>fetch</code>, ne bir
      <code>XMLHttpRequest</code>, ne de bir <code>sendBeacon</code> vardır. İki
      ayrıştırıcı da iki yazıcı da, bu sayfada bir metin alıp bir metin döndüren
      işlevlerdir."""

[[privacy]]
title = "YAML 1.2 okur, yani Norveç yine Norveç kalır."
body = """
 YAML 1.1'de
      <code>no</code> bir mantıksal değerdi; Norveç'in ülke kodunu
      <code>false</code>'a çeviren o ünlü hata budur. Burada 1.2 okunur ve o,
      göründüğü gibi bir metindir. Öbür yönde bu sözcükler <em>tırnak içinde</em>
      geri yazılır, çünkü dosyayı sonra açacak şey hâlâ bir 1.1 okuyucusu
      olabilir. <code>tests/js/text-convert.test.js</code> iki yarıyı da
      denetler."""

[[privacy]]
title = "Dürüst olamayacak bir dönüşüm, onun yerine durur."
body = """
 YAML içindeki
      bir çıpa, bir takma ad ya da bir etiket, sessizce başka bir şey demek olan
      bir JSON belgesi üretmek yerine, hangi satırda olduğunu söyleyen bir iletiyle
      dönüşümü bitirir. JSON'un &bdquo;aynı düğüm iki kez&ldquo; demenin bir yolu
      yoktur ve bir yorum seçmek, sizin yerinize seçmek olurdu."""

[[privacy]]
