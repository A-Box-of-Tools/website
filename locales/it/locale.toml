#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# is translated in planned.toml beside this file.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roadmap"
title = "Roadmap &mdash; cosa sta costruendo abox.tools"
description = "Tutti gli strumenti previsti per abox.tools, raggruppati e allo scoperto, insieme a quelli già pronti. Girano tutti nel browser e non caricano niente."
heading = "Cosa arriva dopo"
lede = """
    Tutto quello che sta nelle due liste qui sotto fa il proprio lavoro dentro
    il browser e non carica niente, che è la regola che un nome deve superare
    prima ancora di entrare in lista. I numeri non sono scritti da nessuna
    parte: li conta la build, leggendo le liste stesse."""

intro_heading = "Come è nata questa lista"
intro = """
    <p>
      Non è una lista dei desideri. È venuta fuori scorrendo il catalogo del
      più grande sito online di GIF e video, che è la cosa più vicina a un
      inventario di quello che le persone vogliono davvero fare a un file, e
      tenendo solo le voci che si possono costruire in modo che il lavoro
      avvenga sul tuo dispositivo e continui ad avvenire con la rete staccata.
    </p>
    <p>
      Quasi tutto quello che è sopravvissuto si appoggia a interfacce che il
      browser offre già di suo. Qualche voce ha bisogno di un codec incorporato
      nell'unico strumento che lo usa, e va bene lo stesso, perché il file
      continua a non uscire dal dispositivo. Quello che non arrivava a questa
      asticella è stato lasciato fuori invece che promesso, quindi alcuni dei
      buchi che qui sotto sembrano evidenti sono voluti.
    </p>
    <p>
      Gli strumenti che esistono già stanno in cima al loro gruppo, con
      l'etichetta <em>Pronto</em> e il collegamento alla loro pagina. Tutto
      quello che sta sotto deve ancora arrivare, e niente diventa un link
      prima di esserlo.
    </p>"""

planned_heading = "Ogni tipo di file, e cosa ci si può fare"

og_title = "La roadmap di abox.tools"
og_description = "Cosa è pronto e cosa arriva dopo. Gira tutto nel browser e non carica niente."
og_image_alt = "abox.tools - strumenti che non passano da nessun server"

