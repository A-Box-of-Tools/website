#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Strumenti gratis nel browser &mdash; niente caricamenti, niente account | abox.tools"
# Sotto i 155 caratteri, come in inglese: Google taglia la descrizione più o
# meno lì, e qui la coda è la parte che vende il sito.
description = "Strumenti gratis che non caricano mai i tuoi file. Unisci immagini in un PDF o in un MP4, comprimi una foto a una dimensione esatta, ritaglia un video."
heading = "Strumenti che non passano da nessun server"
og_title = "A Box of Tools &mdash; strumenti che non passano da nessun server"
og_description = "Strumenti piccoli, ognuno per una cosa sola, che lavorano interamente dentro il browser. I tuoi file non escono dal tuo dispositivo."
og_image_alt = "abox.tools - strumenti che non passano da nessun server"
schema_description = "Strumenti piccoli, ognuno per una cosa sola, che sbrigano tutto il lavoro dentro il browser. Non si carica niente e non serve nessun account."
schema_about = "Utilità per i file che girano nel browser ed elaborano i file in locale, senza caricarli"

lede = """
    Strumenti piccoli, ognuno per una cosa sola, che sbrigano tutto il lavoro
    dentro il browser. I tuoi file restano dove sono: non c'è niente da
    caricare, nessun account da creare e niente che ti segua."""

support_note = """
      Questi strumenti sono gratuiti e lo resteranno. Se uno ti ha tolto un
      lavoro dalle mani, questa è l'unica cosa del sito che ti chiede
      qualcosa."""

# Tre fatti verificabili invece di una promessa, come in inglese.
[[hub.guarantees]]
title = "I tuoi file non escono dal tuo dispositivo"
body = """
        Li apre, li legge e li elabora il browser che stai usando, con
        l'hardware che hai davanti. La <code>Content-Security-Policy</code> di
        ogni strumento elenca tutti gli indirizzi che quello strumento può
        contattare, e nessuno di quegli indirizzi è nostro."""

[[hub.guarantees]]
title = "Dei tuoi file non viene comunicato niente"
body = """
        Né il file, né una miniatura, né il nome, né la dimensione, né quanti
        ne hai scelti. Nessuno strumento di questo sito comunica niente di
        tutto questo, e dall'altro capo non c'è nessun server che potrebbe
        leggerlo."""

[[hub.guarantees]]
title = "Funziona anche senza connessione"
body = """
        Apri uno strumento, stacca la rete e continua a lavorare sui tuoi file
        esattamente come prima. È una cosa che non si può fingere, perché uno
        strumento che mandasse i tuoi file altrove per farli elaborare, a quel
        punto, si fermerebbe."""

[[hub.categories]]
id = "images"
name = "Immagini"
note = "Comprimila, ridimensionala o togli quello che racconta di te senza dirtelo. Niente di tutto questo viene spedito da qualche parte."

[[hub.categories]]
id = "video-and-animation"
name = "Video e animazione"
note = "Taglialo, convertilo o montalo partendo dalle foto, senza che le riprese lascino il tuo dispositivo."

[[hub.categories]]
id = "documents-and-audio"
name = "Documenti e audio"
note = "Riordina un documento o accorcia una registrazione, senza mandare né l'uno né l'altra a elaborare altrove."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Testo, codici e password"
note = "Leggilo, verificalo o crealo qui. Nessun token, nessun file di configurazione e nessuna password sul server di qualcun altro."

