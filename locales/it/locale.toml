#
# Italiano.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#

lang = "it"
name = "Italian"
endonym = "Italiano"

complete = false

#
# ---------------------------------------------------------------------------
# The addresses. Keyed by the ENGLISH slug; the Italian is an address and
# appears only on the right.
#
# The infinitive plus the bare noun - "comprimere-immagine" - which is how
# Italian search is phrased. No accented vowels here, and only here.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "comprimere-immagine"
"compress-pdf" = "comprimere-pdf"
"crop-video" = "ritagliare-video"
"edit-audio" = "modificare-audio"
# Quasi nessuno cerca un "editor EXIF": si cerca come togliere i dati da una foto.
"exif-editor" = "rimuovere-dati-exif"
"images-to-pdf" = "immagini-in-pdf"
"images-to-video" = "immagini-in-video"
"resize-image" = "ridimensionare-immagine"
"trim-video" = "tagliare-video"

"guides" = "guide"
"roadmap" = "roadmap"
"privacy" = "privacy"
"terms" = "termini"

"guides/compress-an-image-to-a-target-size" = "guide/comprimere-un-immagine-a-una-dimensione-esatta"
"guides/resize-an-image" = "guide/ridimensionare-un-immagine"
"guides/remove-exif-and-gps-data" = "guide/rimuovere-i-dati-exif-e-gps"
"guides/make-a-pdf-smaller" = "guide/ridurre-le-dimensioni-di-un-pdf"
"guides/combine-images-into-a-pdf" = "guide/unire-immagini-in-un-pdf"
"guides/turn-images-into-a-video" = "guide/trasformare-immagini-in-un-video"
"guides/trim-a-video" = "guide/tagliare-un-video"
"guides/crop-a-video" = "guide/ritagliare-un-video"
"guides/is-it-safe-to-upload-files" = "guide/e-sicuro-caricare-i-propri-file"

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Strumenti gratuiti nel browser &mdash; senza caricare nulla | abox.tools"
# Sotto i 155 caratteri, come in inglese: Google taglia la descrizione più o
# meno lì, e qui la coda è la parte che vende il sito.
description = "Strumenti gratuiti che non caricano mai i tuoi file. Unisci immagini in un PDF o in un MP4, comprimi un'immagine a una dimensione esatta, ritaglia un video."
heading = "Strumenti che non toccano nessun server"
og_title = "A Box of Tools &mdash; strumenti che non toccano nessun server"
og_description = "Piccoli strumenti, uno per ogni singola cosa, che funzionano interamente nel tuo browser. I tuoi file non lasciano il tuo dispositivo."
og_image_alt = "abox.tools - strumenti che non toccano nessun server"
schema_description = "Piccoli strumenti, uno per ogni singola cosa, che fanno tutto il loro lavoro dentro il browser. Non viene caricato nulla e non serve alcun account."
schema_about = "Utilità per file che girano nel browser ed elaborano i file in locale, senza caricarli"

lede = """
    Piccoli strumenti, uno per ogni singola cosa, che fanno tutto il loro
    lavoro dentro il tuo browser. I tuoi file restano sul tuo dispositivo: non
    c'è nulla da caricare, nessun account da creare e nulla che ti segua."""

support_note = """
      Questi strumenti sono gratuiti e lo resteranno. Se uno ti ha risparmiato
      un lavoro, questa è l'unica cosa del sito che ti chiede qualcosa."""

# Tre fatti verificabili invece di una promessa, come in inglese.
[[hub.guarantees]]
title = "I tuoi file non lasciano mai il tuo dispositivo"
body = """
        Vengono aperti, letti ed elaborati dal tuo browser, sul tuo hardware. La
        <code>Content-Security-Policy</code> di ogni strumento nomina tutti gli
        indirizzi che può contattare, e nessuno di questi è nostro."""

[[hub.guarantees]]
title = "Dei tuoi file non viene trasmesso nulla"
body = """
        Né il file, né una miniatura, né il nome, la dimensione o quanti ne hai
        scelti. Nessuno strumento qui comunica niente di tutto questo.
        Dall'altra parte non c'è alcun server che potrebbe leggerlo."""

[[hub.guarantees]]
title = "Funziona offline"
body = """
        Apri uno strumento una volta, stacca la connessione, e continua a
        lavorare sui tuoi file esattamente come prima. È difficile da fingere:
        uno strumento che mandasse i tuoi file altrove per elaborarli si
        fermerebbe e basta."""

[[hub.categories]]
id = "images-and-video"
name = "Immagini e video"
note = "Lavora foto e riprese senza consegnarle a nessuno."

[[hub.categories]]
id = "gif-and-animation"
name = "GIF e animazione"
note = "Costruisci un'animazione, o smontala, senza che esca dal tuo computer."

[[hub.categories]]
id = "audio"
name = "Audio"
note = "Lavora una registrazione senza consegnarla a nessuno, compreso l'audio dentro un video."

[[hub.categories]]
id = "documents-and-pdf"
name = "Documenti e PDF"
note = "Crea e riordina documenti senza mandarli a farsi elaborare altrove."

[[hub.categories]]
id = "codes-and-data"
name = "Codici e dati"
note = "Trasformare ciò che avete digitato in qualcosa che una macchina sa leggere, senza che esca dalla pagina."

[[hub.categories]]
id = "text-and-code"
name = "Testo e codice"
note = "Leggilo, confrontalo, codificalo, senza incollare un token o un file di configurazione sul server di qualcun altro."

