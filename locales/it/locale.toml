#
# Italiano.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#

lang = "it"
name = "Italian"
endonym = "Italiano"

complete = true

#
# ---------------------------------------------------------------------------
# The addresses. Keyed by the ENGLISH slug; the Italian is an address and
# appears only on the right.
#
# The infinitive plus the bare noun - "comprimere-immagine" - which is how
# Italian search is phrased. No accented vowels here, and only here.
# ---------------------------------------------------------------------------
#

[slugs]
# Gli strumenti.
"compress-image" = "comprimere-immagine"
"compress-pdf" = "comprimere-pdf"
"crop-video" = "ritagliare-video"
"edit-audio" = "modificare-audio"
# Quasi nessuno cerca un "editor EXIF": si cerca come togliere i dati da una foto.
"exif-editor" = "rimuovere-dati-exif"
# "Oscurare" e il verbo che si usa anche negli atti pubblici, e porta con se
# la distinzione su cui vive la pagina: togliere, non coprire.
"redact-image" = "oscurare-immagine"
# Le conversioni perdono il verbo, come in "immagini-in-pdf": è il modo in cui
# si scrive una conversione in italiano quando la si cerca.
"heic-to-jpg" = "heic-in-jpg"
# Nessuno cerca "immagine in data URI". Si cerca base64, che è la cosa che
# finisce nel foglio di stile.
"image-to-data-uri" = "immagine-in-base64"
# Anche qui il lavoro, non il formato: quasi nessuno cerca "da immagine a ICO"
# e moltissimi cercano come si fa una favicon.
"image-to-ico" = "creare-favicon"
"images-to-pdf" = "immagini-in-pdf"
"images-to-video" = "immagini-in-video"
# "QR code" e non "codice QR": è la forma che in italiano si scrive e si cerca,
# prestito compreso.
"qr-barcode" = "creare-qr-code"
# «Leggere» e non «scansionare»: la seconda si dice, la prima si cerca.
"qr-barcode-reader" = "leggere-qr-code"
"resize-image" = "ridimensionare-immagine"
# Lo strumento scrive anche JPEG e WebP, ma la domanda che porta qui è sempre
# la stessa, e nomina il PNG.
"svg-to-image" = "svg-in-png"
"trim-video" = "tagliare-video"
"video-to-gif" = "video-in-gif"
"gif-analyzer" = "analizzare-gif"
"gif-maker" = "creare-gif"
"grab-frame" = "estrarre-fotogramma-video"
"id-photo" = "foto-tessera"
"merge-pdf" = "unire-pdf"
"reverse-video" = "invertire-video"
"split-gif" = "dividere-gif-in-fotogrammi"
"format-json" = "formattare-json"
"encode-text" = "codifica-base64"
"compare-text" = "confrontare-testi"
"trim-audio" = "tagliare-audio"
# Un nome e non un verbo, come per il QR code: "generatore password" è la
# forma che si scrive, senza la preposizione che l'italiano scritto vorrebbe.
"password-generator" = "generatore-password"
# Il prestito, non "ripresa accelerata": timelapse e' quello che si scrive.
"timelapse-video" = "creare-timelapse"
"hash-checksum" = "verificare-checksum"
# Il DICOM resta DICOM: e la sigla che sta scritta sul CD che consegna
# l’ospedale, e nessuno la cerca tradotta.
"dicom-viewer" = "visualizzatore-dicom"
"document-scanner" = "scansionare-documenti"
# Lo stesso verbo di "oscurare-immagine", perche e la stessa promessa: il testo
# viene tolto dal file, non coperto con un rettangolo.
"redact-pdf" = "oscurare-pdf"
"stack-images" = "impilare-immagini"

"guides" = "guide"
"roadmap" = "roadmap"
"privacy" = "privacy"
"terms" = "termini"

# Le guide. Ognuna è la domanda che fa chi la cerca, nelle parole in cui la fa,
# e non la traduzione del titolo inglese.
"guides/compress-an-image-to-a-target-size" = "guide/comprimere-un-immagine-a-una-dimensione-esatta"
"guides/resize-an-image" = "guide/ridimensionare-un-immagine"
"guides/remove-exif-and-gps-data" = "guide/rimuovere-i-dati-exif-e-gps"
"guides/redact-an-image" = "guide/oscurare-un-immagine"
"guides/make-a-pdf-smaller" = "guide/ridurre-le-dimensioni-di-un-pdf"
"guides/combine-images-into-a-pdf" = "guide/unire-immagini-in-un-pdf"
"guides/turn-images-into-a-video" = "guide/trasformare-immagini-in-un-video"
