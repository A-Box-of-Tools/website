#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roadmap"
title = "Roadmap &mdash; cosa sta costruendo abox.tools"
description = "Tutti gli strumenti previsti per abox.tools, raggruppati e allo scoperto, insieme a quelli già pronti. Girano tutti nel browser e non caricano nulla."
heading = "Cosa arriva dopo"
lede = """
    Tutto quello che sta nelle due liste qui sotto fa il proprio lavoro dentro
    il tuo browser e non carica nulla &mdash; è la regola che un nome deve
    superare prima ancora di finire qui. I numeri non sono scritti da nessuna
    parte; la compilazione li conta sulle liste stesse."""

intro_heading = "Come è stata compilata questa lista"
intro = """
    <p>
      Non è una lista dei desideri. È nata scorrendo il catalogo di strumenti
      del più grande sito di GIF e video online &mdash; la cosa più vicina che
      esista a un inventario di ciò che le persone vogliono davvero fare a un
      file &mdash; e tenendo ogni voce che si può costruire in modo che il
      lavoro avvenga sul tuo dispositivo e continui ad avvenire con la rete
      staccata.
    </p>
    <p>
      Quasi tutto ciò che è sopravvissuto si appoggia a interfacce che il
      browser già offre. Qualcuna richiede un codec incorporato nell'unico
      strumento che lo usa, ed è consentito: il file continua a non lasciare il
      dispositivo. Quello che non superava questa asticella è stato lasciato
      fuori invece che promesso, quindi alcuni dei buchi che sotto sembrano
      evidenti sono voluti.
    </p>
    <p>
      Gli strumenti che esistono già stanno in cima al loro gruppo, segnati
      come <em>Pronto</em> e collegati alla propria pagina. Tutto quello che
      sta sotto deve ancora arrivare, e niente diventa un link prima di
      esserlo.
    </p>"""

planned_heading = "Ogni tipo di file, e cosa ci si può fare"

og_title = "La roadmap di abox.tools"
og_description = "Cosa è pronto e cosa arriva dopo. Gira tutto nel browser e non carica nulla."
og_image_alt = "abox.tools - strumenti che non toccano nessun server"

