"guides/grab-a-frame-from-a-video" = "guide/estrarre-un-fotogramma-da-un-video"
"guides/make-a-gif-from-images" = "guide/creare-una-gif-da-immagini"
"guides/make-a-passport-photo" = "guide/fare-una-foto-tessera"
"guides/merge-and-split-pdf-files" = "guide/unire-e-dividere-file-pdf"
"guides/reverse-a-video" = "guide/invertire-un-video"
