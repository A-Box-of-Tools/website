<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> Scegli la codifica</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">Codifica</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>In che verso</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>Codifica</strong> Entra testo normale, esce codificato.</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>Decodifica</strong> Entra codificato, esce testo normale.</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> Incollalo</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Il tuo testo</label>
          <span class="count" id="input-count">vuoto</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Incolla il testo da codificare, o il Base64 da decodificare - oppure trascina sopra un file."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Prova un esempio</button>
        <button type="button" id="clear" class="ghost danger">Svuota</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> Prenditi il risultato</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Ancora niente.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Copia</button>
        <a id="download" class="ghost as-button" hidden download>Scarica</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
