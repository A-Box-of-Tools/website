[[privacy]]
title = "Le tue immagini non hanno dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Questo
      strumento non aggiunge niente a quella lista, perché non ha una funzione di
      rete propria, nemmeno facoltativa. Non esiste un punto di raccolta in cui i
      tuoi file possano finire, e nel codice non c'è niente che ce li manderebbe
      se anche esistesse."""

[[privacy]]
title = "Il PDF viene scritto qui."
body = """
 Un PDF è un elenco di oggetti più una
      tabella che dice dove comincia ciascuno, e <code>src/shared/pdf-page-writer.js</code> scrive
      tutti e due. Non viene scaricata nessuna libreria, non viene generato
      niente su un server, e il file finito viene consegnato a un download
      direttamente dalla memoria."""

[[privacy]]
title = "Al documento non viene detto niente su di te."
body = """
 Quasi tutti gli
      strumenti timbrano un PDF con un orario e il nome del programma che l'ha
      fatto. Questo scrive un titolo, un autore e una data solo se li digiti tu:
      i nomi dei file delle tue immagini nel documento non compaiono mai, e non
      ci compare niente sul tuo dispositivo."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google. A nessuno dei due viene
      passato niente sulle tue immagini: né un file, né una miniatura, né un
      nome, né una dimensione, né un conteggio. Ogni riga che legge, decodifica o
      scrive un'immagine è servita da questa origine ed è elencata nel
      repository."""

[[privacy]]
title = "Cosa carica il pulsante delle donazioni, e cosa non gli arriva."
body = """

      Il pulsante «Buy me a coffee» in cima lo disegna uno script di
      cdnjs.buymeacoffee.com, che prende i caratteri da Google Fonts. È un link
      e niente di più: non riferisce nessuna visita, e non gli viene passato
      niente su di te o sulle tue immagini. Finché non ci clicchi non succede
      niente, e quello a cui arriveresti è il sito di qualcun altro."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e tutto quello che sta su questa
      pagina continua a funzionare. È la prova più semplice che ci sia, perché
      uno strumento che spedisse via le tue foto per farne un documento si
      fermerebbe."""

[[howto]]
title = "Scegli le immagini."
body = """
 Trascina una cartella sul riquadro,
      oppure seleziona i file a mano. Li legge il browser direttamente dal tuo
      disco, e mentre lo fa non parte niente per nessuna destinazione."""

[[howto]]
title = "Metti le pagine in ordine, e gira quelle che ne hanno bisogno."
body = """
 Un'immagine
      diventa una pagina, nell'ordine che vedi. Trascina una tessera per la sua
      maniglia se vuoi spostarla, oppure usa le frecce; i pulsanti di rotazione
      girano una pagina di un quarto alla volta, che è quello che di solito serve
      a una scansione storta."""

[[howto]]
title = "Scegli una dimensione di pagina."
body = """
 Con «adatta la pagina a ogni
      immagine» ogni pagina diventa esattamente la sua immagine, senza niente di
      ritagliato e senza bande bianche. Le dimensioni con un nome, cioè A4,
      Letter, Legal e le altre, mettono invece ogni immagine su una pagina fissa,
      con un margine se ne vuoi uno."""

[[howto]]
title = "Crea il PDF e scaricalo."
body = """
 Il documento viene scritto sul tuo
      dispositivo, quindi quanto ci mette dipende dal tuo hardware e non da una
      coda. Il file finito finisce dritto nei download del browser."""

[[faq]]
q = "Le mie immagini vengono caricate da qualche parte?"
a = """
        No. Le tue immagini le legge, e il PDF lo scrive, il tuo browser sul tuo
        hardware. Questo strumento non ha un lato server, e la
        <code>Content-Security-Policy</code> della pagina elenca tutti gli
        indirizzi che può contattare, nessuno dei quali appartiene a questo sito.
        A differenza di qualche altro strumento di qui, questo di funzioni di rete
        facoltative non ne ha proprio."""

[[faq]]
q = "Convertire in PDF fa perdere qualità?"
a = """
        Non per un JPEG, con l'impostazione predefinita. Il PDF i dati JPEG li sa
        portare direttamente, quindi una fotografia viene copiata nel documento
        byte per byte: non viene mai decodificata e non viene mai ricompressa, e
        l'immagine nel PDF è l'immagine che c'era nel file. Gli altri formati vanno
        invece ricodificati, perché il PDF per loro non ha un filtro, a meno che
        tu non scelga l'impostazione senza perdita, che li conserva esattamente al
        prezzo di un file più pesante."""

[[faq]]
q = "Quali formati di immagine posso usare?"
a = """
        Qualunque immagine ferma che il tuo browser sappia decodificare, il che in
        pratica vuol dire JPG, PNG, WebP, GIF, AVIF e, sui dispositivi Apple,
        HEIC. Qui non c'è nessun elenco a parte da tenere aggiornato, perché la
        decodifica è compito del browser e non nostro."""

[[faq]]
q = "Posso scegliere la dimensione della pagina e l'ordine delle pagine?"
a = """
        Sì. Le pagine possono essere A4, Letter, Legal, A3, A5, Tabloid, una
        dimensione che scrivi tu, oppure esattamente la dimensione di ogni
        immagine. Trascina le tessere per riordinarle, ordinale per nome o per
        data, ruotane una qualsiasi di un quarto di giro, e imposta un margine in
        millimetri."""

[[faq]]
q = "Quante immagini posso mettere in un PDF?"
a = """
        Nello strumento non c'è nessun limite. Il tetto pratico è la memoria del
        tuo dispositivo, perché il documento finito viene assemblato lì prima che
        tu lo scarichi. La prima cosa a sentirlo è qualche centinaio di foto da
        telefono a piena risoluzione; rimpicciolire il lato più lungo, nelle
        impostazioni, sposta quel tetto parecchio più in là."""

[[faq]]
q = "Il PDF contiene i nomi dei miei file o un orario?"
a = """
        No, a meno che tu non lo chieda. Il blocco di informazioni del documento
        resta vuoto tranne che per il nome di questo strumento: nessun nome di
        file, nessun nome di dispositivo, nessun nome utente, e nessuna data di
        creazione se non spunti la casella apposta. È voluto, perché un PDF è una
        cosa che le persone mandano ad altre persone."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione e non c'è periodo di
        prova. Il sito ha della pubblicità, ed è quella che lo mantiene; agli
        annunci non arriva niente sulle tue immagini."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via le tue immagini per
        farne un documento si fermerebbe nell'istante in cui stacchi la spina."""

