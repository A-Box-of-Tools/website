[[privacy]]
title = "Il tuo disegno non ha dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui i tuoi file possano finire, e nel codice
      non c'è niente che ce li manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 In <code>src/</code> non
      c'è né un <code>fetch</code>, né un <code>XMLHttpRequest</code>, né un
      <code>sendBeacon</code>. Tutto il rasterizzatore è un
      <code>&lt;img&gt;</code> che contiene un blob del tuo file, un
      <code>drawImage</code> su un canvas e un <code>canvas.toBlob</code>."""

[[privacy]]
title = "Un SVG è un documento, e questa è la modalità in cui non può agire."
body = """
 Un SVG può portare con sé
      uno <code>&lt;script&gt;</code>, un
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code> remoto, un
      foglio di stile e un carattere web. Disegnato attraverso un
      <code>&lt;img&gt;</code> si trova però in quella che la specifica chiama
      <em>secure static mode</em>: lo script non gira e non viene recuperato
      nemmeno uno di quegli indirizzi. È una garanzia del browser e non una
      promessa nostra, ed è il motivo per cui questa pagina può aprire un file
      che non ha mai visto senza che il file possa chiamare casa."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google, il pulsante delle
      donazioni da Buy Me a Coffee. A nessuno di loro viene passato niente sul
      tuo disegno. Ogni riga che legge, dimensiona o disegna un file è servita da
      questa origine ed è elencata nel repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta
      identico, perché al suo interno non c'è mai stato un passaggio di rete. È
      la prova più semplice che ci sia."""

[[howto]]
title = "Scegli l'SVG."
body = """
 Trascinane uno sul riquadro, oppure
      prendi una cartella intera e convertili tutti in un colpo solo. Il file lo
      legge il browser direttamente dal tuo disco, e mentre lo fa non parte
      niente per nessuna destinazione. Ogni riga dice che dimensione crede di
      avere il file, e lo dice in modo diverso a seconda che quella dimensione
      venga dal suo <code>viewBox</code> oppure sia stata data per scontata
      perché il file non ne dichiara nessuna."""

[[howto]]
title = "Di' quanto grande."
body = """
 Un moltiplicatore della dimensione del
      file è la risposta più rapida, ed è quella giusta per un lotto, perché ogni
      disegno viene scalato dal proprio punto di partenza e una serie di icone
      resta in proporzione. Altrimenti indica una larghezza, un'altezza, il lato
      più lungo, o un riquadro con tutti e due i lati dati. Qui un numero grande
      non ha la penale che avrebbe con una fotografia, perché il disegno viene
      ridisegnato a quella dimensione, non stirato fino a lì."""

[[howto]]
title = "Aggiungi le copie ad alta densità, se ti servono."
body = """
 Un telefono e un portatile
      Retina disegnano due o tre pixel fisici per ogni pixel CSS, quindi un logo
      da 200 pixel ha bisogno dietro di un file da 400 o 600 pixel. Chiedi
      <code>@2x</code> e <code>@3x</code> ed escono nominate come se le aspettano
      Xcode, gli strumenti di Android e l'<code>image-set()</code> del CSS, e
      ognuna è esattamente il doppio o il triplo della prima invece che
      arrotondata per conto suo."""

[[howto]]
title = "Scegli il formato e decidi sulla trasparenza."
body = """
 PNG, a meno che tu non abbia
      un motivo: è senza perdita, tiene la trasparenza, e le tinte piatte ci si
      comprimono bene. Il JPEG di trasparenza non ne ha, quindi un colore di
      sfondo viene dipinto che tu ne scelga uno o no, e senza sceglierlo ogni
      pixel trasparente esce nero. Il WebP fa tutte e due le cose e produce un
      file più leggero, al prezzo del software abbastanza vecchio da non saperlo
      leggere."""

[[howto]]
title = "Guarda l'anteprima prima di scaricare."
body = """
 È disegnata dallo stesso codice che
      scrive il file, dal tuo file, sul tuo dispositivo. Quando un disegno
      diventa pixel cambiano due cose, e tutte e due si vedono qui: un tratto da
      un capello, che era largo mezzo pixel, diventa grigio, e il testo viene
      disegnato con un carattere che questo computer ha già, non con uno
      recuperato dal web."""

[[howto]]
title = "Prendi i file."
body = """
 Un download per file, oppure tutto il
      lotto in un unico zip. I nomi seguono l'SVG da cui vengono, con
      <code>@2x</code> e <code>@3x</code> sulle copie, e due file che avrebbero
      avuto lo stesso nome vengono numerati invece che sostituirsi a vicenda in
      silenzio."""

[[faq]]
q = "Il mio SVG viene caricato da qualche parte?"
a = """
        No. Il file lo legge il tuo browser sul tuo hardware, lo disegna su un
        canvas con lo stesso motore che rende ogni altra immagine che vedi, e te
        lo restituisce come download. Questo strumento non ha nessuna funzione di
        rete: non recupera mai niente e non spedisce mai niente. La
        <code>Content-Security-Policy</code> della pagina elenca poi tutti gli
        indirizzi che può contattare, e nessuno di quelli appartiene a questo
        sito."""

[[faq]]
q = "A che dimensione dovrei rasterizzare un SVG?"
a = """
        A quella che chiede la cosa che lo legge, moltiplicata per il rapporto di
        pixel del dispositivo su cui verrà visto. Un logo che occupa 200 pixel CSS
        ha bisogno di 400 per un portatile Retina e di 600 per un telefono
        recente, che è poi quello che sono qui le copie <code>@2x</code> e
        <code>@3x</code>. Per l'icona di un'app o per una scheda su uno store, lo
        store nomina un numero esatto ed è quello il numero. Quando invece nessuno
        ti ha detto niente, 1024 sul lato più lungo è un default utile: abbastanza
        grande per quasi ogni uso e abbastanza piccolo da mandare via mail."""

[[faq]]
q = "Ingrandirlo fa perdere qualità?"
a = """
        No, e questo è l'unico posto in cui quella risposta è onestamente no. Un
        vettoriale sono istruzioni invece che pixel, quindi il browser ridisegna
        le curve a qualunque dimensione gli si chieda: quattromila pixel tirati
        fuori da un'icona da 24 pixel sono nitidi esattamente come lo erano i 24.
        Quello che non puoi fare è il percorso inverso, perché una volta che è un
        PNG sono pixel come qualunque altra cosa; rasterizza quindi alla
        dimensione che ti serve, invece di ridimensionare il risultato dopo."""

[[faq]]
q = "Il mio SVG non ha larghezza né altezza. Che dimensione ottengo?"
a = """
        Quella del <code>viewBox</code>, se ce n'è uno: la sua larghezza e la sua
        altezza sono unità utente e non pixel, ma sono gli unici numeri che stanno
        nel file, e un browser li tratta come la dimensione naturale del disegno.
        Se non c'è nemmeno un viewBox, la pagina scrive <em>presunta</em> accanto
        alla riga e usa 300&nbsp;&times;&nbsp;150, che è la dimensione a cui
        l'avrebbe disegnato un <code>&lt;img&gt;</code>. In un caso e nell'altro
        puoi indicare la dimensione che vuoi e il file viene disegnato a
        quella."""

[[faq]]
q = "Perché il testo nel PNG viene diverso?"
a = """
        Perché il carattere dentro l'SVG non c'è. Un SVG che disegna del testo
        nomina un carattere e lascia che sia la macchina a trovarlo, e un file che
        se lo tira da Google Fonts con un <code>@import</code> qui non ottiene
        niente: a un SVG disegnato attraverso un <code>&lt;img&gt;</code> non è
        concesso recuperare niente, che è la stessa regola che gli impedisce di
        chiamare casa con il tuo file. La soluzione ogni grafico la conosce già:
        converti il testo in tracciati nel programma di disegno prima di
        esportare. A quel punto è geometria, e viene uguale dappertutto."""

[[faq]]
q = "Può convertire più file insieme?"
a = """
        Sì. Ogni SVG dell'elenco viene reso con le stesse impostazioni e il lotto
        si scarica in un unico zip. Per un lotto l'impostazione giusta di solito è
        un moltiplicatore, cioè «4&times; la dimensione che il file chiede»,
        perché ogni disegno viene scalato dalla propria dimensione invece che
        forzato tutto allo stesso numero di pixel. Clicca una riga qualsiasi per
        mettere quella nell'anteprima."""

[[faq]]
q = "C'è un limite di dimensione?"
a = """
        Quello del browser, non il nostro. Un canvas si arrende da qualche parte
        oltre i 16.384 pixel per lato, e Safari su iPhone o iPad si ferma attorno
        ai 16,7 megapixel di area, cioè 4096&nbsp;&times;&nbsp;4096. Sopra quella
        soglia la pagina ti avverte, invece di restituirti un'immagine vuota, che
        è quello che fa un browser quando è a corto: <code>toBlob</code> non
        restituisce proprio niente, senza nemmeno un errore che si spieghi. Oltre
        i 100 megapixel lo strumento si rifiuta, perché sono 400&nbsp;MB di canvas
        prima ancora che sia stato codificato un byte."""

[[faq]]
q = "Cosa succede alla trasparenza?"
a = """
        Viene conservata, in PNG e in WebP. Il JPEG un canale alfa non ce l'ha,
        quindi dietro tutta l'immagine viene dipinto un colore, che tu ne chieda
        uno o no: senza, tutto quello che è trasparente uscirebbe nero, cosa che
        sembra un difetto e invece è il JPEG. Anche scegliere un colore di sfondo
        con il PNG è una cosa perfettamente normale da volere, perché appiattisce
        il disegno su quel colore invece di lasciare un buco."""

[[faq]]
q = "Può leggere un SVG che contiene uno script o un'immagine esterna?"
a = """
        Può leggerlo, e disegnerà esattamente le parti che un browser è disposto a
        disegnare. Un SVG caricato attraverso un <code>&lt;img&gt;</code> si trova
        in <em>secure static mode</em>: gli script non girano, i riferimenti
        esterni non vengono recuperati, e l'animazione non parte, quindi quello
        che ottieni è il primo fotogramma. Un file che ha dentro un
        <code>&lt;image&gt;</code> remoto esce perciò con quella parte mancante. È
        il browser che si rifiuta per conto tuo, ed è il motivo per cui questa
        pagina può aprire senza rischi un file che non ha mai visto."""

[[faq]]
q = "Che differenza c'è tra questo e il ridimensionatore di immagini?"
a = """
        Il punto di partenza. Il ridimensionatore di immagini parte da pixel, un
        JPEG o un PNG, quindi per ingrandirli deve inventare dettaglio che non c'è
        mai stato. Questo parte da un disegno, quindi non c'è niente da inventare
        e nessun limite superiore di cui preoccuparsi. Se quello che hai è un SVG,
        è questo a darti un risultato nitido; se quello che hai è una fotografia,
        è l'altro."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di
        prova e non c'è filigrana. Non c'è nemmeno un limite al numero o alla
        dimensione dei file, perché non c'è nessun server che li paga: il lavoro
        lo fa il tuo dispositivo. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sui tuoi file."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via il tuo disegno per
        farlo rendere si fermerebbe nell'istante in cui stacchi la spina."""

