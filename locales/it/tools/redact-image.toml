[[privacy]]
title = "Le tue immagini non hanno dove andare."
body = """
 Nella
      Content-Security-Policy c'è ogni indirizzo che questa pagina può
      contattare, e nessuno è nostro. Qui non esiste un punto di raccolta dove i
      tuoi file possano finire, né nel codice c'è qualcosa che li spedirebbe se
      esistesse."""

[[privacy]]
title = "I pixel coperti spariscono qui, non lungo la strada."
body = """
 L'immagine viene
      decodificata in un buffer di pixel, i riquadri vengono scritti dentro quel
      buffer, e il buffer passa al codificatore. In questa pagina non esiste
      nessuna versione dell'immagine con i riquadri come livello separato, perché
      una versione simile non viene mai creata: vedi
      <code>src/redact.js</code>."""

[[privacy]]
title = "Qui non si scarica niente."
body = """
 Non c'è né
      <code>fetch</code>, né <code>XMLHttpRequest</code>, né
      <code>sendBeacon</code> da nessuna parte in <code>src/</code>. Il lavoro è
      <code>getImageData</code>, tre cicli sui byte e <code>canvas.toBlob</code>,
      tutta roba già installata nel tuo browser."""

[[privacy]]
title = "I riquadri non vengono segnalati da nessuna parte."
body = """
 Dove hai
      tracciato, quanti sono, quanto sono grandi e quale tipo hai scelto restano
      nella memoria di questa pagina finché non la chiudi. In questo repository
      non c'è nessun evento di analytics che porti via qualcosa di tutto ciò, e
      l'unica domanda che il sito fa dopo un download invia un pollice su o giù e
      il nome dello strumento, nient'altro."""

[[privacy]]
title = "Funziona offline."
body = """
 Scollegati dalla rete e lo strumento resta lo
      stesso, perché al suo interno non c'è mai stato un passaggio di rete. È la
      prova più semplice di tutte, ed è quella da fare prima di oscurare un
      passaporto."""

[[howto]]
title = "Scegli l'immagine."
body = """
 Uno screenshot, una scansione o una foto:
      qualsiasi cosa il tuo browser sappia aprire. Viene letta direttamente dal
      disco e intanto non esce niente da nessuna parte."""

[[howto]]
title = "Traccia un riquadro su ciò che nessuno deve vedere."
body = """
 E poi un altro
      per il successivo. Un riquadro si sposta trascinandolo, si ridimensiona
      dalle maniglie, oppure si raggiunge con Tab e si muove con le frecce. Quello
      che compare sotto il riquadro è il risultato vero, disegnato dallo stesso
      codice che scriverà il file."""

[[howto]]
title = "Scegli nero, pixelatura o sfocatura &mdash; e scegli il nero."
body = """
 Un
      riempimento nero non lascia proprio niente. Pixelare e sfocare sostituiscono
      i pixel con medie di sé stessi, il che basta per un volto sullo sfondo e non
      basta per niente che si legga come testo."""

[[howto]]
title = "Premi &laquo;Oscura e salva&raquo;, poi controlla il file."
body = """
 L'immagine che
      compare dopo è il file finito, decodificato di nuovo. Aprilo in un editor e
      cerca un livello, oppure prova a selezionare il testo coperto: c'è una sola
      immagine piatta, e le parti che hai coperto sono state sovrascritte prima
      che venisse scritta."""

[[faq]]
q = "La mia immagine viene caricata da qualche parte?"
a = """
        No. Il file viene decodificato, oscurato e ricodificato dal tuo browser sul
        tuo hardware. Questo strumento non ha alcuna funzione di rete, non scarica
        mai niente e non invia mai niente, e la
        <code>Content-Security-Policy</code> della pagina elenca ogni indirizzo che
        può contattare, nessuno dei quali è nostro. Carica la pagina una volta,
        scollegati da internet e continua a funzionare."""

[[faq]]
q = "La parte coperta sparisce davvero dal file?"
a = """
        Sì, ed è il motivo per cui questo strumento esiste. L'immagine viene
        decodificata in un buffer di pixel; i riquadri sovrascrivono i pixel al
        loro interno; il buffer viene poi codificato in un file nuovo. I valori
        originali sono usciti dalla memoria prima che il codificatore ricevesse
        qualcosa, quindi non c'è nessun livello da nascondere, nessuna annotazione
        da togliere e nessuna cronologia da annullare. Puoi verificarlo come
        verificheresti l'affermazione di chiunque altro: apri il risultato in un
        editor di immagini e cerca un secondo livello, oppure prova a selezionare
        il testo che hai coperto."""

[[faq]]
q = "Una zona pixelata o sfocata si può recuperare?"
a = """
        A volte, ed è l'unica cosa che vale la pena leggere prima di scegliere. Il
        riempimento nero sostituisce tutto quello che sta sotto con un colore
        pieno, quindi non sopravvive niente: né un bordo, né una media, né il
        numero di caratteri. La pixelatura sostituisce ogni blocco con la media di
        quel blocco, e una griglia di medie è pur sempre una misura di ciò che
        c'era sotto: per un testo in un carattere ordinario e di dimensione
        prevedibile, lavori pubblicati hanno ricostruito l'originale generando le
        stringhe candidate e confrontandone le medie. La sfocatura è una
        convoluzione, e le convoluzioni in linea di principio si invertono. Pixela
        pure un volto sullo sfondo, e copri di nero tutto ciò che si legge come
        testo."""

[[faq]]
q = "Perché un rettangolo nero disegnato in un programma per documenti non è la stessa cosa?"
a = """
        Perché la maggior parte dei programmi salva il rettangolo accanto
        all'immagine e non dentro. Una forma disegnata in un lettore di PDF, in una
        presentazione, in un elaboratore di testi o in un editor di immagini a
        livelli è un oggetto con una posizione, appoggiato sopra la pagina:
        spostarlo, cancellarlo o aprire il file in un altro programma rimette
        esattamente ciò che copriva. Giornali, tribunali e ministeri hanno
        pubblicato documenti oscurati così. Qui il rettangolo non viene salvato
        affatto: sono valori di pixel scritti sopra quelli che c'erano."""

[[faq]]
q = "Toglie anche i dati EXIF e GPS?"
a = """
        Sì, come effetto collaterale. Salvare significa codificare una tela piena
        di pixel, e una tela non porta con sé nessun tag: luogo, modello della
        fotocamera, date e miniatura incorporata semplicemente non vengono scritti
        nel file nuovo. La miniatura qui conta: è una piccola seconda copia
        dell'immagine, non viene sempre rigenerata quando una foto viene
        modificata, e una foto oscurata che viaggia con una miniatura non oscurata
        annulla tutto il lavoro. Se vuoi togliere i metadati senza che l'immagine
        venga ricodificata, il
        <a href="../rimuovere-dati-exif/">Visualizzatore e rimozione EXIF</a> riscrive il
        contenitore invece dell'immagine."""

[[faq]]
q = "Quali formati sa leggere e scrivere?"
a = """
        Legge tutto ciò che il tuo browser sa decodificare, in pratica JPEG, PNG,
        WebP, GIF, BMP e, sulla maggior parte dei browser attuali, AVIF. Scrive
        JPEG, PNG e WebP, perché sono i codificatori che i browser si portano
        dietro. Su &laquo;automatico&raquo; un JPEG torna JPEG e tutto il resto
        torna PNG, così una foto resta pesante come una foto e il testo rimasto in
        vista su uno screenshot resta nitido. La scelta non cambia nulla
        dell'oscuramento: i pixel sono già spariti quando il codificatore li
        vede."""

[[faq]]
q = "Posso farlo senza mouse?"
a = """
        Sì. &laquo;Aggiungi un riquadro al centro&raquo; ne mette uno
        sull'immagine, Tab passa da un riquadro all'altro, le frecce spostano
        quello selezionato e Alt con le frecce lo ridimensiona; Maiusc porta ogni
        passo a dieci pixel e Canc lo rimuove. Ogni riquadro ha inoltre, sotto
        l'immagine, una riga con la sua dimensione, la sua posizione, che cosa fa e
        un pulsante per toglierlo: l'intero strumento si usa da tastiera e si legge
        con uno screen reader."""

[[faq]]
q = "Funziona sul telefono?"
a = """
        Sì. Tracciare, spostare e ridimensionare passano da eventi puntatore e non
        da eventi del mouse, quindi un dito funziona allo stesso modo, e le
        maniglie vengono disegnate più grandi su uno schermo touch. L'immagine a
        schermo viene ridisegnata a dimensione schermo mentre lavori; il file viene
        sempre oscurato alla sua piena risoluzione quando premi il pulsante."""

[[faq]]
q = "È gratis, e serve un account?"
a = """
        È gratis, e non c'è account, né registrazione, né prova, né filigrana. Non
        c'è nemmeno un limite alla dimensione dell'immagine, perché non c'è nessun
        server a pagarla: il lavoro avviene sul tuo dispositivo. Il sito ha
        pubblicità, ed è quella a pagarlo; agli annunci non viene dato niente delle
        tue immagini."""

