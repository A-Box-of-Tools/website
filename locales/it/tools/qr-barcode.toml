[[privacy]]
title = "Quello che scrivi non ha dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui una password del Wi-Fi possa finire, e
      nel codice non c'è niente che ce la manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 In <code>src/</code> non
      c'è né un <code>fetch</code>, né un <code>XMLHttpRequest</code>, né un
      <code>sendBeacon</code>. Il codice viene costruito dalla stringa per via
      aritmetica e disegnato come SVG, su questa pagina, sul tuo dispositivo."""

[[privacy]]
title = "Il codice non punta a noi."
body = """
 Quello che scrivi è quello che il
      codice contiene. Parecchi generatori gratuiti ti restituiscono invece un
      codice che contiene un link al loro sito, che poi rimanda al tuo: così ogni
      scansione la contano loro, e il codice smette di funzionare il giorno in
      cui smettono di pagare il dominio o decidono che il piano gratuito è
      scaduto. Qui non si accorcia niente, non si rimanda da nessuna parte e non
      si traccia niente, e la stringa mostrata sulla pagina è la stringa che sta
      dentro la figura."""

[[privacy]]
title = "Il PNG è fatto a partire dall'SVG che hai sullo schermo."
body = """
 Il
      download non è una seconda resa che potrebbe non concordare con
      l'anteprima: lo stesso markup viene consegnato al browser e dipinto su un
      canvas. È anche il motivo per cui si può fare senza contattare niente,
      perché non c'è nessun carattere tipografico da recuperare e nessuna
      immagine da caricare lì dentro."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google, il pulsante delle
      donazioni da Buy Me a Coffee. A nessuno di loro viene passato niente di
      quello che scrivi. Ogni riga che trasforma una stringa in un codice è
      servita da questa origine ed è elencata nel repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta
      identico, perché al suo interno non c'è mai stato un passaggio di rete. È
      la prova più semplice che ci sia."""

[[howto]]
title = "Scegli il tipo di codice."
body = """
 Un QR code contiene qualunque cosa
      ed è quello che la fotocamera di un telefono va a cercare, quindi è la
      risposta giusta a meno che qualcuno non ti abbia detto altro. Un codice a
      barre contiene un numero, e quale ti serve lo decide chi dovrà
      scansionarlo: un negozio vuole un EAN-13 o un UPC-A, un cartone da
      spedizione un ITF-14, e qualunque cosa a uso interno di solito è Code
      128."""

[[howto]]
title = "Di' cosa ci va dentro."
body = """
 Un link è il caso comune, e i campi
      qui sopra costruiscono gli altri formati che i telefoni conoscono: una rete
      Wi-Fi che si propone di collegarsi da sola, un biglietto da visita che si
      propone di essere salvato, una mail, un SMS, un numero di telefono, un
      punto su una mappa. Qualunque cosa tu scelga, la stringa finita viene
      mostrata sulla pagina, ed è tutto quello che un QR code contiene."""

[[howto]]
title = "Scegli quanti danni può sopportare."
body = """
 I quattro livelli mettono dentro
      più o meno correzione d'errore, e più correzione vuol dire un codice più
      grande e più fitto. L basta per uno schermo, M per la carta comune, e H per
      qualcosa che verrà maneggiato, stampato piccolo o attaccato a una vetrina
      al sole. Un codice su un menu che viene pulito tutti i giorni vale un Q o
      un H."""

[[howto]]
title = "Imposta la dimensione, il margine e i colori."
body = """
 Il margine è parte del codice:
      quattro moduli di spazio libero attorno sono quelli che chiede la
      specifica, e tagliarlo è di gran lunga il motivo più comune per cui un
      codice stampato non si legge. Scuro su chiaro, con un contrasto vero: uno
      scanner legge la differenza tra i due, quindi il grigino su bianco non va
      bene, e il chiaro su scuro su parecchi lettori fallisce del tutto."""

[[howto]]
title = "Provalo con il telefono che hai."
body = """
 Prima di stamparne mille,
      scansiona quello che hai sullo schermo. Ci vogliono dieci secondi e prende
      tutta quella categoria di errori che un'anteprima non può prendere: una
      password del Wi-Fi con un carattere che andava protetto, un link a cui
      mancava l'<code>https://</code>, un numero di codice a barre a cui manca
      una cifra."""

[[howto]]
title = "Prendi l'SVG."
body = """
 È il codice scritto come istruzioni
      invece che come pixel, quindi si stampa a qualunque dimensione senza
      diventare morbido, e un bordo morbido è esattamente quello che uno scanner
      non riesce a risolvere. Prendi anche il PNG se la cosa in cui stai
      incollando un SVG non lo accetta: è disegnato a un numero intero di pixel
      per modulo, quindi nemmeno lui ha bordi sfocati."""

[[faq]]
q = "Quello che scrivo viene mandato da qualche parte?"
a = """
        No. Un QR code è aritmetica su una stringa, e quell'aritmetica gira nel
        tuo browser sul tuo dispositivo. Questo strumento non ha nessuna funzione
        di rete: non recupera mai niente e non spedisce mai niente. La
        <code>Content-Security-Policy</code> della pagina elenca poi tutti gli
        indirizzi che può contattare, e nessuno di quelli appartiene a questo
        sito. Qui la cosa conta più che su quasi tutte le altre pagine, perché
        quello che si mette più spesso in un QR code è la password del proprio
        Wi-Fi."""

[[faq]]
q = "Questi codici scadono, o smettono di funzionare?"
a = """
        No, e non possono. Quello che scrivi è quello che il codice contiene,
        quindi scansionarlo restituisce esattamente quella stringa per sempre. I
        codici che scadono sono quelli che hanno dentro l'indirizzo di qualcun
        altro: un QR code «dinamico» contiene un link al server del generatore,
        che rimanda al tuo, e questo vuol dire che loro possono contare ogni
        scansione, cambiare dove porta, o spegnerlo quando finisce una prova. Qui
        non si passa attraverso niente."""

[[faq]]
q = "È gratis, e posso usarlo per lavoro?"
a = """
        È gratis, non c'è account, non c'è filigrana e non c'è limite a quanti ne
        fai, e il risultato lo puoi mettere su un prodotto, un manifesto o una
        vetrina. QR Code è un marchio registrato di Denso Wave, che ha dichiarato
        che non lo farà valere contro chi usa i codici, e la specifica è
        pubblicata come ISO/IEC 18004 ed è libera da implementare, che è poi
        quello che fa questa pagina. Il sito ha della pubblicità, ed è quella che
        lo mantiene."""

[[faq]]
q = "Quale livello di correzione d'errore devo scegliere?"
a = """
        M, a meno che tu non abbia un motivo. L fa il codice più piccolo e va
        benissimo su uno schermo; M sopravvive a un uso normale; Q e H sono per
        un codice che verrà stampato piccolo, plastificato, attaccato a una
        vetrina o coperto in parte da un logo. Ogni scalino in su mette dentro più
        dati di controllo, e a parità di testo questo richiede un simbolo più
        grande: passare da L a H all'incirca raddoppia il numero di moduli per la
        stessa stringa."""

[[faq]]
q = "Quanto può contenere un QR code?"
a = """
        Alla dimensione massima, 177 moduli per lato, ci stanno fino a 7.089
        cifre, 4.296 tra lettere maiuscole e cifre, o 2.953 byte di qualunque
        altra cosa, e questo con la correzione d'errore più debole; con la più
        forte è circa un terzo. In pratica però il limite non è il formato ma lo
        scanner: oltre qualche centinaio di caratteri i moduli diventano così
        piccoli che la fotocamera di un telefono comune non li risolve a distanza
        di braccio. Un codice lungo di solito è il segno che al suo posto ci
        vorrebbe un link corto."""

[[faq]]
q = "Perché il mio codice è più grande se scrivo il link in minuscolo?"
a = """
        Perché un QR code ha una modalità per maiuscole e cifre che impacchetta
        due caratteri in undici bit, e una modalità del genere per il minuscolo
        non ce l'ha, quindi lì ogni carattere costa otto bit. Un URL scritto
        <code>HTTPS://ESEMPIO.IT/PAGINA</code> può essere un terzo più piccolo
        dello stesso URL in minuscolo. Lo schema e l'host non distinguono
        maiuscole e minuscole, quindi urlarli non cambia niente tranne la
        dimensione; il percorso dopo l'host invece le distingue, quindi quello
        lascialo stare."""

[[faq]]
q = "Sa anche leggere un QR code, oltre a farlo?"
a = """
        Non questa pagina, ma quella accanto sì:
        <a href="../leggere-qr-code/">il lettore</a> prende una foto, uno
        screenshot o la tua fotocamera e ti restituisce la stringa. È un lavoro
        parecchio più grosso che disegnarne uno &mdash; trovare il simbolo
        dentro un'immagine, correggere l'angolo da cui è stata scattata e
        riparare i danni sono tre problemi che questa pagina non ha &mdash;, ed
        è per questo che è uno strumento a sé e non un bottone qui. Funziona
        alle stesse condizioni di tutto il resto: niente caricato, e nessun
        fotogramma della fotocamera conservato."""

[[faq]]
q = "A cosa serve il margine, e posso ridurlo?"
a = """
        Lo spazio bianco attorno a un QR code è parte del codice. Un lettore lo
        usa per capire dove finisce il simbolo, e la specifica chiede quattro
        moduli su ogni lato; un codice a barre ne vuole una decina. Qui puoi
        metterlo a zero, e la figura verrà più ordinata mentre parecchi scanner
        non la vedranno affatto, soprattutto su uno sfondo movimentato. Se il
        problema è lo spazio, rimpicciolisci il codice invece di tagliargli il
        margine."""

[[faq]]
q = "Quale codice a barre mi serve?"
a = """
        Quello che chiede chi lo scansiona. L'EAN-13 è il codice a barre da
        negozio fuori dal Nord America e l'UPC-A è quello nordamericano, e tutti
        e due hanno bisogno di un numero assegnato a te da GS1, perché il numero
        identifica la tua azienda e non solo il prodotto. L'EAN-8 è la versione
        corta per le confezioni piccole. L'ITF-14 va sul cartone da spedizione.
        Code 128 e Code 39 contengono testo oltre alle cifre e non hanno bisogno
        di nessuna registrazione, il che li rende la risposta giusta per qualunque
        cosa a uso interno: beni, scaffali, schede di lavoro."""

[[faq]]
q = "Cos'è una cifra di controllo, e perché lo strumento ne ha aggiunta una?"
a = """
        È l'ultima cifra di un codice a barre da negozio, calcolata a partire da
        quelle che la precedono, così che uno scanner possa distinguere una
        lettura sbagliata da una buona. L'EAN-13 vuole dodici cifre e calcola la
        tredicesima; l'UPC-A ne vuole undici e calcola la dodicesima. Se scrivi il
        numero corto, questa pagina te la aggiunge. Se scrivi il numero intero,
        controlla quella che hai dato, e se non torna rifiuta invece di
        correggerla in silenzio, perché una cifra sbagliata sistemata di nascosto
        è un'etichetta che si legge come il prodotto di qualcun altro."""

[[faq]]
q = "Posso mettere un logo in mezzo a un QR code?"
a = """
        Non qui, ma il motivo per cui altrove funziona vale la pena saperlo: a
        renderlo possibile è la correzione d'errore. Al livello H si può
        distruggere all'incirca il 30% dei moduli e il codice si legge lo stesso,
        quindi un logo che ne copre parecchi di meno al centro, dove non c'è
        nessun pattern di ricerca, è un danno riparabile. Passa il codice nel tuo
        programma di grafica al livello H, tieni il logo sotto un quinto circa
        dell'area, e provalo con un telefono vero invece di fidarti."""

[[faq]]
q = "Perché l'SVG è meglio del PNG?"
a = """
        Perché un codice sono bordi, e un PNG ha un numero fisso di pixel con cui
        farli. Ingrandiscine uno e ogni bordo si ammorbidisce; un bordo morbido è
        esattamente quello con cui uno scanner fa fatica, e a una stampante da
        1200 dpi a cui dai un PNG da 512 pixel stai chiedendo di inventarsi la
        differenza. Un SVG sono i quadrati scritti come istruzioni, quindi stampa
        nitido su un biglietto da visita come su un cartellone. Il PNG di qui è
        disegnato a un numero intero di pixel per modulo, che è il meglio che un
        PNG possa fare."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via il tuo testo per
        farne disegnare un codice si fermerebbe nell'istante in cui stacchi la
        spina."""

