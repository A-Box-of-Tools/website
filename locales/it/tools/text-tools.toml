[[howto]]
title = "Prenditi il risultato."
body = """
 Copialo, oppure scaricalo come file. Un
      confronto si scarica come <code>.patch</code> in formato unificato, che è quello
      che si aspettano una revisione del codice, <code>git apply</code> e qualsiasi
      visualizzatore di differenze."""

[[faq]]
q = "Il mio testo viene caricato da qualche parte?"
a = """
        No. Ogni parser, codificatore e confronto di questa pagina è una funzione che
        gira nel tuo browser, sul tuo hardware. Questo strumento non ha nessuna funzione
        di rete: non scarica mai niente e non manda mai niente, e la
        <code>Content-Security-Policy</code> della pagina elenca ogni indirizzo che può
        contattare, nessuno dei quali appartiene a questo sito. È questo il motivo per
        usarlo con un token di accesso, un cookie di sessione o i dati di un cliente:
        incollare una di queste cose nel formattatore di qualcun altro vuol dire
        gliela stai dando."""

[[faq]]
q = "Formattare JSON cambia qualcosa oltre alla disposizione?"
a = """
        No, ed è più difficile di quanto sembri. Le chiavi mantengono l'ordine in cui le
        hai scritte: un formattatore costruito su <code>JSON.parse</code> sposta in
        silenzio in cima le chiavi che sembrano interi, quindi
        <code>{"10":a,"2":b}</code> torna indietro come <code>{"2":b,"10":a}</code>. I
        numeri mantengono le cifre che hai digitato, quindi un id di venti cifre non
        perde le ultime tre per colpa di un double e <code>1e999</code> non diventa
        <code>null</code>. Le chiavi doppie restano entrambe, perché lo standard non dice
        quale vince e buttarne una vorrebbe dire scegliere al posto tuo."""

[[faq]]
q = "Quali linguaggi sa formattare?"
a = """
        JSON, XML, HTML, CSS e YAML. JSON, XML, HTML e CSS si possono anche comprimere;
        YAML no, perché la sua forma breve è lo stile in flusso, che è illeggibile, e
        illeggibile è l'opposto del motivo per cui si tiene un file in YAML. JavaScript
        di proposito non è nell'elenco: vedi la domanda più sotto."""

[[faq]]
q = "Perché non formatta JavaScript, Python o SQL?"
a = """
        Perché mettere in ordine un linguaggio di programmazione vuol dire analizzarlo
        per bene, e un formattatore che ci va quasi è peggio di nessun formattatore:
        produce codice che sembra a posto e fa un'altra cosa. JSON, XML, CSS e YAML
        hanno grammatiche abbastanza piccole da essere lette a mano e verificate con
        test che puoi eseguire. Un formattatore JavaScript è Prettier, che è un megabyte
        di parser, e il suo posto è nel tuo editor, non su una pagina web."""

[[faq]]
q = "Cosa fa davvero il confronto?"
a = """
        Trova l'insieme più corto di modifiche che trasforma il testo di sinistra in
        quello di destra, con l'algoritmo di Myers, lo stesso che usa
        <code>git diff</code>. È il fatto che sia il più corto a rendere leggibile un
        confronto: una riga inserita in mezzo dovrebbe comparire come un inserimento e
        non come se fossero cambiate tutte le righe successive. Dentro una riga
        modificata vengono segnate anche le parole che differiscono, quindi il confronto
        di due paragrafi mostra la parola che si è spostata e non due paragrafi
        interi."""

[[faq]]
q = "Può confrontare due file invece di due incollate?"
a = """
        Sì. Trascinali entrambi sul selettore con la scheda Confronta aperta e finiscono
        uno per parte, nell'ordine in cui li hai lasciati. Li legge il tuo browser
        dentro questa pagina, che è l'unico posto in cui vanno. Scambia i lati se li hai
        messi al contrario."""

[[faq]]
q = "Cosa esce da un confronto, e posso applicarlo?"
a = """
        Il download è un diff unificato, cioè il formato
        <code>@@ -3,5 +3,5 @@</code> che leggono <code>git apply</code>,
        <code>patch</code> e qualsiasi strumento di revisione del codice. Copiare fa la
        stessa cosa negli appunti. Quello che vedi a schermo ne è una vista: affiancata,
        oppure su una colonna, con le parti immutate ridotte a un conteggio a meno che
        non le chieda tutte."""

[[faq]]
q = "Il Base64 qui è lo stesso Base64 di tutti gli altri?"
a = """
        Sì: viene verificato contro i vettori di test dell'RFC 4648 e non contro sé
        stesso. Si decodificano entrambi gli alfabeti, quindi un JWT scritto con
        <code>-</code> e <code>_</code> si legge bene quanto uno scritto con
        <code>+</code> e <code>/</code>, e un input spezzato a 64 caratteri viene
        ricongiunto per te. La codifica passa dai byte UTF-8, quindi una lettera
        accentata o un'emoji sopravvive al giro di andata e ritorno."""

[[faq]]
q = "Il mio YAML dice no e il JSON è uscito come stringa. Perché?"
a = """
        Perché è una stringa, e qui si legge YAML 1.2 e non 1.1. In YAML 1.1,
        <code>yes</code>, <code>no</code>, <code>on</code> e <code>off</code> erano
        booleani, ed è il famoso baco che trasforma il codice del paese della Norvegia
        in <code>false</code>. YAML 1.2 l'ha tolto, e lo toglie anche questo: solo
        <code>true</code>, <code>false</code>, <code>null</code> e <code>~</code>
        vengono letti come qualcosa di diverso dal testo. Nell'altro verso, quelle
        parole vengono riscritte <em>tra virgolette</em>, anche se questo strumento le
        leggerebbe come testo pure senza, perché quello che aprirà il file dopo magari
        no. PyYAML usa ancora 1.1 come impostazione predefinita. Leggere in modo severo
        e scrivere in modo prudente è l'unica combinazione giusta in entrambi i
        versi."""

[[faq]]
q = "Cosa si perde convertendo YAML in JSON?"
a = """
        I commenti, perché JSON non ha dove metterli. Ancore, alias e tag vengono
        rifiutati del tutto invece che indovinati: ognuno di loro dice qualcosa che JSON
        non sa dire, e un convertitore che scegliesse in silenzio un'interpretazione ti
        consegnerebbe un documento che non è quello che diceva il file. Nell'altro verso
        non si perde niente: ogni documento JSON è già un documento YAML."""

[[faq]]
q = "Cosa si perde convertendo JSON in XML?"
a = """
        La differenza tra un oggetto vuoto, un array vuoto e una stringa vuota, che
        diventano tutti un elemento vuoto, e il tipo di ogni valore, perché XML non ha
        tipi: ed è per questo che la conversione inversa lascia tutto come stringa
        invece di decidere che <code>8080</code> fosse un numero. Un array diventa un
        elemento ripetuto, che è l'unica forma che si rilegge, e a una chiave che un
        nome di elemento non può contenere vengono sostituiti i caratteri scomodi,
        invece di produrre un documento che nessun parser leggerà."""

[[faq]]
q = "Rifare i rientri dell'HTML cambia l'aspetto della pagina?"
a = """
        Può cambiarlo, e qui lo si dice onestamente. Lo spazio tra due elementi inline è
        uno spazio tra due parole, quindi spostarlo non è gratis. Due cose tengono la
        cosa a bada: <code>&lt;pre&gt;</code> e <code>&lt;textarea&gt;</code> vengono
        copiati esattamente com'erano, e un elemento che contiene solo testo resta su
        una riga. Tutto il resto viene messo in ordine."""

[[faq]]
q = "Quanto può essere grande il file?"
a = """
        Qui non c'è nessun limite impostato, perché non c'è nessun server che lo paghi.
        Il tetto vero è il tuo dispositivo: qualche megabyte di JSON va benissimo. Il
        confronto di due testi che non hanno assolutamente niente in comune si ferma
        presto e lo dice, invece di passare un minuto a dimostrare l'ovvio; e un
        confronto molto lungo disegna le prime migliaia di righe e lascia il resto alla
        patch scaricata."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di prova e
        non c'è limite a quanto incolli. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sul tuo testo."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene caricato
        niente, perché uno strumento che spedisse via il tuo testo per formattarlo si
        fermerebbe nell'istante in cui stacchi la spina."""

