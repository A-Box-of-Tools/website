[[privacy]]
title = "Quello che incolli non ha una strada per uscire."
body = """
 Nella
      Content-Security-Policy c'è ogni indirizzo che questa pagina può contattare, e
      non ne appartiene uno a questo sito. Qui non esiste un recapito dove un token
      incollato possa essere raccolto, e nel codice non c'è niente che lo manderebbe lì
      se esistesse."""

[[privacy]]
title = "Qui niente va a prendere niente."
body = """
 In <code>src/</code> non c'è da nessuna
      parte un <code>fetch</code>, un <code>XMLHttpRequest</code> o un
      <code>sendBeacon</code>. Ogni parser, ogni codificatore e il confronto sono
      funzioni di questa pagina che prendono una stringa e restituiscono una
      stringa."""

[[privacy]]
title = "I formattatori tengono quello che gli è stato dato."
body = """
 Un oggetto JSON torna
      indietro con le chiavi nell'ordine in cui le hai scritte e i numeri scritti come
      li hai scritti tu, perché <code>src/json.js</code> è un parser e non una chiamata
      a <code>JSON.parse</code>, che riordina le chiavi che sembrano interi e trasforma
      un id di venti cifre nel double più vicino. I test in
      <code>tests/js/text-format.test.js</code> controllano esattamente questo."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della pubblicità e
      della misurazione arrivano da Google, il pulsante delle donazioni da Buy Me a
      Coffee. A nessuno di loro arriva un carattere del tuo testo. Ogni riga che lo
      legge, lo analizza o lo scrive è servita da questa origine ed è elencata nel
      repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta identico,
      perché al suo interno non c'è mai stato un passaggio di rete. È la prova più
      semplice che ci sia."""

[[howto]]
