pledge = """
    Un grafico delle altezze è aritmetica e un disegno: non c'è nessun file da
    mandare e nessun servizio da interrogare. L'uomo, la donna, il bambino e la
    bambina sono illustrazioni di pubblico dominio che viaggiano con questa
    pagina; il bimbo piccolo viene costruito qui a partire da una tabella di
    proporzioni corporee, ed è per questo che ha la forma di un bimbo piccolo e
    non di un adulto rimpicciolito. Ogni passaggio avviene in circa seicento
