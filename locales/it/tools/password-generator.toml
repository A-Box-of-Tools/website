[[privacy]]
title = "La password nasce dove stai leggendo."
body = """
 La estrae questa
      pagina, dentro questa pagina, dal caso che il tuo sistema operativo
      consegna al browser. Per produrla non viene chiesto niente e, una volta che
      esiste, non viene segnalato niente. Nella
      <code>Content-Security-Policy</code> ci sono tutti gli indirizzi che questa
      pagina può contattare e nessuno è nostro: qui non c'è un punto di raccolta
      dove una password generata possa finire, né qualcosa nel codice che ce la
      manderebbe se ci fosse."""

[[privacy]]
title = "Qui non c'è niente che scarichi niente."
body = """
 In tutto
      <code>src/</code> non c'è un <code>fetch</code>, né un
      <code>XMLHttpRequest</code>, né un <code>sendBeacon</code>. L'elenco di
      parole non viene scaricato: è <code>src/wordlist.js</code>, servito da
      questa stessa origine insieme al resto della pagina, e puoi leggerlo."""

[[privacy]]
title = "Il caso è quello del browser, ed è quello giusto."
body = """
 <code>crypto.getRandomValues</code>
      è il generatore che i browser mettono a disposizione per chiavi e token,
      alimentato e rialimentato dal sistema operativo.
      <code>Math.random</code> non compare da nessuna parte in questa cartella, e
      sarebbe un difetto vero se ci fosse: il suo stato interno si ricostruisce da
      una manciata di uscite, il che rende calcolabile ogni password che
      produrrà a chiunque ne abbia vista una."""

[[privacy]]
title = "Non viene salvato niente, quindi non c'è cronologia da cancellare."
body = """
 Niente localStorage, niente
      sessionStorage, nessun cookie, nessun parametro nell'indirizzo e nessun
      <code>&lt;input&gt;</code> che il browser si offra di ricordare. Quello che
      è sullo schermo vive in un solo array nella memoria di questa pagina, e
      chiudere la scheda è tutta la pulizia che serve. Le uniche copie di quello
      che nasce qui sono quelle che porti via tu."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli viene dato."
body = """
 Gli script pubblicitari e di
      misurazione sono di Google, e il pulsante per le donazioni è di Buy Me a
      Coffee. A nessuno di loro viene passato un carattere di quello che questa
      pagina genera, né la lunghezza, né la forza, né con quali impostazioni è
      uscito. Ogni riga che estrae un carattere o una parola è servita da questa
      origine ed è nel repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta lo
      stesso, perché al suo interno non c'è mai stato un passaggio in rete. È la
      prova più semplice di tutte: un generatore che chiedesse il caso a un
      server si fermerebbe nel momento in cui stacchi la spina."""

[[howto]]
title = "Scegli password o passphrase."
body = """
 Una password è una sequenza di caratteri
      casuali: corta da conservare, scomoda da digitare, ed esattamente quello
      che serve per le centinaia di account che il gestore di password compila al
      posto tuo. Una passphrase sono parole estratte a caso da un elenco: più
      lunga, ma ricordabile e pronunciabile, che è quello che ti serve per i pochi
      segreti che devi digitare a memoria, cioè quello del gestore stesso, quello
      del portatile, il codice di recupero del telefono."""

[[howto]]
title = "Imposta la lunghezza, o il numero di parole."
body = """
 È questa l'impostazione che conta, e
      le altre in gran parte no. Venti caratteri, o sei parole, sono un minimo
      ragionevole per qualunque cosa valga la pena proteggere; sali per l'account
      che permetterebbe di reimpostare tutti gli altri. La lettura qui sotto si
      muove mentre trascini, così vedi cosa ti porta ogni carattere in più."""

[[howto]]
title = "Attiva le regole su cui il modulo insisterà."
body = """
 &laquo;Almeno uno per
      insieme&raquo;, una cifra alla fine, un simbolo preso dall'elenco breve che
      accettano tutti i siti. Nessuna di queste cose rende niente più forte, e la
      prima lo indebolisce un po', cosa che la pagina ha già sottratto. Ma sono il
      modo di superare un modulo di registrazione senza generarne sei di
      fila."""

[[howto]]
title = "Leggi il numero, non il colore."
body = """
 I bit sono contati a partire dalle
      impostazioni che hanno prodotto la stringa: la dimensione dell'alfabeto, il
      numero di estrazioni, e nient'altro. È una misura vera, a differenza
      dell'indicatore su una pagina di registrazione, che può solo dare un
      punteggio ai caratteri che ha davanti e non ha modo di sapere se li hai
      scelti tu o un generatore."""

[[howto]]
title = "Copiala e mettila da qualche parte prima di andartene."
body = """
 Qui non c'è cronologia e non c'è
      modo di richiederla; ricaricare la pagina la distrugge. Incollala prima nel
      gestore di password e poi nel modulo di registrazione, così chi deve
      ricordarsela ce l'ha già prima che qualcosa possa andare storto."""

[[howto]]
title = "Prendine un blocco se ti serve."
body = """
 Il cursore in fondo ne genera fino a
      cento in una volta e le salva come file di testo semplice, scritto da questa
      pagina a partire da quello che è già sul tuo schermo. Utile per aprire
      account in serie o distribuire credenziali iniziali, e da cancellare appena
      sono in un posto migliore: un file pieno di password sul disco resta un file
      pieno di password."""

[[faq]]
q = "Le password vengono spedite da qualche parte o salvate?"
a = """
        Né l'una né l'altra cosa. Nascono nel tuo browser, sul tuo hardware, e
        questo strumento non ha nessuna funzione di rete: non scarica mai niente
        e non spedisce mai niente. E non scrive niente nemmeno
        nell'archiviazione: niente localStorage, nessun cookie, nessuna
        cronologia. Ricarica la pagina e tutte le password che ti ha mostrato
        sono sparite, dallo schermo e dalla sua stessa memoria. La
        <code>Content-Security-Policy</code> della pagina elenca ogni indirizzo
        che può contattare e nessuno è nostro, quindi non c'è un posto dove una
        password possa essere raccolta nemmeno se qualcosa ci provasse."""

[[faq]]
q = "Da dove viene il caso?"
a = """
        Da <code>crypto.getRandomValues</code>, il generatore che i browser
        offrono per uso crittografico, alimentato e rialimentato dalla riserva di
        entropia del tuo sistema operativo. È la stessa fonte da cui il browser
        prende il materiale delle chiavi TLS. <code>Math.random</code> non è usato
        da nessuna parte in questo strumento, e la distinzione non è pignoleria:
        <code>Math.random</code> è un generatore aritmetico veloce il cui stato
        interno completo si ricostruisce da poche uscite consecutive, per cui un
        generatore di password costruito su di lui produce password che sembrano
        casuali e che chiunque ne abbia vista una può enumerare tutte."""

[[faq]]
q = "Una password generata in un browser vale quanto una di un programma installato?"
a = """
        Per quanto riguarda il caso, sì: è la stessa fonte del sistema operativo
        in entrambi i casi, raggiunta da una porta diversa. Cambia cos'altro c'è
        nella stanza. Una scheda del browser convive con le tue estensioni, e
        un'estensione autorizzata a leggere le pagine può leggere anche questa.
        Vale per qualunque generatore sul web, questo compreso, ed è il motivo
        onesto per usare il generatore integrato del tuo gestore di password
        quando ce l'hai: è la stessa aritmetica, in un processo con meno roba
        intorno. Questa pagina è per quando non ce l'hai sottomano."""

[[faq]]
q = "Password o passphrase, cosa conviene usare?"
a = """
        Una password per tutto quello che digita un gestore al posto tuo, perché
        non la guarderai mai e la lunghezza lì non costa niente. Una passphrase
        per le poche cose che devi digitare a memoria o dettare a voce: la
        password principale del gestore, la chiave di cifratura del disco, un
        apparecchio che configuri da lontano. Sei parole dell'elenco lungo sono
        77 bit, più di una password casuale di dodici caratteri e infinitamente
        più facili da azzeccare alle quattro del mattino."""

[[faq]]
q = "Quanto dovrebbe essere lunga una password?"
a = """
        Venti caratteri sull'alfabeto completo sono circa 130 bit, ben oltre il
        punto in cui la lunghezza smette di essere il problema. Sedici va
        benissimo. Dodici è il minimo per qualunque cosa ti dispiacerebbe
        perdere, ed è il minimo, non l'obiettivo. Sotto quella soglia stai
        scommettendo che il sito l'abbia salvata come si deve, scommessa che
        vent'anni di comunicazioni di violazione sconsigliano. La lunghezza batte
        ogni altra impostazione di questa pagina: un carattere in più porta più di
        qualsiasi regola su quali caratteri devono comparire."""

[[faq]]
q = "Di quante parole dovrebbe essere una passphrase?"
a = """
        Sei dall'elenco lungo, e sette se protegge altre password. La famosa
        immagine da quattro parole è del 2011, vale 51 bit ed è oggi alla portata
        di un attacco offline serio. Cinque sono 64. Sei sono 77, oltre quello che
        un attaccante spenderà mai per un account qualsiasi. Ogni parola in più
        dall'elenco lungo aggiunge 12,9 bit, e le parole sono l'unica cosa che
        aggiunge qualcosa: né i trattini né le maiuscole."""

[[faq]]
q = "Cos'è un &laquo;bit&raquo;, e perché questa pagina li conta?"
a = """
        Un bit è un raddoppio. Sessanta bit vuol dire che c'erano 2^60 risultati
        ugualmente probabili che questa pagina avrebbe potuto produrre, quindi chi
        sa esattamente come funziona ne ha comunque altrettanti da provare. È una
        proprietà del <em>procedimento</em>, non della stringa: la pagina può
        darlo esatto perché è lei che ha scelto e sa quante scelte ha fatto. È
        tutta qui la differenza rispetto alla barra colorata di un modulo di
        registrazione, che legge i caratteri e tira a indovinare. Su quella barra
        <code>correct horse battery staple</code> prende un brutto punteggio e
        vale 44 bit, mentre <code>P@ssw0rd!</code> ne prende uno buono e non vale
        quasi niente."""

[[faq]]
q = "Perché &laquo;deve contenere un simbolo&raquo; indebolisce una password?"
a = """
        Perché una regola può solo togliere possibilità. Pretendere almeno un
        carattere per ogni insieme scarta tutte le password a cui non ne era
        capitato nessuno, e un insieme più piccolo di password possibili è un
        insieme più piccolo da percorrere. L'effetto è piccolo, circa mezzo bit a
        una lunghezza normale, ed è reale, e questa pagina lo sottrae invece di
        dare la cifra che le fa comodo. È calcolato esatto contando le password
        che la regola permette davvero, e non quelle che scarta."""

[[faq]]
q = "Che elenco di parole è, e cambia qualcosa che un attaccante possa scaricarlo?"
a = """
        Sono gli elenchi diceware della Electronic Frontier Foundation, inclusi
        senza modifiche: 7.776 parole quello lungo e 1.296 quello breve. Sono
        stati costruiti esattamente per questo: niente di offensivo, nessun
        omofono, nessuna coppia che unita formi una terza parola, e nell'elenco
        breve nessuna parola che sia l'inizio di un'altra. E no, non cambia niente
        che l'elenco sia pubblico: la forza indicata qui dà per scontato che
        l'attaccante ce l'abbia, che stia leggendo il codice di questa pagina e
        che conosca tutte le impostazioni che hai usato. L'unica cosa che non sa è
        quale delle 7.776 è uscita ogni volta. È proprio questa premessa a rendere
        affidabile il numero."""

[[faq]]
q = "Una passphrase non è un attacco a dizionario che aspetta di succedere?"
a = """
        Non quando le parole si scelgono così. Un attacco a dizionario funziona
        contro le frasi che sceglie una <em>persona</em>, perché le persone
        scelgono parole che stanno bene insieme, in un ordine che ha senso, fra le
        poche migliaia che usano ogni giorno. Questa pagina sceglie ogni parola in
        modo indipendente e uniforme da un elenco fisso, senza curarsi di come
        suona il risultato, ed è per questo che di solito suona male. Un
        attaccante che conosca l'elenco e il numero di parole si trova comunque
        davanti 7.776 elevato a quel numero."""

[[faq]]
q = "Posso recuperare una password dopo aver lasciato la pagina?"
a = """
        No, ed è voluto. Non viene annotato niente da nessuna parte, quindi non
        c'è niente da recuperare: nessun pannello della cronologia, nessun elenco
        delle &laquo;generate di recente&raquo;, nessuna cache. Un generatore in
        grado di mostrarti la password di martedì scorso sarebbe un generatore che
        l'ha salvata, e salvata dove ci arrivi tu vuol dire salvata dove ci arriva
        anche altro. Copiala in un gestore di password prima di andare via."""

[[faq]]
q = "È sicuro copiarla negli appunti?"
a = """
        È il rischio di sempre, e conviene conoscerlo più che preoccuparsene. Gli
        appunti sono condivisi con tutto quello che gira con la tua utenza, di
        solito sopravvivono fino alla copia successiva, e su certe configurazioni
        si sincronizzano fra dispositivi. Sono ottimi motivi per incollarla subito
        dove va e copiare qualcos'altro dopo, e non sono un motivo per digitare a
        mano una password più debole. Questa pagina non può leggere i tuoi
        appunti: può solo scriverci, e solo quando premi il pulsante."""

[[faq]]
q = "Posso usare la stessa in più posti?"
a = """
        No, ed è l'unico consiglio di questa pagina che conta più di tutti gli
        altri. Quasi ogni account che viene preso, viene preso con una password
        che prima era giusta da un'altra parte: un sito viene violato, l'elenco
        viene pubblicato, e lo stesso indirizzo con la stessa password viene
        provato ovunque. Una password diversa per ogni sito trasforma una
        violazione in un account solo invece che in tutti, ed è questo il motivo
        per tenere un gestore di password, non la forza di una singola password
        che ci sta dentro."""

[[faq]]
q = "È gratis, e serve un account?"
a = """
        È gratis, non c'è account, non c'è accesso, non c'è prova e non c'è limite
        a quante ne generi. Il sito porta pubblicità, ed è quella a pagarlo; agli
        annunci non viene passato assolutamente niente di quello che questa pagina
        genera, nemmeno quanto era lunga o quanto era forte."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi staccati da internet e continua a
        generare password. Il caso viene dal tuo apparecchio e l'elenco di parole
        è già nella pagina. È anche il modo più semplice di dimostrare che non
        viene scaricato né spedito niente: un generatore che chiedesse i numeri a
        un server si fermerebbe nel momento in cui stacchi la spina."""

[schema]
