[[privacy]]
title = "I tuoi video non hanno dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui il tuo file possa finire, e nel codice
      non c'è niente che ce lo manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 Questo strumento non ha
      proprio nessuna funzione di rete: nessun indirizzo da incollare, niente da
      scaricare, nessun motore che si scarichi al primo utilizzo. Ogni byte che
      tocca il tuo video è arrivato da questa origine nel momento in cui si è
      caricata la pagina."""

[[privacy]]
title = "La decodifica e la codifica avvengono in locale."
body = """
 I fotogrammi passano
      per WebCodecs dentro il tuo browser, oppure per lo stesso motore di
      riproduzione che ti mostrerebbe la clip comunque. Il file finito viene
      costruito in memoria su questo dispositivo e consegnato direttamente a un
      download."""

[[privacy]]
title = "L'audio viene copiato, non ascoltato."
body = """
 Quando il file è un MP4, i
      campioni audio passano dall'altra parte senza essere decodificati per
      niente: qui dentro non c'è niente che li ritrasformi in suono, e non ci
      sarebbe niente in grado di passarli da qualche parte nemmeno se lo
      facesse."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google. A nessuno dei due viene
      passato niente sul tuo video: né un file, né un fotogramma, né un nome, né
      una dimensione, né una durata, né la forma in cui l'hai ritagliato. Ogni
      riga che legge, decodifica, ritaglia o codifica è servita da questa origine
      ed è elencata nel repository."""

[[privacy]]
title = "Cosa carica il pulsante delle donazioni, e cosa non gli arriva."
body = """

      Il pulsante «Buy me a coffee» in cima lo disegna uno script di
      cdnjs.buymeacoffee.com, che prende i caratteri da Google Fonts. È un link
      e niente di più: non riferisce nessuna visita, e non gli viene passato
      niente su di te o sul tuo video."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e tutto quello che sta su
      questa pagina continua a funzionare. È la prova più semplice che ci
      sia."""

[[howto]]
title = "Scegli un video."
body = """
 Trascina un MP4, un MOV, un M4V o un
      WebM sul riquadro, oppure selezionane uno a mano. Lo legge il browser
      direttamente dal tuo disco, e mentre lo fa non parte niente per nessuna
      destinazione."""

[[howto]]
title = "Trascina il riquadro sulla parte che vuoi tenere."
body = """
 Trascina
      al suo interno per spostarlo, e un angolo qualsiasi per ridimensionarlo.
      Se preferisci, bloccalo prima su una forma, 1:1 per un post quadrato, 9:16
      per un telefono, 16:9 per un'inquadratura larga, oppure scrivi un riquadro
      di pixel esatto nei quattro campi qui sotto.
      Riproduci il clip, o trascina il cursore qui sotto, per scegliere il fotogramma su cui allinei il riquadro."""

[[howto]]
title = "Scegli quanta qualità spendere."
body = """
 L'immagine va codificata di
      nuovo, perché un fotogramma ritagliato è un'immagine diversa.
      «Equilibrato» la tiene vicina a quello che il file spendeva già su quella
      zona, «Massima qualità» spende di più. L'audio resta, a meno che tu non lo
      tolga."""

[[howto]]
title = "Ritaglia e scarica."
body = """
 Il lavoro avviene sul tuo hardware,
      quindi quanto ci mette dipende dal tuo dispositivo e non da una coda. Il
      video finito finisce dritto nei download del browser."""

[[faq]]
q = "Il mio video viene caricato da qualche parte?"
a = """
        No. Lo legge, lo decodifica, lo ritaglia e lo codifica il tuo browser sul
        tuo hardware. Questo strumento non ha un lato server, e la
        <code>Content-Security-Policy</code> della pagina elenca tutti gli
        indirizzi che può contattare, nessuno dei quali appartiene a questo sito.
        Se preferisci verificare invece che crederci, stacca la connessione e
        ritaglia una clip lo stesso."""

[[faq]]
q = "Quali formati video posso ritagliare?"
a = """
        MP4, M4V e MOV vengono letti direttamente, qualunque cosa ci sia dentro:
        H.264, HEVC, AV1 o VP9, purché il tuo browser sappia decodificare quel
        codec. Tutto il resto che il browser sa riprodurre, il WebM in primis,
        viene invece ritagliato riproducendolo e registrando il risultato, il che
        funziona ma richiede tanto tempo quanto è lunga la clip. Un file che il
        browser non sa né leggere né riprodurre, e in pratica sono AVI, WMV, FLV
        e quasi tutti gli MKV, viene rifiutato con un messaggio che lo dice,
        invece di piantarsi a metà strada."""

[[faq]]
q = "C'è un limite alla dimensione o alla durata del video?"
a = """
        Nello strumento non ce n'è nessuno, e il file non viene letto in memoria
        tutto insieme, ma percorso qualche megabyte alla volta. Il tetto pratico
        è il video finito, che viene assemblato in memoria prima che tu lo
        scarichi, insieme al tempo che il tuo dispositivo impiega a
        codificarlo."""

[[faq]]
q = "L'audio sopravvive?"
a = """
        Con un MP4 sopravvive esattamente com'è: viene copiato campione per
        campione senza essere mai decodificato, quindi è byte per byte quello che
        c'era nel file. Quando invece si passa per la registrazione viene
        catturato dalla riproduzione e ricodificato, e questo costa un po' di
        qualità. In entrambi i casi c'è una casella per lasciarlo fuori del
        tutto."""

[[faq]]
q = "Ritagliare fa perdere qualità?"
a = """
        L'immagine viene codificata di nuovo, perché un fotogramma ritagliato è
        un'immagine diversa e non c'è modo di conservarla senza riscrivere i
        pixel da capo. Quello che lo strumento non fa è spendere più di quanto
        spendesse l'originale sulla stessa zona, visto che ricodificare al di
        sopra rende il file solo più pesante senza renderlo più bello."""

[[faq]]
q = "Posso anche accorciarlo?"
a = """
        Non qui, ma qui accanto. Questo strumento cambia la forma dell'immagine e
        nient'altro: la clip che esce è lunga esattamente come quella che è
        entrata, con i suoi tempi e il suo audio intatti. Accorciare è un lavoro
        a parte, ed è uno strumento a parte: il
        <a href="../tagliare-video/">tagliavideo</a> segna i pezzi di una clip
        che vale la pena tenere e li salva come un file solo, senza ricodificare
        un fotogramma."""

[[faq]]
q = "Perché larghezza e altezza si muovono di due in due?"
a = """
        L'H.264, il codec dentro un MP4, conserva l'immagine a blocchi e non ha
        modo di descrivere un fotogramma con un numero dispari di pixel su un
        lato. Invece di arrotondare in silenzio il tuo ritaglio dopo che l'hai
        impostato, il riquadro propone fin dall'inizio solo numeri pari."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di
        prova e non c'è filigrana. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sul tuo video."""

