[[privacy]]
title = "Le tue immagini non hanno dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui i tuoi file possano finire, e nel
      codice non c'è niente che ce li manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 In
      <code>src/</code> non c'è né un <code>fetch</code>, né un
      <code>XMLHttpRequest</code>, né un <code>sendBeacon</code>. La
      compressione è <code>canvas.toBlob</code>, cioè l'encoder già installato
      nel browser."""

[[privacy]]
title = "I numeri sono misurati, non riferiti."
body = """
 Le dimensioni, il
      valore di qualità e il confronto SSIM vengono calcolati tutti su questa
      pagina e mostrati a te. In questo repository non esiste nessun evento di
      analytics che porti con sé un nome di file, una dimensione, un conteggio
      o un risultato."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google, il pulsante delle
      donazioni da Buy Me a Coffee. A nessuno di loro viene passato niente
      sulle tue immagini. Ogni riga che legge, comprime o misura un file è
      servita da questa origine ed è elencata nel repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta
