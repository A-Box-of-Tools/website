[[howto]]
title = "Guarda quanto è costato, poi scarica."
body = """
 Ogni risultato dice in
      che formato è stato scritto, a che qualità, se le dimensioni in pixel
      sono cambiate e quanto somiglia all'originale una volta misurato. Con
      «Confronta» le due immagini si mettono una accanto all'altra."""

[[faq]]
q = "La mia immagine viene caricata da qualche parte?"
a = """
        No. Il file lo decodifica, lo comprime e lo misura il tuo browser sul tuo
        hardware, con gli encoder JPEG, PNG e WebP che si porta già dietro.
        Questo strumento non ha nessuna funzione di rete: non recupera mai niente
        e non spedisce mai niente. La <code>Content-Security-Policy</code> della
        pagina elenca poi tutti gli indirizzi che può contattare, e nessuno di
        quelli appartiene a questo sito."""

[[faq]]
q = "Come fa a centrare una dimensione esatta?"
a = """
        Provando. Non esiste una formula che trasformi un'impostazione di qualità
        in un numero di byte, perché dipende interamente dall'immagine, quindi lo
        strumento la codifica più volte e cerca la risposta. Parte dall'estremo
        alto della scala di qualità e si stringe dimezzando, e in questo modo
        trova la qualità più alta che ci sta in circa otto codifiche. Ogni
        dimensione che vedi sulla pagina è un file davvero codificato, non una
        stima."""

[[faq]]
q = "Cosa vuol dire qui «perdita minima»?"
a = """
        Tre cose precise. Primo: un'immagine già sotto il tuo obiettivo viene
        passata così com'è, byte per byte, invece di essere ricodificata.
        Secondo: si spende prima la qualità e poi la risoluzione, e solo fino a
        una soglia sotto la quale gli artefatti di compressione cominciano a
        vedersi; oltre quella soglia lo strumento rimpicciolisce l'immagine e
        rialza la qualità, perché pochi pixel buoni si vedono meglio di tanti
        pixel rovinati. Terzo: una volta trovato un risultato che ci sta, la
        ricerca risale finché il budget non è speso, così non ti ritrovi un file
        da 300 KB quando ne avevi chiesti 500."""

[[faq]]
q = "Cosa sono i valori SSIM e PSNR su ogni risultato?"
a = """
        Sono la misura di quanto è costata la compressione, presa decodificando
        il risultato e confrontandolo con l'immagine di partenza. SSIM confronta
        luminosità, contrasto e struttura locali, e questo si avvicina molto più
        di un conteggio di pixel cambiati a ciò che l'occhio nota davvero: sopra
        lo 0,98 circa le due immagini è difficile distinguerle anche mettendole
        una accanto all'altra. PSNR è il classico valore in decibel. Li calcola
        entrambi il tuo dispositivo e li mostra entrambi, perché l'affermazione
        della perdita minima si possa verificare invece che soltanto leggere."""

[[faq]]
q = "Quali formati sa leggere e scrivere?"
a = """
        Legge tutto quello che il browser sa decodificare, che in pratica vuol
        dire JPEG, PNG, WebP, GIF, BMP e, sulla maggior parte dei browser di
        oggi, anche AVIF. Scrive JPEG, PNG e WebP, perché quelli sono gli encoder
        che i browser si portano dietro. Su «automatico» tiene il formato con cui
        è arrivato il file, e passa a WebP solo quando tenerlo avrebbe voluto
        dire ridimensionare o perdere qualità in modo visibile."""

[[faq]]
q = "Perché un PNG non si riesce a comprimere granché?"
a = """
        Perché il PNG è senza perdita: non ha nessuna manopola della qualità da
        girare. L'unico modo per rimpicciolire un PNG è dargli meno pixel o meno
        colori, quindi con il PNG selezionato lo strumento arriva all'obiettivo
        soltanto ridimensionando. Se l'immagine è una fotografia, JPEG o WebP ci
        arrivano molto più vicino con una resa che si vede benissimo; se invece è
        un logo o uno screenshot con la trasparenza, WebP la trasparenza te la
        tiene, mentre il JPEG la riempirebbe di bianco."""

[[faq]]
q = "Comprimere un'immagine ne rimuove i dati EXIF e GPS?"
a = """
        Sì, come effetto collaterale. Comprimere vuol dire decodificare
        l'immagine in pixel e ricodificare quei pixel, e un canvas pieno di pixel
        non porta con sé nessun tag: posizione, modello della fotocamera, orari e
        tutto il resto semplicemente non vengono scritti nel file nuovo. Se
        invece vuoi togliere i metadati e lasciare l'immagine intatta, usa il
        <a href="../rimuovere-dati-exif/">visualizzatore e rimozione EXIF</a>,
        che riscrive il contenitore senza ricomprimere niente."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di
        prova e non c'è filigrana. Non c'è nemmeno un limite al numero o alla
        dimensione dei file, perché non c'è nessun server che li paga: il lavoro
        lo fa il tuo dispositivo. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sulle tue immagini."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via le tue immagini
        per comprimerle si fermerebbe nell'istante in cui stacchi la spina."""

