[[privacy]]
title = "Le tue foto non hanno dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui i tuoi file possano finire, e nel codice
      non c'è niente che ce li manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 A differenza degli altri
      strumenti di questa cassetta, questo non ha nemmeno la funzione «carica da
      un indirizzo web», e di passaggi di rete facoltativi non ne ha proprio.
      In <code>src/</code> non c'è né un <code>fetch</code>, né un
      <code>XMLHttpRequest</code>, né un <code>sendBeacon</code>."""

[[privacy]]
title = "I metadati che leggiamo non vengono mai riferiti."
body = """
 La tua posizione GPS
      viene mostrata su questa pagina e non va da nessun'altra parte. In questo
      repository non esiste nessun evento di analytics che porti con sé un tag,
      un nome di file, una dimensione o un conteggio."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
