description = "Confrontare due testi con un diff di righe e parole, fianco a fianco o in una colonna, e scaricare il risultato come patch unificata. Il confronto gira nel browser e non viene caricato niente."
features = [
  "Confronta due testi con l'algoritmo di Myers, affiancati o su una colonna",
  "Segna le parole cambiate dentro una riga modificata",
  "Fianco a fianco o in una colonna, con la parte centrale immutata ripiegata in un conteggio",
  "Ignora spazi, maiuscole o righe vuote, ognuno per conto suo",
  "Scarica un confronto come diff unificato che una revisione del codice sa leggere",
  "Confronta due file trascinati con la stessa facilità di due incollate",
  "Taglia l'inizio e la fine in comune, così i file lunghi e simili si confrontano all'istante",
  "Funziona offline; niente caricamenti, niente account",
]

[picker]
title = "Trascina qui due file"
hint = "oppure clicca per sceglierli &mdash; qualsiasi file di testo, uno per lato"
