[[privacy]]
title = "Una fotografia della tua faccia non lascia mai questo dispositivo."
body = """
 Qui conta più che
      sulla maggior parte degli strumenti: il file che questa pagina maneggia è
      un'immagine della tua faccia, e quello che stai per farci nomina anche il paese
      di cui stai chiedendo il documento. La
      <code>Content-Security-Policy</code> elenca ogni indirizzo che questa pagina può
      contattare, e non ne appartiene uno a questo sito. Qui non esiste un recapito
      dove la tua fotografia possa essere raccolta."""

[[privacy]]
title = "Qui niente va a prendere niente."
body = """
 In <code>src/</code> non c'è da nessuna
      parte un <code>fetch</code>, un <code>XMLHttpRequest</code> o un
      <code>sendBeacon</code>. Il prontuario è una tabella in
      <code>src/specs.js</code>, servita con la pagina e messa in cache con lei: non
      c'è nessun elenco di paesi da consultare e niente con cui confrontare la tua foto
      a distanza."""

[[privacy]]
title = "Non c'è nessun riconoscimento del volto, ed è voluto."
body = """
 I quattro punti da cui
      si misurano le norme li trascini tu. Riconoscerli vorrebbe dire spedire un
      modello e farlo girare su un'immagine della tua faccia, e un modello che sbaglia
      sbaglia in modo disuguale: peggio su certi volti che su altri. Quattro puntini
      costano otto secondi e sono esatti per tutti."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della pubblicità e
      della misurazione arrivano da Google, il pulsante delle donazioni da Buy Me a
      Coffee. A nessuno di loro viene passato niente sulla tua fotografia, sulla tua
      faccia o su quale norma hai scelto. Ogni riga che legge, ritaglia, misura o scrive
      un file è servita da questa origine ed è elencata nel repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta identico,
      perché al suo interno non c'è mai stato un passaggio di rete. È la prova più
      semplice che ci sia."""

[[howto]]
title = "Scegli la fotografia."
body = """
 Una foto col telefono davanti a un muro
      liscio, di giorno, scattata da un metro e mezzo circa. Il browser la legge
      direttamente dal tuo disco, e nel frattempo non esce niente da nessuna parte."""

[[howto]]
title = "Scegli il paese e il documento."
body = """
 Il pannello mostra allora la misura di
      stampa, la fascia di altezza della testa, la linea degli occhi, il colore dello
      sfondo e i limiti di caricamento di quella norma, insieme all'autorità da cui
      viene ogni numero e alla data in cui è stato letto. Niente in quell'elenco è
      tirato a indovinare, e qualsiasi cosa ti sia stata mandata e non ci sia si inserisce
      sotto «Da qualunque altra parte»."""

[[howto]]
title = "Trascina i quattro puntini sulla tua faccia."
body = """
 Sommità del capo, mento e
      ciascuna pupilla. Quei quattro punti sono tutto quello che la norma misura, ed è
      per questo che lo strumento te li chiede invece di tirare a indovinare. Poi premi
      <em>Adatta il riquadro</em> e il ritaglio finisce dove quel paese lo vuole."""

[[howto]]
title = "Leggi i quattro controlli, e lo sfondo."
body = """
 Altezza della testa, linea degli
      occhi, centratura e inclinazione, ognuno misurato sul riquadro com'è adesso e
      ognuno che dice da che parte trascinare se è fuori. Lo sfondo viene letto dalla
      parte alta e dai lati del ritaglio e confrontato con il colore che la norma chiede;
      la disomogeneità, che è quello che fa davvero respingere le foto, viene misurata a
      parte rispetto al colore."""

[[howto]]
title = "Prenditi i tre file."
body = """
 La stampa, ai millimetri esatti e con la
      risoluzione scritta dentro il file, così un negozio la stampa nella misura giusta.
      Il foglio, con tante copie quante ne tiene un 10&nbsp;&times;&nbsp;15 e i segni di
      taglio negli spazi. E il caricamento, alla dimensione in pixel che il portale
      pretende e dentro la fascia in KB che impone da entrambe le parti."""

[[faq]]
q = "La mia foto viene caricata da qualche parte?"
a = """
        No. L'immagine viene decodificata, ritagliata, misurata e scritta dal tuo
        browser sul tuo hardware, con il codificatore JPEG che il browser ha già. Questo
        strumento non ha nessuna funzione di rete: non scarica mai niente e non manda
        mai niente, e la <code>Content-Security-Policy</code> della pagina elenca ogni
        indirizzo che può contattare, nessuno dei quali appartiene a questo sito. Qui
        vale più che sulla maggior parte degli strumenti: il file è una fotografia della
        tua faccia."""

[[faq]]
q = "Quali paesi sono coperti?"
a = """
        Le specifiche trascritte finora sono lo standard ICAO stesso, gli Stati Uniti
        (passaporto e iscrizione alla lotteria dei visti, che hanno regole di
        caricamento diverse), il Regno Unito, il visto Schengen, la Germania, il Canada,
        l'Australia, l'India (passaporto, la stampa 35&nbsp;&times;&nbsp;45&nbsp;mm e la
        foto e la firma per i moduli SSC e UPSC), la Cina e il Giappone. Ogni voce nomina
        l'autorità da cui viene e la data in cui è stata letta. Tutto il resto si
        inserisce sotto «Da qualunque altra parte», dove ogni numero lo scrivi tu; e
        siccome quasi tutto il mondo rilascia seguendo la geometria ICAO, quella voce
        parte proprio da lì."""

[[faq]]
q = "Perché mi chiede di segnare la mia faccia invece di trovarla?"
a = """
        Perché trovare una faccia vuol dire spedire un modello: pesi da scaricare, un
        motore di inferenza per farli girare, e un modo di sbagliare disuguale. I
        riconoscitori sono misurabilmente peggiori su certi volti che su altri, e le
        persone le cui fotografie vengono già respinte più spesso sarebbero proprio
        quelle che lascerebbe indietro. Quattro puntini trascinati costano circa otto
        secondi, sono esatti, e sono gli stessi otto secondi per chiunque. Il
        riconoscitore di volti sperimentale del browser avrebbe funzionato in un solo
        browser e dietro un'opzione nascosta, e quella non è una funzione: è uno
        strumento che si comporta diversamente a seconda di con cosa lo apri."""

[[faq]]
q = "Cos'è la regola dell'altezza della testa, e perché la mia non la rispetta mai?"
a = """
        Ognuna di queste specifiche dice quanta parte dell'inquadratura deve occupare la
        testa, misurata dal sotto del mento alla sommità del capo, capelli compresi: di
        solito dal 70 all'80 per cento, che per una foto da 45&nbsp;mm fa da 31,5 a
        36&nbsp;mm. Il motivo più comune per cui non torna è il selfie: un braccio è
        lungo circa 60&nbsp;cm, il che deforma il viso e mette la testa troppo grande
        nell'inquadratura. Il secondo motivo più comune è la sommità del capo: è la cima
        dei capelli, non l'attaccatura, e segnare l'attaccatura fa venire ogni testa
        troppo piccola."""

[[faq]]
q = "Perché il file deve pesare almeno 20 KB, e come si fa a riempirlo?"
a = """
        I portali degli esami indiani, il modulo del visto cinese e il caricamento del
        passaporto britannico indicano una dimensione minima oltre a una massima, perché
        un file sotto quella soglia di solito è una miniatura caricata per sbaglio. Una
        fotografia da 200&nbsp;&times;&nbsp;230 ha 46.000 pixel, e alla qualità migliore
        che un browser scriverà può ancora fermarsi a 15&nbsp;KB, senza nessun modo di
        farla più grande comprimendo di meno. Quindi lo strumento aggiunge un segmento di
        commento JPEG pieno di spazi. Fa parte dello standard JPEG, ogni decodificatore
        lo salta, e l'immagine è bit per bit la stessa immagine: solo il file è più
        lungo. Il riempimento dice esattamente questo, in inglese, dentro il file."""

[[faq]]
q = "Controlla lo sfondo, e può sostituirlo?"
a = """
        Controlla e non sostituisce. Il colore viene letto da una fascia in cima al
        ritaglio e lungo i due lati, sopra le spalle, e confrontato con il colore della
        norma in CIE Lab invece che in RGB: due grigi distanti quaranta unità RGB sono
        indistinguibili, mentre quaranta unità di blu fanno un altro colore. La
        disomogeneità viene misurata a parte, perché è un'ombra su un muro bianco a far
        respingere davvero le fotografie, e non è un problema di colore. Sostituire uno
        sfondo vuol dire ritagliare una persona da un'immagine, cioè un modello di
        segmentazione, e uno fatto male si mangia i capelli. Allontanarsi di trenta
        centimetri dal muro risolve più casi di questi di qualunque filtro."""

[[faq]]
q = "A cosa serve il foglio 10 x 15?"
a = """
        Una cabina si fa pagare qualche euro per sei fotografie. Un banco fotografico
        stampa un 10&nbsp;&times;&nbsp;15 per pochi centesimi, e lo fa chiunque. Così lo
        strumento dispone sul foglio tante copie della tua foto quante ne entrano
        &mdash; otto, per un 35&nbsp;&times;&nbsp;45 su un 10&nbsp;&times;&nbsp;15
        &mdash; con i segni di taglio negli spazi e niente stampato sopra un'immagine.
        Non viene ridimensionato niente: ogni copia ha esattamente la misura che la norma
        chiede, perché un foglio che le rimpicciolisse del due per cento per farcene
        stare una in più sarebbero otto fotografie tutte della misura sbagliata.
        Stampalo al 100 per cento; è «adatta alla pagina» a far venire il foglio
        sbagliato."""

[[faq]]
q = "Perché i DPI contano, se i pixel sono gli stessi?"
a = """
        Perché un JPEG può dire quanto è grande, e se non lo dice, chi lo stampa tira a
        indovinare. La risoluzione sta nell'intestazione JFIF, e una tela del browser
        scrive quell'intestazione con il campo delle unità impostato su «questo è un
        rapporto d'aspetto, non una risoluzione». Questo strumento riscrive quei pochi
        byte perché il file dichiari 300&nbsp;dpi, ed è quello a trasformare
        413&nbsp;&times;&nbsp;531 pixel in una fotografia da
        35&nbsp;&times;&nbsp;45&nbsp;mm invece che in un'immagine di nessuna dimensione
        precisa. Per farlo non viene decodificato niente e non si spende qualità."""

[[faq]]
q = "Riesce a fare anche il file della firma?"
a = """
        Sì: i moduli SSC e UPSC ne vogliono una da 140&nbsp;&times;&nbsp;60 pixel e tra
        10 e 20&nbsp;KB, ed è nell'elenco come specifica a sé. La guida del volto viene
        spenta, perché una firma non ha una linea degli occhi, e quello che si controlla
        al suo posto è che la carta sia chiara, che ci sia inchiostro sopra e che il
        ritaglio non abbia preso dentro una riga del quaderno o il bordo della pagina.
        Arrivare a 10&nbsp;KB è la parte difficile di quella regola, non restare sotto i
        20."""

[[faq]]
q = "Questo garantisce che la mia domanda venga accettata?"
a = """
        No, e nessuno strumento onestamente può. Quello che fa è applicare esattamente i
        numeri pubblicati e mostrarti ogni misura che ha preso, così quello che un modulo
        misura da solo &mdash; dimensione in pixel, peso del file, formato &mdash; è
        giusto, e quello che misura una persona &mdash; altezza della testa, linea degli
        occhi, sfondo &mdash; ce l'hai davanti con i numeri accanto. E poi le regole
        cambiano: ogni specifica qui dice da quale autorità viene e quando è stata letta,
        così puoi confrontarla con il modulo che hai davanti invece di fidarti di una
        tabella."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di prova e
        non c'è una filigrana stampata sulla tua faccia. Non c'è nemmeno un limite a
        quante fotografie fai, perché non c'è nessun server che le paga. Il sito ha della
        pubblicità, ed è quella che lo mantiene; agli annunci non arriva niente sulla tua
        fotografia."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare: il prontuario è un file servito con la pagina, non una consultazione.
        È anche il modo più semplice per dimostrare che non viene caricato niente, perché
        uno strumento che spedisse via la tua fotografia per ritagliarla si fermerebbe
        nell'istante in cui stacchi la spina."""

[schema]
description = "Fai una fotografia per passaporto, visto o documento d'identità secondo la specifica pubblicata di un paese, nel browser. Applica misura di stampa, DPI, fascia di altezza della testa, linea degli occhi e colore dello sfondo del documento scelto, mostra e misura ciascuno dal vivo, controlla lo sfondo, imposta un foglio 10x15 stampabile con i segni di taglio e scrive un file da caricare alla dimensione in pixel prevista, dentro la fascia in KB del portale. Non viene caricato niente."
features = [
  "Un prontuario di specifiche pubblicate, ognuna con la sua autorità e la data in cui è stata letta",
  "La geometria del Doc 9303 ICAO: altezza della testa come frazione dell'inquadratura e linea degli occhi sopra il bordo inferiore",
  "Un riquadro di ritaglio bloccato sulla forma della specifica, con la fascia degli occhi e quella del mento disegnate dentro",
  "Quattro segni trascinati a mano - sommità del capo, mento e le due pupille - invece del riconoscimento del volto",
  "Altezza della testa, linea degli occhi, centratura e inclinazione dal vivo, ognuna con la direzione in cui correggere",
  "Colore e uniformità dello sfondo misurati in CIE Lab, e riportati separatamente",
  "Stampa ai millimetri esatti, con la risoluzione scritta nell'intestazione JPEG",
  "Un foglio 10 x 15, 13 x 18, A4 o Letter, affiancato con i segni di taglio negli spazi e niente sopra un'immagine",
  "Un file da caricare alla dimensione in pixel prevista, portato dentro la fascia in KB del portale da entrambe le parti",
  "Foto per i moduli SSC e UPSC a 200 x 230 tra 20 e 50 KB, e firme a 140 x 60 tra 10 e 20 KB",
  "Funziona offline; niente caricamenti, niente account, nessun riconoscimento del volto",
]

[picker]
title = "Trascina qui una foto"
hint = "oppure clicca per sceglierla &mdash; una fotografia, JPEG, PNG, WebP o qualsiasi altra cosa il tuo browser sappia aprire"
