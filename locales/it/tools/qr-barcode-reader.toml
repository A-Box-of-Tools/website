#
# Lettore di QR code e codici a barre - Italian.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Si dà del tu, come nel generatore accanto.
#
# «QR code» resta com'è: è la forma che in italiano si scrive e si dice, e
# «codice QR» compare quasi solo nelle traduzioni. I nomi delle simbologie -
# EAN-13, UPC-A, ITF-14, Code 128, Code 39, ISO/IEC 18004 - sono nomi di norma
# e restano come sono.
#

