tagline = "Punta la fotocamera, o trascina qui una foto. Si legge qui, e da nessun'altra parte."

title = "Lettore di QR code &amp; scanner di codici a barre &mdash; da un'immagine, senza caricare niente"
description = "Leggi un QR code da una foto, uno screenshot o dalla fotocamera, e guarda esattamente dove porta il link prima di aprirlo. Anche EAN, UPC, Code 128, Code 39 e ITF. Non viene caricato niente."
og_title = "Leggere un QR code senza mandare l'immagine a nessuno"
og_description = "Leggi un QR code da un'immagine o dalla fotocamera e guarda l'indirizzo per intero prima di decidere se aprirlo. L'immagine non lascia la tua macchina, e nessun fotogramma della fotocamera viene registrato."
og_image_alt = "Lettore di QR code e codici a barre - leggere un codice da un'immagine o dalla fotocamera, senza caricare niente"

pledge = """
    Leggere un codice è aritmetica sui pixel, e i pixel sono già qui. Trovare il
    simbolo, correggere l'angolo, togliere la maschera, riparare i danni con
    Reed-Solomon e rileggere i bit: tutto questo succede in un paio di migliaia
    di righe di JavaScript dentro questa pagina, che puoi leggere. <strong>La
    fotocamera è la stessa promessa, non un'eccezione:</strong> un fotogramma
    arriva come pixel dentro questa scheda, viene esaminato e sparisce. Non viene
    registrato niente, non viene conservato niente, e questa pagina non ha
    nessuna funzione di rete con cui mandarlo via."""

live_hint = """
      Non fidarti della nostra parola: apri gli strumenti per sviluppatori,
      tieni d'occhio il pannello Rete e leggi un codice con la fotocamera accesa.
      Non c'è una sola richiesta che porti con sé un fotogramma o un carattere di
