read_first = """
, <code>src/binarize.js</code>
      e <code>src/detect.js</code> per trovare un simbolo dentro una fotografia
      &mdash; la soglia, i pattern di ricerca e la correzione della prospettiva
      &mdash;, <code>src/qr-decode.js</code> per rileggerlo,
      <code>src/reed-solomon.js</code> per riparare quello che è stato letto
      male, <code>src/linear.js</code> per quelli a barre e
      <code>src/camera.js</code>, che è ogni riga di questa pagina che tocca una
      fotocamera."""

howto_heading = "Come leggere un QR code senza caricare l'immagine"

card = """
            Leggi un QR code da una foto, uno screenshot o dalla fotocamera
            &mdash; e guarda tutto l'indirizzo prima di aprirlo. Anche i codici a
