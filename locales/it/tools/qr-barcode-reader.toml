[picker]
title = "Trascina qui un'immagine con un codice"
hint = "oppure clicca per sceglierla &mdash; una foto, uno screenshot, un PNG, qualsiasi cosa il tuo browser sappia aprire"

[words]
plural = "le immagini e i codici che ci sono dentro"
choose = "l'immagine da leggere"

[[facts]]
