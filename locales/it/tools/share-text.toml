[[privacy]]
title = "Il contenuto va al tuo lettore, e in nessun altro posto."
body = """
 Testo e file viaggiano su un
      canale dati WebRTC: una connessione diretta, cifrata con DTLS, tra il
      tuo browser e quello di ogni lettore. Su quel percorso non c'è nessun
      server. Sulla stessa rete i byte non escono nemmeno dall'edificio:
      due portatili sullo stesso Wi-Fi se li passano in locale."""

[[privacy]]
title = "Che cos'è il mediatore, e tutto quello che vede."
body = """
 Una connessione diretta ha
      bisogno di una presentazione, così questa pagina &mdash; unica del
      sito &mdash; apre un WebSocket verso un nostro server. Quel server
      mette insieme chi ha digitato un nome di link con chi condivide sotto
      quel nome, passa qualche kilobyte di negoziazione e non trattiene
      nulla: non scrive mai un archivio, e una stanza smette di esistere
      appena chi condivide si disconnette. Può vedere che un nome è in uso,
      quando ognuno arriva e se ne va, e gli indirizzi IP. Non può vedere il
      testo, i file, chi è stato fatto entrare né cosa ha scritto qualcuno:
      perfino il bussare a una condivisione privata viaggia sul canale
      diretto cifrato. Il suo codice completo sta nel repository, accanto a
      quello di questo strumento."""

[[privacy]]
title = "Niente viene salvato: chiudere la scheda è la cancellazione."
body = """
 La condivisione esiste solo
      finché la tua scheda è aperta. Chiudila e i nuovi lettori non trovano
      più nulla, e chi sta guardando vede sparire la propria copia &mdash;
      anche se ciò che qualcuno aveva copiato o scaricato prima è suo, come
      qualsiasi cosa gli avessi consegnato a mano. La bozza che scrivi resta
      nella memoria del tuo browser, così la prossima volta è ancora lì, e
      solo lì; segnata come usa e getta, non resta da nessuna parte."""

[[privacy]]
title = "Il nome del link è l'unico segreto, e la modalità privata il lucchetto."
body = """
 Chiunque conosca o
      indovini un nome può aprire la condivisione che c'è dietro. Per
      questo i suggerimenti sono tre parole a caso, per questo qualsiasi
      cosa delicata merita un nome non indovinabile &mdash; o
      l'interruttore privato, attivo di default: ogni lettore che arriva
      deve presentarsi, sul canale diretto, e non viene inviato nulla
      finché non lo fai entrare tu."""

[[privacy]]
title = "Una connessione diretta mostra a ciascun lato l'indirizzo dell'altro."
body = """
 È questo che
      significa peer-to-peer, e il lettore lo sa prima che accada: aprire un
      link di condivisione chiede solo al mediatore se qualcuno sta
      condividendo; poi la pagina dice chiaramente che connettersi rivela a
      ciascun lato l'indirizzo IP dell'altro, e aspetta un clic. Fino a quel
      clic, chi condivide non sa nemmeno che il lettore esiste."""

[[privacy]]
title = "Cosa carica Google, e cosa non riceve."
body = """
 Gli script di pubblicità e
      misurazione vengono da Google, il bottone per le donazioni da Buy Me a
      Coffee. Nessuno di loro riceve niente su quello che questa pagina
      condivide: né il testo, né i file, né i loro nomi o dimensioni, né il
      nome del link, né chi si è connesso. Ogni riga che tocca il contenuto
      è servita da questa origine e sta nel repository."""

[[howto]]
title = "Scrivi il testo, o allega i file."
body = """
 L'editor è la condivisione:
      quello che contiene quando un lettore si connette è quello che riceve,
      e ogni modifica successiva raggiunge i lettori connessi in tempo
      reale, mentre scrivi. I file viaggiano sullo stesso canale, fino a
      200&nbsp;MB l'uno; i lettori vedono l'elenco e scaricano solo ciò che
      chiedono, così nessuno spende banda per un file che non voleva."""

[[howto]]
title = "Attiva Markdown se il testo merita una formattazione."
body = """
 Un solo interruttore.
      Titoli, grassetti, elenchi, codice e link si renderizzano in tempo
      reale accanto all'editor mentre scrivi, e i lettori ricevono la vista
      formattata di default, con un commutatore per tornare al sorgente. Il
      renderer viaggia con questa pagina e fa l'escape di tutto: il testo
      condiviso non può diventare script sulla macchina di un lettore,
      chiunque l'abbia scritto."""

[[howto]]
title = "Dai un nome al link, o tieni il suggerimento."
body = """
 Il nome è l'indirizzo:
      <code>brave-otter-42</code> si può gridare da un capo all'altro di una
      stanza, leggere al telefono o copiare da una lavagna. È anche l'unico
      segreto: per qualcosa di privato scegli un nome che nessuno
      indovinerebbe, o affidati all'interruttore privato. Un nome sotto cui
      qualcun altro sta già condividendo viene rifiutato, e il tuo torna
      libero appena smetti."""

[[howto]]
title = "Decidi chi entra."
body = """
 Privato è l'impostazione
      predefinita: a ogni lettore viene chiesto di presentarsi &mdash; un
      nome, un indizio, qualsiasi cosa tu possa riconoscere &mdash; e tu
      vedi il messaggio con un bottone per farlo leggere o mandarlo via. La
      presentazione viaggia sul canale diretto, così nemmeno il mediatore sa
      chi ha bussato. Togli la spunta per una condivisione aperta, leggibile
      da chiunque abbia il nome."""

[[howto]]
title = "Avvia la condivisione, e lascia la scheda aperta."
body = """
 La scheda è il server: la
      condivisione è raggiungibile finché resta aperta e sveglia, e non un
      momento di più. Anche un portatile che si chiude la termina. Copia il
      link, o di' semplicemente il nome: un lettore può digitarlo come
      <code>#nome</code> in fondo all'indirizzo di questa pagina."""

[[howto]]
title = "Dall'altra parte: prima il consenso, poi bussare."
body = """
 Chi apre il link scopre che
      qualcuno sta condividendo, viene avvisato che una connessione diretta
      mostra a ciascun lato l'indirizzo di rete dell'altro, e si connette
      solo se lo decide. In una condivisione privata si presenta e ti
      aspetta. Quello che riceve si aggiorna in tempo reale mentre scrivi,
      e sparisce quando chiudi la scheda."""

[[faq]]
q = "Viene caricato qualcosa, da qualche parte?"
a = """
        No. Testo e file vanno dal tuo browser a quello di ogni lettore su
        un canale WebRTC cifrato, direttamente. L'unico server coinvolto
        porta la presentazione &mdash; qualche kilobyte di negoziazione
        della connessione &mdash; e mai il contenuto. Da lui non c'è niente
        da rubare, sequestrare o perdere: non tiene un byte di tuo, e una
        stanza smette di esistere appena ti disconnetti."""

[[faq]]
q = "E allora perché questo strumento parla con un server, proprio su questo sito?"
a = """
        Perché due browser non possono trovarsi da soli: qualcosa deve
        mettere insieme chi ha digitato <code>brave-otter-42</code> con chi
        condivide sotto quel nome, e portare l'offerta di connessione tra i
        due. Quel qualcosa è il mediatore, l'unica dipendenza di rete di
        questa pagina, nominato nella sua
        <code>Content-Security-Policy</code> e pubblicato nello stesso
        repository della pagina. È il server più piccolo capace di fare il
        lavoro: non salva nulla, non legge nulla e si fa da parte appena i
        due browser hanno un canale diretto."""

[[faq]]
q = "Che cosa può vedere esattamente quel server?"
a = """
        Che un nome di link è in uso, quando chi condivide e i lettori si
        connettono e se ne vanno, i loro indirizzi IP e l'impostazione della
        connessione cifrata che si scambiano. Non il testo, non i file, non
        i loro nomi o dimensioni, non chi è stato ammesso a una condivisione
        privata, e non ciò che qualcuno ha scritto presentandosi: tutto
        questo viaggia sul canale diretto, cifrato da estremo a estremo, che
        non passa dal server."""

[[faq]]
q = "Cosa succede quando chiudo la scheda?"
a = """
        La condivisione finisce ovunque insieme. Il link smette di
        funzionare in un paio di secondi, e i lettori che hanno ancora la
        pagina aperta vedono sparire la propria copia, con una nota che la
        condivisione è terminata. Non è una richiesta di cancellazione a un
        server: non c'è nessuna copia sul server da cancellare. La scheda
        era l'unico posto in cui la condivisione esisteva, e chiuderla è
        tutta la pulizia che serve."""

[[faq]]
q = "Un lettore può tenersi quello che ho condiviso?"
a = """
        Finché la condivisione è aperta, sì: condividere è questo. Un
        lettore può copiare il testo o scaricare un file, e ciò che ha preso
        è suo, esattamente come se gliel'avessi dato in qualsiasi altro
        modo. Quello che terminare garantisce è il futuro: nessuno di nuovo
        può arrivarci, e le pagine aperte smettono di mostrarlo. Nessuno
        strumento può disfare un invio già arrivato, e questa pagina non
        finge il contrario."""

[[faq]]
q = "Che cos'è la modalità privata?"
a = """
        L'impostazione predefinita. A ogni lettore che arriva viene detto
        che la condivisione è privata e viene chiesto di presentarsi; tu
        vedi il messaggio &mdash; «sono Alice, quella dello stand-up»
        &mdash; con i bottoni per farlo leggere o mandarlo via, e non viene
        inviato nulla finché non decidi. La presentazione viaggia sul canale
        diretto già cifrato, così il server non sa mai chi ha bussato né
        cosa hai deciso. Con la spunta tolta prima di condividere, resta una
        condivisione aperta."""

[[faq]]
q = "Perché il lettore vedrà il mio indirizzo IP?"
a = """
        Perché la connessione è davvero diretta, e una connessione diretta
        corre tra due indirizzi: ogni capo conosce per forza quello
        dell'altro, come in una telefonata. Il lettore viene avvisato prima
        che esista qualsiasi connessione e si connette solo se lo decide;
        fino ad allora tu non sai nemmeno che ha aperto il link. Se quello
        scambio non va bene per una certa condivisione, l'alternativa è un
        servizio che passa da un server &mdash; con lo scambio opposto."""

[[faq]]
q = "Quanto possono essere grandi i file, e quanto è veloce?"
a = """
        Fino a 200&nbsp;MB per file, di qualsiasi tipo, e veloce quanto la
        più lenta delle due connessioni: non c'è un server in mezzo a
        frenare o contare. Due macchine sullo stesso Wi-Fi trasferiscono a
        velocità di rete locale, e i byte non escono dall'edificio. I
        lettori scaricano ogni file su richiesta, quindi allegare qualcosa
        di grosso non costa nulla finché qualcuno non lo vuole davvero."""

[[faq]]
q = "Funziona offline?"
a = """
        Onestamente: a metà. L'editor sì &mdash; la pagina si carica, la tua
        bozza è lì, il Markdown si renderizza, e puoi scrivere e salvare
        senza nessuna rete. Condividere no, e non può: raggiungere il
        browser di un'altra persona è un atto di rete, e la presentazione ha
        bisogno del mediatore. È l'unico strumento di questo sito il cui
        compito è impossibile offline, e lasciar intendere altro sarebbe
        disonesto."""

[[faq]]
q = "E se non riusciamo a connetterci?"
a = """
        La maggior parte delle coppie di browser si raggiunge direttamente
        una volta presentata; una minoranza no, di solito quando entrambi i
        lati stanno dietro il tipo più severo di rete aziendale o mobile.
        Questa pagina non ripiega di nascosto su un server che ritrasmette
        &mdash; cambierebbe in silenzio ciò che questo strumento è &mdash;:
        dopo venti secondi dice chiaramente che una connessione diretta non
        c'è stata. Riprovare da un'altra rete di solito risolve."""

[[faq]]
q = "Renderizzare Markdown è sicuro, se chiunque può condividere qualsiasi cosa?"
a = """
        Questa domanda è il motivo per cui il renderer sono ottanta righe
        nel codice di questa pagina e non una libreria. Ogni carattere passa
        per l'escape prima che venga emesso qualunque tag, può nascere solo
        un insieme fisso di tag innocui, e i link accettano solo
        <code>http</code>, <code>https</code> e <code>mailto</code>: un link
        <code>javascript:</code> resta testo inerte. Il testo condiviso non
        può diventare script sulla tua macchina, chiunque l'abbia scritto, e
        le ottanta righe puoi leggerle."""

[[faq]]
q = "Due persone possono condividere sotto lo stesso nome?"
a = """
        Non contemporaneamente. Una condivisione viva per nome, imposta dal
        mediatore: chi arriva secondo viene rifiutato e invitato a scegliere
        un altro nome. Appena una condivisione finisce, il suo nome torna
        libero &mdash; il che significa anche che un link conservato vale
        quanto la condivisione che ha dietro: lo stesso nome, la settimana
        prossima, può essere di qualcun altro. Tratta un link come qualcosa
        che appartiene a un momento, non a una persona."""

[[faq]]
q = "È gratis, e serve un account?"
a = """
        Gratis, niente account, niente registrazione, e nessun limite degno
        di nota: sedici lettori simultanei per condivisione. Il sito porta
        pubblicità, che è ciò che lo paga; gli annunci non ricevono nulla di
        ciò che questa pagina condivide, e il mediatore sta comodamente in
        un piano gratuito proprio perché non salva niente e non fa quasi
        niente."""

