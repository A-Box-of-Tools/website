name = "Condividere testo e file"
heading = "Condividere testo e file <span class=\"h1-kw\">&mdash; dal tuo browser al loro, senza caricare niente</span>"
tagline = "La condivisione vive in questa scheda aperta. I lettori la ricevono cifrata, direttamente dal tuo browser, e chiudere la scheda la fa finire: nessun server conserva nulla."

title = "Condividere testo e file tra dispositivi &mdash; diretto, cifrato, niente di salvato"
description = "Manda testo o file da un browser all'altro su una connessione diretta e cifrata. Un nome di link pronunciabile, aggiornamento in tempo reale mentre scrivi, approvazione lettore per lettore - e mai niente su nessun server. Gratis, senza registrazione."
og_title = "Una condivisione che finisce appena chiudi la scheda"
og_description = "Testo e file viaggiano cifrati, diretti dal tuo browser a quello del lettore. Il server fa solo le presentazioni e non vede mai il contenuto. Niente archivi, niente cronologia, niente account: chiudi la scheda e sparisce, ovunque."
og_image_alt = "Condividere testo e file - da browser a browser, niente di salvato"

pledge = """
    Quello che condividi qui viaggia dal tuo browser a quello di ogni
    lettore su un canale WebRTC cifrato da estremo a estremo, e in nessun
    altro posto. L'unico server coinvolto &mdash; nominato nella
    <code>Content-Security-Policy</code> di questa pagina, codice nel
    repository &mdash; presenta i due browser l'uno all'altro e poi si fa da
    parte: non salva nulla, e il contenuto non gli passa mai attraverso.
    Non c'è cronologia né account. Chiudi questa scheda e la condivisione
    finisce ovunque insieme, anche sulle pagine aperte dei lettori."""

live_hint = """
      Apri gli strumenti per sviluppatori e tieni d'occhio il pannello Rete
      mentre condividi. Vedrai un WebSocket verso il mediatore con qualche
      kilobyte di negoziazione &mdash; e per quanto tu scriva o alleghi,
      nemmeno una richiesta che ne porti qualcosa."""

read_first = """
, <code>src/main.js</code> per le due
      metà dello scambio &mdash; la scheda di chi condivide e quella del
      lettore sono lo stesso file &mdash; e <code>src/markdown.js</code> per
      il renderer che lavora su testo arrivato dall'altro capo del filo, e
      che perciò fa l'escape di tutto prima di emettere qualsiasi cosa. Il
      codice completo del server è <code>workers/rendezvous/worker.js</code>,
      nello stesso repository: una stanza per nome di link, che non tiene
      altro che le connessioni aperte."""

howto_heading = "Come condividere testo e file senza caricarli da nessuna parte"

card = """
            Testo e file, da browser a browser su una connessione diretta
            cifrata. Niente salvato da nessuna parte; la condivisione
            finisce quando chiudi la scheda."""

[words]
plural = "testi e file condivisi"
choose = "un nome per il link"
analytics_extra = """, e niente di ciò
  che questo strumento condivide: né il testo, né i file, né i loro nomi o
  dimensioni, né chi ha letto"""

