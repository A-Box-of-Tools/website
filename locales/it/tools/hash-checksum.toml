[[howto]]
title = "Scegli il file."
body = """
 Trascinalo sul riquadro oppure
      selezionalo a mano. Viene letto a pezzi direttamente dal disco; mentre lo
      fai non parte niente da nessuna parte, e non c'è una dimensione oltre la
      quale la pagina si arrende."""

[[howto]]
title = "Lascia che lo legga."
body = """
 MD5 e SHA-256 si calcolano di
      default, in un'unica passata. La barra dice a che punto è e a che
      velocità. Un'immagine disco grande ci mette più o meno quanto ci
      metterebbe a essere copiata, perché la quantità di lettura è la stessa."""

[[howto]]
title = "Incolla quello che dovrebbe venire."
body = """

      Quello che ti ha dato la pagina di download, in qualunque forma sia:
      esadecimale nudo, una riga di output di <code>sha256sum</code>, un intero
      file <code>SHA256SUMS</code>, oppure l'attributo <code>integrity</code>
      preso da un tag script. Quale algoritmo sia si ricava dalla lunghezza, e la
      casella giusta si spunta da sola."""

[[howto]]
title = "Leggi la risposta, non il colore."
body = """
 La pagina
      dice in una frase se questo è il file che quel checksum descrive. Se
      corrisponde, i byte sono identici a quelli misurati da chi lo ha
      pubblicato. Se non corrisponde non lo sono, e conviene riscaricare prima di
      aprirlo."""

[[howto]]
title = "Portati via i checksum, se ti servono."
body = """

      Copiane uno, copiali tutti, oppure salvali in un piccolo file di testo,
      nella forma con l'algoritmo davanti che scrivono gli strumenti da riga di
      comando. Così il nome dell'algoritmo viaggia insieme al numero."""

[[faq]]
q = "Il mio file viene caricato da qualche parte?"
a = """
        No. Lo legge il tuo browser dal tuo disco e lo calcola il tuo processore,
        a pezzi da quattro megabyte. Questo strumento non ha un lato server, e la
        <code>Content-Security-Policy</code> della pagina elenca ogni indirizzo
        che può contattare: nessuno è nostro. Stacca la rete e continua a
        funzionare."""

[[faq]]
q = "C'è un limite di dimensione?"
a = """
        No. Il file non sta mai intero da nessuna parte: viene letto a pezzi e
        ogni pezzo viene contato e buttato, così un'immagine disco da quaranta
        gigabyte usa gli stessi pochi megabyte di memoria di un file di testo.
        Quello che costa è tempo, e la pagina te lo dice mentre va avanti.
        <br><br>
        È il motivo per cui gli algoritmi sono scritti qui invece di essere
        passati al <code>crypto.subtle.digest</code> del browser, che sarebbe più
        veloce. Quella chiamata prende l'intero messaggio in un solo buffer e non
        c'è modo di darle un file a pezzi, quindi usarla avrebbe messo la
        dimensione massima verificabile in balia della memoria che questa scheda
        riesce a ottenere. Su un telefono sono qualche centinaio di megabyte, e
        quello che la gente vuole verificare di più sono le immagini disco."""

[[faq]]
q = "Il checksum corrisponde. Che cosa è stato dimostrato, esattamente?"
a = """
        Che i byte sul tuo disco sono quelli che qualcuno aveva davanti quando ha
        scritto quel numero. Nient'altro, e sui limiti conviene essere precisi.
        <br><br>
        È dimostrato che il download non si è troncato, non è stato rovinato da
        un disco guasto e non è stato scambiato per strada. <strong>Non</strong>
        è dimostrato che il file sia innocuo, perché chi pubblica può misurare un
        malware con la stessa esattezza di qualsiasi altra cosa. Ed è dimostrato
        molto poco se il checksum arrivava dalla stessa pagina, sulla stessa
        connessione, del file: chi poteva cambiare una cosa poteva cambiare
        l'altra. Un checksum vale soprattutto quando ti arriva per una strada
        diversa: un file <code>SHA256SUMS</code> firmato, l'annuncio di rilascio
        di una distribuzione, un secondo mirror, o un gestore di pacchetti che lo
        conosce già."""

[[faq]]
q = "Non corrisponde. E adesso?"
a = """
        Prima riscarica il file, dallo stesso posto. Un trasferimento interrotto
        o ripreso è di gran lunga la causa più comune, e la seconda copia di
        solito risolve.
        <br><br>
        Se la seconda copia dà la stessa risposta sbagliata, controlla di
        confrontare la riga giusta: le pagine di rilascio elencano più file, e il
        checksum della build ARM non corrisponderà mai a quello della x86. Poi
        controlla la versione. Se è tutto giusto e continua a non corrispondere,
        non aprire il file. Prendilo da un altro mirror e confronta i due
        checksum fra loro."""

[[faq]]
q = "Quale dovrei usare?"
a = """
        Quello che ha pubblicato chi distribuisce il file. Il senso dell'esercizio
        è confrontare con il suo numero, e quello non lo scegli tu.
        <br><br>
        Se invece stai producendo un checksum anziché verificarlo, usa SHA-256.
        MD5 e SHA-1 sono rotti nel senso che conta: due file diversi con lo stesso
        valore si possono costruire apposta, in poche ore con MD5 e con una spesa
        contenuta con SHA-1. Questo non li rende inutili contro gli incidenti,
        perché un download troncato non finisce per caso sullo stesso valore
        dell'originale; però significa che nessuno dei due può più dirti che
        nessuno ci ha messo mano. SHA-384 e SHA-512 vanno benissimo e in pratica
        non sono migliori: stanno qui perché qualche progetto li pubblica."""

[[faq]]
q = "Perché c'è MD5 se è rotto?"
a = """
        Perché è ancora quello che sta stampato. Mirror, download di firmware,
        pagine di software universitarie e moltissimi siti di produttori hanno
        pubblicato un MD5 vent'anni fa e da allora non hanno più toccato la
        pagina. Uno strumento che si rifiutasse di calcolarlo si rifiuterebbe di
        rispondere alla domanda con cui i suoi visitatori arrivano davvero.
        <br><br>
        Quello che può fare, invece, è dire quanto vale la risposta, ed è quello
        che fa la nota accanto alla casella. Un MD5 che corrisponde esclude
        ancora un download rovinato. Non esclude un download manomesso."""

[[faq]]
q = "Quali formati posso incollare nel riquadro di confronto?"
a = """
        Tutti quelli usati di solito, e la pagina capisce da sola quale sia.
        <br><br>
        Esadecimale nudo, con o senza spazi. Una riga di output di
        <code>md5sum</code> o <code>sha256sum</code>, con il nome del file dopo.
        Un intero file <code>SHA256SUMS</code> con quaranta righe: in quel caso
        viene usata la riga che nomina il tuo file. La forma BSD,
        <code>SHA256 (disk.iso) = &hellip;</code>. Un'etichetta davanti, come in
        <code>SHA-256: &hellip;</code>. E un attributo di subresource integrity,
        <code>sha384-&hellip;</code>, che è in base64 invece che in esadecimale e
        viene decodificato prima del confronto.
        <br><br>
        Quale algoritmo sia si ricava dalla lunghezza: 32 caratteri esadecimali
        sono un MD5, 40 uno SHA-1, 64 uno SHA-256, 96 uno SHA-384 e 128 uno
        SHA-512. Non ce ne sono due della stessa lunghezza, quindi non c'è niente
        da scegliere e niente da sbagliare."""

[[faq]]
q = "Darà lo stesso risultato di sha256sum o certutil?"
a = """
        Sì, byte per byte. Sono specifiche esatte con vettori di test pubblicati,
        e ogni algoritmo qui viene verificato a ogni build contro quei vettori e
        contro l'implementazione del sistema operativo.
        <br><br>
        L'unica differenza che vedrai è la presentazione. Il
        <code>certutil -hashfile</code> di Windows scrive in maiuscolo e con
        spazi; questa pagina scrive in minuscolo, che è quello che usa quasi
        chiunque pubblichi. Il confronto ignora entrambe le cose, quindi un
        checksum copiato da certutil corrisponde a uno in minuscolo incollato
        qui."""

[[faq]]
q = "Posso confrontare due file fra loro?"
a = """
        Sì, con un passaggio in più: controlla il primo, copia il suo checksum,
        poi scegli il secondo e incolla quel checksum nel riquadro. Se i due file
        sono identici, la pagina lo dirà.
        <br><br>
        Vale la pena saperlo per il caso in cui i checksum sono silenziosamente
        imbattibili: capire se la copia sul disco di backup è davvero lo stesso
        file di quella sul portatile, quando tutte e due dichiarano la stessa
        dimensione e la stessa data."""

[[faq]]
q = "Modifica il mio file?"
a = """
        No. Questo strumento legge soltanto. Non c'è un file in uscita, non c'è
        una ricodifica e non c'è niente che venga riscritto: l'unica cosa che
        puoi scaricare è un piccolo file di testo con i checksum. Il tuo
        originale resta intatto sul disco, che è anche la risposta onesta a cosa
        succede se chiudi la scheda."""

[[faq]]
q = "È gratis, e serve un account?"
a = """
        È gratis, e non c'è account, né registrazione, né prova. Non c'è limite
        alla dimensione del file né a quanti file controlli. Il sito ha
        pubblicità, che è quello che lo paga; alla pubblicità non viene dato
        niente sul tuo file."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la rete e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente: uno strumento che mandasse via il tuo file per farlo
        calcolare si fermerebbe nel momento in cui stacchi la spina."""

