      ufficiali e contro l'implementazione del sistema operativo."""

[[privacy]]
title = "Anche il checksum che incolli non va da nessuna parte."
body = """

      Il confronto avviene qui, nella pagina, contro il valore calcolato qui. Di
      quel confronto non viene a sapere nessuno: né il valore, né se
      corrispondeva, né il nome del file. Conta più di quanto sembri: un checksum
      insieme a un nome di file dice a chi lo raccoglie esattamente quale build
      di quale programma hai appena scaricato."""

[[privacy]]
