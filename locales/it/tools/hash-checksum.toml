[[privacy]]
title = "Il tuo file non ha una strada per uscire."
body = """
 Nella
      Content-Security-Policy c'è ogni indirizzo che questa pagina può
      contattare, e nessuno è nostro. Qui non esiste un punto di raccolta dove
      il tuo file possa finire, e nel codice non c'è niente che ce lo manderebbe
      se esistesse. Prima qui si leggeva <code>connect-src 'none'</code>, che era
      assoluto; la pubblicità è costata questo, e dirlo fa parte del patto."""

[[privacy]]
title = "Il file non sta mai intero da nessuna parte, di qualsiasi dimensione sia."
body = """

      Viene letto a pezzi da quattro megabyte, e ogni pezzo entra nello stato in
      corso e viene buttato. La memoria che questa pagina usa è la stessa per
      un'immagine disco da quaranta gigabyte e per un file di testo, e non c'è
      una dimensione oltre la quale si arrende. È anche il motivo per cui non si
      usa il <code>crypto.subtle.digest</code> del browser: quella funzione vuole
      il file intero in memoria tutto insieme, che è esattamente il tetto che
      questo strumento esiste per non avere."""

[[privacy]]
title = "Cinque algoritmi, cinque file in questo repository."
body = """
 In <code>src/md5.js</code>,
      <code>src/sha1.js</code>, <code>src/sha256.js</code> e
      <code>src/sha512.js</code> ci sono le specifiche pubblicate scritte per
      esteso, una sessantina di righe ciascuna, con le tabelle di costanti
      scritte invece che calcolate perché niente del risultato dipenda dal
