plural = "immagini"
choose = "delle immagini"

[[facts]]
text = "Niente caricamenti"

[[facts]]
text = "Nessun account"

[[facts]]
text = "Funziona offline"

[[facts]]
text = "Open source"

[[facts]]
text = "I file restano sul tuo dispositivo"

[[privacy]]
title = "Le tue immagini non hanno dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui i tuoi file possano finire, e nel codice
      non c'è niente che ce li manderebbe se anche esistesse. Prima qui c'era
      scritto <code>connect-src 'none'</code>, che era assoluto; aggiungere la
      pubblicità è costato quello, e dirlo fa parte del patto."""

[[privacy]]
title = "La codifica avviene in locale."
body = """
 WebCodecs gira dentro il tuo browser
      e il file finito viene consegnato direttamente a un download. Questa
      applicazione un lato server non ce l'ha."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google. A nessuno dei due viene
      passato niente sulle tue immagini: né un file, né una miniatura, né un
      nome, né una dimensione, né un conteggio. Ogni riga che legge, decodifica,
      compone o codifica un'immagine è servita da questa origine ed è elencata
      nel repository."""

[[privacy]]
title = "Cosa carica il pulsante delle donazioni, e cosa non gli arriva."
body = """

      Il pulsante «Buy me a coffee» in cima lo disegna uno script di
      cdnjs.buymeacoffee.com, che prende i caratteri da Google Fonts. È un link
      e niente di più: non riferisce nessuna visita, e non gli viene passato
      niente su di te o sulle tue immagini. Finché non ci clicchi non succede
      niente, e quello a cui arriveresti è il sito di qualcun altro."""

[[privacy]]
title = "Un'eccezione voluta."
body = """
 Se usi «Aggiungi da un indirizzo web»,
      quel server viene contattato per recuperare l'immagine e vedrà il tuo
      indirizzo IP. Vengono recuperate solo le immagini che incolli tu, e solo
      in entrata: <code>img-src</code> è aperto, <code>connect-src</code> no. Il
      contatore qui sotto elenca ogni origine esterna contattata."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e tutto quello che sta qui
      continua a funzionare, tranne il caricamento da un indirizzo web. È la
      prova più semplice che ci sia."""

[[howto]]
title = "Scegli le immagini."
body = """
 Trascina una cartella sul riquadro,
      oppure seleziona i file a mano. Li legge il browser direttamente dal tuo
      disco, e mentre lo fa non parte niente per nessuna destinazione."""

[[howto]]
title = "Mettile in ordine e imposta quanto dura ciascuna."
body = """
 Trascina
      per riordinare. La durata la puoi dare in fotogrammi o in secondi, e puoi
      darla per tutte le immagini insieme oppure una alla volta."""

[[howto]]
title = "Scegli una risoluzione e una frequenza di fotogrammi."
body = """
 «Segui la
      risoluzione più alta» va dietro alla tua immagine più grande; i valori
      pronti coprono 4K, 1080p, 720p, quadrato e verticale, e se nessuno di
      questi va bene c'è una dimensione personalizzata."""

[[howto]]
title = "Crea il video e scaricalo."
body = """
 La codifica gira sul tuo hardware,
      quindi quanto ci mette dipende dal tuo dispositivo e non da una coda. L'MP4
      finito finisce dritto nei download del browser."""

[[faq]]
q = "Le mie immagini vengono caricate da qualche parte?"
a = """
        No. Le tue immagini le legge, le compone e le codifica il tuo browser sul
        tuo hardware. Questo strumento non ha un lato server, e la
        <code>Content-Security-Policy</code> della pagina elenca tutti gli
        indirizzi che può contattare, nessuno dei quali appartiene a questo sito.
        L'unica eccezione è la funzione facoltativa «aggiungi da un indirizzo
        web», che va a recuperare un'immagine incollata da te, e quel server vede
        il tuo indirizzo IP."""

[[faq]]
q = "Quali formati di immagine posso usare?"
a = """
        Qualunque formato di immagine ferma che il tuo browser sappia
        decodificare, il che in pratica vuol dire JPG, PNG, WebP, GIF, AVIF e,
        sui dispositivi Apple, HEIC. Qui non c'è nessun elenco a parte da tenere
        aggiornato, perché la decodifica è compito del browser e non nostro."""

[[faq]]
q = "Che formato video produce?"
a = """
        MP4 con video H.264, che si riproduce praticamente ovunque. In un browser
        senza WebCodecs lo strumento ripiega sulla registrazione in WebM, cioè le
        stesse riprese dentro un contenitore che meno programmi di montaggio
        accettano."""

[[faq]]
q = "Posso usarlo per una sequenza di render di Blender o After Effects?"
a = """
        Sì: una sequenza di render numerata è esattamente il motivo per cui
        esiste. Aggiungi i fotogrammi che ha scritto il tuo renderer, lascia la
        durata a un fotogramma ciascuno, e imposta la frequenza in modo che
        corrisponda al render. «Ordina per nome» conta come ti aspetti, quindi
        <code>frame_2</code> finisce prima di <code>frame_10</code> e non dopo.
        <br><br>
        Una cosa da sapere prima di cominciare: l'H.264 un canale alfa non ce
        l'ha, quindi la trasparenza viene appiattita sul colore di sfondo invece
        che portata dall'altra parte. Se ti serve tenere l'alfa, componi i
        fotogrammi nel tuo programma di montaggio."""

[[faq]]
q = "Posso fare un timelapse con delle foto?"
a = """
        Sì, ed è lo stesso lavoro di una sequenza di render: tieni ogni foto per
        un fotogramma solo e scegli una frequenza. A 30 fps ogni trenta foto
        diventano un secondo di video; a 12 fps quelle stesse foto durano due
        secondi e mezzo.
        <br><br>
        «Ordina per data» rimette un rullino nell'ordine in cui è stato scattato,
        cosa che conta quando i nomi dei file sono ripartiti da 0001. Foto di
        dimensioni diverse non sono un problema, perché «segui la risoluzione più
        alta» dimensiona il video in modo che nessuna venga rimpicciolita."""

[[faq]]
q = "C'è un limite al numero di immagini o alla durata del video?"
a = """
        Nello strumento non c'è nessun limite. Il tetto pratico è la memoria del
        tuo dispositivo, perché il video finito viene assemblato lì prima che tu
        lo scarichi. La prima cosa a sentirlo sono le presentazioni 4K molto
        lunghe."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione e non c'è periodo di
        prova. Il sito ha della pubblicità, ed è quella che lo mantiene; agli
        annunci non arriva niente sulle tue immagini."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via le tue immagini
        per elaborarle si fermerebbe nell'istante in cui stacchi la spina."""

[[faq]]
q = "Posso aggiungere della musica o una colonna sonora?"
a = """
        Non ancora. Lo strumento produce soltanto video: l'MP4 che scrive ha una
        sola traccia video e nessuna traccia audio. Se ti serve una colonna
        sonora, aggiungila dopo in un programma di montaggio."""

