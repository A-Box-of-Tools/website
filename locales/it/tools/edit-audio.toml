[[privacy]]
title = "Le tue registrazioni non hanno dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui il tuo file possa finire, e nel codice
      non c'è niente che ce lo manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 Questo strumento non ha
      proprio nessuna funzione di rete: nessun indirizzo da incollare, niente da
      scaricare, nessun motore che si scarichi al primo utilizzo. Ogni byte che
      tocca il tuo audio è arrivato da questa origine nel momento in cui si è
      caricata la pagina."""

[[privacy]]
title = "Il decodificatore è quello che hai già nel browser."
body = """

      Il file viene consegnato a <code>decodeAudioData</code>, lo stesso codice
      che riproduce una traccia dentro un elemento <code>&lt;audio&gt;</code>.
      Qui non arriva niente per leggere il tuo formato, e per leggerlo non si
      chiede niente a niente che stia fuori da questa pagina."""

[[privacy]]
title = "L'immagine di un video non viene mai decodificata."
body = """
 Quando trascini qui
      dentro un video, viene chiesta soltanto la sua traccia audio. I fotogrammi
      non vengono letti, né decodificati, né disegnati, né guardati: su questa
      pagina non c'è codice che saprebbe farlo, e il file che esce contiene suono
      e nient'altro."""

[[privacy]]
title = "I campioni vengono scritti, non ricodificati."
body = """

      Un WAV sono i campioni che questa pagina ha calcolato, con
      un'intestazione davanti. Nel ciclo non c'è nessun encoder che prenda
      decisioni sulla tua registrazione, e non c'è niente che si possa chiamare
      caricamento su cui farne avvenire uno."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google. A nessuno dei due viene
      passato niente sulla tua registrazione: né un file, né un campione, né un
      nome, né una dimensione, né una durata, né quanto era forte. Ogni riga che
      legge, modifica e scrive è servita da questa origine ed è elencata nel
      repository."""

[[privacy]]
title = "Cosa carica il pulsante delle donazioni, e cosa non gli arriva."
body = """

      Il pulsante «Buy me a coffee» in cima lo disegna uno script di
      cdnjs.buymeacoffee.com, che prende i caratteri da Google Fonts. È un link
      e niente di più: non riferisce nessuna visita, e non gli viene passato
      niente su di te o sul tuo file."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e tutto quello che sta su
      questa pagina continua a funzionare. È la prova più semplice che ci
      sia."""

[[howto]]
title = "Scegli un file."
body = """
 Trascina sul riquadro un file MP3,
      WAV, FLAC, M4A, Ogg o Opus, oppure un video, se quello che ti serve è il
      suono che ci sta dentro. Lo legge il browser direttamente dal tuo disco, e
      mentre lo fa non parte niente per nessuna destinazione."""

[[howto]]
title = "Girala al contrario, se è per questo che sei venuto."
body = """
 Una
      casella sola. I campioni vengono scritti dall'ultimo al primo, il che è
      esattamente reversibile: fallo due volte e ti ritrovi il file da cui sei
      partito, campione per campione."""

[[howto]]
title = "Imposta la velocità."
body = """
 Trascina il cursore, scrivi un
      moltiplicatore, oppure premi uno dei valori pronti. Poi scegli cosa
      succede all'intonazione: puoi tenerla dov'è, che è quello che serve per
      una lezione a 1,5&times;, oppure lasciarla muovere con la velocità, che è
      quello che fa un nastro e che fa salire o scendere una voce."""

[[howto]]
title = "Imposta il livello."
body = """
 Puoi indicare una variazione in
      decibel, oppure chiedere che la registrazione venga tirata su finché il suo
      momento più forte non sta appena sotto il tetto. La pagina dice dove
      finirà quel momento prima ancora che tu prema qualcosa, e ti avverte se
      l'impostazione che hai scelto lo spingerebbe oltre il fondo scala."""

[[howto]]
title = "Salvala."
body = """
 Il lavoro avviene sul tuo hardware, quindi quanto
      ci mette dipende dal tuo dispositivo e non da una coda. Quello che esce è
      un WAV, cioè i campioni stessi con un'intestazione davanti: prima viene
      riprodotto sulla pagina, poi finisce dritto nei download del browser."""

[[faq]]
q = "Il mio audio viene caricato da qualche parte?"
a = """
        No. Lo legge, lo modifica e lo scrive il tuo browser sul tuo hardware.
        Questo strumento non ha un lato server, e la
        <code>Content-Security-Policy</code> della pagina elenca tutti gli
        indirizzi che può contattare, nessuno dei quali appartiene a questo sito.
        Se preferisci verificare invece che crederci, stacca la connessione e
        inverti una traccia lo stesso."""

[[faq]]
q = "Posso tirare fuori l'audio da un video?"
a = """
        Sì, e qui è lo stesso identico lavoro che aprire un MP3. Trascina dentro
        un MP4, un MOV o un WebM e viene decodificata solo la sua traccia audio:
        l'immagine non viene mai letta, e quello che esce è un file sonoro senza
        video dentro. È anche il modo per salvare il suono di una clip senza
        modificarlo per niente: lascia stare ogni impostazione e premi il
        pulsante."""

[[faq]]
q = "Cambiare la velocità cambia l'intonazione?"
a = """
        Solo se glielo chiedi. «Tieni l'intonazione» taglia la registrazione in
        finestre sovrapposte lunghe una cinquantina di millisecondi e le
        riappoggia più vicine o più lontane, scegliendo ogni posizione in modo
        che le onde si allineino dove si incrociano, e così una voce resta la
        stessa voce anche a 1,5&times;. «Lasciala muovere» invece ricampiona, che
        è quello che succede a riprodurre un nastro più in fretta: al doppio
        della velocità sale esattamente di un'ottava."""

[[faq]]
q = "Perché salva un WAV invece di un MP3?"
a = """
        Perché nessun browser si porta dietro un encoder MP3, e questo strumento
        si rifiuta di mandare la tua registrazione a un server che ce l'ha. Un
        WAV di encoder non ne ha bisogno affatto, visto che sono i campioni con
        un'intestazione di quarantaquattro byte davanti, quindi è insieme
        l'opzione onesta e l'unica che non può costare qualità. Pesa di più: una
        decina di megabyte al minuto in stereo. Lo apre qualunque lettore,
        telefono o editor, e qualunque cosa voglia un MP3 può farsene uno."""

[[faq]]
q = "Quali formati posso aprire?"
a = """
        Quelli che il tuo browser decodifica, il che in pratica vuol dire MP3,
        WAV, FLAC, M4A e AAC, Ogg Vorbis e Opus, più l'audio dentro i video MP4,
        M4V, MOV e WebM. Quello che resta fuori è il solito elenco corto: AVI,
        WMA e quasi tutti gli MKV. Un file che questo browser non legge viene
        rifiutato con un messaggio che lo dice, invece di piantarsi a metà
        strada."""

[[faq]]
q = "Alzando il volume si distorce?"
a = """
        Solo se la porti oltre il fondo scala, e la pagina te lo dice prima che
        succeda. L'audio digitale ha un tetto rigido: un campione non può essere
        più forte del fondo scala, quindi tutto quello che sta sopra viene
        schiacciato contro il tetto, ed è così che suona la distorsione. «Il più
        forte possibile» è l'impostazione che non può farlo, perché calcola
        quanto spazio è rimasto alla registrazione e usa esattamente quello.
        Tutto quello che sta sotto il tetto è una moltiplicazione e nient'altro:
        alzala di 6 dB, riabbassala di 6 dB, e i campioni sono dove erano
        partiti."""

[[faq]]
q = "Invertire o cambiare velocità fa perdere qualità?"
a = """
        Invertire no: escono gli stessi campioni nell'altro ordine, il che è
        esatto. Cambiare la velocità sposta ogni campione, quindi è aritmetica e
        non una copia. Il ricampionatore però filtra come si deve strada
        facendo, così accelerare non ripiega le note alte verso il basso come un
        ronzio metallico, e le finestre del time stretch vengono messe dove le
        onde si allineano invece che dove è capitato all'aritmetica. Nessuna
        delle due strade ricodifica niente, perché qui non c'è nessun encoder con
        cui ricodificare."""

[[faq]]
q = "C'è un limite alla durata del file?"
a = """
        Nello strumento non ce n'è nessuno. Il tetto pratico è la memoria: tutta
        la registrazione viene decodificata dentro questa pagina in una volta
        sola, e il WAV viene assemblato in memoria prima che tu lo scarichi,
        quindi un'ora di stereo ha bisogno di poco meno di un gigabyte per
        lavorare. Un WAV da quattro gigabyte viene rifiutato subito, perché il
        campo delle dimensioni del formato non sa descriverne uno."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di
        prova e non c'è filigrana. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sulla tua registrazione."""

