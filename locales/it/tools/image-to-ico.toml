[[privacy]]
title = "Il tuo logo non ha dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Non
      esiste un punto di raccolta in cui i tuoi file possano finire, e nel codice
      non c'è niente che ce li manderebbe se anche esistesse."""

[[privacy]]
title = "Qui dentro niente va a recuperare niente."
body = """
 In <code>src/</code> non
      c'è né un <code>fetch</code>, né un <code>XMLHttpRequest</code>, né un
      <code>sendBeacon</code>. Il ridimensionamento è un <code>drawImage</code>
      su un canvas, e ogni icona è un'intestazione scritta davanti a quei pixel
      da <code>src/ico.js</code> o da <code>src/icns.js</code>, su questa
      pagina."""

[[privacy]]
title = "Il file viene descritto a partire dai suoi byte."
body = """
 L'elenco di dimensioni
      che compare accanto a un'icona finita non è l'elenco delle dimensioni che
      hai chiesto. Viene riletto dal file appena scritto, da
      <code>readIcoDirectory</code> o da <code>readIcnsElements</code>, così se
      uno scrittore non concordasse con le impostazioni la pagina te lo direbbe,
      invece di lasciartelo scoprire quando Windows non disegna niente e macOS
      disegna un foglio bianco."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google, il pulsante delle
      donazioni da Buy Me a Coffee. A nessuno di loro viene passato niente sulla
      tua immagine. Ogni riga che legge, ridimensiona o scrive un file è servita
      da questa origine ed è elencata nel repository."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e lo strumento resta
      identico, perché al suo interno non c'è mai stato un passaggio di rete. È
      la prova più semplice che ci sia."""

[[howto]]
title = "Scegli l'immagine."
body = """
 Trascina sul riquadro un PNG, un JPEG,
      un WebP o un SVG, oppure scegline parecchie e convertile in un colpo solo.
      Quadrata è la strada più semplice, e qualunque immagine da 256 pixel in su
      ha abbastanza dettaglio per tutte le dimensioni. La legge il browser
      direttamente dal tuo disco, e mentre lo fa non parte niente per nessuna
      destinazione."""

[[howto]]
title = "Scegli i file che ti servono."
body = """
 Windows e i browser leggono
      l'<code>.ico</code>; un Mac legge l'<code>.icns</code> e l'altro non lo
      guarda nemmeno. Spunta uno dei due, oppure entrambi se quello che stai
      facendo esce su tutti e due. Un sito web vuole anche le immagini in più per
      Apple, Android e le tessere, ed è la terza casella."""

[[howto]]
title = "Di' a cosa serve l'icona."
body = """
 Una favicon per un sito è 16, 32 e
      48 pixel; un'applicazione Windows vuole anche 256; un'applicazione che deve
      venire bene su un portatile ad alta densità vuole le dimensioni intermedie
      che Windows chiede al 125% e al 150%. Scegli il valore pronto che
      corrisponde al lavoro, oppure spunta tu le dimensioni una per una: ognuna,
      nell'elenco, dice chi la chiede. L'<code>.icns</code> questa scelta non ce
      l'ha, perché Apple nomina esattamente dieci slot e ci entrano tutti e
      dieci."""

[[howto]]
title = "Sistema la forma e lo sfondo."
body = """
 Un'icona è quadrata e quasi
      nessun logo lo è. Con il riempimento l'immagine viene tenuta tutta, con
      dello spazio sopra e sotto; con il ritaglio viene preso il centro; con lo
      stiramento viene schiacciata. La trasparenza resta trasparenza, a meno che
      tu non scelga un colore da metterci dietro."""

[[howto]]
title = "Guarda quella da 16 pixel prima di scaricare."
body = """
 È la dimensione a cui
      l'icona verrà vista più spesso, ed è dove i tratti sottili e le scritte
      piccole spariscono. Ogni quadrato dell'anteprima è disegnato alla sua
      dimensione vera a partire dal tuo file. Se la più piccola è una macchia, la
      soluzione è un disegno più semplice, non un'impostazione diversa."""

[[howto]]
title = "Prendi i file."
body = """
 Un .ico con tutte le dimensioni dentro,
      chiamato <code>favicon.ico</code> quando è quello che hai chiesto, perché è
      l'indirizzo che i browser vanno a cercare. Un .icns accanto, se hai spuntato
      anche quello, pronto da mettere nel bundle di un'applicazione Mac. Spunta
      pure il pacchetto per il sito e ti arrivano anche le immagini Apple e
      Android, la tessera di Windows, il manifest e il blocco di HTML da
      incollare nella tua pagina. Qualunque cosa vada oltre il file singolo si
      scarica in un unico zip."""

[[faq]]
q = "La mia immagine viene caricata da qualche parte?"
a = """
        No. L'immagine la decodifica e la ridimensiona il tuo browser sul tuo
        hardware, e l'.ico viene assemblato a partire da quei pixel da codice
        servito da questa pagina. Questo strumento non ha nessuna funzione di
        rete: non recupera mai niente e non spedisce mai niente. La
        <code>Content-Security-Policy</code> della pagina elenca poi tutti gli
        indirizzi che può contattare, e nessuno di quelli appartiene a questo
        sito."""

[[faq]]
q = "Quali dimensioni dovrebbe contenere un favicon.ico?"
a = """
        16, 32 e 48. Non è una preferenza: 16 è quello che un browser disegna in
        una scheda, 32 è quello che Windows usa per un collegamento sul desktop e
        che parecchi browser usano per un segnalibro, e 48 è la dimensione a cui
        Google legge l'icona di un sito. Tutto quello che è più grande sta in un
        PNG accanto all'.ico e non dentro, ed è esattamente quello che qui
        produce il pacchetto per il sito."""

[[faq]]
q = "Di quali dimensioni ha bisogno l'icona di un'applicazione Windows?"
a = """
        16, 32, 48 e 256, che è quello che contiene l'app.ico predefinito di
        Visual Studio. 16 è la barra del titolo e la visualizzazione a icone
        piccole di Esplora file, 32 il desktop e la barra delle applicazioni, 48
        le icone medie, e 256 il menu Start e le icone molto grandi. Su uno
        schermo ad alta densità Windows chiede anche 20, 24, 40, 64 e 96, e se non
        le trova se le ricava dalla dimensione più vicina che ha: il valore pronto
        «tutte le scale» gliele mette dentro."""

[[faq]]
q = "Perché il file è più pesante dell'immagine da cui sono partito?"
a = """
        Perché un .ico non è un'immagine, sono parecchie, e le piccole vengono
        conservate non compresse perché possa leggerle chiunque. Una voce 32x32
        pesa esattamente 4.264 byte qualunque cosa contenga, e una voce 256x256
        non compressa pesa 264 KB: è per questo che di default le dimensioni sopra
        i 64 vengono conservate come PNG. Scegliendo «PNG per tutte le dimensioni»
        ottieni il file più leggero possibile; scegliendo non compresso per tutte,
        quello più compatibile."""

[[faq]]
q = "Che differenza c'è tra le voci PNG e quelle non compresse?"
a = """
        Solo il modo in cui i pixel vengono conservati dentro l'.ico. Una voce non
        compressa è la disposizione Windows originale, cioè un'intestazione
        bitmap, i pixel a testa in giù e una maschera di trasparenza a un bit, e
        sanno leggerla tutte le versioni di Windows mai uscite. Una voce PNG è un
        intero file PNG infilato dentro l'icona: alle dimensioni grandi è da tre a
        dieci volte più leggera, ma l'hanno capita solo da Windows Vista in poi.
        Il default usa ciascuna delle due dove vince, quindi non compressa fino a
        64 pixel e PNG sopra."""

[[faq]]
q = "Può fare un'icona più grande di 256 pixel?"
a = """
        No, e non può nessuno. Il formato conserva ogni lato in un byte solo, e lo
        0 è già preso, perché vuol dire 256. Quello è il tetto, quindi un .ico che
        contiene un'immagine da 512 pixel non è un'icona più grande, è un'icona
        rotta. Se ti servono 512, ti serve un PNG, ed è quello che il pacchetto
        per il sito include per Android e per la schermata di avvio di una web
        app."""

[[faq]]
q = "Conserva la trasparenza?"
a = """
        Sì, in tutti e due i tipi di voce, e scrive anche la vecchia maschera a un
        bit accanto al canale alfa, così il software troppo vecchio per leggere
        l'alfa ritaglia comunque l'icona invece di disegnare un rettangolo nero.
        L'unico file reso opaco di proposito è l'icona Apple touch del pacchetto
        per il sito: iOS la sovrappone alla propria tessera e trasforma la
        trasparenza in nero, quindi viene appiattita sul tuo colore di sfondo,
        bianco se non dici altro."""

[[faq]]
q = "Il mio logo è un logotipo largo. Cosa gli succede?"
a = """
        Qualcosa deve succedergli, perché un'icona è quadrata. Il riempimento
        tiene tutto e lo rimpicciolisce, e un logotipo fatto entrare in un
        quadrato da 16 pixel è alto tre pixel e non si legge. Di solito funziona
        meglio ritagliare il centro: isola il simbolo dal logo e usa quello, come
        fa quasi ogni marchio per la propria favicon. L'anteprima ti mostra quale
        dei due sopravvive, prima che tu scarichi qualunque cosa."""

[[faq]]
q = "Cosa c'è nel pacchetto per il sito, e mi serve tutto?"
a = """
        Sette PNG, un manifest per web app, un browserconfig.xml e un blocco di
        HTML da incollare. Ti servono perché un .ico copre i browser e Windows e
        nient'altro: la schermata Home di un iPhone legge un PNG da 180 pixel con
        un nome tutto suo, Android e ogni richiesta di installazione leggono il
        manifest, e una tessera appuntata al menu Start legge l'XML. Nessuno di
        questi va a guardare dentro un .ico. Viene generato tutto qui, sul tuo
        dispositivo, e nello zip c'è una nota che dice a cosa serve ogni file."""

[[faq]]
q = "Può fare anche un'icona per macOS?"
a = """
        Sì: spunta <em>icona macOS</em> e ottieni un <code>.icns</code> accanto
        all'<code>.ico</code>, oppure al posto suo. È un contenitore diverso per
        la stessa idea, e nessuno dei due sistemi legge quello dell'altro, perché
        Windows vuole .ico e il bundle di un'applicazione Mac vuole .icns. Lì le
        dimensioni non sono una scelta, perché Apple pubblica esattamente dieci
        slot: 16, 32, 64, 128, 256, 512 e 1024 pixel, con tre di questi che
        compaiono due volte come versione Retina della dimensione sotto. Ci
        entrano tutti e dieci, disegnati da sette rese, ed è per questo che un
        .icns è il file più pesante."""

[[faq]]
q = "Come si usa il file .icns?"
a = """
        Per un'applicazione, va nel bundle in
        <code>TuaApp.app/Contents/Resources/</code> e va nominato in
        <code>Info.plist</code> sotto <code>CFBundleIconFile</code>; ogni
        strumento di impacchettamento per Mac ha un campo apposta. Per tutto il
        resto, seleziona il file nel Finder, premi Comando-C, poi apri Ottieni
        informazioni sulla cartella o sull'immagine disco che vuoi cambiare,
        clicca la piccola icona in alto a sinistra e premi Comando-V."""

[[faq]]
q = "L'.icns è uguale a quello che fa iconutil?"
a = """
        Gli stessi dieci slot con gli stessi tipi da quattro lettere, e un PNG in
        ognuno, che è quello che <code>iconutil</code> produce da una cartella
        <code>.iconset</code>. C'è una differenza, ed è voluta: lo strumento di
        Apple scrive anche un elemento <code>TOC&nbsp;</code>, cioè un indice dei
        tipi e delle lunghezze che seguono. È un'ottimizzazione e non una parte
        del formato, visto che un lettore che non ce l'ha percorre gli elementi da
        un capo all'altro e arriva alla stessa risposta, e un indice sbagliato è
        peggio di nessun indice, quindi qui viene lasciato fuori."""

[[faq]]
q = "Posso convertire più immagini insieme?"
a = """
        Sì. Ogni immagine dell'elenco diventa il proprio .ico con le stesse
        impostazioni, e il lotto si scarica in un unico zip con una cartella per
        immagine, altrimenti due di loro si chiamerebbero tutte e due favicon.ico
        e una sovrascriverebbe l'altra. Ogni uscita che hai spuntato viene fatta
        per ogni immagine. Clicca una riga qualsiasi per mettere quell'immagine
        nell'anteprima."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di
        prova e non c'è filigrana. Non c'è nemmeno un limite al numero o alla
        dimensione dei file, perché non c'è nessun server che li paga: il lavoro
        lo fa il tuo dispositivo. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sulle tue immagini."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via il tuo logo per
        convertirlo si fermerebbe nell'istante in cui stacchi la spina."""

