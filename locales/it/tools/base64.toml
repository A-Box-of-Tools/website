[[faq]]
q = "Il mio testo viene caricato da qualche parte?"
a = """
        No. Ogni codificatore e ogni decodificatore di questa pagina è una funzione
        che gira nel tuo browser, sul tuo hardware. Questo strumento non ha nessuna
        funzione di rete: non scarica mai niente e non manda mai niente, e la
        <code>Content-Security-Policy</code> della pagina elenca ogni indirizzo che
        può contattare, nessuno dei quali appartiene a questo sito. È questo il
        motivo per usarlo con un token di accesso o un cookie di sessione: incollare
        una di queste cose nel decodificatore di qualcun altro vuol dire gliela stai
        dando."""

[[faq]]
q = "Il Base64 qui è lo stesso Base64 di tutti gli altri?"
a = """
        Sì: viene verificato contro i vettori di test dell'RFC 4648 e non contro sé
        stesso. Si decodificano entrambi gli alfabeti, quindi un JWT scritto con
        <code>-</code> e <code>_</code> si legge bene quanto uno scritto con
        <code>+</code> e <code>/</code>, e un input spezzato a 64 caratteri viene
        ricongiunto per te. La codifica passa dai byte UTF-8, quindi una lettera
        accentata o un'emoji sopravvive al giro di andata e ritorno."""

[[faq]]
q = "Base64 è una cifratura?"
a = """
        No, e prenderlo per una cifratura è l'errore classico. Base64 è una grafia:
        gli stessi byte, scritti in un alfabeto che sopravvive a un URL, a una mail o
        a una stringa JSON. Chiunque può rileggerlo &mdash; questa pagina lo fa in un
        millisecondo &mdash;, quindi non nasconde niente e non protegge niente. Se
        quello che hai è segreto, gli serve una cifratura vera prima di essere
        codificato, non al suo posto."""

[[faq]]
q = "Perché la decodifica è fallita?"
a = """
        Perché quello che è stato incollato non è esattamente quello che il codec
        credeva di ricevere, e l'errore dice in che senso: un carattere fuori
        dall'alfabeto Base64, riempimento nel posto sbagliato, un segno di percento
        senza due cifre esadecimali dietro, oppure byte che dal Base64 si decodificano
        ma non sono testo UTF-8 &mdash; il che di solito vuol dire che l'originale era
        un file e non una stringa. Il <code>atob</code> del browser avrebbe
        restituito qualcosa di plausibile al suo posto; sentirselo dire è tutto il
        senso di incollare qualcosa in un decodificatore."""

[[faq]]
q = "Che differenza c'è tra le due codifiche per indirizzi web?"
a = """
        Un valore singolo, o l'indirizzo intero. Codificare <em>un valore</em> fa
        l'escape di tutto ciò a cui un URL dà un significato &mdash; le barre, i punti
        interrogativi, le e commerciali &mdash;, che è quello che vuoi per un singolo
        parametro della query. Codificare un <em>URL intero</em> lascia l'indirizzo
        funzionante: le barre e il <code>?</code> restano, e vengono mascherati solo i
        caratteri che un URL non può proprio portare. La prima usata su un indirizzo
        intero rompe l'indirizzo; la seconda usata su un valore perde dove il valore
        finisce."""

[[faq]]
q = "Quanto può essere grande il file?"
a = """
        Qui non c'è nessun limite impostato, perché non c'è nessun server che lo paghi.
        Il tetto vero è il tuo dispositivo: qualche megabyte di testo va benissimo, e
        su un documento molto lungo la pagina aspetta una pausa nella tua digitazione
        prima di ricodificare, invece di litigarti la tastiera."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di prova e
        non c'è limite a quanto incolli. Il sito ha della pubblicità, ed è quella che lo
        mantiene; agli annunci non arriva niente sul tuo testo."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene caricato
        niente, perché uno strumento che spedisse via il tuo testo per decodificarlo si
        fermerebbe nell'istante in cui stacchi la spina."""

