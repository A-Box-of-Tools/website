[[privacy]]
title = "Il tuo documento non ha dove andare."
body = """
 La
      Content-Security-Policy elenca tutti gli indirizzi che questa pagina può
      contattare, e nessuno di quegli indirizzi appartiene a questo sito. Questo
      strumento non aggiunge niente a quella lista, perché non ha una funzione
      di rete propria, nemmeno facoltativa. Non esiste un punto di raccolta in
      cui il tuo file possa finire, e nel codice non c'è niente che ce lo
      manderebbe se anche esistesse."""

[[privacy]]
title = "Il formato sta tutto in questo repository."
body = """
 Un PDF è un elenco di
      oggetti più una tabella che dice dove comincia ciascuno.
      <code>src/objects.js</code> legge quella sintassi,
      <code>src/reader.js</code> segue la tabella, <code>src/writer.js</code> ne
      scrive una nuova, e nessuno dei tre importa qualcosa che sappia fare una
      richiesta. Non viene scaricata nessuna libreria e non viene generato
      niente su un server."""

[[privacy]]
title = "I file cifrati vengono respinti invece che aperti."
body = """

      Un PDF con una password sopra viene rifiutato, compreso quello che gli
      scanner producono con la password vuota e che tecnicamente si aprirebbe.
      Togliere la protezione a un documento è un lavoro diverso
      dall'alleggerirlo, e farlo in silenzio, per conto tuo, sarebbe una cosa
      quantomeno sorprendente."""

[[privacy]]
title = "Toglie, non aggiunge."
body = """
 Il file finito non porta con sé
      data di creazione, né riga del produttore, né il nome dello strumento che
      l'ha fatto. Con la casella spuntata perde anche il pacchetto XMP e i
      blocchi privati che i programmi di impaginazione si lasciano dietro: lo
      stesso ragionamento dello strumento EXIF, applicato a un contenitore
      diverso."""

[[privacy]]
title = "Cosa carica Google, e cosa non gli arriva."
body = """
 Gli script della
      pubblicità e della misurazione arrivano da Google. A nessuno dei due viene
      passato niente sul tuo documento: né un file, né una pagina, né un nome,
      né una dimensione, né un numero di pagine. Ogni riga che legge, decodifica
      o scrive un PDF è servita da questa origine ed è elencata nel
      repository."""

[[privacy]]
title = "Cosa carica il pulsante delle donazioni, e cosa non gli arriva."
body = """

      Il pulsante «Buy me a coffee» in cima lo disegna uno script di
      cdnjs.buymeacoffee.com, che prende i caratteri da Google Fonts. È un link
      e niente di più: non riferisce nessuna visita, e non gli viene passato
      niente su di te o sul tuo documento. Finché non ci clicchi non succede
      niente, e quello a cui arriveresti è il sito di qualcun altro."""

[[privacy]]
title = "Funziona offline."
body = """
 Stacca la rete e tutto quello che sta su
      questa pagina continua a funzionare. È la prova più semplice che ci sia,
      perché uno strumento che spedisse via il tuo documento per comprimerlo si
      fermerebbe."""

[[howto]]
title = "Scegli un PDF."
body = """
 Trascinalo sul riquadro, oppure
      selezionalo a mano. Lo legge il browser direttamente dal tuo disco, e
      mentre lo fa non parte niente per nessuna destinazione."""

[[howto]]
title = "Guarda dove sta il peso."
body = """
 La ripartizione è il senso
      del secondo passo. Se la barra è quasi tutta immagini, questo strumento ha
      qualcosa su cui lavorare. Se è quasi tutta caratteri e contenuto delle
      pagine te lo dirà, e il risparmio onesto sarà di qualche punto
      percentuale: meglio saperlo prima di perderci un minuto."""

[[howto]]
title = "Di' quanto stringere."
body = """
 Le impostazioni con un nome sono
      risoluzioni, non voti vaghi: 96 DPI per leggere su uno schermo, 130 per
      mandarlo via mail, 220 per qualcosa che deve ancora andare in stampa.
      Ognuna viene misurata su quanto grande la figura viene davvero disegnata
      sulla pagina, così una foto messa lì come miniatura non finisce trattata
      come una scansione a pagina intera."""

[[howto]]
title = "Comprimi, e leggi la riga che dice che è stato verificato."
body = """

      Quando la riscrittura è finita, il file prodotto viene riaperto dallo
      stesso lettore che sta su questa pagina e le sue pagine vengono contate.
      Se il conto non torna con l'originale, l'operazione viene dichiarata
      fallita e non ti viene offerto nessun download."""

[[faq]]
q = "Il mio PDF viene caricato da qualche parte?"
a = """
        No. Il file lo legge, lo ricomprime e lo scrive il tuo browser sul tuo
        hardware. Questo strumento non ha un lato server, e la
        <code>Content-Security-Policy</code> della pagina elenca tutti gli
        indirizzi che può contattare, nessuno dei quali appartiene a questo
        sito. Di funzioni di rete facoltative non ne ha proprio."""

[[faq]]
q = "Di quanto si alleggerirà il mio PDF?"
a = """
        Dipende interamente da cosa c'è dentro, ed è per questo che lo strumento
        misura e ti mostra prima di comprimere qualunque cosa. Un documento
        scansionato è quasi tutto fotografie e di solito esce dal 60 al 90% più
        leggero. Un contratto o una tesi invece sono testo, disegno vettoriale e
        caratteri incorporati, tutte cose che erano già compresse da quello che
        le ha prodotte: lì il risparmio è di solito di qualche punto percentuale
        e viene dal reimpacchettare il file e dal buttare quello che non è più
        richiamato da nessuno. Qualunque strumento prometta una percentuale
        fissa senza aver guardato il tuo file sta tirando a indovinare."""

[[faq]]
q = "Comprimere un PDF fa perdere qualità?"
a = """
        Le figure che ha dentro vengono ricodificate, quindi sì, per quelle. Il
        resto non viene toccato: il testo resta testo, selezionabile e
        ricercabile, i caratteri restano interi e il disegno vettoriale viene
        copiato tale e quale. Lo strumento si rifiuta anche di peggiorare
        un'immagine per niente, perché se una ricodifica non esce più leggera
        dell'originale, i byte originali tornano intatti nel documento."""

[[faq]]
q = "Cosa sono qui i DPI, e perché me li chiede?"
a = """
        Un PDF registra quanto grande viene disegnata ogni figura sulla pagina,
        quindi lo strumento può ricavarne la risoluzione effettiva: una
        scansione da 4000 pixel stesa su venti centimetri di carta porta circa
        500 pixel per pollice. Niente su uno schermo, e ben poco sulla carta, sa
        farsene qualcosa, quindi i pixel oltre l'impostazione che scegli sono i
        primi a essere buttati, perché costano qualità che nessuno può vedere. È
        quella misura a fare in modo che un logo messo piccolo non finisca
        trattato come una scansione a pagina intera."""

[[faq]]
q = "Può aprire un PDF protetto da password?"
a = """
        No, ed è voluto. Un documento cifrato viene rifiutato con un messaggio
        che lo dice, anche quando la password è vuota, che è poi il modo in cui
        salvano moltissimi scanner e fotocopiatrici. Togliere la protezione a un
        file è un lavoro diverso dal comprimerlo, e uno strumento che lo facesse
        in silenzio starebbe facendo qualcosa che non gli hai chiesto."""

[[faq]]
q = "Ci sono PDF che non riesce a comprimere?"
a = """
        Qualche immagine al loro interno, sì. Le immagini JPEG 2000, JBIG2 e in
        codifica fax (CCITT) non hanno un decodificatore in nessun browser,
        quindi passano intatte e vengono segnalate come tali; le ultime due, per
        giunta, sono codec pensati per il bianco e nero puro e di solito sono già
        vicine al minimo. Anche le immagini CMYK vengono lasciate stare, perché
        ricodificarle rischia di spostare i colori che una stampante
        produrrebbe. Tutto quello che lo strumento salta viene nominato nei
        risultati, con il motivo."""

[[faq]]
q = "Il file compresso si aprirà ancora dappertutto?"
a = """
        Sì. Il file in uscita è scritto in PDF 1.5, che ogni lettore uscito dal
        2003 in poi capisce, e lo strumento te lo dimostra sul tuo dispositivo:
        riapre il file finito e ne conta le pagine prima di offrirtelo. Moduli,
        link, segnalibri, la struttura di accessibilità e gli eventuali allegati
        incorporati vengono portati dall'altra parte; quello che resta indietro è
        il materiale a cui niente, dentro il documento, faceva più
        riferimento."""

[[faq]]
q = "È gratis, e mi serve un account?"
a = """
        È gratis, e non c'è account, non c'è registrazione, non c'è periodo di
        prova e non c'è limite di dimensione oltre a quello che consente la
        memoria del tuo dispositivo. Il sito ha della pubblicità, ed è quella che
        lo mantiene; agli annunci non arriva niente sul tuo documento."""

[[faq]]
q = "Funziona offline?"
a = """
        Sì. Carica la pagina una volta, poi stacca la connessione e continua a
        funzionare. È anche il modo più semplice per dimostrare che non viene
        caricato niente, perché uno strumento che spedisse via il tuo documento
        per comprimerlo si fermerebbe nell'istante in cui stacchi la spina."""

