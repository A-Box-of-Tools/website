#
# La lista dei previsti sulla roadmap - Italian.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of an Italian list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#

note = "Non ancora costruiti. Sono elencati perché tu possa vedere dove sta andando tutto questo."

[[group]]
id = "images"
name = "Immagini"
items = [
  ["Aggiungere testo", "sopra la foto, oppure in una fascia sopra di essa"],
  ["AVIF", "il formato che un solo browser scrive e tutti gli altri si limitano a leggere"],
  ["Anonimizzare un DICOM", "togliere il paziente da un esame senza toccare l'immagine"],
]

[[group]]
id = "gif"
name = "GIF e animazione"
items = [
  ["Da GIF a MP4 o WebM", "la stessa animazione, di solito un decimo del peso"],
  ["Modificare una GIF", "ridimensionare, ritagliare, ruotare, invertire o cambiarne la velocità"],
  ["WebP animata", "la stessa animazione a una frazione del peso: l'unica qui che richiede un encoder incluso"],
]

[[group]]
id = "video"
name = "Video"
items = [
  ["Ridimensionare", "fino a una dimensione che si riesca davvero a mandare"],
  ["Ruotare", "per la clip girata di traverso, senza decodificare un solo fotogramma"],
  ["Togliere l'audio a un video", "eliminare il suono e lasciare intatta l'immagine"],
  ["Convertire in MP4", "qualunque cosa sia uscita dalla telecamera, nel file che si riesce davvero a caricare"],
  ["Incidere i sottotitoli", "un file SRT disegnato dentro l'immagine"],
  ["Convertire i sottotitoli", "SRT, VTT, ASS, SBV e LRC in qualunque direzione, con i tempi che si possono spostare"],
]

[[group]]
id = "audio"
name = "Audio"
items = [
  ["Convertire formato", "MP3, WAV e Opus, in qualunque direzione"],
]

[[group]]
id = "documents"
name = "Documenti e PDF"
items = [
  ["Ruotare e ritagliare le pagine", "raddrizzare una scansione storta, oppure tagliarne i margini"],
  ["Estrarre le immagini", "tirare fuori le figure da un documento"],
  ["Oscurare un PDF", "togliere davvero le parole, invece di disegnarci sopra un rettangolo nero"],
  ["Scanner di documenti", "la foto di una pagina, raddrizzata e ripulita in un documento"],
]

[[group]]
id = "beyond"
name = "Oltre i media"
items = [
  ["Hash e checksum", "verificare che un download sia il file che dichiara di essere, senza consegnarlo a nessuno"],
  ["CSV e JSON", "convertire nei due sensi, e rimettere in ordine quello che ha esportato il foglio di calcolo"],
  ["Certificati e chiavi", "leggere un certificato o una richiesta di firma senza incollarla nel server di qualcun altro"],
]
