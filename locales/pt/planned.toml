#
# A lista planejada da página de roteiro - português do Brasil.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Portuguese list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#
# Os nomes de formato ficam como estão: JPG, HEIC, AVIF, MP4, SRT e CSV são a
# mesma coisa em qualquer idioma, e traduzi-los só tornaria a lista mais difícil
# de reconhecer para quem já sabe o que está procurando.
#

note = "Ainda não construídas. Listadas para você ver aonde isto vai dar."

[[group]]
id = "images"
name = "Imagens"
items = [
  ["Escrever na imagem", "por cima da foto, ou numa tarja de legenda acima dela"],
  ["AVIF", "o formato que só um navegador escreve e os outros apenas leem"],
  ["Anonimizar DICOM", "tirar o paciente de um exame sem mexer na imagem"],
]

[[group]]
id = "gif"
name = "GIF e animação"
items = [
  ["GIF para MP4 ou WebM", "a mesma animação, em geral com um décimo do tamanho"],
  ["Editar um GIF", "redimensionar, cortar, girar, inverter ou mudar a velocidade"],
  ["WebP animado", "a mesma animação por uma fração do tamanho &mdash; e o único aqui que precisa de um codificador embarcado"],
]

[[group]]
id = "video"
name = "Vídeo"
items = [
  ["Redimensionar", "até um tamanho que o envio realmente aceite"],
  ["Girar", "para aquele clipe que foi filmado deitado, sem decodificar um único quadro"],
  ["Tirar o som de um vídeo", "jogar o som fora e não encostar na imagem"],
  ["Converter para MP4", "seja lá o que saiu da câmera, no arquivo que o site aceita"],
  ["Gravar legendas na imagem", "um arquivo SRT desenhado dentro do quadro"],
  ["Converter legendas", "SRT, VTT, ASS, SBV e LRC em qualquer direção, com os tempos ajustáveis"],
]

[[group]]
id = "audio"
name = "Áudio"
items = [
  ["Converter formato", "MP3, WAV e Opus, em qualquer direção"],
]

[[group]]
id = "documents"
name = "Documentos e PDF"
items = [
  ["Girar e cortar páginas", "endireitar uma digitalização que veio deitada, ou aparar as margens"],
  ["Extrair imagens", "tirar as figuras de volta de dentro de um documento"],
  ["Tarjar um PDF", "tirar as palavras de dentro, em vez de pintar um retângulo preto por cima"],
  ["Digitalizador de documentos", "a foto de uma página, endireitada e limpa, virando documento"],
]

[[group]]
id = "beyond"
name = "Além de mídia"
items = [
  ["CSV e JSON", "converter nos dois sentidos, e arrumar o que a planilha exportou"],
  ["Certificados e chaves", "ler um certificado ou um pedido de assinatura sem colá-lo no servidor de ninguém"],
]
