[[privacy]]
title = "As suas imagens não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todo endereço que esta página pode contatar, e
      nenhum deles é nosso. Aqui não existe um ponto de coleta onde os seus arquivos
      pudessem parar, nem nada no código que os mandasse para lá se existisse. Isto
      já disse <code>connect-src 'none'</code>, que não abria exceção; a publicidade
      custou isso, e dizer isso faz parte do acordo."""

[[privacy]]
title = "O codificador são quatro arquivos deste repositório."
body = """
 Um GIF precisa de um
      quantizador de cores e de um compressor LZW, e o navegador não traz nenhum dos
      dois, então os dois estão escritos aqui, em <code>src/quantize.js</code> e
      <code>src/lzw.js</code>, com o contêiner em <code>src/gif.js</code>. Não se
      busca nada para fazer um, e não existe motor nenhum baixado no primeiro uso."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre as suas imagens: nem arquivo, nem miniatura, nem nome, tamanho ou
      contagem. Toda linha que lê, decodifica, desenha ou comprime uma imagem é
      servida desta origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script de
      cdnjs.buymeacoffee.com e pega as letras no Google Fonts. Ele não é mais do que
      um link: não avisa ninguém da sua visita e não recebe nada sobre você nem sobre
      as suas imagens. Nada acontece enquanto você não clicar, e o que você abriria ao
      clicar é o site de outra pessoa."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Essa é a prova mais simples de todas: uma ferramenta que mandasse
      as suas imagens embora para virarem GIF pararia no instante em que você tirasse
      da tomada."""

[[howto]]
title = "Escolha as suas imagens."
body = """
 Arraste uma pasta até o seletor, ou
      escolha os arquivos na mão. O navegador lê direto do seu disco, e nesse
      meio-tempo nada sai daqui."""

[[howto]]
title = "Ponha na ordem em que devem passar."
body = """
 Arraste pela alça, ou use as
      setas. &ldquo;Ordenar por nome&rdquo; conta do jeito que você espera, então
