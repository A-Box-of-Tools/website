[[howto]]
title = "Diga quanto tempo cada quadro fica."
body = """
 Meio segundo cada um é
      apresentação de slides; um vinte avos é animação. Dê o mesmo tempo para todos de
      uma vez, ou deixe um deles demorar mais."""

[[howto]]
title = "Escolha um tamanho, e como as cores são escolhidas."
body = """
 Um GIF cresce com a
      área e com a quantidade de quadros, e não existe controle de qualidade para
      trazer isso de volta para baixo, então o tamanho é o ajuste que mais importa.
      256 cores por quadro é o padrão e o que fica melhor; uma paleta compartilhada
      sai menor e mais estável."""

[[howto]]
title = "Faça o GIF e baixe."
body = """
 Ele é montado no seu próprio hardware, então o
      tempo depende do seu computador e não de uma fila. A animação pronta toca na
      página antes de você salvar."""

[[faq]]
q = "As minhas imagens são enviadas para algum lugar?"
a = """
        Não. As suas imagens são lidas, desenhadas, quantizadas e comprimidas pelo seu
        próprio navegador, no seu próprio hardware. Esta ferramenta não tem lado
        servidor, e a <code>Content-Security-Policy</code> da página lista todo
        endereço que ela pode contatar: nenhum é nosso. Tire da tomada e ela continua
        fazendo GIF."""

[[faq]]
q = "Quais formatos de imagem dá para usar?"
a = """
        Qualquer formato de imagem parada que o seu navegador saiba decodificar, o que
        na prática quer dizer JPG, PNG, WebP, GIF, AVIF e, em aparelhos da Apple,
        HEIC. Aqui não existe uma lista separada para manter atualizada, porque
        decodificar é trabalho do navegador e não nosso."""

[[faq]]
q = "Por que o meu GIF ficou tão grande?"
a = """
        Porque um GIF guarda cada quadro como pixels inteiros. Não tem compensação de
        movimento, nada é guardado como &ldquo;igual da vez passada, só que
        deslocado&rdquo;, e não tem botão de qualidade: o tamanho é mais ou menos a
        área vezes a quantidade de quadros, e só três coisas fazem ele baixar.
        <br><br>
        Deixe menor: cortar o tamanho pela metade deixa o arquivo em um quarto. Use
        menos quadros, ou segure cada um por mais tempo. Desça para 64 ou 32 cores e
        desligue o dithering, que em arte chapada custa menos do que parece e em
        fotografia custa muito. Se mesmo assim não couber, a resposta honesta é que o
        que você está fazendo é um vídeo, e um MP4 disso vai ter talvez um décimo do
        tamanho."""

[[faq]]
q = "Quão rápido um GIF pode tocar?"
a = """
        Não tão rápido quanto o número sugere. O formato guarda a duração de cada
        quadro em centésimos de segundo, e desde os anos 1990 os navegadores empurram
        qualquer valor abaixo de dois centésimos para um décimo de segundo. Essa regra
        foi escrita para os globos giratórios da época e nunca foi tirada. Então uma
        duração de 0,01 s não toca a 100 quadros por segundo; toca a 10. É por isso
        que esta ferramenta não oferece nada abaixo de 0,02 s, e 0,05 s (20 quadros
        por segundo) é mais ou menos o mais rápido que vale a pena pedir."""

[[faq]]
q = "O que o ajuste de paleta muda?"
a = """
        Um quadro de GIF guarda no máximo 256 cores, e alguém precisa escolher quais.
        <br><br>
        <strong>As melhores cores para cada quadro</strong> escolhe 256 para cada
        imagem separadamente, o que fica mais nítido e é a resposta certa para um
        conjunto de fotografias sem relação entre si. <strong>Uma paleta para o GIF
        inteiro</strong> monta uma tabela só a partir de todos os quadros de uma vez.
        Gera um arquivo menor e acaba com aquele piscar que aparece quando a paleta
        pula de um quadro para outro dentro da mesma cena, então é o que se escolhe
        quando os quadros são uma sequência e não uma coleção."""

[[faq]]
q = "Dá para manter o fundo transparente?"
a = """
        Dá, se as suas imagens tiverem: mude &ldquo;Transparência&rdquo; para
        &ldquo;Manter as áreas transparentes&rdquo;. Uma coisa para saber antes. A
        transparência de um GIF é um bit só, um pixel está invisível ou pintado por
        completo, sem meio-termo, então bordas suavizadas, sombras macias e tudo o que
        se esvai ganham uma borda dura no lugar. Se a sua animação vai para um fundo
        cuja cor você conhece, achatar em cima dessa cor vai ficar melhor."""

[[faq]]
q = "Tem limite de quantas imagens dá para usar?"
a = """
        Não tem limite embutido na ferramenta. O teto de verdade é a memória do seu
        computador e a sua paciência com o arquivo que sai: as imagens são lidas uma de
        cada vez, então cem quadros vai tranquilo, mas cem quadros a 640 px também é um
        GIF enorme. Veja acima, &ldquo;Por que o meu GIF ficou tão grande?&rdquo;."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste. No resultado também
        não tem marca d'água. O site exibe publicidade, e é ela que paga a conta; os
        anúncios não recebem nada sobre as suas imagens."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela continua
        funcionando. Esse é também o jeito mais simples de provar que nada está sendo
        enviado: uma ferramenta que mandasse as suas imagens embora para serem
        processadas pararia no instante em que você tirasse da tomada."""

