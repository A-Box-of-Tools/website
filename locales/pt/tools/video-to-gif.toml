[[howto]]
title = "Marque o trecho."
body = """
 Toque o clipe e aperte <kbd>I</kbd> onde ele
      deve começar e <kbd>O</kbd> onde ele deve terminar, ou arraste as alças na
      barra. Um GIF tem poucos segundos, e este é o ajuste que decide se o arquivo
      sai pequeno ou enorme, muito mais do que os outros dois."""

[[howto]]
title = "Escolha a largura e a taxa de quadros."
body = """
 480 pixels de
      largura e 12 quadros por segundo dão conta da maior parte do que um GIF
      serve para fazer. Cortar a largura pela metade deixa os pixels em um quarto,
      e doze quadros por segundo já se leem como movimento sem pagar por quadros
      que ninguém vê."""

[[howto]]
title = "Faça, e baixe."
body = """
 Os quadros são lidos, uma paleta de 256 cores é
      escolhida para a animação inteira, e cada quadro é escrito como só a parte
      da imagem que mudou. Ele toca na página quando fica pronto, e é esse mesmo
      arquivo que o download entrega."""

[[faq]]
q = "Meu vídeo é enviado para algum lugar?"
a = """
        Não. Quem lê, amostra e converte é o seu próprio navegador, no seu próprio
        hardware. Não existe lado de servidor nesta ferramenta, e a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum deles deste site. Se você prefere conferir a
        acreditar, desligue a internet e faça um GIF assim mesmo."""

[[faq]]
q = "Quais formatos de vídeo posso converter?"
a = """
        MP4, M4V e MOV são lidos diretamente, seja lá o que houver dentro deles:
        H.264, HEVC, AV1 ou VP9, desde que o seu navegador saiba decodificar aquele
        codec. Qualquer outra coisa que o seu navegador consiga tocar, e aí o caso
        mais óbvio é o WebM, é lida movendo o reprodutor até cada instante, o que é
        mais lento e um pouco menos exato sobre qual quadro cai onde. Um arquivo que
        o navegador não consegue nem ler nem tocar, o que na prática significa AVI,
        WMV, FLV e a maioria dos MKVs, é recusado com uma mensagem dizendo isso, em
        vez de falhar no meio do caminho."""

[[faq]]
q = "Por que o meu GIF está tão grande?"
a = """
        Porque GIF é um formato de 1987 que guarda imagens inteiras em vez de
        movimento. Não tem como fazer, de um clipe de cinco segundos, um GIF tão
        pequeno quanto o MP4 de cinco segundos de onde ele veio. É rotina um GIF
        ficar dez vezes maior que o vídeo. Os três ajustes que de fato decidem isso
        são, nesta ordem: quanto dura o trecho, quão larga é a imagem e quantos
        quadros por segundo. Cortar a largura pela metade deixa os pixels em um
        quarto, e são os pixels que custam."""

[[faq]]
q = "Por que só 256 cores?"
a = """
        É o formato: um GIF carrega uma tabela de no máximo 256 cores e guarda cada
        pixel como um número apontando para ela. Esta ferramenta escolhe essas 256
        contando as cores de todos os quadros do seu trecho e dividindo-as em 256
        grupos, pelo corte pela mediana, que é o método padrão. Assim a paleta cai
        bem no seu clipe, em vez de ser um conjunto fixo de cores. Onde uma cor está
        faltando, o dithering mistura as duas mais próximas para um gradiente
        continuar sendo um gradiente, em vez de virar faixas."""

[[faq]]
q = "O que o ajuste de dithering faz?"
a = """
        Ele troca um pouco de ruído por muito menos faixamento. Ligado, um céu que de
        outro jeito viraria quatro faixas chapadas continua um gradiente, ao custo de
        uma textura tênue e de um arquivo maior. Desligado, a imagem fica mais
        chapada e o arquivo menor, o que serve para gravações de tela, desenho de
        traço e qualquer coisa já feita de cor chapada. O dithering usado aqui é
        ordenado em vez de ser por difusão de erro, então um fundo que não muda fica
        perfeitamente parado entre os quadros, sem fervilhar."""

[[faq]]
q = "Existe limite de duração ou de tamanho?"
a = """
        O limitado é o trecho, e por memória, não por regra: todo quadro dele fica na
        memória de uma vez enquanto a paleta é escolhida. Por isso a página calcula
        o que os seus ajustes custariam e avisa antes de você começar. Ela prefere
        recusar a deixar a aba ficar sem memória e sumir. Um trecho mais curto, uma
        largura menor ou uma taxa de quadros mais baixa baixam essa conta."""

[[faq]]
q = "Ele mantém o som?"
a = """
        Um GIF não consegue carregar som. Não existe versão do formato com áudio, e
        esse é o motivo principal de a web ter, na maior parte, trocado os GIFs por
        vídeo mudo em laço. Se o som importa, fique com o vídeo: o
        <a href="../aparar-video/">Aparador de vídeo</a> tira um trecho dele sem
        recodificar um quadro."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem marca
        d'água. O site exibe publicidade, e é ela que paga a conta. Os anúncios não
        recebem nada sobre o seu vídeo."""

