[[privacy]]
title = "Seus vídeos não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todos os endereços que esta página pode
      acessar, e nenhum deles é deste site. Não existe aqui um endpoint onde o seu
      arquivo pudesse ser recolhido, e não existe no código nada que o mandaria
      mesmo que existisse."""

[[privacy]]
title = "Nada aqui vai buscar coisa alguma."
body = """
 Esta ferramenta não tem função de
      rede nenhuma: nenhum endereço para colar, nada para baixar, nenhum motor
      buscado no primeiro uso. Cada byte que encosta no seu vídeo veio desta
      origem quando a página carregou."""

[[privacy]]
title = "A decodificação e a codificação são locais."
body = """
 Os quadros passam pelo
      WebCodecs no seu próprio navegador, ou pelo mesmo motor de reprodução que
      exibiria o clipe para você de qualquer jeito. O arquivo pronto é montado na
      memória deste computador e vai direto para um download."""

[[privacy]]
title = "A maior parte do arquivo nem chega a ser lida."
body = """
 Um timelapse
      precisa de um quadro a cada poucos segundos, então a ferramenta lê o trecho
      curto de arquivo em volta de cada um desses instantes e pula o resto. É uma
      decisão de velocidade e não de privacidade, mas vale saber assim mesmo: até
      aqui, no seu próprio computador, a maior parte do seu vídeo nunca é
      aberta."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre o seu vídeo: nem um arquivo, nem um quadro, nem um nome, um tamanho ou
      uma duração. Toda linha que lê, decodifica, escolhe ou codifica é servida
      desta origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script
      vindo de cdnjs.buymeacoffee.com e busca as letras dele no Google Fonts. É um
      link e nada mais: não informa visita nenhuma, e não recebe nada sobre você
      nem sobre o seu vídeo."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Não existe prova mais simples que essa."""

[[howto]]
title = "Escolha um vídeo."
body = """
 Arraste um MP4, MOV, M4V ou WebM para
      o seletor, ou procure um à mão. O navegador lê direto do seu disco, e
      enquanto isso nada sai para lugar nenhum."""

[[howto]]
title = "Diga quanto mais rápido."
body = """
 Aperte uma das velocidades, ou
      digite a sua. Se preferir dizer quanto o resultado deve durar, algo como
      &ldquo;que caiba em vinte segundos&rdquo;, digite isso e a velocidade sai
      sozinha."""

[[howto]]
title = "Confira o intervalo."
body = """
 A linha embaixo da velocidade diz o
      que vai acontecer de verdade: um quadro a cada tantos segundos do original.
      É o número que se ajustaria numa câmera, e é o que vale a pena conferir
      antes de começar."""

[[howto]]
title = "Faça e baixe."
body = """
 O trabalho acontece no seu próprio
      hardware, então o tempo que leva depende do seu computador e não de uma
      fila. O vídeo pronto vai direto para os downloads do seu navegador."""

[[faq]]
q = "Meu vídeo é enviado para algum lugar?"
a = """
        Não. É o seu próprio navegador que lê, decodifica, escolhe os quadros e
        codifica, no seu próprio hardware. Esta ferramenta não tem lado servidor,
        e a <code>Content-Security-Policy</code> da página lista todos os
        endereços que ela pode acessar &mdash; nenhum deles é deste site. Se você
        prefere conferir a acreditar, desligue a internet e faça um timelapse
        assim mesmo."""

[[faq]]
q = "O que a velocidade quer dizer exatamente?"
a = """
        A razão entre o que entra e o que sai. A 60&times;, uma hora de gravação
        vira um minuto, seja qual for a taxa de quadros em que você assiste. Por
        baixo, a ferramenta pega um quadro a cada <em>velocidade &divide; quadros
        por segundo</em>: 60&times; a 30 quadros por segundo é um a cada dois
        segundos. A página mostra esse intervalo antes de você começar, porque é o
        número que diz o que está acontecendo de verdade."""

[[faq]]
q = "Quais formatos de vídeo posso acelerar?"
a = """
        MP4, M4V e MOV são lidos direto, tenham dentro o que tiverem: H.264,
        HEVC, AV1 ou VP9, desde que o seu navegador saiba decodificar aquele
        codec. Todo o resto que o seu navegador consegue tocar, WebM na frente, é
        lido levando o player do próprio navegador até cada instante, o que
        funciona em qualquer formato que ele abra. Um arquivo que o navegador não
        consegue nem ler nem tocar, na prática AVI, WMV, FLV e a maioria dos MKV,
        é recusado com uma mensagem dizendo isso, em vez de falhar no meio do
        caminho. O que sai é sempre um MP4."""

[[faq]]
q = "Por que o timelapse não tem som?"
a = """
        Porque não há nada que valha a pena guardar. Som a trinta vezes a
        velocidade não é fala nem música, é um chiado; e a alternativa, deixar o
        áudio na velocidade original embaixo de uma imagem que disparou na frente,
        seria um clipe diferente do que você pediu. A trilha cai fora, e é boa
        parte do motivo de uma hora de vídeo sair com poucos megabytes. Se o que
        você quer é o áudio sozinho, o
        <a href="../editar-audio/">Editor de áudio</a> salva ele."""

[[faq]]
q = "É mais rápido do que converter o vídeo inteiro?"
a = """
        Muito mais, e é para isso que o arquivo é lido direto. Um quadro só pode
        ser decodificado começando pelo quadro-chave que vem antes dele, mas nada
        obriga a guardar os do meio: um timelapse a 60&times; de uma hora
        decodifica alguns milhares de quadros em vez de cem mil. O resumo diz
        exatamente quantos ele vai ler antes de você apertar o botão."""

[[faq]]
q = "Isso custa qualidade?"
a = """
        Os quadros guardados são codificados uma segunda vez, e isso custa um
        pouco. Não dá para evitar, porque o clipe pronto mostra esses quadros em
        momentos para os quais nada tinha sido codificado no arquivo original. O
        que esta ferramenta gasta a mais do que as outras ferramentas de vídeo
        daqui é o bitrate, e é de propósito: dois quadros separados por dois
        segundos têm muito menos em comum do que dois separados por um trinta
        avos de segundo, então o codec tem menos a reaproveitar, e um número
        pensado para gravação comum sairia quadriculado."""

[[faq]]
q = "Existe limite de tamanho ou de duração?"
a = """
        Não há limite embutido na ferramenta, e o arquivo também não vai inteiro
        para a memória: são lidos só trechos curtos em volta de cada instante. O
        teto prático é o timelapse pronto, que é montado na memória antes de você
        baixar, e um timelapse é curto por definição. O resumo mostra mais ou
        menos o tamanho dele antes de você começar."""

[[faq]]
q = "Posso acelerar só um pedaço do clipe?"
a = """
        Aqui não. Esta ferramenta pega o clipe inteiro, do primeiro quadro ao
        último. Corte antes o trecho que você quer com o
        <a href="../aparar-video/">Aparador de vídeo</a>, que faz isso sem
        recodificar um único quadro, e acelere o que sair de lá."""

[[faq]]
q = "É grátis? Preciso de conta?"
a = """
        É grátis, e não tem conta, cadastro, período de teste nem marca d'água. O
        site é pago por publicidade, e os anúncios não recebem nada sobre o seu
        vídeo."""

