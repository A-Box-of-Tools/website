title = "Conversor de YAML para JSON &mdash; nos dois sentidos, sem enviar nada"
description = "Converta YAML para JSON e JSON para YAML no seu navegador. Ele lê YAML 1.2, então yes e no continuam sendo texto, e diz exatamente o que cada sentido perde. Nada é enviado: um arquivo de configuração nunca sai do seu computador."
