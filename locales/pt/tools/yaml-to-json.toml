name = "Conversor de YAML para JSON"
heading = "YAML&nbsp;para&nbsp;JSON <span class=\"h1-kw\">&mdash; e de JSON de volta para YAML</span>"
tagline = "Os dois sentidos, e ele diz o que cada um custa. Nada disso é colado no servidor de outra pessoa."

title = "Conversor de YAML para JSON &mdash; nos dois sentidos, sem enviar nada"
description = "Converta um subconjunto compatível de YAML 1.2 para JSON e de JSON para YAML no navegador. Âncoras, aliases, tags e vários documentos são recusados; JSON perde comentários. Sem upload."
og_title = "Converter YAML sem colar num servidor"
og_description = "Um conversor de YAML e JSON rodando no seu próprio computador. As chaves mantêm a ordem, os números mantêm os dígitos, e o que você cola não vai a lugar nenhum."
og_image_alt = "Conversor de YAML para JSON - os dois sentidos, sem envio"

pledge = """
    Converter é aritmética sobre um texto, feita aqui, nesta página. Os dois
    analisadores são escritos à mão e estão em <code>src/</code> &mdash;
    <code>shared/parse-yaml.js</code> e <code>shared/parse-json.js</code> &mdash; e não há mais nada. Esta
    ferramenta não tem função de rede de espécie alguma &mdash; nada para
    buscar, nada para enviar &mdash; e aqui isso importa mais do que em quase
    qualquer outro canto deste site: um arquivo YAML costuma ser uma
    configuração de deploy, e uma configuração de deploy costuma estar cheia de
    nomes de host, nomes de bucket e segredos."""

live_hint = """
      Você não precisa acreditar na nossa palavra: abra o DevTools, olhe a aba de
      rede e converta alguma coisa. Nenhuma requisição carrega um caractere do
      que você colou. Ou desconecte da internet e converta assim mesmo."""

read_first = """
, <code>src/shared/parse-yaml.js</code> para o leitor que
      recusa uma âncora em vez de adivinhar o que ela queria dizer, e
      <code>src/convert.js</code> para entender por que uma conversão é um
      analisador e um impressor, sem nada no meio que conheça os dois formatos ao
      mesmo tempo."""

howto_heading = "Como converter YAML para JSON sem enviar o arquivo"

card = """
            Transforme YAML em JSON ou JSON em YAML, e saiba o que a viagem
            custa. Cole uma configuração de deploy sem entregar a ninguém."""

