[[privacy]]
title = "Suas imagens não têm para onde ir."
body = "A Content-Security-Policy lista todos os endereços que esta página pode contatar, e nenhum pertence a este site. Não existe aqui um endereço capaz de coletar seus arquivos, nem código que os enviaria se existisse."

[[privacy]]
title = "A transparência é preservada, como a maioria das pessoas precisa."
body = "WebP tem canal alfa, assim como PNG. Um logotipo com fundo transparente continua com fundo transparente: não é preciso escolher cor nem preencher nada. Essa é a diferença em relação ao conversor de <a href=\"/pt/webp-para-jpg/\">WebP para JPG</a>, que precisa perguntar, porque JPEG não tem canal alfa."

[[privacy]]
title = "A codificação sem perdas é verificada."
body = "Um canvas não tem uma opção explícita de WebP sem perdas &mdash; o navegador escolhe a codificação conforme a qualidade solicitada, e os navegadores atuais usam a codificação sem perdas no máximo do controle. Esse comportamento vem do mecanismo do navegador, não de uma garantia da especificação. Por isso verificamos: cada arquivo gravado é lido novamente, e a linha informa se os bytes realmente usam a codificação sem perdas. Se um navegador deixar de respeitar isso, você será avisado na hora, em vez de descobrir depois."

[[privacy]]
title = "O que um canvas não preserva."
body = "A imagem é decodificada e desenhada em um canvas, que contém apenas pixels. Portanto, blocos de texto, perfil de cor ICC e blocos XMP do PNG não são preservados. Os pixels são &mdash; é esse o sentido de sem perdas aqui &mdash; mas os metadados ao redor deles não. Se isso importar, o <a href=\"/pt/remover-dados-exif/\">Visualizador e removedor de EXIF</a> lê e grava esses dados."

[[privacy]]
title = "O que o Google carrega e o que não recebe."
body = "Os scripts de anúncios e medição vêm do Google, e o botão de doação vem do Buy Me a Coffee. Nenhum recebe informações sobre suas imagens. Todo o código que lê, decodifica ou grava um arquivo é servido por este site e está no repositório."

[[privacy]]
title = "Funciona offline."
body = "Carregue a página uma vez e desconecte a rede: a ferramenta continua igual. Essa é a prova mais simples: um conversor que enviasse suas imagens para processamento não conseguiria fazer isso."

[[howto]]
title = "Escolha seus arquivos PNG."
body = "Arraste-os para a área de seleção ou escolha-os manualmente. Cada arquivo é identificado pelos primeiros bytes, e não pelo nome. Um arquivo que realmente é JPEG é recusado com uma mensagem explicando o formato, em vez de ser convertido em uma cópia de si mesmo. A lista identifica as áreas transparentes, porque é o que as pessoas mais receiam perder."

[[howto]]
title = "Escolha sem perdas ou menor."
body = "Sem perdas preserva cada pixel opaco do PNG e ainda gera um arquivo menor &mdash; ideal para capturas de tela, diagramas, logotipos e imagens com texto. Menor ativa o controle de qualidade e é a escolha para fotografias, em que a diferença costuma ser imperceptível e a economia é enorme."

[[howto]]
title = "Clique em &ldquo;Converter&rdquo; e confira o resultado."
body = "Cada resultado informa o novo tamanho e a comparação com o original, além da codificação realmente gravada pelo navegador &mdash; sem perdas, ou com perdas na qualidade escolhida. Essa informação é lida do arquivo pronto, em vez de apenas repetir a configuração."

[[howto]]
title = "Baixe um arquivo por vez ou todos juntos."
body = "Um arquivo oferece um botão para baixar; com dois ou mais, também é possível baixar tudo em ZIP. Arquivos com o mesmo nome recebem um número antes da extensão, para que nenhum substitua outro silenciosamente no arquivo ZIP."

[[faq]]
q = "Minha imagem é enviada para algum lugar?"
a = "Não. O arquivo é lido, decodificado e gravado pelo seu navegador, no seu computador. Esta ferramenta não tem nenhum recurso de rede &mdash; não busca nem envia nada &mdash; e a <code>Content-Security-Policy</code> da página lista todos os endereços que ela pode contatar, nenhum deles pertencente a este site."

[[faq]]
q = "A transparência é preservada?"
a = "Sim, nos dois modos. Esse é o principal motivo para converter PNG em WebP em vez de JPEG. WebP tem um canal alfa de verdade, então um logotipo com fundo transparente continua com fundo transparente &mdash; sem escolher cor nem preencher o fundo. Antes da conversão, a lista informa se cada arquivo tem transparência; depois, o resultado confirma que ela foi preservada."

[[faq]]
q = "Qual é a diferença entre sem perdas e menor?"
a = "Sem perdas significa que cada pixel opaco do WebP é igual ao do PNG, e o arquivo ainda fica menor &mdash; normalmente de um quinto a um terço menor, porque a codificação sem perdas do WebP é mais eficiente que a do PNG. A ressalva envolve pixels parcialmente transparentes e tem uma pergunta própria abaixo. Menor usa a codificação com perdas do WebP, que descarta detalhes pouco perceptíveis e pode reduzir uma fotografia a um décimo do tamanho. A regra prática: texto, cores uniformes e bordas nítidas pedem sem perdas; fotografias pedem o outro modo."

[[faq]]
q = "Vocês dizem &ldquo;cada pixel opaco&rdquo;. E os parcialmente transparentes?"
a = "Eles podem mudar muito pouco, por causa do canvas, e não do WebP. O navegador armazena uma imagem no canvas com as cores já multiplicadas pela transparência, e essa multiplicação não pode ser desfeita com exatidão &mdash; quanto menos visível o pixel, menos da cor original sobrevive ao cálculo. Todo conversor no navegador tem essa característica, inclusive este, porque o canvas faz a passagem entre os formatos. <br><br> Na prática, um pixel totalmente opaco é preservado bit a bit, assim como um totalmente invisível. Entre os dois extremos, a cor armazenada pode mudar &mdash; aqui medimos diferenças de até 63 em 255 para pixels com menos de um quarto de opacidade, e de no máximo 4 nos demais. Isso não é visível, porque os pixels cuja cor mais muda são os que menos contribuem para a imagem: um pixel quase invisível mostra uma cor quase invisível, qualquer que seja o valor armazenado. Essa diferença só ocorre, por exemplo, nas bordas suavizadas de um logotipo, que continuam com a mesma aparência. <br><br> Se precisar de uma cópia exata para arquivamento, mantenha o PNG. Se precisar da mesma aparência com um arquivo um terço menor, é isso que esta ferramenta faz."

[[faq]]
q = "Como vocês sabem que o arquivo realmente é sem perdas?"
a = "Porque o arquivo pronto é lido e verificado, em vez de apenas repetir a configuração. WebP armazena os pixels em um de dois blocos &mdash; <code>VP8L</code> para codificação sem perdas e <code>VP8&nbsp;</code> para codificação com perdas. A página verifica o bloco gravado e informa na linha do resultado. Isso é necessário porque o canvas não tem uma opção explícita de sem perdas: pedir esse modo significa solicitar a qualidade máxima e confiar que o navegador escolha a codificação correta. Todos os navegadores atuais fazem isso. A página verifica mesmo assim."

[[faq]]
q = "Um WebP abre em qualquer lugar?"
a = "Na web, sim &mdash; Chrome, Edge, Firefox e Safari exibem WebP desde 2020, então um site já não precisa oferecer outro formato como alternativa. Fora do navegador, a compatibilidade varia: Windows e macOS já exibem prévias, mas alguns programas antigos, formulários de upload e muitos leitores de livros digitais ainda recusam WebP. Se o destino não aceitar o formato, use o conversor de <a href=\"/pt/webp-para-jpg/\">WebP para JPG</a>, que faz a conversão no sentido contrário."

[[faq]]
q = "Por que meu PNG é tão grande?"
a = "Porque PNG é sem perdas, e fotografias não comprimem bem desse modo. PNG é excelente para capturas de tela e logotipos, com grandes áreas repetidas, mas inadequado para fotografias, em que quase nada se repete &mdash; uma foto de celular salva como PNG costuma ser dez vezes maior que o JPEG da mesma imagem. É justamente nesse caso que o modo com perdas faz sentido. Se o arquivo precisa ficar abaixo de um tamanho específico, o <a href=\"/pt/comprimir-imagem/\">Compressor de imagens</a> permite definir um tamanho-alvo em vez da qualidade."

[[faq]]
q = "A data, a câmera e a localização são preservadas?"
a = "Não. A imagem é desenhada em um canvas, que contém apenas pixels, e os metadados ficam para trás. Em PNG isso normalmente tem pouca importância &mdash; a maioria nem contém dados de câmera. Para ver o que um arquivo guarda, o <a href=\"/pt/remover-dados-exif/\">Visualizador e removedor de EXIF</a> lê e grava esses dados sem recomprimir a imagem."

[[faq]]
q = "Posso converter uma pasta inteira de uma vez?"
a = "Sim. Adicione quantos arquivos quiser &mdash; não há limite de quantidade ou tamanho, porque não existe servidor pagando pelo processamento. Cada arquivo tem sua própria linha e botão para baixar; com dois ou mais, você também pode baixar tudo em um ZIP, com a economia total indicada no topo."

[[faq]]
q = "É grátis? Preciso de uma conta?"
a = "É grátis, sem conta, login, período de teste ou marca-d'água. Os anúncios sustentam o site e não recebem informações sobre suas imagens."

[[faq]]
q = "Funciona offline?"
a = "Sim. Carregue a página uma vez e desconecte a internet: ela continua funcionando exatamente como antes. Essa também é a prova mais forte de que nada é enviado: um conversor que enviasse seus arquivos para processamento pararia assim que você se desconectasse, e este não para."

