[[privacy]]
title = "Os seus vídeos não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todo endereço que esta página pode contatar, e
      nenhum deles é nosso. Aqui não existe um ponto de coleta onde o seu arquivo
      pudesse parar, nem nada no código que o mandasse para lá se existisse."""

[[privacy]]
title = "Aqui nada busca nada."
body = """
 Esta ferramenta não tem função de rede nenhuma:
      não tem endereço para colar, não tem nada para baixar, não tem motor nenhum
      baixado no primeiro uso. Cada byte que encosta no seu vídeo veio desta origem
      quando a página carregou."""

[[privacy]]
title = "A decodificação e a codificação são locais."
body = """
 Os quadros passam pelo
      WebCodecs no seu próprio navegador, ou pelo mesmo motor de reprodução que
      mostraria o vídeo de qualquer jeito. O arquivo pronto é montado na memória
      deste computador e entregue direto para um download."""

[[privacy]]
title = "O som também é virado aqui."
body = """
 Inverter uma trilha quer dizer
      decodificar ela, e essa decodificação é a do próprio navegador, rodando neste
      computador. Nada escuta, nada guarda e nada conseguiria repassar: aqui não
      existe caminho no código que mande um byte."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre o seu vídeo: nem arquivo, nem quadro, nem nome, tamanho ou duração. Toda
      linha que lê, decodifica, inverte ou codifica é servida desta origem e está
      listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script de
      cdnjs.buymeacoffee.com e pega as letras no Google Fonts. Ele não é mais do que
      um link: não avisa ninguém da sua visita e não recebe nada sobre você nem sobre
      o seu vídeo."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Essa é a prova mais simples de todas."""

[[howto]]
title = "Escolha um vídeo."
body = """
 Arraste um MP4, MOV, M4V ou WebM até o
      seletor, ou procure na mão. O navegador lê direto do seu disco, e nesse
      meio-tempo nada sai daqui."""

[[howto]]
title = "Decida o que fazer com o som."
body = """
 &ldquo;Inverter o som
      também&rdquo; vira a trilha amostra por amostra, que é o que faz a fala sair
      como fala tocada ao contrário em vez de sair como silêncio. Desligue para um
      vídeo mudo, que ainda por cima é mais rápido."""

[[howto]]
title = "Decida quanta qualidade gastar."
body = """
 A imagem precisa ser codificada
      de novo, porque os quadros saem numa ordem para a qual nada no arquivo foi
      codificado. &ldquo;Equilibrado&rdquo; fica perto do que o original gastou;
      &ldquo;Melhor qualidade&rdquo; gasta mais."""

[[howto]]
title = "Inverta e baixe."
body = """
 O trabalho acontece no seu próprio hardware,
      então o tempo depende do seu computador e não de uma fila. O vídeo pronto vai
      direto para os downloads do seu navegador."""

[[faq]]
q = "O meu vídeo é enviado para algum lugar?"
a = """
        Não. Ele é lido, decodificado, invertido e codificado pelo seu próprio
        navegador, no seu próprio hardware. Esta ferramenta não tem lado servidor, e
        a <code>Content-Security-Policy</code> da página lista todo endereço que ela
        pode contatar: nenhum é nosso. Se você prefere conferir a acreditar, desligue
        a internet e inverta um vídeo assim mesmo."""

[[faq]]
q = "Quais formatos de vídeo dá para inverter?"
a = """
        MP4, M4V e MOV são lidos direto, seja lá o que tiver dentro: H.264, HEVC, AV1
        ou VP9, desde que o seu navegador saiba decodificar aquele codec. Qualquer
        outra coisa que o seu navegador toque, WebM à frente, é invertida fazendo o
        player do próprio navegador andar para trás pelo vídeo, o que funciona mas é
        mais devagar. Um arquivo que o navegador não consegue nem ler nem tocar, o
        que na prática quer dizer AVI, WMV, FLV e a maioria dos MKV, é recusado com
        uma mensagem dizendo isso, em vez de falhar no meio do caminho. O que sai é
        sempre um MP4."""

[[faq]]
q = "O som também é invertido?"
a = """
        É, a não ser que você desligue. A trilha inteira é decodificada, as amostras
        são postas na ordem contrária e ela é codificada de novo em AAC. Não tem como
        evitar essa segunda codificação: um pacote de áudio são algumas dezenas de
        milissegundos de som codificados em cima do pacote anterior, então escrever
        os pacotes de trás para frente tocaria pedacinhos para a frente na ordem
        errada, o que soa como defeito e não como inversão."""

[[faq]]
q = "Inverter perde qualidade?"
a = """
        A imagem é codificada uma segunda vez, e isso custa um pouco. Aqui não dá
        para evitar como dá ao aparar: um vídeo invertido mostra os quadros numa
        ordem para a qual nada no arquivo original foi codificado, então cada quadro
        tem que ser escrito de novo. O que a ferramenta não faz é gastar mais do que
        o original gastou, já que codificar acima disso só deixa o arquivo maior sem
        deixar ele melhor."""

[[faq]]
q = "Tem limite de tamanho ou de duração do vídeo?"
a = """
        Não tem limite embutido na ferramenta, e o arquivo não é lido inteiro para a
        memória de uma vez: ele é percorrido grupo de quadros por grupo de quadros,
        de trás para frente. Os tetos de verdade são o vídeo pronto, que é montado na
        memória antes de você baixar, e o som, que precisa ser mantido inteiro porque
        inverter exige a última amostra antes de poder escrever a primeira."""

[[faq]]
q = "Por que em alguns arquivos demora mais?"
a = """
        Porque existem dois caminhos de entrada. Um MP4 ou MOV é lido direto por esta
        ferramenta e decodificado um grupo de quadros por vez, e isso anda tão rápido
        quanto o seu computador. Todo o resto é invertido pedindo ao player do próprio
        navegador um instante do vídeo depois do outro, e cada um desses saltos
        obriga o navegador a decodificar a partir do quadro-chave anterior. A página
        avisa qual dos dois está usando, e por quê, antes de você começar."""

[[faq]]
q = "Dá para inverter só um pedaço do vídeo?"
a = """
        Aqui não. Esta ferramenta inverte tudo: o vídeo que sai tem exatamente a
        mesma duração do que entrou, com o último quadro primeiro. Corte antes o
        pedaço que você quer com o
        <a href="../aparar-video/">Cortador de vídeo</a>, que faz isso sem
        recodificar um quadro sequer, e inverta o que sair dali."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem marca d'água.
        O site exibe publicidade, e é ela que paga a conta; os anúncios não recebem
        nada sobre o seu vídeo."""

