[[privacy]]
title = "Os seus documentos não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todo endereço que esta página pode contatar, e
      nenhum deles é nosso. Esta ferramenta não acrescenta nada a essa lista: ela não
      tem função de rede própria, nem opcional. Aqui não existe um ponto de coleta
      onde os seus arquivos pudessem parar, nem nada no código que os mandasse para
      lá se existisse."""

[[privacy]]
title = "Juntar é o trabalho que mais vale a pena não enviar."
body = """
 Os documentos que as
      pessoas juntam são justamente os que vieram de algum lugar: um contrato e a
      página de assinatura dele, a digitalização de um passaporte e um extrato
      bancário, uma carta médica e um formulário de pedido. Um serviço online fica
      com todos eles, num lugar só, já organizados. Este aqui tem uma página no seu
      navegador e nenhuma outra metade."""

[[privacy]]
title = "O formato inteiro está neste repositório."
body = """
 Um PDF é uma lista de
      objetos e uma tabela de onde cada um começa. <code>src/objects.js</code> lê
      essa sintaxe, <code>src/reader.js</code> segue a tabela,
      <code>src/assemble.js</code> copia páginas entre documentos e
      <code>src/writer.js</code> escreve o resultado. Nenhum dos quatro importa
      nada capaz de fazer uma requisição. Nenhuma biblioteca é buscada e nada é
      renderizado num servidor."""

[[privacy]]
title = "Arquivos criptografados são recusados em vez de abertos."
body = """

      Um PDF com senha é recusado, inclusive aquele tipo que os scanners produzem
      com senha em branco e que tecnicamente abriria. Tirar a proteção de um
      documento é um trabalho diferente de mover as páginas dele, e fazer isso
      caladinho seria uma coisa surpreendente para uma ferramenta fazer no seu
      lugar."""

[[privacy]]
title = "O arquivo pronto não diz nada sobre onde foi feito."
body = """

      Sem linha de produtor, sem data de criação, sem nome de ferramenta. Ele também
      não carrega o pacote XMP nem os blocos privados que um programa de diagramação
      deixa para trás: esses pertencem ao documento que existia antes, não ao que
      você acabou de montar. Tudo o que está nas próprias páginas é copiado
      exatamente: esta ferramenta move páginas, ela não reescreve o que está
      nelas."""

[[privacy]]
title = "Ações que não sejam &ldquo;ir para uma página&rdquo; não são copiadas."
body = """

      Um PDF pode carregar instruções que rodam ao abrir: toque isto, envie este
      formulário para aquele endereço, execute este JavaScript. As páginas que passam
      por esta ferramenta ficam com os links para outras páginas e para endereços
      web, e perdem o resto. Reordenar as páginas de alguém não é motivo para levar o
      scripting do documento dessa pessoa para dentro do seu arquivo novo."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre os seus documentos: nem arquivo, nem página, nem nome, tamanho ou
      contagem de páginas. Toda linha que lê, copia ou escreve um PDF é servida desta
      origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script de
      cdnjs.buymeacoffee.com e pega as letras no Google Fonts. Ele não é mais do que
      um link: não avisa ninguém da sua visita e não recebe nada sobre você nem sobre
      os seus documentos. Nada acontece enquanto você não clicar, e o que você abriria
      ao clicar é o site de outra pessoa."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Essa é a prova mais simples de todas: uma ferramenta que mandasse
      os seus documentos embora para serem juntados pararia."""

[[howto]]
title = "Escolha os seus PDFs."
body = """
 Arraste até o seletor ou procure na mão, e
      acrescente mais depois: as páginas de cada arquivo entram no fim da ordem
      corrente, que é o que permite juntar duas pastas em momentos diferentes. O
      navegador lê direto do seu disco."""

[[howto]]
title = "Ponha as páginas na ordem que você quer."
body = """

      Arraste uma página pela alça, ou empurre com as setas. Gire uma que foi
      digitalizada de lado, tire outra, ou digite <code>1-3, 8, 12-</code> na caixa
      para manter, remover ou girar uma sequência de uma vez. Os números são
      renumerados conforme você mexe, então o que você vê é sempre o que o arquivo
      pronto vai ser."""

[[howto]]
title = "Diga se sai um documento ou vários."
body = """

      Um é a resposta de sempre. O resto são jeitos de cortar: a cada tantas páginas,
      nos números de página que você indicar, um arquivo por página, ou de volta para
      os arquivos de onde as páginas vieram. Mais de um arquivo é entregue como um
      único ZIP, então é um salvar em vez de cinquenta."""

[[howto]]
title = "Monte, e leia a linha que diz que foi conferido."
body = """

      Quando os documentos estão escritos, cada um é aberto de novo pelo mesmo leitor
      desta página e as páginas dele são contadas. Se isso não bater com o que você
      pediu, a rodada é reportada como falha e nenhum download é oferecido."""

[[faq]]
q = "Os meus PDFs são enviados para algum lugar?"
a = """
        Não. Eles são lidos, copiados e escritos pelo seu próprio navegador, no seu
        próprio hardware. Esta ferramenta não tem lado servidor, e a
        <code>Content-Security-Policy</code> da página lista todo endereço que ela
        pode contatar: nenhum é nosso. Esta ferramenta não tem função de rede nenhuma,
        nem opcional."""

[[faq]]
q = "Quantos arquivos dá para juntar, e de que tamanho?"
a = """
        Não existe limite escrito na ferramenta. O limite é o seu próprio computador:
        os documentos ficam na memória enquanto estão sendo trabalhados, então um
        notebook junta algumas centenas de megabytes sem reclamar e começa a sofrer
        em algum ponto acima disso. Nada é cobrado, limitado, marcado ou posto em
        fila, porque não tem ninguém do outro lado para fazer qualquer uma dessas
        coisas."""

[[faq]]
q = "Juntar ou dividir perde qualidade?"
a = """
        Não. Nada numa página é recodificado, redesenhado ou recomprimido. O fluxo de
        conteúdo de cada página e cada fonte, imagem e desenho vetorial que ele
        referencia são copiados byte a byte, então o texto continua selecionável e
        pesquisável e uma fotografia é a mesma fotografia. As únicas coisas que mudam
        são a ordem das páginas e a estrutura em volta delas."""

[[faq]]
q = "O que acontece com marcadores e links?"
a = """
        Os dois são remontados em vez de descartados. Um marcador cuja página ainda
        está na saída aponta para onde essa página foi parar; um cuja página você
        removeu sai fora, a não ser que ainda tenha itens embaixo dele, e aí ele fica
        como título. Juntar vários arquivos coloca os marcadores de cada um sob um
        título com o nome dele. Os links entre páginas são seguidos do mesmo jeito,
        inclusive os destinos nomeados que o Word e o LaTeX escrevem, e um link cujo
        alvo não veio junto fica sem nada atrás em vez de mandar o leitor para o
        lugar errado. Links para endereços web ficam como estão."""

[[faq]]
q = "O que não vai junto?"
a = """
        Quatro coisas, e a ferramenta diz isso nos resultados, não nas letras miúdas.
        A árvore de ordem de leitura marcada que os leitores de tela usam, os rótulos
        de página (a numeração &ldquo;iii, iv, 1, 2&rdquo;), os anexos embutidos, e
        qualquer ação que não seja &ldquo;ir para uma página&rdquo; nem &ldquo;abrir
        um endereço web&rdquo;, inclusive o JavaScript do documento. As duas primeiras
        descrevem uma ordem que deixa de existir assim que as páginas se mexem; a
        última não é algo que você pediu para levar para um arquivo novo. Se a
        marcação de acessibilidade de um documento importa para você, guarde o
        original também."""

[[faq]]
q = "Formulários preenchidos sobrevivem?"
a = """
        Sobrevivem. Os campos de formulário e o que foi digitado neles vêm junto com
        as páginas, e o documento novo é registrado como formulário para que os
        leitores o tratem como tal. Uma coisa para saber ao juntar: dois campos com o
        mesmo nome são um campo só para qualquer leitor, então se você juntar duas
        cópias do mesmo formulário, preencher uma caixa numa página vai preencher a
        mesma na outra. A ferramenta percebe esse caso e avisa."""

[[faq]]
q = "Ele abre PDF protegido por senha?"
a = """
        Não, e isso é de propósito. Um documento criptografado é recusado com uma
        mensagem dizendo isso, mesmo quando a senha está em branco, que é como muitos
        scanners e copiadoras salvam. Tirar a proteção de um arquivo é um trabalho
        diferente de mover as páginas dele, e uma ferramenta que fizesse isso em
        silêncio estaria fazendo algo que você não pediu."""

[[faq]]
q = "Por que não tem prévia das páginas?"
a = """
        Porque desenhar uma página significa um renderizador de PDF completo, com
        fontes, degradês, grupos de transparência e modos de mesclagem, o que dá um
        megabyte ou mais de motor para buscar e rodar por causa de umas miniaturas. O
        que os quadradinhos mostram no lugar disso é aquilo em que a reordenação
        realmente mexe: o número da página, o formato e o tamanho do papel, a rotação
        com que ela será escrita, e de qual arquivo ela saiu. Uma digitalização
        deitada no meio de uma pilha de páginas em pé continua saltando aos olhos."""

[[faq]]
q = "O arquivo pronto vai abrir em todo lugar?"
a = """
        Vai. A saída é escrita como PDF 1.5, ou na maior versão que algum dos arquivos
        que você deu precisou, e 1.5 é entendido por todo leitor lançado desde 2003. A
        ferramenta ainda prova isso no seu próprio computador: ela abre cada arquivo
        pronto de novo e conta as páginas percorrendo a árvore de páginas, antes de
        oferecer o arquivo a você."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem limite de
        tamanho além do que a memória do seu computador permitir. O site exibe
        publicidade, e é ela que paga a conta; os anúncios não recebem nada sobre os
        seus documentos."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela continua
        funcionando. Esse é também o jeito mais simples de provar que nada está sendo
        enviado: uma ferramenta que mandasse os seus documentos embora para serem
        juntados pararia no instante em que você tirasse da tomada."""

