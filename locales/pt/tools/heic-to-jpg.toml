[[privacy]]
title = "Suas fotos não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todos os endereços que esta página pode
      acessar, e nenhum deles é deste site. Não existe aqui um endpoint onde seus
      arquivos pudessem ser recolhidos, e não existe no código nada que os
      mandaria mesmo que existisse."""

[[privacy]]
title = "O decodificador veio daqui, e não vai a lugar nenhum."
body = """
 HEIC é HEVC
      dentro de um formato de caixas, e navegador nenhum além do Safari decodifica
      um. Por isso esta página traz a <code>libheif</code> compilada para
      WebAssembly: cerca de 1,4 MB, commitados neste repositório, servidos desta
      origem e guardados em cache pelo service worker como qualquer outro arquivo
      daqui. Ela não é buscada de uma CDN, porque isso colocaria um terceiro no
      caminho de cada visita e faria a ferramenta parar de funcionar offline. O
      binário está dentro do script em vez de ao lado dele justamente para que
      nenhuma busca seja necessária para iniciá-lo."""

[[privacy]]
title = "Nada aqui vai buscar coisa alguma."
body = """
 Não existe
      <code>fetch</code>, nem <code>XMLHttpRequest</code>, nem
      <code>sendBeacon</code> em nenhum arquivo escrito para esta ferramenta. O
      motor de terceiros, como toda compilação do Emscripten, contém os caminhos
      de carregamento que buscariam um <code>.wasm</code> numa URL. Esses caminhos
      não são tomados, porque o binário já está em mãos. E se fossem, o
      <code>connect-src</code> lista os pontos de medição do Google e nada mais,
      então o navegador recusaria. A prova é a política, não a promessa."""

[[privacy]]
title = "Os metadados são lidos aqui e mostrados a você."
body = """
 A lista na
      página diz o que cada foto carrega, com a data, a câmera e o aviso de que há
      coordenadas de GPS lá dentro, porque essa é uma coisa que você pode querer
      saber antes de entregar o JPEG a alguém. Quem lê isso do arquivo é o
      <code>src/boxes.js</code>, neste navegador, e o resultado aparece nesta
      página. Depois ele é escrito no seu JPEG ou deixado de fora, inteiramente
      conforme você escolher. Não existe neste repositório nenhum evento de análise
      personalizado que carregue um nome de arquivo, uma data, uma coordenada ou
      uma contagem."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google, e o botão de doação vem do Buy Me a
      Coffee. Nenhum deles recebe coisa alguma sobre as suas fotos. Toda linha que
      lê, decodifica ou escreve um arquivo é servida desta origem e está listada
      no repositório."""

[[privacy]]
title = "Funciona offline."
body = """
 Carregue a página uma vez, desligue a rede, e a
      ferramenta continua igualzinha, porque o decodificador é guardado em cache
      junto. Essa é a prova mais simples de todas, e aqui ela é mais forte do que
      em qualquer outro lugar deste site: um conversor que mandasse as suas fotos
      embora para serem decodificadas não teria como dar conta."""

[[howto]]
title = "Escolha suas fotos HEIC."
body = """
 Arraste até o seletor, ou escolha na
      mão, direto de um backup do celular ou de uma pasta na área de trabalho. Quem
      lê tudo do seu disco é o navegador, e nada é mandado para lugar nenhum
      enquanto você faz isso. A lista diz o que cada uma é e o que ela tem
      dentro."""

[[howto]]
title = "Confira o que as fotos carregam."
body = """
 Cada linha nomeia a data em que foi
      tirada, a câmera e, em verde porque é a parte que vale notar, se o arquivo
      guarda coordenadas de GPS. Isso é lido do contêiner sem decodificar a imagem,
      então não custa nada e aparece na hora."""

[[howto]]
title = "Escolha um formato e decida sobre os detalhes."
body = """
 JPEG, a menos que
      você tenha um motivo, porque é o formato que abre em todo lugar, que é o
      ponto inteiro de converter. O controle de qualidade fica em 92, que é o ajuste
      em que uma fotografia é difícil de distinguir do original. A caixinha decide
      se a data, a câmera e a localização vêm junto."""

[[howto]]
title = "Clique em &ldquo;Converter&rdquo;, e baixe."
body = """
 O decodificador chega na
      primeira conversão, com cerca de 1,4 MB, uma vez só, e toda foto depois disso
      é decodificada e escrita no seu próprio computador. Um arquivo rende um botão
      de download, e vários rendem um zip também."""

[[faq]]
q = "Minha foto é enviada para algum lugar?"
a = """
        Não. Quem lê, decodifica e escreve o arquivo é o seu próprio navegador, no
        seu próprio hardware. Esta ferramenta não tem função de rede de espécie
        alguma: nunca busca nada e nunca manda nada. E a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum dos quais é deste site. A única coisa que carrega é
        o próprio decodificador, e ele vem deste site, uma vez, antes de a sua foto
        sequer entrar na história."""

[[faq]]
q = "Por que esta página baixa 1,4 MB na primeira vez?"
a = """
        Porque o HEIC é o único formato de imagem que um navegador não abre. É um
        quadro HEVC num contêiner de caixas, e só o Safari, em hardware da Apple, tem
        um decodificador para ele. Chrome, Firefox e Edge simplesmente recusam o
        arquivo. Então um conversor de HEIC precisa de um decodificador vindo de
        algum lugar, e só existem dois lugares possíveis: um servidor, ou a página.
        Todo outro conversor escolheu o servidor, e é exatamente por isso que todos
        eles precisam que você envie as suas fotos. Este aqui carrega a
        <code>libheif</code> compilada para WebAssembly. Ela é servida deste site,
        guardada em cache depois da primeira visita, e é o preço inteiro de as suas
        fotos não irem a lugar nenhum."""

[[faq]]
q = "O JPEG mantém a data, a câmera e a localização?"
a = """
        Se você quiser, e isso é uma caixinha na página. Com ela ligada, o bloco EXIF
        é copiado do HEIC e escrito no JPEG exatamente como o celular escreveu, então
        a foto convertida continua se ordenando pelo dia em que foi tirada, e não
        pelo dia em que foi convertida, que é a reclamação de sempre sobre
        conversores de HEIC. Uma etiqueta muda, e só uma: a orientação, que é
        ajustada para &ldquo;em pé&rdquo;, porque a rotação já foi aplicada aos
        pixels e um visualizador que a aplicasse de novo viraria toda foto em pé de
        lado. Desligue a caixinha e o JPEG sai com a imagem e nada mais."""

[[faq]]
q = "Ele apaga as coordenadas de GPS?"
a = """
        Ele avisa que elas estão lá, e depois faz o que você mandar. A linha de cada
        foto diz se o arquivo carrega coordenadas antes de qualquer coisa ser
        convertida, o que é mais do que o celular faz. Desmarcar &ldquo;manter a
        data, a câmera e os ajustes&rdquo; deixa as coordenadas fora do JPEG junto
        com todo o resto, e deixar marcado leva tudo adiante. Se o que você quer é
        percorrer as etiquetas em detalhe, ou apagá-las de fotos que já são JPEG, a
        ferramenta certa é o
        <a href="../remover-dados-exif/">Visualizador e removedor de EXIF</a>, que
        faz isso sem recomprimir a imagem."""

[[faq]]
q = "A imagem é recomprimida?"
a = """
        É, e tem que ser: HEIC e JPEG são codecs diferentes, então não tem como ir de
        um ao outro sem decodificar a imagem e codificá-la de novo. O que você
        controla é quanto isso custa. O controle de qualidade vem em 92, ponto em que
        uma fotografia é muito difícil de distinguir do original, e o PNG está no
        menu para o caso em que você não quer perda nenhuma e não se importa com o
        arquivo ficar de cinco a dez vezes maior."""

[[faq]]
q = "E se o arquivo se chama .jpg mas na verdade é um HEIC?"
a = """
        Funciona do mesmo jeito. Todo arquivo jogado aqui é identificado pelos
        primeiros bytes e não pelo nome, porque o nome é só como o último aplicativo
        a encostar no arquivo resolveu chamá-lo. Aliás, um HEIC que chegou chamado de
        &ldquo;.jpg&rdquo; é um dos jeitos mais comuns de alguém acabar procurando
        uma ferramenta como esta. Um arquivo que é genuinamente um JPEG ou um PNG é
        recusado com uma mensagem dizendo isso, em vez de ser convertido numa cópia
        de si mesmo."""

[[faq]]
q = "Ele converte uma Live Photo, ou uma rajada?"
a = """
        As imagens paradas de dentro, sim. Um HEIC pode guardar mais de uma imagem, e
        cada uma que ele guarda é convertida e nomeada a partir do original com um
        número no fim. A metade em vídeo de uma Live Photo é um arquivo separado que
        o celular guarda ao lado do HEIC, então ela não está aqui dentro para ser
        convertida. Mapas de profundidade e miniaturas estão no contêiner mas não são
        imagens que alguém pediu, então ficam em paz."""

[[faq]]
q = "Por que ele não aceita o meu AVIF?"
a = """
        Porque não haveria o que fazer com ele. AVIF é o mesmo contêiner do HEIC com
        AV1 dentro no lugar do HEVC, e todo navegador atual decodifica um
        nativamente. Um conversor estaria entregando um megabyte de motor para
        resolver um problema que você não tem. Se você precisa de um AVIF como JPEG,
        o <a href="../comprimir-imagem/">Compressor de imagens</a> e o
        <a href="../redimensionar-imagem/">Redimensionador de imagens</a> leem AVIF e
        escrevem JPEG usando o decodificador que o seu navegador já tem."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem marca
        d'água. Também não tem limite para o número nem para o tamanho dos arquivos,
        porque não existe servidor pagando por eles: o trabalho acontece no seu
        próprio computador. O site exibe publicidade, e é ela que paga a conta. Os
        anúncios não recebem nada sobre as suas fotos."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona, decodificador incluído. Carregue a página uma vez, depois desligue
        a internet e ela continua trabalhando nas suas fotos exatamente como antes.
        Essa é também a prova mais forte disponível de que nada está sendo enviado:
        um conversor que mandasse os seus HEICs embora para serem decodificados
        pararia no instante em que você tirasse da tomada, e este não para."""

