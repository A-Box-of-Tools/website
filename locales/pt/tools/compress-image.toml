[[faq]]
q = "Minha imagem é enviada para algum lugar?"
a = """
        Não. Quem decodifica, comprime e mede o arquivo é o seu próprio navegador,
        no seu próprio hardware, com os codificadores de JPEG, PNG e WebP que ele já
        traz. Esta ferramenta não tem função de rede de espécie alguma: nunca busca
        nada e nunca manda nada. E a <code>Content-Security-Policy</code> da página
        lista todos os endereços que ela pode acessar, nenhum dos quais é deste
        site."""

[[faq]]
q = "Como ele acerta um tamanho exato?"
a = """
        Tentando. Não existe fórmula que transforme um ajuste de qualidade numa
        contagem de bytes, porque isso depende inteiramente da imagem. Então a
        ferramenta codifica a imagem várias vezes até achar a resposta. Ela começa
        no topo da faixa de qualidade e vai cortando o intervalo pela metade, o que
        encontra a maior qualidade que cabe em umas oito codificações. Todo tamanho
        que você vê na página é um arquivo codificado de verdade, não uma
        estimativa."""

[[faq]]
q = "O que &ldquo;perda mínima&rdquo; quer dizer aqui, exatamente?"
a = """
        Três coisas específicas. A primeira: uma imagem que já está abaixo do seu
        alvo passa direto, byte por byte, em vez de ser recodificada. A segunda: a
        qualidade é gasta antes da resolução, e só até um piso em que os artefatos
        de compressão começam a aparecer. Passando desse ponto, a ferramenta diminui
        a imagem e devolve a qualidade para cima, porque menos pixels bons ficam
        melhores do que mais pixels arruinados. A terceira: assim que aparece um
        resultado que cabe, a busca volta a subir até o orçamento acabar, então você
        não recebe um arquivo de 300 KB tendo pedido 500 KB."""

[[faq]]
q = "O que são os números de SSIM e PSNR em cada resultado?"
a = """
        São uma medição do que a compressão custou, feita decodificando o resultado
        e comparando com a imagem original. O SSIM compara brilho, contraste e
        estrutura locais, o que chega bem mais perto daquilo que incomoda o olho do
        que simplesmente contar pixels alterados; acima de mais ou menos 0,98 os
        dois são difíceis de distinguir lado a lado. O PSNR é a tradicional medida
        em decibéis. Os dois são calculados no seu computador, e os dois aparecem
        para que a afirmação de perda baixa possa ser conferida em vez de só
        alegada."""

[[faq]]
q = "Quais formatos ele consegue ler e escrever?"
a = """
        Ele lê tudo o que o seu navegador conseguir decodificar, o que na prática
        significa JPEG, PNG, WebP, GIF, BMP e, na maioria dos navegadores atuais,
        AVIF. Ele escreve JPEG, PNG e WebP, porque são esses os codificadores que os
        navegadores trazem. No &ldquo;automático&rdquo; ele mantém o formato em que
        o seu arquivo chegou, e só troca para WebP quando manter teria significado
        um redimensionamento ou uma queda visível de qualidade."""

[[faq]]
q = "Por que ele não consegue comprimir muito um PNG?"
a = """
        Porque o PNG é sem perdas: não tem botão de qualidade para girar. O único
        jeito de deixar um PNG menor é dar a ele menos pixels ou menos cores, então,
        com PNG selecionado, a ferramenta chega a um alvo só redimensionando. Se a
        imagem é uma fotografia, JPEG ou WebP chegam muito mais perto do seu alvo
        num tamanho em que dá para ver que está tudo bem. E se for uma logomarca ou
        uma captura de tela com transparência, o WebP mantém a transparência que o
        JPEG preencheria com branco."""

[[faq]]
q = "Comprimir uma imagem remove os dados EXIF e de GPS dela?"
a = """
        Remove, como efeito colateral. Comprimir significa decodificar a imagem em
        pixels e codificar esses pixels de novo, e um canvas cheio de pixels não
        carrega etiqueta nenhuma, então a localização, o modelo da câmera, os
        horários e todo o resto simplesmente não são escritos no arquivo novo. Se
        você quer os metadados fora mas a imagem intocada, use o
        <a href="../remover-dados-exif/">Visualizador e removedor de EXIF</a>, que
        reescreve o contêiner sem recomprimir nada."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem marca
        d'água. Também não tem limite para o número nem para o tamanho dos arquivos,
        porque não existe servidor pagando por eles: o trabalho acontece no seu
        próprio computador. O site exibe publicidade, e é ela que paga a conta. Os
        anúncios não recebem nada sobre as suas imagens."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela
        continua funcionando. Esse é também o jeito mais simples de provar que nada
        está sendo enviado: uma ferramenta que mandasse as suas imagens embora para
        serem comprimidas pararia no instante em que você tirasse da tomada."""

