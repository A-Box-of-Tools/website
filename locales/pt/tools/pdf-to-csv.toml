[[privacy]]
title = "Os PDFs que precisam de conversão costumam conter dados sensíveis."
body = "Uma tabela pequena pode ser redigitada. Os documentos que precisam desta ferramenta são extratos, faturas, holerites e relatórios: quem recebeu cada pagamento, quanto sobrou, preços de clientes e números de empresas. Entregá-los a um servidor desconhecido para obter uma planilha dá a terceiros uma cópia valiosa, que pode ser guardada e se tornar alvo de ataque. Esta página não tem um servidor de processamento: não há para onde enviar o arquivo."

[[privacy]]
title = "O saldo permite conferir variações líquidas, com limites explícitos."
body = "Encontrar tabelas em PDF exige inferências: os limites das colunas ou a união de linhas podem estar errados. A ferramenta compara a soma dos valores entre dois saldos legíveis com a variação do saldo. Informa quantas comparações conferem e quais linhas ficaram sem conferência, inclusive antes do primeiro saldo, depois do último ou em intervalos ilegíveis. Uma coincidência é um indício útil, não prova de que tudo está certo: erros que se anulam podem passar. Tabelas sem saldo reconhecido não recebem essa verificação."

[[privacy]]
title = "As tabelas são encontradas na página, sem um modelo para cada banco."
body = "Não há lista de bancos nem de formatos aceitos. Uma coluna de letras pequenas ao lado do conteúdo principal é separada, e cada região é examinada em busca de células alinhadas. Isso permite ler extratos de bancos desconhecidos e relatórios nunca vistos antes. Também explica por que a leitura pode falhar quando as colunas realmente se sobrepõem."

[[privacy]]
title = "A senha não é removida aqui; a página indica como fazer isso."
body = "Um PDF protegido é recusado. Remover a proteção é uma tarefa diferente de ler tabelas; fazer isso sem avisar seria inesperado. A página indica caminhos que mantêm o arquivo no computador: o <a href=\"../desbloquear-pdf/\">desbloqueador de PDF</a> deste site, que remove a senha no navegador sem alterar as páginas, ou imprimir novamente em PDF no navegador ou no Pré-Visualização. Não entregue o documento a outro site que ofereça desbloqueá-lo: esse é justamente o envio que esta ferramenta evita."

[[privacy]]
title = "Uma fotografia da página não tem texto para extrair."
body = "Uma digitalização é uma imagem: as linhas são pixels, sem texto que possa ser organizado em colunas. A ferramenta informa isso e apresenta alternativas sem envio. Para extratos, a primeira costuma ser a mais simples: o banco provavelmente oferece o mesmo documento diretamente em CSV. Reconhecer letras em uma imagem é OCR, uma tarefa diferente desta conversão."

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = "Os scripts de publicidade e medição vêm do Google. Eles não recebem nada do documento: arquivo, tabela, linha, número, nome ou quantidade de páginas. Todo o código que lê o PDF ou escreve o CSV é servido desta origem e está no repositório."

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = "O botão &ldquo;Buy me a coffee&rdquo; no topo é desenhado por um script de cdnjs.buymeacoffee.com e busca as letras no Google Fonts. É um link e nada mais: não relata visita alguma, e não recebe nada sobre você nem sobre os seus documentos. Nada acontece a menos que você clique, e para onde você iria ao clicar é o site de outra pessoa."

[[privacy]]
title = "Funciona offline."
body = "Desligue a rede e a página continua funcionando. É uma verificação simples: uma ferramenta que enviasse o documento para converter em outro lugar pararia."

[[howto]]
title = "Escolha o PDF."
body = "Um por vez. O navegador lê todas as páginas diretamente do disco antes de decidir a interpretação dos dados. Escrever 1.240,00 ou 1,240.00 e a ordem dos componentes das datas são características do documento inteiro, não de uma página isolada."

[[howto]]
title = "Confira as tabelas encontradas."
body = "Cada tabela mantém suas colunas e os cabeçalhos impressos, quando existem. Uma tabela que continua em outra seção ou página com os mesmos cabeçalhos é reunida, sem repetir o cabeçalho no meio. Uma célula que ocupa duas linhas volta a ser uma só. Totais, subtotais e rótulos são preservados como as linhas em que aparecem."

[[howto]]
title = "Escolha uma tabela ou leve todas."
body = "Quando há várias, o seletor acima delas define o conteúdo do CSV: todas em sequência ou apenas a desejada. Se houver saldo acumulado, a página mostra as comparações que conferem e as linhas que não puderam ser verificadas. Datas com ano saem como AAAA-MM-DD; valores, como números com sinal. Uma data sem ano fica como foi impressa, pois acrescentar um ano seria adivinhar."

[[howto]]
title = "Baixe o CSV."
body = "O arquivo segue a RFC 4180, com aspas corretas e quebras de linha CRLF. Usa UTF-8 com marca de ordem de bytes para o Excel preservar símbolos de moedas. Ao reunir várias tabelas, cada uma mantém seu cabeçalho e uma linha em branco as separa. Nada foi enviado para produzi-lo."

[[faq]]
q = "Como a ferramenta encontra tabelas se o PDF não as identifica como tabelas?"
a = "Pela posição do texto. Primeiro, separa colunas de letras pequenas que ficam ao lado do conteúdo principal. Elas diferem das colunas da tabela porque as células compartilham exatamente a mesma linha de base; o texto lateral só se alinha por acaso. Depois, percorre cada região de cima para baixo, dividindo-a em blocos nos títulos e espaços. As colunas são os pontos em que várias linhas concordam sobre o início ou o fim das células. Blocos com as mesmas colunas são reunidos. Não depende de modelos de banco ou formulário."

[[faq]]
q = "Só funciona com extratos bancários?"
a = "Não. Começou como conversor de extratos, mas foi refeito para encontrar todas as tabelas. O primeiro extrato real tinha duas transações e cinco outras tabelas; procurar apenas transações não encontrava nada. Faturas, listas de preços, horários, resultados e relatórios também contêm tabelas. O extrato acrescenta o saldo acumulado, usado para comparar as variações líquidas entre saldos legíveis."

[[faq]]
q = "O que acontece com uma descrição longa demais para a coluna?"
a = "Ela é reunida à sua linha, evitando um erro que torna muitos CSVs extraídos de PDF inutilizáveis. Um trecho com uma única célula de texto perto de uma linha é interpretado como continuação dessa célula. Ele é unido à linha de baixo, em vez da de cima, quando está mais perto dela, como ocorre com um rótulo longo acima do valor. Um trecho com várias células ou com um número é tratado como uma linha própria."

[[faq]]
q = "O que a conferência do saldo comprova?"
a = "Compara a soma dos valores entre dois saldos legíveis com a variação do saldo e informa quantas comparações conferem. A mesma conta identifica possíveis colunas de valores e saldos sem depender dos títulos. A página lista linhas que ficaram sem verificação: valores antes do primeiro saldo, depois do último e intervalos com valores ausentes ou ilegíveis. Uma célula vazia de débito ou crédito não utilizado conta como zero; um valor ilegível, não. Saldos coincidentes não descartam erros que se anulam nem verificam descrições e datas. Confira o CSV com o PDF antes de confiar nele."

[[faq]]
q = "As datas ficaram invertidas: 03/04 deveria ser 4 de março, não 3 de abril."
a = "Mude o seletor acima das tabelas; tudo é recalculado na hora. A interpretação vem do documento, não da sua localização. Se alguma data tiver dia maior que doze, ela define a ordem para o documento inteiro, e a página informa isso. Se todas tiverem dia até doze, não há como distingui-las só pelo arquivo: a ferramenta <em>avisa</em> e começa com dia primeiro, até você mudar. Datas impressas sem ano, comuns em extratos de cartão, permanecem como estão."

[[faq]]
q = "Funciona com PDF digitalizado?"
a = "Não. A página explica isso em vez de entregar um arquivo vazio. Uma digitalização é uma imagem, sem texto para alinhar. As alternativas aparecem na página. Para extratos, quase todo banco on-line oferece CSV, OFX ou QIF diretamente: dispensa conversão e é mais preciso que interpretar uma imagem."

[[faq]]
q = "Ele abre um PDF protegido por senha?"
a = "Não, de propósito. Bancos costumam proteger extratos com data de nascimento ou últimos dígitos da conta. Remover essa proteção é outra tarefa. O <a href=\"../desbloquear-pdf/\">desbloqueador de PDF</a> deste site remove a senha no navegador sem alterar as páginas, preservando a posição do texto. Também é possível imprimir novamente em PDF no Chrome ou Edge, ou exportar pelo Pré-Visualização no Mac. Não use outro site de desbloqueio: isso enviaria justamente o documento que esta página procura manter fora da internet."

[[faq]]
q = "Meu PDF é enviado para algum lugar?"
a = "Não. O navegador lê o arquivo e gera o CSV no seu próprio computador. Não há processamento em servidor. A <code>Content-Security-Policy</code> lista os endereços que a página pode contatar; nenhum pertence a este site. Desligue a internet e converta um PDF para conferir."

[[faq]]
q = "Por que há um caractere estranho no início do CSV?"
a = "É a marca de ordem de bytes, incluída de propósito. Sem ela, o Excel no Windows pode usar a codificação antiga do sistema e trocar símbolos como libra e euro por letras. A marca informa que o arquivo é UTF-8. Os leitores mais comuns a ignoram; um analisador estrito pode devolvê-la como caractere invisível antes do primeiro cabeçalho. Esse é o custo da compatibilidade."

[[faq]]
q = "Há limite de tamanho, e custa alguma coisa?"
a = "A ferramenta não impõe limite. O limite é a memória do seu computador: o documento fica nela durante a leitura, e um notebook costuma lidar com centenas de páginas. É grátis, sem conta, cadastro ou período de teste. A publicidade sustenta o site, mas não recebe dados dos seus documentos."

[[faq]]
q = "Funciona offline?"
a = "Sim. Abra a página uma vez e depois desligue a internet: ela continua funcionando. Uma ferramenta que enviasse o documento para conversão pararia assim que a conexão fosse desligada."

