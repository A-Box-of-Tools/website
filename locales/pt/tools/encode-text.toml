[[faq]]
q = "O meu texto é enviado para algum lugar?"
a = """
        Não. Cada codificador e cada decodificador desta página é uma função que
        roda no seu próprio navegador, no seu próprio hardware. Esta ferramenta não
        tem função de rede de espécie alguma: nunca busca nada e nunca manda nada, e
        a <code>Content-Security-Policy</code> da página lista todo endereço que ela
        pode contatar, e nenhum deles é nosso. É esse o motivo para usá-la com um
        token de acesso ou um cookie de sessão: colar uma dessas coisas no
        decodificador de outra pessoa é entregá-la a ela."""

[[faq]]
q = "O Base64 daqui é o mesmo Base64 de todo mundo?"
a = """
        É: ele é conferido contra os vetores de teste do RFC 4648, e não contra ele
        mesmo. Os dois alfabetos decodificam, então um JWT escrito com <code>-</code> e
        <code>_</code> se lê tão fácil quanto um escrito com <code>+</code> e
        <code>/</code>, e uma entrada quebrada a cada 64 caracteres é juntada para você.
        A codificação passa por bytes UTF-8, então uma letra acentuada ou um emoji
        sobrevive à ida e à volta."""

[[faq]]
q = "Base64 é criptografia?"
a = """
        Não, e tratá-lo como criptografia é o erro clássico. Base64 é uma grafia: os
        mesmos bytes, escritos num alfabeto que sobrevive a uma URL, a um e-mail ou a
        uma string JSON. Qualquer um pode ler de volta &mdash; esta página faz isso
        em um milissegundo &mdash;, então ele não esconde nada e não protege nada. Se
        o que você tem é segredo, precisa de criptografia de verdade antes de ser
        codificado, não no lugar dela."""

[[faq]]
q = "Por que a decodificação falhou?"
a = """
        Porque o que foi colado não é exatamente o que o codec esperava receber, e o
        erro diz em que sentido: um caractere fora do alfabeto Base64, preenchimento
        no lugar errado, um sinal de porcentagem sem dois dígitos hexadecimais
        atrás, ou bytes que até se decodificam do Base64 mas não são texto UTF-8
        &mdash; o que geralmente significa que o original era um arquivo, e não uma
        string. O <code>atob</code> do navegador teria devolvido algo plausível no
        lugar; ser avisado é todo o sentido de colar algo num decodificador."""

[[faq]]
q = "Qual é a diferença entre as duas codificações de endereço web?"
a = """
        Um valor sozinho, ou o endereço inteiro. Codificar <em>um valor</em> escapa
        tudo a que uma URL dá significado &mdash; as barras, os pontos de
        interrogação, os e comerciais &mdash;, que é o que você quer para um único
        parâmetro de consulta. Codificar uma <em>URL inteira</em> deixa o endereço
        funcionando: as barras e o <code>?</code> ficam, e só os caracteres que uma
        URL não consegue carregar de jeito nenhum são escapados. Usar o primeiro num
        endereço inteiro quebra o endereço; usar o segundo num valor perde onde o
        valor termina."""

[[faq]]
q = "De que tamanho pode ser o arquivo?"
a = """
        Aqui não tem limite definido, porque não existe servidor pagando por um. O
        teto de verdade é o seu próprio computador: alguns megabytes de texto vão
        bem, e num documento muito longo a página espera uma pausa na sua digitação
        antes de recodificar, em vez de brigar com você pelo teclado."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem limite de quanto
        você cola. O site exibe publicidade, e é ela que paga a conta; os anúncios não
        recebem nada sobre o seu texto."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela
        continua funcionando. Esse é também o jeito mais simples de provar que nada
        está sendo enviado: uma ferramenta que mandasse o seu texto embora para ser
        decodificado pararia no instante em que você tirasse da tomada."""

