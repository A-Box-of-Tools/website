[[privacy]]
title = "O que você cola não tem para onde ir."
body = """
 A
      Content-Security-Policy lista todo endereço que esta página pode contatar, e
      nenhum deles é nosso. Aqui não existe um ponto de coleta onde um token colado
      pudesse parar, nem nada no código que o mandasse para lá se existisse."""

[[privacy]]
title = "Aqui nada busca nada."
body = """
 Não existe em lugar nenhum de
      <code>src/</code> um <code>fetch</code>, um <code>XMLHttpRequest</code> ou um
      <code>sendBeacon</code>. Cada codificador e cada decodificador são funções
      desta página que recebem uma string e devolvem uma string."""

[[privacy]]
title = "O decodificador avisa quando algo está errado."
body = """
 O <code>atob</code> do navegador aceita
