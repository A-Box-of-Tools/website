# Sincronizar pasta - Brazilian Portuguese.
#
# Overrides for tools/folder-sync/tool.toml. Only words: the slug lives in
# [slugs] in locale.toml, and the category, the icon and the CSP stay where
# they are.
#
# Every control named in the prose below is named with the words of its label
# in folder-sync.html: Iniciar sincronização, Pedir para sincronizar, Buscar
# conexões, Entrar, Sincronizar agora, Só enviar, Só receber, Deixar como está.
# Change a label there and change it here, or the steps point at a button the
# page does not have.
#

name = "Sincronizar pasta"
heading = "Sincronizar pasta <span class=\"h1-kw\">&mdash; mantenha uma pasta igual em dois dispositivos</span>"
tagline = "Escolha uma pasta em cada dispositivo, veja todas as diferenças e copie o que estiver faltando ou for mais recente direto entre os dois navegadores, na sua rede. Nada é enviado a um servidor, e nada jamais é excluído."

title = "Sincronizar uma pasta entre dois dispositivos &mdash; de navegador para navegador, sem upload"
description = "Mantenha uma pasta igual em dois computadores. Compare as duas pastas, revise cada mudança e copie os arquivos direto entre os navegadores, na sua rede. Sem upload, sem conta, sem excluir nada."
og_title = "Mantenha uma pasta igual em dois dispositivos"
og_description = "Compare duas pastas e copie o que estiver faltando ou for mais recente direto entre os navegadores, na sua rede. Sem upload, sem conta, sem excluir nada."
og_image_alt = "Sincronizar pasta - mantenha uma pasta igual em dois dispositivos"

pledge = """
    Você escolhe uma pasta em cada dispositivo e aprova o dispositivo que
    entra. Depois, os dois navegadores comparam nomes, tamanhos e datas dos
    arquivos por uma conexão criptografada feita diretamente entre eles e
    copiam os arquivos que você autorizar, sem nenhum servidor no meio. Não há
    retransmissão, então os dois dispositivos precisam estar numa rede em que
    consigam se alcançar. O pareamento usa um serviço de apresentação na
    internet, que vê os metadados da preparação da conexão, nunca um arquivo,
    um nome de arquivo ou a comparação. Um arquivo recebido só substitui o
    antigo depois de chegar inteiro, e nada jamais é excluído. Pare a
    sincronização ou feche qualquer uma das duas páginas para encerrar a
    sessão."""
pledge_line = "Os arquivos viajam <strong>direto entre os seus dois dispositivos</strong>, criptografados. Nada é enviado a um servidor; um serviço de apresentação conecta os navegadores."
md_note = "Comparação de pastas e cópia de arquivos direto entre dois navegadores aprovados, com criptografia e sem retransmissão. A apresentação pela internet leva metadados da preparação da conexão, nunca arquivos, nomes de arquivos ou listas. Nada jamais é excluído."
live_hint = """
      As ferramentas do desenvolvedor mostram um WebSocket para as mensagens
      de apresentação. Optar por aparecer na lista ou escolher Buscar conexões
      abre outro WebSocket, separado, para a busca. As listas de arquivos e os
      arquivos viajam por WebRTC criptografado, direto entre os dispositivos.
      A aba Rede e a CSP, sozinhas, não inspecionam esse tráfego entre os
      dispositivos. O restante do site carrega os recursos de terceiros de
      sempre."""
read_first = """
, <code>src/plan.js</code> para ver como duas listas viram a lista de
      diferenças e por que nada é excluído, <code>src/transfer.js</code>
      para a transferência com confirmação de recebimento, que mantém um
      arquivo grande fora da memória, <code>src/folder.js</code> para as
      gravações que só
      substituem um arquivo quando ele está inteiro, e <code>src/session.js</code>
      para a aprovação que vem antes de qualquer pasta ser comparada. O serviço
      de apresentação está publicado ao lado da ferramenta, em
      <code>workers/rendezvous/</code>."""
howto_heading = "Como sincronizar uma pasta entre dois dispositivos"
card = "Compare uma pasta em dois dispositivos e copie o que estiver faltando ou for mais recente, direto entre os navegadores na sua rede. Nada enviado a servidores, nada excluído."

[words]
plural = "pastas e arquivos"
choose = "uma pasta"

