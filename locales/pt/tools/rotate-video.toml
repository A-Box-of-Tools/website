[[privacy]]
title = "Uma rotação são nove números no cabeçalho da imagem."
body = "Um celular guarda os quadros como o sensor os captou e grava a rotação na matriz de exibição da faixa. O player a aplica na tela. Ao usar o cabeçalho, esta página grava a matriz escolhida e copia cada quadro intacto, sem recodificá-lo. O áudio AAC é copiado; outro áudio decodificável é recodificado como AAC, a menos que você escolha removê-lo. Quando o áudio também é copiado, o tamanho do arquivo fica quase igual."

[[privacy]]
title = "O upload é a parte demorada, e aqui ele não acontece."
body = "Todo serviço online de rotação pede o arquivo inteiro primeiro: o gigabyte passa pela sua conexão para voltar girado. O upload costuma demorar mais que o processamento, antes mesmo de perguntar quem guarda o arquivo. A maioria desses serviços ainda recodifica, perdendo uma geração de qualidade para uma tarefa que precisava alterar nove números. Esta página lê o arquivo com código servido por este site e grava o novo na memória: os bytes só vão do seu disco à memória e de volta. A <code>Content-Security-Policy</code> lista todos os endereços que a página pode contatar &mdash; nenhum pertence a este site &mdash; e a ferramenta funciona sem conexão à rede."

[[privacy]]
title = "Quem respeita o cabeçalho e o que fazer quando um player não respeita."
body = "Celulares, navegadores, players modernos e editores aplicam a matriz de exibição; é assim que vídeos de celular aparecem na orientação correta desde 2010. Alguns players antigos ignoram a matriz e mostram os quadros armazenados de lado. Para eles, ou quando você não puder verificar o destino, a página oferece aplicar a rotação aos pixels: cada quadro é desenhado girado em um canvas e recodificado em H.264. Isso perde uma geração de qualidade e leva o tempo de uma codificação, por isso é a alternativa secundária, identificada como tal."

[[privacy]]
title = "O resultado é reaberto e verificado."
body = "Uma matriz errada, ou correta com dimensões erradas, ainda poderia gerar um arquivo que abre. Por isso o arquivo pronto é reaberto pelo mesmo leitor usado na entrada. Ele precisa manter a duração, aparecer na orientação e nas dimensões pedidas e conter o áudio esperado. A prévia abaixo do botão para baixar reproduz o arquivo da memória, para você conferir a orientação antes de salvá-lo."

[[privacy]]
title = "Quais arquivos são lidos e o que é gravado."
body = "MP4, MOV e M4V com qualquer codec de vídeo &mdash; H.264, HEVC, VP9 ou AV1 &mdash; porque uma rotação no cabeçalho independe dos quadros. Também WebM e MKV: quadros H.264 são copiados; para outros codecs, a rotação é aplicada aos pixels, porque este gravador só pode criar um cabeçalho MP4 com H.264 nesses casos. Áudio AAC é copiado; Opus, Vorbis, MP3 ou FLAC é recodificado em AAC. Um áudio que o navegador não consegue decodificar é identificado e omitido. O resultado é sempre MP4, o contêiner aceito por todos."

[[privacy]]
title = "O que o Google carrega e o que não recebe."
body = "Os scripts de anúncios e medição vêm do Google. Nenhum recebe informações sobre seu vídeo: arquivo, quadro, nome, tamanho, duração ou direção da rotação. Todo o código que lê, gira ou grava um vídeo é servido por este site e está no repositório."

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = "O botão \"Buy me a coffee\" no cabeçalho é desenhado por um script de cdnjs.buymeacoffee.com e usa letras do Google Fonts. É apenas um link: não registra visitas e não recebe informações sobre você ou seus vídeos. Nada acontece até você clicar, e o destino é um site de outra pessoa."

[[privacy]]
title = "Funciona offline."
body = "Desconecte a rede e tudo nesta página continua funcionando. Essa é a prova mais simples: uma ferramenta que enviasse seu vídeo para ser girado pararia."

[[howto]]
title = "Escolha o vídeo."
body = "Um arquivo por vez: MP4, MOV, M4V, WebM ou MKV. O navegador o lê diretamente do disco, e a página informa o formato e a orientação em que ele aparece atualmente."

[[howto]]
title = "Escolha a rotação e observe a prévia."
body = "Um quarto de volta à direita, um quarto à esquerda ou de cabeça para baixo. O primeiro quadro é desenhado com a mesma transformação que o arquivo terá: a prévia mostra o que o player fará. Marque &ldquo;aplicar aos pixels&rdquo; apenas se um player tiver mostrado o vídeo de lado. Você também pode omitir o áudio para gerar um vídeo sem som."

[[howto]]
title = "Gire e confira a mensagem de verificação."
body = "O cabeçalho é gravado e cada quadro é copiado, o que leva segundos. Aplicar aos pixels leva o tempo de uma codificação, com uma barra de progresso. Depois, o arquivo pronto é reaberto e precisa manter a duração, a orientação pedida e o áudio. Ele é reproduzido da memória abaixo do botão para baixar, para você conferir a orientação."

[[faq]]
q = "Girar o vídeo reduz a qualidade?"
a = "A rotação pelo cabeçalho mantém a qualidade da imagem: cada quadro é copiado byte a byte. Apenas aplicar a rotação aos pixels recodifica a imagem. Áudio AAC é copiado; outro áudio decodificável é recodificado como AAC, a menos que seja omitido. Quando o áudio também é copiado, o tamanho do arquivo fica quase igual."

[[faq]]
q = "Por que o arquivo ainda aparece de lado em um player?"
a = "Porque esse player ignora a matriz de exibição. Celulares, navegadores, players modernos e editores a respeitam; alguns players antigos mostram os quadros como foram armazenados. Marque &ldquo;Aplicar a rotação aos pixels&rdquo;: os próprios quadros serão girados e recodificados em H.264, para todos os players mostrarem a mesma orientação, com a perda de uma geração de qualidade."

[[faq]]
q = "Qual é o sentido de um quarto de volta à direita?"
a = "Horário: o topo da imagem se move como ao girar o celular para a direita. A prévia mostra o primeiro quadro girado conforme a escolha. Selecione o botão que deixa a imagem correta e inicie a rotação."

[[faq]]
q = "Quais arquivos são aceitos?"
a = "MP4, MOV e M4V com qualquer codec de vídeo, porque a rotação no cabeçalho independe dos quadros. WebM e MKV com H.264 têm os quadros copiados; para outros codecs, a rotação é aplicada aos pixels, porque este gravador só pode criar um cabeçalho MP4 com H.264 nesses casos. Áudio AAC é copiado; Opus, Vorbis, MP3 e FLAC são recodificados em AAC. Áudio que o navegador não decodifica é identificado e omitido. O resultado é sempre MP4."

[[faq]]
q = "Quanto tempo leva?"
a = "Segundos no modo padrão: o arquivo é lido uma vez para identificar sua estrutura e mais uma vez ao gravar o resultado. Um gigabyte passa à velocidade do disco. Aplicar aos pixels leva o tempo de o computador codificar o vídeo &mdash; com codificação por hardware, disponível na maioria dos notebooks e celulares recentes, costuma ser mais rápido que a duração do vídeo; sem ela, mais lento."

[[faq]]
q = "Meus vídeos são enviados para algum lugar?"
a = "Não. O arquivo é lido, recebe um novo cabeçalho e é gravado pelo seu navegador, no seu computador. A <code>Content-Security-Policy</code> da página lista todos os endereços que ela pode contatar &mdash; nenhum pertence a este site. A forma mais simples de conferir é desconectar a rede e usar a ferramenta mesmo assim. Para arquivos desse tamanho, também é a forma mais rápida: o upload levaria mais que a tarefa inteira."

[[faq]]
q = "Funciona no celular?"
a = "Sim. A rotação pelo cabeçalho copia os quadros sem decodificá-los; o áudio pode precisar de codificação AAC. O arquivo pronto fica na memória até ser salvo, e um celular costuma guardar algumas centenas de megabytes de resultado. Aplicar a rotação aos pixels também codifica a imagem, o que o codificador por hardware pode acelerar."

[[faq]]
q = "Há limite de tamanho, e custa alguma coisa?"
a = "A entrada é lida do disco em partes, então pode ser maior que a memória disponível. O arquivo pronto fica na memória até você baixá-lo, e um MP4 gravado aqui não pode ultrapassar 4 GB. É grátis, sem conta, login ou período de teste. Os anúncios sustentam o site e não recebem informações sobre seus vídeos."

[[faq]]
q = "Funciona offline?"
a = "Sim. Carregue a página uma vez e desconecte a internet: ela continua funcionando. Essa também é a forma mais simples de provar que nada é enviado. Uma ferramenta que enviasse seu vídeo para ser girado pararia assim que você se desconectasse."

