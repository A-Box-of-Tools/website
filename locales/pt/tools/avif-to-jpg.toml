[[privacy]]
title = "Suas imagens não têm para onde ir."
body = "A Content-Security-Policy lista todos os endereços que esta página pode contatar, e nenhum pertence a este site. Não existe aqui um endereço capaz de coletar seus arquivos, nem código que os enviaria se existisse."

[[privacy]]
title = "O decodificador já está no navegador: esse é o segredo."
body = "Um AVIF que não abre no visualizador de fotos abre normalmente em uma aba do navegador, porque Chrome e Firefox decodificam AVIF desde 2021, e Safari desde 2023. Esta página oferece esse decodificador com um botão para salvar: abre o arquivo como o navegador já sabe fazer, desenha a imagem e grava um JPEG. Não é preciso baixar um mecanismo de conversão, esperar na primeira conversão ou envolver um servidor &mdash; justamente o que os conversores que pedem upload não explicam."

[[privacy]]
title = "As áreas transparentes e o que fica atrás delas."
body = "AVIF pode ter um canal alfa; JPEG não. Por isso é necessário preencher o fundo. Esta página pergunta qual cor usar e sugere branco, mas só quando um arquivo da lista realmente tem transparência &mdash; detectada nos pixels decodificados, em vez de deduzida. A maioria dos AVIFs salvos de sites são fotografias sem áreas transparentes, então esse campo normalmente fica oculto."

[[privacy]]
title = "O que um JPEG não pode preservar de um AVIF."
body = "AVIF pode guardar mais cores que JPEG e descrever regiões mais brilhantes &mdash; dez ou doze bits por canal e HDR. JPEG usa oito bits e não tem HDR, então uma imagem que aproveitava esses recursos é convertida para a faixa normal. Na grande maioria das imagens não há nada a reduzir e você não verá diferença; em uma captura de uma foto HDR, talvez veja. Explicamos aqui para evitar surpresas."

[[privacy]]
title = "O que o Google carrega e o que não recebe."
body = "Os scripts de anúncios e medição vêm do Google, e o botão de doação vem do Buy Me a Coffee. Nenhum recebe informações sobre suas imagens. Todo o código que lê, decodifica ou grava um arquivo é servido por este site e está no repositório."

[[privacy]]
title = "Funciona offline."
body = "Carregue a página uma vez e desconecte a rede: a ferramenta continua igual. Essa é a prova mais simples: um conversor que enviasse suas imagens para processamento não conseguiria fazer isso."

[[howto]]
title = "Escolha seus arquivos AVIF."
body = "Arraste-os para a área de seleção ou escolha-os manualmente. Cada arquivo é identificado pelos primeiros bytes, e não pelo nome. Assim, um AVIF renomeado durante o download continua funcionando, enquanto um arquivo que realmente é PNG é recusado com uma mensagem informando seu formato."

[[howto]]
title = "Defina a qualidade e a cor de fundo para qualquer transparência."
body = "O controle começa em 92, valor em que é difícil distinguir uma fotografia do original. O campo de cor só aparece se houver transparência na lista, porque o JPEG precisa preencher essas áreas."

[[howto]]
title = "Clique em &ldquo;Converter&rdquo; e baixe."
body = "Cada resultado informa o arquivo de origem, o novo tamanho e a comparação com o anterior &mdash; normalmente bem maior, porque AVIF comprime muito melhor e você está trocando tamanho por compatibilidade. Um arquivo oferece um botão para baixar; vários também oferecem um ZIP."

[[faq]]
q = "Minha imagem é enviada para algum lugar?"
a = "Não. O arquivo é lido, decodificado e gravado pelo seu navegador, no seu computador. Esta ferramenta não tem nenhum recurso de rede &mdash; não busca nem envia nada &mdash; e a <code>Content-Security-Policy</code> da página lista todos os endereços que ela pode contatar, nenhum deles pertencente a este site. Nem sequer há um decodificador para carregar primeiro: seu navegador já tem um."

[[faq]]
q = "Por que nenhum programa no meu computador abre este arquivo?"
a = "Porque AVIF ainda é recente para muitos programas. Os sites passaram a usá-lo por ser muito menor que JPEG na mesma qualidade. Por isso, salvar uma imagem hoje pode gerar um <code>.avif</code> &mdash; e o programa usado para abri-lo muitas vezes é anterior ao formato. O Windows precisa de uma extensão, muitos editores ainda o recusam, e a maioria dos leitores de livros digitais, impressoras e formulários de upload não o reconhece. Seu navegador, por outro lado, lê AVIF perfeitamente. É por isso que esta página pode ajudar e também por isso que você recebeu esse formato."

[[faq]]
q = "O JPG será maior que o AVIF?"
a = "Quase certamente, muitas vezes várias vezes maior, e o resultado informa quanto. AVIF é um dos codecs de imagem mais eficientes, enquanto JPEG é um dos mais antigos. Uma imagem de 40 KB em AVIF pode facilmente ocupar 200 KB em JPEG com a mesma qualidade visual. É a troca de tamanho por compatibilidade. Se o tamanho ainda importar, o <a href=\"/pt/comprimir-imagem/\">Compressor de imagens</a> reduz o JPEG até o tamanho que você definir."

[[faq]]
q = "O que acontece com a transparência?"
a = "Ela é preenchida com a cor que você escolher, e a página avisa antes de você iniciar. AVIF tem canal alfa; JPEG não, então a transparência não pode ser preservada &mdash; a decisão é qual cor colocar no fundo, e essa escolha cabe a você. Na prática, a maioria dos AVIFs são fotografias sem transparência, e o campo nem aparece. Se precisar preservá-la, converta em PNG ou WebP com o <a href=\"/pt/comprimir-imagem/\">Compressor de imagens</a>, que lê AVIF e grava ambos os formatos."

[[faq]]
q = "E o HDR e as cores de 10 bits?"
a = "Não são preservados, porque JPEG não pode armazená-los. AVIF pode guardar dez ou doze bits por canal e descrever regiões mais brilhantes do que uma tela comum mostra; JPEG usa oito bits, sem esse recurso. Um AVIF HDR se torna uma imagem comum &mdash; o resultado desejado se você precisa de um arquivo que abra em qualquer lugar, mas uma perda real para arquivamento. Quase nenhuma imagem salva de uma página comum é HDR, então isso não afeta a maioria das pessoas."

[[faq]]
q = "A imagem é recomprimida?"
a = "Sim, necessariamente: AVIF e JPEG usam codecs diferentes, então é preciso decodificar a imagem e codificá-la novamente. Isso vale para todo conversor de AVIF, inclusive os que pedem upload. Você controla o impacto dessa etapa: o padrão é qualidade 92, em que é muito difícil distinguir uma fotografia do original."

[[faq]]
q = "É possível converter no sentido contrário, de JPG para AVIF?"
a = "Não aqui. O motivo merece explicação: nenhum navegador grava AVIF. Se você pedir AVIF a um canvas, ele devolve PNG silenciosamente, com o tipo errado &mdash; então uma página que afirma gravar AVIF no navegador está enganada ou envia sua imagem a um servidor para codificação. Fazer isso corretamente sem servidor exige distribuir um codificador, um trabalho real que está no <a href=\"/pt/roteiro/\">roteiro de desenvolvimento</a>, em vez de fingir que já existe."

[[faq]]
q = "A data, a câmera e a localização são preservadas?"
a = "Não. A imagem é desenhada em um canvas, que contém apenas pixels. EXIF, GPS, perfis de cor e XMP ficam para trás. Uma imagem salva de uma página da web normalmente já não contém esses dados. Para ver ou editar os dados de um arquivo, o <a href=\"/pt/remover-dados-exif/\">Visualizador e removedor de EXIF</a> faz isso sem recomprimir a imagem."

[[faq]]
q = "Posso converter uma pasta inteira de uma vez?"
a = "Sim. Adicione quantos arquivos quiser &mdash; não há limite de quantidade ou tamanho, porque não existe servidor pagando pelo processamento. Cada arquivo tem sua própria linha e botão para baixar; com dois ou mais, você também pode baixar tudo em um ZIP."

[[faq]]
q = "É grátis e funciona offline?"
a = "É grátis, sem conta, login, período de teste ou marca-d'água. Os anúncios sustentam o site e não recebem informações sobre suas imagens. E funciona offline: carregue a página uma vez e desconecte a internet. Ela continua funcionando exatamente como antes, o que também é a prova mais forte de que nada é enviado."

