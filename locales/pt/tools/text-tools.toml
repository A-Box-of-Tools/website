pledge = """
    Os quatro trabalhos são aritmética sobre uma string, feita aqui, nesta página. Os
    analisadores são escritos à mão e ficam em <code>src/</code>: <code>json.js</code>,
    <code>xml.js</code>, <code>css.js</code>, <code>yaml.js</code>; e a comparação é o
    algoritmo de Myers em <code>diff.js</code>, o mesmo que o <code>git diff</code>
    usa. Esta ferramenta não tem função de rede de espécie alguma, nada para buscar e
    nada para mandar, e isso pesa aqui mais do que em qualquer outro lugar deste site:
    o que as pessoas colam num formatador são tokens de acesso, cookies de sessão,
    cadastros de clientes e código ainda não lançado."""

