description = "Formate JSON, XML, HTML, CSS e YAML, compare dois textos linha a linha, codifique em Base64 ou em URL, e converta JSON para YAML ou XML. Tudo roda no seu navegador: nada é enviado."
og_title = "Formate, compare, codifique e converta texto sem colar num servidor"
og_description = "Um formatador de JSON, um comparador, um codificador e um conversor numa página só, todos rodando no seu próprio computador. Cole um token ou um arquivo de configuração sem entregar para ninguém."
