[[privacy]]
title = "O que você cola não tem para onde ir."
body = """
 A
      Content-Security-Policy lista todo endereço que esta página pode contatar, e
      nenhum deles é nosso. Aqui não existe um ponto de coleta onde um token colado
      pudesse parar, nem nada no código que o mandasse para lá se existisse."""

[[privacy]]
title = "Aqui nada busca nada."
body = """
 Não existe em lugar nenhum de
      <code>src/</code> um <code>fetch</code>, um <code>XMLHttpRequest</code> ou um
      <code>sendBeacon</code>. Cada analisador, cada codificador e a comparação são
      funções desta página que recebem uma string e devolvem uma string."""

[[privacy]]
title = "Os formatadores mantêm o que receberam."
body = """
 Um objeto JSON volta com as chaves
      na ordem em que você escreveu e com os números grafados do jeito que você
      grafou, porque <code>src/json.js</code> é um analisador e não uma chamada de
      <code>JSON.parse</code>, que reordena as chaves parecidas com inteiros e
      transforma um id de vinte dígitos no double mais próximo. Os testes em
      <code>tests/js/text-format.test.js</code> conferem exatamente isso."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de publicidade
      e de medição vêm do Google, e o botão de doação vem do Buy Me a Coffee. Nenhum
      deles recebe um caractere do seu texto. Toda linha que o lê, analisa ou escreve é
      servida desta origem e está listada no repositório."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e a ferramenta continua
      igualzinha, porque nunca houve uma etapa de rede nela. Essa é a prova mais
      simples de todas."""

[[howto]]
title = "Escolha o trabalho."
body = """
 Quatro abas que dividem a mesma caixa:
      <em>Formatar</em> arruma ou espreme JSON, XML, HTML, CSS e YAML;
      <em>Converter</em> passa JSON para YAML ou XML e de volta; <em>Codificar</em> faz
      Base64, URL, entidades HTML, hexadecimal e escapes com barra invertida, nos dois
      sentidos; <em>Comparar</em> mostra o que mudou entre dois textos."""

[[howto]]
title = "Cole, ou solte o arquivo."
body = """
 Qualquer coisa que você consiga
      selecionar e copiar serve. Um arquivo solto no seletor é lido pelo seu próprio
      navegador e vai para a caixa: aqui não existe etapa de envio para pular. Solte
      dois arquivos enquanto compara e eles caem um de cada lado."""

[[howto]]
title = "Deixe que ele descubra a linguagem, ou diga qual é."
body = """
 O menu diz como ele leu
      o texto, e corrigir é um clique. Um palpite é só um ponto de partida, e é por isso
      que ele aparece em vez de ser aplicado caladinho."""

[[howto]]
title = "Escolha a indentação, ou esprema tudo."
body = """
 Dois espaços, quatro, ou uma
      tabulação. Espremer é o mesmo documento com todo espaço que só estava lá para
      leitura retirado, e o resultado diz quantos bytes isso economizou."""

[[howto]]
title = "Leia o erro onde o erro está."
body = """
 Um analisador que falha aqui diz o que
      encontrou e em que linha e coluna, em vez de &ldquo;token inesperado na posição
      4193&rdquo;. Em geral isso basta para consertar um arquivo de configuração sem
      abrir mais nada."""

[[howto]]
title = "Leve o resultado."
body = """
 Copie, ou baixe como arquivo. Uma comparação
      baixa como um <code>.patch</code> no formato unificado, que é o que uma revisão de
      código, o <code>git apply</code> e qualquer visualizador de diferenças
      esperam."""

[[faq]]
q = "O meu texto é enviado para algum lugar?"
a = """
        Não. Cada analisador, codificador e comparação desta página é uma função que
        roda no seu próprio navegador, no seu próprio hardware. Esta ferramenta não tem
        função de rede de espécie alguma: nunca busca nada e nunca manda nada, e a
        <code>Content-Security-Policy</code> da página lista todo endereço que ela pode
        contatar, e nenhum deles é nosso. É esse o motivo para usá-la com um token de
        acesso, um cookie de sessão ou um cadastro de cliente: colar uma dessas coisas
        no formatador de outra pessoa é entregá-la a ela."""

[[faq]]
q = "Formatar JSON muda alguma coisa além do layout?"
a = """
        Não, e isso é mais difícil do que parece. As chaves mantêm a ordem em que você
        escreveu: um formatador construído em cima do <code>JSON.parse</code> move
        caladinho para a frente as chaves parecidas com inteiros, então
        <code>{"10":a,"2":b}</code> volta como <code>{"2":b,"10":a}</code>. Os números
        mantêm os dígitos que você digitou, então um id de vinte dígitos não perde os
        três últimos para um double e <code>1e999</code> não vira <code>null</code>.
        Chaves repetidas ficam as duas, porque o padrão não diz qual vence e descartar
        uma seria escolher no seu lugar."""

[[faq]]
q = "Quais linguagens ele formata?"
a = """
        JSON, XML, HTML, CSS e YAML. JSON, XML, HTML e CSS também podem ser espremidos;
        YAML não, porque a forma curta dele é o estilo de fluxo, que é ilegível, e
        ilegível é o oposto do motivo pelo qual se mantém um arquivo em YAML.
        JavaScript ficou de fora de propósito: veja a pergunta sobre isso mais
        abaixo."""

[[faq]]
q = "Por que ele não formata JavaScript, Python ou SQL?"
a = """
        Porque arrumar uma linguagem de programação significa analisá-la direito, e um
        formatador que acerta quase tudo é pior do que nenhum: ele produz código que
        parece certo e faz outra coisa. JSON, XML, CSS e YAML têm gramáticas pequenas o
        bastante para serem lidas à mão e conferidas com testes que você pode rodar. Um
        formatador de JavaScript é o Prettier, que é um megabyte de analisador, e o
        lugar dele é no seu editor, não numa página web."""

[[faq]]
q = "O que a comparação faz de verdade?"
a = """
        Ela acha o menor conjunto de edições que transforma o texto da esquerda no da
        direita, usando o algoritmo de Myers, o mesmo que o <code>git diff</code> usa.
        Ser o menor é justamente o que torna um diff legível: uma linha inserida no meio
        deve aparecer como uma inserção, e não como se todas as linhas seguintes
        tivessem mudado. Dentro de uma linha alterada, as palavras que diferem também são
        marcadas, então comparar dois parágrafos mostra a palavra que se moveu em vez de
        dois parágrafos inteiros."""

[[faq]]
q = "Dá para comparar dois arquivos em vez de dois textos colados?"
a = """
        Dá. Solte os dois no seletor com a aba Comparar aberta e eles caem um de cada
        lado, na ordem em que você soltou. Quem lê é o seu navegador, para dentro desta
        página, que é o único lugar aonde eles vão. Troque os lados se você soltou na
        ordem errada."""

[[faq]]
q = "O que sai de uma comparação, e dá para aplicar?"
a = """
        O download é um diff unificado: o formato <code>@@ -3,5 +3,5 @@</code> que o
        <code>git apply</code>, o <code>patch</code> e qualquer ferramenta de revisão de
        código leem. Copiar faz a mesma coisa para a área de transferência. O que está
        na tela é uma visualização disso: lado a lado, ou numa coluna só, com as partes
        sem mudança recolhidas para uma contagem, a menos que você peça todas."""

[[faq]]
q = "O Base64 daqui é o mesmo Base64 de todo mundo?"
a = """
        É: ele é conferido contra os vetores de teste do RFC 4648, e não contra ele
        mesmo. Os dois alfabetos decodificam, então um JWT escrito com <code>-</code> e
        <code>_</code> se lê tão fácil quanto um escrito com <code>+</code> e
        <code>/</code>, e uma entrada quebrada a cada 64 caracteres é juntada para você.
        A codificação passa por bytes UTF-8, então uma letra acentuada ou um emoji
        sobrevive à ida e à volta."""

[[faq]]
q = "Meu YAML diz no e o JSON saiu como string. Por quê?"
a = """
        Porque é uma string, e aqui se lê YAML 1.2 e não 1.1. No YAML 1.1,
        <code>yes</code>, <code>no</code>, <code>on</code> e <code>off</code> eram
        booleanos, que é o famoso bug que transforma o código de país da Noruega em
        <code>false</code>. O YAML 1.2 tirou isso, e esta ferramenta também: só
        <code>true</code>, <code>false</code>, <code>null</code> e <code>~</code> são
        lidos como outra coisa que não texto. No sentido inverso, essas palavras são
        escritas de volta <em>entre aspas</em>, mesmo que aqui elas fossem lidas como
        texto sem as aspas, porque o que abrir o arquivo depois talvez não leia. O
        PyYAML ainda usa 1.1 por padrão. Ler com rigor e escrever com prudência é a
        única combinação que dá certo nos dois sentidos."""

[[faq]]
q = "O que se perde ao converter YAML para JSON?"
a = """
        Os comentários, porque JSON não tem onde colocar um. Âncoras, aliases e tags são
        recusados de cara em vez de adivinhados: cada um deles diz algo que o JSON não
        sabe dizer, e um conversor que escolhesse caladinho uma interpretação te
        entregaria um documento que não é o que o arquivo dizia. No outro sentido não se
        perde nada: todo documento JSON já é um documento YAML."""

[[faq]]
q = "O que se perde ao converter JSON para XML?"
a = """
        A diferença entre um objeto vazio, um array vazio e uma string vazia, que viram
        todos um elemento vazio, e o tipo de cada valor, porque XML não tem tipos, que é
        por isso que a conversão inversa deixa tudo como string em vez de decidir que
        <code>8080</code> era um número. Um array vira um elemento repetido, que é o
        único formato que se lê de volta, e uma chave que um nome de elemento não
        comporta tem os caracteres inconvenientes substituídos, em vez de sair um
        documento que analisador nenhum vai ler."""

[[faq]]
q = "Reindentar HTML muda a aparência da página?"
a = """
        Pode mudar, e aqui isso é dito com honestidade. O espaço entre dois elementos
        inline é um espaço entre duas palavras, então mexer nele não sai de graça. Duas
        coisas seguram isso: <code>&lt;pre&gt;</code> e <code>&lt;textarea&gt;</code>
        são copiados exatamente como estavam, e um elemento que só contém texto fica numa
        linha só. Todo o resto é arrumado."""

[[faq]]
q = "De que tamanho pode ser o arquivo?"
a = """
        Aqui não tem limite definido, porque não existe servidor pagando por um. O teto
        de verdade é o seu próprio computador: alguns megabytes de JSON vão bem. A
        comparação de dois textos que não têm absolutamente nada em comum para cedo e
        avisa, em vez de gastar um minuto provando o óbvio; e uma comparação muito longa
        desenha as primeiras milhares de linhas e deixa o resto para o patch baixado."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem limite de quanto
        você cola. O site exibe publicidade, e é ela que paga a conta; os anúncios não
        recebem nada sobre o seu texto."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela continua
        funcionando. Esse é também o jeito mais simples de provar que nada está sendo
        enviado: uma ferramenta que mandasse o seu texto embora para ser formatado
        pararia no instante em que você tirasse da tomada."""

