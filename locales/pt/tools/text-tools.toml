features = [
  "Formata e minifica JSON, XML, HTML e CSS, e arruma YAML",
  "Mantém a ordem das chaves JSON e os dígitos exatos de cada número",
  "Diz em que linha e coluna está um erro, com palavras",
  "Compara dois textos com o algoritmo de Myers, lado a lado ou numa coluna",
  "Marca as palavras que mudaram dentro de uma linha alterada",
  "Baixa uma comparação como diff unificado que uma revisão de código consegue ler",
  "Base64 nos dois alfabetos, codificação por porcentagem, entidades HTML, hexadecimal e escapes com barra",
  "Converte JSON para YAML e XML, e de volta, dizendo o que cada sentido perde",
  "Lê YAML 1.2, então yes e no continuam strings",
  "Funciona com um arquivo solto tão bem quanto com texto colado",
  "Funciona offline; sem envio, sem conta",
]

