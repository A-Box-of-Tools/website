#
# Leitor de QR Code e código de barras - português do Brasil.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "QR Code" fica em inglês porque é assim que se fala no Brasil, inclusive em
# placa de restaurante; "código de barras", esse sim, é português corrente. Os
# nomes dos simbolismos - EAN-13, UPC-A, ITF-14, Code 128, Code 39,
# ISO/IEC 18004 - são nomes de norma e ficam como estão.
#
# "Ler" e não "escanear": as duas se falam, mas é "ler QR Code" que se digita.
#

name = "Leitor de QR Code e código de barras"
heading = "Leitor de QR&nbsp;Code&nbsp;e&nbsp;código&nbsp;de&nbsp;barras <span class=\"h1-kw\">&mdash; ler um QR Code de uma imagem ou pela câmera</span>"
tagline = "Aponte a câmera, ou solte aqui uma foto. A leitura acontece aqui, e em nenhum outro lugar."

title = "Leitor de QR Code &amp; scanner de código de barras &mdash; de uma imagem, sem enviar nada"
description = "Leia um QR Code de uma foto, de um print ou pela câmera, e veja exatamente para onde o link leva antes de abrir. EAN, UPC, Code 128, Code 39 e ITF também. Nada é enviado."
og_title = "Ler um QR Code sem mandar a imagem para ninguém"
og_description = "Leia um QR Code de uma imagem ou pela câmera e veja o endereço inteiro antes de decidir se abre. A imagem não sai da sua máquina, e nenhum quadro da câmera é gravado."
og_image_alt = "Leitor de QR Code e código de barras - ler um código de uma imagem ou pela câmera, sem enviar nada"

pledge = """
    Ler um código é aritmética sobre pixels, e os pixels já estão aqui. Achar o
    símbolo, corrigir o ângulo, desfazer a máscara, reparar o dano com
    Reed-Solomon e ler os bits de volta acontece tudo em cerca de duas mil linhas
    de JavaScript nesta página, que você pode ler. <strong>A câmera é a mesma
    promessa, não uma exceção a ela:</strong> um quadro chega como pixels nesta
    aba, é examinado e some. Nada é gravado, nada fica guardado, e esta página
    não tem função de rede de espécie alguma para mandar coisa nenhuma."""

live_hint = """
      Você não precisa confiar na nossa palavra. Abra as ferramentas do
      desenvolvedor, deixe a aba &ldquo;Rede&rdquo; à vista e leia um código com a
      câmera ligada. Nenhuma requisição leva um quadro nem um caractere do que
      estava escrito. Ou então desligue a internet e leia o código assim
      mesmo."""

read_first = """
, <code>src/binarize.js</code>
      e <code>src/detect.js</code> para achar um símbolo dentro de uma fotografia
      &mdash; o limiar, os padrões de localização e a correção de perspectiva
      &mdash;, <code>src/qr-decode.js</code> para ler de volta,
      <code>src/reed-solomon.js</code> para reparar o que foi lido errado,
      <code>src/linear.js</code> para os de barra e <code>src/camera.js</code>,
      que é cada linha desta página que encosta numa câmera."""

howto_heading = "Como ler um QR Code sem enviar a imagem"

card = """
            Leia um QR Code de uma foto, de um print ou pela câmera &mdash; e
            veja o endereço inteiro antes de abrir. Código de barras
            também."""

[picker]
title = "Solte aqui uma imagem com um código"
hint = "ou clique para procurar &mdash; uma foto, um print, um PNG, qualquer coisa que o seu navegador abra"

[words]
plural = "as imagens e os códigos que estão nelas"
choose = "a imagem que vai ser lida"

[[facts]]
text = "Nada é enviado"

[[facts]]
text = "Sem conta"

[[facts]]
text = "Nada é gravado"

[[facts]]
text = "Funciona offline"

[[facts]]
text = "Código aberto"

[[privacy]]
title = "A imagem nunca é enviada, e a câmera não é exceção."
body = """
 Uma foto que você
      solta aqui é decodificada num canvas desta página e lida ali. Um quadro da
      câmera é a mesma coisa chegando trinta vezes por segundo: é desenhado nesse
      canvas, examinado e sobrescrito pelo seguinte. Nenhum é gravado, nenhum
      fica guardado, e a luz da câmera apagando quando você aperta parar é tudo o
      que existe."""

[[privacy]]
title = "Aqui não tem nada que busque nada."
body = """
 Não existe
      <code>fetch</code>, nem <code>XMLHttpRequest</code>, nem
      <code>sendBeacon</code> em lugar nenhum de <code>src/</code>, e a
      <code>Content-Security-Policy</code> da página não deixa nenhum endereço
      para onde esta origem pudesse mandar alguma coisa, mesmo que houvesse. É
      por isso que esta página não consegue dizer onde um link encurtado vai
      parar: descobrir seria perguntar, e ela não pergunta."""

[[privacy]]
title = "Ela mostra o endereço. Nunca abre."
body = """
 Um QR Code impresso é um
      endereço que ninguém consegue ler, e é exatamente isso que faz valer a pena
      para alguém colar um adesivo por cima. Aqui nada é aberto. O texto inteiro
      é mostrado para você olhar, o host onde você realmente cairia sai numa
      linha só dele, e os truques que fazem um endereço parecer outro &mdash; um
      nome de usuário antes de um <code>@</code>, um nome escrito num alfabeto
      cujas letras têm a forma das nossas, um redirecionamento &mdash; são
      apontados onde aparecem."""

[[privacy]]
title = "Ela também mostra o que amostrou."
body = """
 Embaixo de cada resultado de QR
      Code tem uma imagem dos módulos que esta página leu de verdade da sua
      fotografia. Se aquilo parece o código que você leu, a resposta acima está
      de pé; se parece chuvisco, não está. Um leitor que te dá um texto e mais
      nada não pode ser conferido assim."""

[[privacy]]
title = "O que o Google carrega, e o que não recebe."
body = """
 Os scripts de anúncio e
      de medição vêm do Google, e o botão de doação vem do Buy Me a Coffee.
      Nenhum deles recebe uma imagem, um quadro, nem nada lido dali. Cada linha
      que transforma pixels em texto é servida desta mesma origem e está no
      repositório."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e a ferramenta continua a
      mesma, câmera inclusive, porque nunca houve um passo de rede nela. É a
      prova mais simples de todas."""

[[howto]]
title = "Dê a imagem para ela."
body = """
 Solte uma foto ou um print na caixa,
      cole uma direto, ou aperte o botão da câmera. Várias de uma vez pode: cada
      uma é lida por conta própria e cada uma tem a sua resposta. Um print de um
      código que já está na sua tela é o caminho mais rápido e o mais confiável,
      porque ali não entra lente, nem ângulo, nem luz."""

[[howto]]
title = "Ponha o símbolo inteiro no quadro, margem incluída."
body = """
 O branco em volta de um
      código faz parte do código: é assim que um leitor sabe onde o símbolo
      termina. Uma foto cortada rente à borda dos quadradinhos é de longe o motivo
      mais comum de um código não ser lido. Encher mais ou menos metade do quadro
      com o código está bom; mais perto do que isso e os cantos ficam de
      fora."""

[[howto]]
title = "Leia o endereço antes de decidir qualquer coisa."
body = """
 O motivo de ler um código
      num cartaz, num parquímetro ou numa carta é descobrir para onde ele leva, e
      é justamente isso que a câmera do celular não deixa você fazer de verdade.
      Aqui o host fica numa linha só dele. Se não for um nome que você esperava,
      você já conseguiu o que veio buscar e não sobra nada para abrir."""

[[howto]]
title = "Leve os avisos a sério, principalmente os discretos."
body = """
 Um endereço
      <code>http://</code> puro, um nome num alfabeto que não é o que parece, um
      encurtador de link, ou qualquer coisa antes de um <code>@</code> no
      endereço: cada um é apontado onde aparece. Nenhum deles prova nada sozinho.
      Todos valem dez segundos antes de você ir."""

[[howto]]
title = "Se não ler, mude a luz antes de mudar qualquer outra coisa."
body = """
 Quase toda falha é
      problema de limiar: um reflexo atravessando o meio, uma sombra sobre um
      canto, ou uma tela fotografada num ângulo que pega a luz de fundo. Mude de
      posição para o brilho não cair no código, ou acenda a luz da câmera. Se
      ainda assim não der, tire uma foto reta e de frente e solte essa &mdash;
      uma imagem parada recebe uma busca muito mais minuciosa do que um quadro ao
      vivo consegue receber."""

[[howto]]
title = "Se a resposta parecer estranha, olhe a imagem amostrada."
body = """
 Abra &ldquo;como este
      foi lido&rdquo; e olhe a gradezinha. É o que esta página achou que o código
      era, redesenhado a partir dos módulos que ela amostrou. Um leitor que leu um
      símbolo errado e o reparou até virar algo plausível mostra isso ali, e em
      nenhum outro lugar."""

[[faq]]
q = "A imagem é enviada para algum lugar?"
a = """
        Não, e nem o que é lido dela. A imagem é decodificada num canvas desta
        página e lida ali, por JavaScript servido deste site. Esta ferramenta não
        tem função de rede de espécie alguma &mdash; nunca busca nada e nunca
        manda nada &mdash; e a <code>Content-Security-Policy</code> da página
        nomeia todo endereço que ela pode contatar, e nenhum deles é nosso. A
        prova mais simples é desligar a internet: ela continua funcionando."""

[[faq]]
q = "A câmera grava alguma coisa?"
a = """
        Não. Um quadro da câmera chega como pixels nesta aba, é desenhado num
        canvas, é examinado e é sobrescrito pelo próximo cerca de um décimo de
        segundo depois. Nada é escrito em disco e nada fica guardado. O fluxo para
        assim que você aperta parar, quando a aba vai para segundo plano e quando
        você sai da página &mdash; e a luz da sua câmera é o indicador em que
        confiar, porque nenhuma página consegue apagá-la."""

[[faq]]
q = "Por que ela me mostra o link em vez de abrir?"
a = """
        Porque essa é a parte útil. Um QR Code é um endereço que você não consegue
        ler, e é justamente por isso que um adesivo sobre o código de um
        parquímetro funciona: quando você descobre para onde ele ia, já está lá.
        Aqui o texto é mostrado inteiro, o host sai numa linha só dele, e abrir é
        um botão separado que você aperta depois de ler. É um clique a mais, e é o
        clique de que esse formato sempre precisou."""

[[faq]]
q = "O que ela consegue ler?"
a = """
        QR Codes em todas as versões, da 1 à 40, nos quatro níveis de correção de
        erro, em modo numérico, alfanumérico, byte e kanji, informando os
        conjuntos de caracteres ECI e os símbolos de um conjunto encadeado em vez
        de descartar em silêncio. Do lado das barras: EAN-13, EAN-8, UPC-A,
        UPC-E, ITF-14, Interleaved 2 of 5, Code 128 e Code 39. Não lê Data Matrix,
        PDF417, Aztec nem MaxiCode."""

[[faq]]
q = "Ela não lê o meu código. O que está errado?"
a = """
        Nove em cada dez vezes é uma de três coisas. A margem branca foi cortada, e
        um leitor usa ela para saber onde o símbolo acaba. Tem um reflexo ou uma
        sombra sobre parte do código, então nenhum limiar separa os quadradinhos
        escuros dos claros. Ou o código está tão pequeno no quadro que os módulos
        dele não passam de um ou dois pixels. Mude a luz, encha mais ou menos
        metade do quadro, e tire a foto de frente em vez de enviesada."""

[[faq]]
q = "Ela lê um código danificado ou coberto em parte?"
a = """
        Muitas vezes sim, e isso é o formato funcionando como foi projetado, não
        nenhuma esperteza daqui. Todo QR Code carrega dados de verificação
        Reed-Solomon, e um símbolo feito no nível H pode perder cerca de 30% dos
        módulos e ainda assim ser reconstruído exato. A página diz quantas
        palavras de código teve de reparar em &ldquo;como este foi lido&rdquo;,
        para você ver o quanto foi apertado. O que ela não faz é chutar: um
        símbolo danificado além do que a verificação aguenta é informado como
        ilegível, e não respondido errado."""

[[faq]]
q = "Por que ela diz que não sabe para onde um link do bit.ly leva?"
a = """
        Porque descobrir seria perguntar ao bit.ly, e isso é uma requisição de
        rede. Todo o resto do que esta página afirma se apoia em não existir aqui
        nenhum código que contate coisa alguma, e abrir uma exceção caladinho
        valeria menos do que a resposta. Então o encurtador é apontado e o que ele
        esconde fica honestamente desconhecido. Se você quiser resolver, cole num
        lugar que aceite perguntar."""

[[faq]]
q = "É seguro ler um QR Code?"
a = """
        Ler é seguro. Obedecer é o risco, e é um risco real: código colado por
        cima do verdadeiro em parquímetro, em mesa de restaurante e em aviso de
        entrega já é comum o bastante para ter nome. O que faz isso funcionar é
        que ninguém consegue ler um código olhando para ele. Ler sem abrir
        &mdash; que é o que esta página faz &mdash; tira essa vantagem inteira, e
        os dez segundos que custa olhar o host são a defesa toda."""

[[faq]]
q = "O que é a gradezinha embaixo de cada resultado?"
a = """
        Os módulos que esta página amostrou de verdade da sua imagem, redesenhados
        a um quadradinho por módulo. Ela está aí para a leitura poder ser conferida
        no olho em vez de acreditada: se aquela grade parece o código que você
        fotografou, a resposta acima saiu dos pixels certos. Quase nenhum leitor
        te mostra isso, e é a diferença entre uma ferramenta que dá para conferir e
        uma em que você tem que acreditar."""

[[faq]]
q = "Ela lê vários códigos numa imagem só?"
a = """
        Um por imagem, por enquanto. Solte várias imagens de uma vez e cada uma é
        lida por conta própria, e a câmera vai lendo código atrás de código
        enquanto você move, guardando cada um novo que ainda não viu. Uma única
        foto com uma folha cheia de códigos é caso de recortar, ou de apontar a
        câmera para um de cada vez."""

[[faq]]
q = "Por que ela chama o meu código de barras de outro nome?"
a = """
        Porque um código de barras não carrega o próprio nome. UPC-A é um EAN-13
        cujo primeiro dígito é zero, ITF-14 é Interleaved 2 of 5 com catorze
        dígitos e um dígito verificador válido, e o Code 128 no modo numérico não
        se parece com mais nada. O que esta página informa é o que as barras dizem
        mais o que o dígito verificador confirma, que é tudo o que o próprio
        símbolo sabe."""

[[faq]]
q = "Funciona offline?"
a = """
        Sim. Carregue a página uma vez, depois desligue a internet e ela continua
        funcionando, câmera inclusive. É também o jeito mais simples de provar que
        nada é enviado: um leitor que mandasse a sua imagem para fora para ser
        decodificada pararia no instante em que você tirasse da tomada."""

