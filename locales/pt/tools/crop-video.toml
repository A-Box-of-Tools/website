      ferramenta que mandasse o seu vídeo embora para ser processado simplesmente
      pararia."""

read_first = """
, <code>src/shared/mp4-reader.js</code> para o leitor que acha os
      quadros num MP4, e <code>src/transcode.js</code> para o laço que decodifica,
      corta e codifica. Nenhum dos dois importa qualquer coisa que consiga fazer
