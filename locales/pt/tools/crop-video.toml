[[privacy]]
title = "Seus vídeos não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todos os endereços que esta página pode
      acessar, e nenhum deles é deste site. Não existe aqui um endpoint onde o seu
      arquivo pudesse ser recolhido, e não existe no código nada que o mandaria
      mesmo que existisse."""

[[privacy]]
title = "Nada aqui vai buscar coisa alguma."
body = """
 Esta ferramenta não tem função de
      rede nenhuma: nenhum endereço para colar, nada para baixar, nenhum motor
      buscado no primeiro uso. Cada byte que encosta no seu vídeo veio desta
      origem quando a página carregou."""

[[privacy]]
title = "A decodificação e a codificação são locais."
body = """
 Os quadros passam pelo
      WebCodecs no seu próprio navegador, ou pelo mesmo motor de reprodução que
      exibiria o clipe para você de qualquer jeito. O arquivo pronto é montado na
      memória deste computador e vai direto para um download."""

[[privacy]]
title = "O som é copiado, não escutado."
body = """
 No caminho do MP4, as amostras
      de áudio são movidas sem serem decodificadas. Nada aqui as transforma de
      volta em som, e nada conseguiria passá-las a lugar nenhum se
      transformasse."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre o seu vídeo: nem um arquivo, nem um quadro, nem um nome, um tamanho,
      uma duração ou o formato para o qual você cortou. Toda linha que lê,
      decodifica, corta ou codifica é servida desta origem e está listada no
      repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script
      vindo de cdnjs.buymeacoffee.com e busca as letras dele no Google Fonts. É um
      link e nada mais: não informa visita nenhuma, e não recebe nada sobre você
      nem sobre o seu vídeo."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Essa é a prova mais simples de todas."""

[[howto]]
title = "Escolha um vídeo."
body = """
 Arraste um MP4, MOV, M4V ou WebM até o
      seletor, ou escolha um na mão. Quem lê o arquivo direto do seu disco é o
      navegador, e nada é mandado para lugar nenhum enquanto você faz isso."""

[[howto]]
title = "Arraste a caixa sobre a parte que você quer manter."
body = """
 Arraste
      dentro dela para movê-la e qualquer canto para redimensionar. Trave numa
      proporção antes (1:1 para um post quadrado, 9:16 para celular, 16:9 para um
      quadro deitado) ou digite uma caixa exata em pixels nos quatro campos
      abaixo.
      Toque o vídeo, ou arraste o controle deslizante abaixo dele, para escolher o quadro sobre o qual você alinha a caixa."""

[[howto]]
title = "Escolha quanta qualidade gastar."
body = """
 A imagem precisa ser
      codificada de novo, porque um quadro cortado é outra imagem. A
      &ldquo;Equilibrada&rdquo; mantém a imagem perto do que o arquivo já gastava
      naquela área, e a &ldquo;Melhor qualidade&rdquo; gasta mais. O som é
      mantido, a menos que você desligue."""

[[howto]]
title = "Corte e baixe."
body = """
 O trabalho acontece no seu próprio hardware,
      então o tempo que leva depende do seu computador e não de uma fila. O vídeo
      pronto vai direto para os downloads do seu navegador."""

[[faq]]
q = "Meu vídeo é enviado para algum lugar?"
a = """
        Não. Quem lê, decodifica, corta e codifica é o seu próprio navegador, no seu
        próprio hardware. Não existe lado de servidor nesta ferramenta, e a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum deles deste site. Se você prefere conferir a
        acreditar, desligue a internet e corte um clipe assim mesmo."""

[[faq]]
q = "Quais formatos de vídeo posso cortar?"
a = """
        MP4, M4V e MOV são lidos diretamente, seja lá o que houver dentro deles:
        H.264, HEVC, AV1 ou VP9, desde que o seu navegador saiba decodificar aquele
        codec. Qualquer outra coisa que o seu navegador consiga tocar, e aí o caso
        mais óbvio é o WebM, é cortada tocando o arquivo e gravando o resultado, o
        que funciona mas leva o mesmo tempo que o clipe dura. Um arquivo que o
        navegador não consegue nem ler nem tocar, o que na prática significa AVI,
        WMV, FLV e a maioria dos MKVs, é recusado com uma mensagem dizendo isso, em
        vez de falhar no meio do caminho."""

[[faq]]
q = "Existe limite de tamanho ou de duração do vídeo?"
a = """
        A ferramenta não tem limite embutido, e o arquivo não é lido para a memória
        de uma vez só: ele é percorrido em fatias de alguns megabytes. O teto
        prático é o vídeo pronto, que é montado na memória antes de você baixar, e o
        tempo que o seu computador leva para codificá-lo."""

[[faq]]
q = "O som sobrevive?"
a = """
        No caminho do MP4, exatamente: o áudio é copiado amostra por amostra sem
        nunca ser decodificado, então sai byte a byte igual ao que estava no
        arquivo. No caminho da gravação, ele é capturado da reprodução e codificado
        de novo, o que custa um pouco de qualidade. De qualquer jeito, existe uma
        caixinha para deixá-lo de fora por completo."""

[[faq]]
q = "Cortar perde qualidade?"
a = """
        A imagem é codificada de novo, porque um quadro cortado é outra imagem e não
        tem como guardá-la sem escrever os pixels de novo. O que a ferramenta não faz
        é gastar mais do que o original gastava naquela mesma área, já que
        recodificar acima disso só deixa o arquivo maior sem deixá-lo mais
        bonito."""

[[faq]]
q = "Posso encurtar a duração também?"
a = """
        Aqui não, mas na ferramenta ao lado sim. Esta muda o formato da imagem e mais
        nada: o clipe que sai tem exatamente a mesma duração do que entrou, com a
        temporização e o som intactos. Aparar é outro trabalho e é outra ferramenta.
        O <a href="../aparar-video/">Aparador de vídeo</a> marca os trechos de um
        clipe que valem a pena e os salva como um arquivo só, sem recodificar um
        quadro."""

[[faq]]
q = "Por que a largura e a altura andam de dois em dois?"
a = """
        O H.264, o codec dentro de um MP4, guarda a imagem em blocos e não tem como
        descrever um quadro com um número ímpar de pixels num lado. Em vez de
        arredondar o seu corte em silêncio depois que você o define, a caixa já
        oferece só números pares desde o começo."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem marca
        d'água. O site exibe publicidade, e é ela que paga a conta. Os anúncios não
        recebem nada sobre o seu vídeo."""

[schema]
browser_requirements = "Requer JavaScript. A saída em MP4 precisa de um navegador com WebCodecs; os demais recuam para gravar WebM."
description = "Corte um vídeo para qualquer formato ou caixa exata em pixels dentro do navegador. MP4, MOV e M4V são decodificados e recodificados quadro a quadro, com o áudio original levado adiante intocado; qualquer outra coisa que o navegador consiga tocar é cortada por gravação. Nada é enviado."
features = [
  "Corta vídeo em MP4, MOV, M4V e WebM",
  "Origens em H.264, HEVC, AV1 e VP9, decodificadas pelo WebCodecs",
  "Corte livre, proporções travadas (1:1, 4:5, 9:16, 16:9, 4:3, 3:2) ou uma caixa exata em pixels",
  "Mantém o áudio original sem recodificá-lo",
  "Roda offline; sem envio, sem conta, sem marca d'água",
]

[picker]
title = "Arraste um vídeo para cá"
hint = "ou clique para escolher: MP4, MOV, M4V, WebM e tudo o mais que este navegador tocar"
