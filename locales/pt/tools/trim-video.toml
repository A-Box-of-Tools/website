[[privacy]]
title = "Seus vídeos não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todos os endereços que esta página pode
      acessar, e nenhum deles é deste site. Não existe aqui um endpoint onde o seu
      arquivo pudesse ser recolhido, e não existe no código nada que o mandaria
      mesmo que existisse."""

[[privacy]]
title = "Nada aqui vai buscar coisa alguma."
body = """
 Esta ferramenta não tem função de
      rede nenhuma: nenhum endereço para colar, nada para baixar, nenhum motor
      buscado no primeiro uso. Cada byte que encosta no seu vídeo veio desta
      origem quando a página carregou."""

[[privacy]]
title = "No caminho normal, nada chega sequer a ser decodificado."
body = """

      Aparar não muda a aparência de quadro nenhum, então os quadros codificados
      dos trechos que você marcou são movidos para o arquivo novo exatamente como
      foram encontrados. Cada um fica guardado como uma fatia do arquivo no seu
      disco, ou seja, uma anotação dizendo quais bytes, e não os bytes em si. O seu
      navegador só os lê pela primeira vez na hora de escrever o download. Nada
      aqui transforma o seu vídeo de volta em imagem."""

[[privacy]]
title = "O arquivo de marcações é feito na página."
body = """
 Salvar as suas
      marcações escreve um arquivo de texto a partir dos números que já estão na
      tela, direto para os seus downloads. Carregar um lê o arquivo aqui mesmo.
      Nenhum dos dois chega perto de uma rede, e nenhum dos dois carrega nada além
      de tempos."""

[[privacy]]
title = "O som é copiado, não escutado."
body = """
 Nos dois caminhos de MP4, as
      amostras de áudio são movidas sem serem decodificadas. Nada aqui as
      transforma de volta em som, e nada conseguiria passá-las a lugar nenhum se
      transformasse."""

[[privacy]]
title = "Onde quadros são decodificados, isso acontece aqui."
body = """
 O corte exato,
      e a pré-visualização de um arquivo que este navegador não toca, passam pelo
      WebCodecs no seu próprio computador. É o mesmo decodificador que exibiria o
      vídeo para você de qualquer jeito, rodando no mesmo lugar."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre o seu vídeo: nem um arquivo, nem um quadro, nem um nome, um tamanho,
      uma duração ou onde você cortou. Toda linha que lê, corta e escreve é
      servida desta origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script
      vindo de cdnjs.buymeacoffee.com e busca as letras dele no Google Fonts. É um
      link e nada mais: não informa visita nenhuma, e não recebe nada sobre você
      nem sobre o seu vídeo."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Essa é a prova mais simples de todas."""

[[howto]]
title = "Escolha um vídeo."
body = """
 Arraste um MP4, MOV, M4V ou WebM até o
      seletor. Quem lê o arquivo direto do seu disco é o navegador, e nada é
      mandado para lugar nenhum enquanto você faz isso. Arraste vários e eles são
      emendados, na ordem em que você colocou."""

[[howto]]
title = "Toque, e marque os trechos que você quer."
body = """
 Aperte
      <kbd>I</kbd> onde um trecho deve começar e <kbd>O</kbd> onde ele deve
      terminar. Faça isso quantas vezes quiser: cada par vira uma linha na tabela
      de baixo e uma faixa na linha do tempo. O <kbd>U</kbd> desfaz o último, o
      <kbd>Espaço</kbd> toca e pausa, e as setas pulam cinco segundos por vez.
      Diminua a velocidade de reprodução se o momento for difícil de pegar."""

[[howto]]
title = "Acerte as marcações."
body = """
 Cada linha pode ser reproduzida sozinha,
      retemporizada com um tempo exato digitado nela, movida para cima ou para
      baixo na ordem, ou apagada. As duas pontas do trecho selecionado também
      podem ser arrastadas ao longo da linha do tempo. O total lá em cima é o que
      o vídeo pronto vai durar."""

[[howto]]
title = "Fique com eles, ou tire-os fora."
body = """
 Ficar é o sentido de
      sempre: o vídeo pronto são os trechos que você marcou, emendados em ordem.
      Tirar fora é o outro trabalho que as pessoas querem e raramente acham. Marque
      os comerciais, os silêncios ou as tentativas falhas, e o que sobra é emendado
      sem eles."""

[[howto]]
title = "Apare, e baixe."
body = """
 O &ldquo;Manter cada byte&rdquo; move os
      quadros intocados. É rápido, e não tem como custar qualidade, mas cada trecho
      começa no keyframe anterior à sua marcação. Já o &ldquo;Cortar exatamente
      aqui&rdquo; decodifica e escreve a imagem de novo, para que cada trecho
      comece no quadro que você escolheu. A página diz qual dos dois você está
      prestes a receber, e o que isso custa, antes de você clicar no botão."""

[[faq]]
q = "Meu vídeo é enviado para algum lugar?"
a = """
        Não. Quem lê, marca, corta e escreve é o seu próprio navegador, no seu
        próprio hardware. Não existe lado de servidor nesta ferramenta, e a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum deles deste site. Se você prefere conferir a
        acreditar, desligue a internet e apare um vídeo assim mesmo."""

[[faq]]
q = "Posso ficar com vários trechos do mesmo vídeo?"
a = """
        É exatamente para isso que isto serve. Aperte <kbd>I</kbd> e <kbd>O</kbd>
        quantas vezes quiser enquanto ele toca; cada par vira uma linha, e o vídeo
        pronto é cada linha emendada em ordem, com todo o resto fora. A maioria dos
        aparadores online entrega um par de alças e pergunta qual trecho único você
        quer manter, o que serve para aparar a ponta de um clipe e não serve de nada
        para assistir a uma hora de gravação uma vez só e ficar com os seis momentos
        que prestam."""

[[faq]]
q = "Aparar perde qualidade?"
a = """
        No caminho normal não, e não do jeito que importa. Aparar não muda a
        aparência de quadro nenhum, então os quadros são movidos para o arquivo novo
        exatamente como estavam: os mesmos bytes, os mesmos ajustes de codificador,
        tudo igual. O único caminho daqui que recodifica alguma coisa é o corte
        exato, e ele avisa isso no próprio botão."""

[[faq]]
q = "Por que um trecho começa antes de onde eu marquei?"
a = """
        Por causa de como o vídeo é guardado, e só em reprodutores que ignoram uma
        parte padronizada do formato. A maioria dos quadros é guardada como uma
        descrição de como eles diferem dos vizinhos, então não dá para decodificar um
        sem os outros. Só um keyframe se sustenta sozinho, e os keyframes costumam
        ficar de um a dez segundos de distância. Um corte que copia quadros precisa,
        portanto, carregar a sequência a partir do keyframe anterior à sua marcação,
        e o arquivo diz <em>comece a tocar na sua marcação</em>, o que todo
        reprodutor mais usado respeita. Se você precisa que seja exato em todo
        reprodutor, escolha &ldquo;Cortar exatamente aqui&rdquo;, que recodifica. A
        página avisa em qual caso você está, e por quanto, antes de exportar."""

[[faq]]
q = "Posso tirar os comerciais em vez disso?"
a = """
        Pode. Marque-os e escolha &ldquo;Tirar fora&rdquo;: tudo o que você
        <em>não</em> marcou é emendado, em ordem. A mesma lista de marcações
        responde às duas perguntas, então dá para alternar entre elas e ver a
        duração mudar sem marcar nada duas vezes."""

[[faq]]
q = "Posso salvar minhas marcações e voltar a elas depois?"
a = """
        Pode. O &ldquo;Salvar marcações&rdquo; escreve um arquivo de texto puro, com
        uma linha por trecho e um início e um fim separados por vírgula, e o
        &ldquo;Carregar marcações&rdquo; lê um de volta. São oferecidos dois
        formatos, segundos simples e <code>HH:MM:SS.mmm</code>, e os dois seguem o
        mesmo desenho que outras ferramentas do gênero já usam. Um arquivo escrito
        aqui pode ser entregue a uma delas, e um arquivo escrito lá pode ser jogado
        nesta página. Marcar é trabalho cuidadoso e ninguém deveria ter que fazer
        duas vezes."""

[[faq]]
q = "Quais formatos de vídeo posso aparar?"
a = """
        MP4, M4V e MOV são lidos diretamente, seja lá o que houver dentro deles:
        H.264, HEVC, AV1 ou VP9. Copiar quadros não envolve decodificá-los, então
        esse caminho funciona até para um codec para o qual o seu navegador não tem
        decodificador nenhum. Qualquer outra coisa que o seu navegador consiga tocar,
        e aí o caso mais óbvio é o WebM, é aparada tocando o arquivo e gravando o
        resultado, o que funciona, leva o mesmo tempo que o resultado dura e só
        consegue manter um trecho. Um arquivo que o navegador não consegue nem ler
        nem tocar, o que na prática significa AVI, WMV, FLV e a maioria dos MKVs, é
        recusado com uma mensagem dizendo isso, em vez de falhar no meio do
        caminho."""

[[faq]]
q = "Existe limite de tamanho ou de duração do vídeo?"
a = """
        A ferramenta não tem limite embutido, e no caminho de cópia o arquivo mal
        chega a ser lido: os quadros que você mantém são apontados em vez de
        carregados, então ficar com quatro minutos de uma gravação de quatro
        gigabytes custa mais ou menos o que custa escrever esses quatro minutos no
        disco. O corte exato percorre o arquivo em fatias de alguns megabytes. De
        todo jeito, o teto prático é o arquivo pronto, que é montado na memória antes
        de você baixar."""

[[faq]]
q = "O som sobrevive?"
a = """
        Nos dois caminhos de MP4 ele é copiado amostra por amostra sem nunca ser
        decodificado, então sai byte a byte igual ao que estava no arquivo, e um
        marcador de edição mantém cada trecho alinhado com a imagem dele dentro de um
        milésimo de segundo. A única exceção é emendar vídeos separados cujo som é
        descrito de formas diferentes, com taxas de amostragem diferentes, por
        exemplo. Aí não tem como pôr os dois numa trilha só sem decodificá-los, e a
        página avisa antes de fazer. No caminho da gravação, ele é capturado da
        reprodução e codificado de novo. De qualquer jeito, existe uma caixinha para
        deixá-lo de fora por completo."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste, nem marca
        d'água. O site exibe publicidade, e é ela que paga a conta. Os anúncios não
        recebem nada sobre o seu vídeo."""

