name = "Compartilhar texto e arquivos"
heading = "Compartilhar texto e arquivos <span class=\"h1-kw\">&mdash; direto do seu navegador para o deles, sem upload</span>"
tagline = "O compartilhamento vive nesta aba aberta. Os leitores o recebem criptografado, direto do seu navegador, e fechar a aba o encerra - nenhum servidor guarda nada."

title = "Compartilhar texto e arquivos entre dispositivos &mdash; direto, criptografado, nada armazenado"
description = "Envie texto ou arquivos de um navegador para outro por uma conexão direta e criptografada. Um nome de link que dá para falar em voz alta, atualização ao vivo enquanto digita, aprovação por leitor - e nada guardado em servidor nenhum, nunca. Grátis, sem cadastro."
og_title = "Um compartilhamento que acaba assim que você fecha a aba"
og_description = "O texto e os arquivos viajam criptografados, direto do seu navegador para o do leitor. O servidor só apresenta os dois e nunca vê o conteúdo. Sem armazenamento, sem histórico, sem conta: feche a aba e some, em todo lugar."
og_image_alt = "Compartilhar texto e arquivos - de navegador a navegador, nada armazenado"

pledge = """
    O que você compartilha aqui viaja do seu navegador para o de cada
    leitor por um canal WebRTC criptografado de ponta a ponta, e para nenhum
    outro lugar. O único servidor envolvido &mdash; nomeado na
    <code>Content-Security-Policy</code> desta página, código no
    repositório &mdash; apresenta os dois navegadores um ao outro e sai de
    cena: não guarda nada, e o conteúdo nunca passa por ele. Não há
    histórico nem conta. Feche esta aba e o compartilhamento acaba em todo
    lugar ao mesmo tempo, inclusive nas páginas abertas dos leitores."""

live_hint = """
      Abra as ferramentas do desenvolvedor e observe a aba
      &ldquo;Rede&rdquo; enquanto compartilha. Você verá um WebSocket até o
      intermediário com alguns kilobytes de negociação &mdash; e por mais
      que digite ou anexe, nenhuma requisição carregando nada disso."""

read_first = """
, <code>src/main.js</code> para as duas
      metades da troca &mdash; a aba de quem compartilha e a do leitor são o
      mesmo arquivo &mdash; e <code>src/markdown.js</code> para o
      renderizador que processa texto vindo do outro lado do fio, e que por
      isso escapa tudo antes de emitir qualquer coisa. O código completo do
      servidor é <code>workers/rendezvous/worker.js</code>, no mesmo
      repositório: uma sala por nome de link, que não guarda nada além das
      conexões abertas."""

howto_heading = "Como compartilhar texto e arquivos sem fazer upload para lugar nenhum"

card = """
            Texto e arquivos, de navegador a navegador por uma conexão
            direta criptografada. Nada guardado em lugar nenhum; o
            compartilhamento acaba quando você fecha a aba."""

