tagline = "O compartilhamento vive nesta aba aberta. Os leitores o recebem criptografado, direto do seu navegador, e fechar a aba o encerra - nenhum servidor guarda nada."

title = "Compartilhar texto e arquivos entre dispositivos &mdash; direto, criptografado, nada armazenado"
description = "Envie texto ou arquivos de um navegador para outro por uma conexão direta e criptografada. Um nome de link que dá para falar em voz alta, atualização ao vivo enquanto digita, aprovação por leitor - e nada guardado em servidor nenhum, nunca. Grátis, sem cadastro."
og_title = "Um compartilhamento que acaba assim que você fecha a aba"
og_description = "O texto e os arquivos viajam criptografados, direto do seu navegador para o do leitor. O servidor só apresenta os dois e nunca vê o conteúdo. Sem armazenamento, sem histórico, sem conta. Fechar a aba encerra a origem do compartilhamento; a cópia exibida é apagada quando a desconexão é detectada."
og_image_alt = "Compartilhar texto e arquivos - de navegador a navegador, nada armazenado"

pledge = "As descrições a seguir sobre servidor e descoberta se aplicam a Online. Offline troca blocos de conexão sem contactar esses serviços.     O que você compartilha aqui viaja do seu navegador para o de cada\n    leitor por um canal WebRTC criptografado de ponta a ponta, e para nenhum\n    outro lugar. O único servidor envolvido &mdash; nomeado na\n    <code>Content-Security-Policy</code> desta página, código no\n    repositório &mdash; apresenta os dois navegadores um ao outro e lista\n    os nomes de link locais visíveis na lista. Não guarda texto ou arquivos\n    compartilhados, e o conteúdo nunca passa por ele. Os nomes da descoberta\n    duram só enquanto quem compartilha continua conectado. Não há histórico\n    de conteúdo nem conta. Feche esta aba e a origem do compartilhamento\n    desaparece. As páginas dos leitores limpam a cópia exibida ao receber o\n    aviso de encerramento ou detectar uma falha de conexão. O conteúdo já\n    copiado ou baixado permanece com quem o recebeu."

live_hint = "No modo Online:       Abra as ferramentas do desenvolvedor e observe a aba\n      &ldquo;Rede&rdquo; enquanto compartilha. Você verá um WebSocket até o\n      intermediário para os nomes de link locais ao abrir esta página\n      inicial. Começar a compartilhar adiciona outro para estabelecer\n      conexões. Um leitor usa um único socket de apresentação. Por mais\n      que você digite ou anexe, nenhum deles carrega o texto ou os arquivos."

read_first = """
, <code>src/main.js</code> para as duas
      metades da troca &mdash; a aba de quem compartilha e a do leitor são o
      mesmo arquivo &mdash; e <code>src/markdown.js</code> para o
      renderizador que processa texto vindo do outro lado do fio, e que por
      isso escapa tudo antes de emitir qualquer coisa. O código completo do
      servidor é <code>workers/rendezvous/worker.js</code>, no mesmo
      repositório: uma sala por nome de link, mais um diretório de descoberta
      com os nomes anunciados em conexões abertas, nunca o texto ou os arquivos."""

howto_heading = "Como compartilhar texto e arquivos sem fazer upload para lugar nenhum"

card = """
            Texto e arquivos, de navegador a navegador por uma conexão
