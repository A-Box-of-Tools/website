[[privacy]]
title = "O conteúdo vai para o seu leitor, e para nenhum outro lugar."
body = """
O texto e os arquivos passam por um canal de dados WebRTC: uma conexão direta, criptografada com DTLS, entre seu navegador e o de cada leitor. Não há servidor nesse caminho. O modo Rede local usa os endereços de rede dos próprios navegadores, sem descoberta pública de endereços nem retransmissor de internet. Uma VPN ou as políticas de rede do navegador podem afetar o caminho desses endereços; isso não é uma garantia sobre um prédio físico. No modo normal, um leitor que não pode ser alcançado diretamente pode escolher na própria página um retransmissor criptografado, que encaminha o mesmo conteúdo criptografado sem poder lê-lo."""

[[privacy]]
title = "O que é o intermediário, e tudo o que ele vê."
body = "No modo Online:  Uma conexão direta precisa\n      de uma apresentação. Esta página inicial abre automaticamente um\n      WebSocket para o nosso intermediário para os nomes de link locais\n      visíveis na lista; começar a compartilhar abre outro para o próprio\n      compartilhamento. Um leitor usa um único socket de apresentação.\n      Ele junta quem digitou um\n      nome de link com quem compartilha sob esse nome, repassa alguns\n      kilobytes de negociação e não retém nada: nunca grava armazenamento, e\n      uma sala deixa de existir assim que quem compartilha se desconecta.\n      Ele pode ver que um nome está em uso, quando cada um chega e sai, e os\n      endereços IP. Não pode ver o texto, os arquivos, quem foi admitido nem\n      o que alguém escreveu: até a batida numa porta privada viaja pelo\n      canal direto criptografado. O código completo dele está no\n      repositório, ao lado do desta ferramenta. O diretório lista só os nomes\n      anunciados por quem continua conectado com o mesmo endereço IPv4\n      público ou a mesma sub-rede IPv6.\n      Isso pode incluir outras redes por trás de uma VPN compartilhada ou de\n      um endereço compartilhado pelo provedor. Se alguns dispositivos usam\n      IPv4 e outros IPv6, ou seguem caminhos diferentes, podem não aparecer\n      mesmo estando na mesma rede local. O que sobrevive a um\n      compartilhamento é uma coisa só: a Cloudflare, que executa o servidor,\n      guarda um registro de cada conexão por sete dias, com o nome de link, o\n      endereço e a hora, nunca o conteúdo."

[[privacy]]
title = "Nada é armazenado: fechar a aba é a exclusão."
body = """
 O compartilhamento existe só
      enquanto a sua aba está aberta. Feche-a e leitores novos não encontram
      mais nada, e quem estava lendo vê a própria cópia sumir &mdash; embora
      o que alguém copiou ou baixou antes seja dele, como seria qualquer
      coisa que você tivesse entregado em mãos. O rascunho que você digita
      fica no armazenamento do seu próprio navegador, para estar aqui da
      próxima vez, e só nele; marcado como descartável, não fica em lugar
      nenhum."""

[[privacy]]
title = "O nome do link é um endereço, e Privado é a tranca."
body = """
 Qualquer um que
      conheça ou adivinhe um nome pode abrir o que está por trás. Por isso
      as sugestões são nomes que dá para falar em voz alta. Compartilhamentos
      locais visíveis publicam seu nome na lista desta conexão: o nome fica
      público para navegadores que usam o mesmo endereço IPv4 público ou a
      mesma sub-rede IPv6.
      Mantenha Privado ativado para qualquer conteúdo sensível. Ele já vem
      ativado: cada leitor que chega precisa se apresentar, pelo
      canal direto, e nada é enviado até você deixá-lo entrar."""

[[privacy]]
title = "Uma conexão direta mostra a cada lado o endereço do outro."
body = """
 É isso que
      ponto a ponto significa, e o leitor sabe antes de acontecer: abrir um
      link compartilhado só pergunta ao intermediário se alguém está
      compartilhando; depois a página diz com clareza que conectar revela a
      cada lado o endereço IP do outro, e espera um clique. Até esse clique,
      quem compartilha nem sabe que o leitor existe."""

[[privacy]]
title = "O que o Google carrega, e o que ele não recebe."
body = """ Os scripts de anúncio e
      medição vêm do Google, e o botão de doação, do Buy Me a Coffee.
      Nenhum deles recebe o texto, os arquivos, seus nomes ou tamanhos, nem
      quem se conectou. A exceção é o próprio endereço desta página: o link
      de um leitor carrega o nome do link, e o script de anúncio lê o
      endereço. Um compartilhamento que deva ficar em segredo quer o
      interruptor de privado. Cada linha que toca o conteúdo é servida desta
      origem e está no repositório."""

[[howto]]
title = "Escreva o texto, ou anexe os arquivos."
body = """
 O editor é o compartilhamento:
      o que estiver nele quando um leitor se conecta é o que ele recebe, e o
      que você mudar depois chega ao vivo aos leitores conectados, enquanto
      digita. Os arquivos viajam pelo mesmo canal, até 200&nbsp;MB cada; os
      leitores veem a lista e baixam só o que pedirem, então ninguém gasta
      banda com um arquivo que não queria."""

[[howto]]
title = "Ligue o Markdown se o texto merecer formatação."
body = """
 Uma chave só. Títulos,
      negrito, listas, código e links são renderizados ao vivo ao lado do
      editor enquanto você digita, e os leitores recebem a visão formatada
      por padrão, com um alternador para voltar ao texto original. O
      renderizador viaja com esta página e escapa tudo: texto compartilhado
      não pode virar script no computador de um leitor, não importa quem o
      escreveu."""

[[howto]]
title = "Dê um nome ao link, ou fique com a sugestão."
body = """
 O nome é o endereço:
      <code>brave-otter-42</code> dá para falar de um lado a outro da sala,
      ler por telefone ou copiar de um quadro. Compartilhamentos locais
      visíveis listam seu nome, então mantenha Privado ativado para qualquer
      conteúdo sensível. Para um compartilhamento disponível só por link,
      um nome que ninguém adivinharia também ajuda. Um nome sob o qual outra pessoa já
      compartilha é recusado, e o seu fica livre assim que você para."""

[[howto]]
title = "Decida quem entra."
body = """
 Privado é o padrão: cada leitor é
      convidado a se apresentar &mdash; um nome, uma pista, qualquer coisa
      que você reconheça &mdash; e você vê a mensagem com um botão para
      deixá-lo ler ou dispensá-lo. A apresentação viaja pelo canal direto,
      então nem o intermediário sabe quem bateu. Desmarque para um
      compartilhamento aberto, que qualquer um com o nome pode ler."""

[[howto]]
title = "Comece a compartilhar, e deixe a aba aberta."
body = """A aba é o servidor. Mantenha-a aberta e o dispositivo ativo para compartilhar sem interrupções. Uma conexão que funciona continua aberta quando a página fica oculta, mas o telefone ou um notebook em suspensão pode pausar o navegador. Ao voltar, a página tenta restaurar o mesmo compartilhamento. Parar de compartilhar impede a retomada automática. Copie o link ou diga o nome: o leitor pode acrescentar <code>#name</code> ao endereço desta página. No modo Rede local, copie o link que contém <code>?local=1</code> antes do nome. Uma mudança no modo de conexão exige a escolha do leitor."""

[[howto]]
title = "Do outro lado: primeiro consentir, depois bater."
body = """
 Quem abre o link fica
      sabendo que alguém está compartilhando, é avisado de que uma conexão
      direta mostra a cada lado o endereço de rede do outro, e só se conecta
      se decidir. Num compartilhamento privado, se apresenta e espera por
      você. O que ele recebe se atualiza ao vivo enquanto você edita, e some
      quando você fecha a aba."""

[[faq]]
q = "Alguma coisa é enviada para algum lugar?"
a = "No modo Online:         Não. O texto e os arquivos vão do seu navegador para o de cada\n        leitor por um canal WebRTC criptografado, diretamente. O único\n        servidor envolvido carrega a apresentação e os nomes de link locais\n        cuja publicação foi escolhida, nunca o conteúdo. Não guarda texto\n        nem bytes de arquivos. Salas e entradas de descoberta acabam com\n        suas conexões abertas; os registros de conexão de sete dias da\n        Cloudflare contêm metadados, nunca o conteúdo."

[[faq]]
q = "Então por que esta ferramenta fala com um servidor, logo neste site?"
a = "No modo Online:         Porque dois navegadores não conseguem se encontrar sozinhos: algo\n        precisa juntar quem digitou <code>brave-otter-42</code> com quem\n        compartilha sob esse nome, e levar a oferta de conexão entre os\n        dois. Esse algo é o intermediário, a única dependência de rede desta\n        página, nomeado na sua <code>Content-Security-Policy</code> e\n        publicado no mesmo repositório da página. É o menor servidor capaz\n        de fazer o trabalho. Ele também lista os nomes de link locais cuja\n        publicação foi escolhida, para navegadores que usam o mesmo endereço\n        IPv4 público ou a mesma sub-rede IPv6. Não guarda conteúdo nem\n        consegue ler o canal criptografado\n        entre os navegadores."

[[faq]]
q = "O que exatamente esse servidor pode ver?"
a = "No modo Online:         Que um nome de link está em uso, quando quem compartilha e os\n        leitores se conectam e saem, seus endereços IP e o estabelecimento\n        da conexão criptografada que trocam, e os nomes de link cuja\n        publicação na descoberta foi escolhida. A lista de descoberta\n        agrupa os nomes pelo endereço IPv4 público ou pela sub-rede IPv6\n        vistos pelo servidor, e pela origem da página.\n        Não o texto, não os arquivos,\n        não seus nomes nem tamanhos, não quem foi admitido a um\n        compartilhamento privado, e não o que alguém escreveu ao se\n        apresentar: tudo isso viaja pelo canal direto, criptografado de\n        ponta a ponta, que não passa pelo servidor. A Cloudflare, que executa\n        o servidor, guarda um registro de cada conexão por sete dias: o nome\n        de link, o endereço e a hora. Nada mais sobrevive ao compartilhamento."

[[faq]]
q = "O que acontece quando fecho a aba?"
a = """O compartilhamento termina quando sua única fonte desaparece. Os leitores limpam a cópia exibida ao detectar o fim ou uma falha na conexão. Parar de compartilhar envia um aviso explícito de encerramento; uma perda temporária de rede pode iniciar um número limitado de tentativas de recuperação. Não existe cópia no servidor para excluir. O que já foi copiado ou baixado permanece com os leitores."""

[[faq]]
q = "Um leitor pode ficar com o que compartilhei?"
a = """
        Enquanto o compartilhamento está aberto, sim: compartilhar é isso.
        Um leitor pode copiar o texto ou baixar um arquivo, e o que ele
        levou é dele, exatamente como se você tivesse entregado por qualquer
        outro meio. O que encerrar garante é o futuro: ninguém novo chega, e
        as páginas abertas param de mostrar. Nenhuma ferramenta consegue
        des-enviar o que já chegou, e esta página não finge o contrário."""

[[faq]]
q = "O que é o modo privado?"
a = """
        O padrão. Cada leitor que chega fica sabendo que o compartilhamento
        é privado e é convidado a se apresentar; você vê a mensagem &mdash;
        &ldquo;sou a Alice, da reunião&rdquo; &mdash; com botões para
        deixá-lo ler ou dispensá-lo, e nada é enviado até você decidir. A
        apresentação viaja pelo canal direto já criptografado, então o
        servidor nunca sabe quem bateu nem o que você decidiu. Desmarcado
        antes de compartilhar, vira um compartilhamento aberto."""

[[faq]]
q = "Por que o leitor vai ver o meu endereço IP?"
a = """
        Porque a conexão é direta de verdade, e uma conexão direta corre
        entre dois endereços: cada ponta necessariamente conhece a da
        outra, como numa ligação telefônica. O leitor é avisado antes de
        existir qualquer conexão e só se conecta se decidir; até lá, você
        nem sabe que ele abriu o link. Se essa troca não servir para um
        compartilhamento específico, a alternativa é um serviço que passa
        por um servidor &mdash; com a troca contrária."""

[[faq]]
q = "Qual o tamanho máximo dos arquivos, e qual a velocidade?"
a = """
        Até 200&nbsp;MB por arquivo, de qualquer tipo, e tão rápido quanto a
        mais lenta das duas conexões: não há servidor no meio para frear ou
        medir. Dois computadores com uma conexão local funcionando transferem em
        velocidade de rede local; VPNs e roteamento do navegador podem afetar
        o caminho. Os leitores baixam cada
        arquivo sob demanda, então anexar algo grande não custa nada até
        alguém realmente pedir."""

[[faq]]
q = "Funciona offline?"
a = "Sim, sem internet, se os dispositivos conseguirem se comunicar por Wi-Fi, Ethernet ou ponto de acesso. Carregue antes esta ferramenta HTTPS nos dois e espere a indicação de que está pronta para uso offline. Automatic mostra blocos manuais quando o navegador informa que está sem internet; você também pode escolher Offline em Connection options. Quem compartilha entrega um bloco de convite, o leitor cria uma resposta e quem compartilha a aceita. O leitor ainda escolhe Conectar, e Privado continua exigindo aprovação. Troque novos blocos para cada leitor. Eles expiram após dez minutos e contêm endereços de conexão. Offline não usa o serviço de apresentação, diretório de proximidade, STUN público ou retransmissor de internet. O editor também funciona sem nenhuma rede."

[[faq]]
q = "E se a gente não conseguir conectar?"
a = "No modo Online: A oferta de retransmissor descrita abaixo vale apenas para o modo de conexão normal. A maioria dos pares de navegadores se alcança diretamente depois de\n        apresentada; uma minoria não, geralmente quando um dos lados está na\n        rede de endereços compartilhados de uma operadora de celular ou\n        atrás de uma rede corporativa rígida. Esta página nunca passa para\n        um retransmissor em silêncio &mdash; isso mudaria o que esta\n        ferramenta é sem dizer &mdash;: depois de vinte segundos ela diz com\n        clareza que não houve conexão direta e oferece um ao leitor: um\n        retransmissor mantido pela Cloudflare que repassa os bytes\n        criptografados entre os dois navegadores e não consegue lê-los,\n        porque a chave nunca sai das duas pontas. O leitor o escolhe de\n        forma explícita, na própria página, depois de saber o que ele vê\n        &mdash; os dois endereços, como a conexão direta veria &mdash;, e\n        ali também nada é guardado. O seu lado não muda: seu navegador\n        continua enviando só para aquele leitor, como faria se ele estivesse\n        atrás de uma VPN. O modo Rede local nunca oferece um retransmissor. Confira se os dois dispositivos usam a mesma rede Wi-Fi ou Ethernet e se o isolamento da rede de convidados, um firewall ou uma VPN está bloqueando a conexão."

[[faq]]
q = "Renderizar Markdown é seguro, se qualquer um pode compartilhar qualquer coisa?"
a = """
        Essa pergunta é o motivo de o renderizador ser oitenta linhas no
        código desta página e não uma biblioteca. Cada caractere é escapado
        antes de qualquer tag ser emitida, só um conjunto fixo de tags
        inofensivas pode nascer, e os links aceitam só <code>http</code>,
        <code>https</code> e <code>mailto</code>: um link
        <code>javascript:</code> fica como texto inerte. Texto compartilhado
        não pode virar script no seu computador, não importa quem o escreveu, e
        as oitenta linhas dá para ler."""

[[faq]]
q = "Duas pessoas podem compartilhar sob o mesmo nome?"
a = "No modo Online:         Ao mesmo tempo, não. Um compartilhamento vivo por nome, imposto no\n        intermediário: quem chega em segundo é recusado e convidado a\n        escolher outro nome. Assim que um compartilhamento acaba, o nome\n        fica livre de novo &mdash; o que também significa que um link\n        guardado vale o que valer o compartilhamento por trás dele: o mesmo\n        nome, semana que vem, pode ser de outra pessoa. Trate um link como\n        algo de um momento, não de uma pessoa."

[[faq]]
q = "É grátis? Preciso de conta?"
a = """
        Grátis, sem conta, sem cadastro, e sem limite digno de menção:
        dezesseis leitores simultâneos por compartilhamento. O site carrega
        publicidade, que é o que o paga; os anúncios não recebem nada sobre
        o que esta página compartilha, e o intermediário cabe com folga num
        plano gratuito justamente porque não guarda nada e quase não faz
        nada."""

[[faq]]
q = "Posso compartilhar arquivos pela minha rede local?"
a = "No modo Online: Sim. Antes de começar, escolha Rede local — sem retransmissor de internet, conecte os dois dispositivos à mesma rede Wi-Fi ou Ethernet e copie o link para o leitor. O link inclui o modo; um leitor que usa outro modo precisa escolher explicitamente antes de tentar de novo com o modo de quem compartilha. A apresentação dos navegadores ainda precisa de internet. Este modo não usa descoberta pública de endereços e nunca passa a um retransmissor de internet. Uma VPN ou as políticas de rede do navegador podem mudar o caminho ou impedir a conexão; a opção não prova que os bytes ficam dentro de um prédio. A aprovação privada continua ativada por padrão e o limite continua sendo de 200&nbsp;MB por arquivo. Uma sessão pode incluir até 256 arquivos.\n        Visível na lista vem ativado neste modo: o outro navegador pode abrir\n        a página da ferramenta e escolher seu nome na lista desta conexão.\n        Desmarque para compartilhar só por link; você também pode continuar\n        copiando o link para o leitor."

[[faq]]
q = "Como a lista encontra compartilhamentos locais?"
a = "No modo Online:         Abrir a página inicial desta ferramenta pede ao intermediário os\n        nomes de link visíveis na lista de navegadores que usam o mesmo\n        endereço IPv4 público ou a mesma sub-rede IPv6. Normalmente isso\n        significa o mesmo roteador,\n        mas uma VPN compartilhada ou um provedor que compartilha um endereço\n        pode incluir outras redes. Se alguns dispositivos usam IPv4 e outros\n        IPv6, ou seguem caminhos diferentes, podem não aparecer mesmo estando\n        na mesma rede local. A lista não comprova uma mesma rede local\n        física. É preciso ter internet. Só aparecem compartilhamentos no\n        modo Rede local. Escolha esse modo antes de começar, pois vem\n        desativado por padrão. Compartilhamentos locais são\n        anunciados por padrão; desmarque Visível na lista para compartilhar\n        só por link e mantenha Privado ativado em redes compartilhadas.\n        Escolher um nome abre a página de consentimento do compartilhamento;\n        nunca conecta automaticamente nem dispensa a aprovação privada.\n        O diretório mantém só os nomes de link enquanto quem compartilha\n        continua conectado, nunca o texto, os nomes de arquivo ou os bytes\n        dos arquivos. Se a descoberta estiver indisponível, compartilhar\n        por link continua funcionando."

[schema]
description = "Compartilhe texto e arquivos de um navegador para outro por uma conexão WebRTC direta e criptografada de ponta a ponta. Nomes de link faláveis, atualização ao vivo enquanto digita, Markdown e aprovação por leitor. Nenhum servidor guarda nada; o compartilhamento acaba quando quem compartilha fecha a aba."
features = [
