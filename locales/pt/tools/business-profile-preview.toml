[[privacy]]
title = "Não existe para onde o que você digita possa ir."
body = "A Content-Security-Policy lista todos os endereços que esta página pode contatar, e nenhum pertence a este site. Não há destino para coletar endereço ou telefone, nem código para enviá-los."

[[privacy]]
title = "Nada aqui busca coisa alguma."
body = "Não há <code>fetch</code>, <code>XMLHttpRequest</code> ou <code>sendBeacon</code> em <code>src/</code>. É por isso que a ferramenta não busca seu perfil automaticamente: você precisa colá-lo. A capacidade de buscar dados em um servidor também permitiria enviá-los."

[[privacy]]
title = "A foto é lida aqui e perde os metadados ao entrar."
body = "A foto de capa é decodificada nesta página e redesenhada em um canvas antes de entrar na simulação. Isso limita seu tamanho e remove os dados sobre onde e quando foi tirada. A simulação incorpora a imagem, não o arquivo original."

[[privacy]]
title = "O download reproduz a prévia da tela."
body = "O PNG usa a mesma marcação entregue ao navegador e desenhada em um canvas, evitando uma segunda composição que pudesse divergir da prévia. Não há fonte para buscar nem imagem externa vinculada. Por isso, o download funciona sem rede e produz um arquivo independente."

[[privacy]]
title = "Salvar o perfil gera um arquivo, não uma conta."
body = "O JSON é gravado no seu disco. Reabri-lo é a única forma de a ferramenta recuperar os dados. Nada fica armazenado no navegador entre visitas: endereço e horário da empresa não são dados que este site deva guardar."

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = "Os scripts de publicidade e medição vêm do Google, e o botão de contribuição, do Buy Me a Coffee. Nenhum deles recebe o que você digita. Todo o código que transforma os campos em imagem é servido desta origem e está no repositório."

[[privacy]]
title = "Funciona offline."
body = "Desligue a rede e a ferramenta continua igual, porque nunca houve uma etapa de rede nela. Essa é a prova mais simples de todas."

[[howto]]
title = "Comece pelo perfil que já existe, se houver."
body = "Abra a empresa no Google, selecione o cartão inteiro, com nome, estrelas e linhas abaixo, copie e cole na seção do início desta página. A ferramenta reconhece nome, categoria, nota, quantidade de avaliações, endereço, telefone, site e horários da semana. Ela informa exatamente quais campos preencheu para você conferir possíveis erros. Também aceita uma exportação da API do Perfil da Empresa."

[[howto]]
title = "Confira primeiro o nome e a categoria."
body = "São os campos de maior impacto. O nome pode ser cortado nas três apresentações, principalmente no resultado de busca. Acrescentar cidade e atividade ao fim do nome pode deixar esses detalhes escondidos por reticências. A categoria é a linha que ainda cabe no resultado local quando quase nada mais cabe, e ajuda a corresponder à busca."

[[howto]]
title = "Preencha a semana e confira o status."
body = """A linha de status muda sozinha: <em>Aberto &middot; Fecha às 21:00</em> pode virar <em>Fechado &middot; Abre às 09:00 ter.</em>. O cálculo usa os horários informados e o relógio do seu computador. Marcar um dia como fechado mostra o que uma pessoa verá ao consultar naquele período. Um intervalo que termina antes de começar, como 22:00 a 02:00, é interpretado como atravessando a meia-noite.

      Ative <em>Pré-visualizar uma data e hora escolhidas</em> para conferir uma noite específica ou a manhã seguinte no fuso horário deste dispositivo. Desative a opção para voltar a seguir o relógio. Esta escolha não é salva no JSON do perfil."""

[[howto]]
title = "Confira quais botões aparecem."
body = "Sem endereço, não há <em>Rotas</em>. Sem site, não há <em>Site</em>. Sem telefone, não há <em>Ligar</em>. Esses campos determinam os botões abaixo do nome. Quando falta um deles, a pessoa precisa procurar em outro lugar antes de agir. É uma conferência rápida e uma ausência comum em perfis reais."

[[howto]]
title = "Confira as três apresentações."
body = "O mesmo perfil recebe três espaços diferentes. O painel de informações é amplo e costuma aparecer quando a pessoa já conhece o nome. O cartão no celular é o que muitos visitantes veem. O resultado local é o mais estreito, onde alguém escolhe entre sua empresa e duas concorrentes. Uma descrição que cabe no primeiro pode nem aparecer no terceiro."

[[howto]]
title = "Baixe a imagem e guarde o perfil."
body = "O PNG pode sair no tamanho original da apresentação, no dobro ou no triplo, ampliando sem alterar as quebras de linha. O SVG é útil em documentos: contém a foto e não depende de links externos, mantendo nitidez na impressão. O terceiro download é o perfil salvo; guarde-o para continuar depois."

[[faq]]
q = "Esta ferramenta é do Google?"
a = "Não. O site não tem vínculo, aprovação ou conexão com o Google. Perfil da Empresa no Google é uma marca do Google, citada apenas para identificar o que está sendo simulado. A imagem é desenhada no seu navegador com os dados digitados; não é captura de tela, visualização ao vivo nem conexão com sua conta. Nada feito aqui altera o perfil real. Para isso, é preciso usar o Google."

[[faq]]
q = "A ferramenta importa meu perfil automaticamente?"
a = "Não. Buscar o perfil exigiria contato com um servidor, capacidade que também permitiria enviar os campos a ele. A ferramenta foi feita sem essa função. Você copia o perfil e o cola aqui; a página lê o texto e informa os campos reconhecidos. Também abre diretamente uma exportação em JSON da API do Perfil da Empresa."

[[faq]]
q = "Alguma coisa que eu digito é mandada para algum lugar?"
a = "Não. O código não contém <code>fetch</code>, <code>XMLHttpRequest</code> ou <code>sendBeacon</code>. A <code>Content-Security-Policy</code> lista os endereços permitidos, e nenhum pertence a este site. Isso é especialmente relevante porque um perfil comercial pode conter o endereço residencial e o telefone pessoal de alguém."

[[faq]]
q = "Qual é a precisão da simulação?"
a = "Ela mostra o que cabe no espaço e aproxima a aparência. O Google usa Google Sans, que pode não estar no seu computador, e muda o espaçamento nas atualizações da Busca e do Maps. Trate os pixels como aproximação. A prévia permite conferir quanto do nome cabe em cada largura, se a categoria continua legível na versão estreita e quais botões os campos preenchidos habilitam."

[[faq]]
q = "Por que meu perfil novo aparece sem estrelas?"
a = "Porque um perfil sem avaliações deve mostrar isso claramente. Cinco estrelas vazias podem parecer uma avaliação ruim à primeira vista. Deixe nota e quantidade de avaliações vazias para mostrar a mensagem de que ainda não há avaliações. Preencha ambos para exibir estrelas proporcionais à nota: 4,6 mostra quatro estrelas e três quintos da quinta, não cinco estrelas completas."

[[faq]]
q = "Como é calculada a indicação Aberto ou Fechado?"
a = """
        A semana preenchida e, por padrão, o relógio local deste dispositivo. O estado é atualizado a cada minuto. Você também pode escolher uma data e hora locais para verificar um momento específico da semana. A pré-visualização usa o fuso horário deste dispositivo, sem conversão para o da empresa nem horários especiais de feriados. Se a empresa estiver noutro local, insira a hora local que deseja conferir. Esta escolha não faz parte do JSON salvo do perfil."""

[[faq]]
q = "Posso usar a imagem em uma proposta, apresentação ou relatório para cliente?"
a = "Sim. Não há marca d’água, conta, limite de imagens nem link para este site dentro do arquivo. São seus dados desenhados no seu computador. Avise ao destinatário que é uma simulação: uma imagem tão reconhecível pode ser confundida com uma captura de um perfil já publicado."

[[faq]]
q = "Qual é a diferença entre as três prévias?"
a = "A largura determina quanto conteúdo aparece. O <strong>painel de informações</strong> é o cartão alto à direita da busca no computador pelo nome da empresa, com mais espaço. O cartão <strong>no celular</strong> corresponde à apresentação móvel. O <strong>resultado de busca</strong> é uma entrada do bloco local de três empresas sob um mapa: é a versão mais estreita, onde a pessoa compara alternativas sem necessariamente conhecer seu nome."

[[faq]]
q = "A foto que eu adicionar é enviada?"
a = "Não. Ela é decodificada nesta página, redesenhada em um canvas no tamanho adequado e incorporada à imagem como dados. O arquivo não sai do computador, e os metadados de local e data são descartados porque o canvas não os preserva. Guarde o original se precisar dele; a simulação usa uma cópia."

[[faq]]
q = "Posso salvar o que digitei para continuar depois?"
a = "Sim, em um arquivo. <em>Salvar o perfil</em> grava um JSON no seu disco com todos os campos e a foto. Ao reabri-lo aqui, os dados voltam. Nada fica no navegador entre visitas, e não há conta. Endereço, telefone e horários da empresa não são dados que este site deva guardar."

[[faq]]
q = "Funciona offline?"
a = "Sim. Abra a página uma vez e desligue a internet: campos, desenho e geração de PNG continuam funcionando. Uma ferramenta que enviasse os dados para desenhar o cartão em outro lugar pararia ao perder a conexão."

[schema]
category = "BusinessApplication"
description = "Veja uma prévia do Perfil da Empresa no Google no navegador. Desenha painel de informações, cartão no celular e resultado local com nome, categoria, nota, avaliações, endereço, telefone, site, descrição, atributos, horários e foto. Calcula o status de aberto ou fechado e baixa PNG ou SVG. Importe texto colado ou uma exportação da API. Nada é enviado."
features = ["Três apresentações do mesmo perfil: painel de informações, celular e resultado local", "Status de aberto ou fechado calculado pelos horários, inclusive intervalos após a meia-noite", "Estrelas proporcionais à nota e nenhuma estrela para perfis sem avaliações", "Botões de ação aparecem apenas quando os campos correspondentes estão preenchidos", "Importação por texto colado, com relatório dos campos reconhecidos", "Abre exportações de local da API do Perfil da Empresa no Google", "Foto de capa lida localmente, sem metadados e incorporada à imagem", "PNG em tamanho original, dobro ou triplo, e SVG independente", "Perfil salvo em JSON e reaberto depois, sem conta ou armazenamento no navegador", "Funciona offline, sem envio, marca d’água ou cadastro"]
