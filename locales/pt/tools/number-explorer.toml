#
# Explorador de números - Portuguese (Brazil).
#
# Overrides for tools/number-explorer/tool.toml. Only words: the slug, the
# category, the icon and the list of shared parts stay where they are.
#
# Every figure here was carried over by value. In Brazil a bilhão is 10^9 and a
# trilhão is 10^12, as in English; the bilião of European Portuguese is a
# thousand times larger, and the input box refuses it rather than guessing.
#

name = "Explorador de números"
heading = "Explorador&nbsp;de&nbsp;números <span class=\"h1-kw\">&mdash; imagine um milhão, um bilhão e muito mais</span>"
tagline = "Digite qualquer número e veja-o crescer: uma pilha de livros, um jorro de água, um céu de estrelas, um monte de areia, uma contagem muito longa."

title = "Visualizador de números &mdash; entenda milhões e bilhões &mdash; grátis e offline"
description = "Veja o tamanho real de um número. Ele cresce como uma pilha de livros, um jorro de água, um céu de estrelas, um monte de areia e o tempo que se leva para contá-lo, ao lado de marcos do Monte Everest à Via Láctea. Grátis e offline."
og_title = "Como é um bilhão?"
og_description = "Transforme um número enorme em algo que dá para ver: livros, água, estrelas, areia e tempo, com suposições claras e sem IA nem envio."
og_image_alt = "Explorador de números - imagine números grandes como livros, água, estrelas, areia e tempo"

pledge = "Uma comparação é uma quantidade, uma referência escolhida e um pouco de aritmética, tudo dentro desta página. Não há serviço de IA para consultar nem entrada para enviar. Livros, água, estrelas, areia e tempo de contagem ficam separados, e suas suposições estão escritas ao lado do resultado, não escondidas atrás da imagem."
live_hint = "Mude o número com a aba Rede aberta. A calculadora não faz nenhuma requisição. Carregue a página uma vez, desconecte e continue explorando."
read_first = ", <code>src/scale.js</code> para a leitura da quantidade, os modelos e os marcos, <code>src/containers.js</code> para o que uma área colorida mede, <code>src/stage.js</code> e os arquivos <code>src/scene-*.js</code> para as imagens, e <code>src/main.js</code> para ver como a página se conecta."
howto_heading = "Como imaginar um número grande"
card = "Qual é a altura de uma pilha de um bilhão de livros? Quanta água é um bilhão de gotas? Digite qualquer número e veja-o virar livros, água, estrelas, areia e tempo, com as suposições à vista."

