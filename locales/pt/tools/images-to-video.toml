heading = "Imagens&nbsp;para&nbsp;vídeo <span class=\"h1-kw\">&mdash; fazer uma apresentação em MP4</span>"
tagline = "Transforme uma pasta de imagens em um vídeo."

title = "Sequência de imagens para MP4 &mdash; grátis, sem envio, funciona offline"
description = "Transforme imagens JPG, PNG ou WebP num vídeo MP4 de apresentação, de graça e inteiramente no seu navegador. Nada é enviado, não pede cadastro e funciona offline."
og_title = "Sequência de imagens para MP4 &mdash; grátis, no seu navegador"
og_description = "Transforme uma sequência renderizada, um timelapse ou uma pasta de fotos num MP4. A codificação roda no seu próprio computador e nada é enviado."
og_image_alt = "Imagens para vídeo - transforme uma pasta de imagens numa apresentação em MP4"

pledge = """
    Cada quadro é codificado pelo seu próprio navegador, e o vídeo é montado na
    memória deste computador. O codificador nunca encosta na rede, e do outro lado
    desta página não existe servidor nenhum para onde mandar uma imagem, mesmo que
    ele encostasse."""

live_hint = """
      Você não precisa confiar na nossa palavra. Abra as ferramentas do
      desenvolvedor, deixe a aba &ldquo;Rede&rdquo; à vista e faça um vídeo.
      Nenhuma requisição leva uma imagem, uma miniatura ou um nome de arquivo. Ou
      então desligue a internet e faça um assim mesmo."""

read_first = """
, e <code>src/encoder.js</code> para o laço de
      codificação, que nunca encosta na rede."""

howto_heading = "Como transformar imagens em um vídeo"

card = """
            Transforme uma pasta de imagens numa apresentação em MP4. A
            codificação roda no seu próprio computador, com o seu próprio
            hardware."""

