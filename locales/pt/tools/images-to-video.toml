plural = "imagens"
choose = "imagens"

[[facts]]
text = "Sem envio"

[[facts]]
text = "Sem conta"

[[facts]]
text = "Funciona offline"

[[facts]]
text = "Código aberto"

[[facts]]
text = "Os arquivos ficam no seu computador"

[[privacy]]
title = "Suas imagens não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todos os endereços que esta página pode
      acessar, e nenhum deles é deste site. Não existe aqui um endpoint onde seus
      arquivos pudessem ser recolhidos, e não existe no código nada que os
      mandaria mesmo que existisse. Isto já foi <code>connect-src 'none'</code>,
      que era absoluto. Acrescentar publicidade custou isso, e contar essa parte
      faz parte do acordo."""

[[privacy]]
title = "A codificação é local."
body = """
 O WebCodecs roda no seu navegador e o arquivo
      pronto vai direto para um download. Não existe lado de servidor neste
      aplicativo."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre as suas imagens: nem um arquivo, nem uma miniatura, nem um nome, um
      tamanho ou uma contagem. Toda linha que lê, decodifica, compõe ou codifica
      uma imagem é servida desta origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script
      vindo de cdnjs.buymeacoffee.com e busca as letras dele no Google Fonts. É um
      link e nada mais: não informa visita nenhuma, e não recebe nada sobre você
      nem sobre as suas imagens. Nada acontece a menos que você clique, e o lugar
      para onde ele leva é o site de outra empresa."""

[[privacy]]
title = "Uma exceção de propósito."
body = """
 Se você usar &ldquo;Adicionar a partir de um
      endereço da web&rdquo;, aquele servidor é acessado para buscar a imagem e vai
      enxergar o seu endereço IP. Só são buscadas as imagens que você cola, e só
      para dentro: o <code>img-src</code> é aberto, o <code>connect-src</code> não.
      O contador abaixo lista todas as origens externas acessadas."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo continua funcionando,
      menos o carregamento por endereço da web. Essa é a prova mais simples de
      todas."""

[[howto]]
title = "Escolha suas imagens."
body = """
 Arraste uma pasta até o seletor, ou escolha
      os arquivos na mão. Quem lê tudo direto do seu disco é o navegador, e nada é
      mandado para lugar nenhum enquanto você faz isso."""

[[howto]]
title = "Ponha em ordem e defina quanto tempo cada uma fica."
body = """
 Arraste
      para reordenar. O tempo de permanência pode ser dado em quadros ou em
      segundos, para todas as imagens de uma vez ou uma imagem por vez."""

[[howto]]
title = "Escolha uma resolução e uma taxa de quadros."
body = """
 O &ldquo;Acompanhar
      a maior resolução&rdquo; segue a sua maior imagem. As predefinições cobrem
      4K, 1080p, 720p, quadrado e vertical, e ainda tem um tamanho personalizado se
      nenhum deles servir."""

[[howto]]
title = "Crie o vídeo e baixe."
body = """
 A codificação roda no seu próprio
      hardware, então o tempo que leva depende do seu computador e não de uma fila.
      O MP4 pronto vai direto para os downloads do seu navegador."""

[[faq]]
q = "Minhas imagens são enviadas para algum lugar?"
a = """
        Não. Quem lê, compõe e codifica as suas imagens é o seu próprio navegador, no
        seu próprio hardware. Não existe lado de servidor nesta ferramenta, e a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum deles deste site. A única exceção é a função
        opcional de &ldquo;adicionar a partir de um endereço da web&rdquo;, que busca
        uma imagem que você cola, e aí aquele servidor enxerga o seu endereço IP."""

[[faq]]
q = "Quais formatos de imagem posso usar?"
a = """
        Qualquer formato de imagem parada que o seu navegador consiga decodificar, o
        que na prática significa JPG, PNG, WebP, GIF, AVIF e, em dispositivos Apple,
        HEIC. Não existe aqui uma lista separada para manter atualizada, porque
        decodificar é trabalho do navegador, e não nosso."""

[[faq]]
q = "Que formato de vídeo ele produz?"
a = """
        MP4 com vídeo H.264, que toca em basicamente qualquer coisa. Num navegador
        sem WebCodecs a ferramenta recua para gravar WebM, que são as mesmas imagens
        num contêiner que menos editores aceitam."""

[[faq]]
q = "Posso usar isto para uma sequência renderizada do Blender ou do After Effects?"
a = """
        Pode, e é justamente para isso que uma sequência renderizada numerada serve
        aqui. Acrescente os quadros que o seu renderizador escreveu, deixe o tempo de
        permanência em um quadro cada, e ajuste a taxa de quadros para bater com a
        renderização. O &ldquo;Ordenar por nome&rdquo; conta do jeito que você
        espera, então <code>frame_2</code> cai antes de <code>frame_10</code>, e não
        depois.
        <br><br>
        Uma coisa que vale saber antes de começar: o H.264 não tem canal alfa, então
        a transparência é achatada sobre a cor de fundo em vez de ser levada adiante.
        Se você precisa manter o alfa, componha os quadros no seu editor."""

[[faq]]
q = "Posso fazer um timelapse com fotos?"
a = """
        Pode, e é o mesmo trabalho de uma sequência renderizada: mantenha cada foto
        por um único quadro e escolha uma taxa de quadros. A 30 fps, cada trinta
        fotos viram um segundo de vídeo; a 12 fps, essas mesmas fotos duram dois
        segundos e meio.
        <br><br>
        O &ldquo;Ordenar por data&rdquo; devolve um rolo de câmera à ordem em que foi
        fotografado, o que importa quando os nomes de arquivo recomeçaram em 0001.
        Fotos de tamanhos diferentes não são problema, porque o &ldquo;Acompanhar a
        maior resolução&rdquo; dimensiona o vídeo de modo que nenhuma delas seja
        reduzida."""

[[faq]]
q = "Existe limite de quantas imagens, ou de quanto o vídeo pode durar?"
a = """
        A ferramenta não tem limite embutido. O teto prático é a memória do seu
        próprio computador, porque o vídeo pronto é montado ali antes de você baixar.
        Apresentações muito grandes em 4K são a primeira coisa a sentir isso."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste. O site exibe
        publicidade, e é ela que paga a conta. Os anúncios não recebem nada sobre as
        suas imagens."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela
        continua funcionando. Esse é também o jeito mais simples de provar que nada
        está sendo enviado: uma ferramenta que mandasse as suas imagens embora para
        serem processadas pararia no instante em que você tirasse da tomada."""

[[faq]]
q = "Posso acrescentar música ou uma trilha sonora?"
a = """
        Ainda não. A ferramenta produz só vídeo: o MP4 que ela escreve tem uma única
        trilha de vídeo e nenhuma trilha de áudio. Se você precisa de trilha sonora,
        acrescente depois, num editor de vídeo."""

[schema]
browser_requirements = "Requer JavaScript. A saída em MP4 precisa de um navegador com WebCodecs; os demais recuam para WebM."
description = "Transforme uma pasta de imagens numa apresentação em vídeo MP4. Cada etapa roda no seu navegador, então imagem nenhuma é enviada."
features = [
  "Converte imagens JPG, PNG, WebP, GIF e AVIF em vídeo",
  "Saída em MP4 (H.264), com WebM como recuo",
  "Resoluções até 3840x2160, taxas de quadros de 12 a 60 fps",
  "Tempo de permanência por imagem, em quadros ou em segundos",
  "Roda offline; sem envio, sem conta",
]

