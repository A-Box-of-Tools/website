#
# Imagens para vídeo - português do Brasil.
#
# Overrides for tools/images-to-video/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# This is the one tool with a [picker.urls] table, so it is also the one whose
# translation has to supply the noun the importer's warning in [ui.picker] is
# written around. The Portuguese sentences there were rewritten to use it only
# after "qual" and "cada", which inflect for neither gender nor number, so the
# noun can simply be the right word - see the comment above [ui.picker].
#

name = "Imagens para vídeo"
heading = "Imagens&nbsp;para&nbsp;vídeo <span class=\"h1-kw\">&mdash; fazer uma apresentação em MP4</span>"
tagline = "Crie um MP4 a partir de uma sequência renderizada, fotos de timelapse ou uma apresentação."

title = "Sequência de imagens para MP4 &mdash; grátis, sem envio, funciona offline"
description = "Converta uma sequência de imagens para MP4 no navegador. Use um quadro por imagem para renderizações e timelapses, ou segundos por foto para uma apresentação. Sem upload nem conta."
og_title = "Sequência de imagens para MP4 &mdash; grátis, no seu navegador"
og_description = "Transforme uma sequência renderizada, um timelapse ou uma pasta de fotos num MP4. A codificação roda no seu próprio computador e nada é enviado."
og_image_alt = "Imagens para vídeo - transforme uma pasta de imagens numa apresentação em MP4"

pledge = """
    Cada quadro é codificado pelo seu próprio navegador, e o vídeo é montado na
    memória deste computador. O codificador nunca encosta na rede, e do outro lado
    desta página não existe servidor nenhum para onde mandar uma imagem, mesmo que
    ele encostasse."""

live_hint = """
      Você não precisa confiar na nossa palavra. Abra as ferramentas do
      desenvolvedor, deixe a aba &ldquo;Rede&rdquo; à vista e faça um vídeo.
      Nenhuma requisição leva uma imagem, uma miniatura ou um nome de arquivo. Ou
      então desligue a internet e faça um assim mesmo."""

read_first = """
, e <code>src/encoder.js</code> para o laço de
      codificação, que nunca encosta na rede."""

howto_heading = "Como converter uma sequência de imagens ou uma apresentação para MP4"

card = """
            Transforme uma pasta de imagens numa apresentação em MP4. A
            codificação roda no seu próprio computador, com o seu próprio
            hardware."""

[words]
plural = "imagens"
choose = "imagens"

[[facts]]
text = "Sem envio"

[[facts]]
text = "Sem conta"

[[facts]]
text = "Funciona offline"

[[facts]]
text = "Código aberto"

[[facts]]
text = "Os arquivos ficam no seu computador"

[[privacy]]
title = "O processamento acontece neste navegador."
body = "A ferramenta processa entradas e resultados no navegador. Seu código não os envia para processamento. Content-Security-Policy limita recursos e destinos, mas hosts permitidos podem receber solicitações: ela não inspeciona o conteúdo nem prova sozinha que nada é enviado. Compare código e solicitações da operação ou conclua a operação local desconectado."

[[privacy]]
title = "A codificação é local."
body = """
 O WebCodecs roda no seu navegador e o arquivo
      pronto vai direto para um download. Não existe lado de servidor neste
      aplicativo."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre as suas imagens: nem um arquivo, nem uma miniatura, nem um nome, um
      tamanho ou uma contagem. Toda linha que lê, decodifica, compõe ou codifica
      uma imagem é servida desta origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script
      vindo de cdnjs.buymeacoffee.com e busca as letras dele no Google Fonts. É um
      link e nada mais: não informa visita nenhuma, e não recebe nada sobre você
      nem sobre as suas imagens. Nada acontece a menos que você clique, e o lugar
      para onde ele leva é o site de outra empresa."""

[[privacy]]
title = "Uma exceção de propósito."
body = """
 Se você usar &ldquo;Adicionar a partir de um
      endereço da web&rdquo;, aquele servidor é acessado para buscar a imagem e vai
      enxergar o seu endereço IP. Só são buscadas as imagens que você cola, e só
      para dentro: o <code>img-src</code> é aberto, o <code>connect-src</code> não.
      O contador abaixo lista todas as origens externas acessadas."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo continua funcionando,
      menos o carregamento por endereço da web. Essa é a prova mais simples de
      todas."""

[[howto]]
title = "Escolha suas imagens."
body = """
 Arraste uma pasta até o seletor, ou escolha
      os arquivos na mão. Quem lê tudo direto do seu disco é o navegador, e nada é
      mandado para lugar nenhum enquanto você faz isso."""

[[howto]]
title = "Escolha quadros para uma sequência ou segundos para uma apresentação."
body = " Use &ldquo;Ordenar por nome&rdquo; para quadros numerados de renderização e confira a primeira e a última miniatura. Mantenha um quadro por imagem para uma sequência renderizada ou um timelapse de fotos, e ajuste a taxa de quadros à sua fonte. Para uma apresentação, mude para segundos, digite um tempo como três e clique em &ldquo;Aplicar a todas&rdquo;. Arraste para reordenar ou altere o tempo de uma imagem específica."

[[howto]]
title = "Escolha uma resolução e uma taxa de quadros."
body = " Escolha 1080p para uma primeira exportação, ou use o formato quadrado ou vertical do destino. &ldquo;Acompanhar a maior resolução&rdquo; usa a maior largura e a maior altura entre as imagens. &ldquo;Caber dentro&rdquo; mantém a imagem inteira; &ldquo;Preencher o quadro&rdquo; corta as bordas. Confira o resumo de duração e tamanho de saída antes de codificar."

[[howto]]
title = "Crie o vídeo e baixe."
body = """
 A codificação roda no seu próprio
      hardware, então o tempo que leva depende do seu computador e não de uma fila.
      O MP4 pronto vai direto para os downloads do seu navegador."""

[[faq]]
q = "Minhas imagens são enviadas para algum lugar?"
a = """
        Não. Quem lê, compõe e codifica as suas imagens é o seu próprio navegador, no
        seu próprio hardware. Não existe lado de servidor nesta ferramenta, e a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum deles deste site. A única exceção é a função
        opcional de &ldquo;adicionar a partir de um endereço da web&rdquo;, que busca
        uma imagem que você cola, e aí aquele servidor enxerga o seu endereço IP."""

[[faq]]
q = "Quais formatos de imagem posso usar?"
a = """
        Qualquer formato de imagem parada que o seu navegador consiga decodificar, o
        que na prática significa JPG, PNG, WebP, GIF, AVIF e, em dispositivos Apple,
        HEIC. Não existe aqui uma lista separada para manter atualizada, porque
        decodificar é trabalho do navegador, e não nosso."""

[[faq]]
q = "Que formato de vídeo ele produz?"
a = " O formato preferido é MP4 com vídeo H.264. A alternativa grava em tempo real, geralmente como WebM, que menos editores aceitam. Mantenha a aba visível durante essa gravação; os tempos são aproximados e imagens podem ser puladas se a decodificação atrasar. Use o codificador MP4 para sequências numeradas exatas quando o navegador oferecer suporte."

[[faq]]
q = "Posso usar isto para uma sequência renderizada do Blender ou do After Effects?"
a = """
        Pode, e é justamente para isso que uma sequência renderizada numerada serve
        aqui. Acrescente os quadros que o seu renderizador escreveu, deixe o tempo de
        permanência em um quadro cada, e ajuste a taxa de quadros para bater com a
        renderização. O &ldquo;Ordenar por nome&rdquo; conta do jeito que você
        espera, então <code>frame_2</code> cai antes de <code>frame_10</code>, e não
        depois.
        <br><br>
        Uma coisa que vale saber antes de começar: o H.264 não tem canal alfa, então
        a transparência é achatada sobre a cor de fundo em vez de ser levada adiante.
        Se você precisa manter o alfa, componha os quadros no seu editor."""

[[faq]]
q = "Posso fazer um timelapse com fotos?"
a = " Pode, e é o mesmo trabalho de uma sequência renderizada: mantenha cada foto por um único quadro e escolha uma taxa de quadros. A 30 fps, cada trinta fotos viram um segundo de vídeo; a 12 fps, essas mesmas fotos duram dois segundos e meio. <br><br> &ldquo;Ordenar por data&rdquo; usa as datas de modificação dos arquivos, que podem mudar quando as fotos são copiadas ou editadas. Confira a ordem quando os nomes dos arquivos tiverem recomeçado em 0001. Fotos de tamanhos diferentes não são problema, porque &ldquo;Acompanhar a maior resolução&rdquo; começa com a maior largura e a maior altura, depois limita a borda mais longa a 7680 pixels e arredonda para dimensões pares. Confira o resumo do tamanho de saída; originais muito grandes ainda podem ser reduzidos."

[[faq]]
q = "Existe limite de quantas imagens, ou de quanto o vídeo pode durar?"
a = " Não há limite fixo de imagens, mas as exportações MP4 precisam ficar abaixo de 4 GiB (cerca de 4,3 GB). O vídeo pronto é montado na memória antes do download, então seu dispositivo pode ficar sem memória bem antes desse limite. O codificador do navegador também limita as dimensões de saída. Se uma exportação grande falhar, reduza a resolução, encurte a sequência ou divida-a em partes."

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste. O site exibe
        publicidade, e é ela que paga a conta. Os anúncios não recebem nada sobre as
        suas imagens."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela
        continua funcionando. Esse é também o jeito mais simples de provar que nada
        está sendo enviado: uma ferramenta que mandasse as suas imagens embora para
        serem processadas pararia no instante em que você tirasse da tomada."""

[[faq]]
q = "Posso acrescentar música ou uma trilha sonora?"
a = """
        Ainda não. A ferramenta produz só vídeo: o MP4 que ela escreve tem uma única
        trilha de vídeo e nenhuma trilha de áudio. Se você precisa de trilha sonora,
        acrescente depois, num editor de vídeo."""

[schema]
browser_requirements = "Requer JavaScript. A saída em MP4 precisa de um navegador com WebCodecs; os demais usam WebM."
description = "Transforme uma pasta de imagens numa apresentação em vídeo MP4. Cada etapa roda no seu navegador, então imagem nenhuma é enviada."
features = [
  "Converte imagens JPG, PNG, WebP, GIF e AVIF em vídeo",
  "Saída em MP4 (H.264), com WebM como alternativa",
  "Resoluções predefinidas até 4K, dimensões personalizadas dentro dos limites do navegador e taxas de quadros inteiras personalizadas de 1 a 120 fps",
  "Tempo de permanência por imagem, em quadros ou em segundos",
  "Roda offline; sem envio, sem conta",
]

