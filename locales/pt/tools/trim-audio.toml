title = "Cortar áudio online &mdash; fique só com o que interessa, sem enviar nada"
description = "Toque uma gravação e marque cada trecho que vale a pena enquanto ele passa, depois salve esses trechos num arquivo só. Cortes exatos na amostra, sem estalo nas emendas, nada enviado."
og_title = "Cortador de áudio &mdash; fique só com o que interessa, sem enviar nada"
og_description = "Aperte I e O enquanto toca para marcar cada trecho que vale a pena. Os trechos marcados são escritos de volta num arquivo só, cortados na amostra exata, sem nada ser enviado."
og_image_alt = "Cortador de áudio - marque os trechos que você quer e salve como uma gravação, no navegador"

pledge = """
    A sua gravação é lida, marcada, cortada e escrita pelo seu próprio navegador, no
    seu próprio hardware. Aqui nada consegue buscar nem mandar coisa alguma, porque
    esta ferramenta não tem função de rede nenhuma. E mesmo que tivesse, do outro
    lado desta página não existe servidor para receber uma gravação."""

live_hint = """
      Você não precisa confiar na nossa palavra. Abra as ferramentas do
      desenvolvedor, deixe a aba &ldquo;Rede&rdquo; à vista e corte alguma coisa.
      Nenhuma requisição leva uma amostra, um nome de arquivo ou um byte do que você
      escolheu. Ou então desligue a internet e corte uma gravação assim mesmo: uma
      ferramenta que mandasse o seu áudio embora para ser cortado simplesmente
      pararia."""

read_first = """
, <code>src/segments.js</code> para as marcas e o
      arquivo em que elas são salvas, <code>src/decode.js</code> para as vinte
      linhas que entregam o seu arquivo ao decodificador do próprio navegador,
      <code>src/trim.js</code> para a conta que transforma uma marca numa sequência
      de amostras e para o laço que as copia, e <code>src/wav.js</code> para o
      cabeçalho que vai na frente delas. Nenhum deles importa nada capaz de fazer uma
      requisição."""

howto_heading = "Como cortar um arquivo de áudio"

card = """
            Marque cada trecho que vale a pena enquanto toca, depois salve tudo como
            uma gravação só. Os cortes caem na amostra exata, e as emendas não
            estalam."""

