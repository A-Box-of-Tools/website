[[privacy]]
title = "As suas fotografias não têm para onde ir."
body = """
 A
      Content-Security-Policy lista todos os endereços que esta página pode
      contatar, e nenhum deles pertence a este site. Não existe aqui um endpoint
      onde os seus arquivos pudessem ser recolhidos, e não existe no código nada
      que os enviasse se existisse &mdash; nenhum <code>fetch</code>, nenhum
      <code>XMLHttpRequest</code>, nenhum <code>sendBeacon</code>, nem em
      <code>src/</code> nem no worker."""

[[privacy]]
title = "As prévias RAW são lidas neste dispositivo."
body = "Muitos arquivos RAW contêm uma prévia JPEG renderizada pela câmera. Esta ferramenta percorre os diretórios do arquivo e extrai a maior prévia utilizável. A leitura de inspeção conta os cabeçalhos e diretórios lidos para encontrá-la e descrevê-la; a decodificação também lê a fatia JPEG. Os dados do sensor nunca são decodificados, e a linha mostra as dimensões reais da prévia."

[[privacy]]
title = "O trabalho acontece num Worker neste computador, não num servidor."
body = """
 Esta é a única
      ferramenta aqui que usa um, porque empilhar são minutos de aritmética em vez
      de segundos, e uma página congelada não consegue mostrar progresso nem ser
      cancelada. Um Worker é uma segunda linha de execução neste mesmo navegador
      &mdash; veja <code>src/worker.js</code>. Ele recebe os próprios arquivos, o
      que sai de graça, porque a referência a um arquivo não são os bytes; e ele tem
      exatamente a mesma Content-Security-Policy da página, ou seja, lugar nenhum
      para onde mandá-los."""

[[privacy]]
title = "Sobre o conjunto não se relata nada em lugar nenhum."
body = """
 Quantos quadros você
      empilhou, que câmera os escreveu, quanto cada um tinha se deslocado, que
      método você escolheu e quanto tempo levou ficam na memória desta página até
      você fechá-la. Não existe neste repositório um evento de analytics próprio que
      carregue qualquer parte disso, e a única pergunta que este site faz depois de
      um download manda um polegar para cima ou para baixo e o nome da ferramenta,
      mais nada."""

[[privacy]]
title = "Funciona offline."
body = """
 Desconecte da rede e a ferramenta continua a
      mesma, porque nunca houve um passo de rede nela. O worker e cada módulo que
      ele carrega ficam em cache pelo service worker desta página, então uma cópia
      instalada empilha arquivos RAW com a rede desligada."""

[[howto]]
title = "Escolha os quadros."
body = "Uma sequência de fotos, uma série de intervalômetro ou uma pasta de RAW com prévias JPEG utilizáveis. Espere os arquivos terminarem de abrir. Cada linha mostra o que foi encontrado: para RAW, a câmera e o tamanho real da prévia incorporada. Os arquivos que não puderam ser abertos ficam na lista para você conferir quais foram deixados de fora."

[[howto]]
title = "Escolha o método que combina com o que você quer perder."
body = "Ruído: média, ou sigma clipping para rejeitar valores diferentes dos demais. Pessoas, carros ou um avião: mediana, desde que ocupem cada parte da cena em menos da metade dos quadros. Rastros de estrelas: clarear. Macro fotografada ao longo do anel de foco: focus stacking. A nota abaixo do menu explica o método e seus limites."

[[howto]]
title = "Decida se os quadros precisam de alinhamento."
body = "Comece com Automático: ele mede deslocamento, rotação e escala e depois corrige a perspectiva quando regiões confiáveis espalhadas pela imagem concordam. É útil para estrelas em campo amplo. Só deslocamento exige menos medições para uma sequência estável. Escolha Não se os quadros já se encaixam, ou para rastros de estrelas que devem manter o movimento do céu. Um tripé fixo não mantém as estrelas alinhadas. Cada quadro é medido contra o marcado como referência, que é o primeiro até você escolher outro. &ldquo;Usar como referência&rdquo; muda a marca sem reordenar a lista."

[[howto]]
title = "Leia os quatro números, e então aperte o botão."
body = "Antes de começar, a página mostra o tamanho planejado do resultado, a memória estimada da pilha, as decodificações planejadas para empilhar e os bytes lidos na inspeção. Processos internos do navegador e liberação de memória podem consumir mais que os buffers modelados; esses números são um plano, não uma garantia do uso total. Se forem necessárias faixas, a página sugere uma resolução de trabalho menor. Depois, compare a referência com o resultado no tamanho real dos pixels e confira os detalhes de alinhamento antes de baixar."

[[faq]]
q = "As minhas fotografias são enviadas para algum lugar?"
a = """
        Não. Cada quadro é aberto, decodificado, alinhado, empilhado e escrito pelo
        seu próprio navegador no seu próprio hardware. Esta ferramenta não tem função
        de rede alguma &mdash; nunca busca nada e nunca envia nada &mdash; e a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode contatar, e nenhum deles pertence a este site. Carregue a página uma
        vez, tire o cabo da internet, e ela continua funcionando. Isso importa mais
        aqui do que na maioria das ferramentas simplesmente pelo volume: uma pilha de
        vinte quadros RAW é cerca de um gigabyte, e enviar um gigabyte de fotografias
        para que se tire uma média delas é justamente o que esta ferramenta existe
        para evitar."""

[[faq]]
q = "Quais formatos RAW ele consegue ler, e como?"
a = "<span id=\"faq-raw\"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF, RAF, RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL e formatos relacionados são compatíveis quando o arquivo contém uma prévia JPEG utilizável. A ferramenta percorre os diretórios e usa a maior prévia encontrada, que pode ser menor que a imagem do sensor ou não existir. <strong>Os dados do sensor não são decodificados.</strong> Os pixels mantêm o balanço de branco e o estilo de imagem da câmera, com oito bits por canal. Confira as dimensões na linha. A contagem de inspeção cobre cabeçalhos e diretórios; a decodificação também lê a fatia JPEG."

[[faq]]
q = "Então por que não decodificar os dados do sensor direito?"
a = "Decodificar o sensor exigiria um mecanismo RAW como LibRaw ou dcraw, com os esquemas de compressão de cada câmera. Usar um JPEG incorporado mantém esta ferramenta pequena e usa o decodificador do navegador. Também significa aceitar a renderização da câmera e a resolução da prévia presente no arquivo. Para escolher os ajustes de revelação RAW, revele os quadros antes e exporte JPEG ou PNG para empilhar aqui."

[[faq]]
q = "Quantos quadros ele aguenta, e de que tamanho?"
a = "Seis dos sete métodos têm acumuladores cujo tamanho não cresce com o número de quadros. Média, clarear, escurecer, somar e focus stacking precisam de uma passagem por faixa; sigma clipping precisa de duas. Mediana guarda os valores de cada quadro para a faixa atual, então sua memória cresce com a quantidade de quadros. Qualquer método pode ser dividido em faixas se seus buffers ultrapassarem o orçamento da ferramenta, o que exige decodificar os quadros de novo para cada faixa. A página estima esses buffers e mostra as decodificações planejadas para empilhar. Inspeção e alinhamento acrescentam trabalho, e os processos internos de codecs e GPU do navegador podem precisar de memória além da estimativa."

[[faq]]
q = "O que o alinhamento dos quadros faz de fato?"
a = "A ferramenta mede o deslocamento de cada quadro em relação à referência e o reposiciona com precisão menor que um pixel. Usa correlação de fase: o deslocamento aparece como uma diferença de fase entre os espectros, então uma transformada de Fourier por imagem encontra um deslocamento de duzentos pixels tão facilmente quanto um de dois. Rotação e escala são recuperadas pelo mesmo método sobre o espectro em coordenadas logarítmico-polares. Automático também mede regiões espalhadas pelo quadro e corrige a perspectiva quando há concordância entre medições confiáveis suficientes. Isso ajuda a alinhar estrelas de um campo amplo nas bordas e no centro. Se não for possível medir essa correção com confiança, mantém rotação e escala e informa essa alternativa em Detalhes de alinhamento. A correção vale para o quadro inteiro; não alinha um objeto que se move sozinho nem todas as profundidades de uma cena fotografada um passo para o lado. Um quadro deslocado à esquerda não alcança a borda direita. Por isso o resultado é recortado para a área comum e pode ficar um pouco menor, evitando bordas escuras por áreas sem cobertura."

[[faq]]
q = "Qual método eu devo usar?"
a = "<strong>Média</strong> para ruído quando nada se mexeu: o ruído aleatório independente cai aproximadamente pela raiz quadrada do número de quadros. <strong>Mediana</strong> para remover o que ocupa uma parte da cena em menos da metade dos quadros. <strong>Sigma clipping</strong> tira a média dos valores próximos da média e rejeita os que passam do limite escolhido. Pode manter objetos em movimento em conjuntos pequenos ou se aparecem com frequência; mediana é mais segura quando removê-los é a prioridade. <strong>Clarear</strong> para rastros de estrelas, fogos e light painting. <strong>Escurecer</strong> para remover elementos claros que se mexeram. <strong>Somar</strong> faz uma mistura aditiva dos quadros decodificados. Trabalha com valores de imagem de oito bits e não reproduz uma exposição mais longa da câmera. <strong>Focus stacking</strong> para uma macro fotografada ao longo do anel de foco."

[[faq]]
q = "Por que o meu resultado tem oito bits se os meus arquivos RAW têm catorze?"
a = "A entrada RAW é a prévia JPEG da câmera, e a saída é um PNG ou JPEG de oito bits. Média e sigma clipping usam acumuladores mais amplos e arredondam no final. Assim estimam um valor mais limpo a partir de quadros com ruído sem arredondar cada etapa intermediária. A imagem salva continua com oito bits por canal; não ganha a profundidade de bits nem o alcance dinâmico dos dados lineares do sensor."

[[faq]]
q = "Posso empilhar quadros de tamanhos diferentes, ou de câmeras diferentes?"
a = "Sim, mas confira se é intencional. O maior quadro define a área de trabalho; os outros são ajustados e centralizados nela. O resultado salvo é recortado para a área comum, então formatos diferentes ou o alinhamento podem deixá-lo menor que a área planejada. Misturar câmeras também mistura sua renderização de cores. Mantenha exposição e enquadramento constantes e compare com a referência para examinar o resultado."

[[faq]]
q = "Ele diz que a execução vai ser em faixas. O que isso quer dizer?"
a = "A memória de trabalho necessária supera o que a ferramenta quer reservar de uma vez. A imagem é dividida em faixas horizontais, empilhadas uma por uma. A geometria de alinhamento e o método são os mesmos; a reamostragem do navegador pode variar levemente no último bit. Os quadros são lidos de novo para cada faixa, então demora mais. A página mostra quantas decodificações serão necessárias. Reduzir a resolução de trabalho um nível divide a memória por quatro e quase sempre permite uma passagem só. A nota indica o ajuste adequado."

[[faq]]
q = "Por que esta ferramenta usa um Worker e nenhuma das outras usa?"
a = """
        Porque é a única cujo trabalho se mede em minutos. Toda outra ferramenta aqui
        faz algo que leva um segundo ou dois, onde tirar o trabalho da linha principal
        seria cerimônia. Empilhar vinte quadros grandes é aritmética densa sobre
        centenas de megabytes, e na linha principal isso significa uma página
        congelada: nenhuma barra de progresso andando, um botão Cancelar que não
        responde, e no fim um navegador se oferecendo para fechar a aba. O Worker é
        uma segunda linha de execução neste mesmo navegador, rodando um arquivo desta
        mesma pasta, sob esta mesma política. Não é um servidor e não é uma função de
        rede."""

[[faq]]
q = "É grátis, e eu preciso de conta?"
a = "É grátis, sem conta, login, período de teste ou marca d’água. Não há uma cota do serviço para a quantidade ou o tamanho dos quadros. Os limites práticos são a memória do dispositivo, os limites de canvas e decodificação do navegador e o tempo da pilha. A publicidade sustenta a página e não recebe nada sobre suas fotos."

