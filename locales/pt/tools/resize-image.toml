tagline = "Diga o tamanho. Desenhe a caixa. Escolha o formato."

title = "Redimensionar imagem &mdash; cortar e converter, sem enviar nada"
description = "Redimensione, corte e converta imagens JPEG, PNG e WebP no seu navegador. Em pixels exatos, em porcentagem ou pelo lado maior, para uma imagem ou uma pasta inteira. Não se envia nada."
og_title = "Redimensione, corte e converta uma imagem sem enviá-la"
og_description = "Diga o tamanho em pixels ou em porcentagem, arraste uma caixa de corte, troque o formato. Vale para uma imagem ou para um lote inteiro, e tudo roda no seu próprio computador."
og_image_alt = "Redimensionador de imagens - redimensione, corte e converta sem enviar"

pledge = """
    O redimensionamento, o corte e a troca de formato rodam todos no seu próprio
    navegador, no seu próprio hardware, com os codificadores de imagem que ele já
    traz de fábrica. Esta ferramenta não tem função de rede de espécie alguma:
    não há o que buscar nem o que mandar. E do outro lado desta página não existe
    servidor nenhum para onde mandar uma imagem, mesmo que houvesse caminho."""

live_hint = """
      Você não precisa confiar na nossa palavra. Abra as ferramentas do
      desenvolvedor, deixe a aba &ldquo;Rede&rdquo; à vista e redimensione uma
      foto. Nenhuma requisição leva uma imagem, uma miniatura, um nome de arquivo
      ou um byte do que você escolheu. Ou então desligue a internet e redimensione
      uma assim mesmo."""

read_first = """
, <code>src/geometry.js</code> para a aritmética que
      decide o que fica e de que tamanho sai, e <code>src/codecs.js</code> para a
      única chamada de <code>drawImage</code> que faz o corte e o
      redimensionamento de uma vez só."""

howto_heading = "Como redimensionar uma imagem sem enviá-la"

card = """
            Pixels exatos, porcentagem ou lado maior, com uma caixa de corte e
            uma troca de formato no caminho. Uma imagem ou uma pasta
            inteira."""

