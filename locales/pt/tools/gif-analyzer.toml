[[privacy]]
title = "O seu GIF não tem para onde ir."
body = """
 A
      Content-Security-Policy lista todo endereço que esta página pode contatar, e
      nenhum deles é nosso. Aqui não existe um ponto de coleta onde o seu arquivo
      pudesse parar, nem nada no código que o mandasse para lá se existisse. Isto já
      disse <code>connect-src 'none'</code>, que não abria exceção; a publicidade
      custou isso, e dizer isso faz parte do acordo."""

[[privacy]]
title = "O leitor são quatro arquivos deste repositório."
body = """
 Nada aqui usa o
      decodificador de GIF do navegador para descobrir o que tem no arquivo, porque
      esse decodificador não diz para onde foi um byte. Então o formato é lido na mão:
      <code>src/gif.js</code> percorre os blocos, <code>src/lzw.js</code> expande os
      pixels, <code>src/frames.js</code> empilha tudo e <code>src/budget.js</code>
      soma as partes de volta e confere se elas dão o tamanho do arquivo."""

[[privacy]]
title = "Comentários e metadados são mostrados a você, e a mais ninguém."
body = """

      Um GIF pode carregar um bloco de comentário, um pacote XMP descrevendo uma
      edição ou um perfil de cor, e esta página imprime todos eles. Eles vão parar na
      tela na sua frente e em lugar nenhum além disso: não existe neste repositório um
      evento de medição que leve nada disso, e a página não conseguiria enviar um nem
      se existisse."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts de
      publicidade e de medição vêm do Google. Nenhum dos dois recebe coisa alguma
      sobre o seu arquivo: nem o arquivo, nem uma miniatura, nem um nome, um tamanho,
      uma contagem de quadros ou um comentário. Toda linha que lê, descompacta ou
      desenha um GIF é servida desta origem e está listada no repositório."""

[[privacy]]
title = "O que o botão de doação carrega, e o que não chega até ele."
body = """

      O botão &ldquo;Buy me a coffee&rdquo; do cabeçalho é desenhado por um script de
      cdnjs.buymeacoffee.com e pega as letras no Google Fonts. Ele não é mais do que um
      link: não avisa ninguém da sua visita e não recebe nada sobre você nem sobre os
      seus arquivos. Nada acontece enquanto você não clicar, e o que você abriria ao
      clicar é o site de outra pessoa."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e tudo nesta página continua
      funcionando. Essa é a prova mais simples de todas: uma ferramenta que mandasse o
      seu GIF embora para ser analisado pararia no instante em que você tirasse da
      tomada."""

[[howto]]
title = "Escolha um GIF."
body = """
 Arraste até o seletor ou procure na mão. O
      navegador lê direto do seu disco, e nesse meio-tempo nada sai daqui."""

[[howto]]
title = "Leia primeiro o resumo."
body = """
 O tamanho da tela, a quantidade de
      quadros, quanto tempo a animação diz que dura e quanto ela toca de verdade.
      Esses dois últimos divergem mais do que as pessoas esperam, e o motivo está na
      seção seguinte."""

[[howto]]
title = "Veja o que chama atenção."
body = """
 Cada linha ali é medida no seu
      arquivo: tempos que navegador nenhum vai respeitar, um bloco de repetição
      faltando, tabelas de cor que ninguém referencia, metadados maiores do que alguns
      quadros. Nada é um chute sobre o que você pretendia fazer."""

[[howto]]
title = "Veja para onde foram os bytes."
body = """
 Cada byte do arquivo está em
      exatamente uma linha, e as linhas somam o arquivo. Se a maior parte não estiver
      em &ldquo;pixels compactados&rdquo;, o resto da tabela diz onde ela está."""

[[howto]]
title = "Passe pelos quadros."
body = """
 Cada um mostra o tempo, o retângulo, o
      método de descarte e o tamanho dele. Alterne entre &ldquo;a tela depois de cada
      quadro&rdquo; e &ldquo;só o que cada quadro guarda&rdquo;: é no segundo que você
      vê se o arquivo está otimizado, porque um GIF bem feito guarda retângulos
      minúsculos e um mal feito guarda a imagem inteira toda vez."""

[[howto]]
title = "Leve o relatório se precisar."
body = """
 A análise inteira em texto puro,
      para colar numa mensagem ou guardar ao lado do arquivo. Ele é montado na própria
      página a partir do que já está na sua tela."""

[[faq]]
q = "O meu GIF é enviado para algum lugar?"
a = """
        Não. O arquivo é lido, descompactado e desenhado pelo seu próprio navegador,
        no seu próprio hardware. Esta ferramenta não tem lado servidor, e a
        <code>Content-Security-Policy</code> da página lista todo endereço que ela
        pode contatar: nenhum é nosso. Tire da tomada e ela continua analisando
        GIFs."""

[[faq]]
q = "Por que meu GIF toca mais devagar do que os tempos dizem?"
a = """
        Porque todo navegador se recusa a respeitar um tempo abaixo de dois centésimos
        de segundo e segura o quadro por um décimo no lugar. A regra foi escrita
        dentro do Netscape em 1996, para os globos giratórios e as placas de &ldquo;em
        construção&rdquo; da época, e foi copiada para todo navegador desde então;
        ninguém nunca tirou.
        <br><br>
        Então um GIF cujos quadros dizem todos 0,01 s não toca a 100 quadros por
        segundo. Toca a 10, de cinco a dez vezes mais devagar do que o programa que o
        fez pretendia. Esta página mostra os dois números, o que o arquivo diz e o que
        ele vai fazer de verdade, e marca os quadros afetados. O conserto, no programa
        que escreveu o arquivo, é escrever 0,02 em vez de 0,01."""

[[faq]]
q = "O que quer dizer &ldquo;descarte&rdquo;?"
a = """
        O que deixar na tela quando o tempo de um quadro acaba, e é o campo que decide
        se uma animação fica certa ou borra.
        <br><br>
        <strong>Deixar como está</strong> quer dizer que o próximo quadro pinta por
        cima deste, que é o que você quer quando os quadros são opacos e se cobrem.
        <strong>Voltar ao fundo</strong> limpa antes o retângulo do quadro, que é do
        que a transparência precisa: sem isso, as partes vazadas do próximo quadro
        mostram o anterior por baixo. <strong>Restaurar o que estava embaixo</strong>
        devolve o que havia ali antes deste quadro desenhar, que é como se guarda um
        objeto pequeno se mexendo sobre um fundo parado. E <strong>não
        especificado</strong> quer dizer que o arquivo não falou nada, e todo
        visualizador trata isso como &ldquo;deixar como está&rdquo;."""

[[faq]]
q = "Por que o meu GIF é tão grande?"
a = """
        A tabela &ldquo;Para onde foram os bytes&rdquo; responde isso para o seu
        arquivo específico em vez de responder em geral, e só existem algumas respostas
        possíveis.
        <br><br>
        Se quase tudo estiver em <strong>pixels compactados</strong>, o arquivo é
        simplesmente muita imagem: o GIF guarda cada quadro como pixels inteiros, sem
        compensação de movimento e sem botão de qualidade, então o tamanho é
        aproximadamente a área vezes a quantidade de quadros. Menos quadros, um
        tamanho menor ou menos cores são as únicas alavancas.
        <br><br>
        Se uma fatia grande estiver em <strong>tabelas de cor</strong>, o arquivo está
        escrevendo uma paleta por quadro, a 768 bytes cada. Se uma fatia grande
        estiver em <strong>metadados</strong>, algum editor deixou um pacote XMP para
        trás, e ele pode sair sem encostar na imagem. E se todos os quadros cobrem a
        tela inteira, o codificador nunca descobriu qual parte mudou de verdade, e em
        qualquer coisa filmada ou gravada isso é quase o arquivo todo."""

[[faq]]
q = "Qual é a diferença entre as duas visões de quadro?"
a = """
        <strong>A tela depois de cada quadro</strong> é o que um visualizador mostra
        naquele momento: este quadro desenhado por cima do que os anteriores deixaram.
        <strong>Só o que cada quadro guarda</strong> é o retângulo que o arquivo
        realmente tem para aquele quadro, sozinho, sem nada embaixo.
        <br><br>
        A segunda é a interessante. Um GIF pode guardar de um quadro só a parte da
        imagem que mudou, e é por isso que a gravação de tela de uma janela quase
        parada pode ser pequena. Se todo quadro do seu arquivo é a tela inteira,
        ninguém fez esse trabalho, e olhando a animação você não descobre: só olhando
        o que está guardado."""

[[faq]]
q = "Diz que o meu arquivo tem um comentário ou XMP. O que é isso?"
a = """
        Texto que viaja junto com a imagem e que visualizador nenhum desenha. Um bloco
        de comentário costuma ser o nome do programa que escreveu o arquivo. Um pacote
        XMP é o XML que um editor de imagens escreve para registrar o que fez, e pode
        levar o histórico de edições, a versão do programa e às vezes o nome do
        autor.
        <br><br>
        Esta página imprime os dois por inteiro, porque a pergunta interessante sobre
        metadados é o que eles dizem, não o fato de existirem. São mostrados a você e
        a mais ninguém: nada neste repositório lê nada disso para alguém."""

[[faq]]
q = "Ele abre um GIF quebrado?"
a = """
        Ele tenta, e avisa onde desistiu. Um arquivo que termina no meio de um bloco,
        que tem um byte onde deveria haver um marcador, ou que carrega um quadro cujos
        dados compactados acabam cedo demais ainda vai mostrar tudo o que dava para
        ler até ali, com o problema nomeado no topo. Esse é justamente o caso em que
        mais se quer um analisador, então jogar o arquivo inteiro fora por causa de um
        byte ruim seria o comportamento errado."""

[[faq]]
q = "Ele altera o meu arquivo?"
a = """
        Não. Esta ferramenta só lê. Não existe arquivo de saída, nem recodificação,
        nem botão aqui que escreva um GIF: a única coisa que dá para baixar é uma cópia
        da análise em texto puro. O seu original continua intocado no seu disco, que é
        também a resposta honesta para o que acontece se você fechar a aba."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste. Não tem limite de
        tamanho de arquivo além da memória do seu próprio computador. O site exibe
        publicidade, e é ela que paga a conta; os anúncios não recebem nada sobre o
        seu arquivo."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela continua
        funcionando. Esse é também o jeito mais simples de provar que nada está sendo
        enviado: uma ferramenta que mandasse o seu GIF embora para ser analisado
        pararia no instante em que você tirasse da tomada."""

