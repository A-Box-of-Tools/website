<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> Cole os dois textos</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">O original</label>
          <span class="count" id="input-count">vazio</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Cole o original aqui - ou solte os dois arquivos acima."></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">A versão alterada</label>
          <span class="count" id="input-b-count">vazio</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Cole a versão com que comparar."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Testar um exemplo</button>
        <button type="button" id="swap" class="ghost">Trocar os lados</button>
        <button type="button" id="clear" class="ghost danger">Limpar</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> Escolha como ler</h2>

    <div class="settings">
      <div class="field">
        <label for="view">Como mostrar</label>
        <select id="view">
          <option value="split" selected>Lado a lado</option>
          <option value="unified">Numa coluna</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          Mostrar só o que mudou, com três linhas de cada lado
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          Ignorar espaços em branco
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          Ignorar maiúsculas e minúsculas
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          Ignorar linhas em branco
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> Leia o que mudou</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Nada ainda.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Copiar</button>
        <a id="download" class="ghost as-button" hidden download>Baixar</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
