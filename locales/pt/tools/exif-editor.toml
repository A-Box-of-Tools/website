[[howto]]
title = "Leia o que tem nelas, se quiser."
body = " A lista de achados nomeia as coisas que vale saber, como a posição de GPS, os horários e os números de série, antes da tabela completa com todas as etiquetas. Para JPEG, PNG e WebP, estes blocos são listados. AVIF mostra só o EXIF extraído disponível; outros metadados AVIF não são inventariados."

[[howto]]
title = "Clique em &ldquo;Remover todos os metadados&rdquo;."
body = "Para JPEG, PNG e WebP: Esse é o trabalho inteiro para a maioria das pessoas. Todas as etiquetas, os blocos XMP e IPTC, os comentários e a miniatura embutida vão embora, em todas as fotos da lista de uma vez. AVIF é decodificado pelo navegador e salvo como um PNG novo sem copiar os metadados originais. Suas tags EXIF disponíveis podem ser vistas aqui, mas não editadas. O PNG pode ficar maior e a conversão pode mudar cores ou HDR. O original permanece intacto."

[[howto]]
title = "Ou edite em vez de remover."
body = "Para JPEG, PNG e WebP: Mude uma data, corrija uma linha de direitos autorais, jogue fora a localização e mantenha os ajustes da câmera. Depois salve aquela foto sozinha."

[[faq]]
q = "Minha foto é enviada para algum lugar?"
a = """
        Não. Quem lê, interpreta e reescreve o arquivo é o seu próprio navegador, no
        seu próprio hardware. Esta ferramenta não tem função de rede de espécie
        alguma: nunca busca nada e nunca manda nada. E a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum dos quais é deste site."""

[[faq]]
q = "O que é EXIF, e o que mais está escondido numa foto?"
a = "Para JPEG, PNG e WebP: EXIF é um bloco de etiquetas que a câmera escreve ao lado da imagem: a marca e o modelo, os ajustes de exposição, a data e a hora com precisão de segundo, muitas vezes uma posição de GPS e às vezes um número de série. As fotos costumam carregar mais coisas além disso: um pacote XMP de XML vindo de um editor, um bloco IPTC com campos de legenda e assinatura, um perfil de cor, uma segunda cópia pequena da imagem como miniatura, e uma maker note com dados não documentados do fabricante. Esta ferramenta lista tudo isso. Para JPEG, PNG e WebP, estes blocos são listados. AVIF mostra só o EXIF extraído disponível; outros metadados AVIF não são inventariados."

[[faq]]
q = "Remover os metadados reduz a qualidade da imagem?"
a = "A limpeza de JPEG, PNG e WebP edita seus contêineres e copia os dados comprimidos da imagem byte por byte sem decodificar ou recomprimir. AVIF decodifica a primeira imagem e grava um PNG novo sem perdas e sem metadados originais. O PNG pode ficar maior e a decodificação do navegador pode mudar cores ou HDR. O original permanece intacto."

[[faq]]
q = "Quais formatos de arquivo ele trata?"
a = "JPEG, PNG e WebP permitem ver, editar e limpar metadados no contêiner. AVIF permite uma prévia do EXIF extraído disponível e limpeza para um PNG novo. Tags AVIF são somente leitura; outros metadados não são inventariados. AVIF animado usa a primeira imagem. HEIC e TIFF puro são reconhecidos, mas não reescritos."

[[faq]]
q = "Minha foto vai aparecer girada depois que os metadados forem removidos?"
a = "Para JPEG, PNG e WebP, manter a orientação grava um pequeno bloco EXIF só com essa tag quando necessário. Desmarque para removê-la. AVIF usa a imagem decodificada na orientação correta pelo navegador e cria um PNG. As opções de orientação e perfil de cor valem só para JPEG, PNG e WebP."

[[faq]]
q = "Ele remove a localização de GPS?"
a = "A limpeza remove os dados GPS. Para JPEG, PNG e WebP, também é possível apagar só a localização e manter o resto. Tags AVIF são somente leitura; a conversão para PNG não copia metadados originais."

[[faq]]
q = "Posso mudar uma etiqueta em vez de apagá-la?"
a = "JPEG, PNG e WebP permitem editar e adicionar tags. Reescrever a nota do fabricante pode invalidar deslocamentos específicos; mantenha o original se isso importar. O EXIF AVIF é somente leitura. A limpeza cria um PNG sem metadados originais em vez de reescrever o contêiner AVIF."

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste. O site exibe
        publicidade, e é ela que paga a conta. Os anúncios não recebem nada sobre as
        suas fotos."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela
        continua funcionando. Esse é também o jeito mais simples de provar que nada
        está sendo enviado: uma ferramenta que mandasse as suas fotos embora para
        serem processadas pararia no instante em que você tirasse da tomada."""

