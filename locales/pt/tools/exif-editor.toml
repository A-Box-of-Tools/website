[[faq]]
q = "Minha foto é enviada para algum lugar?"
a = """
        Não. Quem lê, interpreta e reescreve o arquivo é o seu próprio navegador, no
        seu próprio hardware. Esta ferramenta não tem função de rede de espécie
        alguma: nunca busca nada e nunca manda nada. E a
        <code>Content-Security-Policy</code> da página lista todos os endereços que
        ela pode acessar, nenhum dos quais é deste site."""

[[faq]]
q = "O que é EXIF, e o que mais está escondido numa foto?"
a = """
        EXIF é um bloco de etiquetas que a câmera escreve ao lado da imagem: a marca
        e o modelo, os ajustes de exposição, a data e a hora com precisão de segundo,
        muitas vezes uma posição de GPS e às vezes um número de série. As fotos
        costumam carregar mais coisas além disso: um pacote XMP de XML vindo de um
        editor, um bloco IPTC com campos de legenda e assinatura, um perfil de cor,
        uma segunda cópia pequena da imagem como miniatura, e uma maker note com
        dados não documentados do fabricante. Esta ferramenta lista tudo isso."""

[[faq]]
q = "Remover os metadados reduz a qualidade da imagem?"
a = """
        Não, e esse é o motivo principal para usar uma ferramenta assim em vez de
        salvar a foto de novo. Os metadados ficam no contêiner em volta da imagem
        comprimida, e não dentro dela. Removê-los é apagar itens de uma lista e
        escrever a lista de volta, enquanto os dados de imagem comprimida são
        copiados byte por byte. O resultado decodifica exatamente para os mesmos
        pixels. Nada é decodificado e nada é recomprimido."""

[[faq]]
q = "Quais formatos de arquivo ele trata?"
a = """
        JPEG, PNG e WebP. HEIC e AVIF são reconhecidos, mas não reescritos: são
        formatos de caixas montados a partir de átomos aninhados e precisam de outro
        interpretador, então a ferramenta avisa isso em vez de produzir um arquivo
        quebrado. Um TIFF puro também fica de fora, porque num TIFF os metadados e os
        pixels são endereçados pelos mesmos deslocamentos."""

[[faq]]
q = "Minha foto vai aparecer girada depois que os metadados forem removidos?"
a = """
        Pode acontecer, e existe um ajuste para isso. Os celulares normalmente gravam
        a imagem do jeito que o sensor viu e acrescentam uma etiqueta de Orientação
        dizendo como virar. Remova essa etiqueta e alguns visualizadores mostram a
        foto deitada. A opção de &ldquo;manter a etiqueta de orientação&rdquo;, que
        já vem ligada, escreve de volta um pequeníssimo bloco EXIF contendo só essa
        etiqueta, e só quando a foto realmente precisava. Desligue se você preferir
        que o arquivo não carregue EXIF nenhum."""

[[faq]]
q = "Ele remove a localização de GPS?"
a = """
        Remove. Remover tudo tira o diretório de GPS inteiro, e dá para apagar só a
        localização e manter o resto. A posição aparece primeiro em graus decimais,
        porque &ldquo;51 graus, 30 minutos, 26 segundos&rdquo; não deixa evidente que
        a foto está entregando o prédio em que foi tirada."""

[[faq]]
q = "Posso mudar uma etiqueta em vez de apagá-la?"
a = """
        Pode. Etiquetas de texto, datas, o ISO, a orientação e a resolução podem
        todas ser editadas, e algumas etiquetas comuns podem ser acrescentadas a uma
        foto que não tem nenhuma. Uma ressalva: escrever o arquivo reconstrói o bloco
        EXIF, e uma maker note contém deslocamentos que apontam para dentro do bloco
        original, então uma maker note reconstruída pode deixar de ser legível pelo
        próprio software do fabricante. Se isso importa para você, apague a maker
        note ou deixe o arquivo sem editar."""

[[faq]]
q = "É grátis, e preciso de conta?"
a = """
        É grátis, e não tem conta, nem login, nem período de teste. O site exibe
        publicidade, e é ela que paga a conta. Os anúncios não recebem nada sobre as
        suas fotos."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, depois desligue a internet e ela
        continua funcionando. Esse é também o jeito mais simples de provar que nada
        está sendo enviado: uma ferramenta que mandasse as suas fotos embora para
        serem processadas pararia no instante em que você tirasse da tomada."""

