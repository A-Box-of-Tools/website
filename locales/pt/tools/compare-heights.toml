name = "Comparador de alturas"
heading = "Comparar&nbsp;alturas <span class=\"h1-kw\">&mdash; um gráfico lado a lado para baixar</span>"
tagline = "Digite as alturas, leve a imagem. Nada é enviado para desenhá-la."

title = "Comparar alturas &mdash; grátis, sem cadastro, sem enviar nada"
description = "Compare alturas lado a lado. Acrescente um homem, uma mulher, um menino, uma menina, uma criança pequena e objetos &mdash; uma porta, uma janela, um quadro branco, uma máquina de vendas &mdash; em centímetros ou em pés e polegadas, e baixe o gráfico como PNG ou SVG. Ele é desenhado no seu navegador."
og_title = "Compare alturas lado a lado e fique com a imagem"
og_description = "Ponha dois adultos, uma criança, um bebê e uma porta na mesma régua, em centímetros ou em pés e polegadas, e baixe o resultado. Sem conta, sem marca d'água, e sem nenhuma lista de nomes saindo do seu computador."
og_image_alt = "Comparador de alturas - comparar alturas lado a lado, sem envio"

pledge = """
    Um gráfico de alturas é aritmética e um desenho: não há arquivo nenhum para
    enviar nem serviço nenhum para consultar. O homem, a mulher, o menino e a
    menina são ilustrações de domínio público que vão junto com esta página; a
    criança pequena é construída aqui a partir de uma tabela de proporções do
    corpo, e é por isso que ela tem forma de criança pequena e não de adulto
    encolhido. Cada passo acontece em umas seiscentas linhas de JavaScript desta
    página que você pode ler. Não existe função de rede de espécie alguma, e
    aqui isso importa porque o que você digita é uma lista de pessoas e a altura
    de cada uma."""

live_hint = """
      Você não precisa acreditar na nossa palavra: abra o DevTools, olhe a aba de
      rede e digite um nome e uma altura. Nenhuma requisição carrega um caractere
      de nenhum dos dois. Ou desconecte da internet e faça o gráfico assim
      mesmo."""

read_first = """
, <code>src/traced.js</code> e
      <code>vendor/</code> para as quatro figuras desenhadas e de onde vieram as
      ilustrações delas, <code>src/figures.js</code> para a tabela de proporções
      com que a criança pequena é construída, <code>src/units.js</code> para como
      uma altura digitada vira número e como a régua é rotulada,
      <code>src/chart.js</code> para o arranjo, e <code>src/save.js</code> para
      os dois downloads &mdash; que são o SVG na tela, e esse mesmo SVG pintado
      num canvas."""

howto_heading = "Como fazer um gráfico de comparação de alturas"

card = """
            Ponha dois adultos, uma criança e uma porta na mesma régua &mdash; em
            centímetros ou em pés e polegadas &mdash; e baixe como PNG ou SVG."""

