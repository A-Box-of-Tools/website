[[privacy]]
title = "Uma lista de pessoas não é pouca coisa para entregar."
body = """
 A maioria
      dos gráficos de altura quer uma conta, e os que não querem ainda têm um
      servidor que vê cada nome e cada número que você digita. O que você está
      digitando aqui é quem tem na sua família e a altura de cada um, muitas
      vezes com a idade de uma criança implícita na figura ao lado do nome. Nada
      disso é enviado a lugar nenhum, porque aqui não existe para onde ir."""

[[privacy]]
title = "Nada aqui busca coisa alguma."
body = """
 Não há nenhum
      <code>fetch</code>, nenhum <code>XMLHttpRequest</code> e nenhum
      <code>sendBeacon</code> em lugar algum de <code>src/</code>. A
      Content-Security-Policy lista todos os endereços que esta página pode
      contatar, e nenhum deles é nosso."""

[[privacy]]
title = "Também não fica nada guardado de uma visita para outra."
body = """
 O gráfico
      vive na página e em nenhum outro lugar. Feche a aba e a lista some: não tem
      conta segurando, não tem cookie carregando, e nada é escrito no
      armazenamento deste navegador &mdash; que é também por que um gráfico que
      você quer guardar é um gráfico que você baixa."""

[[privacy]]
title = "O link não carrega o gráfico."
body = """
 Várias ferramentas como esta
      põem a lista inteira na barra de endereços para poder compartilhar, e isso
      transforma cada nome e cada altura em algo registrado por tudo por onde o
      link passa &mdash; um servidor de chat, um scanner de e-mail, o histórico
      de alguém. O endereço desta página nunca muda enquanto você digita."""

[[privacy]]
title = "O PNG é feito a partir do SVG que está na tela."
body = """
 O download não é
      uma segunda renderização que poderia discordar da prévia. A mesma marcação
      é entregue ao navegador e pintada num canvas, que é também por que dá para
      fazer com a rede desligada: não tem fonte para buscar nem imagem para
      carregar dentro."""

[[privacy]]
title = "As ilustrações estão aqui, não são buscadas."
body = """
 As quatro figuras
      desenhadas são de domínio público, e são servidas desta origem junto com o
      resto da página &mdash; sem fonte de ícones, sem CDN, sem folha de sprites
      puxada do servidor de outra pessoa enquanto você digita. É também por isso
      que o gráfico continua sendo desenhado com a rede desligada."""

[[privacy]]
title = "O que o Google carrega, e o que não chega até ele."
body = """
 Os scripts
      de publicidade e de medição vêm do Google, e o botão de doação vem do Buy
      Me a Coffee. Nenhum deles recebe um nome ou uma altura. Toda linha que
      transforma a sua lista numa imagem é servida desta origem e está listada no
      repositório."""

[[privacy]]
title = "Funciona offline."
body = """
 Desligue a rede e a ferramenta continua igual,
      porque nunca houve uma etapa de rede nela. Essa é a prova mais simples de
      todas."""

[[howto]]
title = "Acrescente todo mundo primeiro, depois pense na aparência."
body = """
 Uma
      linha é uma figura, um nome, uma altura e uma cor. O nome é opcional
      &mdash; um gráfico de duas silhuetas sem nome com as alturas em cima
      costuma ser exatamente o que a pessoa quer &mdash; e as setas de cada linha
      movem ela para a esquerda ou para a direita se a ordem importar."""

[[howto]]
title = "Digite a altura do jeito que você escreve."
body = """
 <code>173</code>,
      <code>1,73 m</code>, <code>5'8\"</code>, <code>68 in</code> e
      <code>5 ft 8</code> são todos lidos direito. A linha embaixo da caixa
      mostra o que foi entendido, nos dois sistemas, então uma leitura errada
      aparece antes de ser desenhada e não depois de impressa. Um número sozinho
      é centímetros num gráfico métrico e polegadas num imperial, e um número
      sozinho abaixo de três é metros &mdash; ninguém tem 1,73 cm de altura."""

[[howto]]
title = "Escolha a figura que combina com a pessoa."
body = """
 Uma criança de dois
      anos tem cerca de quatro cabeças e meia de altura e um adulto sete e meia,
      então uma criança pequena desenhada como um adulto encolhido fica errada de
      um jeito difícil de nomear e fácil de ver. Tem um menino e uma menina para
      a idade escolar e uma criança pequena abaixo dela, cada um com as próprias
      proporções em vez de ser o adulto diminuído, e é isso que faz a maior parte
      de um gráfico de família parecer uma família."""

[[howto]]
title = "Ponha algo familiar no gráfico."
body = """
 Um número é abstrato e uma
      porta não. Acrescentar um único objeto de um tamanho que todo mundo conhece
      &mdash; uma porta, uma janela, um quadro de sala de aula, uma máquina de
      vendas &mdash; é o que transforma um gráfico que declara duas alturas num
      que as mostra. O menu tem vinte deles, agrupados, e cada um vira uma linha
      comum onde você pode digitar os seus próprios números. Objetos têm largura
      além de altura, então uma porta é 203 por 81 e não uma faixa."""

[[howto]]
title = "Ponha a régua nas unidades em que quem lê pensa."
body = """
 Trocar entre
      centímetros e pés reescreve o que está nas caixas em vez de reinterpretar,
      então o gráfico em si não se mexe: só a notação muda. Se o gráfico é para
      dois públicos, a altura escrita acima de cada figura fica na unidade do
      gráfico e a linha embaixo de cada caixa traz as duas."""

[[howto]]
title = "O PNG para colar, o SVG para imprimir."
body = """
 O PNG é uma imagem na
      altura em pixels que você definiu, que é o que uma janela de chat, um
      documento ou um slide quer. O SVG é o gráfico como instruções, então ele
      imprime nítido em qualquer tamanho e ainda pode ser recolorido depois por
      qualquer coisa que abra vetores."""

[[faq]]
q = "Alguma coisa que eu digito é enviada para algum lugar?"
a = """
        Não. O gráfico é desenhado por JavaScript desta página, no seu próprio
        computador, e esta ferramenta não tem função de rede de espécie alguma
        &mdash; nunca busca nada e nunca envia nada. A
        <code>Content-Security-Policy</code> da página lista todos os endereços
        que ela pode contatar, e nenhum deles é nosso. Vale dizer isso com todas
        as letras aqui porque a entrada é uma lista de nomes de pessoas e da
        altura de cada uma, que é mais pessoal do que quase tudo que este site
        lida."""

[[faq]]
q = "Dá para baixar o gráfico?"
a = """
        Dá, como PNG ou como SVG, sem marca d'água e sem conta. O PNG é desenhado
        na altura em pixels que você definir e é o que se cola num documento, num
        slide ou num chat. O SVG é o gráfico como instruções em vez de pixels:
        ele imprime nítido em qualquer tamanho e pode ser aberto e recolorido
        depois em qualquer editor vetorial. Os dois são feitos a partir da mesma
        marcação que está na tela, então nenhum deles pode discordar da prévia."""

[[faq]]
q = "Como escrevo a altura &mdash; em centímetros ou em pés?"
a = """
        Do jeito que quiser, em qualquer linha, como você normalmente escreve.
        <code>173</code>, <code>173 cm</code>, <code>1,73 m</code>,
        <code>5'8\"</code>, <code>5 ft 8 in</code> e <code>68 in</code> são todos
        entendidos, e a linha embaixo da caixa mostra o que foi lido nos dois
        sistemas. Um número sozinho é centímetros quando o gráfico é métrico e
        polegadas quando é imperial; um número sozinho abaixo de três é tomado
        como metros, porque 1,73 cm não é uma altura que alguém digite."""

[[faq]]
q = "Por que a criança pequena não parece um adulto pequeno?"
a = """
        Porque uma criança pequena não é isso. As proporções do corpo mudam com a
        idade: uma criança de dois anos tem mais ou menos quatro cabeças e meia,
        uma de oito seis, e um adulto sete e meia &mdash; então a cabeça é quase
        um quarto de uma criança pequena e um oitavo de um adulto. O menino e a
        menina são desenhos de crianças de verdade, e a criança pequena tem a
        própria tabela de proporções em vez de ser uma silhueta reduzida, que é
        por que um gráfico de família parece uma família em vez de quatro adultos
        de tamanhos diferentes."""

[[faq]]
q = "De onde vêm as figuras?"
a = """
        Quatro das cinco são ilustrações de outras pessoas, todas em domínio
        público: o homem por pitr, a mulher por Madeleine Price Ball, a menina por
        OpenClipart-Vectors, e o menino por Ryan Kissinger para a biblioteca NIH
        BioArt. Cada arquivo vai junto com esta página em <code>vendor/</code> do
        jeito que foi publicado, então dá para conferir com os originais. Domínio
        público não pede nada, e é justamente esse o ponto: a ilustração acaba
        dentro de uma imagem que você baixa, e uma licença que exigisse atribuição
        grudaria essa exigência no seu gráfico. Só a criança pequena é desenhada
        pelo código desta própria página &mdash; abaixo da idade escolar não havia
        nada livre disponível."""

[[faq]]
q = "Quantas pessoas cabem num gráfico?"
a = """
        Doze. Não é um limite técnico &mdash; o desenho faria trinta numa boa
        &mdash; mas passando de uma dúzia as colunas ficam mais estreitas que os
        nomes escritos em cima e a imagem para de ser legível. Se precisar de
        mais, desligar os nomes devolve a largura, ou dois gráficos vão dizer
        melhor do que um."""

[[faq]]
q = "Dá para pôr um objeto no gráfico?"
a = """
        Dá &mdash; um retângulo simples recebe uma altura e uma largura, então
        qualquer coisa com duas dimensões entra ao lado das pessoas. O menu tem
        vinte para começar, em quatro grupos: portas e janelas, escola e
        escritório (um quadro, uma mesa, um arquivo, uma tela de projeção),
        coisas da cidade (uma máquina de vendas, uma lixeira com rodas, uma cesta
        de basquete, um contêiner de 20&nbsp;ft) e coisas de casa. Algumas são
        normas de verdade e outras são tamanhos típicos, o que a página fala em
        voz alta; cada uma chega como uma linha comum onde você pode digitar por
        cima. Um objeto familiar faz mais por um gráfico do que qualquer
        quantidade de gente a mais: é ele que transforma uma comparação numa noção
        de escala."""

[[faq]]
q = "Tem uma figura para cachorro ou gato?"
a = """
        Não, e é uma falta de propósito, não um esquecimento. Os dois foram
        construídos &mdash; de perfil, em pé, com a cabeça na altura do ombro,
        para que o topo do desenho fosse a altura escrita ao lado, que é onde todo
        padrão de raça mede um animal. Não ficaram bons o bastante para publicar:
        um quadrúpede visto de lado ao lado de quatro pessoas vistas de frente
        parece um erro mesmo quando o desenho é bom. Um retângulo na altura da
        cernelha do animal é honesto enquanto isso."""

[[faq]]
q = "Dá para compartilhar o gráfico com um link?"
a = """
        Daqui não, e é de propósito. As ferramentas que oferecem isso fazem
        botando a lista inteira no endereço, o que significa que cada nome e cada
        altura acabam em tudo por onde o link viaja &mdash; os logs de um
        servidor de chat, um scanner de e-mail, o histórico de alguém, um serviço
        que busca a prévia do link. Baixe a imagem e mande ela: diz a mesma coisa
        e não leva lista nenhuma junto."""

[[faq]]
q = "É grátis, e posso usar o gráfico comercialmente?"
a = """
        É grátis, não tem conta e não tem marca d'água, e você pode pôr o
        resultado num relatório, numa apresentação, num anúncio ou num produto. O
        site exibe publicidade, e é ela que paga a conta. Nada de um gráfico que
        você faz aqui é nosso, e nada fica guardado."""

[[faq]]
q = "Por que a régua vai de dez em dez e não de um em um?"
a = """
        Porque o espaçamento é escolhido a partir de quantas linhas a imagem
        aguenta, e não de um número fixo. Um gráfico de dois adultos ganha uma
        linha a cada dez centímetros; ponha uma cesta de basquete e as linhas vão
        para vinte e cinco, porque noventa linhas numa imagem viram uma mancha
        cinza em vez de uma régua. Em pés e polegadas a escada é de uma, três,
        seis e doze polegadas, então as linhas caem em polegadas inteiras em vez
        de perto delas."""

[[faq]]
q = "Dá para pôr o gráfico num slide escuro?"
a = """
        Dá. Ponha o fundo na cor em que ele vai ficar e a régua e o texto trocam
        entre escuro e claro para combinar &mdash; calculado pela luminância da
        cor, não chutado. Depois marque &ldquo;sem fundo nenhum&rdquo; se quiser a
        imagem transparente: a cor que você escolheu continua decidindo a tinta,
        então um gráfico transparente indo para um slide azul-marinho sai legível
        em cima dele."""

[[faq]]
q = "Funciona offline?"
a = """
        Funciona. Carregue a página uma vez, desligue a internet e ela continua
        funcionando. Esse é também o jeito mais simples de provar que nada é
        enviado: uma ferramenta que mandasse a sua lista embora para desenhar um
        gráfico pararia no instante em que você desconectasse."""

