#

[hub]
title = "Ferramentas de navegador grátis &mdash; processamento local | abox.tools"
# Abaixo de 155 caracteres, como no inglês: o Google corta a descrição por ali,
# e aqui o final é a parte que vende o site.
description = "Ferramentas grátis processam arquivos no navegador: imagens em PDF ou MP4, compressão para um tamanho alvo, recorte de vídeo e remoção de EXIF."
heading = "Ferramentas grátis. Processamento local."
og_title = "A Box of Tools &mdash; processamento local no navegador"
og_description = "Ferramentas para uma tarefa que processam arquivos no seu dispositivo. Compartilhamento e funções online opcionais são explicados onde aparecem."
og_image_alt = "abox.tools - ferramentas de navegador para processamento local de arquivos"
schema_description = "Utilitários de navegador para processamento local de arquivos, sem envio para processamento nem conta. As funções de rede são explicadas nas próprias páginas."
schema_about = "Utilitários de navegador para processamento local e compartilhamento deliberado entre navegadores"

lede = "Processe arquivos no navegador. Sem envio para processamento nem login."

support_note = """
      Estas ferramentas são grátis e vão continuar assim. Se alguma poupou
      trabalho seu, isto aqui é a única coisa do site que pede alguma coisa a
      você."""

# Três fatos verificáveis em vez de uma promessa, igual ao inglês.
privacy_heading = "Seus arquivos continuam seus."

privacy_lede = "O processamento local funciona sem internet depois que a ferramenta é salva. Buscar e compartilhar conteúdo exige conexão."

support_heading = "Grátis, com seu apoio."

[[hub.guarantees]]
title = "Seus arquivos são processados no seu dispositivo"
body = "Seu navegador abre, lê e edita os arquivos escolhidos. Não há envio para processamento. Compartilhar texto e arquivos e Câmera remota enviam conteúdo deliberadamente a outro navegador; as próprias páginas explicam a conexão."

[[hub.guarantees]]
title = "Seus arquivos não são entregues à análise de visitas"
body = "São contadas as visitas, o primeiro uso concluído de uma ferramenta a cada carregamento da página e as respostas fixas do feedback opcional. Nenhum arquivo, nome, conteúdo ou detalhe do resultado acompanha essas contagens. A importação opcional de imagens e a consulta de câmbio de recibos explicam, junto aos controles, as informações enviadas."

[[hub.guarantees]]
title = "O processamento local funciona offline"
body = "Espere o indicador offline mostrar que está pronto, desconecte e use arquivos do dispositivo. Buscar uma imagem da web, consultar uma taxa online e conectar dois navegadores precisam de rede."

