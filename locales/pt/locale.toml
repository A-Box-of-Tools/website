#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roteiro"
title = "Roteiro &mdash; as próximas ferramentas do abox.tools"
description = "Todas as ferramentas planejadas e prontas de abox.tools, agrupadas e públicas. O processamento acontece no navegador."
heading = "O que vem por aí"
lede = "Todas as ferramentas das duas listas processam arquivos no navegador, sem envio para processamento. Uma função que precisa de rede deve explicá-lo na própria página. A compilação calcula as quantidades a partir das listas."

intro_heading = "Como esta lista foi montada"
intro = """
    <p>
      Não é uma lista de desejos. Ela saiu de uma passada pelo catálogo de
      ferramentas do maior site de GIF e vídeo da internet, que é o mais perto
      que existe de um inventário do que as pessoas realmente querem fazer com
      um arquivo. Ficou tudo o que dá para construir de um jeito que o trabalho
      aconteça no seu próprio computador e continue acontecendo com a rede
      desligada.
    </p>
    <p>
      Quase tudo o que sobrou roda em APIs que o navegador já traz de fábrica.
      Algumas poucas precisam de um codec embutido na única ferramenta que o
      usa, o que é permitido, já que o arquivo continua sem sair do computador.
      O que não passava nessa régua ficou de fora em vez de ser prometido,
      então alguns dos buracos óbvios que você vai ver abaixo são propositais.
    </p>
    <p>
      As ferramentas que já existem ficam no topo do seu grupo, marcadas como
      <em>Pronta</em> e com link para a própria página. Tudo o que está abaixo
      delas ainda está por vir, e nada vira link antes de ficar pronto.
    </p>"""

planned_heading = "Cada tipo de arquivo, e o que dá para fazer com ele"

og_title = "Roteiro do abox.tools"
og_description = "O que está pronto e o que vem a seguir. Processamento local; funções que precisam de rede são explicadas."
og_image_alt = "abox.tools - ferramentas de navegador para processamento local de arquivos"

