#
# Português do Brasil.
#
# The folder is `pt` and the hreflang is `pt-BR`. The two differ on purpose:
# `lang` has to match the folder and is what the URL prefix is built from, and
# `hreflang` is the only place a language-plus-region distinction is expressed.
# If European Portuguese is ever added it becomes its own folder rather than a
# variant of this one.
#
# Brazilian throughout: "vídeo" and "arquivo" rather than "ficheiro", the
# gerund where Portugal would use the infinitive, and "você" rather than "tu".
# The clitic "lhe" is avoided everywhere - Brazilians write round it - and
# "o seu computador" is the machine the files stay on, never "a sua máquina",
# which is a calque.
#

lang = "pt"
name = "Portuguese (Brazil)"
endonym = "Português"
hreflang = "pt-BR"

# Finished: every tool, every guide, the roadmap list and the two legal
# pages. From here a missing key is a build failure rather than a silent
# fallback to English, and the link check runs over the Portuguese slugs -
# see check_complete in buildlib/i18n.py.
complete = true

#
# ---------------------------------------------------------------------------
# The addresses. Keyed by the ENGLISH slug; the Portuguese is an address and
# appears only on the right. No accents and no cedilla here, and only here.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "comprimir-imagem"
"compress-pdf" = "comprimir-pdf"
"crop-video" = "cortar-video"
"edit-audio" = "editar-audio"
# Quase ninguém procura um "editor EXIF"; procura-se como tirar os dados de uma foto.
"exif-editor" = "remover-dados-exif"
# Quem quer isto quase nunca digita "HEIC": digita o que quer no fim, que é um
# JPG que todo mundo abre. O nome do formato fica, porque é ele que está no
# arquivo que a pessoa acabou de tirar do iPhone.
"heic-to-jpg" = "heic-para-jpg"
# "Data URI" é jargão; "base64" é o que se digita na busca e o que aparece na
# linha do CSS que a pessoa quer colar.
"image-to-data-uri" = "imagem-para-base64"
# Pelo trabalho, não pelo formato: ninguém procura "imagem para ICO", e muita
# gente procura como fazer um favicon.
"image-to-ico" = "criar-favicon"
"images-to-pdf" = "imagens-para-pdf"
"images-to-video" = "imagens-para-video"
# No Brasil se fala "gerar um QR Code", não "criar" nem "fazer". O código de
# barras fica de fora do endereço: é a metade menos procurada das duas.
"qr-barcode" = "gerar-qr-code"
"resize-image" = "redimensionar-imagem"
"svg-to-image" = "svg-para-png"
"trim-video" = "aparar-video"
"video-to-gif" = "video-para-gif"

"guides" = "guias"
"roadmap" = "roteiro"
"privacy" = "privacidade"
"terms" = "termos"

"guides/compress-an-image-to-a-target-size" = "guias/comprimir-uma-imagem-para-um-tamanho-exato"
"guides/resize-an-image" = "guias/redimensionar-uma-imagem"
"guides/remove-exif-and-gps-data" = "guias/remover-dados-exif-e-gps"
"guides/make-a-pdf-smaller" = "guias/deixar-um-pdf-menor"
"guides/combine-images-into-a-pdf" = "guias/juntar-imagens-em-um-pdf"
"guides/turn-images-into-a-video" = "guias/transformar-imagens-em-video"
"guides/trim-a-video" = "guias/aparar-um-video"
"guides/crop-a-video" = "guias/cortar-um-video"
"guides/is-it-safe-to-upload-files" = "guias/e-seguro-enviar-arquivos"
"guides/make-a-favicon" = "guias/criar-um-favicon"
"guides/convert-an-svg-to-png" = "guias/converter-svg-para-png"
"guides/convert-heic-to-jpg" = "guias/converter-heic-para-jpg"
"guides/embed-an-image-in-css" = "guias/colocar-uma-imagem-no-css"
"guides/make-a-qr-code" = "guias/gerar-um-qr-code"
"guides/turn-a-video-into-a-gif" = "guias/transformar-um-video-em-gif"

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Ferramentas grátis no navegador &mdash; sem enviar arquivo, sem cadastro | abox.tools"
# Abaixo de 155 caracteres, como no inglês: o Google corta a descrição por ali,
# e aqui o final é a parte que vende o site.
description = "Ferramentas grátis que nunca enviam seus arquivos. Junte imagens num PDF ou MP4, comprima uma imagem até o tamanho exato, corte um vídeo, remova o EXIF."
heading = "Ferramentas que não passam por servidor nenhum"
og_title = "A Box of Tools &mdash; ferramentas que não passam por servidor nenhum"
og_description = "Ferramentas pequenas, cada uma com uma função só, que rodam inteiras dentro do seu navegador. Seus arquivos não saem do seu computador."
og_image_alt = "abox.tools - ferramentas que não passam por servidor nenhum"
schema_description = "Utilitários pequenos, cada um com uma função só, que fazem todo o trabalho dentro do navegador. Não se envia nada e não é preciso ter conta."
schema_about = "Utilitários de arquivo que rodam no navegador e processam tudo localmente, sem enviar nada"

lede = """
    Ferramentas pequenas, cada uma com uma função só, que fazem todo o trabalho
    dentro do seu navegador. Seus arquivos ficam no seu computador. Não há nada
    para enviar, nenhuma conta para criar e nada rastreando você."""

support_note = """
      Estas ferramentas são grátis e vão continuar assim. Se alguma poupou
      trabalho seu, isto aqui é a única coisa do site que pede alguma coisa a
      você."""

# Três fatos verificáveis em vez de uma promessa, igual ao inglês.
[[hub.guarantees]]
title = "Seus arquivos nunca saem do seu computador"
body = """
        Quem abre, lê e processa é o seu próprio navegador, usando o seu próprio
        hardware. A <code>Content-Security-Policy</code> de cada ferramenta lista
        todos os endereços que ela pode acessar, e nenhum deles é nosso."""

[[hub.guarantees]]
title = "Nada sobre seus arquivos sai daqui"
body = """
        Nem o arquivo, nem uma miniatura, nem o nome, o tamanho ou quantos você
        escolheu. Nenhuma ferramenta daqui transmite nada disso. E não existe
        servidor nenhum do outro lado dessas ferramentas para receber."""

[[hub.guarantees]]
title = "Funciona offline"
body = """
        Abra uma ferramenta uma vez, desligue a internet e ela continua
        trabalhando nos seus arquivos exatamente como antes. Isso é difícil de
        fingir, porque uma ferramenta que mandasse seus arquivos para processar
        em outro lugar simplesmente pararia."""

[[hub.categories]]
id = "images-and-video"
name = "Imagens e vídeo"
note = "Mexa nas suas fotos e gravações sem entregar nenhuma delas a ninguém."

[[hub.categories]]
id = "gif-and-animation"
name = "GIF e animação"
note = "Monte uma animação, ou desmonte uma, sem que ela saia do seu computador."

[[hub.categories]]
id = "audio"
name = "Áudio"
note = "Mexa numa gravação sem entregá-la a ninguém, inclusive no áudio que está dentro de um vídeo."

[[hub.categories]]
id = "documents-and-pdf"
name = "Documentos e PDF"
note = "Crie e reorganize documentos sem mandar nada para ser processado fora."

[[hub.categories]]
id = "codes-and-data"
name = "Códigos e dados"
note = "Transforme o que você digitou em algo que uma máquina consegue ler, sem que nada saia da página."

[[hub.categories]]
id = "text-and-code"
name = "Texto e código"
note = "Leia, compare, codifique, sem precisar colar um token ou um arquivo de configuração no servidor dos outros."

