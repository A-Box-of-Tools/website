# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Ferramentas gratuitas no navegador &mdash; sem envio, sem conta | abox.tools"
# Abaixo de 155 caracteres, como no inglês: o Google corta a descrição por ali,
# e aqui o final é a parte que vende o site.
description = "Ferramentas gratuitas que nunca enviam seus arquivos. Junte imagens em PDF ou MP4, comprima uma imagem para um tamanho exato, corte um vídeo ou remova o EXIF."
heading = "Ferramentas que não encostam em servidor nenhum"
og_title = "A Box of Tools &mdash; ferramentas que não encostam em servidor nenhum"
og_description = "Ferramentas pequenas, cada uma para uma tarefa só, que funcionam inteiramente no seu navegador. Seus arquivos não saem do seu aparelho."
og_image_alt = "abox.tools - ferramentas que não encostam em servidor nenhum"
schema_description = "Ferramentas pequenas, cada uma para uma tarefa só, que fazem todo o trabalho dentro do navegador. Nada é enviado e não é preciso ter conta."
schema_about = "Utilitários de arquivo que rodam no navegador e processam os arquivos localmente, sem enviá-los"

lede = """
    Ferramentas pequenas, cada uma para uma tarefa só, que fazem todo o
    trabalho dentro do seu navegador. Seus arquivos ficam no seu aparelho: não
    há nada para enviar, nenhuma conta para criar e nada que rastreie você."""

support_note = """
      Estas ferramentas são gratuitas e vão continuar sendo. Se alguma poupou
      um trabalho seu, isto aqui é a única coisa do site que pede algo a
      você."""

# Três fatos verificáveis em vez de uma promessa, igual ao inglês.
[[hub.guarantees]]
title = "Seus arquivos nunca saem do seu aparelho"
body = """
        Eles são abertos, lidos e processados pelo seu próprio navegador, no seu
        próprio hardware. A <code>Content-Security-Policy</code> de cada
        ferramenta nomeia todos os endereços que ela pode contatar, e nenhum
        deles é nosso."""

[[hub.guarantees]]
title = "Nada sobre seus arquivos é transmitido"
body = """
        Nem o arquivo, nem uma miniatura, nem o nome, o tamanho ou quantos você
        escolheu. Nenhuma ferramenta daqui informa nada disso. Do outro lado não
        existe servidor nenhum que pudesse ler."""

[[hub.guarantees]]
title = "Funciona offline"
body = """
        Abra uma ferramenta uma vez, desconecte da internet, e ela continua
        trabalhando nos seus arquivos exatamente como antes. Isso é difícil de
        fingir: uma ferramenta que mandasse seus arquivos para outro lugar para
        processá-los simplesmente pararia."""

[[hub.categories]]
id = "images-and-video"
name = "Imagens e vídeo"
note = "Trabalhe suas fotos e gravações sem entregá-las a ninguém."

[[hub.categories]]
id = "gif-and-animation"
name = "GIF e animação"
note = "Monte uma animação, ou desmonte uma, sem que ela saia do seu computador."

[[hub.categories]]
id = "audio"
name = "Áudio"
note = "Trabalhe uma gravação sem entregá-la a ninguém, inclusive o som de dentro de um vídeo."

[[hub.categories]]
id = "documents-and-pdf"
name = "Documentos e PDF"
note = "Crie e reorganize documentos sem mandá-los para serem processados fora."

[[hub.categories]]
id = "codes-and-data"
name = "Códigos e dados"
note = "Transforme o que você digitou em algo que uma máquina consegue ler, sem que isso saia da página."

[[hub.categories]]
id = "text-and-code"
name = "Texto e código"
note = "Leia, compare, codifique - sem colar um token ou um arquivo de configuração no servidor de outra pessoa."

