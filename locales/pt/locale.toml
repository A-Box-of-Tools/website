#
# Português do Brasil.
#
# The folder is `pt` and the hreflang is `pt-BR`. The two differ on purpose:
# `lang` has to match the folder and is what the URL prefix is built from, and
# `hreflang` is the only place a language-plus-region distinction is expressed.
# If European Portuguese is ever added it becomes its own folder rather than a
# variant of this one.
#
# Brazilian throughout: "vídeo" and "arquivo" rather than "ficheiro", the
# gerund where Portugal would use the infinitive, and "você" rather than "tu".
# The clitic "lhe" is avoided everywhere - Brazilians write round it - and
# "o seu computador" is the machine the files stay on, never "a sua máquina",
# which is a calque.
#

lang = "pt"
name = "Portuguese (Brazil)"
endonym = "Português"
hreflang = "pt-BR"

# Finished: every tool, every guide, the roadmap list and the two legal
# pages. From here a missing key is a build failure rather than a silent
# fallback to English, and the link check runs over the Portuguese slugs -
# see check_complete in buildlib/i18n.py.
complete = true

#
# ---------------------------------------------------------------------------
# The addresses. Keyed by the ENGLISH slug; the Portuguese is an address and
# appears only on the right. No accents and no cedilla here, and only here.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "comprimir-imagem"
"compress-pdf" = "comprimir-pdf"
"crop-video" = "cortar-video"
"edit-audio" = "editar-audio"
# Quase ninguém procura um "editor EXIF"; procura-se como tirar os dados de uma foto.
"exif-editor" = "remover-dados-exif"
# "Tarjar" e "tarja preta" e o que se escreve e se procura no Brasil.
"redact-image" = "tarjar-imagem"
# Quem quer isto quase nunca digita "HEIC": digita o que quer no fim, que é um
# JPG que todo mundo abre. O nome do formato fica, porque é ele que está no
# arquivo que a pessoa acabou de tirar do iPhone.
"heic-to-jpg" = "heic-para-jpg"
# "Data URI" é jargão; "base64" é o que se digita na busca e o que aparece na
# linha do CSS que a pessoa quer colar.
"image-to-data-uri" = "imagem-para-base64"
# Pelo trabalho, não pelo formato: ninguém procura "imagem para ICO", e muita
# gente procura como fazer um favicon.
"image-to-ico" = "criar-favicon"
"images-to-pdf" = "imagens-para-pdf"
"images-to-video" = "imagens-para-video"
# No Brasil se fala "gerar um QR Code", não "criar" nem "fazer". O código de
# barras fica de fora do endereço: é a metade menos procurada das duas.
"qr-barcode" = "gerar-qr-code"
# "Ler" e não "escanear": as duas se falam, mas é "ler QR Code" que se digita.
"qr-barcode-reader" = "ler-qr-code"
"resize-image" = "redimensionar-imagem"
"svg-to-image" = "svg-para-png"
"trim-video" = "aparar-video"
"video-to-gif" = "video-para-gif"
"gif-analyzer" = "analisar-gif"
"gif-maker" = "criar-gif"
"grab-frame" = "extrair-quadro-de-video"
"id-photo" = "foto-3x4"
"merge-pdf" = "juntar-pdf"
"reverse-video" = "inverter-video"
"split-gif" = "separar-gif-em-quadros"
"format-json" = "formatar-json"
"encode-text" = "codificar-base64"
"compare-text" = "comparar-textos"
"trim-audio" = "cortar-audio"
# Senha, não "palavra-passe", que é de Portugal. E no singular: quem procura
# quer uma.
"password-generator" = "gerador-de-senha"
# O estrangeirismo, porque e' o que se digita: "camera rapida" quase ninguem
# procura, e "timelapse" aparece ate' em legenda de celular.
"timelapse-video" = "fazer-timelapse"
"hash-checksum" = "verificar-checksum"
"share-text" = "compartilhar-texto"
# DICOM continua DICOM: e a sigla que vem escrita no disco que o hospital
