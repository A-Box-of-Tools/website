#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Ferramentas grátis no navegador &mdash; sem enviar arquivo, sem cadastro | abox.tools"
# Abaixo de 155 caracteres, como no inglês: o Google corta a descrição por ali,
# e aqui o final é a parte que vende o site.
description = "Ferramentas grátis que nunca enviam seus arquivos. Junte imagens num PDF ou MP4, comprima uma imagem até o tamanho exato, corte um vídeo, remova o EXIF."
heading = "Ferramentas que não passam por servidor nenhum"
og_title = "A Box of Tools &mdash; ferramentas que não passam por servidor nenhum"
og_description = "Ferramentas pequenas, cada uma com uma função só, que rodam inteiras dentro do seu navegador. Seus arquivos não saem do seu computador."
og_image_alt = "abox.tools - ferramentas que não passam por servidor nenhum"
schema_description = "Utilitários pequenos, cada um com uma função só, que fazem todo o trabalho dentro do navegador. Não se envia nada e não é preciso ter conta."
schema_about = "Utilitários de arquivo que rodam no navegador e processam tudo localmente, sem enviar nada"

lede = """
    Ferramentas pequenas, cada uma com uma função só, que fazem todo o trabalho
    dentro do seu navegador. Seus arquivos ficam no seu computador. Não há nada
    para enviar, nenhuma conta para criar e nada rastreando você."""

support_note = """
      Estas ferramentas são grátis e vão continuar assim. Se alguma poupou
      trabalho seu, isto aqui é a única coisa do site que pede alguma coisa a
      você."""

# Três fatos verificáveis em vez de uma promessa, igual ao inglês.
[[hub.guarantees]]
title = "Seus arquivos nunca saem do seu computador"
body = """
        Quem abre, lê e processa é o seu próprio navegador, usando o seu próprio
        hardware. A <code>Content-Security-Policy</code> de cada ferramenta lista
        todos os endereços que ela pode acessar, e nenhum deles é nosso."""

[[hub.guarantees]]
title = "Nada sobre seus arquivos sai daqui"
body = """
        Nem o arquivo, nem uma miniatura, nem o nome, o tamanho ou quantos você
        escolheu. Nenhuma ferramenta daqui transmite nada disso. E não existe
        servidor nenhum do outro lado dessas ferramentas para receber."""

[[hub.guarantees]]
title = "Funciona offline"
body = """
        Abra uma ferramenta uma vez, desligue a internet e ela continua
        trabalhando nos seus arquivos exatamente como antes. Isso é difícil de
        fingir, porque uma ferramenta que mandasse seus arquivos para processar
        em outro lugar simplesmente pararia."""

[[hub.categories]]
id = "images"
name = "Imagens"
note = "Reduza, mude o tamanho ou tire o que a foto conta de você sem avisar. Nada disso é mandado para lugar nenhum."

[[hub.categories]]
id = "video-and-animation"
name = "Vídeo e animação"
note = "Corte, converta ou monte a partir de fotos, sem que a gravação saia do seu computador."

[[hub.categories]]
id = "documents-and-audio"
name = "Documentos e áudio"
note = "Reorganize um documento ou corte uma gravação, sem mandar nenhum dos dois para ser processado fora."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Texto, códigos e senhas"
note = "Leia, confira ou crie aqui. Nenhum token, nenhum arquivo de configuração e nenhuma senha vai parar no servidor dos outros."

