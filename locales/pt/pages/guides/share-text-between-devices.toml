heading = "Como compartilhar texto e arquivos sem guardar cópia no servidor"
lede = "Mova uma nota ou um arquivo sem deixar cópia no e-mail, no histórico de conversa ou em um servidor de compartilhamento. Por padrão, os navegadores se conectam diretamente. Se não conseguirem, o anfitrião pode iniciar um novo compartilhamento com retransmissão na nuvem: a Cloudflare encaminha o conteúdo criptografado. Os destinatários ainda podem guardar suas próprias cópias."

