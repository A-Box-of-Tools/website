heading = "Como receber voz ao vivo de pessoas próximas"
lede = "Um anfitrião escuta enquanto várias pessoas falam pelos navegadores. O anfitrião dá nome ao receptor e escolhe Direct ou Cloud relay antes de começar; quem chama não precisa de nome de exibição. A descoberta próxima ajuda a encontrá-lo, uma senha opcional controla a admissão e o anfitrião escolhe quais vozes ouvir. Cloud relay encaminha voz criptografada pela Cloudflare depois que os participantes confirmam essa escolha."
