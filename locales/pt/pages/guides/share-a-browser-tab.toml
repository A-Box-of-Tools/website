title = "Como compartilhar uma aba do navegador ao vivo sem extensão"
description = "Mostre uma aba do navegador a um espectador aprovado. Escolha Direct em uma rede local acessível ou o retransmissor criptografado opcional Cloud relay. Sem extensão nem controle remoto."
heading = "Como compartilhar uma aba do navegador ao vivo sem extensão"
lede = "Mostre a alguém o site que você está usando enquanto mantém o controle. O navegador captura uma aba escolhida e envia sua imagem em movimento ao espectador. Direct usa uma rede local acessível; Cloud relay é uma opção explícita que encaminha vídeo criptografado pela Cloudflare. Convide por link ou descoberta próxima e aprove o espectador antes de enviar vídeo."
updated = "15 de outubro de 2026"
og_title = "Uma aba ao vivo, com você no controle"
og_description = "Vídeo de aba ao vivo com aprovação e sem controle remoto. Use Direct em uma rede local acessível ou escolha Cloud relay criptografado."
