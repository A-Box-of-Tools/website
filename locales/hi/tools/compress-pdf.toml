        साइट पर विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपके
        दस्तावेज़ के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
