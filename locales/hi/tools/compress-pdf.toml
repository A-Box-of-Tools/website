        कुछ अपलोड नहीं हो रहा, यह साबित करने का सबसे आसान तरीका भी यही है।
        जो टूल आपका दस्तावेज़ कंप्रेस करने के लिए कहीं भेजता, वह प्लग निकालते
        ही रुक जाता।"""

