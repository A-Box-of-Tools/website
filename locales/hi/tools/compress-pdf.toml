[[privacy]]
title = "आपके दस्तावेज़ के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यह टूल उस सूची में कुछ भी नहीं
      जोड़ता: इसकी अपनी कोई नेटवर्क सुविधा है ही नहीं, वैकल्पिक तक नहीं। यहाँ
      कोई ऐसा एंडपॉइंट है ही नहीं जहाँ आपकी फ़ाइल जमा की जा सके, और कोड में
      ऐसा कुछ भी नहीं जो उसे भेजता, अगर होता भी।"""

[[privacy]]
title = "पूरा फ़ॉर्मैट इसी रिपॉज़िटरी में है।"
body = """
 PDF दरअसल ऑब्जेक्ट की
      एक सूची है और एक तालिका, जो बताती है कि हर ऑब्जेक्ट कहाँ से शुरू होता
      है। <code>src/objects.js</code> उस वाक्य-रचना को पढ़ता है,
      <code>src/reader.js</code> तालिका के पीछे चलता है,
      <code>src/writer.js</code> नई तालिका लिखता है, और तीनों में से कोई भी
      ऐसा कुछ आयात नहीं करता जो कोई रिक्वेस्ट कर सके। कोई लाइब्रेरी बाहर से
      नहीं लाई जाती और किसी सर्वर पर कुछ भी रेंडर नहीं होता।"""

[[privacy]]
title = "एन्क्रिप्टेड फ़ाइलें खोली नहीं, लौटा दी जाती हैं।"
body = """

      पासवर्ड लगी PDF मना कर दी जाती है &mdash; वह भी जिसे स्कैनर ख़ाली
      पासवर्ड के साथ बनाते हैं और जो तकनीकी रूप से खुल जाती। किसी दस्तावेज़ की
      सुरक्षा उतारना, उसे छोटा करने से अलग काम है, और किसी टूल का आपकी तरफ़ से
      चुपचाप यह कर देना चौंकाने वाली बात होती।"""

[[privacy]]
title = "यह चीज़ें भरता नहीं, निकालता है।"
body = """
 तैयार फ़ाइल में न बनने की तारीख़ होती
      है, न प्रोड्यूसर की पंक्ति, न उसे बनाने वाले टूल का नाम। डिब्बे पर
      निशान लगा हो तो वह XMP पैकेट और लेआउट सॉफ़्टवेयर के छोड़े निजी ब्लॉक भी
      गँवा देती है &mdash; वही दलील जो EXIF वाला टूल देता है, बस दूसरे कंटेनर
      पर लागू।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके दस्तावेज़ के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न पन्ना, न नाम, न साइज़, न
      पन्नों की गिनती। कोई PDF पढ़ने, डिकोड करने या लिखने वाली हर पंक्ति इसी
      ऑरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की ख़बर नहीं करता, और उसे आपके या आपके दस्तावेज़ के बारे में कुछ
      नहीं दिया जाता। जब तक आप क्लिक न करें, कुछ भी नहीं होता, और क्लिक करने
      पर आप किसी और की साइट पर पहुँचते हैं।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और इस पेज की हर
      चीज़ काम करती रहेगी। सबसे आसान सबूत यही है: जो टूल आपका दस्तावेज़ दबाने
      के लिए कहीं भेजता, वह रुक जाता।"""

[[howto]]
title = "कोई PDF चुनिए।"
body = """
 उसे पिकर पर छोड़ दीजिए या हाथ से चुन
      लीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है; इस दौरान कुछ भी कहीं
      नहीं भेजा जाता।"""

[[howto]]
title = "देखिए कि साइज़ बैठा कहाँ है।"
body = """
 दूसरे क़दम का पूरा मक़सद यही
      ब्योरा है। अगर पट्टी में ज़्यादातर तस्वीरें हैं, तो इस टूल के पास काम
      करने को कुछ है। अगर उसमें ज़्यादातर फ़ॉन्ट और पन्ने की सामग्री है, तो
      यह कह देगा, और ईमानदार बचत कुछ प्रतिशत ही होगी &mdash; इस पर एक मिनट
      ख़र्च करने से पहले यह जान लेना बेहतर है।"""

[[howto]]
title = "बताइए कि कितनी कसकर निचोड़ना है।"
body = """
 नाम वाली सेटिंग अस्पष्ट
      श्रेणियाँ नहीं, रिज़ॉल्यूशन हैं: स्क्रीन पर पढ़ने के लिए 96 DPI, ईमेल
      के लिए 130, और ऐसी चीज़ के लिए 220 जिसे अब भी छपना है। हर सेटिंग इस
      हिसाब से नापी जाती है कि तस्वीर पन्ने पर असल में कितनी बड़ी बनाई गई है,
      इसलिए थंबनेल की तरह रखी फ़ोटो को पूरे पन्ने के स्कैन जैसा नहीं समझा
      जाता।"""

[[howto]]
title = "इसे दबाइए, और वह पंक्ति देखिए जो कहती है कि जाँच हो चुकी है।"
body = """

      दोबारा लिखने का काम पूरा होते ही तैयार फ़ाइल को इसी पेज का वही रीडर
      दोबारा खोलता है और उसके पन्ने गिनता है। अगर गिनती असली फ़ाइल से न मिले,
      तो पूरा काम नाकाम बताया जाता है और डाउनलोड दिया ही नहीं जाता।"""

[[faq]]
q = "क्या मेरी PDF कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता,
        दोबारा दबाता और लिखता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं,
        और पेज की <code>Content-Security-Policy</code> उन सारे पतों के नाम
        गिना देती है जिनसे यह संपर्क कर सकता है &mdash; उनमें से एक भी इस साइट
        का नहीं है। इस टूल में कोई वैकल्पिक नेटवर्क सुविधा तक नहीं है।"""

[[faq]]
q = "मेरी PDF कितनी छोटी होगी?"
a = """
        यह पूरी तरह इस बात पर निर्भर करता है कि उसमें है क्या, और इसीलिए टूल
        कुछ भी दबाने से पहले नापता है और आपको दिखाता है। स्कैन किया दस्तावेज़
        लगभग पूरा तस्वीरें ही होता है और आम तौर पर 60&ndash;90% छोटा निकलता
        है। कोई अनुबंध या शोध-प्रबंध टेक्स्ट, वेक्टर ड्रॉइंग और भीतर रखे
        फ़ॉन्ट होता है, और ये सब उसी सॉफ़्टवेयर के हाथों पहले ही दब चुके होते
        हैं जिसने उसे बनाया; वहाँ बचत आम तौर पर कुछ प्रतिशत ही होती है, फ़ाइल
        को दोबारा पैक करने और जिसका अब कोई हवाला नहीं बचा उसे गिरा देने से।
        जो टूल आपकी फ़ाइल देखे बिना तयशुदा प्रतिशत का वादा करे, वह अंदाज़ा
        लगा रहा है।"""

[[faq]]
q = "क्या PDF दबाने से क्वालिटी घटती है?"
a = """
        उसके भीतर की तस्वीरें दोबारा एनकोड होती हैं, इसलिए उनकी हाँ। बाक़ी कुछ
        नहीं छुआ जाता: टेक्स्ट टेक्स्ट ही रहता है, चुनने और खोजने लायक़,
        फ़ॉन्ट पूरे के पूरे बचे रहते हैं, और वेक्टर ड्रॉइंग ठीक वैसी की वैसी
        उतार दी जाती है। टूल यह भी मना कर देता है कि किसी तस्वीर को बेवजह
        बिगाड़े &mdash; अगर दोबारा एनकोड करने पर वह असली से छोटी न निकले, तो
        असली बाइट ही बिना छुए दस्तावेज़ में वापस चले जाते हैं।"""

[[faq]]
q = "यहाँ DPI क्या है, और यह पूछता क्यों है?"
a = """
        PDF यह दर्ज रखती है कि हर तस्वीर पन्ने पर कितनी बड़ी बनाई गई है,
        इसलिए टूल उसका असरदार रिज़ॉल्यूशन निकाल सकता है: 4000 पिक्सल का स्कैन
        अगर काग़ज़ पर आठ इंच में फैला है, तो वह प्रति इंच 500 पिक्सल ढो रहा
        है। स्क्रीन पर उसका कोई इस्तेमाल नहीं और काग़ज़ पर बहुत थोड़ा,
        इसलिए आपकी चुनी सेटिंग से ऊपर के पिक्सल सबसे पहले फेंके जाते हैं
        &mdash; वे ऐसी क्वालिटी की क़ीमत लेते हैं जो किसी को दिखती ही नहीं।
        इसी माप की वजह से छोटा रखा लोगो और पूरे पन्ने का स्कैन एक जैसे नहीं
        समझे जाते।"""

[[faq]]
q = "क्या यह पासवर्ड से सुरक्षित PDF खोल सकता है?"
a = """
        नहीं, और यह जान-बूझकर है। एन्क्रिप्टेड दस्तावेज़ एक संदेश के साथ मना
        कर दिया जाता है, तब भी जब पासवर्ड ख़ाली हो &mdash; और बहुत सारे स्कैनर
        तथा कॉपियर ऐसे ही सहेजते हैं। किसी फ़ाइल से सुरक्षा उतारना, उसे दबाने
        से अलग काम है, और जो टूल यह चुपचाप कर दे वह वही कर रहा होगा जो आपने
        माँगा ही नहीं था।"""

[[faq]]
q = "क्या ऐसी PDF भी हैं जिन्हें यह नहीं दबा सकता?"
a = """
        उनके भीतर की कुछ तस्वीरें, हाँ। JPEG 2000, JBIG2 और फ़ैक्स-कोडेड
        (CCITT) तस्वीरों का किसी भी ब्राउज़र में कोई डिकोडर नहीं है, इसलिए वे
        बिना छुए आगे भेज दी जाती हैं और नतीजे में ऐसा बता भी दिया जाता है
        &mdash; बाद के दोनों दो-स्तरीय कोडेक हैं और वैसे भी अपने सबसे छोटे
        रूप के आसपास ही होते हैं। CMYK तस्वीरें भी छोड़ दी जाती हैं, क्योंकि
        उन्हें दोबारा एनकोड करने में वे रंग खिसकने का ख़तरा है जो प्रिंटर
        छापेगा। टूल जो कुछ छोड़ता है, वह नतीजों में नाम और वजह समेत लिखा
        होता है।"""

[[faq]]
q = "क्या दबाई हुई फ़ाइल हर जगह खुलेगी?"
a = """
        हाँ। नतीजा PDF 1.5 में लिखा जाता है, जिसे 2003 के बाद आया हर रीडर
        समझता है, और टूल यह बात आपके अपने डिवाइस पर साबित भी करता है: वह तैयार
        फ़ाइल दोबारा खोलता है और आपको देने से पहले उसके पन्ने गिनता है।
        फ़ॉर्म, लिंक, बुकमार्क, सुलभता का ढाँचा और भीतर रखे कोई भी अटैचमेंट
        साथ चले आते हैं; पीछे वही छूटता है जिसका दस्तावेज़ में अब कोई हवाला
        नहीं बचा था।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, और फ़ाइल
        साइज़ की भी कोई सीमा नहीं, सिवाय उसके जो आपकी अपनी मशीन की मेमोरी तय
        करे। साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को
        आपके दस्तावेज़ के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपका दस्तावेज़ दबाने के लिए कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

