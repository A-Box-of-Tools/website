[[privacy]]
title = "आपके दस्तावेज़ों के पास बाहर जाने का रास्ता ही नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज बात कर सकता है, और उनमें से एक भी इस
      साइट का नहीं है। यह टूल उस सूची में कुछ जोड़ता भी नहीं, क्योंकि इसकी अपनी कोई
      नेटवर्क सुविधा है ही नहीं, वैकल्पिक तक नहीं। यहाँ ऐसा कोई ठिकाना नहीं जहाँ
      आपकी फ़ाइलें इकट्ठी हो सकें, और होता भी तो कोड में ऐसा कुछ नहीं है जो उन्हें
      वहाँ भेजे।"""

[[privacy]]
title = "जोड़ना वही काम है जिसे अपलोड न करना सबसे ज़्यादा मायने रखता है।"
body = """
 लोग जो दस्तावेज़
      एक साथ रखते हैं, वही तो कहीं और से आए होते हैं: एक अनुबंध और उसका हस्ताक्षर
      वाला पन्ना, पासपोर्ट का स्कैन और बैंक स्टेटमेंट, डॉक्टर की चिट्ठी और दावे का
      फ़ॉर्म। किसी ऑनलाइन मर्जर के पास तब वे सब होते हैं, एक ही जगह, पहले से क्रम
      में लगे हुए। इसके पास आपके ब्राउज़र में एक पेज है और दूसरा आधा हिस्सा है ही
      नहीं।"""

[[privacy]]
title = "पूरा फ़ॉर्मैट इसी रिपॉज़िटरी में है।"
body = """
 PDF ऑब्जेक्ट की एक सूची है और
      एक तालिका कि हर ऑब्जेक्ट कहाँ से शुरू होता है। <code>src/objects.js</code>
      वह वाक्य-रचना पढ़ता है, <code>src/reader.js</code> तालिका के पीछे चलता है,
      <code>src/assemble.js</code> दस्तावेज़ों के बीच पेज नक़ल करता है, और
      <code>src/writer.js</code> नतीजा लिखता है। इन चारों में से कोई भी ऐसी चीज़
      नहीं मँगाता जो कोई रिक्वेस्ट कर सके। न कोई लाइब्रेरी लाई जाती है, न कुछ
      सर्वर पर रेंडर होता है।"""

[[privacy]]
title = "एन्क्रिप्टेड फ़ाइलें खोली नहीं, लौटा दी जाती हैं।"
body = """

      पासवर्ड वाली PDF मना कर दी जाती है, वह किस्म भी जो स्कैनर खाली पासवर्ड के साथ
      बनाते हैं और जो तकनीकी रूप से खुल जाती। किसी दस्तावेज़ की सुरक्षा हटाना उसके
      पेज इधर-उधर करने से अलग काम है, और उसे चुपचाप कर देना किसी टूल की तरफ़ से
      चौंकाने वाली बात होती।"""

[[privacy]]
title = "तैयार फ़ाइल यह नहीं बताती कि वह कहाँ बनी।"
body = """

      न कोई प्रोड्यूसर लाइन, न बनने की तारीख़, न टूल का नाम। वह उस XMP पैकेट या उन
      निजी ब्लॉकों को भी साथ नहीं ले जाती जो कोई लेआउट सॉफ़्टवेयर छोड़ जाता है। वे
      उस दस्तावेज़ के हैं जो पहले हुआ करता था, उसके नहीं जो आपने अभी बनाया है।
      पेजों के भीतर जो कुछ है, वह हूबहू नक़ल होता है: यह टूल पेज हटाता-लगाता है, उन
      पर लिखा हुआ दोबारा नहीं लिखता।"""

[[privacy]]
title = "जो क्रिया &ldquo;इस पेज पर जाओ&rdquo; नहीं है, वह नक़ल नहीं होती।"
body = """

      PDF में ऐसे निर्देश हो सकते हैं जो खुलते ही चल पड़ते हैं: यह चलाओ, यह फ़ॉर्म
      उस पते पर भेजो, यह JavaScript चलाओ। इस टूल से गुज़रे पेज दूसरे पेजों और वेब
      पतों वाले अपने लिंक रखते हैं और बाकी सब खो देते हैं। किसी और के पेजों का क्रम
      बदलना इस बात की वजह नहीं है कि उनके दस्तावेज़ की स्क्रिप्टिंग आपकी नई फ़ाइल
      में चली आए।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके दस्तावेज़ों के
      बारे में कुछ नहीं सौंपा जाता, न फ़ाइल, न पेज, न नाम, न साइज़, न पेजों की
      गिनती। PDF पढ़ने, नक़ल करने या लिखने वाली हर पंक्ति इसी ऑरिजिन से आती है और
      रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर वाला &ldquo;Buy me a coffee&rdquo; बटन cdnjs.buymeacoffee.com की एक
      स्क्रिप्ट बनाती है और अक्षर Google Fonts से आते हैं। वह एक लिंक से ज़्यादा
      कुछ नहीं है। न वह आपकी विज़िट की ख़बर देता है, न उसे आपके या आपके दस्तावेज़ों
      के बारे में कुछ मिलता है। जब तक आप क्लिक न करें कुछ नहीं होता, और क्लिक करने
      पर जो खुलेगा वह किसी और की साइट है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, इस पेज का सब कुछ काम
      करता रहेगा। सबसे आसान सबूत यही है: जो टूल आपके दस्तावेज़ जोड़ने के लिए कहीं
      भेजता, वह रुक जाता।"""

[[howto]]
title = "अपनी PDF चुनिए।"
body = """
 उन्हें चुनने वाले खाने में छोड़ दीजिए या
      खुद ढूँढ़ लीजिए, और बाद में और भी जोड़ते रहिए। हर फ़ाइल के पेज मौजूदा क्रम के
      आख़िर में लगते हैं, और इसी वजह से दो फ़ोल्डर अलग-अलग समय पर जोड़े जा सकते
      हैं। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है।"""

[[howto]]
title = "पेजों को मनचाहे क्रम में लगाइए।"
body = """

      किसी पेज को उसके हैंडल से खींचिए, या तीरों से थोड़ा-थोड़ा खिसकाइए। जो पेज
      टेढ़ा स्कैन हुआ है उसे घुमाइए, कोई एक निकाल दीजिए, या डिब्बे में
      <code>1-3, 8, 12-</code> टाइप करके एक साथ पूरी लड़ी रखिए, हटाइए या घुमाइए।
      नंबर आपके काम के साथ-साथ दोबारा लगते जाते हैं, इसलिए जो आप देख रहे हैं वही
      तैयार फ़ाइल भी होगी।"""

[[howto]]
title = "बताइए कि एक दस्तावेज़ निकलेगा या कई।"
body = """

      आम जवाब एक ही होता है। बाकी काटने के तरीके हैं: हर इतने पेज पर, आपके बताए
      पेज नंबरों पर, एक पेज पर एक फ़ाइल, या वापस उन्हीं फ़ाइलों में जिनसे पेज आए
      थे। एक से ज़्यादा फ़ाइल एक ही ZIP में सौंपी जाती है, तो पचास बार के बजाय एक
      बार सेव करना पड़ता है।"""

[[howto]]
title = "इसे बनाइए, और वह पंक्ति पढ़िए जो कहती है कि जाँच हो चुकी है।"
body = """

      दस्तावेज़ लिख जाने के बाद, इसी पेज का वही रीडर हर एक को दोबारा खोलता है और
      उसके पेज गिनता है। अगर वह आपकी माँग से मेल नहीं खाता, तो उस काम को असफल बताया
      जाता है और कोई डाउनलोड नहीं दिया जाता।"""

[[faq]]
q = "क्या मेरी PDF कहीं अपलोड होती हैं?"
a = """
        नहीं। उन्हें आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर पढ़ता, नक़ल करता और
        लिखता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और पेज की
        <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह बात
        कर सकता है, जिनमें से एक भी इस साइट का नहीं है। इस टूल में वैकल्पिक नेटवर्क
        सुविधा तक नहीं है।"""

[[faq]]
q = "कितनी फ़ाइलें जोड़ी जा सकती हैं, और वे कितनी बड़ी हो सकती हैं?"
a = """
        टूल में कोई सीमा लिखी हुई नहीं है। सीमा आपका अपना डिवाइस है: काम के दौरान
        दस्तावेज़ मेमोरी में रहते हैं, इसलिए एक लैपटॉप कुछ सौ मेगाबाइट बिना शिकायत
        जोड़ देगा और उससे ऊपर कहीं जाकर अटकने लगेगा। न कुछ वसूला जाता है, न रफ़्तार
        घटाई जाती है, न वॉटरमार्क लगता है, न कतार लगती है, क्योंकि दूसरी तरफ़ ऐसा
        करने वाला कोई है ही नहीं।"""

[[faq]]
q = "क्या जोड़ने या अलग करने से क्वालिटी घटती है?"
a = """
        नहीं। पेज पर कुछ भी दोबारा एनकोड, दोबारा रेंडर या दोबारा कंप्रेस नहीं होता।
        हर पेज की कंटेंट स्ट्रीम और उसमें बताए गए हर फ़ॉन्ट, तस्वीर और वेक्टर
        ड्रॉइंग को बाइट-दर-बाइट नक़ल किया जाता है, इसलिए टेक्स्ट चुना और खोजा जाता
        रहता है और तस्वीर वही तस्वीर रहती है। बदलता सिर्फ़ पेजों का क्रम है और उनके
        चारों ओर का ढाँचा।"""

[[faq]]
q = "बुकमार्क और लिंक का क्या होता है?"
a = """
        दोनों हटाए नहीं, दोबारा बनाए जाते हैं। जिस बुकमार्क का पेज नतीजे में अब भी
        है, वह उस पेज की नई जगह की ओर इशारा करता है; जिसका पेज आपने हटा दिया, वह
        निकल जाता है, बशर्ते उसके नीचे बचे हुए और भी प्रविष्टियाँ न हों, जिस हालत
