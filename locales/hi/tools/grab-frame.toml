[[privacy]]
title = "आपके वीडियो के पास बाहर जाने का रास्ता ही नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज बात कर सकता है, और उनमें से एक भी इस
      साइट का नहीं है। यहाँ ऐसा कोई ठिकाना है ही नहीं जहाँ आपकी फ़ाइल इकट्ठी की
      जा सके, और होता भी तो कोड में ऐसा कुछ नहीं है जो उसे वहाँ भेजे।"""

[[privacy]]
title = "यहाँ से कुछ भी मँगाया नहीं जाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा है ही
      नहीं। न कोई पता चिपकाना है, न कुछ डाउनलोड होता है, न पहली बार इस्तेमाल पर
      कोई इंजन उतरता है। आपके वीडियो को छूने वाला हर बाइट पेज लोड होते समय इसी
      ऑरिजिन से आया था।"""

[[privacy]]
title = "डिकोडिंग यहीं, आपके डिवाइस पर होती है।"
body = """
 फ़्रेम आपके अपने ब्राउज़र के
      WebCodecs से गुज़रते हैं, या उसी प्लेबैक इंजन से जो वैसे भी आपको यह क्लिप
      दिखाता। तस्वीर इसी डिवाइस के कैनवस पर बनती है और वहीं से सीधे डाउनलोड में
      चली जाती है।"""

[[privacy]]
title = "फ़ाइल कुछ-कुछ मेगाबाइट करके पढ़ी जाती है।"
body = """
 यहाँ की फ़ाइलों में
      वीडियो अकेला ऐसा है जो मेमोरी में भरोसे से नहीं समाता, इसलिए उसे कभी पूरा
      लोड नहीं किया जाता। रीडर सिर्फ़ आपके माँगे फ़्रेम के आसपास की खिड़की उठाता
      है। दो गीगाबाइट की क्लिप भी छोटी क्लिप जितनी जल्दी इसीलिए खुलती है।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके वीडियो के बारे
      में कुछ नहीं सौंपा जाता, न फ़ाइल, न फ़्रेम, न नाम, न साइज़, न लंबाई, न वह
      पल जहाँ आप रुके थे। पढ़ने, डिकोड करने या बनाने वाली हर पंक्ति इसी ऑरिजिन से
      आती है और रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर वाला &ldquo;Buy me a coffee&rdquo; बटन cdnjs.buymeacoffee.com की एक
      स्क्रिप्ट बनाती है और अक्षर Google Fonts से आते हैं। वह एक लिंक से ज़्यादा
      कुछ नहीं है। न वह आपकी विज़िट की खबर देता है, न उसे आपके या आपके वीडियो के
      बारे में कुछ मिलता है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, इस पेज का सब कुछ काम
      करता रहेगा। सबसे आसान सबूत यही है।"""

[[howto]]
title = "एक वीडियो चुनिए।"
body = """
 MP4, MOV, M4V या WebM को चुनने वाले खाने
      में खींचकर छोड़ दीजिए, या खुद ढूँढ़ लीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से
      पढ़ता है, और इस बीच कुछ भी कहीं नहीं जाता।"""

[[howto]]
title = "पल ढूँढ़िए।"
body = """
 चलाइए और जहाँ चाहें रोक दीजिए, या स्लाइडर
      खिसकाइए। MP4 में स्लाइडर एक बार में ठीक एक फ़्रेम चलता है, इसलिए जो आप देख
      रहे हैं और जो आप सहेजेंगे, उनके बीच कोई गोलमोल नहीं है। ऐरो कीज़ एक-एक
      फ़्रेम आगे बढ़ाती हैं, और <kbd>Shift</kbd> दबाए रखने पर दस-दस।"""

[[howto]]
title = "एक फ़ॉर्मैट चुनिए।"
body = """
 PNG फ़्रेम को ठीक वैसे ही सहेजता है जैसे वह
      डिकोड हुआ था, और यहाँ &ldquo;पूरी क्वालिटी&rdquo; का यही मतलब है। JPEG और
      WebP छोटे होते हैं और वीडियो की अपनी कंप्रेशन के ऊपर एक दूसरी कंप्रेशन
      लगाते हैं। किसी झलक के लिए यह ठीक है, बाद में एडिट होने वाली चीज़ के लिए
      नहीं।"""

[[howto]]
title = "एक निकालिए, या एक सिलसिला निकालिए।"
body = """
 एक फ़्रेम सीधे आपके
      डाउनलोड में चला जाता है। &ldquo;हर N सेकंड&rdquo; क्लिप को एक बार चलाकर हर
      निशान पर एक तस्वीर लेता है, जो कॉन्टैक्ट शीट और थंबनेल के काम आता है, और वे
      सौ बार सेव पूछे जाने के बजाय एक ही ZIP में आती हैं।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर पढ़ता और डिकोड करता
        है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और पेज की
        <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह
        बात कर सकता है, जिनमें से एक भी इस साइट का नहीं है। सुनने से बेहतर आपको
        जाँचना लगे तो इंटरनेट काट दीजिए और तब भी एक फ़्रेम निकालिए।"""

[[faq]]
q = "&ldquo;पूरी क्वालिटी&rdquo; का असल में मतलब क्या है?"
a = """
        दो बातें। एक, तस्वीर वीडियो के अपने रेज़ोल्यूशन में सहेजी जाती है, पेज पर
        दिख रही झलक के आकार में नहीं। 4K क्लिप से 3840 x 2160 की तस्वीर मिलती है।
        और दो, PNG चुनने पर फ़्रेम ठीक वैसा ही रखा जाता है जैसा डिकोडर से निकला
        था, यानी फ़ाइल में वही तस्वीर होती है जो वीडियो में है, उसके ऊपर कंप्रेशन
        का दूसरा दौर नहीं। प्लेयर की विंडो का स्क्रीनशॉट इनमें से कुछ नहीं देता:
        उसका आकार विंडो जितना होता है, और वह तब लिया जाता है जब प्लेयर उसे स्केल
        और कलर-मैनेज कर चुका होता है।"""

[[faq]]
q = "किन वीडियो फ़ॉर्मैट से फ़्रेम लिया जा सकता है?"
a = """
        MP4, M4V और MOV सीधे पढ़े जाते हैं, अंदर चाहे कुछ भी हो: H.264, HEVC, AV1
        या VP9, बशर्ते आपका ब्राउज़र उस कोडेक को डिकोड कर सके। यही सटीक रास्ता
        है, जहाँ टूल अलग-अलग फ़्रेम तक पहुँच सकता है। बाकी जो कुछ आपका ब्राउज़र
        चला सकता है, खासकर WebM, उसमें प्लेयर को उस जगह ले जाकर जो दिख रहा है
        उसे बनाया जाता है। तस्वीर तब भी पूरे आकार की सहेजी जाती है, लेकिन वह उस
        फ़्रेम पर उतरती है जिसे प्लेयर ने चुना, न कि उस पर जो आपने माँगा था।
        जिसे ब्राउज़र न पढ़ सके, न चला सके, यानी व्यवहार में AVI, WMV, FLV और
        ज़्यादातर MKV, उसे यह कहते हुए मना कर दिया जाता है।"""

[[faq]]
q = "क्या मैं एक-एक फ़्रेम आगे बढ़ सकता हूँ?"
a = """
        MP4 में हाँ, और बिलकुल ठीक-ठीक: टूल फ़ाइल की अपनी फ़्रेम सूची पढ़ता है,
        इसलिए ऐरो कीज़ उन्हीं तस्वीरों के बीच चलती हैं जो उसमें सचमुच हैं। यह उस
        क्लिप में भी सही रहता है जिसकी फ़्रेम दर घटती-बढ़ती है, जहाँ एक सेकंड के
        तीसवें हिस्से का तय कदम धीरे-धीरे खिसक जाता। प्लेबैक वाले रास्ते पर ऐसी
        कोई सूची नहीं होती, इसलिए एक कदम लगभग एक फ़्रेम जितना होता है, और पेज यह
        बता भी देता है।"""

[[faq]]
q = "मेरा फ़ोन से लिया खड़ा वीडियो यहाँ सीधा क्यों दिख रहा है?"
a = """
        क्योंकि घुमाव जानबूझकर लगाया गया है। फ़ोन आड़ा फ़िल्माता है और पिक्सल
        घुमाने के बजाय फ़ाइल में एक चौथाई घुमाव लिख देता है। इसलिए डिकोडर जो
        फ़्रेम सौंपता है वह लेटा हुआ होता है, और हर प्लेयर उसे आपकी स्क्रीन तक
        पहुँचाते समय घुमा देता है। जो टूल यह कदम छोड़ देता है, वह सही पल की एक
        भरोसेमंद दिखने वाली तस्वीर सहेजता है, बस लेटी हुई। यह टूल ट्रैक से घुमाव
        पढ़ता है और कुछ भी बनाने से पहले उसे लगा देता है।"""

[[faq]]
q = "क्या वीडियो के साइज़ या लंबाई की कोई सीमा है?"
a = """
        टूल में कोई सीमा बनी हुई नहीं है, और फ़ाइल एक साथ मेमोरी में नहीं पढ़ी
        जाती। वह कुछ-कुछ मेगाबाइट करके चलाई जाती है, इसीलिए लंबी क्लिप भी छोटी
        जितनी जल्दी खुलती है। आपकी ली हुई तस्वीरें डाउनलोड करने तक पेज में रहती
        हैं, इसलिए असली छत वीडियो नहीं, बल्कि कुछ सौ 4K PNG हैं।"""

[[faq]]
q = "क्या तस्वीर को बाद में रिसाइज़ या क्रॉप किया जा सकता है?"
a = """
        यहाँ नहीं, पर बगल में हाँ। यह टूल फ़्रेम को जस का तस सहेजता है; उसका आकार
        या शक्ल बदलना अपने आप में अलग काम है जिसमें अपने फ़ैसले होते हैं, और
        <a href="../resize-image/">इमेज रिसाइज़र</a> दोनों करता है, वह भी बिना
        कुछ अपलोड किए। तस्वीर बदले बिना सिर्फ़ फ़ाइल छोटी करनी हो तो
        <a href="../compress-image/">इमेज कंप्रेसर</a> है।"""

