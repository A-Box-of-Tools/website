[[privacy]]
title = "आप जो टाइप करते हैं, उसके जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ Wi-Fi का पासवर्ड जमा किया जा सके, और कोड में ऐसा कुछ भी नहीं
      जो उसे भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। कोड आपकी लाइन से गणित के ज़रिए बनता है और SVG
      के रूप में खींचा जाता है, इसी पेज में, आपकी अपनी मशीन पर।"""

[[privacy]]
title = "कोड हमारी तरफ़ इशारा नहीं करता।"
body = """
 आप जो टाइप करते हैं, कोड
      में वही होता है। कई मुफ़्त जनरेटर आपको ऐसा कोड थमाते हैं जिसमें उनकी
      अपनी साइट का लिंक होता है, और वह आगे आपकी साइट पर भेज देता है &mdash;
      यानी हर स्कैन उनके यहाँ गिना जाता है, और जिस दिन वे डोमेन का पैसा देना
      बंद कर दें या तय कर लें कि मुफ़्त वाली मियाद ख़त्म हुई, कोड काम करना
      बंद कर देता है। यहाँ कुछ भी न छोटा करता है, न आगे भेजता है, न ट्रैक करता
      है: पेज पर दिखती लाइन ही तस्वीर के भीतर की लाइन है।"""

[[privacy]]
title = "PNG उसी SVG से बनती है जो स्क्रीन पर है।"
body = """
 डाउनलोड कोई दूसरी
      रेंडरिंग नहीं है जो प्रीव्यू से अलग निकल आए। वही मार्कअप ब्राउज़र को
      सौंपा जाता है और कैनवस पर रंग दिया जाता है, और इसीलिए यह किसी से संपर्क
      किए बिना हो भी जाता है: भीतर न लाने को कोई फ़ॉन्ट है, न लोड करने को कोई
      तस्वीर।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपका टाइप किया कुछ नहीं सौंपा जाता। किसी लाइन को कोड
      में बदलने वाली हर पंक्ति इसी ऑरिजिन से आती है और रिपॉज़िटरी में दर्ज
      है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई क़दम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "तय कीजिए कि कैसा कोड चाहिए।"
body = """
 QR कोड कुछ भी ढो लेता है और
      फ़ोन का कैमरा उसी को ढूँढ़ता है, इसलिए जब तक किसी ने कुछ और न कहा हो,
      जवाब वही है। बारकोड एक संख्या ढोता है, और आपको कौन-सा चाहिए यह वह तय
      करता है जो उसे स्कैन करने वाला है &mdash; दुकान को EAN-13 या UPC-A
      चाहिए, माल के कार्टन को ITF-14, और भीतरी कामों के लिए आम तौर पर Code
      128।"""

[[howto]]
title = "बताइए कि उसमें क्या जाएगा।"
body = """
 आम मामला लिंक का होता है, और उसके
      ऊपर बने ख़ाने वे दूसरे फ़ॉर्मैट बना देते हैं जिन्हें फ़ोन पहचानते हैं:
      ऐसा Wi-Fi नेटवर्क जो ख़ुद जुड़ने की पेशकश करता है, ऐसा कॉन्टैक्ट कार्ड
      जो ख़ुद सहेजे जाने की पेशकश करता है, कोई ईमेल, कोई संदेश, कोई फ़ोन
      नंबर, नक़्शे पर कोई जगह। आप जो भी चुनें, तैयार लाइन पेज पर दिख जाती है
      &mdash; QR कोड कभी उससे ज़्यादा कुछ ढोता ही नहीं।"""

[[howto]]
title = "तय कीजिए कि यह कितनी चोट सह सके।"
body = """
 चारों स्तर उसमें कम या
      ज़्यादा एरर करेक्शन भरते हैं, और ज़्यादा करेक्शन का मतलब बड़ा और सघन
      कोड। स्क्रीन के लिए L काफ़ी है, आम काग़ज़ के लिए M, और उस चीज़ के लिए H
      जिसे हाथ लगेंगे, जो छोटी छपेगी, या जो धूप में खिड़की पर चिपकेगी। जिस
      मेन्यू को रोज़ पोंछा जाता है, उस पर लगे कोड के लिए Q या H पैसा वसूल
      है।"""

[[howto]]
title = "साइज़, हाशिया और रंग तय कीजिए।"
body = """
 हाशिया कोड का ही हिस्सा है:
      विनिर्देश उसके चारों ओर चार मॉड्यूल की ख़ाली जगह माँगता है, और उसे
      काट देना ही वह सबसे आम अकेली वजह है जिससे छपा हुआ कोड स्कैन नहीं होता।
      हल्के पर गहरा, और असली अंतर के साथ &mdash; स्कैनर दोनों का फ़र्क़ पढ़ता
      है, इसलिए सफ़ेद पर फीका भूरा नहीं चलेगा, और गहरे पर हल्का तो बहुत सारे
      रीडरों में सिरे से नाकाम रहता है।"""

[[howto]]
title = "जो फ़ोन आपके पास है, उसी से जाँच लीजिए।"
body = """
 एक हज़ार कोड छापने से
      पहले, स्क्रीन पर दिखते एक कोड को स्कैन कर लीजिए। इसमें दस सेकंड लगते
      हैं और यह ग़लतियों की वह पूरी क़िस्म पकड़ लेता है जो प्रीव्यू नहीं पकड़
      सकता: ऐसा Wi-Fi पासवर्ड जिसमें कोई अक्षर बचाया जाना चाहिए था, ऐसा लिंक
      जिसमें <code>https://</code> छूट गया, ऐसा बारकोड नंबर जो एक अंक छोटा
      है।"""

[[howto]]
title = "SVG ले जाइए।"
body = """
 वह कोड को पिक्सलों के बजाय निर्देशों के
      रूप में रखती है, इसलिए किसी भी साइज़ पर बिना नरम पड़े छपती है &mdash;
      और नरम किनारा ठीक वही चीज़ है जिसे स्कैनर सुलझा नहीं पाता। अगर आप जहाँ
      चिपका रहे हैं वह SVG लेता ही न हो, तो PNG भी ले जाइए; वह हर मॉड्यूल पर
      पूरे-पूरे पिक्सल में खींची जाती है, इसलिए उसके किनारे भी धुँधले नहीं
      होते।"""

[[faq]]
q = "क्या मेरा टाइप किया कुछ कहीं भेजा जाता है?"
a = """
        नहीं। QR कोड किसी लाइन पर की गई गणित भर है, और वह गणित आपके अपने
        ब्राउज़र में, आपकी अपनी मशीन पर चलती है। इस टूल में किसी भी क़िस्म की
        कोई नेटवर्क सुविधा है ही नहीं &mdash; यह न कभी कुछ लाता है, न कभी कुछ
        भेजता है &mdash; और पेज की <code>Content-Security-Policy</code> उन
        सारे पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है; उनमें से एक
        भी इस साइट का नहीं है। यहाँ इसकी क़ीमत ज़्यादातर पेजों से ज़्यादा है,
        क्योंकि QR कोड में लोग सबसे अक्सर अपने Wi-Fi का पासवर्ड डालते हैं।"""

[[faq]]
q = "क्या इन कोडों की कोई मियाद होती है, या ये बाद में काम करना बंद कर देते हैं?"
a = """
        नहीं, और ऐसा हो ही नहीं सकता। आप जो टाइप करते हैं, कोड में वही होता है,
        इसलिए उसे स्कैन करने पर हमेशा ठीक वही लाइन वापस मिलती है। मियाद उन
        कोडों की होती है जिनके भीतर किसी और का पता होता है: &ldquo;डायनैमिक&rdquo;
        QR कोड में जनरेटर के सर्वर का लिंक होता है, जो आगे आपकी साइट पर भेजता
        है &mdash; यानी वे हर स्कैन गिन सकते हैं, यह बदल सकते हैं कि वह कहाँ
        जाए, या ट्रायल ख़त्म होने पर उसे बंद कर सकते हैं। यहाँ कुछ भी किसी के
        रास्ते से होकर आगे नहीं भेजा जाता।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मैं इसे व्यावसायिक तौर पर इस्तेमाल कर सकता हूँ?"
a = """
        यह मुफ़्त है, यहाँ न कोई खाता है, न वॉटरमार्क, और न इस पर कोई सीमा कि
        आप कितने बनाएँ &mdash; और आप नतीजे को किसी उत्पाद, पोस्टर या दुकान के
        मुख पर लगा सकते हैं। QR Code, Denso Wave का पंजीकृत ट्रेडमार्क है, और
        उन्होंने कहा है कि वे कोड इस्तेमाल करने वालों के ख़िलाफ़ उसका
        इस्तेमाल नहीं करेंगे &mdash; विनिर्देश ISO/IEC 18004 के रूप में
        प्रकाशित है और उसे लागू करना मुफ़्त है, और यह पेज वही करता है। साइट पर
        विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं।"""

[[faq]]
q = "मुझे एरर करेक्शन का कौन-सा स्तर चुनना चाहिए?"
a = """
        जब तक कोई ख़ास वजह न हो, M। L सबसे छोटा कोड बनाता है और स्क्रीन पर ठीक
        रहता है; M आम हाथ-लगाई सह लेता है; Q और H उस कोड के लिए हैं जो छोटा
        छपेगा, लैमिनेट होगा, खिड़की पर चिपकेगा, या जिसका कुछ हिस्सा किसी लोगो
        से ढँक जाएगा। हर अगला स्तर उसमें और जाँच-डेटा भरता है, जिसके लिए उतने
        ही टेक्स्ट पर बड़ा सिंबल चाहिए &mdash; L से H पर जाने में उसी लाइन के
        लिए मॉड्यूल की गिनती लगभग दोगुनी हो जाती है।"""

[[faq]]
q = "एक QR कोड कितना कुछ ढो सकता है?"
a = """
        सबसे बड़े साइज़ पर, यानी 177 मॉड्यूल के वर्ग में, 7,089 अंक तक, 4,296
        बड़े अक्षर और अंक तक, या बाक़ी किसी भी चीज़ के 2,953 बाइट तक &mdash;
        और यह सबसे कमज़ोर एरर करेक्शन पर है; सबसे मज़बूत पर यह इसका क़रीब
        एक-तिहाई रह जाता है। व्यवहार में सीमा फ़ॉर्मैट नहीं, स्कैनर है: कुछ सौ
        अक्षरों के आगे मॉड्यूल इतने छोटे पड़ जाते हैं कि आम फ़ोन का कैमरा
        उन्हें हाथ भर दूरी से सुलझा ही नहीं पाता। लंबा कोड आम तौर पर इस बात का
        संकेत है कि उसमें कोई छोटा लिंक होना चाहिए था।"""

[[faq]]
q = "लिंक को छोटे अक्षरों में लिखने पर मेरा कोड बड़ा क्यों हो जाता है?"
a = """
        क्योंकि QR कोड में बड़े अक्षरों और अंकों के लिए एक मोड होता है जो ग्यारह
        बिट में दो अक्षर ठूँस देता है, और छोटे अक्षरों के लिए ऐसा कोई मोड नहीं,
        जिनका हर अक्षर आठ बिट लेता है।
        <code>HTTPS://EXAMPLE.COM/PAGE</code> लिखा URL उसी URL के छोटे अक्षरों
        वाले रूप से एक-तिहाई तक छोटा हो सकता है। स्कीम और होस्ट में छोटे-बड़े
        अक्षर का फ़र्क़ नहीं पड़ता, इसलिए उन्हें चिल्लाकर लिखने से साइज़ के
        सिवा कुछ नहीं बदलता; होस्ट के बाद वाले रास्ते में फ़र्क़ पड़ता है,
        इसलिए उसे हाथ मत लगाइए।"""

[[faq]]
q = "क्या यह QR कोड बनाने के साथ-साथ पढ़ भी सकता है?"
a = """
        अभी नहीं। किसी कोड को पढ़ने का मतलब है तस्वीर को डिकोड करना &mdash;
        फ़ोटोग्राफ़ में सिंबल ढूँढ़ना, जिस कोण से वह खींची गई उसका हिसाब बैठाना,
        और चोट की मरम्मत करना &mdash; जो कोड खींचने से अलग और उससे कहीं बड़ा
        काम है। इसे भी यहाँ उन्हीं शर्तों पर बनाया जा सकता है जिन पर बाक़ी सब
        बना है, और यह सूची में है। तब तक आपके फ़ोन का कैमरा यह पहले से करता
        है, और अच्छा करता है।"""

[[faq]]
q = "हाशिया किस काम का है, और क्या मैं उसे छोटा कर सकता हूँ?"
a = """
        QR कोड के चारों ओर की सफ़ेद जगह कोड का ही हिस्सा है। रीडर उसी से पता
        लगाता है कि सिंबल कहाँ ख़त्म होता है, और विनिर्देश हर तरफ़ चार मॉड्यूल
        माँगता है; बारकोड को क़रीब दस चाहिए। आप इसे यहाँ शून्य कर सकते हैं और
        तस्वीर ज़्यादा सुथरी लगेगी, और तब बहुत सारे स्कैनर उसे देख ही नहीं
        पाएँगे &mdash; ख़ासकर किसी भरे-भरे बैकग्राउंड पर। अगर दिक़्क़त जगह की
        है, तो हाशिया काटने के बजाय कोड को ही छोटा कर लीजिए।"""

[[faq]]
q = "मुझे कौन-सा बारकोड चाहिए?"
a = """
        वही जो स्कैन करने वाला माँगे। EAN-13 उत्तरी अमेरिका के बाहर की दुकानों
        वाला बारकोड है और UPC-A उत्तरी अमेरिका वाला &mdash; दोनों के लिए GS1
        से आपको जारी हुआ नंबर चाहिए, क्योंकि वह नंबर सिर्फ़ उत्पाद की नहीं,
        आपकी कंपनी की पहचान है। EAN-8 छोटे पैकेटों के लिए छोटा रूप है। ITF-14
        माल के कार्टन पर जाता है। Code 128 और Code 39 अंकों के साथ टेक्स्ट भी
        ढोते हैं और उनके लिए कोई पंजीकरण चाहिए ही नहीं, जिससे वे भीतरी हर काम
        के लिए सही जवाब बन जाते हैं: सामान, ख़ाने, काम की पर्चियाँ।"""

[[faq]]
q = "चेक डिजिट क्या है, और टूल ने उसे जोड़ा क्यों?"
a = """
        वह दुकान वाले बारकोड का आख़िरी अंक है, जो उससे पहले वाले अंकों से निकाला
        जाता है, ताकि स्कैनर ग़लत पढ़े गए और ठीक पढ़े गए में फ़र्क़ बता सके।
        EAN-13 को बारह अंक चाहिए और तेरहवाँ वह ख़ुद निकालता है; UPC-A को ग्यारह
        चाहिए और बारहवाँ वह ख़ुद निकालता है। छोटा नंबर टाइप कीजिए और यह पेज उसे
        जोड़ देता है। पूरा नंबर टाइप कीजिए और यह आपके दिए अंक की जाँच करता है
        &mdash; और चुपचाप सुधारने के बजाय मना कर देता है, क्योंकि चुपचाप ठीक
        किया गया ग़लत अंक ऐसा लेबल बनता है जो किसी और के उत्पाद के रूप में
        स्कैन होता है।"""

[[faq]]
q = "क्या मैं QR कोड के बीचोंबीच लोगो रख सकता हूँ?"
a = """
        यहाँ नहीं, पर यह जान लेना काम का है कि वह कहीं और चलता क्यों है: उसे
        मुमकिन बनाता है एरर करेक्शन। H स्तर पर क़रीब 30% मॉड्यूल तबाह हो जाने
        पर भी कोड पढ़ा जा सकता है, इसलिए बीच में &mdash; जहाँ कोई फ़ाइंडर
        पैटर्न नहीं बैठता &mdash; उससे कुछ कम जगह ढँकने वाला लोगो ऐसी चोट है
        जिसकी मरम्मत हो जाती है। कोड को H स्तर पर बनाकर अपने इमेज एडिटर से
        गुज़ारिए, लोगो को क़रीब पाँचवें हिस्से से कम रखिए, और उस पर भरोसा करने
        के बजाय उसे किसी असली फ़ोन से जाँच लीजिए।"""

[[faq]]
q = "SVG, PNG से बेहतर क्यों है?"
a = """
        क्योंकि कोड किनारों से बनता है, और PNG के पास उन्हें बनाने को गिनती के
        पिक्सल होते हैं। उसे बड़ा कीजिए और हर किनारा नरम पड़ जाता है; और नरम
        किनारा ठीक वही चीज़ है जिससे स्कैनर को दिक़्क़त होती है, और 1200 dpi
        वाले प्रिंटर को 512 पिक्सल की PNG देना उससे यह कहना है कि फ़र्क़ वह
        ख़ुद गढ़ ले। SVG वर्गों को निर्देशों के रूप में रखती है, इसलिए वह
        विज़िटिंग कार्ड पर भी उतनी ही साफ़ छपती है और होर्डिंग पर भी। यहाँ की
        PNG हर मॉड्यूल पर पूरे-पूरे पिक्सल में खींची जाती है, और PNG इससे
        बेहतर कर भी नहीं सकती।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपका टेक्स्ट कोड बनवाने कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

