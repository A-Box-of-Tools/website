<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> एनकोडिंग चुनिए</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">एनकोडिंग</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>किस दिशा में</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>एनकोड</strong> सादा टेक्स्ट भीतर, एनकोड किया बाहर।</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>डिकोड</strong> एनकोड किया भीतर, सादा टेक्स्ट बाहर।</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> इसे भीतर चिपकाइए</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">आपका टेक्स्ट</label>
          <span class="count" id="input-count">खाली</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="एनकोड करने का टेक्स्ट, या डिकोड करने का Base64 यहाँ चिपकाइए - या ऊपर कोई फ़ाइल छोड़ दीजिए।"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">कोई उदाहरण आज़माइए</button>
        <button type="button" id="clear" class="ghost danger">खाली कीजिए</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> नतीजा ले जाइए</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">अभी कुछ नहीं।</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>कॉपी</button>
        <a id="download" class="ghost as-button" hidden download>डाउनलोड</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
