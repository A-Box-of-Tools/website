[[privacy]]
title = "मिटाना वह काम है जो अपलोड को सबसे कम झेल पाता है।"
body = """

      लोग जो मिटाते हैं वही वजह है कि उसे अपलोड नहीं करना चाहिए। गवाही का बयान,
      डॉक्टर की चिट्ठी, मकान मालिक को जाने वाला बैंक स्टेटमेंट, एक ग्राहक का नाम लिए
      हुए वह अनुबंध जो दूसरे ग्राहक को जा रहा है। निजी हिस्सा हटवाने के लिए यह सब
      किसी अजनबी के सर्वर को सौंपने का मतलब है कि निजी हिस्सा पहले पहुँचता है, पूरा
      का पूरा, और वही उनके पास रह जाता है। इस पेज का दूसरा आधा हिस्सा है ही नहीं।"""

[[privacy]]
title = "जो बचता है वह ज्यों का त्यों आगे भेज दिया जाता है।"
body = """

      पन्ने पर सिर्फ़ वही बाइट बदलते हैं जो टेक्स्ट दिखाने वाले उन्हीं निर्देशों का
      हिस्सा थे जिनमें हटाए गए अक्षर थे। बाकी हर निर्देश, और पन्ना जिन फ़ॉन्ट,
      तस्वीरों और रेखाओं का ज़िक्र करता है वे सब, ठीक वैसे ही कॉपी होते हैं जैसे आए
      थे। न कुछ दोबारा बनाया जाता है, न दोबारा एन्कोड किया जाता है, न दोबारा बहाया
      जाता है। जो हटा उसकी चौड़ाई नापकर एक स्पेसिंग निर्देश के रूप में वापस रख दी
      जाती है, ताकि लाइन का बाकी हिस्सा वहीं रहे जहाँ डॉक्यूमेंट ने उसे रखा था।"""

[[privacy]]
title = "यह तस्वीर में से शब्द नहीं निकाल सकता, और बता देता है कि वे कौन-से पन्ने हैं।"
body = """

      स्कैन किया हुआ पन्ना एक तस्वीर है। उस पर मौजूद शब्द पिक्सल हैं, टेक्स्ट नहीं,
      और यहाँ की कोई चीज़ उन्हें छू नहीं सकती। अगर स्कैन में स्कैनर के OCR की बनाई
      वह अदृश्य खोजी जा सकने वाली लेयर हो, तो यह टूल उसे हटा देता है, और खोज तथा
      कॉपी को यही मिलता। और पेज पर साफ़ लिख देता है कि तस्वीर में शब्द अब भी दिख रहे
      हैं। उस तस्वीर को ढकना अलग काम है, और पिक्सल पर लिखने वाला टूल
      <a href=\"../redact-image/\">इमेज से मिटाने वाला टूल</a> है।"""

[[privacy]]
title = "डॉक्यूमेंट यह बताना बंद कर देता है कि वह कहाँ से आया।"
body = """

      प्रॉपर्टी और XMP पैकेट हर बार हट जाते हैं। न producer की लाइन, न बनने की
      तारीख़, न लेखक, न शीर्षक, और न वे प्राइवेट ब्लॉक जो कोई लेआउट प्रोग्राम पीछे
      छोड़ जाता है। जिस फ़ाइल के पन्नों से नाम निकाल दिया गया हो पर प्रॉपर्टी में अब
      भी <code>शर्मा समझौता ड्राफ़्ट 3.docx</code> लिखा हो, वह मिटाई हुई फ़ाइल नहीं
      है, और यह किसी चेकबॉक्स पर छोड़ने की बात नहीं है।"""

[[privacy]]
title = "एन्क्रिप्टेड फ़ाइलें खोली नहीं, लौटा दी जाती हैं।"
body = """

      पासवर्ड लगी PDF मना कर दी जाती है, उस किस्म की भी जिसे स्कैनर खाली पासवर्ड के
      साथ बनाते हैं और जो तकनीकी रूप से खुल जाती। किसी डॉक्यूमेंट की सुरक्षा हटाना
      उसमें से शब्द निकालने से अलग काम है, और उसे चुपचाप कर देना आपकी ओर से काम करने
      वाले किसी टूल के लिए चौंकाने वाली बात होती।"""

[[privacy]]
title = "गूगल क्या लोड करता है, और उसे क्या नहीं मिलता।"
body = """
 विज्ञापन और माप की
      स्क्रिप्ट गूगल से आती हैं। इनमें से किसी को भी आपके डॉक्यूमेंट के बारे में कुछ
      नहीं दिया जाता। न कोई फ़ाइल, न पन्ना, न नाम, न साइज़, न पन्नों की गिनती, न कोई
      शब्द जो आपने खोजा। PDF को पढ़ने, बदलने और लिखने वाली हर लाइन इसी ऑरिजिन से आती
      है और रिपॉज़िटरी में लिखी है।"""

