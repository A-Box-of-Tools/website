[[howto]]
title = "PDF चुनिए।"
body = """
 एक बार में एक ही डॉक्यूमेंट, और यह
      जान-बूझकर है। मिटाना ऐसा काम है जिसे पन्ना-दर-पन्ना देखना पड़ता है, और जो टूल
      आपको एक फ़ाइल में शब्द चुनने देता और चुपचाप उन्हें दूसरी पर लगा देता, गलत चीज़
      ठीक उसी रास्ते से भेजी जाती है। फ़ाइल को ब्राउज़र सीधे आपकी डिस्क से पढ़ता
      है।"""

[[howto]]
title = "बताइए कि क्या हटना है।"
body = """
 शब्द टाइप कीजिए, जैसे कोई नाम,
      पता या केस नंबर, और वे जहाँ-जहाँ आते हैं वह सब उस लाइन के साथ गिना दिया जाता
      है जिस पर वे हैं, और साथ में चुनने का एक डिब्बा होता है। डिब्बे के बगल वाले
      खोजी ईमेल पते, कार्ड नंबर, IBAN, आधार व सामाजिक सुरक्षा नंबर, और फ़ोन नंबर
