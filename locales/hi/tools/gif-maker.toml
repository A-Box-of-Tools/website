[[privacy]]
title = "आपकी तस्वीरों के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा की जा सकें, और कोड में ऐसा कुछ भी नहीं जो
      उन्हें भेजता, अगर होता भी। कभी यहाँ <code>connect-src 'none'</code> लिखा
      होता था, जो पूर्ण था; विज्ञापन जोड़ने की क़ीमत वही थी, और यह कह देना भी
      इसी सौदे का हिस्सा है।"""

[[privacy]]
title = "एनकोडर इसी रिपॉज़िटरी की चार फ़ाइलें हैं।"
body = """
 GIF को एक रंग-क्वांटाइज़र
      और एक LZW कंप्रेसर चाहिए, और ब्राउज़र इनमें से कोई नहीं देता &mdash;
      इसलिए दोनों यहीं लिखे गए हैं, <code>src/quantize.js</code> और
      <code>src/lzw.js</code> में, और कंटेनर <code>src/gif.js</code> में। एक
      बनाने के लिए कुछ भी बाहर से नहीं लाया जाता, और पहली बार इस्तेमाल पर कोई
      इंजन डाउनलोड नहीं होता।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी तस्वीरों के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न थंबनेल, न नाम, न साइज़, न
      गिनती। कोई तस्वीर पढ़ने, डिकोड करने, खींचने या दबाने वाली हर पंक्ति इसी
      ऑरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की ख़बर नहीं करता, और उसे आपके या आपकी तस्वीरों के बारे में कुछ
      नहीं दिया जाता। जब तक आप क्लिक न करें, कुछ भी नहीं होता, और क्लिक करने
      पर आप किसी और की साइट पर पहुँचते हैं।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और इस पेज का हर
      हिस्सा काम करता रहेगा। सबसे आसान सबूत यही है: जो टूल आपकी तस्वीरें GIF
      बनाने के लिए कहीं भेजता, वह प्लग निकालते ही रुक जाता।"""

[[howto]]
title = "अपनी तस्वीरें चुनिए।"
body = """
 पूरा फ़ोल्डर पिकर पर छोड़ दीजिए, या
      फ़ाइलें हाथ से चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है;
      इस दौरान कुछ भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "उन्हें उसी क्रम में लगाइए जिसमें वे चलनी चाहिए।"
body = """
 हैंडल से
      खींचिए, या तीरों का इस्तेमाल कीजिए। &ldquo;नाम से क्रम में लगाइए&rdquo;
      उसी तरह गिनता है जैसी आप उम्मीद करेंगे, यानी <code>frame_2</code>,
      <code>frame_10</code> से पहले आता है।"""

[[howto]]
title = "तय कीजिए कि हर फ़्रेम कितनी देर रुके।"
body = """
 हर एक के लिए आधा
      सेकंड स्लाइडशो है; बीसवाँ हिस्सा एनिमेशन। हर फ़्रेम को एक साथ वही रुकने
      का समय दे दीजिए, या किसी एक को अलग करके ज़्यादा देर ठहरने दीजिए।"""

[[howto]]
title = "आकार चुनिए, और यह भी कि रंग कैसे चुने जाएँ।"
body = """
 GIF अपने
      क्षेत्रफल और अपने फ़्रेमों की गिनती के साथ बढ़ती है और उसे वापस नीचे लाने
      को क्वालिटी का कोई स्लाइडर है ही नहीं, इसलिए सबसे ज़्यादा मायने रखने
      वाली सेटिंग आकार ही है। हर फ़्रेम के लिए 256 रंग सबसे अच्छा दिखने वाला
      डिफ़ॉल्ट है; एक साझा पैलेट छोटा भी रहता है और ज़्यादा स्थिर भी।"""

[[howto]]
title = "GIF बनाइए और डाउनलोड कीजिए।"
body = """
 यह आपके अपने हार्डवेयर पर
      बनती है, इसलिए कितनी देर लगेगी यह किसी क़तार पर नहीं, आपकी मशीन पर
      निर्भर है। सहेजने से पहले तैयार एनिमेशन पेज पर चलकर दिख जाती है।"""

[[faq]]
q = "क्या मेरी तस्वीरें कहीं अपलोड होती हैं?"
a = """
        नहीं। आपकी तस्वीरें आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता
        है, खींचता है, क्वांटाइज़ करता है और दबाता है। इस टूल का कोई सर्वर वाला
        हिस्सा है ही नहीं, और पेज की <code>Content-Security-Policy</code> उन
        सारे पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है &mdash; उनमें
        से एक भी इस साइट का नहीं है। नेटवर्क का प्लग निकाल दीजिए और यह तब भी
        GIF बनाता है।"""

[[faq]]
q = "मैं कौन-कौन से इमेज फ़ॉर्मैट इस्तेमाल कर सकता हूँ?"
a = """
        कोई भी स्थिर तस्वीर का फ़ॉर्मैट जिसे आपका ब्राउज़र डिकोड कर सके, यानी
        व्यवहार में JPG, PNG, WebP, GIF, AVIF और Apple डिवाइसों पर HEIC भी।
        यहाँ अलग से कोई सूची अपडेट रखने की ज़रूरत नहीं है, क्योंकि डिकोड करना
        हमारा नहीं, ब्राउज़र का काम है।"""

[[faq]]
q = "मेरी GIF इतनी बड़ी क्यों है?"
a = """
        क्योंकि GIF हर फ़्रेम को पूरे पिक्सलों के रूप में सहेजती है। यहाँ गति
        की कोई भरपाई नहीं होती, कुछ भी &ldquo;पिछली बार जैसा ही, बस खिसका
        हुआ&rdquo; के रूप में नहीं रखा जाता, और क्वालिटी का कोई बटन है ही
        नहीं: साइज़ मोटे तौर पर क्षेत्रफल गुणा फ़्रेमों की संख्या है, और उसे
        सिर्फ़ तीन चीज़ें नीचे लाती हैं।
        <br><br>
        इसे छोटा कीजिए &mdash; आकार आधा करने पर फ़ाइल चौथाई रह जाती है। कम
        फ़्रेम इस्तेमाल कीजिए, या हर एक को ज़्यादा देर रोकिए। 64 या 32 रंगों पर
        उतर आइए, और डिदरिंग बंद कर दीजिए &mdash; सपाट कलाकृति पर इसकी क़ीमत
        सुनने में लगने से कम है और फ़ोटोग्राफ़ पर कहीं ज़्यादा। अगर तब भी बात
        न बने, तो ईमानदार जवाब यह है कि आप जो बना रहे हैं वह वीडियो है, और
        उसकी MP4 शायद दसवें हिस्से की होगी।"""

[[faq]]
q = "GIF कितनी तेज़ चल सकती है?"
a = """
        उतनी तेज़ नहीं जितनी संख्या से लगता है। फ़ॉर्मैट हर फ़्रेम की देरी
        सेकंड के सौवें हिस्सों में सहेजता है, और 1990 के दशक से ब्राउज़र दो
        सौवें हिस्सों से कम किसी भी देरी को सेकंड के दसवें हिस्से पर बाँध देते
        हैं &mdash; एक ऐसा नियम जो उस ज़माने के घूमते ग्लोब के लिए लिखा गया था
        और कभी हटाया नहीं गया। इसलिए 0.01s की देरी 100 फ़्रेम प्रति सेकंड पर
        नहीं चलती; वह 10 पर चलती है। इसी वजह से यह टूल आपको 0.02s से कम कुछ
        देगा ही नहीं, और 0.05s (20 फ़्रेम प्रति सेकंड) लगभग उतना ही तेज़ है
        जितना माँगना सार्थक है।"""

[[faq]]
q = "पैलेट वाली सेटिंग क्या बदलती है?"
a = """
        GIF के एक फ़्रेम में ज़्यादा से ज़्यादा 256 रंग होते हैं, और उन्हें
        किसी न किसी को चुनना ही पड़ता है।
        <br><br>
        <strong>हर फ़्रेम के लिए सबसे अच्छे रंग</strong> हर तस्वीर के लिए
        अलग-अलग 256 चुनता है, जो सबसे साफ़ दिखता है और आपस में असंबद्ध
        फ़ोटोग्राफ़ों के सेट के लिए सही जवाब है। <strong>पूरी GIF के लिए एक
        पैलेट</strong> हर फ़्रेम से एक साथ मिलकर एक ही तालिका बनाता है। इससे
        फ़ाइल छोटी बनती है, और वह टिमटिमाहट रुक जाती है जो एक ही दृश्य के
        फ़्रेमों के बीच पैलेट लड़खड़ाने पर दिखती है &mdash; इसलिए जब फ़्रेम
        संग्रह नहीं, एक शृंखला हों, तब इसी की तरफ़ हाथ बढ़ाइए।"""

[[faq]]
q = "क्या मैं पारदर्शी बैकग्राउंड रख सकता हूँ?"
a = """
        हाँ, अगर आपकी तस्वीरों में वह हो तो: &ldquo;पारदर्शिता&rdquo; को
        &ldquo;पारदर्शी हिस्से रहने दीजिए&rdquo; पर कर दीजिए। ऐसा करने से पहले
        एक बात जान लीजिए। GIF की पारदर्शिता एक ही बिट की होती है &mdash; पिक्सल
        या तो अदृश्य है या पूरा रंगा हुआ, बीच में कुछ नहीं &mdash; इसलिए
        एंटी-एलियस किए किनारे, नरम छायाएँ और फीकी पड़ती हर चीज़ को इसके बजाय
        सख़्त किनारा मिल जाता है। अगर आपकी एनिमेशन ऐसे बैकग्राउंड पर जा रही है
        जिसका रंग आपको पता है, तो उसे उसी रंग पर चपटा कर देना बेहतर दिखेगा।"""

[[faq]]
q = "क्या मैं कितनी तस्वीरें इस्तेमाल कर सकता हूँ, इस पर कोई सीमा है?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है। व्यावहारिक छत आपकी अपनी मशीन की
        मेमोरी है, और उस फ़ाइल के साथ आपका सब्र जो बाहर आती है: तस्वीरें एक-एक
        करके पढ़ी जाती हैं, इसलिए सौ फ़्रेम ठीक हैं, पर 640 px पर सौ फ़्रेम एक
        बहुत बड़ी GIF भी है। ऊपर &ldquo;मेरी GIF इतनी बड़ी क्यों है?&rdquo;
        देखिए।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल। नतीजे पर कोई
        वॉटरमार्क भी नहीं होता। साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते
        हैं; विज्ञापनों को आपकी तस्वीरों के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपकी तस्वीरें प्रोसेस होने कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

