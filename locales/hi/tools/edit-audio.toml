[[privacy]]
title = "आपकी रिकॉर्डिंग के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइल जमा की जा सके, और कोड में ऐसा कुछ भी नहीं जो उसे
      भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा
      है ही नहीं: न चिपकाने को कोई पता, न डाउनलोड करने को कुछ, न पहली बार
      इस्तेमाल पर बाहर से मँगाया जाने वाला कोई इंजन। आपके ऑडियो को छूने वाला
      हर बाइट पेज लोड होते ही इसी ऑरिजिन से आया था।"""

[[privacy]]
title = "डिकोडर वही है जो आपके ब्राउज़र में पहले से मौजूद है।"
body = """

      फ़ाइल <code>decodeAudioData</code> को सौंप दी जाती है, यानी वही कोड जो
      किसी <code>&lt;audio&gt;</code> तत्व में ट्रैक चलाता है। आपका फ़ॉर्मैट
      पढ़ने के लिए यहाँ कुछ भी भेजा नहीं जाता, और उसे पढ़ने के लिए इस पेज के
      बाहर किसी से कुछ माँगा भी नहीं जाता।"""

[[privacy]]
title = "वीडियो की तस्वीर तो कभी डिकोड होती ही नहीं।"
body = """
 जब आप कोई वीडियो भीतर
      छोड़ते हैं, तो सिर्फ़ उसका ऑडियो ट्रैक माँगा जाता है। फ़्रेम न पढ़े जाते
      हैं, न डिकोड होते हैं, न खींचे जाते हैं, न देखे जाते हैं &mdash; इस पेज
      पर ऐसा कोई कोड है ही नहीं जो ऐसा कर सके, और जो फ़ाइल बाहर आती है उसमें
      आवाज़ है और उसके सिवा कुछ नहीं।"""

[[privacy]]
title = "सैंपल लिख दिए जाते हैं, दोबारा एनकोड नहीं होते।"
body = """

      WAV दरअसल वही सैंपल हैं जो इस पेज ने निकाले, और उनके आगे लगा एक हेडर।
      इस चक्र में कोई एनकोडर है ही नहीं जो आपकी रिकॉर्डिंग के बारे में फ़ैसले
      ले, और ऐसा कुछ भी नहीं जिसे अपलोड कहा जा सके, जिस पर वह होता।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी रिकॉर्डिंग के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न सैंपल, न नाम, न साइज़, न
      लंबाई, न यह कि वह कितनी ऊँची थी। पढ़ने, बदलने और लिखने वाली हर पंक्ति
      इसी ऑरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की ख़बर नहीं करता, और उसे आपके या आपकी फ़ाइल के बारे में कुछ नहीं
      दिया जाता।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और इस पेज की हर
      चीज़ काम करती रहेगी। सबसे आसान सबूत यही है।"""

[[howto]]
title = "कोई फ़ाइल चुनिए।"
body = """
 MP3, WAV, FLAC, M4A, Ogg या Opus फ़ाइल
      पिकर पर छोड़ दीजिए &mdash; या कोई वीडियो, अगर आपको उसमें से आवाज़ चाहिए।
      ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है; इस दौरान कुछ भी कहीं नहीं भेजा
      जाता।"""

[[howto]]
title = "अगर आप इसी के लिए आए हैं, तो इसे उलट दीजिए।"
body = """
 बस एक
      चेकबॉक्स। सैंपल आख़िरी से पहला करके लिख दिए जाते हैं, और यह ठीक-ठीक
      पलटने लायक़ है: दो बार कीजिए और वही फ़ाइल हाथ में होगी जिससे आपने शुरू
      किया था, सैंपल-दर-सैंपल।"""

[[howto]]
title = "रफ़्तार तय कीजिए।"
body = """
 स्लाइडर खींचिए, कोई गुणक टाइप कीजिए, या
      तैयार विकल्पों में से कोई दबा दीजिए। फिर तय कीजिए कि पिच का क्या हो:
      उसे जहाँ है वहीं थामे रखिए, जो 1.5&times; पर चलते किसी व्याख्यान के लिए
      चाहिए होता है, या उसे रफ़्तार के साथ हिलने दीजिए, जो टेप करता है और
      जिससे आवाज़ ऊपर या नीचे चली जाती है।"""

[[howto]]
title = "स्तर तय कीजिए।"
body = """
 या तो डेसिबल में कोई बदलाव बताइए, या कहिए
      कि रिकॉर्डिंग को तब तक उठाया जाए जब तक उसका सबसे ऊँचा पल छत से ठीक नीचे
      न आ जाए। कुछ भी दबाने से पहले पेज बता देता है कि वह पल कहाँ गिरेगा, और
      अगर आपकी चुनी सेटिंग उसे पूरे पैमाने से आगे धकेल देती, तो चेतावनी भी दे
      देता है।"""

[[howto]]
title = "इसे सहेजिए।"
body = """
 काम आपके अपने हार्डवेयर पर होता है, इसलिए
      कितनी देर लगेगी यह किसी क़तार पर नहीं, आपकी मशीन पर निर्भर है। जो बाहर
      आता है वह WAV है &mdash; ख़ुद सैंपल, और आगे लगा एक हेडर &mdash; जो पहले
      पेज पर चलाकर दिखाया जाता है, फिर सीधे आपके ब्राउज़र के डाउनलोड में चला
      जाता है।"""

[[faq]]
q = "क्या मेरा ऑडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता, बदलता और
        लिखता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और पेज की
        <code>Content-Security-Policy</code> उन सारे पतों के नाम गिना देती है
        जिनसे यह संपर्क कर सकता है &mdash; उनमें से एक भी इस साइट का नहीं है।
        बताया जाना अगर काफ़ी न लगे तो इंटरनेट काटकर कोई ट्रैक उलटकर देख
        लीजिए।"""

[[faq]]
q = "क्या मैं वीडियो में से आवाज़ निकाल सकता हूँ?"
a = """
        हाँ, और यहाँ यह काम MP3 खोलने जैसा ही है। कोई MP4, MOV या WebM भीतर
        छोड़िए और सिर्फ़ उसका ऑडियो ट्रैक डिकोड होता है: तस्वीर कभी पढ़ी ही
        नहीं जाती, और जो बाहर आती है वह बिना वीडियो वाली एक ध्वनि फ़ाइल है।
        किसी क्लिप की आवाज़ बिना कुछ बदले सहेजने का तरीक़ा भी यही है &mdash;
        हर सेटिंग को हाथ मत लगाइए और बटन दबा दीजिए।"""

[[faq]]
q = "क्या रफ़्तार बदलने से पिच बदल जाती है?"
a = """
        सिर्फ़ तब, जब आप कहें। &ldquo;पिच वही रखिए&rdquo; रिकॉर्डिंग को क़रीब
        पचास मिलीसेकंड लंबी, एक-दूसरे पर चढ़ी खिड़कियों में काटता है और उन्हें
        पास या दूर करके वापस बिछा देता है, हर जगह को ऐसे चुनते हुए कि लहरें
        जहाँ मिलती हैं वहाँ क़तार में बैठ जाएँ &mdash; आवाज़ 1.5&times; पर भी
        वही आवाज़ रहती है। &ldquo;इसे हिलने दीजिए&rdquo; इसके बजाय रीसैंपल
        करता है, जो टेप को तेज़ चलाने पर होता है: दोगुनी रफ़्तार ठीक एक
        सप्तक ऊपर है।"""

[[faq]]
q = "यह MP3 के बजाय WAV क्यों सहेजता है?"
a = """
        क्योंकि किसी भी ब्राउज़र में MP3 एनकोडर नहीं आता, और यह टूल आपकी
        रिकॉर्डिंग को ऐसे सर्वर पर भेजने से मना कर देता है जिसके पास वह हो।
        WAV को किसी एनकोडर की ज़रूरत ही नहीं &mdash; वह सैंपल हैं और उनके आगे
        चौवालीस बाइट का हेडर &mdash; इसलिए वही ईमानदार विकल्प भी है और अकेला
        ऐसा भी जिसमें क्वालिटी की क़ीमत लग ही नहीं सकती। वह बड़ी ज़रूर होती है:
        स्टीरियो में क़रीब दस मेगाबाइट प्रति मिनट। हर प्लेयर, फ़ोन और एडिटर
        उसे खोल लेता है, और जिसे MP3 चाहिए वह उससे बना सकता है।"""

[[faq]]
q = "मैं कौन-कौन से फ़ॉर्मैट खोल सकता हूँ?"
a = """
        जो भी आपका ब्राउज़र डिकोड करे, यानी व्यवहार में MP3, WAV, FLAC, M4A और
        AAC, Ogg Vorbis तथा Opus, और MP4, M4V, MOV एवं WebM वीडियो के भीतर का
        ऑडियो। जो छूट जाता है वह वही छोटी सूची है जो हर जगह छूटती है: AVI, WMA
        और ज़्यादातर MKV। जिस फ़ाइल को यह ब्राउज़र नहीं पढ़ेगा, उसे बीच रास्ते
        नाकाम होने के बजाय एक संदेश के साथ मना कर दिया जाता है।"""

[[faq]]
q = "क्या ऊँचा करने से आवाज़ बिगड़ जाएगी?"
a = """
        सिर्फ़ तब जब आप उसे पूरे पैमाने से आगे ले जाएँ, और ऐसा करने से पहले
        पेज आपको बता देता है। डिजिटल ऑडियो की एक सख़्त छत होती है: कोई सैंपल
        पूरे पैमाने से ऊँचा हो ही नहीं सकता, इसलिए उससे ऊपर जो कुछ है वह छत से
        टकराकर चपटा हो जाता है &mdash; और यही विकृति की आवाज़ है। &ldquo;जितना
        ऊँचा जा सके&rdquo; वह सेटिंग है जो ऐसा कर ही नहीं सकती &mdash; वह
        हिसाब लगाती है कि रिकॉर्डिंग के पास कितनी जगह बची है और ठीक उतनी ही
        इस्तेमाल करती है। छत से नीचे सब कुछ बस गुणा है और कुछ नहीं: 6 dB ऊपर
        कीजिए और 6 dB वापस नीचे, सैंपल वहीं मिलेंगे जहाँ थे।"""

[[faq]]
q = "क्या उलटने या समय बदलने से क्वालिटी घटती है?"
a = """
        उलटने से नहीं: वही सैंपल दूसरे क्रम में बाहर आते हैं, जो बिलकुल ठीक
        है। रफ़्तार बदलना हर सैंपल को हिला देता है, इसलिए वह नक़ल नहीं, गणित
        है &mdash; रीसैंपलर रास्ते में ठीक से फ़िल्टर करता है, इसलिए तेज़ करने
        पर ऊँचे स्वर मुड़कर धातु जैसी झंकार बनकर वापस नहीं आते, और स्ट्रेचर
        अपनी खिड़कियाँ वहाँ रखता है जहाँ लहरें क़तार में बैठती हैं, न कि वहाँ
        जहाँ गणित उन्हें गिरा दे। इनमें से कोई भी रास्ता कुछ दोबारा एनकोड नहीं
        करता, क्योंकि यहाँ दोबारा एनकोड करने को कोई एनकोडर है ही नहीं।"""

[[faq]]
q = "क्या फ़ाइल की लंबाई पर कोई सीमा है?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है। व्यावहारिक छत मेमोरी है: पूरी
        रिकॉर्डिंग एक साथ इसी पेज में डिकोड होती है, और WAV डाउनलोड से पहले
        मेमोरी में जोड़ी जाती है, इसलिए एक घंटे के स्टीरियो को काम करने के लिए
        क़रीब एक गीगाबाइट से कुछ कम चाहिए। चार गीगाबाइट की WAV सिरे से मना कर
        दी जाती है, क्योंकि फ़ॉर्मैट का अपना साइज़ वाला ख़ाना उतने का ब्योरा
        दे ही नहीं सकता।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को आपकी
        रिकॉर्डिंग के बारे में कुछ नहीं दिया जाता।"""

