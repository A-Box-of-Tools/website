        यह मुफ़्त है, और न अकाउंट है, न साइन-इन, न ट्रायल, न पन्नों की सीमा, न कोई
        वॉटरमार्क। तस्वीरों के साइज़ पर भी कोई सीमा नहीं है, क्योंकि इसका खर्च उठाने
        वाला कोई सर्वर ही नहीं है। काम आपकी अपनी मशीन पर होता है। साइट पर विज्ञापन
        चलते हैं और उन्हीं से इसका खर्च निकलता है, और विज्ञापनों को आपके डॉक्यूमेंट
        के बारे में कुछ नहीं दिया जाता।"""

