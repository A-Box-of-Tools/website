[[privacy]]
title = "आपके डॉक्यूमेंट के जाने के लिए कोई जगह ही नहीं है।"
body = """
 Content-Security-Policy में
      हर वह पता लिखा है जिससे यह पेज बात कर सकता है, और उनमें से एक भी इस साइट का
      नहीं है। यहाँ कोई ऐसा एंडपॉइंट नहीं है जहाँ आपकी तस्वीरें जमा हो सकें, और
