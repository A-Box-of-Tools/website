[[privacy]]
title = "आपके वीडियो के जाने के लिए कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ ऐसा कोई एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइल जमा हो सके, और होता भी तो कोड में ऐसा कुछ नहीं है
      जो उसे भेजता।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं मँगाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा
      है ही नहीं। न चिपकाने को कोई पता, न डाउनलोड करने को कुछ, न पहली बार
      इस्तेमाल पर बाहर से आने वाला कोई इंजन। आपके वीडियो को छूने वाला हर बाइट
      पेज लोड होते ही इसी ऑरिजिन से आ चुका था।"""

[[privacy]]
title = "डिकोड और एनकोड, दोनों आपके ही डिवाइस पर होते हैं।"
body = """
 फ़्रेम आपके अपने
      ब्राउज़र के WebCodecs से गुज़रते हैं, या उसी प्लेबैक इंजन से जो आपको यह
      क्लिप वैसे भी दिखाता है। तैयार फ़ाइल इसी मशीन की मेमोरी में बनती है और
      सीधे डाउनलोड को सौंप दी जाती है।"""

[[privacy]]
title = "फ़ाइल का ज़्यादातर हिस्सा पढ़ा ही नहीं जाता।"
body = """
 टाइमलैप्स को हर
      कुछ सेकंड पर एक ही फ़्रेम चाहिए, इसलिए टूल हर ऐसे पल के आसपास का छोटा-सा
      हिस्सा पढ़ता है और बाकी छोड़ देता है। यह रफ़्तार का फ़ैसला है, प्राइवेसी
      का नहीं, फिर भी जान लेना अच्छा है: आपके अपने डिवाइस पर भी आपके वीडियो का
      बड़ा हिस्सा कभी खुलता ही नहीं।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके वीडियो के
      बारे में कुछ नहीं सौंपा जाता। न फ़ाइल, न फ़्रेम, न नाम, न साइज़, न
      लंबाई। पढ़ने, डिकोड करने, फ़्रेम चुनने या एनकोड करने वाली हर पंक्ति इसी
      ऑरिजिन से आती है और रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक भर है, उससे ज़्यादा कुछ नहीं। वह किसी
      विज़िट की खबर नहीं करता, और उसे आपके या आपके वीडियो के बारे में कुछ
      नहीं दिया जाता।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, और इस पेज का सब कुछ वैसे
      ही चलता रहेगा। इससे आसान सबूत कोई नहीं।"""

[[howto]]
title = "एक वीडियो चुनिए।"
body = """
 MP4, MOV, M4V या WebM को चुनने वाले
      डिब्बे पर खींच लाइए, या हाथ से ढूँढ़कर खोलिए। ब्राउज़र उसे सीधे आपकी
      डिस्क से पढ़ता है, और इस बीच कुछ भी कहीं नहीं जाता।"""

[[howto]]
title = "बताइए कितना तेज़।"
body = """
 दी हुई रफ़्तारों में से कोई दबाइए,
      या अपनी टाइप कीजिए। अगर आपको यह कहना ज़्यादा आसान लगता है कि नतीजा कितना
      लंबा हो, जैसे &ldquo;बीस सेकंड में समा जाए&rdquo;, तो वही लिखिए और
      रफ़्तार अपने आप निकल आएगी।"""

[[howto]]
title = "अंतराल देख लीजिए।"
body = """
 रफ़्तार के नीचे वाली पंक्ति बताती
      है कि असल में होने क्या जा रहा है: असली वीडियो के हर कितने सेकंड पर एक
      फ़्रेम। यही वह संख्या है जो कैमरे पर सेट की जाती है, और शुरू करने से पहले
      एक बार देख लेने लायक भी यही है।"""

[[howto]]
title = "बनाइए और डाउनलोड कीजिए।"
body = """
 काम आपके अपने हार्डवेयर पर
      होता है, इसलिए इसमें कितना समय लगेगा यह आपके डिवाइस पर निर्भर है, किसी
      कतार पर नहीं। तैयार वीडियो सीधे आपके ब्राउज़र के डाउनलोड में चला जाता
      है।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे पढ़ना, डिकोड करना, फ़्रेम चुनना और एनकोड करना, सब आपका अपना
        ब्राउज़र आपके अपने हार्डवेयर पर करता है। इस टूल का कोई सर्वर वाला हिस्सा
        है ही नहीं, और पेज की <code>Content-Security-Policy</code> में हर वह पता
        लिखा है जिससे वह संपर्क कर सकता है &mdash; उनमें से एक भी इस साइट का
        नहीं। मानने से बेहतर जाँचना लगे तो इंटरनेट काटकर एक टाइमलैप्स बनाकर
        देखिए।"""

[[faq]]
q = "रफ़्तार का ठीक-ठीक मतलब क्या है?"
a = """
        जो अंदर गया और जो बाहर आया, उन दोनों का अनुपात। 60&times; पर एक घंटे की
        फ़ुटेज एक मिनट की हो जाती है, चाहे आप उसे किसी भी फ़्रेम रेट पर चलाएँ।
        अंदर टूल हर <em>रफ़्तार &divide; फ़्रेम रेट</em> सेकंड पर एक फ़्रेम
        उठाता है &mdash; 30 फ़्रेम प्रति सेकंड पर 60&times; यानी हर दो सेकंड पर
        एक। शुरू करने से पहले पेज आपको यही अंतराल दिखाता है, क्योंकि असल में हो
        क्या रहा है यह वही संख्या बताती है।"""

[[faq]]
q = "किन वीडियो फ़ॉर्मैट को तेज़ किया जा सकता है?"
a = """
        MP4, M4V और MOV सीधे पढ़े जाते हैं, अंदर चाहे कुछ भी हो: H.264, HEVC,
        AV1 या VP9, बस आपका ब्राउज़र उस कोडेक को डिकोड कर पाता हो। बाकी जो कुछ
        भी आपका ब्राउज़र चला सकता है, सबसे ज़्यादा WebM, उसे ब्राउज़र के अपने
        प्लेयर को हर पल पर ले जाकर पढ़ा जाता है, और यह हर उस फ़ॉर्मैट पर चलता
        है जिसे वह खोल सकता है। जिस फ़ाइल को ब्राउज़र न पढ़ सके न चला सके,
        व्यवहार में AVI, WMV, FLV और ज़्यादातर MKV, उसे बीच रास्ते में अटकने के
        बजाय शुरू में ही साफ़ मना कर दिया जाता है। बाहर हमेशा MP4 ही आता है।"""

[[faq]]
q = "टाइमलैप्स में आवाज़ क्यों नहीं होती?"
a = """
        क्योंकि रखने लायक कुछ बचता ही नहीं। तीस गुना रफ़्तार पर आवाज़ न बोली
        रहती है न संगीत, बस एक चींची रह जाती है। और दूसरा रास्ता, यानी असली
        रफ़्तार की आवाज़ को उस तस्वीर के नीचे रख देना जो कब की आगे निकल चुकी है,
        वह आपकी माँगी हुई क्लिप से अलग ही कोई क्लिप होगी। इसलिए ऑडियो ट्रैक छोड़
        दिया जाता है, और एक घंटे का वीडियो कुछ मेगाबाइट में निकल आने की बड़ी वजह
        भी यही है। अगर आपको आवाज़ अलग से चाहिए तो
        <a href="../edit-audio/">ऑडियो एडिटर</a> उसे सहेज देता है।"""

[[faq]]
q = "क्या यह पूरे वीडियो को बदलने से तेज़ है?"
a = """
        कहीं ज़्यादा, और फ़ाइल को सीधे पढ़ने का मकसद यही है। कोई फ़्रेम तभी
        डिकोड हो सकता है जब उससे पहले वाले कीफ़्रेम से शुरू किया जाए, लेकिन बीच
        वाले फ़्रेम रखने ही पड़ें, ऐसा कहीं नहीं लिखा। इसलिए एक घंटे का 60&times;
        टाइमलैप्स एक लाख की जगह कुछ हज़ार फ़्रेम ही डिकोड करता है। बटन दबाने से
        पहले सारांश बता देता है कि वह कितने पढ़ने वाला है।"""

[[faq]]
q = "क्या इसमें क्वालिटी घटती है?"
a = """
        जो फ़्रेम रखे जाते हैं वे दूसरी बार एनकोड होते हैं, और इतना नुक़सान होता
        है। इससे बचा नहीं जा सकता, क्योंकि तैयार क्लिप उन्हें ऐसे पलों पर
        दिखाती है जिनके लिए असली फ़ाइल में कुछ एनकोड ही नहीं था। हाँ, यह टूल
        यहाँ के बाकी वीडियो टूलों से बिटरेट ज़्यादा ख़र्च करता है, और जानबूझकर।
        दो सेकंड की दूरी वाले दो फ़्रेम में एक-दूसरे जैसा उतना नहीं होता जितना
        एक बटा तीस सेकंड की दूरी वाले दो फ़्रेम में होता है, तो कोडेक के पास
        दोबारा इस्तेमाल करने को कम बचता है, और आम फ़ुटेज के हिसाब से तय किया गया
        आँकड़ा यहाँ चकत्तेदार निकलता।"""

[[faq]]
q = "क्या साइज़ या लंबाई की कोई सीमा है?"
a = """
        टूल में कोई सीमा नहीं रखी गई है, और फ़ाइल एक साथ मेमोरी में भी नहीं जाती
        &mdash; हर पल के आसपास के छोटे-छोटे हिस्से ही पढ़े जाते हैं। असल सीमा
        तैयार टाइमलैप्स है, जो डाउनलोड से पहले मेमोरी में जुड़ता है, और
        टाइमलैप्स तो परिभाषा से ही छोटा होता है। शुरू करने से पहले सारांश बता
        देता है कि वह लगभग कितना बड़ा होगा।"""

[[faq]]
q = "क्या मैं क्लिप का सिर्फ़ एक हिस्सा तेज़ कर सकता हूँ?"
a = """
        यहाँ नहीं। यह टूल पहले फ़्रेम से आख़िरी फ़्रेम तक पूरी क्लिप लेता है।
        जो हिस्सा चाहिए उसे पहले <a href="../trim-video/">वीडियो कटर</a> से काट
        लीजिए, जो एक भी फ़्रेम दोबारा एनकोड किए बिना यह कर देता है, और फिर उसमें
        से निकली फ़ाइल को यहाँ तेज़ कीजिए।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या अकाउंट चाहिए?"
a = """
        यह मुफ़्त है, और कोई अकाउंट, कोई साइन-इन, कोई ट्रायल और कोई वॉटरमार्क
        नहीं है। साइट का ख़र्च विज्ञापन से चलता है, और विज्ञापनों को आपके वीडियो
        के बारे में कुछ नहीं दिया जाता।"""

