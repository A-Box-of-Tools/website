[[privacy]]
title = "सामग्री आपके पाठक तक जाती है, और कहीं नहीं।"
body = """
 टेक्स्ट और फ़ाइलें WebRTC
      डेटा-चैनल से जाती हैं: आपके ब्राउज़र और हर पाठक के ब्राउज़र के बीच
      सीधा, DTLS-एन्क्रिप्टेड कनेक्शन। उस रास्ते में कोई सर्वर नहीं है। एक
      ही नेटवर्क पर तो बाइट इमारत से बाहर भी नहीं जातीं &mdash; एक ही
      वाई-फ़ाई पर दो लैपटॉप सब कुछ लोकल ही बाँट लेते हैं।"""

[[privacy]]
title = "बिचौलिया क्या है, और वह जो कुछ भी देखता है।"
body = """
 सीधे कनेक्शन को एक
      मुलाक़ात चाहिए, इसलिए यह पन्ना &mdash; इस साइट का इकलौता &mdash;
      हमारे एक सर्वर तक एक WebSocket खोलता है। वह लिंक-नाम टाइप करने वाले
      को उसी नाम से साझा करने वाले से मिलाता है, कुछ किलोबाइट की
      बातचीत आगे बढ़ाता है और कुछ नहीं रखता: स्टोरेज में कभी कुछ लिखा ही
      नहीं जाता, और साझा करने वाले के हटते ही कमरा खत्म हो जाता है। वह देख
      सकता है कि कोई नाम इस्तेमाल में है, कौन कब आया-गया, और IP पते। वह
      नहीं देख सकता: टेक्स्ट, फ़ाइलें, किसे अंदर आने दिया गया या किसने
      क्या लिखा &mdash; निजी साझा में दस्तक तक एन्क्रिप्टेड सीधे चैनल से
      जाती है। उसका पूरा कोड रिपॉज़िटरी में इस टूल के कोड के बगल में है।"""

[[privacy]]
title = "कुछ स्टोर नहीं होता - टैब बंद करना ही मिटाना है।"
body = """
 साझा की गई चीज़ सिर्फ़ तब
      तक है जब तक आपका टैब खुला है। बंद कीजिए तो नए पाठकों को कुछ नहीं
      मिलता, और जो पढ़ रहे हैं उनकी प्रति गायब हो जाती है &mdash; हालाँकि
      जो किसी ने पहले कॉपी या डाउनलोड कर लिया, वह उसका है, जैसे कुछ भी जो
      आपने हाथ से थमा दिया हो। जो मसौदा आप टाइप करते हैं वह आपके अपने
      ब्राउज़र की स्टोरेज में रहता है ताकि अगली बार भी मिले, और सिर्फ़
      वहीं; एक-बार वाला चिह्नित करने पर कहीं नहीं रहता।"""

[[privacy]]
title = "लिंक-नाम ही इकलौता राज़ है, और निजी मोड उसका ताला।"
body = """
 जो कोई नाम जानता या
      अनुमान लगा लेता है, वह उसके पीछे का साझा खोल सकता है। इसीलिए सुझाव
      तीन बेतरतीब शब्द होते हैं, इसीलिए हर नाज़ुक चीज़ को ऐसा नाम चाहिए
      जिसका अनुमान न लग सके &mdash; या निजी स्विच, जो पहले से चालू रहता है:
      हर आने वाले पाठक को सीधे चैनल पर अपना परिचय देना होता है, और जब तक आप
      उसे अंदर न आने दें, कुछ नहीं भेजा जाता।"""

[[privacy]]
title = "सीधा कनेक्शन दोनों पक्षों को एक-दूसरे का पता दिखाता है।"
body = """
 पीयर-टु-पीयर का
      यही मतलब है, और पाठक को यह होने से पहले पता चलता है: साझा लिंक खोलना
      सिर्फ़ बिचौलिए से पूछता है कि कोई साझा कर रहा है या नहीं; फिर पन्ना
      साफ़ कहता है कि जुड़ने पर दोनों पक्षों को एक-दूसरे का IP पता दिखेगा,
      और एक क्लिक का इंतज़ार करता है। उस क्लिक तक साझा करने वाले को यह भी
      नहीं मालूम कि पाठक है भी।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं मिलता।"
body = """ विज्ञापन और मापन
      स्क्रिप्टें Google से आती हैं, दान बटन Buy Me a Coffee से। इनमें से किसी को न
      टेक्स्ट मिलता है, न फ़ाइलें, न उनके नाम या आकार, न यह कि कौन जुड़ा। अपवाद है इस
      पन्ने का अपना पता: पाठक के लिंक में लिंक-नाम होता है, और विज्ञापन स्क्रिप्ट वह पता
      पढ़ती है। जो साझा गोपनीय रहना चाहिए, उसे निजी स्विच चाहिए। सामग्री को छूने वाली
      हर पंक्ति इसी ऑरिजिन से परोसी जाती है और रिपॉज़िटरी में दर्ज है।"""

[[howto]]
title = "टेक्स्ट लिखिए, या फ़ाइलें जोड़िए।"
body = """
 एडिटर ही साझा की जाने वाली
      चीज़ है: पाठक के जुड़ते समय उसमें जो है, वही उसे मिलता है, और उसके
      बाद हर बदलाव जुड़े पाठकों तक लाइव पहुँचता है, आपके टाइप करते-करते।
      फ़ाइलें उसी चैनल से जाती हैं, हरेक 200&nbsp;MB तक; पाठक सूची देखते
      हैं और सिर्फ़ वही डाउनलोड करते हैं जो माँगें &mdash; किसी की
      बैंडविड्थ उस फ़ाइल पर खर्च नहीं होती जो उसे चाहिए ही नहीं थी।"""

[[howto]]
title = "टेक्स्ट फ़ॉर्मैटिंग के लायक हो तो Markdown चालू कीजिए।"
body = """
 बस एक स्विच।
      शीर्षक, बोल्ड, सूचियाँ, कोड और लिंक टाइप करते-करते एडिटर के बगल में
      लाइव रेंडर होते हैं, और पाठकों को डिफ़ॉल्ट रूप से फ़ॉर्मैटेड रूप
      मिलता है, स्रोत पर लौटने के टॉगल के साथ। रेंडरर इसी पन्ने के साथ आता
      है और सब कुछ एस्केप करता है: साझा टेक्स्ट पाठक की मशीन पर स्क्रिप्ट
      नहीं बन सकता, चाहे उसे किसी ने भी लिखा हो।"""

[[howto]]
title = "लिंक को नाम दीजिए, या सुझाव ही रहने दीजिए।"
body = """
 नाम ही पता है:
      <code>brave-otter-42</code> कमरे के आर-पार बोला जा सकता है, फ़ोन पर
      पढ़ा जा सकता है, बोर्ड से उतारा जा सकता है। वही इकलौता राज़ भी है:
      किसी निजी चीज़ के लिए या तो ऐसा नाम चुनिए जिसका कोई अनुमान न लगा सके,
      या निजी स्विच पर भरोसा कीजिए। जिस नाम से कोई और अभी साझा कर रहा है वह
      अस्वीकार हो जाता है, और आपका नाम आपके रुकते ही फिर खाली हो जाता है।"""

[[howto]]
title = "तय कीजिए कि कौन अंदर आए।"
body = """
 निजी ही डिफ़ॉल्ट है: हर पाठक
      से अपना परिचय देने को कहा जाता है &mdash; नाम, कोई इशारा, कुछ भी जो
      आप पहचान लें &mdash; और आपको वह संदेश दिखता है, पढ़ने देने या लौटा
      देने के बटन के साथ। परिचय सीधे चैनल से जाता है, इसलिए बिचौलिए तक को
      पता नहीं चलता कि दस्तक किसने दी। खुले साझा के लिए टिक हटा दीजिए, जिसे
      नाम जानने वाला कोई भी पढ़ सके।"""

[[howto]]
title = "साझा करना शुरू कीजिए, और टैब खुला रखिए।"
body = """
 टैब ही सर्वर है: साझा की
      गई चीज़ तब तक पहुँच में है जब तक वह खुला और जागता है, उसके एक पल बाद
      नहीं। लैपटॉप का ढक्कन बंद होना भी उसे खत्म कर देता है। लिंक कॉपी
      कीजिए, या बस नाम बोल दीजिए &mdash; पाठक उसे इस पन्ने के पते के आखिर
      में <code>#नाम</code> की तरह लिख सकता है।"""

[[howto]]
title = "दूसरी तरफ़: पहले सहमति, फिर दस्तक।"
body = """
 लिंक खोलने वाले को पता चलता
      है कि कोई साझा कर रहा है, चेताया जाता है कि सीधा कनेक्शन दोनों को
      एक-दूसरे का नेटवर्क-पता दिखाएगा, और वह सिर्फ़ अपनी मर्ज़ी से जुड़ता
      है। निजी साझा में वह परिचय देकर आपका इंतज़ार करता है। जो उसे मिलता है
      वह आपके संपादन के साथ लाइव बदलता रहता है, और आपके टैब बंद करते ही
      गायब हो जाता है।"""

[[faq]]
q = "क्या कुछ भी, कहीं भी अपलोड होता है?"
a = """
        नहीं। टेक्स्ट और फ़ाइलें एन्क्रिप्टेड WebRTC चैनल से सीधे आपके
        ब्राउज़र से हर पाठक के ब्राउज़र तक जाती हैं। शामिल इकलौता सर्वर
        मुलाक़ात कराता है &mdash; कनेक्शन तय करने की कुछ किलोबाइट &mdash;
