        है: हर सिरा ज़रूरत से दूसरे का पता जान जाता है, जैसे फ़ोन कॉल में।
        पाठक को किसी भी कनेक्शन के बनने से पहले चेताया जाता है और वह सिर्फ़
        अपनी मर्ज़ी से जुड़ता है; तब तक आपको यह भी नहीं मालूम कि उसने लिंक
