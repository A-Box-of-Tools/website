[[privacy]]
title = "आपके लोगो के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा की जा सकें, और कोड में ऐसा कुछ भी नहीं जो
      उन्हें भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। आकार घटाना कैनवस पर एक <code>drawImage</code>
      है; हर आइकन उन्हीं पिक्सलों के आगे <code>src/ico.js</code> या
      <code>src/icns.js</code> का लिखा एक हेडर है, इसी पेज में।"""

[[privacy]]
title = "फ़ाइल का ब्योरा उसके अपने बाइटों से बनता है।"
body = """
 तैयार आइकन के बग़ल में
      दिखती साइज़ की सूची वह सूची नहीं है जो आपने माँगी थी। वह अभी-अभी लिखी गई
      फ़ाइल से <code>readIcoDirectory</code> या <code>readIcnsElements</code>
      के ज़रिए वापस पढ़ी जाती है, ताकि अगर कोई राइटर सेटिंग से कभी टकराए तो
      पेज उसी वक़्त बता दे &mdash; न कि आपको तब पता चले जब Windows कुछ भी न
      खींचे और macOS काग़ज़ का कोरा पन्ना दिखा दे।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपकी तस्वीर के बारे में कुछ नहीं सौंपा जाता। कोई
      फ़ाइल पढ़ने, उसका आकार बदलने या उसे लिखने वाली हर पंक्ति इसी ऑरिजिन से
      आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई क़दम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "तस्वीर चुनिए।"
body = """
 कोई PNG, JPEG, WebP या SVG पिकर पर छोड़
      दीजिए, या कई चुनकर सबको एक साथ बदल डालिए। वर्गाकार सबसे आसान रहती है, और
      256 पिक्सल से ऊपर की किसी भी तस्वीर में हर साइज़ के लिए काफ़ी ब्योरा
      होता है। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है; इस दौरान कुछ भी कहीं
      नहीं भेजा जाता।"""

[[howto]]
title = "जो फ़ाइलें चाहिए, वे चुनिए।"
body = """
 Windows और ब्राउज़र
      <code>.ico</code> पढ़ते हैं; Mac <code>.icns</code> पढ़ता है और दूसरी की
      तरफ़ देखता तक नहीं। इनमें से कोई एक चुनिए, या दोनों, अगर आप जो बना रहे
      हैं वह दोनों जगह जाता है। वेबसाइट को Apple, Android और टाइल वाली
      अतिरिक्त तस्वीरें भी चाहिए, और वही तीसरा डिब्बा है।"""

[[howto]]
title = "बताइए कि आइकन किस काम के लिए है।"
body = """
 वेबसाइट के favicon के लिए 16,
      32 और 48 पिक्सल; Windows ऐप्लिकेशन को 256 भी चाहिए; और जिस ऐप्लिकेशन को
      high-DPI लैपटॉप पर ठीक दिखना है उसे वे बीच के साइज़ चाहिए जो Windows
      125% और 150% स्केलिंग पर माँगता है। जो काम से मेल खाए वह चुनिए, या साइज़
      ख़ुद चुन लीजिए। सूची का हर साइज़ बताता है कि उसे माँगता कौन है।
      <code>.icns</code> में ऐसा कोई चुनाव है ही नहीं: Apple ठीक दस ख़ाने तय
      करता है और दसों भीतर जाते हैं।"""

[[howto]]
title = "आकार और बैकग्राउंड को सँभालिए।"
body = """
 आइकन वर्गाकार होता है और
      ज़्यादातर लोगो नहीं। खाली जगह भरिए तो पूरी तस्वीर ऊपर-नीचे जगह के साथ
      बची रहती है; क्रॉप कीजिए तो बीच का हिस्सा लिया जाता है; खींचिए तो वह
      दब जाती है। पारदर्शिता पारदर्शिता ही रहती है, जब तक आप उसके पीछे बैठने
      को कोई रंग न चुन लें।"""

[[howto]]
title = "डाउनलोड से पहले 16 पिक्सल वाला देख लीजिए।"
body = """
 आइकन सबसे ज़्यादा इसी साइज़
      पर देखा जाएगा, और यही वह जगह है जहाँ पतली लकीरें और छोटे अक्षर ग़ायब हो
      जाते हैं। प्रीव्यू का हर वर्ग आपकी अपनी फ़ाइल से, अपने असली साइज़ पर
      खींचा जाता है। अगर सबसे छोटा वाला धब्बा भर लगे, तो इलाज कोई और सेटिंग
      नहीं, कोई सरल ड्रॉइंग है।"""

[[howto]]
title = "फ़ाइलें ले जाइए।"
body = """
 एक .ico जिसमें हर साइज़ भीतर है, और
      जब आपने वही माँगा हो तो <code>favicon.ico</code> नाम के साथ, क्योंकि
      ब्राउज़र यही पता ढूँढ़ते हैं। अगर आपने वह डिब्बा चुना हो तो बग़ल में एक
      .icns भी, Mac ऐप्लिकेशन बंडल में जाने के लिए तैयार। वेबसाइट वाला सेट भी
      चुन लीजिए और आपको Apple, Android तथा Windows टाइल की तस्वीरें, मैनिफ़ेस्ट,
      और अपने पेज में चिपकाने लायक़ HTML का टुकड़ा भी मिल जाता है। एक अकेली
      फ़ाइल से ज़्यादा जो कुछ भी हो, वह एक ही ज़िप में उतरता है।"""

[[faq]]
q = "क्या मेरी तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं। तस्वीर को आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर डिकोड करता
        और उसका आकार घटाता है, और .ico उन्हीं पिक्सलों से इसी पेज से आए कोड के
        ज़रिए जोड़ी जाती है। इस टूल में किसी भी क़िस्म की कोई नेटवर्क सुविधा
        है ही नहीं &mdash; यह न कभी कुछ लाता है, न कभी कुछ भेजता है &mdash; और
        पेज की <code>Content-Security-Policy</code> उन सारे पतों के नाम गिना
        देती है जिनसे यह संपर्क कर सकता है; उनमें से एक भी इस साइट का नहीं
        है।"""

[[faq]]
q = "favicon.ico में कौन-कौन से साइज़ होने चाहिए?"
a = """
        16, 32 और 48। यह पसंद का मामला नहीं है: 16 वह है जो ब्राउज़र टैब में
        खींचता है, 32 वह जो Windows डेस्कटॉप शॉर्टकट के लिए इस्तेमाल करता है
        और कई ब्राउज़र बुकमार्क के लिए, और 48 वह साइज़ है जिस पर Google किसी
        साइट का आइकन पढ़ता है। इससे बड़ा कुछ भी .ico के भीतर नहीं, उसके बग़ल
        में PNG के रूप में रहना चाहिए &mdash; और यहाँ का वेबसाइट सेट यही बनाता
        है।"""

[[faq]]
q = "Windows ऐप्लिकेशन आइकन को कौन-से साइज़ चाहिए?"
a = """
        16, 32, 48 और 256, यानी वही जो Visual Studio की अपनी डिफ़ॉल्ट app.ico
        में होते हैं। 16 टाइटल बार और Explorer के छोटे व्यू के लिए, 32 डेस्कटॉप
        और टास्कबार के लिए, 48 Explorer के मझोले आइकनों के लिए, और 256 स्टार्ट
        मेन्यू तथा अतिरिक्त-बड़े व्यू के लिए। high-DPI डिस्प्ले पर Windows 20,
        24, 40, 64 और 96 भी माँगता है, और वे न मिलें तो अपने पास मौजूद सबसे
        नज़दीकी साइज़ से उन्हें दोबारा नमूना लेकर बना लेता है &mdash;
        &ldquo;हर स्केल&rdquo; वाला विकल्प उन्हें भीतर रख देता है।"""

[[faq]]
q = "फ़ाइल उस तस्वीर से बड़ी क्यों है जिससे मैंने शुरू किया था?"
a = """
        क्योंकि .ico एक तस्वीर नहीं, कई तस्वीरें हैं, और छोटी वाली बिना दबाए
        सहेजी जाती हैं ताकि उन्हें कोई भी पढ़ सके। 32x32 की प्रविष्टि उसमें जो
        भी हो, ठीक 4,264 बाइट की होती है, और 256x256 की बिना दबी प्रविष्टि 264
        KB की &mdash; इसीलिए 64 से ऊपर के साइज़ डिफ़ॉल्ट रूप से PNG के रूप में
        रखे जाते हैं। &ldquo;हर साइज़ के लिए PNG&rdquo; चुनने पर सबसे छोटी
        फ़ाइल बनती है; हर साइज़ के लिए बिना दबा हुआ चुनने पर सबसे ज़्यादा
        जगहों पर चलने वाली।"""

[[faq]]
q = "PNG और बिना दबी प्रविष्टियों में क्या फ़र्क़ है?"
a = """
        सिर्फ़ यह कि .ico के भीतर पिक्सल सहेजे कैसे जाते हैं। बिना दबी
        प्रविष्टि Windows की मूल व्यवस्था है &mdash; एक बिटमैप हेडर, उलटे रखे
        पिक्सल, और एक-बिट वाला पारदर्शिता मास्क &mdash; और Windows का अब तक
        निकला हर संस्करण उसे पढ़ सकता है। PNG प्रविष्टि आइकन के भीतर ठूँसी गई
        पूरी PNG फ़ाइल है, जो बड़े साइज़ों पर तीन से दस गुना छोटी पड़ती है पर
        Windows Vista के बाद ही समझी जाने लगी। डिफ़ॉल्ट हर एक को वहीं इस्तेमाल
        करता है जहाँ वह जीतती है: 64 पिक्सल तक बिना दबी, उससे ऊपर PNG।"""

[[faq]]
q = "क्या यह 256 पिक्सल से बड़ा आइकन बना सकता है?"
a = """
        नहीं, और कोई नहीं बना सकता। फ़ॉर्मैट हर भुजा को एक ही बाइट में सहेजता
        है, और 0 पहले से बुक है &mdash; उसका मतलब 256 होता है। छत यही है,
        इसलिए 512 पिक्सल की तस्वीर वाली .ico कोई बड़ा आइकन नहीं, टूटी हुई
        फ़ाइल है। अगर आपको 512 चाहिए, तो आपको PNG चाहिए, और वेबसाइट वाला सेट
        Android तथा वेब ऐप की स्प्लैश स्क्रीन के लिए वही शामिल करता है।"""

[[faq]]
q = "क्या यह पारदर्शिता बचाए रखता है?"
a = """
        हाँ, दोनों तरह की प्रविष्टियों में, और अल्फ़ा चैनल के बग़ल में वह
        पुराना एक-बिट वाला मास्क भी लिख देता है ताकि अल्फ़ा पढ़ने के लिए बहुत
        पुराना सॉफ़्टवेयर भी काला डिब्बा खींचने के बजाय आइकन को काटकर दिखाए।
        अकेली फ़ाइल जिसे जान-बूझकर अपारदर्शी बनाया जाता है वह वेबसाइट सेट का
        Apple touch icon है: iOS उसे अपनी टाइल पर चढ़ाता है और पारदर्शिता को
        काला कर देता है, इसलिए उसे आपके बैकग्राउंड रंग पर चपटा कर दिया जाता है,
        जो डिफ़ॉल्ट रूप से सफ़ेद है।"""

[[faq]]
q = "मेरा लोगो चौड़ा वर्डमार्क है। उसका क्या होगा?"
a = """
        कुछ न कुछ तो होगा ही, क्योंकि आइकन वर्गाकार होता है। खाली जगह भरने से
        पूरी चीज़ बची रहती है पर छोटी हो जाती है &mdash; 16 पिक्सल के वर्ग में
        भरा गया वर्डमार्क क़रीब तीन पिक्सल ऊँचा होता है और पढ़ा नहीं जाता।
        बीच से क्रॉप करना आम तौर पर बेहतर काम करता है: लॉकअप में से चिह्न
        निकालिए और उसी को इस्तेमाल कीजिए, जैसा अपने favicon के लिए लगभग हर
        ब्रैंड करता है। कुछ भी डाउनलोड करने से पहले प्रीव्यू दिखा देता है कि
        कौन-सा टिकता है।"""

[[faq]]
q = "वेबसाइट सेट में क्या है, और क्या मुझे वह पूरा चाहिए?"
a = """
        सात PNG, एक web app manifest, एक browserconfig.xml और चिपकाने लायक़
        HTML का एक टुकड़ा। आपको ये इसलिए चाहिए कि .ico सिर्फ़ ब्राउज़रों और
        Windows को ढकती है, उसके आगे कुछ नहीं: iPhone की होम स्क्रीन अपने ही
        एक नाम से 180 पिक्सल की PNG पढ़ती है, Android और हर इंस्टॉल प्रॉम्प्ट
        मैनिफ़ेस्ट पढ़ता है, और स्टार्ट मेन्यू पर पिन की गई टाइल वह XML पढ़ती
        है। इनमें से कोई भी .ico के भीतर नहीं झाँकेगा। सब कुछ यहीं, आपकी मशीन
        पर बनता है, और ज़िप में एक नोट भी रहता है जो बताता है कि कौन-सी फ़ाइल
        किस काम की है।"""

[[faq]]
q = "क्या यह macOS का आइकन भी बना सकता है?"
a = """
        हाँ &mdash; <em>macOS आइकन</em> पर निशान लगाइए और आपको
        <code>.ico</code> के बग़ल में, या उसकी जगह, एक <code>.icns</code> मिल
        जाती है। यह उसी विचार का अलग कंटेनर है, और दोनों में से कोई भी सिस्टम
        दूसरे वाली नहीं पढ़ेगा: Windows को .ico चाहिए और Mac ऐप्लिकेशन बंडल को
        .icns। वहाँ साइज़ चुनने की बात ही नहीं है, क्योंकि Apple ठीक दस ख़ाने
        प्रकाशित करता है &mdash; 16, 32, 64, 128, 256, 512 और 1024 पिक्सल,
        जिनमें से तीन नीचे वाले साइज़ के Retina संस्करण के रूप में दोबारा आते
        हैं। दसों भीतर जाते हैं, सात रेंडर से खींचकर, और इसीलिए .icns बड़ी
        फ़ाइल होती है।"""

[[faq]]
q = ".icns फ़ाइल का इस्तेमाल कैसे करूँ?"
a = """
        ऐप्लिकेशन के लिए वह बंडल में
        <code>YourApp.app/Contents/Resources/</code> पर जाती है और
        <code>Info.plist</code> में <code>CFBundleIconFile</code> के नीचे उसका
        नाम लिखा जाता है; Mac के हर पैकेजिंग टूल में इसके लिए ख़ाना होता है।
        बाक़ी किसी भी चीज़ के लिए, Finder में फ़ाइल चुनिए, Command-C दबाइए,
        फिर जिस फ़ोल्डर या डिस्क इमेज को बदलना है उस पर Get Info कीजिए, ऊपर
        बाएँ कोने के छोटे आइकन पर क्लिक कीजिए और Command-V दबा दीजिए।"""

[[faq]]
q = "क्या यह .icns वही है जो iconutil बनाता है?"
a = """
        वही दस ख़ाने, वही चार-अक्षरी प्रकार, और हर एक में PNG &mdash; यानी
        वही जो <code>iconutil</code> किसी <code>.iconset</code> फ़ोल्डर से
        बनाता है। एक जान-बूझकर रखा फ़र्क़: Apple का टूल एक
        <code>TOC&nbsp;</code> तत्व भी लिखता है, यानी आगे आने वाले प्रकारों और
        लंबाइयों की एक अनुक्रमणिका। यह फ़ॉर्मैट का हिस्सा नहीं, बस एक
        अनुकूलन है &mdash; जिस रीडर के पास वह न हो, वह तत्वों को सिरे से सिरे
        तक चलकर उसी जवाब पर पहुँच जाता है &mdash; और ग़लत अनुक्रमणिका न होने
        से भी बुरी है, इसलिए उसे छोड़ दिया गया है।"""

[[faq]]
q = "क्या मैं एक साथ कई तस्वीरें बदल सकता हूँ?"
a = """
        हाँ। सूची की हर तस्वीर उन्हीं सेटिंग से अपनी अलग .ico बनती है, और पूरा
        ढेर एक ही ज़िप में उतरता है, हर तस्वीर के लिए एक फ़ोल्डर के साथ
        &mdash; वरना उनमें से दो का नाम favicon.ico होता और एक दूसरी के ऊपर
        लिख जाती। आपने जो भी नतीजे चुने हैं, वे हर तस्वीर के लिए बनते हैं। किसी
        भी पंक्ति पर क्लिक करके उस तस्वीर को प्रीव्यू में ले आइए।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        फ़ाइलों की संख्या या साइज़ पर भी कोई सीमा नहीं है, क्योंकि इनका बिल
        चुकाने वाला कोई सर्वर है ही नहीं &mdash; काम आपके अपने डिवाइस पर होता
        है। साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को
        आपकी तस्वीरों के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपका लोगो बदलने के लिए कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

