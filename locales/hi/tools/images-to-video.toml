[[privacy]]
title = "आपकी तस्वीरों के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा की जा सकें, और कोड में ऐसा कुछ भी नहीं जो
      उन्हें भेजता, अगर होता भी। कभी यहाँ <code>connect-src 'none'</code> लिखा
      होता था, जो पूर्ण था; विज्ञापन जोड़ने की क़ीमत वही थी, और यह कह देना भी
      इसी सौदे का हिस्सा है।"""

[[privacy]]
title = "एनकोडिंग स्थानीय है।"
body = """
 WebCodecs आपके ब्राउज़र में चलता है और तैयार
      फ़ाइल सीधे डाउनलोड को सौंप दी जाती है। इस ऐप का कोई सर्वर वाला हिस्सा है
      ही नहीं।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी तस्वीरों के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न थंबनेल, न नाम, न साइज़, न
      गिनती। कोई तस्वीर पढ़ने, डिकोड करने, जोड़ने या एनकोड करने वाली हर पंक्ति
      इसी ऑरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की ख़बर नहीं करता, और उसे आपके या आपकी तस्वीरों के बारे में कुछ
      नहीं दिया जाता। जब तक आप क्लिक न करें, कुछ भी नहीं होता, और क्लिक करने
      पर आप किसी और की साइट पर पहुँचते हैं।"""

[[privacy]]
title = "एक जान-बूझकर रखा अपवाद।"
body = """
 अगर आप &ldquo;किसी वेब पते से
      जोड़िए&rdquo; इस्तेमाल करते हैं, तो तस्वीर लाने के लिए उस सर्वर से संपर्क
      होता है और उसे आपका IP पता दिख जाता है। सिर्फ़ वही तस्वीरें कभी लाई
      जाती हैं जिन्हें आप ख़ुद चिपकाते हैं, और सिर्फ़ भीतर की दिशा में:
      <code>img-src</code> खोला गया है, <code>connect-src</code> नहीं। नीचे
      वाला काउंटर हर उस बाहरी ऑरिजिन के नाम गिना देता है जिससे संपर्क हुआ।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और वेब पते से लाने
      के सिवा इस पेज की हर चीज़ काम करती रहेगी। सबसे आसान सबूत यही है।"""

[[howto]]
title = "अपनी तस्वीरें चुनिए।"
body = """
 पूरा फ़ोल्डर पिकर पर छोड़ दीजिए, या
      फ़ाइलें हाथ से चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है;
      इस दौरान कुछ भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "उन्हें क्रम में लगाइए और तय कीजिए कि हर एक कितनी देर रुके।"
body = """
 क्रम
      बदलने के लिए खींचिए। रुकने का समय फ़्रेम में या सेकंड में दिया जा सकता
      है, या तो एक साथ हर तस्वीर के लिए या एक-एक करके।"""

[[howto]]
title = "रिज़ॉल्यूशन और फ़्रेम दर चुनिए।"
body = """
 &ldquo;सबसे ऊँचे
      रिज़ॉल्यूशन से मिलाइए&rdquo; आपकी सबसे बड़ी तस्वीर के पीछे चलता है;
      तैयार विकल्पों में 4K, 1080p, 720p, वर्गाकार और खड़ा शामिल हैं, और
      इनमें से कोई न जँचे तो मनचाहा आकार भी है।"""

[[howto]]
title = "वीडियो बनाइए और डाउनलोड कीजिए।"
body = """
 एनकोडिंग आपके अपने
      हार्डवेयर पर चलती है, इसलिए कितनी देर लगेगी यह किसी क़तार पर नहीं, आपकी
      मशीन पर निर्भर है। तैयार MP4 सीधे आपके ब्राउज़र के डाउनलोड में चली
      जाती है।"""

[[faq]]
q = "क्या मेरी तस्वीरें कहीं अपलोड होती हैं?"
a = """
        नहीं। आपकी तस्वीरें आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता,
        जोड़ता और एनकोड करता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं,
        और पेज की <code>Content-Security-Policy</code> उन सारे पतों के नाम
        गिना देती है जिनसे यह संपर्क कर सकता है &mdash; उनमें से एक भी इस साइट
        का नहीं है। एकमात्र अपवाद वह वैकल्पिक &ldquo;किसी वेब पते से
        जोड़िए&rdquo; सुविधा है, जो आपकी चिपकाई तस्वीर ले आती है, और उस सर्वर
        को आपका IP पता दिख जाता है।"""

[[faq]]
q = "मैं कौन-कौन से इमेज फ़ॉर्मैट इस्तेमाल कर सकता हूँ?"
a = """
        कोई भी स्थिर तस्वीर का फ़ॉर्मैट जिसे आपका ब्राउज़र डिकोड कर सके, यानी
        व्यवहार में JPG, PNG, WebP, GIF, AVIF और Apple डिवाइसों पर HEIC भी।
        यहाँ अलग से कोई सूची अपडेट रखने की ज़रूरत नहीं है, क्योंकि डिकोड करना
        हमारा नहीं, ब्राउज़र का काम है।"""

[[faq]]
q = "यह कौन-सा वीडियो फ़ॉर्मैट बनाता है?"
a = """
        H.264 वीडियो वाली MP4, जो लगभग हर चीज़ पर चल जाती है। जिस ब्राउज़र में
        WebCodecs नहीं है, वहाँ टूल इसके बजाय WebM रिकॉर्ड करने पर लौट आता है
        &mdash; वही फ़ुटेज, बस ऐसे कंटेनर में जिसे कम एडिटर स्वीकार करते
        हैं।"""

[[faq]]
q = "क्या मैं इसे Blender या After Effects की रेंडर शृंखला के लिए इस्तेमाल कर सकता हूँ?"
a = """
        हाँ &mdash; क्रम-संख्या वाली रेंडर शृंखला के लिए ही तो यह बना है। अपने
        रेंडरर के लिखे फ़्रेम जोड़िए, रुकने का समय हर एक के लिए एक फ़्रेम ही
        रहने दीजिए, और फ़्रेम दर को रेंडर से मिला दीजिए। &ldquo;नाम से क्रम
        में लगाइए&rdquo; उसी तरह गिनता है जैसी आप उम्मीद करेंगे, यानी
        <code>frame_2</code>, <code>frame_10</code> के बाद नहीं, पहले आता है।
        <br><br>
        शुरू करने से पहले एक बात जान लेना अच्छा है: H.264 में अल्फ़ा चैनल होता
        ही नहीं, इसलिए पारदर्शिता आगे ढोने के बजाय पीछे के रंग पर चपटी कर दी
        जाती है। अगर अल्फ़ा बचाना ज़रूरी है, तो फ़्रेम अपने एडिटर में ही
        जोड़िए।"""

[[faq]]
q = "क्या मैं फ़ोटो से टाइमलैप्स बना सकता हूँ?"
a = """
        हाँ, और यह रेंडर शृंखला जैसा ही काम है: हर फ़ोटो को एक ही फ़्रेम के
        लिए रोकिए और कोई फ़्रेम दर चुन लीजिए। 30 fps पर हर तीस फ़ोटो एक सेकंड
        का वीडियो बनती हैं; 12 fps पर वही फ़ोटो ढाई सेकंड चलती हैं।
        <br><br>
        &ldquo;तारीख़ से क्रम में लगाइए&rdquo; कैमरा रोल को वापस उसी क्रम में
        ले आता है जिसमें वह शूट हुआ था, और यह तब मायने रखता है जब फ़ाइलों के
        नाम दोबारा 0001 से शुरू हो गए हों। अलग-अलग साइज़ की फ़ोटो से कोई
        दिक़्क़त नहीं &mdash; &ldquo;सबसे ऊँचे रिज़ॉल्यूशन से मिलाइए&rdquo;
        वीडियो का आकार ऐसा रखता है कि उनमें से किसी को छोटा न करना पड़े।"""

[[faq]]
q = "क्या तस्वीरों की संख्या या वीडियो की लंबाई पर कोई सीमा है?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है। व्यावहारिक छत आपकी अपनी मशीन की
        मेमोरी है, क्योंकि तैयार वीडियो डाउनलोड से पहले वहीं जोड़ा जाता है।
        बहुत बड़े 4K स्लाइडशो सबसे पहले यह अड़चन महसूस कराते हैं।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल। साइट पर
        विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को आपकी तस्वीरों
        के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपकी तस्वीरें प्रोसेस होने कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

[[faq]]
q = "क्या मैं संगीत या कोई साउंडट्रैक जोड़ सकता हूँ?"
a = """
        अभी नहीं। यह टूल सिर्फ़ वीडियो बनाता है: जो MP4 यह लिखता है उसमें एक
        ही वीडियो ट्रैक होता है और कोई ऑडियो ट्रैक नहीं। ज़रूरत हो तो बाद में
        किसी वीडियो एडिटर में साउंडट्रैक जोड़ लीजिए।"""

[schema]
browser_requirements = "JavaScript ज़रूरी है। MP4 में नतीजा चाहिए तो ब्राउज़र में WebCodecs चाहिए; बाक़ी हालात में यह WebM पर लौट आता है।"
