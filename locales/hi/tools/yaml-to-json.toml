[[privacy]]
title = "आप जो पेस्ट करते हैं उसके जाने की कोई जगह नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज संपर्क कर सकता है, और उनमें से एक भी हमारा
      नहीं है। यहाँ ऐसा कोई एंडपॉइंट नहीं है जहाँ पेस्ट की गई कॉन्फ़िग इकट्ठी की जा सके,
      और होता भी तो कोड में ऐसा कुछ नहीं है जो उसे वहाँ भेजे।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 पूरे <code>src/</code> में कहीं
      कोई <code>fetch</code>, कोई <code>XMLHttpRequest</code> और कोई
      <code>sendBeacon</code> नहीं है। दोनों पार्सर और दोनों प्रिंटर इसी पेज के फ़ंक्शन
      हैं जो एक स्ट्रिंग लेते हैं और एक स्ट्रिंग लौटाते हैं।"""

[[privacy]]
title = "यह YAML 1.2 पढ़ता है, इसलिए नॉर्वे नॉर्वे ही रहता है।"
body = """
 YAML 1.1 में
      <code>no</code> एक बूलियन था, और यही वह मशहूर गड़बड़ी है जो नॉर्वे के देश कोड को
      <code>false</code> बना देती है। यहाँ 1.2 पढ़ा जाता है, जहाँ वह वही स्ट्रिंग है जैसा
      दिखता है। दूसरी दिशा में वे शब्द <em>उद्धरण चिह्नों के साथ</em> वापस लिखे जाते हैं,
      क्योंकि फ़ाइल को आगे जो खोलेगा वह अब भी 1.1 का रीडर हो सकता है।
      <code>tests/js/text-convert.test.js</code> दोनों हिस्से जाँचता है।"""

[[privacy]]
title = "जो कन्वर्ज़न ईमानदार नहीं रह सकता, वह रुक जाता है।"
body = """
 YAML में कोई
      ऐंकर, एलियस या टैग कन्वर्ज़न को इस संदेश के साथ खत्म कर देता है कि वह किस लाइन पर
      है, बजाय ऐसा JSON दस्तावेज़ देने के जो चुपचाप कुछ और मतलब रखता हो। JSON के पास
      &ldquo;वही नोड दो बार&rdquo; कहने का कोई तरीका नहीं है, और कोई एक व्याख्या चुनना
      आपके लिए फ़ैसला करना होगा।"""

[[privacy]]
title = "गूगल क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और
      माप वाली स्क्रिप्ट गूगल से आती हैं, और दान वाला बटन Buy Me a Coffee से। इनमें से
      किसी को भी आपके टेक्स्ट का एक अक्षर नहीं दिया जाता। जो भी लाइन उसे पढ़ती, पार्स
      करती या लिखती है, वह इसी ओरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस रहता है,
      क्योंकि इसमें कभी नेटवर्क वाला कदम था ही नहीं। इससे आसान सबूत कोई नहीं।"""

[[howto]]
title = "दिशा चुनिए।"
body = """
 <em>YAML से JSON</em> या <em>JSON से YAML</em>।
      मेन्यू के नीचे लिखी बात बताती है कि उस दिशा में क्या खोता है &mdash; आपके कुछ भी
      पेस्ट करने से पहले, बाद में नहीं।"""

[[howto]]
title = "पेस्ट कीजिए, या फ़ाइल छोड़िए।"
body = """
 जो कुछ आप चुनकर कॉपी कर सकते हैं
      वह सब चलता है। सिलेक्टर पर छोड़ी गई फ़ाइल को आपका अपना ब्राउज़र पढ़कर बॉक्स में डाल
      देता है &mdash; छोड़ने के लिए अपलोड वाला कोई कदम है ही नहीं &mdash; और
      <code>.json</code> या <code>.yaml</code> एक्सटेंशन दिशा भी अपने आप तय कर देता
      है।"""

[[howto]]
title = "इंडेंट चुनिए।"
body = """
 दो स्पेस, चार, या एक टैब। टैब सिर्फ़ JSON के
      लिए दिया जाता है: YAML स्पेस के हिसाब से तय होता है, और उसमें टैब वैध इंडेंट नहीं
      है।"""

[[howto]]
title = "गड़बड़ी वहीं पढ़िए जहाँ गड़बड़ी है।"
body = """
 यहाँ नाकाम होने वाला पार्सर
      &ldquo;पोज़िशन 4193 पर अनपेक्षित टोकन&rdquo; कहने के बजाय बताता है कि उसे क्या
      मिला और किस लाइन तथा किस कॉलम पर। आम तौर पर इतना ही काफ़ी होता है कि कॉन्फ़िग
      फ़ाइल कुछ और खोले बिना ठीक हो जाए।"""

[[howto]]
title = "नतीजा ले जाइए।"
body = """
 कॉपी कीजिए, या फ़ाइल के रूप में डाउनलोड कीजिए,
      जिसका नाम उसी फ़ॉर्मैट पर होगा जिसमें वह निकला।"""

[[faq]]
q = "क्या मेरा YAML कहीं अपलोड होता है?"
a = """
        नहीं। इस पेज के दोनों पार्सर और दोनों प्रिंटर ऐसे फ़ंक्शन हैं जो आपके अपने
        ब्राउज़र में, आपके अपने हार्डवेयर पर चलते हैं। इस टूल में किसी भी तरह की नेटवर्क
        सुविधा नहीं है &mdash; यह कभी कुछ मँगाता नहीं और कभी कुछ भेजता नहीं &mdash; और
        पेज की <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह
        संपर्क कर सकता है, जिनमें से एक भी हमारा नहीं है। डिप्लॉयमेंट कॉन्फ़िग के लिए
        इसे इस्तेमाल करने की वजह भी यही है: उनमें होस्टनेम, बकेट नाम और कभी-कभी कोई
        सीक्रेट भरा होता है जिसे कोई हटाना चाहता था, और उसे किसी और के कन्वर्टर में
        पेस्ट करना उसे दे देना है।"""

[[faq]]
q = "YAML को JSON में बदलने पर क्या खोता है?"
a = """
        टिप्पणियाँ, क्योंकि JSON के पास उन्हें रखने की जगह नहीं है। ऐंकर, एलियस और टैग
        अंदाज़े के बजाय सीधे मना कर दिए जाते हैं &mdash; इनमें से हर एक ऐसा कुछ कहता है
        जो JSON कह ही नहीं सकता, और जो कन्वर्टर चुपचाप कोई व्याख्या चुन लेता, वह आपको ऐसा
        दस्तावेज़ थमा देता जो फ़ाइल की बात नहीं है। दूसरी दिशा कुछ नहीं खोती: हर JSON
        दस्तावेज़ पहले से ही एक YAML दस्तावेज़ है।"""

[[faq]]
q = "मेरे YAML में no लिखा है और JSON में स्ट्रिंग आई। क्यों?"
a = """
        क्योंकि वह स्ट्रिंग ही है, और यहाँ 1.1 नहीं बल्कि YAML 1.2 पढ़ा जाता है। YAML
        1.1 में <code>yes</code>, <code>no</code>, <code>on</code> और
        <code>off</code> बूलियन थे, और यही वह मशहूर गड़बड़ी है जो नॉर्वे के देश कोड को
        <code>false</code> बना देती है। YAML 1.2 ने इसे छोड़ दिया और यह भी: टेक्स्ट के
        अलावा कुछ और सिर्फ़ <code>true</code>, <code>false</code>, <code>null</code> और
        <code>~</code> पढ़े जाते हैं। दूसरी दिशा में वे शब्द <em>उद्धरण चिह्नों के
        साथ</em> वापस लिखे जाते हैं, हालाँकि यहाँ बिना उनके भी वे टेक्स्ट ही पढ़े जाते
        &mdash; क्योंकि फ़ाइल को आगे जो खोलेगा वह शायद ऐसा न करे। PyYAML आज भी डिफ़ॉल्ट
        रूप से 1.1 ही इस्तेमाल करता है। सख़्ती से पढ़ना और सँभलकर लिखना ही वह इकलौता
        मेल है जो दोनों तरफ़ सही रहता है।"""

[[faq]]
q = "क्या यह मेरी कुंजियों का क्रम बनाए रखता है?"
a = """
        हाँ, दोनों दिशाओं में, और यह सुनने में जितना लगता है उससे कठिन है।
        <code>JSON.parse</code> पर बना कोई कन्वर्टर पूर्णांक जैसी दिखने वाली कुंजियों को
        चुपचाप आगे खिसका देता है, तो <code>{"10":a,"2":b}</code> वापस
        <code>{"2":b,"10":a}</code> बनकर आता है। संख्याएँ वही अंक रखती हैं जो आपने टाइप
        किए, इसलिए बीस अंकों वाला कोई खाता नंबर अपने आख़िरी तीन अंक डबल की वजह से नहीं
        खोता। अगर आप उन्हें <em>क्रम में</em> चाहते हैं तो एक चेकबॉक्स है, और वह कुंजियाँ
        जैसी पढ़ी जाती हैं उस हिसाब से क्रम लगाता है, न कि उनके कोड पॉइंट से।"""

[[faq]]
q = "क्या यह एक साथ कई YAML दस्तावेज़ बदल सकता है?"
a = """
        नहीं, और यह कोई एक चुनने के बजाय ऐसा कह देता है। <code>---</code> से अलग की गई
        फ़ाइल में एक से ज़्यादा दस्तावेज़ होते हैं, और JSON में ऐसी कोई शक्ल नहीं है
        जिसका मतलब &ldquo;कई दस्तावेज़&rdquo; हो &mdash; ऐरे बनाना ऐसा दावा होता जो
        फ़ाइल ने कभी किया ही नहीं। इन्हें एक-एक करके बदलिए।"""

[[faq]]
q = "यहाँ YAML फ़ॉर्मैटर क्यों नहीं है?"
a = """
        क्योंकि YAML की कोई दबी हुई शक्ल ऐसी नहीं जिसे लिखना सार्थक हो &mdash; छोटी शक्ल
        फ़्लो स्टाइल है, जो पढ़ी नहीं जाती, और न पढ़ा जाना उस वजह के ठीक उलट है जिसके
        लिए फ़ाइल YAML में रखी जाती है। JSON, XML, HTML और CSS सजाना
        <a href="../json-formatter/">JSON फ़ॉर्मैटर</a> का काम है, और वह YAML भी सजाता
        है।"""

[[faq]]
q = "फ़ाइल कितनी बड़ी हो सकती है?"
a = """
        यहाँ कोई सीमा रखी ही नहीं गई, क्योंकि उसके लिए पैसे देने वाला कोई सर्वर नहीं है।
        असली छत आपकी अपनी डिवाइस है: कुछ मेगाबाइट YAML ठीक रहता है, और बहुत लंबे दस्तावेज़
        में पेज आपसे कीबोर्ड छीनने के बजाय आपके टाइप करने में ठहराव का इंतज़ार करता है और
        फिर बदलता है।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या खाता चाहिए?"
a = """
        यह मुफ़्त है, और कोई खाता नहीं, कोई साइन-इन नहीं, कोई ट्रायल नहीं और आप कितना
        पेस्ट करें इसकी कोई सीमा नहीं। साइट पर विज्ञापन हैं, उन्हीं से इसका खर्च चलता है;
        विज्ञापनों को आपके टेक्स्ट के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहता है। यही सबसे आसान
        तरीका भी है यह साबित करने का कि कुछ अपलोड नहीं हो रहा: जो टूल आपकी कॉन्फ़िग बदलने
        के लिए बाहर भेजता, वह तार निकालते ही रुक जाता।"""

