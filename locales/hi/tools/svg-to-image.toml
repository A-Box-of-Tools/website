[[privacy]]
title = "आपकी कलाकृति के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा की जा सकें, और कोड में ऐसा कुछ भी नहीं जो
      उन्हें भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। पूरा रैस्टराइज़र है आपकी अपनी फ़ाइल का ब्लॉब
      थामे एक <code>&lt;img&gt;</code>, कैनवस पर एक <code>drawImage</code>,
      और एक <code>canvas.toBlob</code>।"""

[[privacy]]
title = "SVG एक दस्तावेज़ है, और यह वह मोड है जिसमें वह कुछ कर नहीं सकता।"
body = """
 SVG अपने भीतर
      <code>&lt;script&gt;</code>, दूर बैठी
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>, कोई
      स्टाइलशीट और कोई वेबफ़ॉन्ट ढो सकती है। <code>&lt;img&gt;</code> के
      ज़रिए खींचे जाने पर वह उसमें होती है जिसे विनिर्देश <em>secure static
      mode</em> कहता है: स्क्रिप्ट चलती ही नहीं और उनमें से एक भी पता लाया
      नहीं जाता। यह ब्राउज़र की गारंटी है, हमारा वादा नहीं, और इसी वजह से यह
      पेज ऐसी फ़ाइल खोल सकता है जो उसने पहले कभी नहीं देखी, बिना इस डर के कि
      वह फ़ाइल घर फ़ोन कर देगी।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपकी ड्रॉइंग के बारे में कुछ नहीं सौंपा जाता। कोई
      फ़ाइल पढ़ने, उसका साइज़ तय करने या उसे खींचने वाली हर पंक्ति इसी ऑरिजिन
      से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई क़दम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "SVG चुनिए।"
body = """
 कोई एक पिकर पर छोड़ दीजिए, या उनका पूरा
      फ़ोल्डर चुनकर सबको एक साथ बदल डालिए। ब्राउज़र फ़ाइल को सीधे आपकी डिस्क
      से पढ़ता है; इस दौरान कुछ भी कहीं नहीं भेजा जाता। हर पंक्ति बताती है कि
      फ़ाइल ख़ुद को किस साइज़ का समझती है &mdash; और तब अलग ढंग से बताती है जब
      वह साइज़ उसके <code>viewBox</code> से आया हो, या इसलिए मान लिया गया हो
      कि फ़ाइल कोई साइज़ घोषित ही नहीं करती।"""

[[howto]]
title = "बताइए कि कितना बड़ा।"
body = """
 फ़ाइल के अपने साइज़ का कोई गुणक
      सबसे तेज़ जवाब है और पूरे ढेर के लिए सही भी: हर ड्रॉइंग अपने ही शुरुआती
      बिंदु से बढ़ती है, इसलिए आइकनों का सेट अनुपात में बना रहता है। वरना कोई
      चौड़ाई, ऊँचाई, सबसे लंबा किनारा, या दोनों भुजाओं वाला डिब्बा बता दीजिए।
      यहाँ बड़ी संख्या की वैसी कोई क़ीमत नहीं लगती जैसी फ़ोटोग्राफ़ के साथ
      लगती है &mdash; ड्रॉइंग को उस साइज़ पर खींचा जाता है, उस तक तानी नहीं
      जाती।"""

[[howto]]
title = "ज़रूरत हो तो high-DPI नक़लें भी जोड़ लीजिए।"
body = """
 फ़ोन और Retina लैपटॉप हर CSS
      पिक्सल के लिए दो या तीन डिवाइस पिक्सल खींचते हैं, इसलिए 200 पिक्सल के
      लोगो के पीछे 400 या 600 पिक्सल की फ़ाइल चाहिए। <code>@2x</code> और
      <code>@3x</code> माँग लीजिए और वे उन्हीं नामों से निकलती हैं जिनकी
      Xcode, Android की टूलिंग और CSS का <code>image-set()</code> &mdash;
      तीनों उम्मीद करते हैं, और हर एक अलग-अलग गोल किए जाने के बजाय पहली से
      ठीक दोगुनी या तिगुनी होती है।"""

[[howto]]
title = "फ़ॉर्मैट चुनिए और पारदर्शिता के बारे में फ़ैसला कीजिए।"
body = """
 जब तक कोई ख़ास वजह न हो,
      PNG: यह नुक़सान-रहित है, पारदर्शिता बचाए रखता है, और सपाट रंग इसमें
      अच्छी तरह दबते हैं। JPEG में पारदर्शिता होती ही नहीं, इसलिए बैकग्राउंड
      का रंग तब भी भरा जाता है जब आप कोई चुनें या न चुनें &mdash; उसके बिना
      हर पारदर्शी पिक्सल काला निकलता है। WebP दोनों काम करता है और फ़ाइल भी
      छोटी बनाता है, बस इतने पुराने सॉफ़्टवेयर की क़ीमत पर जो उसे पढ़ न
      सके।"""

[[howto]]
title = "डाउनलोड से पहले प्रीव्यू देख लीजिए।"
body = """
 उसे वही कोड खींचता है जो फ़ाइल
      लिखता है, आपकी फ़ाइल से, आपकी मशीन पर। ड्रॉइंग के पिक्सल बनते वक़्त दो
      चीज़ें बदलती हैं और दोनों यहीं दिख जाती हैं: आधे पिक्सल चौड़ी बाल जैसी
      लकीर भूरी पड़ जाती है, और कोई भी टेक्स्ट उसी फ़ॉन्ट में खिंचता है जो इस
      कंप्यूटर पर मौजूद है, वेब से लाए गए फ़ॉन्ट में नहीं।"""

[[howto]]
title = "फ़ाइलें ले जाइए।"
body = """
 हर फ़ाइल का अलग डाउनलोड, या पूरा ढेर
      एक ही ज़िप में। नाम उसी SVG के पीछे चलते हैं जिससे वे बनी हैं, नक़लों पर
      <code>@2x</code> और <code>@3x</code> लगाकर, और जिन दो फ़ाइलों का नाम एक
      ही पड़ जाता, उनमें से एक के चुपचाप दूसरी की जगह लेने के बजाय उन्हें
      नंबर दे दिए जाते हैं।"""

[[faq]]
q = "क्या मेरी SVG कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता है,
        उसी इंजन से कैनवस पर खींचता है जो आपकी देखी हर दूसरी तस्वीर रेंडर करता
        है, और डाउनलोड के रूप में वापस दे देता है। इस टूल में किसी भी क़िस्म
        की कोई नेटवर्क सुविधा है ही नहीं &mdash; यह न कभी कुछ लाता है, न कभी
        कुछ भेजता है &mdash; और पेज की <code>Content-Security-Policy</code> उन
        सारे पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है; उनमें से एक
        भी इस साइट का नहीं है।"""

[[faq]]
q = "मुझे SVG को किस साइज़ पर रैस्टराइज़ करना चाहिए?"
a = """
        जो भी उसे पढ़ने वाली चीज़ माँगे, उसमें उस स्क्रीन के डिवाइस पिक्सल
        अनुपात का गुणा कर दीजिए जिस पर वह दिखेगी। जो लोगो 200 CSS पिक्सल घेरता
        है उसे Retina लैपटॉप के लिए 400 और हाल के फ़ोन के लिए 600 चाहिए, और
        यहाँ की <code>@2x</code> तथा <code>@3x</code> नक़लें यही हैं। ऐप आइकन
        या स्टोर लिस्टिंग के लिए स्टोर ख़ुद ठीक संख्या बता देता है और वही
        संख्या है। जब किसी ने कुछ बताया ही न हो, तो सबसे लंबे किनारे पर 1024
        एक काम का डिफ़ॉल्ट है: लगभग हर इस्तेमाल के लिए काफ़ी बड़ा और ईमेल
        करने लायक़ छोटा।"""

[[faq]]
q = "क्या इसे बड़ा करने से क्वालिटी घटती है?"
a = """
        नहीं, और यही वह अकेली जगह है जहाँ यह जवाब ईमानदारी से नहीं है। वेक्टर
        पिक्सल नहीं, निर्देश होते हैं, इसलिए ब्राउज़र जो भी साइज़ माँगा जाए
        उस पर वक्र दोबारा खींच देता है। 24 पिक्सल के आइकन से बने 4000 पिक्सल
        ठीक उतने ही साफ़ हैं जितने 24 थे। जो नहीं हो सकता वह है उलटी दिशा में
        जाना: एक बार PNG बन जाने पर वह बाक़ी हर चीज़ की तरह पिक्सल ही है,
        इसलिए बाद में नतीजे का आकार बदलने के बजाय शुरू में ही उस साइज़ पर
        रैस्टराइज़ कीजिए जो आपको चाहिए।"""

[[faq]]
q = "मेरी SVG में न चौड़ाई है न ऊँचाई। मुझे कौन-सा साइज़ मिलेगा?"
a = """
        <code>viewBox</code> वाला, अगर वह मौजूद हो &mdash; उसकी चौड़ाई और
        ऊँचाई पिक्सल नहीं, यूज़र यूनिट होती हैं, पर फ़ाइल में यही अकेली
        संख्याएँ हैं और ब्राउज़र उन्हें ड्रॉइंग का स्वाभाविक साइज़ मान लेता
        है। अगर viewBox भी न हो, तो पेज पंक्ति के बग़ल में <em>मान लिया
        गया</em> लिख देता है और 300&nbsp;&times;&nbsp;150 इस्तेमाल करता है,
        जिस पर एक <code>&lt;img&gt;</code> उसे खींचता। दोनों ही हालात में आप
        मनचाहा साइज़ बता सकते हैं और फ़ाइल उसी पर खींची जाती है।"""

[[faq]]
q = "PNG में टेक्स्ट अलग क्यों दिखता है?"
a = """
        क्योंकि फ़ॉन्ट SVG के भीतर है ही नहीं। टेक्स्ट खींचने वाली SVG किसी
        फ़ॉन्ट का नाम लेती है और उसे ढूँढ़ना मशीन पर छोड़ देती है, और जो
        फ़ाइल <code>@import</code> से Google Fonts से कोई फ़ॉन्ट खींचती है
        उसे यहाँ कुछ नहीं मिलता: <code>&lt;img&gt;</code> के ज़रिए खींची गई
        SVG को कुछ भी लाने की इजाज़त नहीं, और यही वह नियम है जो उसे आपकी फ़ाइल
        लेकर घर फ़ोन करने से भी रोकता है। इसका हल वही है जो हर डिज़ाइनर पहले
        से जानता है &mdash; एक्सपोर्ट से पहले ड्रॉइंग प्रोग्राम में ही टेक्स्ट
        को पाथ में बदल दीजिए। फिर वह ज्यामिति है, और हर जगह एक जैसा दिखता
        है।"""

[[faq]]
q = "क्या यह एक साथ कई फ़ाइलें बदल सकता है?"
a = """
        हाँ। सूची की हर SVG उन्हीं सेटिंग से रेंडर होती है और पूरा ढेर एक ही
        ज़िप में उतरता है। गुणक &mdash; &ldquo;फ़ाइल जो साइज़ माँगती है उसका
        4&times;&rdquo; &mdash; पूरे ढेर के लिए आम तौर पर सही सेटिंग है,
        क्योंकि हर ड्रॉइंग अपने ही साइज़ से बढ़ती है, न कि सबको एक ही पिक्सल
        संख्या पर ज़बरदस्ती लाया जाता है। किसी भी पंक्ति पर क्लिक करके उसे
        प्रीव्यू में ले आइए।"""

[[faq]]
q = "क्या साइज़ की कोई सीमा है?"
a = """
        ब्राउज़र की, हमारी नहीं। कैनवस किसी किनारे पर 16,384 पिक्सल के आगे कहीं
        हाथ खड़े कर देता है, और iPhone या iPad पर Safari लगभग 1.67 करोड़ पिक्सल
        क्षेत्रफल पर रुक जाता है &mdash; यानी 4096&nbsp;&times;&nbsp;4096। उससे
        ऊपर पेज ख़ाली तस्वीर लौटाने के बजाय आपको चेतावनी देता है &mdash;
        और ख़ाली तस्वीर ही वह चीज़ है जो ब्राउज़र तब देता है जब उसका दम टूट
        जाए: <code>toBlob</code> कुछ भी नहीं लौटाता, और सफ़ाई देने को कोई
        त्रुटि तक नहीं। 10 करोड़ पिक्सल के आगे टूल मना कर देता है, क्योंकि एक
        भी बाइट एनकोड होने से पहले ही वह 400&nbsp;MB का कैनवस है।"""

[[faq]]
q = "पारदर्शिता का क्या होता है?"
a = """
        PNG और WebP में वह बची रहती है। JPEG में अल्फ़ा चैनल होता ही नहीं,
        इसलिए पूरी तस्वीर के पीछे एक रंग भर दिया जाता है, चाहे आप माँगें या न
        माँगें &mdash; उसके बिना हर पारदर्शी हिस्सा काला निकलता, जो JPEG जैसा
        नहीं, किसी गड़बड़ी जैसा लगता। PNG के साथ भी बैकग्राउंड रंग चुनना
        बिलकुल आम ज़रूरत है: वह ड्रॉइंग को छेद छोड़ने के बजाय उसी रंग पर चपटा
        कर देता है।"""

[[faq]]
q = "क्या यह ऐसी SVG पढ़ सकता है जिसमें स्क्रिप्ट या बाहरी तस्वीर हो?"
a = """
        पढ़ तो सकता है, और वह ठीक उतने हिस्से खींचेगा जितने खींचने को ब्राउज़र
        तैयार हो। <code>&lt;img&gt;</code> के ज़रिए लोड हुई SVG <em>secure
        static mode</em> में होती है: स्क्रिप्ट चलती नहीं, बाहरी संदर्भ लाए
        नहीं जाते, और एनिमेशन चलता नहीं &mdash; आपको पहला फ़्रेम ही मिलता है।
        इसलिए जिस फ़ाइल में दूर बैठी <code>&lt;image&gt;</code> हो, उसका वह
        हिस्सा ग़ायब निकलता है। यह ब्राउज़र आपकी तरफ़ से मना कर रहा है, और
        इसी वजह से यह पेज ऐसी फ़ाइल भी बेफ़िक्री से खोल सकता है जो उसने पहले
        कभी नहीं देखी।"""

[[faq]]
q = "इसमें और इमेज रिसाइज़र में क्या फ़र्क़ है?"
a = """
        फ़र्क़ यह है कि स्रोत क्या है। इमेज रिसाइज़र पिक्सल से शुरू करता है
        &mdash; कोई JPEG, कोई PNG &mdash; इसलिए उसे बड़ा करने के लिए ऐसा
        ब्योरा गढ़ना पड़ता है जो कभी था ही नहीं। यह वाला ड्रॉइंग से शुरू करता
        है, इसलिए गढ़ने को कुछ है ही नहीं और फ़िक्र करने लायक़ कोई ऊपरी सीमा
        भी नहीं। अगर आपके पास SVG है, तो साफ़ नतीजा यही देगा; अगर आपके पास
        फ़ोटोग्राफ़ है, तो वह वाला।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        फ़ाइलों की संख्या या साइज़ पर भी कोई सीमा नहीं है, क्योंकि इनका बिल
        चुकाने वाला कोई सर्वर है ही नहीं &mdash; काम आपके अपने डिवाइस पर होता
        है। साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को
        आपकी फ़ाइलों के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपकी कलाकृति रेंडर होने कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

