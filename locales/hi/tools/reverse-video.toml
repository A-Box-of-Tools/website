[[privacy]]
title = "आपके वीडियो के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइल जमा की जा सके, और कोड में ऐसा कुछ भी नहीं जो उसे
      भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा
      है ही नहीं: न चिपकाने को कोई पता, न डाउनलोड करने को कुछ, न पहली बार
      इस्तेमाल पर बाहर से मँगाया जाने वाला कोई इंजन। आपके वीडियो को छूने वाला
      हर बाइट पेज लोड होते ही इसी ऑरिजिन से आया था।"""

[[privacy]]
title = "डिकोड और एनकोड, दोनों स्थानीय हैं।"
body = """
 फ़्रेम आपके अपने ब्राउज़र
      के WebCodecs से गुज़रते हैं, या उसी प्लेबैक इंजन से जो आपको यह क्लिप
      वैसे भी दिखाता। तैयार फ़ाइल इसी मशीन की मेमोरी में बनती है और सीधे
      डाउनलोड को सौंप दी जाती है।"""

[[privacy]]
title = "आवाज़ भी यहीं उलटी जाती है।"
body = """
 किसी ट्रैक को उलटने का मतलब है
      उसे डिकोड करना, और वह डिकोडिंग ब्राउज़र की अपनी है, इसी मशीन पर चलती
      हुई। उसे कुछ भी सुनता नहीं, कुछ भी रखता नहीं, और कुछ भी उसे कहीं भेज
      नहीं सकता: यहाँ कोड का ऐसा कोई रास्ता ही नहीं जो एक बाइट भेजता हो।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके वीडियो के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न फ़्रेम, न नाम, न साइज़, न
      लंबाई। पढ़ने, डिकोड करने, उलटने या एनकोड करने वाली हर पंक्ति इसी ऑरिजिन
      से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की ख़बर नहीं करता, और उसे आपके या आपके वीडियो के बारे में कुछ
      नहीं दिया जाता।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और इस पेज की हर
      चीज़ काम करती रहेगी। सबसे आसान सबूत यही है।"""

[[howto]]
title = "कोई वीडियो चुनिए।"
body = """
 MP4, MOV, M4V या WebM पिकर पर छोड़
      दीजिए, या हाथ से चुन लीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है; इस
      दौरान कुछ भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "आवाज़ के बारे में फ़ैसला कीजिए।"
body = """
 &ldquo;आवाज़ भी उलट
      दीजिए&rdquo; ट्रैक को सैंपल-दर-सैंपल उलट देता है, और इसी से बोली चुप्पी
      के बजाय उलटी दिशा में चलती बोली बनकर निकलती है। बिना आवाज़ वाली क्लिप के
      लिए इसे बंद कर दीजिए, जो तेज़ भी पड़ता है।"""

[[howto]]
title = "तय कीजिए कि क्वालिटी कितनी ख़र्च करनी है।"
body = """
 तस्वीर को दोबारा
      एनकोड करना ही पड़ेगा, क्योंकि फ़्रेम ऐसे क्रम में बाहर आते हैं जिसके लिए
      फ़ाइल में कुछ भी कोड नहीं किया गया था। &ldquo;संतुलित&rdquo; उसे लगभग
      उतने के आसपास रखता है जितना असली फ़ाइल ने ख़र्च किया था; &ldquo;सबसे
      अच्छी क्वालिटी&rdquo; उससे ज़्यादा ख़र्च करती है।"""

[[howto]]
title = "इसे उलटिए और डाउनलोड कीजिए।"
body = """
 काम आपके अपने हार्डवेयर पर
      होता है, इसलिए कितनी देर लगेगी यह किसी क़तार पर नहीं, आपकी मशीन पर
      निर्भर है। तैयार वीडियो सीधे आपके ब्राउज़र के डाउनलोड में चला जाता है।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता, डिकोड करता,
        उलटता और एनकोड करता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और
        पेज की <code>Content-Security-Policy</code> उन सारे पतों के नाम गिना
        देती है जिनसे यह संपर्क कर सकता है &mdash; उनमें से एक भी इस साइट का
        नहीं है। बताया जाना अगर काफ़ी न लगे तो इंटरनेट काटकर कोई क्लिप उलटकर
        देख लीजिए।"""

[[faq]]
q = "मैं कौन-कौन से वीडियो फ़ॉर्मैट उलट सकता हूँ?"
a = """
        MP4, M4V और MOV सीधे पढ़े जाते हैं, उनके भीतर जो भी हो: H.264, HEVC,
        AV1 या VP9 &mdash; बशर्ते आपका ब्राउज़र उस कोडेक को डिकोड कर सके।
        बाक़ी जो कुछ आपका ब्राउज़र चला सकता है &mdash; सबसे ज़ाहिर तौर पर WebM
        &mdash; उसे इसके बजाय ब्राउज़र के अपने प्लेयर को उसमें उलटी दिशा में
        क़दम-दर-क़दम चलाकर उलटा जाता है, जो चलता तो है पर धीमा है। जिस फ़ाइल को
        ब्राउज़र न पढ़ सके न चला सके &mdash; यानी व्यवहार में AVI, WMV, FLV और
        ज़्यादातर MKV &mdash; उसे बीच रास्ते नाकाम होने के बजाय एक संदेश के साथ
        मना कर दिया जाता है। बाहर हमेशा MP4 ही आती है।"""

[[faq]]
q = "क्या आवाज़ भी उलट जाती है?"
a = """
        हाँ, जब तक आप उसे बंद न कर दें। पूरा ट्रैक डिकोड होता है, सैंपल दूसरे
        क्रम में रख दिए जाते हैं, और वह AAC के रूप में दोबारा एनकोड होता है।
        उस दूसरे एनकोड से बचने का कोई रास्ता नहीं: ऑडियो का एक पैकेट कुछ दसियों
        मिलीसेकंड की आवाज़ है जो अपने से पहले वाले पैकेट के हिसाब से कोड की गई
        है, इसलिए पैकेटों को उलटे क्रम में लिख देने पर छोटे-छोटे टुकड़े सीधी
        दिशा में, पर ग़लत क्रम में बजते &mdash; और यह उलटने जैसा नहीं, किसी
        ख़राबी जैसा सुनाई देता।"""

[[faq]]
q = "क्या उलटने से क्वालिटी घटती है?"
a = """
        तस्वीर दूसरी बार एनकोड होती है, जिसमें थोड़ी क़ीमत लगती है। यहाँ उससे
        वैसे नहीं बचा जा सकता जैसे काटते वक़्त बचा जा सकता है: उलटी हुई क्लिप
        अपने फ़्रेम ऐसे क्रम में दिखाती है जिसके लिए असली फ़ाइल में कुछ भी कोड
        नहीं किया गया था, इसलिए हर फ़्रेम नए सिरे से लिखना ही पड़ता है। टूल जो
        नहीं करेगा वह यह कि असली फ़ाइल से ज़्यादा ख़र्च करे, क्योंकि उससे ऊपर
        एनकोड करने से फ़ाइल बस बड़ी होती है, दिखने में बेहतर नहीं।"""

[[faq]]
q = "क्या वीडियो के साइज़ या लंबाई पर कोई सीमा है?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है, और फ़ाइल एक साथ पूरी मेमोरी में
        नहीं पढ़ी जाती &mdash; उस पर उलटी दिशा में, फ़्रेमों के एक-एक समूह करके
        चला जाता है। व्यावहारिक छतें दो हैं: तैयार वीडियो, जो डाउनलोड से पहले
        मेमोरी में जोड़ा जाता है, और आवाज़, जिसे पूरा थामे रखना पड़ता है
        क्योंकि उलटने के लिए पहला सैंपल लिखने से पहले आख़िरी सैंपल चाहिए।"""

[[faq]]
q = "कुछ फ़ाइलों पर यह दूसरों से धीमा क्यों है?"
a = """
        क्योंकि भीतर जाने के दो रास्ते हैं। MP4 या MOV को यह टूल सीधे पढ़ता है
        और एक बार में फ़्रेमों के एक समूह जितना डिकोड करता है, जो उतना ही तेज़
        है जितनी आपकी मशीन चलती है। बाक़ी हर चीज़ को ब्राउज़र के अपने प्लेयर
        से क्लिप का एक-एक पल माँगकर उलटा जाता है, और उनमें से हर छलाँग पर
        ब्राउज़र को अपने से पहले वाले कीफ़्रेम से डिकोड करना पड़ता है। शुरू
        करने से पहले पेज बता देता है कि वह इनमें से कौन-सा इस्तेमाल कर रहा है,
        और क्यों।"""

[[faq]]
q = "क्या मैं क्लिप का सिर्फ़ एक हिस्सा उलट सकता हूँ?"
a = """
        यहाँ नहीं। यह टूल पूरी चीज़ उलटता है: जो क्लिप बाहर आती है वह ठीक उतनी
        ही लंबी है जितनी भीतर गई थी, बस आख़िरी फ़्रेम सबसे पहले। जो हिस्सा
        चाहिए उसे पहले <a href="../trim-video/">वीडियो कटर</a> से काट लीजिए
        &mdash; जो यह एक भी फ़्रेम दोबारा एनकोड किए बिना कर देता है &mdash; और
        फिर उसमें से जो निकले उसे उलटिए।"""

