[[privacy]]
title = "आपके वीडियो के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइल जमा की जा सके, और कोड में ऐसा कुछ भी नहीं जो उसे
      भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा
      है ही नहीं: न चिपकाने को कोई पता, न डाउनलोड करने को कुछ, न पहली बार
      इस्तेमाल पर बाहर से मँगाया जाने वाला कोई इंजन। आपके वीडियो को छूने वाला
      हर बाइट पेज लोड होते ही इसी ऑरिजिन से आया था।"""

[[privacy]]
title = "डिकोडिंग स्थानीय है।"
body = """
 फ़्रेम आपके अपने ब्राउज़र के WebCodecs
      से गुज़रते हैं, या उसी प्लेबैक इंजन से जो आपको यह क्लिप वैसे भी दिखाता।
      किसका इस्तेमाल हुआ, यह पेज के सिरे पर लिखा होता है, क्योंकि इससे बदल
      जाता है कि फ़्रेम चुने कैसे जाते हैं, और आपको यह दिखना चाहिए।"""

[[privacy]]
title = "GIF यहीं लिखी जाती है, ऐसे कोड से जिसे आप पढ़ सकते हैं।"
body = """
 पैलेट,
      डिदरिंग और LZW कंप्रेशन, तीनों इस टूल के अपने फ़ोल्डर की करीब छह सौ
      पंक्तियाँ भर हैं। न कोई एनकोडर सेवा, न चलते वक्त बाहर से लाई जाने वाली
      कोई लाइब्रेरी, और इन सबमें कहीं ऐसी जगह भी नहीं जहाँ से कोई तस्वीर भेजी
      जा सके।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके वीडियो के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न फ़्रेम, न नाम, न साइज़, न
      लंबाई, न वह हिस्सा जिस पर आपने निशान लगाया। पढ़ने, नमूना लेने,
      क्वांटाइज़ करने या एनकोड करने वाली हर पंक्ति इसी ऑरिजिन से आती है और
      रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की खबर नहीं करता, और उसे आपके या आपके वीडियो के बारे में कुछ
      नहीं दिया जाता।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और इस पेज की हर
      चीज़ काम करती रहेगी। सबसे आसान सबूत यही है।"""

[[howto]]
title = "कोई वीडियो चुनिए।"
body = """
 MP4, MOV, M4V या WebM पिकर पर छोड़
      दीजिए, या हाथ से चुन लीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है;
      इस दौरान कुछ भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "हिस्से पर निशान लगाइए।"
body = """
 क्लिप चलाइए और जहाँ उसे शुरू होना
      चाहिए वहाँ <kbd>I</kbd> दबाइए तथा जहाँ खत्म होना चाहिए वहाँ
      <kbd>O</kbd>, या फिर पट्टी पर बनी मुठियाँ खींच दीजिए। GIF कुछ ही सेकंड
      की होती है, और बाकी दोनों से कहीं ज़्यादा यही सेटिंग तय करती है कि
      फ़ाइल छोटी रहेगी या विशाल हो जाएगी।"""

[[howto]]
title = "चौड़ाई और फ़्रेम दर चुनिए।"
body = """
 480 पिक्सल चौड़ाई और बारह
      फ़्रेम प्रति सेकंड, GIF के ज़्यादातर कामों के लिए ठीक बैठते हैं। चौड़ाई
      आधी कीजिए तो पिक्सल चौथाई रह जाते हैं; बारह फ़्रेम प्रति सेकंड गति की
      तरह ही पढ़े जाते हैं, बिना उनकी कीमत चुकाए जो किसी को दिखते ही
      नहीं।"""

[[howto]]
title = "इसे बनाइए, और डाउनलोड कीजिए।"
body = """
 फ़्रेम पढ़े जाते हैं, पूरे
      एनिमेशन के लिए 256 रंगों का एक ही पैलेट चुना जाता है, और हर फ़्रेम में
      तस्वीर का सिर्फ़ वही हिस्सा लिखा जाता है जो बदला। तैयार होते ही वह पेज
      पर चलने लगती है, और डाउनलोड में आपको वही फ़ाइल मिलती है।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता है, उसका
        नमूना लेता है और उसे बदलता है। इस टूल का कोई सर्वर वाला हिस्सा है ही
        नहीं, और पेज की <code>Content-Security-Policy</code> उन सारे पतों के
        नाम गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस साइट
        का नहीं है। सिर्फ़ बता देने से बात न बने, तो इंटरनेट काटकर कोई GIF
        बनाकर देख लीजिए।"""

[[faq]]
q = "मैं कौन-कौन से वीडियो फ़ॉर्मैट बदल सकता हूँ?"
a = """
        MP4, M4V और MOV सीधे पढ़े जाते हैं, उनके भीतर जो भी हो, यानी H.264,
        HEVC, AV1 या VP9, बशर्ते आपका ब्राउज़र उस कोडेक को डिकोड कर सके। बाकी
        जो कुछ आपका ब्राउज़र चला सकता है, सबसे ज़ाहिर तौर पर WebM, उसके लिए
        प्लेयर को हर पल पर ले जाकर पढ़ा जाता है। यह धीमा है, और इस बारे में
        थोड़ा कम सटीक भी कि कौन-सा फ़्रेम कहाँ गिरेगा। और जिस फ़ाइल को
        ब्राउज़र न पढ़ सके न चला सके, यानी व्यवहार में AVI, WMV, FLV और
        ज़्यादातर MKV, उसे बीच रास्ते नाकाम होने के बजाय एक संदेश के साथ मना
        कर दिया जाता है।"""

[[faq]]
q = "मेरी GIF इतनी बड़ी क्यों है?"
a = """
        क्योंकि GIF 1987 का फ़ॉर्मैट है जो गति नहीं, पूरी-पूरी तस्वीरें सहेजता
        है। पाँच सेकंड की क्लिप से ऐसी GIF बनाने का कोई रास्ता ही नहीं जो उतनी
        छोटी हो जितनी वह पाँच सेकंड की MP4 थी जिससे वह बनी। वीडियो से बनी GIF
        आम तौर पर वीडियो से दस गुना बड़ी होती है। इसे असल में तीन सेटिंग तय
        करती हैं, और इसी क्रम में। हिस्सा कितना लंबा है, तस्वीर कितनी चौड़ी
        है, और एक सेकंड में कितने फ़्रेम हैं। चौड़ाई आधी कीजिए तो पिक्सल
        चौथाई रह जाते हैं, और कीमत पिक्सल ही लेते हैं।"""

[[faq]]
q = "सिर्फ़ 256 रंग क्यों?"
a = """
        फ़ॉर्मैट यही है: GIF ज़्यादा से ज़्यादा 256 रंगों की एक तालिका ढोती है
        और हर पिक्सल को उसी में की एक संख्या के रूप में सहेजती है। यह टूल उन
        256 को इस तरह चुनता है कि आपके हिस्से के हर फ़्रेम के रंग गिने जाएँ और
        उन्हें 256 समूहों में बाँट दिया जाए, यानी median cut वाला मानक तरीका,
        ताकि पैलेट रंगों के किसी तयशुदा सेट के बजाय आपकी क्लिप पर फ़िट
        बैठे। जहाँ कोई रंग नदारद हो, वहाँ डिदरिंग सबसे नज़दीकी दो रंग
        मिला देती है, ताकि कोई ग्रेडिएंट धारियाँ बनने के बजाय ग्रेडिएंट ही
        बना रहे।"""

[[faq]]
q = "डिदरिंग वाली सेटिंग करती क्या है?"
a = """
        वह थोड़े-से शोर के बदले बहुत सारी पट्टियाँ बचा लेती है। चालू रहने पर
        वह आसमान, जो वरना चार सपाट पट्टियाँ बन जाता, ग्रेडिएंट ही बना रहता है
        है, बस एक हल्की बनावट और थोड़ी बड़ी फ़ाइल की कीमत पर। बंद रहने पर
        तस्वीर ज़्यादा सपाट और फ़ाइल छोटी रहती है, जो स्क्रीन रिकॉर्डिंग,
        लकीरों वाली कला और पहले से सपाट रंगों से बनी हर चीज़ पर जँचता है।
        यहाँ इस्तेमाल होने वाला डिदर error-diffusion वाला नहीं, क्रमित
        (ordered) है, इसलिए न बदलने वाला बैकग्राउंड फ़्रेमों के बीच झिलमिलाने
        के बजाय बिलकुल स्थिर रहता है।"""

[[faq]]
q = "क्या लंबाई या साइज़ पर कोई सीमा है?"
a = """
        सीमा हिस्से पर है, और वह किसी नियम से नहीं, मेमोरी से आती है। पैलेट
        चुनते वक्त उसका हर फ़्रेम एक साथ थामे रखा जाता है, इसलिए पेज हिसाब
        लगा लेता है कि आपकी सेटिंग की कीमत क्या पड़ेगी और शुरू करने से पहले
        बता देता है। वह टैब को मेमोरी खत्म होकर गायब हो जाने देने के बजाय
        मना कर देता है। छोटा हिस्सा, कम चौड़ाई या कम फ़्रेम दर, तीनों उसे
        नीचे ले आते हैं।"""

[[faq]]
q = "क्या इसमें आवाज़ बची रहती है?"
a = """
        GIF आवाज़ ढो ही नहीं सकती। इस फ़ॉर्मैट का ऐसा कोई संस्करण है ही नहीं
