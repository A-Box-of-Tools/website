[[howto]]
title = "इमेज चुनिए।"
body = """
 स्क्रीनशॉट, स्कैन या फ़ोटो, जो भी आपका ब्राउज़र खोल
      सकता है। वह सीधे आपकी डिस्क से पढ़ी जाती है और इस दौरान कुछ भी कहीं नहीं
      जाता।"""

[[howto]]
title = "जो नहीं दिखना चाहिए उस पर बॉक्स खींचिए।"
body = """
 फिर अगली चीज़ पर एक और।
      बॉक्स को खींचकर हिलाया जा सकता है, उसके हैंडल से आकार बदला जा सकता है, या Tab
      से उस तक पहुँचकर तीर वाली कुंजियों से काम किया जा सकता है। बॉक्स के नीचे जो
      दिखता है वही असली नतीजा है, और उसे वही कोड बनाता है जो आगे चलकर फ़ाइल
      लिखेगा।"""

[[howto]]
title = "काला, पिक्सेलेट या ब्लर चुनिए, और हो सके तो काला ही चुनिए।"
body = """
 काला भरने पर
      कुछ भी नहीं बचता। पिक्सेलेट और ब्लर पिक्सेल की जगह उन्हीं के औसत रख देते हैं,
      जो पीछे खड़े किसी चेहरे के लिए काफ़ी है और ऐसी किसी चीज़ के लिए काफ़ी नहीं जो
      अक्षरों की तरह पढ़ी जा सके।"""

[[howto]]
title = "&bdquo;छिपाकर सेव कीजिए&ldquo; दबाइए, फिर फ़ाइल जाँचिए।"
body = """
 उसके बाद जो इमेज
      दिखती है वह तैयार फ़ाइल ही है, दोबारा खोलकर दिखाई गई। उसे किसी एडिटर में खोलकर
      लेयर ढूँढिए, या ढके हुए अक्षरों को चुनकर देखिए। वहाँ एक सपाट इमेज भर है, और
      जो हिस्सा आपने ढका था वह फ़ाइल लिखे जाने से पहले ही ऊपर से लिख दिया गया
      था।"""

[[faq]]
q = "क्या मेरी इमेज कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को खोलने, उस पर काम करने और दोबारा लिखने का सारा काम आपका अपना
        ब्राउज़र आपके अपने डिवाइस पर करता है। इस टूल में नेटवर्क का कोई काम है ही
        नहीं, यह न कभी कुछ मँगाता है और न भेजता है, और पेज की
        <code>Content-Security-Policy</code> में हर वह पता लिखा है जिससे यह बात कर
        सकता है, जिनमें से एक भी हमारा नहीं है। पेज एक बार खोल लीजिए, फिर इंटरनेट
        बंद कर दीजिए, यह वैसे ही चलता रहेगा।"""

[[faq]]
q = "क्या ढका हुआ हिस्सा सचमुच फ़ाइल से चला जाता है?"
a = """
        हाँ, और यही इस टूल के होने की वजह है। इमेज पिक्सेल के एक बफ़र में खुलती है,
        बॉक्स अपने अंदर के पिक्सेल पर ऊपर से लिख देते हैं, और फिर वही बफ़र नई फ़ाइल
        के रूप में लिखा जाता है। एनकोडर को कुछ मिलने से पहले ही पुराने मान मेमोरी से
        जा चुके होते हैं, इसलिए न कोई लेयर छिपाने को बचती है, न कोई एनोटेशन हटाने को,
        न कोई हिस्ट्री पलटने को। जाँच वैसे ही कीजिए जैसे आप किसी और के दावे की करते।
        नतीजे को किसी इमेज एडिटर में खोलकर दूसरी लेयर ढूँढिए, या जो अक्षर आपने ढके थे
        उन्हें चुनकर देखिए।"""

[[faq]]
q = "क्या पिक्सेलेट या ब्लर किया हुआ हिस्सा वापस पढ़ा जा सकता है?"
a = """
        कभी-कभी हाँ, और चुनने से पहले पढ़ने लायक बात बस यही है। काला भरने पर नीचे की
        हर चीज़ एक ही रंग में बदल जाती है, इसलिए कुछ नहीं बचता: न कोई किनारा, न कोई
        औसत, न यह कि कितने अक्षर थे। पिक्सेलेट हर ब्लॉक की जगह उस ब्लॉक का औसत रंग रख
        देता है, और औसतों की यह जाली अब भी इस बात की एक नाप है कि नीचे क्या था। आम
        फ़ॉन्ट में लिखे और अंदाज़े लायक आकार वाले अक्षरों के लिए इतनी सी नाप से ही
        मूल पाठ वापस निकाला जा चुका है, और यह छपे हुए शोध में दर्ज है: संभावित शब्द
        उसी तरह बनाइए, उसी तरह पिक्सेलेट कीजिए और औसत मिलाइए। ब्लर एक कनवॉल्यूशन है,
        और कनवॉल्यूशन सैद्धांतिक रूप से उलटा किया जा सकता है। तो पीछे खड़े किसी चेहरे
        को पिक्सेलेट कर दीजिए, और जो कुछ अक्षरों की तरह पढ़ा जा सकता है उसे काला कर
        दीजिए।"""

[[faq]]
q = "किसी डॉक्युमेंट प्रोग्राम में काला आयत बना देना अलग बात क्यों है?"
a = """
        क्योंकि ज़्यादातर प्रोग्राम उस आयत को इमेज के अंदर नहीं, इमेज के बगल में सेव
        करते हैं। PDF रीडर, स्लाइड, वर्ड प्रोसेसर या लेयर वाले इमेज एडिटर में बनाई
        गई आकृति एक ऑब्जेक्ट है जिसकी अपनी जगह है और जो पेज के ऊपर रखी है। उसे
        खिसकाइए, मिटाइए, या फ़ाइल किसी दूसरे प्रोग्राम में खोलिए, नीचे जो था वही
        वापस आ जाता है। अख़बारों, अदालतों और मंत्रालयों तक ने इसी तरह दस्तावेज़
        सार्वजनिक कर दिए हैं। यहाँ वह आयत सेव होता ही नहीं। जो बचता है वह पिक्सेल के
        मान हैं, पुराने मानों के ऊपर लिखे हुए।"""

[[faq]]
q = "क्या EXIF और GPS डेटा भी हट जाता है?"
a = """
        हाँ, साथ में। यहाँ सेव करने का मतलब है पिक्सेल से भरे एक कैनवस को लिखना, और
        कैनवस कोई टैग नहीं रखता। इसलिए जगह, कैमरे का मॉडल, तारीख़-समय और अंदर बैठा
        थंबनेल नई फ़ाइल में लिखे ही नहीं जाते। थंबनेल यहाँ ख़ास तौर पर मायने रखता है:
        यह इमेज की एक छोटी दूसरी कॉपी है, फ़ोटो में बदलाव के बाद हमेशा दोबारा नहीं
        बनती, और छिपाई गई फ़ोटो अगर बिना छिपाया थंबनेल लेकर निकल जाए तो सारी मेहनत
        बेकार है। अगर आप चाहते हैं कि मेटाडेटा हटे पर इमेज दोबारा एनकोड न हो, तो
        <a href="../exif-editor/">EXIF व्यूअर और रिमूवर</a> इमेज के बजाय कंटेनर
        दोबारा लिखता है।"""

[[faq]]
q = "यह कौन से फ़ॉर्मैट पढ़ और लिख सकता है?"
a = """
        जो कुछ आपका ब्राउज़र खोल सकता है वह सब पढ़ता है, यानी व्यवहार में JPEG, PNG,
        WebP, GIF, BMP और आजकल के ज़्यादातर ब्राउज़र में AVIF भी। लिखता है JPEG, PNG
        और WebP, क्योंकि ब्राउज़र के साथ यही एनकोडर आते हैं। &bdquo;ऑटो&ldquo; पर JPEG
        वापस JPEG ही आता है और बाकी सब PNG, जिससे फ़ोटो का साइज़ फ़ोटो जितना रहता है
        और स्क्रीनशॉट पर खुला छोड़ा गया लिखा हुआ साफ़ रहता है। छिपाने पर इस चुनाव से
        कोई फ़र्क नहीं पड़ता: एनकोडर जब उन्हें देखता है, पिक्सेल तब तक जा चुके होते
        हैं।"""

[[faq]]
q = "क्या माउस के बिना भी यह किया जा सकता है?"
a = """
        हाँ। &bdquo;बीच में एक बॉक्स जोड़ें&ldquo; से एक बॉक्स इमेज पर आ जाता है, Tab
        से एक बॉक्स से दूसरे पर जाया जाता है, तीर वाली कुंजियाँ चुने हुए बॉक्स को
        हिलाती हैं और Alt के साथ तीर उसका आकार बदलते हैं। Shift दबाए रखने पर हर कदम दस
        पिक्सेल का होता है और Delete उसे हटा देता है। हर बॉक्स के लिए इमेज के नीचे एक
        पंक्ति भी रहती है जिसमें उसका आकार, जगह, वह क्या करता है और हटाने का बटन होता
        है, इसलिए पूरा टूल कीबोर्ड से चलता है और स्क्रीन रीडर से पढ़ा जा सकता है।"""

[[faq]]
q = "क्या यह फ़ोन पर चलता है?"
a = """
        हाँ। बॉक्स खींचना, हिलाना और आकार बदलना माउस इवेंट के बजाय पॉइंटर इवेंट से
        होता है, इसलिए उँगली से भी वैसे ही चलता है, और टच स्क्रीन पर हैंडल बड़े बनाए
        जाते हैं। स्क्रीन पर दिखती इमेज काम के दौरान स्क्रीन के आकार में दोबारा बनती
        रहती है, जबकि फ़ाइल हमेशा अपने पूरे रेज़लूशन में तभी छिपाई जाती है जब आप बटन
        दबाते हैं।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या अकाउंट चाहिए?"
a = """
        मुफ़्त है, और न अकाउंट है, न साइन-इन, न ट्रायल, न वॉटरमार्क। इमेज के आकार की
        भी कोई सीमा नहीं, क्योंकि इसके लिए कोई सर्वर पैसे नहीं दे रहा: काम आपके अपने
        डिवाइस पर होता है। साइट विज्ञापन से चलती है, और विज्ञापनों को आपकी इमेज के बारे
        में कुछ नहीं दिया जाता।"""

