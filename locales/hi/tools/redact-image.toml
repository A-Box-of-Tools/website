      लेयर हों, क्योंकि वैसा रूप कभी बनता ही नहीं। <code>src/redact.js</code>
      देखिए।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से नहीं मँगाया जाता।"
body = """
 <code>src/</code> में कहीं भी न
      <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। सारा काम <code>getImageData</code>, बाइट पर घूमने
      वाले तीन लूप और <code>canvas.toBlob</code> है, और यह सब आपके ब्राउज़र में
      पहले से मौजूद है।"""

[[privacy]]
title = "बॉक्स की खबर कहीं नहीं जाती।"
body = """
 आपने कहाँ खींचा, कितने बॉक्स
      बनाए, कितने बड़े थे और कौन सा तरीका चुना, यह सब इस पेज की मेमोरी में रहता है
      और पेज बंद करते ही चला जाता है। इस रिपॉज़िटरी में ऐसा कोई एनालिटिक्स इवेंट
      नहीं है जो इसमें से कुछ भी ले जाए, और डाउनलोड के बाद जो एक सवाल आता है वह बस
      एक थम्स अप या डाउन और टूल का नाम भेजता है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क बंद कर दीजिए, टूल वैसा ही रहेगा,
      क्योंकि इसमें नेटवर्क वाला कदम कभी था ही नहीं। यही सबसे आसान सबूत है, और
