[[privacy]]
title = "ढके हुए पिक्सेल यहीं मिटते हैं, बाहर जाते हुए रास्ते में नहीं।"
body = """
 इमेज पिक्सेल के
      एक बफ़र में खुलती है, बॉक्स उसी बफ़र में लिख दिए जाते हैं, और बफ़र एनकोडर को
