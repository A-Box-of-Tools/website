[[faq]]
q = "क्या मेरी तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को डिकोड करने, कंप्रेस करने और नापने का काम आपका अपना
        ब्राउज़र आपके अपने हार्डवेयर पर करता है, उन्हीं JPEG, PNG और WebP
        एनकोडरों से जो ब्राउज़र में पहले से आते हैं। इस टूल में किसी भी तरह
        की कोई नेटवर्क सुविधा है ही नहीं। यह न कभी कुछ मँगाता है, न कभी कुछ
        भेजता है। और पेज की <code>Content-Security-Policy</code> उन सारे पतों
        के नाम गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस
        साइट का नहीं है।"""

[[faq]]
q = "यह ठीक तय साइज़ तक कैसे पहुँचता है?"
a = """
        आज़माकर। ऐसा कोई फ़ॉर्मूला है ही नहीं जो क्वालिटी की सेटिंग को बाइट
        की गिनती में बदल दे, क्योंकि यह पूरी तरह तस्वीर पर निर्भर करता है।
        इसलिए टूल तस्वीर को कई बार एनकोड करता है और जवाब ढूँढ़ता है। शुरुआत
        क्वालिटी की सबसे ऊपरी हद से होती है, फिर आधा-आधा करते हुए यह करीब आता
        जाता है, और सबसे ऊँची फिट होने वाली क्वालिटी लगभग आठ एनकोड में मिल
        जाती है। पेज पर आप जो भी साइज़ देखते हैं, वह सचमुच एनकोड की गई फ़ाइल
        का साइज़ है, कोई अनुमान नहीं।"""

[[faq]]
q = "यहाँ &ldquo;कम से कम नुकसान&rdquo; का मतलब असल में क्या है?"
a = """
        तीन ठोस बातें। पहली, जो तस्वीर पहले से आपके तय साइज़ से नीचे है, उसे
        दोबारा एनकोड करने के बजाय बाइट-दर-बाइट वैसी की वैसी आगे भेज दिया जाता
        है। दूसरी, रिज़ॉल्यूशन से पहले क्वालिटी खर्च होती है, और वह भी सिर्फ़
        उस हद तक जहाँ से कंप्रेशन के दाग दिखने लगते हैं। उससे नीचे टूल तस्वीर
        को छोटा कर देता है और क्वालिटी वापस ऊपर उठा देता है, क्योंकि कम मगर
        अच्छे पिक्सल ज़्यादा मगर बिगड़े हुए पिक्सलों से बेहतर दिखते हैं।
        तीसरी, फिट होने वाला नतीजा मिल जाने के बाद खोज उसे दोबारा ऊपर की ओर
        धकेलती रहती है, जब तक बजट पूरा खर्च न हो जाए। यानी 500 KB माँगने पर
        आपको 300 KB की फ़ाइल नहीं मिलती।"""

[[faq]]
q = "हर नतीजे पर लिखे SSIM और PSNR के आँकड़े क्या हैं?"
a = """
        ये नापते हैं कि कंप्रेशन की कीमत क्या पड़ी। नतीजे को दोबारा डिकोड
        करके असली तस्वीर से मिलाया जाता है। SSIM स्थानीय चमक, कंट्रास्ट और
        बनावट को मिलाकर देखता है, और यह बदले हुए पिक्सल गिनने के मुकाबले उस
        बात के कहीं ज़्यादा करीब है जिस पर आँख को एतराज़ होता है। लगभग 0.98
        से ऊपर दोनों तस्वीरें आमने-सामने रखकर भी अलग बता पाना मुश्किल है।
        PSNR वही पुराना डेसिबल वाला आँकड़ा है। दोनों आपके अपने डिवाइस पर
        निकाले जाते हैं, और दोनों इसीलिए दिखाए जाते हैं ताकि कम नुकसान का
        दावा सिर्फ़ दावा न रहे, जाँचा जा सके।"""

[[faq]]
q = "यह कौन-कौन से फ़ॉर्मैट पढ़ और लिख सकता है?"
a = """
        यह वह सब पढ़ लेता है जो आपका ब्राउज़र डिकोड कर सकता है, यानी व्यवहार
        में JPEG, PNG, WebP, GIF, BMP, और ज़्यादातर मौजूदा ब्राउज़रों में
        AVIF भी। लिखता यह JPEG, PNG और WebP है, क्योंकि ब्राउज़र यही एनकोडर
        साथ लाते हैं। &ldquo;अपने आप&rdquo; पर यह वही फ़ॉर्मैट बनाए रखता है
        जिसमें आपकी फ़ाइल आई थी, और WebP पर सिर्फ़ तब जाता है जब वही फ़ॉर्मैट
        रखने का मतलब होता आकार घटाना या क्वालिटी में दिखने लायक गिरावट।"""

[[faq]]
q = "PNG को बहुत ज़्यादा कंप्रेस क्यों नहीं किया जा सकता?"
a = """
        क्योंकि PNG नुकसान-रहित है, और इसमें घुमाने के लिए क्वालिटी का कोई
        बटन ही नहीं होता। PNG को छोटा करने का अकेला रास्ता है कम पिक्सल या कम
        रंग, इसलिए PNG चुने होने पर टूल तय साइज़ तक सिर्फ़ आकार घटाकर पहुँचता
        है। तस्वीर अगर कोई फ़ोटोग्राफ़ है, तो JPEG या WebP आपके तय साइज़ के
        कहीं ज़्यादा करीब पहुँचेंगे, और क्वालिटी ऐसी रहेगी जिसे देखकर आप खुद
        कह देंगे कि ठीक है। और अगर यह कोई लोगो या पारदर्शिता वाला स्क्रीनशॉट
        है, तो WebP वह पारदर्शिता बचा लेता है जिसे JPEG सफ़ेद रंग से भर
        देता।"""

[[faq]]
q = "क्या तस्वीर कंप्रेस करने से उसका EXIF और GPS डेटा हट जाता है?"
a = """
        हाँ, एक साइड इफ़ेक्ट के तौर पर। कंप्रेस करने का मतलब है तस्वीर को
        पिक्सलों में डिकोड करना और उन्हीं पिक्सलों को दोबारा एनकोड करना, और
        पिक्सलों से भरा कैनवस कोई टैग नहीं ढोता। इसलिए जगह, कैमरे का मॉडल,
        समय और बाकी सब कुछ नई फ़ाइल में लिखे ही नहीं जाते। मेटाडेटा हटाना है
        पर तस्वीर छूनी नहीं है, तो इसके बजाय
        <a href="../exif-editor/">EXIF व्यूअर और रिमूवर</a> इस्तेमाल कीजिए। वह कंटेनर दोबारा लिखता है, कुछ भी दोबारा कंप्रेस किए
        बिना।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        फ़ाइलों की गिनती या साइज़ पर भी कोई सीमा नहीं है, क्योंकि इनका बिल
        चुकाने वाला कोई सर्वर है ही नहीं। काम आपके अपने डिवाइस पर होता है।
        साइट पर विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपकी
        तस्वीरों के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए, यह चलता रहेगा।
        कुछ अपलोड नहीं हो रहा, यह साबित करने का सबसे आसान तरीका भी यही है।
        जो टूल आपकी तस्वीरें कंप्रेस करने के लिए कहीं भेजता, वह प्लग निकालते
        ही रुक जाता।"""

