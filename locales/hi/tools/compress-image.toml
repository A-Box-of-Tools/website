[[privacy]]
title = "आपकी तस्वीरों के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा की जा सकें, और कोड में ऐसा कुछ भी नहीं जो
      उन्हें भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। कंप्रेशन है <code>canvas.toBlob</code>
      &mdash; वही एनकोडर जो आपके ब्राउज़र में पहले से लगा हुआ है।"""

[[privacy]]
title = "आँकड़े नापे जाते हैं, कहीं भेजे नहीं जाते।"
body = """
 साइज़, क्वालिटी का
      आँकड़ा और SSIM की तुलना &mdash; ये सब इसी पेज पर गिने जाते हैं और आपको
      दिखा दिए जाते हैं। इस रिपॉज़िटरी में ऐसा कोई अपना एनालिटिक्स इवेंट नहीं
      है जो फ़ाइल का नाम, साइज़, गिनती या नतीजा साथ ले जाता हो।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपकी तस्वीरों के बारे में कुछ नहीं सौंपा जाता।
      कोई फ़ाइल पढ़ने, दबाने या नापने वाली हर पंक्ति इसी ऑरिजिन से आती है
      और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई क़दम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "अपनी तस्वीरें चुनिए।"
body = """
 उन्हें पिकर पर छोड़ दीजिए या हाथ से
      चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है; इस दौरान कुछ भी
      कहीं नहीं भेजा जाता।"""

[[howto]]
title = "जो साइज़ आपसे कहा गया है, वह टाइप कीजिए।"
body = """
 उस अपलोड फ़ॉर्म के लिए
      100 KB जो आपकी फ़ोटो बार-बार लौटा रहा है, आवेदन पोर्टल के लिए 500 KB,
      जल्दी लोड होने वाले पेज के लिए 2 MB। चार सबसे आम साइज़ बटन के रूप में
      मौजूद हैं।"""

[[howto]]
title = "&ldquo;तय साइज़ तक दबाइए&rdquo; दबाइए।"
body = """
 हर तस्वीर कई बार एनकोड
      होती है, और टूल उस सबसे ऊँची क्वालिटी तक पहुँचता जाता है जो साइज़ में
      समा जाए। जो पहले से तय साइज़ से नीचे है, वह बिलकुल वैसा का वैसा छोड़
      दिया जाता है।"""

[[howto]]
title = "देखिए क़ीमत क्या पड़ी, फिर डाउनलोड कीजिए।"
body = """
 हर नतीजा बताता है कि वह
      किस फ़ॉर्मैट में लिखा गया, किस क्वालिटी पर, माप बदली या नहीं, और नापने
      पर वह असली तस्वीर से कितना मेल खाता है। &ldquo;तुलना&rdquo; दोनों
      तस्वीरें आमने-सामने रख देता है।"""

[[faq]]
q = "क्या मेरी तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर डिकोड करता,
        दबाता और नापता है &mdash; उन्हीं JPEG, PNG और WebP एनकोडरों से जो
        ब्राउज़र में पहले से आते हैं। इस टूल में किसी भी क़िस्म की कोई नेटवर्क
        सुविधा है ही नहीं &mdash; यह न कभी कुछ लाता है, न कभी कुछ भेजता है
        &mdash; और पेज की <code>Content-Security-Policy</code> उन सारे पतों
        के नाम गिना देती है जिनसे यह संपर्क कर सकता है; उनमें से एक भी इस
        साइट का नहीं है।"""

[[faq]]
q = "यह ठीक तय साइज़ तक कैसे पहुँचता है?"
a = """
        आज़माकर। ऐसा कोई फ़ॉर्मूला है ही नहीं जो क्वालिटी की सेटिंग को बाइट की
        गिनती में बदल दे &mdash; यह पूरी तरह तस्वीर पर निर्भर करता है &mdash;
        इसलिए टूल तस्वीर को कई बार एनकोड करता है और जवाब खोजता है। यह क्वालिटी
        की हद के सबसे ऊपरी सिरे से शुरू करता है और आधा-आधा करते हुए क़रीब आता
        जाता है, जिससे सबसे ऊँची फिट होने वाली क्वालिटी लगभग आठ एनकोड में मिल
        जाती है। पेज पर आप जो भी साइज़ देखते हैं, वह सचमुच एनकोड की गई फ़ाइल
        का साइज़ है, कोई अनुमान नहीं।"""

[[faq]]
q = "यहाँ &ldquo;कम से कम नुक़सान&rdquo; का असल में मतलब क्या है?"
a = """
        तीन ठोस बातें। पहली, जो तस्वीर पहले से आपकी तय साइज़ से नीचे है, वह
        दोबारा एनकोड होने के बजाय बाइट-दर-बाइट वैसी की वैसी आगे भेज दी जाती
        है। दूसरी, रिज़ॉल्यूशन से पहले क्वालिटी ख़र्च होती है, और वह भी सिर्फ़
        उस फ़र्श तक जहाँ कंप्रेशन के दाग़ दिखने लगते हैं &mdash; उससे नीचे
        टूल तस्वीर को छोटा कर देता है और क्वालिटी वापस ऊपर उठा देता है,
        क्योंकि कम अच्छे पिक्सल ज़्यादा बिगड़े हुए पिक्सलों से बेहतर दिखते
        हैं। तीसरी, फिट होने वाला नतीजा मिल जाने के बाद खोज दोबारा ऊपर की ओर
        धकेलती है जब तक बजट पूरा ख़र्च न हो जाए &mdash; यानी 500 KB माँगने पर
        आपको 300 KB की फ़ाइल नहीं मिलती।"""

[[faq]]
q = "हर नतीजे पर लिखे SSIM और PSNR के आँकड़े क्या हैं?"
a = """
        ये इस बात की माप हैं कि कंप्रेशन की क़ीमत क्या पड़ी: नतीजे को डिकोड
        करके असली तस्वीर से मिलाया जाता है। SSIM स्थानीय चमक, कंट्रास्ट और
        बनावट की तुलना करता है, जो बदले हुए पिक्सल गिनने के मुक़ाबले उस बात
        के कहीं ज़्यादा क़रीब है जिस पर आँख को आपत्ति होती है; लगभग 0.98 से
        ऊपर दोनों को आमने-सामने रखकर अलग बता पाना मुश्किल है। PSNR वही
        पुराना डेसिबल वाला आँकड़ा है। दोनों आपके अपने डिवाइस पर गिने जाते हैं,
        और दोनों इसलिए दिखाए जाते हैं ताकि कम नुक़सान का दावा सिर्फ़ दावा न
        रहकर जाँचा जा सके।"""

[[faq]]
q = "यह कौन-कौन से फ़ॉर्मैट पढ़ और लिख सकता है?"
a = """
        यह वह सब पढ़ लेता है जो आपका ब्राउज़र डिकोड कर सकता है, यानी व्यवहार
        में JPEG, PNG, WebP, GIF, BMP और &mdash; ज़्यादातर मौजूदा ब्राउज़रों
        में &mdash; AVIF भी। यह JPEG, PNG और WebP लिखता है, क्योंकि ब्राउज़र
        यही एनकोडर साथ लाते हैं। &ldquo;अपने आप&rdquo; पर यह वही फ़ॉर्मैट रखे
        रहता है जिसमें आपकी फ़ाइल आई थी, और WebP पर सिर्फ़ तब जाता है जब वही
        फ़ॉर्मैट रखने का मतलब आकार घटाना या क्वालिटी में दिखने लायक़ गिरावट
        होता।"""

[[faq]]
q = "PNG को बहुत दूर तक क्यों नहीं दबाया जा सकता?"
a = """
        क्योंकि PNG नुक़सान-रहित है: इसमें घुमाने के लिए कोई क्वालिटी का बटन
        है ही नहीं। PNG को छोटा करने का अकेला रास्ता है कम पिक्सल या कम रंग,
        इसलिए PNG चुने होने पर टूल तय साइज़ तक सिर्फ़ आकार घटाकर पहुँचता है।
        अगर तस्वीर कोई फ़ोटोग्राफ़ है, तो JPEG या WebP आपकी तय साइज़ के कहीं
        ज़्यादा क़रीब पहुँचेगा, ऐसी क्वालिटी पर जिसे देखकर आप ख़ुद कह देंगे
        कि ठीक है &mdash; और अगर यह कोई लोगो या पारदर्शिता वाला स्क्रीनशॉट है,
        तो WebP वह पारदर्शिता बचा लेता है जिसे JPEG सफ़ेद रंग से भर देता।"""

[[faq]]
q = "क्या तस्वीर दबाने से उसका EXIF और GPS डेटा हट जाता है?"
a = """
        हाँ, एक साइड इफ़ेक्ट की तरह। दबाने का मतलब है तस्वीर को पिक्सलों में
        डिकोड करना और उन पिक्सलों को दोबारा एनकोड करना, और पिक्सलों से भरा
        कैनवस कोई टैग नहीं ढोता &mdash; इसलिए जगह, कैमरे का मॉडल, समय और
        बाक़ी सब कुछ नई फ़ाइल में लिखे ही नहीं जाते। अगर मेटाडेटा हटाना है
        पर तस्वीर छूनी नहीं है, तो इसके बजाय
        <a href="../exif-editor/">EXIF दिखाने और हटाने वाला टूल</a>
        इस्तेमाल कीजिए &mdash; वह कंटेनर दोबारा लिखता है, कुछ भी दोबारा दबाए
        बिना।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
