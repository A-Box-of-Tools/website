 तस्वीर को दोबारा
      एनकोड करना ही पड़ेगा, क्योंकि क्रॉप किया हुआ फ़्रेम एक अलग तस्वीर है।
      &ldquo;संतुलित&rdquo; उसे लगभग उतने पर ही रखता है जितना फ़ाइल पहले से
