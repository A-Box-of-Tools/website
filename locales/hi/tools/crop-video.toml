 काम आपके अपने हार्डवेयर पर
      होता है, इसलिए कितनी देर लगेगी यह किसी कतार पर नहीं, आपकी मशीन पर
      निर्भर है। तैयार वीडियो सीधे आपके ब्राउज़र के डाउनलोड में चला जाता है।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे पढ़ने, डिकोड करने, क्रॉप करने और एनकोड करने का काम आपका अपना
        ब्राउज़र आपके अपने हार्डवेयर पर करता है। इस टूल का कोई सर्वर वाला
        हिस्सा है ही नहीं, और पेज की <code>Content-Security-Policy</code> उन
        सारे पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक
        भी इस साइट का नहीं है। सिर्फ़ बता देने से बात न बने, तो इंटरनेट काटकर
        कोई क्लिप क्रॉप करके देख लीजिए।"""

[[faq]]
q = "मैं कौन-कौन से वीडियो फ़ॉर्मैट क्रॉप कर सकता हूँ?"
a = """
        MP4, M4V और MOV सीधे पढ़े जाते हैं, उनके भीतर जो भी हो, यानी H.264,
        HEVC, AV1 या VP9, बशर्ते आपका ब्राउज़र उस कोडेक को डिकोड कर सके। बाकी
        जो कुछ आपका ब्राउज़र चला सकता है, सबसे ज़ाहिर तौर पर WebM, उसे चलाकर
        और नतीजा रिकॉर्ड करके क्रॉप किया जाता है। यह चलता तो है, पर उतना ही
        समय लेता है जितनी लंबी क्लिप है। और जिस फ़ाइल को ब्राउज़र न पढ़ सके न
        चला सके, यानी व्यवहार में AVI, WMV, FLV और ज़्यादातर MKV, उसे बीच
        रास्ते नाकाम होने के बजाय एक संदेश के साथ मना कर दिया जाता है।"""

[[faq]]
q = "क्या वीडियो के साइज़ या लंबाई पर कोई सीमा है?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है, और फ़ाइल एक साथ पूरी मेमोरी में
        नहीं पढ़ी जाती। उसमें कुछ-कुछ मेगाबाइट करके आगे बढ़ा जाता है।
        व्यावहारिक छत दो ही हैं, तैयार वीडियो जो डाउनलोड से पहले मेमोरी में
        जुड़ता है, और वह समय जो आपकी मशीन उसे एनकोड करने में लगाती है।"""

[[faq]]
q = "क्या आवाज़ बची रहती है?"
a = """
        MP4 वाले रास्ते पर बिलकुल। ऑडियो सैंपल-दर-सैंपल, बिना कभी डिकोड हुए
        उतार दिया जाता है, इसलिए वह बाइट-दर-बाइट वही रहता है जो फ़ाइल में था।
        रिकॉर्डिंग वाले रास्ते पर वह प्लेबैक से पकड़ा जाता है और दोबारा एनकोड
        होता है, जिसमें थोड़ी क्वालिटी की कीमत लगती है। दोनों ही हालात में
        आवाज़ पूरी तरह छोड़ देने के लिए एक चेकबॉक्स मौजूद है।"""

[[faq]]
q = "क्या क्रॉप करने से क्वालिटी घटती है?"
a = """
        तस्वीर दोबारा एनकोड होती है, क्योंकि क्रॉप किया हुआ फ़्रेम एक अलग
        तस्वीर है, और उसे पिक्सल नए सिरे से लिखे बिना सहेजने का कोई तरीका
        नहीं। टूल जो नहीं करेगा वह यह है कि उसी हिस्से पर असली फ़ाइल से
        ज़्यादा खर्च करे। उससे ऊपर दोबारा एनकोड करने पर फ़ाइल बस बड़ी होती
        है, दिखने में बेहतर नहीं।"""

[[faq]]
q = "क्या मैं लंबाई भी काट सकता हूँ?"
a = """
        यहाँ नहीं, बगल वाले टूल में। यह टूल तस्वीर का आकार बदलता है और उसके
        सिवा कुछ नहीं। जो क्लिप बाहर आती है वह ठीक उतनी ही लंबी है जितनी भीतर
        गई थी, अपनी टाइमिंग और अपनी आवाज़ के साथ। काटना अलग काम है और उसके लिए
        अलग टूल है। <a href="../trim-video/">वीडियो कटर</a> क्लिप के रखने लायक
        हिस्सों पर निशान लगाता है और उन्हें एक ही फ़ाइल में सहेज देता है, बिना
        एक भी फ़्रेम दोबारा एनकोड किए।"""

[[faq]]
q = "चौड़ाई और ऊँचाई दो-दो के कदमों में क्यों चलती हैं?"
a = """
        MP4 के भीतर बैठा कोडेक H.264 तस्वीर को ब्लॉकों में सहेजता है, और उसके
        पास ऐसा कोई तरीका नहीं कि किसी किनारे पर विषम संख्या में पिक्सल वाले
        फ़्रेम का ब्योरा दे सके। आपके तय कर लेने के बाद आपके क्रॉप को चुपचाप
        गोल कर देने के बजाय, डिब्बा शुरू से ही सिर्फ़ सम संख्याएँ देता है।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        साइट पर विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपके
        वीडियो के बारे में कुछ नहीं दिया जाता।"""

