[[privacy]]
title = "आप जो चिपकाते हैं, उसके जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ चिपकाया गया कोई टोकन जमा किया जा सके, और कोड में ऐसा कुछ भी
      नहीं जो उसे भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। हर एनकोडर और हर डिकोडर इसी पेज के फ़ंक्शन हैं
      जो एक लाइन लेते हैं और एक लाइन लौटा देते हैं।"""

[[privacy]]
title = "कुछ ग़लत हो तो डिकोडर बता देता है।"
body = """
 ब्राउज़र का अपना <code>atob</code>
      वे इनपुट भी स्वीकार कर लेता है जिन्हें नकारना चाहिए, और कुछ भला-सा
      दिखने वाला लौटा देता है। यहाँ का Base64 हाथ से लिखा गया है और
      RFC&nbsp;4648 के टेस्ट वेक्टरों पर जाँचा जाता है, और आपका चिपकाया हुआ
      Base64 न हो तो यह कह देता है, और वजह भी बता देता है।
      <code>tests/js/text-encode.test.js</code> के टेस्ट ठीक यही जाँचते
      हैं।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपके टेक्स्ट का एक अक्षर तक नहीं सौंपा जाता। उसे
      पढ़ने, समझने या लिखने वाली हर पंक्ति इसी ऑरिजिन से आती है और रिपॉज़िटरी
      में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "एनकोडिंग चुनिए।"
body = """
 दोनों वर्णमालाओं में Base64, किसी एक मान या
      पूरे URL के लिए परसेंट एनकोडिंग, पाँच HTML एंटिटी, हेक्स बाइट, और स्ट्रिंग
      लिटरल वाले बैकस्लैश एस्केप। मेन्यू के नीचे की टिप्पणी बताती है कि कौन-सी
      किस काम की है।"""

[[howto]]
title = "दिशा चुनिए।"
body = """
 <em>Encode</em> सादा टेक्स्ट लेकर एनकोड किया
      हुआ रूप बनाता है; <em>Decode</em> एनकोड किए हुए रूप को सादे टेक्स्ट में
      लौटा लाता है। नतीजा आपकी टाइपिंग के साथ-साथ बदलता है, इसलिए दिशा बदलना एक
      क्लिक है और दोबारा कुछ नहीं लिखना पड़ता।"""

[[howto]]
title = "इसे भीतर चिपकाइए, या फ़ाइल छोड़ दीजिए।"
body = """
 जो कुछ भी आप चुनकर कॉपी कर
      सकते हैं वह चल जाता है। पिकर पर छोड़ी गई फ़ाइल आपका अपना ब्राउज़र पढ़कर
      डिब्बे में रख देता है, और छोड़ने को अपलोड वाला कोई कदम है ही नहीं।"""

[[howto]]
title = "कोई त्रुटि हो तो पढ़ लीजिए।"
body = """
 यहाँ नाकाम होने वाला डिकोडर बता देता है कि
      उसे क्या मिला &mdash; ऐसा अक्षर जो Base64 इस्तेमाल नहीं करता, ग़लत जगह
      पड़ी पैडिंग, ऐसे बाइट जो टेक्स्ट नहीं हैं &mdash; बजाय इसके कि कुछ भला-सा
      दिखने वाला मगर ग़लत लौटा दे।"""

[[howto]]
title = "नतीजा ले जाइए।"
body = """
 कॉपी कर लीजिए, या टेक्स्ट फ़ाइल की तरह
      डाउनलोड कर लीजिए। डिब्बे के नीचे की गिनती बताती है कि कितने बाइट भीतर गए
      और कितने बाहर आए।"""

[[faq]]
q = "क्या मेरा टेक्स्ट कहीं अपलोड होता है?"
a = """
        नहीं। इस पेज का हर एनकोडर और हर डिकोडर एक फ़ंक्शन है जो आपके अपने
        ब्राउज़र में, आपके अपने हार्डवेयर पर चलता है। इस टूल में किसी भी तरह
        की कोई नेटवर्क सुविधा है ही नहीं, यानी यह न कभी कुछ मँगाता है, न कभी
        कुछ भेजता है। और पेज की <code>Content-Security-Policy</code> उन सारे
        पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी
        इस साइट का नहीं है। किसी ऐक्सेस टोकन या सेशन कुकी के लिए इसे इस्तेमाल
        करने की वजह भी यही है, क्योंकि इनमें से कोई भी किसी और के डिकोडर में
        चिपकाने का मतलब है उसे वह दे देना।"""

[[faq]]
q = "क्या यहाँ का Base64 वही Base64 है जो बाकी हर जगह है?"
a = """
        हाँ, और इसे खुद अपने बजाय RFC 4648 के टेस्ट वेक्टरों से जाँचा जाता
        है। दोनों वर्णमालाएँ डिकोड होती हैं, इसलिए <code>-</code> और
        <code>_</code> से लिखा JWT उतनी ही आसानी से पढ़ा जाता है जितना
        <code>+</code> और <code>/</code> से लिखा, और 64 अक्षरों पर लपेटा गया
        इनपुट आपके लिए खोल दिया जाता है। एनकोडिंग UTF-8 बाइटों के हिसाब से
        होती है, इसलिए कोई मात्रा वाला अक्षर या इमोजी पूरा चक्कर लगाकर भी बचा
        रहता है।"""

[[faq]]
q = "क्या Base64 एन्क्रिप्शन है?"
a = """
        नहीं, और इसे एन्क्रिप्शन समझ लेना ही सबसे जानी-पहचानी भूल है। Base64
        एक लिखावट है: वही बाइट, ऐसी वर्णमाला में लिखे हुए जो URL, ईमेल या JSON
        स्ट्रिंग में सलामत रहती है। कोई भी उसे वापस पढ़ सकता है &mdash; यह पेज
        एक मिलीसेकंड में पढ़ लेता है &mdash; इसलिए यह न कुछ छिपाता है, न कुछ
        बचाता है। आपके पास जो है वह अगर राज़ है, तो उसे एनकोड होने से पहले असली
        एन्क्रिप्शन चाहिए, उसकी जगह पर नहीं।"""

[[faq]]
q = "डिकोडिंग नाकाम क्यों हुई?"
a = """
        क्योंकि चिपकाया हुआ ठीक वही नहीं है जो कोडेक को बताया गया था, और
        त्रुटि बता देती है कि किस तरफ़ से: Base64 की वर्णमाला से बाहर का कोई
        अक्षर, ग़लत जगह पड़ी पैडिंग, ऐसा परसेंट चिह्न जिसके बाद दो हेक्स अंक
        नहीं, या ऐसे बाइट जो Base64 से तो खुल जाते हैं मगर UTF-8 टेक्स्ट नहीं
        हैं &mdash; जिसका अक्सर मतलब है कि असल चीज़ कोई फ़ाइल थी, स्ट्रिंग
        नहीं। ब्राउज़र का अपना <code>atob</code> इसकी जगह कुछ भला-सा दिखने
        वाला लौटा देता; और बताया जाना ही तो किसी डिकोडर में कुछ चिपकाने का
        पूरा मतलब है।"""

[[faq]]
q = "वेब पते की दो एनकोडिंग में क्या फ़र्क़ है?"
a = """
        एक मान, या पूरा पता। <em>एक मान</em> एनकोड करना उस हर चीज़ को एस्केप
        कर देता है जिसे URL कोई मतलब देता है &mdash; स्लैश, प्रश्नचिह्न,
        एम्परसैंड &mdash; और क्वेरी स्ट्रिंग के अकेले पैरामीटर के लिए आपको
        यही चाहिए। <em>पूरा URL</em> एनकोड करना पते को चालू हालत में छोड़ता
        है: स्लैश और <code>?</code> रह जाते हैं, और सिर्फ़ वे अक्षर एस्केप
        होते हैं जिन्हें URL ढो ही नहीं सकता। पहली को पूरे पते पर चलाइए तो पता
        टूट जाता है; दूसरी को किसी मान पर चलाइए तो यह खो जाता है कि मान कहाँ
        ख़त्म होता है।"""

[[faq]]
q = "यह कितनी बड़ी फ़ाइल सँभाल सकता है?"
a = """
        यहाँ कोई सीमा तय की ही नहीं गई है, क्योंकि उसका बिल चुकाने वाला कोई
        सर्वर ही नहीं। व्यावहारिक छत आपकी अपनी मशीन है, और कुछ मेगाबाइट का
        टेक्स्ट ठीक चलता है। बहुत लंबे दस्तावेज़ पर पेज आपकी टाइपिंग में एक
        ठहराव का इंतज़ार करता है और तब दोबारा एनकोड करता है, बजाय इसके कि
        कीबोर्ड के लिए आपसे झगड़े।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, और न इस पर
        कोई सीमा कि आप कितना चिपकाएँ। साइट पर विज्ञापन हैं, और वही इसका खर्च
        उठाते हैं; विज्ञापनों को आपके टेक्स्ट के बारे में कुछ नहीं दिया
        जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीका यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपका टेक्स्ट डिकोड करने के लिए कहीं भेजता, वह प्लग निकालते ही
        रुक जाता।"""

