[[privacy]]
title = "आप जो चिपकाते हैं, उसके जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ चिपकाया गया कोई टोकन जमा किया जा सके, और कोड में ऐसा कुछ भी
      नहीं जो उसे भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। हर पार्सर, हर एनकोडर और तुलना &mdash; सब इसी
      पेज के फ़ंक्शन हैं जो एक लाइन लेते हैं और एक लाइन लौटाते हैं।"""

[[privacy]]
title = "फ़ॉर्मैटर जो दिया गया था उसे वैसा ही रखते हैं।"
body = """
 JSON ऑब्जेक्ट अपनी कुंजियों के साथ
      उसी क्रम में लौटता है जिसमें आपने लिखी थीं और अपनी संख्याओं के साथ ठीक
      वैसे ही लिखा हुआ जैसे आपने लिखा था, क्योंकि <code>src/json.js</code>
      <code>JSON.parse</code> की पुकार नहीं, ख़ुद एक पार्सर है &mdash; और
      <code>JSON.parse</code> पूर्णांक जैसी कुंजियों का क्रम बदल देता है तथा
      बीस अंकों की id को सबसे नज़दीकी डबल बना देता है। ठीक यही
      <code>tests/js/text-format.test.js</code> के टेस्ट जाँचते हैं।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपके टेक्स्ट का एक अक्षर तक नहीं सौंपा जाता। उसे
      पढ़ने, समझने या लिखने वाली हर पंक्ति इसी ऑरिजिन से आती है और रिपॉज़िटरी
      में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई क़दम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "काम चुनिए।"
body = """
 चार टैब, और उनका एक ही डिब्बा है:
      <em>सजाइए</em> JSON, XML, HTML, CSS और YAML को सजाता या निचोड़ता है;
      <em>बदलिए</em> JSON को YAML या XML में और वापस बदलता है;
      <em>एनकोड कीजिए</em> Base64, URL, HTML एंटिटी, hex और बैकस्लैश एस्केप
      करता है, दोनों दिशाओं में; <em>मिलाइए</em> दिखाता है कि दो टेक्स्ट के
      बीच क्या बदला।"""

[[howto]]
title = "इसे भीतर चिपकाइए, या फ़ाइल छोड़ दीजिए।"
body = """
 जो कुछ भी आप चुनकर कॉपी कर
      सकते हैं वह चल जाता है। पिकर पर छोड़ी गई फ़ाइल आपका अपना ब्राउज़र पढ़कर
      डिब्बे में रख देता है &mdash; छोड़ने को अपलोड वाला कोई क़दम है ही नहीं।
      मिलाते वक़्त दो फ़ाइलें छोड़िए और वे एक-एक तरफ़ जा बैठती हैं।"""

[[howto]]
title = "इसे ख़ुद भाषा पहचानने दीजिए, या बता दीजिए।"
body = """
 मेन्यू बताता है कि उसने
      टेक्स्ट को किस रूप में पढ़ा, और उसे ठीक करना एक क्लिक का काम है। अंदाज़ा
      सिर्फ़ एक शुरुआती बिंदु है, और इसीलिए उसे चुपचाप लागू करने के बजाय दिखा
      दिया जाता है।"""

[[howto]]
title = "इंडेंट चुनिए, या इसे चपटा निचोड़ दीजिए।"
body = """
 दो स्पेस, चार, या एक टैब।
      चपटा निचोड़ना वही दस्तावेज़ है जिसमें से हर वह स्पेस निकाल दिया गया है
      जो सिर्फ़ पढ़ने के लिए था, और नतीजा बता देता है कि इससे कितने बाइट
      बचे।"""

[[howto]]
title = "त्रुटि को वहीं पढ़िए जहाँ वह है।"
body = """
 यहाँ नाकाम होने वाला पार्सर बताता
      है कि उसे क्या मिला और किस पंक्ति तथा कॉलम पर, न कि
      &ldquo;unexpected token at position 4193&rdquo;। कॉन्फ़िग फ़ाइल ठीक करने
      के लिए आम तौर पर इतना काफ़ी होता है, बिना कुछ और खोले।"""

[[howto]]
title = "नतीजा ले जाइए।"
body = """
 उसे कॉपी कीजिए, या फ़ाइल के रूप में
      डाउनलोड कर लीजिए। तुलना यूनिफ़ाइड फ़ॉर्मैट में <code>.patch</code> के रूप
      में उतरती है, और कोड रिव्यू, <code>git apply</code> तथा हर डिफ़ व्यूअर
      यही उम्मीद करते हैं।"""

[[faq]]
q = "क्या मेरा टेक्स्ट कहीं अपलोड होता है?"
a = """
        नहीं। इस पेज का हर पार्सर, एनकोडर और तुलना एक फ़ंक्शन है जो आपके अपने
        ब्राउज़र में, आपके अपने हार्डवेयर पर चलता है। इस टूल में किसी भी क़िस्म
        की कोई नेटवर्क सुविधा है ही नहीं &mdash; यह न कभी कुछ लाता है, न कभी
        कुछ भेजता है &mdash; और पेज की <code>Content-Security-Policy</code> उन
        सारे पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है; उनमें से एक
        भी इस साइट का नहीं है। किसी ऐक्सेस टोकन, सेशन कुकी या ग्राहक के रिकॉर्ड
        के लिए इसे इस्तेमाल करने की वजह यही है: इनमें से कोई भी किसी और के
        फ़ॉर्मैटर में चिपकाने का मतलब है उसे वह दे देना।"""

[[faq]]
q = "क्या JSON सजाने से लेआउट के सिवा कुछ और भी बदलता है?"
a = """
        नहीं, और यह सुनने में जितना लगता है उससे मुश्किल है। कुंजियाँ उसी क्रम
        में रहती हैं जिसमें आपने लिखी थीं &mdash; <code>JSON.parse</code> पर
        बना फ़ॉर्मैटर पूर्णांक जैसी कुंजियों को चुपचाप आगे खिसका देता है,
        इसलिए <code>{"10":a,"2":b}</code> वापस <code>{"2":b,"10":a}</code>
        बनकर आता है। संख्याओं में वही अंक बचे रहते हैं जो आपने टाइप किए, इसलिए
        बीस अंकों की id अपने आख़िरी तीन अंक किसी डबल के हाथों नहीं गँवाती और
        <code>1e999</code>, <code>null</code> नहीं बन जाता। दोहरी कुंजियाँ
        दोनों रखी जाती हैं, क्योंकि मानक यह कहता ही नहीं कि कौन-सी जीतेगी, और
        किसी एक को गिरा देना आपकी तरफ़ से फ़ैसला कर देना होता।"""

[[faq]]
q = "यह कौन-कौन सी भाषाएँ सजा सकता है?"
a = """
        JSON, XML, HTML, CSS और YAML। JSON, XML, HTML और CSS को चपटा भी
        निचोड़ा जा सकता है; YAML को नहीं, क्योंकि उसका छोटा रूप फ़्लो स्टाइल
        है, जो पढ़ा ही नहीं जाता &mdash; और न पढ़ा जाना उस वजह के ठीक उलट है
        जिसकी वजह से कोई फ़ाइल YAML में रखी जाती है। JavaScript जान-बूझकर इस
        सूची में नहीं है &mdash; उसके बारे में नीचे वाला सवाल देखिए।"""

[[faq]]
q = "यह JavaScript, Python या SQL क्यों नहीं सजाता?"
a = """
        क्योंकि किसी प्रोग्रामिंग भाषा को सजाने का मतलब है उसे ढंग से पार्स
        करना, और जो फ़ॉर्मैटर लगभग सही निकलता है वह किसी फ़ॉर्मैटर के न होने से
        भी बुरा है: वह ऐसा कोड बनाता है जो देखने में ठीक लगता है और करता कुछ और
        है। JSON, XML, CSS और YAML के व्याकरण इतने छोटे हैं कि उन्हें हाथ से
        पढ़ा जा सके और ऐसे टेस्टों से जाँचा जा सके जिन्हें आप ख़ुद चला सकते
        हैं। JavaScript का फ़ॉर्मैटर Prettier है, जो एक मेगाबाइट का पार्सर है,
        और उसकी जगह किसी वेब पेज पर नहीं, आपके एडिटर में है।"""

[[faq]]
q = "तुलना असल में करती क्या है?"
a = """
        वह संपादनों का सबसे छोटा समूह ढूँढ़ती है जो बाएँ वाले टेक्स्ट को दाएँ
        वाले में बदल दे, और इसके लिए Myers का एल्गोरिद्म इस्तेमाल करती है
        &mdash; वही जो <code>git diff</code> इस्तेमाल करता है। सबसे छोटा होना
        ही डिफ़ को पढ़ने लायक़ बनाता है: बीच में जोड़ी गई एक पंक्ति एक जोड़
        के रूप में दिखनी चाहिए, न कि उसके बाद की हर पंक्ति के बदल जाने के रूप
        में। बदली हुई पंक्ति के भीतर जो शब्द अलग हैं उन पर भी निशान लग जाता है,
        इसलिए दो पैराग्राफ़ की तुलना दो पूरे पैराग्राफ़ नहीं, वह शब्द दिखाती है
        जो हिला।"""

[[faq]]
q = "क्या यह दो चिपकाए हुए टेक्स्ट के बजाय दो फ़ाइलें मिला सकता है?"
a = """
        हाँ। Compare टैब खुला हो तब दोनों को पिकर पर छोड़ दीजिए और वे एक-एक
        तरफ़ जा बैठती हैं, उसी क्रम में जिसमें आपने छोड़ीं। उन्हें आपका
        ब्राउज़र पढ़कर इसी पेज में लाता है, और वही अकेली जगह है जहाँ वे जाती
        हैं। अगर आपने उन्हें उलटी तरफ़ छोड़ दिया हो तो पक्ष अदल-बदल लीजिए।"""

[[faq]]
q = "तुलना में से क्या निकलता है, और क्या मैं उसे लागू कर सकता हूँ?"
a = """
        डाउनलोड एक यूनिफ़ाइड डिफ़ है &mdash; वही <code>@@ -3,5 +3,5 @@</code>
        वाला फ़ॉर्मैट जिसे <code>git apply</code>, <code>patch</code> और हर कोड
        रिव्यू टूल पढ़ता है। कॉपी वही चीज़ आपके क्लिपबोर्ड में डाल देता है।
        स्क्रीन पर जो है वह उसी का एक रूप है: आमने-सामने, या एक ही कॉलम में, और
        जब तक आप पूरा न माँगें तब तक न बदले हिस्से एक गिनती में सिमटे हुए।"""

[[faq]]
q = "क्या यहाँ का Base64 वही Base64 है जो बाक़ी हर जगह है?"
a = """
        हाँ &mdash; इसे ख़ुद अपने बजाय RFC 4648 के टेस्ट वेक्टरों से जाँचा जाता
        है। दोनों वर्णमालाएँ डिकोड होती हैं, इसलिए <code>-</code> और
        <code>_</code> से लिखा JWT उतनी ही आसानी से पढ़ा जाता है जितना
        <code>+</code> और <code>/</code> से लिखा, और 64 अक्षरों पर लपेटा गया
        इनपुट आपके लिए खोल दिया जाता है। एनकोडिंग UTF-8 बाइटों के हिसाब से
        होती है, इसलिए कोई मात्रा वाला अक्षर या इमोजी पूरा चक्कर लगाकर भी बचा
        रहता है।"""

[[faq]]
q = "मेरी YAML में no लिखा था और JSON में वह स्ट्रिंग बनकर निकला। क्यों?"
a = """
        क्योंकि वह स्ट्रिंग ही है, और यह YAML 1.1 नहीं, 1.2 पढ़ता है। YAML 1.1
        में <code>yes</code>, <code>no</code>, <code>on</code> और
        <code>off</code> बूलियन थे, और यही वह मशहूर गड़बड़ है जो नॉर्वे के देश
        कोड को <code>false</code> बना देती है। YAML 1.2 ने उसे हटा दिया और यह
        भी हटाता है: सिर्फ़ <code>true</code>, <code>false</code>,
        <code>null</code> और <code>~</code> ही टेक्स्ट के सिवा कुछ और पढ़े जाते
        हैं। दूसरी दिशा में जाते वक़्त वे शब्द <em>उद्धरण चिह्नों में</em> लिखे
        जाते हैं, भले ही यह उन्हें बिना उद्धरण के भी टेक्स्ट ही पढ़ता &mdash;
        क्योंकि उस फ़ाइल को आगे जो भी खोलेगा वह शायद न पढ़े। PyYAML आज भी
        डिफ़ॉल्ट रूप से 1.1 पर है। सख़्ती से पढ़ना और सँभलकर लिखना ही वह अकेला
        जोड़ा है जो दोनों तरफ़ सही रहता है।"""

[[faq]]
q = "YAML को JSON में बदलने में क्या खो जाता है?"
a = """
        टिप्पणियाँ, क्योंकि JSON के पास उन्हें रखने की कोई जगह ही नहीं। ऐंकर,
        एलियस और टैग अंदाज़ा लगाने के बजाय सिरे से मना कर दिए जाते हैं &mdash;
        इनमें से हर एक ऐसा कुछ कहता है जो JSON कह ही नहीं सकती, और जो कन्वर्टर
        चुपचाप कोई एक अर्थ चुन लेता, वह आपको ऐसा दस्तावेज़ थमाता जो वह नहीं है
        जो फ़ाइल में लिखा था। दूसरी दिशा में कुछ नहीं खोता: हर JSON दस्तावेज़
        पहले से ही एक YAML दस्तावेज़ है।"""

[[faq]]
q = "JSON को XML में बदलने में क्या खो जाता है?"
a = """
        ख़ाली ऑब्जेक्ट, ख़ाली ऐरे और ख़ाली स्ट्रिंग का आपसी फ़र्क़, क्योंकि ये
        तीनों एक ख़ाली एलिमेंट बन जाते हैं &mdash; और हर मान का प्रकार भी,
        क्योंकि XML में प्रकार होते ही नहीं। इसीलिए उलटा रूपांतरण सब कुछ
        स्ट्रिंग ही छोड़ देता है, यह तय करने के बजाय कि <code>8080</code> कोई
        संख्या थी। ऐरे दोहराया गया एलिमेंट बन जाता है, और यही अकेला आकार है जो
        वापस पढ़ा जा सकता है, और जिस कुंजी को एलिमेंट का नाम सँभाल न सके उसके
        अटपटे अक्षर बदल दिए जाते हैं &mdash; ऐसा दस्तावेज़ निकालने के बजाय
        जिसे कोई पार्सर पढ़ेगा ही नहीं।"""

[[faq]]
q = "क्या HTML का इंडेंट बदलने से पेज का दिखना बदल जाता है?"
a = """
        बदल सकता है, और यह उस बारे में ईमानदार है। दो इनलाइन एलिमेंट के बीच की
        ख़ाली जगह दो शब्दों के बीच का स्पेस है, इसलिए उसे हिलाना मुफ़्त नहीं
        है। दो चीज़ें इसे क़ाबू में रखती हैं: <code>&lt;pre&gt;</code> और
        <code>&lt;textarea&gt;</code> ठीक जैसे थे वैसे ही उतार दिए जाते हैं,
        और जिस एलिमेंट में टेक्स्ट के सिवा कुछ न हो वह एक ही पंक्ति में रहता
        है। बाक़ी सब सजाया जाता है।"""

[[faq]]
q = "यह कितनी बड़ी फ़ाइल सँभाल सकता है?"
a = """
        यहाँ कोई सीमा तय की ही नहीं गई है, क्योंकि उसका बिल चुकाने वाला कोई
        सर्वर ही नहीं। व्यावहारिक छत आपकी अपनी मशीन है: कुछ मेगाबाइट का JSON
        ठीक चलता है। ऐसे दो टेक्स्ट की तुलना जिनमें कुछ भी साझा न हो, जल्दी ही
        रुक जाती है और यह कह भी देती है &mdash; उस बात को साबित करने में एक
        मिनट लगाने के बजाय जो पहले ही ज़ाहिर थी &mdash; और बहुत लंबी तुलना
        पहली कुछ हज़ार पंक्तियाँ खींचकर बाक़ी डाउनलोड की गई पैच पर छोड़ देती
        है।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, और न इस पर
        कोई सीमा कि आप कितना चिपकाएँ। साइट पर विज्ञापन हैं, और वही इसका ख़र्च
        उठाते हैं; विज्ञापनों को आपके टेक्स्ट के बारे में कुछ नहीं दिया
        जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपका टेक्स्ट सजाने के लिए कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

