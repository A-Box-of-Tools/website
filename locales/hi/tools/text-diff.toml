[[privacy]]
title = "आप जो चिपकाते हैं, उसके जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ चिपकाया गया कोई टोकन जमा किया जा सके, और कोड में ऐसा कुछ भी
      नहीं जो उसे भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। तुलना इसी पेज का एक फ़ंक्शन है जो दो लाइनें
      लेता है और लौटा देता है कि क्या बदला।"""

[[privacy]]
title = "एल्गोरिद्म वही जाना-पहचाना है, और पूरा पढ़ा जा सकता है।"
body = """
 Myers का सबसे छोटी
      संपादन-पटकथा वाला एल्गोरिद्म, वही जो <code>git diff</code> इस्तेमाल
      करता है, <code>src/diff.js</code> में हाथ से लिखा हुआ, हर फ़ैसले पर
      टिप्पणी के साथ। <code>tests/js/text-diff.test.js</code> के टेस्ट साबित
      करते हैं कि हटाए हुए हिस्से बाएँ टेक्स्ट को फिर खड़ा कर देते हैं और
      जोड़े हुए हिस्से दाएँ को, और किसी डिफ़ के लिए सही होने का मतलब यही
      है।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपके टेक्स्ट का एक अक्षर तक नहीं सौंपा जाता। उसे
      पढ़ने, समझने या लिखने वाली हर पंक्ति इसी ऑरिजिन से आती है और रिपॉज़िटरी
      में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "दोनों टेक्स्ट चिपकाइए, या दोनों फ़ाइलें छोड़ दीजिए।"
body = """
 असली बाईं ओर, बदला हुआ
      दाईं ओर। पिकर पर एक साथ छोड़ी गई दो फ़ाइलें एक-एक तरफ़ जा बैठती हैं,
      उसी क्रम में जिसमें आपने छोड़ीं; उलटा हो गया हो तो पक्ष अदल-बदल
      लीजिए।"""

[[howto]]
title = "पढ़ने का ढंग चुनिए।"
body = """
 अगल-बगल, या एक कॉलम में। फ़ोन एक कॉलम से
      शुरू होता है, क्योंकि अगल-बगल के लिए टेक्स्ट के दो कॉलम चाहिए और फ़ोन
      में जगह करीब एक ही की है; मेन्यू वैसे भी वहीं बगल में है।"""

[[howto]]
title = "जो मायने नहीं रखता, उसे अनदेखा कीजिए।"
body = """
 खाली जगह, बड़े-छोटे अक्षर,
      खाली पंक्तियाँ &mdash; हर एक को अलग से अनदेखा किया जा सकता है, ताकि
      सिर्फ़ दोबारा सजाई गई फ़ाइल सौ बदलावों जैसी न पढ़ाई दे। डिफ़ॉल्ट रूप से
      बिना बदला बीच का हिस्सा एक गिनती में सिमट जाता है, और हर बदलाव के दोनों
      ओर तीन-तीन पंक्तियाँ रखी जाती हैं।"""

[[howto]]
title = "पढ़िए कि क्या बदला।"
body = """
 हटाई गई पंक्तियाँ बाईं ओर निशान पाती हैं,
      जुड़ी हुई दाईं ओर, और बदली हुई पंक्ति के भीतर वे शब्द उभार दिए जाते हैं
      जो अलग हैं &mdash; इसलिए दो अनुच्छेदों का डिफ़ वह शब्द दिखाता है जो
      खिसका, न कि दो पूरे अनुच्छेद।"""

[[howto]]
title = "पैच ले जाइए।"
body = """
 डाउनलोड यूनिफ़ाइड फ़ॉर्मैट की
      <code>.patch</code> है, और कोड रिव्यू, <code>git apply</code> और हर
      डिफ़ व्यूअर यही चाहते हैं। कॉपी वही चीज़ आपके क्लिपबोर्ड पर रख देता
      है।"""

[[faq]]
q = "क्या मेरे टेक्स्ट कहीं अपलोड होते हैं?"
a = """
        नहीं। तुलना एक फ़ंक्शन है जो आपके अपने ब्राउज़र में, आपके अपने
        हार्डवेयर पर चलता है। इस टूल में किसी भी तरह की कोई नेटवर्क सुविधा है
        ही नहीं, यानी यह न कभी कुछ मँगाता है, न कभी कुछ भेजता है। और पेज की
        <code>Content-Security-Policy</code> उन सारे पतों के नाम गिना देती है
        जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस साइट का नहीं है। किसी
        अनुबंध, कॉन्फ़िग फ़ाइल या जारी न हुए कोड के लिए इसे इस्तेमाल करने की
        वजह भी यही है, क्योंकि इन्हें किसी और के डिफ़ में चिपकाने का मतलब है
        दोनों संस्करण एक साथ सौंप देना।"""

[[faq]]
q = "तुलना असल में करती क्या है?"
a = """
        वह संपादनों का सबसे छोटा समूह ढूँढ़ती है जो बाएँ वाले टेक्स्ट को दाएँ
        वाले में बदल दे, और इसके लिए Myers का वही एल्गोरिद्म इस्तेमाल करती है
        जो <code>git diff</code> इस्तेमाल करता है। सबसे छोटा होना ही डिफ़ को
        पढ़ने लायक बनाता है। बीच में जोड़ी गई एक पंक्ति एक जोड़ के रूप में
        दिखनी चाहिए, न कि उसके बाद की हर पंक्ति के बदल जाने के रूप में। बदली हुई पंक्ति के भीतर जो शब्द अलग हैं उन पर भी निशान लग जाता है,
        इसलिए दो पैराग्राफ़ की तुलना दो पूरे पैराग्राफ़ नहीं, वह शब्द दिखाती है
        जो हिला।"""

[[faq]]
q = "क्या यह दो चिपकाए हुए टेक्स्ट के बजाय दो फ़ाइलें मिला सकता है?"
a = """
        हाँ। दोनों को एक साथ पिकर पर छोड़ दीजिए और वे एक-एक तरफ़ जा बैठती हैं,
        उसी क्रम में जिसमें आपने छोड़ीं। उन्हें आपका ब्राउज़र पढ़कर इसी पेज
        में लाता है, और वही अकेली जगह है जहाँ वे जाती हैं। अगर आपने उन्हें
        उलटी तरफ़ छोड़ दिया हो तो पक्ष अदल-बदल लीजिए।"""

[[faq]]
q = "तुलना में से क्या निकलता है, और क्या मैं उसे लागू कर सकता हूँ?"
a = """
        डाउनलोड एक यूनिफ़ाइड डिफ़ है, यानी वही <code>@@ -3,5 +3,5 @@</code>
        वाला फ़ॉर्मैट जिसे <code>git apply</code>, <code>patch</code> और हर कोड
        रिव्यू टूल पढ़ता है। कॉपी वही चीज़ आपके क्लिपबोर्ड में डाल देता है।
        स्क्रीन पर जो है वह उसी का एक रूप है, यानी आमने-सामने या एक ही कॉलम
        में, और
        जब तक आप पूरा न माँगें तब तक न बदले हिस्से एक गिनती में सिमटे हुए।"""

[[faq]]
q = "क्या यह खाली जगह, बड़े-छोटे अक्षर या खाली पंक्तियाँ अनदेखी कर सकता है?"
a = """
        हाँ, हर एक अलग से। खाली जगह अनदेखी करने पर सिर्फ़ दोबारा सजाई गई फ़ाइल
        बिना बदलाव की निकलती है; बड़े-छोटे अक्षर अनदेखे करने पर
        <code>Error</code> और <code>error</code> एक ही शब्द गिने जाते हैं;
        खाली पंक्तियाँ अनदेखी करने पर वे पंक्तियाँ छूट जाती हैं जिनमें कुछ है
        ही नहीं। तब नतीजे के ऊपर की गिनती कहती है कि जिन फ़र्कों को आपने
        अनदेखा करने को कहा उन्हें अनदेखा करते ही दोनों बराबर हैं &mdash; जो
        हूबहू एक जैसा होने के दावे से अलग दावा है, और पेज दोनों दावों को अलग
        ही रखता है।"""

[[faq]]
q = "यह कितनी बड़ी तुलना सँभाल सकता है?"
a = """
        यहाँ कोई सीमा तय की ही नहीं गई है, क्योंकि उसका बिल चुकाने वाला कोई
        सर्वर ही नहीं। बीस हज़ार पंक्तियों के दो टेक्स्ट, जिनमें मुट्ठी भर
        बदलाव हों, पलक झपकते मिल जाते हैं, क्योंकि साझा शुरुआत और साझा अंत
        असली काम शुरू होने से पहले ही काट दिए जाते हैं। ऐसे दो टेक्स्ट की
        तुलना जिनमें कुछ भी साझा न हो, जल्दी ही रुक जाती है और यह कह भी देती
        है, बजाय इसके कि उस बात को साबित करने में एक मिनट लगाए जो पहले ही
        ज़ाहिर थी। और बहुत लंबी तुलना पहली कुछ हज़ार पंक्तियाँ खींचकर बाकी
        डाउनलोड की गई पैच पर छोड़ देती है।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, और न इस पर
        कोई सीमा कि आप कितना चिपकाएँ। साइट पर विज्ञापन हैं, और वही इसका खर्च
        उठाते हैं; विज्ञापनों को आपके टेक्स्ट के बारे में कुछ नहीं दिया
        जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
