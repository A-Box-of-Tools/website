[[privacy]]
title = "आपकी तस्वीरों के जाने के लिए कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ ऐसा कोई एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा हो सकें, और होता भी तो कोड में ऐसा कुछ नहीं
      है जो उन्हें भेजता।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं मँगाता।"
body = """
 <code>src/</code> में कहीं
      भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। आकार बदलना कैनवस पर एक <code>drawImage</code>
      और एक <code>canvas.toBlob</code> भर है, यानी वही स्केलर और वही एनकोडर जो
      आपके ब्राउज़र में पहले से लगे हुए हैं।"""

[[privacy]]
title = "जिस फ़ाइल को बदलने को किसी ने कहा ही नहीं, वह बदली नहीं जाती।"
body = """
 न क्रॉप, न आकार
      बदलना, न फ़ॉर्मैट बदलना। ऐसे में आपकी चुनी फ़ाइल दोबारा सहेजे जाने के
