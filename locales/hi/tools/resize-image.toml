[[privacy]]
title = "आपकी तस्वीरों के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा की जा सकें, और कोड में ऐसा कुछ भी नहीं जो
      उन्हें भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 <code>src/</code> में
      कहीं भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। आकार बदलना है एक <code>drawImage</code> कैनवस
      पर और एक <code>canvas.toBlob</code> &mdash; वही स्केलर और वही एनकोडर जो
      आपके ब्राउज़र में पहले से लगे हुए हैं।"""

[[privacy]]
title = "जिस फ़ाइल को बदलने को किसी ने कहा ही नहीं, वह बदली नहीं जाती।"
body = """
 न क्रॉप, न आकार
      बदलना, न फ़ॉर्मैट बदलना &mdash; ऐसे में आपकी चुनी फ़ाइल दोबारा सहेजे
      जाने के बजाय बाइट-दर-बाइट सीधे आपको लौटा दी जाती है। यह सिर्फ़
      शिष्टाचार नहीं है: यही वजह है कि यह टूल चुपचाप किसी तस्वीर को दोबारा
      एनकोड नहीं कर सकता, और न ही उस तस्वीर का मेटाडेटा चुपचाप गिरा सकता है
      जिसे आप बस देखना चाहते थे।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपकी तस्वीरों के बारे में कुछ नहीं सौंपा जाता। कोई
      फ़ाइल पढ़ने, क्रॉप करने, आकार बदलने या लिखने वाली हर पंक्ति इसी ऑरिजिन
      से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस
      काम करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई क़दम कभी था ही नहीं।
      सबसे आसान सबूत यही है।"""

[[howto]]
title = "अपनी तस्वीरें चुनिए।"
body = """
 उन्हें पिकर पर छोड़ दीजिए या हाथ से
      चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है; इस दौरान कुछ भी
      कहीं नहीं भेजा जाता।"""

[[howto]]
title = "चाहें तो क्रॉप कीजिए।"
body = """
 डिब्बा पूरी तस्वीर पर से शुरू होता है,
      इसलिए उसे छुए बिना छोड़ देने पर कुछ भी क्रॉप नहीं होता। उसे खींचिए, या
      किसी आकार पर लॉक कीजिए &mdash; प्रोफ़ाइल फ़ोटो के लिए 1:1, स्टोरी के
      लिए 9:16, थंबनेल के लिए 16:9 &mdash; और जो सबसे बड़ा डिब्बा समा सके
      उसके लिए &ldquo;सबसे बड़ा&rdquo; दबाइए। हर तस्वीर का अपना डिब्बा रहता
      है: सूची में किसी भी पंक्ति पर क्लिक कीजिए और उसी पर खींचिए। अगर सबका
      फ़्रेम एक जैसा ही चाहिए, तो एक बटन वह भी कर देता है।"""

[[howto]]
title = "बताइए कि नतीजा किस साइज़ का निकले।"
body = """
 चौड़ाई, ऊँचाई, या दोनों;
      या लंबा किनारा, जिससे खड़ी और पड़ी दोनों तस्वीरें आपस में एक ही साइज़ की
      रहती हैं; या फिर सीधा-सादा प्रतिशत। दोनों में से एक डिब्बा ख़ाली छोड़
      दीजिए और तस्वीर अपना आकार बनाए रखेगी।"""

[[howto]]
title = "फ़ॉर्मैट चुनिए, फिर बटन दबाइए।"
body = """
 हर फ़ाइल जिस फ़ॉर्मैट में आई
      थी वही रहने दीजिए, या सब कुछ JPEG, PNG या WebP में लिखवाइए। हर नतीजा
      बताता है कि वह क्या बना और कितना छोटा हुआ; किसी पर क्लिक करके उसे पूरे
      साइज़ में खोलिए, उसके पीछे के सारे आँकड़ों के साथ, और तुलना के लिए
      बग़ल में असली तस्वीर भी। पूरा ढेर एक ही ज़िप में उतरता है।"""

[[faq]]
q = "क्या मेरी तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर डिकोड करता,
        क्रॉप करता, स्केल करता और लिखता है &mdash; उन्हीं JPEG, PNG और WebP
        एनकोडरों से जो ब्राउज़र में पहले से आते हैं। इस टूल में किसी भी क़िस्म
        की कोई नेटवर्क सुविधा है ही नहीं &mdash; यह न कभी कुछ लाता है, न कभी
        कुछ भेजता है &mdash; और पेज की <code>Content-Security-Policy</code> उन
        सारे पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है; उनमें से एक
        भी इस साइट का नहीं है।"""

[[faq]]
q = "अगर मैं चौड़ाई दूँ पर ऊँचाई नहीं, तो क्या होगा?"
a = """
        ऊँचाई तस्वीर के अपने आकार से निकल आती है, और लगभग हमेशा यही चाहिए भी
        होता है: &ldquo;1920 चौड़ी&rdquo; का मतलब है &ldquo;1920 चौड़ी और उससे
        जितनी ऊँची बनती हो उतनी ऊँची&rdquo;। दोनों भर दीजिए तो ये दोनों तस्वीर
        के आकार से टकरा सकती हैं, और सिर्फ़ तभी &ldquo;अगर आकार आपस में न
        मिलें&rdquo; वाला चुनाव सामने आता है &mdash; डिब्बे के भीतर समा
        जाइए, डिब्बा भरकर बाहर निकलता हिस्सा काट दीजिए, बैकग्राउंड से खाली
        जगह भर दीजिए, या तस्वीर खींचकर विकृति क़बूल कर लीजिए।"""

[[faq]]
q = "क्या आकार बदलने से क्वालिटी घटती है?"
a = """
        तस्वीर को छोटा करने से नहीं, कम से कम ऐसे किसी तरीक़े से नहीं जो आपको
        दिखे: भीतर जाने वाले पिक्सल बाहर आने वालों से ज़्यादा हैं, इसलिए जो
        ब्योरा बचता है वह असली ब्योरा है। तस्वीर को बड़ा करने से वह नहीं जुड़
        सकता जो कभी खींचा ही नहीं गया &mdash; नतीजा उसी तस्वीर की नरम नक़ल
        होती है, ज़्यादा साफ़ नहीं &mdash; इसीलिए &ldquo;तस्वीर को उसके असली
        साइज़ से बड़ा कभी मत कीजिए&rdquo; डिफ़ॉल्ट रूप से चालू रहता है। थोड़ी
        क़ीमत बाद में होने वाला दोबारा एनकोड लेता है, अगर फ़ॉर्मैट JPEG या
        WebP हो, और वहाँ आप क्वालिटी वाले स्लाइडर से ख़र्च करते हैं।"""

[[faq]]
q = "क्या मैं हर तस्वीर को अलग-अलग तरीक़े से क्रॉप कर सकता हूँ?"
a = """
        हाँ &mdash; डिफ़ॉल्ट यही है। सूची में मौजूद हर तस्वीर का अपना डिब्बा
        होता है, उसके अपने पिक्सलों में, और किसी पंक्ति पर क्लिक करते ही वह
        तस्वीर अपने डिब्बे और अपने लॉक किए आकार के साथ प्रीव्यू में आ जाती है।
        एक के साथ जो कुछ आप करते हैं, उसका दूसरी पर कोई असर नहीं पड़ता। हर
        डिब्बा पूरी तस्वीर पर से शुरू भी होता है, इसलिए जिस तस्वीर पर आपने
        कभी कुछ खींचा ही नहीं, वह बिलकुल क्रॉप नहीं होती।"""

[[faq]]
q = "क्या यह पूरे ढेर को एक ही तरीक़े से एक साथ क्रॉप कर सकता है?"
a = """
        हाँ, प्रीव्यू के नीचे वाले बटन से। यह बाक़ी हर तस्वीर को उतना ही
        सापेक्ष हिस्सा देता है &mdash; उसकी अपनी चौड़ाई और ऊँचाई का उतना ही
        अंश &mdash; जो एक ही साइज़ के स्क्रीनशॉट या एक्सपोर्ट के सेट में ठीक
        वही डिब्बा बन जाता है, और पेज यह बात कह भी देता है। कोई आकार लॉक हो
        तो यह हर तस्वीर को उस हिस्से के भीतर उसी आकार का सबसे बड़ा डिब्बा दे
        देता है &mdash; यानी 1:1 दबाकर फिर यह बटन दबाने से खड़ी-पड़ी मिली-जुली
        तस्वीरों के फ़ोल्डर से वर्ग निकल आते हैं। हर डिब्बा उसके बाद भी बदला
        जा सकता है।"""

[[faq]]
q = "यह कौन-कौन से फ़ॉर्मैट पढ़ और लिख सकता है?"
a = """
        यह वह सब पढ़ लेता है जो आपका ब्राउज़र डिकोड कर सकता है, यानी व्यवहार
        में JPEG, PNG, WebP, GIF, BMP और &mdash; ज़्यादातर मौजूदा ब्राउज़रों
        में &mdash; AVIF भी। यह JPEG, PNG और WebP लिखता है, क्योंकि ब्राउज़र
        यही एनकोडर साथ लाते हैं। &ldquo;फ़ॉर्मैट वही रहने दीजिए&rdquo; पर JPEG
        JPEG ही रहता है और PNG, PNG; जो कुछ ब्राउज़र लिख नहीं सकता, जैसे GIF
        या BMP, वह PNG बनकर निकलता है &mdash; वही अकेला है जो पारदर्शिता और
        सपाट रंग दोनों साबुत रखता है।"""

[[faq]]
q = "JPEG में सहेजने पर पारदर्शिता का क्या होता है?"
a = """
        वह बैकग्राउंड के रंग से भर दी जाती है, क्योंकि JPEG में उसे रखने के
        लिए अल्फ़ा चैनल होता ही नहीं। रंग आपको चुनना है और शुरुआत सफ़ेद से
        होती है, जो ज़्यादातर लोगों को चाहिए भी होता है और जो लगभग हर दूसरा
        टूल आपको बताए बिना कर देता है। खाली जगह भरने वाले फ़्रेम के पीछे भी
        यही रंग लगता है। इसके बजाय PNG या WebP में सहेजिए और पारदर्शिता
        बिना छुए आर-पार चली आती है।"""

[[faq]]
q = "क्या यह EXIF और GPS डेटा हटा देता है?"
a = """
        जिस पर यह सचमुच काम करता है, उसका हाँ &mdash; एक साइड इफ़ेक्ट की तरह:
        क्रॉप करने या आकार बदलने का मतलब है तस्वीर को पिक्सलों में डिकोड करना
        और उन पिक्सलों को दोबारा एनकोड करना, और पिक्सलों से भरा कैनवस कोई टैग
        नहीं ढोता, इसलिए जगह, कैमरे का मॉडल और समय नई फ़ाइल में लिखे ही नहीं
        जाते। जिस फ़ाइल को आप बिलकुल नहीं बदल रहे, उसकी बात अलग है &mdash; वह
        बाइट-दर-बाइट, टैग समेत लौटा दी जाती है। अगर मेटाडेटा हटाना है पर
        तस्वीर छूनी नहीं है, तो
        <a href="../exif-editor/">EXIF दिखाने और हटाने वाला टूल</a> इस्तेमाल
        कीजिए, जो कंटेनर दोबारा लिखता है, कुछ भी दोबारा दबाए बिना।"""

[[faq]]
q = "यह इमेज कंप्रेसर से किस तरह अलग है?"
a = """
        यह वाला माप के बारे में है: आप बताते हैं कितने पिक्सल चाहिए और यह वही
        दे देता है। <a href="../compress-image/">इमेज कंप्रेसर</a> फ़ाइल साइज़
        के बारे में है: आप बताते हैं कितने किलोबाइट की इजाज़त है और वह उस सबसे
        ऊँची क्वालिटी को खोजता है जो उसमें समा जाए, आकार सिर्फ़ तब घटाता है जब
        अकेली क्वालिटी से बात न बने। अगर आपसे कहा गया है &ldquo;1200 पिक्सल
        चौड़ी&rdquo;, तो आप सही जगह पर हैं। अगर कहा गया है &ldquo;500 KB से
        कम&rdquo;, तो दूसरा वाला आपको ज़्यादा क़रीब पहुँचाएगा।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        फ़ाइलों की संख्या या साइज़ पर भी कोई सीमा नहीं है, क्योंकि इनका बिल
        चुकाने वाला कोई सर्वर है ही नहीं &mdash; काम आपके अपने डिवाइस पर होता
        है। साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को
        आपकी तस्वीरों के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीक़ा यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपकी तस्वीरें आकार बदलने के लिए कहीं भेजता, वह प्लग निकालते ही
        रुक जाता।"""

