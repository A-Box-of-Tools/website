      चाहते थे।"""

[[howto]]
title = "देखिए कि बाइट कहाँ गए।"
body = """
 फ़ाइल का हर बाइट ठीक एक ही पंक्ति
      में है, और पंक्तियाँ मिलकर पूरी फ़ाइल बनती हैं। अगर ज़्यादातर हिस्सा
      &ldquo;कंप्रेस्ड पिक्सल&rdquo; में नहीं है, तो बाकी तालिका बता देती है कि
      वह कहाँ है।"""

[[howto]]
title = "फ़्रेम एक-एक करके देखिए।"
body = """
 हर फ़्रेम अपनी देरी, अपना
      आयत, अपना डिस्पोज़ल तरीका और अपना साइज़ दिखाता है। &ldquo;हर फ़्रेम के
      बाद का कैनवस&rdquo; और &ldquo;हर फ़्रेम जो सहेजता है सिर्फ़ वही&rdquo; के
