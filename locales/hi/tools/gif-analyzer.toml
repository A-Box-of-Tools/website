[[howto]]
title = "ज़रूरत हो तो रिपोर्ट ले जाइए।"
body = """
 पूरा विश्लेषण सादे टेक्स्ट में,
      किसी संदेश में चिपकाने या फ़ाइल के साथ रख लेने के लिए। यह पेज के भीतर,
      उसी से बनता है जो पहले से आपकी स्क्रीन पर है।"""

[[faq]]
q = "क्या मेरा GIF कहीं अपलोड होता है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर पढ़ता, खोलता और
        बनाता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और पेज की
        <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह
        बात कर सकता है, जिनमें से एक भी इस साइट का नहीं है। नेटवर्क काट दीजिए,
        यह फिर भी GIF एनालाइज़ करता रहेगा।"""

[[faq]]
q = "मेरी GIF देरी में लिखे से धीमी क्यों चलती है?"
a = """
        क्योंकि हर ब्राउज़र सेकंड के दो सौवें हिस्से से कम देरी मानने से इनकार
        कर देता है और उसकी जगह फ़्रेम को दसवें हिस्से तक रोके रखता है। यह नियम
        1996 में Netscape में लिखा गया था, उस ज़माने के घूमते ग्लोब और
        &ldquo;निर्माणाधीन&rdquo; बोर्ड के लिए, और तब से हर ब्राउज़र में उतारा
        गया है; हटाया कभी किसी ने नहीं।
        <br><br>
        तो जिस GIF के सारे फ़्रेम 0.01 सेकंड कहते हैं, वह 100 फ़्रेम प्रति सेकंड
        पर नहीं चलती। वह 10 पर चलती है, यानी बनाने वाले सॉफ़्टवेयर की मंशा से
        पाँच से दस गुना धीमी। यह पेज दोनों आँकड़े दिखाता है, फ़ाइल क्या कहती है
        और वह असल में क्या करेगी, और जिन फ़्रेम पर असर पड़ता है उन्हें निशान लगा
        देता है। सुधार वहीं होगा जहाँ फ़ाइल बनी थी: 0.01 की जगह 0.02 लिखिए।"""

[[faq]]
q = "&ldquo;डिस्पोज़ल&rdquo; का क्या मतलब है?"
a = """
        किसी फ़्रेम का समय खत्म होने पर स्क्रीन पर क्या छोड़ना है। एनिमेशन ठीक
        दिखेगा या धब्बे छोड़ेगा, यह इसी फ़ील्ड से तय होता है।
        <br><br>
        <strong>जहाँ है वहीं रहने दीजिए</strong> का मतलब है कि अगला फ़्रेम इसी
        के ऊपर पुत जाएगा, और जब फ़्रेम अपारदर्शी हों और एक-दूसरे को ढँकते हों तो
        यही चाहिए। <strong>बैकग्राउंड तक साफ़ कर दीजिए</strong> पहले फ़्रेम का
        आयत पोंछ देता है, और ट्रांसपेरेंसी को यही चाहिए, वरना अगले फ़्रेम के
        आर-पार दिखने वाले हिस्सों में पिछला फ़्रेम झलकता है। <strong>नीचे जो था
        वह लौटा दीजिए</strong> वही वापस रख देता है जो इस फ़्रेम के बनने से पहले
        वहाँ था, और स्थिर बैकग्राउंड पर चलती छोटी चीज़ इसी तरह सहेजी जाती है।
        और <strong>बताया ही नहीं गया</strong> का मतलब है कि फ़ाइल ने कुछ कहा ही
        नहीं, और हर व्यूअर उसे &ldquo;जहाँ है वहीं रहने दीजिए&rdquo; मान लेता
        है।"""

[[faq]]
q = "मेरी GIF इतनी बड़ी क्यों है?"
a = """
        &ldquo;बाइट कहाँ गए&rdquo; वाली तालिका यह आम तौर पर नहीं, आपकी उसी फ़ाइल
        के लिए बताती है, और मुमकिन जवाब गिनती के ही हैं।
        <br><br>
        अगर लगभग सब कुछ <strong>कंप्रेस्ड पिक्सल</strong> में है, तो फ़ाइल में
        बस तस्वीर ही बहुत है: GIF हर फ़्रेम को पूरे पिक्सल के रूप में सहेजती है,
        न मोशन कंपनसेशन, न क्वालिटी का कोई घुंडी वाला नियंत्रण। इसलिए साइज़
        मोटे तौर पर क्षेत्रफल गुणा फ़्रेम की गिनती है। कम फ़्रेम, छोटा आकार या
        कम रंग, बस यही तीन लीवर हैं।
        <br><br>
        अगर बड़ा हिस्सा <strong>कलर टेबल</strong> में है, तो फ़ाइल हर फ़्रेम के
        लिए अलग पैलेट लिख रही है, 768 बाइट प्रति पैलेट। अगर बड़ा हिस्सा
