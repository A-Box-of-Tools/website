[[privacy]]
title = "आपके GIF के पास बाहर जाने का रास्ता ही नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज बात कर सकता है, और उनमें से एक भी इस
      साइट का नहीं है। यहाँ ऐसा कोई ठिकाना है ही नहीं जहाँ आपकी फ़ाइल इकट्ठी की
      जा सके, और होता भी तो कोड में ऐसा कुछ नहीं है जो उसे वहाँ भेजे। पहले यहाँ
      <code>connect-src 'none'</code> लिखा था, जिसमें कोई अपवाद नहीं था।
      विज्ञापन की कीमत यही थी, और यह बता देना भी सौदे का हिस्सा है।"""

[[privacy]]
title = "पढ़ने वाला हिस्सा इस रिपॉज़िटरी की चार फ़ाइलें हैं।"
body = """
 फ़ाइल में क्या है, यह
      पता करने के लिए यहाँ ब्राउज़र का अपना GIF डिकोडर इस्तेमाल नहीं होता,
      क्योंकि वह डिकोडर यह नहीं बताता कि कोई बाइट कहाँ गया। इसलिए फ़ॉर्मैट हाथ
      से पढ़ा जाता है: <code>src/gif.js</code> ब्लॉक-दर-ब्लॉक चलता है,
      <code>src/lzw.js</code> पिक्सल खोलता है, <code>src/frames.js</code>
      उन्हें एक पर एक रखता है, और <code>src/budget.js</code> हिस्सों को वापस
      जोड़कर देखता है कि वे फ़ाइल के साइज़ के बराबर बैठते हैं या नहीं।"""

