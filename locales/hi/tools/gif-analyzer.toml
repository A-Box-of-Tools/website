[[howto]]
title = "जो चीज़ें उभरकर आती हैं, उन्हें देखिए।"
body = """
 वहाँ की हर पंक्ति आपकी
      फ़ाइल से नापी गई है: ऐसी देरी जिसे कोई ब्राउज़र नहीं मानेगा, गायब लूप
      ब्लॉक, ऐसी कलर टेबल जिनका कोई हवाला नहीं देता, कुछ फ़्रेम से भी बड़ा
