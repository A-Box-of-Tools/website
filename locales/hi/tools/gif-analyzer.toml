      सामने स्क्रीन पर आते हैं और वहीं तक रहते हैं। इस रिपॉज़िटरी में ऐसा कोई
      एनालिटिक्स इवेंट है ही नहीं जो इनमें से कुछ ले जाए, और होता भी तो यह पेज
      उसे भेज नहीं सकता।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी फ़ाइल के बारे
      में कुछ नहीं सौंपा जाता, न फ़ाइल, न थंबनेल, न नाम, न साइज़, न फ़्रेम की
