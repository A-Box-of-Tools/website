[[privacy]]
title = "आपकी रिकॉर्डिंग के पास बाहर जाने का रास्ता ही नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज बात कर सकता है, और उनमें से एक भी इस
      साइट का नहीं है। यहाँ ऐसा कोई ठिकाना है ही नहीं जहाँ आपकी फ़ाइल इकट्ठी की जा
      सके, और होता भी तो कोड में ऐसा कुछ नहीं है जो उसे वहाँ भेजे।"""

[[privacy]]
title = "यहाँ से कुछ भी मँगाया नहीं जाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा है ही
      नहीं। न कोई पता चिपकाना है, न कुछ डाउनलोड होता है, न पहली बार इस्तेमाल पर कोई
      इंजन उतरता है। आपके ऑडियो को छूने वाला हर बाइट पेज लोड होते समय इसी ऑरिजिन से
      आया था।"""

[[privacy]]
title = "डिकोडर वही है जो आपके ब्राउज़र में पहले से है।"
body = """

      फ़ाइल <code>decodeAudioData</code> को सौंपी जाती है, यानी वही कोड जो किसी
      <code>&lt;audio&gt;</code> एलिमेंट में गाना बजाता है। आपका फ़ॉर्मैट पढ़ने के
      लिए यहाँ कुछ भेजा नहीं जाता, और उसे पढ़ने के लिए इस पेज से बाहर किसी चीज़ से
      कुछ माँगा भी नहीं जाता।"""

[[privacy]]
title = "वीडियो की तस्वीर तो कभी डिकोड होती ही नहीं।"
body = """
 आप कोई वीडियो डालते हैं तो
      सिर्फ़ उसका ऑडियो ट्रैक माँगा जाता है। फ़्रेम न पढ़े जाते हैं, न डिकोड होते
      हैं, न बनाए जाते हैं, न देखे जाते हैं। इस पेज पर ऐसा कोई कोड ही नहीं है जो यह
      कर सके, और जो फ़ाइल निकलती है उसमें आवाज़ के सिवा कुछ नहीं होता।"""

[[privacy]]
title = "कट इसी डिवाइस की मेमोरी में की गई एक नक़ल है।"
body = """

      काटना यानी हर हिस्से और हर चैनल के लिए एक <code>set</code>: आपने जो सैंपल रखे
      हैं, वे उसी क्रम में एक नई सूची में चले जाते हैं जिसमें आपने उन्हें रखा था।
      किसी संख्या से गुणा सिर्फ़ हर फ़ेड के भीतर के वे कुछ सौ सैंपल होते हैं, और
      बटन दबाने से पहले पेज बता देता है कि वे कितने हैं।"""

[[privacy]]
title = "सैंपल लिख दिए जाते हैं, दोबारा एनकोड नहीं होते।"
body = """

      WAV यानी वही सैंपल जो यह पेज पकड़े हुए है, और उनके आगे एक हेडर। बीच में कोई
      एनकोडर बैठा हुआ नहीं है जो आपकी रिकॉर्डिंग के बारे में फ़ैसले करे, और ऐसा कुछ
      है ही नहीं जिसे अपलोड कहा जा सके और जिस पर यह होता।"""

[[privacy]]
title = "निशानों की फ़ाइल इसी पेज में बनती है।"
body = """
 अपने निशान सहेजने का मतलब है
      कि स्क्रीन पर पहले से मौजूद संख्याओं से एक टेक्स्ट फ़ाइल लिखी जाती है, सीधे
      आपके डाउनलोड में। कोई फ़ाइल लोड करने पर वह यहीं पढ़ी जाती है। इनमें से कोई भी
      नेटवर्क के पास नहीं जाता, और कोई भी समय के अलावा कुछ नहीं ले जाता।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी रिकॉर्डिंग के बारे
      में कुछ नहीं सौंपा जाता, न फ़ाइल, न सैंपल, न नाम, न साइज़, न लंबाई, न यह कि
      आपने कहाँ काटा। पढ़ने, काटने और लिखने वाली हर पंक्ति इसी ऑरिजिन से आती है और
      रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर वाला &ldquo;Buy me a coffee&rdquo; बटन cdnjs.buymeacoffee.com की एक
      स्क्रिप्ट बनाती है और अक्षर Google Fonts से आते हैं। वह एक लिंक से ज़्यादा
      कुछ नहीं है। न वह आपकी विज़िट की ख़बर देता है, न उसे आपके या आपकी रिकॉर्डिंग
      के बारे में कुछ मिलता है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, इस पेज का सब कुछ काम
      करता रहेगा। सबसे आसान सबूत यही है।"""

[[howto]]
title = "एक रिकॉर्डिंग चुनिए।"
body = """
 MP3, WAV, FLAC, M4A, Ogg या Opus फ़ाइल
      चुनने वाले खाने में छोड़ दीजिए, और अगर आपको किसी वीडियो की आवाज़ का कोई हिस्सा
      चाहिए तो वीडियो ही छोड़ दीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है और
      वेवफ़ॉर्म की तरह बना देता है; इस बीच कुछ भी कहीं नहीं जाता।"""

[[howto]]
title = "इसे चलाइए और मनचाहे हिस्सों पर निशान लगाइए।"
body = """
 जहाँ कोई हिस्सा शुरू होना
      चाहिए वहाँ <kbd>I</kbd> दबाइए और जहाँ ख़त्म होना चाहिए वहाँ <kbd>O</kbd>।
      जितनी बार चाहें कीजिए: हर जोड़ी नीचे की तालिका में एक पंक्ति बन जाती है और
      वेवफ़ॉर्म पर एक पट्टी। <kbd>U</kbd> आख़िरी वाली वापस ले लेता है,
      <kbd>Space</kbd> चलाता और रोकता है, ऐरो कीज़ पाँच सेकंड कूदती हैं, और
      <kbd>Shift</kbd> के साथ दस मिलीसेकंड खिसकती हैं। अगर वह पल पकड़ना मुश्किल हो
      तो रफ़्तार धीमी कर लीजिए।"""

[[howto]]
title = "निशान सुधारिए।"
body = """
 हर पंक्ति अलग से सुनी जा सकती है, उसमें ठीक
      समय टाइप करके दोबारा सेट की जा सकती है, क्रम में ऊपर-नीचे खिसकाई जा सकती है
      या हटाई जा सकती है। चुने हुए हिस्से के दोनों सिरे वेवफ़ॉर्म पर खींचे भी जा
      सकते हैं, और साँस की आवाज़ के बजाय ख़ामोशी पर निशान लाने का यही सबसे तेज़
      तरीका है। ऊपर दिखने वाला जोड़ ही तैयार रिकॉर्डिंग की लंबाई होगी।"""

[[howto]]
title = "इन्हें रखिए, या इन्हें काट दीजिए।"
body = """
 रखना आम तरीका है: तैयार
      रिकॉर्डिंग वही हिस्से हैं जिन पर आपने निशान लगाया, क्रम से जुड़े हुए। काट
      देना वह दूसरा काम है जो लोग चाहते हैं और कम ही पाते हैं। &ldquo;हूँ&rdquo;,
      बजते फ़ोन या ग़लत शुरुआत पर निशान लगाइए, और जो बचता है वह उनके बिना जुड़
      जाता है।"""

[[howto]]
title = "काटिए और डाउनलोड कीजिए।"
body = """
 हर कट उसी सैंपल पर पड़ती है जिस पर
      आपने निशान लगाया; यहाँ किसी की-फ़्रेम पर गोल करना नहीं होता, क्योंकि आवाज़ में
      की-फ़्रेम होती ही नहीं। चुनने लायक बस एक चीज़ है, कि हर जोड़ पर कितना फ़ेड
      लगे। पाँच मिलीसेकंड खटके को रोकने के लिए काफ़ी हैं और फ़ेड की तरह सुनाई देने
      के लिए बहुत ही कम। जो निकलता है वह एक WAV है, जो पहले पेज पर बजाया जाता है और
      फिर सीधे आपके ब्राउज़र के डाउनलोड में चला जाता है।"""

[[faq]]
q = "क्या मेरा ऑडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर पढ़ता है, निशान लगाता
        है, काटता है और लिखता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और पेज
        की <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह
        बात कर सकता है, जिनमें से एक भी इस साइट का नहीं है। सुनने से बेहतर आपको
        जाँचना लगे तो इंटरनेट काट दीजिए और तब भी कोई रिकॉर्डिंग काटिए।"""

[[faq]]
q = "क्या एक ही रिकॉर्डिंग के कई हिस्से रखे जा सकते हैं?"
a = """
        यह इसी के लिए है। बजते समय <kbd>I</kbd> और <kbd>O</kbd> जितनी बार चाहें
        दबाइए; हर जोड़ी एक पंक्ति बन जाती है, और तैयार फ़ाइल वही सारी पंक्तियाँ हैं,
        क्रम से जुड़ी हुई और बाकी सब हटा हुआ। ज़्यादातर ऑनलाइन ट्रिमर आपको एक ही
        जोड़ी हैंडल देते हैं और पूछते हैं कि कौन-सा एक टुकड़ा रखना है। किसी जिंगल के
        आगे-पीछे छाँटने के लिए यह ठीक है, और एक घंटे का इंटरव्यू एक बार सुनकर उसमें
        से काम के छह जवाब रखने के लिए बिल्कुल बेकार।"""

[[faq]]
q = "क्या कट ठीक वहीं पड़ती है जहाँ मैंने निशान लगाया?"
a = """
        हाँ, हर हिस्से पर और हर प्लेयर में। यही एक जगह है जहाँ ऑडियो वीडियो से आसान
        है: डिकोड की हुई रिकॉर्डिंग संख्याओं की एक कतार है और हर संख्या अपने आप में
        पूरी है, इसलिए की-फ़्रेम जैसी कोई चीज़ नहीं है जिस पर पीछे गोल किया जाए, और
        न ही कट के जल्दी शुरू होने की कोई वजह। पेज दिखा देता है कि नतीजा किस सैंपल
        नंबर से शुरू होता है, यानी आपके लगाए निशान को सैंपल रेट से गुणा करके नज़दीकी
        पूरे सैंपल पर गोल किया हुआ।"""

[[faq]]
q = "जोड़ पर खटका क्यों आएगा, और फ़ेड किसलिए है?"
a = """
        क्योंकि एक शब्द के बीच से दूसरे शब्द के बीच में काटने पर दो बेमेल वेवफ़ॉर्म
        अगल-बगल आ जाते हैं, और जिस स्पीकर से उनके बीच छलाँग लगाने को कहा जाए वह एक
        खटका पैदा करता है। यह कट की ख़ामी नहीं है, टूटी हुई निरंतरता ऐसी ही सुनाई
        देती है। इलाज है हर जोड़ के दोनों ओर कुछ मिलीसेकंड का फ़ेड: इतना लंबा कि
        कोन वहाँ तक पहुँच जाए, और इतना छोटा कि फ़ेड की तरह सुनाई ही न दे। डिफ़ॉल्ट
        पाँच मिलीसेकंड है और इसे बंद भी किया जा सकता है। फ़ेड सिर्फ़ उसी किनारे पर
        लगता है जो सचमुच कट हो, इसलिए रिकॉर्डिंग के बिल्कुल शुरू या आख़िर का किनारा
        जस का तस रहता है।"""

[[faq]]
q = "क्या मैं इसके बजाय ख़राब हिस्से काट सकता हूँ?"
a = """
        हाँ। उन पर निशान लगाइए, फिर &ldquo;इन्हें काट दीजिए&rdquo; चुनिए: जिन पर
        आपने निशान <em>नहीं</em> लगाया, वे क्रम से जुड़ जाएँगे। निशानों की वही एक
        सूची दोनों सवालों का जवाब देती है, इसलिए आप दोनों के बीच बदलकर लंबाई बदलते
        देख सकते हैं और कुछ भी दो बार निशान लगाने की ज़रूरत नहीं पड़ती।"""

[[faq]]
q = "क्या मैं अपने निशान सहेजकर बाद में लौट सकता हूँ?"
a = """
        हाँ। &ldquo;निशान सहेजिए&rdquo; एक सादी टेक्स्ट फ़ाइल लिखता है, एक पंक्ति में
        एक हिस्सा, शुरू और अंत के बीच अल्पविराम, और &ldquo;निशान लोड कीजिए&rdquo;
        उसे वापस पढ़ लेता है। दो फ़ॉर्मैट मिलते हैं, सीधे सेकंड और
        <code>HH:MM:SS.mmm</code>, और दोनों वही सजावट हैं जो इस साइट का वीडियो कटर
        लिखता है। इसलिए वीडियो पर बनाई फ़ाइल उसके ऑडियो पर डाली जा सकती है और उलटा
        भी। निशान लगाना सधा हुआ काम है और किसी को यह दो बार नहीं करना चाहिए।"""

[[faq]]
q = "मैं कौन-कौन से फ़ॉर्मैट खोल सकता हूँ?"
a = """
        जो कुछ भी आपका ब्राउज़र डिकोड कर लेता है, यानी व्यवहार में MP3, WAV, FLAC,
        M4A और AAC, Ogg Vorbis और Opus, तथा MP4, M4V, MOV और WebM वीडियो के भीतर का
        ऑडियो। बाहर वही छोटी-सी सूची रहती है जो हर जगह रहती है: AVI, WMA और
        ज़्यादातर MKV। जिस फ़ाइल को यह ब्राउज़र नहीं पढ़ेगा, उसे आधे रास्ते में
        अटकने के बजाय यह कहते हुए मना कर दिया जाता है।"""

[[faq]]
q = "यह MP3 के बजाय WAV क्यों सहेजता है?"
a = """
        क्योंकि किसी भी ब्राउज़र में MP3 एनकोडर नहीं आता, और यह टूल आपकी रिकॉर्डिंग
        किसी ऐसे सर्वर को भेजने से इनकार करता है जिसके पास वह हो। WAV को एनकोडर
        चाहिए ही नहीं, वह तो सैंपल हैं और उनके आगे एक छोटा-सा हेडर। इसलिए यह ईमानदार
        विकल्प भी है और अकेला ऐसा भी जो बाहर निकलते समय क्वालिटी नहीं खा सकता। हाँ,
        बड़ा ज़रूर है: स्टीरियो में लगभग दस मेगाबाइट प्रति मिनट। इसे हर प्लेयर, हर
        फ़ोन और हर एडिटर खोल लेता है, और जिसे MP3 चाहिए वह इसी से बना सकता है। MP3 को
        उसके फ़्रेम नक़ल करके काटने पर फ़ाइल छोटी रहती, पर हर कट नज़दीकी फ़्रेम की
        सीमा पर खिसक जाती, और यही वह गोल करना है जिससे बचने के लिए यह टूल बना है।"""

[[faq]]
q = "क्या रिकॉर्डिंग की लंबाई की कोई सीमा है?"
a = """
        टूल में कोई सीमा बनी हुई नहीं है। असली छत मेमोरी है: पूरी रिकॉर्डिंग एक साथ
        इसी पेज में डिकोड होती है, और WAV भी डाउनलोड से पहले मेमोरी में जुड़ता है,
        इसलिए एक घंटे के स्टीरियो को काम करने के लिए एक गीगाबाइट से कुछ कम जगह
        चाहिए। चार गीगाबाइट की WAV सिरे से मना कर दी जाती है, क्योंकि इस फ़ॉर्मैट का
        अपना साइज़ वाला ख़ाना ही उतनी बड़ी फ़ाइल का ब्योरा नहीं दे सकता।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क। साइट
        पर विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपकी रिकॉर्डिंग के
        बारे में कुछ नहीं दिया जाता।"""

