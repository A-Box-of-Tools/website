[[privacy]]
title = "आपकी तस्वीरों के जाने के लिए कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यह टूल उस सूची में कुछ भी नहीं
      जोड़ता, क्योंकि इसकी अपनी कोई नेटवर्क सुविधा है ही नहीं, वैकल्पिक तक
      नहीं। यहाँ ऐसा कोई एंडपॉइंट है ही नहीं जहाँ आपकी फ़ाइलें जमा हो सकें,
      और होता भी तो कोड में ऐसा कुछ नहीं है जो उन्हें भेजता।"""

[[privacy]]
title = "PDF यहीं लिखी जाती है।"
body = """
 PDF दरअसल ऑब्जेक्ट की एक सूची है, और
      साथ में एक तालिका जो बताती है कि हर ऑब्जेक्ट कहाँ से शुरू होता है।
      <code>src/pdf.js</code> दोनों लिखता है। कोई लाइब्रेरी बाहर से नहीं आती,
      किसी सर्वर पर कुछ भी रेंडर नहीं होता, और तैयार फ़ाइल मेमोरी से सीधे
      डाउनलोड को सौंप दी जाती है।"""

[[privacy]]
title = "दस्तावेज़ को आपके बारे में कुछ नहीं बताया जाता।"
body = """
 ज़्यादातर टूल PDF पर
      समय और उसे बनाने वाले प्रोग्राम का नाम ठप्पे की तरह लगा देते हैं। यह
      वाला शीर्षक, लेखक और तारीख सिर्फ़ तब लिखता है जब आप उन्हें खुद टाइप
      करें। आपकी तस्वीरों के फ़ाइल-नाम दस्तावेज़ में कभी नहीं आते, और न ही
      आपकी मशीन के बारे में कुछ।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी तस्वीरों के
      बारे में कुछ नहीं सौंपा जाता। न फ़ाइल, न थंबनेल, न नाम, न साइज़, न
      गिनती। तस्वीर पढ़ने, डिकोड करने या लिखने वाली हर पंक्ति इसी ऑरिजिन से
      आती है और रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक भर है, उससे ज़्यादा कुछ नहीं। वह किसी
      विज़िट की खबर नहीं करता, और उसे आपके या आपकी तस्वीरों के बारे में कुछ
      नहीं दिया जाता। जब तक आप क्लिक न करें कुछ होता ही नहीं, और क्लिक करने
      पर आप किसी और की साइट पर पहुँच जाते हैं।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, इस पेज की हर चीज़
      काम करती रहेगी। सबसे आसान सबूत यही है, क्योंकि जो टूल आपकी तस्वीरें
      दस्तावेज़ बनाने के लिए कहीं भेजता, वह वहीं रुक जाता।"""

[[howto]]
title = "अपनी तस्वीरें चुनिए।"
body = """
 पूरा फ़ोल्डर पिकर पर छोड़ दीजिए, या
      फ़ाइलें हाथ से चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है,
      और इस दौरान कुछ भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "पन्नों को क्रम में लगाइए, और जिन्हें ज़रूरत हो उन्हें घुमा दीजिए।"
body = """
 एक तस्वीर
      एक पन्ना बनती है, उसी क्रम में जो दिख रहा है। किसी टाइल को उसके हैंडल से
      खींचकर हिलाइए, या तीरों का इस्तेमाल कीजिए। घुमाने वाले बटन पन्ने को
      एक-चौथाई करके घुमाते हैं, जो टेढ़े स्कैन को आम तौर पर चाहिए होता है।"""

[[howto]]
title = "पन्ने का आकार चुनिए।"
body = """
 &ldquo;हर तस्वीर के हिसाब से पन्ना
      बनाइए&rdquo; हर पन्ने को ठीक उसकी तस्वीर जितना बना देता है, जिससे न कुछ
      क्रॉप होता है, न सफ़ेद पट्टियाँ बनती हैं। नाम वाले आकार, यानी A4,
      Letter, Legal और बाकी, इसके बजाय हर तस्वीर को एक तय पन्ने पर रखते हैं,
      और चाहें तो हाशिये के साथ।"""

[[howto]]
title = "PDF बनाइए और डाउनलोड कीजिए।"
body = """
 दस्तावेज़ आपकी अपनी मशीन पर
      लिखा जाता है, इसलिए कितनी देर लगेगी यह किसी कतार पर नहीं, आपके
      हार्डवेयर पर निर्भर है। तैयार फ़ाइल सीधे आपके ब्राउज़र के डाउनलोड में
      चली जाती है।"""

[[faq]]
q = "क्या मेरी तस्वीरें कहीं अपलोड होती हैं?"
a = """
        नहीं। आपकी तस्वीरें आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता
        है, और PDF भी वही लिखता है। इस टूल का कोई सर्वर वाला हिस्सा है ही
        नहीं, और पेज की <code>Content-Security-Policy</code> उन सारे पतों के
        नाम गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस साइट
        का नहीं है। यहाँ के कुछ दूसरे टूलों के उलट, इसमें वैकल्पिक नेटवर्क
        सुविधा तक नहीं है।"""

[[faq]]
q = "क्या PDF में बदलने से क्वालिटी घटती है?"
a = """
        डिफ़ॉल्ट सेटिंग पर JPEG की नहीं। PDF, JPEG डेटा को सीधे ढो सकती है,
        इसलिए फ़ोटोग्राफ़ बाइट-दर-बाइट दस्तावेज़ में उतार दी जाती है। वह न कभी
        डिकोड होती है, न दोबारा कंप्रेस होती है, और PDF की तस्वीर वही तस्वीर
        है जो फ़ाइल में थी। बाकी फ़ॉर्मैट दोबारा एनकोड करने ही पड़ते हैं,
        क्योंकि PDF के पास उनके लिए कोई फ़िल्टर नहीं है। यह तब तक, जब तक आप
        नुकसान-रहित वाली सेटिंग न चुनें, जो उन्हें ठीक वैसा ही सहेजती है, बड़ी
        फ़ाइल की कीमत पर।"""

[[faq]]
q = "मैं कौन-कौन से इमेज फ़ॉर्मैट इस्तेमाल कर सकता हूँ?"
a = """
        कोई भी स्थिर तस्वीर जिसे आपका ब्राउज़र डिकोड कर सके, यानी व्यवहार में
        JPG, PNG, WebP, GIF, AVIF, और Apple डिवाइसों पर HEIC भी। यहाँ अलग से
        कोई सूची अपडेट रखने की ज़रूरत नहीं पड़ती, क्योंकि डिकोड करना हमारा
        नहीं, ब्राउज़र का काम है।"""

[[faq]]
q = "क्या मैं पन्ने का आकार और पन्नों का क्रम चुन सकता हूँ?"
a = """
        हाँ। पन्ने A4, Letter, Legal, A3, A5, Tabloid, आपके टाइप किए किसी आकार
        के, या ठीक हर तस्वीर जितने हो सकते हैं। क्रम बदलने के लिए टाइलें
        खींचिए, उन्हें नाम या तारीख से क्रम में लगाइए, किसी को भी एक-चौथाई
        घुमाइए, और मिलीमीटर में हाशिया तय कीजिए।"""

[[faq]]
q = "एक PDF में मैं कितनी तस्वीरें डाल सकता हूँ?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है। व्यावहारिक छत आपकी अपनी मशीन की
        मेमोरी है, क्योंकि तैयार दस्तावेज़ डाउनलोड से पहले वहीं जुड़ता है।
        पूरे रिज़ॉल्यूशन पर कुछ सौ फ़ोन-फ़ोटो सबसे पहले यह अड़चन महसूस कराती
        हैं, और सेटिंग में सबसे लंबे किनारे को छोटा कर देने से वह छत काफ़ी दूर
        खिसक जाती है।"""

[[faq]]
q = "क्या PDF में मेरी फ़ाइलों के नाम या समय दर्ज होता है?"
a = """
        नहीं, जब तक आप खुद न कहें। दस्तावेज़ की जानकारी वाला ब्लॉक इस टूल के
        नाम के सिवा खाली छोड़ दिया जाता है। न फ़ाइलों के नाम, न मशीन का नाम,
        न यूज़र का नाम, और बनने की तारीख भी नहीं, जब तक आप उसका डिब्बा न
        चुनें। यह जान-बूझकर है, क्योंकि PDF वह चीज़ है जिसे लोग दूसरे लोगों को
        भेजते हैं।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल। साइट पर
        विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपकी तस्वीरों
        के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए, यह चलता रहेगा।
        कुछ अपलोड नहीं हो रहा, यह साबित करने का सबसे आसान तरीका भी यही है।
        जो टूल आपकी तस्वीरें दस्तावेज़ बनाने के लिए कहीं भेजता, वह प्लग
        निकालते ही रुक जाता।"""

