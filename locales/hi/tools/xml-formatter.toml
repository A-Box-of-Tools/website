[[privacy]]
title = "आप जो पेस्ट करते हैं उसके जाने की कोई जगह नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज संपर्क कर सकता है, और उनमें से एक भी हमारा
      नहीं है। यहाँ ऐसा कोई एंडपॉइंट नहीं है जहाँ पेस्ट की गई इनवॉइस इकट्ठी की जा सके, और
      होता भी तो कोड में ऐसा कुछ नहीं है जो उसे वहाँ भेजे।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 पूरे <code>src/</code> में कहीं
      कोई <code>fetch</code>, कोई <code>XMLHttpRequest</code> और कोई
      <code>sendBeacon</code> नहीं है। पार्सर और प्रिंटर इसी पेज के फ़ंक्शन हैं जो एक
      स्ट्रिंग लेते हैं और एक स्ट्रिंग लौटाते हैं।"""

[[privacy]]
title = "बाहरी एंटिटी कभी हल नहीं की जातीं।"
body = """
 जिसमें बाहरी एंटिटी हो, ऐसा
      <code>DOCTYPE</code> ही वह तरीका है जिससे किसी XML पार्सर को उसी मशीन की फ़ाइल
      पढ़ाने के लिए बहलाया जाता है जिस पर पार्सिंग हो रही है, और यह इस फ़ॉर्मैट का सबसे
      पुराना छेद है। <code>src/xml.js</code> हाथ से लिखा हुआ रीडर है जिसमें एंटिटी हल
      करने की व्यवस्था है ही नहीं &mdash; बंद नहीं की गई, मौजूद ही नहीं &mdash; और यह पेज
      आपका टेक्स्ट ब्राउज़र के अपने <code>DOMParser</code> को भी कभी नहीं देता।"""

[[privacy]]
title = "XML से निकलने वाली हर वैल्यू स्ट्रिंग होती है।"
body = """
 <code>&lt;port&gt;8080&lt;/port&gt;</code>
      यह नहीं कहता कि वह कोई संख्या है, इसलिए JSON में <code>"8080"</code> लिखा जाता है।
      आपकी तरफ़ से यह तय करना ऐसी जानकारी गढ़ना होगा जो आगे ऐसे चलती रहे जैसे वह फ़ाइल में
      थी ही।"""

[[privacy]]
title = "गूगल क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और
      माप वाली स्क्रिप्ट गूगल से आती हैं, और दान वाला बटन Buy Me a Coffee से। इनमें से
      किसी को भी आपके टेक्स्ट का एक अक्षर नहीं दिया जाता। जो भी लाइन उसे पढ़ती, पार्स करती
      या लिखती है, वह इसी ओरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस रहता है,
      क्योंकि इसमें कभी नेटवर्क वाला कदम था ही नहीं। इससे आसान सबूत कोई नहीं।"""

[[howto]]
title = "काम चुनिए।"
body = """
 दो टैब, एक बॉक्स: <em>फ़ॉर्मैट</em> XML को सजाता है
      या दबाकर सपाट करता है; <em>बदलें</em> उसे JSON बनाता है, या JSON को वापस XML।
      अभी-अभी जो XML आपने सजाया है वही वह XML है जिसे आप बदलते हैं, दो बार पेस्ट किए
      बिना।"""

[[howto]]
title = "पेस्ट कीजिए, या फ़ाइल छोड़िए।"
body = """
 जो कुछ आप चुनकर कॉपी कर सकते हैं वह
      सब चलता है, और सिलेक्टर पर छोड़ी गई <code>.xml</code>, <code>.svg</code>,
      <code>.rss</code> या <code>.xsd</code> फ़ाइल को आपका अपना ब्राउज़र पढ़कर बॉक्स में
      डाल देता है &mdash; छोड़ने के लिए अपलोड वाला कोई कदम है ही नहीं।"""

[[howto]]
title = "इंडेंट चुनिए, या दबाकर सपाट कीजिए।"
body = """
 दो स्पेस, चार, या एक टैब।
      दबाकर सपाट करना वही दस्तावेज़ है, बस हर वह स्पेस हटाकर जो सिर्फ़ पढ़ने के लिए था, और
      नतीजा बताता है कि इससे कितने बाइट बचे।"""

[[howto]]
title = "गड़बड़ी वहीं पढ़िए जहाँ गड़बड़ी है।"
body = """
 यहाँ नाकाम होने वाला पार्सर
      &ldquo;लाइन 1 पर गड़बड़ी&rdquo; कहने के बजाय, जो एक ब्राउज़र एक ही बार में पढ़े गए
      दस्तावेज़ के बारे में कहता है, यह बताता है कि <em>कौन-सा टैग</em> कभी बंद नहीं हुआ
      और वह किस लाइन और किस कॉलम पर है।"""

[[howto]]
title = "नतीजा ले जाइए।"
body = """
 कॉपी कीजिए, या फ़ाइल के रूप में डाउनलोड कीजिए,
      जिसका नाम उसी फ़ॉर्मैट पर होगा जिसमें वह निकला।"""

[[faq]]
q = "क्या मेरा XML कहीं अपलोड होता है?"
a = """
        नहीं। इस पेज का पार्सर और प्रिंटर ऐसे फ़ंक्शन हैं जो आपके अपने ब्राउज़र में, आपके
        अपने हार्डवेयर पर चलते हैं। इस टूल में किसी भी तरह की नेटवर्क सुविधा नहीं है
        &mdash; यह कभी कुछ मँगाता नहीं और कभी कुछ भेजता नहीं &mdash; और पेज की
        <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह संपर्क कर
        सकता है, जिनमें से एक भी हमारा नहीं है। XML के मामले में यह इस फ़ॉर्मैट की शोहरत से
        कहीं ज़्यादा मायने रखता है: इसमें जो आता है वह आम तौर पर एक इनवॉइस, एक बैंक
        स्टेटमेंट, एक मेडिकल रिकॉर्ड, या हेडर में क्रेडेंशियल लिए हुए SOAP रिक्वेस्ट होती
        है।"""

[[faq]]
q = "क्या यह बाहरी एंटिटी हल करता है?"
a = """
        नहीं, और बंद करने को कुछ है भी नहीं। बाहरी एंटिटी हल करना ही वह तरीका है जिससे
        किसी XML पार्सर को उसी मशीन की फ़ाइलें पढ़ाने के लिए बहलाया जाता है जिस पर वह चल
        रहा है &mdash; वह हमला जिसे आम तौर पर XXE लिखा जाता है &mdash; और
        <code>src/xml.js</code> हाथ से लिखा हुआ रीडर है जिसमें एंटिटी हल करना है ही नहीं।
        आपका टेक्स्ट ब्राउज़र के अपने <code>DOMParser</code> को भी कभी नहीं दिया जाता। कोई
        <code>DOCTYPE</code> बिना कभी चले आगे बढ़ जाता है।"""

[[faq]]
q = "XML को JSON में बदलने पर क्या खोता है?"
a = """
        मिले-जुले कंटेंट का क्रम, टिप्पणियाँ, और एट्रिब्यूट तथा चाइल्ड एलिमेंट का फ़र्क
        &mdash; आख़िरी वाला मिटता नहीं, बस नरम पड़ जाता है, क्योंकि एट्रिब्यूट ऐसा मेंबर बन
        जाता है जिसका नाम <code>@</code> से शुरू होता है। किसी एलिमेंट का अपना टेक्स्ट, जब
        उसे किसी और के साथ रहना पड़े, <code>#text</code> बन जाता है, और दोहराए गए चाइल्ड
        एक ऐरे बन जाते हैं। हर वैल्यू स्ट्रिंग ही रहती है: XML में टाइप होते ही नहीं, और
        यह तय करना कि <code>8080</code> एक संख्या थी, जानकारी गढ़ना होगा।"""

[[faq]]
q = "JSON को XML में बदलने पर क्या खोता है?"
a = """
        ख़ाली ऑब्जेक्ट, ख़ाली ऐरे और ख़ाली स्ट्रिंग का फ़र्क, जो तीनों एक ख़ाली एलिमेंट बन
        जाते हैं, और हर वैल्यू का टाइप, क्योंकि XML में टाइप होते ही नहीं। ऐरे दोहराया गया
        एलिमेंट बन जाता है, जो वापस पढ़े जाने वाली इकलौती शक्ल है, और जिस key को कोई
        एलिमेंट नाम सँभाल नहीं सकता उसके असुविधाजनक अक्षर बदल दिए जाते हैं, बजाय ऐसा
        दस्तावेज़ निकालने के जिसे कोई पार्सर पढ़ेगा ही नहीं।"""

[[faq]]
q = "क्या यह SVG, RSS फ़ीड या POM फ़ाइल फ़ॉर्मैट कर सकता है?"
a = """
        हाँ। तीनों XML हैं, और यह XML पढ़ता है, उसकी कोई ख़ास बोली नहीं। इस तरह सजाया गया
        SVG हाथ से बदलना आसान होता है; RSS या Atom फ़ीड आम तौर पर दबाकर सपाट किया हुआ ही
        भेजा जाता है और तब तक पढ़ा नहीं जा सकता जब तक कोई उसे खोल न दे। कैसे सजाया गया है,
        इससे दस्तावेज़ का मतलब ज़रा भी नहीं बदलता।"""

[[faq]]
q = "क्या दोबारा इंडेंट करने से XML का मतलब बदल जाता है?"
a = """
        जिस दस्तावेज़ के एलिमेंट दूसरे एलिमेंट रखते हैं, उसमें नहीं। जहाँ फ़र्क पड़ सकता है
        वह है टेक्स्ट: शब्द रखने वाले एलिमेंट के भीतर की ख़ाली जगह उसी टेक्स्ट का हिस्सा
        होती है, इसलिए जिस एलिमेंट में सिर्फ़ टेक्स्ट है उसे खोलने के बजाय एक ही लाइन पर
        छोड़ दिया जाता है। <code>CDATA</code> हिस्से बिलकुल वैसे ही कॉपी होते हैं जैसे
        थे।"""

[[faq]]
q = "ब्राउज़र का अपना XML पार्सर ही क्यों न इस्तेमाल करें?"
a = """
        क्योंकि दस्तावेज़ टूटा हो तो वह क्या कहता है। <code>DOMParser</code> एक एरर
        दस्तावेज़ लौटाता है जिसके शब्द हर ब्राउज़र में अलग होते हैं और अक्सर बात
        &ldquo;लाइन 1 पर गड़बड़ी&rdquo; पर आकर रुक जाती है। हाथ से लिखा रीडर बता सकता है कि
        कौन-सा टैग कभी बंद नहीं हुआ, और वह कहाँ खुला था, और असल में आपको यही जानना था।
        बाहरी एंटिटी हल न करना दूसरी वजह है।"""

[[faq]]
q = "फ़ाइल कितनी बड़ी हो सकती है?"
a = """
        यहाँ कोई सीमा रखी ही नहीं गई, क्योंकि उसके लिए पैसे देने वाला कोई सर्वर नहीं है।
        असली छत आपकी अपनी डिवाइस है: कुछ मेगाबाइट XML ठीक रहता है, और बहुत लंबे दस्तावेज़
        में पेज आपसे कीबोर्ड छीनने के बजाय आपके टाइप करने में ठहराव का इंतज़ार करता है और
        फिर दोबारा फ़ॉर्मैट करता है।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या खाता चाहिए?"
a = """
        यह मुफ़्त है, और कोई खाता नहीं, कोई साइन-इन नहीं, कोई ट्रायल नहीं और आप कितना
        पेस्ट करें इसकी कोई सीमा नहीं। साइट पर विज्ञापन हैं, उन्हीं से इसका खर्च चलता है;
        विज्ञापनों को आपके टेक्स्ट के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहता है। यही सबसे आसान
        तरीका भी है यह साबित करने का कि कुछ अपलोड नहीं हो रहा: जो टूल आपका XML फ़ॉर्मैट
        करने के लिए बाहर भेजता, वह तार निकालते ही रुक जाता।"""

