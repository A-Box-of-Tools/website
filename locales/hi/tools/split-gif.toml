body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज बात कर सकता है, और उनमें से एक भी
      इस साइट का नहीं है। यहाँ ऐसा कोई ठिकाना है ही नहीं जहाँ आपकी फ़ाइलें
      इकट्ठी की जा सकें, और होता भी तो कोड में ऐसा कुछ नहीं है जो उन्हें वहाँ
      भेजे। पहले यहाँ <code>connect-src 'none'</code> लिखा था, जिसमें कोई
      अपवाद नहीं था। विज्ञापन की कीमत यही थी, और यह बता देना भी सौदे का हिस्सा
      है।"""

