[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल। फ़्रेम पर
        वॉटरमार्क भी नहीं आता। साइट पर विज्ञापन हैं और खर्च वही उठाते हैं,
        लेकिन विज्ञापनों को आपकी फ़ाइलों के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए, यह चलता रहेगा। कुछ
        अपलोड नहीं हो रहा, यह साबित करने का सबसे आसान तरीका भी यही है। जो टूल
        आपका एनिमेशन प्रोसेस करने के लिए कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

