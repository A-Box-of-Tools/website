      कहीं भेजता, वह प्लग निकालते ही रुक जाता।"""

[[howto]]
title = "GIF चुनिए।"
body = """
 उसे चुनने वाले खाने में खींचकर छोड़ दीजिए या
      खुद ढूँढ़ लीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है, और पेज बता
      देता है कि उसे क्या मिला: साइज़, कितने फ़्रेम हैं, कितनी देर चलता है और
      कितनी बार दोहराता है।"""

[[howto]]
title = "तय कीजिए कि हर PNG में क्या हो।"
body = """
 <strong>फ़्रेम जैसा दिखता
      है</strong> वही लगभग सबको चाहिए होता है, यानी एनिमेशन के उस पल की पूरी
      तस्वीर। <strong>सिर्फ़ वे पिक्सल जो यह फ़्रेम सहेजता है</strong> वह टुकड़ा
      है जो फ़ाइल असल में रखती है, अपने ही आकार और अपनी ही जगह पर। GIF इसी वजह
      से छोटा रहता है, और एनिमेशन दिखता ऐसा नहीं है।"""

[[howto]]
title = "तय कीजिए कि ट्रांसपेरेंसी का क्या हो।"
body = """
 PNG उसे बचा लेता है,
      और ईमानदार डिफ़ॉल्ट यही है। अगर फ़्रेम ऐसी जगह जा रहे हैं जो
      ट्रांसपेरेंसी को नहीं मानती और उसे काला कर देगी, तो उसकी जगह कोई रंग भर
      दीजिए।"""

[[howto]]
title = "अपने काम के फ़्रेम चुनिए।"
body = """
 डिफ़ॉल्ट में सारे। &ldquo;हर दूसरा
      फ़्रेम रखिए&rdquo; लंबी रिकॉर्डिंग को छाँटता है, और ग्रिड के टिक बॉक्स
      उससे ऊपर चलते हैं। नंबर कभी नहीं बदलते, इसलिए आपने उसके कितने भी पड़ोसी
      छोड़ दिए हों, फ़्रेम 42 फ़्रेम 42 ही रहेगा।"""

[[howto]]
title = "इन्हें डाउनलोड कीजिए।"
body = """
 ग्रिड से एक-एक करके, या सब एक ही ZIP
      में, ताकि सैकड़ों बार के बजाय एक ही बार सेव का सवाल आए। ZIP के साथ एक
      <code>frames.txt</code> भी जा सकती है जिसमें लिखा होता है कि हर फ़्रेम
      कितनी देर टिका। PNG से भरा फ़ोल्डर अपने आप यही एक बात नहीं बता सकता।"""

[[faq]]
q = "क्या मेरा GIF कहीं अपलोड होता है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर पढ़ता, खोलता
        और बनाता है, और हर PNG यहीं मेमोरी में तैयार होती है। इस टूल का कोई
        सर्वर वाला हिस्सा है ही नहीं, और पेज की
        <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह
        बात कर सकता है, जिनमें से एक भी इस साइट का नहीं है। नेटवर्क काट दीजिए,
        यह फिर भी GIF बाँटता रहेगा।"""

[[faq]]
q = "एक फ़्रेम तस्वीर के छोटे से टुकड़े जैसा क्यों दिखता है?"
a = """
        क्योंकि फ़ाइल में वही रखा है। GIF एक पहली तस्वीर है और उसके बाद पैबंद:
        हर अगला फ़्रेम सिर्फ़ वह चौकोर हिस्सा सहेजता है जो बदला, और स्क्रीन पर
        बाकी सब वही है जो पिछले फ़्रेम वहाँ छोड़ गए। इसलिए स्थिर दीवार के आगे
        बोलते हुए सिर की रिकॉर्डिंग में हर फ़्रेम पर एक चेहरा सहेजा जाता है,
        पूरी तस्वीर नहीं, और यही अकेली वजह है कि यह फ़ॉर्मैट बहुत भारी नहीं
        होता।
        <br><br>
        आपको यह इसलिए दिख रहा है क्योंकि &ldquo;सिर्फ़ वे पिक्सल जो यह फ़्रेम
        सहेजता है&rdquo; चुना हुआ है। इसे &ldquo;फ़्रेम जैसा दिखता है&rdquo; पर
        कर दीजिए, फिर हर PNG उस पल की पूरी तस्वीर होगी।"""

[[faq]]
q = "क्या ट्रांसपेरेंसी बची रहती है?"
a = """
        हाँ। GIF की ट्रांसपेरेंसी एक ही बिट की होती है, यानी पिक्सल या तो रंगा
        है या गायब है, बीच में कुछ नहीं। PNG ठीक यही सहेजता है, इसलिए फ़्रेम
        अपने पारदर्शी हिस्सों के साथ ही बाहर आते हैं। अगर आपको ठोस बैकग्राउंड
        चाहिए तो &ldquo;पारदर्शी हिस्से&rdquo; को किसी रंग से भरने पर लगा
        दीजिए। वह रंग PNG में लिख दिया जाता है और बाद में हटाया नहीं जा
        सकता।"""

[[faq]]
q = "फ़्रेम की देरी वे नहीं है जो मैंने सोची थी, ऐसा क्यों?"
a = """
        GIF हर देरी को सेकंड के सौवें हिस्से में रखता है, और नब्बे के दशक से
        ब्राउज़र दो सौवें से कम किसी भी मान को उठाकर दसवाँ हिस्सा कर देते हैं।
        यह नियम उस ज़माने के घूमते हुए ग्लोब के लिए लिखा गया था और कभी हटाया
        नहीं गया। इसलिए जिस फ़्रेम की फ़ाइल में 0.01 सेकंड लिखा है, वह हर जगह
        0.10 सेकंड पर चलता है। यह टूल वही देरी दिखाता है जो सचमुच चलती है, और
        दोनों अलग हों तो फ़ाइल में लिखा मान भी बगल में बता देता है।"""

[[faq]]
q = "क्या फ़्रेम दोबारा जोड़े जा सकते हैं?"
a = """
        हाँ, इसी साइट के <a href="../gif-maker/">GIF मेकर</a> से, या किसी भी
        ऐसी चीज़ से जो तस्वीरों का फ़ोल्डर लेती हो। ZIP में रखी
        <code>frames.txt</code> इसी के लिए है: एनिमेशन बाँटने पर टाइमिंग चली
        जाती है, क्योंकि PNG के पास यह लिखने की जगह ही नहीं होती कि वह कितनी देर
        टिका था, इसलिए यह सूची हर फ़्रेम की देरी और जगह साथ लेकर बाहर आती है।"""

[[faq]]
q = "फ़्रेम किन फ़ॉर्मैट में सहेजे जा सकते हैं?"
a = """
        PNG में, और जानबूझकर सिर्फ़ PNG में। GIF के एक फ़्रेम में ज़्यादा से
        ज़्यादा 256 रंग और एक बिट ट्रांसपेरेंसी होती है; PNG इसे बिलकुल वैसा
        ही और बिना नुकसान के सहेजता है, जबकि JPEG ट्रांसपेरेंसी फेंक देता, ऐसे
        रंग गढ़ता जो फ़्रेम में कभी थे ही नहीं, और सपाट चित्रकारी से आम तौर पर
        <em>बड़ी</em> फ़ाइल बनाता। अगर JPEG चाहिए तो PNG को बाद में
        <a href="../resize-image/">इमेज रिसाइज़र</a> से बदल लीजिए।"""

[[faq]]
q = "यह कितने फ़्रेम तक पढ़ सकता है?"
a = """
        कोई तय सीमा नहीं है। असली छत आपके डिवाइस की मेमोरी है: पढ़े जाते समय GIF
        फैलकर लगभग एक बाइट प्रति पिक्सल प्रति फ़्रेम हो जाता है, इसलिए छोटी सी
        फ़ाइल भी बहुत बड़ी मेमोरी बन सकती है। ऐसे में यह पेज टैब को मरने देने के
        बजाय पढ़ना रोक देता है। ऐसा हो तो वह बता देता है और जितने फ़्रेम मिल गए
        थे, वे लौटा देता है।"""

[[faq]]
q = "क्या यह खराब GIF भी खोल लेता है?"
a = """
        आम तौर पर हाँ। अधूरे डाउनलोड, गायब अंत-चिह्न और बीच में ही रुक जाने
        वाला आखिरी फ़्रेम, ये सब आम बातें हैं, और जो रीडर इन्हें मना कर दे वह
        ठीक उन्हीं फ़ाइलों के काम नहीं आता जिन्हें लोग सबसे ज़्यादा खोलकर देखना
        चाहते हैं। जितने फ़्रेम पूरे हैं, वे सब वापस आते हैं, साथ में यह भी कि
        क्या गड़बड़ थी। सीधे मना सिर्फ़ उसी फ़ाइल को किया जाता है जो GIF है ही
