[[privacy]]
title = "आपकी तस्वीरों के जाने के लिए कोई जगह ही नहीं है।"
body = """
 Content-Security-Policy
      में हर वह पता लिखा है जिससे यह पेज बात कर सकता है, और उनमें से एक भी इस साइट
      का नहीं है। यहाँ कोई ऐसा एंडपॉइंट नहीं है जहाँ आपकी फ़ाइलें जमा हो सकें, और
      कोड में ऐसा कुछ नहीं है जो होता तो भी उन्हें भेजता। न
      <code>src/</code> में और न worker में कोई <code>fetch</code>,
      <code>XMLHttpRequest</code> या <code>sendBeacon</code> है।"""

[[privacy]]
title = "RAW फ़ाइलें पढ़ी जाती हैं, अपलोड नहीं होतीं, और पढ़ी भी बस ज़रा-सी जाती हैं।"
body = """
 किसी कैमरे की RAW फ़ाइल
      में पहले से एक पूरे आकार की JPEG होती है जिसे कैमरे ने शॉट लेते वक्त ही बनाया
      था। यह टूल डायरेक्ट्री की कुछ प्रविष्टियाँ टटोलकर उसे ढूँढ़ता है और फिर एक ही
      टुकड़ा माँगता है, जो 60&nbsp;MB की फ़ाइल में आम तौर पर सौ किलोबाइट से कम होता
      है। काम करते हुए पेज आपको वह आँकड़ा आपकी फ़ाइलों के साइज़ के साथ दिखाता रहता
      है। सेंसर का डेटा तो कभी पढ़ा ही नहीं जाता।"""

[[privacy]]
title = "काम इसी मशीन के एक Worker में होता है, किसी सर्वर पर नहीं।"
body = """
 यहाँ worker
      इस्तेमाल करने वाला यही अकेला टूल है, क्योंकि स्टैक करना सेकंड नहीं बल्कि मिनटों
      का गणित है, और जमा हुआ पेज न प्रगति दिखा सकता है और न रद्द किया जा सकता है।
      Worker इसी ब्राउज़र के भीतर एक दूसरी धारा है, देखिए
      <code>src/worker.js</code>। उसे ख़ुद फ़ाइलें सौंपी जाती हैं, जो मुफ़्त पड़ता
      है क्योंकि फ़ाइल का हैंडल उसके बाइट नहीं होता। और उस पर पेज जैसी ही
      Content-Security-Policy लागू है, यानी भेजने के लिए कोई जगह नहीं।"""

[[privacy]]
title = "इस सेट के बारे में कहीं कुछ नहीं बताया जाता।"
body = """
 आपने कितने फ़्रेम स्टैक किए,
      उन्हें किस कैमरे ने लिखा, हर एक कितना खिसका था, आपने कौन-सा तरीका चुना और उसमें
      कितना वक्त लगा, यह सब पेज बंद करने तक इसी पेज की मेमोरी में रहता है। इस
      रिपॉज़िटरी में कोई अलग एनालिटिक्स इवेंट नहीं है जो उसमें से कुछ ले जाए, और
      डाउनलोड के बाद यह साइट जो एक सवाल पूछती है वह अंगूठा ऊपर या नीचे और टूल का नाम
      भेजता है, और कुछ नहीं।"""

[[privacy]]
title = "यह ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल वैसा ही रहेगा, क्योंकि
      इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं। worker और उसके लोड किए हर मॉड्यूल को
      इसी पेज का अपना service worker कैश कर लेता है, इसलिए इंस्टॉल की हुई कॉपी
      नेटवर्क खींच लेने पर भी RAW फ़ाइलें स्टैक करती है।"""

[[howto]]
title = "फ़्रेम चुनिए।"
body = """
 कोई बर्स्ट, ब्रैकेट किया हुआ सेट,
      इंटरवलोमीटर से ली गई कड़ी, या RAW फ़ाइलों का फ़ोल्डर। हर फ़ाइल आते ही खुलती है
      और उसकी लाइन बताती है कि उसमें से क्या निकला। RAW फ़ाइल के लिए यह कैमरा, भीतर
      मिली झलक का आकार, और यह कि उसे ढूँढ़ने के लिए फ़ाइल का कितना कम हिस्सा पढ़ना
      पड़ा।"""

[[howto]]
title = "वह तरीका चुनिए जो आपके खोने वाली चीज़ से मेल खाता हो।"
body = """
 नॉइज़ के
      लिए औसत, और अगर कुछ हिला हो तो सिग्मा क्लिपिंग। लोग, गाड़ियाँ या गुज़रता
      हवाई जहाज़ हो तो माध्यिका। अँधेरा आसमान जिसे तारों की लकीरों में बदलना हो तो
      हल्का। फ़ोकस रिंग घुमाकर लिया गया मैक्रो शॉट हो तो फ़ोकस स्टैकिंग। मेनू के नीचे
      का नोट बताता है कि आपके फ़्रेमों की गिनती पर हर तरीका क्या करेगा।"""

[[howto]]
title = "तय कीजिए कि फ़्रेम सीध में लाने हैं या नहीं।"
body = """
 हाथ से लिए हों तो
      हाँ, सिर्फ़ खिसकाना। हाथ से लिए हों और आप घूम भी रहे हों तो खिसकाना, घुमाना और
      पैमाना। कसे हुए तिपाई या इंटरवलोमीटर पर हों तो नहीं, और वह तेज़ भी रहेगा। हर
      फ़्रेम सूची के पहले फ़्रेम से नापा जाता है, और इसीलिए किसी भी फ़्रेम को पहला
      बनाया जा सकता है।"""

[[howto]]
title = "चारों आँकड़े पढ़िए, फिर बटन दबाइए।"
body = """
 कुछ भी चलने से पहले पेज
      बताता है कि नतीजा कितना बड़ा होगा, मोटे तौर पर कितनी मेमोरी लगेगी, फ़्रेम कितनी
      बार डीकोड होंगे, और आपकी फ़ाइलों का कितना हिस्सा पढ़ा गया। अगर सेट एक बार में
      मेमोरी में नहीं आता तो वह यह भी कहता है, और यह भी कि कौन-सा काम करने वाला
      रिज़ॉल्यूशन इसे सुलझा देगा।"""

[[faq]]
q = "क्या मेरी तस्वीरें कहीं अपलोड होती हैं?"
a = """
        नहीं। हर फ़्रेम को खोलना, डीकोड करना, सीध में लाना, स्टैक करना और लिखना, यह
        सब आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर करता है। इस टूल में नेटवर्क का
        कोई काम है ही नहीं, न यह कभी कुछ मँगाता है और न कभी कुछ भेजता है। और पेज की
        <code>Content-Security-Policy</code> में हर वह पता लिखा है जिससे वह बात कर
        सकता है, जिनमें से एक भी इस साइट का नहीं है। पेज एक बार लोड कीजिए, इंटरनेट
        बंद कीजिए, और यह फिर भी चलता है। यहाँ यह बात ज़्यादातर टूल से ज़्यादा मायने
        रखती है, सिर्फ़ मात्रा की वजह से। बीस RAW फ़्रेम करीब एक गीगाबाइट होते हैं,
        और एक गीगाबाइट तस्वीरें सिर्फ़ इसलिए अपलोड करना कि उनका औसत निकाला जा सके,
        ठीक वही चीज़ है जिससे बचने के लिए यह टूल बना है।"""

[[faq]]
q = "यह कौन-से RAW फ़ॉर्मैट पढ़ सकता है, और कैसे?"
a = """
        <span id="faq-raw"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF, RAF,
        RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL और कुछ और, यानी लगभग वह सब
        जो कैमरे लिखते हैं। इनमें से यह जो पढ़ता है वह है पूरे आकार की वह JPEG झलक
        जिसे ख़ुद कैमरे ने शॉट लेते वक्त बनाया था, यानी वही तस्वीर जो कैमरे की पीठ पर
        दिखती है और वही जिसे आपका ऑपरेटिंग सिस्टम थंबनेल की तरह बनाता है। उसे फ़ाइल
        की डायरेक्ट्री संरचना टटोलकर ढूँढ़ा जाता है, जिसमें कुछ किलोबाइट के दो-चार
        पाठ लगते हैं, और फिर एक टुकड़ा उठा लिया जाता है। <strong>यह सेंसर डेटा का
        डीमोज़ेक नहीं है।</strong> नतीजे में कैमरे का ही व्हाइट बैलेंस और पिक्चर
        स्टाइल होता है, हर चैनल पर आठ बिट के साथ, न कि वह बारह या चौदह बिट का रैखिक
        सेंसर डेटा जो कोई RAW कन्वर्टर देता।"""

[[faq]]
q = "तो फिर सेंसर डेटा को ठीक से डीकोड क्यों नहीं करते?"
a = """
        क्योंकि इसका मतलब होता LibRaw या dcraw को साथ लाना, यानी फ़ॉर्मैट के एक ही
        परिवार के लिए दसियों मेगाबाइट का दूसरा इंजन, जिसका ज़्यादातर हिस्सा हर
        निर्माता की अलग कंप्रेशन योजनाएँ हैं। यह सौदा इस साइट के सोर्स में
        <code>docs/what-can-be-built-here.md</code> में तय किया गया है, जहाँ कैमरा
        RAW इस टूल के बनने से भी पहले से बाहर रखी चीज़ों की सूची में है। जो बदला वह
        उस सवाल का जवाब नहीं, बल्कि यह पता चलना है कि स्टैक करने के लिए उसकी ज़रूरत
        ही नहीं। झलकें पूरे रिज़ॉल्यूशन की होती हैं, वे वही हैं जो कैमरा आपको वैसे भी
        JPEG के रूप में देता, और उन्हें पढ़ना डीमोज़ेक करने से करीब सौ गुना तेज़ है।
        अगर आपको सेंसर डेटा चाहिए, तो पहले फ़्रेम किसी RAW कन्वर्टर में डेवलप कीजिए
        और उसके बनाए TIFF या JPEG स्टैक कीजिए, यह टूल उन्हें भी लेता है।"""

