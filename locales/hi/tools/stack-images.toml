        नॉइज़ को फ़्रेमों की गिनती के वर्गमूल के बराबर घटा देता है। जो चीज़ें कुछ ही
        समय वहाँ थीं उन्हें हटाने के लिए <strong>माध्यिका</strong>, और इसका सबसे
        जाना-पहचाना इस्तेमाल किसी भीड़ भरे चौक की दर्जन भर तस्वीरें लेकर उसे खाली पा
        लेना है। दोनों चाहिए तो <strong>सिग्मा क्लिपिंग</strong>, जो सीख लेती है कि
        हर पिक्सल आम तौर पर क्या होता है और सिर्फ़ उन्हीं मानों का औसत लेती है जो
        उससे मेल खाते हैं, इसलिए उसमें गुज़रती गाड़ी से माध्यिका जैसी सुरक्षा और औसत
        जैसी नॉइज़ कमी दोनों होती हैं। तारों की लकीरों, आतिशबाज़ी और लाइट पेंटिंग के
        लिए <strong>हल्का</strong>। जो कुछ चमकीला हिला हो उसे हटाने के लिए
        <strong>गहरा</strong>। एक लंबी एक्सपोज़र जैसा असर लाने के लिए
        <strong>जोड़</strong>। फ़ोकस रिंग घुमाकर लिए गए मैक्रो शॉट के लिए
        <strong>फ़ोकस स्टैकिंग</strong>।"""

