        पैमाना। इसलिए यह हिले हुए कैमरे को ठीक करता है, हिले हुए विषय को नहीं, और एक
        कदम बाएँ से ली गई तस्वीर को भी नहीं। एक नतीजा दिखता भी है। बीस पिक्सल बाएँ
        सरकाया गया फ़्रेम अब दाएँ किनारे तक नहीं पहुँचता, इसलिए नतीजा उतने हिस्से तक
