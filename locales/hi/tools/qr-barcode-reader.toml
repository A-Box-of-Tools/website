[[privacy]]
title = "तस्वीर कभी अपलोड नहीं होती, और कैमरा इसका अपवाद नहीं है।"
body = """
 यहाँ छोड़ी गई
      फ़ोटो इसी पन्ने के एक कैनवस पर डिकोड होकर वहीं पढ़ी जाती है। कैमरे का
      फ़्रेम वही चीज़ है, बस सेकंड में तीस बार: उसी कैनवस पर बनता है, जाँचा जाता
      है, और अगले से मिट जाता है। कोई फ़्रेम रिकॉर्ड नहीं होता, कोई रखा नहीं
      जाता, और रोकने पर कैमरे की बत्ती का बुझ जाना ही पूरी कहानी है।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं मँगाता।"
body = """
 <code>src/</code> में कहीं न
      <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>, और पन्ने की
      <code>Content-Security-Policy</code> ऐसा कोई पता छोड़ती ही नहीं जहाँ यह
      ऑरिजिन कुछ भेज सके, होता तब भी। इसीलिए यह पन्ना नहीं बता सकता कि छोटा किया
      हुआ लिंक आखिर कहाँ जाता है: यह पता करना यानी पूछना, और यह पूछता नहीं।"""

[[privacy]]
title = "यह आपको पता दिखाता है। खोलता कभी नहीं।"
body = """
 छपा हुआ QR कोड ऐसा पता है
      जिसे कोई पढ़ नहीं सकता, और ठीक इसी वजह से उस पर स्टिकर चिपकाना किसी के लिए
      फ़ायदे का सौदा बन जाता है। यहाँ कुछ खोला नहीं जाता। पूरी लिखावट आपके देखने
      के लिए छपती है, जिस होस्ट पर आप सचमुच पहुँचते वह अलग लाइन में निकाला जाता
      है, और जो चालें एक पते को दूसरा दिखाती हैं &mdash; <code>@</code> से पहले
      कोई उपयोगकर्ता नाम, ऐसी लिपि में लिखा नाम जिसके अक्षर हमारे जैसे दिखते
      हैं, कोई रीडायरेक्ट &mdash; वे वहीं नाम लेकर बताई जाती हैं जहाँ मिलती
      हैं।"""

[[privacy]]
title = "यह वह भी दिखाता है जो उसने सैंपल किया।"
body = """
 हर QR नतीजे के नीचे उन
      मॉड्यूलों की तस्वीर होती है जो इस पन्ने ने सचमुच आपकी फ़ोटो से पढ़े। अगर
      वह उसी कोड जैसी दिखती है जो आपने स्कैन किया, तो ऊपर का जवाब पक्का है; अगर
      वह बेतरतीब धब्बों जैसी दिखती है, तो नहीं। जो रीडर आपको बस एक लिखावट देकर
      चुप हो जाए, उसे इस तरह जाँचा ही नहीं जा सकता।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं मिलता।"
body = """
 विज्ञापन और माप वाली
      स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से। इनमें से
      किसी को न कोई तस्वीर दी जाती है, न कोई फ़्रेम, न उनमें से पढ़ी कोई चीज़।
      पिक्सलों को लिखावट में बदलने वाली हर लाइन इसी ऑरिजिन से आती है और
      रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "यह ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए, टूल वैसा ही रहता
      है, कैमरे समेत, क्योंकि इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं। इससे
      सरल सबूत कोई नहीं।"""

[[howto]]
title = "इसे तस्वीर दीजिए।"
body = """
 डिब्बे पर कोई फ़ोटो या स्क्रीनशॉट
      छोड़िए, सीधे कोई तस्वीर चिपकाइए, या कैमरे का बटन दबाइए। एक साथ कई भी ठीक
      है &mdash; हर एक अलग पढ़ी जाती है और हर एक का अपना जवाब आता है। जो कोड
      पहले से आपकी स्क्रीन पर है उसका स्क्रीनशॉट सबसे तेज़ और सबसे भरोसेमंद
      रास्ता है, क्योंकि उसमें न लेंस है, न कोण, न रोशनी।"""

[[howto]]
title = "पूरा सिंबल फ़्रेम में आए, हाशिये समेत।"
body = """
 कोड के चारों ओर की सफ़ेद जगह
      कोड का हिस्सा है: उसी से रीडर जानता है कि सिंबल कहाँ खत्म होता है।
      चौकोरों के किनारे तक कटी हुई फ़ोटो अब तक की सबसे आम वजह है कि कोई कोड नहीं
      पढ़ा जाता। फ़्रेम का करीब आधा हिस्सा कोड से भर जाए, यह लगभग सही है; इससे
      पास जाने पर कोने तस्वीर से बाहर चले जाते हैं।"""

[[howto]]
title = "कुछ भी तय करने से पहले पता पढ़िए।"
body = """
 पोस्टर, पार्किंग मशीन या चिट्ठी
      पर लगे कोड को स्कैन करने का मतलब ही यह जानना है कि वह कहाँ ले जाता है, और
      फ़ोन का कैमरा ठीक यही एक काम आपको सच में करने नहीं देता। यहाँ होस्ट अपनी
      अलग लाइन में लिखा होता है। अगर वह नाम वैसा नहीं जैसी आपने उम्मीद की थी, तो
      जिस काम से आप आए थे वह हो चुका और खोलने को कुछ बचा ही नहीं।"""

[[howto]]
title = "चेतावनियों को गंभीरता से लीजिए, खासकर दबी हुई वालों को।"
body = """
 सादा
      <code>http://</code> पता, ऐसी लिपि में लिखा नाम जो दिखती कुछ और है, कोई
      लिंक छोटा करने वाली सेवा, या पते में <code>@</code> से पहले कुछ भी &mdash;
      हर एक वहीं बताया जाता है जहाँ मिलता है। अकेले इनमें से कोई कुछ साबित नहीं
      करता। वहाँ जाने से पहले सब दस सेकंड के लायक हैं।"""

[[howto]]
title = "अगर न पढ़े, तो सबसे पहले रोशनी बदलिए।"
body = """
 लगभग हर नाकामी थ्रेशोल्ड की
      दिक्कत होती है: बीच में पड़ती चमक, किसी कोने पर छाया, या ऐसे कोण से खींची
      गई स्क्रीन जिसमें बैकलाइट आ जाती है। ऐसे खड़े होइए कि चमक कोड पर न पड़े, या
      कैमरे की बत्ती जला लीजिए। फिर भी न हो तो एक सपाट, सामने से ली गई फ़ोटो
      खींचकर वही छोड़िए &mdash; ठहरी हुई तस्वीर की तलाश उससे कहीं ज़्यादा
      गहराई से होती है जितनी लाइव फ़्रेम की हो सकती है।"""

[[howto]]
title = "जवाब अटपटा लगे तो सैंपल की गई तस्वीर देखिए।"
body = """
 &ldquo;यह कैसे पढ़ा
      गया&rdquo; खोलिए और छोटी जाली देखिए। यह वही है जो इस पन्ने ने कोड समझा,
      सैंपल किए गए मॉड्यूलों से दोबारा बनाया हुआ। जिस रीडर ने सिंबल गलत पढ़ा और
      उसे मरम्मत करके कुछ भरोसेमंद-सा बना दिया, वह इसे वहीं दिखाएगा, और कहीं
      नहीं।"""

[[faq]]
q = "क्या तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं, और उसमें से पढ़ी गई कोई चीज़ भी नहीं। तस्वीर इसी पन्ने के एक कैनवस
        पर डिकोड होकर वहीं पढ़ी जाती है, इसी साइट से आए JavaScript के ज़रिए। इस
        टूल में कोई नेटवर्क सुविधा है ही नहीं &mdash; यह कभी कुछ मँगाता नहीं
        और कभी कुछ भेजता नहीं &mdash; और पन्ने की
        <code>Content-Security-Policy</code> में हर वह पता लिखा है जिससे यह
        संपर्क कर सकता है, और उनमें से कोई हमारा नहीं। सबसे सरल सबूत: इंटरनेट काट
        दीजिए, यह चलता रहता है।"""

[[faq]]
q = "क्या कैमरा कुछ रिकॉर्ड करता है?"
a = """
        नहीं। कैमरे का फ़्रेम इसी टैब में पिक्सल बनकर आता है, एक कैनवस पर बनता
        है, जाँचा जाता है, और करीब दसवें हिस्से भर सेकंड बाद अगले फ़्रेम से मिट
        जाता है। डिस्क पर कुछ लिखा नहीं जाता और कुछ रखा नहीं जाता। जैसे ही आप
        रोकते हैं स्ट्रीम बंद हो जाती है, टैब पीछे जाने पर भी, और पन्ना छोड़ने पर
        भी &mdash; और भरोसे लायक संकेत आपके कैमरे की बत्ती है, क्योंकि उसे कोई
        पन्ना बुझा नहीं सकता।"""

[[faq]]
q = "यह लिंक खोलने के बजाय मुझे दिखाता क्यों है?"
a = """
        क्योंकि काम की चीज़ यही है। QR कोड ऐसा पता है जिसे आप पढ़ नहीं सकते, और
        इसीलिए पार्किंग मशीन के कोड पर चिपका स्टिकर काम कर जाता है: जब तक आपको
        पता चलता है कि वह कहाँ ले गया, आप वहाँ पहुँच चुके होते हैं। यहाँ पूरी
        लिखावट छपती है, होस्ट अपनी अलग लाइन में निकाला जाता है, और खोलना एक अलग
        बटन है जिसे आप पढ़ने के बाद दबाते हैं। यह एक क्लिक ज़्यादा है, और यही वह
        क्लिक है जिसकी इस फ़ॉर्मैट को हमेशा से ज़रूरत थी।"""

[[faq]]
q = "यह क्या-क्या पढ़ सकता है?"
a = """
        QR कोड, 1 से 40 तक हर वर्शन में, चारों त्रुटि-सुधार स्तरों पर, न्यूमेरिक,
        अल्फ़ान्यूमेरिक, बाइट और कांजी मोड में, जिसमें ECI कैरेक्टर सेट और जुड़े
        हुए सेट के सिंबल चुपचाप गिराए जाने के बजाय बताए जाते हैं। धारीदार तरफ़:
        EAN-13, EAN-8, UPC-A, UPC-E, ITF-14, Interleaved 2 of 5, Code 128 और
        Code 39। Data Matrix, PDF417, Aztec और MaxiCode यह नहीं पढ़ता।"""

[[faq]]
q = "मेरा कोड नहीं पढ़ा जा रहा। क्या गड़बड़ है?"
a = """
        दस में नौ बार तीन में से कोई एक बात। सफ़ेद हाशिया कट गया है, और रीडर उसी
        से जानता है कि सिंबल कहाँ खत्म होता है। कोड के किसी हिस्से पर चमक या
        छाया पड़ रही है, इसलिए कोई थ्रेशोल्ड गहरे चौकोरों को हल्कों से अलग नहीं
        कर पाता। या कोड फ़्रेम में इतना छोटा है कि उसके मॉड्यूल एक-दो पिक्सल से
        ज़्यादा के नहीं। रोशनी बदलिए, फ़्रेम का करीब आधा हिस्सा भरिए, और तिरछे के
        बजाय सामने से फ़ोटो लीजिए।"""

[[faq]]
q = "क्या यह टूटा हुआ या आंशिक रूप से ढका कोड पढ़ सकता है?"
a = """
        अक्सर हाँ, और यह फ़ॉर्मैट का अपने डिज़ाइन के मुताबिक काम करना है, यहाँ
        की कोई होशियारी नहीं। हर QR कोड Reed-Solomon जाँच-डेटा साथ रखता है, और H
        स्तर पर बना सिंबल अपने करीब 30% मॉड्यूल खोकर भी हूबहू दोबारा बन जाता है।
        पन्ना &ldquo;यह कैसे पढ़ा गया&rdquo; के नीचे बताता है कि उसे कितने
        कोडवर्ड सुधारने पड़े, जिससे आप देख सकें कि मामला कितना करीब था। जो यह
        नहीं करता, वह है अंदाज़ा: जाँच जितना संभाल सकती है उससे ज़्यादा टूटे
        सिंबल को यह गलत जवाब देने के बजाय अपठनीय बताता है।"""

[[faq]]
q = "यह क्यों कहता है कि bit.ly लिंक कहाँ जाता है, यह नहीं बता सकता?"
a = """
        क्योंकि यह पता करने का मतलब है bit.ly से पूछना, और वह एक नेटवर्क अनुरोध
        है। इस पन्ने का बाकी हर दावा इसी पर टिका है कि यहाँ ऐसा कोई कोड नहीं जो
        किसी से संपर्क करे, और चुपचाप एक अपवाद बना लेना उस जवाब से कम कीमती
        होता। तो लिंक छोटा करने वाली सेवा का नाम बता दिया जाता है और वह जो छिपाती
        है उसे ईमानदारी से अनजाना छोड़ दिया जाता है। सुलझाना ही है तो उसे किसी
        ऐसी जगह चिपकाइए जो पूछने को तैयार हो।"""

[[faq]]
q = "क्या QR कोड स्कैन करना सुरक्षित है?"
a = """
        स्कैन करना सुरक्षित है। उस पर अमल करना जोखिम है, और वह असली जोखिम है:
        पार्किंग मशीनों पर, रेस्तराँ की मेज़ों पर और कूरियर की पर्चियों पर असली
        कोड के ऊपर चिपकाए गए कोड अब इतने आम हो चुके हैं कि उनका नाम पड़ गया है।
        वे इसलिए चलते हैं कि कोड को देखकर कोई पढ़ नहीं सकता। उसे खोले बिना पढ़
        लेना &mdash; जो यह पन्ना करता है &mdash; वह पूरी बढ़त छीन लेता है, और
        होस्ट देखने में लगने वाले दस सेकंड ही सारा बचाव हैं।"""

[[faq]]
q = "हर नतीजे के नीचे वह छोटी जाली क्या है?"
a = """
        वे मॉड्यूल जो इस पन्ने ने सचमुच आपकी तस्वीर से सैंपल किए, प्रति मॉड्यूल
        एक चौकोर के हिसाब से दोबारा बनाए हुए। वह इसलिए है कि पढ़ाई पर भरोसा करने
        के बजाय उसे आँख से जाँचा जा सके: अगर वह जाली उसी कोड जैसी दिखती है जो
        आपने खींचा था, तो ऊपर का जवाब सही पिक्सलों से आया है। शायद ही कोई रीडर
        आपको यह दिखाता है, और यही उस टूल में फ़र्क है जिसे आप जाँच सकते हैं
        और उसमें जिस पर आपको भरोसा करना पड़ता है।"""

[[faq]]
q = "क्या यह एक ही तस्वीर में कई कोड पढ़ता है?"
a = """
        फ़िलहाल एक तस्वीर में एक। एक साथ कई तस्वीरें छोड़िए तो हर एक अलग पढ़ी
        जाती है, और कैमरा हिलाते-हिलाते एक के बाद एक कोड पढ़ता जाता है, हर नया
        कोड रखता जाता है जो उसने पहले न देखा हो। कोडों से भरे पूरे पन्ने की एक ही
        फ़ोटो के लिए या तो काट-छाँट चाहिए, या कैमरा एक-एक करके उन पर करना
        होगा।"""

[[faq]]
q = "मेरा बारकोड जो मैंने माँगा था उससे अलग नाम से क्यों बताया गया?"
a = """
        क्योंकि बारकोड अपना नाम साथ लेकर नहीं चलता। UPC-A दरअसल वही EAN-13 है
        जिसका पहला अंक शून्य हो, ITF-14 चौदह अंकों और वैध चेक अंक वाला
        Interleaved 2 of 5 है, और Code 128 अपने अंक-मोड में किसी और जैसा दिखता ही
        नहीं। यह पन्ना वही बताता है जो धारियाँ कहती हैं, और साथ में वह जो चेक अंक
        पक्का करता है &mdash; उतना ही, जितना खुद सिंबल जानता है।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पन्ना एक बार लोड कीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहता है,
        कैमरे समेत। यह साबित करने का सबसे सरल तरीका भी यही है कि कुछ अपलोड नहीं
        होता: जो रीडर आपकी तस्वीर डिकोड कराने बाहर भेजता, वह उसी पल रुक जाता जिस
        पल आप प्लग निकालते।"""

