#
# QR और बारकोड रीडर - Hindi.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# The symbology names stay in Latin script - EAN-13, UPC-A, ITF-14, Code 128,
# Code 39, ISO/IEC 18004 - because those are the names on the specification and
# on whatever is going to scan the label.
#
# "स्कैन" is the word people say and search for; "पढ़ना" is what the program
# does. Both are used, each where it reads naturally.
#

