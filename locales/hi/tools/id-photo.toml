      <code>sendBeacon</code>। नियम-पुस्तिका <code>src/specs.js</code> में एक
      तालिका भर है, जो पेज के साथ ही आती है और उसी के साथ कैश हो जाती है। न
      देखने को कोई देश-सूची कहीं और है, और न दूर बैठकर आपकी फ़ोटो जाँचने को
      कुछ।"""

[[privacy]]
title = "यहाँ चेहरा पहचानने वाला कुछ है ही नहीं, और यह जान-बूझकर है।"
body = """
 जिन चार बिंदुओं
      से नियम नापे जाते हैं, उन्हें आप खुद खींचते हैं। उन्हें अपने आप पहचानने
      का मतलब होता एक मॉडल भेजना और आपके चेहरे की तस्वीर पर अनुमान चलाना। और
      जो मॉडल गलत होता है वह सबके साथ बराबर गलत नहीं होता, कुछ चेहरों पर
      दूसरों से ज़्यादा होता है। चार बिंदुओं में आठ सेकंड लगते हैं, और वे सबके
      लिए एक जैसे सटीक हैं।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं, और दान का बटन Buy Me a Coffee से।
      इनमें से किसी को भी आपकी तस्वीर, आपके चेहरे, या आपने किस देश का नियम
      चुना, इनमें से किसी के बारे में कुछ नहीं सौंपा जाता। फ़ाइल पढ़ने, क्रॉप
      करने, नापने या लिखने वाली हर पंक्ति इसी ऑरिजिन से आती है और रिपॉज़िटरी
      में मौजूद है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, टूल जस का तस काम
      करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं। सबसे
      आसान सबूत यही है।"""

[[howto]]
title = "तस्वीर चुनिए।"
body = """
 सादी दीवार के सामने, दिन की रोशनी में,
      करीब डेढ़ मीटर की दूरी से खींची गई फ़ोन की तस्वीर। ब्राउज़र उसे सीधे
      आपकी डिस्क से पढ़ता है, और इस दौरान कुछ भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "देश और दस्तावेज़ चुनिए।"
body = """
 फिर पैनल उस नियम का छपाई साइज़,
      सिर-ऊँचाई की पट्टी, आँखों की रेखा, बैकग्राउंड का रंग और अपलोड की सीमाएँ
      दिखा देता है, और साथ में वह प्राधिकरण भी जिससे हर आँकड़ा आया तथा वह
      तारीख जब उसे पढ़ा गया। उस सूची में कुछ भी अंदाज़े से नहीं है। आपको जो
      कुछ भेजा गया हो पर उसमें न हो, वह &ldquo;कहीं और&rdquo; के नीचे जाता
      है।"""

[[howto]]
title = "चार बिंदु अपने चेहरे पर खींचकर रखिए।"
body = """
 सिर का शिखर, ठुड्डी, और
      दोनों पुतलियाँ। नियम जो कुछ नापता है वह पूरा का पूरा यही चार बिंदु हैं,
      और इसीलिए यह टूल अंदाज़ा लगाने के बजाय आपसे यही माँगता है। फिर
      <em>डिब्बा बिठाइए</em> दबाइए, और क्रॉप वहीं जाकर बैठ जाता है जहाँ वह देश
      उसे चाहता है।"""

[[howto]]
title = "चारों जाँचें और बैकग्राउंड पढ़ लीजिए।"
body = """
 सिर की ऊँचाई, आँखों की
      रेखा, बीच में होना और झुकाव, चारों डिब्बे की मौजूदा हालत से नापे जाते
      हैं, और हद से बाहर होने पर हर एक बता देता है कि किस तरफ़ खींचना है।
      बैकग्राउंड क्रॉप के ऊपरी हिस्से और दोनों किनारों से पढ़ा जाता है और उस
      रंग से मिलाया जाता है जो नियम माँगता है। असमानता, जिसकी वजह से असल में
      फ़ोटो लौटाई जाती हैं, रंग से अलग नापी जाती है।"""

[[howto]]
title = "तीनों फ़ाइलें ले जाइए।"
body = """
 छपाई वाली, ठीक तय मिलीमीटर पर, और
      रिज़ॉल्यूशन फ़ाइल के भीतर लिखा हुआ, ताकि दुकान उसे सही साइज़ पर छापे।
      शीट, जिसमें 4&nbsp;&times;&nbsp;6 में जितनी नकलें समा सकें उतनी हों और
      बीच की जगहों में काटने के निशान। और अपलोड वाली, उसी पिक्सल साइज़ पर जो
      पोर्टल माँगता है और उसी KB पट्टी के भीतर जिसे वह दोनों सिरों पर लागू
      करता है।"""

[[faq]]
q = "क्या मेरी फ़ोटो कहीं अपलोड होती है?"
a = """
        नहीं। तस्वीर को डिकोड करने, क्रॉप करने, नापने और लिखने का काम आपका
        अपना ब्राउज़र आपके अपने हार्डवेयर पर करता है, उसी JPEG एनकोडर से जो
        ब्राउज़र में पहले से आता है। इस टूल में किसी भी तरह की कोई नेटवर्क
        सुविधा है ही नहीं, यानी यह न कभी कुछ मँगाता है, न कभी कुछ भेजता है।
        और पेज की <code>Content-Security-Policy</code> उन सारे पतों के नाम
        गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस साइट का
        नहीं है। यहाँ इसकी कीमत ज़्यादातर टूलों से ज़्यादा है, क्योंकि फ़ाइल
        आपके चेहरे की तस्वीर है।"""

[[faq]]
q = "इसमें कौन-कौन से देश शामिल हैं?"
a = """
        अब तक जो विनिर्देश उतारे गए हैं वे ये हैं। खुद ICAO मानक, संयुक्त
        राज्य अमेरिका (पासपोर्ट और Diversity Visa की प्रविष्टि, जिनके अपलोड
        नियम अलग हैं), यूनाइटेड किंगडम, शेंगेन वीज़ा, जर्मनी, कनाडा,
        ऑस्ट्रेलिया, भारत (पासपोर्ट, 35&nbsp;&times;&nbsp;45&nbsp;mm की छपाई,
        और SSC/UPSC फ़ॉर्म की फ़ोटो तथा दस्तखत), चीन और जापान। हर प्रविष्टि उस
        प्राधिकरण का नाम लेती है जिससे वह आई, और वह तारीख भी जब उसे पढ़ा गया।
        बाकी सब कुछ &ldquo;कहीं और&rdquo; के नीचे जाता है, जहाँ हर आँकड़ा आपको
        खुद टाइप करना है। और चूँकि दुनिया का ज़्यादातर हिस्सा ICAO ज्यामिति के
        हिसाब से ही जारी करता है, वह प्रविष्टि उसी से शुरू होती है।"""

[[faq]]
q = "यह चेहरा खुद ढूँढ़ने के बजाय मुझसे निशान क्यों लगवाता है?"
a = """
        क्योंकि चेहरा ढूँढ़ने का मतलब है एक मॉडल भेजना। डाउनलोड करने को वेट,
        उन्हें चलाने के लिए एक इन्फ़रेंस रनटाइम, और नाकाम होने का एक ऐसा ढंग
        जो सबके साथ बराबर नहीं है। डिटेक्टर कुछ चेहरों पर नापने लायक हद तक
        दूसरों से ज़्यादा खराब होते हैं, और जिन लोगों की फ़ोटो पहले से सबसे
        ज़्यादा लौटाई जाती हैं, वही इससे सबसे ज़्यादा मारे जाते। चार खींचे हुए
        बिंदुओं में करीब आठ सेकंड लगते हैं, वे सटीक हैं, और सबके लिए वही आठ
        सेकंड हैं। ब्राउज़र का अपना प्रयोगात्मक फ़ेस डिटेक्टर एक ही ब्राउज़र
        में, एक फ़्लैग के पीछे चलता, और तब यह सुविधा नहीं, ऐसा टूल होता जो इस
        पर निर्भर होकर अलग-अलग बरतता कि आपने उसे खोला किसमें।"""

[[faq]]
q = "सिर की ऊँचाई वाला नियम क्या है, और मेरी उसमें बार-बार क्यों अटक जाती है?"
a = """
        इनमें से हर विनिर्देश बताता है कि सिर को फ़्रेम का कितना हिस्सा भरना
        चाहिए, और वह ठुड्डी के निचले सिरे से लेकर सिर के सबसे ऊपरी हिस्से तक,
        बाल समेत नापा जाता है। आम तौर पर 70 से 80 प्रतिशत, जो 45&nbsp;mm की
        फ़ोटो के लिए 31.5 से 36&nbsp;mm बैठता है। इसके अटकने की सबसे आम वजह
        सेल्फ़ी है, क्योंकि हाथ भर की दूरी करीब 60&nbsp;सेमी होती है, जो चेहरे
        को विकृत कर देती है और सिर को फ़्रेम में बहुत बड़ा कर देती है। दूसरी
        आम वजह शिखर है। वह बालों का सबसे ऊपरी सिरा है, बालों की रेखा नहीं, और
        बालों की रेखा पर निशान लगाने से हर सिर बहुत छोटा निकलता है।"""

[[faq]]
q = "फ़ाइल का कम से कम 20 KB होना क्यों ज़रूरी है, और उसमें भराई कैसे की जा सकती है?"
a = """
        भारत के परीक्षा पोर्टल, चीन का वीज़ा फ़ॉर्म और UK पासपोर्ट का अपलोड,
        तीनों अधिकतम के साथ न्यूनतम फ़ाइल साइज़ भी बताते हैं, क्योंकि उससे छोटी
        फ़ाइल आम तौर पर वह थंबनेल होती है जो किसी ने गलती से अपलोड कर दिया।
        200&nbsp;&times;&nbsp;230 की तस्वीर 46,000 पिक्सल की होती है, और
        ब्राउज़र जिस सबसे अच्छी क्वालिटी पर उसे लिख सकता है उस पर भी वह
        15&nbsp;KB पर उतर सकती है। कम कंप्रेस करके उसे बड़ा करने का कोई रास्ता
        भी नहीं है। इसलिए टूल स्पेसों से भरा एक JPEG कमेंट सेगमेंट जोड़ देता
        है। वह JPEG मानक का हिस्सा है, हर डिकोडर उसे छोड़ देता है, और तस्वीर
        बिट-दर-बिट वही तस्वीर रहती है, बस फ़ाइल लंबी हो जाती है। वह भराई
        फ़ाइल के भीतर, अंग्रेज़ी में, ठीक यही बात लिख भी देती है।"""

[[faq]]
q = "क्या यह बैकग्राउंड जाँचता है, और क्या उसे बदल सकता है?"
a = """
        जाँचता है, बदलेगा नहीं। रंग क्रॉप के ऊपरी हिस्से की एक पट्टी से और
        दोनों किनारों से, कंधों के ऊपर से पढ़ा जाता है, और नियम के रंग से RGB
        में नहीं, CIE Lab में मिलाया जाता है। RGB की चालीस इकाई दूर बैठे दो
        भूरे रंगों में फ़र्क बता पाना नामुमकिन है, जबकि नीले की चालीस इकाइयाँ
        एक अलग ही रंग हैं। असमानता अलग से नापी जाती है, क्योंकि सफ़ेद दीवार पर
        पड़ी छाया ही वह चीज़ है जिसकी वजह से असल में फ़ोटो लौटाई जाती हैं, और
        वह रंग की समस्या है ही नहीं। बैकग्राउंड बदलने का मतलब है किसी व्यक्ति
        को तस्वीर में से काट निकालना, जो एक सेगमेंटेशन मॉडल है, और खराब मॉडल
        बाल खा जाता है। दीवार से एक फ़ुट और दूर खड़े हो जाना इनमें से किसी भी
        फ़िल्टर से ज़्यादा समस्याएँ हल कर देता है।"""

[[faq]]
q = "4 x 6 शीट किस काम की है?"
a = """
        बूथ छह फ़ोटो के कई सौ रुपये लेता है। फ़ोटो की दुकान
        6&nbsp;&times;&nbsp;4 चंद रुपयों में छाप देती है, और उनमें से हर एक यह
        कर देगी। इसलिए टूल आपकी फ़ोटो की उतनी नकलें बिछा देता है जितनी कागज़
        में समाएँ, यानी 6&nbsp;&times;&nbsp;4 पर 35&nbsp;&times;&nbsp;45 की
        आठ, बीच की जगहों में काटने के निशान के साथ, और किसी तस्वीर के ऊपर कुछ
        भी छपे बिना। कुछ भी बिठाने के लिए छोटा-बड़ा नहीं किया जाता। हर नकल ठीक
        उसी साइज़ की है जो नियम माँगता है, क्योंकि जो शीट एक और फ़ोटो समाने के
        लिए उन्हें दो प्रतिशत छोटा कर देती, वह आठ ऐसी फ़ोटो होती जो सब की सब
        गलत साइज़ की हैं। इसे 100 प्रतिशत पर छापिए, क्योंकि शीट के गलत निकलने
        की वजह &ldquo;fit to page&rdquo; ही होती है।"""

[[faq]]
q = "अगर पिक्सल वही हैं तो DPI से क्या फ़र्क पड़ता है?"
a = """
        फ़र्क इसलिए पड़ता है कि JPEG बता सकती है कि वह किस साइज़ की है, और वह
        न बताए तो जो भी उसे छापेगा वह अंदाज़ा लगाएगा। रिज़ॉल्यूशन JFIF हेडर
        में रहता है, और ब्राउज़र का कैनवस वह हेडर units खाने में यह लिखकर
        बनाता है कि &ldquo;यह अनुपात है, रिज़ॉल्यूशन नहीं&rdquo;। यह टूल उन
        गिनती के बाइटों को दोबारा लिख देता है ताकि फ़ाइल 300&nbsp;dpi कहे, और
        यही वह चीज़ है जो 413&nbsp;&times;&nbsp;531 पिक्सल को किसी अनिश्चित
        साइज़ की तस्वीर के बजाय 35&nbsp;&times;&nbsp;45&nbsp;mm की फ़ोटो बना
        देती है। ऐसा करने के लिए कुछ भी डिकोड नहीं होता, और क्वालिटी की कोई
        कीमत नहीं लगती।"""

[[faq]]
q = "क्या यह दस्तखत वाली फ़ाइल भी बना सकता है?"
a = """
        हाँ। SSC और UPSC फ़ॉर्म उसे 140&nbsp;&times;&nbsp;60 पिक्सल पर और 10
        से 20&nbsp;KB के बीच माँगते हैं, और वह अपने अलग विनिर्देश के रूप में
        सूची में है। उसके लिए चेहरे वाला ओवरले बंद कर दिया जाता है, क्योंकि
        दस्तखत की कोई आँखों की रेखा होती ही नहीं, और उसके बजाय यह जाँचा जाता
        है कि कागज़ हल्के रंग का है, उस पर स्याही है, और क्रॉप में कोई लाइन या
        पन्ने का किनारा नहीं आ गया है। उस नियम का मुश्किल हिस्सा
        10&nbsp;KB तक पहुँचना है, 20 से नीचे रहना नहीं।"""

[[faq]]
q = "क्या इससे मेरा आवेदन स्वीकार हो ही जाएगा?"
a = """
        नहीं, और कोई भी टूल ईमानदारी से यह नहीं कह सकता। यह इतना करता है कि
        प्रकाशित आँकड़े हूबहू लागू कर दे और अपनी की गई हर माप आपको दिखा दे।
        इससे जो चीज़ें फ़ॉर्म अपने आप नापता है, यानी पिक्सल साइज़, फ़ाइल साइज़
        और फ़ॉर्मैट, वे सही हो जाती हैं, और जो चीज़ें कोई इंसानी परीक्षक नापता
        है, यानी सिर की ऊँचाई, आँखों की रेखा और बैकग्राउंड, वे आँकड़ों के साथ
        आपके सामने आ जाती हैं। नियम बदलते भी रहते हैं, इसलिए यहाँ का हर
        विनिर्देश बताता है कि वह किस प्राधिकरण से आया और कब पढ़ा गया, ताकि आप
        किसी तालिका पर भरोसा करने के बजाय उसे अपने सामने रखे फ़ॉर्म से मिला
        सकें।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, और न आपके
        चेहरे पर छपा कोई वॉटरमार्क। आप कितनी फ़ोटो बनाते हैं, इस पर भी कोई
        सीमा नहीं, क्योंकि इनका बिल चुकाने वाला कोई सर्वर है ही नहीं। साइट पर
        विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपकी तस्वीर के
        बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए, यह चलता रहेगा।
        नियम-पुस्तिका पेज के साथ आई एक फ़ाइल है, कहीं देखी जाने वाली सूची
        नहीं। कुछ अपलोड नहीं हो रहा, यह साबित करने का सबसे आसान तरीका भी यही
        है। जो टूल आपकी तस्वीर क्रॉप होने के लिए कहीं भेजता, वह प्लग निकालते
        ही रुक जाता।"""

