[[privacy]]
title = "आपके चेहरे की तस्वीर इस मशीन से कभी बाहर नहीं जाती।"
body = """
 यहाँ यह बात
      ज़्यादातर टूलों से कहीं ज़्यादा मायने रखती है। इस पेज के हाथ में जो
      फ़ाइल है वह आपके चेहरे की तस्वीर है, और आप उसके साथ जो करने जा रहे हैं
      उससे उस देश का नाम भी खुल जाता है जिसके दस्तावेज़ के लिए आप आवेदन कर रहे
      हैं। यह पेज जिन-जिन पतों से संपर्क कर सकता है,
      <code>Content-Security-Policy</code> उन सबके नाम गिना देती है, और उनमें
      से एक भी इस साइट का नहीं है। यहाँ ऐसा कोई एंडपॉइंट है ही नहीं जहाँ आपकी
      तस्वीर जमा हो सके।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं मँगाता।"
body = """
 <code>src/</code> में कहीं
