[[faq]]
q = "जो हिस्से इसने गलत किए, क्या मैं उन्हें ठीक कर सकता हूँ?"
a = """
        हाँ, और तीसरा कदम ज़्यादातर इसी के लिए है। ड्रॉइंग में जो कुछ नहीं होना
        चाहिए, उस पर क्लिक कीजिए, वह गायब हो जाता है; फिर क्लिक कीजिए, वापस
        आ जाता है। एक क्लिक उस रंग का पूरा धब्बा उठाता है, इसलिए एक क्लिक एक
        पिक्सल नहीं, पूरा धब्बा या पूरी मुहर हटा देता है। घिरे हुए बैकग्राउंड
        के टुकड़े पर क्लिक करने से वह भर जाता है। सुधार थ्रेशोल्ड से अलग रखे
        जाते हैं, इसलिए बाद में स्लाइडर खिसकाने से वे फेंके नहीं जाते।"""

[[faq]]
q = "SVG कितनी बड़ी होगी?"
a = """
        आकार के लिए, तस्वीर से छोटी: ट्रेस किया सिल्हूट आम तौर पर एक से पाँच
        किलोबाइट का होता है, और लोगो कुछ और। पेज आपको डाउनलोड के बगल में
        सही-सही संख्या बताता है। फ़ोटो के लिए यह बहुत बड़ी होगी, और यही सबसे
        साफ़ निशानी है कि उस फ़ाइल के लिए यह गलत टूल है &mdash; और कोई हज़ार
        अलग-अलग आकारों के बाद पेज बनाना बंद कर देता है और यह बात कह देता है।"""

[[faq]]
q = "क्या यह रंगों में ट्रेस करता है?"
a = """
        नहीं। यह एक रंग का एक आकार बनाता है, और यही वह मामला है जो घटिया
        फ़ोटोकॉपी नहीं, ड्रॉइंग बनकर निकलता है। रंगों में ट्रेस करने का मतलब है
        कुछ ही रंगों में घटाना और हर एक को अपनी अलग परत की तरह ट्रेस करना, और
        नतीजा उसे माँगने वाले ज़्यादातर लोगों को निराश करता है। रंग चाहिए तो
        आकार यहाँ ट्रेस कीजिए और उसे अपने ड्रॉइंग प्रोग्राम में भरिए।"""

[[faq]]
q = "SVG मिलने के बाद मैं उसका क्या कर सकता हूँ?"
a = """
        उसे बिना धुँधला हुए किसी भी साइज़ तक बड़ा कीजिए, एक एट्रिब्यूट से उसका
        रंग बदलिए, उसे एनिमेट कीजिए, छापिए, या कटिंग मशीन या लेज़र को भेजिए।
        यह एक ही <code>&lt;path&gt;</code> है जिसमें गलत करने को कोई फ़िल रूल
