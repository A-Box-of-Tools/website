        तस्वीरें भी चलती हैं; बस ज़्यादा समय लेती हैं, और काम आपके अपने
        प्रोसेसर पर होता है, कहीं किसी कतार में नहीं।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और न कोई खाता है, न लॉगिन, न ट्रायल, न वॉटरमार्क। फ़ाइलों
        की संख्या या साइज़ की भी कोई सीमा नहीं, क्योंकि उनका खर्च उठाने वाला
        कोई सर्वर है ही नहीं &mdash; काम आपकी अपनी मशीन पर होता है। साइट पर
        विज्ञापन हैं, और वही इसका खर्च चलाते हैं; विज्ञापनों को आपकी फ़ाइलों के
        बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कीजिए, फिर इंटरनेट काट दीजिए, और यह चलता रहता है।
        यही सबसे सीधा तरीका भी है यह साबित करने का कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपकी तस्वीर ट्रेस होने के लिए बाहर भेजता, वह तार खींचते ही रुक
        जाता।"""

