[[privacy]]
title = "आपकी तस्वीर के जाने की कोई जगह ही नहीं।"
body = """
 Content-Security-Policy में
      वह हर पता लिखा है जिससे यह पेज संपर्क कर सकता है, और उनमें से एक भी इस
      साइट का नहीं है। यहाँ ऐसी कोई जगह नहीं जहाँ आपकी फ़ाइलें इकट्ठा हो सकें,
      और कोड में ऐसा कुछ नहीं जो उन्हें वहाँ भेजे, अगर होती भी।"""

[[privacy]]
title = "यहाँ कुछ भी कुछ मँगाता नहीं।"
body = """
 <code>src/</code> में
      कहीं भी न कोई <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। पूरा टूल एक तस्वीर के पिक्सलों पर गणित है: एक
      थ्रेशोल्ड, जो मिला उसके किनारे का एक चक्कर, और थोड़ा-सा कर्व बिठाना।"""

[[privacy]]
title = "डाउनलोड करने को कोई इंजन नहीं।"
body = """
 ट्रेस करना आम तौर पर
      किसी और का प्रोग्राम होता है, और वेब पर इसका मतलब है पहले क्लिक से पहले
      कई मेगाबाइट कंपाइल किया हुआ कोड। यहाँ ऐसा कुछ नहीं। पूरी चीज़ इसी
      ऑरिजिन से आई कुछ सौ पंक्तियों की सीधी-सादी JavaScript है, और इसीलिए यह
      पेज खुलते ही काम करता है, किसी इंतज़ार के बाद नहीं।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और मापने
      वाली स्क्रिप्टें Google से आती हैं, और चंदे का बटन Buy Me a Coffee से।
      इनमें से किसी को आपकी तस्वीर के बारे में कुछ नहीं दिया जाता। जो भी
      पंक्ति उसे पढ़ती, थ्रेशोल्ड लगाती या ट्रेस करती है, वह इसी ऑरिजिन से आती
      है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए, टूल वैसा का वैसा
      रहता है, क्योंकि इसमें कभी कोई नेटवर्क वाला कदम था ही नहीं। यही सबसे
      सीधा सबूत है।"""

[[howto]]
title = "तस्वीर चुनिए।"
body = """
 लोगो, स्टेंसिल, दस्तखत, मुहर, स्कैन की
      हुई ड्रॉइंग, सिल्हूट। जिसमें भी कोई साफ़ आकार हो, वह अच्छे से ट्रेस होता
      है; किसी कमरे की फ़ोटो नहीं, और उसके बारे में नीचे साफ़ चेतावनी है, आखिर
      में कोई झटका नहीं। फ़ाइल सीधे आपकी डिस्क से पढ़ी जाती है और इस बीच कुछ
      भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "बताइए कि आकार क्या है।"
body = """
 कागज़ पर बनी ड्रॉइंग
      <strong>उजाले और अँधेरे</strong> से अलग हो जाती है, और उसका लेवल आपके
      लिए निकाल दिया जाता है। किसी चीज़ की फ़ोटो नहीं होती &mdash; गहरे स्लेटी
      पत्थर पर गहरी लाल मूर्ति, गहरे पर गहरा है, और कोई चमक उन्हें अलग नहीं
      करती। उसके लिए चाहिए <strong>विषय</strong>, जो तस्वीर के किनारे की एक
      पट्टी से सीखता है कि बैकग्राउंड क्या है और जो बैकग्राउंड नहीं है, वह सब
      रख लेता है।"""

[[howto]]
title = "सेटिंग नहीं, लाल रेखा देखिए।"
body = """
 आउटलाइन उन्हीं पिक्सलों के
      ऊपर खींची जाती है जिनसे वह निकली है, क्योंकि यह सवाल तय होने की बस यही
      एक जगह है: कोई आउटलाइन उन पिक्सलों के हिसाब से सही या गलत होती है, और
      किसी चीज़ के हिसाब से नहीं। किसी भी एक तस्वीर को खींचिए, दोनों खिसकती
      हैं; और पहिया घुमाकर इतना ज़ूम कीजिए कि दिखे रेखा असल में कर क्या रही
      है।"""

[[howto]]
title = "जो नहीं होना चाहिए, उसे क्लिक करके हटाइए।"
body = """
 कोई धब्बा, स्टेपल की पिन,
      मुहर, कैप्शन, परछाईं। एक क्लिक एक पिक्सल नहीं, उस रंग का पूरा धब्बा
      उठाता है, यानी आप एक आकार की ओर इशारा कर रहे हैं; वापस लाने के लिए फिर
      क्लिक कीजिए। घिरे हुए बैकग्राउंड के टुकड़े पर क्लिक करने से वह भर जाता
      है, और जो छेद छेद नहीं होना चाहिए, वह इसी तरह बंद होता है।"""

[[howto]]
title = "चिकनाई तभी बदलिए जब ज़रूरत हो।"
body = """
 <em>बारीकी</em> यह है कि
      सरल होते समय रेखा पिक्सलों से कितनी दूर जा सकती है, और जब तक आप कुछ और
      न कहें, यह हर आकार के लिए अलग निकाली जाती है। <em>कोनों की धार</em> तय
      करती है कि आउटलाइन को कितना मुड़ना चाहिए ताकि वह मोड़ गोल होने के बजाय
      कोना बना रहे। ज़्यादातर तस्वीरों में इन दोनों को छूने की ज़रूरत नहीं
      पड़ती।"""

[[howto]]
title = "SVG ले लीजिए।"
body = """
 एक फ़ाइल, एक
      <code>&lt;path&gt;</code>, और फ़िल रूल की कोई चिंता नहीं: आउटलाइन एक
      दिशा में घूमती हैं और छेद दूसरी में, और यही बात चालीस छेदों वाले आकार को
      एक ही एलिमेंट बनाती है। यह Illustrator, Inkscape, Figma, ब्राउज़र और
      कटिंग मशीन में खुलता है।"""

[[faq]]
q = "क्या मेरी तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को आपका अपना ब्राउज़र आपके अपने हार्डवेयर पर पढ़ता है, इसी
        ऑरिजिन से आई कुछ सौ पंक्तियों की JavaScript उसे ट्रेस करती है, और वह
        डाउनलोड बनकर वापस आती है। इस टूल में किसी भी तरह की कोई नेटवर्क सुविधा
        है ही नहीं &mdash; यह न कभी कुछ मँगाता है, न कभी कुछ भेजता है &mdash;
        और पेज की <code>Content-Security-Policy</code> में वह हर पता लिखा है
        जिससे यह संपर्क कर सकता है, और उनमें से एक भी इस साइट का नहीं।"""

[[faq]]
q = "क्या यह मेरी फ़ोटो को SVG बना देगा?"
a = """
        किसी काम के तरीके से नहीं, और पेज आपको यह खुद बता देगा, बजाय इसके कि
        आपको डाउनलोड के बाद पता चले। ट्रेस करना मिलते-जुलते रंग के हर धब्बे को
        अपना अलग आकार बना देता है, इसलिए फ़ोटो हज़ारों एक-दूसरे पर चढ़े धब्बों
        और JPEG से कई गुना बड़ी फ़ाइल बनकर लौटती है, जो धीरे खुलती है और फ़ोटो
        जैसी दिखती नहीं। अच्छे से ट्रेस वह तस्वीर होती है जिसमें कोई
        <em>आकार</em> हो: लोगो, स्टेंसिल, दस्तखत, लाइन ड्रॉइंग, सिल्हूट। किसी
        एक चीज़ की फ़ोटो के लिए <em>विषय</em> वाली सेटिंग उसे एक ठोस सिल्हूट की
        तरह काट देगी, जो अलग बात है, और सचमुच काम की है।"""

[[faq]]
q = "आकार ढूँढ़ने के दो तरीकों में फ़र्क क्या है?"
a = """
        वे जो सवाल पूछते हैं। <strong>उजाला और अँधेरा</strong> पूछता है कि क्या
        हर पिक्सल एक लेवल से ज़्यादा गहरा है, जो कागज़ पर स्याही के लिए बिलकुल
        सही है और तब बेकार, जब विषय और बैकग्राउंड बराबर गहरे हों।
        <strong>विषय</strong> पूछता है कि बैकग्राउंड क्या है &mdash; इसे वह
        तस्वीर के किनारे की एक पट्टी से सीखता है, हर पिक्सल को उसके सामने
        मापता है, और जो सबसे बड़ी चीज़ बैकग्राउंड नहीं है, उसे रख लेता है। यह
        कमोबेश सादे बैकग्राउंड के सामने रखी किसी चीज़ की फ़ोटो पर चलता है, और
        उस तस्वीर पर नाकाम होता है जो इतनी कसकर काटी गई हो कि विषय तीन तरफ़
        से बाहर निकल रहा हो, क्योंकि तब जिन किनारों से वह सीखता है, वे खुद
        विषय हैं। ऐसा हो तो आप बैकग्राउंड खुद दिखा सकते हैं।"""

[[faq]]
q = "ट्रेस किए आकार में छेद क्यों हैं, या पतले हिस्से क्यों गायब हो जाते हैं?"
a = """
        क्योंकि हर पिक्सल के एक बिट में बदलते ही तस्वीर में वे थे ही।
        <em>ट्रेसर को क्या मिला</em> चालू करके देखिए: बारह-एक पिक्सल से नीचे
        किसी अक्षर की आँख पहले ही भर चुकी होती है और उसकी डंडियाँ आपस में मिल
        चुकी होती हैं, और जो छेद है ही नहीं, उसे कोई ट्रेस वापस नहीं ला सकता।
        इलाज पीछे है &mdash; थ्रेशोल्ड खिसकाइए, या बड़े स्कैन से शुरू कीजिए।
        <em>विषय</em> मोड में <em>इतने तक की दरारें बंद कीजिए</em> छोटे छेद
        सील करता है और <em>पूरा ठोस भरिए</em> उस हर छेद को बंद करता है जहाँ
