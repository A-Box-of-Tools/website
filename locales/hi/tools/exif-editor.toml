[[privacy]]
title = "आपकी फ़ोटो के जाने के लिए कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ ऐसा कोई एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा हो सकें, और होता भी तो कोड में ऐसा कुछ नहीं
      है जो उन्हें भेजता।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं मँगाता।"
body = """
 इस डिब्बे के बाकी टूलों के
      उलट, इसमें &ldquo;किसी वेब पते से लाइए&rdquo; वाली सुविधा है ही नहीं,
      और नेटवर्क वाला कोई वैकल्पिक कदम भी नहीं। <code>src/</code> में कहीं भी
      न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>।"""

[[privacy]]
title = "जो मेटाडेटा हम पढ़ते हैं, वह कभी कहीं सुनाया नहीं जाता।"
body = """
 आपकी GPS स्थिति
      इसी पेज पर दिखती है और कहीं नहीं जाती। इस रिपॉज़िटरी में ऐसा कोई अपना
      एनालिटिक्स इवेंट नहीं है जो कोई टैग, फ़ाइल का नाम, साइज़ या गिनती साथ
      ले जाता हो।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपकी फ़ोटो के
      बारे में कुछ नहीं सौंपा जाता। फ़ाइल पढ़ने, समझने या दोबारा लिखने वाली
      हर पंक्ति इसी ऑरिजिन से आती है और रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक भर है, उससे ज़्यादा कुछ नहीं। वह किसी
      विज़िट की खबर नहीं करता, और उसे आपके या आपकी फ़ाइलों के बारे में कुछ
      नहीं दिया जाता। जब तक आप क्लिक न करें कुछ होता ही नहीं, और क्लिक करने
      पर आप किसी और की साइट पर पहुँच जाते हैं।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, टूल जस का तस काम
      करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं। सबसे
      आसान सबूत यही है।"""

[[howto]]
title = "अपनी फ़ोटो चुनिए।"
body = """
 उन्हें पिकर पर छोड़ दीजिए, या हाथ से
      चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है, और इस दौरान कुछ
      भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "चाहें तो पढ़िए कि उनमें है क्या।"
body = """
 हर टैग की पूरी तालिका से पहले
      ही, नतीजों की सूची उन बातों के नाम गिना देती है जो जानने लायक हैं, यानी
      GPS स्थिति, समय और सीरियल नंबर।"""

[[howto]]
title = "&ldquo;सारा मेटाडेटा हटाइए&rdquo; दबाइए।"
body = """
 ज़्यादातर लोगों के लिए
      पूरा काम बस इतना ही है। हर टैग, XMP और IPTC ब्लॉक, टिप्पणियाँ और भीतर
      रखा थंबनेल, सब चले जाते हैं, और सूची की हर फ़ोटो से एक साथ।"""

[[howto]]
title = "या हटाने के बजाय बदल दीजिए।"
body = """
 कोई तारीख बदलिए, कॉपीराइट की
      पंक्ति ठीक कीजिए, जगह हटा दीजिए और कैमरे की सेटिंग रहने दीजिए। फिर उस
      फ़ोटो को अकेले सहेज लीजिए।"""

[[faq]]
q = "क्या मेरी फ़ोटो कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को पढ़ने, समझने और दोबारा लिखने का काम आपका अपना ब्राउज़र
        आपके अपने हार्डवेयर पर करता है। इस टूल में किसी भी तरह की कोई नेटवर्क
        सुविधा है ही नहीं, यानी यह न कभी कुछ मँगाता है, न कभी कुछ भेजता है।
        और पेज की <code>Content-Security-Policy</code> उन सारे पतों के नाम
        गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस साइट का
        नहीं है।"""

[[faq]]
q = "EXIF क्या है, और फ़ोटो में और क्या-क्या छिपा होता है?"
a = """
        EXIF टैगों का वह ब्लॉक है जो कैमरा तस्वीर के बगल में लिख देता है।
        बनाने वाला और मॉडल, एक्सपोज़र की सेटिंग, सेकंड तक की तारीख और समय,
        अक्सर GPS स्थिति, और कभी-कभी सीरियल नंबर। फ़ोटो में अक्सर इससे भी
        ज़्यादा होता है, जैसे किसी एडिटर का XML वाला XMP पैकेट, कैप्शन और
        बायलाइन वाले IPTC ब्लॉक, एक कलर प्रोफ़ाइल, थंबनेल के रूप में तस्वीर
        की एक छोटी दूसरी नकल, और निर्माता के बिना-दस्तावेज़ वाले डेटा का मेकर
        नोट। यह टूल इन सबकी सूची बना देता है।"""

[[faq]]
q = "क्या मेटाडेटा हटाने से तस्वीर की क्वालिटी घटती है?"
a = """
        नहीं, और फ़ोटो को दोबारा सहेजने के बजाय ऐसा टूल इस्तेमाल करने की
        मुख्य वजह यही है। मेटाडेटा कंप्रेस की हुई तस्वीर के भीतर नहीं, उसके
        आसपास बने कंटेनर में बैठता है। उसे हटाने का मतलब है एक सूची में से कुछ
        चीज़ें मिटाना और सूची वापस लिख देना। कंप्रेस किया हुआ तस्वीर का डेटा
        बाइट-दर-बाइट उतार दिया जाता है, इसलिए नतीजा डिकोड होकर ठीक वही पिक्सल
        देता है। न कुछ डिकोड होता है, न कुछ दोबारा कंप्रेस होता है।"""

[[faq]]
q = "यह कौन-कौन से फ़ाइल फ़ॉर्मैट सँभालता है?"
a = """
        JPEG, PNG और WebP। HEIC और AVIF पहचाने तो जाते हैं, पर दोबारा लिखे
        नहीं जाते। ये डिब्बों वाले फ़ॉर्मैट हैं, जो एक-दूसरे के भीतर बैठे ऐटम
        से बनते हैं और इनके लिए अलग पार्सर चाहिए, इसलिए टूटी फ़ाइल बनाने के
        बजाय टूल साफ़ कह देता है। अकेली TIFF भी नहीं सँभाली जाती, क्योंकि
        TIFF में मेटाडेटा और पिक्सल, दोनों का पता एक ही ऑफ़सेट से लगता है।"""

[[faq]]
q = "मेटाडेटा हटाने के बाद क्या मेरी फ़ोटो घूमी हुई दिखेगी?"
a = """
        दिख सकती है, और इसके लिए एक सेटिंग है। फ़ोन आम तौर पर तस्वीर वैसे ही
        दर्ज करते हैं जैसे सेंसर ने उसे देखा, और साथ में एक Orientation टैग
        जोड़ देते हैं जो बताता है कि उसे कैसे घुमाना है। वह टैग हटा दीजिए और
        कुछ व्यूअर फ़ोटो को टेढ़ा दिखाने लगते हैं। &ldquo;ओरिएंटेशन टैग रहने
        दीजिए&rdquo; वाला विकल्प, जो डिफ़ॉल्ट रूप से चालू रहता है, एक नन्हा
        EXIF ब्लॉक वापस लिख देता है जिसमें उस एक टैग के सिवा कुछ नहीं होता,
        और वह भी सिर्फ़ तब जब फ़ोटो को उसकी सचमुच ज़रूरत थी। आप चाहते हों कि
        फ़ाइल में EXIF का नामोनिशान न रहे, तो इसे बंद कर दीजिए।"""

[[faq]]
q = "क्या यह GPS वाली जगह हटा देता है?"
a = """
        हाँ। सब कुछ हटाने पर पूरी GPS डायरेक्टरी चली जाती है, और आप चाहें तो
        अकेली जगह मिटाकर बाकी सब रहने दे सकते हैं। स्थिति पहले दशमलव डिग्री
        में दिखाई जाती है, क्योंकि &ldquo;51 डिग्री, 30 मिनट, 26 सेकंड&rdquo;
        से यह साफ़ नहीं होता कि फ़ोटो उस इमारत का नाम बता रही है जिसमें वह
        खींची गई थी।"""

[[faq]]
q = "क्या मैं किसी टैग को मिटाने के बजाय बदल सकता हूँ?"
a = """
        हाँ। टेक्स्ट वाले टैग, तारीखें, ISO, ओरिएंटेशन और रिज़ॉल्यूशन, सब बदले
        जा सकते हैं, और कुछ आम टैग ऐसी फ़ोटो में जोड़े भी जा सकते हैं जिसमें
        एक भी न हो। एक बात का ध्यान रखिए। फ़ाइल लिखने पर EXIF ब्लॉक नए सिरे
        से बनता है, और मेकर नोट में असली ब्लॉक के भीतर की ऑफ़सेट होती हैं,
        इसलिए नए सिरे से बना मेकर नोट उसके बाद शायद निर्माता के अपने
        सॉफ़्टवेयर से न पढ़ा जा सके। यह बात आपके लिए मायने रखती हो, तो उसे
        मिटा दीजिए या फ़ाइल में कोई बदलाव ही मत कीजिए।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या इसके लिए खाता बनाना पड़ेगा?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल। साइट पर
        विज्ञापन हैं और खर्च वही उठाते हैं, लेकिन विज्ञापनों को आपकी फ़ोटो के
        बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए, यह चलता रहेगा।
        कुछ अपलोड नहीं हो रहा, यह साबित करने का सबसे आसान तरीका भी यही है।
