[[faq]]
q = "इसने मेरी फ़ाइल के एक्सटेंशन से अलग टाइप क्यों इस्तेमाल किया?"
a = """
        क्योंकि एक्सटेंशन गलत हो सकता है और बाइट नहीं। जिस फ़ाइल का नाम
        <code>logo.png</code> है पर जो असल में JPEG के रूप में एक्सपोर्ट हुई
        थी, वह इतनी आम है कि हर इमेज टूल को उससे निपटना ही पड़ता है। और जो
        data URI गलत टाइप घोषित करे वह बस बनता ही नहीं, न कोई पीछे हटने का
        रास्ता, न पढ़ने लायक कोई त्रुटि। इसलिए टाइप फ़ाइल के पहले कुछ बाइटों
        से पढ़ा जाता है, जो यहाँ के हर फ़ॉर्मैट में बिना किसी संदेह के बता
        देते हैं कि वह है क्या, और दोनों न मिलें तो पेज आपको बता देता है।"""

[[faq]]
q = "प्रीव्यू खाली है। कहाँ गड़बड़ हुई?"
