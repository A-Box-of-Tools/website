[[privacy]]
title = "आपकी तस्वीरों के जाने के लिए कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ ऐसा कोई एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइलें जमा हो सकें, और होता भी तो कोड में ऐसा कुछ नहीं
      है जो उन्हें भेजता।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं मँगाता।"
body = """
 <code>src/</code> में कहीं
      भी न <code>fetch</code> है, न <code>XMLHttpRequest</code>, न
      <code>sendBeacon</code>। एनकोडिंग का काम <code>btoa</code> और
      <code>encodeURIComponent</code> करते हैं, यानी दो ऐसे फ़ंक्शन जो
      ब्राउज़र के पास शुरू से हैं। दोनों बाइट लेते हैं और टेक्स्ट लौटा देते
      हैं, कहीं गए बिना।"""

[[privacy]]
title = "प्रीव्यू ही सबूत है।"
body = """
 हर नतीजे के बगल में दिखती तस्वीर उसी
      data URI से खींची जाती है जो इस पेज ने अभी बनाया, आपकी फ़ाइल से नहीं।
      वह इसीलिए बनती है कि URI सही है, आपकी मशीन पर, बिना किसी सर्वर के। और
      वह न बने, तो पेज आपको कुछ टूटा हुआ थमाने के बजाय साफ़ कह देता है।"""

