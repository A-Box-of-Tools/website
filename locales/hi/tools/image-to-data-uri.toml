        ज़्यादा है। प्रीव्यू उसी URI से खींचा जाता है जो इस पेज ने बनाया,
        इसलिए खाली प्रीव्यू का मतलब है कि तस्वीर डिकोड ही नहीं हुई।"""

[[faq]]
q = "क्या data URI के साइज़ की कोई सीमा है?"
a = """
