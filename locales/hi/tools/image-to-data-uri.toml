 data URI फ़ाइल की हूबहू नकल
      करता है, इसलिए किसी फ़ोटोग्राफ़ का GPS निशान उसी के साथ आपकी स्टाइलशीट
      में चला जाता है। यह पेज पढ़ लेता है कि उसमें कितना कुछ है और आपको बता
      देता है, क्योंकि दूसरा रास्ता यह है कि आपको कमिट हो जाने के बाद पता
