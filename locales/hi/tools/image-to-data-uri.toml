      इनमें से किसी को भी आपकी तस्वीरों के बारे में कुछ नहीं सौंपा जाता।
      फ़ाइल पढ़ने या एनकोड करने वाली हर पंक्ति इसी ऑरिजिन से आती है और
      रिपॉज़िटरी में मौजूद है।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए, टूल जस का तस काम
      करता रहेगा, क्योंकि इसमें नेटवर्क वाला कोई कदम कभी था ही नहीं। सबसे
      आसान सबूत यही है।"""

[[howto]]
title = "अपनी तस्वीरें चुनिए।"
body = """
 उन्हें पिकर पर छोड़ दीजिए, या हाथ से
      चुन लीजिए। ब्राउज़र उन्हें सीधे आपकी डिस्क से पढ़ता है, और इस दौरान कुछ
      भी कहीं नहीं भेजा जाता।"""

[[howto]]
title = "बताइए कि नतीजा जा कहाँ रहा है।"
body = """
 अकेला URI, कोई CSS नियम, कोई
      कस्टम प्रॉपर्टी, कोई <code>&lt;img&gt;</code> टैग, या Markdown। इनमें से
      हर एक URI को उद्धरण चिह्नों में रखता है, और यही वह ब्योरा है जो तय करता
      है कि भीतर रखी SVG चलेगी या चुपचाप नहीं चलेगी।"""

[[howto]]
title = "पढ़िए कि कीमत क्या पड़ी।"
body = """
 हर नतीजा बताता है कि वह कितने
      अक्षरों का बना, वह फ़ाइल से कितना बड़ा है, और इस साइज़ की चीज़ भीतर रखना
      अच्छा विचार है या नहीं। base64 एक-तिहाई जोड़ देता है। वह एक-तिहाई किसी
      बची हुई रिक्वेस्ट के बदले सही सौदा है या नहीं, यह पूरी तरह साइज़ पर
      निर्भर है, इसलिए पेज बता देता है कि आप लकीर के किस तरफ़ खड़े हैं।"""

[[howto]]
title = "चेतावनियाँ देख लीजिए।"
body = """
 तस्वीर EXIF, कोई कलर प्रोफ़ाइल या XMP
      ढो रही हो, तो उसका नाम इस बात के साथ लिखा जाता है कि आपके नतीजे के कितने
      बाइट वही हैं। एक्सटेंशन असली फ़ॉर्मैट से न मिले, तो पेज असली फ़ॉर्मैट
      इस्तेमाल करता है और आपको बता देता है। और आपका ब्राउज़र नतीजा खींच ही न
      सके, तो वह भी कह देता है।"""

[[howto]]
title = "कॉपी कीजिए, या डाउनलोड।"
body = """
 हर नतीजे के लिए एक बटन, और सबके लिए
      एक साथ भी। कस्टम प्रॉपर्टी एक <code>:root</code> ब्लॉक में लिपटी हुई
      निकलती हैं, स्टाइलशीट के सिरे पर चिपकाने को तैयार।"""

[[faq]]
q = "क्या मेरी तस्वीर कहीं अपलोड होती है?"
a = """
        नहीं। फ़ाइल को पढ़ने और एनकोड करने का काम आपका अपना ब्राउज़र आपके अपने
        हार्डवेयर पर करता है, उन्हीं दो फ़ंक्शनों से जो उसके पास पहले से हैं।
        इस टूल में किसी भी तरह की कोई नेटवर्क सुविधा है ही नहीं, यानी यह न कभी
        कुछ मँगाता है, न कभी कुछ भेजता है। और पेज की
        <code>Content-Security-Policy</code> उन सारे पतों के नाम गिना देती है
        जिनसे यह संपर्क कर सकता है, जिनमें से एक भी इस साइट का नहीं है।"""

[[faq]]
q = "data URI होता क्या है?"
a = """
        पूरी फ़ाइल को वहाँ लिखने का एक तरीका, जहाँ आम तौर पर कोई वेब पता जाता
        है। <code>url("logo.png")</code> लिखने के बजाय, जो ब्राउज़र से कहता है
        कि जाकर कुछ ले आओ, आप <code>url("data:image/png;base64,iVBORw0...")</code>
        लिखते हैं, जिसमें खुद तस्वीर होती है। ब्राउज़र उसे वहीं के वहीं डिकोड
        कर लेता है। व्यावहारिक असर एक कम रिक्वेस्ट का होता है, क्योंकि तस्वीर
        स्टाइलशीट या पेज के बाद नहीं, उसी के साथ पहुँच जाती है।"""

[[faq]]
q = "मेरी SVG base64 में क्यों नहीं है?"
a = """
        क्योंकि उसके लिए base64 गलत एनकोडिंग है। SVG टेक्स्ट है, और URL
        टेक्स्ट पहले से ढो सकता है, यानी गिनती के कुछ ही अक्षरों को बचाना
        पड़ता है। उन्हें percent-encode करके बाकी को छोड़ देने से ऐसा URI बनता
        है जो उसी फ़ाइल के base64 से आम तौर पर पाँचवाँ हिस्सा छोटा होता है,
        और जिसे आप अपनी स्टाइलशीट में पढ़ भी सकते हैं। तत्वों के नाम, रंग और
        <code>viewBox</code>, सब वहीं मौजूद रहते हैं, बदलने के लिए तैयार। जो
        इक्का-दुक्का टूलचेन base64 पर ही अड़े, उसके लिए एक चेकबॉक्स भी है।"""

[[faq]]
q = "base64 मेरी तस्वीर को कितना बड़ा कर देता है?"
a = """
        करीब एक-तिहाई। फ़ाइल के तीन बाइट base64 के चार अक्षर बन जाते हैं,
        यानी 33%, और वह भी आगे लगने वाले
        <code>data:image/png;base64,</code> से पहले। इससे नीचे उतरा ही नहीं जा
        सकता, क्योंकि सिर्फ़ URL में चलने वाले अक्षरों से मनमाने बाइट लिखने की
        कीमत यही है। इसीलिए पेज फ़ाइल के साइज़ के बगल में अक्षरों की गिनती भी
        दिखा देता है, बजाय इसके कि आपको स्टाइलशीट तैनात होने पर पता चले।"""

[[faq]]
q = "तस्वीर को भीतर रखना असल में कब अच्छा विचार है?"
a = """
        जब वह छोटी हो और तुरंत चाहिए हो। हर पेज पर लोड होने वाली स्टाइलशीट में
        2 KB का आइकन साफ़ फ़ायदे का सौदा है, क्योंकि एक चक्कर बच जाता है और
        तस्वीर उसी पल मौजूद रहती है जिस पल CSS। करीब 10 KB के आगे सौदा पलट
        जाता है। भीतर रखी तस्वीर अब अलग फ़ाइल रही ही नहीं, इसलिए उसे अलग से
        कैश नहीं किया जा सकता, किसी और चीज़ के साथ समानांतर लाया नहीं जा सकता,
        और उसके आसपास की फ़ाइल जब भी बदलती है वह पूरी की पूरी दोबारा डाउनलोड
        होती है। स्टाइलशीट में रखा 200 KB का फ़ोटोग्राफ़ साइट के हर पेज के
        क्रिटिकल पाथ में जुड़े 200 KB है। पेज बता देता है कि हर नतीजा उस लकीर
        के किस तरफ़ गिरता है।"""

[[faq]]
q = "क्या gzip base64 का बोझ वापस उतार देता है?"
a = """
        उतना नहीं जितना लोग सोचते हैं। पहले से कंप्रेस हो चुकी फ़ाइल का
        base64 ठीक से कंप्रेस होता ही नहीं, और PNG, JPEG तथा WebP तीनों पहले
        से कंप्रेस हो चुकी होती हैं। कंप्रेसर को ढूँढ़ने लायक दोहराव लगभग बचा
        ही नहीं होता, इसलिए base64 ने जो एक-तिहाई जोड़ा था उसमें से आम तौर पर
        दसवाँ हिस्सा भर वापस मिलता है, पूरा नहीं। percent-encode की गई SVG
        उलटा मामला है। वह अब भी टेक्स्ट है, इसलिए लगभग उतनी ही अच्छी तरह
        कंप्रेस होती है जितनी पहले होती थी, और उसे base64 न करने की एक और वजह
        यही है।"""

[[faq]]
q = "क्या इससे मेरी तस्वीर में कोई बदलाव आता है?"
a = """
        नहीं, और यहाँ के ज़्यादातर टूलों से यह एक जान-बूझकर रखा फ़र्क है। कुछ
        भी पिक्सलों में डिकोड करके दोबारा एनकोड नहीं होता। जो बाइट आपकी डिस्क
        से निकले, वही बाइट URI में जाते हैं। JPEG ठीक वही JPEG रहती है जो थी,
        उसी क्वालिटी पर, उन्हीं मापों के साथ। इसीलिए नतीजे को उसी फ़ाइल की
        नकल नहीं, खुद वही फ़ाइल कहा जा सकता है।"""

[[faq]]
q = "तो मेरा EXIF और GPS डेटा भी स्टाइलशीट में चला जाता है?"
