        एनकोड नहीं होता, कैमरे ने जो कुछ लिखा वह सब तस्वीर के साथ सफ़र करता
        है, यानी जगह, समय और कैमरे का सीरियल नंबर। फ़ोन की फ़ोटो में यह फ़ाइल
