[[privacy]]
title = "आपके वीडियो के जाने की कोई जगह नहीं है।"
body = """
 Content-Security-Policy
      में वे सारे पते लिखे हैं जिनसे यह पेज संपर्क कर सकता है, और उनमें से एक भी हमारा
      नहीं है। यहाँ ऐसा कोई एंडपॉइंट नहीं है जहाँ कोई फ़ाइल इकट्ठी की जा सके, और होता
      भी तो कोड में ऐसा कुछ नहीं है जो उसे वहाँ भेजे।"""

[[privacy]]
title = "तस्वीर तो डिकोड होती ही नहीं।"
body = """
 सिर्फ़ ऑडियो ट्रैक माँगा जाता
      है। फ़्रेम न पढ़े जाते हैं, न डिकोड होते हैं, न बनाए जाते हैं और न देखे जाते हैं
      &mdash; इस पेज पर ऐसा कोई कोड ही नहीं है जो यह कर सके &mdash; और जो फ़ाइल निकलती
      है उसमें आवाज़ के सिवा कुछ नहीं होता। यह संयम बरतने का वादा नहीं है:
      <code>decodeAudioData</code> को बाइट दिए जाते हैं और वह आवाज़ लौटाता है, और
      <code>src/</code> में चलाने के लिए कोई वीडियो डिकोडर है ही नहीं।"""

[[privacy]]
title = "डिकोडर वही है जो आपके ब्राउज़र में पहले से है।"
body = """
 आपका फ़ॉर्मैट
      पढ़ने के लिए यहाँ कुछ भेजा नहीं जाता, और उसे पढ़ने के लिए इस पेज के बाहर किसी से
      कुछ माँगा भी नहीं जाता। इसलिए कौन-सी फ़ाइलें चलती हैं, यह ठीक वही है जो आपका
      ब्राउज़र पहले से चला लेता है।"""

[[privacy]]
title = "सैंपल जैसे हैं वैसे लिखे जाते हैं, दोबारा एनकोड नहीं होते।"
body = """

      WAV यानी डिकोडर ने जो सैंपल लौटाए, उनके आगे एक हेडर। बीच में कोई एनकोडर नहीं है
      जो आपकी रिकॉर्डिंग के बारे में फ़ैसले करे, और न ऐसा कुछ है जिसे अपलोड कहा जा सके
      जहाँ यह हो पाता।"""

[[privacy]]
title = "गूगल क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और
      माप वाली स्क्रिप्ट गूगल से आती हैं, और दान वाला बटन Buy Me a Coffee से। इनमें से
      किसी को भी आपके वीडियो के बारे में कुछ नहीं दिया जाता: न फ़ाइल, न सैंपल, न नाम, न
      साइज़, न लंबाई।"""

[[privacy]]
title = "यह ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस रहता है,
      क्योंकि इसमें कभी नेटवर्क वाला कदम था ही नहीं। इससे आसान सबूत कोई नहीं।"""

[[howto]]
title = "वीडियो छोड़िए।"
body = """
 फ़ोन, कैमरा, स्क्रीन रिकॉर्डर या किसी
      डाउनलोड से आया MP4, MOV, M4V या WebM। उसे आपका अपना ब्राउज़र पढ़ता है; छोड़ने के
      लिए अपलोड वाला कोई कदम है ही नहीं।"""

[[howto]]
title = "जो मिला, वह पढ़िए।"
body = """
 लंबाई, चैनलों की संख्या और सैंपल रेट, सीधे
      फ़ाइल से। अगर फ़ाइल ने अपना रेट बताया ही नहीं, तो पेज यह कह देता है, बजाय चुपचाप
      दोबारा सैंपल करके यह दावा करने के कि कुछ छुआ नहीं गया।"""

[[howto]]
title = "छोटा चाहिए तो मोनो चुनिए।"
body = """
 चैनलों को छेड़े बिना रिकॉर्डिंग
      बिलकुल वैसी रहती है जैसी थी। मोनो में मिलाने से फ़ाइल आधी रह जाती है, और
      ट्रांसक्रिप्शन या आवाज़ की रिकॉर्डिंग को यही चाहिए। यह एक चैनल फेंकने के बजाय
      दोनों का औसत लेता है।"""

[[howto]]
title = "सेव करने से पहले सुन लीजिए।"
body = """
 प्लेयर में वही फ़ाइल बज रही है जो
      अभी डाउनलोड होने वाली है, वीडियो नहीं &mdash; इसलिए अगर सुनने में सही है, तो
      डाउनलोड भी सही है।"""

[[howto]]
title = "ले जाइए, या आगे बढ़ाइए।"
body = """
 WAV डाउनलोड कीजिए, या बिना सेव किए
      उसे सीधे ट्रिमर या एडिटर को भेज दीजिए।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। डिकोड करना और लिखना, दोनों आपके अपने ब्राउज़र में, आपके अपने हार्डवेयर पर
        होते हैं। इस टूल में किसी भी तरह की नेटवर्क सुविधा नहीं है &mdash; यह कभी कुछ
        मँगाता नहीं और कभी कुछ भेजता नहीं &mdash; और पेज की
        <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं जिनसे यह संपर्क कर
        सकता है, जिनमें से एक भी हमारा नहीं है। बताए जाने से बेहतर जाँचना लगे तो इंटरनेट
        काटकर फिर भी आवाज़ निकाल लीजिए।"""

[[faq]]
q = "क्या यह मुझे MP3 दे सकता है?"
a = """
        नहीं, और इसका दिखावा भी नहीं करेगा। किसी ब्राउज़र में MP3 एनकोडर आता ही नहीं, और
        एनकोडर तक पहुँचने का इकलौता रास्ता है आपका वीडियो ऐसे सर्वर को भेजना जिसके पास
        वह हो &mdash; और यही वह एक काम है जो यह साइट न करने के लिए बनी है। जो आपको मिलता
        है वह WAV है: सैंपल के आगे चौवालीस बाइट का हेडर, जिसमें कोई एनकोडर लगता ही नहीं
        और जिससे क्वालिटी घट ही नहीं सकती। यह बड़ा ज़रूर है, स्टीरियो में करीब दस
        मेगाबाइट प्रति मिनट, और इसे हर प्लेयर, फ़ोन और एडिटर खोल लेता है। जिसे MP3
        चाहिए, वह इससे एक सेकंड में बना सकता है।"""

[[faq]]
q = "क्या तस्वीर कभी देखी जाती है?"
a = """
        नहीं, और यहाँ ऐसा कुछ है ही नहीं जो उसे देख सके। ब्राउज़र के डिकोडर को फ़ाइल दी
        जाती है और उससे उसका ऑडियो ट्रैक माँगा जाता है; वीडियो ट्रैक कभी डिकोड नहीं
        होता, कभी बनाया नहीं जाता और इस पेज के कोड तक पहुँचता तक नहीं।
        <code>src/</code> में चलाने के लिए कोई वीडियो डिकोडर है ही नहीं। जो फ़ाइल निकलती
        है उसमें आवाज़ के सिवा कुछ नहीं होता।"""

[[faq]]
q = "यह कहता है कि कोई आवाज़ नहीं पढ़ी जा सकी, पर वीडियो तो ठीक चलता है।"
a = """
        तो लगभग तय है कि उस वीडियो में ऑडियो ट्रैक है ही नहीं। बिना माइक्रोफ़ोन चुने की
        गई स्क्रीन रिकॉर्डिंग चुप होती है, और एडिटर से आवाज़ म्यूट रखकर निकाली गई क्लिप
        भी &mdash; दोनों बढ़िया चलती हैं, क्योंकि दिखाने को तस्वीर है। संदेश पहले इसी का
        नाम लेता है क्योंकि दोनों में से यही ज़्यादा होता है; दूसरा कारण ऐसा फ़ॉर्मैट है
        जिसे यह ब्राउज़र नहीं पढ़ेगा। फ़ाइल किसी प्लेयर में खोलिए और ऐसा वॉल्यूम कंट्रोल
        ढूँढ़िए जो कुछ करता ही नहीं: दोनों में से कौन-सा मामला है, यह जानने का सबसे तेज़
        तरीका यही है।"""

[[faq]]
q = "मैं कौन-कौन से वीडियो फ़ॉर्मैट खोल सकता हूँ?"
a = """
        जो कुछ आपका ब्राउज़र डिकोड करता है, यानी व्यवहार में MP4, M4V, MOV और WebM, और
        इनके अलावा हर ऑडियो फ़ॉर्मैट। बाहर वही छोटी सूची रह जाती है जो इस साइट पर हर जगह
        है: AVI, WMV और ज़्यादातर MKV। जिस फ़ाइल को आपका ब्राउज़र नहीं पढ़ेगा, उसे आधे
        रास्ते में नाकाम होने के बजाय यह बताने वाले संदेश के साथ मना कर दिया जाता है।"""

[[faq]]
q = "क्या क्वालिटी घटती है?"
a = """
        उससे आगे कुछ नहीं जो वीडियो बनते वक्त अपने ही ऑडियो के साथ पहले ही कर चुका था।
        डिकोडर जो सैंपल लौटाता है, वे जैसे हैं वैसे लिख दिए जाते हैं &mdash; दूसरी बार
        एनकोड नहीं होता, इसलिए नुकसान की दूसरी पीढ़ी भी नहीं होती। जानने लायक बस एक बात
        है, सैंपल रेट: फ़ाइल का अपना रेट पहले उसके हेडर से पढ़ा जाता है और डिकोडिंग उसी
        रेट पर होती है, ताकि आपकी रिकॉर्डिंग चुपचाप दोबारा सैंपल न हो जाए। अगर कोई फ़ाइल
        रेट बताती ही नहीं, तो पेज बता देता है कि उसने कौन-सा रेट मान लिया।"""

[[faq]]
q = "WAV वीडियो से इतना बड़ा क्यों है?"
a = """
        क्योंकि WAV कंप्रेस्ड नहीं है और वीडियो का ऑडियो ट्रैक था। सीडी क्वालिटी की
        आवाज़ स्टीरियो में करीब दस मेगाबाइट प्रति मिनट लेती है, चाहे उसमें कुछ भी हो;
        MP4 के भीतर का AAC ट्रैक शायद उसका दसवाँ हिस्सा। मोनो में मिलाने से यह आधा रह
        जाता है। यही दोबारा एनकोड न करने की कीमत है, और वह एक ही बार चुकानी पड़ती है:
        आगे आप जिससे भी यह फ़ाइल खोलें, वह इसे कंप्रेस कर सकता है।"""

[[faq]]
q = "कितना लंबा वीडियो चल सकता है?"
a = """
        यहाँ कोई सीमा रखी ही नहीं गई, क्योंकि उसके लिए पैसे देने वाला कोई सर्वर नहीं है।
        असली छत आपकी अपनी डिवाइस की मेमोरी है: फ़ाइल पढ़ी जाती है और पूरा ऑडियो ट्रैक
        सैंपल के रूप में रखा जाता है, इसलिए छोटी डिवाइस पर बहुत लंबी रिकॉर्डिंग के लिए
        जगह कम पड़ सकती है। कुछ घंटों का वीडियो आम तौर पर ठीक रहता है, और फ़ोन लैपटॉप से
        कम सँभालेगा।"""

[[faq]]
q = "क्या मैं इसे छोटा कर सकता हूँ या आवाज़ तेज़ कर सकता हूँ?"
a = """
        हाँ, पर यहाँ नहीं &mdash; यह पेज एक ही काम करता है। जब नतीजा आ जाता है तो
        डाउनलोड के बगल में लिंक की एक कतार दिखती है जो उसे बिना सेव किए सीधे
        <a href="../trim-audio/">ऑडियो ट्रिमर</a> या
        <a href="../edit-audio/">ऑडियो एडिटर</a> में ले जाती है, और उनमें से भी कोई उसे
        अपलोड नहीं करता।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या खाता चाहिए?"
a = """
        यह मुफ़्त है, और कोई खाता नहीं, कोई साइन-इन नहीं, कोई ट्रायल नहीं और आप कितने
        वीडियो खोलें इसकी कोई सीमा नहीं। साइट पर विज्ञापन हैं, उन्हीं से इसका खर्च चलता
        है; विज्ञापनों को आपकी फ़ाइल के बारे में कुछ नहीं दिया जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहता है। यही सबसे
        आसान तरीका भी है यह साबित करने का कि कुछ अपलोड नहीं हो रहा: जो टूल आपका वीडियो
        प्रोसेस करने के लिए बाहर भेजता, वह तार निकालते ही रुक जाता।"""

