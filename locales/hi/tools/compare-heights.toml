[[privacy]]
title = "लोगों की सूची सौंप देना कोई छोटी बात नहीं है।"
body = """
 ज़्यादातर ऊँचाई
      चार्ट खाता माँगते हैं, और जो नहीं माँगते उनके पास भी एक सर्वर होता है जो आपका टाइप
      किया हर नाम और हर आँकड़ा देखता है। आप यहाँ जो टाइप कर रहे हैं वह यह है कि आपके
      परिवार में कौन है और हर कोई कितना लंबा है &mdash; और अक्सर नाम के बगल वाली आकृति से
      किसी बच्चे की उम्र भी झलक जाती है। इसमें से कुछ भी कहीं नहीं भेजा जाता, क्योंकि यहाँ
      उसके जाने की कोई जगह ही नहीं है।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 पूरे <code>src/</code> में कहीं
      कोई <code>fetch</code>, कोई <code>XMLHttpRequest</code> और कोई
      <code>sendBeacon</code> नहीं है। Content-Security-Policy में वे सारे पते लिखे हैं
      जिनसे यह पेज संपर्क कर सकता है, और उनमें से एक भी हमारा नहीं है।"""

[[privacy]]
title = "दो बार आने के बीच भी कुछ याद नहीं रखा जाता।"
body = """
 चार्ट पेज में रहता
      है और कहीं नहीं। टैब बंद कीजिए और सूची ग़ायब: उसे थामे रखने वाला कोई खाता नहीं, उसे
      ढोने वाली कोई कुकी नहीं, और इस ब्राउज़र की स्टोरेज में कुछ भी नहीं लिखा जाता &mdash;
      यही वजह भी है कि जिस चार्ट को आप रखना चाहते हैं वह वही है जिसे आप डाउनलोड करते
      हैं।"""

[[privacy]]
title = "लिंक चार्ट को साथ नहीं ले जाता।"
body = """
 इस तरह के कई टूल पूरी सूची को
      पते वाली पट्टी में डाल देते हैं ताकि उसे साझा किया जा सके, और इससे हर नाम और हर
      ऊँचाई ऐसी चीज़ बन जाती है जिसे वह सब दर्ज कर लेता है जिससे होकर लिंक गुज़रता है
      &mdash; कोई चैट सर्वर, कोई मेल स्कैनर, किसी का ब्राउज़र इतिहास। इस पेज का पता आपके
      टाइप करते समय कभी नहीं बदलता।"""

[[privacy]]
title = "PNG उसी SVG से बनता है जो स्क्रीन पर है।"
body = """
 डाउनलोड कोई दूसरी
      रेंडरिंग नहीं है जो प्रीव्यू से अलग हो सकती हो। वही मार्कअप ब्राउज़र को दिया जाता है
      और एक कैनवस पर पोत दिया जाता है, और यही वजह है कि यह नेटवर्क का तार निकालकर भी हो
      जाता है: इसमें न कोई फ़ॉन्ट लाना है और न कोई तस्वीर लोड करनी है।"""

[[privacy]]
title = "कलाकृति यहीं है, कहीं से लाई नहीं जाती।"
body = """
 चारों आकृतियाँ
      सार्वजनिक डोमेन की कलाकृतियाँ हैं, और वे पेज के बाक़ी हिस्से के साथ इसी ओरिजिन
      से आती हैं &mdash; न कोई आइकन फ़ॉन्ट, न कोई CDN, न आपके टाइप करते समय किसी और
      के सर्वर से खींची गई कोई स्प्राइट शीट। नेटवर्क कटा होने पर भी चार्ट बनता रहता
      है, उसकी वजह भी यही है।"""

[[privacy]]
title = "गूगल क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और
      माप वाली स्क्रिप्ट गूगल से आती हैं, और दान वाला बटन Buy Me a Coffee से। इनमें से
      किसी को भी कोई नाम या कोई ऊँचाई नहीं दी जाती। जो भी लाइन आपकी सूची को तस्वीर में
      बदलती है, वह इसी ओरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "यह ऑफ़लाइन चलता है।"
body = """
 नेटवर्क काट दीजिए और टूल जस का तस रहता है,
      क्योंकि इसमें कभी नेटवर्क वाला कदम था ही नहीं। इससे आसान सबूत कोई नहीं।"""

[[howto]]
title = "पहले सबको जोड़ लीजिए, दिखने की चिंता बाद में।"
body = """
 एक पंक्ति मतलब एक
      आकृति, एक नाम, एक ऊँचाई और एक रंग। नाम वैकल्पिक है &mdash; दो बेनाम परछाइयों का
      चार्ट, जिन पर बस ऊँचाइयाँ लिखी हों, अक्सर ठीक वही होता है जो किसी को चाहिए &mdash;
      और हर पंक्ति के तीर उसे बाएँ या दाएँ खिसका देते हैं, अगर क्रम मायने रखता हो।"""

[[howto]]
title = "ऊँचाई जैसे आप लिखते हैं वैसे ही टाइप कीजिए।"
body = """
 <code>173</code>,
      <code>1.73 m</code>, <code>5'8\"</code>, <code>68 in</code> और
      <code>5 ft 8</code> सब सही पढ़े जाते हैं। बॉक्स के नीचे की पंक्ति दिखाती है कि क्या
      समझा गया, दोनों प्रणालियों में, इसलिए ग़लत पढ़ा जाना छपने के बाद नहीं बल्कि बनने से
      पहले ही दिख जाता है। बिना इकाई का एक अंक मीट्रिक चार्ट पर सेंटीमीटर होता है और
      इंपीरियल पर इंच, और तीन से कम का बिना इकाई का अंक मीटर होता है &mdash; कोई भी 1.73
      सेंटीमीटर लंबा नहीं होता।"""

[[howto]]
title = "जो आकृति उस व्यक्ति से मेल खाती हो वही चुनिए।"
body = """
 कोई बच्चा क़रीब छह सिर
      ऊँचा होता है और वयस्क साढ़े सात, इसलिए सिकोड़े हुए वयस्क की तरह बनाया गया बच्चा
      ऐसे ग़लत दिखता है जिसे नाम देना मुश्किल है पर देखना आसान। लड़का और लड़की छोटे
      किए गए वयस्क नहीं बल्कि असली बच्चों के चित्र हैं, और किसी परिवार का चार्ट परिवार
      जैसा दिखे इसका ज़्यादातर हिस्सा यही तय करता है। हर पंक्ति में एक ऊँचाई पहले से
      होती है, तो किसी को जोड़ना किसी को बना देता है &mdash; बस उसके ऊपर लिख दीजिए।"""

[[howto]]
title = "चार्ट पर कुछ जानी-पहचानी चीज़ रखिए।"
body = """
 अंक अमूर्त होता है, दरवाज़ा
      नहीं। ऐसी एक ही चीज़ जोड़ना जिसका आकार सब जानते हों &mdash; एक दरवाज़ा, एक खिड़की,
      कक्षा का व्हाइटबोर्ड, एक वेंडिंग मशीन &mdash; वही उस चार्ट को, जो दो ऊँचाइयाँ बताता
      भर है, ऐसा चार्ट बना देता है जो उन्हें दिखाता है। मेन्यू में बीस चीज़ें हैं,
      समूहों में, और हर एक एक सामान्य पंक्ति बनकर आती है जिस पर आप अपने आँकड़े टाइप कर
      सकते हैं। चीज़ों की ऊँचाई के साथ चौड़ाई भी होती है, इसलिए दरवाज़ा एक पट्टी नहीं
      बल्कि 203 गुणा 81 होता है।"""

[[howto]]
title = "पैमाने को उन इकाइयों पर रखिए जिनमें आपका पाठक सोचता है।"
body = """
 सेंटीमीटर और
      फ़ुट के बीच बदलने से बॉक्स में जो लिखा है वह दोबारा लिखा जाता है, दोबारा समझा नहीं
      जाता, इसलिए चार्ट खुद नहीं हिलता &mdash; बस लिखने का तरीक़ा बदलता है। अगर चार्ट दो
      तरह के पाठकों के लिए है, तो हर आकृति के ऊपर लिखी ऊँचाई चार्ट की इकाई में होती है और
      हर बॉक्स के नीचे की पंक्ति में दोनों होती हैं।"""

[[howto]]
title = "चिपकाने के लिए PNG, छापने के लिए SVG।"
body = """
 PNG आपकी तय की गई पिक्सेल
      ऊँचाई पर एक तस्वीर है, और चैट विंडो, दस्तावेज़ या स्लाइड को यही चाहिए। SVG चार्ट को
      निर्देशों के रूप में रखता है, इसलिए वह किसी भी आकार में साफ़ छपता है और बाद में
      वेक्टर खोलने वाली किसी भी चीज़ से उसका रंग बदला जा सकता है।"""

[[faq]]
q = "क्या मेरा टाइप किया कुछ भी कहीं भेजा जाता है?"
a = """
        नहीं। चार्ट इसी पेज का JavaScript आपकी अपनी डिवाइस पर बनाता है, और इस टूल में
        किसी भी तरह की नेटवर्क सुविधा नहीं है &mdash; यह कभी कुछ मँगाता नहीं और कभी कुछ
        भेजता नहीं। पेज की <code>Content-Security-Policy</code> में वे सारे पते लिखे हैं
        जिनसे यह संपर्क कर सकता है, जिनमें से एक भी हमारा नहीं है। यह बात यहाँ साफ़-साफ़
        कहने लायक़ है, क्योंकि इनपुट लोगों के नामों और उनकी ऊँचाइयों की सूची है, जो इस
        साइट पर आने वाली लगभग हर दूसरी चीज़ से ज़्यादा निजी है।"""

[[faq]]
q = "क्या मैं चार्ट डाउनलोड कर सकता हूँ?"
a = """
        हाँ, PNG या SVG के रूप में, बिना वॉटरमार्क और बिना खाते के। PNG आपकी तय की गई
        पिक्सेल ऊँचाई पर बनता है और वही है जिसे दस्तावेज़, स्लाइड या चैट में चिपकाया जाता
        है। SVG चार्ट को पिक्सेल की जगह निर्देशों के रूप में रखता है: वह किसी भी आकार में
        साफ़ छपता है और बाद में किसी भी वेक्टर एडिटर में खोलकर उसका रंग बदला जा सकता है।
        दोनों उसी मार्कअप से बनते हैं जो स्क्रीन पर है, इसलिए इनमें से कोई भी प्रीव्यू से
        अलग नहीं हो सकता।"""

[[faq]]
q = "ऊँचाई कैसे लिखूँ &mdash; सेंटीमीटर में या फ़ुट में?"
a = """
        जैसे चाहें, किसी भी पंक्ति में, जिस तरह आप आम तौर पर लिखते हैं।
        <code>173</code>, <code>173 cm</code>, <code>1.73 m</code>,
        <code>5'8\"</code>, <code>5 ft 8 in</code> और <code>68 in</code> सब समझे जाते
        हैं, और बॉक्स के नीचे की पंक्ति दोनों प्रणालियों में दिखाती है कि क्या पढ़ा गया।
        बिना इकाई का अंक तब सेंटीमीटर होता है जब चार्ट मीट्रिक है और तब इंच जब वह
        इंपीरियल है; तीन से कम का बिना इकाई का अंक मीटर मान लिया जाता है, क्योंकि 1.73
        सेंटीमीटर ऐसी ऊँचाई नहीं जो कोई टाइप करे।"""

[[faq]]
q = "बच्चे छोटे वयस्कों जैसे क्यों नहीं दिखते?"
a = """
        क्योंकि बच्चा वह है ही नहीं। शरीर के अनुपात उम्र के साथ बदलते हैं: दो साल का
        बच्चा मोटे तौर पर साढ़े चार सिर ऊँचा होता है, आठ साल का छह, और वयस्क साढ़े सात
        &mdash; यानी सिर छोटे बच्चे का लगभग एक चौथाई और वयस्क का आठवाँ हिस्सा होता है।
        यहाँ लड़का और लड़की एक ही छोटी की गई परछाईं नहीं, असली बच्चों के चित्र हैं,
        और इसीलिए परिवार का चार्ट अलग-अलग आकार के चार वयस्कों जैसा नहीं बल्कि परिवार
        जैसा दिखता है।"""

[[faq]]
q = "ये आकृतियाँ कहाँ से आई हैं?"
a = """
        चारों दूसरे लोगों की कलाकृतियाँ हैं, सब सार्वजनिक डोमेन में: पुरुष pitr का,
        महिला Madeleine Price Ball की, लड़की OpenClipart-Vectors की, और लड़का NIH
        BioArt लाइब्रेरी के लिए Ryan Kissinger का। हर फ़ाइल इस पेज के साथ
        <code>vendor/</code> में उसी रूप में आती है जैसे वह प्रकाशित हुई थी, इसलिए आप
        उन्हें मूल से मिला सकते हैं। सार्वजनिक डोमेन कुछ नहीं माँगता, और असल बात यही
        है: कलाकृति उस तस्वीर के भीतर पहुँचती है जिसे आप डाउनलोड करते हैं, और श्रेय
        माँगने वाला लाइसेंस वह शर्त आपके चार्ट से चिपका देता।"""

[[faq]]
q = "नन्हा बच्चा या शिशु क्यों नहीं है?"
a = """
        क्योंकि किसी ने एक बनाकर उसे सार्वजनिक डोमेन में नहीं डाला। विकिमीडिया कॉमन्स
        पर काम लायक़ बस एक ही मुफ़्त बच्चा है &mdash; वही लड़की &mdash; और NIH BioArt
        लाइब्रेरी में लड़का; स्कूल की उम्र से नीचे खोज खाली लौटती है, और लोगों का हर
        तार्किक मुफ़्त सेट शौचालय वाला चित्र-चिह्न होता है, हर उम्र में एक ही आकार का,
        और यही वह ग़लती है जिससे बचने के लिए यह पूरा टूल बना है। कुछ समय तक इस पेज के
        अपने कोड से बना एक नन्हा बच्चा था, और चार्ट पर वही अकेली आकृति थी जिसे किसी ने
        नहीं बनाया था: चार बनाई हुई आकृतियों के बगल में यह दिख जाता था। लड़के या लड़की
        से छोटे किसी के लिए, उनमें से एक को असली ऊँचाई पर सेट कर दीजिए &mdash; तुलना
        को थामे रखता है पैमाना, और वह सही रहेगा।"""

[[faq]]
q = "एक चार्ट पर कितने लोग रख सकते हैं?"
a = """
        बारह। यह तकनीकी सीमा नहीं है &mdash; चित्र तो ख़ुशी-ख़ुशी तीस भी बना देता &mdash;
        पर एक दर्जन के बाद स्तंभ उनके ऊपर लिखे नामों से भी पतले हो जाते हैं और तस्वीर पढ़ी
        जानी बंद हो जाती है। अगर और चाहिए, तो नाम बंद कर देने से चौड़ाई वापस मिल जाती है,
        या दो चार्ट एक से बेहतर बात कहेंगे।"""

[[faq]]
q = "क्या मैं चार्ट पर कोई चीज़ रख सकता हूँ?"
a = """
        हाँ &mdash; एक सादा आयत एक ऊँचाई और एक चौड़ाई लेता है, इसलिए दो मापों वाली कोई भी
        चीज़ लोगों के बगल में आ जाती है। मेन्यू में शुरू करने के लिए बीस हैं, चार समूहों
        में: दरवाज़े और खिड़कियाँ, स्कूल और दफ़्तर (व्हाइटबोर्ड, मेज़, फ़ाइल अलमारी,
        प्रोजेक्टर स्क्रीन), शहर की चीज़ें (वेंडिंग मशीन, पहियों वाला कूड़ेदान, बास्केटबॉल
        का घेरा, 20&nbsp;ft का जहाज़ी कंटेनर) और घर की चीज़ें। इनमें से कुछ सचमुच मानक हैं
        और कुछ बस आम माप, और पेज यह खुलकर कहता है; हर एक एक सामान्य पंक्ति बनकर आती है
        जिस पर आप लिख सकते हैं। एक जानी-पहचानी चीज़ किसी चार्ट के लिए उतना कर देती है
        जितना कितने भी और लोग नहीं करते: वही तुलना को पैमाने के एहसास में बदल देती है।"""

[[faq]]
q = "क्या कुत्ते या बिल्ली की कोई आकृति है?"
a = """
        नहीं, और यह चूक नहीं बल्कि जान-बूझकर छोड़ी गई जगह है। दोनों बनाए गए थे &mdash;
        बग़ल से, खड़े हुए, सिर कंधे के बराबर, ताकि चित्र का ऊपरी सिरा वही ऊँचाई हो जो बगल
        में लिखी है, क्योंकि हर नस्ल मानक जानवर को वहीं नापता है। वे इतने अच्छे नहीं बने
        कि भेजे जाते: सामने से दिख रहे चार लोगों के बगल में बग़ल से दिखता चौपाया, चित्र
        अच्छा होने पर भी ग़लती जैसा लगता है। तब तक जानवर के कंधे की ऊँचाई पर एक आयत ईमानदार
        जवाब है।"""

[[faq]]
q = "क्या मैं चार्ट को लिंक से साझा कर सकता हूँ?"
a = """
        यहाँ से नहीं, और यह जान-बूझकर है। जो टूल यह सुविधा देते हैं, वे पूरी सूची को पते
        में डालकर देते हैं, जिसका मतलब है कि हर नाम और हर ऊँचाई उस हर चीज़ में पहुँच जाती
        है जिससे होकर लिंक जाता है &mdash; किसी चैट सर्वर के लॉग, कोई मेल स्कैनर, किसी का
        ब्राउज़र इतिहास, लिंक प्रीव्यू लाने वाली कोई सेवा। तस्वीर डाउनलोड कीजिए और वही
        भेजिए: वह वही बात कहती है और अपने साथ कोई सूची नहीं ले जाती।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या चार्ट व्यावसायिक रूप से इस्तेमाल कर सकता हूँ?"
a = """
        यह मुफ़्त है, कोई खाता नहीं और कोई वॉटरमार्क नहीं, और आप नतीजे को किसी रिपोर्ट,
        प्रस्तुति, विज्ञापन या उत्पाद में डाल सकते हैं। साइट पर विज्ञापन हैं, उन्हीं से
        इसका खर्च चलता है। यहाँ बनाए गए चार्ट का कुछ भी हमारा नहीं है, और कुछ भी रखा नहीं
        जाता।"""

[[faq]]
q = "पैमाना दस-दस का क्यों है, एक-एक का क्यों नहीं?"
a = """
        क्योंकि दूरी किसी तय संख्या से नहीं, बल्कि इससे चुनी जाती है कि तस्वीर कितनी
        लकीरें सँभाल सकती है। दो वयस्कों वाले चार्ट में हर दस सेंटीमीटर पर एक लकीर आती है;
        उस पर बास्केटबॉल का घेरा रख दीजिए और लकीरें पच्चीस पर चली जाती हैं, क्योंकि एक
        तस्वीर पर नब्बे लकीरें पैमाना नहीं, एक धूसर धब्बा होती हैं। फ़ुट और इंच में सीढ़ी
        एक, तीन, छह और बारह इंच की है, ताकि लकीरें पूरे इंच पर गिरें, उनके आसपास नहीं।"""

[[faq]]
q = "क्या मैं चार्ट को किसी गहरे रंग की स्लाइड पर रख सकता हूँ?"
a = """
        हाँ। पृष्ठभूमि को उसी रंग पर सेट कीजिए जिस पर वह बैठेगा, और पैमाना तथा लिखावट उसके
        हिसाब से गहरे और हल्के के बीच बदल जाते हैं &mdash; अंदाज़े से नहीं, उस रंग की
        चमक से निकाला हुआ। फिर अगर तस्वीर ख़ुद पारदर्शी चाहिए तो &ldquo;कोई पृष्ठभूमि ही
        नहीं&rdquo; पर निशान लगाइए: स्याही अब भी आपके चुने रंग से तय होती है, इसलिए गहरे
        नीले स्लाइड के लिए बना पारदर्शी चार्ट उस पर पढ़ने लायक़ ही निकलता है।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहता है। यही सबसे आसान
        तरीक़ा भी है यह साबित करने का कि कुछ अपलोड नहीं हो रहा: जो टूल आपकी सूची को चार्ट
        बनवाने के लिए बाहर भेजता, वह तार निकालते ही रुक जाता।"""

