        बारह बाइट के लिए पूरी फ़ाइल फेंक देना गलत बर्ताव होता।"""

[[faq]]
q = "क्या यह डायग्नोस्टिक व्यूअर है?"
a = """
        नहीं। यह मेडिकल डिवाइस नहीं है, यह किसी नियामक जाँच से नहीं गुज़रा है, और
        यहाँ की किसी भी चीज़ से कोई क्लिनिकल फ़ैसला नहीं लिया जाना चाहिए। आपकी
        स्क्रीन कैलिब्रेट नहीं है, ब्राउज़र कोई प्रमाणित रेंडरिंग चेन नहीं है, और
