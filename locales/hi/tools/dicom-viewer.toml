[[faq]]
q = "क्या यह मेरी फ़ाइल बदलता है?"
a = """
        नहीं। यह टूल सिर्फ़ पढ़ता है। न कोई आउटपुट फ़ाइल है, न दोबारा एन्कोडिंग, और
        न यहाँ कोई बटन है जो DICOM लिखे। आप जो डाउनलोड कर सकते हैं वह है स्क्रीन पर
