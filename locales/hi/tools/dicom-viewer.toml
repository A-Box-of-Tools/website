      <code>src/rle.js</code> और <code>src/jpeg-lossless.js</code> उन दो
      कंप्रेस्ड रूपों को खोलते हैं जिन्हें यह पेज डीकोड कर सकता है, और
      <code>src/window.js</code> नापे गए मानों को आपकी स्क्रीन के धूसर रंगों पर
      बिठाता है।"""

[[privacy]]
title = "पहचान बताने वाले फ़ील्ड आपके लिए गिनाए जाते हैं, और किसी के लिए नहीं।"
body = """

      यह पेज आपकी फ़ाइल का हर वह फ़ील्ड छापकर दिखाता है जो उस इंसान का नाम लेता है
      या यह छाँटता है कि वह कौन हो सकता है। यही वह सवाल है जिसका जवाब किसी स्लाइस
      को साझा करने जा रहे इंसान को चाहिए होता है, और कोई व्यूअर उसका जवाब नहीं
      देता। वह आपके सामने स्क्रीन पर आता है और कहीं और नहीं जाता। इस रिपॉज़िटरी
      में कोई एनालिटिक्स इवेंट नहीं है जो उसमें से कुछ भी ले जाए, और होता भी तो यह
      पेज उसे भेज नहीं सकता।"""

