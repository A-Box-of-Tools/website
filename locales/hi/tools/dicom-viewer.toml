[[howto]]
title = "सीरीज़ चुनिए।"
body = """
 एक जाँच में आम तौर पर कई होती हैं, पहले
      स्काउट और फिर हर अलग शॉट। हर सीरीज़ उसी क्रम में लगती है जिसमें मशीन ने उसे
      लिया था, और वह क्रम नंबरों से नहीं बल्कि इससे निकलता है कि हर स्लाइस शरीर
      में कहाँ पड़ती है। नंबर हमेशा एक ही दिशा में नहीं चलते।"""

[[howto]]
title = "विंडो सेट कीजिए।"
body = """
 यही वह चीज़ है जो स्कैन को पढ़ने लायक
      बनाती है, और यही इमेज एडिटर में नहीं होती। तस्वीर पर आड़ा खींचिए तो विंडो
      चौड़ी होती है और ऊपर-नीचे खींचिए तो उसका केंद्र सरकता है। CT पर आप नाम वाली
      विंडो भी चुन सकते हैं, जैसे फेफड़ा, हड्डी, दिमाग, नरम ऊतक, क्योंकि CT की
      इकाइयाँ दुनिया की हर मशीन पर एक जैसी होती हैं।"""

[[howto]]
title = "स्लाइस पलटिए।"
body = """
 तस्वीर के नीचे वाला स्लाइडर स्लाइस बदलता
      है, और तस्वीर पर एक बार क्लिक कर देने के बाद तीर की कुंजियाँ भी यही करती
      हैं। कई फ़्रेम वाली फ़ाइल, जैसे अल्ट्रासाउंड लूप या एंजियोग्राम, बगल के बटन
      से चलती है।"""

[[howto]]
title = "कुछ नापिए।"
body = """
 नाप पर जाइए और एक रेखा खींचिए। जहाँ फ़ाइल
      बताती है कि उसके पिक्सल कितनी दूर हैं, वहाँ जवाब मिलीमीटर में आता है और उन
      पिक्सलों का भी ध्यान रखा जाता है जो वर्गाकार नहीं हैं। जहाँ फ़ाइल यह नहीं
      बताती, वहाँ जवाब पिक्सल में आता है और साफ़ कह भी दिया जाता है, कोई पैमाना
      गढ़ा नहीं जाता।"""

[[howto]]
title = "हेडर पढ़िए।"
body = """
 फ़ाइल का हर एलिमेंट, उसके नंबर के साथ,
      स्टैंडर्ड जिस नाम से उसे बुलाता है उसके साथ, और उसमें जो है उसके साथ, और यह
      सब खोजा जा सकता है। उसके ऊपर वह सूची है कि इसी फ़ाइल में मरीज़ की पहचान
      क्या-क्या कराता है, जो नाम से कहीं ज़्यादा है।"""

[[howto]]
title = "जो चाहिए वह ले जाइए।"
body = """
 स्क्रीन पर दिख रही तस्वीर PNG के रूप
      में, आपकी सेट की हुई विंडो के साथ और उस पर कुछ भी छपा हुए बिना, या फिर पूरा
      हेडर सादे टेक्स्ट में। दोनों इसी पेज में उसी से बनते हैं जो पहले से यहाँ
      मौजूद है।"""

[[faq]]
q = "क्या मेरा स्कैन कहीं अपलोड होता है?"
a = """
        नहीं। फ़ाइल को पढ़ना, डीकोड करना और बनाना, यह सब आपका अपना ब्राउज़र आपके
        अपने हार्डवेयर पर करता है। इस टूल का कोई सर्वर वाला हिस्सा है ही नहीं, और
        पेज की <code>Content-Security-Policy</code> में हर वह पता लिखा है जिससे वह
        बात कर सकता है। उनमें से एक भी इस साइट का नहीं है। नेटवर्क का तार खींच
        दीजिए, फिर भी स्कैन खुलते रहेंगे।
        <br><br>
        यह बात यहाँ इस साइट के किसी भी दूसरे पेज से ज़्यादा मायने रखती है। DICOM
        फ़ाइल अपने हेडर में मरीज़ का नाम, जन्म तारीख और अस्पताल का नंबर लिए चलती
        है, इसलिए उसे किसी व्यूअर पर चढ़ाने का मतलब है किसी अजनबी को तस्वीर नहीं,
        मेडिकल रिकॉर्ड सौंप देना।"""

[[faq]]
q = "यह कौन-सी DICOM फ़ाइलें खोल सकता है?"
a = """
        तीनों बुनियादी transfer syntax में बिना कंप्रेस की फ़ाइलें, यानी implicit
        और explicit little endian, और वह big endian जो अब हटा दी गई है। इनके
        अलावा deflated, RLE Lossless, baseline JPEG और JPEG Lossless भी, और अस्पताल
        की डिस्क पर मौजूद ज़्यादातर CT और MRI जाँचें इसी आखिरी तरीके से कंप्रेस
        होती हैं।
        <br><br>
        यह JPEG 2000, JPEG-LS, और वीडियो में इस्तेमाल होने वाली MPEG व HEVC
        सिंटैक्स डीकोड नहीं कर सकता। उनके लिए ऐसे कोडेक चाहिए जो कई मेगाबाइट की
        कंपाइल की हुई लाइब्रेरी होते हैं, और जो पेज ज़रूरत पड़ने पर उन्हें मँगाता
        वह ऑफ़लाइन चलने वाला पेज न रह जाता। ऐसी किसी फ़ाइल के साथ भी काम चलता है।
        पूरा हेडर पढ़कर दिखा दिया जाता है, और तस्वीर की जगह एक लाइन आती है जो कोडेक
        का नाम बताती है, न कि टूटी इमेज का वह निशान जो कुछ नहीं बताता।"""

[[faq]]
q = "&lsquo;विंडो और लेवल&rsquo; क्या है, और यह क्यों चाहिए?"
a = """
        एक CT स्लाइस में करीब चार हज़ार अलग-अलग मान होते हैं और आपकी स्क्रीन दो सौ
        छप्पन धूसर रंग दिखाती है। किसी को तय करना पड़ता है कि उन चार हज़ार में से
        कौन-सा हिस्सा उन सभी दो सौ छप्पन को पाएगा, और वही चुनाव
        <strong>विंडो</strong> है। उससे नीचे सब काला, उससे ऊपर सब सफ़ेद, और बीच का
        हिस्सा धूसर रंगों में फैला हुआ।
        <br><br>
        इसीलिए वही फ़ाइल दो सेटिंग में दो अलग स्कैन जैसी दिखती है, और इसीलिए फेफड़ा
        और हड्डी एक साथ नहीं देखे जा सकते। CT पर ये संख्याएँ हाउंसफ़ील्ड इकाई हैं,
        जो पूरी तरह तय हैं। पानी 0 है और हवा &minus;1000, हर CT मशीन पर। इसलिए इस
        पेज की नाम वाली विंडो वही संख्याएँ हैं जो कोई रेडियोलॉजिस्ट अपने वर्कस्टेशन
        पर इस्तेमाल करता है। MRI या अल्ट्रासाउंड पर ऐसा कोई पैमाना नहीं होता, और
        जो विंडो खुलती है वह वही है जो फ़ाइल खुद माँगती है।"""

[[faq]]
q = "यह मेरी नाप को पिक्सल में क्यों बता रहा है?"
a = """
        क्योंकि वह फ़ाइल यह नहीं बताती कि एक पिक्सल कितना बड़ा है। यह बात Pixel
        Spacing (0028,0030) में मिलीमीटर में लिखी होती है, और बहुत सारी
        अल्ट्रासाउंड इमेज, स्कैन किए हुए कागज़ और secondary capture में वह होती ही
