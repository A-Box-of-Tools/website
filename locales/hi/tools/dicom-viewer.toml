        <br><br>
        जहाँ वह होती है, वहाँ नाप मिलीमीटर में आती है और हर अक्ष अपनी दूरी से नापा
        जाता है, जो उन तस्वीरों में मायने रखता है जिनके पिक्सल वर्गाकार नहीं होते।
        जहाँ वह नहीं होती, वहाँ ईमानदार जवाब पिक्सल की गिनती है, और यह उसे कहता भी
        है, न कि कोई पैमाना चुनकर नतीजे को लंबाई की तरह पेश करता है।"""

[[faq]]
q = "इसने मेरे फ़ोल्डर को कई सीरीज़ में खोल दिया। ऐसा क्यों?"
a = """
        क्योंकि उसमें यही है। एक जाँच सीरीज़ से बनती है, पहले स्काउट व्यू और फिर हर
        शॉट या रीकंस्ट्रक्शन, और हर फ़ाइल Series Instance UID (0020,000E) में बताती
        है कि वह किसकी है। सूची फ़ोल्डर से नहीं, इसी से बनती है, क्योंकि फ़ोल्डर में
        तो आम तौर पर सब कुछ नामों की एक ही लिस्ट में मिला-जुला पड़ा होता है।
        <br><br>
        सीरीज़ के भीतर स्लाइस इस हिसाब से क्रम में लगती हैं कि हर एक शरीर में कहाँ
        है, जो Image Position और Image Orientation से निकलता है। Instance Number
        सीधी-सी कुंजी है, लेकिन वह पहली पसंद नहीं बल्कि आखिरी सहारा है, क्योंकि उसे
        वही चीज़ देती है जिसने फ़ाइलें लिखीं और ज़रूरी नहीं कि वह मरीज़ की दिशा में
        चले।"""

[[faq]]
q = "&lsquo;मरीज़ की पहचान क्या कराता है&rsquo; वाली सूची का क्या मतलब है?"
a = """
        यह आपकी फ़ाइल का हर वह फ़ील्ड है जो स्कैन वाले इंसान का नाम लेता है, या यह
        छाँटता है कि वह कौन हो सकता है, और यह सब आपकी मशीन पर इसी फ़ाइल से पढ़ा गया
        है। सूची DICOM स्टैंडर्ड के PS3.15 से आती है, यानी उस हिस्से से जो बताता है
        कि किसी डेटासेट को de-identified कहने से पहले उसमें से क्या-क्या जाना
        चाहिए।
        <br><br>
        यह इसलिए है कि लोग जहाँ गलती करते हैं वह यह नहीं है कि स्कैन में नाम होता
        है। गलती इस बारे में होती है कि उसमें और कितना कुछ होता है। जन्म तारीख,
        रेफ़रेंस नंबर, रेफ़र करने वाला डॉक्टर, संस्थान, मशीन का सीरियल नंबर, और जाँच
        के UID, जो उस आर्काइव तक लौटने की एकदम सटीक कुंजी हैं जिसने यह फ़ाइल बनाई।
        जिस स्कैन से सिर्फ़ नाम मिटा दिया गया हो वह गुमनाम नहीं होता।
        <br><br>
        यह टूल सिर्फ़ दिखाता है। यह कुछ लिखता नहीं और कुछ बदलता नहीं, इसलिए इसमें से
        कुछ निकाल भी नहीं सकता।"""

[[faq]]
q = "क्या यह स्कैन को गुमनाम कर सकता है?"
a = """
        नहीं, और यह जान-बूझकर ऐसा होने का दिखावा भी नहीं करता। यह पेज पढ़ता है।
        इसमें ऐसा कोई कोड नहीं है जो DICOM फ़ाइल लिखे। यह जो करता है वह यह बताना है
        कि आपकी फ़ाइल में ठीक-ठीक क्या है, और यही वह हिस्सा है जो पता करना मुश्किल
        है और जिसके बारे में लोग गलत होते हैं।
        <br><br>
        पहचान बताने वाले फ़ील्ड निकालने वाला टूल एक अलग काम है जिसका पैमाना कहीं
        ऊँचा है। उसे पिक्सल छुए बिना फ़ाइल दोबारा लिखनी होगी, पूरी जाँच में UID
        एक-से ढंग से बदलने होंगे, और उन प्राइवेट एलिमेंट के बारे में सही होना होगा
