[[howto]]
title = "फ़ाइलें चुनिए।"
body = """
 एक <code>.dcm</code> फ़ाइल, या डिस्क का
      पूरा फ़ोल्डर। CT या MRI में हर स्लाइस की अलग फ़ाइल होती है, इसलिए सबको एक
      साथ खींचकर डालना ही सीरीज़ को दोबारा जोड़ता है। फ़ाइलें ब्राउज़र सीधे आपकी
