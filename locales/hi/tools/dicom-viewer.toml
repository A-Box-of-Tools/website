[[privacy]]
title = "आपके स्कैन के जाने के लिए कोई जगह ही नहीं है।"
body = """
 Content-Security-Policy
      में हर वह पता लिखा है जिससे यह पेज बात कर सकता है, और उनमें से एक भी इस
      साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट नहीं है जहाँ आपकी फ़ाइल जमा हो सके,
      और कोड में ऐसा कुछ नहीं है जो होता तो भी उसे भेजता। पहले यहाँ
      <code>connect-src 'none'</code> लिखा था, जो पूरी तरह बंद था। विज्ञापन जोड़ने
      पर वह चला गया, और यह कहना भी उसी सौदे का हिस्सा है।"""

[[privacy]]
title = "यह बात यहाँ बाकी पेजों से ज़्यादा भारी पड़ती है।"
body = """

      DICOM फ़ाइल मेटाडेटा लगी हुई तस्वीर नहीं है। वह तस्वीर वाला मेडिकल रिकॉर्ड
      है। मरीज़ का नाम, जन्म तारीख, अस्पताल का नंबर, रेफ़रेंस नंबर, जाँच लिखने
      वाला डॉक्टर, संस्थान और मशीन का सीरियल नंबर, ये सब हेडर के फ़ील्ड हैं और
      फ़ाइल जहाँ भी जाती है उसके साथ जाते हैं। उसे बस देखने के लिए किसी वेबसाइट पर
      चढ़ा देने का मतलब है यह सब उस वेबसाइट को चलाने वाले के हाथ में दे देना। यह
      पेज ठीक यही न करने के लिए बना है।"""

[[privacy]]
title = "पढ़ने वाला हिस्सा इस रिपॉज़िटरी की चौदह फ़ाइलें हैं।"
