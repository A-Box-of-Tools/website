[[privacy]]
title = "आपके वीडियो के पास जाने को कोई जगह ही नहीं है।"
body = """
 यह पेज जिन-जिन
      पतों से संपर्क कर सकता है, Content-Security-Policy उन सबके नाम गिना देती
      है, और उनमें से एक भी इस साइट का नहीं है। यहाँ कोई ऐसा एंडपॉइंट है ही
      नहीं जहाँ आपकी फ़ाइल जमा की जा सके, और कोड में ऐसा कुछ भी नहीं जो उसे
      भेजता, अगर होता भी।"""

[[privacy]]
title = "यहाँ कुछ भी कहीं से कुछ नहीं लाता।"
body = """
 इस टूल में कोई नेटवर्क सुविधा
      है ही नहीं: न चिपकाने को कोई पता, न डाउनलोड करने को कुछ, न पहली बार
      इस्तेमाल पर बाहर से मँगाया जाने वाला कोई इंजन। आपके वीडियो को छूने वाला
      हर बाइट पेज लोड होते ही इसी ऑरिजिन से आया था।"""

[[privacy]]
title = "आम रास्ते पर तो कुछ डिकोड तक नहीं होता।"
body = """

      काटने से किसी फ़्रेम की शक्ल नहीं बदलती, इसलिए आपके निशान लगाए हिस्सों
      के एनकोडेड फ़्रेम ठीक जैसे मिले थे वैसे ही नई फ़ाइल में उठाकर रख दिए
      जाते हैं। हर एक आपकी डिस्क पर पड़ी फ़ाइल के एक टुकड़े के रूप में रखा
      जाता है &mdash; यानी एक नोट कि कौन-से बाइट, न कि ख़ुद बाइट &mdash; और
      आपका ब्राउज़र उन्हें पहली बार तब पढ़ता है जब वह डाउनलोड लिख रहा होता है।
      यहाँ कुछ भी आपके वीडियो को वापस तस्वीर में बदलता ही नहीं।"""

[[privacy]]
title = "निशानों की फ़ाइल इसी पेज में बनती है।"
body = """
 अपने निशान सहेजने पर
      स्क्रीन पर पहले से मौजूद संख्याओं से एक टेक्स्ट फ़ाइल लिखी जाती है, सीधे
      आपके डाउनलोड में। कोई फ़ाइल लोड करने पर वह यहीं पढ़ी जाती है। इनमें से
      कोई भी नेटवर्क के पास नहीं फटकता, और कोई भी समय के सिवा कुछ नहीं ढोता।"""

[[privacy]]
title = "आवाज़ नक़ल की जाती है, सुनी नहीं जाती।"
body = """
 MP4 वाले दोनों रास्तों
      पर ऑडियो के सैंपल बिना डिकोड हुए ही आगे उतार दिए जाते हैं &mdash; यहाँ
      कुछ भी उन्हें वापस आवाज़ में बदलता ही नहीं, और अगर बदलता भी, तो कुछ भी
      उन्हें कहीं भेज नहीं सकता था।"""

[[privacy]]
title = "जहाँ फ़्रेम डिकोड होते हैं, वह यहीं होता है।"
body = """
 ठीक निशान पर लगने
      वाला कट, और उस फ़ाइल का प्रीव्यू जिसे यह ब्राउज़र चला नहीं सकता, दोनों
      आपकी अपनी मशीन के WebCodecs से गुज़रते हैं। यह वही डिकोडर है जो आपको यह
      वीडियो वैसे भी दिखाता, और उसी जगह चल रहा है।"""

[[privacy]]
title = "Google क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """
 विज्ञापन और माप
      वाली स्क्रिप्ट Google से आती हैं। इनमें से किसी को भी आपके वीडियो के
      बारे में कुछ नहीं सौंपा जाता: न फ़ाइल, न फ़्रेम, न नाम, न साइज़, न
      लंबाई, न यह कि आपने उसे कहाँ काटा। पढ़ने, काटने और लिखने वाली हर पंक्ति
      इसी ऑरिजिन से आती है और रिपॉज़िटरी में दर्ज है।"""

[[privacy]]
title = "दान का बटन क्या लोड करता है, और उसे क्या नहीं दिया जाता।"
body = """

      हेडर में मौजूद &ldquo;Buy me a coffee&rdquo; बटन को
      cdnjs.buymeacoffee.com से आई एक स्क्रिप्ट बनाती है, और उसके अक्षर Google
      Fonts से आते हैं। वह एक लिंक है और उससे ज़्यादा कुछ नहीं: वह किसी
      विज़िट की ख़बर नहीं करता, और उसे आपके या आपके वीडियो के बारे में कुछ
      नहीं दिया जाता।"""

[[privacy]]
title = "यह ऑफ़लाइन भी चलता है।"
body = """
 नेटवर्क काट दीजिए और इस पेज की हर
      चीज़ काम करती रहेगी। सबसे आसान सबूत यही है।"""

[[howto]]
title = "कोई वीडियो चुनिए।"
body = """
 MP4, MOV, M4V या WebM पिकर पर छोड़
      दीजिए। ब्राउज़र उसे सीधे आपकी डिस्क से पढ़ता है; इस दौरान कुछ भी कहीं
      नहीं भेजा जाता। कई फ़ाइलें छोड़िए और वे उसी क्रम में जोड़ दी जाती हैं
      जिसमें आपने रखी थीं।"""

[[howto]]
title = "इसे चलाइए, और मनचाहे हिस्सों पर निशान लगाइए।"
body = """
 जहाँ कोई हिस्सा
      शुरू होना चाहिए वहाँ <kbd>I</kbd> दबाइए और जहाँ ख़त्म होना चाहिए वहाँ
      <kbd>O</kbd>। यह जितनी बार चाहें कीजिए &mdash; हर जोड़ा नीचे की तालिका
      में एक पंक्ति बनता है, और टाइमलाइन पर एक पट्टी। <kbd>U</kbd> पिछला निशान
      वापस ले लेता है, <kbd>Space</kbd> चलाता और रोकता है, और तीर वाली कुंजियाँ
      पाँच-पाँच सेकंड छलाँग लगाती हैं। अगर वह पल पकड़ना मुश्किल हो, तो
      प्लेबैक धीमा कर लीजिए।"""

[[howto]]
title = "निशानों को ठीक कीजिए।"
body = """
 हर पंक्ति को अलग से चलाकर देखा जा
      सकता है, उसमें ठीक समय टाइप करके उसका समय बदला जा सकता है, क्रम में ऊपर
      या नीचे किया जा सकता है, या मिटाया जा सकता है। चुने हुए हिस्से के दोनों
      सिरे टाइमलाइन पर खींचे भी जा सकते हैं। ऊपर दिखता कुल जोड़ वही है जितना
      तैयार वीडियो चलेगा।"""

[[howto]]
title = "इन्हें रखिए, या इन्हें काट दीजिए।"
body = """
 आम तौर पर रखने वाला रास्ता
      ही चुना जाता है: तैयार वीडियो वही हिस्से हैं जिन पर आपने निशान लगाया,
      क्रम से जुड़े हुए। उन्हें काट देना वह दूसरा काम है जो लोग चाहते तो हैं
      पर कम ही मिलता है &mdash; विज्ञापनों, चुप्पियों या ग़लत शुरुआतों पर
      निशान लगाइए, और जो बचता है वह उनके बिना जुड़ जाता है।"""

[[howto]]
title = "काटिए, और डाउनलोड कीजिए।"
body = """
 &ldquo;हर बाइट बचाइए&rdquo;
      फ़्रेम बिना छुए उतार देता है: तेज़ है, और इसमें क्वालिटी की क़ीमत लग ही
      नहीं सकती, पर हर हिस्सा आपके निशान से पहले वाले कीफ़्रेम से शुरू होता
      है। &ldquo;ठीक यहीं काटिए&rdquo; तस्वीर को डिकोड करके दोबारा लिखता है,
      ताकि हर हिस्सा ठीक उसी फ़्रेम से शुरू हो जो आपने चुना था। बटन दबाने से
      पहले पेज बता देता है कि आपको कौन-सा मिलने वाला है, और उसकी क़ीमत क्या
      है।"""

[[faq]]
q = "क्या मेरा वीडियो कहीं अपलोड होता है?"
a = """
        नहीं। उसे आपका अपना ब्राउज़र, आपके अपने हार्डवेयर पर पढ़ता है, निशान
        लगाता है, काटता है और लिखता है। इस टूल का कोई सर्वर वाला हिस्सा है ही
        नहीं, और पेज की <code>Content-Security-Policy</code> उन सारे पतों के
        नाम गिना देती है जिनसे यह संपर्क कर सकता है &mdash; उनमें से एक भी इस
        साइट का नहीं है। बताया जाना अगर काफ़ी न लगे तो इंटरनेट काटकर कोई
        वीडियो काटकर देख लीजिए।"""

[[faq]]
q = "क्या मैं एक ही वीडियो के कई हिस्से रख सकता हूँ?"
a = """
        यह बना ही इसी के लिए है। चलते वीडियो में <kbd>I</kbd> और <kbd>O</kbd>
        जितनी बार चाहें दबाइए; हर जोड़ा एक पंक्ति बनता है, और तैयार वीडियो
        हर पंक्ति को क्रम से जोड़कर बनता है, बाक़ी सब हटाकर। ज़्यादातर ऑनलाइन
        कटर आपको हैंडल का एक ही जोड़ा देते हैं और पूछते हैं कि कौन-सा अकेला
        हिस्सा रखना है &mdash; जो किसी क्लिप के आगे-पीछे छाँटने के लिए ठीक है
        और घंटे भर की फ़ुटेज एक बार देखकर उसमें से छह काम के पल बचाने के लिए
        बिलकुल बेकार।"""

[[faq]]
q = "क्या काटने से क्वालिटी घटती है?"
a = """
        आम रास्ते पर नहीं, और जिस तरह से मायने रखता है उस तरह तो बिलकुल नहीं।
        काटने से किसी फ़्रेम की शक्ल नहीं बदलती, इसलिए फ़्रेम ठीक वैसे के वैसे
        नई फ़ाइल में उठाकर रख दिए जाते हैं: वही बाइट, वही एनकोडर सेटिंग, वही
        सब कुछ। यहाँ अकेला रास्ता जो कुछ दोबारा एनकोड करता है वह ठीक निशान पर
        लगने वाला कट है, और बटन पर यह लिखा भी होता है।"""

[[faq]]
q = "कोई हिस्सा मेरे निशान से पहले क्यों शुरू हो जाता है?"
a = """
        क्योंकि वीडियो सहेजा ही ऐसे जाता है &mdash; और सिर्फ़ उन प्लेयरों पर
        जो फ़ॉर्मैट के एक मानक हिस्से को अनदेखा कर देते हैं। ज़्यादातर फ़्रेम
        इस ब्योरे के रूप में रखे जाते हैं कि वे अपने पड़ोसियों से किस तरह अलग
        हैं, इसलिए उनके बिना उन्हें डिकोड किया ही नहीं जा सकता; अकेला खड़ा
        होता है सिर्फ़ कीफ़्रेम, और कीफ़्रेम आम तौर पर एक से दस सेकंड की दूरी
        पर होते हैं। इसलिए जो कट फ़्रेम नक़ल करता है, उसे आपके निशान से पहले
        वाले कीफ़्रेम से चली आ रही क़तार भी साथ ढोनी पड़ती है &mdash; और
        फ़ाइल में लिखा होता है कि <em>चलाना आपके निशान से शुरू कीजिए</em>,
        जिसे हर मुख्यधारा का प्लेयर मानता है। अगर हर प्लेयर में ठीक वहीं चाहिए,
        तो &ldquo;ठीक यहीं काटिए&rdquo; चुनिए, जो दोबारा एनकोड करता है।
        एक्सपोर्ट से पहले पेज बता देता है कि आप किस हालात में हैं, और कितने
        फ़र्क़ के साथ।"""

[[faq]]
q = "क्या मैं इसके बजाय विज्ञापन काटकर निकाल सकता हूँ?"
a = """
        हाँ। उन पर निशान लगाइए, फिर &ldquo;इन्हें काट दीजिए&rdquo; चुनिए: जिस
        पर आपने निशान <em>नहीं</em> लगाया, इसके बजाय वही सब क्रम से जोड़ दिया
        जाता है। निशानों की वही सूची दोनों सवालों का जवाब देती है, इसलिए आप
        दोनों के बीच अदल-बदल कर सकते हैं और लंबाई बदलती देख सकते हैं, बिना कुछ
        भी दोबारा निशान लगाए।"""

[[faq]]
q = "क्या मैं अपने निशान सहेजकर बाद में लौट सकता हूँ?"
a = """
        हाँ। &ldquo;निशान सहेजिए&rdquo; एक सादी टेक्स्ट फ़ाइल लिखता है
        &mdash; हर हिस्से की एक पंक्ति, शुरू और अंत के बीच कॉमा &mdash; और
        &ldquo;निशान लाइए&rdquo; उसे वापस पढ़ लेता है। दो फ़ॉर्मैट मिलते हैं,
        सादे सेकंड और <code>HH:MM:SS.mmm</code>, और दोनों उसी ढाँचे पर टिके
        रहते हैं जिसे इस तरह काम करने वाले दूसरे टूल पहले से इस्तेमाल करते हैं
        &mdash; यानी यहाँ लिखी फ़ाइल उनमें से किसी को दी जा सकती है और वहाँ
        लिखी फ़ाइल इस पेज पर छोड़ी जा सकती है। निशान लगाना ध्यान माँगने वाला
        काम है और किसी को यह दो बार नहीं करना चाहिए।"""

[[faq]]
q = "मैं कौन-कौन से वीडियो फ़ॉर्मैट काट सकता हूँ?"
a = """
        MP4, M4V और MOV सीधे पढ़े जाते हैं, उनके भीतर जो भी हो: H.264, HEVC,
        AV1 या VP9। फ़्रेम नक़ल करने में उन्हें डिकोड करना शामिल ही नहीं है,
        इसलिए यह रास्ता उस कोडेक के लिए भी चलता है जिसका आपके ब्राउज़र के पास
        कोई डिकोडर ही नहीं। बाक़ी जो कुछ आपका ब्राउज़र चला सकता है &mdash;
        सबसे ज़ाहिर तौर पर WebM &mdash; उसे चलाकर और नतीजा रिकॉर्ड करके काटा
        जाता है, जो चलता तो है, उतना ही समय लेता है जितना लंबा नतीजा है, और
        उसमें सिर्फ़ एक ही हिस्सा रखा जा सकता है। जिस फ़ाइल को ब्राउज़र न
        पढ़ सके न चला सके &mdash; यानी व्यवहार में AVI, WMV, FLV और ज़्यादातर
        MKV &mdash; उसे बीच रास्ते नाकाम होने के बजाय एक संदेश के साथ मना कर
        दिया जाता है।"""

[[faq]]
q = "क्या वीडियो के साइज़ या लंबाई पर कोई सीमा है?"
a = """
        टूल में कोई सीमा बनाई ही नहीं गई है, और नक़ल वाले रास्ते पर तो फ़ाइल
        मुश्किल से पढ़ी ही जाती है: आप जो फ़्रेम रख रहे हैं उन्हें लोड करने के
        बजाय उनकी तरफ़ इशारा किया जाता है, इसलिए चार गीगाबाइट की रिकॉर्डिंग
        में से चार मिनट रखने में लगभग उतना ही लगता है जितना उन चार मिनट को
        डिस्क पर लिखने में। ठीक निशान पर लगने वाला कट फ़ाइल में कुछ-कुछ
        मेगाबाइट करके आगे बढ़ता है। दोनों ही हालात में व्यावहारिक छत तैयार
        फ़ाइल है, जो डाउनलोड से पहले मेमोरी में जोड़ी जाती है।"""

[[faq]]
q = "क्या आवाज़ बची रहती है?"
a = """
        MP4 वाले दोनों रास्तों पर वह सैंपल-दर-सैंपल बिना कभी डिकोड हुए उतार दी
        जाती है, इसलिए वह बाइट-दर-बाइट वही है जो फ़ाइल में थी, और एडिट का एक
        निशान हर हिस्से को उसकी तस्वीर के साथ हज़ारवें सेकंड तक क़तार में बनाए
        रखता है। एकमात्र अपवाद ऐसे अलग-अलग वीडियो जोड़ना है जिनकी आवाज़ का
        ब्योरा अलग-अलग ढंग से लिखा है &mdash; मान लीजिए अलग सैंपल दर &mdash;
        जहाँ दोनों को बिना डिकोड किए एक ही ट्रैक में रखने का कोई तरीक़ा नहीं,
        और पेज ऐसा करने से पहले यह बता देता है। रिकॉर्डिंग वाले रास्ते पर वह
        प्लेबैक से पकड़ी जाती है और दोबारा एनकोड होती है। दोनों ही हालात में
        उसे पूरी तरह छोड़ देने के लिए एक चेकबॉक्स मौजूद है।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, न वॉटरमार्क।
        साइट पर विज्ञापन हैं, और वही इसका ख़र्च उठाते हैं; विज्ञापनों को आपके
        वीडियो के बारे में कुछ नहीं दिया जाता।"""

