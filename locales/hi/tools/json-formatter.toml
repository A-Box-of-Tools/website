[[faq]]
q = "क्या मेरा टेक्स्ट कहीं अपलोड होता है?"
a = """
        नहीं। इस पेज का हर पार्सर और हर लेखक एक फ़ंक्शन है जो आपके अपने
        ब्राउज़र में, आपके अपने हार्डवेयर पर चलता है। इस टूल में किसी भी तरह
        की कोई नेटवर्क सुविधा है ही नहीं, यानी यह न कभी कुछ मँगाता है, न कभी
        कुछ भेजता है। और पेज की <code>Content-Security-Policy</code> उन सारे
        पतों के नाम गिना देती है जिनसे यह संपर्क कर सकता है, जिनमें से एक भी
        इस साइट का नहीं है। किसी ऐक्सेस टोकन, सेशन कुकी या ग्राहक के रिकॉर्ड
        के लिए इसे इस्तेमाल करने की वजह भी यही है, क्योंकि इनमें से कोई भी
        किसी और के फ़ॉर्मैटर में चिपकाने का मतलब है उसे वह दे देना।"""

[[faq]]
q = "क्या JSON सजाने से लेआउट के सिवा कुछ और भी बदलता है?"
a = """
        नहीं, और यह सुनने में जितना लगता है उससे मुश्किल है। कुंजियाँ उसी क्रम
        में रहती हैं जिसमें आपने लिखी थीं, जबकि <code>JSON.parse</code> पर
        बना फ़ॉर्मैटर पूर्णांक जैसी कुंजियों को चुपचाप आगे खिसका देता है,
        इसलिए <code>{"10":a,"2":b}</code> वापस <code>{"2":b,"10":a}</code>
        बनकर आता है। संख्याओं में वही अंक बचे रहते हैं जो आपने टाइप किए, इसलिए
        बीस अंकों की id अपने आखिरी तीन अंक किसी डबल के हाथों नहीं गँवाती और
        <code>1e999</code>, <code>null</code> नहीं बन जाता। दोहरी कुंजियाँ
        दोनों रखी जाती हैं, क्योंकि मानक यह कहता ही नहीं कि कौन-सी जीतेगी, और
        किसी एक को गिरा देना आपकी तरफ़ से फ़ैसला कर देना होता।"""

[[faq]]
q = "यह कौन-कौन सी भाषाएँ सजा सकता है?"
a = """
        JSON, XML, HTML, CSS और YAML। JSON, XML, HTML और CSS को चपटा भी
        निचोड़ा जा सकता है; YAML को नहीं, क्योंकि उसका छोटा रूप फ़्लो स्टाइल
        है, जो पढ़ा ही नहीं जाता। और न पढ़ा जाना उस वजह के ठीक उलट है जिसकी
        वजह से कोई फ़ाइल YAML में रखी जाती है। JavaScript जान-बूझकर इस सूची
        में नहीं है, और उसके बारे में नीचे वाला सवाल देखिए।"""

[[faq]]
q = "यह JavaScript, Python या SQL क्यों नहीं सजाता?"
a = """
        क्योंकि किसी प्रोग्रामिंग भाषा को सजाने का मतलब है उसे ढंग से पार्स
        करना, और जो फ़ॉर्मैटर लगभग सही निकलता है वह किसी फ़ॉर्मैटर के न होने से
        भी बुरा है, क्योंकि वह ऐसा कोड बनाता है जो देखने में ठीक लगता है और
        करता कुछ और है। JSON, XML, CSS और YAML के व्याकरण इतने छोटे हैं कि उन्हें हाथ से
        पढ़ा जा सके और ऐसे टेस्टों से जाँचा जा सके जिन्हें आप खुद चला सकते
        हैं। JavaScript का फ़ॉर्मैटर Prettier है, जो एक मेगाबाइट का पार्सर है,
        और उसकी जगह किसी वेब पेज पर नहीं, आपके एडिटर में है।"""

[[faq]]
q = "मेरी YAML में no लिखा था और JSON में वह स्ट्रिंग बनकर निकला। क्यों?"
a = """
        क्योंकि वह स्ट्रिंग ही है, और यह YAML 1.1 नहीं, 1.2 पढ़ता है। YAML 1.1
        में <code>yes</code>, <code>no</code>, <code>on</code> और
        <code>off</code> बूलियन थे, और यही वह मशहूर गड़बड़ है जो नॉर्वे के देश
        कोड को <code>false</code> बना देती है। YAML 1.2 ने उसे हटा दिया और यह
        भी हटाता है, यानी सिर्फ़ <code>true</code>, <code>false</code>,
        <code>null</code> और <code>~</code> ही टेक्स्ट के सिवा कुछ और पढ़े जाते
        हैं। दूसरी दिशा में जाते वक्त वे शब्द <em>उद्धरण चिह्नों में</em> लिखे
        जाते हैं, भले ही यह उन्हें बिना उद्धरण के भी टेक्स्ट ही पढ़ता,
        क्योंकि उस फ़ाइल को आगे जो भी खोलेगा वह शायद न पढ़े। PyYAML आज भी
        डिफ़ॉल्ट रूप से 1.1 पर है। सख्ती से पढ़ना और सँभलकर लिखना ही वह अकेला
        जोड़ा है जो दोनों तरफ़ सही रहता है।"""

[[faq]]
q = "YAML को JSON में बदलने में क्या खो जाता है?"
a = """
        टिप्पणियाँ, क्योंकि JSON के पास उन्हें रखने की कोई जगह ही नहीं। ऐंकर,
        एलियस और टैग अंदाज़ा लगाने के बजाय सिरे से मना कर दिए जाते हैं।
        इनमें से हर एक ऐसा कुछ कहता है जो JSON कह ही नहीं सकती, और जो कन्वर्टर
        चुपचाप कोई एक अर्थ चुन लेता, वह आपको ऐसा दस्तावेज़ थमाता जो वह नहीं है
        जो फ़ाइल में लिखा था। दूसरी दिशा में कुछ नहीं खोता, क्योंकि हर JSON
        दस्तावेज़ पहले से ही एक YAML दस्तावेज़ है।"""

[[faq]]
q = "JSON को XML में बदलने में क्या खो जाता है?"
a = """
        खाली ऑब्जेक्ट, खाली ऐरे और खाली स्ट्रिंग का आपसी फ़र्क, क्योंकि ये
        तीनों एक खाली एलिमेंट बन जाते हैं। हर मान का प्रकार भी खो जाता है,
        क्योंकि XML में प्रकार होते ही नहीं। इसीलिए उलटी दिशा में बदलने पर सब
        कुछ
        स्ट्रिंग ही छोड़ देता है, यह तय करने के बजाय कि <code>8080</code> कोई
        संख्या थी। ऐरे दोहराया गया एलिमेंट बन जाता है, और यही अकेला आकार है जो
        वापस पढ़ा जा सकता है, और जिस कुंजी को एलिमेंट का नाम सँभाल न सके उसके
        अटपटे अक्षर बदल दिए जाते हैं, वरना ऐसा दस्तावेज़ निकलता जिसे कोई
        पार्सर पढ़ेगा ही नहीं।"""

[[faq]]
q = "क्या HTML का इंडेंट बदलने से पेज का दिखना बदल जाता है?"
a = """
        बदल सकता है, और यह उस बारे में ईमानदार है। दो इनलाइन एलिमेंट के बीच की
        खाली जगह दो शब्दों के बीच का स्पेस है, इसलिए उसे हिलाना मुफ़्त नहीं
        है। दो चीज़ें इसे काबू में रखती हैं। <code>&lt;pre&gt;</code> और
        <code>&lt;textarea&gt;</code> ठीक जैसे थे वैसे ही उतार दिए जाते हैं,
        और जिस एलिमेंट में टेक्स्ट के सिवा कुछ न हो वह एक ही पंक्ति में रहता
        है। बाकी सब सजाया जाता है।"""

[[faq]]
q = "यह कितनी बड़ी फ़ाइल सँभाल सकता है?"
a = """
        यहाँ कोई सीमा तय की ही नहीं गई है, क्योंकि उसका बिल चुकाने वाला कोई
        सर्वर ही नहीं। व्यावहारिक छत आपकी अपनी मशीन है, और कुछ मेगाबाइट का
        JSON ठीक चलता है। बहुत लंबे दस्तावेज़ पर पेज आपकी टाइपिंग में एक ठहराव
        का इंतज़ार करता है और तब दोबारा सजाता है, बजाय इसके कि कीबोर्ड के लिए
        आपसे झगड़े।"""

[[faq]]
q = "क्या यह मुफ़्त है, और क्या मुझे खाता चाहिए?"
a = """
        यह मुफ़्त है, और यहाँ न कोई खाता है, न साइन-इन, न ट्रायल, और न इस पर
        कोई सीमा कि आप कितना चिपकाएँ। साइट पर विज्ञापन हैं, और वही इसका खर्च
        उठाते हैं; विज्ञापनों को आपके टेक्स्ट के बारे में कुछ नहीं दिया
        जाता।"""

[[faq]]
q = "क्या यह ऑफ़लाइन चलता है?"
a = """
        हाँ। पेज एक बार लोड कर लीजिए, फिर इंटरनेट काट दीजिए और यह चलता रहेगा।
        यह साबित करने का भी सबसे आसान तरीका यही है कि कुछ अपलोड नहीं हो रहा:
        जो टूल आपका टेक्स्ट सजाने के लिए कहीं भेजता, वह प्लग निकालते ही रुक
        जाता।"""

