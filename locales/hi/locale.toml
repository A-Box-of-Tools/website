#
# हिन्दी.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# No [slugs] table, for the reason set out at length in locales/ja/locale.toml:
# a Devanagari slug has to be percent-encoded to survive being pasted around,
# and a Latin transliteration is a phrase nobody searches for. Indian sites
# overwhelmingly use ASCII slugs.
#
# THE NATIVE REVIEW THIS LOCALE WAS WAITING FOR
#
# Every other language on this site is one I would ship unreviewed. This was
# the exception, held back because Hindi technical writing sits on a spectrum
# from heavily Sanskritised to English-loanword-heavy, and where a consumer
# tool belongs on it is a judgement a native speaker makes better than I do.
#
# That review has now happened, and the whole locale was rewritten under it.
# The register is the middle of the spectrum, as intended: everyday Hindi with
# the English loanwords Hindi speakers really use for computing - फ़ाइल,
# ब्राउज़र, अपलोड, सर्वर, टूल, पेज, साइज़, प्राइवेसी - and native Hindi
# everywhere a loanword would be showing off rather than communicating. The
# conventions it settled on, so a later edit can stay in step:
#
#   * टूल, not औज़ार, for the software sense. औज़ार is good Hindi but it is a
#     hand tool, and "ऑनलाइन टूल" is what people actually type.
#   * पेज, not पृष्ठ. पृष्ठ is textbook Hindi; nobody says it about a website.
#   * Nuktas on फ and ज always (फ़ाइल, ज़रूरत, साइज़, मुफ़्त) and on the
#     retroflex flaps ड and ढ (बड़ा, पढ़ना), never on क, ख or ग (so कीमत,
#     बाकी, खुद, आखिरी, फ़र्क). That is what Hindi newspapers and Hindi OS
#     strings do, and mixing the two systems is the loudest spelling tell
#     there is.
#   * Prose addressed to the reader takes the -इए imperative (कीजिए, देखिए);
#     buttons and short labels take the -एँ form (खोलें, पढ़ें).
#   * No em-dash asides. English hangs a clause off a dash where Hindi starts a
#     new sentence or hinges on क्योंकि / यानी / और, so most of them are gone.
#

lang = "hi"
name = "Hindi"
endonym = "हिन्दी"

complete = true

