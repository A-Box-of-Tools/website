#
# हिन्दी.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# No [slugs] table, for the reason set out at length in locales/ja/locale.toml:
# a Devanagari slug has to be percent-encoded to survive being pasted around,
# and a Latin transliteration is a phrase nobody searches for. Indian sites
# overwhelmingly use ASCII slugs.
#
# THE ONE LOCALE HERE WORTH A NATIVE REVIEW
#
# Nine of the ten languages on this site are ones I would ship unreviewed. This
# is the tenth. The grammar and the terminology below are sound, but Hindi
# technical writing sits on a spectrum from heavily Sanskritised to
# English-loanword-heavy, and where a consumer tool should sit on it is a
# judgement a native speaker makes better than I do.
#
# The choice made here is the middle: everyday Hindi with the English loanwords
# that Hindi speakers actually use for computing - फ़ाइल, ब्राउज़र, अपलोड,
# सर्वर - rather than coined Sanskrit equivalents nobody says out loud. Read it
# before `complete` is turned on.
#

lang = "hi"
name = "Hindi"
endonym = "हिन्दी"

complete = false

