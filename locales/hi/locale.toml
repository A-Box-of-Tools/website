#
# ---------------------------------------------------------------------------
# The frame's own words. Everything with {{ }} in it is a name the build
# resolves, and the build refuses to render a name it cannot find.
#
# Hindi is verb-final, so a sentence assembled from two fragments either side of
# a value could never come out right. Written whole, the value sits where Hindi
# puts it.
#
# Two of these carry a value whose gender changes from tool to tool, and Hindi
# verbs agree with it. `pledge_line` therefore keeps the tool as its subject and
# the noun as a plain unmarked object, so the verb never has to know whether
# {{ tool.words.plural }} came out तस्वीरें or वीडियो. [ui.picker] is the one
# place that can afford to agree with its noun: only images-to-video has a
# [picker.urls] table, and its noun is pinned feminine singular there on purpose.
# ---------------------------------------------------------------------------
#

