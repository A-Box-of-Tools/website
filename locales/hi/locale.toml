[roadmap]
nav = "रोडमैप"
title = "रोडमैप &mdash; abox.tools आगे क्या बना रहा है"
description = "abox.tools के लिए योजना में मौजूद हर टूल, समूहों में और खुले तौर पर, साथ ही जो बन चुके हैं वे भी। सभी ब्राउज़र में चलते हैं और कुछ भी अपलोड नहीं करते।"
heading = "आगे क्या आ रहा है"
lede = """
    नीचे दी दोनों सूचियों में जो कुछ है, वह आपके ब्राउज़र के भीतर अपना काम
    करता है और कुछ भी अपलोड नहीं करता &mdash; यही वह शर्त है जो किसी नाम को
    इस सूची में आने से पहले पूरी करनी होती है। गिनतियाँ कहीं लिखी नहीं हैं;
    बिल्ड उन्हें इन्हीं दो सूचियों से गिन लेता है।"""

intro_heading = "यह सूची बनी कैसे"
intro = """
    <p>
      यह इच्छाओं की सूची नहीं है। यह ऑनलाइन सबसे बड़ी GIF और वीडियो साइट की
      टूल-सूची को एक-एक करके देखकर बनाई गई &mdash; लोग फ़ाइल के साथ असल में
      क्या करवाना चाहते हैं, इसकी सूची के सबसे क़रीब जो चीज़ मौजूद है &mdash;
      और उसमें से हर वह प्रविष्टि रखी गई जिसे इस तरह बनाया जा सकता है कि काम
      आपके अपने डिवाइस पर हो और नेटवर्क हटा देने पर भी होता रहे।
    </p>
    <p>
      जो बचा, उसका अधिकांश उन्हीं इंटरफ़ेस पर चलता है जो ब्राउज़र पहले से देता
      है। कुछ थोड़े-से टूल में कोडेक उसी एक टूल के भीतर रखना पड़ता है जो उसका
      इस्तेमाल करता है, और यह चलता है &mdash; फ़ाइल फिर भी डिवाइस से बाहर नहीं
      जाती। जो इस कसौटी पर खरा नहीं उतरा, उसे वादा करने के बजाय छोड़ दिया गया;
      इसलिए नीचे दिखने वाली कुछ ज़ाहिर कमियाँ जान-बूझकर छोड़ी गई हैं।
    </p>
    <p>
      जो टूल पहले से मौजूद हैं वे अपने समूह में सबसे ऊपर हैं, <em>बन चुका</em>
      के निशान के साथ और अपने पन्ने से जुड़े हुए। उनके नीचे जो कुछ है वह अभी
      आना बाक़ी है, और जब तक बन नहीं जाता तब तक लिंक नहीं बनता।
    </p>"""

planned_heading = "हर तरह की फ़ाइल, और उसके साथ क्या किया जा सकता है"

og_title = "abox.tools का रोडमैप"
