#
# रोडमैप की योजना-सूची - Hindi.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Hindi list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#
# Format names stay Latin - GIF, MP4, WebM, APNG, WebP, CSV, JSON, SRT, MP3,
# WAV, Opus, HEIC, JPG, AVIF, JPEG XL, PDF. Nobody writes them any other way,
# and a transliterated codec name is a phrase no reader would recognise.
#

note = "अभी बना नहीं है। यहाँ इसलिए लिखा है ताकि आप देख सकें कि बात किस दिशा में जा रही है।"

[[group]]
id = "images"
name = "तस्वीरें"
items = [
  ["टेक्स्ट जोड़िए", "तस्वीर के ऊपर, या उसके ऊपर बने कैप्शन बॉक्स में"],
  ["AVIF", "वह फ़ॉर्मैट जिसे लिखता सिर्फ़ एक ब्राउज़र है, बाकी सब सिर्फ़ पढ़ते हैं"],
  ["DICOM से पहचान हटाइए", "स्कैन से मरीज़ को हटाइए, स्कैन को छुए बिना"],
]

[[group]]
id = "gif"
name = "GIF और एनिमेशन"
items = [
  ["GIF से MP4 या WebM", "वही एनिमेशन, आम तौर पर दसवें हिस्से के साइज़ में"],
  ["GIF में बदलाव", "आकार, क्रॉप, घुमाव, उल्टी दिशा, या चलने की रफ़्तार"],
  ["चलती हुई WebP", "वही एनिमेशन, साइज़ के एक अंश में &mdash; और यहाँ अकेली चीज़ जिसे साथ रखा हुआ एन्कोडर चाहिए"],
]

[[group]]
id = "video"
name = "वीडियो"
items = [
  ["आकार बदलिए", "उतना छोटा कि वह सचमुच भेजा जा सके"],
  ["घुमाइए", "उस क्लिप के लिए जो टेढ़ी शूट हो गई &mdash; और इसके लिए एक भी फ़्रेम डिकोड नहीं होता"],
  ["वीडियो की आवाज़ हटाइए", "आवाज़ हटाइए, तस्वीर जस की तस"],
  ["MP4 में बदलिए", "कैमरे से जो भी निकला हो, उसे उस फ़ाइल में जो सचमुच अपलोड हो जाएगी"],
  ["सबटाइटल तस्वीर में ही जोड़ दीजिए", "एक SRT फ़ाइल जो सीधे तस्वीर में खींच दी जाए"],
  ["सबटाइटल बदलिए", "SRT, VTT, ASS, SBV और LRC, किसी भी दिशा में, और समय आगे-पीछे भी"],
]

[[group]]
id = "audio"
name = "ऑडियो"
items = [
  ["फ़ॉर्मैट बदलिए", "MP3, WAV और Opus, किसी भी दिशा में"],
]

[[group]]
id = "documents"
name = "दस्तावेज़ और PDF"
items = [
  ["पन्ने घुमाइए और क्रॉप कीजिए", "टेढ़े स्कैन को सीधा कीजिए, या उसके हाशिये काटिए"],
  ["तस्वीरें निकालिए", "दस्तावेज़ के भीतर से तस्वीरें वापस बाहर लाइए"],
  ["PDF से हिस्से हटाइए", "शब्द सचमुच निकालिए, उन पर काली पट्टी लगाकर छोड़िए मत"],
]

[[group]]
id = "beyond"
name = "मीडिया से आगे"
items = [
  ["CSV और JSON", "दोनों दिशाओं में बदलिए, और स्प्रेडशीट से निकली फ़ाइल को साफ़ कीजिए"],
  ["सर्टिफ़िकेट और कुंजियाँ", "सर्टिफ़िकेट या साइनिंग रिक्वेस्ट पढ़िए, उसे किसी और के सर्वर में चिपकाए बिना"],
]
