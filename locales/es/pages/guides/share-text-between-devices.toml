heading = "Cómo compartir texto y archivos sin guardar una copia en el servidor"
lede = "Mueve una nota o un archivo sin dejar una copia en el correo, el historial de un chat o un servidor de intercambio. Los navegadores se conectan directamente por defecto. Si no pueden comunicarse, el anfitrión puede crear una nueva sesión con retransmisión en la nube: Cloudflare reenvía el contenido cifrado. Los destinatarios pueden conservar sus propias copias."

