nav = "Compartir una pestaña del navegador"
title = "Cómo compartir una pestaña del navegador en directo sin extensiones"
description = "Muestra una pestaña del navegador a un espectador aprobado. Elige Direct en una red local accesible o el retransmisor cifrado opcional Cloud relay. Sin extensiones ni control remoto."
heading = "Cómo compartir una pestaña del navegador en directo sin extensiones"
lede = "Muestra a otra persona el sitio web que usas mientras mantienes el control. El navegador captura una pestaña elegida y envía su imagen cambiante al espectador. Direct usa una red local accesible; Cloud relay es una opción explícita que retransmite vídeo cifrado a través de Cloudflare. Invita mediante un enlace o la detección cercana y aprueba al espectador antes de enviar vídeo."
updated = "15 de octubre de 2026"
og_title = "Una pestaña en directo, bajo tu control"
og_description = "Vídeo de una pestaña en directo con aprobación y sin control remoto. Usa Direct en una red local accesible o elige Cloud relay cifrado."
