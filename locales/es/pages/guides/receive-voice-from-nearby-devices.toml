nav = "Recibir voz de personas cercanas"
title = "Cómo recibir voz en directo desde dispositivos cercanos"
description = "Abre un receptor de voz en el navegador con acceso por contraseña y controles individuales por hablante. Elige Direct o el retransmisor cifrado opcional Cloud relay antes de iniciar."
heading = "Cómo recibir voz en directo de personas cercanas"
lede = "Una persona anfitriona escucha mientras varias hablan desde sus navegadores. El anfitrión da nombre al receptor y elige Direct o Cloud relay antes de empezar; quienes llaman no necesitan un nombre visible. La detección cercana ayuda a encontrarlo, una contraseña opcional controla el acceso y el anfitrión elige qué voces escuchar. Cloud relay retransmite la voz cifrada a través de Cloudflare después de que quienes llaman confirmen esa opción."
updated = "14 de octubre de 2026"
og_title = "Muchas voces, una persona anfitriona que escucha"
og_description = "Un receptor de voz con detección cercana, acceso por contraseña y controles por hablante. Direct de forma predeterminada y Cloud relay cifrado como opción."
