#
# La lista de lo previsto en la hoja de ruta - Spanish.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Spanish list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#

note = "Todavía sin construir. Está en la lista para que veas por dónde va esto."

[[group]]
id = "images"
name = "Imágenes"
items = [
  ["Añadir texto", "sobre la propia imagen, o en un pie encima de ella"],
  ["AVIF", "el formato que solo un navegador escribe y los demás únicamente leen"],
  ["Anonimizar DICOM", "sacar al paciente de una exploración sin tocar la imagen"],
]

[[group]]
id = "gif"
name = "GIF y animación"
items = [
  ["GIF a MP4 o WebM", "la misma animación, normalmente a una décima parte del tamaño"],
  ["Editar un GIF", "redimensionar, recortar, girar, invertir o cambiarle la velocidad"],
  ["WebP animado", "la misma animación por una fracción del tamaño: el único de aquí que necesita un codificador incluido"],
]

[[group]]
id = "video"
name = "Vídeo"
items = [
  ["Redimensionar", "hasta un tamaño que de verdad se pueda enviar"],
  ["Girar", "para ese clip que se grabó de lado, y sin descodificar un solo fotograma"],
  ["Silenciar un vídeo", "quitarle el sonido y no tocar la imagen"],
  ["Convertir a MP4", "lo que sea que salió de la cámara, como el archivo que sí se puede subir"],
  ["Incrustar subtítulos", "un archivo SRT dibujado dentro de la imagen"],
  ["Convertir subtítulos", "SRT, VTT, ASS, SBV y LRC en cualquier dirección, y tiempos que se pueden desplazar"],
]

[[group]]
id = "audio"
name = "Audio"
items = [
  ["Cambiar de formato", "MP3, WAV y Opus, en cualquier dirección"],
]

[[group]]
id = "documents"
name = "Documentos y PDF"
items = [
  ["Girar y recortar páginas", "enderezar un escaneo que entró de lado, o recortarle los márgenes"],
  ["Extraer imágenes", "recuperar las fotos que hay dentro de un documento"],
  ["Tachar un PDF", "quitar las palabras, en vez de pintar un recuadro negro encima"],
  ["Escáner de documentos", "la foto de una hoja, enderezada y limpia, convertida en documento"],
]

[[group]]
id = "beyond"
name = "Más allá de los medios"
items = [
  ["CSV y JSON", "convertir en ambas direcciones, y ordenar lo que exportó la hoja de cálculo"],
  ["Certificados y claves", "leer un certificado o una solicitud de firma sin pegarla en el servidor de nadie"],
]
