[hub]
title = "abox.tools &mdash; Compresión de imágenes y herramientas de navegador gratis"
# Por debajo de 155 caracteres, como en inglés: Google corta la descripción más
# o menos ahí, y aquí el final es la parte que vende el sitio.
description = "Compresión de imágenes y herramientas gratis para PDF, vídeo, audio y texto de abox.tools (A Box of Tools). Procesamiento local sin subir archivos."
heading = "Herramientas gratis. Procesamiento local."
og_title = "abox.tools &mdash; compresión de imágenes y herramientas de navegador gratis"
og_description = "Herramientas gratis para comprimir imágenes y trabajar con PDF, vídeo, audio y texto en tu dispositivo. Las funciones para compartir y conectarse se explican donde se usan."
og_image_alt = "abox.tools - herramientas de navegador para procesar archivos localmente"
schema_description = "Herramientas de navegador gratis para comprimir imágenes, editar PDF y trabajar con vídeo, audio y texto localmente. Sin subir archivos para procesarlos ni crear una cuenta. Las funciones para compartir y las funciones online opcionales se explican en sus páginas."
schema_about = "Herramientas de navegador para comprimir imágenes, editar PDF, trabajar con vídeo, audio y texto y compartir entre navegadores de forma deliberada"

lede = "abox.tools (A Box of Tools) ofrece compresión de imágenes, edición de PDF y herramientas de texto en tu navegador. Sin subir archivos para procesarlos ni iniciar sesión."

support_note = """
      Estas herramientas son gratis y lo van a seguir siendo. Si alguna te ha
      sacado de un apuro, esto es lo único que este sitio te pide."""

# Tres hechos comprobables en lugar de una promesa, igual que en inglés.
privacy_heading = "Tus archivos siguen siendo tuyos."

privacy_lede = "El procesamiento local funciona sin conexión una vez guardada la herramienta. Obtener y compartir contenido requiere conexión."

support_heading = "Gratis, con tu apoyo."

[[hub.guarantees]]
title = "Tus archivos se procesan en tu dispositivo"
body = "Tu navegador abre, lee y edita los archivos que eliges. No se suben para procesarlos. Compartir texto y archivos y Cámara remota envían contenido deliberadamente a otro navegador; sus páginas explican la conexión."

[[hub.guarantees]]
title = "Tus archivos no se entregan a la analítica"
body = "Contamos visitas, etapas fijas de uso, el primer resultado satisfactorio por carga de página, algunos enlaces de continuación y respuestas opcionales fijas. No se adjuntan archivos, nombres, contenidos ni detalles de entrada o salida. Las importaciones opcionales de imágenes y las consultas de cambio para recibos explican sus datos junto a sus controles."

[[hub.guarantees]]
title = "El procesamiento local funciona sin conexión"
body = "Espera a que el indicador diga que está listo para funcionar sin conexión; después desconecta y usa archivos de tu dispositivo. Obtener una imagen web, consultar un cambio en línea y conectar dos navegadores requieren red."

[[hub.categories]]
id = "images"
name = "Imágenes"
short_name = "Imágenes"
note = "Redúcela, cámbiale el tamaño o quítale lo que cuenta de ti sin que lo sepas. Nada de eso se manda a ninguna parte."

[[hub.categories]]
id = "video-and-animation"
name = "Vídeo y animación"
short_name = "Vídeo &amp; GIF"
note = "Córtalo, conviértelo o móntalo a partir de fotos, sin que la grabación salga de tu dispositivo."

[[hub.categories]]
id = "documents-and-audio"
name = "Documentos y audio"
short_name = "PDF &amp; audio"
note = "Reordena un documento o recorta una grabación, sin mandar ninguno de los dos a procesar fuera."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Texto, códigos y contraseñas"
short_name = "Texto &amp; códigos"
note = "Léelo, compruébalo o créalo aquí. Ningún token, ningún archivo de configuración y ninguna contraseña acaban en el servidor de otro."

[[hub.categories]]
id = "connect-devices"
name = "Conectar dispositivos"
short_name = "Conectar dispositivos"
note = "Comparte texto y archivos, habla en directo o ve una cámara o una pestaña del navegador desde otro dispositivo. Cada herramienta explica qué envía y cómo se conectan los navegadores."

