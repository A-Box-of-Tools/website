description = "Todas las herramientas previstas para abox.tools, agrupadas y a la vista, junto con las que ya están hechas. Todas funcionan en el navegador y no suben nada."
heading = "Qué viene ahora"
lede = """
    Todo lo que aparece en las dos listas de abajo hace su trabajo dentro del
    navegador y no sube nada. Esa es la regla que un nombre tiene que pasar
    antes siquiera de entrar aquí. Las cifras no están escritas en ninguna
    parte: la compilación las cuenta sobre las propias listas."""

intro_heading = "Cómo se hizo esta lista"
intro = """
    <p>
      No es una lista de deseos. Salió de repasar el catálogo del mayor sitio
      de GIF y vídeo que hay en línea, que es lo más parecido que existe a un
      inventario de lo que la gente quiere hacerle de verdad a un archivo, y de
      quedarnos con cada entrada que se puede construir de forma que el trabajo
      ocurra en tu propio dispositivo y siga ocurriendo con la red
      desenchufada.
    </p>
    <p>
      Casi todo lo que sobrevivió se apoya en interfaces que el navegador ya
      trae de serie. Unas pocas necesitan un códec incrustado en la única
      herramienta que lo usa, y eso vale, porque el archivo sigue sin salir del
      dispositivo. Lo que no llegaba a ese listón se quedó fuera en vez de
      prometerse, así que algunos huecos que abajo parecen evidentes son huecos
      a propósito.
    </p>
    <p>
      Las herramientas que ya existen van arriba de su grupo, marcadas como
      <em>Lista</em> y enlazadas a su página. Todo lo que hay debajo está por
      llegar, y nada es un enlace hasta que lo está.
    </p>"""

planned_heading = "Cada tipo de archivo, y qué se puede hacer con él"

og_title = "Hoja de ruta de abox.tools"
og_description = "Qué está hecho y qué viene después. Todo funciona en el navegador y no sube nada."
og_image_alt = "abox.tools - herramientas que no pasan por ningún servidor"

