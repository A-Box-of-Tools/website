warning = "<strong>Obtener esta dirección usa la red.</strong> El servidor ve tu IP y la dirección de la {{ tool.picker.urls.noun }} solicitada, incluidos los parámetros de consulta. Al llegar, la imagen se guarda en la memoria local. Los archivos elegidos en tu dispositivo no se envían como parte de esta importación."
