#
# Español.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# Neutral, pan-regional Spanish rather than peninsular or Latin American: the
# second person plural is avoided entirely, "ordenador" and "computadora" are
# both sidestepped in favour of "dispositivo", and no vocabulary is used that
# reads as foreign on either side of the Atlantic. If the site ever wants
# es-ES and es-419 separately, this is the file they fork from.
#
# Written as Spanish rather than carried across from the English. Where the
# English hinges a long sentence on a dash or a colon, this splits it; where
# the English says "your browser" out of habit, this says "el navegador",
# because Spanish marks a possessive only when it is in doubt.
#

lang = "es"
name = "Spanish"
endonym = "Español"

# Every tool, every guide, both legal pages and the roadmap list are
# translated, so the fallback is now an error rather than a silence, and
# Spanish is advertised in the sitemap, the hreflang tags and the switcher.
complete = true

#
# ---------------------------------------------------------------------------
# The addresses.
#
# Keyed by the ENGLISH slug, which is the name of the thing. The Spanish is an
# address and appears only on the right.
#
# The bare infinitive plus the noun - "comprimir-imagen" - because that is the
# phrasing Spanish search actually uses, without the article an English speaker
# might expect to see translated across.
#
# No accents and no eñe here, and only here: both survive a modern URL bar and
# neither survives being pasted around. The prose below keeps them.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "comprimir-imagen"
"compress-pdf" = "comprimir-pdf"
"crop-video" = "recortar-video"
"edit-audio" = "editar-audio"
# Casi nadie busca un "editor EXIF"; se busca cómo quitarle los datos a una foto.
"exif-editor" = "eliminar-datos-exif"
# "Censurar" es el verbo que se busca en espanol para tapar datos de una
# imagen, aunque el ingles "redact" sea mas estrecho.
"redact-image" = "censurar-imagen"
"images-to-pdf" = "imagenes-a-pdf"
"images-to-video" = "imagenes-a-video"
"resize-image" = "redimensionar-imagen"
"trim-video" = "cortar-video"
# Nombradas por la tarea, no por el formato: casi nadie busca "imagen a ICO",
# y muchísima gente busca cómo hacerse un favicon.
"image-to-ico" = "crear-favicon"
"svg-to-image" = "convertir-svg-a-png"
"heic-to-jpg" = "convertir-heic-a-jpg"
# "Base64" es la palabra que se teclea; "data URI" es la que sale después.
"image-to-data-uri" = "imagen-a-base64"
"qr-barcode" = "generar-codigo-qr"
# "Escanear" es lo que se teclea; "leer" es lo que hace el programa.
"qr-barcode-reader" = "escanear-codigo-qr"
"video-to-gif" = "convertir-video-a-gif"
"gif-analyzer" = "analizar-gif"
"gif-maker" = "crear-gif"
"grab-frame" = "capturar-fotograma-de-video"
"id-photo" = "foto-carnet"
"merge-pdf" = "unir-pdf"
"reverse-video" = "invertir-video"
"split-gif" = "separar-gif-en-fotogramas"
"format-json" = "formatear-json"
"encode-text" = "codificar-base64"
"compare-text" = "comparar-textos"
"trim-audio" = "cortar-audio"
# Con "de": "generador de contraseñas" es lo que se teclea, y el
# "generador-contrasenas" sin la preposición no es español que nadie escriba.
"password-generator" = "generador-de-contrasenas"
# El prestamo, no "camara rapida": timelapse es lo que se escribe al buscar.
"timelapse-video" = "crear-timelapse"
"hash-checksum" = "calcular-checksum"
"share-text" = "compartir-texto"

"guides" = "guias"
"roadmap" = "hoja-de-ruta"
"privacy" = "privacidad"
"terms" = "terminos"

"guides/compress-an-image-to-a-target-size" = "guias/comprimir-una-imagen-a-un-tamano-exacto"
