#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Hoja de ruta"
title = "Hoja de ruta &mdash; qué está construyendo abox.tools"
description = "Todas las herramientas previstas para abox.tools, agrupadas y a la vista, junto con las ya terminadas. Todas funcionan en el navegador y no suben nada."
heading = "Qué viene a continuación"
lede = """
    Todo lo que aparece en las dos listas de abajo hace su trabajo dentro de tu
    navegador y no sube nada &mdash; esa es la regla que un nombre tiene que
    superar antes siquiera de entrar aquí. Las cifras no están escritas en
    ninguna parte; la compilación las cuenta sobre las propias listas."""

intro_heading = "Cómo se elaboró esta lista"
intro = """
    <p>
      No es una lista de deseos. Se elaboró repasando el catálogo de
      herramientas del mayor sitio de GIF y vídeo en línea &mdash; lo más
      parecido que existe a un inventario de lo que la gente quiere hacerle
      realmente a un archivo &mdash; y conservando cada entrada que puede
      construirse de modo que el trabajo ocurra en tu propio dispositivo y siga
      ocurriendo con la red desenchufada.
    </p>
    <p>
      Casi todo lo que sobrevivió se apoya en interfaces que el navegador ya
      trae. Unas pocas necesitan un códec incorporado en la única herramienta
      que lo usa, y eso está permitido: el archivo sigue sin salir del
      dispositivo. Lo que no superaba ese listón se dejó fuera en lugar de
      prometerse, así que algunos de los huecos que abajo parecen evidentes son
      huecos a propósito.
    </p>
    <p>
      Las herramientas que ya existen están arriba de su grupo, marcadas como
      <em>Lista</em> y enlazadas a su propia página. Todo lo que hay debajo
      está por llegar, y nada es un enlace hasta que lo está.
    </p>"""

planned_heading = "Cada tipo de archivo, y qué se puede hacer con él"

og_title = "Hoja de ruta de abox.tools"
og_description = "Qué está hecho y qué viene después. Todo funciona en el navegador y no sube nada."
og_image_alt = "abox.tools - herramientas que no tocan ningún servidor"

