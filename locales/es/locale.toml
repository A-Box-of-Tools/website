#

[hub]
title = "Herramientas gratis en el navegador &mdash; sin subir nada y sin cuenta | abox.tools"
# Por debajo de 155 caracteres, como en inglés: Google corta la descripción más
# o menos ahí, y aquí el final es la parte que vende el sitio.
description = "Herramientas gratis que no suben tus archivos. Une imágenes en un PDF o un MP4, comprime una imagen al tamaño exacto, recorta un vídeo o borra el EXIF."
heading = "Herramientas que no pasan por ningún servidor"
og_title = "A Box of Tools &mdash; herramientas que no pasan por ningún servidor"
og_description = "Herramientas pequeñas, de una sola tarea, que funcionan enteras dentro del navegador. Tus archivos no salen de tu dispositivo."
og_image_alt = "abox.tools - herramientas que no pasan por ningún servidor"
schema_description = "Utilidades pequeñas, de una sola tarea, que hacen todo su trabajo dentro del navegador. No se sube nada y no hace falta ninguna cuenta."
schema_about = "Utilidades de archivos que funcionan en el navegador y procesan los archivos en local, sin subirlos"

lede = """
    Herramientas pequeñas, de una sola tarea, que hacen todo su trabajo dentro
    del navegador. Tus archivos se quedan en tu dispositivo. No hay nada que
    subir, no hace falta ninguna cuenta y nadie te sigue el rastro."""

support_note = """
      Estas herramientas son gratis y lo van a seguir siendo. Si alguna te ha
      sacado de un apuro, esto es lo único que este sitio te pide."""

# Tres hechos comprobables en lugar de una promesa, igual que en inglés.
[[hub.guarantees]]
title = "Tus archivos nunca salen de tu dispositivo"
body = """
        Los abre, los lee y los procesa tu propio navegador, con tu propio
        hardware. La <code>Content-Security-Policy</code> de cada herramienta
        enumera todas las direcciones a las que puede conectarse, y ninguna es
        nuestra."""

[[hub.guarantees]]
title = "De tus archivos no se manda nada"
body = """
        Ni el archivo, ni una miniatura, ni el nombre, ni el tamaño, ni cuántos
        elegiste. Ninguna herramienta de aquí cuenta nada de eso, porque al
        otro lado no hay ningún servidor que pudiera escucharlo."""

[[hub.guarantees]]
title = "Funciona sin conexión"
body = """
        Abre una herramienta, desconéctate de internet y verás que sigue
        trabajando con tus archivos igual que antes. Eso no hay manera de
        fingirlo. Una herramienta que mandara tus archivos a procesar a otra
        parte se pararía en seco."""

[[hub.categories]]
id = "images"
name = "Imágenes"
note = "Redúcela, cámbiale el tamaño o quítale lo que cuenta de ti sin que lo sepas. Nada de eso se manda a ninguna parte."

[[hub.categories]]
id = "video-and-animation"
name = "Vídeo y animación"
note = "Córtalo, conviértelo o móntalo a partir de fotos, sin que la grabación salga de tu dispositivo."

[[hub.categories]]
id = "documents-and-audio"
name = "Documentos y audio"
note = "Reordena un documento o recorta una grabación, sin mandar ninguno de los dos a procesar fuera."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Texto, códigos y contraseñas"
note = "Léelo, compruébalo o créalo aquí. Ningún token, ningún archivo de configuración y ninguna contraseña acaban en el servidor de otro."

