#
# Español.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# Neutral, pan-regional Spanish rather than peninsular or Latin American: the
# second person plural is avoided entirely, "ordenador" and "computadora" are
# both sidestepped in favour of "dispositivo", and no vocabulary is used that
# reads as foreign on either side of the Atlantic. If the site ever wants
# es-ES and es-419 separately, this is the file they fork from.
#

lang = "es"
name = "Spanish"
endonym = "Español"

complete = false

#
# ---------------------------------------------------------------------------
# The addresses.
#
# Keyed by the ENGLISH slug, which is the name of the thing. The Spanish is an
# address and appears only on the right.
#
# The bare infinitive plus the noun - "comprimir-imagen" - because that is the
# phrasing Spanish search actually uses, without the article an English speaker
# might expect to see translated across.
#
# No accents and no eñe here, and only here: both survive a modern URL bar and
# neither survives being pasted around. The prose below keeps them.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "comprimir-imagen"
"compress-pdf" = "comprimir-pdf"
"crop-video" = "recortar-video"
"edit-audio" = "editar-audio"
# Casi nadie busca un "editor EXIF"; se busca cómo quitarle los datos a una foto.
"exif-editor" = "eliminar-datos-exif"
"images-to-pdf" = "imagenes-a-pdf"
"images-to-video" = "imagenes-a-video"
"resize-image" = "redimensionar-imagen"
"trim-video" = "cortar-video"

"guides" = "guias"
"roadmap" = "hoja-de-ruta"
"privacy" = "privacidad"
"terms" = "terminos"

"guides/compress-an-image-to-a-target-size" = "guias/comprimir-una-imagen-a-un-tamano-exacto"
"guides/resize-an-image" = "guias/redimensionar-una-imagen"
"guides/remove-exif-and-gps-data" = "guias/eliminar-datos-exif-y-gps"
"guides/make-a-pdf-smaller" = "guias/reducir-el-tamano-de-un-pdf"
"guides/combine-images-into-a-pdf" = "guias/unir-imagenes-en-un-pdf"
"guides/turn-images-into-a-video" = "guias/convertir-imagenes-en-un-video"
"guides/trim-a-video" = "guias/cortar-un-video"
"guides/crop-a-video" = "guias/recortar-un-video"
"guides/is-it-safe-to-upload-files" = "guias/es-seguro-subir-archivos"

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Herramientas gratuitas en el navegador &mdash; sin subir nada | abox.tools"
# Por debajo de 155 caracteres, como en inglés: Google corta la descripción más
# o menos ahí, y aquí el final es la parte que vende el sitio.
description = "Herramientas gratuitas que nunca suben tus archivos. Une imágenes en un PDF o un MP4, comprime una imagen a un tamaño exacto, recorta un vídeo o quita los datos EXIF."
heading = "Herramientas que no tocan ningún servidor"
og_title = "A Box of Tools &mdash; herramientas que no tocan ningún servidor"
og_description = "Herramientas pequeñas, cada una para una sola tarea, que funcionan por completo en tu navegador. Tus archivos no salen de tu dispositivo."
og_image_alt = "abox.tools - herramientas que no tocan ningún servidor"
schema_description = "Herramientas pequeñas, cada una para una sola tarea, que hacen todo su trabajo dentro del navegador. No se sube nada y no hace falta una cuenta."
schema_about = "Utilidades de archivos basadas en el navegador que procesan los archivos localmente, sin subirlos"

lede = """
    Herramientas pequeñas, cada una para una sola tarea, que hacen todo su
    trabajo dentro de tu navegador. Tus archivos se quedan en tu dispositivo:
    no hay nada que subir, ninguna cuenta que crear y nada que te siga."""

support_note = """
      Estas herramientas son gratuitas y lo seguirán siendo. Si alguna te ha
      ahorrado un trabajo, esto es lo único en el sitio que te pide algo."""

# Tres hechos comprobables en lugar de una promesa, igual que en inglés.
[[hub.guarantees]]
title = "Tus archivos nunca salen de tu dispositivo"
body = """
        Los abre, los lee y los procesa tu propio navegador, con tu propio
        hardware. La <code>Content-Security-Policy</code> de cada herramienta
        nombra todas las direcciones que puede contactar, y ninguna es
        nuestra."""

[[hub.guarantees]]
title = "No se transmite nada sobre tus archivos"
body = """
        Ni el archivo, ni una miniatura, ni el nombre, el tamaño o cuántos
        elegiste. Ninguna herramienta de aquí comunica nada de eso. Al otro
        lado no hay ningún servidor que pudiera leerlo."""

[[hub.guarantees]]
title = "Funciona sin conexión"
body = """
        Abre una herramienta una vez, desconéctate de internet y seguirá
        trabajando con tus archivos exactamente igual. Eso es difícil de
        fingir: una herramienta que enviara tus archivos a otro sitio para
        procesarlos sencillamente se detendría."""

[[hub.categories]]
name = "Imágenes y vídeo"
note = "Trabaja tus fotos y tus grabaciones sin entregárselas a nadie."

[[hub.categories]]
name = "GIF y animación"
note = "Crea una animación, o desmóntala, sin que salga de tu equipo."

[[hub.categories]]
name = "Audio"
note = "Trabaja una grabación sin entregársela a nadie, incluido el sonido de un vídeo."

[[hub.categories]]
name = "Documentos y PDF"
note = "Crea y reordena documentos sin mandarlos a procesar a ninguna parte."

[[hub.categories]]
name = "Códigos y datos"
note = "Convertir lo que ha escrito en algo que una máquina puede leer, sin que salga de la página."

[[hub.categories]]
name = "Texto y código"
note = "Léelo, compáralo, codifícalo, sin pegar un token ni un archivo de configuración en el servidor de otro."

