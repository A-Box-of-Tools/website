#
# Sincronizar carpetas - Spanish.
#
# Overrides for tools/folder-sync/tool.toml. Only words: the slug lives in
# [slugs] in locale.toml, and the category, the icon, the shared parts and the
# CSP stay where they are.
#
# The name is plural because "sincronizar carpetas" is what Spanish search
# types, and because what the page keeps in step is two folders, one on each
# device. Every control is named exactly as body.html labels it, since the
# steps and the answers send the reader looking for it. The description's
# "computers" is "equipos", which keeps "ordenador" and "computadora" out of
# the page as the house style asks.
#

name = "Sincronizar carpetas"
heading = "Sincronizar carpetas <span class=\"h1-kw\">&mdash; mantén una carpeta igual en dos dispositivos</span>"
tagline = "Elige una carpeta en cada dispositivo, revisa cada diferencia y copia lo que falta o es más reciente directamente entre los dos navegadores de tu red. No se sube nada y nunca se borra nada."

title = "Sincronizar una carpeta entre dos dispositivos &mdash; de navegador a navegador, sin subir nada"
description = "Mantén una carpeta igual en dos equipos. Compara las dos carpetas, revisa cada cambio y copia los archivos directamente entre los navegadores de tu red. Sin subidas, sin cuenta y sin borrar nada."
og_title = "Mantén una carpeta igual en dos dispositivos"
og_description = "Compara dos carpetas y copia lo que falta o es más reciente, directamente entre los navegadores de tu red. Sin subidas, sin cuenta y sin borrar nada."
og_image_alt = "Sincronizar carpetas: mantén una carpeta igual en dos dispositivos"

pledge = """
    Tú eliges una carpeta en cada dispositivo y apruebas el dispositivo que se
    une. Después, los dos navegadores comparan los nombres, los tamaños y las
    fechas de los archivos mediante una conexión cifrada establecida
    directamente entre ellos, y copian los archivos que aceptes, sin ningún
    servidor de por medio. No hay retransmisor, así que los dos dispositivos
    tienen que compartir una red en la que puedan comunicarse entre sí. El
    emparejamiento usa un servicio de presentación en internet que ve los
    metadatos de preparación, nunca un archivo, un nombre de archivo ni la
    comparación. Un archivo recibido solo reemplaza al antiguo cuando ha
    llegado entero, y nunca se borra nada. Detén la sincronización, o cierra
    cualquiera de las dos páginas, para terminar la sesión."""
pledge_line = "Los archivos viajan <strong>directamente entre tus dos dispositivos</strong>, cifrados. No se sube nada; un servicio de presentación conecta los navegadores."
md_note = "Comparación de carpetas y copia de archivos directamente entre dos navegadores aprobados, con cifrado y sin retransmisor. Las presentaciones por internet llevan metadatos de preparación, nunca archivos, nombres de archivo ni listados. Nunca se borra nada."
live_hint = """
      Las herramientas de desarrollo muestran un WebSocket al servicio de
      presentación, por el que pasan los mensajes que presentan a los
      navegadores. Marcar Mostrar en Conexiones disponibles o pulsar Buscar
      conexiones abre otro WebSocket, aparte, para la búsqueda. Las listas de
      archivos y los archivos viajan por WebRTC cifrado directamente entre los
      dispositivos. Ni la pestaña Red ni la CSP inspeccionan por sí solas ese
      tráfico entre pares. El marco del sitio carga sus recursos de terceros
      habituales."""
read_first = """
, <code>src/plan.js</code> para ver cómo dos listados se convierten en la
      lista de diferencias y por qué no se borra nada,
      <code>src/transfer.js</code> para la transferencia con acuses de recibo
      que no carga en memoria un archivo grande entero,
      <code>src/folder.js</code> para las escrituras que solo reemplazan un
      archivo cuando está completo, y <code>src/session.js</code> para la
      aprobación que precede a cualquier comparación de las carpetas. El
      servicio de presentación está publicado junto a la herramienta, en
      <code>workers/rendezvous/</code>."""
howto_heading = "Cómo sincronizar una carpeta entre dos dispositivos"
card = "Compara una carpeta en dos dispositivos y copia lo que falta o es más reciente, directamente entre los navegadores de tu red. Sin subir nada y sin borrar nada."

