[[privacy]]
title = "Tus imágenes no tienen adónde ir."
body = """
 La
      Content-Security-Policy enumera todas las direcciones a las que esta
      página puede conectarse, y ninguna es de este sitio. Aquí no hay ningún
      destino donde recoger tus archivos, ni una línea de código que los mandara
      si lo hubiera."""

[[privacy]]
title = "Aquí nada le pide nada a la red."
body = """
 En todo
      <code>src/</code> no hay un solo <code>fetch</code>, ni un
      <code>XMLHttpRequest</code>, ni un <code>sendBeacon</code>. El
      redimensionado son un <code>drawImage</code> sobre un lienzo y un
      <code>canvas.toBlob</code>, o sea, el escalador y el codificador que ya
      vienen instalados en el navegador."""

[[privacy]]
title = "Un archivo que nadie ha pedido cambiar no se cambia."
body = """
 Sin recorte, sin
      redimensionado y sin cambio de formato, el archivo que elegiste se te
      devuelve byte por byte en lugar de volver a guardarse. Y no es cortesía: es
      la razón de que esta herramienta no pueda recodificarte una foto sin decir
      nada, ni tirarle los metadatos a una que solo querías mirar."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google, y el botón de donación, de Buy
      Me a Coffee. A ninguno se le entrega nada sobre tus fotos. Cada línea que
      lee, recorta, escala o escribe un archivo se sirve desde este origen y está
      en el repositorio."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y la herramienta
      sigue igual, porque nunca hubo dentro de ella ningún paso que pasara por la
      red. Es la prueba más sencilla de todas."""

[[howto]]
title = "Elige tus imágenes."
body = """
 Arrástralas hasta el selector o
      búscalas a mano. El navegador las lee directamente del disco, y mientras lo
      haces no sale nada hacia ninguna parte."""

[[howto]]
title = "Recorta, si te apetece."
body = """
 La caja empieza sobre la foto entera,
      así que si la dejas en paz no recorta nada. Arrástrala, o fíjala a una
      forma, sea 1:1 para una foto de perfil, 9:16 para una historia o 16:9 para
      una miniatura, y pulsa «Lo más grande» para la mayor que quepa. Cada imagen
      conserva su propia caja: haz clic en cualquier fila de la lista para dibujar
      sobre esa. Y si todas tienen que quedar encuadradas igual, hay también un
      botón para eso."""

[[howto]]
title = "Di de qué tamaño tiene que salir."
body = """
 Un ancho, un alto o los
      dos. También un lado largo, que deja las fotos verticales y las
      horizontales del mismo tamaño entre sí, o un porcentaje pelado. Si dejas
      una de las dos casillas en blanco, la foto conserva su propia forma."""

[[howto]]
title = "Elige el formato y pulsa el botón."
body = """
 Puedes conservar el formato
      con el que llegó cada archivo, o escribirlo todo como JPEG, PNG o WebP.
      Cada resultado dice en qué se ha convertido y cuánto ha encogido. Haz clic
      en uno para abrirlo a tamaño completo, con todas sus cifras detrás y el
      original al lado para comparar. Un lote baja como un solo zip."""

[[faq]]
q = "¿Se sube mi imagen a alguna parte?"
a = """
        No. Tu propio navegador descodifica, recorta, escala y escribe el archivo
        en tu propio hardware, con los codificadores JPEG, PNG y WebP que ya trae
        de serie. Esta herramienta no tiene ninguna función de red: nunca descarga
        nada y nunca envía nada. Y la <code>Content-Security-Policy</code> de la
        página enumera todas las direcciones a las que puede conectarse, ninguna
        de este sitio."""

[[faq]]
q = "¿Qué pasa si le doy un ancho pero no un alto?"
a = """
        El alto sale de la propia forma de la foto, que es casi siempre lo que
        querías: «1920 de ancho» significa «1920 de ancho y el alto que salga».
        Si rellenas los dos, los dos pueden discrepar de la forma de la foto, y
        esa es la única vez que aparece la opción «si las formas no coinciden»,
        con sus cuatro salidas: encajar dentro de la caja, llenarla y cortar lo
        que sobre, rellenar con un fondo, o estirar y aceptar la deformación."""

[[faq]]
q = "¿Redimensionar una imagen hace perder calidad?"
a = """
        Hacer una foto más pequeña, no, al menos de ninguna forma que puedas ver:
        entran más píxeles de los que salen, así que el detalle que se conserva es
        detalle de verdad. Hacer una más grande no puede añadir lo que nunca se
        fotografió, y lo que sale es una copia más blanda de la misma foto, no una
        más nítida. Por eso viene activado «no agrandar nunca una foto más de lo
        que empezó». Lo que sí cuesta algo es la recodificación posterior, si el
        formato es JPEG o WebP, y el control de calidad es lo que gastas ahí."""

[[faq]]
q = "¿Puedo recortar cada imagen de forma distinta?"
a = """
        Sí, y es lo que hace por defecto. Cada imagen de la lista lleva su propia
        caja, en sus propios píxeles, y al hacer clic en una fila esa imagen vuelve
        a la vista previa con su caja y su forma fijada. Nada de lo que le hagas a
        una afecta a otra. Además, todas las cajas empiezan sobre la foto entera,
        así que una imagen sobre la que nunca dibujes no se recorta en
        absoluto."""

[[faq]]
q = "¿Puede recortar un lote entero igual de una vez?"
a = """
        Sí, con el botón que hay debajo de la vista previa. Le da a todas las demás
        imágenes la misma zona relativa, es decir, las mismas fracciones de su
        propio ancho y alto, lo que en un conjunto de capturas o exportaciones del
        mismo tamaño es exactamente la misma caja, y la página lo dice. Con una
        forma fijada, le da a cada una la mayor caja de esa forma que quepa dentro
        de esa zona, así que pulsar 1:1 y luego ese botón te saca cuadrados de una
        carpeta con fotos verticales y horizontales mezcladas. Después, todas las
        cajas siguen siendo editables."""

[[faq]]
q = "¿Qué formatos puede leer y escribir?"
a = """
        Lee todo lo que el navegador sepa descodificar, que en la práctica son
        JPEG, PNG, WebP, GIF, BMP y, en casi todos los navegadores actuales, AVIF.
        Escribe JPEG, PNG y WebP, que son los codificadores que traen los
        navegadores. Con «conservar el formato», un JPEG sigue siendo un JPEG y un
        PNG sigue siendo un PNG; y lo que el navegador no sabe escribir, como un
        GIF o un BMP, sale como PNG, que es el que conserva intactos la
        transparencia y el color plano."""

[[faq]]
q = "¿Qué pasa con la transparencia si guardo como JPEG?"
a = """
        Se rellena con el color de fondo, porque el JPEG no tiene canal alfa donde
        guardarla. El color lo eliges tú y empieza en blanco, que es lo que quiere
        casi todo el mundo y lo que hace casi cualquier otra herramienta sin
        decírtelo. El mismo color se usa detrás de un marco rellenado. Guarda como
        PNG o WebP y la transparencia pasa intacta."""

[[faq]]
q = "¿Quita los datos EXIF y GPS?"
a = """
        De todo lo que procesa de verdad, sí, y de rebote: recortar o
        redimensionar consiste en descodificar la foto a píxeles y volver a
        codificar esos píxeles, y un lienzo lleno de píxeles no lleva etiquetas,
        así que la ubicación, el modelo de cámara y las marcas de tiempo
        sencillamente no se escriben en el archivo nuevo. Un archivo que no le
        estás cambiando nada es otro caso: se devuelve byte por byte, con
        etiquetas y todo. Si lo que quieres es quitar los metadatos sin tocar la
        foto, tienes el <a href="../eliminar-datos-exif/">visor y eliminador de
        EXIF</a>, que reescribe el contenedor sin volver a comprimir nada."""

[[faq]]
q = "¿En qué se diferencia esto del compresor de imágenes?"
a = """
        Esta va de dimensiones: dices cuántos píxeles quieres y te los da. El
        <a href="../comprimir-imagen/">compresor de imágenes</a> va de tamaño de
        archivo: dices cuántos kilobytes tienes permitidos y busca la calidad más
        alta que cabe, redimensionando solo si la calidad por sí sola no llega. Si
        te han dicho «1200 píxeles de ancho», estás en el sitio correcto. Si te
        han dicho «por debajo de 500 KB», la otra te dejará más cerca."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. Tampoco hay límite en el número ni en el tamaño de los
        archivos, porque no hay ningún servidor pagándolos: el trabajo lo hace tu
        propio dispositivo. El sitio lleva publicidad, que es lo que lo paga, y a
        los anuncios no se les da nada sobre tus imágenes."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus imágenes fuera para
        redimensionarlas se pararía en cuanto desenchufaras."""

