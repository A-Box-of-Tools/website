[[howto]]
title = "Elige un vídeo."
body = """
 Arrastra un MP4, MOV, M4V o WebM hasta
      el selector, o busca uno a mano. El navegador lo lee directamente del
      disco, y mientras lo haces no sale nada hacia ninguna parte."""

[[howto]]
title = "Marca el trozo."
body = """
 Reproduce el clip y pulsa <kbd>I</kbd>
      donde tiene que empezar y <kbd>O</kbd> donde tiene que terminar, o arrastra
      los tiradores de la barra. Un GIF dura unos pocos segundos, y este es el
      ajuste que decide si el archivo sale pequeño o enorme, mucho más que los
      otros dos."""

[[howto]]
title = "Elige el ancho y la cadencia."
body = """
 A casi todo aquello para lo
      que sirve un GIF le van bien 480 píxeles de ancho y 12 fotogramas por
      segundo. Reducir el ancho a la mitad deja los píxeles en la cuarta parte, y
      doce fotogramas por segundo se leen como movimiento sin pagar por los que
      no ve nadie."""

[[howto]]
title = "Hazlo y descárgalo."
body = """
 Se leen los fotogramas, se elige una
      sola paleta de 256 colores para toda la animación, y de cada fotograma se
      escribe solo la parte de la imagen que ha cambiado. Cuando termina se
      reproduce en la página, y ese es el mismo archivo que te da la descarga."""

[[faq]]
q = "¿Se sube mi vídeo a alguna parte?"
a = """
        No. Tu propio navegador lo lee, lo muestrea y lo convierte, todo en tu
        propio hardware. Esta herramienta no tiene parte de servidor, y la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, ninguna de este sitio. Y si
        prefieres comprobarlo a que te lo cuenten, desenchúfate de internet y haz
        un GIF igualmente."""

[[faq]]
q = "¿Qué formatos de vídeo puedo convertir?"
a = """
        MP4, M4V y MOV se leen directamente, lleven lo que lleven dentro: H.264,
        HEVC, AV1 o VP9, siempre que el navegador sepa descodificar ese códec. Lo
        demás que el navegador sepa reproducir, y aquí el caso claro es el WebM,
        se lee llevando el reproductor a cada instante, que es más lento y algo
        menos exacto sobre qué fotograma cae dónde. Un archivo que el navegador no
        sabe ni leer ni reproducir, que en la práctica son los AVI, WMV, FLV y
        casi todos los MKV, se rechaza con un mensaje que lo dice, en lugar de
        fallar a mitad de camino."""

[[faq]]
q = "¿Por qué mi GIF es tan grande?"
a = """
        Porque el GIF es un formato de 1987 que guarda imágenes enteras y no
        movimiento. No hay forma de hacer uno de un clip de cinco segundos que sea
        tan pequeño como el MP4 de cinco segundos del que salió: un GIF hecho de
        un vídeo suele ocupar diez veces más que el vídeo. Los tres ajustes que lo
        deciden de verdad son, por orden, cuánto dura el trozo, cuánto mide de
        ancho la imagen y cuántos fotogramas por segundo lleva. Reducir el ancho a
        la mitad deja los píxeles en la cuarta parte, y lo que se paga son los
        píxeles."""

[[faq]]
q = "¿Por qué solo 256 colores?"
a = """
        Porque es lo que da el formato: un GIF lleva una tabla de 256 colores como
        mucho y guarda cada píxel como un número dentro de ella. Esta herramienta
        elige esos 256 contando los colores de todos los fotogramas de tu trozo y
        repartiéndolos en 256 grupos, por corte de la mediana, que es el método
        estándar, así que la paleta se ajusta a tu clip en vez de ser un conjunto
        fijo de colores. Y donde falta un color, el tramado mezcla los dos más
        cercanos para que un degradado siga siendo un degradado en lugar de
        convertirse en franjas."""

[[faq]]
q = "¿Qué hace el ajuste de tramado?"
a = """
        Cambiar un poco de ruido por mucho menos bandeado. Con él activado, un
        cielo que si no se convertiría en cuatro franjas planas sigue siendo un
        degradado, a costa de una textura tenue y de un archivo más grande.
        Desactivado, la imagen queda más plana y el archivo más pequeño, que es lo
        que les va bien a las grabaciones de pantalla, al dibujo de línea y a
        cualquier cosa hecha ya de color plano. El tramado que se usa aquí es
        ordenado y no de difusión de error, así que un fondo que no cambia se
        queda perfectamente quieto entre fotogramas en vez de temblar."""

[[faq]]
q = "¿Hay algún límite de duración o de tamaño?"
a = """
        Lo que está limitado es el trozo, y por la memoria más que por una regla:
        todos sus fotogramas se sostienen a la vez mientras se elige la paleta, así
        que la página calcula lo que costarían tus ajustes y te lo dice antes de
        que empieces. Se niega en vez de dejar que la pestaña se quede sin memoria
        y desaparezca. Un trozo más corto, un ancho menor o una cadencia más baja
        bajan ese coste."""

[[faq]]
q = "¿Conserva el sonido?"
a = """
        Un GIF no puede llevar sonido. No existe ninguna versión del formato que
        tenga audio, y esa es la razón principal de que la web haya sustituido
        casi del todo los GIF por vídeo mudo en bucle. Si el sonido importa,
        quédate con el vídeo: el <a href="../cortar-video/">cortador de vídeo</a>
        te saca un trozo sin recodificar ni un fotograma."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. El sitio lleva publicidad, que es lo que lo paga, y a los
        anuncios no se les da nada sobre tu vídeo."""

