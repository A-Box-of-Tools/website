#
# Lector de códigos QR y de barras - Spanish.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Tuteo, como en el resto del sitio. "Escanear" es lo que se teclea en un
# buscador y "leer" es lo que hace el programa: la página usa las dos, cada una
# donde suena natural.
#
# Los nombres de los simbolismos - EAN-13, UPC-A, ITF-14, Code 128, Code 39,
# ISO/IEC 18004 - se quedan como están: son nombres de norma.
#

name = "Lector de códigos QR y de barras"
heading = "Lector de QR&nbsp;y&nbsp;códigos&nbsp;de&nbsp;barras <span class=\"h1-kw\">&mdash; escanea un código QR desde una imagen o con la cámara</span>"
tagline = "Apúntale con la cámara o suelta una imagen. Se lee aquí, y en ningún otro sitio."

title = "Lector de códigos QR &amp; escáner de códigos de barras &mdash; desde una imagen, sin subir nada"
description = "Lee un código QR desde una foto, una captura o tu cámara y mira exactamente adónde lleva el enlace antes de abrirlo. También EAN, UPC, Code 128, Code 39 e ITF. No se sube nada."
og_title = "Lee un código QR sin enviarle la imagen a nadie"
og_description = "Escanea un código QR desde una imagen o con la cámara y mira la dirección completa antes de decidir si la abres. La imagen no sale de tu máquina y no se graba ningún fotograma de la cámara."
og_image_alt = "Lector de códigos QR y de barras - lee un código desde una imagen o la cámara, sin subir nada"

pledge = """
    Leer un código es aritmética sobre píxeles, y los píxeles ya están aquí.
    Encontrar el símbolo, corregir el ángulo, deshacer la máscara, reparar los
    daños con Reed-Solomon y volver a leer los bits ocurre todo en unas dos mil
    líneas de JavaScript en esta página que puedes leer. <strong>La cámara es la
    misma promesa, no una excepción:</strong> un fotograma llega como píxeles a
    esta pestaña, se examina y desaparece. No se graba nada, no se guarda nada, y
    esta página no tiene ninguna función de red con la que enviarlo."""

live_hint = """
      No hace falta que nos creas: abre las DevTools, mira la pestaña de red y
      escanea un código con la cámara encendida. Ni una sola petición lleva un
      fotograma ni un carácter de lo que decía. O desconéctate de internet y lee
      el código igualmente."""

read_first = """
, <code>src/binarize.js</code>
      y <code>src/detect.js</code> para encontrar un símbolo dentro de una
      fotografía &mdash; el umbral, los patrones de búsqueda y la corrección de
      la perspectiva &mdash;, <code>src/qr-decode.js</code> para volver a
      leerlo, <code>src/reed-solomon.js</code> para reparar lo que se leyó mal,
      <code>src/linear.js</code> para los de rayas y
      <code>src/camera.js</code>, que es cada línea de esta página que toca una
      cámara."""

howto_heading = "Cómo leer un código QR sin subir la imagen"

card = """
            Lee un código QR desde una foto, una captura o tu cámara &mdash; y
            mira la dirección entera antes de abrirla. Códigos de barras
            también."""

