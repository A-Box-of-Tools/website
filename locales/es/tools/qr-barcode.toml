[[howto]]
title = "Elige el tipo de código."
body = """
 Un código QR lleva cualquier cosa
      y es lo que busca la cámara de un móvil, así que es la respuesta salvo que
      te hayan dicho otra cosa. Un código de barras lleva un número, y cuál
      necesitas lo decide quien vaya a escanearlo: una tienda quiere un EAN-13 o
      un UPC-A, una caja de envío quiere un ITF-14, y cualquier cosa interna suele
      ser Code 128."""

[[howto]]
title = "Di qué va dentro."
body = """
 Un enlace es el caso habitual, y las
      casillas de encima construyen los otros formatos que los móviles conocen:
      una red wifi que se ofrece a conectarse sola, una tarjeta de contacto que se
      ofrece a guardarse, un correo, un mensaje de texto, un número de teléfono o
      un punto en un mapa. Elijas el que elijas, la cadena terminada se ve en la
      página, y eso es todo lo que lleva un código QR."""

[[howto]]
title = "Elige cuánto daño puede aguantar."
body = """
 Los cuatro niveles meten más o
      menos corrección de errores, y más corrección significa un código más grande
      y más denso. Con L basta para una pantalla, M sirve para papel corriente y H
      es para algo que se va a manosear, a imprimir pequeño o a pegar en un
      escaparate al sol. Un código impreso en una carta que se limpia todos los
      días se merece Q o H."""

[[howto]]
title = "Ajusta el tamaño, el margen y los colores."
body = """
 El margen forma parte del código.
      Cuatro módulos de espacio en calma alrededor es lo que pide la
      especificación, y recortarlo es la razón número uno de que un código impreso
      no escanee. Oscuro sobre claro y con contraste de verdad: un escáner lee la
      diferencia entre los dos, así que un gris pálido sobre blanco no vale, y
      claro sobre oscuro falla de plano en bastantes lectores."""

[[howto]]
title = "Compruébalo con el móvil que tengas a mano."
body = """
 Antes de imprimir mil, escanea
      el que tienes en pantalla. Son diez segundos y pilla toda la categoría de
      errores que una vista previa no puede: una contraseña de wifi con un
      carácter que había que escapar, un enlace al que le faltaba el
      <code>https://</code>, un número de código de barras al que le falta un
      dígito."""

[[howto]]
title = "Llévate el SVG."
body = """
 Es el código como instrucciones y no como
      píxeles, así que se imprime a cualquier tamaño sin quedarse blando, y un
      borde blando es justo lo que un escáner no consigue resolver. Llévate
      también el PNG si donde vayas a pegarlo no acepta un SVG; está dibujado con
      un número entero de píxeles por módulo, así que tampoco tiene los bordes
      borrosos."""

[[faq]]
q = "¿Se envía a alguna parte lo que escribo?"
a = """
        No. Un código QR es aritmética sobre una cadena de texto, y esa aritmética
        ocurre dentro de tu propio navegador, en tu propio dispositivo. Esta
        herramienta no tiene ninguna función de red: nunca descarga nada y nunca
        envía nada. Y la <code>Content-Security-Policy</code> de la página enumera
        todas las direcciones a las que puede conectarse, ninguna de este sitio.
        Aquí eso vale más que en casi cualquier otra página, porque lo que la
        gente mete con más frecuencia en un código QR es la contraseña de su
        wifi."""

[[faq]]
q = "¿Estos códigos caducan o dejan de funcionar más adelante?"
a = """
        No, ni pueden. Lo que escribes es lo que lleva el código, así que
        escanearlo devuelve exactamente esa cadena para siempre. Los que caducan
        son los que llevan dentro la dirección de otro: un código QR «dinámico»
        lleva un enlace al servidor del generador, que redirige al tuyo, con lo
        que ellos pueden contar cada escaneo, cambiar adónde va o apagarlo cuando
        se les acabe la prueba. Aquí no hay nada que redirija a través de
        nada."""

[[faq]]
q = "¿Es gratis? ¿Puedo usarlo comercialmente?"
a = """
        Es gratis, no hay cuenta, ni marca de agua, ni límite de cuántos hagas, y
        puedes poner el resultado en un producto, un cartel o un escaparate. QR
        Code es una marca registrada de Denso Wave, que ha declarado que no la va
        a ejercer contra quien use los códigos, y la especificación está publicada
        como ISO/IEC 18004 y es libre de implementar, que es lo que hace esta
        página. El sitio lleva publicidad, que es lo que lo paga."""

[[faq]]
q = "¿Qué nivel de corrección de errores debería elegir?"
a = """
        M, salvo que tengas un motivo para otra cosa. Con L el código sale más
        pequeño y va bien en pantalla; M sobrevive a un manejo corriente; y Q y H
        son para un código que se va a imprimir pequeño, plastificar, pegar en un
        escaparate o tapar en parte con un logotipo. Cada escalón mete más datos
        de comprobación, lo que exige un símbolo más grande para la misma cantidad
        de texto: pasar de L a H más o menos duplica el número de módulos para la
        misma cadena."""

[[faq]]
q = "¿Cuánto puede llevar un código QR?"
a = """
        En el tamaño más grande, 177 módulos de lado, hasta 7089 dígitos, 4296
        letras mayúsculas y dígitos, o 2953 bytes de cualquier otra cosa, y eso
        con la corrección de errores más débil; con la más fuerte es alrededor de
        un tercio de eso. En la práctica el límite no lo pone el formato, sino el
        escáner: pasados unos cientos de caracteres, los módulos se quedan tan
        pequeños que la cámara de un móvil corriente no los resuelve con el brazo
        estirado. Un código largo suele ser señal de que lo que debería ir dentro
        es un enlace corto."""

[[faq]]
q = "¿Por qué mi código es más grande si escribo el enlace en minúsculas?"
a = """
        Porque un código QR tiene un modo para mayúsculas y dígitos que empaqueta
        dos caracteres en once bits, y no tiene ninguno parecido para las
        minúsculas, que cuestan ocho bits cada una. Una URL escrita
        <code>HTTPS://EJEMPLO.COM/PAGINA</code> puede salir un tercio más pequeña
        que la misma URL en minúsculas. El esquema y el host no distinguen
        mayúsculas de minúsculas, así que gritarlos no cambia nada salvo el
        tamaño. La ruta que va después del host sí las distingue, así que a esa no
        la toques."""

[[faq]]
q = "¿Puede leer un código QR además de hacerlo?"
a = """
        Esta página no, pero la de al lado sí:
        <a href="../escanear-codigo-qr/">el lector</a> toma una foto, una captura
        de pantalla o tu cámara y te devuelve la cadena. Es un trabajo bastante
        más grande que dibujar uno &mdash; encontrar el símbolo dentro de una
        imagen, corregir el ángulo desde el que se tomó y reparar el daño son
        tres problemas que esta página no tiene &mdash;, y por eso es una
        herramienta aparte y no un botón aquí. Funciona en los mismos términos
        que todo lo demás: no se sube nada, y no se guarda ningún fotograma de
        la cámara."""

[[faq]]
q = "¿Para qué es el margen? ¿Puedo hacerlo más pequeño?"
a = """
        El espacio en blanco que rodea a un código QR forma parte del código. Un
        lector lo usa para saber dónde termina el símbolo, y la especificación
        pide cuatro módulos por cada lado; un código de barras quiere unos diez.
        Aquí puedes ponerlo a cero, y la imagen quedará más limpia, pero entonces
        bastantes escáneres no la verán en absoluto, sobre todo contra un fondo
        recargado. Si el problema es el espacio, haz el código más pequeño en vez
        de recortarle el margen."""

[[faq]]
q = "¿Qué código de barras necesito?"
a = """
        El que te pida quien vaya a escanearlo. El EAN-13 es el código de barras
        del comercio fuera de Norteamérica y el UPC-A es el norteamericano, y los
        dos necesitan un número que te asigne GS1, porque el número identifica a
        tu empresa y no solo al producto. El EAN-8 es la versión corta para
        envases pequeños. El ITF-14 va en la caja de envío. Y el Code 128 y el
        Code 39 llevan texto además de dígitos y no necesitan ningún registro, lo
        que los convierte en la respuesta correcta para cualquier cosa interna:
        activos, estanterías, partes de trabajo."""

[[faq]]
q = "¿Qué es un dígito de control y por qué lo ha añadido la herramienta?"
a = """
        Es el último dígito de un código de barras de comercio, calculado a partir
        de los anteriores para que un escáner pueda distinguir una lectura errónea
        de una buena. El EAN-13 quiere doce dígitos y calcula el decimotercero; el
        UPC-A quiere once y calcula el duodécimo. Escribe el número corto y esta
        página lo añade. Escribe el número completo y comprueba el que le has
        dado, y si no cuadra se niega en lugar de corregirlo sin decir nada,
        porque un dígito equivocado arreglado en silencio es una etiqueta que
        escanea como el producto de otra persona."""

[[faq]]
q = "¿Puedo poner un logotipo en el centro de un código QR?"
a = """
        Aquí no, pero merece la pena saber por qué funciona en otros sitios: lo
        que lo hace posible es la corrección de errores. En el nivel H se puede
        destruir alrededor del 30&nbsp;% de los módulos y el código se sigue
        leyendo, así que un logotipo que cubra bastante menos que eso en el
        centro, donde no hay ningún patrón de localización, es daño reparable.
        Pasa el código por tu editor de imágenes en el nivel H, mantén el logotipo
        por debajo de una quinta parte del área más o menos, y pruébalo con un
        móvil de verdad en vez de fiarte."""

[[faq]]
q = "¿Por qué el SVG es mejor que el PNG?"
a = """
        Porque un código son bordes, y un PNG tiene un número fijo de píxeles con
        los que hacerlos. Amplía uno y todos los bordes se ablandan, y un borde
        blando es exactamente lo que le cuesta a un escáner. A una impresora de
        1200 PPP a la que le das un PNG de 512 píxeles le estás pidiendo que se
        invente la diferencia. Un SVG son los cuadrados como instrucciones, así
        que se imprime nítido tanto en una tarjeta de visita como en una valla. Y
        el PNG de aquí está dibujado con un número entero de píxeles por módulo,
        que es lo mejor que puede hacer un PNG."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tu texto fuera para que le
        dibujaran un código se pararía en cuanto desenchufaras."""

