[[privacy]]
title = "Lo que escribes no tiene adónde ir."
body = """
 La
      Content-Security-Policy enumera todas las direcciones a las que esta
      página puede conectarse, y ninguna es de este sitio. Aquí no hay ningún
      destino donde recoger una contraseña de wifi, ni una línea de código que la
      mandara si lo hubiera."""

[[privacy]]
title = "Aquí nada le pide nada a la red."
body = """
 En todo
      <code>src/</code> no hay un solo <code>fetch</code>, ni un
      <code>XMLHttpRequest</code>, ni un <code>sendBeacon</code>. El código se
      construye a partir de la cadena de texto con aritmética y se dibuja como un
      SVG, aquí, en tu propio dispositivo."""

[[privacy]]
title = "El código no apunta hacia nosotros."
body = """
 Lo que escribes es lo que
      lleva el código. Varios generadores gratuitos te devuelven un código que
      contiene un enlace a su propio sitio, que después redirige al tuyo: así
      ellos cuentan cada escaneo, y el código deja de funcionar el día en que
      dejan de pagar el dominio o deciden que el plan gratuito ha caducado. Aquí
      no hay nada que acorte, redirija ni rastree. La cadena que ves en la página
      es la cadena que hay dentro de la imagen."""

[[privacy]]
title = "El PNG se hace a partir del SVG que hay en pantalla."
body = """
 La
      descarga no es un segundo dibujado que pudiera discrepar de la vista
