[[howto]]
title = "Llévate el resultado."
body = """
 Cópialo, o descárgalo como archivo,
      con el nombre del formato en el que salió."""

[[faq]]
q = "¿Se sube mi XML a alguna parte?"
a = """
        No. El analizador y el impresor de esta página son funciones que corren
        en tu propio navegador, en tu propio hardware. Esta herramienta no tiene
        función de red de ninguna clase &mdash; nunca descarga nada y nunca envía
        nada &mdash; y la <code>Content-Security-Policy</code> de la página
        nombra todas las direcciones que puede contactar, ninguna de las cuales
        es nuestra. Eso importa más con XML de lo que la fama del formato
        sugiere: lo que llega en él suele ser una factura, un extracto bancario,
        un historial médico o una petición SOAP con credenciales en la
        cabecera."""

[[faq]]
q = "¿Resuelve entidades externas?"
a = """
        No, y no hay nada que desactivar. La resolución de entidades externas es
        la manera de convencer a un analizador de XML de que lea archivos de la
        máquina donde corre &mdash; el ataque que suele escribirse XXE &mdash; y
        <code>src/xml.js</code> es un lector escrito a mano sin resolución de
        entidades en absoluto. Tu texto tampoco se le entrega nunca al
        <code>DOMParser</code> del propio navegador. Un <code>DOCTYPE</code> pasa
        de largo sin llegar a ejecutarse."""

[[faq]]
q = "¿Qué se pierde al convertir XML a JSON?"
a = """
        El orden del contenido mixto, los comentarios y la diferencia entre un
        atributo y un elemento hijo &mdash; esta última suavizada más que
        borrada, porque un atributo se convierte en un miembro cuyo nombre empieza
        por <code>@</code>. El texto propio de un elemento se vuelve
        <code>#text</code> cuando tiene que convivir con algo más, y los hijos
        repetidos se vuelven un array. Todos los valores siguen siendo cadenas:
        XML no tiene tipos, y decidir que <code>8080</code> era un número sería
        inventar información."""

[[faq]]
q = "¿Qué se pierde al convertir JSON a XML?"
a = """
        La diferencia entre un objeto vacío, un array vacío y una cadena vacía,
        que se convierten los tres en un elemento vacío, y el tipo de cada valor,
        porque XML no tiene tipos. Un array se convierte en un elemento repetido,
        que es la única forma que se lee de vuelta, y a una clave que un nombre de
        elemento no puede sostener se le sustituyen los caracteres incómodos en
        lugar de emitir un documento que ningún analizador leerá."""

[[faq]]
q = "¿Puede formatear un SVG, un feed RSS o un archivo POM?"
a = """
        Sí. Los tres son XML, y esto lee XML en lugar de un dialecto concreto de
        él. Un SVG ordenado así es más fácil de editar a mano; un feed RSS o Atom
        suele publicarse comprimido y es ilegible hasta que algo lo abre. La
        disposición no cambia en nada lo que el documento significa."""

[[faq]]
q = "¿Reindentar el XML cambia lo que significa?"
a = """
        En un documento cuyos elementos contienen otros elementos, no. Donde sí
        puede importar es en el texto: los espacios dentro de un elemento que
        contiene palabras forman parte de ese texto, así que un elemento que solo
        contiene texto se deja en una línea en lugar de abrirse. Las secciones
        <code>CDATA</code> se copian tal como estaban."""

[[faq]]
q = "¿Por qué no usar el propio analizador de XML del navegador?"
a = """
        Por lo que dice cuando el documento está roto. El <code>DOMParser</code>
        devuelve un documento de error cuya redacción cambia en cada navegador y
        que a menudo se reduce a &laquo;error en la línea 1&raquo;. Un lector
        escrito a mano puede decir qué etiqueta no se cerró nunca, y dónde se
        abrió, que es lo que realmente necesitabas saber. No resolver entidades
        externas es la otra razón."""

[[faq]]
q = "¿De qué tamaño puede ser el archivo?"
a = """
        Aquí no hay ningún límite puesto, porque no hay un servidor pagándolo. El
        techo real es tu propio dispositivo: unos cuantos megabytes de XML van
        bien, y con un documento muy largo la página espera a que hagas una pausa
        al escribir antes de volver a formatearlo, en lugar de pelearte el
        teclado."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        límite de cuánto pegas. El sitio lleva publicidad, que es lo que lo paga;
        a los anuncios no se les da nada sobre tu texto."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y sigue
        funcionando. Esa es también la forma más simple de demostrar que no se
        sube nada: una herramienta que mandara tu XML fuera para formatearlo se
        pararía en el momento en que te desconectaras."""

