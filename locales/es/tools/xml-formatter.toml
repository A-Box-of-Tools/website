[[howto]]
title = "Pégalo, o suelta el archivo."
body = """
 Vale cualquier cosa que puedas
      seleccionar y copiar, y un archivo <code>.xml</code>, <code>.svg</code>,
      <code>.rss</code> o <code>.xsd</code> soltado sobre el selector lo lee tu
      propio navegador y lo pone en la caja &mdash; no hay paso de subida que
      omitir."""

[[howto]]
title = "Elige la indentación, o comprímelo."
body = """
 Dos espacios, cuatro, o
      un tabulador. Comprimirlo es el mismo documento sin ninguno de los espacios
      que solo estaban ahí para leerlo, y el resultado dice cuántos bytes ha
      ahorrado eso."""

[[howto]]
title = "Lee el error donde está el error."
body = """
 Un analizador que falla aquí
      dice <em>qué etiqueta</em> no se cerró nunca y en qué línea y columna, en
      lugar de &laquo;error en la línea 1&raquo;, que es lo que dice un navegador
