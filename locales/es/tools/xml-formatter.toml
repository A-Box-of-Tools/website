[[privacy]]
title = "Lo que pegas no tiene adónde ir."
body = """
 La
      Content-Security-Policy nombra todas las direcciones que esta página puede
      contactar, y ninguna de ellas es nuestra. Aquí no hay ningún punto final
      donde recoger una factura pegada, ni nada en el código que la enviaría si
      lo hubiera."""

[[privacy]]
title = "Aquí nada descarga nada."
body = """
 No hay ningún
      <code>fetch</code>, ningún <code>XMLHttpRequest</code> ni ningún
      <code>sendBeacon</code> en todo <code>src/</code>. El analizador y el
      impresor son funciones de esta página que toman una cadena y devuelven una
      cadena."""

[[privacy]]
title = "Nunca se resuelve ninguna entidad externa."
body = """
 Un
      <code>DOCTYPE</code> con una entidad externa dentro es la manera de
      convencer a un analizador de XML de que lea un archivo de la máquina que
      está analizando, y es el agujero más antiguo del formato.
      <code>src/xml.js</code> es un lector escrito a mano que no tiene
      resolución de entidades en absoluto &mdash; no desactivada, ausente
      &mdash; y esta página nunca le entrega tu texto al
      <code>DOMParser</code> del propio navegador."""

[[privacy]]
title = "Todos los valores que salen del XML son cadenas."
body = """
 <code>&lt;port&gt;8080&lt;/port&gt;</code>
      no dice nada sobre si eso es un número, así que el JSON dice
      <code>"8080"</code>. Decidirlo por ti sería inventar información que
      después viaja como si hubiera estado en el archivo."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google, y el botón de donación de Buy Me
      a Coffee. A ninguno se le entrega un carácter de tu texto. Cada línea que
      lo lee, lo analiza o lo escribe se sirve desde este origen y está en el
      repositorio."""

[[privacy]]
