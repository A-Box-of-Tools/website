[[privacy]]
title = "Tus grabaciones no tienen por dónde salir."
body = """
 La
      Content-Security-Policy nombra todas las direcciones que esta página puede
      contactar, y ninguna de ellas es nuestra. Aquí no hay ningún destino donde
      pudiera recogerse tu archivo, ni nada en el código que lo enviara si lo
      hubiera."""

[[privacy]]
title = "Aquí nada pide nada."
body = """
 Esta herramienta no tiene ninguna función de
      red: no hay dirección que pegar, nada que descargar, ningún motor que se baje
      la primera vez. Cada byte que toca tu audio vino de este origen cuando cargó
      la página."""

[[privacy]]
title = "El decodificador es el que ya está en tu navegador."
body = """

      El archivo se le pasa a <code>decodeAudioData</code>, el mismo código que
      reproduce una pista en un elemento <code>&lt;audio&gt;</code>. Aquí no se
      envía nada para leer tu formato, y tampoco se le pide nada a nada de fuera de
      esta página para leerlo."""

[[privacy]]
title = "La imagen de un vídeo no se decodifica en ningún momento."
body = """
 Cuando sueltas un
      vídeo, solo se pide su pista de audio. Los fotogramas no se leen, no se
      decodifican, no se dibujan y no se miran: no hay código en esta página que
      pudiera, y el archivo que sale lleva sonido y nada más."""

[[privacy]]
title = "El corte es una copia, en memoria, en este equipo."
body = """

      Cortar es un <code>set</code> por trozo y por canal: los samples que has
      conservado se mueven a un array nuevo en el orden en que los pusiste. Lo
      único que se multiplica por algo son los pocos cientos de samples de cada
      fundido, y la página te dice cuántos antes de que pulses el botón."""

[[privacy]]
title = "Los samples se escriben tal cual, no se vuelven a codificar."
body = """

      Un WAV son los samples que tiene esta página con una cabecera delante. No hay
      ningún codificador en el bucle tomando decisiones sobre tu grabación, ni nada
      que pudiera describirse como una subida en la que eso ocurriera."""

[[privacy]]
title = "El archivo de marcas se hace en la página."
body = """
 Guardar tus marcas
      escribe un archivo de texto a partir de los números que ya están en pantalla,
      directo a tus descargas. Cargar uno lo lee aquí. Ninguno de los dos se acerca
      a una red, y ninguno lleva más que tiempos."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. A ninguno se le entrega nada sobre
      tu grabación: ni el archivo, ni un sample, ni un nombre, un tamaño, una
      duración o dónde has cortado. Cada línea que lee, corta y escribe se sirve
      desde este origen y está en el repositorio."""

[[privacy]]
title = "Qué carga el botón de donación, y qué no llega a ver."
body = """

      El botón «Buy me a coffee» de la cabecera lo dibuja un script de
      cdnjs.buymeacoffee.com y coge su tipografía de Google Fonts. No es más que un
      enlace: no informa de tu visita y no se le entrega nada sobre ti ni sobre tu
      grabación."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y todo lo de esta
      página sigue funcionando. Es la prueba más sencilla de todas."""

[[howto]]
title = "Elige una grabación."
body = """
 Suelta un MP3, WAV, FLAC, M4A, Ogg u
      Opus sobre el selector, o un vídeo si lo que quieres es un trozo de su
      sonido. El navegador lo lee directamente de tu disco y lo dibuja como una
      onda, y mientras tanto no sale nada a ninguna parte."""

[[howto]]
title = "Reprodúcela y marca los trozos que quieras."
body = """
 Pulsa
      <kbd>I</kbd> donde deba empezar un trozo y <kbd>O</kbd> donde deba acabar.
      Hazlo tantas veces como quieras: cada pareja se convierte en una fila de la
      tabla de abajo y en una banda sobre la onda. <kbd>U</kbd> deshace la última,
      <kbd>Espacio</kbd> reproduce y pausa, las flechas saltan cinco segundos, y
      con <kbd>Mayús</kbd> se mueven diez milisegundos. Baja la velocidad de
      reproducción si el momento es difícil de pillar."""

[[howto]]
title = "Retoca las marcas."
body = """
 Cada fila se puede reproducir por su cuenta,
      ajustar escribiendo dentro una hora exacta, subir o bajar en el orden, o
      borrar. Los dos extremos del trozo seleccionado también se pueden arrastrar
      sobre la onda, que es la forma más rápida de poner una marca en el silencio y
      no en la respiración de antes. El total de arriba es lo que durará la
      grabación terminada."""

[[howto]]
title = "Consérvalos, o quítalos."
body = """
 Conservar es lo habitual: la grabación
      terminada son los trozos que marcaste, unidos en orden. Quitarlos es el otro
      trabajo que la gente quiere y rara vez encuentra: marca los «ehs», el teléfono
      sonando o las salidas en falso, y lo que queda se une sin ellos."""

[[howto]]
title = "Córtalo y descárgalo."
body = """
 Cada corte cae en el sample que
      marcaste; aquí no hay redondeo a ningún fotograma clave, porque el sonido no
      tiene. Lo único que vale la pena elegir es cuánto fundido poner en cada
      unión: cinco milisegundos bastan para evitar un chasquido y son demasiado
      cortos para oírse como un fundido. Lo que sale es un WAV, que se reproduce
      primero en la página y después va directo a las descargas de tu
      navegador."""

[[faq]]
q = "¿Se sube mi audio a alguna parte?"
a = """
        No. Lo lee, lo marca, lo corta y lo escribe tu propio navegador en tu propio
        equipo. Esta herramienta no tiene lado servidor, y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar: ninguna es nuestra. Si prefieres
        comprobarlo a que te lo cuenten, desconéctate de internet y corta una
        grabación igualmente."""

[[faq]]
q = "¿Puedo quedarme con varios trozos de la misma grabación?"
a = """
        Para eso está. Pulsa <kbd>I</kbd> y <kbd>O</kbd> tantas veces como quieras
        mientras suena; cada pareja se convierte en una fila, y el archivo terminado
        son todas las filas unidas en orden y sin nada más. Casi todos los
        cortadores en línea te dan una pareja de tiradores y te preguntan qué único
        tramo conservar, lo cual está bien para recortar la entrada y la salida de
        una sintonía y no sirve absolutamente de nada para escuchar una hora de
        entrevista una vez y quedarte con las seis respuestas que valen."""

[[faq]]
q = "¿El corte cae exactamente donde lo marqué?"
a = """
        Sí, en cada trozo y en cualquier reproductor. Este es el sitio en el que el
        audio es más sencillo que el vídeo: una grabación decodificada es una tirada
        de números y cada uno vale por sí mismo, así que no hay ningún equivalente
        de un fotograma clave al que redondear ni ninguna razón para que un corte
        empiece antes de tiempo. La página enseña el número de sample en el que
        empieza el resultado, que es la marca que hiciste multiplicada por la
        frecuencia de muestreo y redondeada al sample entero más cercano."""

[[faq]]
q = "¿Por qué chascaría una unión, y para qué es el fundido?"
a = """
        Porque cortar de la mitad de una palabra a la mitad de otra pone dos ondas
        que no tienen nada que ver una al lado de la otra, y a un altavoz al que se
        le pide saltar entre ellas le sale un chasquido. No es un fallo del corte:
        es como suena una discontinuidad. La solución es un fundido de unos pocos
        milisegundos a cada lado de cada unión, lo bastante largo para que el cono
        llegue y demasiado corto para oírse como un fundido. Cinco milisegundos es
        lo que viene puesto y se puede quitar. El fundido solo se pone en un borde
        que sea de verdad un corte, así que un borde justo al principio o al final
        de la grabación se queda exactamente como estaba."""

[[faq]]
q = "¿Puedo quitar los trozos malos en vez de conservarlos?"
a = """
        Sí. Márcalos y luego elige «Quitarlos»: lo que <em>no</em> marcaste se une
        en su lugar, en orden. La misma lista de marcas responde a las dos
        preguntas, así que puedes cambiar de una a otra y ver cómo cambia la
        duración sin marcar nada dos veces."""

[[faq]]
q = "¿Puedo guardar mis marcas y volver a ellas?"
a = """
        Sí. «Guardar marcas» escribe un archivo de texto plano, una línea por trozo,
        con el inicio y el final separados por una coma, y «Cargar marcas» lee uno.
        Se ofrecen dos formatos, segundos a secas y <code>HH:MM:SS.mmm</code>, y los
        dos son la misma disposición que escribe el cortador de vídeo de este sitio,
        así que un archivo hecho contra el vídeo se puede soltar sobre su audio y al
        revés. Marcar es trabajo minucioso y nadie debería tener que hacerlo dos
        veces."""

[[faq]]
q = "¿Qué formatos puedo abrir?"
a = """
        Lo que decodifique tu navegador, que en la práctica significa MP3, WAV,
        FLAC, M4A y AAC, Ogg Vorbis y Opus, y el audio dentro de vídeos MP4, M4V,
        MOV y WebM. Lo que se queda fuera es la misma lista corta de siempre: AVI,
        WMA y casi todos los MKV. Un archivo que este navegador no vaya a leer se
        rechaza con un mensaje que lo dice, en vez de fallar a medio camino."""

[[faq]]
q = "¿Por qué guarda un WAV en vez de un MP3?"
a = """
        Porque ningún navegador incluye un codificador de MP3, y esta herramienta se
        niega a mandar tu grabación a un servidor que sí lo tenga. Un WAV no
        necesita codificador ninguno, son los samples con una cabecera corta
        delante, así que es a la vez la opción honesta y la única que no puede
        costar calidad a la salida. Es más grande: unos diez megabytes por minuto en
        estéreo. Cualquier reproductor, teléfono y editor abre uno, y lo que quiera
        un MP3 puede hacerlo a partir de él. Cortar un MP3 copiando sus tramas
        mantendría el archivo pequeño, pero también movería cada corte al límite de
        trama más cercano, que es justo el redondeo que esta herramienta existe para
        no hacer."""

[[faq]]
q = "¿Hay un límite de duración de la grabación?"
a = """
        No hay ningún límite metido en la herramienta. El techo práctico es la
        memoria: la grabación entera se decodifica de golpe en esta página, y el WAV
        se monta en memoria antes de que lo descargues, así que una hora en estéreo
        necesita algo menos de un gigabyte para trabajar. Un WAV de cuatro gigabytes
        se rechaza directamente, porque el propio campo de tamaño del formato no
        puede describirlo."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. El sitio lleva publicidad, que es lo que lo paga, y a los
        anuncios no se les da nada sobre tu grabación."""

