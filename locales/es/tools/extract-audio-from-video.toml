[[privacy]]
title = "Tu vídeo no tiene adónde ir."
body = """
 La
      Content-Security-Policy nombra todas las direcciones que esta página puede
      contactar, y ninguna de ellas es nuestra. Aquí no hay ningún punto final
      donde recoger un archivo, ni nada en el código que lo enviaría si lo
      hubiera."""

[[privacy]]
title = "La imagen no se descodifica en ningún momento."
body = """
 Solo se pide la
      pista de audio. Los fotogramas no se leen, ni se descodifican, ni se
      dibujan, ni se miran, porque en esta página no hay código capaz de hacerlo,
      y el archivo que sale contiene sonido y nada más. No es una promesa de
      contención: a <code>decodeAudioData</code> se le entregan los bytes y
      devuelve sonido, y en <code>src/</code> no hay ningún descodificador de
      vídeo que pudiera ejecutarse."""

[[privacy]]
title = "El descodificador es el que ya trae tu navegador."
body = """
 Aquí no se
      envía nada para leer tu formato, ni se le pide nada a nada de fuera de esta
      página para leerlo. Qué archivos funcionan es, por tanto, lo que tu
      navegador ya sabe reproducir."""

[[privacy]]
title = """El formato WAV deja clara su precisión."""
body = """PCM de 16 bits redondea y limita las muestras decodificadas para favorecer la compatibilidad. Float de 32 bits las conserva si no cambian los canales. Mono promedia los canales. Ambos formatos se escriben en este dispositivo sin subir nada."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google, y el botón de donación de Buy Me
      a Coffee. A ninguno se le entrega nada sobre tu vídeo: ni el archivo, ni
      una muestra, ni un nombre, un tamaño o una duración."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconecta la red y la herramienta sigue
      igual, porque nunca hubo un paso de red en ella. Es la prueba más simple de
      todas."""

[[howto]]
title = "Suelta el vídeo."
body = """
 Un MP4, MOV, M4V o WebM, de un
      móvil, de una cámara, de un grabador de pantalla o de una descarga. Lo lee
      tu propio navegador; no hay paso de subida que omitir."""

[[howto]]
title = "Lee lo que ha encontrado."
body = """
 La duración, el número de canales
      y la frecuencia de muestreo, sacados directamente del archivo. Si el
      archivo no declaró su frecuencia, la página lo dice, en lugar de
      remuestrear en silencio y afirmar que no se tocó nada."""

[[howto]]
title = """Elige el formato y los canales."""
body = """PCM de 16 bits es la opción compatible predeterminada. Elige float de 32 bits para conservar las muestras decodificadas sin redondearlas ni recortarlas. Deja los canales sin cambios para conservarlas; mono los promedia y reduce a la mitad los datos estéreo."""

[[howto]]
title = "Escúchalo antes de guardarlo."
body = """
 El reproductor es el archivo que
      está a punto de descargarse, no el vídeo, así que si suena bien, la
      descarga está bien."""

[[howto]]
title = "Llévatelo, o pásalo al siguiente."
body = """
 Descarga el WAV, o mándalo
      directamente al recortador o al editor sin guardarlo antes."""

[[faq]]
q = "¿Se sube mi vídeo a alguna parte?"
a = """
        No. Tanto la descodificación como la escritura ocurren en tu propio
        navegador, en tu propio hardware. Esta herramienta no tiene función de
        red de ninguna clase &mdash; nunca descarga nada y nunca envía nada
        &mdash; y la <code>Content-Security-Policy</code> de la página nombra
        todas las direcciones que puede contactar, ninguna de las cuales es
        nuestra. Si prefieres comprobarlo a que te lo cuenten, desconéctate de
        internet y saca el sonido igualmente."""

[[faq]]
q = "¿Puede darme un MP3?"
a = """Esta página escribe WAV en lugar de MP3. MP3 necesita un codificador que esta herramienta no incluye. Elige PCM de 16 bits compatible o float de 32 bits; ninguno exige subir el archivo. WAV ocupa más porque su audio no está comprimido; otro editor puede comprimirlo después."""

[[faq]]
q = "¿Se llega a mirar la imagen?"
a = """
        No, y aquí no hay nada que pudiera mirarla. Al descodificador del
        navegador se le entrega el archivo y se le pide su pista de audio; la
        pista de vídeo no se descodifica nunca, no se dibuja nunca y no llega
        siquiera al código de esta página. En <code>src/</code> no hay ningún
        descodificador de vídeo que pudiera ejecutarse. El archivo que sale
        contiene sonido y nada más."""

[[faq]]
q = "Dice que no se pudo leer sonido, pero el vídeo se ve perfectamente."
a = """
        Entonces es casi seguro que el vídeo no tiene pista de audio. Una
        grabación de pantalla hecha sin micrófono seleccionado es muda, y también
        lo es un clip exportado por un editor con el sonido silenciado; los dos
        se reproducen perfectamente, porque hay imagen que reproducir. El mensaje
        nombra esto primero porque es la más probable de las dos causas; la otra
        es un formato que este navegador no va a leer. Abre el archivo en un
        reproductor y busca un control de volumen que no haga nada: es la forma
        más rápida de saber cuál de las dos tienes."""

[[faq]]
q = "¿Qué formatos de vídeo puedo abrir?"
a = """
        Los que descodifique tu navegador, que en la práctica significa MP4, M4V,
        MOV y WebM, y todos los formatos de audio además. Lo que queda fuera es
        la misma lista corta que en el resto del sitio: AVI, WMV y la mayoría de
        los MKV. Un archivo que tu navegador no vaya a leer se rechaza con un
        mensaje que lo dice, en lugar de fallar a mitad de camino."""

[[faq]]
q = "¿Se pierde calidad?"
a = """PCM de 16 bits redondea las muestras decodificadas y limita los valores que superan la escala completa. Elige float de 32 bits y deja los canales sin cambios para conservar las muestras del decodificador, incluidos esos valores. Mono promedia los canales. Float no recupera las pérdidas que ya tenía el vídeo. Se usa la frecuencia de muestreo detectada en el archivo; si no se detecta, la página indica la frecuencia asumida."""

[[faq]]
q = "¿Por qué el WAV es mucho más grande que el vídeo?"
a = """El audio WAV no está comprimido. A 44,1 kHz, estéreo de 16 bits ocupa unos diez megabytes por minuto. Float duplica los datos de muestras; mono reduce a la mitad los datos estéreo. El tamaño de salida se muestra antes de terminar el archivo."""

[[faq]]
q = "¿De qué duración puede ser el vídeo?"
a = """El archivo se lee y decodifica en memoria, donde también se reúne el WAV completo. Las grabaciones largas pueden agotar la memoria; las salidas que superarían el límite WAV de 4 GB se rechazan antes de escribir muestras. Cancelar retira una lectura pendiente o detiene la mezcla y escritura por bloques. El navegador puede seguir decodificando hasta que termine, pero se descarta el resultado cancelado."""

[[faq]]
q = "¿Puedo recortarlo o subirle el volumen?"
a = """
        Sí, pero no aquí: esta página hace un solo trabajo. Cuando hay un
        resultado aparece una fila de enlaces junto a la descarga que lo lleva
        directamente al <a href="../cortar-audio/">recortador de audio</a> o al
        <a href="../editar-audio/">editor de audio</a> sin guardarlo antes, y sin
        que ninguno de los dos lo suba tampoco."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        límite de cuántos vídeos abres. El sitio lleva publicidad, que es lo que
        lo paga; a los anuncios no se les da nada sobre tu archivo."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y sigue
        funcionando. Esa es también la forma más simple de demostrar que no se
        sube nada: una herramienta que mandara tu vídeo fuera para procesarlo se
        pararía en el momento en que te desconectaras."""

