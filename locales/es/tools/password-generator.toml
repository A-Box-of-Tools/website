# Generador de contraseñas y frases de contraseña - Spanish.
#
# Overrides for tools/password-generator/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the roadmap group stay where they are.
#
# "Frase de contraseña" y no "passphrase": es la forma que usan tanto la
# documentación de Apple como la de Google en español, y se entiende sin
# haberla visto antes. "Entropía" se queda, porque es el término y porque la
# frase de al lado lo explica.
#

