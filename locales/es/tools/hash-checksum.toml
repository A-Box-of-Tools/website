[[privacy]]
title = "Tu archivo no tiene por dónde salir."
body = """
 En la
      Content-Security-Policy está cada dirección que esta página puede
      contactar, y ninguna es nuestra. Aquí no hay ningún punto final donde
      recoger tu archivo, ni nada en el código que lo enviara si lo hubiera.
      Antes esto decía <code>connect-src 'none'</code>, que era absoluto; la
      publicidad costó eso, y decirlo forma parte del trato."""

[[privacy]]
title = "El archivo nunca está entero en ningún sitio, sea del tamaño que sea."
body = """

      Se lee en trozos de cuatro megabytes y cada trozo entra en el estado que
      se lleva y se descarta. La memoria que usa esta página es la misma para
      una imagen de disco de cuarenta gigabytes que para un archivo de texto, y
      no hay un tamaño a partir del cual se rinda. Por eso tampoco se usa el
      <code>crypto.subtle.digest</code> que trae el navegador: esa función
      quiere el archivo entero en memoria a la vez, que es justo el techo que
      esta herramienta existe para no tener."""

[[privacy]]
title = "Cinco algoritmos, cinco archivos en este repositorio."
body = """
 En <code>src/md5.js</code>,
      <code>src/sha1.js</code>, <code>src/sha256.js</code> y
      <code>src/sha512.js</code> están las especificaciones publicadas escritas
      tal cual, unas sesenta líneas cada una, con las tablas de constantes
      escritas en lugar de calculadas para que nada del resultado dependa del
      navegador. Cada una se comprueba contra los vectores de prueba oficiales y
      contra la implementación del propio sistema operativo antes de publicarse."""

[[privacy]]
title = "El checksum que pegas tampoco se envía a ningún sitio."
body = """

      Se compara aquí, en la página, contra el valor calculado aquí. De esa
      comparación no se entera nadie: ni el valor, ni si coincidió, ni el nombre
      del archivo. Importa más de lo que parece, porque un checksum junto a un
      nombre de archivo le dice a quien lo recoja exactamente qué versión de qué
      programa acabas de descargar."""

[[privacy]]
title = "Qué carga Google y qué no recibe."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. Ninguno recibe nada sobre tu
      archivo: ni el archivo, ni su nombre, ni su tamaño, ni ninguno de los
      valores calculados. Cada línea que lee o procesa un byte se sirve desde
      este dominio y está en el repositorio."""

[[privacy]]
title = "Qué carga el botón de donación y qué no recibe."
