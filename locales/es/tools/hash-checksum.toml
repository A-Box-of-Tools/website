[[howto]]
title = "Elige el archivo."
body = """
 Arrástralo al recuadro o
      selecciónalo a mano. Se lee por partes directamente del disco; mientras lo
      haces no sale nada hacia ninguna parte, y no hay un tamaño a partir del
