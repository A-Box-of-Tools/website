[[privacy]]
title = "El procesamiento se hace en este navegador."
body = "La herramienta procesa entradas y resultados en el navegador. Su código no los sube para procesarlos. Content-Security-Policy limita recursos y destinos, pero los hosts permitidos pueden recibir solicitudes: no inspecciona sus datos ni prueba por sí sola que nada se envíe. Compara código y solicitudes de la operación concreta o complétala desconectado."

[[privacy]]
title = "Aquí nada le pide nada a la red."
body = """
 Esta herramienta no tiene ninguna
      función de red: no hay dirección que pegar, ni nada que descargar, ni
      ningún motor que se baje la primera vez que la usas. Cada byte que toca tu
      vídeo llegó desde este origen al cargarse la página."""

[[privacy]]
title = "Por la vía normal ni siquiera se descodifica nada."
body = "Al copiar, los fotogramas codificados compatibles pasan intactos a la salida. La página conserva referencias a los bytes originales en vez de decodificarlos. Los cortes exactos y la grabación decodifican y recodifican la imagen localmente; los controles de exportación señalan esa elección."

[[privacy]]
title = "El archivo de marcas se hace en la página."
body = """
 Guardar tus marcas
      escribe un archivo de texto a partir de los números que ya están en
      pantalla, directo a tus descargas. Cargar uno lo lee aquí. Ninguno de los
      dos se acerca a una red, y ninguno lleva más que tiempos."""

[[privacy]]
title = "Se copia el audio compatible."
body = "En copia MP4 y corte exacto se copian intactas las muestras de audio compatibles. Unir clips con audio incompatible puede decodificarlo, remuestrearlo y recodificarlo localmente; la grabación también lo recodifica. La página lo indica antes de exportar. No sube audio."

[[privacy]]
title = "Donde sí se descodifican fotogramas, ocurre aquí."
body = """
 El corte
      exacto, y la vista previa de un archivo que este navegador no reproduce,
      pasan por WebCodecs en tu propio dispositivo. Es el mismo descodificador que
      te enseñaría el vídeo de todas formas, funcionando en el mismo sitio."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. A ninguno se le entrega nada
      sobre tu vídeo: ni un archivo, ni un fotograma, ni un nombre, ni un tamaño,
      ni una duración, ni por dónde lo has cortado. Cada línea que lee, corta y
      escribe se sirve desde este origen y está en el repositorio."""

[[privacy]]
title = "Qué carga el botón de donación, y qué no llega a ver."
body = """

      El botón «Buy me a coffee» de la cabecera lo dibuja un script de
      cdnjs.buymeacoffee.com y se compone con Google Fonts. No es más que un
      enlace: no avisa de ninguna visita, y no se le entrega nada sobre ti ni
      sobre tu vídeo."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y todo lo de esta
      página sigue funcionando. Es la prueba más sencilla de todas."""

[[howto]]
title = "Elige un vídeo."
body = """
 Arrastra un MP4, MOV, M4V o WebM hasta
      el selector. El navegador lo lee directamente del disco, y mientras lo
      haces no sale nada hacia ninguna parte. Si sueltas varios, se unen en el
      orden en que los pusiste."""

[[howto]]
title = "Reprodúcelo y marca los trozos que quieras."
body = """
 Pulsa
      <kbd>I</kbd> donde tiene que empezar un trozo y <kbd>O</kbd> donde tiene
      que terminar, tantas veces como quieras. Cada pareja se convierte en una
      fila de la tabla de abajo y en una banda de la línea de tiempo. Con
      <kbd>U</kbd> deshaces la última, con <kbd>Espacio</kbd> reproduces y pausas,
      y las flechas saltan cinco segundos cada vez. Si el momento es difícil de
      pillar, baja la velocidad de reproducción."""

[[howto]]
title = "Retoca las marcas."
body = """
 Cada fila se puede reproducir por su
      cuenta, retimar escribiendo dentro un tiempo exacto, subir o bajar de
      orden, o borrar. Los dos extremos del trozo seleccionado también se pueden
      arrastrar por la línea de tiempo. El total de arriba es lo que va a durar
      el vídeo terminado."""

[[howto]]
title = "Consérvalos, o quítalos."
body = """
 Conservar es lo habitual: el vídeo
      terminado son los trozos que has marcado, unidos en orden. Quitarlos es el
      otro trabajo que la gente quiere y casi nunca encuentra: marca los
      anuncios, los silencios o los arranques en falso, y lo que queda se une sin
      ellos."""

[[howto]]
title = "Córtalo y descárgalo."
body = """
        «Conservar cada byte» traslada los fotogramas intactos. El primer trozo puede
        incluir fotogramas ocultos desde un fotograma clave anterior; todos los trozos
        posteriores deben empezar en un fotograma clave. «Cortar exactamente aquí»
        descodifica y recodifica todos los fotogramas conservados para mantener los
        tiempos elegidos. La página indica qué método vas a usar y qué implica antes de
        pulsar el botón."""

[[faq]]
q = "¿Se sube mi vídeo a alguna parte?"
a = """
        No. Tu propio navegador lo lee, lo marca, lo corta y lo escribe, todo en
        tu propio hardware. Esta herramienta no tiene parte de servidor, y la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, ninguna de este sitio. Y si
        prefieres comprobarlo a que te lo cuenten, desenchúfate de internet y
        corta un vídeo igualmente."""

[[faq]]
q = "¿Puedo conservar varios trozos del mismo vídeo?"
a = """
        Para eso está esto. Pulsa <kbd>I</kbd> y <kbd>O</kbd> tantas veces como
        quieras mientras se reproduce: cada pareja se convierte en una fila, y el
        vídeo terminado son todas las filas unidas en orden, con todo lo demás
        fuera. Casi todos los cortadores en línea te dan una sola pareja de
        tiradores y te preguntan qué tramo único quieres conservar, cosa que está
        bien para recortar la entrada y la salida de un clip y no sirve de nada
        para ver una hora de material una vez y quedarte con los seis momentos que
        valen."""

[[faq]]
q = "¿Cortar hace perder calidad?"
a = """
        «Conservar cada byte» mantiene los fotogramas codificados y el sonido
        originales, así que no reduce la calidad. Está disponible para un tramo, o para
        varios si todos los posteriores empiezan en un fotograma clave. «Cortar
        exactamente aquí» recodifica todos los fotogramas conservados y copia el sonido
        cuando es posible. «Grabarlo mientras se reproduce» recodifica tanto la imagen
        como el sonido. El método seleccionado indica qué ocurrirá antes de exportar."""

[[faq]]
q = "¿Por qué un trozo empieza antes de donde lo marqué?"
a = """
        El primer tramo copiado puede incluir fotogramas desde el fotograma clave
        anterior, porque los siguientes los necesitan para descodificarse. Una marca de
        edición indica al reproductor que omita esos fotogramas iniciales; si la ignora,
        puede empezar antes. Los navegadores también pueden manejar mal los fotogramas
        ocultos en una unión interna. Por eso la copia no está disponible si algún tramo
        posterior empieza entre fotogramas clave. Para esas selecciones, elige «Cortar
        exactamente aquí». Recodifica todos los fotogramas conservados; la página
        muestra el método y la duración de los fotogramas iniciales ocultos, si los hay,
        antes de exportar."""

[[faq]]
q = "¿Puedo quitar los anuncios en vez de conservarlos?"
a = """
        Sí. Márcalos y elige «Quitarlos»: se une todo lo que <em>no</em> has
        marcado, en orden. La misma lista de marcas responde a las dos preguntas,
        así que puedes cambiar de una a otra y ver cómo cambia la duración sin
        marcar nada dos veces."""

[[faq]]
q = "¿Puedo guardar mis marcas y volver a ellas?"
a = """
        Sí. «Guardar marcas» escribe un archivo de texto plano, con una línea por
        trozo y el inicio y el final separados por una coma, y «Cargar marcas» lee
        uno de vuelta. Se ofrecen dos formatos, segundos pelados y
        <code>HH:MM:SS.mmm</code>, y los dos respetan la disposición que ya usan
        otras herramientas que trabajan así, de modo que un archivo escrito aquí
        se le puede pasar a una de ellas y un archivo escrito allí se puede soltar
        en esta página. Marcar es un trabajo cuidadoso, y nadie debería tener que
        hacerlo dos veces."""

[[faq]]
q = "¿Qué formatos de vídeo puedo cortar?"
a = """
        MP4, M4V y MOV se leen directamente, lleven lo que lleven dentro: H.264,
        HEVC, AV1 o VP9. Copiar fotogramas no implica descodificarlos, así que
        esta vía funciona incluso con un códec para el que tu navegador no tenga
        descodificador. Lo demás que el navegador sepa reproducir, y aquí el caso
        claro es el WebM, se corta reproduciéndolo y grabando el resultado; eso
        funciona, tarda lo que dure el resultado y solo puede conservar un trozo.
        Un archivo que el navegador no sabe ni leer ni reproducir, que en la
        práctica son los AVI, WMV, FLV y casi todos los MKV, se rechaza con un
        mensaje que lo dice, en lugar de fallar a mitad de camino."""

[[faq]]
q = "¿Hay algún límite de tamaño o de duración?"
a = """
        La herramienta no lleva ningún límite dentro, y por la vía de copia el
        archivo casi ni se lee: a los fotogramas que conservas se les apunta en
        vez de cargarlos, así que quedarte con cuatro minutos de una grabación de
        cuatro gigabytes cuesta más o menos lo que cuesta escribir esos cuatro
        minutos en disco. El corte exacto sí recorre el archivo de unos megabytes
        en unos megabytes. En los dos casos, el techo de verdad es el archivo
        terminado, que se monta en memoria antes de que lo descargues."""

[[faq]]
q = "¿Sobrevive el sonido?"
a = """
        Por las dos vías del MP4 se copia muestra a muestra sin llegar a
        descodificarse, así que sale byte por byte igual que estaba en el archivo,
        y una marca de edición mantiene cada trozo alineado con su imagen con una
        precisión de una milésima de segundo. La única excepción es unir vídeos
        distintos cuyo sonido esté descrito de otra forma, por ejemplo con
        frecuencias de muestreo distintas: ahí no hay manera de meter los dos en
        una sola pista sin descodificarlos, y la página lo dice antes de hacerlo.
        Por la vía de la grabación se captura de la reproducción y se vuelve a
        codificar. En los dos casos hay una casilla para dejarlo fuera del
        todo."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. El sitio lleva publicidad, que es lo que lo paga, y a los
        anuncios no se les da nada sobre tu vídeo."""

