[[privacy]]
title = "Tus imágenes no tienen adónde ir."
body = """
 La
      Content-Security-Policy enumera todas las direcciones a las que esta
      página puede conectarse, y ninguna es de este sitio. Esta herramienta no
      añade nada a esa lista, porque no tiene ninguna función de red propia, ni
      siquiera opcional. Aquí no hay ningún destino donde recoger tus archivos,
      ni una línea de código que los mandara si lo hubiera."""

[[privacy]]
title = "El PDF se escribe aquí."
body = """
 Un PDF es una lista de objetos y una tabla
      que dice dónde empieza cada uno, y <code>src/pdf.js</code> escribe las dos.
      No se descarga ninguna biblioteca, no se renderiza nada en ningún servidor
      y el archivo terminado sale de la memoria directo a una descarga."""

[[privacy]]
title = "Al documento no se le cuenta nada de ti."
body = """
 Casi todas las
      herramientas le estampan a un PDF una marca de tiempo y el nombre del
      programa que lo hizo. Esta escribe un título, un autor y una fecha solo si
      los tecleas tú. Los nombres de archivo de tus fotos no aparecen en ningún
      sitio del documento, y de tu dispositivo tampoco aparece nada."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. A ninguno se le entrega nada
      sobre tus imágenes: ni un archivo, ni una miniatura, ni un nombre, ni un
      tamaño, ni un recuento. Cada línea que lee, descodifica o escribe una
      imagen se sirve desde este origen y está en el repositorio."""

[[privacy]]
title = "Qué carga el botón de donación, y qué no llega a ver."
body = """

      El botón «Buy me a coffee» de la cabecera lo dibuja un script de
      cdnjs.buymeacoffee.com y se compone con Google Fonts. No es más que un
      enlace: no avisa de ninguna visita, y no se le entrega nada sobre ti ni
      sobre tus imágenes. Si no lo pulsas no ocurre nada, y lo que hay al otro
      lado es un sitio ajeno."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y todo lo de esta
      página sigue funcionando. Es la prueba más sencilla de todas: una
      herramienta que mandara tus fotos fuera para convertirlas en un documento
      se pararía en seco."""

[[howto]]
title = "Elige tus imágenes."
body = """
 Arrastra una carpeta entera hasta el
      selector, o busca los archivos a mano. El navegador los lee directamente
      del disco, y mientras lo haces no sale nada hacia ninguna parte."""

[[howto]]
title = "Ordena las páginas y gira las que lo necesiten."
body = """
 Una
      imagen es una página, en el orden en que se ven. Arrastra una ficha por su
      asa para moverla, o usa las flechas. Los botones de giro voltean una página
      un cuarto de vuelta cada vez, que es lo que suele hacer falta con un
      escaneo que salió de lado."""

[[howto]]
title = "Elige un tamaño de página."
body = """
 Con «Ajustar la página a cada
      imagen», cada página es exactamente su foto, sin recortes y sin bandas
      blancas. Los tamaños con nombre, o sea, A4, Carta, Oficio y los demás,
      colocan cada foto dentro de una página fija, con margen si lo quieres."""

[[howto]]
title = "Crea el PDF y descárgalo."
body = """
 El documento se escribe en tu
      propio dispositivo, así que lo que tarde depende de tu hardware y no de una
      cola. El archivo terminado va directo a las descargas del navegador."""

[[faq]]
q = "¿Se suben mis imágenes a alguna parte?"
a = """
        No. Tu propio navegador lee tus imágenes y escribe el PDF, todo en tu
        propio hardware. Esta herramienta no tiene parte de servidor, y la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, ninguna de este sitio. Y a
        diferencia de alguna otra herramienta de aquí, esta no tiene ninguna
        función de red opcional."""

[[faq]]
q = "¿Convertir a PDF hace perder calidad?"
a = """
        Con un JPEG y el ajuste por defecto, no. Un PDF puede llevar datos JPEG
        directamente, así que una fotografía se copia al documento byte por byte:
        no se descodifica en ningún momento ni se vuelve a comprimir, y la imagen
        del PDF es la imagen del archivo. Los demás formatos hay que
        recodificarlos, porque el PDF no tiene ningún filtro para ellos. La
        excepción es el ajuste sin pérdidas, que los guarda exactamente a costa de
        un archivo más grande."""

[[faq]]
q = "¿Qué formatos de imagen puedo usar?"
a = """
        Cualquier imagen fija que el navegador sepa descodificar, que en la
        práctica son JPG, PNG, WebP, GIF, AVIF y, en dispositivos Apple, HEIC.
        Aquí no hay otra lista que mantener al día, porque descodificar es trabajo
        del navegador y no nuestro."""

[[faq]]
q = "¿Puedo elegir el tamaño de página y el orden de las páginas?"
a = """
        Sí. Las páginas pueden ser A4, Carta, Oficio, A3, A5, Tabloide, un tamaño
        que teclees tú o exactamente el tamaño de cada foto. Arrastra las fichas
        para reordenarlas, ordénalas por nombre o por fecha, gira la que quieras
        un cuarto de vuelta y pon un margen en milímetros."""

[[faq]]
q = "¿Cuántas imágenes puedo meter en un PDF?"
a = """
        La herramienta no lleva ningún límite dentro. El techo de verdad es la
        memoria de tu propio dispositivo, porque el documento terminado se monta
        ahí antes de que lo descargues. Lo primero que lo nota son unos cientos de
        fotos de móvil a resolución completa, y reducir el lado más largo, desde
        los ajustes, mueve ese techo bastante lejos."""

[[faq]]
q = "¿El PDF contiene los nombres de mis archivos o una marca de tiempo?"
a = """
        No, salvo que lo pidas. El bloque de información del documento se deja
        vacío salvo por el nombre de esta herramienta: ni nombres de archivo, ni
        nombre de equipo, ni nombre de usuario, ni fecha de creación mientras no
        marques la casilla. Y es a propósito, porque un PDF es de esas cosas que
        la gente le manda a otra gente."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba. El
        sitio lleva publicidad, que es lo que lo paga, y a los anuncios no se les
        da nada sobre tus imágenes."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus imágenes fuera para
        convertirlas en un documento se pararía en cuanto desenchufaras."""

