[[howto]]
title = "Copia o descarga."
body = """
 Un botón por resultado, y uno para todos
      a la vez. Las propiedades personalizadas salen envueltas en un bloque
      <code>:root</code>, listas para pegarlas al principio de una hoja de
      estilos."""

[[faq]]
q = "¿Se sube mi imagen a alguna parte?"
a = """
        No. El archivo lo lee y lo codifica tu propio navegador, en tu propio
        hardware, con dos funciones que ya trae. Esta herramienta no tiene ninguna
        función de red: nunca descarga nada y nunca envía nada. Además, la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, y ninguna de ellas es de este
        sitio."""

[[faq]]
q = "¿Qué es un data URI?"
a = """
        Una forma de escribir un archivo entero donde normalmente iría una
        dirección web. En vez de <code>url("logo.png")</code>, que le manda al
        navegador ir a buscar algo, escribes
        <code>url("data:image/png;base64,iVBORw0...")</code>, que ya contiene la
        propia imagen. El navegador la descodifica ahí mismo. El efecto práctico
        es una petición menos: la imagen llega con la hoja de estilos o con la
        página, y no después de ellas."""

[[faq]]
q = "¿Por qué mi SVG no sale en base64?"
a = """
        Porque base64 es la codificación equivocada para él. Un SVG es texto, y
        una URL ya admite texto: basta con escapar un puñado de caracteres. Si
        codificas esos con porcentajes y dejas el resto en paz, sale un URI que
        suele ser una quinta parte más corto que el base64 del mismo archivo, y
        que además puedes seguir leyendo en tu hoja de estilos, porque los nombres
        de elemento, los colores y el <code>viewBox</code> siguen ahí para
        editarlos. Hay una casilla para forzar base64, por si te toca esa rara
        cadena de herramientas que insiste en ello."""

[[faq]]
q = "¿Cuánto agranda base64 mi imagen?"
a = """
        Alrededor de un tercio. Tres bytes de archivo se convierten en cuatro
        caracteres de base64, o sea un 33&nbsp;% antes de sumarle el
        <code>data:image/png;base64,</code> de delante. Ese es el suelo, y es
        inevitable: es lo que cuesta escribir bytes cualesquiera usando solo los
        caracteres que admite una URL. También es la razón de que la página te
        enseñe el número de caracteres junto al tamaño del archivo, en lugar de
        dejar que lo descubras con la hoja de estilos ya desplegada."""

[[faq]]
q = "¿Cuándo compensa de verdad incrustar una imagen?"
a = """
        Cuando es pequeña y hace falta ya. Un icono de 2 KB dentro de una hoja de
        estilos que cargan todas las páginas es una victoria clara: un viaje de
        ida y vuelta menos, y la imagen está ahí en el mismo momento que el CSS.
        Pasados unos 10 KB el trato se da la vuelta. Una imagen incrustada deja de
        ser un archivo aparte, así que no se puede cachear por su cuenta, no se
        puede descargar en paralelo con nada y se vuelve a bajar entera cada vez
        que cambia el archivo que la rodea. Una fotografía de 200 KB en una hoja
        de estilos son 200 KB añadidos al camino crítico de todas las páginas del
        sitio. La página te dice de qué lado de esa raya cae cada resultado."""

[[faq]]
q = "¿Gzip deshace el coste añadido de base64?"
a = """
        Menos de lo que la gente espera. El base64 de un archivo que ya venía
        comprimido, y eso es lo que son un PNG, un JPEG y un WebP, se comprime
        mal, porque apenas queda redundancia que el compresor pueda encontrar. Lo
        normal es recuperar más o menos una décima parte del tercio que añadió
        base64, no el tercio entero. Un SVG codificado con porcentajes es el caso
        contrario: sigue siendo texto, así que se comprime casi igual de bien que
        antes, y esa es otra razón para no pasarlo a base64."""

[[faq]]
q = "¿Esto le cambia algo a mi imagen?"
a = """
        No, y es una diferencia deliberada respecto a casi todas las herramientas
        de aquí. No se descodifica nada a píxeles ni se vuelve a codificar: los
        bytes que salieron de tu disco son los mismos que entran en el URI. Un
        JPEG sigue siendo exactamente el JPEG que era, con la misma calidad y las
        mismas dimensiones. Por eso el resultado se puede describir como el mismo
        archivo y no como una copia."""

[[faq]]
q = "Entonces, ¿mis datos EXIF y GPS también entran en la hoja de estilos?"
a = """
        Sí, y esta es la parte que conviene pensar antes de pegar nada. Como no se
        recodifica nada, todo lo que escribió la cámara viaja con la imagen: la
        ubicación, la marca de tiempo, el número de serie de la cámara. En una
        foto de móvil eso pueden ser 30 KB del archivo, que se convierten en 40 KB
        de base64 en el camino crítico de tu página, y en una dirección de casa
        metida en algo que va a acabar en un repositorio. La página lee cuántos
        metadatos hay en un JPEG, un PNG o un WebP y te lo dice. Para quitarlos
        antes, tienes el <a href="../eliminar-datos-exif/">visor y eliminador de
        EXIF</a>."""

[[faq]]
q = "¿Por qué ha usado un tipo distinto del de la extensión de mi archivo?"
a = """
        Porque la extensión puede estar equivocada y los bytes no. Un archivo
        llamado <code>logo.png</code> que en realidad se exportó como JPEG es lo
        bastante habitual como para que cualquier herramienta de imagen tenga que
        apañárselas con ello, y un data URI que declara el tipo equivocado
        sencillamente no se ve, sin alternativa ni mensaje de error que merezca la
        pena leer. Así que el tipo se lee de los primeros bytes del archivo, que
        en todos los formatos de aquí dicen sin ninguna duda qué es, y la página
        te avisa cuando los dos no coinciden."""

[[faq]]
q = "La vista previa sale en blanco. ¿Qué ha fallado?"
a = """
        Seguramente nada del URI. Tanto el HEIC como el TIFF dan data URI
        perfectamente válidos que ningún navegador salvo Safari va a dibujar, así
        que la imagen faltará también allá donde lo pegues. Conviértela antes a
        PNG, JPEG o WebP con el <a href="../comprimir-imagen/">compresor de
        imágenes</a> o el <a href="../redimensionar-imagen/">redimensionador de
        imágenes</a>. Si el formato es de los corrientes, lo más probable es que
        el archivo esté dañado: la vista previa se dibuja a partir del URI que ha
        construido esta página, así que una vista en blanco significa que la
        imagen no ha descodificado."""

[[faq]]
q = "¿Hay algún límite de tamaño en un data URI?"
a = """
        Ninguno con el que te vayas a topar en CSS ni en una etiqueta
        <code>&lt;img&gt;</code>, porque los navegadores modernos no ponen ahí
        ningún tope práctico. Lo que sí limitan es teclear un data URI en la barra
        de direcciones, cosa que casi todos ya rechazan para cualquier cosa que no
        sea trivial, por motivos de seguridad que nada tienen que ver con este
        uso. El límite de verdad es el de más arriba: mucho antes de que se rompa
        nada técnico, la página que lo lleva se ha vuelto más lenta de lo que
        habría sido con un archivo de imagen normal."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. Tampoco hay límite en el número ni en el tamaño de los
        archivos, porque no hay ningún servidor pagándolos: el trabajo lo hace tu
        propio dispositivo. El sitio lleva publicidad, que es lo que lo paga, y a
        los anuncios no se les da nada sobre tus imágenes."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus imágenes fuera a codificar se
        pararía en cuanto desenchufaras."""

