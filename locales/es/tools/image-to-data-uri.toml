[[privacy]]
title = "Aquí nada le pide nada a la red."
body = """
 En todo
      <code>src/</code> no hay un solo <code>fetch</code>, ni un
      <code>XMLHttpRequest</code>, ni un <code>sendBeacon</code>. La codificación
      son <code>btoa</code> y <code>encodeURIComponent</code>, dos funciones que
      el navegador trae desde siempre y que cogen bytes y devuelven texto sin ir
      a ninguna parte."""

