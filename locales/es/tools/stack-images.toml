[[privacy]]
title = "Tus fotografías no tienen adónde ir."
body = """
 La
      Content-Security-Policy nombra todas las direcciones que esta página puede
      contactar, y ninguna es nuestra. Aquí no hay ningún destino donde recoger
      tus archivos, ni código que los enviaría si lo hubiera: no hay
      <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code>, ni en <code>src/</code> ni en el worker."""

[[privacy]]
title = "Las vistas previas RAW se leen en este dispositivo."
body = "Muchos archivos RAW contienen una vista previa JPEG creada por la cámara. La herramienta recorre los directorios del archivo y extrae la mayor vista previa utilizable. La cifra de lectura para inspección cuenta las cabeceras y los directorios usados para localizarla y describirla; al decodificar también se lee el fragmento JPEG. Los datos del sensor no se decodifican, y la fila muestra las dimensiones reales de la vista previa."

[[privacy]]
title = "El trabajo ocurre en un Worker de este equipo, no en un servidor."
body = """
 Es la única herramienta de
      aquí que usa uno, porque apilar son minutos de aritmética en vez de
      segundos, y una página congelada no puede enseñar el progreso ni dejarse
      cancelar. Un Worker es un segundo hilo dentro de este mismo navegador
      &mdash; mira <code>src/worker.js</code>. Se le entregan los archivos en sí,
      lo cual es gratis, porque un descriptor de archivo no son los bytes; y
      tiene exactamente la misma Content-Security-Policy que la página, es decir,
      ningún sitio adonde mandarlos."""

[[privacy]]
title = "No se informa a ninguna parte de nada sobre el conjunto."
body = """
 Cuántas tomas has apilado,
      qué cámara las escribió, cuánto se había movido cada una, qué método has
      elegido y cuánto ha tardado se quedan en la memoria de esta página hasta que
      la cierras. En este repositorio no hay ningún evento de analítica que lleve
      nada de eso, y la única pregunta que hace este sitio después de una descarga
      manda un pulgar arriba o abajo y el nombre de la herramienta, nada más."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y la herramienta no
      cambia, porque nunca hubo un paso de red dentro. El worker y cada módulo
      que carga los guarda el service worker de esta misma página, así que una
      copia instalada apila archivos RAW con el cable desenchufado."""

[[howto]]
title = "Elige las tomas."
body = "Una ráfaga, una secuencia de intervalómetro o una carpeta de RAW con vistas previas JPEG utilizables. Espera a que terminen de abrirse los archivos. Cada fila muestra lo encontrado: en un RAW, la cámara y el tamaño real de la vista previa integrada. Los archivos que no se pudieron abrir aparecen en una lista para comprobar cuáles se dejaron fuera."

[[howto]]
title = "Elige el método que corresponda a lo que quieres perder."
body = "Ruido: media, o recorte sigma para rechazar valores distintos del resto. Personas, coches o un avión: mediana, siempre que ocupen cada parte de la escena en menos de la mitad de las tomas. Estelas de estrellas: aclarar. Una macro tomada a lo largo del anillo de enfoque: apilado de enfoque. La nota bajo el menú explica el método y sus límites."

[[howto]]
title = "Decide si hay que alinear las tomas."
body = """
 A pulso: sí, solo
      desplazamiento. A pulso y además girando: desplazamiento, rotación y
      escala. Trípode fijo o intervalómetro: no, y así irá más rápido. Cada toma
      se mide contra la que lleva la marca de referencia, que es la primera
      mientras no digas otra cosa: &laquo;Usar como referencia&raquo; mueve la
      marca y deja la lista en el orden en que la pusiste."""

[[howto]]
title = "Lee las cuatro cifras y después pulsa el botón."
body = "Antes de empezar, la página muestra el tamaño previsto del resultado, la memoria estimada del apilado, las decodificaciones previstas para apilar y los bytes leídos durante la inspección. El funcionamiento interno del navegador y la liberación de memoria pueden consumir más que los búferes modelados; estas cifras son un plan y no garantizan el uso total. Si hacen falta bandas, se sugiere una resolución de trabajo menor. Al terminar, compara la referencia con el resultado a tamaño real de píxel y revisa los detalles de alineación antes de descargar."

[[faq]]
q = "¿Se suben mis fotografías a alguna parte?"
a = """
        No. Cada toma la abre, decodifica, alinea, apila y escribe tu propio
        navegador en tu propio equipo. Esta herramienta no tiene ninguna función
        de red, nunca pide ni envía nada, y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar, ninguna de las cuales es nuestra. Carga
        la página una vez, desconéctate de internet y sigue funcionando. Aquí eso
        importa más que en la mayoría de las herramientas simplemente por el
        volumen: una pila de veinte tomas RAW es alrededor de un gigabyte, y subir
        un gigabyte de fotografías para que alguien les saque la media es
        justamente lo que esta herramienta existe para evitar."""

[[faq]]
q = "¿Qué formatos RAW puede leer, y cómo?"
a = "<span id=\"faq-raw\"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF, RAF, RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL y formatos relacionados son compatibles si contienen una vista previa JPEG utilizable. La herramienta recorre los directorios y usa la mayor que encuentra; puede ser menor que la imagen del sensor o no existir. <strong>No decodifica los datos del sensor.</strong> Los píxeles conservan el balance de blancos y el estilo de imagen de la cámara, con ocho bits por canal. Comprueba las dimensiones de la fila. La lectura de inspección cuenta cabeceras y directorios; la decodificación también lee el fragmento JPEG."

[[faq]]
q = "¿Y por qué no decodificar bien los datos del sensor?"
a = "Decodificar el sensor requeriría un motor RAW como LibRaw o dcraw, con los sistemas de compresión de cada cámara. Usar un JPEG integrado mantiene pequeña la herramienta y permite usar el decodificador del navegador. También implica aceptar el revelado de la cámara y la resolución de la vista previa que incluya el archivo. Para elegir los ajustes de revelado RAW, revela primero las tomas y exporta JPEG o PNG para apilarlas aquí."

[[faq]]
q = "¿Cuántas tomas admite, y de qué tamaño?"
a = "Seis de los siete métodos usan acumuladores cuyo tamaño no crece con el número de tomas. Media, aclarar, oscurecer, sumar y apilado de enfoque necesitan una pasada por banda; recorte sigma necesita dos. Mediana conserva los valores de cada toma para la banda actual, por lo que su memoria sí crece con la cantidad de tomas. Cualquier método puede dividirse en bandas si sus búferes superan el presupuesto de la herramienta, lo que obliga a decodificar de nuevo las tomas para cada banda. La página estima esos búferes y muestra las decodificaciones previstas del apilado. Inspeccionar y alinear añade trabajo, y los procesos internos de códecs y GPU del navegador pueden necesitar más memoria de la estimada."

[[faq]]
q = "¿Qué hace exactamente alinear las tomas?"
a = "La herramienta mide cuánto se desplazó cada toma respecto a la referencia y la recoloca con precisión inferior a un píxel. Usa correlación de fase: el desplazamiento aparece como una diferencia de fase entre los espectros, así que una transformada de Fourier por imagen encuentra un desplazamiento de doscientos píxeles tan fácilmente como uno de dos. El segundo ajuste recupera también rotación y escala con el espectro en coordenadas logarítmico-polares. La corrección es global: un desplazamiento, un ángulo y una escala para toda la imagen. Corrige la cámara que se movió, pero no un sujeto móvil ni una foto tomada desde un paso a un lado. Una toma desplazada a la izquierda deja de cubrir el borde derecho. Por eso el resultado se recorta al área común y puede ser algo menor; así se evitan bordes oscuros por zonas sin cobertura."

[[faq]]
q = "¿Qué método debería usar?"
a = "<strong>Media</strong> para ruido cuando nada se movió: el ruido aleatorio independiente baja aproximadamente por la raíz cuadrada del número de tomas. <strong>Mediana</strong> para quitar lo que ocupa una parte de la escena en menos de la mitad de las tomas. <strong>Recorte sigma</strong> promedia los valores cercanos a la media y rechaza los que superan el umbral elegido. Puede conservar objetos móviles en conjuntos pequeños o si aparecen a menudo; si quitarlos es la prioridad, mediana es más segura. <strong>Aclarar</strong> para estelas de estrellas, fuegos artificiales y pintura con luz. <strong>Oscurecer</strong> para quitar elementos brillantes que se movieron. <strong>Sumar</strong> mezcla de forma aditiva las tomas decodificadas. Trabaja con valores de imagen de ocho bits y no reproduce una exposición de cámara más larga. <strong>Apilado de enfoque</strong> para una macro tomada a lo largo del anillo de enfoque."

[[faq]]
q = "¿Por qué mi resultado tiene ocho bits si mis archivos RAW tienen catorce?"
a = "La entrada RAW es la vista previa JPEG de la cámara, y la salida es un PNG o JPEG de ocho bits. Media y recorte sigma usan acumuladores más amplios y redondean al final. Así estiman un valor más limpio a partir de tomas con ruido sin redondear cada paso intermedio. La imagen guardada sigue teniendo ocho bits por canal; no obtiene la profundidad ni el rango dinámico de los datos lineales del sensor."

[[faq]]
q = "¿Puedo apilar tomas de distinto tamaño, o de cámaras distintas?"
a = "Sí, pero comprueba que sea intencionado. La toma más grande define el área de trabajo; las demás se ajustan y centran en ella. El resultado se recorta al área común, por lo que las formas diferentes o la alineación pueden hacerlo menor que el área prevista. Mezclar cámaras mezcla también su interpretación del color. Mantén la exposición y el encuadre constantes y examina el resultado comparándolo con la referencia."

[[faq]]
q = "Dice que la pasada irá por bandas. ¿Qué significa?"
a = """
        Que la memoria de trabajo que necesita el método es más de la que la
        herramienta está dispuesta a reservar de una vez, así que la imagen se
        cortará en tiras horizontales y se apilará tira a tira. Sigue produciendo
        exactamente el mismo resultado; solo relee las tomas para cada tira, así
        que tarda más, y la página te dice cuántas decodificaciones serán. Bajar
        un escalón la resolución de trabajo divide la memoria entre cuatro, y eso
        casi siempre convierte una pasada por bandas en una sola pasada; la nota
        dice qué ajuste lo haría."""

[[faq]]
q = "¿Por qué esta herramienta usa un Worker y ninguna de las otras?"
a = """
        Porque es la única cuyo trabajo se mide en minutos. Cualquier otra
        herramienta de aquí hace algo que tarda uno o dos segundos, y ahí sacar el
        trabajo del hilo principal sería ceremonia. Apilar veinte tomas grandes es
        aritmética sólida sobre cientos de megabytes, y en el hilo principal eso
        significa una página congelada: ninguna barra de progreso moviéndose, un
        botón de Cancelar que no responde y, al final, un navegador que ofrece
        matar la pestaña. El Worker es un segundo hilo dentro de este mismo
        navegador, ejecutando un archivo de esta misma carpeta, bajo esta misma
        política. No es un servidor y no es una función de red."""

[[faq]]
q = "¿Es gratis y hace falta cuenta?"
a = "Es gratis, sin cuenta, inicio de sesión, prueba ni marca de agua. No hay una cuota del servicio para el número o tamaño de las tomas. Los límites prácticos son la memoria del dispositivo, los límites de lienzo y decodificación del navegador y el tiempo del apilado. La publicidad sostiene la página y no recibe información sobre las fotos."

