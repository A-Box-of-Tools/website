[[privacy]]
title = "Tú eliges la ruta de la conexión cifrada."
body = "La conexión directa envía contenido entre navegadores sin retransmisión. El modo directo normal usa descubrimiento público de direcciones; Red local lo limita a candidatos de host. La retransmisión en la nube reenvía paquetes cifrados mediante Cloudflare TURN y puede conectar dispositivos de redes distintas. El anfitrión elige antes de empezar; la invitación incluye la opción y los lectores la revisan antes de conectarse. La conexión directa nunca cambia automáticamente. Las restricciones de la red o del navegador pueden impedir ambas rutas."

[[privacy]]
title = "Qué es el intermediario, y todo lo que ve."
body = """
 Una conexión directa
      necesita una presentación. Esta página inicial abre automáticamente
      un WebSocket a nuestro intermediario para los nombres de enlace
      locales visibles en la lista; empezar a compartir abre otro para la
      propia compartición. Un lector usa un solo socket de presentación. Ese servidor
      junta a quien tecleó un nombre de enlace con quien comparte bajo ese
      nombre, les pasa unos kilobytes de negociación y no retiene nada:
      nunca escribe almacenamiento, y una sala deja de existir en cuanto
      quien comparte se desconecta. Puede ver que un nombre está en uso,
      cuándo llega y se va cada uno, y sus direcciones IP. No puede ver el
      texto, los archivos, a quién se dejó entrar ni qué dijo nadie: hasta
      la llamada a una compartición privada viaja por el canal directo
      cifrado. Su código completo está en el repositorio, junto al de esta
      herramienta. El directorio enumera solo los nombres anunciados por
      quienes siguen conectados con la misma dirección IPv4 pública o la
      misma subred IPv6. Puede
      incluir otras redes detrás de una VPN compartida o de una dirección
      compartida por el proveedor. Si unos dispositivos usan IPv4 y otros
      IPv6, o siguen rutas distintas, pueden no aparecer aunque estén en la
      misma red local. Lo que sobrevive a una compartición es una sola cosa:
      Cloudflare, que ejecuta el servidor, guarda un registro de cada conexión
      durante siete días, con el nombre de enlace, la dirección y la hora,
      nunca el contenido."""

[[privacy]]
title = "Nada se guarda: cerrar la pestaña es el borrado."
body = """
 Lo compartido existe solo
      mientras tu pestaña está abierta. Ciérrala y los lectores nuevos no
      encuentran nada, y quien esté mirando ve desaparecer su copia &mdash;
      aunque lo que alguien copió o descargó antes es suyo, como lo sería
      cualquier cosa que le hubieras dado en mano. El borrador que escribes
      queda en el almacenamiento de tu propio navegador, para que siga ahí
      la próxima vez, y solo ahí; marcado como de un solo uso, no queda en
      ninguna parte."""

[[privacy]]
title = "El nombre del enlace es una dirección, y Privado, el cerrojo."
body = """
 Cualquiera que
      conozca o adivine un nombre puede abrir lo que hay detrás. Por eso las
      sugerencias son nombres que se pueden decir en voz alta. Las
      comparticiones locales visibles publican su nombre en la lista de
      esta conexión: queda público para los navegadores que usan la misma
      dirección IPv4 pública o la misma subred IPv6. Mantén Privado activado para cualquier contenido
      delicado. Viene activado: cada lector que llega debe presentarse, por el canal
      directo, y no se envía nada hasta que tú lo dejas entrar."""

[[privacy]]
title = "Una conexión directa muestra a cada lado la dirección del otro."
body = "La conexión directa intercambia las direcciones de red necesarias para alcanzar los dispositivos. La retransmisión en la nube usa direcciones del servidor de retransmisión y Cloudflare ve las direcciones de ambos dispositivos y los metadatos del tráfico. No garantiza anonimato. Revisa la opción de conexión de arriba antes de elegir Conectar."

[[privacy]]
title = "Qué carga Google, y qué no recibe."
body = """ Los scripts de anuncios y
      medición vienen de Google, y el botón de donativos, de Buy Me a
      Coffee. Ninguno recibe el texto, los archivos, sus nombres o tamaños,
      ni quién se conectó. La excepción es la propia dirección de esta
      página: el enlace de un lector lleva el nombre del enlace, y el script
      de anuncios lee la dirección. Una compartición que deba quedar en
      privado quiere el interruptor de privado. Cada línea que toca el
      contenido se sirve desde este origen y está en el repositorio."""

[[howto]]
title = "Escribe el texto, o adjunta los archivos."
body = """
 El editor es lo compartido:
      lo que contenga cuando un lector se conecta es lo que recibe, y lo que
      cambies después llega en vivo a los lectores conectados, mientras
      escribes. Los archivos viajan por el mismo canal, hasta 200&nbsp;MB
      cada uno; los lectores ven la lista y descargan solo lo que piden, así
      que nadie gasta ancho de banda en un archivo que no quería."""

[[howto]]
title = "Activa Markdown si el texto merece formato."
body = """
 Un solo interruptor. Títulos,
      negritas, listas, código y enlaces se renderizan en vivo junto al
      editor mientras escribes, y los lectores reciben la vista formateada
      por defecto, con un conmutador para volver al texto original. El
      renderizador viaja con esta página y lo escapa todo: el texto
      compartido no puede convertirse en script en la máquina de un lector,
      lo haya escrito quien lo haya escrito."""

[[howto]]
title = "Ponle nombre al enlace, o quédate con la sugerencia."
body = """
 El nombre es la dirección:
      <code>brave-otter-42</code> se puede decir de un lado a otro de una
      sala, leer por teléfono o copiar de una pizarra. Las comparticiones
      locales visibles enumeran su nombre, así que mantén Privado activado
      para cualquier contenido delicado. Para una compartición disponible
      solo por enlace, un nombre que nadie adivinaría también es útil. Un nombre bajo el
      que ya comparte otra persona se rechaza, y el tuyo queda libre en
      cuanto paras."""

[[howto]]
title = "Decide quién entra."
body = """
 Privado es lo predeterminado: a
      cada lector se le pide presentarse &mdash; un nombre, una pista,
      cualquier cosa que reconozcas &mdash; y tú ves el mensaje con un botón
      para dejarle leer o rechazarlo. La presentación viaja por el canal
      directo, así que ni el intermediario sabe quién llamó. Desmárcalo para
      una compartición abierta que pueda leer cualquiera con el nombre."""

[[howto]]
title = "Empieza a compartir, y deja la pestaña abierta."
body = """La pestaña es el servidor. Mantenla abierta y el dispositivo activo para compartir sin interrupciones. Una conexión que funciona se conserva al ocultar la página, pero el teléfono o un portátil en reposo pueden suspender el navegador. Al volver, se intenta recuperar la misma compartición. Detenerla impide la reanudación automática. Copia el enlace o comunica el nombre: el lector puede añadir <code>#name</code> a la dirección de esta página. Para Red local, copia el enlace con <code>?local=1</code> antes del nombre. Cambiar el modo de conexión requiere que el lector lo elija."""

[[howto]]
title = "Al otro lado: primero consentir, después llamar."
body = """
 Quien abre el enlace se
      entera de que alguien comparte, se le avisa de que una conexión
      directa muestra a cada lado la dirección de red del otro, y solo se
      conecta si lo decide. En una compartición privada se presenta y espera
      a que le abras. Lo que recibe se actualiza en vivo mientras editas, y
      desaparece cuando cierras la pestaña."""

[[faq]]
q = "¿Se sube algo, a alguna parte?"
a = "El texto y los archivos se cifran entre tu navegador y cada lector. La conexión directa es la predeterminada. Si eliges retransmisión en la nube, los paquetes cifrados pasan por Cloudflare, que no puede leer su contenido. El servicio de presentación transmite la preparación y los nombres de enlaces visibles, nunca texto ni archivos. No guardamos contenido compartido en servidores. Cerrar la pestaña termina la fuente; los lectores borran la vista al recibir el aviso o detectar el fallo. Conservan las copias que ya guardaron. Cloudflare conserva los metadatos de las conexiones de presentación durante siete días; nuestra aplicación no registra el contenido compartido."

[[faq]]
q = "¿Y por qué esta herramienta habla con un servidor, precisamente en este sitio?"
a = """
        Porque dos navegadores no pueden encontrarse solos: algo tiene que
        juntar a quien tecleó <code>brave-otter-42</code> con quien comparte
        bajo ese nombre, y llevar la oferta de conexión entre ambos. Ese
        algo es el intermediario, la única dependencia de red de esta
        página, nombrado en su <code>Content-Security-Policy</code> y
        publicado en el mismo repositorio que la página. Es el servidor más
        pequeño capaz de hacer el trabajo. También enumera los nombres de
        enlace locales cuya publicación se haya elegido, para navegadores
        que usan la misma dirección IPv4 pública o la misma subred IPv6.
        No guarda contenido ni
        puede leer el canal cifrado entre los navegadores."""

[[faq]]
q = "¿Qué puede ver exactamente ese servidor?"
a = """
        Que un nombre de enlace está en uso, cuándo se conectan y se van
        quien comparte y los lectores, sus direcciones IP y el
        establecimiento de la conexión cifrada que intercambian, y los
        nombres de enlace cuya publicación en la lista se haya elegido.
        La lista agrupa los nombres por la dirección IPv4 pública o la
        subred IPv6 que ve el servidor, y por el origen de la página. No el
        texto, no los archivos, no sus nombres ni tamaños, no a quién se
        dejó entrar en una compartición privada, y no lo que nadie escribió
        al presentarse: todo eso viaja por el canal directo, cifrado de
        extremo a extremo, que no pasa por el servidor. Cloudflare, que
        ejecuta el servidor, guarda un registro de cada conexión durante siete
        días: el nombre de enlace, la dirección y la hora. Nada más sobrevive
        a la compartición."""

[[faq]]
q = "¿Qué pasa cuando cierro la pestaña?"
a = """La compartición termina cuando desaparece su única fuente. Los lectores borran la copia mostrada cuando detectan el final o un fallo de conexión. Detener la compartición envía un aviso explícito de finalización; una pérdida temporal de red puede activar un número limitado de intentos de recuperación. No hay ninguna copia en el servidor que borrar. Lo que el lector ya haya copiado o descargado seguirá en su poder."""

[[faq]]
q = "¿Puede un lector quedarse con lo que compartí?"
a = """
        Mientras la compartición está abierta, sí: compartir es eso. Un
        lector puede copiar el texto o descargar un archivo, y lo que se
        llevó es suyo, exactamente como si se lo hubieras dado por cualquier
        otro medio. Lo que garantiza terminar es el futuro: nadie nuevo
        puede llegar a ello, y las páginas abiertas dejan de mostrarlo.
        Ninguna herramienta puede des-enviar lo que ya llegó, y esta página
        no finge lo contrario."""

[[faq]]
q = "¿Qué es el modo privado?"
a = """
        Lo predeterminado. A cada lector que llega se le dice que la
        compartición es privada y se le pide presentarse; tú ves el mensaje
        &mdash; «soy Alice, la de la reunión» &mdash; con botones para
        dejarle leer o rechazarlo, y no se envía nada hasta que decides. La
        presentación viaja por el canal directo ya cifrado, así que el
        servidor nunca sabe quién llamó ni qué decidiste. Desmarcado antes
        de compartir, queda una compartición abierta."""

[[faq]]
q = "¿Por qué verá el lector mi dirección IP?"
a = "La conexión directa intercambia las direcciones de red necesarias para alcanzar los dispositivos. La retransmisión en la nube usa direcciones del servidor de retransmisión y Cloudflare ve las direcciones de ambos dispositivos y los metadatos del tráfico. No garantiza anonimato. Revisa el tipo de conexión indicado. Elige Unirse junto a un recurso de la lista o Conectar después de abrir una invitación normal."

[[faq]]
q = "¿Cómo de grandes pueden ser los archivos, y qué velocidad tiene?"
a = "Hasta 200&nbsp;MB por archivo. La velocidad depende de ambos dispositivos y de la ruta. La conexión directa puede usar la velocidad de la red local; la retransmisión en la nube también depende del ancho de banda de internet y los límites del servicio. Los archivos se descargan a petición."

[[faq]]
q = "¿Funciona sin conexión?"
a = "El editor funciona sin internet una vez guardada la página: puedes escribir, mostrar Markdown y conservar un borrador. Para compartir, ambos dispositivos necesitan internet para que el servicio de presentación conecte los navegadores. Guardar la página no permite emparejar sin internet. El modo de red local también necesita esa presentación, aunque el contenido viaja directamente entre los navegadores."

[[faq]]
q = "¿Y si no conseguimos conectar?"
a = "Comprueba internet en ambos dispositivos. Con Red local, Wi-Fi o Ethernet deben permitir que los dispositivos se alcancen. Si falla la conexión directa, el anfitrión puede detener el envío, elegir retransmisión en la nube, empezar de nuevo y enviar la nueva invitación. El lector revisa la opción antes de conectarse. Un envío directo activo nunca cambia automáticamente. Los dispositivos administrados o las redes restrictivas también pueden bloquear la retransmisión."

[[faq]]
q = "¿Es seguro renderizar Markdown, si cualquiera puede compartir cualquier cosa?"
a = """
        Esa pregunta es la razón de que el renderizador sean ochenta líneas
        en el código de esta página y no una biblioteca. Cada carácter se
        escapa antes de emitir ninguna etiqueta, solo puede producirse un
        conjunto fijo de etiquetas inofensivas, y los enlaces aceptan solo
        <code>http</code>, <code>https</code> y <code>mailto</code>: un
        enlace <code>javascript:</code> se queda en texto inerte. El texto
        compartido no puede convertirse en script en tu máquina, lo haya
        escrito quien lo haya escrito, y las ochenta líneas puedes leerlas."""

[[faq]]
q = "¿Pueden dos personas compartir bajo el mismo nombre?"
a = """
        A la vez, no. Una compartición viva por nombre, impuesto en el
        intermediario: quien llega segundo es rechazado y se le pide otro
        nombre. En cuanto una compartición termina, su nombre queda libre
        &mdash; lo que también significa que un enlace guardado vale lo que
        valga la compartición que tenga detrás: el mismo nombre, la semana
        que viene, puede ser de otra persona. Trata un enlace como algo de
        un momento, no de una persona."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Gratis, sin cuenta, sin registro, y sin ningún límite que merezca
        mención: dieciséis lectores simultáneos por compartición. El sitio
        lleva publicidad, que es lo que lo paga; los anuncios no reciben
        nada sobre lo que esta página comparte, y el intermediario cabe de
        sobra en un plan gratuito precisamente porque no guarda nada y casi
        no hace nada."""

[[faq]]
q = "¿Puedo compartir archivos por mi red local?"
a = """
Sí. Antes de empezar, elige Red local — sin retransmisor de internet, conecta ambos dispositivos a la misma red Wi-Fi o Ethernet y copia el enlace para el lector. El enlace incluye el modo; un lector con otro modo debe elegir explícitamente antes de reintentar con el modo de quien comparte. La presentación de los navegadores aún necesita internet. Este modo no usa descubrimiento público de direcciones y nunca pasa a un retransmisor de internet. Una VPN o las políticas de red del navegador pueden cambiar la ruta o impedir la conexión; la opción no demuestra que los bytes permanezcan dentro de un edificio. La aprobación privada sigue activada por defecto y el límite sigue siendo de 200&nbsp;MB por archivo. Una sesión puede incluir hasta 256 archivos.
        Visible en la lista viene activado en este modo: el otro navegador
        puede abrir la página de la herramienta y elegir tu nombre en la
        lista de esta conexión. Desmárcalo para compartir solo por enlace;
        también puedes seguir copiando el enlace para el lector."""

[[faq]]
q = "¿Cómo encuentra la lista las comparticiones locales?"
a = "La lista agrupa envíos por dirección IPv4 pública o subred IPv6 y origen de la página, no por proximidad física. Las pasarelas compartidas y las VPN pueden incluir desconocidos u ocultar dispositivos. Se necesita internet. Solo aparecen envíos locales directos o de retransmisión en la nube que activaron la visibilidad. Descubrible está seleccionado por defecto cuando está disponible; desmárcalo para usar solo enlaces y mantén Privado en redes compartidas. Unirse inicia la solicitud con el tipo de conexión indicado en una pestaña de lectura nueva. Consultar la lista no conecta. Los recursos privados esperan aprobación; la solicitud aparece en un diálogo y permanece en la lista al elegir Revisar después."

