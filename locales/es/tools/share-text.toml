[[privacy]]
title = "El contenido va a tu lector, y a ningún otro sitio."
body = """
 El texto y los archivos
      viajan por un canal de datos WebRTC: una conexión directa, cifrada con
      DTLS, entre tu navegador y el de cada lector. En ese camino no hay
      servidor. En la misma red, los bytes ni siquiera salen del edificio:
      dos portátiles en el mismo wifi se los pasan en local.
      La única excepción es un lector cuya red no se puede alcanzar
      directamente y que entonces elige, en su propia página, un relevo
      cifrado: reenvía el mismo texto cifrado y no puede leerlo."""

[[privacy]]
title = "Qué es el intermediario, y todo lo que ve."
body = """
 Una conexión directa
      necesita una presentación, así que esta página &mdash; la única del
      sitio &mdash; abre un WebSocket a un servidor nuestro. Ese servidor
      junta a quien tecleó un nombre de enlace con quien comparte bajo ese
      nombre, les pasa unos kilobytes de negociación y no retiene nada:
      nunca escribe almacenamiento, y una sala deja de existir en cuanto
      quien comparte se desconecta. Puede ver que un nombre está en uso,
      cuándo llega y se va cada uno, y sus direcciones IP. No puede ver el
      texto, los archivos, a quién se dejó entrar ni qué dijo nadie: hasta
      la llamada a una compartición privada viaja por el canal directo
      cifrado. Su código completo está en el repositorio, junto al de esta
      herramienta. Lo que sobrevive a una compartición es una sola cosa:
      Cloudflare, que ejecuta el servidor, guarda un registro de cada conexión
      durante siete días, con el nombre de enlace, la dirección y la hora,
      nunca el contenido."""

[[privacy]]
title = "Nada se guarda: cerrar la pestaña es el borrado."
body = """
 Lo compartido existe solo
      mientras tu pestaña está abierta. Ciérrala y los lectores nuevos no
      encuentran nada, y quien esté mirando ve desaparecer su copia &mdash;
      aunque lo que alguien copió o descargó antes es suyo, como lo sería
      cualquier cosa que le hubieras dado en mano. El borrador que escribes
      queda en el almacenamiento de tu propio navegador, para que siga ahí
      la próxima vez, y solo ahí; marcado como de un solo uso, no queda en
      ninguna parte."""

[[privacy]]
title = "El nombre del enlace es el único secreto, y el modo privado, el cerrojo."
body = """
 Cualquiera que
      conozca o adivine un nombre puede abrir lo que hay detrás. Por eso las
      sugerencias son tres palabras al azar, por eso cualquier cosa delicada
      merece un nombre inadivinable &mdash; o el interruptor de privado, que
      viene activado: cada lector que llega debe presentarse, por el canal
      directo, y no se envía nada hasta que tú lo dejas entrar."""

[[privacy]]
title = "Una conexión directa muestra a cada lado la dirección del otro."
body = """
 Eso es lo que
      significa entre pares, y el lector lo sabe antes de que ocurra: abrir
      un enlace compartido solo pregunta al intermediario si alguien está
      compartiendo; después la página dice con claridad que conectar revela
      a cada lado la dirección IP del otro, y espera un clic. Hasta ese
      clic, quien comparte ni siquiera sabe que el lector existe."""

[[privacy]]
title = "Qué carga Google, y qué no recibe."
body = """ Los scripts de anuncios y
      medición vienen de Google, y el botón de donativos, de Buy Me a
      Coffee. Ninguno recibe el texto, los archivos, sus nombres o tamaños,
      ni quién se conectó. La excepción es la propia dirección de esta
      página: el enlace de un lector lleva el nombre del enlace, y el script
      de anuncios lee la dirección. Una compartición que deba quedar en
      privado quiere el interruptor de privado. Cada línea que toca el
      contenido se sirve desde este origen y está en el repositorio."""

[[howto]]
title = "Escribe el texto, o adjunta los archivos."
body = """
 El editor es lo compartido:
      lo que contenga cuando un lector se conecta es lo que recibe, y lo que
      cambies después llega en vivo a los lectores conectados, mientras
      escribes. Los archivos viajan por el mismo canal, hasta 200&nbsp;MB
      cada uno; los lectores ven la lista y descargan solo lo que piden, así
      que nadie gasta ancho de banda en un archivo que no quería."""

[[howto]]
title = "Activa Markdown si el texto merece formato."
body = """
 Un solo interruptor. Títulos,
      negritas, listas, código y enlaces se renderizan en vivo junto al
      editor mientras escribes, y los lectores reciben la vista formateada
      por defecto, con un conmutador para volver al texto original. El
      renderizador viaja con esta página y lo escapa todo: el texto
      compartido no puede convertirse en script en la máquina de un lector,
      lo haya escrito quien lo haya escrito."""

[[howto]]
title = "Ponle nombre al enlace, o quédate con la sugerencia."
body = """
 El nombre es la dirección:
      <code>brave-otter-42</code> se puede decir de un lado a otro de una
      sala, leer por teléfono o copiar de una pizarra. También es el único
      secreto, así que para algo privado elige un nombre que nadie
      adivinaría, o apóyate en el interruptor de privado. Un nombre bajo el
      que ya comparte otra persona se rechaza, y el tuyo queda libre en
      cuanto paras."""

[[howto]]
title = "Decide quién entra."
body = """
 Privado es lo predeterminado: a
      cada lector se le pide presentarse &mdash; un nombre, una pista,
      cualquier cosa que reconozcas &mdash; y tú ves el mensaje con un botón
      para dejarle leer o rechazarlo. La presentación viaja por el canal
      directo, así que ni el intermediario sabe quién llamó. Desmárcalo para
      una compartición abierta que pueda leer cualquiera con el nombre."""

[[howto]]
title = "Empieza a compartir, y deja la pestaña abierta."
body = """
 La pestaña es el servidor:
      lo compartido está disponible mientras siga abierta y despierta, y ni
      un momento más. Un portátil que se cierra también lo termina. Copia el
      enlace, o simplemente di el nombre: un lector puede escribirlo como
      <code>#nombre</code> al final de la dirección de esta página."""

[[howto]]
title = "Al otro lado: primero consentir, después llamar."
body = """
 Quien abre el enlace se
      entera de que alguien comparte, se le avisa de que una conexión
      directa muestra a cada lado la dirección de red del otro, y solo se
      conecta si lo decide. En una compartición privada se presenta y espera
      a que le abras. Lo que recibe se actualiza en vivo mientras editas, y
      desaparece cuando cierras la pestaña."""

[[faq]]
q = "¿Se sube algo, a alguna parte?"
a = """
        No. El texto y los archivos van de tu navegador al de cada lector
        por un canal WebRTC cifrado, directamente. El único servidor
        implicado lleva la presentación &mdash; unos kilobytes de
        negociación de la conexión &mdash; y nunca el contenido. En él no
        hay nada que filtrar, requisar o perder: no retiene ni un byte tuyo,
        y una sala deja de existir en cuanto te desconectas."""

[[faq]]
q = "¿Y por qué esta herramienta habla con un servidor, precisamente en este sitio?"
a = """
        Porque dos navegadores no pueden encontrarse solos: algo tiene que
        juntar a quien tecleó <code>brave-otter-42</code> con quien comparte
        bajo ese nombre, y llevar la oferta de conexión entre ambos. Ese
        algo es el intermediario, la única dependencia de red de esta
        página, nombrado en su <code>Content-Security-Policy</code> y
        publicado en el mismo repositorio que la página. Es el servidor más
        pequeño capaz de hacer el trabajo: no guarda nada, no lee nada y se
        aparta en cuanto los dos navegadores tienen un canal directo."""

[[faq]]
q = "¿Qué puede ver exactamente ese servidor?"
a = """
        Que un nombre de enlace está en uso, cuándo se conectan y se van
        quien comparte y los lectores, sus direcciones IP y el
        establecimiento de la conexión cifrada que intercambian. No el
        texto, no los archivos, no sus nombres ni tamaños, no a quién se
        dejó entrar en una compartición privada, y no lo que nadie escribió
        al presentarse: todo eso viaja por el canal directo, cifrado de
        extremo a extremo, que no pasa por el servidor. Cloudflare, que
        ejecuta el servidor, guarda un registro de cada conexión durante siete
        días: el nombre de enlace, la dirección y la hora. Nada más sobrevive
        a la compartición."""

[[faq]]
q = "¿Qué pasa cuando cierro la pestaña?"
a = """
        Lo compartido se acaba en todas partes a la vez. El enlace deja de
        funcionar en un par de segundos, y los lectores que aún tengan la
        página abierta ven desaparecer su copia, con una nota de que la
        compartición terminó. No es una petición de borrado a un servidor:
        no hay copia en servidor que borrar. La pestaña era el único lugar
        donde lo compartido existía, y cerrarla es toda la limpieza."""

[[faq]]
q = "¿Puede un lector quedarse con lo que compartí?"
a = """
        Mientras la compartición está abierta, sí: compartir es eso. Un
        lector puede copiar el texto o descargar un archivo, y lo que se
        llevó es suyo, exactamente como si se lo hubieras dado por cualquier
        otro medio. Lo que garantiza terminar es el futuro: nadie nuevo
        puede llegar a ello, y las páginas abiertas dejan de mostrarlo.
        Ninguna herramienta puede des-enviar lo que ya llegó, y esta página
        no finge lo contrario."""

[[faq]]
q = "¿Qué es el modo privado?"
a = """
        Lo predeterminado. A cada lector que llega se le dice que la
        compartición es privada y se le pide presentarse; tú ves el mensaje
        &mdash; «soy Alice, la de la reunión» &mdash; con botones para
        dejarle leer o rechazarlo, y no se envía nada hasta que decides. La
        presentación viaja por el canal directo ya cifrado, así que el
        servidor nunca sabe quién llamó ni qué decidiste. Desmarcado antes
        de compartir, queda una compartición abierta."""

[[faq]]
q = "¿Por qué verá el lector mi dirección IP?"
a = """
        Porque la conexión es directa de verdad, y una conexión directa va
        entre dos direcciones: cada extremo conoce necesariamente la del
        otro, como en una llamada de teléfono. Al lector se le avisa antes
        de que exista conexión alguna y solo se conecta si lo decide; hasta
        entonces, tú ni siquiera sabes que abrió el enlace. Si ese trato no
        conviene para algo concreto, la alternativa es un servicio que pase
        por un servidor &mdash; con el trato contrario."""

[[faq]]
q = "¿Cómo de grandes pueden ser los archivos, y qué velocidad tiene?"
a = """
        Hasta 200&nbsp;MB por archivo, de cualquier tipo, y tan rápido como
        la más lenta de las dos conexiones: no hay servidor en medio que
        frene ni ponga cuota. Dos máquinas en el mismo wifi transfieren a
        velocidad de red local, y los bytes no salen del edificio. Los
        lectores descargan cada archivo cuando lo piden, así que adjuntar
        algo grande no cuesta nada hasta que alguien lo quiere de verdad."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        La mitad, siendo honestos: el editor sí. La página carga, tu
        borrador está ahí, el Markdown se renderiza, y puedes escribir y
        guardar sin red ninguna. Compartir no, y no puede: llegar al
        navegador de otra persona es un acto de red, y la presentación
        necesita el intermediario. Es la única herramienta de este sitio
        cuyo trabajo es imposible sin conexión, y dar a entender otra cosa
        sería deshonesto."""

[[faq]]
q = "¿Y si no conseguimos conectar?"
a = """
        La mayoría de los pares de navegadores se alcanzan directamente una
        vez presentados; una minoría no, normalmente cuando un lado está en
        la red de direcciones compartidas de una operadora móvil o tras una
        red corporativa estricta. Esta página nunca pasa a un relevo en
        silencio &mdash; eso cambiaría lo que esta herramienta es sin
        decirlo &mdash;, así que a los veinte segundos dice claramente que
        no hubo conexión directa y le ofrece uno al lector: un relevo de
        Cloudflare que reenvía los bytes cifrados entre los dos navegadores
        y no puede leerlos, porque la clave nunca sale de los dos extremos.
        El lector lo elige por su nombre, en su propia página, tras saber
        qué ve &mdash; las dos direcciones, como la conexión directa
        &mdash;, y ahí tampoco se guarda nada. Tu lado no cambia: tu
        navegador sigue enviando a ese único lector, como lo haría si
        estuviera tras una VPN."""

[[faq]]
q = "¿Es seguro renderizar Markdown, si cualquiera puede compartir cualquier cosa?"
a = """
        Esa pregunta es la razón de que el renderizador sean ochenta líneas
        en el código de esta página y no una biblioteca. Cada carácter se
        escapa antes de emitir ninguna etiqueta, solo puede producirse un
        conjunto fijo de etiquetas inofensivas, y los enlaces aceptan solo
        <code>http</code>, <code>https</code> y <code>mailto</code>: un
        enlace <code>javascript:</code> se queda en texto inerte. El texto
        compartido no puede convertirse en script en tu máquina, lo haya
        escrito quien lo haya escrito, y las ochenta líneas puedes leerlas."""

[[faq]]
q = "¿Pueden dos personas compartir bajo el mismo nombre?"
a = """
        A la vez, no. Una compartición viva por nombre, impuesto en el
        intermediario: quien llega segundo es rechazado y se le pide otro
        nombre. En cuanto una compartición termina, su nombre queda libre
        &mdash; lo que también significa que un enlace guardado vale lo que
        valga la compartición que tenga detrás: el mismo nombre, la semana
        que viene, puede ser de otra persona. Trata un enlace como algo de
        un momento, no de una persona."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Gratis, sin cuenta, sin registro, y sin ningún límite que merezca
        mención: dieciséis lectores simultáneos por compartición. El sitio
        lleva publicidad, que es lo que lo paga; los anuncios no reciben
        nada sobre lo que esta página comparte, y el intermediario cabe de
        sobra en un plan gratuito precisamente porque no guarda nada y casi
        no hace nada."""

