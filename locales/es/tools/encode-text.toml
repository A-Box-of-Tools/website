[[faq]]
q = "¿Se sube mi texto a alguna parte?"
a = """
        No. Cada codificador y cada decodificador de esta página es una función que
        corre en tu propio navegador, en tu propio equipo. Esta herramienta no tiene
        ninguna función de red: nunca pide nada y nunca envía nada, y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar, ninguna de las cuales es nuestra. Esa es la
        razón para usarla con un token de acceso o una cookie de sesión: pegar
        cualquiera de esas cosas en el decodificador de otra persona es
        entregársela."""

[[faq]]
q = "¿El Base64 de aquí es el mismo Base64 que en todas partes?"
a = """
        Sí: se comprueba contra los vectores de prueba del RFC 4648 y no contra sí
        mismo. Los dos alfabetos se decodifican, así que un JWT escrito con
        <code>-</code> y <code>_</code> se lee tan bien como uno escrito con
        <code>+</code> y <code>/</code>, y la entrada partida a 64 caracteres se junta
        por ti. La codificación va por bytes UTF-8, así que una letra acentuada o un
        emoji sobrevive a la ida y vuelta."""

[[faq]]
q = "¿Base64 es un cifrado?"
a = """
        No, y tomarlo por uno es el error clásico. Base64 es una ortografía: los
        mismos bytes, escritos en un alfabeto que sobrevive a una URL, a un correo o
        a una cadena JSON. Cualquiera puede leerlo de vuelta &mdash; esta página lo
        hace en un milisegundo &mdash;, así que no esconde nada y no protege nada. Si
        lo que tienes es secreto, necesita cifrado de verdad antes de codificarse,
        no en su lugar."""

[[faq]]
q = "¿Por qué falló la decodificación?"
a = """
        Porque lo pegado no es exactamente lo que se le dijo al códec que era, y el
        error dice en qué sentido: un carácter fuera del alfabeto Base64, relleno
        donde no toca, un signo de porcentaje sin dos dígitos hexadecimales detrás,
        o bytes que sí se decodifican desde Base64 pero no son texto UTF-8 &mdash;
        lo que suele significar que el original era un archivo y no una cadena. El
        <code>atob</code> del navegador habría devuelto algo plausible en su lugar;
        que te lo digan es todo el sentido de pegar algo en un decodificador."""

[[faq]]
q = "¿Cuál es la diferencia entre las dos codificaciones de dirección web?"
a = """
        Un valor suelto, o la dirección entera. Codificar <em>un valor</em> escapa
        todo aquello a lo que una URL da significado &mdash; las barras, los signos
        de interrogación, los ampersands &mdash;, que es lo que quieres para un solo
        parámetro de la cadena de consulta. Codificar una <em>URL entera</em> deja la
        dirección funcionando: las barras y el <code>?</code> se quedan, y solo se
        escapan los caracteres que una URL no puede llevar de ninguna manera. Usar lo
        primero sobre una dirección entera rompe la dirección; usar lo segundo sobre
        un valor pierde dónde acaba el valor."""

[[faq]]
q = "¿De qué tamaño puede ser el archivo?"
a = """
        Aquí no hay ningún límite puesto, porque no hay ningún servidor pagándolo. El
        techo práctico es tu propio equipo: unos cuantos megabytes de texto van bien,
        y con un documento muy largo la página espera una pausa en tu escritura antes
        de recodificar, en vez de pelearse contigo por el teclado."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni límite
        de cuánto pegas. El sitio lleva publicidad, que es lo que lo paga, y a los
        anuncios no se les da nada sobre tu texto."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se sube
        nada: una herramienta que mandara tu texto fuera a decodificar se pararía en
        cuanto desenchufaras."""

