[[faq]]
q = "¿Se sube mi foto a alguna parte?"
a = """
        No. El archivo lo lee, lo analiza y lo reescribe tu propio navegador, en
        tu propio hardware. Esta herramienta no tiene ninguna función de red:
        nunca descarga nada y nunca envía nada. Además, la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, y ninguna de ellas es de este
        sitio."""

[[faq]]
q = "¿Qué es el EXIF y qué más se esconde en una foto?"
a = """
        El EXIF es un bloque de etiquetas que la cámara escribe junto a la
        imagen: la marca y el modelo, los ajustes de exposición, la fecha y la
        hora al segundo, muchas veces una posición GPS y a veces un número de
        serie. Y las fotos suelen llevar más cosas todavía: un paquete XMP de
        XML que ha puesto un editor, un bloque IPTC con campos de pie de foto y
        autoría, un perfil de color, una segunda copia pequeña de la imagen a
        modo de miniatura y una nota del fabricante con datos sin documentar.
        Esta herramienta te lo lista todo."""

[[faq]]
q = "¿Quitar los metadatos le baja la calidad a la imagen?"
a = """
        No, y esa es la razón principal para usar una herramienta así en lugar de
        volver a guardar la foto. Los metadatos están en el contenedor que rodea
        a la imagen comprimida, no dentro de ella. Quitarlos consiste en borrar
        elementos de una lista y volver a escribir esa lista, mientras que los
        datos de imagen comprimidos se copian byte por byte, así que el resultado
        descodifica exactamente los mismos píxeles. No se descodifica nada y no
        se vuelve a comprimir nada."""

[[faq]]
q = "¿Con qué formatos de archivo trabaja?"
a = """
        JPEG, PNG y WebP. Los HEIC y AVIF los reconoce, pero no los reescribe:
        son formatos de cajas construidos con átomos anidados y necesitan otro
        analizador, así que la herramienta te lo dice en lugar de sacarte un
        archivo roto. Un TIFF suelto tampoco lo maneja, porque en un TIFF los
        metadatos y los píxeles se direccionan con los mismos desplazamientos."""

[[faq]]
q = "¿Me va a salir la foto girada después de quitarle los metadatos?"
a = """
        Puede pasar, y hay un ajuste para eso. Los móviles suelen guardar la foto
        tal como la vio el sensor y añaden una etiqueta de orientación que dice
        cómo hay que girarla. Si quitas esa etiqueta, algunos visores te la
        enseñarán de lado. La opción «conservar la etiqueta de orientación», que
        viene activada, vuelve a escribir un bloque EXIF diminuto con esa única
        etiqueta dentro, y solo cuando la foto la necesitaba de verdad.
        Desactívala si prefieres que el archivo no lleve nada de EXIF."""

[[faq]]
q = "¿Quita la ubicación GPS?"
a = """
        Sí. Al quitarlo todo se elimina el directorio GPS entero, y también
        puedes borrar la ubicación por su cuenta y conservar lo demás. La
        posición se muestra primero en grados decimales, porque con «51 grados,
        30 minutos, 26 segundos» no queda nada claro que la foto esté señalando
        el edificio en el que se tomó."""

[[faq]]
q = "¿Puedo cambiar una etiqueta en vez de borrarla?"
a = """
        Sí. Se pueden editar las etiquetas de texto, las fechas, el ISO, la
        orientación y la resolución, y unas cuantas etiquetas habituales se
        pueden añadir a una foto que no tenga ninguna. Eso sí, una advertencia:
        escribir el archivo reconstruye el bloque EXIF, y la nota del fabricante
        contiene desplazamientos hacia el bloque original, de modo que una nota
        reconstruida puede dejar de ser legible para el propio programa del
        fabricante. Si eso te importa, bórrala o deja el archivo sin editar."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba. El
        sitio lleva publicidad, que es lo que lo paga, y a los anuncios no se les
        da nada sobre tus fotos."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus fotos fuera a procesar se
        pararía en cuanto desenchufaras."""

