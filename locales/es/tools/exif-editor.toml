body = " La lista de hallazgos pone por delante lo que conviene saber, que es la posición GPS, las marcas de tiempo y los números de serie, y detrás va la tabla completa con todas las etiquetas. Para JPEG, PNG y WebP se enumeran estos bloques. AVIF solo muestra el EXIF extraído disponible; no se inventarían otros metadatos AVIF."

[[howto]]
title = "Pulsa «Quitar todos los metadatos»."
body = "Para JPEG, PNG y WebP: Para casi todo el mundo, ahí se acaba el trabajo. Se van todas las etiquetas, los bloques XMP e IPTC, los comentarios y la miniatura incrustada, y de todas las fotos de la lista a la vez. El navegador decodifica AVIF y lo guarda como un PNG nuevo sin copiar los metadatos originales. Aquí puedes ver sus etiquetas EXIF disponibles, pero no editarlas. El PNG puede ser mayor y la conversión puede cambiar el color o el HDR. El archivo original no cambia."

[[howto]]
title = "O edita en lugar de quitar."
body = "Para JPEG, PNG y WebP: Cambia una fecha, corrige una línea de derechos, tira la ubicación y conserva los ajustes de la cámara. Después guardas esa foto por su cuenta."

[[faq]]
q = "¿Se sube mi foto a alguna parte?"
a = """
        No. El archivo lo lee, lo analiza y lo reescribe tu propio navegador, en
        tu propio hardware. Esta herramienta no tiene ninguna función de red:
        nunca descarga nada y nunca envía nada. Además, la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, y ninguna de ellas es de este
        sitio."""

[[faq]]
q = "¿Qué es el EXIF y qué más se esconde en una foto?"
a = "Para JPEG, PNG y WebP: El EXIF es un bloque de etiquetas que la cámara escribe junto a la imagen: la marca y el modelo, los ajustes de exposición, la fecha y la hora al segundo, muchas veces una posición GPS y a veces un número de serie. Y las fotos suelen llevar más cosas todavía: un paquete XMP de XML que ha puesto un editor, un bloque IPTC con campos de pie de foto y autoría, un perfil de color, una segunda copia pequeña de la imagen a modo de miniatura y una nota del fabricante con datos sin documentar. Esta herramienta te lo lista todo. Para JPEG, PNG y WebP se enumeran estos bloques. AVIF solo muestra el EXIF extraído disponible; no se inventarían otros metadatos AVIF."

[[faq]]
q = "¿Quitar los metadatos le baja la calidad a la imagen?"
a = "La limpieza de JPEG, PNG y WebP edita sus contenedores y copia los datos de imagen comprimidos byte por byte sin decodificarlos ni recomprimirlos. La limpieza de AVIF decodifica la primera imagen y escribe un PNG nuevo sin pérdidas ni metadatos originales. El PNG puede ser mayor y la decodificación del navegador puede cambiar el color o el HDR. El original no cambia."

[[faq]]
q = "¿Con qué formatos de archivo trabaja?"
a = "JPEG, PNG y WebP permiten ver, editar y limpiar metadatos en su contenedor. AVIF permite una vista previa del EXIF extraído disponible y limpieza a un PNG nuevo. Las etiquetas AVIF son de solo lectura; no se inventarían los demás metadatos. En AVIF animado se usa la primera imagen. HEIC y TIFF sin contenedor se reconocen, pero no se reescriben."

[[faq]]
q = "¿Me va a salir la foto girada después de quitarle los metadatos?"
a = "Para JPEG, PNG y WebP, conservar la orientación escribe un pequeño bloque EXIF con esa etiqueta cuando hace falta. Desactiva la opción para quitarla. AVIF se limpia usando la imagen orientada que decodifica el navegador y crea un PNG. Las opciones de orientación y perfil de color solo se aplican a JPEG, PNG y WebP."

[[faq]]
q = "¿Quita la ubicación GPS?"
a = "La limpieza elimina los datos GPS. Para JPEG, PNG y WebP también puedes borrar solo la ubicación y conservar lo demás. Las etiquetas AVIF son de solo lectura; la conversión a PNG no copia metadatos originales."

[[faq]]
q = "¿Puedo cambiar una etiqueta en vez de borrarla?"
a = "JPEG, PNG y WebP permiten editar y añadir etiquetas. Reescribir la nota del fabricante puede invalidar sus desplazamientos internos; conserva el original si eso importa. El EXIF de AVIF es de solo lectura. La limpieza crea un PNG sin metadatos originales en lugar de reescribir el contenedor AVIF."

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba. El
        sitio lleva publicidad, que es lo que lo paga, y a los anuncios no se les
        da nada sobre tus fotos."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus fotos fuera a procesar se
        pararía en cuanto desenchufaras."""

