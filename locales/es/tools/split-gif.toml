[[privacy]]
title = "Tu GIF no tiene por dónde salir."
body = """
 La
      Content-Security-Policy nombra todas las direcciones que esta página puede
      contactar, y ninguna de ellas es nuestra. Aquí no hay ningún destino donde
      pudieran recogerse tus archivos, ni nada en el código que los enviara si lo
      hubiera. Antes esto decía <code>connect-src 'none'</code>, que no admitía
      excepciones; añadir publicidad costó eso, y decirlo forma parte del
      trato."""

[[privacy]]
title = "El lector de GIF son dos archivos de este repositorio."
body = """
 Un navegador
      reproduce un GIF pero no te entrega sus piezas, así que el formato se lee
      aquí mismo: <code>src/gif.js</code> es el contenedor y el descompresor LZW,
      y <code>src/compose.js</code> son las reglas de descarte que deciden qué
      aspecto tiene cada fotograma una vez que los anteriores quedan debajo. No
      se descarga nada para abrir un archivo, ni hay ningún motor que se baje la
      primera vez."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. A ninguno se le entrega nada
      sobre tu animación: ni el archivo, ni un fotograma, ni un nombre, ni un
      tamaño, ni un recuento. Cada línea que lee, descomprime, dibuja o codifica
      una imagen se sirve desde este origen y está en el repositorio."""

[[privacy]]
title = "Qué carga el botón de donación, y qué no llega a ver."
body = """

      El botón «Buy me a coffee» de la cabecera lo dibuja un script de
      cdnjs.buymeacoffee.com y coge su tipografía de Google Fonts. No es más que
      un enlace: no informa de tu visita y no se le entrega nada sobre ti ni
      sobre tus archivos. No pasa nada mientras no lo pulses, y lo que abrirías
      entonces es el sitio de otra persona."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y todo lo de esta
      página sigue funcionando. Es la prueba más sencilla de todas: una
      herramienta que mandara tu animación fuera para desmontarla se pararía en
      cuanto desenchufaras."""

[[howto]]
title = "Elige el GIF."
body = """
 Suéltalo sobre el selector o búscalo a mano.
      El navegador lo lee directamente de tu disco, y la página te cuenta lo que
      ha encontrado: el tamaño, cuántos fotogramas tiene, cuánto dura y cuántas
      veces se repite."""

[[howto]]
title = "Decide qué guarda cada PNG."
body = """
 <strong>El fotograma tal como
      aparece</strong> es lo que quiere casi todo el mundo: la imagen entera en
      ese momento de la animación. <strong>Solo los píxeles que ese fotograma
      guarda</strong> es el parche que el archivo lleva de verdad, con su propio
      tamaño y en su propio sitio, que es la razón de que un GIF sea pequeño y no
      es el aspecto que tiene la animación."""

[[howto]]
title = "Decide qué pasa con la transparencia."
body = """
 El PNG la conserva, y
      esa es la opción honesta. Rellénala con un color si los fotogramas van a
      parar a algún sitio que ignora la transparencia y la convertiría en
      negro."""

[[howto]]
title = "Escoge los fotogramas que quieres."
body = """
 Por defecto, todos.
      «Quedarme con uno de cada dos» adelgaza una grabación larga, y las casillas
      de la cuadrícula mandan por encima de eso. La numeración no cambia nunca,
      así que el fotograma 42 se sigue llamando fotograma 42 por pocos vecinos
      suyos que hayas conservado."""

[[howto]]
title = "Descárgalos."
body = """
 De uno en uno desde la cuadrícula, o todos
      juntos en un solo ZIP para que haya una pregunta de guardado en vez de
      cientos. El ZIP puede llevar un <code>frames.txt</code> con cuánto duró
      cada fotograma, que es lo único que una carpeta de PNG no sabe contar por
      sí sola."""

[[faq]]
q = "¿Se sube mi GIF a alguna parte?"
a = """
        No. El archivo lo lee, lo descomprime y lo dibuja tu propio navegador en
        tu propio equipo, y cada PNG se codifica aquí, en memoria. Esta
        herramienta no tiene lado servidor, y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar: ninguna es nuestra. Desconéctate de la
        red y verás que sigue separando GIF."""

[[faq]]
q = "¿Por qué un fotograma parece un trocito de la imagen?"
a = """
        Porque es lo que hay en el archivo. Un GIF es una primera imagen seguida
        de parches: cada fotograma posterior guarda solo el rectángulo que cambió,
        y todo lo demás en pantalla es lo que dejaron ahí los anteriores. Una
        cabeza hablando delante de una pared quieta guarda, por tanto, una cara
        por fotograma y no una imagen por fotograma, que es justamente la razón de
        que el formato no sea enorme.
        <br><br>
        Estás viendo eso porque tienes elegido «Solo los píxeles que ese fotograma
        guarda». Cambia a «El fotograma tal como aparece» y cada PNG será la
        imagen entera, tal como se ve la animación en ese instante."""

[[faq]]
q = "¿Conserva la transparencia?"
a = """
        Sí. La transparencia de un GIF es un único bit, un píxel está pintado o es
        invisible y no hay nada en medio, y el PNG guarda exactamente eso, así que
        los fotogramas salen con sus zonas transparentes intactas. Si prefieres un
        fondo sólido, pon «Zonas transparentes» en rellenar con un color; eso
        queda escrito en el PNG y después ya no se puede deshacer."""

[[faq]]
q = "¿Por qué las duraciones no son las que esperaba?"
a = """
        Un GIF guarda cada duración en centésimas de segundo, y los navegadores
        llevan desde los noventa subiendo a una décima cualquier valor menor de
        dos centésimas: una regla escrita para los globos giratorios de la época y
        que nunca se quitó. Un fotograma cuyo archivo dice 0,01 s se reproduce a
        0,10 s en todas partes. Esta herramienta muestra la duración tal como se
        reproduce de verdad, y anota al lado lo que guarda el archivo cuando las
        dos difieren."""

[[faq]]
q = "¿Puedo volver a montar los fotogramas?"
a = """
        Sí, con el <a href="../crear-gif/">Creador de GIF</a> de este sitio o con
        cualquier otra cosa que acepte una carpeta de imágenes. Para eso está el
        <code>frames.txt</code> del ZIP: separar una animación tira los tiempos a
        la basura, porque un PNG no tiene dónde anotar cuánto se mantuvo en
        pantalla, así que la lista se lleva fuera la duración y la posición de
        cada fotograma."""

[[faq]]
q = "¿En qué formatos se pueden guardar los fotogramas?"
a = """
        En PNG, y a propósito solo en PNG. Un fotograma de GIF tiene como mucho
        256 colores y un bit de transparencia; el PNG guarda eso exactamente y sin
        pérdidas, mientras que el JPEG tiraría la transparencia, se inventaría
        colores que el fotograma nunca tuvo y normalmente haría un archivo
        <em>mayor</em> con un dibujo plano. Si necesitas JPEG, convierte los PNG
        después con el
        <a href="../redimensionar-imagen/">Redimensionador de imágenes</a>."""

[[faq]]
q = "¿Hay un límite de fotogramas que pueda leer?"
a = """
        No hay ningún límite fijo. El techo práctico es la memoria de tu propio
        equipo: un GIF se expande a alrededor de un byte por píxel y fotograma
        mientras se lee, así que un archivo pequeño puede ser muchísima memoria, y
        esta página deja de leer antes que dejar morir la pestaña. Si eso pasa lo
        dice, y te devuelve los fotogramas que sí consiguió."""

[[faq]]
q = "¿Abre un GIF dañado?"
a = """
        Normalmente sí. Las descargas cortadas, la marca de fin que falta y un
        último fotograma que se interrumpe a media lectura son cosas corrientes, y
        un lector que las rechace no sirve justo para los archivos que más ganas
        tiene la gente de desmontar. Vuelven todos los fotogramas que estén
        completos, con una nota diciendo qué iba mal. Solo se rechaza de entrada
        lo que no es un GIF en absoluto."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba.
        Tampoco hay marca de agua en los fotogramas. El sitio lleva publicidad,
        que es lo que lo paga, y a los anuncios no se les da nada sobre tus
        archivos."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tu animación fuera a procesar se
        pararía en cuanto desenchufaras."""

