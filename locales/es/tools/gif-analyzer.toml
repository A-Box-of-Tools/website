[[howto]]
title = "Repasa los fotogramas."
body = """
 Cada uno muestra su duración, su
      rectángulo, su método de descarte y su tamaño. Cambia entre «el lienzo después
      de cada fotograma» y «solo lo que guarda cada fotograma»: con lo segundo ves si
      el archivo está optimizado, porque un GIF bien hecho guarda rectángulos
      diminutos y uno mal hecho guarda la imagen entera cada vez."""

[[howto]]
title = "Llévate el informe si lo necesitas."
body = """
 El análisis completo en texto
