[[faq]]
q = "¿Se sube mi GIF a alguna parte?"
a = """
        No. El archivo lo lee, lo descomprime y lo dibuja tu propio navegador en tu
        propio equipo. Esta herramienta no tiene lado servidor, y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar: ninguna es nuestra. Desconéctate de la red
        y verás que sigue analizando GIF."""

[[faq]]
q = "¿Por qué mi GIF va más lento de lo que dicen las duraciones?"
a = """
        Porque todos los navegadores se niegan a respetar una duración menor de dos
        centésimas de segundo y mantienen el fotograma una décima en su lugar. La
        regla se escribió en Netscape en 1996, para los globos giratorios y los
        carteles de «en obras» de la época, y se ha copiado a todos los navegadores
        desde entonces; nadie la ha quitado nunca.
        <br><br>
        Así que un GIF cuyos fotogramas dicen todos 0,01 s no se reproduce a 100
        fotogramas por segundo. Va a 10, que es entre cinco y diez veces más lento
        de lo que pretendía el programa que lo hizo. Esta página enseña las dos
        cifras, lo que dice el archivo y lo que va a hacer de verdad, y marca los
        fotogramas afectados. El arreglo, en el programa que hizo el archivo, es
        escribir 0,02 en vez de 0,01."""

[[faq]]
q = "¿Qué significa «descarte»?"
a = """
        Qué dejar en pantalla cuando se acaba el tiempo de un fotograma, y es el
        campo que decide si una animación se ve bien o se emborrona.
        <br><br>
        <strong>Dejarlo donde está</strong> significa que el siguiente fotograma
        pinta encima de este, que es lo que quieres cuando los fotogramas son
        opacos y se tapan unos a otros. <strong>Volver al fondo</strong> borra
        primero el rectángulo del fotograma, que es lo que necesita la
        transparencia: sin eso, las partes transparentes del siguiente fotograma
        enseñan el anterior por debajo. <strong>Restaurar lo que había
        debajo</strong> devuelve lo que estuviera ahí antes de que este fotograma
        pintara, que es como se guarda un objeto pequeño en movimiento sobre un
        fondo quieto. Y <strong>sin especificar</strong> quiere decir que el
        archivo no dijo nada, y todos los visores lo tratan como «dejarlo donde
        está»."""

[[faq]]
q = "¿Por qué es tan grande mi GIF?"
a = """
        La tabla «Adónde fueron los bytes» responde a eso para tu archivo concreto
        en vez de en general, y solo hay unas pocas respuestas posibles.
        <br><br>
        Si casi todo está en <strong>píxeles comprimidos</strong>, el archivo es
        sencillamente mucha imagen: un GIF guarda cada fotograma como píxeles
        enteros, sin compensación de movimiento y sin mando de calidad, así que el
        tamaño es más o menos el área por el número de fotogramas. Menos
        fotogramas, un tamaño menor o menos colores son las únicas palancas.
        <br><br>
        Si una parte grande está en <strong>tablas de color</strong>, el archivo
        escribe una paleta por fotograma a 768 bytes cada una. Si una parte grande
        está en <strong>metadatos</strong>, un editor se dejó ahí un paquete XMP y
        se puede quitar sin tocar la imagen. Y si todos los fotogramas cubren el
        lienzo entero, el codificador nunca averiguó qué parte cambió de verdad, y
        en cualquier cosa filmada o grabada eso es casi todo el archivo."""

[[faq]]
q = "¿Cuál es la diferencia entre las dos vistas de fotograma?"
a = """
        <strong>El lienzo después de cada fotograma</strong> es lo que enseña un
        visor en ese momento: este fotograma dibujado encima de lo que dejaron los
        anteriores. <strong>Solo lo que guarda cada fotograma</strong> es el
        rectángulo que el archivo tiene de verdad para ese fotograma, por sí solo y
        sin nada debajo.
        <br><br>
        La segunda es la interesante. Un GIF puede guardar un fotograma como solo
        la parte de la imagen que cambió, y por eso una grabación de pantalla de
        una ventana casi quieta puede ser pequeña. Si todos los fotogramas de tu
        archivo son el lienzo completo, nadie hizo ese trabajo, y mirando la
        animación no te enteras: solo mirando lo que hay guardado."""

[[faq]]
q = "Dice que mi archivo tiene un comentario o XMP. ¿Qué es eso?"
a = """
        Texto que viaja junto a la imagen y que ningún visor dibuja. Un bloque de
        comentario suele ser el nombre del programa que escribió el archivo. Un
        paquete XMP es el XML que un editor de imágenes escribe para dejar
        constancia de lo que hizo, y puede llevar el historial de ediciones, la
        versión del programa y a veces el nombre del autor.
        <br><br>
        Esta página imprime los dos enteros, porque la pregunta interesante sobre
        los metadatos es qué dicen, no que existan. Se te enseñan a ti y a nadie
        más: nada en este repositorio se los lee a nadie."""

[[faq]]
q = "¿Puede abrir un GIF roto?"
a = """
        Lo intenta, y te dice dónde se rindió. Un archivo que acaba a mitad de un
        bloque, que tiene un byte donde debería ir un marcador o que lleva un
        fotograma cuyos datos comprimidos se acaban antes de tiempo seguirá
        enseñando todo lo que era legible hasta ese punto, con el problema
        nombrado arriba. Ese es justo el caso en el que más se quiere un
        analizador, así que tirar el archivo entero por un byte malo sería
        equivocarse."""

[[faq]]
q = "¿Cambia mi archivo?"
a = """
        No. Esta herramienta solo lee. No hay archivo de salida, ni recodificación,
        ni ningún botón aquí que escriba un GIF: lo único que puedes descargar es
        una copia en texto plano del análisis. Tu original sigue intacto en tu
        disco, que es también la respuesta honesta a qué pasa si cierras la
        pestaña."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba. No
        hay límite de tamaño de archivo más allá de la memoria de tu propio equipo.
        El sitio lleva publicidad, que es lo que lo paga, y a los anuncios no se
        les da nada sobre tu archivo."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tu GIF fuera a analizar se pararía
        en cuanto desenchufaras."""

