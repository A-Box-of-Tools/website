[[privacy]]
title = "Tus fotos no tienen adónde ir."
body = """
 La
      Content-Security-Policy enumera todas las direcciones a las que esta
      página puede conectarse, y ninguna es de este sitio. Aquí no hay ningún
      destino donde recoger tus archivos, ni una línea de código que los mandara
      si lo hubiera."""

[[privacy]]
title = "El descodificador vino de aquí, y de aquí no se mueve."
body = """
 El HEIC es HEVC
      dentro de un formato de cajas, y ningún navegador salvo Safari sabe
      descodificarlo, así que esta página distribuye <code>libheif</code>
      compilado a WebAssembly: 1,4 MB, guardados en este repositorio, servidos
      desde este origen y cacheados por el service worker como cualquier otro
      archivo de aquí. No se descarga de una CDN, porque eso metería a un tercero
      en el camino de cada visita y dejaría la herramienta sin funcionar sin
      conexión. Y el binario va dentro del script, y no al lado, precisamente
      para que no haga falta ninguna descarga para arrancarlo."""

[[privacy]]
title = "Aquí nada le pide nada a la red."
body = """
 En ningún archivo escrito
      para esta herramienta hay un <code>fetch</code>, ni un
      <code>XMLHttpRequest</code>, ni un <code>sendBeacon</code>. El motor
      incorporado, como toda compilación de Emscripten, trae dentro las rutas de
      carga que descargarían un <code>.wasm</code> desde una URL. No se toman,
      porque el binario ya está en la mano. Y si se tomaran,
      <code>connect-src</code> solo nombra los destinos de medición de Google, así
      que el navegador las rechazaría. La prueba es la política, no la
      promesa."""

[[privacy]]
title = "Los metadatos se leen aquí y se te cuentan a ti."
body = """
 La lista de
      la página dice lo que lleva cada foto, o sea, la fecha, la cámara y si hay
      coordenadas GPS dentro. Es información que quizá quieras tener antes de
      darle el JPEG a alguien. La lee del archivo <code>src/boxes.js</code> dentro
      de este navegador, se muestra en esta página y se escribe en tu JPEG o se
      queda fuera, exactamente como tú elijas. En este repositorio no hay ningún
      evento de analítica propio que lleve un nombre de archivo, una fecha, una
      coordenada o un recuento."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google, y el botón de donación, de Buy
      Me a Coffee. A ninguno se le entrega nada sobre tus fotos. Cada línea que
      lee, descodifica o escribe un archivo se sirve desde este origen y está en
      el repositorio."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Carga la página una vez, desconéctate de
      la red y la herramienta sigue igual, porque el descodificador se guarda en
      caché con ella. Es la prueba más sencilla de todas, y aquí vale más que en
      ninguna otra parte del sitio: un convertidor que mandara tus fotos fuera a
      descodificar no tendría manera humana de apañárselas."""

[[howto]]
title = "Elige tus fotos HEIC."
body = """
 Arrástralas hasta el selector o
      búscalas a mano, directamente en una copia de seguridad del móvil o en una
      carpeta del escritorio. El navegador las lee del disco, y mientras lo haces
      no sale nada hacia ninguna parte. La lista te dice qué es cada una y qué
      lleva dentro."""

[[howto]]
title = "Comprueba qué llevan las fotos."
body = """
 Cada fila te dice la fecha en
      que se tomó, la cámara y, en verde porque es la parte que conviene ver, si
      el archivo lleva coordenadas GPS. Eso se lee del contenedor sin
      descodificar la imagen, así que no cuesta nada y aparece al momento."""

[[howto]]
title = "Elige un formato y decide sobre los datos."
body = """
 JPEG, salvo que tengas un
      motivo para otra cosa: es el formato que se abre en todas partes, que es el
      sentido entero de convertir. El control de calidad viene en 92, que es el
      ajuste en el que una fotografía cuesta distinguirla del original. La
      casilla decide si la fecha, la cámara y la ubicación se vienen contigo."""

[[howto]]
title = "Pulsa «Convertir» y descarga."
body = """
 El descodificador llega con la
      primera conversión, 1,4 MB una sola vez, y a partir de ahí cada foto se
      descodifica y se escribe en tu propio dispositivo. Con un archivo tienes un
      botón de descarga; con varios tienes además un zip."""

[[faq]]
q = "¿Se sube mi foto a alguna parte?"
a = """
        No. El archivo lo lee, lo descodifica y lo escribe tu propio navegador, en
        tu propio hardware. Esta herramienta no tiene ninguna función de red:
        nunca descarga nada y nunca envía nada. Y la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, ninguna de este sitio. Lo único
        que sí se carga es el propio descodificador, que viene de este sitio, una
        vez, antes de que tu foto entre siquiera en la ecuación."""

[[faq]]
q = "¿Por qué esta página se descarga 1,4 MB la primera vez?"
a = """
        Porque el HEIC es el único formato de imagen que un navegador no abre. Es
        un fotograma HEVC dentro de un contenedor de cajas, y solo Safari, sobre
        hardware de Apple, tiene un descodificador para él; Chrome, Firefox y Edge
        rechazan el archivo sin más. Así que un convertidor de HEIC necesita un
        descodificador de alguna parte, y solo hay dos sitios de donde puede
        venir: un servidor o la página. Todos los demás eligieron el servidor, y
        justo por eso todos necesitan que subas tus fotos. Este se trae
        <code>libheif</code> compilado a WebAssembly. Se sirve desde este sitio,
        se guarda en caché tras la primera visita, y es el precio entero de que
        tus fotos no vayan a ninguna parte."""

[[faq]]
q = "¿El JPEG conserva la fecha, la cámara y la ubicación?"
a = """
        Si tú quieres, y es una casilla de la página. Si la dejas activada, el
        bloque EXIF se copia del HEIC y se escribe en el JPEG tal como lo escribió
        el móvil, así que la foto convertida se te sigue ordenando por el día en
        que se tomó y no por el día en que la convertiste, que es la queja
        habitual con los convertidores de HEIC. Se cambia una etiqueta, y solo
        una: la orientación, que se pone en «derecha», porque la rotación ya está
        aplicada a los píxeles y un visor que volviera a aplicarla te pondría de
        lado todas las fotos verticales. Desmarca la casilla y el JPEG sale con la
        imagen y nada más."""

[[faq]]
q = "¿Quita las coordenadas GPS?"
a = """
        Te avisa de que están ahí y luego hace lo que le pidas. La fila de cada
        foto dice si el archivo lleva coordenadas antes de que conviertas nada,
        que es más de lo que hace el móvil. Si desmarcas «conservar la fecha, la
        cámara y los ajustes», se quedan fuera del JPEG junto con todo lo demás; y
        si la dejas marcada, se trasladan. Si lo que quieres es repasar las
        etiquetas con detalle, o quitárselas a fotos que ya son JPEG, la
        herramienta para eso es el <a href="../eliminar-datos-exif/">visor y
        eliminador de EXIF</a>, que además lo hace sin volver a comprimir la
        imagen."""

[[faq]]
q = "¿Se vuelve a comprimir la imagen?"
a = """
        Sí, y no queda otra: HEIC y JPEG son códecs distintos, así que no hay
        forma de pasar de uno a otro sin descodificar la imagen y volver a
        codificarla. Lo que sí puedes controlar es cuánto cuesta eso. El control
        de calidad viene en 92, donde una fotografía es muy difícil de distinguir
        del original, y tienes PNG en el menú para cuando no quieras ninguna
        pérdida y no te importe que el archivo ocupe de cinco a diez veces
        más."""

[[faq]]
q = "¿Y si el archivo se llama .jpg pero en realidad es un HEIC?"
a = """
        Funciona igual. Todo archivo que sueltes aquí se identifica por sus
        primeros bytes y no por su nombre, porque el nombre es lo que decidiera
        ponerle la última aplicación que tocó el archivo. De hecho, un HEIC que
        llegó llamándose «.jpg» es una de las formas más habituales de acabar
        buscando una herramienta como esta. Un archivo que sea de verdad un JPEG o
        un PNG se rechaza con un mensaje que lo dice, en vez de convertirse en una
        copia de sí mismo."""

[[faq]]
q = "¿Puede convertir una Live Photo o una ráfaga?"
a = """
        Las imágenes fijas que lleve dentro, sí. Un HEIC puede contener más de una
        imagen, y todas las que contenga se convierten y se nombran a partir del
        original con un número al final. La mitad de vídeo de una Live Photo es un
        archivo aparte que el móvil guarda junto al HEIC, así que aquí no está
        para convertirla. Los mapas de profundidad y las miniaturas sí están en el
        contenedor, pero no son imágenes que haya pedido nadie, y se dejan en
        paz."""

[[faq]]
q = "¿Por qué no me acepta un AVIF?"
a = """
        Porque no hay nada que hacerle. El AVIF es el mismo contenedor que el HEIC
        con AV1 dentro en lugar de HEVC, y cualquier navegador actual lo
        descodifica de forma nativa, así que un convertidor te estaría mandando un
        megabyte de motor para resolver un problema que no tienes. Si necesitas un
        AVIF en JPEG, el <a href="../comprimir-imagen/">compresor de imágenes</a>
        y el <a href="../redimensionar-imagen/">redimensionador de imágenes</a>
        leen AVIF y escriben JPEG con el descodificador que tu navegador ya
        tiene."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. Tampoco hay límite en el número ni en el tamaño de los
        archivos, porque no hay ningún servidor pagándolos: el trabajo lo hace tu
        propio dispositivo. El sitio lleva publicidad, que es lo que lo paga, y a
        los anuncios no se les da nada sobre tus fotos."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí, descodificador incluido. Carga la página una vez, desconéctate de
        internet y sigue trabajando con tus fotos exactamente igual que antes. Esa
        es además la prueba más contundente que hay de que no se sube nada: un
        convertidor que mandara tus HEIC fuera a descodificar se pararía en cuanto
        desenchufaras, y este no."""

