[[privacy]]
title = "El procesamiento se hace en este navegador."
body = "La herramienta procesa entradas y resultados en el navegador. Su código no los sube para procesarlos. Content-Security-Policy limita recursos y destinos, pero los hosts permitidos pueden recibir solicitudes: no inspecciona sus datos ni prueba por sí sola que nada se envíe. Compara código y solicitudes de la operación concreta o complétala desconectado."

[[privacy]]
title = "Aquí nada descarga nada."
body = """
 No hay ningún
      <code>fetch</code>, ningún <code>XMLHttpRequest</code> ni ningún
      <code>sendBeacon</code> en todo <code>src/</code>. Los dos analizadores y
      los dos impresores son funciones de esta página que toman una cadena y
      devuelven una cadena."""

[[privacy]]
title = "El subconjunto admitido usa las reglas escalares de YAML 1.2."
body = """
 En YAML 1.1,
      <code>no</code> era un booleano, que es el error famoso que convierte el
      código de país de Noruega en <code>false</code>. Esto lee 1.2, donde es la
      cadena que parece. En el otro sentido esas palabras se escriben de vuelta
      <em>entre comillas</em>, porque lo que abra el archivo después puede seguir
      siendo un lector de 1.1. <code>tests/js/text-convert.test.js</code>
      comprueba las dos mitades."""

[[privacy]]
title = "Una conversión que no puede ser honesta se detiene."
body = "JSON elimina los comentarios. Este analizador admite deliberadamente un subconjunto de YAML 1.2 y rechaza anclas, alias y etiquetas en vez de elegir su expansión o conversión de tipos. JSON representa un árbol de valores; YAML admite nodos compartidos y valores tipados. También rechaza varios documentos en vez de inventar una matriz. De JSON a YAML conserva los valores representados."

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google, y el botón de donación de Buy Me
      a Coffee. A ninguno se le entrega un carácter de tu texto. Cada línea que
      lo lee, lo analiza o lo escribe se sirve desde este origen y está en el
      repositorio."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconecta la red y la herramienta sigue
      igual, porque nunca hubo un paso de red en ella. Es la prueba más simple de
      todas."""

[[howto]]
title = "Elige el sentido."
body = """
 <em>YAML a JSON</em> o <em>JSON a
      YAML</em>. La nota bajo el menú dice lo que pierde ese sentido antes de que
      pegues nada, y no después."""

[[howto]]
title = "Pégalo, o suelta el archivo."
body = """
 Vale cualquier cosa que puedas
      seleccionar y copiar. Un archivo soltado sobre el selector lo lee tu propio
      navegador y lo pone en la caja &mdash; no hay paso de subida que omitir
      &mdash; y una extensión <code>.json</code> o <code>.yaml</code> te elige el
      sentido."""

[[howto]]
title = "Elige la indentación."
body = """
 Dos espacios, cuatro, o un tabulador.
      El tabulador se ofrece solo para JSON: YAML está definido en términos de
      espacios, y un tabulador no es indentación válida en él."""

[[howto]]
title = "Lee el error donde está el error."
body = """
 Un analizador que falla aquí
      dice qué encontró y en qué línea y columna, en lugar de &laquo;token
      inesperado en la posición 4193&raquo;. Eso suele bastar para arreglar un
      archivo de configuración sin abrir nada más."""

[[howto]]
title = "Llévate el resultado."
body = """
 Cópialo, o descárgalo como archivo, con el
      nombre del formato en el que salió."""

[[faq]]
q = "¿Se sube mi YAML a alguna parte?"
a = """
        No. Los dos analizadores y los dos impresores de esta página son
        funciones que corren en tu propio navegador, en tu propio hardware. Esta
        herramienta no tiene función de red de ninguna clase &mdash; nunca
        descarga nada y nunca envía nada &mdash; y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar, ninguna de las cuales es nuestra. Esa es
        la razón para usarlo con una configuración de despliegue: están llenas de
        nombres de host, nombres de bucket y de vez en cuando algún secreto que
        alguien pensaba mover, y pegar una en el conversor de otro es
        entregársela."""

[[faq]]
q = "¿Qué se pierde al convertir YAML a JSON?"
a = "JSON elimina los comentarios. Este analizador admite deliberadamente un subconjunto de YAML 1.2 y rechaza anclas, alias y etiquetas en vez de elegir su expansión o conversión de tipos. JSON representa un árbol de valores; YAML admite nodos compartidos y valores tipados. También rechaza varios documentos en vez de inventar una matriz. De JSON a YAML conserva los valores representados. <a href=\"https://yaml.org/spec/1.2.2/\">La especificación YAML</a> define el formato completo."

[[faq]]
q = "Mi YAML dice no y el JSON salió como cadena. ¿Por qué?"
a = "YAML 1.1 trataba <code>yes</code>, <code>no</code>, <code>on</code> y <code>off</code> como booleanos y convertía el código de Noruega en <code>false</code>. Este subconjunto usa YAML 1.2: esas palabras siguen siendo cadenas, <code>true</code> y <code>false</code> son booleanos, <code>null</code> y <code>~</code> son null y los escalares numéricos son números. El escritor YAML entrecomilla las palabras ambiguas para lectores con reglas antiguas."

[[faq]]
q = "¿Mantiene el orden de mis claves?"
a = """
        Sí, en los dos sentidos, y eso es más difícil de lo que parece. Un
        conversor construido sobre <code>JSON.parse</code> mueve en silencio al
        principio las claves que parecen enteros, así que
        <code>{"10":a,"2":b}</code> vuelve como <code>{"2":b,"10":a}</code>. Los
        números mantienen los dígitos que escribiste, así que un identificador de
        cuenta de veinte dígitos no pierde los tres últimos por un double. Si
        <em>quieres</em> que se ordenen hay una casilla, y ordena por cómo se leen
        las claves y no por sus puntos de código."""

[[faq]]
q = "¿Puede convertir varios documentos YAML a la vez?"
a = """
        No, y lo dice en lugar de elegir uno. Un archivo con separadores
        <code>---</code> contiene más de un documento, y JSON no tiene ninguna
        forma que signifique &laquo;varios documentos&raquo;: un array sería una
        afirmación que el archivo nunca hizo. Conviértelos de uno en uno."""

[[faq]]
q = "¿Por qué aquí no hay un formateador de YAML?"
a = """
        Porque YAML no tiene una forma comprimida que valga la pena escribir: la
        corta es el estilo de flujo, que es ilegible, y lo ilegible es lo
        contrario de la razón por la que se mantiene un archivo en YAML. Ordenar
        JSON, XML, HTML y CSS es el trabajo del
        <a href="../formatear-json/">formateador de JSON</a>, y ese también
        ordena YAML."""

[[faq]]
q = "¿De qué tamaño puede ser el archivo?"
a = """
        Aquí no hay ningún límite puesto, porque no hay un servidor pagándolo. El
        techo real es tu propio dispositivo: unos cuantos megabytes de YAML van
        bien, y con un documento muy largo la página espera a que hagas una pausa
        al escribir antes de convertirlo, en lugar de pelearte el teclado."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        límite de cuánto pegas. El sitio lleva publicidad, que es lo que lo paga;
        a los anuncios no se les da nada sobre tu texto."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y sigue
        funcionando. Esa es también la forma más simple de demostrar que no se
        sube nada: una herramienta que mandara tu configuración fuera para
        convertirla se pararía en el momento en que te desconectaras."""

