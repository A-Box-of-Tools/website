#
# Calculadora de aumentos - Spanish.
#
# Overrides for tools/magnification-calculator/tool.toml. Only words: the slug,
# the category, the icon and the list of shared parts stay where they are.
#
# What is engraved on an instrument stays as engraved: 8×42, 40×/0.65, 675×. A
# figure in a sentence takes the Spanish comma, 5,25 mm, so the two can stand
# in one paragraph and both are right.
#
# "Abertura" for a telescope and "apertura numérica" for an objective. Both are
# the usual terms, and keeping them apart keeps a reader from taking the width
# of a lens for the number after the slash. "Prismáticos" throughout, with
# "binoculares" once, in the question a reader on the other side of the
# Atlantic would type.
#

