[[howto]]
title = "Elige el instrumento y escribe lo que lleva impreso."
body = "Un telescopio lleva su abertura y su distancia focal, y cada ocular, su propia distancia focal. Unos prismáticos llevan dos números, como 8×42. Un objetivo de microscopio lleva su aumento y su apertura numérica, como 40×/0.65. Una lupa lleva un aumento, una distancia focal o unas dioptrías."
[[howto]]
title = "Arrastra el dial por las zonas."
body = "El dial cambia el aumento: en un telescopio o un microscopio cambia el ocular, y en unos prismáticos o una lupa, el aumento impreso. Su recorrido se colorea según los límites del propio instrumento. Fíjate en el veredicto al pasar de la máxima nitidez al tope útil y, después, al aumento vacío."
[[howto]]
title = "Compara las tres imágenes."
body = "La primera es el círculo completo por el que miras, con el objeto a escala real. La segunda es un primer plano de su centro, con la nitidez con que lo vería un buen ojo. La tercera es ese mismo primer plano sin instrumento, así que la diferencia entre las dos últimas es el aumento."
[[howto]]
title = "Lee qué significa cada número y luego comprueba los supuestos."
body = "El campo visual, la pupila de salida, el detalle más fino y la luz captada se calculan junto al resultado. Cambia el ancho de la pupila de tu ojo, el campo del ocular o la forma de contar el aumento de una lupa, y lee de dónde sale cada regla."

[[faq]]
q = "¿Qué significa 8×42 en unos prismáticos o binoculares?"
a = "El primer número es el aumento: las cosas se ven ocho veces más anchas, como si estuvieras ocho veces más cerca. El segundo es el ancho de cada lente frontal, 42 mm. Al dividir el segundo entre el primero se obtiene la pupila de salida, aquí 5,25 mm, que es el ancho del haz de luz que llega a tu ojo. Por eso unos 8×42 siguen dando una imagen brillante al anochecer y unos 8×21 no."
[[faq]]
q = "¿Cómo se calcula el aumento de un telescopio?"
a = "Divide la distancia focal del telescopio entre la del ocular. Un telescopio de 700 mm con un ocular de 10 mm da 70×, y una lente de Barlow 2× lo duplica. El telescopio no tiene un único aumento propio, así que una caja que anuncia uno está describiendo su ocular de focal más corta, y no la vista."
[[faq]]
q = "¿Cuál es el aumento máximo útil de un telescopio?"
a = "Unas dos veces la abertura en milímetros, o 50× por pulgada: 140× para un telescopio de 70 mm y 400× para uno de 200 mm. El detalle lo fija el ancho de la lente o del espejo, y en ese punto ya se ve todo con comodidad. Más allá, la imagen solo se hace más grande, menos nítida y más tenue, y a eso se le llama aumento vacío. El aire pone su propio techo de unos 300× la mayoría de las noches, por grande que sea el telescopio."
[[faq]]
q = "¿Es mejor un telescopio de 675× que uno de 100×?"
a = "No por ese número. Un telescopio de 60 mm vendido como 675× puede mostrar detalle real hasta unos 120×, y el resto es la misma borrosidad ampliada y oscurecida. Compara mejor las aberturas: la lente o el espejo más ancho muestra detalles más finos y objetos más débiles con cualquier aumento."
[[faq]]
q = "¿Con qué aumento se ven los anillos de Saturno o las lunas de Júpiter?"
a = "Con menos del que casi todo el mundo espera. Las cuatro lunas grandes de Júpiter se ven como puntos con unos prismáticos corrientes de 7× a 10×. Los anillos de Saturno aparecen desde unos 25× o 30× como un óvalo diminuto, y con 100× o más en un telescopio de 60 mm de abertura o más se ven claramente separados del planeta. Prueba los dos arriba: los planetas siguen viéndose pequeños, y así es como se ven de verdad."
[[faq]]
q = "¿Qué puedo ver con un microscopio a 40×, 100×, 400× y 1000×?"
a = "A 40× la vista mide unos 4,5 mm de ancho: cristales de sal, las partes de un insecto, la trama de una tela. A 100× mide 1,8 mm: células vegetales como las de la piel de cebolla, y un cabello como un cable grueso. A 400× mide 0,45 mm: células individuales con su núcleo, y glóbulos rojos como pequeños discos. A 1000× con un objetivo de inmersión en aceite mide 0,18 mm: bacterias como bastones y puntos bien definidos. Estos anchos suponen un ocular corriente de 10× con un número de campo de 18 mm."
[[faq]]
q = "¿Por qué a veces 1000× no muestran nada nuevo?"
a = "Porque el detalle de un microscopio lo fija la apertura numérica del objetivo, el número que va tras la barra, y no el aumento total. El intervalo útil va de unas 500 a 1000 veces ese número, es decir, de 325× a 650× para un objetivo 40×/0.65. Llegar con él a 1000× mediante un ocular de 25× solo agranda la borrosidad. Un objetivo 100×/1.25 de inmersión en aceite llega a los mismos 1000× y separa detalles de más o menos la mitad de tamaño."
[[faq]]
q = "¿Qué es la pupila de salida?"
a = "El ancho del haz de luz que sale del ocular y entra en tu ojo: la abertura dividida entre el aumento. Si es más ancho que tu propia pupila, unos 7 mm en la oscuridad y de 2 a 3 mm a la luz del día, la luz sobrante no entra en el ojo. Por debajo de 1 mm, más o menos, la vista empieza a perder nitidez y brillo, y con menos de medio milímetro ya estás en el aumento vacío."
[[faq]]
q = "¿Qué relación hay entre el aumento de una lupa, las dioptrías y la distancia focal?"
a = "La distancia focal en milímetros es 1000 dividido entre las dioptrías, y el aumento es 250 mm dividido entre la distancia focal, así que una lupa de joyero de 10× tiene una distancia focal de 25 mm y 40 dioptrías. Las lámparas lupa y las lupas de lectura marcadas en dioptrías suelen contarse sumando uno, con el ojo enfocado de cerca: +3 dioptrías se venden como 1,75×, y una lente de +20 dioptrías como 6×, o como 5× si el fabricante no lo suma. Las lentes más potentes tienen que ser más pequeñas y sostenerse más cerca: una lupa de joyero de 10× trabaja a unos 25 mm del objeto."
[[faq]]
q = "¿Es lo mismo un zoom de 10× en una cámara que unos prismáticos de 10×?"
a = "No. El número de zoom de una cámara es la relación entre su distancia focal más larga y la más corta, así que un objetivo de 24&ndash;240 mm es 10× muestre lo que muestre. Comparado con tu ojo, y tomando 50 mm como la vista normal en una cámara de formato completo, ese objetivo va de más o menos la mitad del tamaño real a unos 5×. Los prismáticos y los telescopios indican su aumento respecto al propio ojo."
[[faq]]
q = "¿Significan lo mismo los 1000× de un microscopio USB?"
a = "Es una cuenta distinta. La cifra de un microscopio digital es el tamaño de la imagen en una pantalla dividido entre el tamaño del objeto, así que crece con el monitor y no dice nada del detalle. Lo que puede separar lo sigue fijando su lente. Su campo visual es mejor guía: un instrumento que muestra una zona de unos 2 mm de ancho trabaja más o menos al nivel de un microscopio óptico de 100×, diga lo que diga la caja."
[[faq]]
q = "¿Las imágenes son fotografías?"
a = "No. Son dibujos hechos en la página a partir de los números. Los tamaños están a escala real, la falta de nitidez es la propia del instrumento a esa escala y la pérdida de brillo depende de la pupila de salida. Los mares y los cráteres más grandes de la Luna, las lunas de Júpiter, los anillos de Saturno y las Pléyades más brillantes están situados según cifras publicadas, y los cráteres menores, las células y las plumas son ilustración. Una vista real depende además del aire, de la calidad de la óptica y de tus propios ojos."
[[faq]]
q = "¿La herramienta funciona sin conexión?"
a = "Sí. Una vez cargada la página, todos los cálculos y dibujos funcionan sin conexión. Nada de lo que escribes se sube ni se guarda."

