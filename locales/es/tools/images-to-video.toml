[[privacy]]
title = "El procesamiento se hace en este navegador."
body = "La herramienta procesa entradas y resultados en el navegador. Su código no los sube para procesarlos. Content-Security-Policy limita recursos y destinos, pero los hosts permitidos pueden recibir solicitudes: no inspecciona sus datos ni prueba por sí sola que nada se envíe. Compara código y solicitudes de la operación concreta o complétala desconectado."

[[privacy]]
title = "La codificación es local."
body = """
 WebCodecs funciona dentro de tu navegador y el
      archivo terminado va directo a una descarga. Esta aplicación no tiene parte
      de servidor."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. A ninguno se le entrega nada
      sobre tus imágenes: ni un archivo, ni una miniatura, ni un nombre, ni un
      tamaño, ni un recuento. Cada línea que lee, descodifica, compone o codifica
      una imagen se sirve desde este origen y está en el repositorio."""

[[privacy]]
title = "El botón de donación no carga nada y no recibe nada."
body = """

      El botón «Buy me a coffee» de la cabecera lo dibuja esta misma página y
      no carga nada de ningún sitio. No es más que un
      enlace: no avisa de ninguna visita, y no se le entrega nada sobre ti ni
      sobre tus imágenes. Si no lo pulsas no ocurre nada, y lo que hay al otro
      lado es un sitio ajeno."""

[[privacy]]
title = "Una excepción deliberada."
body = """
 Si usas «Añadir desde una dirección web»,
      se contacta con ese servidor para traer la imagen y verá tu dirección IP.
      Solo se descargan las imágenes que pegues tú, y solo hacia dentro:
      <code>img-src</code> se abre, <code>connect-src</code> no. El contador de
      abajo lista todos los orígenes externos con los que se ha contactado."""

[[privacy]]
title = "Funciona sin conexión."
body = """
 Desconéctate de la red y sigue funcionando
      todo menos la carga desde una dirección web. Es la prueba más sencilla de
      todas."""

[[howto]]
title = "Elige tus imágenes."
body = """
 Arrastra una carpeta entera hasta el
      selector, o busca los archivos a mano. El navegador los lee directamente
      del disco, y mientras lo haces no sale nada hacia ninguna parte."""

[[howto]]
title = "Elige fotogramas para una secuencia o segundos para una presentación."
body = " Usa «Ordenar por nombre» para fotogramas de render numerados y comprueba la primera y la última miniatura. Deja un fotograma por imagen para una secuencia de render o un timelapse de fotos, y ajusta la frecuencia de fotogramas a tu fuente. Para una presentación, cambia a segundos, escribe una duración como tres y pulsa «Aplicar a todas». Arrastra para reordenar o cambia la duración de una imagen concreta."

[[howto]]
title = "Elige una resolución y una cadencia."
body = " Elige 1080p para una primera exportación, o usa la forma cuadrada o vertical del destino. «Igualar la resolución más alta» toma la mayor anchura y la mayor altura de todas las imágenes. «Encajar dentro» conserva la imagen entera; «Llenar el fotograma» recorta los bordes. Comprueba el resumen de duración y tamaño de salida antes de codificar."

[[howto]]
title = "Crea el vídeo y descárgalo."
body = """
 La codificación la hace tu propio
      hardware, así que lo que tarde depende de tu dispositivo y no de una cola.
      El MP4 terminado va directo a las descargas del navegador."""

[[faq]]
q = "¿Se suben mis imágenes a alguna parte?"
a = """
        No. Tu propio navegador las lee, las compone y las codifica, todo en tu
        propio hardware. Esta herramienta no tiene parte de servidor, y la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, ninguna de este sitio. La única
        excepción es la función opcional de «añadir desde una dirección web», que
        descarga una imagen que has pegado tú, y ese servidor sí ve tu dirección
        IP."""

[[faq]]
q = "¿Qué formatos de imagen puedo usar?"
a = """
        Cualquier formato de imagen fija que el navegador sepa descodificar, que
        en la práctica son JPG, PNG, WebP, GIF, AVIF y, en dispositivos Apple,
        HEIC. Aquí no hay otra lista que mantener al día, porque descodificar es
        trabajo del navegador y no nuestro."""

[[faq]]
q = "¿Qué formato de vídeo produce?"
a = " El formato preferido es MP4 con vídeo H.264. La alternativa graba en tiempo real, normalmente como WebM, que aceptan menos editores. Mantén la pestaña visible durante esa grabación; los tiempos son aproximados y pueden saltarse imágenes si la decodificación se retrasa. Usa el codificador MP4 para secuencias numeradas exactas cuando tu navegador lo admita."

[[faq]]
q = "¿Puedo usar esto para una secuencia de render de Blender o After Effects?"
a = """
        Sí, una secuencia de render numerada es exactamente para lo que está esto.
        Añade los fotogramas que escribió tu motor de render, deja la duración en
        un fotograma cada uno y pon la misma cadencia que el render. «Ordenar por
        nombre» cuenta como esperarías, así que <code>frame_2</code> cae antes de
        <code>frame_10</code> y no después.
        <br><br>
        Una cosa que conviene saber antes de empezar: el H.264 no tiene canal
        alfa, así que la transparencia se aplana sobre el color de fondo en vez de
        conservarse. Si necesitas mantener el alfa, compón los fotogramas en tu
        editor."""

[[faq]]
q = "¿Puedo hacer un timelapse con fotos?"
a = " Sí, y es el mismo trabajo que una secuencia de render: deja cada foto en un solo fotograma y elige una cadencia. A 30 fps, cada treinta fotos son un segundo de vídeo; a 12 fps, esas mismas fotos duran dos segundos y medio. <br><br> «Ordenar por fecha» usa las fechas de modificación de los archivos, que pueden cambiar al copiar o editar las fotos. Comprueba el orden cuando los nombres de archivo hayan vuelto a empezar en 0001. Las fotos de distintos tamaños no son un problema, porque «Igualar la resolución más alta» parte de la mayor anchura y la mayor altura, luego limita el lado más largo a 7680 píxeles y redondea a dimensiones pares. Comprueba el resumen del tamaño de salida; los originales muy grandes aún pueden reducirse."

[[faq]]
q = "¿Hay algún límite de cuántas imágenes o de cuánto puede durar el vídeo?"
a = " No hay un límite fijo de imágenes, pero las exportaciones MP4 deben quedar por debajo de 4 GiB (unos 4,3 GB). El vídeo terminado se monta en la memoria antes de la descarga, así que tu dispositivo puede quedarse sin memoria mucho antes de ese tope. El codificador del navegador también limita las dimensiones de salida. Si falla una exportación grande, reduce la resolución, acorta la secuencia o divídela en partes."

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba. El
        sitio lleva publicidad, que es lo que lo paga, y a los anuncios no se les
        da nada sobre tus imágenes."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus imágenes fuera a procesar se
        pararía en cuanto desenchufaras."""

[[faq]]
q = "¿Puedo añadir música o una banda sonora?"
a = """
        Todavía no. La herramienta produce solo vídeo: el MP4 que escribe lleva
        una única pista de vídeo y ninguna de audio. Si la necesitas, añade la
        banda sonora después, en un editor de vídeo."""

