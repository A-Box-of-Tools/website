[[privacy]]
title = "Tus vídeos no tienen adónde ir."
body = """
 La
      Content-Security-Policy enumera todas las direcciones a las que esta
      página puede conectarse, y ninguna es de este sitio. Aquí no hay ningún
      destino donde recoger tu archivo, ni una línea de código que lo mandara si
      lo hubiera."""

[[privacy]]
title = "Aquí nada le pide nada a la red."
body = """
 Esta herramienta no tiene ninguna
      función de red: no hay dirección que pegar, ni nada que descargar, ni
      ningún motor que se baje la primera vez que la usas. Cada byte que toca tu
      vídeo llegó desde este origen al cargarse la página."""

[[privacy]]
title = "La descodificación y la codificación son locales."
body = """
 Los fotogramas pasan
      por WebCodecs dentro de tu navegador, o por el mismo motor de reproducción
      que te enseñaría el clip de todas formas. El archivo terminado se monta en
      la memoria de este dispositivo y va directo a una descarga."""

[[privacy]]
title = "La mayor parte del archivo ni siquiera se lee."
body = """
 Un timelapse
      necesita un fotograma cada pocos segundos, así que la herramienta lee el
      tramo corto de archivo que rodea a cada uno y se salta el resto. Es una
      decisión de velocidad y no de privacidad, pero conviene saberlo igualmente:
      incluso aquí, en tu dispositivo, la mayor parte de tu vídeo no llega a
      abrirse."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = """
 Los scripts de
      publicidad y de medición vienen de Google. A ninguno se le entrega nada
      sobre tu vídeo: ni un archivo, ni un fotograma, ni un nombre, ni un tamaño,
      ni una duración. Cada línea que lee, descodifica, elige o codifica se sirve
      desde este origen y está en el repositorio."""

[[privacy]]
title = "Qué carga el botón de donación, y qué no llega a ver."
