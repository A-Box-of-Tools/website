[[howto]]
title = "Elige un vídeo."
body = """
 Arrastra un MP4, MOV, M4V o WebM
      hasta el selector, o busca uno a mano. El navegador lo lee directamente
      del disco, y mientras lo haces no sale nada hacia ninguna parte."""

[[howto]]
title = "Di cuánto más rápido."
body = """
 Pulsa una de las velocidades o
      escribe la tuya. Si prefieres decir cuánto debe durar el resultado, por
      ejemplo «que quepa en veinte segundos», escríbelo y la velocidad sale
      sola."""

[[howto]]
title = "Comprueba el intervalo."
body = """
 La línea que hay debajo de la
      velocidad dice lo que va a pasar de verdad: un fotograma cada tantos
      segundos del original. Es el número que se pondría en una cámara, y el que
      conviene mirar dos veces antes de empezar."""

[[howto]]
title = "Créalo y descárgalo."
body = """
 El trabajo ocurre en tu propio
      hardware, así que lo que tarde depende de tu dispositivo y no de ninguna
      cola. El vídeo terminado va directo a las descargas del navegador."""

[[faq]]
q = "¿Se sube mi vídeo a alguna parte?"
a = """
        No. Tu propio navegador lo lee, lo descodifica, elige los fotogramas y
        los codifica en tu propio hardware. Esta herramienta no tiene parte de
        servidor, y la <code>Content-Security-Policy</code> de la página enumera
        todas las direcciones a las que puede conectarse: ninguna es de este
        sitio. Si prefieres comprobarlo a que te lo cuenten, desconéctate de
        internet y crea un timelapse igualmente."""

[[faq]]
q = "¿Qué significa exactamente la velocidad?"
a = """
        La proporción entre lo que entra y lo que sale. A 60&times; una hora de
        grabación se queda en un minuto, sea cual sea la cadencia a la que lo
        reproduzcas. Por debajo, la herramienta toma un fotograma cada
        <em>velocidad &divide; fotogramas por segundo</em>: 60&times; a 30
        fotogramas por segundo es uno cada dos segundos. La página te enseña ese
        intervalo antes de empezar, porque es el número que dice lo que está
        pasando de verdad."""

[[faq]]
q = "¿Qué formatos de vídeo puedo acelerar?"
a = """
        MP4, M4V y MOV se leen directamente, lleven lo que lleven dentro: H.264,
        HEVC, AV1 o VP9, siempre que tu navegador sepa descodificar ese códec.
        Todo lo demás que tu navegador pueda reproducir, sobre todo WebM, se lee
        llevando el reproductor a cada instante, lo cual funciona con cualquier
        formato que sepa abrir. Un archivo que el navegador no pueda ni leer ni
        reproducir, que en la práctica es AVI, WMV, FLV y casi cualquier MKV, se
        rechaza con un mensaje que lo dice, en lugar de fallar a medio camino. Lo
        que sale siempre es un MP4."""

[[faq]]
q = "¿Por qué el timelapse no tiene sonido?"
a = """
        Porque no hay nada que merezca la pena conservar. El sonido a treinta
        veces su velocidad no es voz ni música, es un pitido; y la alternativa,
        dejar el audio a su velocidad original debajo de una imagen que se le ha
        adelantado, sería un clip distinto del que has pedido. Así que la pista
        se descarta, y eso explica buena parte de que una hora de vídeo salga en
        unos pocos megabytes. Si lo que quieres es el audio por separado, el
        <a href="../editar-audio/">Editor de audio</a> lo guarda."""

[[faq]]
q = "¿Es más rápido que convertir el vídeo entero?"
a = """
        Mucho más, y para eso se lee el archivo directamente. Un fotograma solo
        se puede descodificar empezando por el fotograma clave que lo precede,
        pero nada obliga a conservar los que hay en medio: un timelapse a
        60&times; de una hora descodifica unos pocos miles de fotogramas en lugar
        de cien mil. El resumen te dice cuántos leerá exactamente antes de que
        pulses el botón."""

[[faq]]
q = "¿Se pierde calidad?"
a = """
        Los fotogramas que se conservan se codifican una segunda vez, y eso
        cuesta algo. No hay forma de evitarlo, porque el clip terminado los
        enseña en momentos para los que no había nada codificado en el archivo
        original. En lo que esta herramienta sí gasta más que las demás
        herramientas de vídeo de aquí es en el bitrate, y a propósito: dos
        fotogramas separados por dos segundos tienen mucho menos en común que dos
        separados por una treintava parte de segundo, así que el códec tiene
        menos que reaprovechar y una cifra pensada para grabaciones normales
        saldría con bloques."""

[[faq]]
q = "¿Hay algún límite de tamaño o de duración?"
a = """
        La herramienta no lleva ninguno, y el archivo tampoco entra entero en
        memoria: se leen tramos cortos alrededor de cada instante y nada más. El
        techo práctico es el timelapse terminado, que se monta en memoria antes
        de que lo descargues, y un timelapse es corto por definición. El resumen
        te enseña aproximadamente cuánto va a ocupar antes de empezar."""

[[faq]]
q = "¿Puedo acelerar solo una parte del clip?"
a = """
        Aquí no. Esta herramienta coge el clip entero, del primer fotograma al
        último. Recorta antes el trozo que quieras con el
        <a href="../cortar-video/">Cortador de vídeo</a>, que lo hace sin volver
        a codificar ni un fotograma, y acelera lo que salga de ahí."""

[[faq]]
q = "¿Es gratis? ¿Hace falta una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni registro, ni prueba, ni marca de agua. El
        sitio se paga con publicidad, y a los anuncios no se les entrega nada
        sobre tu vídeo."""

