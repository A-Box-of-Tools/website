 La
      Content-Security-Policy nombra todas las direcciones que esta página puede
      contactar, y ninguna de ellas es nuestra. Aquí no hay ningún destino donde
      pudiera recogerse un token pegado, ni nada en el código que lo enviara si lo
      hubiera."""

[[privacy]]
title = "Aquí nada pide nada."
body = """
 En <code>src/</code> no hay ningún
      <code>fetch</code>, ningún <code>XMLHttpRequest</code> y ningún
      <code>sendBeacon</code>. Cada analizador, cada codificador y la comparación son
      funciones de esta página que reciben una cadena y devuelven una cadena."""

[[privacy]]
title = "Los formateadores conservan lo que se les dio."
body = """
 Un objeto JSON vuelve con sus
      claves en el orden en que las escribiste y sus números escritos como los
      escribiste tú, porque <code>src/json.js</code> es un analizador y no una llamada
      a <code>JSON.parse</code>, que reordena las claves que parecen enteros y
      convierte un identificador de veinte cifras en el doble más cercano. Las pruebas
      de <code>tests/js/text-format.test.js</code> comprueban exactamente eso."""

