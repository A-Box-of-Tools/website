[[privacy]]
title = "Tus imágenes no tienen adónde ir."
body = "La Content-Security-Policy enumera todas las direcciones a las que esta página puede conectarse, y ninguna es de este sitio. Aquí no hay ningún destino donde recoger tus archivos, ni una línea de código que los mandara si lo hubiera."

[[privacy]]
title = "El decodificador ya está instalado; no hace falta un servidor."
body = "Los navegadores publicados desde 2020 leen WebP y escriben JPEG desde mucho antes. Esta herramienta no incluye un motor ni descarga nada al estrenarse. No necesita un servidor, aunque otros conversores pidan subir el archivo. El <a href=\"/es/convertir-heic-a-jpg/\">conversor HEIC</a> sí incluye un códec, porque solo Safari abre ese formato de forma nativa, y lo explica en su página."

[[privacy]]
title = "Las partes transparentes y el color que las sustituye."
body = "WebP admite transparencia y JPEG no tiene canal alfa, así que hay que poner un color debajo. Aquí lo eliges, con blanco por defecto. Solo se pregunta si los píxeles decodificados tienen transparencia; no se supone por el formato. Un conversor que no pregunta puede elegir negro, de donde salen esos logotipos con fondo negro."

[[privacy]]
title = "Lo que el lienzo no conserva."
body = "La imagen se decodifica y dibuja en un lienzo que solo guarda píxeles. EXIF, perfiles ICC, XMP y bloques de derechos de autor se pierden. Para algunas personas es útil y para otras supone una pérdida, por eso se avisa. Para consultar o editar metadatos sin recomprimir, usa el <a href=\"/es/eliminar-datos-exif/\">Visor y eliminador de EXIF</a>."

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = "Los scripts de publicidad y medición vienen de Google, y el botón de donación, de Buy Me a Coffee. No reciben información sobre tus imágenes. Todo el código que lee, decodifica o escribe un archivo se sirve desde este origen y está en el repositorio."

[[privacy]]
title = "Funciona sin conexión."
body = "Carga la página una vez y desconéctate: funciona igual. Es la comprobación más sencilla. Un conversor que enviara tus imágenes a otro lugar no podría hacerlo."

[[howto]]
title = "Elige los archivos WebP."
body = "Suéltalos o búscalos. Se identifican por sus primeros bytes, no por el nombre: un WebP llamado &ldquo;.jpg&rdquo; funciona; un PNG se rechaza indicando su formato real, en lugar de generar una copia innecesaria."

[[howto]]
title = "Lee la información de cada archivo."
body = "La lista muestra tamaño y dimensiones, y avisa si el WebP es sin pérdida, tiene transparencia o es animado. Cada aviso solo aparece cuando corresponde."

[[howto]]
title = "Elige la calidad y el color que sustituirá la transparencia."
body = "El control empieza en 92, donde una foto resulta difícil de distinguir del original. El campo de color solo aparece si algún archivo tiene transparencia, porque el JPEG debe rellenarla."

[[howto]]
title = "Pulsa &ldquo;Convertir&rdquo; y descarga."
body = "Cada resultado indica el origen, el tamaño nuevo y la diferencia. También avisa si se rellenó la transparencia o solo se guardó el primer fotograma. Un archivo tiene botón de descarga; varios también permiten un ZIP."

[[faq]]
q = "¿Se sube mi imagen a alguna parte?"
a = "No. El navegador lee, decodifica y escribe el archivo en tu dispositivo. La herramienta no pide ni envía nada por la red. La <code>Content-Security-Policy</code> enumera las direcciones permitidas y ninguna pertenece a este sitio. A diferencia del conversor HEIC, ni siquiera necesita cargar un decodificador: ya está en el navegador."

[[faq]]
q = "¿Para qué convertir WebP a JPG?"
a = "Para usarlo en programas que aún no admiten WebP. Es un formato pequeño y habitual al guardar imágenes de la web, pero versiones antiguas de Office y Photoshop, algunos estudios de impresión, formularios que miran la extensión, lectores electrónicos y programas de cámaras o impresoras pueden rechazarlo. JPG tiene una compatibilidad mucho más amplia."

[[faq]]
q = "¿Qué pasa con las partes transparentes?"
a = "Se rellenan con el color que elijas y se avisa antes de convertir. JPEG no tiene canal alfa: la transparencia no puede conservarse. Blanco es el valor inicial porque suele servir para un logotipo en un documento. Si necesitas conservarla, guarda el WebP o conviértelo a PNG con el <a href=\"/es/comprimir-imagen/\">Compresor de imágenes</a>, que escribe PNG, WebP y JPEG."

[[faq]]
q = "¿Convierte un WebP animado?"
a = "Convierte el primer fotograma y lo avisa tanto antes como después. JPEG solo contiene una imagen. Para extraer todos los fotogramas o convertir la animación a vídeo, puedes usar <a href=\"/es/separar-gif-en-fotogramas/\">Separar un GIF</a> y <a href=\"/es/convertir-gif-a-mp4/\">GIF a MP4</a> una vez que la animación esté en formato GIF."

[[faq]]
q = "¿Se vuelve a comprimir la imagen?"
a = "Sí. WebP y JPEG son códecs distintos, así que hay que decodificar y volver a codificar. Todos los conversores lo hacen, incluidos los que piden subir el archivo. El control empieza en 92, donde una foto es difícil de distinguir del original. Si el WebP era sin pérdida, el JPEG será su primera copia con pérdida; la lista lo avisa para que puedas decidir."

[[faq]]
q = "¿El JPG pesará más que el WebP?"
a = "A menudo sí, y el resultado muestra cuánto. WebP comprime mejor que JPEG con calidad visual similar, por eso se usa tanto en la web. Cambias tamaño por compatibilidad. Si después necesitas reducirlo, el <a href=\"/es/comprimir-imagen/\">Compresor de imágenes</a> permite fijar el tamaño objetivo."

[[faq]]
q = "¿Conserva la fecha, la cámara y la ubicación?"
a = "No. El lienzo solo guarda píxeles: EXIF, GPS, perfiles de color y XMP quedan fuera. Muchos WebP de la web ya vienen sin esos datos. Para verlos o editarlos sin recomprimir la imagen, usa el <a href=\"/es/eliminar-datos-exif/\">Visor y eliminador de EXIF</a>."

[[faq]]
q = "¿Puedo convertir una carpeta entera?"
a = "Sí. No hay límite de cantidad ni tamaño porque no hay un servidor que los procese. Cada archivo tiene su fila y descarga; con dos o más también puedes descargar un ZIP. Si se repiten nombres, se añade un número antes de la extensión para no reemplazar ninguno."

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = "Es gratis: sin cuenta, inicio de sesión, prueba ni marca de agua. La publicidad paga el sitio y no recibe información sobre tus imágenes."

[[faq]]
q = "¿Funciona sin conexión?"
a = "Sí. Carga la página una vez y desconéctate: seguirá funcionando igual. Es una comprobación directa de que no se sube nada. Un conversor que enviara los archivos a un servidor dejaría de funcionar sin red."

