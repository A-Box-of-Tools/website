[[privacy]]
title = "Una fotografía de tu cara no sale nunca de este equipo."
body = """
 Aquí eso pesa más
      que en casi cualquier otra herramienta: el archivo que maneja esta página es una
      imagen de tu cara, y lo que estás a punto de hacer con ella nombra además el
      país cuyo documento estás solicitando. La
      <code>Content-Security-Policy</code> nombra todas las direcciones que esta
      página puede contactar, y ninguna de ellas es nuestra. Aquí no hay ningún
      destino donde pudiera recogerse tu fotografía."""

[[privacy]]
title = "Aquí nada pide nada."
body = """
 En <code>src/</code> no hay ningún
      <code>fetch</code>, ningún <code>XMLHttpRequest</code> y ningún
      <code>sendBeacon</code>. El reglamento es una tabla en
      <code>src/specs.js</code>, servida con la página y guardada en caché con ella:
      no hay ninguna lista de países que consultar ni nada contra lo que comprobar tu
      foto en remoto."""

[[privacy]]
title = "No hay detección de caras, y es a propósito."
body = """
 Los cuatro puntos desde los
      que se miden las normas los arrastras tú. Detectarlos significaría enviar un
      modelo y ejecutarlo sobre una imagen de tu cara, y un modelo que se equivoca se
      equivoca de forma desigual: peor con unas caras que con otras. Cuatro puntos
      cuestan ocho segundos y son exactos para todo el mundo."""

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
