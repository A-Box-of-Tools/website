[[howto]]
title = "Elige la fotografía."
body = """
 Una foto de móvil contra una pared lisa,
      con luz de día, hecha a metro y medio más o menos. El navegador la lee
      directamente de tu disco, y mientras tanto no sale nada a ninguna parte."""

[[howto]]
title = "Elige el país y el documento."
body = """
 El panel enseña entonces el tamaño de
      impresión, la banda de altura de cabeza, la línea de ojos, el color de fondo y
      los límites de subida de esa norma, junto con la autoridad de la que salió cada
      cifra y la fecha en que se leyó. Nada de esa lista está supuesto, y cualquier
      cosa que te hayan mandado y que no esté en ella entra por «En cualquier otro
      sitio»."""

[[howto]]
title = "Arrastra los cuatro puntos sobre tu cara."
body = """
 Coronilla, barbilla y cada
      pupila. Esos cuatro puntos son todo lo que mide la norma, y por eso esta
      herramienta te los pide en vez de adivinarlos. Después pulsa <em>Ajustar el
      recuadro</em> y el recorte cae donde ese país lo quiere."""

[[howto]]
title = "Lee las cuatro comprobaciones, y el fondo."
body = """
 Altura de cabeza, línea de
      ojos, centrado e inclinación, cada uno medido sobre el recuadro tal como está y
      cada uno diciendo hacia dónde arrastrar si se sale. El fondo se lee de la parte
      de arriba y de los lados del recorte y se compara con el color que pide la
      norma; la falta de uniformidad, que es lo que de verdad hace que rechacen las
      fotos, se mide aparte del color."""

[[howto]]
title = "Llévate los tres archivos."
body = """
 La impresión, a los milímetros exactos y
      con la resolución escrita dentro del archivo para que una tienda la imprima al
      tamaño correcto. La hoja, con tantas copias como quepan en un
      10&nbsp;&times;&nbsp;15 y marcas de corte en los huecos. Y la subida, al tamaño
      en píxeles que exige el portal y dentro de la banda de KB que impone por los dos
      extremos."""

[[faq]]
q = "¿Se sube mi foto a alguna parte?"
a = """
        No. La imagen la decodifica, la recorta, la mide y la escribe tu propio
        navegador en tu propio equipo, con el codificador JPEG que el navegador ya
        trae. Esta herramienta no tiene ninguna función de red: nunca pide nada y nunca
        envía nada, y la <code>Content-Security-Policy</code> de la página nombra todas
        las direcciones que puede contactar, ninguna de las cuales es nuestra. Aquí eso
        vale más que en casi cualquier otra herramienta: el archivo es una fotografía
        de tu cara."""

[[faq]]
q = "¿Qué países están cubiertos?"
a = """
        Las especificaciones transcritas hasta ahora son la propia norma de la OACI,
        Estados Unidos (pasaporte y la inscripción en la lotería de visados, que tienen
        reglas de subida distintas), el Reino Unido, el visado Schengen, Alemania,
        Canadá, Australia, la India (pasaporte, la copia de
        35&nbsp;&times;&nbsp;45&nbsp;mm y la foto y la firma de los formularios SSC y
        UPSC), China y Japón. Cada entrada nombra la autoridad de la que salió y la
        fecha en que se leyó. Todo lo demás entra por «En cualquier otro sitio», donde
        cada cifra la escribes tú; y como casi todo el mundo emite siguiendo la
        geometría de la OACI, esa entrada arranca con ella."""

[[faq]]
q = "¿Por qué me pide marcar mi propia cara en vez de encontrarla?"
a = """
        Porque encontrar una cara significa enviar un modelo: pesos que descargar, un
        entorno de inferencia para ejecutarlos y un modo de fallo desigual. Los
        detectores son medidamente peores con unas caras que con otras, y las personas
        cuyas fotografías ya se rechazan más a menudo serían precisamente las que
        saldrían perdiendo. Cuatro puntos arrastrados cuestan unos ocho segundos, son
        exactos y son los mismos ocho segundos para todo el mundo. El detector de caras
        experimental del navegador habría funcionado en un navegador y detrás de una
        opción oculta, y eso no es una función: es una herramienta que funciona distinto
        según con qué la abras."""

[[faq]]
q = "¿Qué es la regla de la altura de cabeza, y por qué la mía no la cumple nunca?"
a = """
        Todas estas especificaciones dicen cuánto del encuadre tiene que ocupar la
        cabeza, medida desde la base de la barbilla hasta lo más alto de la cabeza,
        pelo incluido; suele ser entre el 70 y el 80 por ciento, que para una foto de
        45&nbsp;mm son de 31,5 a 36&nbsp;mm. El motivo habitual del fallo es el selfi:
        un brazo mide unos 60&nbsp;cm, lo que deforma la cara y deja la cabeza
        demasiado grande en el encuadre. El segundo motivo habitual es la coronilla: es
        lo más alto del pelo, no el nacimiento del pelo, y marcar el nacimiento hace que
        todas las cabezas salgan pequeñas."""

[[faq]]
q = "¿Por qué el archivo tiene que pesar al menos 20 KB, y cómo se puede rellenar?"
a = """
        Los portales de exámenes de la India, el formulario de visado chino y la subida
        del pasaporte británico indican un tamaño mínimo además de un máximo, porque un
        archivo por debajo suele ser una miniatura que alguien subió por error. Una
        fotografía de 200&nbsp;&times;&nbsp;230 tiene 46.000 píxeles, y con la mejor
        calidad que un navegador vaya a escribir todavía puede quedarse en 15&nbsp;KB,
        sin forma de hacerla más grande comprimiendo menos. Así que la herramienta añade
        un segmento de comentario JPEG lleno de espacios. Eso forma parte del estándar
        JPEG, cualquier decodificador se lo salta y la imagen es bit a bit la misma
        imagen: lo único más largo es el archivo. El relleno dice exactamente eso, en
        inglés, dentro del propio archivo."""

[[faq]]
q = "¿Comprueba el fondo, y puede sustituirlo?"
a = """
        Lo comprueba y no lo sustituye. El color se lee de una franja a lo ancho de la
        parte superior del recorte y por cada lado, por encima de los hombros, y se
        compara con el color de la norma en CIE Lab y no en RGB: dos grises separados
        por cuarenta unidades RGB son indistinguibles, y cuarenta unidades de azul son
        otro color. La falta de uniformidad se mide aparte, porque una sombra en una
        pared blanca es lo que de verdad hace que rechacen fotografías, y eso no es un
        problema de color. Sustituir un fondo significa recortar a una persona de una
        imagen, que es un modelo de segmentación, y uno malo se come el pelo. Ponerte
        medio metro más lejos de la pared arregla más de estos casos que cualquier
        filtro."""

[[faq]]
q = "¿Para qué es la hoja de 10 x 15?"
a = """
        Una cabina cobra varios euros por seis fotografías. Un mostrador de fotos
        imprime un 10&nbsp;&times;&nbsp;15 por céntimos, y eso lo hace cualquiera. Así
        que la herramienta coloca tantas copias de tu foto como quepan en el papel
        &mdash; ocho, para un 35&nbsp;&times;&nbsp;45 en un 10&nbsp;&times;&nbsp;15
        &mdash; con marcas de corte en los huecos y sin imprimir nada encima de una
        imagen. No se escala nada: cada copia tiene exactamente el tamaño que pide la
        norma, porque una hoja que las encogiera un dos por ciento para meter una más
        serían ocho fotografías del tamaño equivocado. Imprímela al 100 por cien;
        «ajustar a la página» es lo que hace que una hoja salga mal."""

[[faq]]
q = "¿Por qué importan los DPI si los píxeles son los mismos?"
a = """
        Porque un JPEG puede decir de qué tamaño es, y si no lo dice, lo que lo imprima
        se lo inventa. La resolución vive en la cabecera JFIF, y un lienzo de navegador
        escribe esa cabecera con el campo de unidades puesto en «esto es una proporción,
        no una resolución». Esta herramienta reescribe esos pocos bytes para que el
        archivo diga 300&nbsp;dpi, que es lo que convierte 413&nbsp;&times;&nbsp;531
        píxeles en una fotografía de 35&nbsp;&times;&nbsp;45&nbsp;mm y no en una imagen
        sin tamaño determinado. Para eso no se decodifica nada y no se gasta calidad."""

[[faq]]
q = "¿Puede hacer también el archivo de la firma?"
a = """
        Sí: los formularios SSC y UPSC la quieren a 140&nbsp;&times;&nbsp;60 píxeles y
        entre 10 y 20&nbsp;KB, y está en la lista como especificación propia. La guía de
        la cara se apaga para ella, porque una firma no tiene línea de ojos, y lo que se
        comprueba en su lugar es que el papel sea claro, que haya tinta encima y que el
        recorte no se haya llevado una raya del cuaderno o el borde de la página. Llegar
        a los 10&nbsp;KB es la parte difícil de esa regla, no quedarse por debajo de
        20."""

[[faq]]
q = "¿Esto garantiza que me acepten la solicitud?"
a = """
        No, y ninguna herramienta puede garantizarlo con honestidad. Lo que hace es
        aplicar las cifras publicadas exactamente y enseñarte cada medición que ha
        hecho, para que lo que un formulario mide automáticamente &mdash; tamaño en
        píxeles, tamaño de archivo, formato &mdash; esté bien, y lo que mide una persona
        &mdash; altura de cabeza, línea de ojos, el fondo &mdash; lo tengas delante con
        números. Las normas además cambian: cada especificación de aquí dice de qué
        autoridad salió y cuándo se leyó, para que puedas contrastarla con el formulario
        que tienes delante en vez de fiarte de una tabla."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni marca
        de agua impresa sobre tu cara. Tampoco hay límite de cuántas fotografías hagas,
        porque no hay ningún servidor pagándolas. El sitio lleva publicidad, que es lo
        que lo paga, y a los anuncios no se les da nada sobre tu fotografía."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando: el reglamento es un archivo servido con la página, no una consulta.
        Esa es además la forma más sencilla de demostrar que no se sube nada: una
        herramienta que mandara tu fotografía fuera a recortar se pararía en cuanto
        desenchufaras."""

