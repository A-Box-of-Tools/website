[[faq]]
q = "¿Se sube mi texto a alguna parte?"
a = """
        No. Cada analizador y cada escritor de esta página es una función que corre
        en tu propio navegador, en tu propio equipo. Esta herramienta no tiene
        ninguna función de red: nunca pide nada y nunca envía nada, y la
        <code>Content-Security-Policy</code> de la página nombra todas las
        direcciones que puede contactar, ninguna de las cuales es nuestra. Esa es la
        razón para usarla con un token de acceso, una cookie de sesión o una ficha
        de cliente: pegar cualquiera de esas cosas en el formateador de otra
        persona es entregársela."""

[[faq]]
q = "¿Formatear JSON cambia algo aparte de la disposición?"
a = """
        No, y es más difícil de lo que suena. Las claves conservan el orden en que las
        escribiste: un formateador construido sobre <code>JSON.parse</code> mueve en
        silencio al principio las claves que parecen enteros, así que
        <code>{"10":a,"2":b}</code> vuelve como <code>{"2":b,"10":a}</code>. Los
        números conservan las cifras que tecleaste, así que un identificador de veinte
        dígitos no pierde las tres últimas por culpa de un doble y
        <code>1e999</code> no se vuelve <code>null</code>. Las claves duplicadas se
        conservan las dos, porque el estándar no dice cuál gana y descartar una sería
        decidir por ti."""

[[faq]]
q = "¿Qué lenguajes puede formatear?"
a = """
        JSON, XML, HTML, CSS y YAML. JSON, XML, HTML y CSS también se pueden apretar;
        YAML no, porque su forma corta es el estilo de flujo, que es ilegible, y lo
        ilegible es lo contrario del motivo por el que se mantiene un archivo en YAML.
        JavaScript no está en la lista a propósito: mira la pregunta de más abajo."""

[[faq]]
q = "¿Por qué no formatea JavaScript, Python o SQL?"
a = """
        Porque ordenar un lenguaje de programación significa analizarlo como es debido,
        y un formateador que casi acierta es peor que ninguno: produce código que se ve
        bien y hace otra cosa. JSON, XML, CSS y YAML tienen gramáticas lo bastante
        pequeñas como para leerlas a mano y comprobarlas con pruebas que puedes
        ejecutar. Un formateador de JavaScript es Prettier, que es un megabyte de
        analizador, y su sitio es tu editor y no una página web."""

[[faq]]
q = "Mi YAML dice no y el JSON ha salido como cadena. ¿Por qué?"
a = """
        Porque es una cadena, y aquí se lee YAML 1.2 y no 1.1. En YAML 1.1,
        <code>yes</code>, <code>no</code>, <code>on</code> y <code>off</code> eran
        booleanos, que es el famoso fallo que convierte el código de país de Noruega en
        <code>false</code>. YAML 1.2 lo quitó, y esto también: solo
        <code>true</code>, <code>false</code>, <code>null</code> y <code>~</code> se
        leen como algo que no sea texto. En el otro sentido, esas palabras se escriben
        <em>entrecomilladas</em>, aunque aquí se leerían como texto sin las comillas,
        porque lo que abra el archivo después quizá no. PyYAML sigue usando 1.1 por
        defecto. Leer con rigor y escribir con prudencia es la única combinación que
        acierta en los dos sentidos."""

[[faq]]
q = "¿Qué se pierde al convertir YAML a JSON?"
a = """
        Los comentarios, porque JSON no tiene dónde ponerlos. Las anclas, los alias y
        las etiquetas se rechazan de plano en vez de adivinarlas: cada una de ellas dice
        algo que JSON no puede decir, y un conversor que eligiera una interpretación en
        silencio te daría un documento que no es lo que decía el archivo. En el otro
        sentido no se pierde nada: todo documento JSON ya es un documento YAML."""

[[faq]]
q = "¿Qué se pierde al convertir JSON a XML?"
a = """
        La diferencia entre un objeto vacío, un array vacío y una cadena vacía, que se
        vuelven todos un elemento vacío, y el tipo de cada valor, porque XML no tiene
        tipos, que es por lo que la conversión inversa deja todo como cadena en vez de
        decidir que <code>8080</code> era un número. Un array se vuelve un elemento
        repetido, que es la única forma que se puede volver a leer, y a una clave que
        un nombre de elemento no puede contener se le sustituyen los caracteres
        incómodos en vez de emitir un documento que ningún analizador va a leer."""

[[faq]]
q = "¿Reindentar HTML cambia cómo se ve la página?"
a = """
        Puede cambiarlo, y esto es honesto al respecto. El espacio en blanco entre dos
        elementos en línea es un espacio entre dos palabras, así que moverlo no sale
        gratis. Hay dos cosas que lo mantienen a raya: <code>&lt;pre&gt;</code> y
        <code>&lt;textarea&gt;</code> se copian tal cual estaban, y un elemento que solo
        contiene texto se queda en una línea. Todo lo demás se ordena."""

[[faq]]
q = "¿De qué tamaño puede ser el archivo?"
a = """
        Aquí no hay ningún límite puesto, porque no hay ningún servidor pagándolo. El
        techo práctico es tu propio equipo: unos cuantos megabytes de JSON van bien,
        y con un documento muy largo la página espera una pausa en tu escritura antes
        de reformatear, en vez de pelearse contigo por el teclado."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni límite
        de cuánto pegas. El sitio lleva publicidad, que es lo que lo paga, y a los
        anuncios no se les da nada sobre tu texto."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se sube
        nada: una herramienta que mandara tu texto fuera a formatear se pararía en
        cuanto desenchufaras."""

