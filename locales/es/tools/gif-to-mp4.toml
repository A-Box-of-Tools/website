[[privacy]]
title = "Por qué MP4 ocupa tanto menos."
body = "GIF guarda cada fotograma como una imagen de hasta 256 colores. Un códec de vídeo como H.264 aprovecha los cambios entre fotogramas y admite color completo. La animación suele ocupar una décima parte o menos. Por eso muchas plataformas y aplicaciones rechazan GIF grandes o los convierten a MP4 al recibirlos: cuando el GIF pesa demasiado, suele servir mejor un MP4."

[[privacy]]
title = "No hay que esperar a subir el archivo."
body = "Un servicio puede pedirte subir 30 MB para devolverte 3 MB, además de conservar una copia. Aquí el GIF se lee con código local y el MP4 lo escribe el codificador del navegador. Los bytes solo pasan del disco a la memoria y vuelven al disco. La <code>Content-Security-Policy</code> enumera los destinos permitidos; ninguno pertenece al sitio. Funciona sin red."

[[privacy]]
title = "Se conserva la duración de cada fotograma."
body = "GIF no tiene frecuencia fija: cada fotograma indica cuánto dura. Una presentación puede mantener una foto dos segundos y después mostrar diez rápidamente. Ajustarla a una frecuencia fija puede duplicar o eliminar fotogramas. Aquí cada fotograma se convierte en uno de vídeo con su duración original. Solo se aplica el ajuste habitual de los navegadores: los retardos inferiores a dos centésimas se reproducen como diez centésimas. El resultado se reabre para contar los fotogramas y comprobar la duración."

[[privacy]]
title = "La transparencia y la repetición cambian."
body = "Un vídeo es un rectángulo opaco: la transparencia del GIF se rellena con el color elegido, blanco por defecto. El campo solo aparece si hace falta. Además, MP4 no guarda la orden de repetirse que sí lleva GIF; decide el reproductor. Las aplicaciones de chat y redes suelen repetir clips cortos. La vista previa se repite para revisar la unión."

[[privacy]]
title = "Tiempo y memoria necesarios."
body = "La codificación por hardware suele tardar segundos con un GIF normal; por software puede tardar más. El lector retiene como máximo 512 millones de píxeles de parches decodificados. La conversión también rechaza una estimación superior a 512 MiB para los búferes conocidos: entrada retenida, pantalla completa, copias de restauración y vídeo recopilado. La memoria interna del códec puede añadir más. Cancelar retira el proceso; una lectura nativa o un dibujo síncrono aún pueden terminar."

[[privacy]]
title = "Qué carga Google, y qué no llega a ver."
body = "Los scripts de publicidad y medición vienen de Google. No reciben el GIF, fotogramas, nombre, tamaño ni duración. Todo el código que lee, codifica y escribe se sirve desde este origen y está en el repositorio."

[[privacy]]
title = "Qué carga el botón de donación, y qué no llega a ver."
body = "El botón de donación usa un script de cdnjs.buymeacoffee.com y Google Fonts. Es solo un enlace: no registra la visita ni recibe información tuya o de tus GIF. Solo al pulsarlo abres un sitio ajeno."

[[privacy]]
title = "Funciona sin conexión."
body = "Desconéctate y la página sigue funcionando. Una herramienta que enviara el GIF a un servidor no podría hacerlo."

[[howto]]
title = "Elige el GIF."
body = "Uno cada vez. El navegador lo lee del disco y muestra su peso, número de fotogramas, duración y dimensiones."

[[howto]]
title = "Revisa qué se generará."
body = "Una línea indica las dimensiones, los fotogramas y sus tiempos, la duración y la tasa de bits. Solo hay que elegir un color si el GIF tiene partes transparentes."

[[howto]]
title = "Convierte y lee la comprobación."
body = "Se dibuja y codifica cada fotograma con una barra de progreso. Después se reabre el archivo para comprobar que están todos y que dura lo mismo. Se reproduce en bucle desde la memoria para revisar la unión."

[[faq]]
q = "¿Por qué pesa mucho menos el MP4?"
a = "GIF guarda imágenes de hasta 256 colores; H.264 aprovecha los cambios entre fotogramas y admite color completo. La misma animación suele ocupar una décima parte o menos. Un GIF diminuto o casi estático puede producir un MP4 mayor; la página lo avisa."

[[faq]]
q = "¿Conserva los tiempos de la animación?"
a = "Sí. Cada fotograma conserva su duración; no se duplica, elimina ni ajusta a una frecuencia fija. Igual que un navegador, los retardos menores de dos centésimas se reproducen como diez centésimas. El vídeo dura lo mismo que el GIF en el navegador. Se reabre el resultado para comprobar duración y cantidad de fotogramas."

[[faq]]
q = "¿Se repetirá en bucle?"
a = "Depende del reproductor. GIF guarda una orden de repetición; MP4 no. Las aplicaciones de chat y redes suelen repetir vídeos cortos, y la vista previa de aquí también. Un reproductor convencional suele mostrarlo una vez."

[[faq]]
q = "¿Qué pasa con las partes transparentes?"
a = "Se rellenan con un color porque el vídeo es opaco. Si hay transparencia aparece un selector, blanco por defecto; si no, se oculta. El color se dibuja detrás de cada fotograma antes de codificarlo."

[[faq]]
q = "¿Cambia las dimensiones?"
a = "H.264 necesita lados pares, así que un ancho o alto impar recibe una línea de fondo sin remuestreo. Si el lado más largo supera 3840 píxeles, el GIF se reduce hasta ese límite. La página indica el tamaño real de salida antes de empezar. Reducir la salida no reduce los búferes de composición de la fuente."

[[faq]]
q = "¿Cuánto tarda?"
a = "Un GIF normal suele tardar segundos con codificación por hardware, más sin ella. La barra muestra el fotograma actual. Cancelar retira el codificador y su salida; una consulta nativa de compatibilidad, lectura o dibujo síncrono aún pueden terminar. Un trabajo tardío no sustituye una fuente o resultado más reciente."

[[faq]]
q = "¿Se suben mis GIF?"
a = "No. El navegador lee, decodifica, codifica y escribe en tu dispositivo. La <code>Content-Security-Policy</code> enumera los destinos permitidos y ninguno pertenece al sitio. Desconéctate y usa la página para comprobarlo."

[[faq]]
q = "¿Funciona en el móvil?"
a = "Sí, si el navegador del teléfono puede codificar vídeo. Su codificador de hardware suele ser rápido. La limitación principal es la memoria: un GIF muy largo puede necesitar más de la disponible."

[[faq]]
q = "¿Hay límite de tamaño y cuesta algo?"
a = "El lector retiene como máximo 512 millones de píxeles de parches decodificados y la conversión rechaza una estimación de búferes conocidos superior a 512 MiB. No es una garantía sobre la memoria interna del códec ni todas las asignaciones del navegador. La página explica los rechazos. Es gratis, sin cuenta, acceso ni prueba. La publicidad paga el sitio y no recibe datos sobre tus GIF."

[[faq]]
q = "¿Funciona sin conexión?"
a = "Sí. Carga la página una vez y desconéctate. Seguirá funcionando, algo que un conversor que enviara el GIF a un servidor no podría hacer."

