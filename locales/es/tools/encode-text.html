<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> Elige la codificación</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">Codificación</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>En qué sentido</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>Codificar</strong> Entra texto plano, sale codificado.</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>Decodificar</strong> Entra codificado, sale texto plano.</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> Pégalo</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Tu texto</label>
          <span class="count" id="input-count">vacío</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Pega el texto a codificar, o el Base64 a decodificar - o suelta arriba un archivo."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Probar un ejemplo</button>
        <button type="button" id="clear" class="ghost danger">Vaciar</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> Llévate el resultado</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Todavía nada.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Copiar</button>
        <a id="download" class="ghost as-button" hidden download>Descargar</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
