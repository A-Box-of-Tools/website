#
# Explorador de números - Spanish.
#
# Overrides for tools/number-explorer/tool.toml. Only words: the slug, the
# category, the icon and the list of shared parts stay where they are.
#
# Every figure here was carried over by value and not by word. The English
# billion is "mil millones" and the Spanish billón is the English trillion, so
# a sentence that keeps the word keeps it a thousand times too large.
#

name = "Explorador de números"
heading = "Explorador&nbsp;de&nbsp;números <span class=\"h1-kw\">&mdash; imagina un millón, mil millones y mucho más</span>"
tagline = "Escribe cualquier número y míralo crecer: una pila de libros, un chorro de agua, un cielo de estrellas, un montón de arena, una cuenta muy larga."

title = "Visualizador de números &mdash; entiende los millones y los miles de millones &mdash; gratis y sin conexión"
description = "Mira lo grande que es de verdad un número. Crece como una pila de libros, un chorro de agua, un cielo de estrellas, un montón de arena y el tiempo que lleva contarlo, junto a hitos desde el Everest hasta la Vía Láctea. Gratis y sin conexión."
og_title = "¿Cómo se ven mil millones?"
og_description = "Convierte un número enorme en algo que se pueda ver: libros, agua, estrellas, arena y tiempo, con supuestos claros y sin IA ni subidas."
og_image_alt = "Explorador de números: imagina números grandes como libros, agua, estrellas, arena y tiempo"

pledge = "Una comparación es una cantidad, una referencia elegida y algo de aritmética, todo dentro de esta página. No hay ningún servicio de IA al que preguntar ni ninguna entrada que subir. Libros, agua, estrellas, arena y tiempo de conteo se mantienen separados, y sus supuestos están escritos junto al resultado, no escondidos detrás de la imagen."
live_hint = "Cambia el número con la pestaña Red abierta. La calculadora no hace ninguna petición. Carga la página una vez, desconéctate y sigue explorando."
read_first = ", <code>src/scale.js</code> para la lectura de la cantidad, los modelos y los hitos, <code>src/containers.js</code> para lo que mide un área coloreada, <code>src/stage.js</code> y los archivos <code>src/scene-*.js</code> para las imágenes, y <code>src/main.js</code> para ver cómo se conecta la página."
howto_heading = "Cómo imaginar un número grande"
card = "¿Qué altura tiene una pila de mil millones de libros? ¿Cuánta agua son mil millones de gotas? Escribe cualquier número y míralo convertirse en libros, agua, estrellas, arena y tiempo, con los supuestos a la vista."

[words]
plural = "números y comparaciones"
choose = "un número"

