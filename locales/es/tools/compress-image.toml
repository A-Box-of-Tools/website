[[faq]]
q = "¿Se sube mi imagen a alguna parte?"
a = """
        No. El archivo lo descodifica, lo comprime y lo mide tu propio navegador,
        en tu propio hardware, con los codificadores JPEG, PNG y WebP que ya trae
        de serie. Esta herramienta no tiene ninguna función de red: nunca
        descarga nada y nunca envía nada. Además, la
        <code>Content-Security-Policy</code> de la página enumera todas las
        direcciones a las que puede conectarse, y ninguna de ellas es de este
        sitio."""

[[faq]]
q = "¿Cómo consigue un tamaño exacto?"
a = """
        Probando. No hay ninguna fórmula que convierta un ajuste de calidad en un
        número de bytes, porque eso depende por completo de la foto. Así que la
        herramienta codifica la imagen varias veces y busca la respuesta. Empieza
        por lo más alto del rango de calidad y va acercándose por mitades, con lo
        que da con la calidad más alta que cabe en unas ocho codificaciones. Cada
        tamaño que ves en la página es un archivo codificado de verdad, no una
        estimación."""

[[faq]]
q = "¿Qué significa aquí exactamente «pérdida mínima»?"
a = """
        Tres cosas concretas. La primera, que una imagen que ya está por debajo
        de tu objetivo pasa byte a byte, sin volver a codificarse. La segunda,
        que primero se gasta calidad y solo después resolución, y únicamente
        hasta el suelo en el que los artefactos de compresión empiezan a notarse;
        por debajo de ahí la herramienta hace la foto más pequeña y vuelve a
        subir la calidad, porque menos píxeles buenos se ven mejor que más
        píxeles estropeados. Y la tercera, que en cuanto encuentra un resultado
        que cabe, la búsqueda vuelve a subir hasta agotar el presupuesto, de modo
        que no acabas con un archivo de 300 KB habiendo pedido 500 KB."""

[[faq]]
q = "¿Qué son las cifras SSIM y PSNR de cada resultado?"
a = """
        Son la medida de lo que ha costado la compresión. Se obtienen
        descodificando el resultado y comparándolo con la foto original. El SSIM
        compara brillo, contraste y estructura locales, que se parece mucho más a
        lo que le molesta al ojo que contar píxeles cambiados; por encima de 0,98
        cuesta distinguirlas aunque las pongas una al lado de la otra. El PSNR es
        la cifra clásica en decibelios. Las dos se calculan en tu dispositivo y
        las dos se muestran, para que lo de la pérdida baja se pueda comprobar en
        lugar de creerse sin más."""

[[faq]]
q = "¿Qué formatos puede leer y escribir?"
a = """
        Lee todo lo que el navegador sepa descodificar, que en la práctica son
        JPEG, PNG, WebP, GIF, BMP y, en casi todos los navegadores actuales,
        AVIF. Escribe JPEG, PNG y WebP, que son los codificadores que traen los
        navegadores. En modo «automático» conserva el formato con el que llegó tu
        archivo, y solo cambia a WebP cuando conservarlo habría obligado a
        redimensionar o a perder calidad de forma visible."""

[[faq]]
q = "¿Por qué no puede comprimir mucho un PNG?"
a = """
        Porque el PNG no tiene pérdidas y no hay ningún control de calidad que
        bajar. La única manera de hacer un PNG más pequeño es darle menos píxeles
        o menos colores, así que con PNG seleccionado la herramienta llega al
        objetivo solo a base de redimensionar. Si la imagen es una fotografía,
        JPEG o WebP se acercarán mucho más a tu objetivo con una calidad que se
        ve perfectamente bien. Y si es un logotipo o una captura con
        transparencia, el WebP conserva esa transparencia que el JPEG rellenaría
        de blanco."""

[[faq]]
q = "¿Comprimir una imagen le quita los datos EXIF y GPS?"
a = """
        Sí, de rebote. Comprimir consiste en descodificar la foto a píxeles y
        volver a codificar esos píxeles, y un lienzo lleno de píxeles no lleva
        etiquetas: la ubicación, el modelo de cámara, las marcas de tiempo y todo
        lo demás sencillamente no se escriben en el archivo nuevo. Si lo que
        quieres es quitar los metadatos sin tocar la foto, usa mejor el <a
        href="../eliminar-datos-exif/">visor y eliminador de EXIF</a>, que
        reescribe el contenedor sin volver a comprimir nada."""

[[faq]]
q = "¿Es gratis? ¿Necesito una cuenta?"
a = """
        Es gratis, y no hay cuenta, ni inicio de sesión, ni versión de prueba, ni
        marca de agua. Tampoco hay límite en el número ni en el tamaño de los
        archivos, porque no hay ningún servidor pagándolos: el trabajo lo hace tu
        propio dispositivo. El sitio lleva publicidad, que es lo que lo paga, y a
        los anuncios no se les da nada sobre tus imágenes."""

[[faq]]
q = "¿Funciona sin conexión?"
a = """
        Sí. Carga la página una vez, desconéctate de internet y verás que sigue
        funcionando. Esa es además la forma más sencilla de demostrar que no se
        sube nada: una herramienta que mandara tus imágenes fuera para
        comprimirlas se pararía en cuanto desenchufaras."""

