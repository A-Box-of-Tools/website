#
# ロードマップの「予定」リスト - Japanese.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Japanese list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#
# 形式名 (GIF, MP4, WebM, APNG, WebP, SRT, CSV, JSON, MP3, WAV, Opus, HEIC,
# AVIF, JPEG XL) は日本語でもそのまま使われる語なので訳しません。
#

note = "まだ完成していません。どこへ向かっているかが見えるように並べています。"

[[group]]
id = "images"
name = "画像"
items = [
  ["回転と反転", "90度単位で回す、または数度だけ傾きを直す"],
  ["文字入れ", "画像の上に重ねる、または上部の帯に入れる"],
  ["フィルター", "明るさ、コントラスト、彩度、ぼかし、グレースケール"],
  ["画像をデータURIに", "できた文字列をそのまま CSS や HTML に貼れます"],
  ["HEIC を JPG に", "iPhone が作る写真を、どこでも開ける形式に"],
  ["AVIF と JPEG XL", "どちらの向きにも変換。お使いのブラウザがどれであっても"],
]

[[group]]
id = "gif"
name = "GIF とアニメーション"
items = [
  ["GIF を MP4 や WebM に", "同じ動きのまま、たいてい10分の1のサイズに"],
  ["GIF の拡大縮小・切り抜き・回転", "フレームごとに、間隔はそのまま"],
  ["GIF を逆再生", "最後のフレームから先に"],
  ["GIF の速さを変える", "フレームを描き直さずに間隔だけ組み直します"],
  ["GIF を調べる", "フレーム数、表示間隔、パレット、そしてどこで容量を使っているか"],
  ["APNG を作る", "本物の透過と全色を保ったアニメーション"],
  ["アニメーション WebP", "同じ動きをもう一度、ごくわずかなサイズで"],
]

[[group]]
id = "video"
name = "動画"
items = [
  ["サイズを変える", "本当に送れる大きさまで落とします"],
  ["回転", "横向きに撮れてしまった映像のために"],
  ["消音、または音声だけ保存", "音を落とす、または音だけ取り出す"],
  ["MP4 や WebM に変換", "投稿先のサイトが指定してくるほうの形式に"],
  ["フィルター", "明るさ、コントラスト、彩度、ぼかし"],
  ["字幕を焼き付ける", "SRT ファイルを映像そのものに描き込みます"],
]

[[group]]
id = "audio"
name = "音声"
items = [
  ["フェードイン・フェードアウト", "唐突に始まって唐突に終わらないように"],
  ["波形を画像に", "録音を1枚の絵として描きます"],
  ["形式を変換", "MP3、WAV、Opus を、どの向きにも"],
]

[[group]]
id = "documents"
name = "書類と PDF"
items = [
  ["ページの回転と切り抜き", "横向きに取り込まれたスキャンを直す、余白を落とす"],
  ["画像を取り出す", "書類の中の画像を元の形で抜き出します"],
]

[[group]]
id = "beyond"
name = "メディアの外側"
items = [
  ["データ", "CSV と JSON の変換、整理、確認"],
  ["プライバシーとセキュリティ", "ハッシュ、チェックサム、メタデータの除去"],
]
