#
# ロードマップの「予定」リスト - Japanese.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Japanese list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#
# 形式名（GIF、MP4、WebM、APNG、WebP、SRT、CSV、JSON、MP3、WAV、Opus、HEIC、
# AVIF、JPEG XL）は日本語でもそのまま使われる語なので訳しません。
#

note = "まだ完成していません。どこへ向かっているのかが見えるように並べています。"

[[group]]
id = "images"
name = "画像"
items = [
  ["文字入れ", "画像の上に重ねる、または上部の帯に入れる"],
  ["AVIF", "どのブラウザも読めるのに、書き出せるものは1つもない形式"],
  ["DICOMの匿名化", "画像には触れずに、患者の情報だけを外します"],
]

[[group]]
id = "gif"
name = "GIFとアニメーション"
items = [
  ["GIFをMP4やWebMに", "同じ動きのまま、たいてい10分の1のサイズに"],
  ["GIFを編集", "拡大縮小、切り抜き、回転、逆再生、速さの変更"],
  ["アニメーションWebP", "同じ動きをごくわずかなサイズで。透明な部分もそのまま"],
]

[[group]]
id = "video"
name = "動画"
items = [
  ["サイズを変える", "本当に送れる大きさまで落とします"],
  ["回転", "横向きに撮れてしまった映像のために。フレームは1枚もデコードしません"],
  ["動画を消音", "音だけ落として、映像には手を触れません"],
  ["MP4に変換", "カメラから出てきたものを、実際にアップロードできる形式に"],
  ["字幕を焼き付ける", "SRTファイルを、映像そのものに描き込みます"],
  ["字幕を変換", "SRT、VTT、ASS、SBV、LRCをどの向きにも。時間のずれも直せます"],
]

[[group]]
id = "audio"
name = "音声"
items = [
  ["形式を変換", "MP3、WAV、Opusを、どの向きにも"],
]

[[group]]
id = "documents"
name = "書類とPDF"
items = [
  ["ページの切り抜き", "スキャンの余白を落とす。印刷したスライドの余白も"],
  ["画像を取り出す", "書類の中の画像を、元の形で抜き出します"],
]

[[group]]
id = "beyond"
name = "メディアの外側"
items = [
  ["CSVとJSON", "どちらの向きにも変換し、表計算が吐き出したものを整えます"],
  ["証明書と鍵", "証明書や署名要求を、他人のサーバーに貼り付けずに読みます"],
]
