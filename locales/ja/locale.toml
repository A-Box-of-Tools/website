[hub]
title = "無料ブラウザーツール——ファイルのローカル処理 | abox.tools"
# 全角で約80字。日本語の検索結果はこのあたりで切られます。
description = "ブラウザー内でファイルを処理する無料ツール。画像をPDFやMP4にまとめる、目標サイズに向けて圧縮する、動画を切り抜く、EXIFを削除する。"
heading = "無料ツール。端末で処理。"
og_title = "A Box of Tools &mdash; ブラウザー内でのローカル処理"
og_description = "用途を絞ったツールが端末上でファイルを処理します。意図した共有や任意のオンライン機能は、使う場所で説明します。"
og_image_alt = "abox.tools - ブラウザー内でファイルをローカル処理するツール"
schema_description = "処理のためのアップロードやアカウントが不要な、ローカル処理用のブラウザーツールです。通信機能は各ページで説明します。"
schema_about = "ファイルのローカル処理と、意図したブラウザー間共有のためのツール"

lede = "ファイルはブラウザー内で処理。処理のためのアップロードもログインも不要です。"

support_note = """
      ツールはすべて無料で、これからも無料のままです。手間が省けたと思って\
      いただけたなら、このサイトがお願いごとをするのはここだけです。"""

# 約束ではなく、確かめられる三つの事実として書いています（英語版と同じ）。
privacy_heading = "ファイルは、あなたの手元に。"

privacy_lede = "ツールの保存後は、ローカルでのファイル処理をオフラインで使えます。取得や共有には接続が必要です。"

support_heading = "無料で、あなたの支えで。"

[[hub.guarantees]]
title = "ファイルは自分の端末上で処理されます"
body = "選んだファイルは自分のブラウザーで開き、読み、編集します。処理のためのアップロードはありません。テキストとファイルの共有、リモートカメラは、意図した相手のブラウザーへ内容を送ります。接続方法は各ページで説明します。"

