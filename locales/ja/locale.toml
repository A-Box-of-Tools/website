#
# ---------------------------------------------------------------------------
# The frame's own words. Everything with {{ }} in it is a name the build
# resolves, and the build refuses to render a name it cannot find.
#
# Japanese puts the verb last without exception, so a sentence built by gluing
# two fragments either side of a value could never come out right. Written
