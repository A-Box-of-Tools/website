#
# 日本語.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# WHY THERE IS NO [slugs] TABLE
#
# Every other language here renames its URLs, because a slug is the one part of
# a page's markup that is also a keyword. Japanese does not, and the omission is
# deliberate rather than unfinished.
#
# A Japanese slug would have to be either percent-encoded UTF-8 -
# /ja/%E7%94%BB%E5%83%8F%E5%9C%A7%E7%B8%AE/ - or romaji nobody types. The first
# is unreadable the moment it is pasted anywhere that does not decode it, which
# is most places, and would need the sitemap writer to learn percent-encoding.
# The second gets the worst of both: not English, not Japanese, and not a phrase
# anybody searches for. Japanese sites overwhelmingly use ASCII slugs for
# exactly this reason.
#
# The keyword weight that a slug would have carried is carried by the title, the
# description and the h1 instead, which are translated below and which matter
# far more in Japanese search than the URL does. Same for ko, zh and hi.
#
# The register is です・ます throughout, which is what a consumer tool speaks.
#
# HOUSE STYLE, so that sixty-six files agree with one another
#
#   * No space between Japanese and Latin script or digits: EXIFを削除,
#     JavaScriptが無効, <code>src/main.js</code>を読む. A space is written only
#     between two Latin tokens.
#   * 、。 for comma and full stop, 「」 for quotation, ・ between listed nouns,
#     ｜ where a title needs a separator. No em dash: an English aside between
#     dashes becomes its own sentence, or is hinged on から / ので / て.
#   * ブラウザ, フォルダ, サーバー, ファイル, アップロード, ドラッグ, コーデック.
#   * 手元の端末 for "your machine"; 道具箱 only where the site names itself.
#

lang = "ja"
name = "Japanese"
endonym = "日本語"

complete = true

