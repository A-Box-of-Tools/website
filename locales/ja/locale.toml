#
# 日本語.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# WHY THERE IS NO [slugs] TABLE
#
# Every other language here renames its URLs, because a slug is the one part of
# a page's markup that is also a keyword. Japanese does not, and the omission is
# deliberate rather than unfinished.
#
# A Japanese slug would have to be either percent-encoded UTF-8 -
# /ja/%E7%94%BB%E5%83%8F%E5%9C%A7%E7%B8%AE/ - or romaji nobody types. The first
# is unreadable the moment it is pasted anywhere that does not decode it, which
# is most places, and would need the sitemap writer to learn percent-encoding.
# The second gets the worst of both: not English, not Japanese, and not a phrase
# anybody searches for. Japanese sites overwhelmingly use ASCII slugs for
# exactly this reason.
#
# The keyword weight that a slug would have carried is carried by the title, the
# description and the h1 instead, which are translated below and which matter
# far more in Japanese search than the URL does. Same for ko, zh and hi.
#
# The register is です・ます throughout, which is what a consumer tool speaks.
#

lang = "ja"
name = "Japanese"
endonym = "日本語"

complete = false

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "無料のブラウザツール &mdash; アップロード不要・登録不要 | abox.tools"
# 全角で約60字。日本語の検索結果はこのあたりで切られます。
description = "ファイルを一切アップロードしない無料ツール。画像をPDFやMP4にまとめる、指定サイズに圧縮する、動画を切り抜く、EXIFを削除する。すべてブラウザ内で完結します。"
heading = "サーバーに触れない道具箱"
og_title = "A Box of Tools &mdash; サーバーに触れない道具"
og_description = "ひとつの用途だけを持つ小さな道具が、すべての処理をブラウザの中で行います。ファイルが手元の端末から出ることはありません。"
og_image_alt = "abox.tools - サーバーに触れない道具"
schema_description = "ひとつの用途だけを持つ小さなユーティリティが、すべての処理をブラウザの中で完結させます。何もアップロードされず、アカウントも不要です。"
schema_about = "ファイルをアップロードせずにローカルで処理する、ブラウザ内で動くファイルユーティリティ"

lede = """
    ひとつの用途だけを持つ小さな道具が、すべての処理をあなたのブラウザの中で
    行います。ファイルは手元の端末に残ります。アップロードするものはなく、
    作るアカウントもなく、追跡するものもありません。"""

support_note = """
      これらの道具は無料で、これからも無料のままです。もし手間が省けたなら、
      このサイトであなたに何かをお願いするのはここだけです。"""

# 約束ではなく、確かめられる三つの事実として書いています（英語版と同じ）。
[[hub.guarantees]]
title = "ファイルが端末から出ることはありません"
body = """
        ファイルを開き、読み、処理するのは、あなた自身のブラウザとハードウェア
        です。各ツールの <code>Content-Security-Policy</code> は接続してよい
        アドレスをすべて明記していますが、そのどれも当サイトのものではありま
        せん。"""

[[hub.guarantees]]
title = "ファイルに関する情報も一切送信されません"
body = """
        ファイル本体はもちろん、サムネイルも、ファイル名も、サイズも、選んだ
        枚数も送られません。ここのどのツールもそれを読み出しません。そもそも
        受け取る側にサーバーが存在しません。"""

[[hub.guarantees]]
title = "オフラインでも動きます"
body = """
        一度ツールを開いてから通信を切っても、これまでどおりファイルの処理を
        続けられます。これは偽装しにくい事実です。処理のためにファイルをどこか
        へ送っている道具なら、その時点で止まってしまうからです。"""

[[hub.categories]]
id = "images-and-video"
name = "画像と動画"
note = "写真や映像を、誰にも預けずに扱えます。"

[[hub.categories]]
id = "gif-and-animation"
name = "GIFとアニメーション"
note = "アニメーションを作る、あるいは分解する。どちらも端末の外には出ません。"

[[hub.categories]]
id = "audio"
name = "音声"
note = "録音を誰にも預けずに扱えます。動画の中の音声も同じです。"

[[hub.categories]]
id = "documents-and-pdf"
name = "書類とPDF"
note = "書類の作成や並べ替えを、どこかへ送って処理してもらうことなく行えます。"

[[hub.categories]]
id = "codes-and-data"
name = "コードとデータ"
note = "入力した内容を、機械が読み取れる形に変えます。ページの外には出ません。"

[[hub.categories]]
id = "text-and-code"
name = "テキストとコード"
note = "読みやすくして、比べて、符号化する。トークンや設定ファイルを他人のサーバーに貼り付けることなく。"

