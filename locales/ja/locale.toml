lede = """
    ツールごとに一本。サイズや形式を指定されて、これから動かす設定が実際に
    何をするのかを知っておきたい人のために書いています。ここで説明することは
    すべて、あなた自身の端末の中で起こります。"""
og_title = "abox.tools のガイド"
og_description = "自分のファイルを圧縮・リサイズ・切り抜き・カット・変換する方法と、それぞれの設定の代償。アップロードは一切ありません。"
og_image_alt = "abox.tools - サーバーに触れない道具"


[[guides.groups]]
id = "doing-the-job"
name = "作業を進める"
note = "ツールごとに一本。何をする作業なのか、どの設定が効くのか、そして何を犠牲にするのか。"

[[guides.groups]]
id = "before-you-upload"
name = "アップロードする前に"
note = "ファイルをウェブサイトに渡すとは実際どういうことか。そして、それが本当に必要だったかを見分ける方法。"

#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "ロードマップ"
title = "ロードマップ &mdash; abox.tools が次に作るもの"
description = "abox.tools で予定しているツールを分類してすべて公開しています。完成済みのものも併記。どれもブラウザ内で動き、何もアップロードしません。"
heading = "次に来るもの"
lede = """
    以下の二つのリストに載るものはすべて、あなたのブラウザの中で処理を行い、
    何もアップロードしません &mdash; それが、名前がここに載るために通らなけ
    ればならない条件です。件数はどこにも書いていません。ビルドが二つのリスト
    から数えています。"""

intro_heading = "このリストの作り方"
intro = """
    <p>
      願望リストではありません。オンラインで最大のGIF・動画サイトのツール一覧
      &mdash; 人々がファイルに対して実際に何をしたがっているかの目録に最も近い
      もの &mdash; を一通り見て、処理があなた自身の端末で行われ、しかも回線を
      抜いたままでも動き続けるように作れる項目だけを残しました。
    </p>
    <p>
      残ったものの大半は、ブラウザがすでに備えているAPIで動きます。いくつかは
      それを使う一つのツールの中にコーデックを同梱する必要がありますが、それは
      許容しています &mdash; ファイルが端末から出ないことに変わりはありません。
      この条件を満たせないものは、約束せずに外しました。ですから、以下で一見
      明らかに見える欠落のいくつかは、意図的な欠落です。
    </p>
    <p>
      すでに存在するツールは各グループの先頭に <em>完成</em> と付けて、それぞれ
      のページへのリンクとして並べています。その下にあるものはこれからで、
      できあがるまでリンクにはなりません。
    </p>"""

planned_heading = "あらゆる種類のファイルと、それに対してできること"

og_title = "abox.tools のロードマップ"
og_description = "できているものと、次に来るもの。すべてブラウザ内で動き、何もアップロードしません。"
og_image_alt = "abox.tools - サーバーに触れない道具"

