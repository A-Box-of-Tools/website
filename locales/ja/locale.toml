[roadmap]
nav = "ロードマップ"
title = "ロードマップ｜abox.toolsが次に作るもの"
description = "abox.toolsの計画中と完成済みのツールを、分類して公開しています。ファイル処理はブラウザー内で行います。"
heading = "次に来るもの"
lede = "以下の両リストのツールは、ブラウザー内でファイルを処理し、処理のためにアップロードしません。通信が必要な機能は各ページで説明する必要があります。件数は手書きせず、ビルド時にリストから数えています。"

intro_heading = "このリストの作り方"
intro = """
    <p>\
      願望リストではありません。オンラインで最大のGIF・動画サイトのツール一覧を\
      一通り見て作りました。人がファイルに対して実際に何をしたがっているかの\
      目録として、これに近いものは他にありません。そのうえで、処理が手元の端末で\
      行われ、しかも回線を抜いたままでも動き続けるように作れる項目だけを\
      残しました。\
    </p>\
    <p>\
      残ったものの大半は、ブラウザがすでに備えているAPIで動きます。いくつかは\
      使う側のツールにコーデックを同梱する必要がありますが、それは認めています。\
      ファイルが端末から出ないことに変わりはないからです。この線を越えられない\
      ものは、約束せずに落としました。ですから下の一覧には、抜けているように\
      見えて、わざと外してある項目がいくつかあります。\
    </p>\
    <p>\
      すでにあるツールは各グループの先頭に置き、<em>完成</em>と付けて、それぞれ\
      のページへリンクしています。その下に並ぶものはこれからで、できあがるまで\
      リンクにはなりません。\
    </p>"""

planned_heading = "あらゆる種類のファイルと、それにできること"

og_title = "abox.toolsのロードマップ"
og_description = "完成済みのツールと今後の計画。ファイルはローカル処理し、通信が必要な機能は説明します。"
