#
# 日本語.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# WHY THERE IS NO [slugs] TABLE
#
# Every other language here renames its URLs, because a slug is the one part of
# a page's markup that is also a keyword. Japanese does not, and the omission is
# deliberate rather than unfinished.
#
# A Japanese slug would have to be either percent-encoded UTF-8 -
# /ja/%E7%94%BB%E5%83%8F%E5%9C%A7%E7%B8%AE/ - or romaji nobody types. The first
# is unreadable the moment it is pasted anywhere that does not decode it, which
# is most places, and would need the sitemap writer to learn percent-encoding.
# The second gets the worst of both: not English, not Japanese, and not a phrase
# anybody searches for. Japanese sites overwhelmingly use ASCII slugs for
# exactly this reason.
#
# The keyword weight that a slug would have carried is carried by the title, the
# description and the h1 instead, which are translated below and which matter
# far more in Japanese search than the URL does. Same for ko, zh and hi.
#
# The register is です・ます throughout, which is what a consumer tool speaks.
#
# HOUSE STYLE, so that sixty-six files agree with one another
#
#   * No space between Japanese and Latin script or digits: EXIFを削除,
#     JavaScriptが無効, <code>src/main.js</code>を読む. A space is written only
#     between two Latin tokens.
#   * 、。 for comma and full stop, 「」 for quotation, ・ between listed nouns,
#     ｜ where a title needs a separator. No em dash: an English aside between
#     dashes becomes its own sentence, or is hinged on から / ので / て.
#   * ブラウザ, フォルダ, サーバー, ファイル, アップロード, ドラッグ, コーデック.
#   * 手元の端末 for "your machine"; 道具箱 only where the site names itself.
#

lang = "ja"
name = "Japanese"
endonym = "日本語"

complete = true

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "無料のブラウザツール｜アップロード不要・登録不要｜abox.tools"
# 全角で約80字。日本語の検索結果はこのあたりで切られます。
description = "ファイルをアップロードしない無料ツール。画像をPDFやMP4にまとめる、サイズを指定して圧縮する、動画を切り抜く、EXIFを削除する。処理はすべてブラウザの中で終わります。"
heading = "サーバーに触れない道具箱"
og_title = "A Box of Tools｜サーバーに触れない道具箱"
og_description = "用途をひとつに絞った小さな道具が、処理をすべてブラウザの中で行います。ファイルが手元の端末から出ることはありません。"
og_image_alt = "abox.tools - サーバーに触れない道具箱"
schema_description = "用途をひとつに絞った小さなユーティリティが、処理をすべてブラウザの中で終わらせます。アップロードは発生せず、アカウントも要りません。"
schema_about = "ファイルをアップロードせずに手元で処理する、ブラウザの中で動くファイルユーティリティ"

lede = """
    用途をひとつに絞った小さな道具が、処理をすべてブラウザの中で行います。\
    ファイルは手元の端末に置いたままです。アップロードするものも、作る\
    アカウントも、追跡するものもありません。"""

support_note = """
      ツールはすべて無料で、これからも無料のままです。手間が省けたと思って\
      いただけたなら、このサイトがお願いごとをするのはここだけです。"""

# 約束ではなく、確かめられる三つの事実として書いています（英語版と同じ）。
[[hub.guarantees]]
title = "ファイルが端末の外に出ることはありません"
body = """
        ファイルを開いて読み込み、処理するところまでを引き受けるのは、お使いの\
        ブラウザと手元のハードウェアです。各ツールの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        書き出してありますが、そこに当サイトのものは一つもありません。"""

[[hub.guarantees]]
title = "ファイルについての情報も送信されません"
body = """
        ファイル本体も、サムネイルも、名前も、サイズも、選んだ枚数も送りません。\
        ここのツールはどれも、そうした値を読み出しません。受け取る側のサーバー\
        がそもそも存在しません。"""

[[hub.guarantees]]
title = "オフラインでも動きます"
body = """
        ツールを一度開いたあとで通信を切っても、それまでと変わらずファイルを\
        処理できます。ここはごまかしの効かないところです。処理のためにファイル\
        をどこかへ送っている道具なら、通信が切れた時点で止まってしまうから\
        です。"""

[[hub.categories]]
id = "images-and-video"
name = "画像と動画"
note = "写真も映像も、誰かに預けずに手元で扱えます。"

[[hub.categories]]
id = "gif-and-animation"
name = "GIFとアニメーション"
note = "アニメーションを作るのも、分解するのも、端末の中だけで済みます。"

[[hub.categories]]
id = "audio"
name = "音声"
note = "録音した音声も、動画の中の音声も、誰かに預けずに手を入れられます。"

[[hub.categories]]
id = "documents-and-pdf"
name = "書類とPDF"
note = "書類を作るのも並べ替えるのも、どこかへ送って処理してもらう必要はありません。"

[[hub.categories]]
id = "codes-and-data"
name = "コードとデータ"
note = "入力した文字を、機械が読み取れる形に変えます。ページの外へは出ません。"

[[hub.categories]]
id = "text-and-code"
name = "テキストとコード"
note = "読みやすく整形し、差分を比べ、符号化します。トークンや設定ファイルを他人のサーバーに貼り付けずに済みます。"

#
# ---------------------------------------------------------------------------
# The guides index.
# ---------------------------------------------------------------------------
#

[guides]
nav = "すべてのガイド"
title = "使い方ガイド｜手順と、その設定が何と引き換えになるか"
description = "画像・動画・PDFを圧縮、リサイズ、切り抜き、カット、変換する手順を平易に解説します。設定の意味と代償、そしてアップロードが要らない理由まで。"
heading = "ガイド"
lede = """
    ツールごとに一本ずつ。サイズや形を指定されて、これから動かす設定が実際に\
    何をするのかを知っておきたい人に向けて書いています。ここに書いたことは\
    すべて、手元の端末の中で起こります。"""
og_title = "abox.toolsの使い方ガイド"
og_description = "画像・動画・PDFを圧縮、リサイズ、切り抜き、カット、変換する方法と、設定ごとの代償。アップロードは一切ありません。"
og_image_alt = "abox.tools - サーバーに触れない道具箱"


[[guides.groups]]
id = "doing-the-job"
name = "作業を進める"
note = "ツールごとに一本。何をする作業なのか、どの設定が効くのか、そして何と引き換えになるのか。"

[[guides.groups]]
id = "before-you-upload"
name = "アップロードする前に"
note = "ファイルをウェブサイトに渡すと実際に何が起きるのか。そして、渡す必要が本当にあったのかを見分ける方法。"

#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# is translated in planned.toml beside this file.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "ロードマップ"
title = "ロードマップ｜abox.toolsが次に作るもの"
description = "abox.toolsで予定しているツールを、分類したうえですべて公開しています。完成済みのものも並べました。どれもブラウザの中で動き、アップロードは発生しません。"
heading = "次に来るもの"
lede = """
    下の二つのリストに並ぶものは、どれもブラウザの中で処理を行い、何も\
    アップロードしません。この条件を満たさない限り、名前がここに載ることは\
    ありません。件数はどこにも書いていません。ビルドが二つのリストから\
    数えています。"""

intro_heading = "このリストの作り方"
intro = """
    <p>\
      願望リストではありません。オンラインで最大のGIF・動画サイトのツール一覧を\
      一通り見て作りました。人がファイルに対して実際に何をしたがっているかの\
      目録として、これに近いものは他にありません。そのうえで、処理が手元の端末で\
      行われ、しかも回線を抜いたままでも動き続けるように作れる項目だけを\
      残しました。\
    </p>\
    <p>\
      残ったものの大半は、ブラウザがすでに備えているAPIで動きます。いくつかは\
      使う側のツールにコーデックを同梱する必要がありますが、それは認めています。\
      ファイルが端末から出ないことに変わりはないからです。この線を越えられない\
      ものは、約束せずに落としました。ですから下の一覧には、抜けているように\
      見えて、わざと外してある項目がいくつかあります。\
    </p>\
    <p>\
      すでにあるツールは各グループの先頭に置き、<em>完成</em>と付けて、それぞれ\
      のページへリンクしています。その下に並ぶものはこれからで、できあがるまで\
      リンクにはなりません。\
    </p>"""

planned_heading = "あらゆる種類のファイルと、それにできること"

og_title = "abox.toolsのロードマップ"
og_description = "できているものと、これから来るもの。どれもブラウザの中で動き、アップロードは発生しません。"
og_image_alt = "abox.tools - サーバーに触れない道具箱"

#
# ---------------------------------------------------------------------------
# The 404. Built in English only today, but translated anyway.
# ---------------------------------------------------------------------------
#

[not_found]
title = "ページが見つかりません｜abox.tools"
description = "そのアドレスはabox.toolsにはありません。あるツールはこちらです。すべて無料で、どれもファイルをどこかへ送ることはありません。"
heading = "このページはここにはありません"
tools_heading = "すべてのツールを一か所に"
tools_note = "すべて無料、すべてブラウザの中で動きます。アップロードは一切ありません。"

lede = """
    アドレスに打ち間違いがあるか、そこにあったものが移動したかのどちらかです。\
    ファイルには何も起きていませんし、失われたものもありません。このサイトは、\
    失うようなものを預かったことが一度もないからです。"""

#
# ---------------------------------------------------------------------------
# The footer.
# ---------------------------------------------------------------------------
#

[footer]
blurb = """
        サーバーに触れない道具。ファイルは手元の端末に置いたままです。\
        アップロードするものも、作るアカウントもありません。"""
base = "このサイトの主張はどれも、信じてもらうためではなく、確かめてもらうために書いてあります。"

#
# ---------------------------------------------------------------------------
# The frame's own words. Everything with {{ }} in it is a name the build
# resolves, and the build refuses to render a name it cannot find.
#
# Japanese puts the verb last without exception, so a sentence built by gluing
# two fragments either side of a value could never come out right. Written
# whole, the value sits where Japanese puts it.
# ---------------------------------------------------------------------------
#

[ui]
languages = "言語"
lang_auto = "ブラウザの言語設定が日本語なので、このページは日本語で表示しています。"
lang_untranslated = "このページはまだ英語です"
breadcrumb = "パンくずリスト"
all_tools = "すべてのツール"
last_updated = "最終更新"
built_tag = "完成"
planned_count = "件が予定"
built_count = "件が完成"

# 日本語に単複の区別はないので、両方とも同じ語です。
guide_one = "本のガイド"
guide_many = "本のガイド"

footer_tools = "ツール"
footer_site = "このサイト"
footer_contact = "お問い合わせ"
footer_sitemap = "サイトマップ"
footer_source = "GitHubでコードを読む"

guarantees_note = """
    以上のどれも、鵜呑みにする必要はありません。\
    <a href="{{ base }}{{ links.safety_guide }}/">\
      そのツールに本当にファイルが必要かを見分ける方法</a>\
    では、このサイトでも他のサイトでも自分で試せる確認方法を四つ挙げています。"""

hub_guides_note = """
    どの設定を動かせばいいのか、それで何と引き換えになるのか。\
    <a href="{{ base }}{{ links.guides }}/">ツールごとにガイドがあります</a>。"""

hub_roadmap_note = """
    まだ増えます。予定は公開しています。\
    <a href="{{ base }}{{ links.roadmap }}/">次に何を作るのかを見る</a>。"""

guides_all_note = """
    ここのガイドはどれも、手元の端末で動くツールについて書いたものです。\
    <a href="{{ base }}">ツールを一覧で見る</a>。"""

[ui.tool]
view_source = "ソースを見る"
how_verified = "確かめ方"
live_check = "いまの通信："
offline = "オフライン："
checking = "確認中&hellip;"
questions_heading = "よくある質問"
guide_heading = "詳しい解説"
related_heading = "箱の中のほかのツール"
privacy_heading = "この主張を確かめる方法"

pledge_line = """
    {{ tool.words.plural }}が<strong>アップロードされることはありません</strong>。サーバーが存在しないからです。"""

boot_title = "このページのコードが起動しませんでした。"
boot_body = """
    <code>index.html</code>をフォルダから直接開くと、ブラウザがJavaScriptモジュールを\
    読み込めません。そのため{{ tool.words.choose }}を選んでも何も起きません。フォルダはhttpで配信してください。"""
