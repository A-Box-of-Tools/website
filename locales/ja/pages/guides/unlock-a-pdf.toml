title = "PDFの保護を解除する方法——パスワードと操作制限の違い"
description = "印刷できないPDFと開けないPDFは、同じ「保護」という名前でも別の問題です。それぞれの仕組み、片方は1回で外せてももう片方はパスワードなしでは外せない理由、見分け方を説明します。"
heading = "PDFの保護を解除する方法と、保護の種類"
lede = "「保護」には2つの違う意味があります。1つは実際に内容へのアクセスを防ぐパスワード、もう1つは読み取りソフトが合意して従う印刷禁止などの指示です。すぐに見分けられ、その違いが以後の処理を決めます。"
