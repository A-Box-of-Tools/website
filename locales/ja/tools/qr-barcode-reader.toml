text = "アップロードなし"

[[facts]]
text = "アカウント不要"

[[facts]]
text = "記録なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "オープンソース"

[[privacy]]
title = "画像がアップロードされることはなく、カメラも例外ではありません。"
body = """
\
      ここに置いた写真は、このページの中のキャンバスへデコードされ、そこで読まれます。\
      カメラの一コマも同じことが毎秒三十回起きているだけです。そのキャンバスに描かれ、\
      調べられ、次の一コマに上書きされます。記録される一コマはなく、残る一コマもなく、\
      停止を押したときにカメラのランプが消えること、それがすべてです。"""

[[privacy]]
title = "ここには何かを取りに行くものがありません。"
body = """
\
      <code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありませんし、ページの<code>Content-Security-Policy</code>は、\
      仮にあったとしてもこのオリジンが送れる宛先を一つも残していません。\
      短縮リンクの行き先をこのページが言えないのはそのためです。調べるとは尋ねることで、\
      このページは尋ねません。"""

[[privacy]]
title = "アドレスは見せます。開くことはしません。"
body = """
\
      印刷されたQRコードは誰にも読めないアドレスであり、その上にシールを貼ることが\
      誰かにとって割に合うのは、まさにそのせいです。ここでは何も開きません。\
      文字列は全体がそのまま表示され、実際にたどり着くホストは別の行に取り出され、\
      あるアドレスを別のアドレスに見せかける手口は、現れた場所で名指しされます。\
      <code>@</code>の前に置かれたユーザー名、こちらの字形とそっくりな別の文字体系で\
      書かれた名前、そして転送です。"""

[[privacy]]
title = "何を読み取ったのかも見せます。"
body = """
\
      QRの結果の下には、このページが実際にあなたの写真から読み取ったモジュールの絵が\
      あります。それが読み取ったコードに似ていれば、上の答えは確かです。砂嵐に見えるなら\
      確かではありません。文字列だけを返してそれきりの読み取り機は、こうして確かめる\
      ことができません。"""

[[privacy]]
title = "Googleが読み込むもの、そして渡されないもの。"
body = """
\
      広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来ます。\
      そのどれにも、画像も、カメラの一コマも、そこから読み取ったものも渡されません。\
      画素を文字列に変える行はすべて、このオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
\
      ネットワークを切ってもこの道具は変わりません。カメラも含めてです。\
      もともと通信の手順が一つも入っていないからで、これが一番簡単な証明です。"""

[[howto]]
title = "画像を渡す。"
body = """
\
      写真かスクリーンショットを枠に置くか、直接貼り付けるか、カメラのボタンを押して\
      ください。一度に何枚でもかまいません。それぞれ別に読まれ、それぞれに答えが出ます。\
      画面にすでに映っているコードのスクリーンショットが一番速く、一番確実です。\
      レンズも角度も光も関わらないからです。"""

[[howto]]
title = "余白ごと、シンボル全体を画面に入れる。"
body = """
\
      コードのまわりの白はコードの一部です。読み取り機はそこでシンボルの終わりを知ります。\
      四角のふちで切り落とされた写真は、読めない理由としてずば抜けて多いものです。\
      画面のおよそ半分をコードで埋めるくらいがちょうどよく、それより近づけると\
      角が画面から出ます。"""

[[howto]]
title = "何かを決める前にアドレスを読む。"
body = """
\
      ポスターや駐車券売機や封書のコードを読み取るのは、行き先を知るためです。\
      そしてそれこそ、スマホのカメラが実のところさせてくれない唯一のことです。\
      ここではホストが独立した一行に出ます。心当たりのない名前だったなら、\
      来た目的はもう果たされていて、開くものは残っていません。"""

[[howto]]
title = "警告は、とくに目立たないものほど本気で受け取る。"
body = """
\
      素の<code>http://</code>のアドレス、見た目どおりの文字体系ではない名前、\
      短縮サービス、アドレスの<code>@</code>より前にある何か。どれも現れた場所で\
      名指しされます。どれ一つとして、それだけで何かを証明するものではありません。\
      そしてどれもが、行く前の十秒に値します。"""

[[howto]]
title = "読めないときは、何よりまず光を変える。"
body = """
\
      失敗のほとんどはしきい値の問題です。真ん中を横切る映り込み、片隅にかかる影、\
      バックライトを拾う角度で撮った画面。反射がコードに乗らない位置へ動くか、\
      カメラのライトを点けてください。それでも駄目なら、真正面から平らに一枚撮って、\
      その静止画を置いてください。静止画は、生の映像より格段に念入りに探されます。"""

[[howto]]
title = "答えが妙なら、読み取った絵を確かめる。"
body = """
\
      「これをどう読んだか」を開いて、小さな格子を見てください。それは、\
      読み取ったモジュールから描き戻した、このページがコードだと思ったものです。\
      シンボルを読み違えたうえで、それらしい形に直してしまった読み取り機は、\
      そこにだけそれを表します。"""

[[faq]]
q = "画像はどこかへアップロードされますか？"
a = """
        されませんし、そこから読み取ったものもされません。画像はこのページの中の\
        キャンバスへデコードされ、このサイトから配信されたJavaScriptによってそこで\
        読まれます。この道具には通信機能が一つもなく、何かを取りに行くことも、\
        送ることもありません。ページの<code>Content-Security-Policy</code>には\
        接続してよいアドレスがすべて書かれていますが、そのどれもこのサイトのものでは\
        ありません。一番簡単な証明はインターネットを切ることです。そのまま動きます。"""

[[faq]]
q = "カメラは何か記録していますか？"
a = """
        していません。カメラの一コマはこのタブの中に画素として届き、キャンバスに描かれ、\
        調べられ、十分の一秒ほど後に次の一コマで上書きされます。ディスクには何も書かれず、\
        何も残りません。停止を押した瞬間、タブが背面に回ったとき、ページを離れたときに\
        ストリームは止まります。そして信じるべき表示はカメラのランプです。どんなページにも\
        あれを消すことはできません。"""

[[faq]]
q = "なぜ開かずにリンクを見せるのですか？"
a = """
        そこが役に立つところだからです。QRコードは読めないアドレスであり、\
        駐車券売機のコードに貼られたシールが効くのもそのためです。どこへ行ったか\
        分かったときには、もう着いています。ここでは文字列が全部表示され、\
        ホストは独立した一行に取り出され、開くのは読んだあとに押す別のボタンです。\
        ひと手間増えますが、この形式がずっと必要としてきたのはそのひと手間です。"""

[[faq]]
q = "何を読み取れますか？"
a = """
        QRコードはバージョン1から40まで、四つの誤り訂正レベルすべて、数字モード、\
        英数字モード、バイトモード、漢字モードに対応し、ECIの文字集合や連結された\
        シンボルは黙って捨てずに報告します。縞模様のほうはEAN-13、EAN-8、UPC-A、\
        UPC-E、ITF-14、インターリーブド2 of 5、Code 128、Code 39です。\
        Data Matrix、PDF417、Aztec、MaxiCodeは読みません。"""

[[faq]]
q = "コードが読み取れません。何が悪いのでしょう。"
a = """
        十のうち九は三つのうちのどれかです。白い余白が切り落とされている。\
        読み取り機はそこでシンボルの終わりを知ります。コードの一部に映り込みか影が\
        かかっていて、どのしきい値でも濃い四角と淡い四角を分けられない。あるいは\
        画面の中でコードが小さすぎて、モジュールが一、二画素しかない。光を変え、\
        画面の半分ほどを埋め、斜めからではなく正面から撮ってください。"""

[[faq]]
q = "傷んだコードや一部が隠れたコードも読めますか？"
a = """
        たいてい読めます。そしてそれは、こちらの器用さではなく、形式が設計どおりに\
        働いているだけのことです。QRコードはどれもReed-Solomonの検査データを持っていて、\
        レベルHで作られたシンボルはモジュールのおよそ30%を失っても元どおりに\
        組み直せます。何語の符号を直したかは「これをどう読んだか」に出るので、\
        どれくらい際どかったかが分かります。しないのは当て推量です。検査が支えきれない\
        ほど傷んだシンボルは、間違った答えを返すのではなく、読めないと報告されます。"""

[[faq]]
q = "bit.lyのリンクの行き先が分からないと言われるのはなぜですか？"
a = """
        調べるということはbit.lyに尋ねるということで、それは通信だからです。\
        このページの言い分は残らず、ここには何かに接続するコードが一つもないという\
        点に載っています。黙って例外を作れば、その答えより失うもののほうが大きい。\
        ですから短縮サービスの名前は出したうえで、その先は正直に分からないままに\
        してあります。解きたいのであれば、尋ねる気のある道具に貼ってください。"""

[[faq]]
q = "そもそもQRコードを読み取るのは安全ですか？"
a = """
        読み取ること自体は安全です。危ないのは従うことで、これは本当に危ない。\
        本物の上に貼られたコードは、駐車券売機でも、飲食店のテーブルでも、\
        宅配の不在票でも、名前が付くほど当たり前になりました。それが効くのは、\
        見ただけでコードを読める人がいないからです。開かずに読むこと、つまり\
        このページがしていることは、その優位をまるごと取り去ります。ホストを見る\
        十秒が、防御のすべてです。"""

[[faq]]
q = "結果の下にある小さな格子は何ですか？"
a = """
        このページがあなたの画像から実際に読み取ったモジュールを、一モジュール一マスで\
        描き戻したものです。読み取りを信じるのではなく目で確かめられるように置いてあります。\
        その格子が撮ったコードに似ていれば、上の答えは正しい画素から出ています。\
        これを見せる読み取り機はほとんどありません。そしてそこが、確かめられる道具と、\
        信じるしかない道具の違いです。"""

[[faq]]
q = "一枚の画像から複数のコードを読めますか？"
a = """
        今のところ一枚につき一つです。何枚かまとめて置けばそれぞれ別に読まれますし、\
        カメラは動かすたびに次々とコードを読み、まだ見ていないものを残していきます。\
        コードがびっしり並んだ紙の写真一枚は、切り抜くか、カメラを一つずつ向ける\
        場面です。"""

[[faq]]
q = "頼んだのと違う名前でバーコードが呼ばれるのはなぜですか？"
a = """
        バーコードは自分の名前を持ち歩かないからです。UPC-Aは先頭が0のEAN-13であり、\
        ITF-14は十四桁で検査数字の合うインターリーブド2 of 5であり、Code 128の数字モードは\
        ほかのどれとも似ていません。このページが報せるのは、バーが言っていることと、\
        検査数字が裏づけたことだけです。シンボル自身が知っているのもそれだけです。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んだあとインターネットを切っても、カメラも含めて\
        そのまま動きます。何もアップロードされていないことを示す一番簡単なやり方でも\
        あります。デコードのために画像を送り出す読み取り機なら、線を抜いた瞬間に\
        止まるからです。"""

[schema]
