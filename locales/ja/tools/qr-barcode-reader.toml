#
# QR コードとバーコードの読み取り - Japanese.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 誤り訂正レベル is the term the Japanese QR literature uses; 水準 is not.
#
# Long strings use a trailing backslash to join lines: a raw newline inside a
# TOML multi-line string becomes a real newline, and HTML collapses that to a
# space - which is visible between two Japanese characters.
#

