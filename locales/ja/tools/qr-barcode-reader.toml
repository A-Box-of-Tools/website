title = "QRコードリーダー・バーコード読み取り｜画像から、アップロードなし"
description = "写真、スクリーンショット、カメラからQRコードを読み取り、開く前にリンクの行き先をそのまま確かめられます。EAN、UPC、Code 128、Code 39、ITFのバーコードにも対応。何もアップロードされません。"
og_title = "画像を誰にも送らずにQRコードを読む"
og_description = "画像からでもカメラからでもQRコードを読み取り、開くかどうかを決める前にアドレス全体を確かめられます。画像はあなたの端末から出ませんし、カメラの映像は一コマも記録されません。"
og_image_alt = "QRコード・バーコード読み取りツール - 画像やカメラからコードを読む、アップロードなし"

pledge = """
    コードを読むのは画素に対する計算で、その画素はもうここにあります。シンボルを\
    見つけ、撮った角度を補正し、マスクを外し、Reed-Solomonで傷んだところを直し、\
    ビットを読み戻す。そのすべてが、このページの中の、あなたが読める二千行ほどの\
    JavaScriptで起きます。<strong>カメラも同じ約束であって、その例外ではありません。</strong>\
    一コマはこのタブの中に画素として届き、調べられ、消えます。記録もされず、\
    残りもせず、そもそもこのページには送るための通信機能が一つもありません。"""

live_hint = """
      言葉を信じる必要はありません。DevToolsを開き、ネットワークタブを見ながら、\
      カメラを動かしたままコードを読み取ってみてください。どのリクエストも、\
      映像も、そこに書かれていた文字も、一つとして運びません。あるいは\
      インターネットを切って、それでも読み取ってみてください。"""

read_first = """
、写真の中からシンボルを見つける\
      <code>src/binarize.js</code>と<code>src/detect.js</code>（しきい値、\
      切り出し用の位置検出パターン、そして射影変換）、読み戻す\
      <code>src/qr-decode.js</code>、読み違えたところを直す\
      <code>src/reed-solomon.js</code>、縞模様のほうの<code>src/linear.js</code>、\
      そしてこのページでカメラに触れる行のすべてである<code>src/camera.js</code>です。"""

howto_heading = "画像をアップロードせずにQRコードを読む手順"

card = """
            写真、スクリーンショット、カメラからQRコードを読み取り、\
            開く前にアドレス全体を確かめられます。バーコードも。"""

