features = [
  "写真、スクリーンショット、貼り付けた画像、ライブカメラからQRコードを読み取る",
  "バージョン1から40までのすべてのQR、四つの誤り訂正レベル、数字・英数字・バイト・漢字の各モード",
  "Reed-Solomon訂正により、擦れた、折れた、一部が隠れたコードもそのまま読める",
  "位置合わせパターンを使って角度と遠近を補正する",
  "濃い地に淡く印刷されたコードや、上下逆に撮られたコードも読める",
  "EAN-13、EAN-8、UPC-A、UPC-E、ITF-14、インターリーブド2 of 5、Code 128、Code 39",
  "何かを開く前に、アドレス全体と、実際にたどり着くホストを見せる",
  "リンクを装う手口を名指しする。@の前のユーザー名、そっくりな別の文字体系、転送",
  "Wi-Fi、連絡先カード、メール、SMS、電話、地図の中身を読める項目に分解する",
  "読み取ったモジュールを描き出すので、読み取りを信じるのではなく確かめられる",
