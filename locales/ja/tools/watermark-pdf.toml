[[privacy]]
title = "透かしを入れる書類こそ、アップロードしたくないものです。"
body = "家主に送る旅券、融資担当へ送る明細、漏らせない契約案。送り先を記すのは書類が手元から出るためですが、オンラインの透かしツールは先に他人のサーバーへ渡すよう求めます。ここではブラウザで読み、描き、メモリに書きます。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはありません。通信を切っても動きます。"

[[privacy]]
title = "透かしは送り先を示します。コピーそのものは防ぎません。"
body = "「Acme銀行専用、2026年9月12日」と各ページに記せば、別の場所で見つかったコピーに流出元が残ります。銀行、弁護士、家主が求める理由です。ただしPDF編集ソフトで外せるため、開封やコピーの防止ではありません。相手以外に読ませたくないなら<a href=\"../protect-pdf/\">PDF保護ツール</a>でパスワードを付けてください。結果の次の作業から移動できます。"

[[privacy]]
title = "画像として描くので、どの言語やフォントでも使えます。"
body = "PDFの文字には埋め込みフォントか標準の14種類が必要ですが、標準のフォントはラテン文字だけです。大きなフォントや描画エンジンを同梱する代わりに、端末のフォントでブラウザが文字を一度画像にし、ソフトマスクで透明度を付けて各ページに置きます。印刷にも十分な解像度です。文字の選択や検索はできませんが、見せるための透かしに適しています。"

[[privacy]]
title = "元のページを読み、描き直し、再配置はしません。"
body = "書類に画像、マスク、不透明度の3つのオブジェクトを加え、各ページの描画命令の前後に小さな命令を加えます。元の内容はデコードも変更もしません。描画命令、埋め込みフォント、画像はそのままで、スキャンの解像度、文字の選択や検索、配置を保ちます。過去の編集で残った古いオブジェクトのコピーは引き継ぎません。"

[[privacy]]
title = "プレビューは配置を示すものです。"
body = "このサイトは意図してPDFレンダラーを備えていません。プレビューは先頭ページと同じ大きさと形の白紙に、完成したファイルと同じ計算で透かしを置きます。正確な本文描画にはブラウザほどのエンジンが必要なので、本文は描きません。推測した見た目も表示しません。"

[[privacy]]
title = "渡す前に、完成したファイルをここで開き直します。"
body = "完成したバイトを共通のPDFリーダーへ戻し、元と同じページ数で、各ページのリソースに透かしがあり、最後に描く命令があることを確かめます。失敗したら伝え、ダウンロードを提供しません。"

[[privacy]]
title = "電子署名は残せず、見つけた場合は伝えます。"
body = "電子署名はファイルの正確なバイト列を対象とするので、書き直すと無効になります。今回のコピーは署名なしです。元に署名があれば結果で警告します。元の署名付きファイルはそのままです。"

[[privacy]]
title = "保護された書類は、先に解除します。"
body = "開くためのパスワードがある書類は、開かずに透かしを入れられません。このページはパスワードを求めず、<a href=\"../unlock-pdf/\">PDF保護解除ツール</a>を案内します。同じブラウザで解除したコピーに透かしを入れ、必要ならその後で<a href=\"../protect-pdf/\">PDF保護ツール</a>を使えます。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから読み込みます。ファイル、ページ、名前、サイズ、ページ数、透かしの文字は渡しません。PDFを読み、透かしを入れ、書くコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "ヘッダーの「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、Google Fontsの文字を使います。訪問を報告する機能のないリンクで、利用者や書類の情報は渡しません。クリックするまで何も起こらず、移動先は別のサイトです。"

[[privacy]]
title = "オフラインでも動きます。"
body = "通信を切ってもすべての機能が動きます。書類を別の場所へ送って透かしを入れるツールなら止まるので、簡単な証明になります。"

[[howto]]
title = "PDFを選びます。"
body = "書類は1つずつ、ブラウザがディスクから直接読みます。パスワードが必要なら解除ツールを案内します。それ以外はスキャンを含めて受け付けます。"

[[howto]]
title = "文字を入力します。"
body = "送り先と日付を「Acme銀行専用 &middot; 2026年9月12日」のように入力します。ブラウザが描くので、入力できる言語や文字ならどれでも使えます。"

[[howto]]
title = "配置を選び、プレビューを見ます。"
body = "大きさ、斜めか水平か、中央に1つか繰り返すか、薄さ、色、全ページか先頭だけかを選びます。プレビューは先頭ページと同じ形の白紙に、完成したファイルと同じ位置で透かしを描きます。"

[[howto]]
title = "透かしを入れ、確認結果を読みます。"
body = "書類に画像を1つ加え、各ページにそれを描く命令を付けます。完成したファイルを開き直し、同じページ数で各ページに透かしがあることを確かめます。失敗したら伝え、ダウンロードを提供しません。"

[[faq]]
q = "透かしは外せますか？"
a = "はい。PDF編集ソフトで外せるため、保護ではありません。送り先を示す役割です。「Acme銀行専用」のコピーが別の貸し手で見つかれば、流出元の名前が残ります。相手以外に読ませたくないなら<a href=\"../protect-pdf/\">PDF保護ツール</a>でパスワードを付けてください。"

[[faq]]
q = "中国語、アラビア語なども使えますか？"
a = "入力できる言語なら使えます。端末のフォントでブラウザが画像として描くので、埋め込みフォントのないPDFの文字のようにラテン文字へ限定されません。その代わり後から文字を選択したり検索したりはできません。"

[[faq]]
q = "プレビューに本文が見えないのはなぜですか？"
a = "このサイトは意図してPDFレンダラーを備えていません。正確にページを描くには大きなフォント・描画エンジンが必要です。プレビューは先頭ページと同じ大きさと形の白紙に、書き出しと共通の計算で透かしを置きます。本文と合わせた結果は保存後にリーダーで開いて確認できます。"

[[faq]]
q = "透かしの下の書類は変わりますか？"
a = "変わりません。描画命令、埋め込みフォント、画像をそのまま引き継ぎ、その上に指定した不透明度で透かしを描きます。文字の選択や検索、スキャンの解像度、配置は保ちます。全ページで共有する1枚の画像が加わり、数語の透かしなら数十KBほど増えます。"

[[faq]]
q = "スキャンや横向きのページにも使えますか？"
a = "どちらにも使えます。スキャンの画像の上にも透かしを置けます。回転情報で横向きに表示するページでも、表示される向きに合わせます。画面で斜めを選べば、スキャナーが考える紙の向きではなく画面に対して斜めになります。"

[[faq]]
q = "署名付き書類はどうなりますか？"
a = "電子署名は無効になります。署名は正確なバイト列を対象とするので、どのプログラムでも変更すれば無効になります。このツールは新しいファイルを書き、元の署名を検出したら結果で伝えます。元の署名付きファイルを残してください。"

[[faq]]
q = "パスワード付きPDFに透かしを入れられますか？"
a = "直接はできず、このページではパスワードを入力しません。同じブラウザで<a href=\"../unlock-pdf/\">PDF保護解除ツール</a>を使い、そのコピーに透かしを入れ、必要なら<a href=\"../protect-pdf/\">PDF保護ツール</a>で再設定してください。誰でも開ける操作制限だけのファイルも、書き直すと制限を失うため、同じように先に解除します。"

[[faq]]
q = "書類や入力した文字は送信されますか？"
a = "いいえ。書類の読み込み、透かしの描画、書き出しはお使いのブラウザとハードウェアで行います。サーバーはなく、<code>Content-Security-Policy</code>の接続先にこのサイト自身のものはありません。通信を切って使うことでも確認できます。"

[[faq]]
q = "各ページに透かしがあることをどう確かめますか？"
a = "端末で完成したファイルを共通リーダーで開き直します。元と同じページ数で、各ページのリソースに透かしがあり、最後に描く命令がある必要があります。1ページでも違えば失敗を伝え、ダウンロードを提供しません。"

[[faq]]
q = "容量制限や料金はありますか？"
a = "ツール自体には制限を設けていません。処理中は書類をメモリに保持するため、限界は端末によります。ノートパソコンは数百MBなら通常扱えますが、それを大きく超えると難しくなります。無料で、アカウント、ログイン、お試し期間はありません。広告で運営していますが、書類の情報は広告に渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。一度開いて通信を切っても動きます。書類を別の場所へ送って透かしを入れるツールなら止まるので、何も送信しないことの確認になります。"

