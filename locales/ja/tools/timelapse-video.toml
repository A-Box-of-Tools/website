#
# タイムラプス作成 - Japanese.
#
# Overrides for tools/timelapse-video/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 「微速度撮影」は辞書の語で、検索窓に打たれるのは「タイムラプス」です。
# 名前も見出しもそちらを取ります。倍速との言い分けは、倍速が再生の話、
# タイムラプスが素材そのものを短くする話、という一点で通しています。
#
# コーデック名(H.264・HEVC・AV1・VP9)とコンテナ名は訳しません。
#

name = "タイムラプス作成ツール"
# 後半の span が検索される語です。
heading = "タイムラプス作成<span class=\"h1-kw\">｜長い動画を早送りにする</span>"
tagline = "1時間の素材が20秒に。"

title = "タイムラプスをオンラインで作成｜無料・アップロード不要・オフライン対応"
description = "長い動画をタイムラプスに変換します。10倍、60倍、入力した任意の倍率まで。処理はブラウザの中だけ。アップロードなし、透かしなし、オフラインでも動きます。"
og_title = "タイムラプス作成｜アップロードせずに動画を早送りにする"
og_description = "長い映像から数秒おきに1フレームずつ取り出し、短い映像として書き戻します。ファイルの読み込みもデコードもエンコードも、お使いのブラウザが行います。"
og_image_alt = "タイムラプス作成 - ブラウザ内で長い動画を早送りにし、何もアップロードしません"

pledge = """
    すべてのフレームを選び、デコードし、エンコードし直すのは、お使いの\
    ブラウザと手元のハードウェアです。何かを取りに行ったり送ったりできる\
    部分はここにありません。このツールにはネットワーク機能が一切なく、\
    仮にあったとしても、このページの向こう側に動画を受け取るサーバーが\
    存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      タイムラプスを作ってみてください。フレームもファイル名も、選んだファイルの\
      1バイトも、どのリクエストにも載りません。回線を抜いてから作ってみるのでも\
      構いません。処理のために動画をどこかへ送っている道具なら、そこで\
      止まります。"""

read_first = """
、どのフレームをいつの瞬間から取るかを決める計算に\
      ついては<code>src/plan.js</code>、その瞬間に必要な部分だけをファイルから\
      読み出すループについては<code>src/decode.js</code>です。どちらもリクエストを\
      出せるものを読み込んでいません。"""

howto_heading = "動画からタイムラプスを作る手順"

card = """
            長い映像を短い映像に、何時間かを何秒かに。どこにも送らずに\
            変換します。"""

[words]
plural = "動画"
choose = "動画"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "アカウント不要"

[[facts]]
text = "透かしなし"

[[facts]]
text = "倍率は自由に入力"

[[facts]]
text = "オフラインで動作"

[[privacy]]
title = "動画には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
このツールにはネットワーク機能が一切ありません。貼り付けるアドレスも、\
      ダウンロードするものも、初回に取りに行くエンジンもありません。動画に触れる\
      コードは、1バイト残らずページを読み込んだときにこのオリジンから届いた\
      ものです。"""

[[privacy]]
title = "デコードもエンコードも手元で行います。"
body = """
フレームが通るのは、お使いのブラウザのWebCodecsか、そうでなければ、\
      そもそもその映像を再生するのに使われるのと同じ再生エンジンです。できあがった\
      ファイルはこの端末のメモリ上で組み立て、そのままダウンロードへ渡します。"""

[[privacy]]
title = "ファイルの大半は読み込みすらしません。"
body = """
タイムラプスに要るのは数秒おきの1フレームだけなので、その瞬間の前後だけを\
      短く読み、あとは飛ばします。これはプライバシーではなく速度のための判断\
      ですが、知っておく価値はあります。手元の端末の中でさえ、動画の大半は\
      一度も開かれません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、動画に関する\
      情報は渡されません。ファイルも、フレームも、名前も、サイズも、長さもです。\
      読み込み、デコード、フレームの選択、エンコードを行うコードはすべてこの\
      オリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や動画に関する情報も\
      渡されません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
MP4・MOV・M4V・WebMを選択エリアにドラッグするか、手元から選んでください。\
      ブラウザがディスクから直接読み込み、その間に外へ出ていくものはありません。"""

[[howto]]
title = "どれだけ速くするかを決めます。"
body = """
倍率のボタンを押すか、数値を直接入力します。「20秒に収めたい」のように\
      できあがりの長さで指定したい場合は、その秒数を入れれば倍率のほうが\
      決まります。"""

[[howto]]
title = "間隔を確かめます。"
body = """
倍率の下の行が、実際に何が起きるのかを示します。元の映像の何秒おきに\
      1フレームを取るか、という数字です。カメラで設定するのと同じ値なので、\
      始める前に一度見ておくとよい数字です。"""

[[howto]]
title = "作成してダウンロードします。"
body = """
処理は手元のハードウェアで行うので、かかる時間は順番待ちではなく端末の\
      性能で決まります。できあがった動画はそのままブラウザのダウンロードへ\
      渡ります。"""

[[faq]]
q = "動画はどこかにアップロードされますか。"
a = """
        されません。読み込みもデコードも、フレームの選択もエンコードも、\
        お使いのブラウザが手元のハードウェアで行います。このツールにサーバー側は\
        なく、ページの<code>Content-Security-Policy</code>には接続してよい\
        アドレスがすべて挙がっていますが、そのどれも当サイトのものでは\
        ありません。言葉より確認という方は、回線を抜いてから作ってみてください。"""

[[faq]]
q = "倍率とは正確には何ですか。"
a = """
        入っていくものと出てくるものの比です。60倍なら1時間の素材が1分になり、\
        何フレームで再生してもその1分は変わりません。内側では\
        <em>倍率 &divide; フレームレート</em>秒ごとに1フレームを取っています。\
        30fpsの60倍なら2秒に1フレームです。ページは始める前にこの間隔を出します。\
        実際に何をしているかを言うのはそちらの数字だからです。"""

[[faq]]
q = "どの動画形式を早送りにできますか。"
a = """
        MP4・M4V・MOVは中身が何であっても直接読みます。ブラウザがそのコーデックを\
        デコードできるかぎり、H.264でもHEVCでもAV1でもVP9でも構いません。それ以外で\
        ブラウザが再生できるもの、代表的にはWebMは、ブラウザ自身のプレーヤーを\
        各瞬間へ移動させて読みます。再生できる形式ならどれでも通る方法です。\
        ブラウザが読むことも再生することもできないファイル、実際にはAVI・WMV・FLVと\
        大半のMKVは、途中で失敗するのではなく、その旨を伝えて最初にお断りします。\
        出てくるのは常にMP4です。"""

[[faq]]
q = "タイムラプスに音が入らないのはなぜですか。"
a = """
        残す価値のあるものがないからです。30倍の速さの音は話し声でも音楽でもなく、\
        ただのかん高い音です。かといって元の速さの音を、はるか先へ行ってしまった\
        映像の下に敷けば、それはご依頼のものとは別の映像になります。そこで音声\
        トラックは落としています。1時間の動画が数メガバイトで出てくる理由の大半も\
        これです。音声だけが必要な場合は\
        <a href="../edit-audio/">音声編集ツール</a>で保存できます。"""

[[faq]]
q = "動画全体を変換するより速いのですか。"
a = """
        はるかに速く、ファイルを直接読んでいるのはそのためです。1フレームを\
        デコードするには手前のキーフレームから始めるほかありませんが、その間の\
        フレームまで残せとはどこにも書いてありません。1時間を60倍にする場合、\
        デコードするのは10万枚ではなく数千枚です。ボタンを押す前に、何枚読むかを\
        まとめ欄が正確に伝えます。"""

[[faq]]
q = "画質は落ちますか。"
a = """
        残したフレームをもう一度エンコードするぶんだけ落ちます。これは避けられ\
        ません。できあがった映像は、元のファイルでは何もエンコードされていない\
        時刻にそのフレームを表示するからです。一方でこのツールは、ここにある他の\
        動画ツールよりビットレートを多く使います。意図的です。2秒離れた2枚の\
        フレームは、30分の1秒離れた2枚より共通点がずっと少なく、コーデックが\
        使い回せるものが少ないので、通常の映像向けの値ではブロック状になります。"""

[[faq]]
q = "サイズや長さに上限はありますか。"
a = """
        ツール側に上限は設けていませんし、ファイルを丸ごとメモリに載せることも\
        しません。読むのは各瞬間の前後の短い範囲だけです。現実的な上限は、\
        ダウンロード前にメモリ上で組み立てるできあがりのほうですが、タイムラプスは\
        定義からして短いものです。おおよそのサイズは始める前にまとめ欄に出ます。"""

[[faq]]
q = "映像の一部だけを早送りにできますか。"
a = """
        ここではできません。このツールは最初のフレームから最後のフレームまで\
        全体を扱います。必要な区間はまず\
        <a href="../trim-video/">動画カットツール</a>で切り出してください。\
        そちらはフレームを一枚も再エンコードせずに切り出せるので、出てきた\
        ファイルをここに入れてください。"""

[[faq]]
q = "無料ですか。アカウントは要りますか。"
a = """
        無料です。アカウントもログインも試用期間も透かしもありません。サイトは\
        広告で成り立っていますが、広告に動画に関する情報は渡されません。"""

[schema]
browser_requirements = "JavaScriptと、WebCodecsで動画をエンコードできるブラウザが必要です。Chrome、Edge、Safari 16.4以降、Firefox 133以降。"
description = "長い動画をブラウザ内でタイムラプスに変換します。元の映像から数秒おきに1フレームを取り、24・30・60fpsの短いMP4として書き戻します。MP4・MOV・M4Vは直接読み、しかも必要な瞬間の前後だけを読みます。ブラウザが再生できるそれ以外の形式は、再生位置を移動させながら読みます。アップロードは行いません。"
features = [
  "MP4・MOV・M4V・WebMの動画を1.1倍から1000倍まで早送りに",
  "倍率で指定しても、できあがりの長さで指定してもよい",
  "選んだ瞬間に必要な部分だけをファイルから読む",
  "24・30・60fps、元のサイズまたは縮小",
  "オフラインで動作。アップロードなし、アカウント不要、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "またはクリックして選択 &mdash; MP4・MOV・M4V・WebM、そのほかこのブラウザが再生できるもの"
