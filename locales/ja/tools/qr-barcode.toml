  "数字モードを自動で使う Code 128 と、検査文字を任意で付けられる Code 39",
  "バーコードの下に、人が読める数字を正しい位置に印字します",
  "SVG で書き出すのでどの大きさでもくっきり印刷でき、PNG は1モジュールあたり整数ピクセルで描きます",
