#
# QR コードとバーコードの作成 - Japanese.
#
# Overrides for tools/qr-barcode/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# This tool has no [picker] table - its input is typed, not dropped.
#
# 誤り訂正レベル is the term the Japanese QR literature uses; 水準 is not.
#

name = "QRコード・バーコード作成ツール"
# 後半の span が検索される語です。
heading = "QR・バーコード<span class=\"h1-kw\">｜QRコード作成もバーコード作成もオフラインで</span>"
tagline = "打ち込めば、そのままコードになります。作るために何かを送ることはありません。"

title = "QRコード・バーコード作成｜無料・登録不要・アップロードなし"
description = "リンク、Wi-Fi、連絡先カードのQRコードや、EAN-13・UPC-A・Code 128・Code 39のバーコードを作れます。SVGでもPNGでもダウンロードできます。すべてブラウザの中で完結します。"
og_title = "誰にも何も送らずに、QRコードやバーコードを作る"
og_description = "リンク、Wi-Fiのパスワード、連絡先カード、流通用バーコードを、お使いのブラウザで描き、SVGかPNGでダウンロードします。アカウントも、透かしも、コードの真ん中に仕込まれた計測用の細工もありません。"
og_image_alt = "QRコード・バーコード作成 - QRコードやバーコードを作る、アップロードなし"

pledge = """
    QRコードとは、文字列に対する計算です。送るファイルもなければ、頼むサービスも\
    ありません。モードの選択、バージョンの決定、リード・ソロモン誤り訂正、マスク、\
    バーコードのバーとその下のチェックディジット。そのすべてが、このページの中の、\
    誰でも読める1000行ほどのJavaScriptの中で起きます。このツールにはネットワーク\
    機能が一切ありません。ここではそれが、ほかの多くのページより重い意味を持ちます。\
    エンコードされるのは、しばしばWi-Fiのパスワードだからです。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま、\
      Wi-Fiの欄にパスワードを打ち込んでみてください。その1文字も、どのリクエストにも\
      載りません。回線を抜いてからコードを作ってみるのでも構いません。"""

read_first = """
、QRコード本体については<code>src/qr-encode.js</code>と\
      <code>src/qr.js</code>です。一方にモード、バージョン、ブロックが、もう一方に\
      位置検出パターン、マスク、形式情報のビットがあります。誤り訂正については\
      <code>src/gf256.js</code>、縞模様のほうについては<code>src/barcode.js</code>\
      です。"""

howto_heading = "何もアップロードせずにQRコードを作る手順"

card = """
            リンク、Wi-Fi、連絡先カードのQRコード。あるいは、チェックディジット\
            まで計算した流通用バーコード。SVGでもPNGでも受け取れます。"""

