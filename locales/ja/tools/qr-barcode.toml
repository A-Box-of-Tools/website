[[privacy]]
title = "打ち込んだものには出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。Wi-Fiのパスワードを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありません。コードは文字列から計算で組み立て、SVGとして\
      描きます。このページの中で、手元の端末の上でです。"""

[[privacy]]
title = "できたコードは、当サイトを指しません。"
body = """
打ち込んだものが、そのままコードの中身です。無料の生成サイトのいくつかは、\
      自分のサイトへのリンクを含んだコードを返し、そこから本来のアドレスへ転送します。\
      つまりスキャンのたびに向こうが数を数えており、そのドメインの費用を払うのを\
      やめた日や、無料枠が終わったと決めた日に、コードは動かなくなります。ここでは\
      短縮も、転送も、追跡もしません。ページに表示されている文字列が、そのまま絵の\
      中の文字列です。"""

[[privacy]]
title = "PNGは、画面に出ているSVGから作ります。"
body = """
ダウンロードされるものは、プレビューと食い違いうる第2の描画ではありません。\
      同じマークアップをブラウザに渡し、キャンバスに描いています。だからこそ、どこにも\
      接続せずにそれができます。取りに行くフォントも、中に読み込む画像もないからです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、打ち込んだものは渡されません。文字列をコードに変える\
      コードはすべてこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "コードの種類を選びます。"
body = """
QRコードは何でも入りますし、スマホのカメラが探しているのもこれなので、別の\
      指定がない限りこれが答えです。バーコードに入れられるのは数字で、どれが必要かは\
      それを読む側が決めます。店頭ならEAN-13かUPC-A、出荷用の外装箱ならITF-14、社内用\
      ならたいていCode 128です。"""

[[howto]]
title = "中に入れるものを指定します。"
body = """
いちばん多いのはリンクで、その上の欄からは、スマホが知っているほかの形式を\
      組み立てられます。参加を提案してくるWi-Fi、保存を提案してくる連絡先カード、\
      メール、SMS、電話番号、地図上の場所です。どれを選んでも、できあがった文字列は\
      ページに表示します。QRコードが抱えているのは、いつだってそれだけだからです。"""

[[howto]]
title = "どれだけ傷んでよいかを決めます。"
body = """
4つの誤り訂正レベルは、検査用データをどれだけ持つかを決めるもので、多いほど\
      コードは大きく密になります。画面ならL、ふつうの紙ならM、手で触られる、小さく\
      印刷される、日の当たる窓に貼られるものならHです。毎日拭かれるメニューの上の\
      コードなら、QかHの価値があります。"""

[[howto]]
title = "大きさ、余白、色を決めます。"
body = """
余白はコードの一部です。周囲4モジュール分の静かな空白は仕様が求めているもので、\
      それを削ることは、印刷したコードが読めない理由として最も多いものです。明るい地に\
      暗い図形、しかも本当に差のある色にしてください。スキャナーが読むのは2色の差なので、\
      白地に薄い灰色ではだめですし、暗い地に明るい図形は、かなり多くの読み取り機で\
      完全に失敗します。"""

[[howto]]
title = "手元のスマホで試します。"
body = """
千枚印刷する前に、画面に出ているものを1枚読ませてみてください。10秒で済み、\
      プレビューでは捕まえられない種類の間違いをまとめて捕まえられます。エスケープが\
      必要な文字を含むWi-Fiのパスワード、<code>https://</code>の抜けたリンク、1桁\
      足りないバーコードの番号などです。"""

[[howto]]
title = "SVGを受け取ります。"
body = """
ピクセルではなく指示としてのコードなので、どんな大きさで印刷してもぼやけません。\
      そしてぼやけた縁こそ、スキャナーが解像できないものです。貼り付け先がSVGを受け\
      付けないなら、PNGも受け取ってください。1モジュールあたり整数ピクセルで描いて\
      いるので、こちらにもぼやけた縁はありません。"""

[[faq]]
q = "打ち込んだものはどこかへ送られますか？"
a = """
        送られません。QRコードとは文字列に対する計算で、その計算が走るのは手元の端末の、\
        お使いのブラウザの中です。このツールにはネットワーク機能が一切なく、何も取りに\
        行かず、何も送りません。ページの<code>Content-Security-Policy</code>には接続\
        してよいアドレスがすべて挙がっていますが、そのどれも当サイトのものではありません。\
        これはほかのページより重い意味を持ちます。人がQRコードに入れるものとして最も\
        多いのは、自宅のWi-Fiのパスワードだからです。"""

[[faq]]
q = "このコードに期限はありますか。あとで使えなくなりませんか？"
a = """
        ありませんし、なりようがありません。打ち込んだものがそのままコードの中身なので、\
        読み取れば永久にその文字列が返ってきます。期限が来るのは、他人のアドレスが中に\
        入っているコードのほうです。「ダイナミック」なQRコードは生成元のサーバーへの\
        リンクを抱えており、そこから本来のアドレスへ転送されます。つまり向こうはスキャンを\
        数え、行き先を変え、試用期間が終われば止められます。ここでは何も、どこも経由\
        しません。"""

[[faq]]
q = "無料ですか。商用利用はできますか？"
a = """
        無料です。アカウントも、透かしも、作れる枚数の上限もありません。できたものを\
        製品にも、ポスターにも、店頭にも使えます。QRコードはデンソーウェーブの登録商標\
        ですが、同社はコードを使う人に対してそれを行使しないと表明しています。仕様は\
        ISO/IEC 18004として公開されており、自由に実装できます。このページがしているのが\
        それです。このサイトには広告があり、それが費用を賄っています。"""

[[faq]]
q = "誤り訂正レベルはどれを選べばいいですか？"
a = """
        理由がなければMです。Lはコードがいちばん小さくなり、画面なら十分です。Mはふつうの\
        取り扱いに耐えます。QとHは、小さく印刷される、ラミネートされる、窓に貼られる、\
        ロゴで一部が隠されるコードのためのものです。1段上げるごとに検査用のデータが増える\
        ので、同じ文字数でもより大きなシンボルが必要になります。LからHに移ると、同じ\
        文字列でモジュール数がおよそ2倍になります。"""

[[faq]]
q = "QRコードにはどれだけ入りますか？"
a = """
        最大の177モジュール四方で、数字なら7,089文字、大文字と数字なら4,296文字、それ以外\
        なら2,953バイトまでです。しかもこれは誤り訂正がいちばん弱い場合で、いちばん強い\
        場合はその3分の1ほどになります。実際には、上限を決めるのは形式ではなくスキャナー\
        です。数百文字を超えるとモジュールが小さくなりすぎて、ふつうのスマホのカメラでは\
        腕を伸ばした距離から解像できません。長いコードはたいてい、代わりに短いリンクを\
        入れるべきだという合図です。"""

[[faq]]
q = "リンクを小文字で書くとコードが大きくなるのはなぜですか？"
a = """
        QRコードには大文字と数字のためのモードがあり、2文字を11ビットに詰め込みます。\
        小文字にはそれがなく、1文字あたり8ビットかかります。\
        <code>HTTPS://EXAMPLE.COM/PAGE</code>と書いたURLは、同じURLを小文字で書いた場合\
        より3分の1ほど小さくなることがあります。スキームとホストは大文字小文字を区別\
        しないので、大声で書いても大きさ以外は何も変わりません。ホストより後のパスは\
        区別するので、そちらはそのままにしてください。"""

[[faq]]
q = "QRコードを読み取ることもできますか？"
a = """
        このページではできませんが、隣のページでできます。\
        <a href="../qr-barcode-reader/">読み取りツール</a>が写真やスクリーン\
        ショット、あるいはカメラを受け取って、中の文字列を返します。描くのに\
        比べればかなり大きな仕事で、画像の中からシンボルを見つけ、撮った角度を\
        補正し、傷んだところを直す。この三つはこのページには無い問題です。だから\
        ここのボタンではなく、独立した道具になっています。条件はほかと同じで、\
        アップロードは一切なく、カメラの映像も残しません。"""

[[faq]]
q = "余白は何のためにあり、小さくできますか？"
a = """
        QRコードの周りの白い部分は、コードの一部です。読み取り機はそれを使ってシンボルの\
        終わりを見つけており、仕様は四方に4モジュール分を求めます。バーコードなら10\
        モジュール分ほどです。ここでは0にもできますし、そうすれば見た目は整いますが、\
        かなり多くのスキャナーがそもそも見つけられなくなります。とくに、背景が込み入って\
        いる場合です。場所が問題なら、余白を削るのではなくコードを小さくしてください。"""

[[faq]]
q = "どのバーコードが必要ですか？"
a = """
        読み取る側が指定するものです。EAN-13は北米以外の流通用バーコード、UPC-Aは北米の\
        ものです。どちらもGS1から発行された番号が必要です。番号が識別しているのは製品\
        だけでなく、その会社だからです。EAN-8は小さなパッケージ向けの短い版です。ITF-14は\
        出荷用の外装箱に付きます。Code 128とCode 39は数字だけでなく文字も入り、登録は一切\
        要りません。資産、棚、作業票など社内用のものには、これが正しい答えです。"""

[[faq]]
q = "チェックディジットとは何で、なぜ足されたのですか？"
a = """
        流通用バーコードの最後の1桁で、その前の桁から計算されます。スキャナーが、誤読と\
        正しい読み取りを見分けられるようにするためのものです。EAN-13は12桁を求めて13桁目を\
        計算し、UPC-Aは11桁を求めて12桁目を計算します。短いほうの番号を打ち込めば、この\
        ページがそれを足します。完全な番号を打ち込めば、与えられた桁を検算し、黙って直す\
        のではなく拒みます。誤った桁を静かに修正することは、他人の製品として読み取られる\
        ラベルを作ることだからです。"""

[[faq]]
q = "QRコードの真ん中にロゴを入れられますか？"
a = """
        ここではできませんが、ほかでそれが成り立つ理由は知っておく価値があります。可能に\
        しているのは誤り訂正です。レベルHではモジュールのおよそ30%が失われてもまだ読める\
        ので、それより少ない面積を中央、つまり位置検出パターンのないところで覆うロゴは、\
        修復可能な損傷にすぎません。レベルHで作ったコードを画像編集ソフトに通し、ロゴは\
        面積の5分の1程度までに抑え、信じ込まずに実際のスマホで試してください。"""

[[faq]]
q = "PNGよりSVGのほうが良いのはなぜですか？"
a = """
        コードとは縁の集まりであり、PNGはそれを作るためのピクセル数が固定されているから\
        です。拡大すればどの縁もぼやけます。そしてぼやけた縁こそ、スキャナーが苦手とする\
        ものです。1200dpiのプリンターに512ピクセルのPNGを渡すのは、差を発明しろと頼んで\
        いるのと同じです。SVGは正方形を指示として持っているので、名刺でも屋外広告でも\
        くっきり印刷されます。ここのPNGは1モジュールあたり整数ピクセルで描いており、それが\
        PNGにできる最善です。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。コードを描いて\
        もらうためにテキストをどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

