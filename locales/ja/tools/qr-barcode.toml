  "外装箱と倉庫向けのITF-14とインターリーブド2 of 5",
  "数字モードを自動で使うCode 128と、検査文字を任意で付けられるCode 39",
  "バーコードの下に、人が読める数字を正しい位置に印字します",
  "SVGで書き出すのでどの大きさでもくっきり印刷でき、PNGは1モジュールあたり整数ピクセルで描きます",
