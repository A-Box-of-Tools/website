title = "打ち込んだものには出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。Wi-Fi のパスワードを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 <code>src/</code> の\
      どこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。コードは文字列から計算で組み立てられ、
      SVG として描かれます。このページの中で、あなたの端末の上で。"""

[[privacy]]
title = "できたコードは、私たちを指しません。"
body = """
 打ち込んだものが、そのまま\
      コードの中身です。無料の生成サイトのいくつかは、自分のサイトへのリンクを\
      含んだコードを返し、そこからあなたのアドレスへ転送します &mdash; つまり\
      スキャンのたびに向こうが数を数えており、そのドメインの費用を払うのをやめた\
      日や、無料枠が終わったと決めた日に、コードは動かなくなります。ここでは\
      短縮も、転送も、追跡もしません。ページに表示されている文字列が、そのまま\
      絵の中の文字列です。"""

[[privacy]]
title = "PNG は、画面に出ている SVG から作られます。"
body = """
 ダウンロードされるものは、\
      プレビューと食い違いうる第2の描画ではありません。同じマークアップが\
      ブラウザに渡され、キャンバスに描かれます。だからこそ、どこにも接続せずに\
      それができます。取りに行くフォントも、中に読み込む画像もないからです。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたが打ち込んだものは渡されません。文字列をコードに変える\
      コードはすべてこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切ってもこのツールは何も変わりません。\
      もともと通信する段階が存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "コードの種類を選びます。"
body = """
 QR コードは何でも入り、スマホの\
      カメラが探しているのもこれなので、別の指定がない限りこれが答えです。\
      バーコードが入れられるのは数字で、どれが必要かはそれを読む側が決めます
      &mdash; 店頭なら EAN-13 か UPC-A、出荷用の外装箱なら ITF-14、社内用なら\
      たいてい Code 128 です。"""

[[howto]]
title = "中に入れるものを指定します。"
body = """
 いちばん多いのはリンクで、その上の\
      欄からは、スマホが知っているほかの形式を組み立てられます。参加を提案して\
      くる Wi-Fi、保存を提案してくる連絡先カード、メール、SMS、電話番号、地図上の\
      場所です。どれを選んでも、できあがった文字列はページに表示されます &mdash;
      QR コードが抱えているのは、いつだってそれだけです。"""

[[howto]]
title = "どれだけ傷んでよいかを決めます。"
body = """
 4つの水準は誤り訂正の量を\
      決めるもので、訂正が多いほどコードは大きく密になります。画面なら L、\
      ふつうの紙なら M、手で触られる、小さく印刷される、日の当たる窓に貼られる\
      ものなら H です。毎日拭かれるメニューの上のコードなら、Q か H の価値が\
      あります。"""

[[howto]]
title = "大きさ、余白、色を決めます。"
body = """
 余白はコードの一部です。周囲4モジュール\
      分の静かな空白は仕様が求めているもので、それを削ることは、印刷したコードが\
      読めない理由として最も多いものです。明るい地に暗い図形、しかも本当に差の\
      ある色で &mdash; スキャナーが読むのは2色の差なので、白地に薄い灰色では\
      だめですし、暗い地に明るい図形は、かなり多くの読み取り機で完全に失敗します。"""

[[howto]]
title = "手元のスマホで試します。"
body = """
 千枚印刷する前に、画面に出ている\
      ものを1枚読ませてみてください。10秒で済み、プレビューでは捕まえられない\
      種類の間違いをまとめて捕まえられます。エスケープが必要な文字を含む Wi-Fi の\
      パスワード、<code>https://</code> の抜けたリンク、1桁足りないバーコードの\
      番号などです。"""

[[howto]]
title = "SVG を受け取ります。"
body = """
 ピクセルではなく指示としてのコードなので、\
      どんな大きさで印刷してもぼやけません。そしてぼやけた縁こそ、スキャナーが\
      解像できないものです。貼り付け先が SVG を受け付けないなら PNG も受け取って\
      ください。1モジュールあたり整数ピクセルで描かれているので、こちらにも\
      ぼやけた縁はありません。"""

[[faq]]
q = "打ち込んだものはどこかへ送られますか？"
a = """
        送られません。QR コードとは文字列に対する計算で、その計算はあなた自身の\
        端末の、あなた自身のブラウザの中で走ります。このツールにはネットワーク\
        機能が一切なく &mdash; 何も取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。これはほかの\
        ページより重い意味を持ちます。人が QR コードに入れるものとして最も多いのは、\
        自宅の Wi-Fi のパスワードだからです。"""

[[faq]]
q = "このコードに期限はありますか。あとで使えなくなりませんか？"
a = """
        ありませんし、なりようがありません。打ち込んだものがそのままコードの中身\
        なので、読み取れば永久にその文字列が返ってきます。期限が来るのは、他人の\
        アドレスが中に入っているコードのほうです。「ダイナミック」な QR コードは\
        生成元のサーバーへのリンクを抱えており、そこからあなたのアドレスへ転送\
        されます。つまり向こうはスキャンを数え、行き先を変え、試用期間が終われば\
        止められます。ここでは何も、どこも経由しません。"""

[[faq]]
q = "無料ですか。商用利用はできますか？"
a = """
        無料です。アカウントも、透かしも、作れる枚数の上限もありません。できた\
        ものを製品にも、ポスターにも、店頭にも使えます。QR コードはデンソーウェーブの\
        登録商標ですが、同社はコードを使う人に対してそれを行使しないと表明しています
        &mdash; 仕様は ISO/IEC 18004 として公開されており、自由に実装できます。\
        このページがしているのがそれです。このサイトには広告があり、それが費用を\
        賄っています。"""

[[faq]]
q = "誤り訂正の水準はどれを選べばいいですか？"
a = """
        理由がなければ M です。L はコードがいちばん小さくなり、画面なら十分です。
        M はふつうの取り扱いに耐えます。Q と H は、小さく印刷される、ラミネート\
        される、窓に貼られる、ロゴで一部が隠されるコードのためのものです。1段\
        上げるごとに検査用のデータが増えるので、同じ文字数でもより大きなシンボルが\
        必要になります &mdash; L から H に移ると、同じ文字列でモジュール数がおよそ
        2倍になります。"""

[[faq]]
q = "QR コードにはどれだけ入りますか？"
a = """
        最大の177モジュール四方で、数字なら7,089文字、大文字と数字なら4,296文字、\
        それ以外なら2,953バイトまでです &mdash; しかもこれは誤り訂正がいちばん\
        弱い場合で、いちばん強い場合はその3分の1ほどになります。実際には、上限を\
        決めるのは形式ではなくスキャナーです。数百文字を超えるとモジュールが\
        小さくなりすぎて、ふつうのスマホのカメラでは腕を伸ばした距離から解像\
        できません。長いコードはたいてい、代わりに短いリンクを入れるべきだという\
        合図です。"""

[[faq]]
q = "リンクを小文字で書くとコードが大きくなるのはなぜですか？"
a = """
        QR コードには大文字と数字のためのモードがあり、2文字を11ビットに詰め込み\
        ます。小文字にはそれがなく、1文字あたり8ビットかかります。
        <code>HTTPS://EXAMPLE.COM/PAGE</code> と書いた URL は、同じ URL を小文字で\
        書いた場合より3分の1ほど小さくなることがあります。スキームとホストは\
        大文字小文字を区別しないので、大声で書いても大きさ以外は何も変わりません。\
        ホストより後のパスは区別するので、そちらはそのままにしてください。"""

[[faq]]
q = "QR コードを読み取ることもできますか？"
a = """
        まだできません。読み取るとは画像を解読することで &mdash; 写真の中から\
        シンボルを見つけ、撮られた角度を補正し、傷んだ部分を修復することです
        &mdash; 描くのとは別の、しかもかなり大きな仕事です。ほかのすべてと同じ\
        条件でここに作ることはでき、予定には入っています。それまでは、お手持ちの\
        スマホのカメラがすでにやってくれますし、しかも上手です。"""

[[faq]]
q = "余白は何のためにあり、小さくできますか？"
a = """
        QR コードの周りの白い部分は、コードの一部です。読み取り機はそれを使って\
        シンボルの終わりを見つけており、仕様は四方に4モジュール分を求めます。\
        バーコードなら10モジュール分ほどです。ここでは0にもできますし、そうすれば\
        見た目は整いますが、かなり多くのスキャナーがそもそも見つけられなくなります
        &mdash; とくに、背景が込み入っている場合です。場所が問題なら、余白を削る\
        のではなくコードを小さくしてください。"""

[[faq]]
q = "どのバーコードが必要ですか？"
a = """
        読み取る側が指定するものです。EAN-13 は北米以外の流通用バーコード、UPC-A は\
        北米のものです &mdash; どちらも GS1 から発行された番号が必要です。番号が\
        識別しているのは製品だけでなく、あなたの会社だからです。EAN-8 は小さな\
        パッケージ向けの短い版です。ITF-14 は出荷用の外装箱に付きます。Code 128 と
        Code 39 は数字だけでなく文字も入り、登録は一切要りません。資産、棚、作業票\
        など社内用のものには、これが正しい答えです。"""

[[faq]]
q = "チェックディジットとは何で、なぜ足されたのですか？"
a = """
        流通用バーコードの最後の1桁で、その前の桁から計算されます。スキャナーが、\
        誤読と正しい読み取りを見分けられるようにするためのものです。EAN-13 は12桁を\
        求めて13桁目を計算し、UPC-A は11桁を求めて12桁目を計算します。短いほうの\
        番号を打ち込めば、このページがそれを足します。完全な番号を打ち込めば、\
        与えられた桁を検算します &mdash; そして黙って直すのではなく、拒みます。\
        誤った桁を静かに修正することは、他人の製品として読み取られるラベルを作る\
        ことだからです。"""

[[faq]]
q = "QR コードの真ん中にロゴを入れられますか？"
a = """
        ここではできませんが、ほかでそれが成り立つ理由は知っておく価値があります。\
        可能にしているのは誤り訂正です。水準 H ではモジュールのおよそ30%が失われても\
        まだ読めるので、それより少ない面積を中央 &mdash; 位置検出パターンのない\
        ところ &mdash; で覆うロゴは、修復可能な損傷です。水準 H で作ったコードを\
        画像編集ソフトに通し、ロゴは面積の5分の1程度までに抑え、信じ込まずに実際の\
        スマホで試してください。"""

[[faq]]
q = "PNG より SVG のほうが良いのはなぜですか？"
a = """
        コードとは縁の集まりであり、PNG はそれを作るためのピクセル数が固定されて\
        いるからです。拡大すればどの縁もぼやけます。そしてぼやけた縁こそ、スキャナー\
        が苦手とするものです。1200 dpi のプリンターに512ピクセルの PNG を渡すのは、\
        差を発明しろと頼んでいるのと同じです。SVG は正方形を指示として持っている\
        ので、名刺でも屋外広告でもくっきり印刷されます。ここの PNG は1モジュール\
        あたり整数ピクセルで描かれており、それが PNG にできる最善です。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。コードを描いてもらうためにテキストをどこかへ送っている道具なら、\
        線を抜いた瞬間に止まるからです。"""

