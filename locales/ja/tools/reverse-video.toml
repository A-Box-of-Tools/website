[[privacy]]
title = "動画には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。ファイルが\
      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
この道具にはネットワーク機能が一切ありません。貼り付ける\
      アドレスもなく、ダウンロードするものもなく、初回に落ちてくるエンジンも\
      ありません。動画に触れるコードは1バイト残らず、ページを読み込んだときに\
      このオリジンから来たものです。"""

[[privacy]]
title = "展開も符号化も手元で行われます。"
body = """
コマはお使いのブラウザのWebCodecsを\
      通るか、どのみち動画を見せてくれる同じ再生エンジンを通ります。仕上がった\
      ファイルはこの端末のメモリの中で組み立てられ、そのままダウンロードへ\
      渡されます。"""

[[privacy]]
title = "音もここで向きを変えます。"
body = """
音のトラックを逆にするには展開が必要で、その展開は\
      ブラウザ自身のもので、この端末の上で動きます。誰も聴かず、どこにも残さず、\
      渡すこともできません。ここには1バイトでも送り出すコードの通り道が\
      ありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      動画に関する情報は渡されません。ファイルも、コマも、名前も、サイズも、\
      長さもです。読み、展開し、逆にし、符号化するコードはすべてこのオリジン\
      から配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体はGoogle Fontsから読み込みます。それはリンク\
      以上のものではありません。訪問を報告することもなく、あなたや動画について\
      渡されるものもありません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのすべてがそのまま動きます。\
      これがいちばん単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
MP4・MOV・M4V・WebMを選択欄にドラッグするか、\
      手で選んでください。ブラウザがディスクから直接読み、その間に何かが\
      どこかへ送られることはありません。"""

[[howto]]
title = "音をどうするか決めます。"
body = """
「音も逆向きにする」は、トラックを標本ひとつ\
      ずつ逆に並べ替えます。話し声が無音ではなく逆再生の話し声として出てくるのは\
      このためです。音のない動画にするなら外してください。そのほうが速く\
      終わります。"""

[[howto]]
title = "画質にどれだけ使うか決めます。"
body = """
映像は符号化し直す必要があります。\
      コマが、元のファイルのどこにも想定されていない順番で出てくるからです。\
      「バランス」は元のファイルが使っていた量に近いところに留まり、「最高画質」は\
      それより多く使います。"""

[[howto]]
title = "逆にしてダウンロードします。"
body = """
処理はお手元のハードウェアで行われるので、\
      かかる時間は順番待ちではなく端末次第です。仕上がった動画は、そのまま\
      ブラウザのダウンロードへ渡されます。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        いいえ。読み込みも、展開も、逆並べも、符号化も、お使いのブラウザが\
        お手元のハードウェアで行います。この道具にサーバー側はなく、ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        書かれていて、そのどれもこのサイトのものではありません。言葉より確認と\
        いう方は、回線を抜いてから逆にしてみてください。"""

[[faq]]
q = "どの動画形式を逆にできますか？"
a = """
        MP4・M4V・MOVは中身によらず直接読めます。H.264でもHEVCでもAV1でもVP9でも、\
        お使いのブラウザがそのコーデックを展開できるかぎり大丈夫です。それ以外で\
        ブラウザが再生できるもの、代表的にはWebMは、ブラウザ自身のプレイヤーを\
        後ろ向きに送っていく方法で逆にします。動きはしますが、その分遅くなります。\
        ブラウザが読むことも再生することもできないファイル、実際にはAVI・WMV・FLV、\
        そしてほとんどのMKVは、途中で失敗する代わりに、その旨を伝えて受け付け\
        ません。出てくるのは必ずMP4です。"""

[[faq]]
q = "音も逆向きになりますか？"
a = """
        外さないかぎりなります。トラック全体を展開し、標本を逆の順に並べ替え、\
        AACで符号化し直します。この2度目の符号化は避けられません。音声のパケットは\
        数十ミリ秒の音を直前のパケットを基準に符号化したもので、パケットを逆順に\
        書き出すと、短い断片が順方向のまま誤った順序で鳴ります。それは逆再生では\
        なく故障のように聞こえます。"""

[[faq]]
q = "逆にすると画質は落ちますか？"
a = """
        映像は2度目の符号化を受けるので、わずかに落ちます。切り出しのときのように\
        避けることはできません。逆にした動画は、元のファイルのどこにも想定されて\
        いない順番でコマを見せるため、すべてのコマを書き直す必要があるからです。\
        ただしこの道具は、元のファイルが使った以上を使いません。それを超えて\
        符号化してもファイルが大きくなるだけで、見た目はよくならないからです。"""

[[faq]]
q = "動画のサイズや長さに上限はありますか？"
a = """
        道具に組み込まれた上限はありません。ファイルを一度にメモリへ読み込むことも\
        なく、コマの塊ごとに後ろからたどっていきます。現実的な頭打ちは2つあります。\
        ダウンロード前にメモリの中で組み上がる完成品の動画と、音です。音は全体を\
        抱えておく必要があります。最初の標本を書くために最後の標本が要るからです。"""

[[faq]]
q = "ファイルによって時間が違うのはなぜですか？"
a = """
        入口が2つあるからです。MP4やMOVはこの道具が直接読み、コマの塊ごとに展開\
        します。速さは端末の性能そのままです。それ以外は、ブラウザ自身のプレイヤーに\
        動画のある瞬間を次々と要求する方法で逆にします。その頭出しのたびに、\
        ブラウザは直前のキーフレームから展開し直すことになります。どちらの経路を\
        使うのか、そしてその理由は、始める前にページが表示します。"""

[[faq]]
q = "一部分だけを逆にできますか？"
a = """
        ここではできません。この道具は全体を逆にします。出てくる動画の長さは入れた\
        ものとまったく同じで、最後のコマが先頭に来ます。必要な部分は先に\
        <a href="../trim-video/">動画カット</a>で切り出してください。あちらはコマを\
        1つも再符号化せずに切り出せます。そのうえで、出てきたものを逆にして\
        ください。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に動画の情報が渡される\
        ことはありません。"""

[schema]
browser_requirements = "JavaScriptと、WebCodecsの映像符号化に対応したブラウザが必要です。Chrome、Edge、Safari 16.4以降、Firefox 133以降。"
description = "動画をブラウザの中で逆再生の形にします。音も含みます。MP4・MOV・M4Vは末尾から塊ごとに展開し、元のコマの時刻のまま符号化し直します。それ以外でブラウザが再生できるものは、後ろ向きに送っていく方法で処理します。アップロードは一切ありません。"
features = [
  "MP4・MOV・M4V・WebMの動画を逆にします",
  "H.264・HEVC・AV1・VP9のソースをWebCodecsで展開",
  "音を標本ひとつずつ逆にするか、外すか選べます",
  "元のコマの時刻を保ちます。フレームレートが不均一でも同じです",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます &mdash; MP4・MOV・M4V・WebM、このブラウザで再生できるものなら何でも"
