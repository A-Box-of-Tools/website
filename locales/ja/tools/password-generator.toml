[[privacy]]
title = "パスワードは、これを読んでいるその場で作られます。"
body = """\
 このページの中で、\
      このページが、手元のOSがブラウザに渡す乱数から引きます。作るために何かを\
      取りに行くこともなければ、出来上がったことを報告することもありません。\
      <code>Content-Security-Policy</code>にはこのページが接続してよい宛先が\
      すべて書かれていて、そのどれ一つとして私たちのものではありません。生成した\
      パスワードが集まる先はここになく、あったとしてもそこへ送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くものがありません。"
body = """\
 <code>src/</code>のどこにも\
 <code>fetch</code>も<code>XMLHttpRequest</code>も\
 <code>sendBeacon</code>もありません。単語リストもダウンロードしていません。\
 <code>src/wordlist.js</code>という一つのファイルで、ページの他の部分と一緒に\
      このオリジンから配信されていて、中身を読むこともできます。"""

[[privacy]]
title = "乱数はブラウザのもので、しかも正しい種類のものです。"
body = """\
 <code>crypto.getRandomValues</code>は\
      鍵やトークンのためにブラウザが用意している乱数で、OSが種を与え、与え直して\
      います。<code>Math.random</code>はこのフォルダのどこにもありませんし、あれば\
      本物の欠陥です。内部状態は数個の出力から復元できてしまうので、出力を一つ見た\
      人には、それが今後生成するパスワードがすべて計算できます。"""

[[privacy]]
title = "何も保存しないので、消すべき履歴がありません。"
body = """\
 localStorageも\
      sessionStorageもCookieもURLパラメータもなく、ブラウザが記憶を申し出るような\
      <code>&lt;input&gt;</code>もありません。画面にあるものはこのページのメモリ上の\
      配列一つの中だけにあり、タブを閉じればそれで後片付けは終わりです。ここで\
      作られたものの控えは、持ち出したぶんだけです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """\
 広告と計測のスクリプトは\
      Google、寄付ボタンはBuy Me a Coffeeのものです。そのどれにも、このページが\
      作ったものの一文字も渡りません。長さも、強さも、どの設定で作ったかも渡り\
      ません。一文字や一単語を引くコードはすべてこのオリジンから配信され、\
      リポジトリに載っています。"""

[[privacy]]
title = "オフラインでも動きます。"
body = """\
 ネットワークを切っても道具は変わりません。\
      もともと通信する段取りがどこにもないからです。これが一番簡単な証明で、乱数を\
      サーバーに取りに行く生成ツールなら、線を抜いた瞬間に止まります。"""

[[howto]]
title = "パスワードかパスフレーズかを選びます。"
body = """\
 パスワードはランダムな文字の並びで、\
      保管しやすく、打つのは面倒で、パスワード管理ソフトが代わりに入力してくれる\
      何百というアカウントにはこれが正解です。パスフレーズはリストから無作為に\
      引いた単語の並びで、長い代わりに覚えられて口に出せます。自分の頭から打ち込む\
      必要がある数少ない秘密、つまりパスワード管理ソフト自身のパスワード、\
      パソコンのパスワード、スマートフォンの復旧コードにはこちらです。"""

[[howto]]
title = "長さ、または単語数を決めます。"
body = """\
 効くのはこの設定で、ほかはたいてい\
      そうではありません。守る価値のあるものなら20文字、または6単語が妥当な下限\
      です。ほかのすべてを再設定できてしまうアカウントなら、そこから上げてください。\
      下の表示はつまみを動かすたびに変わるので、1文字増やすと何が増えるのかが\
      その場で分かります。"""

[[howto]]
title = "登録フォームが言い張る規則を入れます。"
body = """\
 「各種類から最低一つ」、末尾に数字、\
      どのサイトでも通る短い記号。どれも強くはしませんし、最初のものはむしろ\
      わずかに弱くします。それはこのページが既に差し引いてあります。ただ、六回\
      作り直さずに登録フォームを抜けるにはこれが要ります。"""

[[howto]]
title = "色ではなく数字を読みます。"
body = """\
 ビット数は、その文字列を生み出した設定から\
      数えています。文字集合の大きさと、引いた回数と、それだけです。これは本当の\
      測定で、登録ページのメーターとは違います。あちらは目の前の文字に点をつける\
      ことしかできず、それを選んだのが人か生成ツールかを知る手立てがありません。"""

[[howto]]
title = "立ち去る前にコピーして、どこかに置きます。"
body = """\
 ここには履歴がなく、もう一度出して\
      もらう方法もありません。再読み込みすれば消えます。まずパスワード管理ソフトに\
      貼り、そのあとで登録フォームに貼ってください。覚えておく側が先に持っていれば、\
      途中で何かあっても失われません。"""

[[howto]]
title = "まとめて要るならまとめて作ります。"
body = """\
 一番下のつまみで一度に最大100個まで\
      作れ、テキストファイルとして保存できます。中身は画面に出ているものから\
      このページが書き出したものです。アカウントをまとめて開くときや初期パスワードを\
      配るときに便利ですが、より良い場所に移したらファイルは消してください。\
      ディスクの上のパスワードだらけのファイルは、やはりパスワードだらけの\
      ファイルです。"""

[[faq]]
q = "パスワードはどこかに送られたり、保存されたりしますか。"
a = """
        どちらもありません。手元のブラウザ、手元の機械の上で作られますし、この\
        道具には通信機能そのものがありません。何も取りに行かず、何も送りません。\
        保存先にも何も書きません。localStorageもCookieも履歴もありません。ページを\
        再読み込みすれば、表示されたパスワードは画面からもページのメモリからも\
        消えます。ページの<code>Content-Security-Policy</code>には接続してよい宛先が\
        すべて書かれていて、そのどれも私たちのものではないので、何かが送ろうとした\
        ところで受け取る先がありません。"""

[[faq]]
q = "乱数はどこから来ますか。"
a = """
        <code>crypto.getRandomValues</code>です。暗号用途のためにブラウザが用意して\
        いる乱数で、手元のOSのエントロピープールが種を与え、与え直しています。\
        ブラウザがTLSの鍵素材を引くのと同じ出どころです。この道具では\
        <code>Math.random</code>をどこでも使っていません。これは細かい話ではなく、\
        <code>Math.random</code>は速い算術的な乱数で、内部状態は連続した数個の出力\
        から丸ごと復元できます。それで作られたパスワードは、ランダムに見えるだけで、\
        一つ見た人にはすべて列挙できてしまいます。"""

[[faq]]
q = "ブラウザで作ったパスワードは、パソコンのソフトで作ったものと同じくらい良いですか。"
a = """
        乱数に関しては同じです。どちらもOSの同じ出どころに、別の入口から届いている\
        だけです。違うのは、同じ部屋に何がいるかです。ブラウザのタブは拡張機能と\
        隣り合って動きますし、ページを読む権限のある拡張機能はこのページも読めます。\
        これはこのページを含むあらゆるウェブ上の生成ツールに言えることで、手元に\
        パスワード管理ソフトがあるならその内蔵の生成機能を使うべき正直な理由でも\
        あります。算術は同じで、隣に立っているものが少ないだけです。このページは、\
        それが手元にないときのためのものです。"""

[[faq]]
q = "パスワードとパスフレーズ、どちらを使うべきですか。"
a = """
        管理ソフトが代わりに打ってくれるものはすべてパスワードで構いません。二度と\
        目にしませんし、長さはただですから。自分の頭から打つか、声に出して伝える\
        必要がある数少ないものにはパスフレーズです。管理ソフトのマスターパスワード、\
        ディスク暗号化の鍵、遠隔で設定する機器などです。長いリストから6単語で\
        77ビット、12文字のランダムなパスワードより強く、しかも午前4時に打ち間違えず\
        入力できる度合いが桁違いです。"""

[[faq]]
q = "パスワードは何文字にすべきですか。"
a = """
        全部の文字集合で20文字ならおよそ130ビットで、長さを気にする段階はとうに\
        過ぎています。16文字でも十分です。失って困るものの下限が12文字で、これは\
        下限であって目標ではありません。それより短いと、サイトが正しく保管して\
        いることに賭けることになりますが、この20年の漏えい通知はその賭けを勧めて\
        いません。長さはこのページのどの設定にも勝ちます。1文字増やすほうが、\
        どの文字を含めという規則より効きます。"""

[[faq]]
q = "パスフレーズは何単語にすべきですか。"
a = """
        長いリストから6単語、他のパスワードを守るものなら7単語です。有名な4単語の\
        絵は2011年のもので51ビット、今日では本気のオフライン攻撃の射程に入ります。\
        5単語で64、6単語で77です。普通のアカウント一つに攻撃者が費やす額を超えて\
        います。長いリストの1単語ごとに12.9ビット増え、増えるのは単語だけです。\
        ハイフンも大文字も増やしません。"""

[[faq]]
q = "「ビット」とは何で、なぜこのページはそれを数えるのですか。"
a = """
        1ビットは倍になることです。60ビットとは、このページが出しえた同じ確からしさ\
        の結果が2^60通りあったということで、仕組みを完全に知っている相手でも、なお\
        それだけ試す必要があります。これは文字列の性質ではなく<em>手順</em>の性質\
        です。このページは選んだ当人で、何回選んだかを知っているので、正確に言え\
        ます。そこが登録フォームの色付きバーとの違いで、あちらは文字を読んで当てて\
        いるだけです。あのバーでは<code>correct horse battery staple</code>は評価が\
        低く実際は44ビット、<code>P@ssw0rd!</code>は評価が高く実際はほぼ無価値です。"""

[[faq]]
q = "「記号を必ず含める」がパスワードを弱くするのはなぜですか。"
a = """
        規則は可能性を減らすことしかできないからです。各種類から最低一つを求めると、\
        たまたま一つも入らなかったパスワードがすべて除かれます。ありうる\
        パスワードの集合が小さくなれば、探す範囲も小さくなります。効きは小さく、\
        普通の長さでおよそ0.5ビットですが、それは実在します。このページは自分に\
        都合のよい数字を出さずに、これを差し引いています。しかも、規則が実際に許す\
        パスワードの数を数えて正確に求めています。"""

[[faq]]
q = "この単語リストは何で、攻撃者がダウンロードできることは問題になりませんか。"
a = """
        Electronic Frontier Foundationのdicewareリストを、そのまま同梱しています。\
        長いほうが7,776語、短いほうが1,296語です。まさにこの用途のために作られて\
        いて、不快な語がなく、同音異義がなく、つなげると別の語になってしまう\
        組み合わせがなく、短いリストではどの語も他の語の先頭になっていません。そして、\
        リストが公開されていることは問題になりません。ここに書かれた強さは、攻撃者が\
        リストを持ち、このページのソースを読み、使った設定をすべて知っている前提で\
        計算しています。分からないのは、毎回7,776語のどれが出たかだけです。その前提\
        こそが、この数字を信用できるものにしています。"""

[[faq]]
q = "パスフレーズは辞書攻撃を待っているようなものではありませんか。"
a = """
        こういう選び方をしている限り違います。辞書攻撃が効くのは<em>人が</em>考えた\
        フレーズです。人は互いに馴染む語を、意味の通る順で、日ごろ使う数千語の中から\
        選ぶからです。このページは固定されたリストから、一語ずつ独立に、均等に引き、\
        読み心地は一切考えません。だからたいてい読み心地は悪くなります。リストも\
        単語数も知っている攻撃者の前に残るのは、7,776の単語数乗です。"""

[[faq]]
q = "ページを離れたあとで、パスワードを取り戻せますか。"
a = """
        できませんし、そうしてあります。どこにも書き留めないので、取り戻すものが\
        ありません。履歴の画面も、「最近作ったもの」の一覧も、キャッシュもありま\
        せん。先週の火曜のパスワードを見せられる生成ツールとは、それを保存していた\
        生成ツールです。自分が取り出せる場所に保存されているということは、ほかの\
        何かも取り出せる場所に保存されているということです。離れる前にパスワード\
        管理ソフトへコピーしてください。"""

[[faq]]
q = "クリップボードにコピーしても安全ですか。"
a = """
        ごく普通の危険で、恐れるより知っておくほうが役に立ちます。クリップボードは\
        同じ利用者として動いているすべてと共有され、たいてい次にコピーするまで残り、\
        設定によっては端末間で同期されます。だから貼るべき場所にすぐ貼って、その後に\
        別のものをコピーするのがよいのであって、代わりに弱いパスワードを手で打つ\
        理由にはなりません。このページはクリップボードを読めません。書き込めるだけ\
        で、しかもボタンを押したときだけです。"""

[[faq]]
q = "同じものを複数の場所で使ってもいいですか。"
a = """
        いけません。これはこのページのどの助言よりも上に来る唯一の一つです。乗っ取ら\
        れるアカウントのほとんどは、先に別の場所で正しかったパスワードで乗っ取られ\
        ます。あるサイトが破られ、一覧が公開され、同じアドレスと同じパスワードが\
        あらゆる場所で試されるからです。サイトごとに違うパスワードにすれば、漏えいの\
        被害は全部ではなく一つで済みます。パスワード管理ソフトを使う理由はここに\
        あるのであって、中に入っている個々のパスワードの強さではありません。"""

[[faq]]
q = "無料ですか。アカウントは要りますか。"
a = """
        無料です。アカウントもログインも試用期間もなく、いくつ作ってもかまいません。\
        このサイトは広告で成り立っていますが、広告にはこのページが作るものについて\
        何も渡りません。長さも強さも渡りません。"""

[[faq]]
q = "オフラインでも動きますか。"
a = """
        動きます。一度ページを読み込んでからインターネットを切っても、パスワードは\
        作り続けられます。乱数は手元の端末から来ますし、単語リストはすでにページの\
        中にあります。これは、何も取りに行かず何も送っていないことの一番簡単な証明\
        でもあります。数字をサーバーに取りに行く生成ツールなら、線を抜いた瞬間に\
        止まります。"""

[schema]
description = "ブラウザの中で強いランダムなパスワードとdicewareのパスフレーズを作ります。文字はcrypto.getRandomValuesで引き、単語は同梱のEFFの7,776語のリストから引きます。作ったものの正確なエントロピーも表示します。アップロードも保存もしません。"
features = [
  "最大94文字の文字集合から、6文字から128文字までのランダムなパスワード",
  "同梱の7,776語のリスト、または1,296語の短いリストからdicewareのパスフレーズ",
  "すべての抽選をcrypto.getRandomValuesで行い、剰余の偏りは無視せず捨てる",
  "エントロピーをビットで正確に表示。文字列の採点ではなく設定からの数え上げ",
  "「各種類から最低一つ」の規則がいくら損をさせるかを黙らずに計算する",
  "見分けにくい文字を外せるので、打ち込む必要のあるパスワードにも向く",
  "区切り文字、大文字、末尾の数字や記号。それぞれ何が増えるかを正直に書いてある",
  "一度に最大100個。コピーするか、テキストファイルとして保存",
  "保存なし。履歴もlocalStorageもCookieもなし",
  "オフラインで動作。アップロードなし、アカウント不要",
]
