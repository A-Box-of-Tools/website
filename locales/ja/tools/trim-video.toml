[[privacy]]
title = "動画には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 このツールにはネットワーク機能が\
      一切ありません。貼り付けるアドレスも、ダウンロードするものも、初回に取りに行く\
      エンジンもありません。あなたの動画に触れるコードは、1バイト残らずページを\
      読み込んだときにこのオリジンから届いたものです。"""

[[privacy]]
title = "通常の経路では、そもそも復号すら行われません。"
body = """

      カットしてもフレームの見た目は変わらないので、印を付けた部分の符号化された\
      フレームは、見つかったときのまま新しいファイルへ移されます。それぞれは\
      ディスク上のファイルの一部分として保持されます &mdash; どのバイトかを示す\
      メモであって、バイトそのものではありません &mdash; そしてあなたのブラウザは、\
      ダウンロードを書き出すときに初めてそれを読みます。ここにはあなたの動画を\
      絵に戻すものが存在しません。"""

[[privacy]]
title = "印のファイルは、このページの中で作られます。"
body = """
 印を保存すると、\
      すでに画面に出ている数値からテキストファイルが書き出され、そのまま\
      ダウンロードへ渡されます。読み込むときも、ここで読みます。どちらも\
      ネットワークには近づきませんし、どちらも時刻以外は何も運びません。"""

[[privacy]]
title = "音声は複製されるだけで、聴かれてはいません。"
body = """
 MP4の2つの経路とも、\
      音声のサンプルは一度も復号されずにそのまま移されます &mdash; ここには\
      それを音に戻すものが存在せず、仮に戻したとしてもどこかへ渡すものが\
      ありません。"""

[[privacy]]
title = "フレームを復号する場合も、それはここで起きます。"
body = """
 正確なカットと、\
      このブラウザが再生できないファイルのプレビューは、あなた自身の端末の
      WebCodecs を通ります。そもそもその動画を見せるのに使われるのと同じデコーダーが、\
      同じ場所で動いているだけです。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から来ています。そのどちらにも、あなたの動画に関する\
      情報は渡されません。ファイルも、フレームも、名前も、サイズも、長さも、\
      どこで切ったかもです。読み込み、切り出し、書き出しを行うコードはすべて\
      このオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むもの、そして渡されないもの。"
body = """

      ヘッダーの「Buy me a coffee」ボタンは cdnjs.buymeacoffee.com の\
      スクリプトが描き、書体を Google Fonts から取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、あなたや動画に関する情報も\
      渡されません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切っても、このページの機能はすべて\
      そのまま動きます。これがいちばん単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
 MP4、MOV、M4V、WebM を選択欄に\
      ドロップしてください。ブラウザがディスクから直接読み出します。その間に\
      何かがどこかへ送られることはありません。複数入れると、入れた順につながります。"""

[[howto]]
title = "再生して、残したい場所に印を付けます。"
body = """
 残す部分の始まりで
      <kbd>I</kbd>、終わりで <kbd>O</kbd> を押します。何度でも構いません &mdash;
      1組ごとに下の表の1行になり、タイムライン上の帯になります。<kbd>U</kbd> で\
      直前のものを取り消し、<kbd>Space</kbd> で再生と一時停止、矢印キーで5秒ずつ\
      飛べます。その瞬間を捕まえにくければ、再生速度を落としてください。"""

[[howto]]
title = "印を整えます。"
body = """
 各行は単独で再生でき、正確な時刻を打ち込んで\
      調整でき、順番を上下に動かせ、削除もできます。選択中の部分の両端は、\
      タイムライン上でドラッグすることもできます。上部の合計が、できあがる動画の\
      長さです。"""

[[howto]]
title = "残すか、切り取るかを選びます。"
body = """
 ふつうは残すほうです。できあがる\
      動画は、印を付けた部分を順につないだものになります。切り取るほうは、\
      多くの人が求めながらめったに見つからない機能です &mdash; 広告や、無音や、\
      言い直しに印を付ければ、それを抜いた残りがつながります。"""

[[howto]]
title = "カットして、ダウンロードします。"
body = """
 「1バイトも変えずに移す」は\
      フレームをそのまま移します。速く、画質を損ないようがありませんが、各部分は\
      印の手前のキーフレームから始まります。「ここちょうどで切る」は映像を復号して\
      書き直すので、各部分はあなたが選んだフレームから始まります。どちらを受け取る\
      ことになるか、そしてその代償が何かは、ボタンを押す前にページが表示します。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        されません。読み込みも、印付けも、切り出しも、書き出しも、あなた自身の\
        ブラウザがあなた自身のハードウェア上で行います。このツールにサーバー側は\
        存在せず、ページの <code>Content-Security-Policy</code> は接続してよい\
        アドレスをすべて挙げていますが &mdash; そのどれも当サイトのものでは\
        ありません。言われるより確かめたい方は、回線を抜いてからカットしてみて\
        ください。"""

[[faq]]
q = "同じ動画から複数の場所を残せますか？"
a = """
        それこそがこのツールの目的です。再生しながら <kbd>I</kbd> と <kbd>O</kbd>
        を好きなだけ押してください。1組ごとに1行になり、できあがる動画はすべての行を\
        順につないだもので、ほかは消えます。オンラインのカットツールの多くは1組の\
        つまみだけを渡して、どの一続きを残すかを尋ねます。映像の頭と尻を落とすには\
        十分ですが、1時間の記録を一度見ながら、価値のある6つの瞬間を残すには\
        まったく役に立ちません。"""

[[faq]]
q = "カットすると画質は落ちますか？"
a = """
        通常の経路では落ちませんし、問題になるような形でも落ちません。カットしても\
        フレームの見た目は変わらないので、フレームはそのままの姿で新しいファイルへ\
        移されます。同じバイト、同じエンコーダーの設定、何もかも同じです。ここで\
        何かを書き出し直す唯一の経路は正確なカットで、それはボタンにそう書いて\
        あります。"""

[[faq]]
q = "印を付けた位置より前から始まってしまうのはなぜですか？"
a = """
        動画の保存方法のためで、しかも形式の標準的な部分を無視する再生機でのみ\
        起こります。ほとんどのフレームは隣のフレームとの差分として保持されるので、\
        隣がなければ復号できません。単独で成り立つのはキーフレームだけで、その\
        間隔はふつう1秒から10秒です。ですからフレームを複製するカットは、印の\
        手前のキーフレームからの一続きを運ばざるを得ません &mdash; そのうえで\
        ファイルには<em>あなたの印から再生を始めよ</em>と書かれており、主要な\
        再生機はどれもそれに従います。どの再生機でも正確である必要があるなら、\
        書き出し直す「ここちょうどで切る」を選んでください。どちらの場合に当たって\
        いるか、そしてどれだけずれるかは、書き出す前にページが表示します。"""

[[faq]]
q = "逆に、広告を切り取ることもできますか？"
a = """
        できます。広告に印を付けて「印の部分を切り取る」を選べば、印を付け
        <em>なかった</em>ほうが順につながります。同じ印の一覧が両方の問いに\
        答えるので、二度印を付けることなく切り替えて、長さの変化を見比べられます。"""

[[faq]]
q = "印を保存して、あとで戻ってこられますか？"
a = """
        できます。「印を保存」は素のテキストファイルを書き出し &mdash; 1行が1つの\
        部分で、開始と終了をカンマで区切ったものです &mdash;「印を読み込む」が\
        それを読み戻します。形式は素の秒数と <code>HH:MM:SS.mmm</code> の2つを\
        用意しており、どちらも同じやり方をするほかのツールがすでに使っている\
        並べ方に従っています。ですからここで書いたファイルをそちらへ渡せますし、\
        そちらで書いたファイルをこのページに入れられます。印付けは慎重を要する\
        作業で、二度やらされるべきではありません。"""

[[faq]]
q = "どの動画形式をカットできますか？"
a = """
        MP4、M4V、MOV は中身が何であれ直接読みます。H.264、HEVC、AV1、VP9 の\
        いずれもです。フレームの複製に復号は関わらないので、この経路はブラウザに\
        デコーダーがまったくないコーデックでも動きます。それ以外でブラウザが\
        再生できるもの &mdash; いちばん多いのは WebM です &mdash; は、再生しながら\
        録画する方法でカットします。これでも動きますが、できあがる長さと同じだけ\
        時間がかかり、残せる部分は1か所だけです。ブラウザが読むことも再生することも\
        できないファイル、実際には AVI、WMV、FLV、そして大半の MKV は、途中で\
        失敗するのではなく、その旨のメッセージを出して断ります。"""

[[faq]]
q = "動画のサイズや長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。複製の経路ではファイルはほとんど\
        読まれもしません。残すフレームは読み込まれるのではなく参照されるだけなので、
        4ギガバイトの記録から4分を残す手間は、その4分をディスクに書く手間とほぼ\
        同じです。正確なカットは、ファイルを数メガバイトずつ辿っていきます。\
        いずれの場合も現実的な上限は、ダウンロード前にメモリ上で組み立てられる\
        完成後のファイルです。"""

[[faq]]
q = "音声は残りますか？"
a = """
        MP4の2つの経路とも、音声は一度も復号されずにサンプル単位で複製されるので、\
        ファイルの中にあったものと1バイトも違いませんし、編集用の印によって、\
        どの部分も1000分の1秒の精度で映像と揃ったままです。唯一の例外は、音声の\
        記述が異なる &mdash; たとえばサンプリング周波数が違う &mdash; 別々の動画を\
        つなぐ場合で、復号せずに両方を1本のトラックに入れる方法がありません。\
        その場合はページが、実行前にそう伝えます。録画の経路では再生から取り込んで\
        書き出し直します。どちらの場合も、音声を丸ごと外すチェックボックスが\
        あります。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        動画に関する情報が渡されることはありません。"""

[schema]
browser_requirements = "JavaScript が必要です。フレームの複製には映像コーデックの対応が一切要りません。正確なカットには WebCodecs 対応のブラウザが必要で、それ以外の形式は録画に切り替わります。"
description = "再生しながら動画の好きな数の部分に印を付け、その部分を1つのファイルとして保存します。逆に、印を付けた部分を切り取って残りを保つこともできます。MP4・MOV・M4V は、符号化されたフレームを手を加えずに新しいファイルへ移すことでカットし、元の音声もサンプル単位で引き継ぎます。アップロードも再エンコードも一切ありません。"
features = [
  "再生中に I と O を押して、好きな数の部分に印を付けられます",
  "印を付けた部分を、選んだ順に1つのファイルへつなぎます",
  "逆に、印を付けた部分を切り取って残りを保つこともできます",
  "書き出し直さずにカットするので、画質は失われません",
  "印を素のテキストのタイムスタンプファイルとして保存し、読み戻せます",
  "フレーム単位で正確な印を付けられ、キーフレームをタイムラインに表示します",
  "元の音声を、書き出し直さずにそのまま保ちます",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます &mdash; MP4、MOV、M4V、WebM。複数入れるとつながります。"
