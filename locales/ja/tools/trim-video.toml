[[privacy]]
title = "動画には出ていく先がありません。"
body = "Content-Security-Policyには、このページが接続してよいアドレスがすべて挙がっていますが、そのどれも当サイトのものではありません。ファイルを集めるための受け口はここになく、あったとしても送るコードがありません。"

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = "このツールにはネットワーク機能が一切ありません。貼り付けるアドレスも、ダウンロードするものも、初回に取りに行くエンジンもありません。動画に触れるコードは、1バイト残らずページを読み込んだときにこのオリジンから届いたものです。"

[[privacy]]
title = "通常の経路では、そもそもデコードすら行いません。"
body = "カットしてもフレームの見た目は変わらないので、印を付けた部分のエンコード済みフレームは、見つかったときのまま新しいファイルへ移ります。それぞれはディスク上のファイルの一部分として保持されます。どのバイトかを示すメモであって、バイトそのものではありません。そしてブラウザがそれを読むのは、ダウンロードを書き出すときが初めてです。ここには動画を絵に戻すものが存在しません。"

[[privacy]]
title = "印のファイルは、このページの中で作ります。"
body = "印を保存すると、すでに画面に出ている数値からテキストファイルを書き出し、そのままダウンロードへ渡します。読み込むときも、ここで読みます。どちらもネットワークには近づきませんし、どちらも時刻以外は何も運びません。"

[[privacy]]
title = "音声は複製するだけで、聴いてはいません。"
body = "MP4の2つの経路とも、音声のサンプルを一度もデコードせずにそのまま移します。ここにはそれを音に戻すものが存在せず、仮に戻したとしてもどこかへ渡すものがありません。"

[[privacy]]
title = "フレームをデコードする場合も、それはここで起きます。"
body = "正確なカットと、このブラウザが再生できないファイルのプレビューは、手元の端末のWebCodecsを通ります。そもそもその動画を見せるのに使われるのと同じデコーダーが、同じ場所で動いているだけです。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから来ています。そのどちらにも、動画に関する情報は渡されません。ファイルも、フレームも、名前も、サイズも、長さも、どこで切ったかもです。読み込み、切り出し、書き出しを行うコードはすべてこのオリジンから配信され、リポジトリに載っています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comのスクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上のものではありません。訪問を報告しませんし、閲覧者や動画に関する情報も渡されません。"

[[privacy]]
title = "オフラインで動きます。"
body = "通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん単純な証明です。"

[[howto]]
title = "動画を選びます。"
body = "MP4、MOV、M4V、WebMを選択欄にドロップしてください。ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られることはありません。複数入れると、入れた順につながります。"

[[howto]]
title = "再生して、残したい場所に印を付けます。"
body = "残す部分の始まりで<kbd>I</kbd>、終わりで<kbd>O</kbd>を押します。何度でも構いません。1組ごとに下の表の1行になり、タイムライン上の帯になります。<kbd>U</kbd>で直前のものを取り消し、<kbd>Space</kbd>で再生と一時停止、矢印キーで5秒ずつ飛べます。その瞬間を捕まえにくければ、再生速度を落としてください。"

[[howto]]
title = "印を整えます。"
body = "各行は単独で再生でき、正確な時刻を打ち込んで調整でき、順番を上下に動かせ、削除もできます。選択中の部分の両端は、タイムライン上でドラッグすることもできます。上部の合計が、できあがる動画の長さです。"

[[howto]]
title = "残すか、切り取るかを選びます。"
body = "ふつうは残すほうです。できあがる動画は、印を付けた部分を順につないだものになります。切り取るほうは、多くの人が求めながら、めったに見つからない機能です。広告や、無音や、言い直しに印を付ければ、それを抜いた残りがつながります。"

[[howto]]
title = "カットして、ダウンロードします。"
body = "「1バイトも変えずに移す」はフレームをそのまま移します。最初の区間には前のキーフレームからの非表示フレームを含められますが、2つ目以降はキーフレームから始める必要があります。「ここちょうどで切る」は選んだタイミングを保つため、残す映像フレームをすべてデコードしてエンコードし直します。使う方式とその代償は、ボタンを押す前に表示します。"

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = "されません。読み込みも、印付けも、切り出しも、書き出しも、お使いのブラウザが手元のハードウェア上で行います。このツールにサーバー側は存在しません。ページの<code>Content-Security-Policy</code>には接続してよいアドレスがすべて挙がっていますが、そのどれも当サイトのものではありません。言われるより確かめたい方は、回線を抜いてからカットしてみてください。"

[[faq]]
q = "同じ動画から複数の場所を残せますか？"
a = "それこそがこのツールの目的です。再生しながら<kbd>I</kbd>と<kbd>O</kbd>を好きなだけ押してください。1組ごとに1行になり、できあがる動画はすべての行を順につないだもので、ほかは消えます。オンラインのカットツールの多くは1組のつまみだけを渡して、どの一続きを残すかを尋ねます。映像の頭と尻を落とすには十分ですが、1時間の記録を一度見ながら、価値のある6つの瞬間を残すにはまったく役に立ちません。"

[[faq]]
q = "カットすると画質は落ちますか？"
a = "「1バイトも変えずに移す」は元のエンコード済みフレームと音声を保つため、画質を落としません。区間が1つの場合、または2つ目以降の区間がすべてキーフレームから始まる場合に使えます。「ここちょうどで切る」は残す映像フレームをすべてエンコードし直し、可能なら音声を複製します。「再生しながら録画する」は映像も音声もエンコードし直します。書き出す前に、選んだ方式がどの処理を行うか表示します。"

[[faq]]
q = "印を付けた位置より前から始まってしまうのはなぜですか？"
a = "複製する最初の区間には、後のフレームをデコードするために前のキーフレームからのフレームを含める場合があります。編集用の印は再生機に冒頭のフレームを飛ばすよう求めますが、それを無視する再生機では早く始まることがあります。ブラウザは途中のつなぎ目の非表示フレームも誤処理することがあるため、2つ目以降の区間がキーフレームの間から始まる場合は複製を使えません。その場合は「ここちょうどで切る」を選んでください。残す映像フレームをすべてエンコードし直します。書き出す前に、方式と冒頭の非表示時間を示します。"

[[faq]]
q = "逆に、広告を切り取ることもできますか？"
a = "できます。広告に印を付けて「印の部分を切り取る」を選べば、印を付け<em>なかった</em>ほうが順につながります。同じ印の一覧が両方の問いに答えるので、二度印を付けることなく切り替えて、長さの変化を見比べられます。"

[[faq]]
q = "印を保存して、あとで戻ってこられますか？"
a = "できます。「印を保存」は素のテキストファイルを書き出します。1行が1つの部分で、開始と終了をカンマで区切ったものです。「印を読み込む」がそれを読み戻します。形式は素の秒数と<code>HH:MM:SS.mmm</code>の2つを用意しており、どちらも同じやり方をするほかのツールがすでに使っている並べ方に従っています。ですからここで書いたファイルをそちらへ渡せますし、そちらで書いたファイルをこのページに入れられます。印付けは慎重を要する作業で、二度やらされるべきではありません。"

[[faq]]
q = "どの動画形式をカットできますか？"
a = "MP4、M4V、MOVは中身が何であれ直接読みます。H.264、HEVC、AV1、VP9のいずれもです。フレームの複製にデコードは関わらないので、この経路はブラウザにデコーダーがまったくないコーデックでも動きます。それ以外でブラウザが再生できるもの、いちばん多いのはWebMですが、それらは再生しながら録画する方法でカットします。これでも動きますが、できあがる長さと同じだけ時間がかかり、残せる部分は1か所だけです。ブラウザが読むことも再生することもできないファイル、実際にはAVI、WMV、FLV、そして大半のMKVは、途中で失敗するのではなく、その旨のメッセージを出して断ります。"

[[faq]]
q = "動画のサイズや長さに制限はありますか？"
a = "ツールに組み込まれた制限はありません。複製の経路では、ファイルはほとんど読まれもしません。残すフレームは読み込まれるのではなく参照されるだけなので、4ギガバイトの記録から4分を残す手間は、その4分をディスクに書く手間とほぼ同じです。正確なカットは、ファイルを数メガバイトずつ辿っていきます。いずれの場合も現実的な上限は、ダウンロード前にメモリ上で組み立てる完成後のファイルです。"

[[faq]]
q = "音声は残りますか？"
a = "MP4の2つの経路とも、音声は一度もデコードせずにサンプル単位で複製するので、ファイルの中にあったものと1バイトも違いませんし、編集用の印によって、どの部分も1000分の1秒の精度で映像と揃ったままです。唯一の例外は、音声の記述が異なる、たとえばサンプリング周波数が違う別々の動画をつなぐ場合で、デコードせずに両方を1本のトラックに入れる方法がありません。その場合はページが、実行前にそう伝えます。録画の経路では再生から取り込んでエンコードし直します。どちらの場合も、音声を丸ごと外すチェックボックスがあります。"

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = "無料です。アカウントも、ログインも、試用期間も、透かしもありません。このサイトには広告があり、それが費用を賄っています。広告に動画の情報が渡されることはありません。"

[schema]
browser_requirements = "JavaScriptが必要です。フレームの複製には映像コーデックの対応が一切要りません。正確なカットにはWebCodecs対応のブラウザが必要で、それ以外の形式は録画に切り替わります。"
description = "再生しながら動画の好きな数の部分に印を付け、その部分を1つのファイルとして保存します。逆に、印を付けた部分を切り取って残りを保つこともできます。MP4・MOV・M4Vは、エンコード済みフレームを手を加えずに新しいファイルへ移すことでカットし、元の音声もサンプル単位で引き継ぎます。アップロードも再エンコードも一切ありません。"
features = ["再生中にIとOを押して、好きな数の部分に印を付けられます", "印を付けた部分を、選んだ順に1つのファイルへつなぎます", "逆に、印を付けた部分を切り取って残りを保つこともできます", "エンコードし直さずにカットするので、画質は失われません", "印を素のテキストのタイムスタンプファイルとして保存し、読み戻せます", "フレーム単位で正確な印を付けられ、キーフレームをタイムラインに表示します", "元の音声を、エンコードし直さずにそのまま保ちます", "オフラインで動作。アップロードなし、登録なし、透かしなし"]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます。MP4、MOV、M4V、WebMに対応。複数入れるとつながります"
