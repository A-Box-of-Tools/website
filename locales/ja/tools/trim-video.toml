name = "動画カットツール"
# 後半の span が検索される語です。
heading = "動画カット <span class=\"h1-kw\">&mdash; 動画を切り出す</span>"
tagline = "再生しながら残す場所に印を付けるだけ。まとめて1本の動画で返します。"

title = "動画をオンラインでカット &mdash; 必要なところだけ残す、アップロード不要"
description = "動画を見ながら残す価値のある場所すべてに印を付け、その部分だけを1つのファイルとして保存します。処理はブラウザ内。アップロードなし、再エンコードなし、オフラインでも動きます。"
og_title = "動画カット &mdash; 何もアップロードせずに、必要なところだけ残す"
og_description = "再生しながら I と O を押して、残す部分に印を付けます。印を付けた部分がフレーム単位でそのまま1本の動画として書き出され、アップロードは一切ありません。"
og_image_alt = "動画カット - 必要な部分に印を付けて1本の動画として保存、ブラウザ内で"

pledge = """
    動画の読み込みも、印付けも、切り出しも、書き出しも、あなた自身のブラウザが、\
    あなた自身のハードウェア上で行います。ここには何かを取りに行ったり送ったり\
    できる部分がありません &mdash; このツールにはネットワーク機能が一切ありません
    &mdash; 仮にあったとしても、このページの向こう側に動画を受け取るサーバーは\
    存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevTools を開いてネットワークタブを見ながら\
      動画をカットしてみてください。フレームも、ファイル名も、選んだファイルの
      1バイトも、どのリクエストにも載りません。あるいは回線を抜いてからカットして\
      みてください &mdash; カットのために動画をどこかへ送っている道具なら、\
      そこで止まります。"""

read_first = """
、印とその保存先ファイルについては <code>src/segments.js</code>、
      MP4の中からフレームを見つけ出す読み取り側については <code>src/demux.js</code>、\
      印を一続きのサンプルに変える計算については <code>src/ranges.js</code>、\
      そのサンプルを新しいファイルへ移すループについては <code>src/copy.js</code>
      です。どれもリクエストを出せるものを読み込んでいません。"""

howto_heading = "動画をカットする手順"

card = """
            再生しながら残す価値のある場所すべてに印を付け、まとめて1本の動画に\
            します。フレームは書き出し直されるのではなく複製されるので、何も\
            失われません。"""

