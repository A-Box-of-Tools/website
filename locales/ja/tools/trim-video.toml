[[privacy]]
title = "動画には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
このツールにはネットワーク機能が一切ありません。貼り付けるアドレスも、\
      ダウンロードするものも、初回に取りに行くエンジンもありません。動画に触れる\
      コードは、1バイト残らずページを読み込んだときにこのオリジンから届いた\
      ものです。"""

[[privacy]]
title = "通常の経路では、そもそもデコードすら行いません。"
body = """
カットしてもフレームの見た目は変わらないので、印を付けた部分のエンコード\
      済みフレームは、見つかったときのまま新しいファイルへ移ります。それぞれは\
      ディスク上のファイルの一部分として保持されます。どのバイトかを示すメモで\
      あって、バイトそのものではありません。そしてブラウザがそれを読むのは、\
      ダウンロードを書き出すときが初めてです。ここには動画を絵に戻すものが存在\
      しません。"""

[[privacy]]
title = "印のファイルは、このページの中で作ります。"
body = """
印を保存すると、すでに画面に出ている数値からテキストファイルを書き出し、\
      そのままダウンロードへ渡します。読み込むときも、ここで読みます。どちらも\
      ネットワークには近づきませんし、どちらも時刻以外は何も運びません。"""

[[privacy]]
title = "音声は複製するだけで、聴いてはいません。"
body = """
MP4の2つの経路とも、音声のサンプルを一度もデコードせずにそのまま移します。\
      ここにはそれを音に戻すものが存在せず、仮に戻したとしてもどこかへ渡すものが\
      ありません。"""

[[privacy]]
title = "フレームをデコードする場合も、それはここで起きます。"
body = """
正確なカットと、このブラウザが再生できないファイルのプレビューは、手元の\
      端末のWebCodecsを通ります。そもそもその動画を見せるのに使われるのと同じ\
      デコーダーが、同じ場所で動いているだけです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、動画に関する\
      情報は渡されません。ファイルも、フレームも、名前も、サイズも、長さも、どこで\
      切ったかもです。読み込み、切り出し、書き出しを行うコードはすべてこのオリジン\
      から配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や動画に関する情報も\
      渡されません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
MP4、MOV、M4V、WebMを選択欄にドロップしてください。ブラウザがディスクから\
      直接読み出します。その間に何かがどこかへ送られることはありません。複数入れると、\
      入れた順につながります。"""

[[howto]]
title = "再生して、残したい場所に印を付けます。"
body = """
残す部分の始まりで<kbd>I</kbd>、終わりで<kbd>O</kbd>を押します。何度でも\
      構いません。1組ごとに下の表の1行になり、タイムライン上の帯になります。\
      <kbd>U</kbd>で直前のものを取り消し、<kbd>Space</kbd>で再生と一時停止、矢印\
      キーで5秒ずつ飛べます。その瞬間を捕まえにくければ、再生速度を落として\
      ください。"""

[[howto]]
title = "印を整えます。"
body = """
各行は単独で再生でき、正確な時刻を打ち込んで調整でき、順番を上下に動かせ、\
      削除もできます。選択中の部分の両端は、タイムライン上でドラッグすることも\
      できます。上部の合計が、できあがる動画の長さです。"""

[[howto]]
title = "残すか、切り取るかを選びます。"
body = """
ふつうは残すほうです。できあがる動画は、印を付けた部分を順につないだものに\
      なります。切り取るほうは、多くの人が求めながら、めったに見つからない機能です。\
      広告や、無音や、言い直しに印を付ければ、それを抜いた残りがつながります。"""

[[howto]]
title = "カットして、ダウンロードします。"
body = """
「1バイトも変えずに移す」はフレームをそのまま移します。速く、画質を損ない\
      ようがありませんが、各部分は印の手前のキーフレームから始まります。「ここ\
      ちょうどで切る」は映像をデコードして書き直すので、各部分は選んだフレームから\
      始まります。どちらを受け取ることになるのか、そしてその代償が何かは、ボタンを\
      押す前にページが表示します。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        されません。読み込みも、印付けも、切り出しも、書き出しも、お使いのブラウザが\
        手元のハードウェア上で行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。言われるより\
        確かめたい方は、回線を抜いてからカットしてみてください。"""

[[faq]]
q = "同じ動画から複数の場所を残せますか？"
a = """
        それこそがこのツールの目的です。再生しながら<kbd>I</kbd>と<kbd>O</kbd>を\
        好きなだけ押してください。1組ごとに1行になり、できあがる動画はすべての行を\
        順につないだもので、ほかは消えます。オンラインのカットツールの多くは1組の\
        つまみだけを渡して、どの一続きを残すかを尋ねます。映像の頭と尻を落とすには\
        十分ですが、1時間の記録を一度見ながら、価値のある6つの瞬間を残すには\
        まったく役に立ちません。"""

[[faq]]
q = "カットすると画質は落ちますか？"
a = """
        通常の経路では落ちませんし、問題になるような形でも落ちません。カットしても\
        フレームの見た目は変わらないので、フレームはそのままの姿で新しいファイルへ\
        移ります。同じバイト、同じエンコーダーの設定、何もかも同じです。ここで何かを\
        エンコードし直す唯一の経路は正確なカットで、それはボタンにそう書いてあります。"""

[[faq]]
q = "印を付けた位置より前から始まってしまうのはなぜですか？"
a = """
        動画の保存方法のためで、しかも形式の標準的な部分を無視する再生機でのみ起こり\
        ます。ほとんどのフレームは隣のフレームとの差分として保持されるので、隣がなければ\
        デコードできません。単独で成り立つのはキーフレームだけで、その間隔はふつう1秒\
        から10秒です。ですからフレームを複製するカットは、印の手前のキーフレームからの\
        一続きを運ばざるを得ません。そのうえでファイルには<em>印の位置から再生を\
        始めよ</em>と書いてあり、主要な再生機はどれもそれに従います。どの再生機でも\
        正確である必要があるなら、エンコードし直す「ここちょうどで切る」を選んで\
        ください。どちらの場合に当たっているか、そしてどれだけずれるかは、書き出す前に\
        ページが表示します。"""

[[faq]]
q = "逆に、広告を切り取ることもできますか？"
a = """
        できます。広告に印を付けて「印の部分を切り取る」を選べば、印を付け\
        <em>なかった</em>ほうが順につながります。同じ印の一覧が両方の問いに答えるので、\
        二度印を付けることなく切り替えて、長さの変化を見比べられます。"""

[[faq]]
q = "印を保存して、あとで戻ってこられますか？"
a = """
        できます。「印を保存」は素のテキストファイルを書き出します。1行が1つの部分で、\
        開始と終了をカンマで区切ったものです。「印を読み込む」がそれを読み戻します。\
        形式は素の秒数と<code>HH:MM:SS.mmm</code>の2つを用意しており、どちらも同じ\
        やり方をするほかのツールがすでに使っている並べ方に従っています。ですからここで\
        書いたファイルをそちらへ渡せますし、そちらで書いたファイルをこのページに\
        入れられます。印付けは慎重を要する作業で、二度やらされるべきではありません。"""

[[faq]]
q = "どの動画形式をカットできますか？"
a = """
        MP4、M4V、MOVは中身が何であれ直接読みます。H.264、HEVC、AV1、VP9のいずれも\
        です。フレームの複製にデコードは関わらないので、この経路はブラウザにデコーダー\
        がまったくないコーデックでも動きます。それ以外でブラウザが再生できるもの、\
        いちばん多いのはWebMですが、それらは再生しながら録画する方法でカットします。\
        これでも動きますが、できあがる長さと同じだけ時間がかかり、残せる部分は1か所\
        だけです。ブラウザが読むことも再生することもできないファイル、実際にはAVI、\
        WMV、FLV、そして大半のMKVは、途中で失敗するのではなく、その旨のメッセージを\
        出して断ります。"""

[[faq]]
q = "動画のサイズや長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。複製の経路では、ファイルはほとんど読まれ\
        もしません。残すフレームは読み込まれるのではなく参照されるだけなので、4ギガ\
        バイトの記録から4分を残す手間は、その4分をディスクに書く手間とほぼ同じです。\
        正確なカットは、ファイルを数メガバイトずつ辿っていきます。いずれの場合も現実的な\
        上限は、ダウンロード前にメモリ上で組み立てる完成後のファイルです。"""

[[faq]]
q = "音声は残りますか？"
a = """
        MP4の2つの経路とも、音声は一度もデコードせずにサンプル単位で複製するので、\
        ファイルの中にあったものと1バイトも違いませんし、編集用の印によって、どの部分も\
        1000分の1秒の精度で映像と揃ったままです。唯一の例外は、音声の記述が異なる、\
        たとえばサンプリング周波数が違う別々の動画をつなぐ場合で、デコードせずに両方を\
        1本のトラックに入れる方法がありません。その場合はページが、実行前にそう伝えます。\
        録画の経路では再生から取り込んでエンコードし直します。どちらの場合も、音声を\
        丸ごと外すチェックボックスがあります。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に動画の情報が渡される\
        ことはありません。"""

[schema]
browser_requirements = "JavaScriptが必要です。フレームの複製には映像コーデックの対応が一切要りません。正確なカットにはWebCodecs対応のブラウザが必要で、それ以外の形式は録画に切り替わります。"
description = "再生しながら動画の好きな数の部分に印を付け、その部分を1つのファイルとして保存します。逆に、印を付けた部分を切り取って残りを保つこともできます。MP4・MOV・M4Vは、エンコード済みフレームを手を加えずに新しいファイルへ移すことでカットし、元の音声もサンプル単位で引き継ぎます。アップロードも再エンコードも一切ありません。"
features = [
  "再生中にIとOを押して、好きな数の部分に印を付けられます",
  "印を付けた部分を、選んだ順に1つのファイルへつなぎます",
  "逆に、印を付けた部分を切り取って残りを保つこともできます",
  "エンコードし直さずにカットするので、画質は失われません",
  "印を素のテキストのタイムスタンプファイルとして保存し、読み戻せます",
  "フレーム単位で正確な印を付けられ、キーフレームをタイムラインに表示します",
  "元の音声を、エンコードし直さずにそのまま保ちます",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます。MP4、MOV、M4V、WebMに対応。複数入れるとつながります"
