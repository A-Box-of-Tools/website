[[privacy]]
title = "録音には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。ファイルが\
      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
この道具にはネットワーク機能が一切ありません。貼り付ける\
      アドレスもなく、ダウンロードするものもなく、初回に落ちてくるエンジンも\
      ありません。音声に触れるコードは1バイト残らず、ページを読み込んだときに\
      このオリジンから来たものです。"""

[[privacy]]
title = "デコーダーは、ブラウザにもとから入っているものです。"
body = """
ファイルは<code>decodeAudioData</code>に渡されます。\
      <code>&lt;audio&gt;</code>要素で曲を再生するのと同じコードです。あなたの形式を\
      読むために何かが配られることはなく、読むためにこのページの外へ何かを\
      求めることもありません。"""

[[privacy]]
title = "動画の映像は一度も展開されません。"
body = """
動画をドロップしても、求められるのは\
      音声トラックだけです。コマは読まれず、展開されず、描かれず、見られもしません。\
      このページにそれができるコードはなく、出てくるファイルに入っているのは音だけ\
      です。"""

[[privacy]]
title = "切り出しは、この端末のメモリの中での複製です。"
body = """
切るという作業は、部分ごと・チャンネルごとに\
      <code>set</code>を1回行うことです。残した標本が、あなたの並べた順で新しい配列へ\
      移されます。何かを掛け算される標本は、各フェードの中の数百個だけで、その数は\
      ボタンを押す前にページが表示します。"""

[[privacy]]
title = "標本は書き写されるだけで、符号化し直されません。"
body = """
WAVとは、このページが持っている標本の前に見出しを付けたものです。\
      あなたの録音について判断を下す符号化器は途中にありませんし、そもそもそれが\
      起きる「アップロード」と呼べるものが存在しません。"""

[[privacy]]
title = "印のファイルはページの中で作られます。"
body = """
印を保存すると、すでに画面に出ている\
      数値からテキストファイルが書き出され、そのままダウンロードへ入ります。読み込みも\
      ここで行われます。どちらもネットワークには近づかず、どちらも時刻以外のものを\
      運びません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      録音に関する情報は渡されません。ファイルも、標本も、名前も、サイズも、長さも、\
      どこで切ったかもです。読み、切り、書き出すコードはすべてこのオリジンから\
      配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体はGoogle Fontsから読み込みます。それはリンク\
      以上のものではありません。訪問を報告することもなく、あなたや録音について\
      渡されるものもありません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのすべてがそのまま動きます。\
      これがいちばん単純な証明です。"""

[[howto]]
title = "録音を選びます。"
body = """
MP3・WAV・FLAC・M4A・Ogg・Opusのファイルを\
      選択欄にドラッグしてください。ほしいのが動画の音の一部なら、動画をそのまま\
      置いても構いません。ブラウザがディスクから直接読み、波形として描きます。\
      その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "再生して、残したい部分に印を付けます。"
body = """
部分の始まりで<kbd>I</kbd>、終わりで\
      <kbd>O</kbd>を押します。何度でも構いません。1組ごとに下の表の1行と、波形の上の\
      帯になります。<kbd>U</kbd>で直前の1つを取り消し、<kbd>スペース</kbd>で再生と\
      一時停止、矢印キーで5秒移動、<kbd>Shift</kbd>を押しながらなら10ミリ秒ずつ動きます。\
      その瞬間をつかみにくいときは、再生を遅くしてください。"""

[[howto]]
title = "印を直します。"
body = """
どの行も単独で再生でき、正確な時刻を打ち込んで\
      置き直したり、順番を上下させたり、削除したりできます。選んだ部分の両端は波形の\
      上でドラッグすることもでき、息継ぎではなく無音のほうに印を置くにはこれが\
      いちばん速い方法です。上に出ている合計が、仕上がった録音の長さになります。"""

[[howto]]
title = "残すか、抜き取るか。"
body = """
残すのが普通の向きです。仕上がった録音は、\
      印を付けた部分を順につないだものになります。抜き取るのはもう一方の用途で、\
      求められる割に見つかりません。「えー」や鳴った電話、言い直しに印を付ければ、\
      残りがそれらを抜いた形でつながります。"""

[[howto]]
title = "切り出して、ダウンロードします。"
body = """
どの切れ目も、印を付けた標本の位置に\
      来ます。キーフレームへの丸めはありません。音にはそれがないからです。選ぶ価値が\
      あるのは、つなぎ目にどれだけフェードを掛けるかだけです。5ミリ秒あればプチッと\
      鳴るのを止められますし、フェードとして聞こえるにはあまりに短い長さです。\
      出てくるのはWAVで、まずページ上で再生され、そのままブラウザのダウンロードへ\
      渡されます。"""

[[faq]]
q = "音声はどこかにアップロードされますか？"
a = """
        いいえ。読み込みも、印付けも、切り出しも、書き出しも、お使いのブラウザが\
        お手元のハードウェアで行います。この道具にサーバー側はなく、ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        書かれていて、そのどれもこのサイトのものではありません。言葉より確認と\
        いう方は、回線を抜いてから切り出してみてください。"""

[[faq]]
q = "同じ録音から複数の部分を残せますか？"
a = """
        そのための道具です。再生しながら<kbd>I</kbd>と<kbd>O</kbd>を好きなだけ押して\
        ください。1組ごとに1行になり、仕上がったファイルはその全行を順につないだもの\
        で、ほかはすべて消えます。多くのオンライン切り出しツールはつまみを1組だけ\
        与えて、どの1区間を残すかと聞いてきます。ジングルの前後を整えるにはそれで\
        十分ですが、1時間のインタビューを一度だけ聴きながら、価値のある6つの答えを\
        残すという用途にはまるで足りません。"""

[[faq]]
q = "切れ目は印を付けたところに正確に来ますか？"
a = """
        来ます。どの部分でも、どの再生ソフトでもです。ここは音声が映像より単純な\
        唯一の場所です。展開された録音は数の並びで、そのひとつひとつが独立している\
        ので、キーフレームに相当するものがなく、丸め戻す先もなければ、切れ目が\
        早まる理由もありません。ページには結果が始まる標本の番号が出ます。付けた印に\
        標本化周波数を掛け、いちばん近い整数の標本に丸めた値です。"""

[[faq]]
q = "つなぎ目でプチッと鳴るのはなぜで、フェードは何のためですか？"
a = """
        ある語の途中から別の語の途中へ切ると、無関係な2つの波形が隣り合わせになり、\
        その間を飛ぶよう求められたスピーカーがプチッという音を出すからです。切り方の\
        欠陥ではなく、不連続とはそう聞こえるものです。直し方は、つなぎ目の両側に\
        数ミリ秒のフェードを掛けることです。コーンが追いつくには十分で、フェードとして\
        聞こえるにはあまりに短い長さです。既定は5ミリ秒で、切ることもできます。\
        フェードは本当に切れ目である縁にだけ掛かるので、録音の先頭や末尾の縁は\
        そのままの姿で残ります。"""

[[faq]]
q = "逆に、いらない部分を抜き取れますか？"
a = """
        できます。いらない部分に印を付けて「抜き取る」を選んでください。印を\
        <em>付けていない</em>ほうが順につながります。同じ印の一覧が両方の問いに\
        答えるので、切り替えながら長さの変化を見ることができ、同じ場所を二度\
        印付けする必要はありません。"""

[[faq]]
q = "印を保存して、あとから続けられますか？"
a = """
        できます。「印を保存」はプレーンテキストのファイルを書き出します。1行が1つの\
        部分で、開始と終了をコンマで区切ったものです。「印を読み込む」はそれを読み\
        戻します。形式は2つ用意されています。単純な秒数と<code>HH:MM:SS.mmm</code>で、\
        どちらもこのサイトの動画カットが書き出すのと同じ並びです。動画に対して作った\
        ファイルをその音声に持ってくることも、その逆もできます。印付けは骨の折れる\
        作業で、二度やらされるべきものではありません。"""

[[faq]]
q = "どの形式を開けますか？"
a = """
        お使いのブラウザが展開できるものすべてです。実際にはMP3・WAV・FLAC・M4A・AAC、\
        Ogg VorbisとOpus、そしてMP4・M4V・MOV・WebM動画の中の音声になります。外れるのは\
        どこでも同じ短い一覧、AVI・WMA、そしてほとんどのMKVです。このブラウザが読めない\
        ファイルは、途中で失敗する代わりに、その旨を伝えて受け付けません。"""

[[faq]]
q = "MP3ではなくWAVで保存されるのはなぜですか？"
a = """
        どのブラウザもMP3の符号化器を持っておらず、この道具は、それを持つサーバーへ\
        あなたの録音を送ることを拒むからです。WAVには符号化器がまったく要りません。\
        標本の前に短い見出しを付けただけのものだからです。つまり正直な選択であると\
        同時に、出口で品質を損なわない唯一の選択でもあります。ただし大きくなります。\
        ステレオで1分あたり約10メガバイトです。どの再生ソフトも、スマートフォンも、\
        編集ソフトも開けますし、MP3が必要ならそこから作れます。MP3をフレームの複製で\
        切る方法ならファイルは小さいままですが、切れ目がすべて最寄りのフレーム境界へ\
        移ります。その丸めをしないために、この道具はあります。"""

[[faq]]
q = "録音の長さに上限はありますか？"
a = """
        道具に組み込まれた上限はありません。実際の頭打ちはメモリです。録音全体が一度に\
        このページへ展開され、WAVもダウンロード前にメモリの中で組み立てられるので、\
        ステレオ1時間なら1ギガバイト弱の作業領域が要ります。4ギガバイトのWAVは\
        きっぱり断ります。この形式のサイズ欄そのものが、それを表せないからです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に録音の情報が渡される\
        ことはありません。"""

