  "各写真のカードを、モデルなし・ダウンロードなし・取得なしで見つける",
  "各面をカードの正確な縦横比にまっすぐ直し、斜めの写真が潰れて出ないようにする",
  "カードの実物大で印刷。PDFならA4かLetterの上で85.6×53.98ミリ",
  "1回のアップロードを求めるフォーム向けに、両面を1枚の画像にする",
  "クレジットカードサイズ（ID-1）、ID-2、パスポートのページ（ID-3）の大きさ",
  "上下か左右に、用紙の中央か上寄せで並べる",
  "カードに重ねる文字を任意で、画素に焼き込んで書く",
  "角丸、細い輪郭線、カラーか白黒",
