#
# ID Card Copy - Japanese.
#
# Overrides for tools/id-card-copy/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 「身分証」は運転免許証・マイナンバーカード・在留カードなどをまとめて呼ぶ語で、
# 実際にそう検索されます。カードの両面は「表面」「裏面」、手順の中では短く
# 「表」「裏」とも書きます。印刷画面の項目名は、よく見かける「実際のサイズ」
# 「用紙に合わせる」に合わせました。固有名はそのままです。ID-1、ID-2、ID-3、
# DPI、PDF、JPEG、PNG、A4、Letter。
#

name = "身分証コピー"
heading = "身分証コピー<span class=\"h1-kw\">｜表と裏を1枚に</span>"
tagline = "カードの表と裏を、1枚の紙に、実物の大きさで。"

title = "身分証コピー｜表と裏を1枚に、実物大で、アップロードなし"
description = "運転免許証やマイナンバーカードなど身分証の表と裏を、A4またはLetterの1枚に実物大で、または1枚の画像にまとめます。カードを見つけ、まっすぐにし、切り抜くのはブラウザの中で、何もアップロードしません。"
og_title = "身分証の表と裏を1枚にコピーする、アップロードせずに"
og_description = "スマホの写真を2枚入れると、表と裏がちょうどカードの大きさで並んだ1枚が、すぐ印刷できる形で出てきます。カードを見つけてまっすぐにするのは手元のブラウザです。身分証こそ、いちばんアップロードすべきでないものだからです。"
og_image_alt = "身分証コピー - カードの表と裏を実物大で1枚に、アップロードせずに"

pledge = """
    2枚の写真のデコード、まっすぐにすること、並べること、コピーへ書き出すことは、\
    すべて手元のブラウザが、計算とすでに入っているコーデックだけで行います。この道具には\
    どんな種類のネットワーク機能もありません。取りに行くものも、送るものも、ほかの道具への\
    受け渡しさえありません。渡されるのが身分証であり、そのコピーは、誰かがあなたに\
    なりすますのに必要なもののすべてだからです。"""

live_hint = """
      言葉を信じる必要はありません。開発者ツールを開き、ネットワークタブを見ながら\
      コピーを作ってみてください。写真もサムネイルもファイル名も、入力した文字も、隅ひとつの\
      位置さえ運んでいるリクエストはありません。あるいは機内モードにして、それでも作って\
      みてください。"""

read_first = """
、カードがどうやってモデルなしで見つかるのかは\
      <code>src/shared/document-detect.js</code>、各面が紙のどこに置かれるかは\
      <code>src/layout.js</code>、四隅とカードに重ねて書く文字は<code>src/card.js</code>、\
      PDFは<code>src/document.js</code>です。"""

howto_heading = "身分証の表と裏を1枚にコピーする方法"

card = """
            身分証や免許証の表と裏を、カードの実物大で1枚に、またはアップロード用の\
            1枚の画像に。スマホの写真2枚から、カードを見つけ、まっすぐにし、切り抜きます。"""

[words]
plural = "カードの写真"
choose = "カードの表と裏の写真"

[[facts]]
mark = "&#10007;"
text = "アップロードなし"

[[facts]]
mark = "&#10007;"
text = "アカウント不要"

[[facts]]
mark = "&#10007;"
text = "このサイトの透かしなし"

[[facts]]
mark = "&#10003;"
text = "オフラインで動く"

[[facts]]
mark = "&#10003;"
text = "オープンソース"

[[privacy]]
title = "処理はこのブラウザー内で行います。"
body = "入力と結果はブラウザー内で処理し、処理コードはそれらを処理用にアップロードしません。Content-Security-Policyは資源と接続先を制限しますが、許可済みの相手はリクエストを受け取れます。内容は検査せず、何も送られないことを単独で証明しません。具体的な操作の要求とソースを比較するか、切断中にローカル操作を完了してください。"

[[privacy]]
title = "モデルがないので、ダウンロードするものもありません。"
body = """\
 カードを見つけるのは\
      計算です。写真の勾配、その中の直線への投票、そして勝った四角形の各辺の下に\
      何があるかの確認です。書類スキャナーと共有している、あの道具の四隅検出そのもので、\
      重みも、推論ランタイムも、初回に取りに行くものもありません。\
      <code>src/shared/document-detect.js</code>を見てください。"""

[[privacy]]
title = "コピーに入るのは、写真のうちカードだけです。"
body = """\
 各面は画素から\
      描き直されるので、スマホが写真に書き込む位置情報、カメラ、撮影時刻はコピーに\
      入りません。PDFに記録されるのはこの道具の名前だけで、日付も作成者も端末名も\
      ありません。<code>src/document.js</code>を見てください。"""

[[privacy]]
title = "カードに重ねる文字は、画像の上ではなく画像の中にあります。"
body = """\
 入力した文字は\
      保存する前に各面の画素へ描き込まれるので、PDFのレイヤーや注釈のようにコピーから\
      はがすことはできません。<code>src/card.js</code>を見てください。"""

[[privacy]]
title = "ここでは何も取ってこず、オフラインで動きます。"
body = """\
 <code>src/</code>のどこにも\
 <code>fetch</code>も<code>XMLHttpRequest</code>も<code>sendBeacon</code>もなく、\
      このページは何に対しても<code>connect-src</code>を開きません。回線を切っても道具は\
      変わりません。パスポートを撮る前に一度試しておく価値のある証拠です。"""

[[howto]]
title = "両面を撮ります。"
body = """\
 カードを、カードより暗いか明るいものの上に置き、\
      カード全体が画面に入るようにスマホを上にかざして、できるだけ画面を埋めてください。\
      カードに光が反射するなら少し傾けてください。反射はその下にあるものを隠し、あとから\
      それを取り戻せるものは何もありません。"""

[[howto]]
title = "2枚の写真を足します。"
body = """\
 2枚を一度にドロップすると1枚目が表面になります。\
      各面のボタンを使ってもかまいません。「表と裏を入れ替える」で逆にできます。"""

[[howto]]
title = "四隅を確かめます。"
body = """\
 各写真でカードが見つかり、輪郭が描かれます。\
      写真のどこかを押せばいちばん近い隅が指のところへ来ますし、<kbd>Tab</kbd>で隅に\
      移って矢印キーで動かすこともできます。回転ボタンでカードを正しい向きにします。"""

[[howto]]
title = "コピーを並べます。"
body = """\
 用紙を選んでください。A4、Letter、または両面を\
      1枚の画像にするなら用紙なしです。そして2つの面を上下に置くか、左右に並べるかを\
      選びます。カードに重ねて書きたければ、コピーの用途を入力してください。"""

[[howto]]
title = "保存して、100%で印刷します。"
body = """\
 印刷するファイルはPDFです。プリンターを\
      「実際のサイズ」か100%にし、「用紙に合わせる」にはせず、紙の上にカードを置いて\
      確かめてください。JPEGやPNGはアップロードやメール用です。"""

[[faq]]
q = "身分証の写真はどこかへアップロードされますか。"
a = """
        いいえ。2枚の写真のデコード、まっすぐにすること、並べること、コピーへ書き出す\
        ことは、すべて手元のブラウザが手元のハードウェアで行います。この道具にはどんな\
        種類のネットワーク機能もなく、何かを取りに行くことも送ることもありません。ページの\
        <code>Content-Security-Policy</code>は、自分の結果を読み戻すための接続さえ開かせ\
        ません。ページを一度読み込んで機内モードにしても、そのまま動きます。"""

[[faq]]
q = "印刷したとき、カードは正しい大きさで出ますか。"
a = """
        はい。プリンターに100%で印刷させればそうなります。PDFは各面をちょうどカードの\
        大きさに置きます。クレジットカードサイズのカードなら85.6×53.98ミリで、ページの\
        画像を縮小するのではなく、ファイル自身の寸法で置いています。コピーが小さく出る\
        原因は印刷画面の「用紙に合わせる」や「特大ページを縮小」で、これが用紙全体を\
        数パーセント縮めます。代わりに「実際のサイズ」を選び、印刷したコピーにカードを\
        重ねて、両者が一致するか確かめてください。"""

[[faq]]
q = "カードが潰れずに正しい形で出るのはなぜですか。"
a = """
        形を写真からまったく測っていないからです。形はカード自身のものです。斜めから\
        撮ったカードは遠い側が短く見えるので、見えた四角形を切り抜いて箱に引き伸ばす\
        道具では、目に見えて寸詰まりか縦長のカードができます。ここでは4つの隅を射影\
        変換で、ちょうどカードの縦横比をもつ長方形へ写します。ですからカードの上で\
        まっすぐな線はコピーでもまっすぐで、どの角度から撮ってもカードはカード自身の形に\
        なります。"""

[[faq]]
q = "「カードに重ねる文字」は何をするもので、使ったほうがいいですか。"
a = """
        入力したものを、両面に斜めに繰り返し並べて、選んだインクの色と濃さで書きます。\
        ふつうはコピーの用途と日付で、たとえば「〇〇ハイツの賃貸契約以外への使用禁止\
        （2027年3月）」のようなものです。ファイルを保存する前に画素へ描き込まれるので、\
        PDFの上に載せたメモのようにはコピーから取り除けません。何のために渡したかが\
        書かれた身分証のコピーは、それをほかのことに使い回したい人にとってずっと役に\
        立たないものになります。身分証のコピーについて一部の政府が勧めているのも、この\
        やり方です。下のカードが読める程度に薄くしておいてください。"""

[[faq]]
q = "見つかった四隅が違います。どうすればいいですか。"
a = """
        ドラッグして直してください。四隅は出発点であって、決定ではありません。各面は\
        4つの隅が最後に落ち着いた場所から取られます。写真のどこかを押せばいちばん近い隅が\
        指のところへ飛んできますし、矢印キーは選ばれている隅を1画素ずつ動かします。\
        カードは自分とほぼ同じ色の面の上ではいちばん見つけにくいので、白い机の上の白い\
        カードがよくある原因です。もっと暗いものの上に置いて撮り直すか、自分で四隅を\
        置いてください。カードの角は丸いので、各隅は2本のまっすぐな縁が交わるはずの\
        場所に置きます。"""

[[faq]]
q = "どんなカードに使えますか。"
a = """
        表と裏を一緒にコピーする価値のあるカードなら何でも使えます。身分証明書、運転\
        免許証、在留カード、健康保険証、学生証、キャッシュカードは、ほぼどれも同じ大きさ\
        です。クレジットカードと同じISOのID-1サイズで、これが初期設定です。一部の古い\
        身分証明書に使われる大きめのID-2サイズもあり、パスポートの顔写真ページ（ID-3）は\
        1枚の用紙に単独で置けます。横長ではなく縦長に印刷された免許証もあります。その面を\
        回転ボタンで回せば、縦向きのまま並べられます。"""

[[faq]]
q = "用紙ではなく、両面を1枚の画像にできますか。"
a = """
        はい。用紙に「用紙なし｜両面の画像だけ」を、ファイルにJPEGかPNGを選ぶと、\
        コピーは細い白い縁のついた両面の1枚の画像になります。両面を1回のアップロードで\
        求めるオンラインのフォームが欲しがるのがこれです。画像は自分の解像度を記録して\
        いるので、それに従って印刷するソフトならカードを実物大で印刷します。ただ多くの\
        ソフトは画像を用紙に合わせるだけなので、印刷にはPDFを使ってください。"""

[[faq]]
q = "ダウンロードしても何も起きません。なぜですか。"
a = """
        たいていは、ページがほかのアプリの中で開かれているからです。メッセージアプリや\
        SNSなどの内蔵ブラウザは、ダウンロードを保存しません。代わりにスマホ自身の\
        ブラウザでページを開けば、同じ手順でファイルが保存されます。読み込んだあとは\
        ネットワークから何も必要としないので、そこでもオフラインで動きます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか。"
a = """
        無料で、アカウントもログインも試用期間も、作るコピーの数の制限も、このサイトの\
        透かしもありません。カードに書かれる文字は、あなたが入力したものだけです。この\
        サイトは広告で運営されていて、広告側にはあなたのカードについて何も渡されません。"""

