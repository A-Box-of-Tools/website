[[howto]]
title = "GIFを選びます。"
body = """
選択欄にドラッグするか、手で選んでください。ブラウザが\
      ディスクから直接読み、その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "まず概要を読みます。"
body = """
キャンバスの大きさ、コマ数、ファイルが主張する\
      再生時間、そして実際に再生される時間です。この最後の2つは思っているより\
      よく食い違い、その理由は次の節にあります。"""

[[howto]]
title = "目立つところを見ます。"
body = """
そこに並ぶ一行一行が、あなたのファイルから\
      測った値です。どのブラウザも守らない表示時間、欠けたループブロック、\
      どこからも参照されないカラーテーブル、一部のコマより大きいメタデータ。\
      あなたの意図についての推測はひとつもありません。"""

[[howto]]
title = "バイトの行き先を見ます。"
body = """
ファイルのすべてのバイトはどれか1つの行に\
      属し、行を足すとファイルになります。その大半が「圧縮された画素」に\
      なければ、表の残りがどこにあるかを教えてくれます。"""

[[howto]]
title = "コマを順に見ていきます。"
body = """
それぞれに表示時間、矩形、破棄方法、\
      サイズが出ます。「各コマ後のキャンバス」と「各コマが保存している分だけ」を\
      切り替えてください。ファイルが最適化されているかは後者でわかります。\
      よくできたGIFはごく小さな矩形を保存し、そうでないGIFは毎回、絵の全体を\
      保存しているからです。"""

[[howto]]
title = "必要ならレポートを持ち出します。"
body = """
解析全体をプレーンテキストで。\
      メッセージに貼るにも、ファイルの隣に置いておくにも使えます。すでに画面に\
      出ている内容から、このページの中で組み立てられます。"""

[[faq]]
q = "GIFはどこかにアップロードされますか？"
a = """
        いいえ。ファイルを読み、展開し、描くのはお使いのブラウザで、場所も\
        お手元のハードウェアです。この道具にサーバー側はなく、ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        書かれていて、そのどれもこのサイトのものではありません。回線を抜いても、\
        GIFの解析はそのまま続きます。"""

[[faq]]
q = "表示時間より遅く再生されるのはなぜですか？"
a = """
        どのブラウザも0.02秒未満の表示時間を守らず、代わりに0.1秒そのコマを\
        止めるからです。この規則は1996年のNetscapeに書き込まれました。当時の\
        回る地球儀や「工事中」の看板のためのもので、以後すべてのブラウザに\
        写され、外されたことは一度もありません。
        <br><br>
        ですから、全コマが0.01秒と書かれたGIFが毎秒100コマで再生されることは\
        ありません。実際は毎秒10コマで、作った側の意図より5倍から10倍遅い\
        速さです。このページはファイルが言う値と実際に起きる値の両方を出し、\
        影響を受けるコマに印を付けます。直すなら、ファイルを作った側で0.01では\
        なく0.02と書くことです。"""

[[faq]]
q = "「破棄」とは何ですか？"
a = """
        あるコマの時間が終わったとき、画面に何を残すかです。アニメーションが\
        きれいに見えるか、尾を引くかを決めるのがこの項目です。
        <br><br>
        <strong>そのまま残す</strong>は、次のコマがその上に描くという意味で、\
        コマが不透明で互いを覆う場合はこれが望ましい設定です。<strong>背景まで\
        消す</strong>は、そのコマの矩形を先に消してから描きます。透過が必要な\
        場合はこれで、そうしないと次のコマの透けた部分から前のコマが見えます。\
        <strong>下にあったものを戻す</strong>は、このコマが描く前にそこに\
        あったものを戻します。動かない背景の上を小さな物体が動く映像はこの形で\
        保存されます。そして<strong>未指定</strong>はファイルが何も言わなかった\
        場合で、どの表示ソフトも「そのまま残す」として扱います。"""

[[faq]]
q = "GIFがこんなに大きいのはなぜですか？"
a = """
        「バイトの行き先」の表が、一般論ではなくあなたのファイルについて答えます。\
        考えられる答えはいくつかしかありません。
        <br><br>
        ほとんどが<strong>圧縮された画素</strong>なら、単純に絵の量が多いという\
        ことです。GIFは各コマを丸ごとの画素として保存し、動き補償も画質の\
        つまみもありません。大きさはおおよそ面積かけるコマ数です。コマを減らす、\
        寸法を小さくする、色数を減らす。手はこの3つだけです。
        <br><br>
        大きな割合が<strong>カラーテーブル</strong>なら、コマごとに768バイトの\
        パレットが書かれています。大きな割合が<strong>メタデータ</strong>なら、\
        編集ソフトがXMPパケットを置いていったということで、これは絵に触れずに\
        取り除けます。そして全コマがキャンバス全体を覆っているなら、\
        どの部分が実際に変わったのかをエンコーダーが求めなかったということです。\
        撮影や録画をもとにしたファイルでは、これが大半を占めます。"""

[[faq]]
q = "2つのコマ表示は何が違うのですか？"
a = """
        <strong>各コマ後のキャンバス</strong>は、表示ソフトがその瞬間に見せる\
        ものです。前のコマが残したものの上に、このコマが描かれた状態です。\
        <strong>各コマが保存している分だけ</strong>は、そのコマのためにファイルが\
        実際に持っている矩形で、下に何も敷かず、それ単体で表示されます。
        <br><br>
        面白いのは後者です。GIFは変わった部分だけをコマとして保存できます。\
        ほとんど動かないウィンドウの画面録画が小さく収まるのはそのためです。\
        あなたのファイルのすべてのコマがキャンバス全体なら、その仕事は誰も\
        していません。アニメーションを見ていてもわからず、保存されている中身を\
        見て初めてわかります。"""

[[faq]]
q = "コメントやXMPが入っていると出ました。これは何ですか？"
a = """
        絵と一緒に運ばれ、どの表示ソフトも描かないテキストです。コメント\
        ブロックはたいてい、そのファイルを書いたソフトの名前です。XMPパケットは\
        画像編集ソフトが自分のしたことを記録するために書くXMLで、編集履歴や\
        ソフトのバージョン、ときには作者名まで含まれます。
        <br><br>
        このページは両方を省略せずに書き出します。メタデータで面白いのは、\
        あることではなく何が書いてあるかだからです。それが見えるのはあなただけ\
        です。このリポジトリの中に、それを誰かに読み上げるものはありません。"""

[[faq]]
q = "壊れたGIFでも開けますか？"
a = """
        試してみて、どこで諦めたかを伝えます。ブロックの途中で終わるファイル、\
        ブロック標識のあるべき位置に別のバイトがあるファイル、圧縮データが\
        早く尽きるコマを含むファイルでも、そこまで読めた分はすべて表示し、\
        何が起きたかを冒頭に示します。解析がいちばん必要になるのはまさにその場面\
        なので、バイト1つのために全体を捨てるのは正しい振る舞いではありません。"""

[[faq]]
q = "ファイルは書き換えられますか？"
a = """
        いいえ。この道具は読むだけです。出力ファイルも、再エンコードも、GIFを\
        書き出すボタンもありません。ダウンロードできるのは解析結果のテキストだけ\
        です。元のファイルはディスクの上でそのままです。タブを閉じたらどうなるか\
        という問いへの正直な答えも、これと同じです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。ファイルサイズの\
        制限も、端末のメモリ以外にはありません。このサイトには広告があり、それが\
        費用を賄っています。広告にファイルの情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        何もアップロードされていないことを示す、いちばん簡単な方法でもあります。\
        解析のためにGIFをどこかへ送っている道具なら、線を抜いた瞬間に止まる\
        からです。"""

