      それは目の前の画面に出るだけで、ほかのどこにも行きません。このリポジトリに、\
      それを載せる計測イベントはひとつもなく、仮にあってもこのページは送れません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      ファイルに関する情報は渡されません。ファイルも、サムネイルも、名前も、\
