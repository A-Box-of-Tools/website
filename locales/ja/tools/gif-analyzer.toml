      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。以前は<code>connect-src 'none'</code>と書いてあり、\
      それは例外のない記述でした。広告を入れた分だけそれを失ったので、その\
      ことも書いておきます。"""

[[privacy]]
title = "読み取りは、このリポジトリの4ファイルです。"
body = """
ファイルの中身を調べるのに、ブラウザのGIFデコーダーは使っていません。\
      あれは「どのバイトがどこへ行ったか」を教えてくれないからです。そこで\
      フォーマットは手で読んでいます。<code>src/gif.js</code>がブロックを\
      たどり、<code>src/lzw.js</code>が画素を展開し、<code>src/frames.js</code>\
      が重ね、<code>src/budget.js</code>が部分を足し戻してファイルサイズに\
      なるかを確かめます。"""

[[privacy]]
title = "コメントやメタデータは、あなたにだけ表示されます。"
body = """
GIFにはコメントブロックや、編集内容を記したXMPパケット、カラー\
