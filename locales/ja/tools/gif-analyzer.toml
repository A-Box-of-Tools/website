      ファイルについて渡されるものもありません。押さないかぎり何も起こらず、\
      押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのどの部分もそのまま動きます。これが\
      いちばん単純な証明です。解析のためにGIFを送っている道具なら、線を抜いた\
