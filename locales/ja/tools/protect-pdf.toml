[[privacy]]
title = "アップロードしたら目的を失うツールです。"
body = "パスワードを付けたい書類は、他人に渡したくない書類です。オンラインの保護ツールは、保護前の原本と選んだパスワードを、保存方針の見えないサーバーへ渡すよう求めます。このページではブラウザで読み、タブで鍵を生成し、メモリに暗号化したコピーを書きます。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはありません。通信を切っても動くことが簡単な証明になります。"

[[privacy]]
title = "パスワードは保護、操作の制限は依頼です。"
body = "<em>開くためのパスワード</em>から生成した鍵で内容を暗号化します。パスワード自体はファイルに書かず、持たない人は読めません。<em>操作の制限</em>は違います。パスワードなしで開ける書類には復号に必要な情報が入っていて、印刷などを止めるのはリーダーが守る権限欄です。Adobeが最初から説明しているように、リーダーは無視できます。このサイトの<a href=\"../unlock-pdf/\">PDF保護解除ツール</a>もその1つです。希望を伝えるには役立ち、多くのリーダーは守りますが、内容を閉ざす保護ではありません。"

[[privacy]]
title = "標準は現在のAES-256方式です。"
body = "PDFの暗号化には5世代あり、リーダーはすべて同じ「パスワード保護」と表示します。標準はPDF 2.0のパスワードハッシュを使うAES-256です。計算の費用を高くした、現在も強いと評価される方式ですが、強さはパスワードによります。1994年の鍵生成を使うAES-128を選ぶ理由は、2010年より前のリーダーで開く必要がある場合です。その違いを選択欄で説明します。"

[[privacy]]
title = "忘れると戻れないので、2回入力します。"
body = "このサイトにパスワードを推測する機能はありません。強い方式で保護してパスワードを忘れれば、書類は読めなくなります。そこで開くためのパスワードを2回入力し、一致させます。元のファイルは変更しないので、必ず残してください。"

[[privacy]]
title = "渡す前に、完成したファイルをここで開き直します。"
body = "ダウンロードするバイトを、このサイトのPDFツールが共通で使うリーダーへ2回渡します。パスワードなしでは拒否し、指定したパスワードでは開けて、ページ数と制限が指定どおりである必要があります。どちらかの確認に失敗したら、失敗を伝え、ダウンロードは提供しません。"

[[privacy]]
title = "ページを描き直し、再圧縮、再配置はしません。"
body = "変えるのは書類を包む暗号化です。各ページの描画命令、埋め込みフォント、画像は元のまま暗号化します。パスワードを持つ人は文字の選択や検索ができ、スキャンの解像度や配置も変わりません。書き直しに伴い、過去の編集で残った古いオブジェクトのコピーだけは引き継ぎません。"

[[privacy]]
title = "電子署名は残せず、見つけた場合は伝えます。"
body = "電子署名はファイルの正確なバイト列を対象とするので、書き直すと無効になります。このツールは新しいファイルを作るため、結果に署名はありません。署名を見つけたら結果で警告し、元の署名付きファイルはそのままです。両方必要なら、保護した後で署名してください。"

[[privacy]]
title = "すでに開封を防ぐ書類は、先に解除します。"
body = "開くためのパスワードがある書類には、重ねてパスワードを付けません。<a href=\"../unlock-pdf/\">PDF保護解除ツール</a>へのリンクを表示し、同じブラウザで解除したコピーを戻して新しい保護を付けます。誰でも開けて制限だけのある書類は受け付け、今回の指定で置き換えることを伝えます。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから読み込みます。ファイル、ページ、名前、サイズ、ページ数、パスワード、保護方式は渡しません。PDFを読み、暗号化し、書くコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "ヘッダーの「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、Google Fontsの文字を使います。訪問を報告する機能のないリンクで、利用者や書類の情報は渡しません。クリックするまで何も起こらず、移動先は別のサイトです。"

[[privacy]]
title = "オフラインでも動きます。"
body = "通信を切ってもすべての機能が動きます。書類を別の場所へ送って暗号化するツールなら止まるので、簡単な証明になります。"

[[howto]]
title = "PDFを選びます。"
body = "書類は1つずつ、ブラウザがディスクから直接読みます。開くためのパスワードがすでにある場合は解除ツールを案内します。制限だけなら受け付け、下の指定で置き換えます。"

[[howto]]
title = "開くためのパスワードを2回入力します。"
body = "内容を読める人を決める保護です。忘れたパスワードをここで復元することはできません。2つの入力が一致するとボタンが使えます。誰でも開ける書類に制限だけを付けるなら、両方空欄にします。"

[[howto]]
title = "必要な操作の制限を選びます。"
body = "印刷、文字や画像のコピー、書類の変更です。リーダーに守るよう求める依頼で、暗号による禁止ではありません。所有者パスワードで解除できます。空欄なら開くためのパスワードを兼用し、どちらもなければランダムな値を使って破棄します。空のパスワードでは解除できなくなります。"

[[howto]]
title = "保護し、確認結果を読みます。"
body = "新しい鍵で暗号化して書き出し、完成したファイルを2回開き直します。パスワードなしでは開けず、指定したパスワードでは同じページ数で開けることを確かめます。失敗した場合は伝え、ダウンロードを提供しません。"

[[faq]]
q = "パスワード付きPDFは安全ですか？"
a = "標準のPDF 2.0方式のAES-256には近道がなく、強さはパスワードに左右されます。ただしすべてのパスワード付きPDFがこの方式ではありません。1994年の総当たりで探せる40ビット鍵から現在の方式まで5世代あり、リーダーは同じ言葉で表示します。このページは最も強い方式を標準にし、もう1つの方式の違いも説明します。"

[[faq]]
q = "パスワードと操作の制限の違いは何ですか？"
a = "PDFには2つのパスワードがあります。<em>利用者</em>パスワードがなければ開けません。<em>所有者</em>パスワードは印刷、コピー、編集の<em>制限</em>を解除しますが、制限は依頼です。誰でも開ける書類には復号に必要な情報があり、リーダーは権限欄を無視できます。<a href=\"../unlock-pdf/\">PDF保護解除ツール</a>もその1つです。希望を伝えるなら制限、確実に開封を防ぐならパスワードを設定してください。"

[[faq]]
q = "パスワードを忘れたらどうなりますか？"
a = "書類を読めなくなります。<code>src/shared/pdf-crypt.js</code>には推測のループがなく、標準の強い方式に対して誠実に復元を約束できるツールもありません。2回入力するのはそのためです。元のファイルは変更しないので、必ず残してください。"

[[faq]]
q = "AES-256とAES-128のどちらを選びますか？"
a = "2010年より前のリーダーが必要な場合以外はAES-256です。PDF 2.0方式で、Acrobat X以降、ブラウザ、電話、現在のリーダーに対応します。AES-128は2005年の方式で古いリーダーにも対応しますが、1994年の鍵生成によりパスワードを推測しやすくなります。相手のリーダーが不明なら256を選びます。"

[[faq]]
q = "すでに保護されたPDFも使えますか？"
a = "パスワードなしで開けて制限だけがある場合は、今回の指定で置き換えます。開くためのパスワードがある場合は、同じブラウザの<a href=\"../unlock-pdf/\">PDF保護解除ツール</a>で解除したコピーを戻してください。PDFでは2つの保護を重ねられないので、変更は解除してから設定する作業です。"

[[faq]]
q = "書類の見た目は変わりますか？"
a = "変わりません。描画命令、フォント、画像をそのまま暗号化し、描き直しや再圧縮や再配置はしません。文字の選択、スキャンの解像度、配置も保ちます。古いオブジェクトを除く分だけ小さく、暗号化で各ストリームに16バイト加わる分だけ大きくなることがあります。"

[[faq]]
q = "署名付き書類はどうなりますか？"
a = "電子署名は無効になります。正確なバイト列を対象とするので、どのプログラムでも変更すれば無効になります。署名を検出したら結果で伝えます。保護と署名の両方が必要なら、まず保護し、そのコピーに署名してください。"

[[faq]]
q = "書類やパスワードは送信されますか？"
a = "いいえ。書類はブラウザで読み、暗号化し、書き、パスワードからの鍵生成もタブで行います。サーバーはなく、<code>Content-Security-Policy</code>の接続先にこのサイト自身のものはありません。通信を切って使うことでも確認できます。保護する書類を先に渡さずに済むことが、このツールの目的です。"

[[faq]]
q = "保護が付いたことをどう確かめますか？"
a = "端末で完成したファイルを2回開き直して確認します。パスワードなしでは拒否し、指定したパスワードで同じページ数と制限を読み取る必要があります。失敗したらダウンロードは提供しません。保存後にリーダーで開いてパスワードを求められることや、文書のプロパティで権限も確認できます。"

[[faq]]
q = "容量制限や料金はありますか？"
a = "ツール自体には制限を設けていません。処理中は書類をメモリに保持するため、限界は端末によります。ノートパソコンは数百MBなら通常扱えますが、それを大きく超えると難しくなります。無料で、アカウント、ログイン、お試し期間はありません。広告で運営していますが、書類の情報は広告に渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。一度開いて通信を切っても動きます。書類を別の場所へ送って暗号化するツールなら止まるので、何も送信しないことの確認になります。"

