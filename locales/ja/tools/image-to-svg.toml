read_first = """
、画像が1ピクセル1ビットになる過程は<code>src/mask.js</code>、形の縁をたどる\
一周は<code>src/contour.js</code>、階段が曲線になる過程は<code>src/fit.js</code>、\
明暗で分けられないときに背景をどう割り出すかは<code>src/subject.js</code>です。"""

howto_heading = "画像をアップロードせずにSVGにトレースする手順"

card = """
            拡大したビットマップは階段です。輪郭は指示なので、どんな大きさでも\
            鮮明です。手元にあるのが写真ではなく、形であれば。"""

