[[privacy]]
title = "画像には出ていく先がありません。"
body = """\
      Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """\
      <code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありません。ツールの全体は、1枚の画像のピクセルに\
      対する計算です。しきい値がひとつ、見つけた形の縁を一周、そして少しの曲線\
      当てはめ。それだけです。"""

[[privacy]]
title = "取り寄せるエンジンがありません。"
body = """\
      トレースはふつう他人のプログラムの仕事で、ウェブ上では最初のクリックより\
      先に数メガバイトのコンパイル済みコードが届くことを意味します。ここには\
      それがありません。全体はこのオリジンから配信される数百行の素朴なJavaScript\
      で、ページが待ち時間の後ではなく開いた瞬間に動く理由でもあります。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """\
      広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、画像に関する情報は渡されません。画像を読み、しきい値\
      で分け、トレースするコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """\
      通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """\
      ロゴ、ステンシル、署名、判子、スキャンした図面、シルエット。はっきりした形が\
      入っているものなら、何でもきれいにトレースできます。部屋の写真は向いておらず、\
      その場合は最後に驚かされる代わりに、下の方に率直な注意が出ます。ファイルは\
      ディスクから直接読み出され、その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "何が形なのかを伝えます。"
body = """\
      紙に描いた図は<strong>明暗</strong>で分けられ、その境目の値はこちらで計算\
      します。物を写した写真はそうはいきません。暗い灰色の石の上の暗い赤の像は、\
      暗い上に暗いもので、明るさでは分けられないからです。そうした写真には\
      <strong>被写体</strong>を選んでください。画像の縁に沿った帯から何が背景かを\
      学び、背景でないものをすべて残します。"""

[[howto]]
title = "設定ではなく、赤い線を見ます。"
body = """\
      輪郭は、その元になったピクセルの上に重ねて描かれます。この問いに答えが\
      出せる場所はそこしかないからです。輪郭が正しいか間違っているかは、その\
      ピクセルとの関係だけで決まります。どちらかの画像をドラッグすれば両方が\
      動き、ホイールを回せば、線が実際に何をしているか見えるところまで拡大\
      できます。"""

[[howto]]
title = "あってはいけないものをクリックで外します。"
body = """\
      ゴミ、ホチキスの針、判子、キャプション、影。クリックひとつでその色の\
      かたまり全体が選ばれるので、指しているのはピクセルではなく形です。もう\
      一度クリックすれば戻ります。囲まれた背景をクリックすると、今度はそこが\
      塗りつぶされます。穴であってはいけない穴は、こうして塞ぎます。"""

[[howto]]
title = "必要なときだけ、滑らかさを調整します。"
body = """\
      <em>細かさ</em>は、線を単純化するときにピクセルからどれだけ離れてよいかで、\
      指定しない限り形ごとに計算されます。<em>角の鋭さ</em>は、曲がり角が丸め\
      られずに角として残るために、輪郭がどれだけ曲がる必要があるかを決めます。\
      たいていの画像では、どちらも触る必要がありません。"""

[[howto]]
title = "SVGを受け取ります。"
body = """\
      ファイルはひとつ、<code>&lt;path&gt;</code>もひとつ、気にすべき塗りつぶし\
      規則もありません。輪郭は一方向に、穴は逆方向に回っているので、40個の穴の\
      ある形もひとつの要素になります。Illustrator、Inkscape、Figma、ブラウザ、\
      そしてカッティングマシンで開けます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """\
        いいえ。ファイルはお使いの端末上のブラウザが読み出し、このオリジンから\
        配信される数百行のJavaScriptがトレースし、ダウンロードとして返します。\
        このツールにはネットワーク機能が一切なく、何かを取りに行くことも送ること\
        もありません。ページの<code>Content-Security-Policy</code>には接続して\
        よいアドレスがすべて挙がっていますが、そのどれも当サイトのものでは\
        ありません。"""

[[faq]]
q = "写真をSVGにできますか？"
a = """\
        役に立つ形にはなりません。それはダウンロードしてから気づかせる代わりに、\
        ページがその場で伝えます。トレースは似た色のかたまりを一つひとつ別の形に\
        するので、写真は重なり合った何千ものしみになって戻ってきます。ファイルは\
        JPEGの何倍にもなり、開くのは遅く、写真には見えません。きれいにトレース\
        できるのは、<em>形</em>が入っている画像です。ロゴ、ステンシル、署名、線画、\
        シルエット。物をひとつ写した写真なら、<em>被写体</em>の設定がそれを塗り\
        つぶしのシルエットひとつとして切り抜きます。これは別の仕事で、本当に役に\
        立ちます。"""

[[faq]]
q = "形を見つける2つの方法は何が違うのですか？"
a = """\
        投げかける問いが違います。<strong>明暗</strong>は、各ピクセルがある値より\
        暗いかを問います。紙の上のインクにはぴったりで、被写体と背景が同じくらい\
        暗いときには役に立ちません。<strong>被写体</strong>は、何が背景かを問い\
        ます。画像の縁に沿った帯からそれを学び、各ピクセルをそれと比べ、背景で\
        ない最大のものを残します。ほぼ一様な背景の前に物をひとつ置いた写真では\
        うまくいき、被写体が三辺からはみ出すほど詰めて切り抜かれた画像では失敗\
        します。学ぶ元になる縁が、被写体そのものになってしまうからです。その\
        ときは、代わりに背景を自分で指し示せます。"""

[[faq]]
q = "トレースした形に穴が開いたり、細い部分が消えたりするのはなぜですか？"
a = """\
        1ピクセル1ビットに落とした時点で、画像がそうなっていたからです。\
        <em>トレーサーが受け取ったもの</em>を表示して確かめてください。12ピクセル\
        ほどを下回ると、文字の中の空きはすでに埋まり、縦棒はすでにくっついて\
        います。そこにない穴を、どんなトレースも取り戻せません。手当ては手前に\
        あります。しきい値を動かすか、もっと大きなスキャンから始めてください。\
        <em>被写体</em>モードでは、<em>隙間を塞ぐ幅</em>が小さな穴を閉じ、\
        <em>中を塗りつぶす</em>が、背景が画像の縁から届かない穴をすべて閉じます。"""

[[faq]]
q = "間違えた部分は直せますか？"
a = """\
        はい。3番目のステップは、ほぼそのためにあります。図に入るべきでないものを\
        クリックすれば消え、もう一度クリックすれば戻ります。クリックひとつでその\
        色のかたまり全体が選ばれるので、1回でゴミひとつや判子ひとつがまるごと\
        外れ、ピクセルひとつではありません。囲まれた背景をクリックすると塗り\
        つぶされます。修正はしきい値とは別に保持されるので、あとでスライダーを\
        動かしても捨てられません。"""

[[faq]]
q = "SVGはどれくらいの大きさになりますか？"
a = """\
        形であれば、画像より小さくなります。トレースしたシルエットはたいてい\
        1〜5キロバイトで、ロゴならもう少し増えます。正確な値はダウンロードの隣に\
        ページが表示します。写真なら巨大になり、それがこのツールがそのファイルに\
        向いていないという最もはっきりした印です。独立した形が1000個ほどを\
        超えると、ページは描くのをやめてそう伝えます。"""

[[faq]]
q = "色付きでトレースできますか？"
a = """\
        いいえ。これは1色の形をひとつ作るもので、それが粗悪なコピーではなく図と\
        して仕上がる場合です。色付きのトレースとは、数色に減色して一色ずつ別の\
        レイヤーとしてトレースすることで、その結果は、求める人のほとんどをがっかり\
        させます。色が必要なら、ここで形をトレースし、お使いのドローソフトで塗って\
        ください。"""

[[faq]]
q = "できたSVGで何ができますか？"
a = """\
        ぼやけることなくどんな大きさにも伸ばす、属性ひとつで色を変える、アニメー\
        ションさせる、印刷する、カッティングマシンやレーザーに送る。間違えようの\
        ある塗りつぶし規則を持たない<code>&lt;path&gt;</code>ひとつなので、\
        Illustrator、Inkscape、Figma、ブラウザ、そしてほとんどのCNCソフトが同じ\
        ように読みます。"""

[[faq]]
q = "画像の大きさに上限はありますか？"
a = """\
        お使いの端末の上限であって、こちらの上限ではありません。300dpiでスキャン\
        したA4一枚、およそ900万ピクセルは一瞬でトレースできます。もっと大きな\
        画像でも動きます。時間がかかるだけで、その作業はどこかの待ち行列ではなく、\
        手元のプロセッサで行われます。"""

[[faq]]
q = "無料ですか？アカウントは必要ですか？"
a = """\
        無料で、アカウントもログインも試用期間も透かしもありません。ファイルの数\
        や大きさの上限もありません。費用を負担するサーバーが存在せず、作業は手元\
        の端末で行われるからです。サイトには広告が載っていて、それが費用を\
        まかなっています。広告には、ファイルに関する情報は何も渡されません。"""

[[faq]]
q = "オフラインで動きますか？"
a = """\
        はい。ページを一度読み込んだら回線を切ってください。そのまま動き続けます。\
        何もアップロードされていないことを示す、いちばん簡単な方法でもあります。\
        画像をどこかへ送ってトレースさせるツールなら、線を抜いた瞬間に止まる\
        はずです。"""

[schema]
description = "白黒の画像をブラウザの中でSVGの輪郭にトレースします。明暗で分けるか、背景に対する被写体を見つけ、形に曲線を当てはめ、トレースすべきでないものはクリックで外せます。アップロードはありません。"
features = [
  "ビットマップの形を本物の3次ベジェ曲線にトレース。どんな大きさでも鮮明",
  "形を見つける2つの方法。明暗で分けるか、背景に対する被写体か",
  "部分をクリックすれば外れ、囲まれた隙間をクリックすれば埋まる",
  "輪郭は元のピクセルの上に重ねて表示。16倍まで拡大可能",
  "穴も入れ子の穴も、塗りつぶし規則の設定なしにひとつのパスとして出力",
  "角と滑らかさのしきい値は、指定しない限り形ごとに計算",
  "線画ではなく写真だったときには警告",
  "オフラインで動作。アップロードなし、登録なし、取り寄せるエンジンなし",
]

[picker]
title = "ここに画像をドロップ"
hint = "クリックして選ぶこともできます。PNG、JPEG、WebP、GIF、AVIF"
