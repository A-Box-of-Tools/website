<main>
  <!-- ステップ1 &mdash; 画像 -->
  <section class="card">
    <h2><span class="step">1</span> 画像を選ぶ</h2>

    <!--
      A real <label> drives the file picker natively. Calling .click() on a
      display:none input is refused by Safari and some Chrome configurations,
      so the input stays in the layout: visually hidden, still focusable, and
      reachable by keyboard. There is no JavaScript in this path at all.
    -->
    {% include "partials/file-picker.html" %}

    {% include "partials/url-import.html" %}

    <div id="list-toolbar" class="toolbar" hidden>
      <span id="count-label" class="count"></span>
      <div class="toolbar-actions">
        <div class="view-switch" role="group" aria-label="リストの表示方法を変える">
          <button type="button" data-view="large" class="active">大</button>
          <button type="button" data-view="small">小</button>
          <button type="button" data-view="list">一覧</button>
          <button type="button" data-view="details">詳細</button>
        </div>
        <button type="button" data-sort="name" class="ghost">名前順に並べる</button>
        <button type="button" data-sort="date" class="ghost">日付順に並べる</button>
        <button type="button" data-sort="reverse" class="ghost">逆順にする</button>
        <button type="button" id="clear-all" class="ghost danger">全部外す</button>
      </div>
    </div>

    <p id="reorder-hint" class="reorder-hint" hidden>
      画像の <span class="grip" aria-hidden="true">&#8942;&#8942;</span> の取っ手をドラッグするか、それぞれの矢印を使って並べ替えられます。
    </p>

    <ul id="image-list" class="image-list view-large"></ul>

    <div id="bulk-duration" class="bulk" hidden>
      <label for="bulk-amount">1枚あたりの表示時間</label>
      <input type="number" id="bulk-amount" min="1" max="3600" step="1" value="1">
      <select id="duration-unit" aria-label="1枚をどれだけ映すかの単位">
        <option value="frames" selected>フレーム</option>
        <option value="seconds">秒</option>
      </select>
      <button type="button" id="apply-bulk" class="ghost">全部に適用</button>
      <span class="bulk-note" id="bulk-note"></span>
    </div>
  </section>

  <!-- ステップ2 &mdash; 設定 -->
  <section class="card">
    <h2><span class="step">2</span> 動画の設定</h2>

    <div class="settings">
      <div class="field">
        <label for="resolution">解像度</label>
        <select id="resolution">
          <option value="auto" selected>いちばん大きい画像に合わせる</option>
          <option value="3840x2160">3840 &times; 2160 &mdash; 4K</option>
          <option value="1920x1080">1920 &times; 1080 &mdash; 1080p</option>
          <option value="1280x720">1280 &times; 720 &mdash; 720p</option>
          <option value="1080x1080">1080 &times; 1080 &mdash; 正方形</option>
          <option value="1080x1920">1080 &times; 1920 &mdash; 縦長</option>
          <option value="custom">自分で指定&hellip;</option>
        </select>
        <div id="resolution-custom" class="inline-pair" hidden>
          <input type="number" id="custom-width" min="16" max="7680" step="2" value="1920"
                 aria-label="指定する書き出し幅（ピクセル）">
          <span aria-hidden="true">&times;</span>
          <input type="number" id="custom-height" min="16" max="7680" step="2" value="1080"
                 aria-label="指定する書き出し高さ（ピクセル）">
        </div>
        <p class="field-note" id="resolution-note"></p>
      </div>

      <div class="field">
        <label for="fps">フレームレート</label>
        <select id="fps">
          <option value="12">12 fps</option>
          <option value="15">15 fps</option>
          <option value="24">24 fps &mdash; 映画</option>
          <option value="25">25 fps &mdash; PAL</option>
          <option value="30" selected>30 fps</option>
          <option value="50">50 fps</option>
          <option value="60">60 fps</option>
          <option value="custom">自分で指定&hellip;</option>
        </select>
        <input type="number" id="fps-custom" class="spaced" min="1" max="120" step="1" value="30"
               aria-label="指定するフレームレート（1秒あたりのフレーム数）" hidden>
        <p class="field-note" id="fps-note"></p>
      </div>

      <div class="field">
        <label for="fit">画像の収め方</label>
        <select id="fit">
          <option value="contain" selected>内側に収める（レターボックス）</option>
          <option value="blur">内側に収め、背景をぼかす</option>
          <option value="cover">画面いっぱいに（端が切れます）</option>
          <option value="stretch">引き伸ばして埋める（形が歪みます）</option>
        </select>
      </div>

      <div class="field" id="background-field">
        <label for="background">背景色</label>
        <input type="color" id="background" value="#000000">
      </div>

      <div class="field">
        <label for="quality">画質</label>
        <select id="quality">
          <option value="low">ファイルを小さく</option>
          <option value="medium" selected>バランス</option>
          <option value="high">最高画質</option>
        </select>
      </div>

      <div class="field">
        <label for="format">形式</label>
        <select id="format">
          <option value="auto" selected>MP4（推奨）</option>
          <option value="webm">WebM（代替）</option>
        </select>
        <p class="field-note" id="format-note"></p>
      </div>
    </div>

    <div class="preview-row">
      <div class="preview-frame">
        <canvas id="preview" width="640" height="360" aria-label="最初のフレームのプレビュー"></canvas>
        <p id="preview-empty" class="preview-empty">画像を追加するとプレビューが見られます</p>
      </div>
      <dl class="summary" id="summary">
        <div><dt>画像</dt><dd id="sum-images">&mdash;</dd></div>
        <div><dt>長さ</dt><dd id="sum-duration">&mdash;</dd></div>
        <div><dt>書き出しサイズ</dt><dd id="sum-size">&mdash;</dd></div>
        <div><dt>総フレーム数</dt><dd id="sum-frames">&mdash;</dd></div>
      </dl>
    </div>
  </section>

  <!-- ステップ3 &mdash; 書き出し -->
  <section class="card">
    <h2><span class="step">3</span> 動画を作る</h2>

    <div class="export-row">
      <button type="button" id="export" class="primary" disabled>動画を作る</button>
      <button type="button" id="cancel" class="ghost" hidden>中止</button>
    </div>

    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <p id="progress-label" class="progress-label" role="status" aria-live="polite"></p>
    </div>

    <p id="error" class="error" role="alert" hidden></p>

    <div id="result" class="result" hidden>
      <video id="result-video" controls playsinline></video>
      <div class="result-meta">
        <p id="result-info"></p>
        <a id="download" class="primary as-button" download>動画をダウンロード</a>
      </div>
    </div>
  </section>
</main>
