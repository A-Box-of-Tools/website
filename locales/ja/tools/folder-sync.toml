[[privacy]]
title = "フォルダを選び、そのうえで端末を承認します。"
body = "各端末はブラウザ標準の選択画面で自分のフォルダを選び、このページはそのフォルダの外には一切アクセスできません。同期を始めた端末は、どちらのフォルダについても何かが送られる前に、参加する端末を承認します。最初のピア接続で運ばれるのは、暗号化された制御チャネルと、参加する端末のリクエスト（任意のメモ付き）だけです。メモは本人が自由に書いた文章で、確認済みの身元ではありません。ホストと同期できるのは一度に1台の端末だけで、最大4件のリクエストが待機できます。参加したブラウザはランダムな承認証をローカルに保存し、暗号化されたピア間のチャネルでだけ提示するので、再承認なしで同じセッションに再接続できます。同期を停止するか、その端末を切断すると、承認証は無効になります。"

[[privacy]]
title = "相手の端末には、ファイル一覧と同期するファイルが見えます。"
body = "承認されると、各端末は選んだフォルダ内のすべてのファイルのパス、サイズ、最終更新日時を相手に送り、両者を比較できるようにします。コピーされないファイルも含まれます。サイズが同じで日時が異なる2つのファイルがある場合、各端末は自分のコピーを読み、内容そのものではなく内容のフィンガープリントを送ります。ファイル自体が送られるのは「今すぐ同期」を押したときだけで、対象は両方の端末の設定が認める同期内容のファイルに限られます。「送信のみ」に設定した端末はファイルを受け付けず、「受信のみ」に設定した端末はファイルを送りません。相手の端末は、受け取ったものをそのまま手元に残します。"

[[privacy]]
title = "ファイルは暗号化され、端末間で直接やり取りされます。"
body = "ファイル一覧、フィンガープリント、ファイルは、2つのブラウザ間で直接結んだ暗号化WebRTC接続を通ります。受け付けるのはホストの接続アドレスだけで、公開STUNサーバーは設定しておらず、中継もないため、途中でサーバーを通るものはありません。両方の端末には、互いに到達できるネットワークが必要です。同じWi-Fi、Ethernet、スマートフォンのテザリングのいずれかです。ゲストネットワークの端末分離、ファイアウォール、VPNの経路、ブラウザのローカルネットワーク権限によって、接続できない場合があります。ホストアドレスには公開インターフェースが含まれたり、VPNの経路をたどったりすることがあるため、通信が建物の中だけに留まることの証明にはなりません。"

[[privacy]]
title = "ペアリングでは、接続準備のメタデータが紹介サービスに見えます。"
body = "開始または参加すると、<code>rendezvous.abox.tools</code>へのWebSocketが開きます。サービスには、ランダムなルームコード、IPアドレス、接続時刻、WebRTCの接続記述、ICE候補が見えます。これらの接続準備メッセージは、サービスから隠されていません。ファイル名、ファイル一覧、フィンガープリント、ファイル、メモ、承認の判断は、暗号化されたピア接続を通ります。ルームの内容をストレージに書き込むことはありません。サービスを運営するCloudflareは、コード、アドレス、時刻などの要求メタデータを含む接続ログを7日間保持します。検索と接続の準備には、インターネット接続が必要です。"

[[privacy]]
title = "検索一覧への表示は任意で、表示されるのは招待コードだけです。"
body = "「利用できる接続に表示」は初期設定でオフです。ランダムな招待コードを公開するには、開始する前にチェックを入れてください。この設定は停止するまで変更できません。もう一方の端末で「接続を探す」を選ぶと、そのコードが見えます。フォルダ名、ファイル名、ファイル数は一覧に表示されません。サービスはこのツールのページを、公開IPv4アドレスまたはIPv6 /64サブネットと、ウェブサイトのオリジンでまとめます。そのため、共有の通信事業者ゲートウェイやVPNでは知らない人が含まれたり、経路の違いで近くの端末が見えなくなったりする場合があります。非公開グループでは代わりに、各端末で同じランダムなグループコードを使います。サービスはそのディレクトリを認証するためにコードを受け取りますが、このツールはコードを保存せず、同期リンクにも含めません。グループコードを知っている人は一覧のセッションを見られますが、承認は引き続き必要です。"

[[privacy]]
title = "書き込みは完了するか、まったく反映されないかのどちらかで、何も削除しません。"
body = "受信したファイルはまず隣に作る一時的なコピーに書き込まれ、すべてのバイトが届いてから初めて古いファイルと置き換わります。そのため、同期をキャンセルしたり途中で失敗したりしても、書きかけのファイルは残りません。書き込みが中断されたとき、それまで存在しなかったファイルは取り除かれます。どちらのフォルダでも、何かが削除されることは決してありません。ウェブページはファイルの更新日時を設定できないため、書き込んだファイルの日付は今日になります。フォルダに書き込めないブラウザでは、受信したファイルをこのページのメモリに集め、保存を選んだときに1つのZIPとして保存します。"

[[privacy]]
title = "招待は、ページ内のスクリプトから読み取れます。"
body = "セッションごとに新しいランダムなリンクを使います。リンクがあれば接続を試みることはできますが、その後どうなるかは引き続き承認で決まります。このページには、このサイトで通常使っているGoogleの広告と計測のスクリプトがあります。ツールがファイル名、ファイル一覧、ファイルを意図してそれらに渡すことはありませんが、ページ内で動くスクリプトは、リンクのコードを含め、ページのアドレスと同じページ内の状態を読み取れます。待っていた端末からのリクエストと、あなたの承認を、参加を認める手順として扱ってください。"

[[howto]]
title = "両方の端末でこのツールを開きます。"
body = "送信と受信の両方ができるフォルダにするには、パソコンのChrome、Edge、またはその他ほとんどのChromium系ブラウザを使ってください。FirefoxとSafariはフォルダを送信でき、受信はZIPになります。両方の端末を同じWi-Fi、Ethernet、またはスマートフォンのテザリングにつなぎ、紹介のためにインターネット接続も使える状態にしておきます。"

[[howto]]
title = "各端末でフォルダを選びます。"
body = "「フォルダを選ぶ」でフォルダを選び、この端末でファイルを受信するなら、ブラウザにフォルダの変更を許可します。各端末の動作を「送信と受信」「送信のみ」「受信のみ」から選びます。システムファイル、一時的なコピー、Windows・macOS・Linuxのいずれかで保存できない名前は対象外になり、一覧に表示されます。"

[[howto]]
title = "一方の端末で開始し、もう一方から参加します。"
body = "「同期を開始」を選び、もう一方の端末で同期リンクを開きます。「利用できる接続に表示」を選んで開始した場合は、もう一方の端末で「接続を探す」を選んでから「参加」を選んでもかまいません。見覚えのあるリクエストを承認してください。承認するまで、どちらのフォルダについても何も送られません。"

[[howto]]
title = "比較結果を確認します。"
body = "両方の端末に、すべての違いが一覧表示されます。片側にしかないファイル、片側のほうが新しいファイル、そして日付は同じでも内容が異なるファイルです。各行には既定の処理が表示され、「送信する」「ここにコピーする」「そのままにする」に変更できます。何も削除されないので、意図して削除したファイルは「そのままにする」にするか、両方の端末で削除してください。"

[[howto]]
title = "同期し、後でもう一度比較します。"
body = "どちらかの端末で「今すぐ同期」を選びます。両方の端末に進行状況が表示され、ファイルはすべて届いてから初めて古いコピーと置き換わります。終わると両方のフォルダが読み直され、比較されます。後でまた同期するなら両方のページを開いたままにするか、必要なときに停止して新しいセッションを始めてください。"

[[faq]]
q = "ファイルはどこかにアップロードされますか？"
a = "いいえ。ファイル、ファイル名、フォルダの一覧は、2つのブラウザ間で直接結んだ暗号化接続を通り、中継はありません。ブラウザ同士をつなぐ紹介サービスに見えるのは、ルームコードやIPアドレスなどの接続準備のメタデータで、どちらのフォルダの中身も見えません。"

[[faq]]
q = "もう一方の端末で削除したファイルは、こちらでも削除されますか？"
a = "いいえ、決して削除しません。前回の同期の記録がなければ、一方の端末にないファイルは、もう一方の端末にある新しいファイルとまったく同じに見えます。推測を誤れば、誰かの作業を壊してしまいます。片側にないファイルは、その側へのコピーが提案されます。その行を「そのままにする」に設定するか、両方の端末で削除してください。"

[[faq]]
q = "両方の端末でファイルが変更された場合、どちらのコピーが優先されますか？"
a = "既定では、更新日時が新しいほうのコピーが古いほうを置き換え、どちらの向きにコピーするかは行に表示されます。同期する前なら、どの行も変更できます。日時がまったく同じで内容が異なる2つのコピーは、あなたが選ぶまでそのままです。サイズが同じで日時が異なるファイルは先に内容を比較するので、同じ内容のコピーが再送されることはありません。"

[[faq]]
q = "どのブラウザで使えますか？"
a = "パソコンのChrome、Edge、その他ほとんどのChromium系ブラウザは、フォルダを読み込み、そこに書き込むこともできます。FirefoxとSafariは送信元のフォルダを選べ、受信したファイルは自分で展開するZIPとして最大512 MBまで受け取れます。ほとんどのスマートフォンのようにフォルダをまったく選べないブラウザは、ZIPでの受信だけができます。"

[[faq]]
q = "2台の端末は同じネットワークにある必要がありますか？"
a = "はい。ファイルは端末間で直接やり取りされるため、互いに到達できるネットワークが必要です。同じWi-Fi、Ethernet、スマートフォンのテザリングのいずれかです。紹介のために、両方の端末でインターネット接続も必要です。ゲストネットワーク、クライアント分離、ファイアウォール、VPNによって接続が遮断される場合があります。異なるネットワークにある端末のための中継はありません。"

[[faq]]
q = "ほかの人が私の同期に参加できますか？"
a = "あなたが承認した場合だけです。同期リンクや一覧に表示された招待コードがあれば、端末は参加をリクエストできます。あなたのフォルダについて何かが送られる前に、各リクエストを承認するか拒否するかを決めます。あなたの端末と同期できるのは一度に1台だけです。リクエストのメモは相手が自由に書いた文章なので、承認する前に、その端末とタイミングに心当たりがあるか確かめてください。"

[[faq]]
q = "相手の端末に自分のフォルダを変更させないようにできますか？"
a = "はい。開始する前に、この端末を「送信のみ」に設定してください。相手の端末はあなたのフォルダからファイルをコピーできますが、書き込むことはできず、書き込もうとする同期内容はこのページが拒否します。「受信のみ」はその逆で、ファイルを受け取るだけで自分のファイルは送られません。ただし、ファイル一覧は引き続き比較されます。"

[[faq]]
q = "同期の途中で接続が切れたらどうなりますか？"
a = "完全に届いたファイルは残ります。転送中だったファイルは破棄され、古いコピーがあった場合は、元のままの状態で残ります。受信したファイルは、すべてのバイトが届いてから初めて古いファイルと置き換わるからです。もう一度接続して比較すれば、まだ足りないファイルが次の同期内容に含まれます。"

[[faq]]
q = "同期したファイルの日付が今日になるのはなぜですか？"
a = "ウェブページはファイルの内容を書き込めても、最終更新日時は設定できないため、受信したファイルには書き込んだ日時が付きます。次の比較では、サイズは同じでも日時が異なるファイルの内容を確認し、同じ内容のコピーは同期済みとして扱います。"

[[faq]]
q = "フォルダのサイズに上限はありますか？"
a = "1つのフォルダに入れられるファイルは最大50,000個です。フォルダへの書き込みでは各ファイルを少しずつディスクに書き出すので、大きなファイルも問題ありません。ZIPで受信する場合はファイルをメモリに保持し、512 MBで止まります。階層が非常に深いパスや非常に長いパス、Windows・macOS・Linuxのいずれかで保存できない名前は対象外になり、一覧に表示されます。"

[[faq]]
q = "紹介サービスには何が分かりますか？"
a = "紹介サービス（rendezvous）には、招待コード、IPアドレス、接続時刻、WebRTCの接続記述と候補が見えます。ホストが検索一覧への表示を選んだ場合は、選択したネットワークまたは非公開グループからランダムな招待コードが見えます。非公開グループのコードはディレクトリの認証のためにサービスへ送られますが、同期リンクには含まれません。Cloudflareは紹介の要求メタデータを7日間保持します。ファイル名、ファイル一覧、フィンガープリント、ファイル、メモ、承認は、暗号化されたピア接続を使います。"

[schema]
description = "2台の端末のフォルダを比較し、片方にないファイルや新しいファイルを、暗号化されたWebRTC接続でブラウザ間で直接コピーします。承認が必要で、アップロードはありません。"
features = [
  "パス、サイズ、日時、内容のフィンガープリントで2つのフォルダを比較",
  "同期の前にファイルごとの処理を確認して変更",
  "2つのブラウザ間で中継なしに直接、暗号化して転送",
  "参加する端末の承認が必須",
  "「送信のみ」と「受信のみ」を各端末で強制",
  "受信したファイルは、完全に届いてから古いコピーと置き換え",
  "ファイルを一切削除しない",
  "フォルダに書き込めないブラウザではZIPで受信",
]
