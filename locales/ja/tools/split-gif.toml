[[privacy]]
title = "GIFには出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。ファイルが\
      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。以前は<code>connect-src 'none'</code>と書いてあり、\
      それは例外のない記述でした。広告を入れた分だけそれを失ったので、その\
      ことも書いておきます。"""

[[privacy]]
title = "GIFの読み取りは、このリポジトリの2ファイルです。"
body = """
ブラウザはGIFを再生はしますが、その中身を渡してはくれません。そこで\
      フォーマットはここで読んでいます。<code>src/gif.js</code>が入れ物と\
      LZW展開、<code>src/compose.js</code>が、前のコマが下に敷かれた状態で\
      各コマがどう見えるかを決める破棄規則です。ファイルを開くために何かを\
      取りに行くことはなく、初回に落ちてくるエンジンもありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      アニメーションに関する情報は渡されません。ファイルも、コマも、名前も、\
      サイズも、枚数もです。画像を読み、展開し、描き、書き出すコードは\
      すべてこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体はGoogle Fontsから読み込みます。それはリンク\
      以上のものではありません。訪問を報告することもなく、あなたやあなたの\
      ファイルについて渡されるものもありません。押さないかぎり何も起こらず、\
      押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのどの部分もそのまま動きます。これが\
      いちばん単純な証明です。分解のためにアニメーションを送っている道具なら、\
      線を抜いた瞬間に止まるからです。"""

[[howto]]
title = "GIFを選びます。"
body = """
選択欄にドラッグするか、手で選んでください。ブラウザが\
      ディスクから直接読み、見つけた内容をページが表示します。サイズ、コマ数、\
      再生時間、繰り返し回数です。"""

[[howto]]
title = "1枚のPNGに何を入れるか決めます。"
body = """
<strong>見えているとおりのコマ</strong>が、\
      ほとんどの人が求めるものです。アニメーションのその瞬間の絵全体になります。\
      <strong>そのコマが保存している画素だけ</strong>は、ファイルが実際に\
      持っている継ぎ当ての部分で、それ自身の大きさと位置のままです。GIFが\
      小さく収まる理由がこれで、アニメーションの見た目とは別物です。"""

[[howto]]
title = "透過の扱いを決めます。"
body = """
PNGは透過をそのまま保てるので、これが正直な既定値\
      です。透過を無視して黒く塗ってしまう場所へコマを持っていくのであれば、\
      代わりに色で塗りつぶしてください。"""

[[howto]]
title = "欲しいコマを選びます。"
body = """
既定はすべてです。「2コマに1枚だけ残す」は長い\
      録画を間引くための設定で、一覧のチェックボックスがそれより優先されます。\
      番号は変わらないので、隣をどれだけ捨てても42コマ目は42コマ目のままです。"""

[[howto]]
title = "ダウンロードします。"
body = """
一覧から1枚ずつでも、まとめて1つのZIPでも構いません。\
      ZIPなら保存の確認が数百回ではなく1回で済みます。ZIPには、各コマが\
      どれだけ表示されたかを書いた<code>frames.txt</code>を入れられます。\
      PNGを並べたフォルダだけでは伝えられない、唯一の情報です。"""

[[faq]]
q = "GIFはどこかにアップロードされますか？"
a = """
        いいえ。ファイルを読み、展開し、描くのはお使いのブラウザで、場所も\
        お手元のハードウェアです。PNGもここのメモリで作られます。この道具に\
        サーバー側はなく、ページの<code>Content-Security-Policy</code>には\
        接続してよいアドレスがすべて書かれていて、そのどれもこのサイトのもの\
        ではありません。回線を抜いても、GIFの分解はそのまま続きます。"""

[[faq]]
q = "コマの1枚が絵の一部にしか見えないのはなぜですか？"
a = """
        ファイルがそう持っているからです。GIFは最初の1枚と、そのあとに続く\
        継ぎ当てでできています。2枚目以降は変わった長方形だけを保存し、画面の\
        残りは前のコマが置いていったものです。動かない壁の前で話す人の映像なら、\
        1コマにつき顔だけが保存され、絵全体は保存されません。この形式が\
        巨大にならない理由はここにあります。
        <br><br>
        いま見えているのは「そのコマが保存している画素だけ」を選んでいるから\
        です。「見えているとおりのコマ」に切り替えれば、どのPNGも、その瞬間の\
        アニメーションの絵全体になります。"""

[[faq]]
q = "透過は保たれますか？"
a = """
        保たれます。GIFの透過は1ビットで、画素は塗られているか見えないかの\
        どちらかしかありません。PNGはそれをそのまま保存できるので、透過部分は\
        そのまま出てきます。塗りつぶした背景のほうがよければ、「透過部分」を\
        色で塗る設定にしてください。その色はPNGに書き込まれ、あとから取り除く\
        ことはできません。"""

[[faq]]
q = "表示時間が思っていた数字と違うのはなぜですか？"
a = """
        GIFは表示時間を100分の1秒単位で持っていますが、ブラウザは1990年代から\
        2以下の値を0.1秒に引き上げています。当時の回る地球儀のために書かれ、\
        そのまま残った規則です。ファイルに0.01秒と書かれたコマは、どこでも\
        0.10秒で再生されます。この道具は実際に再生される時間を表示し、\
        ファイルの値と食い違うときは、その値も横に書きます。"""

[[faq]]
q = "分解したコマをまた1つに戻せますか？"
a = """
        戻せます。このサイトの<a href="../gif-maker/">GIF作成</a>でも、画像の\
        入ったフォルダを受け取れる別のソフトでも構いません。ZIPに入る\
        <code>frames.txt</code>はそのためのものです。分解するとタイミングは\
        失われます。PNGには表示時間を書いておく場所がないからで、代わりに\
        この一覧が各コマの表示時間と位置を持ち出します。"""

[[faq]]
q = "コマはどの形式で保存できますか？"
a = """
        PNGだけです。意図してそうしています。GIFのコマは最大256色と1ビットの\
        透過で、PNGはそれをそのまま、劣化なく保存できます。JPEGなら透過は\
        捨てられ、元のコマになかった色が作られ、平らな絵からはたいてい\
        <em>大きい</em>ファイルができます。JPEGが必要なら、あとから\
        <a href="../resize-image/">画像リサイズ</a>で変換してください。"""

[[faq]]
q = "読み込めるコマ数に上限はありますか？"
a = """
        決まった上限はありません。実際の頭打ちは端末のメモリです。GIFは読み込み\
        中に1画素1コマあたり約1バイトまで膨らむので、小さなファイルでも\
        たいへんな量になり得ます。そこでこのページは、タブを落とすくらいなら\
        読み込みをやめます。そうなったときはその旨を伝え、そこまでに取れた\
        コマを返します。"""

[[faq]]
q = "壊れたGIFでも開けますか？"
a = """
        たいていは開けます。途中で切れたダウンロード、終端マークの欠落、\
        データの途中で終わる最後のコマは、どれもよくあることです。それを拒む\
        読み取りは、いちばん分解したいファイルにかぎって役に立ちません。\
        揃っているコマはすべて返され、何がおかしかったかも添えられます。\
        はねられるのは、そもそもGIFではないファイルだけです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。コマに透かしも\
        入りません。このサイトには広告があり、それが費用を賄っています。広告に\
        ファイルの情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        何もアップロードされていないことを示す、いちばん簡単な方法でもあります。\
        処理のためにアニメーションをどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

