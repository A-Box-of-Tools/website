description = "アニメーションGIFをコマに分解し、1枚ずつPNGとして保存します。展開はブラウザの中で行われるため、アニメーションがアップロードされることはありません。"
features = [
  "GIFの各コマを1枚ずつPNGに、透過はそのまま",
  "見えているとおりのコマか、そのコマが保存している画素だけか",
  "コマごとの表示時間・位置・大きさ・破棄方法を表示",
