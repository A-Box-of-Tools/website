# YAMLをJSONに変換 - Japanese.
#
# Overrides for tools/yaml-to-json/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Every prose value below ends its lines with a backslash. Japanese puts no
# space between words, so a newline inside a sentence arrives as a space inside
