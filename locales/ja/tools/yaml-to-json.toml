[[privacy]]
title = "貼り付けたものに、出ていく先はありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。貼り付けた設定が\
      集められるような受け口はここになく、仮にあったとしても、そこへ送るコードが\
      ありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も\
      <code>XMLHttpRequest</code>も<code>sendBeacon</code>もありません。二つのパーサーも\
      二つのプリンターも、文字列を受け取って文字列を返す、このページの中の関数です。"""

[[privacy]]
title = "読むのはYAML 1.2なので、ノルウェーはノルウェーのままです。"
body = """
YAML 1.1では<code>no</code>が真偽値でした。ノルウェーの国コードを\
      <code>false</code>に変えてしまう、あの有名なバグです。ここで読むのは1.2で、そこでは\
      見たとおりの文字列です。逆向きでは、それらの語は<em>引用符付き</em>で書き戻します。\
      次にそのファイルを開くものが、まだ1.1の読み取り器かもしれないからです。\
      <code>tests/js/text-convert.test.js</code>が両方を確かめています。"""

[[privacy]]
title = "正直でいられない変換は、代わりに止まります。"
body = """
YAMLの中のアンカー、エイリアス、タグは、黙って別の意味になる\
      JSON文書を返す代わりに、それが何行目にあるかを告げて変換を終えます。JSONには\
      「同じノードを二度」と言う手立てがなく、解釈を一つ選ぶことは、あなたの代わりに\
      決めてしまうことです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ます。そのどれにも、あなたのテキストは1文字も渡されません。それを読み、解析し、\
      書き出すすべての行は、このオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
ネットワークを切っても道具は何も変わりません。もともと\
      ネットワークの段階がなかったからです。これが何よりも簡単な証明です。"""

[[howto]]
title = "向きを選びます。"
body = """
<em>YAMLからJSONへ</em>か、<em>JSONからYAMLへ</em>。\
      メニューの下の注記が、その向きで何が失われるかを、何かを貼り付ける前に伝えます。\
      あとからではありません。"""

[[howto]]
title = "貼り付けるか、ファイルを置きます。"
body = """
選択してコピーできるものなら何でも\
      構いません。選択欄に置いたファイルはご自分のブラウザが読んで欄に入れます。省くべき\
      アップロードの段階自体がなく、拡張子が<code>.json</code>や<code>.yaml</code>なら\
      向きもそれで決まります。"""

[[howto]]
title = "インデントを選びます。"
body = """
半角空白2つ、4つ、またはタブ。タブはJSONの\
      ときだけ選べます。YAMLは半角空白で定義されていて、タブは正しいインデントに\
      なりません。"""

[[howto]]
title = "エラーのある場所でエラーを読みます。"
body = """
ここで失敗したパーサーは、\
      「位置4193に予期しないトークン」ではなく、何を見つけたのかを行と列とともに\
      伝えます。たいていはそれだけで、ほかに何も開かずに設定ファイルを直せます。"""

[[howto]]
title = "結果を持ち帰ります。"
body = """
コピーするか、出てきた形式の名前が付いた\
      ファイルとしてダウンロードします。"""

[[faq]]
q = "私のYAMLはどこかにアップロードされますか？"
a = """
        されません。このページの二つのパーサーも二つのプリンターも、ご自分のブラウザの\
        中で、ご自分のハードウェア上で動く関数です。この道具にはネットワーク機能その\
        ものがなく、何かを取りに行くことも送ることもありません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて書かれていて、\
        そのどれもこのサイトのものではありません。配備の設定にこれを使う理由がまさに\
        それです。ああいうファイルはホスト名とバケット名で、ときには誰かが移そうとした\
        秘密でいっぱいで、それをよその変換ツールに貼り付けることは、相手に渡すことです。"""

[[faq]]
q = "YAMLをJSONに変換すると何が失われますか？"
a = """
        コメントです。JSONにはそれを置く場所がありません。アンカー、エイリアス、タグは\
        推し量られるのではなく、はっきり拒まれます。どれもJSONには言えないことを言って\
        いて、黙って解釈を選ぶ変換ツールは、ファイルが書いていたのとは違う文書を渡して\
        しまうからです。逆向きでは何も失われません。どのJSON文書も、すでにYAML文書です。"""

[[faq]]
q = "YAMLにnoと書いたのに、JSONでは文字列で出てきました。なぜですか？"
a = """
        それが文字列だからで、ここが1.1ではなくYAML 1.2を読んでいるからです。YAML 1.1では\
        <code>yes</code>・<code>no</code>・<code>on</code>・<code>off</code>が真偽値で、\
        ノルウェーの国コードを<code>false</code>に変えてしまう、あの有名なバグでした。\
        YAML 1.2はそれをやめ、ここもやめています。テキスト以外として読まれるのは\
        <code>true</code>・<code>false</code>・<code>null</code>・<code>~</code>だけです。\
        逆向きでは、それらの語は<em>引用符付き</em>で書き戻します。ここでは引用符がなくても\
        テキストとして読むのですが、次にそのファイルを開くものはそうしないかもしれないから\
        です。PyYAMLはいまだに1.1が既定です。厳しく読み、控えめに書くことが、どちらの\
        向きでも正しい唯一の組み合わせです。"""

[[faq]]
q = "キーの順序は保たれますか？"
a = """
        保たれます。双方向でです。そしてこれは聞こえるより難しいことです。\
        <code>JSON.parse</code>の上に作られた変換ツールは、整数に見えるキーを黙って前へ\
        動かすので、<code>{"10":a,"2":b}</code>が<code>{"2":b,"10":a}</code>になって\
        戻ってきます。数値は打ち込んだ桁をそのまま保つので、20桁の口座番号が下3桁を\
        倍精度浮動小数点に奪われることもありません。<em>並べ替えたい</em>ときはチェック\
        ボックスがあり、コードポイント順ではなくキーの読み方の順に並べます。"""

[[faq]]
q = "複数のYAML文書をまとめて変換できますか？"
a = """
        できませんし、どれか一つを選ぶ代わりにそう伝えます。<code>---</code>で区切られた\
        ファイルは複数の文書を持っていて、JSONには「複数の文書」を意味する形がありません。\
        配列にすれば、ファイルが一度もしていない主張をすることになります。一つずつ変換して\
        ください。"""

[[faq]]
q = "ここにYAMLの整形機能がないのはなぜですか？"
a = """
        YAMLには書く値打ちのある圧縮形がないからです。短い書き方はフロースタイルですが\
        読めたものではなく、読めないことは、ファイルをYAMLで持っておく理由の正反対です。\
        JSON・XML・HTML・CSSを整えるのは<a href="../json-formatter/">JSONフォーマッター</a>の\
        仕事で、そちらはYAMLも整えます。"""

[[faq]]
q = "どれくらい大きいファイルまで扱えますか？"
a = """
        ここに制限は設けていません。その費用を払うサーバーがないからです。実際の上限はご自分の\
        端末です。数メガバイトのYAMLなら問題なく、とても長い文書のときは、キーボードを\
        奪い合う代わりに入力が止むのを待ってから変換します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、サインインも、試用期間もなく、貼り付ける量にも制限は\
        ありません。このサイトには広告があり、それが費用をまかなっています。広告にはあなたの\
        テキストについて何も渡されません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んだあとインターネットを切っても、そのまま使えます。\
        これは何もアップロードされていないことを示す一番簡単な方法でもあります。変換のために\
        設定を送り出す道具なら、線を抜いた瞬間に止まってしまうはずです。"""

