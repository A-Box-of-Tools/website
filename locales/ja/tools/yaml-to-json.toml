# in docs/languages.md.
#

name = "YAML・JSON変換"
heading = "YAMLをJSONに <span class=\"h1-kw\">&mdash; そしてJSONをYAMLに戻す</span>"
tagline = "双方向で、それぞれの代償も伝えます。どちらも、よそのサーバーに貼り付けられることはありません。"

title = "YAML・JSON変換——双方向、アップロードなし"
description = "対応するYAML 1.2のサブセットをブラウザでJSONに変換し、JSONをYAMLに戻します。アンカー、エイリアス、タグ、複数文書は拒否します。JSONではコメントを保持しません。アップロードはありません。"
og_title = "YAMLをサーバーに貼り付けずに変換する"
og_description = "自分の端末で動くYAML・JSON変換ツール。キーは順序を保ち、数値は桁を保ち、貼り付けたものはどこにも行きません。"
og_image_alt = "YAML・JSON変換 - 双方向、アップロードなし"

pledge = """
    変換は文字列に対する計算で、それをここ、このページで行います。二つのパーサーは\
    どちらも手書きで<code>src/</code>にあります。<code>shared/parse-yaml.js</code>と\
    <code>shared/parse-json.js</code>で、それ以上のものはありません。この道具にはネットワーク機能\
    そのものがなく、取りに行くものも送るものもありません。それはこのサイトのほぼ\
    どこよりも重い意味を持ちます。YAMLファイルはたいてい配備の設定であり、配備の設定は\
    たいていホスト名とバケット名と秘密でいっぱいだからです。"""

live_hint = """
      言葉を信じる必要はありません。DevToolsを開き、ネットワークタブを見ながら何かを\
      変換してみてください。どのリクエストにも、貼り付けた内容の1文字も乗っていません。\
      あるいはインターネットを切って、それでも変換してみてください。"""

read_first = """
、アンカーの意味を推し量る代わりに拒む読み取り器は\
      <code>src/shared/parse-yaml.js</code>、変換がなぜ「パーサーとプリンターだけで、両方の形式を\
      同時に知る何かが間に挟まらない」ものなのかは<code>src/convert.js</code>を\
      ご覧ください。"""

howto_heading = "YAMLをアップロードせずにJSONへ変換する手順"

card = """
            YAMLをJSONに、あるいはJSONをYAMLにして、その道中の代償も教えてもらえます。\
            配備の設定を誰にも渡さずに貼り付けられます。"""

