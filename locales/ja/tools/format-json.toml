[[privacy]]
title = "貼り付けたものには出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。貼り付けられた\
      トークンが集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も、<code>XMLHttpRequest</code>も、<code>sendBeacon</code>もありません。どのパーサーも、どのプリンターも、文字列を受け取って文字列を返す、このページの中の関数です。"""

[[privacy]]
title = "整形は、渡されたものをそのまま保ちます。"
body = """
JSONのオブジェクトは、書いた順のキーと、書いたとおりの数字で\
      戻ってきます。<code>src/json.js</code>が<code>JSON.parse</code>の呼び出しでは\
      なくパーサーだからです。あちらは整数のようなキーを並べ替え、20桁のIDをいちばん\
      近い倍精度に変えてしまいます。<code>tests/js/text-format.test.js</code>の\
      テストは、まさにそこを確かめています。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ています。そのどれにも、あなたのテキストは1文字も渡されません。テキストを\
      読み、解析し、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこの道具は何も変わりません。もともと通信する段階が\
      存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "仕事を選びます。"
body = """
タブは2つ、入力欄は1つ。「整形」はJSON・XML・HTML・CSS・YAMLを整えるか、平らに圧縮します。「変換」はJSONをYAMLやXMLにし、その逆もします。いま整形したテキストがそのまま変換するテキストになるので、2回貼り付ける必要はありません。"""

[[howto]]
title = "貼り付けるか、ファイルをドロップします。"
body = """
選択してコピーできるものなら何でも構いません。選択欄に落としたファイルはお使いのブラウザが読んで欄に入れます。省略できるアップロードの段階が、そもそもありません。"""

[[howto]]
title = "言語を判定させるか、自分で指定します。"
body = """
メニューには、テキストを何として\
      読んだかが出ます。直すのはクリック1回です。判定はあくまで出発点であり、だから\
      こそ黙って適用せずに表示しています。"""

[[howto]]
title = "字下げを選ぶか、平らに詰めます。"
body = """
半角2つ、4つ、あるいはタブ。平らに\
      詰めるとは、読むためだけにあった空白をすべて取り去った同じ文書のことで、結果には\
      それで何バイト減ったかが出ます。"""

[[howto]]
title = "エラーは、エラーのある場所で読みます。"
body = """
ここでパーサーが失敗したときは、\
      何を見つけたのか、何行目の何列目かを伝えます。「位置4193に予期しないトークン」\
      ではありません。たいていはそれだけで、ほかを開かずに設定ファイルを直せます。"""

[[howto]]
title = "結果を持ち帰ります。"
body = """
コピーするか、出てきた言語の名前が付いたファイルとしてダウンロードしてください。"""

[[faq]]
q = "テキストはどこかにアップロードされますか？"
a = """
        いいえ。このページのパーサーもプリンターも、お使いのブラウザの中で、お手元のハードウェアで動く関数です。この道具にはどんなネットワーク機能もありません。何かを取りに行くことも、送ることもありません。ページの<code>Content-Security-Policy</code>には接続してよいアドレスがすべて書かれていて、そのどれもこのサイトのものではありません。アクセストークンやセッションのクッキー、顧客の記録をここで扱う理由はそれです。そういうものを他人の整形ツールに貼り付けるのは、相手に渡すのと同じことだからです。"""

[[faq]]
q = "JSONの整形で、見た目以外に変わるものはありますか？"
a = """
        ありません。そしてこれは、聞こえるほど簡単ではありません。キーは書いた順の\
        ままです。<code>JSON.parse</code>の上に作られた整形ツールは、整数のようなキーを\
        黙って先頭へ動かすので、<code>{"10":a,"2":b}</code>が\
        <code>{"2":b,"10":a}</code>になって戻ってきます。数字は打ったままの桁を保つ\
        ので、20桁のIDが末尾3桁を倍精度に持っていかれることもなく、\
        <code>1e999</code>が<code>null</code>になることもありません。重複したキーは\
        両方残します。どちらが勝つかを規格が決めていない以上、片方を捨てるのは\
        あなたに代わって決めることになるからです。"""

[[faq]]
q = "どの言語を整形できますか？"
a = """
        JSON、XML、HTML、CSS、YAMLです。JSON・XML・HTML・CSSは平らに詰めることも\
        できますが、YAMLはできません。YAMLの短い書き方はフロースタイルで、読みにくく、\
        読みにくいことはファイルをYAMLで持っておく理由の正反対だからです。JavaScriptは\
        意図して一覧に入れていません。下の質問をご覧ください。"""

[[faq]]
q = "JavaScriptやPython、SQLを整形しないのはなぜですか？"
a = """
        プログラミング言語を整えるとは、それをきちんと解析するということであり、\
        ほとんど正しい整形ツールは、まったくないより悪いからです。見た目は問題ないのに\
        別のことをするコードを生みます。JSON・XML・CSS・YAMLの文法は、手で読み、自分で\
        走らせられるテストで確かめられる程度に小さいものです。JavaScriptの整形ツールと\
        いえばPrettierで、1メガバイトのパーサーです。あれはウェブページではなく、\
        エディターの中にあるべきものです。"""

[[faq]]
q = "YAMLにnoと書いたのに、JSONでは文字列になりました。なぜですか？"
a = """
        それが文字列だからで、ここが読むのはYAML 1.1ではなくYAML 1.2だからです。YAML\
        1.1では<code>yes</code>、<code>no</code>、<code>on</code>、<code>off</code>が\
        真偽値でした。ノルウェーの国コードが<code>false</code>になる、あの有名な不具合\
        です。YAML 1.2はそれをやめ、この道具も同じです。テキスト以外として読まれるのは\
        <code>true</code>、<code>false</code>、<code>null</code>、<code>~</code>だけ\
        です。逆向きでは、これらの語は<em>引用符付き</em>で書き戻します。この道具なら\
        引用符がなくてもテキストとして読みますが、そのファイルを次に開くものはそうとは\
        限らないからです。PyYAMLはいまも既定が1.1です。厳しく読み、控えめに書く。両方の\
        向きで正しくなる組み合わせはこれだけです。"""

[[faq]]
q = "YAMLをJSONにすると何が失われますか？"
a = """
        コメントです。JSONには置く場所がありません。アンカー、エイリアス、タグは推測\
        せずにはっきり拒否します。どれもJSONには言えないことを言っており、黙って解釈を\
        ひとつ選ぶ変換器は、ファイルの内容とは違う文書をあなたに渡すことになるからです。\
        逆向きでは何も失われません。JSONの文書はすでにYAMLの文書です。"""

[[faq]]
q = "JSONをXMLにすると何が失われますか？"
a = """
        空のオブジェクト、空の配列、空の文字列の違いです。どれも空の要素になります。\
        そして、それぞれの値の型も失われます。XMLに型がないからで、逆変換がすべてを\
        文字列のままにし、<code>8080</code>を数値だと決めつけないのもそのためです。\
        配列は繰り返しの要素になります。読み戻せる形はそれだけだからです。要素名に\
        できないキーは、扱いにくい文字を置き換えます。どのパーサーも読まない文書を\
        吐き出すよりはましだからです。"""

[[faq]]
q = "HTMLの字下げをやり直すと、ページの見た目は変わりますか？"
a = """
        変わることがあり、そこは正直に書いておきます。インライン要素どうしのあいだの\
        空白は、単語と単語のあいだの空白です。動かすのはただではありません。歯止めは\
        2つあります。<code>&lt;pre&gt;</code>と<code>&lt;textarea&gt;</code>は\
        そのまま写し取ること、そしてテキストしか入っていない要素は1行のままにすること\
        です。それ以外は整えます。"""

[[faq]]
q = "どれくらい大きいファイルまで扱えますか？"
a = """
        ここに上限は設けていません。その費用を払うサーバーが存在しないからです。実際の頭打ちはお使いの端末です。数メガバイトのJSONなら問題ありません。とても長い文書では、キーボードを取り合う代わりに、入力が一息つくのを待ってから整形し直します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もなく、貼り付けられる量にも制限は\
        ありません。このサイトには広告があり、それが費用を賄っています。広告に\
        テキストの情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。整形の\
        ためにテキストをどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

