    整形も変換も文字列に対する計算で、このページの中で行われます。パーサーは手書きで<code>src/</code>にあります。<code>json.js</code>、<code>xml.js</code>、<code>css.js</code>、<code>yaml.js</code>。それ以外は何もありません。この道具にはどんなネットワーク機能もありません。取りに行く先も、送る先もありません。それがこのサイトのほぼどこよりも効いてくるのがここです。人が整形ツールに貼り付けるものは、アクセストークン、セッションのクッキー、顧客の記録、未公開のコードだからです。"""

