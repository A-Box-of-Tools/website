#
# 画像黒塗りツール - Japanese.
#
# Overrides for tools/redact-image/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 「黒塗り」は行政文書でそのまま使われている語で、このページが言いたい区別、
# つまり「隠す」ではなく「消す」をそのまま持っています。検索される語でもあります。
#
# 日本語は語の間に空白を置かないので、値の途中の改行はそのまま見える隙間になります。
# 文の途中で折り返すときは行末に \ を置き、TOMLに改行と次行の字下げを飲ませます。
#

name = "画像黒塗りツール"
heading = "画像の黒塗り<span class=\"h1-kw\">｜モザイク・ぼかしも</span>"
tagline = "隠した部分はファイルから消えます。上に置かれるのではありません。"

title = "画像を黒塗り｜モザイク・ぼかしも、アップロードなし"
description = "写真やスクリーンショットの名前・住所・口座番号を隠して保存し直します。隠した画素は四角形の下に残るのではなく、ファイルから消えます。処理はすべてブラウザ内です。"
og_title = "隠した部分が本当に消える画像の黒塗り"
og_description = "見せたくない場所に枠を引くと、その下の画素はファイルが書き出される前に上書きされます。動かせるレイヤーは残らず、復元できるものもありません。何もアップロードしません。"
og_image_alt = "画像黒塗りツール - 隠した画素は上書きされ、隠されるのではない"

pledge = """
    画像の読み込み、塗りつぶし、書き出しはすべて手元のブラウザが、最初から\
    入っているコーデックで行います。このツールにはネットワーク機能が一切なく、\
    取りに行くことも送ることもできません。それがこのサイトのほかのどのページよりも\
    効いてくる場所です。黒塗りツールに持ち込まれる画像は、名前や住所や口座番号が\
    まだ読める状態のものだからです。"""

live_hint = """
      信じる必要はありません。開発者ツールを開き、ネットワークタブを見ながら\
      スクリーンショットを黒塗りしてみてください。画像もサムネイルもファイル名も、\
      枠を置いた位置さえ、どのリクエストにも乗りません。あるいはインターネットを\
      切ってから黒塗りしてみてください。"""

read_first = """\
      、画素を上書きする3つの関数は<code>src/redact.js</code>、\
      画面に見えているものがその同じ3つの関数で描かれている理由は\
      <code>src/preview.js</code>です。"""

howto_heading = "隠した部分が本当に消える画像の黒塗りのやり方"

card = """
            画像の一部を黒く塗るか、モザイクをかけるか、ぼかします。隠れた画素は\
            ファイルが書かれる前に上書きされるので、脇へどけられるレイヤーは\
            残りません。"""

[words]
plural = "画像"
choose = "画像"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "アカウント不要"

[[facts]]
text = "透かしなし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "オープンソース"

[[privacy]]
title = "画像の行き先がありません。"
body = """
このページが接続してよいアドレスはContent-Security-Policyにすべて書かれていて、\
      そのどれもこのサイトのものではありません。ファイルが集められる送信先はここに\
      なく、あったとしても送るコードがありません。"""

[[privacy]]
title = "隠した画素は、出ていく途中ではなくここで消えます。"
body = """
画像は画素のバッファに展開され、枠はそのバッファに書き込まれ、バッファが\
      エンコーダーに渡ります。枠を別レイヤーとして持つ画像はこのページのどこにも\
      存在しません。そもそも作られないからです。<code>src/redact.js</code>を\
      読んでください。"""

[[privacy]]
title = "ここでは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
<code>sendBeacon</code>もありません。やっているのは\
<code>getImageData</code>と、バイト列を回る3つのループと、\
<code>canvas.toBlob</code>だけで、どれもブラウザに最初から入っています。"""

[[privacy]]
title = "枠のことはどこにも報告されません。"
body = """
どこに引いたか、いくつ引いたか、どの大きさか、どの種類を選んだかは、このページを\
      閉じるまでメモリーの中だけにあります。それを持ち出す計測イベントはこの\
      リポジトリに1つもなく、ダウンロード後に出るあの1問が送るのは、親指の上下と\
      ツールの名前だけです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
ネットワークを切ってもツールは変わりません。もともとネットワークの工程が\
      ないからです。いちばん簡単な証明であり、パスポートを黒塗りする前に一度\
      やっておく価値があります。"""

[[howto]]
title = "画像を選びます。"
body = """
スクリーンショットでもスキャンでも写真でも、ブラウザが開けるものなら何でも\
      かまいません。ディスクから直接読み込まれ、その間もどこへも送られません。"""

[[howto]]
title = "見せたくない場所に枠をドラッグします。"
body = """
続けてもう1つ引けます。枠はドラッグで動かし、ハンドルで大きさを変えられます。\
      Tabキーで枠に移り、矢印キーで動かすこともできます。枠の下に見えているものが\
      本当の結果で、ファイルを書くのと同じコードが描いています。"""

[[howto]]
title = "黒塗り・モザイク・ぼかしから選びます。迷ったら黒塗りです。"
body = """
黒で塗りつぶすと何も残りません。モザイクとぼかしは画素をその平均値に置き換える\
      だけなので、背景の顔には十分でも、文字として読めるものには足りません。"""

[[howto]]
title = "「黒塗りして保存」を押し、ファイルを確かめます。"
body = """
そのあとに出る画像は、できあがったファイルをもう一度読み込んだものです。\
      編集ソフトで開いてレイヤーを探すか、隠した文字を選択してみてください。\
      あるのは平たい画像1枚だけで、隠した場所は書き出しより前に上書きされています。"""

[[faq]]
q = "画像はどこかにアップロードされますか。"
a = """
        いいえ。ファイルの展開も黒塗りも書き出しも、手元のブラウザが手元の端末で\
        行います。このツールにはネットワーク機能が一切なく、取りに行くことも送る\
        こともありません。ページの<code>Content-Security-Policy</code>には接続して\
        よいアドレスがすべて書かれていて、そのどれもこのサイトのものではありません。\
        一度読み込んでからインターネットを切っても、そのまま動きます。"""

[[faq]]
q = "隠した部分は本当にファイルから消えていますか。"
a = """
        はい。そのためにこのツールがあります。画像は画素のバッファに展開され、枠の\
        内側の画素が上書きされ、そのバッファが新しいファイルとして書き出されます。\
        エンコーダーが何かを受け取るより前に元の値はメモリーから消えているので、\
        隠すレイヤーも、外す注釈も、取り消せる履歴もありません。確かめ方は他人の\
        主張を確かめるときと同じです。結果を画像編集ソフトで開いて2枚目のレイヤーを\
        探すか、隠した文字を選択してみてください。"""

[[faq]]
q = "モザイクやぼかしをかけた場所は復元できますか。"
a = """
        できることがあります。選ぶ前に読んでおく価値があるのはここだけです。黒で\
        塗りつぶすと、下にあったものはすべて1色に置き換わり、輪郭も平均値も文字数も\
        残りません。モザイクは各ブロックをそのブロックの平均色に置き換えるので、\
        平均値の格子は下にあったものの測定値として残ります。ありふれた書体で\
        大きさも予想できる文字なら、候補の文字列を同じように描いて平均を突き合わせる\
        ことで元に戻せた、という研究が公表されています。ぼかしは畳み込みであり、\
        畳み込みは原理として逆算できます。背景の顔にモザイクをかけるのはかまいません。\
        文字として読めるものは黒く塗ってください。"""

[[faq]]
q = "文書ソフトで黒い四角を描くのとは何が違うのですか。"
a = """
        多くのソフトは、その四角を画像の中ではなく画像の隣に保存するからです。\
        PDFビューアーやスライド、ワープロ、レイヤーのある画像編集ソフトで描いた図形は、\
        位置を持ってページの上に乗っているオブジェクトです。動かしても消しても、\
        別のソフトで開いても、下にあったものがそのまま出てきます。裁判所も官公庁も\
        新聞社も、この形で文書を公開してしまったことがあります。ここでは四角そのものが\
        保存されません。あるのは、元の値の上に書かれた画素値だけです。"""

[[faq]]
q = "EXIFやGPSのデータも消えますか。"
a = """
        はい、副作用として消えます。保存とは画素で埋めたキャンバスを書き出すことで、\
        キャンバスはタグを持ちません。撮影場所もカメラの機種も日時も、埋め込み\
        サムネイルも、新しいファイルには書かれません。サムネイルはここでは重要です。\
        画像の小さな2枚目の複製で、写真を編集しても作り直されるとは限らず、黒塗り\
        した写真が黒塗り前のサムネイルを連れていくと、作業がまるごと台無しになります。\
        画像を再エンコードせずにメタデータだけ落としたい場合は、\
        <a href="../exif-editor/">EXIFビューアー・削除ツール</a>が代わりに\
        コンテナを書き直します。"""

[[faq]]
q = "対応している形式は何ですか。"
a = """
        読み込みはブラウザが展開できるものすべてで、実際にはJPEG、PNG、WebP、GIF、\
        BMP、それに最近のブラウザならAVIFです。書き出しはJPEG、PNG、WebPで、これが\
        ブラウザに入っているエンコーダーだからです。「自動」ではJPEGはJPEGのまま、\
        それ以外はPNGになります。写真は写真の大きさのままで、スクリーンショットに\
        残した文字はにじみません。この選択は黒塗りには関係しません。エンコーダーが\
        見るときには、画素はすでに消えています。"""

[[faq]]
q = "マウスなしでも使えますか。"
a = """
        使えます。「中央に枠を追加」で1つ置き、Tabキーで枠を移り、矢印キーで動かし、\
        Altと矢印キーで大きさを変えます。Shiftを押すと1回が10ピクセルになり、\
        Deleteキーで削除できます。枠ごとに画像の下へ、大きさ・位置・何をするか・\
        削除ボタンが並んだ行も出るので、ツール全体がキーボードだけで扱え、\
        スクリーンリーダーで読めます。"""

[[faq]]
q = "スマートフォンでも動きますか。"
a = """
        動きます。枠を引く、動かす、大きさを変える操作はマウスイベントではなく\
        ポインターイベントなので、指でも同じように使えますし、タッチ画面では\
        ハンドルが大きく描かれます。画面の画像は作業中は画面サイズで描き直され、\
        ファイル自体はボタンを押した時点で元の解像度のまま黒塗りされます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか。"
a = """
        無料で、アカウントもログインも試用期間も透かしもありません。画像の大きさにも\
        制限はありません。費用を払っているサーバーがなく、処理は手元の端末で\
        起きているからです。運営費は広告でまかなっていますが、広告に画像のことは\
        何も渡していません。"""

[schema]
description = "ブラウザ内で画像を黒塗りします。見せたくない場所に枠を引き、黒で塗りつぶすか、モザイクをかけるか、ぼかします。隠れた画素はファイルが書き出される前に上書きされるので、結果にはレイヤーも注釈もメタデータも残りません。アップロードはありません。"
features = [
  "黒塗り・モザイク・ぼかしを枠ごとに選べます",
  "隠れた画素は書き出し前に上書きされるので、脇へどけられるレイヤーが残りません",
  "プレビューはファイルを書くのと同じコードが描いています",
  "モザイクの強さを言葉ではなくブロック数で示します",
  "マウスだけでなくキーボードとタッチでも、枠の追加・移動・変形・削除ができます",
  "再エンコードの副作用としてEXIF・GPS・埋め込みサムネイルが消えます",
  "書き出しはJPEG・PNG・WebPで、自動選択つき",
  "オフラインで動作し、アップロードもアカウントもありません",
]

[picker]
title = "画像をここにドロップ"
hint = "またはクリックして選択｜JPEG、PNG、WebPなど、ブラウザが開けるもの"
