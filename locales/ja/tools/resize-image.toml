[[privacy]]
title = "画像には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありません。リサイズの実体はキャンバスへの\
      <code>drawImage</code>ひとつと<code>canvas.toBlob</code>ひとつ、つまり\
      ブラウザにすでに入っている拡大縮小器とエンコーダーです。"""

[[privacy]]
title = "変えてくれと頼まれていないファイルは、変えません。"
body = """
切り抜きもリサイズも形式変換も指定していない場合、選んだファイルは保存し\
      直されるのではなく、1バイトも変えずにそのまま返ります。これは礼儀の話では\
      ありません。このツールが画像を黙って書き直したり、ただ見たかっただけの画像\
      からメタデータを黙って落としたりできない理由です。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、画像に関する情報は渡されません。ファイルを読み、\
      切り抜き、拡大縮小し、書き出すコードはすべてこのオリジンから配信され、\
      リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
選択欄にドロップするか、手で選んでください。ブラウザがディスクから直接\
      読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "必要なら切り抜きます。"
body = """
枠は画像全体に置かれた状態で始まるので、触らなければ何も切り取られません。\
      ドラッグするか、形を固定してください。プロフィール画像なら1:1、ストーリーズ\
      なら9:16、サムネイルなら16:9です。「最大」を押せば、その形で収まるいちばん\
      大きな枠になります。画像はそれぞれ自分の枠を持っているので、リストの行を\
      クリックすれば、その画像の上に描けます。全部を同じ構図にしたいなら、それも\
      ボタンひとつです。"""

[[howto]]
title = "どの大きさで出すかを指定します。"
body = """
幅、高さ、あるいはその両方。縦位置と横位置の写真を互いに同じ大きさへ揃える\
      長辺指定。あるいは単純なパーセント指定です。2つの欄の一方を空にしておけば、\
      画像は自分の縦横比を保ちます。"""

[[howto]]
title = "形式を選んで、ボタンを押します。"
body = """
それぞれのファイルが届いたときの形式を保つか、すべてをJPEG、PNG、WebPの\
      いずれかで書き出すかです。各結果には、何になったか、どれだけ小さくなったかが\
      表示されます。クリックすると原寸で開き、裏にあるすべての数値と、比較用の元画像\
      が並びます。まとめて処理した場合は、1つのzipにまとまって届きます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。読み込みも切り抜きも拡大縮小も書き出しも、お使いのブラウザが\
        手元のハードウェア上で、最初から入っているJPEG・PNG・WebPのエンコーダーを\
        使って行います。このツールにはネットワーク機能が一切なく、何も取りに行かず、\
        何も送りません。ページの<code>Content-Security-Policy</code>には接続してよい\
        アドレスがすべて挙がっていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "幅だけ指定して高さを指定しないとどうなりますか？"
a = """
        高さは画像自身の縦横比から決まります。ほとんどの場合、それが求められている\
        ものです。「幅1920」は「幅1920、高さはそれに応じた値」という意味だからです。\
        両方を埋めると、その2つが画像の縦横比と食い違うことがあります。「縦横比が\
        食い違う場合」の選択肢が現れるのは、そのときだけです。枠の内側に収める、\
        いっぱいに広げてはみ出しを切る、背景で余白を埋める、引き伸ばして歪みを\
        受け入れる、のいずれかです。"""

[[faq]]
q = "リサイズすると画質は落ちますか？"
a = """
        小さくする分には、目に見える形では落ちません。入ってくるピクセルのほうが出て\
        いくピクセルより多いので、残る細部は本物の細部です。大きくするほうは、そもそも\
        写っていなかったものを足せません。出てくるのは同じ画像のよりぼやけた複製で\
        あって、より鮮明なものではありません。だから「元より大きくしない」が既定で\
        有効になっています。多少の代償があるのは、形式がJPEGかWebPの場合の書き出しの\
        ほうで、そこで費やす分を画質のスライダーが決めます。"""

[[faq]]
q = "画像ごとに違う切り抜きができますか？"
a = """
        できますし、それが既定です。リスト上のどの画像も、自分のピクセルで自分の枠を\
        持っており、行をクリックすればその画像がプレビューに入り、その枠と固定した形が\
        そのまま戻ってきます。ある1枚に対する操作が、ほかに影響することはありません。\
        どの枠も画像全体に置かれた状態で始まるので、一度も描かなかった画像はまったく\
        切り抜かれません。"""

[[faq]]
q = "まとめて同じ切り抜きをかけられますか？"
a = """
        できます。プレビューの下のボタンです。ほかのすべての画像に、同じ相対的な範囲、\
        つまりそれぞれの幅と高さに対する同じ割合を与えます。すべて同じ大きさの\
        スクリーンショットや書き出しの集まりなら、それはまったく同じ枠になり、ページも\
        そう表示します。形を固定している場合は、その範囲の中でその形の最大の枠を各画像に\
        与えます。ですから1:1を押してからこのボタンを押せば、縦位置と横位置の混ざった\
        フォルダから正方形が取れます。どの枠も、あとから編集できます。"""

[[faq]]
q = "読み書きできる形式は何ですか？"
a = """
        読み込めるのはブラウザがデコードできるものすべてで、実際にはJPEG、PNG、WebP、\
        GIF、BMP、そして最近のたいていのブラウザではAVIFです。書き出しはJPEG、PNG、\
        WebPで、ブラウザが備えているエンコーダーがそれだからです。「形式を保つ」では\
        JPEGはJPEGのまま、PNGはPNGのままです。GIFやBMPのようにブラウザが書き出せない\
        ものはPNGになります。透過と平坦な色をそのまま保てるのがPNGだからです。"""

[[faq]]
q = "JPEGで保存すると透過はどうなりますか？"
a = """
        背景色で埋まります。JPEGには透過を保存するアルファチャンネルがないからです。\
        色は自分で選べ、初期値は白です。多くの方が求めるのがそれであり、ほかのほとんどの\
        道具が何も言わずにそうしているものでもあります。同じ色は、余白を埋めるときにも\
        使います。PNGかWebPで保存すれば、透過はそのまま通ります。"""

[[faq]]
q = "EXIFやGPSの情報は消えますか？"
a = """
        実際に処理したものについては、副作用として消えます。切り抜きやリサイズとは画像を\
        ピクセルに戻し、そのピクセルを書き直すことで、ピクセルで埋まったキャンバスはタグを\
        持ちません。ですから位置情報もカメラの機種も撮影日時も、新しいファイルには\
        書き込まれません。まったく変更していないファイルは別で、タグごと1バイトも変えずに\
        返ります。メタデータだけ消して画像には触れたくないときは、\
        <a href="../exif-editor/">EXIFビューアー・削除ツール</a>をお使いください。何も\
        再圧縮せずに、入れ物だけを書き直します。"""

[[faq]]
q = "画像圧縮ツールとはどう違いますか？"
a = """
        こちらは寸法の話です。何ピクセルほしいかを指定すれば、そのとおりに返します。\
        <a href="../compress-image/">画像圧縮ツール</a>はファイルサイズの話です。何\
        キロバイトまで許されているかを指定すれば、そこに収まる中でいちばん高い画質を探し、\
        画質だけでは届かないときにだけ縮小します。「幅1200ピクセルで」と言われたなら\
        こちらが正解です。「500KB以内で」と言われたなら、あちらのほうが近づけます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。ファイル\
        の数にもサイズにも制限はありません。その費用を払うサーバーが存在せず、処理が\
        手元の端末で起きているからです。このサイトには広告があり、それが費用を賄って\
        います。広告に画像の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。リサイズの\
        ために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

