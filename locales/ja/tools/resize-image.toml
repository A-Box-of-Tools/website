  "ピクセル指定、長辺指定、パーセント指定でリサイズできます",
  "一方の辺だけ埋めれば、もう一方は画像自身の縦横比に従います",
  "内側に収める、いっぱいに広げて切る、指定の枠に余白で収める、引き伸ばす、から選べます",
  "画像ごとにドラッグできる切り抜き枠があり、1:1、4:5、9:16、16:9、4:3、3:2 に固定できます",
  "画像ごとに違う切り抜きも、ワンクリックで全体に同じ構図を当てることもできます",
  "できあがった画像を原寸で開き、裏にあるすべての数値と、比較用の元画像を並べます",
  "JPEG・PNG・WebP を相互に変換でき、画質と背景色を指定できます",
  "頼まない限り、画像を大きくすることはありません",
  "変更を頼まれなかったファイルは、手をつけずにそのまま返します",
  "まとめて処理でき、結果は1つの zip にまとまります",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここに画像をドロップ"
hint = "クリックして選ぶこともできます &mdash; JPEG、PNG、WebP、その他ブラウザが開けるものすべて"
