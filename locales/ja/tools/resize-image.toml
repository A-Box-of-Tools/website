[[privacy]]
title = "画像には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 <code>src/</code> の\
      どこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。リサイズはキャンバスへの
      <code>drawImage</code> ひとつと <code>canvas.toBlob</code> ひとつです
      &mdash; あなたのブラウザにすでに入っている拡大縮小器とエンコーダーです。"""

[[privacy]]
title = "誰も変えてくれと頼んでいないファイルは、変えません。"
body = """
 切り抜きも、リサイズも、\
      形式変換も指定していない場合、選んだファイルは保存し直されるのではなく、
      1バイトも変えずにそのまま返されます。これは礼儀の話だけではありません。\
      このツールが画像を黙って書き直したり、ただ見たかっただけの画像から\
      メタデータを黙って落としたりできない理由でもあります。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたの画像に関する情報は渡されません。ファイルを読み、\
      切り抜き、拡大縮小し、書き出すコードはすべてこのオリジンから配信され、\
      リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切ってもこのツールは何も変わりません。\
      もともと通信する段階が存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
 選択欄にドロップするか、手で選んでください。\
      ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られる\
      ことはありません。"""

[[howto]]
title = "必要なら切り抜きます。"
body = """
 枠は画像全体に置かれた状態で始まるので、\
      触らなければ何も切り取られません。ドラッグするか、形を固定してください
      &mdash; プロフィール画像なら1:1、ストーリーズなら9:16、サムネイルなら16:9
      &mdash; 「最大」を押せば、その形で収まるいちばん大きな枠になります。画像は\
      それぞれ自分の枠を持っています。リストの行をクリックすれば、その画像の上に\
      描けます。全部を同じ構図にしたいなら、それもボタンひとつです。"""

[[howto]]
title = "どの大きさで出すかを指定します。"
body = """
 幅、高さ、あるいはその両方。\
      縦位置と横位置の写真を互いに同じ大きさに揃える長辺指定。あるいは単純な\
      パーセント指定です。2つの欄の一方を空にしておけば、画像は自分の縦横比を\
      保ちます。"""

[[howto]]
title = "形式を選んで、ボタンを押します。"
body = """
 それぞれのファイルが届いたときの\
      形式を保つか、すべてを JPEG、PNG、WebP のいずれかで書き出すかです。各結果には、\
      何になったか、どれだけ小さくなったかが表示されます。クリックすると原寸で開き、\
      裏にあるすべての数値と、比較用の元画像が並びます。まとめて処理した場合は1つの
      zip にまとまって届きます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。ファイルの読み込みも切り抜きも拡大縮小も書き出しも、あなた\
        自身のブラウザがあなた自身のハードウェア上で、ブラウザに最初から入っている
        JPEG・PNG・WebP のエンコーダーを使って行います。このツールにはネットワーク\
        機能が一切なく &mdash; 何も取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "幅だけ指定して高さを指定しないとどうなりますか？"
a = """
        高さは画像自身の縦横比から決まります。ほとんどの場合、それが求められている\
        ものです。「幅1920」は「幅1920、高さはそれに応じた値」という意味だからです。\
        両方を埋めると、その2つが画像の縦横比と食い違うことがあります。「縦横比が\
        食い違う場合」の選択肢が現れるのはそのときだけです &mdash; 枠の内側に\
        収める、いっぱいに広げてはみ出しを切る、背景で余白を埋める、引き伸ばして\
        歪みを受け入れる、のいずれかです。"""

[[faq]]
q = "リサイズすると画質は落ちますか？"
a = """
        小さくする分には、目に見える形では落ちません。入ってくるピクセルのほうが\
        出ていくピクセルより多いので、残る細部は本物の細部です。大きくするほうは、\
        そもそも写っていなかったものを足せません &mdash; 出てくるのは同じ画像の\
        よりぼやけた複製であって、より鮮明なものではありません &mdash; だから\
        「元より大きくしない」が既定で有効になっています。多少の代償があるのは、\
        形式が JPEG か WebP の場合の書き出しのほうで、そこで費やす分を画質の\
        スライダーが決めます。"""

[[faq]]
q = "画像ごとに違う切り抜きができますか？"
a = """
        できますし、それが既定です。リスト上のどの画像も、自分のピクセルで自分の枠を\
        持っており、行をクリックすればその画像がプレビューに入り、その枠と固定した形が\
        そのまま戻ってきます。ある1枚に対する操作が、ほかに影響することはありません。\
        どの枠も画像全体に置かれた状態で始まるので、一度も描かなかった画像は\
        まったく切り抜かれません。"""

[[faq]]
q = "まとめて同じ切り抜きをかけられますか？"
a = """
        できます。プレビューの下のボタンです。ほかのすべての画像に、同じ相対的な\
        範囲 &mdash; それぞれの幅と高さに対する同じ割合 &mdash; を与えます。\
        すべて同じ大きさのスクリーンショットや書き出しの集まりなら、それはまったく\
        同じ枠になり、ページもそう表示します。形を固定している場合は、その範囲の中で\
        その形の最大の枠を各画像に与えます。ですから1:1を押してからこのボタンを押せば、\
        縦位置と横位置の混ざったフォルダーから正方形が取れます。どの枠も、あとから\
        編集できます。"""

[[faq]]
q = "読み書きできる形式は何ですか？"
a = """
        読み込みはブラウザが解読できるものすべて、実際には JPEG、PNG、WebP、GIF、
        BMP、そして &mdash; 最近のたいていのブラウザでは &mdash; AVIF です。\
        書き出しは JPEG、PNG、WebP です。ブラウザが備えているエンコーダーが\
        それだからです。「形式を保つ」では JPEG は JPEG のまま、PNG は PNG のまま\
        です。GIF や BMP のようにブラウザが書き出せないものは PNG になります。\
        透過と平坦な色をそのまま保てるのが PNG だからです。"""

[[faq]]
q = "JPEG で保存すると透過はどうなりますか？"
a = """
        背景色で埋められます。JPEG には透過を保存するアルファチャンネルがないから\
        です。色は自分で選べ、初期値は白です。多くの方が求めるのがそれであり、ほかの\
        ほとんどの道具が、何も言わずにそうしているものでもあります。同じ色は、余白を\
        埋めるときにも使われます。PNG か WebP で保存すれば、透過はそのまま通ります。"""

[[faq]]
q = "EXIF や GPS の情報は消えますか？"
a = """
        実際に処理したものについては、副作用として消えます。切り抜きやリサイズとは\
        画像をピクセルに戻し、そのピクセルを書き直すことで、ピクセルで埋まった\
        キャンバスはタグを持ちません。ですから位置情報もカメラの機種も撮影日時も、\
        新しいファイルには書き込まれません。まったく変更していないファイルは別で、\
        タグごと1バイトも変えずに返されます。メタデータだけ消して画像には触れたくない\
        場合は、<a href="../exif-editor/">EXIF ビューアー &amp; 削除ツール</a> を\
        お使いください。何も再圧縮せずに入れ物だけを書き直します。"""

[[faq]]
q = "画像圧縮ツールとはどう違いますか？"
a = """
        こちらは寸法の話です。何ピクセルほしいかを言えば、そのとおりに返します。
        <a href="../compress-image/">画像圧縮ツール</a> はファイルサイズの話です。\
        何キロバイトまで許されているかを言えば、そこに収まる中でいちばん高い画質を\
        探し、画質だけでは届かないときにだけ縮小します。「幅1200ピクセルで」と\
        言われたならこちらが正解です。「500KB以内で」と言われたなら、あちらのほうが\
        近づけます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在しないからです &mdash; 処理はあなた自身の端末で起きています。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        画像に関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。リサイズのために画像をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

