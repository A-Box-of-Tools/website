      場合にだけタイトル、著者、日付を書きます。あなたの画像のファイル名が書類に\
      現れることはなく、端末に関する情報も入りません。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
