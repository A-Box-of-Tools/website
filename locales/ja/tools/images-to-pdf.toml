[[privacy]]
title = "画像には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。このツールはその一覧に何も足しません。\
      自前のネットワーク機能は、任意のものすら持っていないからです。あなたの\
      ファイルを集めるための受け口はここにはなく、あったとしても送るコードが\
      ありません。"""

[[privacy]]
title = "PDF はここで書かれます。"
body = """
 PDF とは、オブジェクトの並びと、それぞれが\
      どこから始まるかの表で、<code>src/pdf.js</code> がその両方を書きます。\
      ライブラリを取りに行くこともなく、サーバーで描画することもなく、できあがった\
      ファイルはメモリからそのままダウンロードへ渡されます。"""

[[privacy]]
title = "書類には、あなたについて何も伝えられません。"
body = """
 たいていの道具は PDF に\
