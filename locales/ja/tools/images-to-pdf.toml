[[privacy]]
title = "画像には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。このツールは\
      その一覧に何も足しません。自前のネットワーク機能を、任意のものすら持って\
      いないからです。ファイルを集めるための受け口はここになく、あったとしても\
      送るコードがありません。"""

[[privacy]]
title = "PDFはここで書きます。"
body = """
PDFとは、オブジェクトの並びと、それぞれがどこから始まるかの表で、\
      <code>src/pdf.js</code>がその両方を書きます。ライブラリを取りに行くことも、\
      サーバーで描画することもなく、できあがったファイルはメモリからそのまま\
      ダウンロードへ渡ります。"""

[[privacy]]
title = "書類には、使った人について何も伝えません。"
body = """
たいていの道具はPDFに作成日時と、作ったプログラムの名前を刻みます。これは、\
      打ち込んだ場合にだけタイトル、著者、日付を書きます。画像のファイル名が書類に\
      現れることはありませんし、端末に関する情報も入りません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、画像に関する\
      情報は渡されません。ファイルも、サムネイルも、名前も、サイズも、枚数もです。\
      画像を読み、デコードし、書き出すコードはすべてこのオリジンから配信され、\
      リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や画像に関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。書類にするために画像をどこかへ送っている道具なら、そこで\
      止まるからです。"""

[[howto]]
title = "画像を選びます。"
body = """
フォルダごと選択欄にドロップするか、ファイルを手で選んでください。ブラウザが\
      ディスクから直接読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "ページを並べ替え、必要なものは回します。"
body = """
画像1枚が1ページになり、表示された順に並びます。タイルの取っ手をドラッグ\
      するか、矢印を使って動かせます。回転ボタンはページを90度ずつ回します。横向きに\
      取り込まれたスキャンに必要なのは、たいていこれです。"""

[[howto]]
title = "ページサイズを選びます。"
body = """
「画像に合わせる」を選ぶと、どのページもその画像そのままの大きさになり、\
      切り取られる部分も白い帯もできません。A4、レター、リーガルなどの決まった\
      サイズを選ぶと、代わりに固定のページの上に配置され、必要なら余白も付けられます。"""

[[howto]]
title = "PDFを作ってダウンロードします。"
body = """
書類を書くのは手元の端末なので、かかる時間は順番待ちではなくハードウェアの\
      性能次第です。できあがったファイルは、そのままブラウザのダウンロードへ渡します。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みもPDFの書き出しも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。ここにあるほかの\
        いくつかのツールと違い、これには任意のネットワーク機能すら一切ありません。"""

[[faq]]
q = "PDFにすると画質は落ちますか？"
a = """
        既定の設定なら、JPEGについては落ちません。PDFはJPEGのデータをそのまま運べる\
        ので、写真は1バイトずつ書類に複製されます。デコードもされず、圧縮し直され\
        もせず、PDFの中の画像はファイルの中の画像そのものです。ほかの形式は書き直しが\
        必要です。PDFにそれ用のフィルターがないからです。ただし可逆の設定を選べば、\
        ファイルが大きくなる代わりにそのまま保存できます。"""

[[faq]]
q = "どの画像形式が使えますか？"
a = """
        ブラウザがデコードできる静止画ならどれでもです。実際にはJPG、PNG、WebP、GIF、\
        AVIF、そしてAppleの端末ではHEICです。ここに別途の対応表を作って保守する必要は\
        ありません。デコードは当サイトではなく、ブラウザの仕事だからです。"""

[[faq]]
q = "ページサイズやページの順番は選べますか？"
a = """
        選べます。ページはA4、レター、リーガル、A3、A5、タブロイド、自分で打ち込んだ\
        サイズ、あるいは各画像そのままの大きさにできます。タイルをドラッグして並べ替え、\
        名前順や日付順に並べ、どのページも90度回せ、余白をミリ単位で指定できます。"""

[[faq]]
q = "1つのPDFに何枚まで入れられますか？"
a = """
        ツールに組み込まれた制限はありません。現実的な上限は端末のメモリです。\
        できあがった書類をダウンロード前にそこで組み立てるからです。最初にそれを\
        感じるのは、フル解像度のスマホ写真を数百枚入れたときです。設定で長辺を縮めれば、\
        その上限はかなり遠くへ動きます。"""

[[faq]]
q = "PDFにファイル名や日時は入りますか？"
a = """
        指示しない限り入りません。書類情報のブロックは、このツールの名前を除いて空の\
        ままです。ファイル名も、端末名も、ユーザー名も入りませんし、作成日時も\
        チェックを入れない限り入りません。これは意図したものです。PDFとは、人が人に\
        送るものだからです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには広告が\
        あり、それが費用を賄っています。広告に画像の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。書類に\
        するために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

