      ものではありません。訪問を報告しませんし、あなたや画像に関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切っても、このページの機能はすべてそのまま\
      動きます。これがいちばん単純な証明です。書類にするために画像をどこかへ\
      送っている道具なら、そこで止まるからです。"""

[[howto]]
title = "画像を選びます。"
body = """
 フォルダーごと選択欄にドロップするか、\
      ファイルを手で選んでください。ブラウザがディスクから直接読み出します。\
      その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "ページを並べ替え、必要なものは回します。"
body = """
 画像1枚が
      1ページになり、表示された順に並びます。タイルの取っ手をドラッグするか\
      矢印を使って動かせます。回転ボタンはページを90度ずつ回します。横向きに\
      取り込まれたスキャンに必要なのは、たいていこれです。"""

[[howto]]
title = "ページサイズを選びます。"
body = """
 「画像に合わせる」を選ぶと、どのページも\
      その画像そのままの大きさになり、切り取られる部分も白い帯もできません。
      A4、レター、リーガルなどの決まったサイズを選ぶと、代わりに固定のページの\
      上に配置され、必要なら余白も付けられます。"""

[[howto]]
title = "PDF を作ってダウンロードします。"
body = """
 書類はあなた自身の端末で\
      書かれるので、かかる時間は順番待ちではなくハードウェアの性能次第です。\
      できあがったファイルは、そのままブラウザのダウンロードへ渡されます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みも PDF の書き出しも、あなた自身のブラウザが\
        あなた自身のハードウェア上で行います。このツールにサーバー側は存在せず、\
        ページの <code>Content-Security-Policy</code> は接続してよいアドレスを\
        すべて挙げていますが &mdash; そのどれも当サイトのものではありません。\
        ここにあるほかのいくつかのツールと違い、これには任意のネットワーク機能\
        すら一切ありません。"""

[[faq]]
q = "PDF にすると画質は落ちますか？"
a = """
        既定の設定なら、JPEG については落ちません。PDF は JPEG のデータをそのまま\
        運べるので、写真は1バイトずつ書類に複製されます。復号もされず、圧縮し直され\
        もせず、PDF の中の画像はファイルの中の画像そのものです。ほかの形式は\
        書き直しが必要です。PDF にそれ用のフィルターがないからです &mdash; ただし\
        可逆の設定を選べば、ファイルが大きくなる代わりにそのまま保存されます。"""

[[faq]]
q = "どの画像形式が使えますか？"
a = """
        ブラウザが復号できる静止画ならどれでもです。実際には JPG、PNG、WebP、GIF、
        AVIF、そして Apple の端末では HEIC です。ここに別途の対応表を作って\
        保守する必要はありません。復号は私たちではなくブラウザの仕事だからです。"""

[[faq]]
q = "ページサイズやページの順番は選べますか？"
a = """
        選べます。ページは A4、レター、リーガル、A3、A5、タブロイド、自分で打ち込んだ\
        サイズ、あるいは各画像そのままの大きさにできます。タイルをドラッグして並べ替え、\
        名前順や日付順に並べ、どのページも90度回せ、余白をミリ単位で指定できます。"""

[[faq]]
q = "1つの PDF に何枚まで入れられますか？"
a = """
        ツールに組み込まれた制限はありません。現実的な上限はあなたの端末のメモリ\
        です。できあがった書類はダウンロード前にそこで組み立てられるからです。\
        最初にそれを感じるのは、フル解像度のスマホ写真を数百枚入れたときです。\
        設定で長辺を縮めれば、その上限はかなり遠くへ動きます。"""

[[faq]]
q = "PDF にファイル名や日時は入りますか？"
a = """
        頼まない限り入りません。書類情報のブロックは、このツールの名前を除いて\
        空のままです。ファイル名も、端末名も、ユーザー名も入りませんし、作成日時も\
        チェックを入れない限り入りません。これは意図したものです &mdash; PDF とは、\
        人が人に送るものだからです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには\
        広告があり、それが費用を賄っています。広告にあなたの画像に関する情報が\
        渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。書類にするために画像をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

