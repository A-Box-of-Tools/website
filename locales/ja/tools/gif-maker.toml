[[privacy]]
title = "画像には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。ファイルが\
      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。以前は<code>connect-src 'none'</code>と書いてあり、\
      それは例外のない記述でした。広告を入れた分だけそれを失ったので、その\
      ことも書いておきます。"""

[[privacy]]
title = "符号化はこのリポジトリの4ファイルです。"
body = """
GIFには色の量子化とLZW圧縮が要りますが、ブラウザはそのどちらも\
      持っていません。そこで両方をここに書き出しています。\
      <code>src/quantize.js</code>と<code>src/lzw.js</code>、入れ物は\
      <code>src/gif.js</code>です。1つ作るために何かを取りに行くことはなく、\
      初回に落ちてくるエンジンもありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      画像に関する情報は渡されません。ファイルも、サムネイルも、名前も、\
      サイズも、枚数もです。画像を読み、展開し、描き、圧縮するコードは\
      すべてこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体はGoogle Fontsから読み込みます。それはリンク\
      以上のものではありません。訪問を報告することもなく、あなたや画像について\
      渡されるものもありません。押さないかぎり何も起こらず、押した先は他人の\
      サイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのどの部分もそのまま動きます。これが\
      いちばん単純な証明です。GIFにするために画像を送っている道具なら、線を抜いた\
      瞬間に止まるからです。"""

[[howto]]
title = "画像を選びます。"
body = """
フォルダを選択欄にドラッグするか、ファイルを手で\
      選んでください。ブラウザがディスクから直接読み、その間に何かがどこかへ\
      送られることはありません。"""

[[howto]]
title = "再生する順に並べます。"
body = """
つまみを持ってドラッグするか、矢印を使って\
      ください。「名前順に並べ替え」は数字を数字として数えるので、\
      <code>frame_2</code>は<code>frame_10</code>より前に来ます。"""

[[howto]]
title = "1コマあたりの表示時間を決めます。"
body = """
1枚0.5秒ならスライドショー、\
      20分の1秒ならアニメーションです。全コマにまとめて同じ時間を与えることも、\
      1枚だけ長めに残すこともできます。"""

[[howto]]
title = "大きさと、色の選び方を決めます。"
body = """
GIFは面積とコマ数のぶんだけ\
      大きくなり、それを引き戻す画質スライダーはありません。だから、いちばん効く\
      設定は大きさです。1コマ256色がいちばんきれいで、これが既定値です。\
      共通のパレットを使うほうが小さく、ちらつきも出ません。"""

[[howto]]
title = "GIFを作ってダウンロードします。"
body = """
組み立てはお手元のハードウェアで\
      行われるので、かかる時間は順番待ちではなく端末次第です。仕上がった\
      アニメーションは、保存する前にページの上で再生されます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        いいえ。画像を読み、描き、色を減らし、圧縮するのはお使いのブラウザで、\
        場所もお手元のハードウェアです。この道具にサーバー側はなく、ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        書かれていて、そのどれもこのサイトのものではありません。回線を抜いても、\
        GIF作りはそのまま続きます。"""

[[faq]]
q = "どの画像形式を使えますか？"
a = """
        お使いのブラウザが展開できる静止画形式ならどれでもです。実際にはJPG、PNG、\
        WebP、GIF、AVIF、そしてApple製の端末ではHEICになります。ここで別に一覧を\
        持って更新し続ける必要はありません。展開はブラウザの仕事で、こちらの仕事では\
        ないからです。"""

[[faq]]
q = "GIFがこんなに大きいのはなぜですか？"
a = """
        GIFがすべてのコマを丸ごとの画素として保存するからです。動き補償はなく、\
        「前と同じで位置だけずれた」という保存の仕方もなく、画質のつまみもありません。\
        大きさはおおよそ面積かけるコマ数で、これを下げる手は3つしかありません。
        <br><br>
        小さくすること。寸法を半分にすればファイルは4分の1になります。コマを減らすか、\
        1枚あたりを長く表示すること。そして64色や32色まで落とし、ディザリングを\
        切ること。平らな絵ならこれは思ったほど損をせず、写真ならかなり損をします。\
        それでも収まらないなら、正直なところ、あなたが作ろうとしているのは動画です。\
        同じものをMP4にすれば、おそらく10分の1で済みます。"""

[[faq]]
q = "GIFはどこまで速く動かせますか？"
a = """
        数字が示すほど速くはなりません。この形式は各コマの表示時間を100分の1秒単位で\
        持ちますが、ブラウザは1990年代から2以下の値を0.1秒に引き上げています。当時の\
        回る地球儀のために書かれ、そのまま残った規則です。ですから0.01秒と指定しても\
        毎秒100コマにはならず、毎秒10コマになります。この道具が0.02秒より短い値を\
        用意していないのはそのためで、0.05秒、つまり毎秒20コマあたりが、求めて意味の\
        ある上限です。"""

[[faq]]
q = "パレットの設定は何を変えますか？"
a = """
        GIFの1コマが持てる色は最大256色で、その256色は誰かが選ばなければなりません。
        <br><br>
        <strong>コマごとに最適な色</strong>は、1枚ごとに別々に256色を選びます。\
        いちばんくっきり見え、互いに関係のない写真を並べる場合はこれが正解です。\
        <strong>GIF全体でひとつのパレット</strong>は、全コマからまとめてひとつの\
        表を作ります。ファイルは小さくなり、同じ場面のコマの間でパレットが揺れて\
        起きるちらつきもなくなります。コマが寄せ集めではなく連続したものなら、\
        こちらを選んでください。"""

[[faq]]
q = "背景の透過を残せますか？"
a = """
        画像に透過があるなら残せます。「透過」を「透過部分を残す」に切り替えて\
        ください。ただし先に知っておくことがあります。GIFの透過は1ビットで、画素は\
        見えないか完全に塗られているかのどちらかしかありません。そのため、\
        アンチエイリアスのかかった縁も、柔らかい影も、薄れていくものも、すべて硬い\
        縁になります。アニメーションを置く先の背景色がわかっているなら、その色に\
        重ねてしまうほうがきれいに見えます。"""

[[faq]]
q = "使える画像の枚数に上限はありますか？"
a = """
        道具に組み込まれた上限はありません。実際の頭打ちは端末のメモリと、出てくる\
        ファイルの大きさに対するあなたの忍耐です。画像は1枚ずつ読まれるので100コマでも\
        問題ありませんが、640ピクセルで100コマとなれば、それはそれで非常に大きなGIFに\
        なります。上の「GIFがこんなに大きいのはなぜですか？」もご覧ください。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。出力に透かしも\
        入りません。このサイトには広告があり、それが費用を賄っています。広告に画像の\
        情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。処理の\
        ために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

