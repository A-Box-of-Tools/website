#
# Redact a PDF - Japanese.
#
# Overrides for tools/redact-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# 「黒塗り」はredact-imageと同じ語で、このサイトでは定着しています。ただし日本語の
# 「黒塗り」は覆う動作を思わせるので、このページでは「文字がファイルから消える」
# ことを繰り返し明示します。それこそがこのページの主張の全部だからです。
#

name = "PDFの黒塗り"
heading = "PDFの黒塗り<span class=\"h1-kw\">｜文字が消えます、上に箱を置くのではなく</span>"
tagline = "文字はファイルから消され、そのあとファイルを検索して確かめます。"

title = "PDFを黒塗りする｜文字を本当に消す、無料、アップロードなし"
description = "PDFの文字の上に黒い四角を描くのではなく、文字そのものを取り除きます。文字はページを描く命令から消され、できあがったファイルをもう一度開いて検索し、本当に消えたことを確かめます。何もアップロードしません。"
og_title = "PDFをきちんと黒塗りする｜文字は消され、覆われるのではありません"
og_description = "たいていの道具では黒い四角が文字の上に載っているだけで、その下から文字をコピーできます。この道具は文字をファイルから消し、そのあと結果を検索して、そこにないことを示します。"
og_image_alt = "PDFを、文字を消して黒塗りする。覆うのではなく"

pledge = """
    選んだ書類を開き、読み、書き換え、書き戻す処理は、すべてこの端末のメモリの中で、\
    このアドレスから配信されたコードが行います。ここにはアップロードを行えるものが\
    そもそもなく、このページの向こう側にはそれを受け取るサーバーもありません。ファイルも、\
    検索した語も、このタブから出ていきません。"""

live_hint = """
      言葉を信じる必要はありません。開発者ツールを開き、ネットワークタブを見ながら何かを\
      黒塗りしてみてください。ページも語もファイル名も、運んでいるリクエストはひとつも\
      ありません。あるいは回線を切ってから試してみてください。"""

read_first = """
、ページ上の各語をどう見つけて位置を決めるのかは\
      <code>src/text.js</code>、消す処理そのものは<code>src/edit.js</code>です。ページの\
      命令から何を切り取り、行の残りがずれないように何を戻すのかがそこにあります。\
      どれもネットワークに届きませんし、隣の読み手と書き手も同じです。"""

howto_heading = "語が本当に消えるようにPDFを黒塗りする方法"

card = """
            PDFの語を覆うのではなく消します。文字はページを描く命令から取り除かれ、\
            空いた幅はほかがずれないよう開けたまま保たれ、できあがったファイルはここで\
            もう一度開かれて検索され、その語が入っていないことが示されます。"""

[words]
plural = "書類"
choose = "PDFを1つ"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "アカウント不要"

[[facts]]
text = "オフラインで動く"

[[facts]]
text = "オープンソース"

[[facts]]
text = "ファイルは端末に残る"

[[privacy]]
title = "黒い四角は黒塗りではありませんし、ここでは何の上にもそれを描きません。"
body = """

      ページを黒塗りしますと言ってくるほとんどのプログラムで、PDFリーダーでもワープロでも\
      デザインソフトでも、その四角は文字の中ではなく文字の隣に保存されたオブジェクトです。\
      文字は同じファイルの同じ場所にそのまま残っていて、その範囲を選んでコピーを押せば\
      戻ってきます。その取り違えが、裁判資料や情報機関の報告書を、そして2025年12月には\
      米国司法省文書の大量公開で黒く塗られた氏名を世に出しました。数時間で読めてしまい\
      ました。この道具は、ページを描く命令から文字を消します。下に何かがある四角はここに\
      なく、下には何もありません。"""

[[privacy]]
title = "できあがったファイルは、渡す前にここでもう一度開かれ、検索されます。"
body = """

      それが済むまで、上に書いたことはすべてこの道具の自己採点にすぎません。ですから\
      これからあなたのダウンロードになるバイト列を、見知らぬ相手が送ってきたかのように\
      同じ読み手へ返し、すべてのページを読み直し、しおりも注釈もフォーム欄も書類の\
      プロパティもすべて集め、取り除いた語を検索します。件数は結果に出ます。何かが\
      残っていれば、その実行は失敗として報告され、ダウンロードはありません。"""

[[privacy]]
title = "語はタブから出ていきませんし、検索も出ていきません。"
body = """
 Content-Security-Policyには、\
      このページが接続しうるアドレスがすべて書かれていて、そのどれもこのサイトのもの\
      ではありません。この道具はその一覧に何も足しません。独自のネットワーク機能を、\
      任意のものさえ持っていないからです。検索欄に入力したものは、このタブのメモリに\
      ある文字と突き合わせる文字列で、そのどちらにも行き先はありません。"""

[[privacy]]
title = "黒塗りは、アップロードにいちばん耐えない仕事です。"
body = """

      人が黒塗りするものこそ、それをアップロードしてはいけない理由です。証人の陳述書、\
      診断書、大家に渡す銀行の明細、ある取引先の名前が入ったまま別の取引先へ行く契約書。\
      私的な部分を取り除いてもらうためにそれを見知らぬ相手のサーバーへ渡すというのは、\
      私的な部分がまず丸ごと届くということで、向こうに残るのもその版です。このページに\
      もう半分はありません。"""

[[privacy]]
title = "残るものはそのまま通されます。"
body = """

      ページで変わるバイトは、取り除いた文字が含まれていた文字描画の命令だけです。ほかの\
      すべての命令も、ページが参照するすべてのフォント・画像・線も、入ってきたとおりに\
      正確に写されます。描き直しも再エンコードも組み直しもありません。取り除いた分の幅は\
      測って字送りの命令として戻すので、行の残りは書類が置いた場所にとどまります。"""

[[privacy]]
title = "写真の中の語は取り除けませんし、それがどのページかを書きます。"
body = """

      スキャンされたページは画像です。その上の語は文字ではなく画素で、ここにあるどれも\
      それに触れられません。スキャンにスキャナーのOCRが作った見えない検索用の層が載って\
      いれば、この道具はその層を取り除きます。検索とコピーが見つけていたのはまさにそれ\
      です。そして画像には語がまだ見えていることを、ページにはっきり書きます。その画像を\
      覆うのは別の仕事で、画素そのものを上書きするのは\
      <a href=\"../redact-image/\">画像の黒塗り</a>です。"""

[[privacy]]
title = "書類は、自分がどこから来たかを言わなくなります。"
body = """

      プロパティとXMPパケットは実行のたびに消えます。producerの行も、作成日も、作成者も、\
      題名も、レイアウトソフトが残す私的なブロックもありません。ページから氏名を取り除いた\
      のに、プロパティにはまだ<code>佐藤_和解案_3.docx</code>と書かれているファイルは黒塗り\
      された書類ではありませんし、それはチェックボックス任せにする話ではありません。"""

[[privacy]]
title = "暗号化されたファイルは、開かずに返します。"
body = """

      パスワードの掛かったPDFは断ります。スキャナーが空のパスワードで作る、技術的には開いて\
      しまう種類のものも含めてです。書類の保護を外すのは、書類から語を取り除くのとは別の\
      仕事で、それを黙って行うのは、あなたの代わりに動く道具として意外な振る舞いになります。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
 広告と計測のスクリプトはGoogleから\
      来ます。どちらにも、あなたの書類については何も渡されません。ファイルも、ページも、\
      名前も、大きさも、ページ数も、検索した語もです。PDFを読み、書き換え、書き出すすべての\
      行はこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """

      上部の「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、文字は\
      Google Fontsから読み込みます。それはリンクにすぎません。訪問を報告することもなく、\
      あなたやあなたの書類について何かを受け取ることもありません。押さなければ何も起き\
      ませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 回線を切っても、このページのすべてがそのまま動きます。\
      いちばん簡単な証拠です。書類をどこかへ送って黒塗りさせる道具なら、止まるからです。"""

[[howto]]
title = "PDFを選びます。"
body = """
 一度に1つの書類だけで、それは意図的です。\
      黒塗りはページごとに目で見るべき仕事ですし、あるファイルで語を選ばせておいて黙って\
      別のファイルに適用する道具こそ、間違ったものが送られる道筋そのものです。ファイルは\
      ブラウザがディスクから直接読みます。"""

[[howto]]
title = "何を消すか伝えます。"
body = """
 語を入力してください。氏名でも、住所でも、\
      事件番号でもかまいません。すると出てくる場所がすべて、その語のある行とチェック欄と\
      ともに並びます。欄の隣の検出器はメールアドレス、カード番号、IBAN、マイナンバーや\
      社会保障番号、電話番号を探します。それらは提示されるだけで、勝手に選ばれることは\
      ありません。パターンには電話番号と事件番号の区別がつかないからです。"""

[[howto]]
title = "ページを読み、そこから語を拾います。"
body = """

      この欄は書類の文字を、実際に保存されているとおりに、読み手がコピーするであろう順で\
      表示します。どの語もクリックすれば取り除かれ、もう一度クリックすれば残ります。\
      取り消し線の引かれたものが消えるものです。ですからこれは選択であると同時に確認でも\
      あり、ボタンを押す前にどのページでもやっておく価値があります。"""

[[howto]]
title = "取り除き、確認したと書かれた行を読みます。"
body = """

      文字が消され、空いた幅は開けたまま保たれ、頼めばその上に黒い箱が描かれ、同じ語が\
      しおり・注釈・フォーム欄・書類のプロパティからも取り除かれます。そのあと、できあがった\
      ファイルがここでもう一度開かれ、検索されます。取り除いた語がまだ見つかるなら、\
      ダウンロードは渡されず、そう書いたメッセージが出ます。"""

[[faq]]
q = "PDFリーダーで黒い箱を描くのと何が違うのですか。"
a = """
        リーダーで描いた四角は注釈です。位置を持つオブジェクトで、ページの隣に保存されます。\
        その下の文字は手つかずのままです。その範囲を選んでコピーを押した人も、別のプログラム\
        でファイルを開いた人も、どんなテキスト抽出器を通した人も、語を取り戻せます。リーダーに\
        よっては削除を本当に適用する「redact」の命令を備えていますし、描く機能しか持たないもの\
        もいくつもあります。この道具にはどけるべき四角がそもそもありません。文字はページを描く\
        命令から切り取られますし、黒い箱は、有効のままにしておけば、すでに空になっている場所へ\
        あとから描かれます。"""

[[faq]]
q = "語が本当に消えたと、どうすれば分かりますか。"
a = """
        この道具が端末上で確かめ、件数を見せるからです。ファイルを書き終えると、このページの\
        同じ読み手がそれをもう一度開き、すべてのページを読み、しおりも注釈もフォーム欄も\
        プロパティも集め、取り除いた語をひとつずつ検索します。結果の行が、いくつあって\
        いくつ残ったかを書きます。答えがあるべきものでなければ実行は失敗し、ダウンロードは\
        渡されません。あとから自分で確かめることもできます。どのリーダーでもCtrl+Fを押して\
        その語を探してみてください。"""

[[faq]]
q = "語を取り除くとページの残りはずれますか。"
a = """
        いいえ。文字はペンをページ上で進めながら描かれるので、5文字消せばふつうは行の残りが\
        5文字ぶん左へ寄ってしまいます。取り除いた分の正確な幅をフォント自身の字幅から測り、\
        字送りの命令として戻すのですが、それは何も描かずにペンだけを動かします。表の列は\
        そろったままで、合計は見出しの下にとどまります。"""

[[faq]]
q = "スキャンした書類を黒塗りできますか。"
a = """
        画像はできませんし、できるふりをせずそう書きます。スキャンはページを撮った写真で、\
        語は画素であり、取り除くべき文字がありません。ただしスキャンには、ページを検索できる\
        ようにスキャナーのOCRが画像の上に書いた見えない文字の層が載っていることがよくあり\
        ます。この道具はその層を見つけ、選んだものをそこから取り除き、画像は変わっていないと\
        ページに書きます。ですから検索とコピーはその語を見つけなくなり、ページを見ている人は\
        まだ読めます。画像のほうは、<a href=\"../redact-image/\">画像の黒塗り</a>が画素そのものを\
        上書きします。"""

[[faq]]
q = "ページの上にない部分はどうなりますか。"
a = """
        そちらも扱います。黒塗りがこぼれるのはたいていそこだからです。同じ語を、しおり・注釈・\
        付箋から、フォーム欄に入力された内容から、スクリーンリーダーに渡される文字から、そして\
        読み手がページの文字の<em>代わりに</em>コピーする置換文字からも取り除きます。最後のものは\
        合字や行末でハイフンで割れた語がきちんとコピーされるためにあり、一文まるごと入ることも\
        あります。書類のプロパティとXMPパケットは丸ごと削除します。添付ファイルと、ファイルを\
        開いたときに動くものは捨てます。どちらも、取り除こうとしている語を検索できる対象では\
        ないからです。"""

[[faq]]
q = "書類はどこかへアップロードされますか。"
a = """
        いいえ。ファイルの読み込み、書き換え、書き出しは、すべて手元のブラウザが手元の\
        ハードウェアで行います。この道具にはサーバー側というものがそもそもなく、ページの\
        <code>Content-Security-Policy</code>には接続しうるアドレスがすべて書かれていますが、\
        そのどれもこのサイトのものではありません。検索欄に入力したものはこのタブのメモリに\
        ある文字と突き合わせるだけで、それもどこへも行きません。"""

[[faq]]
q = "ほかの道具のようにページの上に枠をドラッグできないのはなぜですか。"
a = """
        ページを描くには完全なPDFレンダラーが要るからです。フォント、グラデーション、透明度、\
        描画モードまで備えたエンジンは1メガバイト以上あり、取ってきて動かすことになりますが、\
        このサイトはそういうものを一切配りません。そしてそれはこの仕事にかえって合っています。\
        四角をドラッグするのは<em>紙のある範囲</em>を選ぶことで、紙の範囲はその下の文字と同じ\
        ものではありません。黒い箱の取り違えはまさにそこから始まります。代わりに得られるのは、\
        書類の文字を読み順に並べ、どの語もクリックできるようにした画面です。しかもそれは、\
        ページの画像には言えないことを言える唯一の表示でもあります。目の前の語がそもそも文字\
        なのかどうか、ということです。"""

[[faq]]
q = "できあがったファイルはどこでも開けますか。"
a = """
        はい。出力はPDF 1.5、あるいは渡されたファイルが必要とした最も高い版で書かれ、1.5は\
        2003年以降に出たすべてのリーダーが理解します。ページのものは何も再エンコードされ\
        ません。フォントも画像もベクター描画もバイト単位でそのまま通るので、残った文字は\
        以前とまったく同じように選択でき、検索できます。"""

[[faq]]
q = "パスワードの掛かったPDFを開けますか。"
a = """
        いいえ、そしてそれは意図的です。暗号化された書類は、そう書いたメッセージとともに\
        断ります。パスワードが空のときもです。多くのスキャナーや複合機がそのように保存します。\
        ファイルの保護を外すのは、ファイルから語を取り除くのとは別の仕事で、それを黙って行う\
        道具は、頼まれてもいないことをしていることになります。"""

[[faq]]
q = "大きさの制限はありますか。費用はかかりますか。"
a = """
        道具の中に書かれた制限はありません。制限は手元の端末です。作業中は書類をメモリに置く\
        ので、ノートパソコンなら数百メガバイトまでは文句を言わず、その上のどこかから苦しく\
        なります。無料で、アカウントもログインも試用期間もありません。このサイトは広告で\
        運営されていて、広告側にはあなたの書類について何も渡されません。"""

[[faq]]
q = "オフラインで動きますか。"
a = """
        はい。ページを一度読み込んだあと、回線を切っても動き続けます。何もアップロードされて\
        いないことを示すいちばん簡単な方法でもあります。書類をどこかへ送って黒塗りさせる道具\
        なら、線を抜いた瞬間に止まるからです。"""

[schema]
description = "ブラウザでPDFを黒塗りします。文字を覆うのではなく消します。文字はページのcontent streamから取り除かれ、できあがったファイルをもう一度開いて検索し、消えたことを確かめます。何もアップロードしません。"
features = [
  "文字の上に四角を描くのではなく、文字をページから消す",
  "できあがったファイルをもう一度開いて検索し、語が消えたことを示す",
  "ある語のすべての出現を見つける。またはメール・カード番号・IBAN・各国の身分番号を探す",
  "書類の文字を読み順に表示し、どの語もクリックできるようにする",
  "同じ語をしおり・注釈・フォーム欄・プロパティからも取り除く",
  "行の残りがずれないよう、空いた幅を開けたまま保つ",
  "どのページがスキャンで、取り除くべき文字がないのかを書く",
  "オフラインで動作。アップロードもアカウントも大きさの制限もなし",
]

[picker]
title = "PDFをここにドロップ"
hint = "またはクリックして選択｜一度に1つの書類"
