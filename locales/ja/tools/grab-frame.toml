[[privacy]]
title = "動画には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。ファイルが\
      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
この道具にはネットワーク機能が一切ありません。貼り付ける\
      アドレスもなく、ダウンロードするものもなく、初回に落ちてくるエンジンも\
      ありません。動画に触れるコードは1バイト残らず、ページを読み込んだときに\
      このオリジンから来たものです。"""

[[privacy]]
title = "展開は手元で行われます。"
body = """
コマはお使いのブラウザのWebCodecsを通るか、\
      どのみち動画を見せてくれる同じ再生エンジンを通ります。画像はこの端末の\
      キャンバスに描かれ、そのままダウンロードへ渡されます。"""

[[privacy]]
title = "ファイルは数メガバイトずつ読まれます。"
body = """
動画は、ここで扱うファイルの中で\
      唯一、確実にメモリへ収まるとは限らないものです。だから丸ごと読み込むことは\
      ありません。読み取りは、指定されたコマの周りの範囲だけを取ります。2ギガ\
      バイトの動画が小さいものと同じくらい速く開くのも、これが理由です。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      動画に関する情報は渡されません。ファイルも、コマも、名前も、サイズも、\
      長さも、止めた位置もです。読み、展開し、描くコードはすべてこのオリジンから\
      配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体はGoogle Fontsから読み込みます。それはリンク\
      以上のものではありません。訪問を報告することもなく、あなたや動画について\
      渡されるものもありません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのすべてがそのまま動きます。\
      これがいちばん単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
MP4・MOV・M4V・WebMを選択欄にドラッグするか、\
      手で選んでください。ブラウザがディスクから直接読み、その間に何かが\
      どこかへ送られることはありません。"""

[[howto]]
title = "その瞬間を探します。"
body = """
再生して止めるか、スライダーを動かしてください。\
      MP4なら1目盛りが1コマなので、見えているものと保存するものの間に\
      丸めは入りません。矢印キーで1コマずつ、<kbd>Shift</kbd>を押しながらなら\
      10コマずつ進みます。"""

[[howto]]
title = "形式を選びます。"
body = """
PNGは展開されたコマをそのまま保存します。ここで\
      いう「画質を落とさない」はその意味です。JPEGとWebPはファイルが小さく\
      なりますが、動画自身の圧縮の上にもう一度圧縮をかけます。下書きの確認には\
      十分で、あとから編集するものには向きません。"""

[[howto]]
title = "1枚だけ、あるいは何枚も切り出します。"
body = """
1枚ならそのままダウンロードへ\
      入ります。「N秒ごと」は動画を一度通しで走り、各地点で1枚ずつ取ります。\
      一覧表やサムネイル作りに便利で、保存の確認が100回ではなく、1つのZIPに\
      まとまって出てきます。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        いいえ。読み込みも展開も、お使いのブラウザがお手元のハードウェアで行います。\
        この道具にサーバー側はなく、ページの<code>Content-Security-Policy</code>には\
        接続してよいアドレスがすべて書かれていて、そのどれもこのサイトのもの\
        ではありません。言葉より確認という方は、回線を抜いてからコマを切り出して\
        みてください。"""

[[faq]]
q = "「画質を落とさない」とは具体的に何ですか？"
a = """
        2つあります。1つは、保存される画像がページ上のプレビューの大きさではなく、\
        動画そのものの解像度になることです。4Kの動画なら3840 x 2160の画像が\
        できます。もう1つは、PNGを選んだ場合、デコーダーから出てきたままのコマが\
        保存されるということです。つまりファイルの中身は動画が持っている絵そのもの\
        で、その上に二度目の圧縮は載りません。再生ウィンドウのスクリーンショットは\
        どちらも満たしません。大きさはウィンドウの大きさで、しかもプレイヤーが\
        拡大縮小と色変換を済ませたあとの絵だからです。"""

[[faq]]
q = "どの動画形式からコマを取り出せますか？"
a = """
        MP4・M4V・MOVは中身によらず直接読めます。H.264でもHEVCでもAV1でもVP9でも、\
        お使いのブラウザがそのコーデックを展開できるかぎり大丈夫です。これが、\
        個々のコマを名指しできる正確な経路です。それ以外でブラウザが再生できる\
        もの、代表的にはWebMは、プレイヤーをその位置へ動かして表示された絵を描く\
        方法で扱います。原寸の画像は保存できますが、着地するのはプレイヤーが\
        選んだコマで、あなたが指定したコマとは限りません。ブラウザが読むことも\
        再生することもできないファイル、実際にはAVI・WMV・FLV、そしてほとんどの\
        MKVは、その旨を伝えて受け付けません。"""

[[faq]]
q = "1コマずつ送れますか？"
a = """
        MP4なら、正確に送れます。この道具はファイル自身のコマ一覧を読むので、矢印\
        キーは実際にそこにあるコマの間を移動します。フレームレートが揺れる動画でも\
        同じで、30分の1秒ずつという固定の刻みなら少しずつずれていくところです。\
        再生経路にはその一覧がないため、1回の操作はおよそ1コマ分の移動になり、\
        ページにもそう表示されます。"""

[[faq]]
q = "スマホの縦向き動画が、ここでは正しい向きなのはなぜですか？"
a = """
        回転を意図して適用しているからです。スマホは横向きで撮影し、画素を回す\
        代わりに「4分の1回転」という情報をファイルに書きます。デコーダーが渡して\
        くるコマは横倒しで、どのプレイヤーも画面に出す途中でそれを起こしています。\
        この手順を飛ばす道具は、正しい瞬間のもっともらしい画像を、横倒しのまま\
        保存します。この道具はトラックから回転を読み取り、何かを描く前に適用\
        します。"""

[[faq]]
q = "動画のサイズや長さに上限はありますか？"
a = """
        道具に組み込まれた上限はありません。ファイルを一度にメモリへ読み込むことも\
        なく、数メガバイトずつたどっていきます。長い動画が短いものと同じくらい\
        速く開くのはそのためです。切り出した画像はダウンロードするまでページの中に\
        置かれるので、現実的な頭打ちは動画そのものではなく、4KのPNGが数百枚と\
        いったあたりです。"""

[[faq]]
q = "切り出した画像をあとから拡大縮小したり切り抜いたりできますか？"
a = """
        ここではできませんが、隣でできます。この道具はコマをそのまま保存します。\
        大きさや形を変えるのはそれ自体が判断を伴う別の作業で、\
        <a href="../resize-image/">画像リサイズ</a>がどちらもできます。こちらも\
        アップロードはしません。絵を変えずにファイルだけ小さくしたい場合は\
        <a href="../compress-image/">画像圧縮</a>です。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に動画の情報が渡される\
        ことはありません。"""

[schema]
browser_requirements = "JavaScriptが必要です。コマ単位の正確な切り出しにはWebCodecsに対応したブラウザが必要で、それ以外ではプレイヤーを移動させる方法に切り替わります。"
description = "動画のどのコマでも、ブラウザの中で原寸のPNG・JPEG・WebPとして保存します。MP4・MOV・M4VはWebCodecsで1コマずつ読むため、指定したコマがそのまま保存されます。それ以外でブラウザが再生できるものはプレイヤーから取り込みます。アップロードは一切ありません。"
features = [
  "MP4・MOV・M4V・WebMの動画から静止画を保存",
  "H.264・HEVC・AV1・VP9のソースをWebCodecsで展開",
  "ファイル自身のコマ一覧をたどる1コマ送り",
  "コマをそのまま残すPNGと、小さく収めるJPEG・WebP",
  "N秒ごとに1枚ずつ、まとめて1つのZIPでダウンロード",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます &mdash; MP4・MOV・M4V・WebM、このブラウザで再生できるものなら何でも"
