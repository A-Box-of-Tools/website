title = "動画から1コマを画像で保存｜無料・アップロードなし・オフライン可"
description = "MP4・MOV・WebMのどのコマでも、原寸のPNGまたはJPEGで保存できます。1コマずつ送ることも、数秒おきに1枚ずつ取り出すこともできます。処理はブラウザの中だけで、アップロードはありません。"
og_title = "動画のコマ切り出し——動画を送らずに、どの瞬間でも1枚"
og_description = "その瞬間を探し、狙ったコマまで送り、動画そのものの解像度で保存します。コマの展開は手元の端末で行われ、画像が二重に圧縮されることもありません。"
og_image_alt = "動画のコマ切り出し - ブラウザの中で動画の1コマを保存、アップロードなし"

pledge = """
    コマを探すのも、展開するのも、描くのも、すべてお使いのブラウザが手元の\
