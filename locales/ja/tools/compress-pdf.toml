name = "PDF圧縮ツール"
# 後半の span が検索される語です。
heading = "PDF圧縮 <span class=\"h1-kw\">&mdash; PDFのサイズを小さく</span>"
tagline = "どこにも送らずに、書類を軽くします。"

title = "PDF圧縮 &mdash; 無料・ブラウザ内・アップロード不要"
description = "PDFをアップロードせずに小さくします。ファイルの読み込みも再圧縮も書き直しも、あなた自身のブラウザが行います。何かに手をつける前に、そのPDFの容量が実際どこにあるかを見せます。"
og_title = "PDF圧縮 &mdash; 無料で、何もアップロードしません"
og_description = "PDFをあなた自身の端末で小さくします。各画像がページ上で実際どれだけの大きさに描かれているかを測るので、誰にも見えないピクセルだけを捨てます。"
og_image_alt = "PDF圧縮 - アップロードせずに書類を小さくする"

pledge = """
    書類を開き、分解し、書き戻す作業はすべて、このアドレスから配信された\
    コードによって、この端末のメモリ上で行われます。ここにアップロードを\
    行える部分はなく、このページの向こう側にそれを受け取るサーバーも\
    ありません。"""

live_hint = """
      鵜呑みにする必要はありません。DevTools を開いてネットワークタブを見ながら\
      ファイルを圧縮してみてください。ページも、画像も、ファイル名も、どの\
      リクエストにも載りません。あるいは回線を抜いてから圧縮してみてください。"""

read_first = """
、そして読み込みと書き直しのすべてについては
      <code>src/reader.js</code> と <code>src/writer.js</code> です。\
      どちらもネットワークには手が届きません。"""

howto_heading = "PDFを小さくする手順"

card = """
            中の画像を再圧縮して書類を小さくします。まず容量が実際どこに\
            あるかを見せ、取り分がないときははっきりそう言います。"""

