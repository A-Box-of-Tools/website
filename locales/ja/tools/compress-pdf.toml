text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[facts]]
text = "ファイルは端末に残ります"

[[privacy]]
title = "書類には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。このツールはその一覧に何も足しません。\
      自前のネットワーク機能は、任意のものすら持っていないからです。あなたの\
      ファイルを集めるための受け口はここにはなく、あったとしても送るコードが\
      ありません。"""

[[privacy]]
title = "形式の扱いはすべてこのリポジトリの中にあります。"
body = """
 PDFとは、オブジェクトの\
      並びと、それぞれがどこから始まるかの表です。<code>src/objects.js</code>
      がその構文を読み、<code>src/reader.js</code> が表をたどり、
      <code>src/writer.js</code> が新しいものを書きます。この3つはどれも、\
      リクエストを出せるものを読み込んでいません。ライブラリを取りに行くことも、\
      サーバーで描画することもありません。"""

[[privacy]]
title = "暗号化されたファイルは、開かずに断ります。"
body = """

      パスワードのかかったPDFは受け付けません。スキャナーが空のパスワードで\
      作る、技術的には開けてしまう種類のものも同じです。書類の保護を外すのは\
      小さくするのとは別の仕事で、黙ってそれを代行するのは、道具として\
      驚かれるべき振る舞いです。"""

[[privacy]]
title = "足すのではなく、外します。"
body = """
 できあがったファイルには、作成日時も、\
      生成元の記録も、作ったツールの名前も入りません。チェックを入れれば、\
      レイアウトソフトが残していくXMPパケットや非公開のブロックも落とします
      &mdash; EXIFツールと同じ理屈を、別の入れ物に当てはめたものです。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から来ています。そのどちらにも、あなたの書類に\
      関する情報は渡されません。ファイルも、ページも、名前も、サイズも、\
      ページ数もです。PDFを読み、解読し、書き出すコードはすべてこのオリジン\
      から配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むもの、そして渡されないもの。"
body = """

      ヘッダーの「Buy me a coffee」ボタンは cdnjs.buymeacoffee.com の\
      スクリプトが描き、書体を Google Fonts から取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、あなたや書類に関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切っても、このページの機能はすべて\
      そのまま動きます。これがいちばん単純な証明です。圧縮のために書類をどこかへ\
      送っている道具なら、そこで止まるからです。"""

[[howto]]
title = "PDFを選びます。"
body = """
 選択欄にドロップするか、手で選んでください。\
      ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られる\
      ことはありません。"""

[[howto]]
title = "容量がどこにあるかを見ます。"
body = """
 内訳こそが第2段階の目的です。\
      棒グラフの大半が画像なら、このツールには手をつける余地があります。大半が\
      フォントとページの中身なら、そう表示され、正直な削減幅は数パーセントです
      &mdash; 1分を費やす前に知っておけるほうが良いはずです。"""

[[howto]]
title = "どこまで絞るかを指定します。"
body = """
 用意された設定は曖昧な段階ではなく\
      解像度です。画面で読むなら96 DPI、メールに添付するなら130、まだ印刷する\
      可能性があるなら220。どれも、その画像がページ上で実際どれだけの大きさに\
      描かれているかと突き合わせて判断されるので、サムネイルとして置かれた写真が\
      全面スキャンと同じ扱いになることはありません。"""

[[howto]]
title = "圧縮して、確認済みと書かれた行を見ます。"
body = """

      書き直しが終わると、できあがったファイルはこのページの同じリーダーで\
      もう一度開かれ、ページ数が数えられます。それが元と食い違えば、その実行は\
      失敗として報告され、ダウンロードは提示されません。"""

[[faq]]
q = "PDFはどこかにアップロードされますか？"
a = """
        されません。ファイルの読み込みも再圧縮も書き出しも、あなた自身の\
        ブラウザがあなた自身のハードウェア上で行います。このツールにサーバー側は\
        存在せず、ページの <code>Content-Security-Policy</code> は接続してよい\
        アドレスをすべて挙げていますが &mdash; そのどれも当サイトのものでは\
        ありません。任意のネットワーク機能すら一切ありません。"""

[[faq]]
q = "PDFはどれくらい小さくなりますか？"
a = """
        中身によって完全に変わります。だからこのツールは、何かを圧縮する前に\
        測って見せます。スキャンした書類はほぼ写真なので、60〜90%小さくなるのが\
        普通です。契約書や論文は文字とベクター図形と埋め込みフォントで、どれも\
        作った側がすでに圧縮しています。そこでの削減はたいてい数パーセントで、\
        ファイルを詰め直し、もう参照されていないものを落とした分です。あなたの\
        ファイルを見もせずに一定の削減率を約束する道具は、当て推量をしています。"""

[[faq]]
q = "PDFを圧縮すると画質は落ちますか？"
a = """
        中の画像は再エンコードされるので、その分は落ちます。それ以外には手を\
        つけません。文字は文字のままで、選択も検索もでき、フォントは丸ごと保たれ、\
        ベクター図形はそのまま複製されます。また、無駄に画像を悪くすることも\
        拒みます &mdash; 再エンコードしても元より小さくならなかった場合は、\
        元のバイト列がそのまま書類に戻されます。"""

[[faq]]
q = "ここでいう DPI とは何で、なぜ訊かれるのですか？"
a = """
        PDFは各画像がページ上でどれだけの大きさに描かれるかを記録しているので、\
        実効解像度を計算できます。4000ピクセルのスキャンを8インチの幅に置けば、
        1インチあたり500ピクセルを抱えていることになります。画面ではまったく、\
        紙でもほとんど使い道のない量なので、指定した設定を超える分から先に\
        捨てられます &mdash; 誰にも見えない画質に費用を払っているからです。\
        小さく置かれたロゴが全面スキャンと同じ扱いにならないのは、この計測の\
        おかげです。"""

[[faq]]
q = "パスワード付きのPDFは開けますか？"
a = """
        開けません。そしてそれは意図したものです。暗号化された書類は、その旨の\
        メッセージを出して断ります。パスワードが空の場合でも同じです &mdash;
        多くのスキャナーや複合機はその形で保存します。ファイルの保護を外すのは\
        圧縮とは別の仕事で、黙ってそれをする道具は、頼まれていないことを\
        していることになります。"""

[[faq]]
q = "圧縮できないPDFはありますか？"
a = """
        中の一部の画像については、あります。JPEG 2000、JBIG2、ファックス形式
        (CCITT) の画像はどのブラウザにもデコーダーがないので、手をつけずに\
        通し、その旨を表示します &mdash; 後ろの2つは白黒2値のコーデックで、\
        たいていすでに最小に近い大きさです。CMYKの画像も触りません。再エンコード\
        すると、印刷機が出す色が変わってしまう恐れがあるからです。飛ばしたものは\
        すべて、理由とともに結果に表示されます。"""

[[faq]]
q = "圧縮したファイルはどこでも開けますか？"
a = """
        開けます。出力は PDF 1.5 で書かれます。2003年以降に出たリーダーなら\
        どれも理解できる版です。そしてこのツールは、それをあなたの端末上で\
        証明します。できあがったファイルをもう一度開き、ページ数を数えてから\
        あなたに渡します。フォーム、リンク、しおり、アクセシビリティの構造、\
        埋め込まれた添付ファイルはそのまま引き継がれます。残していくのは、\
        書類の中のどこからも参照されなくなった素材だけです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。ファイルサイズの\
        上限も、あなたの端末のメモリが許す範囲を超えては存在しません。この\
        サイトには広告があり、それが費用を賄っています。広告にあなたの書類に\
        関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。圧縮のために書類をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

[schema]
description = "PDFをブラウザ内で圧縮します。画像は、ページ上で実際に描かれる大きさと突き合わせて再圧縮され、書類はローカルで書き直されます。ファイルがアップロードされることはありません。"
features = [
  "何かを圧縮する前に、書類の容量が実際どこにあるかを見せます",
  "画像を、ページ上での実測解像度と突き合わせて再圧縮します",
  "再エンコードしても小さくならない画像には手をつけません",
  "以前の編集が残していったオブジェクトと、任意でメタデータを落とします",
  "できあがったファイルを開き直して確認してから提示します",
  "オフラインで動作。アップロードなし、登録なし、ファイルサイズの上限なし",
]

[picker]
title = "ここにPDFをドロップ"
hint = "クリックして選ぶこともできます &mdash; 一度に1つの書類"
