# category, the icon, the CSP and the list of shared parts stay where they are.
#

name = "PDF圧縮ツール"
# 後半の span が検索される語です。
heading = "PDF圧縮<span class=\"h1-kw\">｜PDFのサイズを小さくする</span>"
tagline = "どこにも送らずに、書類を軽くします。"

title = "PDF圧縮｜無料・ブラウザ内で完結・アップロード不要"
description = "PDFをアップロードせずに小さくします。読み込みも再圧縮も書き直しも、お使いのブラウザが行います。手をつける前に、そのPDFの容量が実際どこにあるのかを見せます。"
og_title = "PDF圧縮｜無料で、何もアップロードしません"
og_description = "PDFを手元の端末で小さくします。各画像がページ上で実際どれだけの大きさに描かれているかを測るので、捨てるのは誰にも見えないピクセルだけです。"
og_image_alt = "PDF圧縮 - アップロードせずに書類を小さくする"

pledge = """
    書類を開き、分解し、書き戻すまでは、このアドレスから配信されたコードが\
    この端末のメモリ上で行います。ここにアップロードを行える部分はありません。\
    このページの向こう側に、それを受け取るサーバーもありません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      ファイルを圧縮してみてください。ページも画像もファイル名も、どの\
      リクエストにも載りません。回線を抜いてから圧縮してみるのでも構いません。"""

read_first = """
、そして読み込みと書き直しのすべてについては\
      <code>src/reader.js</code>と<code>src/writer.js</code>です。どちらも\
      ネットワークには手が届きません。"""

howto_heading = "PDFを小さくする手順"

card = """
            中の画像を再圧縮して書類を小さくします。まず容量が実際どこに\
            あるのかを見せ、取り分がないときははっきりそう言います。"""

[words]
plural = "書類"
choose = "PDF"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[facts]]
text = "ファイルは端末に残ります"

[[privacy]]
title = "書類には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。このツールは\
      その一覧に何も足しません。自前のネットワーク機能を、任意のものすら\
      持っていないからです。ファイルを集めるための受け口はここになく、\
      あったとしても送るコードがありません。"""

[[privacy]]
title = "形式の扱いはすべてこのリポジトリの中にあります。"
body = """
PDFとは、オブジェクトの並びと、それぞれがどこから始まるかの表です。\
      <code>src/objects.js</code>がその構文を読み、<code>src/reader.js</code>\
      が表をたどり、<code>src/writer.js</code>が新しいものを書きます。この3つは\
      どれも、リクエストを出せるものを読み込んでいません。ライブラリを取りに\
      行くことも、サーバーで描画することもありません。"""

[[privacy]]
title = "暗号化されたファイルは、開かずに断ります。"
body = """
パスワードのかかったPDFは受け付けません。スキャナーが空のパスワードで\
      作る、技術的には開けてしまう種類のものも同じです。書類の保護を外すのは\
      小さくするのとは別の仕事です。それを黙って代行する道具は、驚かれても\
      仕方がありません。"""

[[privacy]]
title = "足すのではなく、外します。"
body = """
できあがったファイルには、作成日時も、生成元の記録も、作ったツールの名前も\
      入りません。チェックを入れれば、レイアウトソフトが残していくXMPパケットや\
      非公開のブロックも落とします。EXIFツールと同じ理屈を、別の入れ物に\
      当てはめたものです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、書類に関する\
      情報は渡されません。ファイルも、ページも、名前も、サイズも、ページ数も\
      です。PDFを読み、解読し、書き出すコードはすべてこのオリジンから配信され、\
      リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や書類に関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。圧縮のために書類をどこかへ送っている道具なら、そこで\
      止まるからです。"""

[[howto]]
title = "PDFを選びます。"
body = """
選択欄にドロップするか、手で選んでください。ブラウザがディスクから直接\
      読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "容量がどこにあるのかを見ます。"
body = """
内訳こそが第2段階の目的です。棒グラフの大半が画像なら、このツールには\
      手をつける余地があります。大半がフォントとページの中身なら、そう表示され、\
      正直な削減幅は数パーセントにとどまります。1分を費やす前に知っておける\
      ほうがいいはずです。"""

[[howto]]
title = "どこまで絞るかを指定します。"
body = """
用意した設定は曖昧な段階ではなく、解像度です。画面で読むなら96DPI、\
      メールに添付するなら130、まだ印刷する可能性があるなら220。どれも、その\
      画像がページ上で実際どれだけの大きさに描かれているかと突き合わせて\
      判断するので、サムネイルとして置かれた写真が全面スキャンと同じ扱いに\
      なることはありません。"""

[[howto]]
title = "圧縮して、確認済みと書かれた行を見ます。"
body = """
書き直しが終わると、できあがったファイルをこのページの同じリーダーで\
      もう一度開き、ページ数を数えます。それが元と食い違えば、その実行は失敗と\
      して報告され、ダウンロードは提示されません。"""

[[faq]]
q = "PDFはどこかにアップロードされますか？"
a = """
        されません。読み込みも再圧縮も書き出しも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。任意の\
        ネットワーク機能すら一切ありません。"""

[[faq]]
q = "PDFはどれくらい小さくなりますか？"
a = """
        中身によって完全に変わります。だからこのツールは、何かを圧縮する前に\
        測って見せます。スキャンした書類はほぼ写真なので、60〜90%小さくなるのが\
        普通です。契約書や論文は文字とベクター図形と埋め込みフォントで、どれも\
        作った側がすでに圧縮しています。そこでの削減はたいてい数パーセントで、\
        ファイルを詰め直し、もう参照されていないものを落とした分です。ファイルを\
        見もせずに一定の削減率を約束する道具は、当て推量をしています。"""

[[faq]]
q = "PDFを圧縮すると画質は落ちますか？"
a = """
        中の画像は再エンコードされるので、その分は落ちます。それ以外には手を\
        つけません。文字は文字のままで、選択も検索もでき、フォントは丸ごと保たれ、\
        ベクター図形はそのまま複製されます。無駄に画像を悪くすることも拒みます。\
        再エンコードしても元より小さくならなかった場合は、元のバイト列がそのまま\
        書類に戻ります。"""

[[faq]]
q = "ここでいうDPIとは何で、なぜ訊かれるのですか？"
a = """
        PDFは各画像がページ上でどれだけの大きさに描かれるかを記録しているので、\
        実効解像度を計算できます。4000ピクセルのスキャンを8インチの幅に置けば、\
        1インチあたり500ピクセルを抱えていることになります。画面ではまったく、\
        紙でもほとんど使い道のない量なので、指定した設定を超える分から先に\
        捨てます。誰にも見えない画質に費用を払っているからです。小さく置かれた\
        ロゴが全面スキャンと同じ扱いにならないのも、この計測のおかげです。"""

[[faq]]
q = "パスワード付きのPDFは開けますか？"
a = """
        開けません。これは意図したものです。暗号化された書類は、その旨の\
        メッセージを出して断ります。パスワードが空の場合でも同じで、多くの\
        スキャナーや複合機はその形で保存します。ファイルの保護を外すのは圧縮とは\
        別の仕事です。黙ってそれをする道具は、頼まれていないことをしていること\
        になります。"""

[[faq]]
q = "圧縮できないPDFはありますか？"
a = """
        中の一部の画像については、あります。JPEG 2000、JBIG2、ファックス方式\
        （CCITT）の画像はどのブラウザにもデコーダーがないので、手をつけずに通し、\
        その旨を表示します。後ろの2つは白黒2値のコーデックで、たいていすでに\
        最小に近い大きさです。CMYKの画像も触りません。再エンコードすると、\
        印刷機が出す色が変わってしまう恐れがあるからです。飛ばしたものはすべて、\
        理由とともに結果に表示されます。"""

[[faq]]
q = "圧縮したファイルはどこでも開けますか？"
a = """
        開けます。出力はPDF 1.5で書きます。2003年以降に出たリーダーならどれも\
        理解できる版です。そしてこのツールは、それを手元の端末上で証明します。\
        できあがったファイルをもう一度開き、ページ数を数えてから渡します。\
        フォーム、リンク、しおり、アクセシビリティの構造、埋め込まれた添付\
        ファイルはそのまま引き継ぎます。残していくのは、書類のどこからも\
        参照されなくなった素材だけです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。ファイルサイズの\
        上限も、端末のメモリが許す範囲を超えては存在しません。このサイトには\
        広告があり、それが費用を賄っています。広告に書類の情報が渡されることは\
        ありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        何もアップロードされていないことを示す、いちばん簡単な方法でもあります。\
        圧縮のために書類をどこかへ送っている道具なら、線を抜いた瞬間に止まる\
        からです。"""

[schema]
description = "PDFをブラウザの中で圧縮します。画像は、ページ上で実際に描かれる大きさと突き合わせて再圧縮し、書類は手元で書き直します。ファイルがアップロードされることはありません。"
features = [
  "何かを圧縮する前に、書類の容量が実際どこにあるのかを見せます",
  "画像を、ページ上での実測解像度と突き合わせて再圧縮します",
  "再エンコードしても小さくならない画像には手をつけません",
  "以前の編集が残していったオブジェクトと、任意でメタデータを落とします",
  "できあがったファイルを開き直して確認してから提示します",
  "オフラインで動作。アップロードなし、登録なし、ファイルサイズの上限なし",
]

[picker]
title = "ここにPDFをドロップ"
hint = "クリックして選ぶこともできます。書類は一度に1つです"
