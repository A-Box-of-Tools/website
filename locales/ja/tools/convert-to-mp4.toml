[[privacy]]
title = "時間のかかるアップロードがありません。"
body = "オンライン変換では1GBを送って別の1GBを受け取る前に、全ファイルの送信が必要です。送信時間が変換より長くなることもあります。ここではこのサイトのコードとブラウザのコーデックで、ディスクとメモリの間だけで読み書きします。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはなく、通信を切っても動きます。"

[[privacy]]
title = "ここでのMP4は、広く使える組み合わせです。"
body = "通常のMP4コンテナにH.264映像とAAC音声を入れたものは、電話、ブラウザ、チャット、メール、フォームで広く使えます。WebM、MKV、HEVCやVP9やAV1入りのMP4には拒否する相手があります。そのためこの組み合わせだけを書きます。元より開ける場所の少ないファイルにしないよう、H.264以外の映像をそのまま入れることはありません。"

[[privacy]]
title = "使える部分をコピーし、必要な部分だけ再エンコードします。"
body = "変換に必ずしも再エンコードは必要ありません。MKVのH.264フレームとAAC音声はMP4でも同じバイトなのでコピーできます。WebMのVP9やVP8、iPhoneのHEVC、OpusやVorbis音声はデコードと再エンコードが必要で、1世代の画質変化があります。開始前に各トラックでどちらを行うか説明します。"

[[privacy]]
title = "結果を開き直して確認します。"
body = "末尾や音声が欠けてもMP4は作れてしまいます。そこで完成したファイルを同じリーダーで開き直し、元の長さ、H.264映像、必要な音声を確かめます。メモリから再生し、保存前に見られます。"

[[privacy]]
title = "端末に必要な時間とメモリ。"
body = "コピーは構造の読み込みと書き出し時の読み込みだけで速く進みます。再エンコードは端末によります。ハードウェアエンコーダーがあれば通常は動画の長さより速く、なければ長くなります。4Kの長い動画には時間が必要です。入力は分割して読み、結果は保存までメモリに保持します。いつでもキャンセルできます。"

[[privacy]]
title = "読める形式と、扱わない形式。"
body = "WebMとMKVのVP8、VP9、AV1、H.264、HEVC映像とOpus、Vorbis、AAC、MP3、FLAC音声、MP4・MOV・M4VのH.264、HEVC、VP9、AV1映像とAAC音声を扱います。ブラウザが映像を読めない場合は名前を示して拒否し、音声だけ読めない場合は示して除きます。AVI、WMV、FLV、MPEG-2は対応しません。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから読み込みます。動画、フレーム、名前、サイズ、長さ、元の形式は渡しません。読み込み、エンコード、書き出しのコードはこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "ヘッダーの「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、Google Fontsの文字を使います。訪問を報告しないリンクで、利用者や動画の情報は渡しません。クリックするまで何も起こらず、移動先は別のサイトです。"

[[privacy]]
title = "オフラインでも動きます。"
body = "通信を切ってもすべての機能が動きます。動画を別の場所へ送って変換するツールなら止まるので、簡単な証明になります。"

[[howto]]
title = "動画を選びます。"
body = "WebM、MKV、MOV、M4V、MP4を1つずつ扱います。ブラウザがディスクから直接読み、長さ、容量、大きさ、コンテナを表示します。"

[[howto]]
title = "2つの説明文を読みます。"
body = "映像と音声のそれぞれについて、そのままコピーするか、何から何へ再エンコードするかを説明します。ファイルから決まるので、設定は不要です。音声を読めない場合や無音で送りたい場合は除けます。"

[[howto]]
title = "変換し、確認結果を読みます。"
body = "使える部分をコピーし、必要な部分だけフレームごとに再エンコードして進捗を表示します。完成したファイルを開き直し、元の長さ、H.264映像、必要な音声を確認します。結果はメモリから再生できます。"

[[faq]]
q = "画質は落ちますか？"
a = "コピーするH.264フレームとAACパケットはバイト単位で同じです。H.264入りMKVなら同じ映像のMP4になります。VP9、VP8、AV1、HEVC映像やOpus、Vorbis、MP3、FLAC音声の再エンコードには1世代の変化があります。元のビットレートに合わせて変化を抑えますが、原本は残してください。"

[[faq]]
q = "小さいHEVCやVP9をMP4に残さないのはなぜですか？"
a = "開ける場所を広げるためです。HEVCには端末のライセンスが必要で、MP4内のVP9やAV1を拒否するフォームやメールソフトも多くあります。H.264とAACの組み合わせを書き、その画質の変化を事前に説明します。"

[[faq]]
q = "WebMの画面録画の音声は残りますか？"
a = "はい。ブラウザのOpus音声はMP4に入れられないので、AAC、160kbit/sへ再エンコードします。マイク音声には十分な値です。VP8やVP9映像はH.264にします。端末で処理し、開き直して長さと音声を確かめます。"

[[faq]]
q = "MOVはMP4と違うのですか？"
a = "設計はほぼ同じです。H.264とAAC入りのMOVなら、数秒で再エンコードせずコンテナだけ変えます。拡張子で拒否するフォームへの対応です。iPhoneのHEVC入りMOVは違い、ブラウザがHEVCを読める場合にH.264へ再エンコードします。"

[[faq]]
q = "どのファイルを読めますか？"
a = "WebM・MKVのVP8、VP9、AV1、H.264、HEVC映像とOpus、Vorbis、AAC、MP3、FLAC音声、MP4・MOV・M4VのH.264、HEVC、VP9、AV1映像とAAC音声です。映像が読めなければ変換を止め、音声が読めなければ除いて伝えます。AVI、WMV、FLV、MPEG-2は扱いません。"

[[faq]]
q = "どれくらい時間がかかりますか？"
a = "コピーは約2回読む時間で、通常は数秒です。再エンコードは端末によります。ハードウェアエンコーダーがあれば通常は動画の長さより速く、ない場合は長くなります。長い4Kは時間が必要です。進捗を表示し、キャンセルすると直ちに止まって書き出しません。"

[[faq]]
q = "動画は送信されますか？"
a = "いいえ。ブラウザと端末で読み、必要な部分だけデコードしてエンコードし、書き出します。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはありません。通信を切って確認できます。大きなファイルでは送信を省くことも速さにつながります。"

[[faq]]
q = "電話でも動きますか？"
a = "動画のデコードとエンコードに対応するブラウザなら動きます。電話のハードウェアエンコーダーは高速ですが、結果をメモリに保持するため、長い動画では足りない場合があります。先に<a href=\"../trim-video/\">動画トリミングツール</a>で短くするか、パソコンで変換してください。"

[[faq]]
q = "容量制限や料金はありますか？"
a = "入力は分割して読むのでメモリより大きくても使えますが、結果はメモリに保持し、ここで書き出すMP4は4GB未満に限られます。無料で、アカウント、ログイン、お試し期間はありません。広告で運営しますが、動画の情報は渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。一度開いて通信を切っても動きます。動画を別の場所へ送って変換するツールなら止まるので、送信しないことの確認になります。"

