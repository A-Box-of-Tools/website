#
# 画像圧縮 - Japanese.
#
# Overrides for tools/compress-image/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Japanese has no [slugs] table, so every href below is the English one and is
# copied through untouched. See locales/ja/locale.toml for why.
#

name = "画像圧縮ツール"
# 後半の span が検索される語です。英語版と同じく、道具の名前が大きいほう。
heading = "画像圧縮<span class=\"h1-kw\">｜サイズを指定して圧縮</span>"
tagline = "サイズを指定するだけ。あとは自動で探します。"

title = "画像を指定サイズに圧縮｜無料・アップロード不要"
description = "JPEG・PNG・WebPを100KBや2MBなど、狙ったサイズちょうどに圧縮します。処理はすべてブラウザの中。アップロードなし、登録なし、オフラインでも動きます。"
og_title = "画像を、自分で決めたサイズまで圧縮する"
og_description = "目標サイズを指定すると、そこに収まる中でいちばん画質を落とさない設定を探し出し、その代償を数値で示します。処理は手元の端末で行われ、何もアップロードされません。"
og_image_alt = "画像圧縮ツール - サイズを指定しても画質は守る"

pledge = """
    圧縮を行うのは、お使いのブラウザと手元のハードウェア、そしてブラウザに\
    最初から入っているエンコーダーです。このツールにはネットワーク機能が\
    一切ありません。取りに行く先も、送る先もありません。仮に送ろうとしても、\
    このページの向こう側に画像を受け取るサーバーが存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      写真を圧縮してみてください。画像もサムネイルもファイル名も、選んだ\
      ファイルの1バイトも、どのリクエストにも載りません。回線を抜いてから\
      圧縮してみるのでも構いません。"""

read_first = """
、どこまで画質を使うかを決める探索については\
      <code>src/compress.js</code>、「見た目の一致度」の数値の裏にある比較に\
      ついては<code>src/measure.js</code>です。"""

howto_heading = "画像を指定サイズに圧縮する手順"

card = """
            必要なサイズを指定するだけです。100KBでも2MBでも、そこに届く中で\
            いちばん軽い圧縮を探し出します。"""

[words]
plural = "画像"
choose = "画像"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "容量制限なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[privacy]]
title = "画像には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も\
      <code>XMLHttpRequest</code>も<code>sendBeacon</code>もありません。圧縮の\
      実体は<code>canvas.toBlob</code>、つまりブラウザにすでに入っている\
      エンコーダーです。"""

[[privacy]]
title = "数値は測ったもので、報告したものではありません。"
body = """
サイズも、画質の数値も、SSIMによる比較も、すべてこのページの中で計算して\
      表示しています。ファイル名もサイズも件数も結果も運ぶような独自の解析\
      イベントは、このリポジトリのどこにもありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、画像に関する情報は渡されません。ファイルを読み、\
      圧縮し、測るコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が\
      存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
選択欄にドロップするか、手で選んでください。ブラウザがディスクから直接\
      読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "指定されたサイズを打ち込みます。"
body = """
写真を何度も突き返してくるアップロード欄なら100KB、応募フォームなら\
      500KB、速く表示したいページなら2MB。よく使う4つはボタンになっています。"""

[[howto]]
title = "「目標サイズまで圧縮」を押します。"
body = """
収まる範囲でいちばん高い画質へ絞り込みながら、各画像が何度もエンコード\
      されます。すでに目標を下回っているものには、まったく手をつけません。"""

[[howto]]
title = "代償を確かめて、ダウンロードします。"
body = """
どの結果にも、どの形式で書き出したか、画質はいくつか、寸法が変わったか、\
      測ってみて元とどれだけ一致しているかが表示されます。「比較」を押すと\
      2枚を並べて見られます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。読み込みも圧縮も計測も、お使いのブラウザが手元の\
        ハードウェア上で、最初から入っているJPEG・PNG・WebPのエンコーダーを\
        使って行います。このツールにはネットワーク機能が一切なく、何も取りに\
        行かず、何も送りません。ページの<code>Content-Security-Policy</code>\
        には接続してよいアドレスがすべて挙がっていますが、そのどれも当サイトの\
        ものではありません。"""

[[faq]]
q = "どうやってサイズちょうどに合わせているのですか？"
a = """
        試すことによってです。画質の設定値をバイト数に換算する式は存在しません。\
        画像によって答えが完全に変わるからです。そこでこのツールは画像を何度も\
        エンコードして答えを探します。画質の上限から始めて半分ずつ範囲を詰めて\
        いくので、収まる中で最高の画質がおよそ8回のエンコードで見つかります。\
        ページに出る数値はすべて実際に書き出されたファイルのサイズで、推定値では\
        ありません。"""

[[faq]]
q = "ここでいう「劣化は最小限」とは具体的に何ですか？"
a = """
        3つあります。1つ目、すでに目標を下回っている画像は再エンコードせず、\
        1バイトも変えずにそのまま通します。2つ目、解像度より先に画質を使い、\
        圧縮のノイズが見え始める下限までしか下げません。そこを超える場合は\
        画像そのものを小さくして画質を戻します。荒れたピクセルが多いより、\
        きれいなピクセルが少ないほうが見た目は良いからです。3つ目、収まる結果が\
        見つかったあとは予算を使い切るまで上へ押し戻すので、500KBと指定して\
        300KBのファイルが返ってくることはありません。"""

[[faq]]
q = "結果に出ているSSIMとPSNRは何の数字ですか？"
a = """
        圧縮の代償を測った数字です。書き出した結果を読み直し、元の画像と比べて\
        います。SSIMは局所的な明るさ・コントラスト・構造を比べるもので、変わった\
        ピクセルを数えるより、人の目が気にする点にずっと近い指標です。おおむね\
        0.98を超えると、並べても見分けがつきにくくなります。PSNRは昔ながらの\
        デシベル値です。どちらも手元の端末で計算し、どちらも表示します。劣化が\
        小さいという主張を、言いっぱなしにせず確かめられるようにするためです。"""

[[faq]]
q = "読み書きできる形式は何ですか？"
a = """
        読み込めるのはブラウザが解読できるものすべてで、実際にはJPEG、PNG、\
        WebP、GIF、BMP、そして最近のたいていのブラウザではAVIFです。書き出しは\
        JPEG、PNG、WebPで、ブラウザが備えているエンコーダーがそれだからです。\
        「自動」では届いたファイルの形式をそのまま保ち、保つと縮小や目に見える\
        画質低下が避けられない場合にだけWebPへ切り替えます。"""

[[faq]]
q = "PNGがあまり小さくならないのはなぜですか？"
a = """
        PNGが可逆だからです。回すべき画質のつまみがありません。PNGを小さくする\
        手はピクセルを減らすか色を減らすかしかないので、PNGを選んだ場合、この\
        ツールは縮小だけで目標に近づけます。写真であればJPEGかWebPのほうが、\
        見て問題ないとわかる画質のまま目標にずっと近づきます。ロゴや透過のある\
        スクリーンショットなら、JPEGが白で埋めてしまう透過をWebPは保ちます。"""

[[faq]]
q = "圧縮するとEXIFやGPSの情報は消えますか？"
a = """
        副作用として消えます。圧縮とは画像を一度ピクセルに戻し、そのピクセルを\
        もう一度エンコードすることで、ピクセルで埋まったキャンバスはタグを\
        持ちません。ですから位置情報もカメラの機種も撮影日時も、その他一切、\
        新しいファイルには書き込まれません。メタデータだけ消して画像には\
        触れたくない場合は、\
        <a href="../exif-editor/">EXIFビューアー・削除ツール</a>\
        をお使いください。圧縮し直さずに、入れ物だけを書き直します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在せず、処理が手元の端末で起きているからです。このサイトには広告が\
        あり、それが費用を賄っています。広告に画像の情報が渡されることは\
        ありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        何もアップロードされていないことを示す、いちばん簡単な方法でもあります。\
        圧縮のために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まる\
        からです。"""

[schema]
description = "JPEG・PNG・WebPの画像を、指定したサイズまで圧縮します。目標に収まる中で最も高い画質を探し、画質だけでは届かないときにだけ縮小し、結果を元の画像と比較して測ります。すべてブラウザの中で動作し、アップロードはありません。"
features = [
  "推測するしかない画質の数値ではなく、自分で決めた目標ファイルサイズに合わせて圧縮します",
  "できる限り元の解像度を保ち、画質だけでは目標に届かないときにだけ縮小します",
  "予算を使い切ります。結果は目標のはるか下ではなく、すぐ下に着地します",
  "結果を元の画像とSSIMとPSNRで比較して測ります",
  "すでに目標を下回っているファイルには一切手をつけません",
  "JPEG、PNG、WebPに対応し、形式は自動でも選べます",
  "まとめて処理でき、結果は1つのzipにまとまります",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここに画像をドロップ"
hint = "クリックして選ぶこともできます。JPEG、PNG、WebP、その他ブラウザが開けるものすべてに対応"
