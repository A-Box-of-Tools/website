# 画像圧縮 - Japanese.
#
# Overrides for tools/compress-image/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Japanese has no [slugs] table, so every href below is the English one and is
# copied through untouched. See locales/ja/locale.toml for why.
#

name = "画像圧縮ツール"
# 後半の span が検索される語です。英語版と同じく、道具の名前が大きいほう。
heading = "画像圧縮 <span class=\"h1-kw\">&mdash; 指定したサイズちょうどまで</span>"
tagline = "サイズを言うだけ。あとは勝手に探します。"

title = "画像を指定サイズに圧縮 &mdash; 無料・アップロード不要"
description = "JPEG・PNG・WebP を100KB、2MBなど狙ったサイズちょうどに圧縮します。処理はすべてブラウザ内。アップロードなし、登録なし、オフラインでも動きます。"
og_title = "画像を、自分で決めたサイズまで圧縮する"
og_description = "目標サイズを指定すると、そこに収まる中でいちばん画質を落とさない設定を探し出し、その代償を数値で示します。処理はあなたの端末で行われ、何もアップロードされません。"
og_image_alt = "画像圧縮ツール - サイズを指定しても画質は守る"

pledge = """
    圧縮はあなた自身のブラウザの中で、あなた自身のハードウェアを使い、\
    ブラウザに最初から入っているエンコーダーで行われます。このツールには\
    ネットワーク機能が一切ありません &mdash; 取りに行く先も、送る先も\
    ありません &mdash; 仮に送ろうとしても、このページの向こう側に画像を\
    受け取るサーバーは存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevTools を開いてネットワークタブを見ながら\
      写真を圧縮してみてください。画像も、サムネイルも、ファイル名も、選んだ\
      ファイルの1バイトも、どのリクエストにも載りません。あるいは回線を抜いて\
      から圧縮してみてください。"""

read_first = """
、どこまで画質を使うかを決める探索については
      <code>src/compress.js</code>、「見た目の一致度」の数値の裏にある比較に\
      ついては <code>src/measure.js</code> です。"""

howto_heading = "画像を指定サイズに圧縮する手順"

card = """
            必要なサイズを言うだけ &mdash; 100KB、2MB、いくつでも &mdash;
            そこに届く中でいちばん軽い圧縮を探し出します。"""

[words]
plural = "画像"
choose = "画像"
analytics_extra = """、このツールが\
  算出したサイズや画質の数値も送られません"""

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "容量制限なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[privacy]]
title = "画像には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 <code>src/</code> の\
      どこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。圧縮の実体は
      <code>canvas.toBlob</code> &mdash; あなたのブラウザにすでに入っている\
      エンコーダーです。"""

[[privacy]]
title = "数値は測ったものであって、報告したものではありません。"
body = """
 サイズも、画質の数値も、
      SSIM による比較も、すべてこのページの中で計算してあなたに見せています。\
      ファイル名も、サイズも、件数も、結果も運ぶような独自の解析イベントは、\
      このリポジトリのどこにもありません。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたの画像に関する情報は渡されません。ファイルを読み、\
      圧縮し、測るコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切ってもこのツールは何も変わりません。\
      もともと通信する段階が存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
 選択欄にドロップするか、手で選んでください。\
      ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られる\
      ことはありません。"""

[[howto]]
title = "指定されたサイズを打ち込みます。"
body = """
 写真を何度も突き返してくる\
      アップロード欄なら100KB、応募フォームなら500KB、速く表示したいページなら
      2MB。よく使う4つはボタンになっています。"""

[[howto]]
title = "「目標サイズまで圧縮」を押します。"
body = """
 収まる範囲でいちばん高い画質へ\
      絞り込みながら、各画像が何度もエンコードされます。すでに目標を下回って\
      いるものは、まったく手をつけずに残します。"""

[[howto]]
title = "代償を確かめて、ダウンロードします。"
body = """
 どの結果にも、どの形式で書き出したか、\
      画質はいくつか、寸法が変わったか、測ってみて元とどれだけ一致しているかが\
      表示されます。「比較」を押すと2枚を並べて見られます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。ファイルの読み込みも圧縮も計測も、あなた自身のブラウザが\
        あなた自身のハードウェア上で、ブラウザに最初から入っている JPEG・PNG・
        WebP のエンコーダーを使って行います。このツールにはネットワーク機能が\
        一切なく &mdash; 何も取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "どうやってサイズちょうどに合わせているのですか？"
a = """
        試すことによってです。画質の設定値をバイト数に換算する式は存在しません
        &mdash; 画像によって完全に変わるからです &mdash; そこでこのツールは\
        画像を何度もエンコードして答えを探します。画質の上限から始めて半分ずつ\
        範囲を詰めていくので、収まる中で最高の画質がおよそ8回のエンコードで\
        見つかります。ページに出る数値はすべて実際に書き出されたファイルの\
        サイズで、推定値ではありません。"""

[[faq]]
q = "ここでいう「劣化は最小限」とは具体的に何ですか？"
a = """
        3つあります。1つ目、すでに目標を下回っている画像は再エンコードせず、
        1バイトも変えずにそのまま通します。2つ目、解像度より先に画質を使い、\
        圧縮のノイズが見え始める下限までしか下げません &mdash; そこを超える\
        場合は画像そのものを小さくして画質を戻します。荒れたピクセルが多いより、\
        きれいなピクセルが少ないほうが見た目は良いからです。3つ目、収まる結果が\
        見つかったあとは予算を使い切るまで上へ押し戻すので、500KBと指定して
        300KBのファイルが返ってくることはありません。"""

[[faq]]
q = "結果に出ている SSIM と PSNR は何の数字ですか？"
a = """
        圧縮の代償を測った数字です。結果を読み直して元の画像と比べています。
        SSIM は局所的な明るさ・コントラスト・構造を比べるもので、変わった\
        ピクセルを数えるより、人の目が気にする点にずっと近い指標です。おおむね
        0.98を超えると、並べても見分けがつきにくくなります。PSNR は昔ながらの\
        デシベル値です。どちらもあなたの端末で計算され、どちらも表示されます。\
        劣化が小さいという主張を、言いっぱなしにせず確かめられるようにする\
        ためです。"""

[[faq]]
q = "読み書きできる形式は何ですか？"
a = """
        読み込みはブラウザが解読できるものすべて、実際には JPEG、PNG、WebP、
        GIF、BMP、そして &mdash; 最近のたいていのブラウザでは &mdash; AVIF です。\
        書き出しは JPEG、PNG、WebP です。ブラウザが備えているエンコーダーが\
        それだからです。「自動」では届いたファイルの形式をそのまま保ち、\
        保つと縮小や目に見える画質低下が避けられない場合にだけ WebP へ\
        切り替えます。"""

[[faq]]
q = "PNG があまり小さくならないのはなぜですか？"
a = """
        PNG が可逆だからです。回すべき画質のつまみがありません。PNG を小さく\
        する手は、ピクセルを減らすか色を減らすかしかないので、PNG を選んだ場合\
        このツールは縮小だけで目標に近づけます。写真であれば、JPEG か WebP の\
        ほうが、見て問題ないとわかる画質のまま目標にずっと近づきます &mdash;
        ロゴや透過のあるスクリーンショットであれば、JPEG が白で埋めてしまう\
        透過を WebP は保ちます。"""

[[faq]]
q = "圧縮すると EXIF や GPS の情報は消えますか？"
a = """
        副作用として消えます。圧縮とは画像をピクセルに戻し、そのピクセルを\
        もう一度エンコードすることで、ピクセルで埋まったキャンバスはタグを\
        持ちません。ですから位置情報もカメラの機種も撮影日時もその他一切も、\
        新しいファイルには書き込まれません。メタデータだけ消して画像には\
        触れたくない場合は、代わりに
        <a href="../exif-editor/">EXIF ビューアー &amp; 削除ツール</a>
        をお使いください &mdash; 圧縮し直さずに、入れ物だけを書き直します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在しないからです &mdash; 処理はあなた自身の端末で起きています。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        画像に関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。圧縮のために画像をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

[schema]
description = "JPEG・PNG・WebP の画像を、指定したサイズまで圧縮します。目標に収まる中で最も高い画質を探し、画質だけでは届かないときにだけ縮小し、結果を元の画像と比較して測ります。すべてブラウザ内で動作し、アップロードはありません。"
features = [
  "推測するしかない画質の数値ではなく、自分で決めた目標ファイルサイズに合わせて圧縮します",
  "できる限り元の解像度を保ち、画質だけでは目標に届かないときにだけ縮小します",
  "予算を使い切ります。結果は目標のはるか下ではなく、すぐ下に着地します",
  "結果を元の画像と SSIM と PSNR で比較して測ります",
  "すでに目標を下回っているファイルには一切手をつけません",
  "JPEG、PNG、WebP に対応し、形式は自動でも選べます",
  "まとめて処理でき、結果は1つの zip にまとまります",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここに画像をドロップ"
hint = "クリックして選ぶこともできます &mdash; JPEG、PNG、WebP、その他ブラウザが開けるものすべて"
