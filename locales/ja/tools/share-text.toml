[[privacy]]
title = "内容は読む相手へ行き、ほかのどこへも行きません。"
body = """
テキストとファイルはWebRTCデータチャネルを通ります。あなたのブラウザと各読者のブラウザを直接つなぐDTLS暗号化接続で、この経路にサーバーはありません。ローカルネットワークモードは、公開のアドレス探索やインターネット中継を使わずにブラウザ自身のネットワークアドレスを使います。VPNやブラウザのネットワークポリシーによって経路が変わるため、特定の建物内に留まるという保証ではありません。通常モードでは、直接接続できない読者が自分のページで暗号化中継を選べます。中継は同じ暗号文を転送するだけで、読むことはできません。"""

[[privacy]]
title = "仲介役とは何か、そして見えているもののすべて。"
body = "直接接続には紹介が必要です。この開始ページは発見可能なローカルリンク名のために仲介役へのWebSocketを自動で開きます。共有を始めると共有用にもう1本開き、読者は紹介用の接続を1本使います。サーバーはリンク名の読者と共有者を引き合わせ、数キロバイトの接続交渉を転送します。ストレージには書き込まず、部屋と検索の項目は開いた接続とともに終わります。名前、接続時刻、IPアドレス、接続交渉は見えますが、テキスト、ファイル、承認の判断、非公開の自己紹介は見えません。一覧は、同じ公開IPアドレスを使う接続中の共有者の名前を表示します。共有VPNや通信事業者のアドレス共有では別のネットワークも含まれ、近くの端末が別の公開アドレスなら見つからないことがあります。全ソースはリポジトリにあります。Cloudflareは接続ログを7日間保持し、記録するのはアドレス、リンク名、時刻で、内容は含みません。"

[[privacy]]
title = "何も保存されないので、タブを閉じることが削除そのものです。"
body = """
共有はあなたのタブが開いている間だけ存在します。閉じれば新しく来た人には何も見つからず、読んでいた人は自分の写しが消えるのを目にします。ただし誰かがその前にコピーやダウンロードしたものはその人のものです。手渡したものすべてがそうであるように。入力した下書きは次回も残るように、あなた自身のブラウザのストレージにだけ置かれます。使い切りに印を付ければ、どこにも残りません。"""

[[privacy]]
title = "リンク名がアドレスで、非公開が鍵です。"
body = "名前を知っているか推測した人は、その共有を開けます。発見可能なローカル共有は、同じ公開IPアドレスを使うほかのブラウザに名前を表示するため、そのグループ内で名前は公開されます。機密性のある内容では非公開を有効にしてください。標準で有効になっており、各読者が暗号化された直接チャネルで自己紹介し、あなたが承認するまで内容は送られません。"

[[privacy]]
title = "直接接続は、互いに相手のアドレスを見せ合います。"
body = """
それがピアツーピアの意味で、読む側は起きる前にそれを知らされます。共有リンクを開くことは、誰かが共有中かを仲介役に尋ねるだけです。その後ページは、接続すると互いのIPアドレスが見えるようになるとはっきり述べ、クリックを待ちます。そのクリックまで、共有する側は読む側の存在すら知りません。"""

[[privacy]]
title = "Googleが読み込むもの、渡らないもの。"
body = """広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来ます。どちらにも、テキストも、ファイルも、その名前やサイズも、誰が接続したかも渡りません。例外はこのページのアドレスそのものです。読み手のリンクにはリンク名が含まれ、広告スクリプトはそのアドレスを読み取ります。秘密にしておきたい共有には、プライベートの切り替えを使ってください。内容に触れるすべての行はこのオリジンから配信され、リポジトリにあります。"""

[[howto]]
title = "テキストを書くか、ファイルを添付します。"
body = """
エディタが共有そのものです。読む側が接続した瞬間にそこにあるものが、その人の受け取るもので、その後の変更は入力と同時に、接続中の読む側へライブで届きます。ファイルは同じチャネルを通り、1つ200&nbsp;MBまで。読む側は一覧を見て、求めたものだけを受け取るので、要らないファイルに誰かの帯域が使われることはありません。"""

[[howto]]
title = "テキストに書式がふさわしければMarkdownをオンに。"
body = """
スイッチは1つだけ。見出し、太字、リスト、コード、リンクが、入力と同時にエディタの隣でライブ表示され、読む側には既定で整形済みの表示が届きます。原文に戻す切り替えも付いています。レンダラーはこのページと一緒に届き、すべてをエスケープします。共有されたテキストは、誰が書いたものであれ、読む側のマシンでスクリプトにはなれません。"""

[[howto]]
title = "リンクに名前を付けるか、提案のままにします。"
body = "名前がアドレスです。<code>brave-otter-42</code>なら部屋の向こうへ声で伝えたり、電話で読んだり、ホワイトボードから入力したりできます。発見可能なローカル共有は名前を一覧にするので、機密性のある内容では非公開を有効にしてください。リンクだけで共有する場合は、推測しにくい名前も役立ちます。使用中の名前は拒否され、共有を止めると空きます。"

[[howto]]
title = "誰を入れるかを決めます。"
body = """
非公開が既定です。読む側はそれぞれ自己紹介を求められます。名前でも、ヒントでも、あなたが分かるものなら何でも。あなたはそのメッセージを、読ませるボタンと断るボタンと一緒に見ます。自己紹介は直接チャネルを通るので、誰がノックしたのかは仲介役ですら知りません。チェックを外せば、名前を知る誰もが読める公開の共有になります。"""

[[howto]]
title = "共有を始めて、タブを開けたままにします。"
body = """
タブがサーバーです。共有はタブが開いて起きている間だけ届き、その先は一瞬もありません。ノートパソコンを閉じても終わります。リンクをコピーするか、名前を口で伝えるだけでも構いません。読む側はこのページのアドレスの末尾に<code>#name</code>と打てばいいのです。ローカルネットワークモードではリンクをコピーしてください。名前の前に<code>?local=1</code>が入ります。別のモードを使う読者は、共有者のモードで再試行する前に選択する必要があります。"""

[[howto]]
title = "向こう側では：まず同意、それからノック。"
body = """
リンクを開いた人は誰かが共有中だと知らされ、直接接続では互いのネットワークアドレスが見えるようになると警告され、自分で選んだときにだけ接続します。非公開の共有なら自己紹介をして、あなたを待ちます。受け取ったものはあなたが書き換えるそばからライブで変わり、タブを閉じれば消えます。"""

[[faq]]
q = "何かが、どこかへアップロードされますか？"
a = "テキストやファイルはアップロードされません。暗号化されたWebRTCチャネルで、あなたのブラウザから各読者のブラウザへ直接届きます。サーバーが運ぶのは紹介と公開したローカルリンク名で、内容は運びません。部屋と検索の項目は開いた接続とともに終わります。Cloudflareが7日間保持する接続ログにはメタデータが含まれ、内容は含まれません。"

[[faq]]
q = "では、よりによってこのサイトで、なぜこの道具はサーバーと話すのですか？"
a = "ブラウザ同士は自力で見つかりません。仲介役が<code>brave-otter-42</code>を入力した人とその名前で共有する人を引き合わせ、接続交渉を運びます。このページの<code>Content-Security-Policy</code>に名前があり、ソースは同じリポジトリにあります。また、同じ公開IPアドレスを使うブラウザに公開したローカルリンク名を一覧にします。内容を保持せず、暗号化された直接チャネルを読むことはできません。"

[[faq]]
q = "そのサーバーには、正確には何が見えるのですか？"
a = "使用中のリンク名、共有者と読者の接続や切断の時刻、IPアドレス、接続交渉が見えます。検索一覧は、サーバーが見た公開IPアドレスで公開リンク名をグループ化します。テキスト、ファイル、その名前やサイズ、非公開の承認、自己紹介は見えません。これらはエンドツーエンドで暗号化された直接チャネルを通ります。Cloudflareは接続ログを7日間保持し、記録するのはリンク名、アドレス、時刻で、内容は含みません。"

[[faq]]
q = "タブを閉じるとどうなりますか？"
a = """
        共有はあらゆる場所で同時に終わります。リンクは1、2秒で使えなくなり、ページを開いたままの読む側は、共有が終わったという知らせと共に自分の写しが消えるのを目にします。これはサーバーへの削除依頼ではありません。消すべきサーバー上の写しが存在しないのです。共有が存在した唯一の場所がそのタブで、閉じることが後片付けのすべてです。"""

[[faq]]
q = "読む側は、私が共有したものを持ち続けられますか？"
a = """
        共有が開いている間は、はい。それが共有するということです。読む側はテキストをコピーでき、ファイルをダウンロードでき、持っていったものはその人のものです。ほかのどんな方法で手渡していても同じだったように。終了が保証するのは未来です。新しく来る人は届かず、開いたページは表示をやめます。すでに届いたものを取り戻せる道具はなく、このページはできるふりをしません。"""

[[faq]]
q = "非公開モードとは何ですか？"
a = """
        既定の設定です。やって来る読む側はそれぞれ、共有が非公開だと知らされて自己紹介を求められます。あなたはそのメッセージを——「私だよ、スタンドアップのアリス」——読ませるボタンと断るボタンと一緒に見て、決めるまで何も送られません。自己紹介はすでに暗号化された直接チャネルを通るので、誰がノックしたのかも、あなたが何を決めたのかも、サーバーには永遠に分かりません。共有前にチェックを外せば、公開の共有になります。"""

[[faq]]
q = "なぜ読む側に私のIPアドレスが見えるのですか？"
a = """
        接続が本当に直接だからです。直接接続は2つのアドレスの間を走り、電話と同じように、両端は必然的に相手のアドレスを知ります。読む側はどんな接続も生まれる前に警告され、自分で選んだときにだけ接続します。それまであなたは、リンクが開かれたことすら知りません。この交換が合わない共有なら、代わりはサーバー経由で中継するサービスです。逆向きの交換と引き換えに。"""

[[faq]]
q = "ファイルはどこまで大きくでき、速さは？"
a = """
形式を問わず1ファイル最大200&nbsp;MBで、速度は2つの接続の遅いほうに合わせられます。動作するローカル接続なら、そのネットワークの速度で転送します。VPNやブラウザの経路設定によって経路が変わることがあります。読者はファイルごとに要求するので、大きな添付ファイルも誰かが要求するまで転送されません。"""

[[faq]]
q = "オフラインで動きますか？"
a = """
        正直に言えば半分です。エディタは動きます。ページは読み込まれ、下書きはそこにあり、Markdownは表示され、書くのも保存するのもネットワークなしでできます。共有は動きませんし、動きようがありません。他人のブラウザへ届くことはネットワークの行為で、引き合わせには仲介役が要ります。このサイトで、役目そのものがオフラインでは不可能な唯一の道具です。そうでないふりは不誠実でしょう。"""

[[faq]]
q = "つながらなかったら？"
a = """
以下の中継の案内は通常の接続モードにのみ適用されます。ブラウザの組の大半は、引き合わされれば直接届きます。少数は届かず、たいていは片側が携帯電話会社のアドレス共有ネットワークにいるか、厳しい社内ネットワークの内側にいるときです。このページは決してこっそり中継に切り替えたりしません。それはこの道具が何であるかを黙って変えてしまうからです。20秒後に、直接接続は成立しなかったとはっきり伝え、読む側にひとつ提案します。Cloudflareが運営する中継で、二つのブラウザの間で暗号化されたバイトを転送するだけで、鍵が両端を離れることはないので読むことはできません。読む側は中継が何を見るか——直接接続と同じく両方のアドレス——を知らされたうえで、自分のページで自ら選びます。そこにも何も保存されません。あなたの側は変わりません。読む側がVPNの内側にいるときと同じように、あなたのブラウザは引き続きその一人だけに送ります。ローカルネットワークモードでは中継を提示しません。両方の端末が同じWi-Fiまたはイーサネットを使っていることと、ゲストネットワークの端末分離、ファイアウォール、VPNが接続を妨げていないことを確認してください。"""

[[faq]]
q = "誰でも何でも共有できるのに、Markdownの表示は安全ですか？"
a = """
        その問いこそ、レンダラーがライブラリではなくこのページのソースの80行である理由です。どんなタグを出す前にもすべての文字がエスケープされ、生成されうるのは無害なタグの固定された一組だけで、リンクが受け付けるのは<code>http</code>、<code>https</code>、<code>mailto</code>のみ。<code>javascript:</code>のリンクはただの文字のまま残ります。共有されたテキストは、誰が書いたものであれあなたのマシンでスクリプトにはなれず、その80行は自分で読めます。"""

[[faq]]
q = "2人が同じ名前で共有できますか？"
a = """
        同時には無理です。名前ごとに生きている共有は1つ、仲介役で強制されます。2番目に来た人は断られ、別の名前を選ぶよう求められます。共有が終わった瞬間に名前はまた空きます。つまり、取っておいたリンクの鮮度はその先の共有の鮮度でしかありません。同じ名前が来週には別の誰かのものかもしれないのです。リンクは人のものではなく、瞬間のものとして扱ってください。"""

[[faq]]
q = "無料ですか？アカウントは要りますか？"
a = """
        無料です。アカウントも登録もなく、挙げるほどの制限もありません。共有1つにつき同時に16人まで読めます。サイトには広告が載り、それが費用を賄っています。広告にはこのページが共有するものについて何ひとつ渡らず、仲介役は何も保存せずほとんど何もしないからこそ、無料プランに余裕で収まります。"""

[[faq]]
q = "ローカルネットワークでファイルを共有できますか？"
a = "はい。開始前に「ローカルネットワーク——インターネット中継なし」を選び、両方の端末を同じWi-Fiまたはイーサネットにつないで、読者にリンクをコピーしてください。リンクにはモードが含まれます。別のモードを使う読者は、共有者のモードで再試行する前に明示的に選ぶ必要があります。ブラウザ同士の紹介には引き続きインターネットが必要です。このモードは公開のアドレス探索を使わず、インターネット中継へ切り替わりません。VPNやブラウザのネットワークポリシーで経路が変わったり接続できなかったりするため、この設定はデータが建物内に留まる証明ではありません。承認が必要な非公開設定は引き続き標準で有効になり、ファイルの上限も1つにつき200&nbsp;MBのままです。1回の共有には最大256ファイルを添付できます。このモードでは発見可能が標準で有効です。相手のブラウザで開始ページを開き、この接続の一覧からあなたの名前を選べます。発見可能を外すとリンクのみで共有できます。共有ネットワークでは非公開を有効にしてください。"

[[faq]]
q = "一覧はローカル共有をどう見つけますか？"
a = "この一覧には、あなたと同じ公開IPアドレスを使うブラウザのリンク名が表示されます。通常は同じルーターですが、共有VPNや通信事業者によるアドレス共有では別のネットワークも含まれます。IPv6や経路の違いで近くの端末が見つからないこともあります。インターネットが必要です。共有を開いても接続前に確認され、非公開の共有には引き続き共有者の承認が必要です。ローカル共有は標準で公開されます。発見可能を外すとリンクのみで共有できます。名前を選ぶと同意ページが開き、自動接続や非公開の承認を省くことはありません。一覧が保持するのは、共有者が接続している間のリンク名だけで、テキスト、ファイル名、ファイルの内容は保持しません。検索を利用できなくても共有リンクは使えます。"

[schema]
description = "テキストとファイルを、直接のエンドツーエンド暗号化WebRTC接続でブラウザからブラウザへ共有。声で伝えられるリンク名、入力と同時のライブ更新、Markdown、読む人ごとの承認。どのサーバーも何も保存せず、共有する側がタブを閉じれば共有は終わります。"
features = ["テキストとファイルはブラウザからブラウザへ、エンドツーエンド暗号化で、サーバーを経由せずに届く", "共有は開いたタブの中に生きる。閉じれば終わり、読む側のページも空になる", "声で伝えられるリンク名 - brave-otter-42 -、編集可能、名前ごとに生きた共有は1つ", "既定で非公開。読む側はそれぞれ自己紹介し、共有する側が入れるか断るかを決める", "接続が生まれる前に読む側が同意し、IPが見えるようになることをはっきり知らされる", "ライブ更新。変更は入力と同時に、接続中の読む側へ届く", "両側で切り替えられるMarkdown。先にエスケープする内蔵レンダラーで表示", "ファイルは1つ200 MBまで。求めに応じて受け取り、ファイルごとに進捗を表示", "下書きは共有する側のブラウザにだけ残る。使い切りなら、どこにも残らない", "サーバー部分の全体が、リポジトリで公開された保存を持たない仲介役1つ", "公開のアドレス探索やインターネット中継を使わない任意のローカルネットワークモード", "同じ公開IPアドレスを使うブラウザにローカルリンク名を表示し、接続前の同意と非公開の承認を維持"]
