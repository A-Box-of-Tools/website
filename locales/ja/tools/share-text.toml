、やり取りの両側を収めた<code>src/main.js</code>&mdash;共有する側のタブと読む側のタブは同じファイルです&mdash;、それから回線の向こう側から来たテキストの上で動くために、何かを出力する前にすべてをエスケープするレンダラーである<code>src/markdown.js</code>を読んでください。サーバーの全ソースは同じリポジトリの<code>workers/rendezvous/worker.js</code>です。リンク名ごとに部屋が1つ、開いた接続以外は何も持ちません。"""

howto_heading = "どこにもアップロードせずにテキストとファイルを共有する方法"

card = """
