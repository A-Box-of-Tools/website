og_title = "タブを閉じた瞬間に終わる共有"
og_description = "テキストとファイルは暗号化されたまま、あなたのブラウザから読む側のブラウザへ直接届きます。サーバーは両者を引き合わせるだけで、内容を見ることはありません。保存なし、履歴なし、アカウントなし。タブを閉じれば、どこからも消えます。"
og_image_alt = "テキストとファイルの共有 - ブラウザからブラウザへ、保存なし"

pledge = "ここで共有したものは、エンドツーエンドで暗号化されたWebRTCチャネルを通って、あなたのブラウザから各読者のブラウザへ届き、ほかのどこへも行きません。関わる唯一のサーバーは、このページの<code>Content-Security-Policy</code>に名前があり、ソースはリポジトリにあります。ブラウザ同士を紹介し、発見可能なローカルリンク名を一覧にします。共有するテキストやファイルを保持せず、内容がそこを通ることもありません。発見用の名前は共有者が接続している間だけ残ります。内容の履歴もアカウントもありません。このタブを閉じれば、読者の開いたページも含め、共有はあらゆる場所で同時に終わります。"

live_hint = "共有しながら開発者ツールのネットワークタブを見てください。この開始ページを開くと、ローカルリンク名のために仲介役へのWebSocketが開きます。共有を始めると接続交渉用にもう1本開きます。読者は紹介用の接続を1本使います。どれだけ入力や添付をしても、これらの接続がテキストやファイルを運ぶことはありません。"

read_first = "、やり取りの両側を収めた<code>src/main.js</code>&mdash;共有する側のタブと読む側のタブは同じファイルです——、それから回線の向こう側から来たテキストの上で動くために、何かを出力する前にすべてをエスケープするレンダラーである<code>src/markdown.js</code>を読んでください。サーバーの全ソースは同じリポジトリの<code>workers/rendezvous/worker.js</code>です。リンク名ごとに部屋が1つ、開いた接続以外は何も持ちません。追加の検索一覧が保持するのは、開いた接続にある公開リンク名だけで、テキストやファイルはありません。"

howto_heading = "どこにもアップロードせずにテキストとファイルを共有する方法"

card = """
            テキストとファイルを、暗号化された直接接続でブラウザからブラウザへ。どこにも保存されず、タブを閉じれば共有は終わります。"""

