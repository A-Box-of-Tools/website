[[privacy]]
title = "暗号化された接続の経路を選びます。"
body = "直接接続は中継を使わずブラウザー間でコンテンツを送ります。通常の直接接続は公開アドレス探索を使い、ローカルネットワークはホスト候補に限定します。クラウド中継はCloudflare TURN経由で暗号化パケットを転送し、異なるネットワークの端末も接続できます。ホストが開始前に選び、招待にその選択が含まれ、読者は接続前に確認します。直接接続が自動で切り替わることはありません。ネットワークやブラウザーの制限により、どちらも接続できない場合があります。"

[[privacy]]
title = "仲介役とは何か、そして見えているもののすべて。"
body = "直接接続には紹介が必要です。この開始ページは発見可能なローカルリンク名のために仲介役へのWebSocketを自動で開きます。共有を始めると共有用にもう1本開き、読者は紹介用の接続を1本使います。サーバーはリンク名の読者と共有者を引き合わせ、数キロバイトの接続交渉を転送します。ストレージには書き込まず、部屋と検索の項目は開いた接続とともに終わります。名前、接続時刻、IPアドレス、接続交渉は見えますが、テキスト、ファイル、承認の判断、非公開の自己紹介は見えません。一覧は、同じ公開IPv4アドレスまたは同じIPv6サブネットを使う接続中の共有者の名前を表示します。共有VPNや通信事業者のアドレス共有では別のネットワークも含まれ、近くの端末でもIPv4とIPv6の違いや経路の違いで見つからないことがあります。全ソースはリポジトリにあります。Cloudflareは接続ログを7日間保持し、記録するのはアドレス、リンク名、時刻で、内容は含みません。"

[[privacy]]
title = "共有内容はサーバーに保存しません。"
body = """
共有はあなたのタブが開いている間だけ存在します。閉じれば新しく来た人には何も見つからず、読んでいた人は自分の写しが消えるのを目にします。ただし誰かがその前にコピーやダウンロードしたものはその人のものです。手渡したものすべてがそうであるように。入力した下書きは次回も残るように、あなた自身のブラウザのストレージにだけ置かれます。使い切りに印を付ければ、どこにも残りません。これとは別に、読者のブラウザーはランダムな承認証をローカルに保存します。承認済みのブラウザーは切断しても同じホストセッションへ再承認なしで戻れます。ホストが停止すると承認はリセットされます。使い切りは下書きの保存だけを無効にし、承認証には適用されません。サイトの保存を消去または禁止すると再承認が必要になる場合があり、このウェブサイトの通常のスクリプトは保存した承認証を読めます。"""

[[privacy]]
title = "リンク名がアドレスで、非公開が鍵です。"
body = "名前を知っているか推測した人は、その共有を開けます。発見可能なローカル共有は、同じ公開IPv4アドレスまたは同じIPv6サブネットを使うほかのブラウザに名前を表示するため、そのグループ内で名前は公開されます。機密性のある内容では非公開を有効にしてください。標準で有効になっており、各読者が暗号化された直接チャネルで自己紹介し、あなたが承認するまで内容は送られません。"

[[privacy]]
title = "直接接続は、互いに相手のアドレスを見せ合います。"
body = "直接接続では端末に到達するために必要なネットワークアドレスを交換します。クラウド中継は中継アドレスを使い、Cloudflareには両端末のアドレスと通信メタデータが見えます。匿名性を保証する機能ではありません。上の接続方式を確認してから、接続を選んでください。"

[[privacy]]
title = "Googleが読み込むもの、渡らないもの。"
body = """広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来ます。どちらにも、テキストも、ファイルも、その名前やサイズも、誰が接続したかも渡りません。例外はこのページのアドレスそのものです。読み手のリンクにはリンク名が含まれ、広告スクリプトはそのアドレスを読み取ります。秘密にしておきたい共有には、プライベートの切り替えを使ってください。内容に触れるすべての行はこのオリジンから配信され、リポジトリにあります。"""

[[howto]]
title = "テキストを書くか、ファイルを添付します。"
body = """
エディタが共有そのものです。読む側が接続した瞬間にそこにあるものが、その人の受け取るもので、その後の変更は入力と同時に、接続中の読む側へライブで届きます。ファイルは同じチャネルを通り、1つ200&nbsp;MBまで。読む側は一覧を見て、求めたものだけを受け取るので、要らないファイルに誰かの帯域が使われることはありません。"""

[[howto]]
title = "テキストに書式がふさわしければMarkdownをオンに。"
body = """
スイッチは1つだけ。見出し、太字、リスト、コード、リンクが、入力と同時にエディタの隣でライブ表示され、読む側には既定で整形済みの表示が届きます。原文に戻す切り替えも付いています。レンダラーはこのページと一緒に届き、すべてをエスケープします。共有されたテキストは、誰が書いたものであれ、読む側のマシンでスクリプトにはなれません。"""

[[howto]]
title = "リンクに名前を付けるか、提案のままにします。"
body = "名前がアドレスです。<code>brave-otter-42</code>なら部屋の向こうへ声で伝えたり、電話で読んだり、ホワイトボードから入力したりできます。発見可能なローカル共有は名前を一覧にするので、機密性のある内容では非公開を有効にしてください。リンクだけで共有する場合は、推測しにくい名前も役立ちます。使用中の名前は拒否され、共有を止めると空きます。"

[[howto]]
title = "誰を入れるかを決めます。"
body = """
非公開が既定です。読む側はそれぞれ自己紹介を求められます。名前でも、ヒントでも、あなたが分かるものなら何でも。あなたはそのメッセージを、読ませるボタンと断るボタンと一緒に見ます。自己紹介は直接チャネルを通るので、誰がノックしたのかは仲介役ですら知りません。チェックを外せば、名前を知る誰もが読める公開の共有になります。"""

[[howto]]
title = "共有を始めて、タブを開けたままにします。"
body = """タブがサーバーです。中断せずに共有するには、タブを開いたままにし、端末を起動状態に保ってください。ページを非表示にしても正常な接続は維持されますが、スマートフォンやスリープ中のパソコンがブラウザーを停止することがあります。戻ると同じ共有への復帰を試みます。共有を停止すると自動再開もしなくなります。リンクをコピーするか、名前を伝えてください。読む人はページのアドレス末尾に<code>#name</code>を追加できます。ローカルネットワークモードでは、名前の前に<code>?local=1</code>が付いたリンクをコピーしてください。接続モードの変更には読む人の選択が必要です。"""

[[howto]]
title = "向こう側では：まず同意、それからノック。"
body = """
リンクを開いた人は誰かが共有中だと知らされ、直接接続では互いのネットワークアドレスが見えるようになると警告され、自分で選んだときにだけ接続します。非公開の共有なら自己紹介をして、あなたを待ちます。受け取ったものはあなたが書き換えるそばからライブで変わり、タブを閉じれば消えます。"""

[[faq]]
q = "何かが、どこかへアップロードされますか？"
a = "テキストとファイルはブラウザーと各読者の間で暗号化されます。標準は直接接続です。クラウド中継を選ぶと暗号化パケットがCloudflareを通りますが、中継は内容を読めません。仲介サービスは接続準備と公開されたリンク名だけを扱い、テキストやファイルを受け取りません。共有コンテンツはサーバーに保存しません。タブを閉じると送信元が終了し、読者側は終了通知や障害検出後に表示を消去します。すでに保存したコピーは読者の手元に残ります。Cloudflareは仲介接続のメタデータを7日間保持します。当アプリは共有コンテンツをログに記録しません。"

[[faq]]
q = "では、よりによってこのサイトで、なぜこの道具はサーバーと話すのですか？"
a = "ブラウザ同士は自力で見つかりません。仲介役が<code>brave-otter-42</code>を入力した人とその名前で共有する人を引き合わせ、接続交渉を運びます。このページの<code>Content-Security-Policy</code>に名前があり、ソースは同じリポジトリにあります。また、同じ公開IPv4アドレスまたは同じIPv6サブネットを使うブラウザに公開したローカルリンク名を一覧にします。内容を保持せず、暗号化された直接チャネルを読むことはできません。"

[[faq]]
q = "そのサーバーには、正確には何が見えるのですか？"
a = "使用中のリンク名、共有者と読者の接続や切断の時刻、IPアドレス、接続交渉が見えます。検索一覧は、公開IPv4アドレスまたはIPv6サブネットと、ページのオリジンで公開リンク名をグループ化します。テキスト、ファイル、その名前やサイズ、非公開の承認、自己紹介は見えません。これらはエンドツーエンドで暗号化された直接チャネルを通ります。Cloudflareは接続ログを7日間保持し、記録するのはリンク名、アドレス、時刻で、内容は含みません。"

[[faq]]
q = "タブを閉じるとどうなりますか？"
a = """唯一の送信元がなくなると共有は終了します。読む側は終了や接続障害を検出すると表示中のコピーを消去します。共有の停止は明示的な終了通知を送ります。一時的なネットワーク障害の場合は、回数を制限して再接続を試みることがあります。削除すべきサーバー上のコピーはありません。すでにコピーやダウンロードされた内容は受信者の手元に残ります。"""

[[faq]]
q = "読む側は、私が共有したものを持ち続けられますか？"
a = """
        共有が開いている間は、はい。それが共有するということです。読む側はテキストをコピーでき、ファイルをダウンロードでき、持っていったものはその人のものです。ほかのどんな方法で手渡していても同じだったように。終了が保証するのは未来です。新しく来る人は届かず、開いたページは表示をやめます。すでに届いたものを取り戻せる道具はなく、このページはできるふりをしません。"""

[[faq]]
q = "非公開モードとは何ですか？"
a = """
        既定の設定です。やって来る読む側はそれぞれ、共有が非公開だと知らされて自己紹介を求められます。あなたはそのメッセージを——「私だよ、スタンドアップのアリス」——読ませるボタンと断るボタンと一緒に見て、決めるまで何も送られません。自己紹介はすでに暗号化された直接チャネルを通るので、誰がノックしたのかも、あなたが何を決めたのかも、サーバーには永遠に分かりません。共有前にチェックを外せば、公開の共有になります。"""

[[faq]]
q = "なぜ読む側に私のIPアドレスが見えるのですか？"
a = "直接接続では端末に到達するために必要なネットワークアドレスを交換します。クラウド中継は中継アドレスを使い、Cloudflareには両端末のアドレスと通信メタデータが見えます。匿名性を保証する機能ではありません。表示された接続方式を確認し、一覧では「参加」、通常の招待リンクを開いた場合は接続を選んでください。"

[[faq]]
q = "ファイルはどこまで大きくでき、速さは？"
a = "1ファイル最大200&nbsp;MBです。速度は両端末とネットワーク経路に依存します。直接接続ではローカルネットワークの速度を利用できますが、クラウド中継はインターネット帯域やサービス制限にも依存します。ファイルは読者の要求時だけ転送されます。"

[[faq]]
q = "オフラインで動きますか？"
a = "ページを保存すると、エディターはオフラインでも文章の入力、Markdownの表示、下書きの保存に使えます。共有には両方の端末でインターネット接続が必要です。紹介サービスがブラウザー同士をつなぎます。ページを保存してもオフラインでのペアリングはできません。ローカルネットワークモードでも紹介は必要ですが、内容はブラウザー間で直接送られます。"

[[faq]]
q = "つながらなかったら？"
a = "両端末のインターネット接続を確認してください。ローカルネットワークではWi-FiやEthernetが端末間通信を許可している必要があります。直接接続に失敗したら、ホストが停止してクラウド中継を選び、再開して新しい招待を送れます。読者は接続前に選択を確認します。実行中の直接共有は自動で切り替わりません。管理された端末や制限の厳しいネットワークでは中継も遮断される場合があります。"

[[faq]]
q = "誰でも何でも共有できるのに、Markdownの表示は安全ですか？"
a = """
        その問いこそ、レンダラーがライブラリではなくこのページのソースの80行である理由です。どんなタグを出す前にもすべての文字がエスケープされ、生成されうるのは無害なタグの固定された一組だけで、リンクが受け付けるのは<code>http</code>、<code>https</code>、<code>mailto</code>のみ。<code>javascript:</code>のリンクはただの文字のまま残ります。共有されたテキストは、誰が書いたものであれあなたのマシンでスクリプトにはなれず、その80行は自分で読めます。"""

[[faq]]
q = "2人が同じ名前で共有できますか？"
a = """
        同時には無理です。名前ごとに生きている共有は1つ、仲介役で強制されます。2番目に来た人は断られ、別の名前を選ぶよう求められます。共有が終わった瞬間に名前はまた空きます。つまり、取っておいたリンクの鮮度はその先の共有の鮮度でしかありません。同じ名前が来週には別の誰かのものかもしれないのです。リンクは人のものではなく、瞬間のものとして扱ってください。"""

[[faq]]
q = "無料ですか？アカウントは要りますか？"
a = """
        無料です。アカウントも登録もなく、挙げるほどの制限もありません。共有1つにつき同時に16人まで読めます。サイトには広告が載り、それが費用を賄っています。広告にはこのページが共有するものについて何ひとつ渡らず、仲介役は何も保存せずほとんど何もしないからこそ、無料プランに余裕で収まります。"""

[[faq]]
q = "ローカルネットワークでファイルを共有できますか？"
a = "はい。開始前に「ローカルネットワーク——インターネット中継なし」を選び、両方の端末を同じWi-Fiまたはイーサネットにつないで、読者にリンクをコピーしてください。リンクにはモードが含まれます。別のモードを使う読者は、共有者のモードで再試行する前に明示的に選ぶ必要があります。ブラウザ同士の紹介には引き続きインターネットが必要です。このモードは公開のアドレス探索を使わず、インターネット中継へ切り替わりません。VPNやブラウザのネットワークポリシーで経路が変わったり接続できなかったりするため、この設定はデータが建物内に留まる証明ではありません。承認が必要な非公開設定は引き続き標準で有効になり、ファイルの上限も1つにつき200&nbsp;MBのままです。1回の共有には最大256ファイルを添付できます。このモードでは発見可能が標準で有効です。相手のブラウザで開始ページを開き、この接続の一覧からあなたの名前を選べます。発見可能を外すとリンクのみで共有できます。共有ネットワークでは非公開を有効にしてください。"

[[faq]]
q = "一覧はローカル共有をどう見つけますか？"
a = "一覧は公開IPv4アドレスまたはIPv6サブネットとページのオリジンで共有をまとめます。物理的な距離を証明するものではありません。共有ゲートウェイやVPNによって知らない人が含まれたり、近くの端末が見つからない場合があります。インターネットが必要です。公開を有効にしたローカル直接共有かクラウド中継共有だけが表示されます。利用可能な場合、検出可能は標準で有効です。リンクだけで共有するなら解除し、共有ネットワークでは非公開を維持してください。「参加」で表示中の接続方式を使い、新しい閲覧タブから接続をリクエストします。一覧を見るだけでは接続しません。非公開共有では承認を待ちます。リクエストはダイアログに表示され、後で確認する操作で閉じても一覧に残ります。"

[schema]
description = "開いたブラウザーからテキストとファイルを暗号化して共有します。標準は直接接続で、クラウド中継も選べます。読者ごとに承認できます。"
features = ["開いたブラウザーからテキストとファイルを暗号化して共有します。標準は直接接続で、クラウド中継も選べます。読者ごとに承認できます。", "共有は開いたタブの中に生きる。閉じれば終わり、読む側のページも空になる", "声で伝えられるリンク名 - brave-otter-42 -、編集可能、名前ごとに生きた共有は1つ", "既定で非公開。読む側はそれぞれ自己紹介し、共有する側が入れるか断るかを決める", "接続が生まれる前に読む側が同意し、IPが見えるようになることをはっきり知らされる", "ライブ更新。変更は入力と同時に、接続中の読む側へ届く", "両側で切り替えられるMarkdown。先にエスケープする内蔵レンダラーで表示", "ファイルは1つ200 MBまで。求めに応じて受け取り、ファイルごとに進捗を表示", "オープンソースの仲介サービスがブラウザーを引き合わせ、必要に応じてCloudflare TURNが暗号化パケットを転送します。", "サーバー部分の全体が、リポジトリで公開された保存を持たない仲介役1つ", "公開のアドレス探索やインターネット中継を使わない任意のローカルネットワークモード", "同じ公開IPv4アドレスまたは同じIPv6サブネットを使うブラウザにローカルリンク名を表示し、接続前の同意と非公開の承認を維持"]
