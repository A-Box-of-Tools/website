og_image_alt = "テキストとファイルの共有 - ブラウザからブラウザへ、保存なし"

pledge = """
    ここで共有したものは、エンドツーエンドで暗号化されたWebRTCチャネルを通って、あなたのブラウザから読む側それぞれのブラウザへ届きます。ほかのどこへも行きません。関わる唯一のサーバーは&mdash;このページの<code>Content-Security-Policy</code>に名前があり、ソースはリポジトリにあります&mdash;2つのブラウザを引き合わせて、あとは脇へ退きます。何も保存せず、内容がそこを通ることもありません。履歴もアカウントもありません。このタブを閉じれば、読む側の開いたページも含め、共有はあらゆる場所で同時に終わります。"""

