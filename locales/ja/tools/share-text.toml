[[privacy]]
title = "内容は読む相手へ行き、ほかのどこへも行きません。"
body = """
テキストとファイルはWebRTCのデータチャネルを通ります。あなたのブラウザと読む側それぞれのブラウザの間の、DTLSで暗号化された直接接続です。その経路にサーバーはありません。同じネットワークならバイトは建物の外にすら出ません。同じWi-Fiのノートパソコン2台は、すべてをローカルで受け渡します。"""

[[privacy]]
title = "仲介役とは何か、そして見えているもののすべて。"
body = """
直接接続には引き合わせが要ります。だからこのページは&mdash;このサイトで唯一&mdash;私たちのサーバーへWebSocketを1本開きます。そのサーバーはリンク名を入力した人と、その名前で共有している人を引き合わせ、数キロバイトの交渉を取り次ぎ、何も抱え込みません。ストレージに書き込むことは一度もなく、共有する側が切断した瞬間に部屋は消えます。見えるもの：ある名前が使用中であること、誰がいつ来て去ったか、IPアドレス。見えないもの：テキスト、ファイル、誰が入室を許されたか、誰が何を書いたか。非公開の共有でのノックさえ、暗号化された直接チャネルを通ります。全ソースはリポジトリの、この道具のソースの隣にあります。"""

[[privacy]]
title = "何も保存されないので、タブを閉じることが削除そのものです。"
body = """
共有はあなたのタブが開いている間だけ存在します。閉じれば新しく来た人には何も見つからず、読んでいた人は自分の写しが消えるのを目にします。ただし誰かがその前にコピーやダウンロードしたものはその人のものです。手渡したものすべてがそうであるように。入力した下書きは次回も残るように、あなた自身のブラウザのストレージにだけ置かれます。使い切りに印を付ければ、どこにも残りません。"""

[[privacy]]
title = "リンク名が唯一の秘密で、非公開モードがその錠前です。"
body = """
名前を知っているか言い当てた人は、その先の共有を開けます。だから提案はランダムな3語ですし、繊細なものには推測できない名前がふさわしいのです。あるいは、初めから入っている非公開スイッチがあります。やって来る読む側は直接チャネル越しに自己紹介をしなければならず、あなたが入れるまで何も送られません。"""

[[privacy]]
title = "直接接続は、互いに相手のアドレスを見せ合います。"
body = """
それがピアツーピアの意味で、読む側は起きる前にそれを知らされます。共有リンクを開くことは、誰かが共有中かを仲介役に尋ねるだけです。その後ページは、接続すると互いのIPアドレスが見えるようになるとはっきり述べ、クリックを待ちます。そのクリックまで、共有する側は読む側の存在すら知りません。"""

[[privacy]]
title = "Googleが読み込むもの、渡らないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来ます。どちらにも、このページが共有するものについては何ひとつ渡りません。テキストも、ファイルも、その名前やサイズも、リンク名も、誰が接続したかも。内容に触れるすべての行はこのオリジンから配信され、リポジトリにあります。"""

[[howto]]
title = "テキストを書くか、ファイルを添付します。"
body = """
エディタが共有そのものです。読む側が接続した瞬間にそこにあるものが、その人の受け取るもので、その後の変更は入力と同時に、接続中の読む側へライブで届きます。ファイルは同じチャネルを通り、1つ200&nbsp;MBまで。読む側は一覧を見て、求めたものだけを受け取るので、要らないファイルに誰かの帯域が使われることはありません。"""

[[howto]]
title = "テキストに書式がふさわしければMarkdownをオンに。"
body = """
スイッチは1つだけ。見出し、太字、リスト、コード、リンクが、入力と同時にエディタの隣でライブ表示され、読む側には既定で整形済みの表示が届きます。原文に戻す切り替えも付いています。レンダラーはこのページと一緒に届き、すべてをエスケープします。共有されたテキストは、誰が書いたものであれ、読む側のマシンでスクリプトにはなれません。"""

[[howto]]
title = "リンクに名前を付けるか、提案のままにします。"
body = """
名前がそのまま住所です。<code>brave-otter-42</code>は部屋の向こうへ声で伝えられ、電話で読み上げられ、ホワイトボードから書き写せます。同時に唯一の秘密でもあるので、内輪のものには誰にも推測できない名前を選ぶか、非公開スイッチに頼ってください。他の誰かがいま共有中の名前は断られ、あなたの名前はやめた瞬間にまた空きます。"""

[[howto]]
title = "誰を入れるかを決めます。"
body = """
非公開が既定です。読む側はそれぞれ自己紹介を求められます。名前でも、ヒントでも、あなたが分かるものなら何でも。あなたはそのメッセージを、読ませるボタンと断るボタンと一緒に見ます。自己紹介は直接チャネルを通るので、誰がノックしたのかは仲介役ですら知りません。チェックを外せば、名前を知る誰もが読める公開の共有になります。"""

[[howto]]
title = "共有を始めて、タブを開けたままにします。"
body = """
タブがサーバーです。共有はタブが開いて起きている間だけ届き、その先は一瞬もありません。ノートパソコンを閉じても終わります。リンクをコピーするか、名前を口で伝えるだけでも構いません。読む側はこのページのアドレスの末尾に<code>#名前</code>と打てばいいのです。"""

[[howto]]
title = "向こう側では：まず同意、それからノック。"
body = """
リンクを開いた人は誰かが共有中だと知らされ、直接接続では互いのネットワークアドレスが見えるようになると警告され、自分で選んだときにだけ接続します。非公開の共有なら自己紹介をして、あなたを待ちます。受け取ったものはあなたが書き換えるそばからライブで変わり、タブを閉じれば消えます。"""

[[faq]]
q = "何かが、どこかへアップロードされますか？"
a = """
        いいえ。テキストとファイルは暗号化されたWebRTCチャネルで、あなたのブラウザから読む側それぞれのブラウザへ直接行きます。関わる唯一のサーバーが運ぶのは引き合わせ&mdash;接続交渉の数キロバイト&mdash;だけで、内容は決して運びません。そこには漏れるものも、差し押さえられるものも、失われるものもありません。あなたのバイトを1つも持たず、切断した瞬間に部屋は消えます。"""

[[faq]]
q = "では、よりによってこのサイトで、なぜこの道具はサーバーと話すのですか？"
a = """
        2つのブラウザは自力では出会えないからです。<code>brave-otter-42</code>と入力した人と、その名前で共有している人を引き合わせ、接続の申し出を両者の間で運ぶ何かが要ります。その何かが仲介役です。このページ唯一のネットワーク依存で、<code>Content-Security-Policy</code>に名前があり、ページと同じリポジトリで公開されています。この仕事をこなせる最小のサーバーです。何も保存せず、何も読まず、2つのブラウザが直接チャネルを持った瞬間に脇へ退きます。"""

[[faq]]
q = "そのサーバーには、正確には何が見えるのですか？"
a = """
        あるリンク名が使用中であること、共有する側と読む側がいつ接続し去ったか、そのIPアドレス、そして両者が交換する暗号化接続のセットアップ。テキストは見えません。ファイルも、その名前やサイズも、非公開の共有で誰が入れられたかも、自己紹介に誰が何を書いたかも見えません。それらはすべて、サーバーを通らないエンドツーエンド暗号化の直接チャネルを通ります。"""

[[faq]]
q = "タブを閉じるとどうなりますか？"
a = """
        共有はあらゆる場所で同時に終わります。リンクは1、2秒で使えなくなり、ページを開いたままの読む側は、共有が終わったという知らせと共に自分の写しが消えるのを目にします。これはサーバーへの削除依頼ではありません。消すべきサーバー上の写しが存在しないのです。共有が存在した唯一の場所がそのタブで、閉じることが後片付けのすべてです。"""

[[faq]]
q = "読む側は、私が共有したものを持ち続けられますか？"
a = """
        共有が開いている間は、はい。それが共有するということです。読む側はテキストをコピーでき、ファイルをダウンロードでき、持っていったものはその人のものです。ほかのどんな方法で手渡していても同じだったように。終了が保証するのは未来です。新しく来る人は届かず、開いたページは表示をやめます。すでに届いたものを取り戻せる道具はなく、このページはできるふりをしません。"""

[[faq]]
q = "非公開モードとは何ですか？"
a = """
        既定の設定です。やって来る読む側はそれぞれ、共有が非公開だと知らされて自己紹介を求められます。あなたはそのメッセージを&mdash;「私だよ、スタンドアップのアリス」&mdash;読ませるボタンと断るボタンと一緒に見て、決めるまで何も送られません。自己紹介はすでに暗号化された直接チャネルを通るので、誰がノックしたのかも、あなたが何を決めたのかも、サーバーには永遠に分かりません。共有前にチェックを外せば、公開の共有になります。"""

[[faq]]
q = "なぜ読む側に私のIPアドレスが見えるのですか？"
a = """
        接続が本当に直接だからです。直接接続は2つのアドレスの間を走り、電話と同じように、両端は必然的に相手のアドレスを知ります。読む側はどんな接続も生まれる前に警告され、自分で選んだときにだけ接続します。それまであなたは、リンクが開かれたことすら知りません。この交換が合わない共有なら、代わりはサーバー経由で中継するサービスです。逆向きの交換と引き換えに。"""

[[faq]]
q = "ファイルはどこまで大きくでき、速さは？"
a = """
        1ファイル200&nbsp;MBまで、種類は問わず、速さは2つの回線の遅いほうの分だけ。間で減速させたり量ったりするサーバーがありません。同じWi-Fiの2台はローカルネットワークの速度で転送し、バイトは建物を出ません。読む側はファイルを求めたときに受け取るので、大きなものを添付しても、誰かが本当に欲しがるまでは何のコストもかかりません。"""

[[faq]]
q = "オフラインで動きますか？"
a = """
        正直に言えば半分です。エディタは動きます。ページは読み込まれ、下書きはそこにあり、Markdownは表示され、書くのも保存するのもネットワークなしでできます。共有は動きませんし、動きようがありません。他人のブラウザへ届くことはネットワークの行為で、引き合わせには仲介役が要ります。このサイトで、役目そのものがオフラインでは不可能な唯一の道具です。そうでないふりは不誠実でしょう。"""

[[faq]]
q = "つながらなかったら？"
a = """
        ブラウザの組の大半は、引き合わされれば直接届きます。少数は届かず、たいていは両側とも最も厳しい類の社内ネットワークやモバイル回線の内側にいるときです。このページはこっそり中継サーバーに切り替えたりしません。それはこの道具が何であるかを黙って変えてしまうからです。20秒後に、直接接続は成立しなかったとはっきり伝えます。別のネットワークから試せば、たいてい解決します。"""

[[faq]]
q = "誰でも何でも共有できるのに、Markdownの表示は安全ですか？"
a = """
        その問いこそ、レンダラーがライブラリではなくこのページのソースの80行である理由です。どんなタグを出す前にもすべての文字がエスケープされ、生成されうるのは無害なタグの固定された一組だけで、リンクが受け付けるのは<code>http</code>、<code>https</code>、<code>mailto</code>のみ。<code>javascript:</code>のリンクはただの文字のまま残ります。共有されたテキストは、誰が書いたものであれあなたのマシンでスクリプトにはなれず、その80行は自分で読めます。"""

[[faq]]
q = "2人が同じ名前で共有できますか？"
a = """
        同時には無理です。名前ごとに生きている共有は1つ、仲介役で強制されます。2番目に来た人は断られ、別の名前を選ぶよう求められます。共有が終わった瞬間に名前はまた空きます。つまり、取っておいたリンクの鮮度はその先の共有の鮮度でしかありません。同じ名前が来週には別の誰かのものかもしれないのです。リンクは人のものではなく、瞬間のものとして扱ってください。"""

[[faq]]
q = "無料ですか？アカウントは要りますか？"
a = """
        無料です。アカウントも登録もなく、挙げるほどの制限もありません。共有1つにつき同時に16人まで読めます。サイトには広告が載り、それが費用を賄っています。広告にはこのページが共有するものについて何ひとつ渡らず、仲介役は何も保存せずほとんど何もしないからこそ、無料プランに余裕で収まります。"""

