  ついても同じです"""

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "サイズ制限なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[privacy]]
title = "貼り付けたものに、出ていく先はありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。貼り付けた請求書が\
      集められるような受け口はここになく、仮にあったとしても、そこへ送るコードが\
      ありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も\
      <code>XMLHttpRequest</code>も<code>sendBeacon</code>もありません。パーサーも\
      プリンターも、文字列を受け取って文字列を返す、このページの中の関数です。"""

[[privacy]]
title = "外部実体は、決して解決されません。"
body = """
外部実体を含む<code>DOCTYPE</code>は、解析している端末の\
      ファイルをXMLパーサーに読ませるための手口で、この形式の最も古い穴です。\
      <code>src/xml.js</code>は手書きの読み取り器で、実体解決の仕組みがそもそも\
      入っていません。無効にしてあるのではなく、存在しないのです。そしてこのページは、\
      あなたのテキストをブラウザ自身の<code>DOMParser</code>へ渡すこともありません。"""

[[privacy]]
title = "XMLから出てくる値は、すべて文字列です。"
body = """
<code>&lt;port&gt;8080&lt;/port&gt;</code>は\
      それが数値かどうかについて何も言っていないので、JSONは<code>"8080"</code>と\
      書きます。こちらで決めてしまうのは、ファイルに書いてあったかのように以後ずっと\
      持ち回られる情報を、こちらで作り出すことです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ます。そのどれにも、あなたのテキストは1文字も渡されません。それを読み、解析し、\
      書き出すすべての行は、このオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
ネットワークを切っても道具は何も変わりません。もともと\
      ネットワークの段階がなかったからです。これが何よりも簡単な証明です。"""

[[howto]]
title = "仕事を選びます。"
body = """
タブは二つ、入力欄は一つです。<em>整形</em>はXMLを\
      整えるか平たく圧縮し、<em>変換</em>はJSONに、あるいはJSONをXMLに戻します。\
      いま整えたXMLがそのまま変換するXMLなので、二度貼り付ける必要はありません。"""

[[howto]]
title = "貼り付けるか、ファイルを置きます。"
body = """
選択してコピーできるものなら何でも\
      構いません。<code>.xml</code>・<code>.svg</code>・<code>.rss</code>・\
      <code>.xsd</code>のファイルを選択欄に置けば、ご自分のブラウザがそれを読んで欄に\
      入れます。省くべきアップロードの段階自体がありません。"""

[[howto]]
title = "インデントを選ぶか、平たく圧縮します。"
body = """
半角空白2つ、4つ、または\
      タブ。平たく圧縮したものは、読むためだけにあった空白をすべて取り除いた同じ文書で、\
      結果には何バイト減ったかが表示されます。"""

[[howto]]
title = "エラーのある場所でエラーを読みます。"
body = """
ここで失敗したパーサーは、\
      ブラウザが一括で読んだ文書について言う「1行目でエラー」ではなく、<em>どのタグ</em>が\
      閉じられていないかを、行と列とともに伝えます。"""

[[howto]]
title = "結果を持ち帰ります。"
body = """
コピーするか、出てきた形式の名前が付いた\
      ファイルとしてダウンロードします。"""

[[faq]]
q = "私のXMLはどこかにアップロードされますか？"
a = """
        されません。このページのパーサーもプリンターも、ご自分のブラウザの中で、ご自分の\
        ハードウェア上で動く関数です。この道具にはネットワーク機能そのものがなく、何かを\
        取りに行くことも送ることもありません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて書かれていて、\
        そのどれもこのサイトのものではありません。これはXMLでは、この形式の評判から\
        想像されるより重い話です。ここに届くものは、たいてい請求書か、口座明細か、\
        診療記録か、ヘッダーに資格情報が入ったSOAPリクエストだからです。"""

[[faq]]
q = "外部実体は解決されますか？"
a = """
        されませんし、切るべき設定もありません。外部実体の解決は、実行中の端末のファイルを\
        XMLパーサーに読ませるための手口で、ふつうXXEと書かれる攻撃です。\
        <code>src/xml.js</code>は実体解決をまったく持たない手書きの読み取り器です。\
        あなたのテキストがブラウザ自身の<code>DOMParser</code>へ渡ることもありません。\
        <code>DOCTYPE</code>は、一度も実行されないまま素通りします。"""

[[faq]]
q = "XMLをJSONに変換すると何が失われますか？"
a = """
        混在内容の順序、コメント、そして属性と子要素の違いです。最後のものは消えるというより\
        和らげられます。属性は名前が<code>@</code>で始まるメンバーになるからです。要素自身の\
        テキストは、ほかのものと並ぶ必要があるとき<code>#text</code>になり、繰り返す子は\
        配列になります。値はすべて文字列のままです。XMLに型はなく、<code>8080</code>が数値\
        だったと決めるのは情報を作り出すことになります。"""

[[faq]]
q = "JSONをXMLに変換すると何が失われますか？"
a = """
        空のオブジェクト、空の配列、空文字列の違いです。三つとも空の要素になります。そして\
        すべての値の型も失われます。XMLに型がないからです。配列は繰り返す要素になり、それが\
        読み戻せる唯一の形です。要素名にできないキーは、どのパーサーも読まない文書を吐き出す\
        代わりに、扱いにくい文字を置き換えます。"""

[[faq]]
q = "SVGやRSSフィード、POMファイルも整形できますか？"
a = """
        できます。三つともXMLで、これは特定の方言ではなくXMLを読みます。こうして整えたSVGは\
        手で編集しやすくなりますし、RSSやAtomのフィードはたいてい平たく圧縮された状態で\
        配られていて、何かが開くまで読めません。並べ方は文書の意味を何も変えません。"""

[[faq]]
q = "インデントを付け直すとXMLの意味は変わりますか？"
a = """
        要素が要素を含む文書については変わりません。関わってくるのはテキストです。語を含む\
        要素の内側の空白はそのテキストの一部なので、テキストだけを含む要素は開かずに1行の\
        ままにします。<code>CDATA</code>の区間は、そっくりそのまま写されます。"""

[[faq]]
q = "ブラウザ自身のXMLパーサーを使わないのはなぜですか？"
a = """
        文書が壊れているときに何を言うかが理由です。<code>DOMParser</code>が返すのはエラー\
        文書で、その文言はブラウザごとに違い、多くは「1行目でエラー」に落ち着きます。手書きの\
        読み取り器なら、どのタグが閉じられていないか、それがどこで開かれたかを言えます。\
        知りたかったのはまさにそれです。外部実体を解決しないことが、もう一つの理由です。"""

[[faq]]
q = "どれくらい大きいファイルまで扱えますか？"
a = """
        ここに制限は設けていません。その費用を払うサーバーがないからです。実際の上限はご自分の\
        端末です。数メガバイトのXMLなら問題なく、とても長い文書のときは、キーボードを奪い合う\
        代わりに入力が止むのを待ってから整形し直します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、サインインも、試用期間もなく、貼り付ける量にも制限はありません。\
        このサイトには広告があり、それが費用をまかなっています。広告にはあなたのテキストについて\
        何も渡されません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んだあとインターネットを切っても、そのまま使えます。これは\
        何もアップロードされていないことを示す一番簡単な方法でもあります。整形のためにXMLを\
        送り出す道具なら、線を抜いた瞬間に止まってしまうはずです。"""

