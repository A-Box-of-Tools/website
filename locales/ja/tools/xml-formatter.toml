title = "XMLフォーマッター・XMLをJSONに——無料・アップロードなし"
description = "XMLの整形・インデント・圧縮と、XMLからJSON、JSONからXMLへの変換。パーサーはあなたのブラウザで動き、何もアップロードされないので、フィードも請求書も設定ファイルも端末を離れません。"
og_title = "XMLをサーバーに貼り付けずに整形する"
og_description = "自分の端末で動くXMLフォーマッター兼コンバーター。エラーが何行目にあるかを教えてくれて、貼り付けたものはどこにも行きません。"
og_image_alt = "XMLフォーマッター - 整形・圧縮・変換、アップロードなし"

pledge = """
    整形も変換も文字列に対する計算で、それをここ、このページで行います。パーサーは\
