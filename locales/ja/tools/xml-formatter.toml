    ネットワーク機能そのものがなく、取りに行くものも送るものもありません。それは\
    「XML」という語から想像されるより重い意味を持ちます。この形式で届くものは、たいてい\
    請求書か、口座明細か、診療記録か、ヘッダーに誰かの資格情報が入ったSOAPの本文だから\
    です。"""

live_hint = """
      言葉を信じる必要はありません。DevToolsを開き、ネットワークタブを見ながら何かを\
      整形してみてください。どのリクエストにも、貼り付けた内容の1文字も乗っていません。\
      あるいはインターネットを切って、それでも整形してみてください。"""

read_first = """
、どのタグが閉じられていないかを教えてくれるパーサーは\
<code>src/xml.js</code>、XMLから出てくる値がなぜ推測されずにすべて文字列のままなのかは\
<code>src/convert.js</code>をご覧ください。"""

howto_heading = "XMLをアップロードせずに整形する手順"

card = """
            読むためにXMLを整え、送るために平たく圧縮し、あるいはJSONへ、そして\
            元へ戻します。請求書やフィードを誰にも渡さずに貼り付けられます。"""

