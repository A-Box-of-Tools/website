[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
 広告と計測のスクリプトは\
      Googleから来ます。どちらにも、あなたのファイルについては何も渡されません。\
      画素も、サムネイルも、名前も、タグも、患者も、ファイル名もです。検査画像を\
      解析し、デコードし、描くすべての行はこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """

      上部の「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、\
      文字はGoogle Fontsから読み込みます。それはリンクにすぎません。訪問を報告する\
      こともなく、あなたやあなたのファイルについて何かを受け取ることもありません。\
      押さなければ何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 回線を切っても、このページのどの部分もそのまま\
      動きます。いちばん簡単な証拠です。検査画像をどこかへ送って描かせる道具なら、\
      線を抜いた瞬間に止まるからです。"""

[[howto]]
title = "ファイルを選びます。"
body = """
 <code>.dcm</code>ファイルを1つ、または\
      ディスクのフォルダごとです。CTやMRIは1スライスに1ファイルなので、まとめて\
      ドラッグして入れることがシリーズを組み直す方法になります。ファイルはブラウザが\
      ディスクから直接読みますし、その間どこへも何も送られません。"""

[[howto]]
title = "シリーズを選びます。"
body = """
 1つの検査にはたいてい複数入っています。\
      スカウト画像があり、そのあとに撮影ごとのものが続きます。各シリーズは装置が\
      撮った順に重ねられますが、その順は番号ではなく、各スライスが体のどこにあるかから\
      導かれます。番号はいつも同じ向きに振られるとはかぎりません。"""

[[howto]]
title = "ウィンドウを合わせます。"
body = """
 検査画像を読めるようにする操作であり、\
      画像編集ソフトにはないものです。画像の上を横にドラッグするとウィンドウが広がり、\
      上下にドラッグすると中心が動きます。CTなら肺・骨・脳・軟部組織といった名前つきの\
      ウィンドウも選べます。CTの単位は世界中のどの装置でも同じだからです。"""

[[howto]]
title = "スライスを送ります。"
body = """
 画像の下のスライダーがスライスを送り、\
      画像を一度クリックしたあとは矢印キーでも同じことができます。複数フレームの\
      ファイル、たとえば超音波のループや血管造影は、隣のボタンで再生されます。"""

[[howto]]
title = "何かを計測します。"
body = """
 計測に切り替えて線を引いてください。\
      ファイルが画素の間隔を書いていれば、答えはミリで返り、正方形でない画素も\
      きちんと考慮されます。書いていなければ答えは画素数で返り、そうだと明記します。\
      勝手に尺度を作ることはしません。"""

[[howto]]
title = "ヘッダーを読みます。"
body = """
 ファイルのすべての要素を、番号と、規格が\
      与えている名前と、中身とともに、検索できる形で並べます。その上には、まさにこの\
      ファイルの何が患者を特定するのかという一覧が出ます。氏名だけではとても\
      すみません。"""

[[howto]]
title = "必要なものを持ち帰ります。"
body = """
 画面に出ている画像を、合わせた\
      ウィンドウのまま、何も焼き込まずにPNGで。あるいはヘッダー全体をテキストで。\
      どちらもすでにページ上にあるものから、このページの中で作られます。"""

[[faq]]
q = "検査画像はどこかへアップロードされますか。"
a = """
        いいえ。ファイルの読み込み、デコード、描画はすべて手元のブラウザが手元の\
        ハードウェアで行います。この道具にはサーバー側というものがそもそもなく、\
        ページの<code>Content-Security-Policy</code>には接続しうるアドレスがすべて\
        書かれていますが、そのどれもこのサイトのものではありません。回線を抜いても\
        検査画像は開けます。
        <br><br>
        このサイトのどのページよりも、ここではその事実が効いてきます。DICOMファイルは\
        ヘッダーに患者の氏名・生年月日・患者番号を抱えているので、それをビューアへ\
        上げるというのは、見知らぬ相手に画像ではなく診療記録を手渡すということです。"""

[[faq]]
q = "どのDICOMファイルを開けますか。"
a = """
        基本のtransfer syntax3種類の非圧縮ファイル、つまりimplicitとexplicitの\
        little endian、それに廃止されたbig endianです。さらにdeflated、RLE Lossless、\
        baseline JPEG、そしてJPEG Losslessも開けます。病院のディスクに入っているCTと\
        MRIの検査の大半は、最後のもので圧縮されています。
        <br><br>
        JPEG 2000、JPEG-LS、そして動画に使われるMPEGとHEVCの各syntaxはデコードでき\
        ません。それらにはコンパイル済みライブラリが数メガバイト必要で、必要になった\
        ときにそれを取りに行くページは、オフラインで動くページではなくなってしまい\
        ます。そうした形式のファイルも開くことは開きます。ヘッダー全体は読んで表示\
        しますし、画像の場所にはコーデック名を書いた一行が入ります。何も教えてくれない\
        壊れた画像のアイコンよりはましだからです。"""

[[faq]]
q = "「ウィンドウと中心値」とは何で、なぜ必要なのですか。"
a = """
        CTの1スライスにはおよそ4000通りの値が入っていて、画面が出せるグレーは256階調\
        です。その4000のうちどの範囲が256を丸ごと受け取るのかを何かが決めなければ\
        ならず、その選択が<strong>ウィンドウ</strong>です。それより下はすべて黒、上は\
        すべて白、あいだの範囲がグレーに広がります。
        <br><br>
        同じファイルが2つの設定で別の検査画像のように見えるのはそのためですし、肺と骨を\
        同時に見られないのもそのためです。CTの数値はハウンスフィールド単位で、絶対的に\
        定義されています。水が0、空気が&minus;1000で、世界中のどのCT装置でもそうです。\
        ですからこのページの名前つきウィンドウは、放射線科医がワークステーションで使うのと\
        同じ数値です。MRIや超音波にはそうした尺度がなく、開いたときのウィンドウは\
        ファイル自身が求めているものです。"""

[[faq]]
q = "計測がなぜ画素で出るのですか。"
a = """
        そのファイルが画素1つの大きさを書いていないからです。それを持っているのがPixel\
        Spacing (0028,0030)でミリ単位ですが、超音波の画像、紙をスキャンしたもの、\
        secondary captureの多くには、そもそも入っていません。
        <br><br>
        入っている場合は計測はミリで返り、軸ごとにその軸の間隔で測ります。画素が正方形\
        でない画像ではこれが効いてきます。入っていない場合の正直な答えは画素数で、\
        尺度を勝手に選んで結果を長さのように見せるのではなく、そうだと書きます。"""

[[faq]]
q = "フォルダを開いたら複数のシリーズに分かれました。なぜですか。"
a = """
        中身がそうだからです。1つの検査はシリーズからできています。スカウト画像があり、\
        そのあとに撮影や再構成ごとのものが続きます。そしてどのファイルも、自分がどれに\
        属するかをSeries Instance UID (0020,000E)に書いています。一覧はフォルダでは\
        なくそれをもとに作られます。フォルダのほうはたいてい、全部が名前の一覧として\
        混ざっているだけだからです。
        <br><br>
        シリーズの中では、スライスは各々が体のどこにあるかで並べられ、それはImage\
        PositionとImage Orientationから導かれます。Instance Numberはいかにもな手がかり\
        ですが、第一候補ではなく代替です。それを振るのはファイルを書いた何かであって、\
        患者の向きと同じ向きに走る必要はないからです。"""

[[faq]]
q = "「何が患者を特定するのか」の一覧はどういう意味ですか。"
a = """
        あなたのファイルの中で、その検査画像に写っている人を名指しする、あるいは誰\
        なのかを絞り込むフィールドのすべてで、手元の端末上のこのファイルから読み取った\
        ものです。一覧の根拠はDICOM規格のPS3.15、つまりあるデータセットを非識別化された\
        と呼べるようになる前に何が消えていなければならないかを定めた部分です。
        <br><br>
        これがあるのは、人が間違えるのが「検査画像に氏名が入っている」という点ではない\
        からです。問題はほかにどれだけ入っているかです。生年月日、受付番号、依頼医、\
        施設、装置の製造番号、そして検査のUID。UIDはそのファイルを作ったアーカイブへ\
        戻る完璧な鍵です。氏名だけ消した検査画像は匿名ではありません。
        <br><br>
        この道具は見せるだけです。何も書かず何も変えないので、そのどれかを取り除く\
        こともできません。"""

[[faq]]
q = "検査画像を匿名化できますか。"
a = """
        できませんし、できるふりも意図的にしません。このページは読みます。DICOM\
        ファイルを書くコードはありません。このページがするのは、あなたのファイルに\
        何が入っているのかを正確に伝えることで、それこそが調べにくく、人が間違える\
        部分です。
        <br><br>
        特定につながる項目を取り除く道具は、はるかに高い水準を求められる別の仕事です。\
        画素に触れずにファイルを書き直し、検査全体でUIDを一貫して置き換え、装置に\
        よっては氏名の2つめの写しを隠している私的要素についても正しくなければなりま\
        せん。それはビューアに付け足すものではなく、このサイトのロードマップにある\
        ものです。"""

[[faq]]
q = ".dcm拡張子のないファイルや、壊れたファイルも開けますか。"
a = """
        どちらも開けます。拡張子は見ておらず、確かめるのはファイルそのものです。よくある\
        128バイトの前置きなしに書かれたデータセット、つまりネットワークから直接出てきた\
        検査画像はそう見えますが、それは最初の要素から符号化を割り出して読み、ページは\
        そうしたと書きます。
        <br><br>
        途中で切れているファイルは、行けるところまで読みます。壊れる前のすべてを表示し、\
        何バイト目で止まったかを添えます。ビューアがいちばん必要になるのはまさにそういう\
        場合なので、最後の12バイトのために全体を捨てるのは間違った振る舞いになります。"""

[[faq]]
q = "これは診断用のビューアですか。"
a = """
        いいえ。医療機器ではなく、いかなる規制上の評価も受けておらず、ここにあるどれも\
        臨床的な判断に使うべきではありません。画面は校正されておらず、ブラウザは検証\
        された描画系ではありませんし、そのどちらもウェブページの内側からは直せません。
        <br><br>
        一方で、人が検査画像を開くほかのすべての理由には向いています。ディスクに何が\
        入っているかを確かめる、講義や論文のために1枚取り出す、ヘッダーを読む、別の\
        プログラムがなぜこのファイルを拒むのかを調べる、そして検査画像がその人について\
        何を抱えているのかを見る、といったことです。"""

[[faq]]
q = "ファイルは書き換えられますか。"
a = """
        いいえ。この道具は読むだけです。出力ファイルも再エンコードもなく、DICOMを書く\
        ボタンもここにはありません。ダウンロードできるのは画面に出ている画像のPNGと、\
        ヘッダーのテキストです。元のファイルはディスクにそのまま残ります。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか。"
a = """
        無料で、アカウントもログインも試用期間もありません。ファイルの大きさにも、\
        いくつ開くかにも制限はなく、あるのは手元の端末のメモリだけです。このサイトは\
        広告で運営されていて、広告側にはあなたのファイルについて何も渡されません。"""

[[faq]]
q = "オフラインで動きますか。"
a = """
        はい。ページを一度読み込んだあと、回線を切っても動き続けます。何もアップロード\
        されていないことを示すいちばん簡単な方法でもあります。検査画像をどこかへ送って\
        描かせる道具なら、線を抜いた瞬間に止まるからです。"""

[schema]
description = "DICOM (.dcm) の検査画像をブラウザで開きます。CT・MRI・レントゲン・超音波を、ウィンドウと中心値、正しい順に重なったシリーズ全体、ミリ単位の計測、ヘッダーのすべてのタグとともに。何もアップロードしません。"
features = [
  "CT・MRI・レントゲン・超音波・PET・secondary captureのファイルを開く",
  "ウィンドウと中心値をドラッグ・入力・名前つきCTプリセットで指定",
  "フォルダ全体をシリーズにまとめ、体内の位置で並べ替え",
  "複数フレームのファイルはループ再生",
  "ミリ単位で計測し、正方形でない画素も考慮",
  "カーソル下の画素値をハウンスフィールド単位で表示",
