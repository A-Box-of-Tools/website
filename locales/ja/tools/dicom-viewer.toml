#
# DICOM Viewer - Japanese.
#
# Overrides for tools/dicom-viewer/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# DICOMのフィールド名は英語のまま、番号も付けたまま残します。Pixel Spacing
# (0028,0030)、Series Instance UID (0020,000E)のように、ファイルにもそう書かれ、
# 規格にもそう書かれているからで、フィールドを調べる人はまさにその綴りを探します。
# transfer syntaxとPS3.15も同じです。
#
# このサイトの約束がいちばん鋭く効いてくるページです。このファイルは画像ではなく、
# 画像の入った診療記録だからです。ですから中に何が書かれているかについての文も、
# どこへも出ていかないという文と同じだけ慎重に訳してあります。
#

