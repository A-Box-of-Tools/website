[[privacy]]
title = "検査画像には出ていく先がありません。"
body = "Content-Security-Policyには、このページが接続しうるアドレスがすべて書かれていて、そのどれもこのサイトのものではありません。ファイルが集まりうるエンドポイントはここにはなく、あったとしても送るコードがありません。以前は<code>connect-src 'none'</code>と書かれていて、それは完全に閉じていました。広告を入れたことでそれを失いましたし、それを書いておくことまでが約束のうちです。"

[[privacy]]
title = "ここでは他のページよりも重く効いてきます。"
body = "DICOMファイルは、メタデータの付いた画像ではありません。画像の入った診療記録です。患者の氏名、生年月日、患者番号、受付番号、依頼した医師、施設名、装置の製造番号は、どれもヘッダーのフィールドで、ファイルが行く先へそのまま付いていきます。見るためだけにどこかのサイトへ上げるというのは、それをすべてそのサイトの運営者に手渡すということです。このページは、まさにそれをしないためにあります。"

[[privacy]]
title = "読み手はこのリポジトリの14個のファイルです。"
body = "ここではどこかから取ってきたライブラリを使っている箇所はひとつもありません。<code>src/dicom.js</code>がファイルをたどり、<code>src/dictionary.js</code>がタグの名前を知っていて、<code>src/pixels.js</code>がバイト列を測定値に戻し、<code>src/rle.js</code>と<code>src/jpeg-lossless.js</code>がこのページの展開できる2つの圧縮形式を開き、<code>src/window.js</code>が測定された値を画面のグレーに割り当てます。"

[[privacy]]
title = "特定につながる項目は、あなたのためだけに並べられます。"
body = "このページは、その検査画像に写っている人を名指しする、あるいは誰なのかを絞り込むフィールドをすべて書き出します。1枚を誰かに渡そうとしている人こそその答えを必要としているのに、どのビューアもそれに答えないからです。それは目の前の画面に出るだけで、ほかのどこへも行きません。このリポジトリにはその内容を運ぶ分析イベントはありませんし、あったとしてもこのページはそれを送れません。"

[[privacy]]
title = "読むだけです。書きません。"
body = "ファイルを書き換えるボタンはここになく、書き換えうるコードもありません。持ち出せるのは画面に出ている画像のPNGと、ヘッダーのテキストです。どちらもすでにページ上にあるものから、このページの中で組み立てられます。元のファイルはディスクにそのまま残りますし、タブを閉じたらどうなるかという問いへの正直な答えもそれです。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから来ます。どちらにも、あなたのファイルについては何も渡されません。画素も、サムネイルも、名前も、タグも、患者も、ファイル名もです。検査画像を解析し、デコードし、描くすべての行はこのオリジンから配信され、リポジトリに載っています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "上部の「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、文字はGoogle Fontsから読み込みます。それはリンクにすぎません。訪問を報告することもなく、あなたやあなたのファイルについて何かを受け取ることもありません。押さなければ何も起きませんし、押した先は他人のサイトです。"

[[privacy]]
title = "オフラインで動きます。"
body = "回線を切っても、このページのどの部分もそのまま動きます。いちばん簡単な証拠です。検査画像をどこかへ送って描かせる道具なら、線を抜いた瞬間に止まるからです。"

[[howto]]
title = "ファイルを選びます。"
body = "<code>.dcm</code>ファイルを1つ、またはディスクのフォルダごとです。CTやMRIは1スライスに1ファイルなので、まとめてドラッグして入れることがシリーズを組み直す方法になります。ファイルはブラウザがディスクから直接読みますし、その間どこへも何も送られません。"

[[howto]]
title = "シリーズを選びます。"
body = "1つの検査にはたいてい複数入っています。スカウト画像があり、そのあとに撮影ごとのものが続きます。各シリーズは装置が撮った順に重ねられますが、その順は番号ではなく、各スライスが体のどこにあるかから導かれます。番号はいつも同じ向きに振られるとはかぎりません。"

[[howto]]
title = "ウィンドウを合わせます。"
body = "検査画像を読めるようにする操作であり、画像編集ソフトにはないものです。画像の上を横にドラッグするとウィンドウが広がり、上下にドラッグすると中心が動きます。CTなら肺・骨・脳・軟部組織といった名前つきのウィンドウも選べます。CTの単位は世界中のどの装置でも同じだからです。"

[[howto]]
title = "スライスを送ります。"
body = "画像の下のスライダーがスライスを送り、画像を一度クリックしたあとは矢印キーでも同じことができます。複数フレームのファイル、たとえば超音波のループや血管造影は、隣のボタンで再生されます。"

[[howto]]
title = "何かを計測します。"
body = "計測に切り替えて線を引いてください。ファイルが画素の間隔を書いていれば、答えはミリで返り、正方形でない画素もきちんと考慮されます。書いていなければ答えは画素数で返り、そうだと明記します。勝手に尺度を作ることはしません。"

[[howto]]
title = "ヘッダーを読みます。"
body = "ファイルのすべての要素を、番号と、規格が与えている名前と、中身とともに、検索できる形で並べます。その上には、まさにこのファイルの何が患者を特定するのかという一覧が出ます。氏名だけではとてもすみません。"

[[howto]]
title = "必要なものを持ち帰ります。"
body = "画面に出ている画像を、合わせたウィンドウのまま、何も焼き込まずにPNGで。あるいはヘッダー全体をテキストで。どちらもすでにページ上にあるものから、このページの中で作られます。"

[[faq]]
q = "検査画像はどこかへアップロードされますか。"
a = "いいえ。ファイルの読み込み、デコード、描画はすべて手元のブラウザが手元のハードウェアで行います。この道具にはサーバー側というものがそもそもなく、ページの<code>Content-Security-Policy</code>には接続しうるアドレスがすべて書かれていますが、そのどれもこのサイトのものではありません。回線を抜いても検査画像は開けます。<br><br>このサイトのどのページよりも、ここではその事実が効いてきます。DICOMファイルはヘッダーに患者の氏名・生年月日・患者番号を抱えているので、それをビューアへ上げるというのは、見知らぬ相手に画像ではなく診療記録を手渡すということです。"

[[faq]]
q = ".dcmファイルをどう開けばいいですか。"
a = "このページの上にある枠へドロップしてください。<code>.dcm</code>ファイルは、病院の撮影装置が使うDICOM形式のファイルです。このページはブラウザでファイルを読み、検査画像を表示します。インストールもアップロードも必要ありません。Windows、Mac、Linux、Chromebook、スマホで同じように動きます。使うプログラムは、すでにあるブラウザだけです。<br><br>ファイル1つではなくディスクやフォルダを渡された場合は、フォルダ全体をドロップしてください。CTやMRIはスライスごとに1ファイルで、名前の末尾に<code>.dcm</code>がないこともよくあります。一緒に開くことで検査画像が正しい順序に戻ります。ディスクの<code>DICOMDIR</code>ファイルやWindows用ビューアは、そのまま置いておけます。どちらも必要ありません。"

[[faq]]
q = ".dcmファイルとは何ですか。ダブルクリックしても開かないのはなぜですか。"
a = "医療用撮影装置が作った1枚の画像、または画像のループをDICOM形式で保存したものです。患者、撮影装置、画素の配置などを記した数百のフィールドからなるヘッダーの後に、画素そのものが続きます。JPEGの名前を変えただけのものではないため、写真アプリ、画像編集ソフト、ブラウザのタブでは開けません。医療用ビューアを一度もインストールしていない端末には、この形式を開くプログラムが登録されていません。<br><br><code>.dcm</code>で終わるファイルがすべて検査画像とは限りません。同じ3文字をディスクの目録プログラムや自動車のエンジン調整ファイルも使います。このページは名前ではなくファイルそのものを確認し、DICOMではない場合はそう明示します。"

[[faq]]
q = "どのDICOMファイルを開けますか。"
a = "基本のtransfer syntax3種類の非圧縮ファイル、つまりimplicitとexplicitのlittle endian、それに廃止されたbig endianです。さらにdeflated、RLE Lossless、baseline JPEG、そしてJPEG Losslessも開けます。病院のディスクに入っているCTとMRIの検査の大半は、最後のもので圧縮されています。<br><br>JPEG 2000、JPEG-LS、そして動画に使われるMPEGとHEVCの各syntaxはデコードできません。それらにはコンパイル済みライブラリが数メガバイト必要で、必要になったときにそれを取りに行くページは、オフラインで動くページではなくなってしまいます。そうした形式のファイルも開くことは開きます。ヘッダー全体は読んで表示しますし、画像の場所にはコーデック名を書いた一行が入ります。何も教えてくれない壊れた画像のアイコンよりはましだからです。"

[[faq]]
q = "「ウィンドウと中心値」とは何で、なぜ必要なのですか。"
a = "CTの1スライスにはおよそ4000通りの値が入っていて、画面が出せるグレーは256階調です。その4000のうちどの範囲が256を丸ごと受け取るのかを何かが決めなければならず、その選択がウィンドウです。それより下はすべて黒、上はすべて白、あいだの範囲がグレーに広がります。<br><br>同じファイルが2つの設定で別の検査画像のように見えるのはそのためですし、肺と骨を同時に見られないのもそのためです。CTの数値はハウンスフィールド単位で、絶対的に定義されています。水が0、空気が&minus;1000で、世界中のどのCT装置でもそうです。ですからこのページの名前つきウィンドウは、放射線科医がワークステーションで使うのと同じ数値です。MRIや超音波にはそうした尺度がなく、開いたときのウィンドウはファイル自身が求めているものです。"

[[faq]]
q = "計測がなぜ画素で出るのですか。"
a = "そのファイルが画素1つの大きさを書いていないからです。それを持っているのがPixelSpacing (0028,0030)でミリ単位ですが、超音波の画像、紙をスキャンしたもの、secondary captureの多くには、そもそも入っていません。<br><br>入っている場合は計測はミリで返り、軸ごとにその軸の間隔で測ります。画素が正方形でない画像ではこれが効いてきます。入っていない場合の正直な答えは画素数で、尺度を勝手に選んで結果を長さのように見せるのではなく、そうだと書きます。"

[[faq]]
q = "フォルダを開いたら複数のシリーズに分かれました。なぜですか。"
a = "中身がそうだからです。1つの検査はシリーズからできています。スカウト画像があり、そのあとに撮影や再構成ごとのものが続きます。そしてどのファイルも、自分がどれに属するかをSeries Instance UID (0020,000E)に書いています。一覧はフォルダではなくそれをもとに作られます。フォルダのほうはたいてい、全部が名前の一覧として混ざっているだけだからです。<br><br>シリーズの中では、スライスは各々が体のどこにあるかで並べられ、それはImagePositionとImage Orientationから導かれます。Instance Numberはいかにもな手がかりですが、第一候補ではなく代替です。それを振るのはファイルを書いた何かであって、患者の向きと同じ向きに走る必要はないからです。"

[[faq]]
q = "「何が患者を特定するのか」の一覧はどういう意味ですか。"
a = "あなたのファイルの中で、その検査画像に写っている人を名指しする、あるいは誰なのかを絞り込むフィールドのすべてで、手元の端末上のこのファイルから読み取ったものです。一覧の根拠はDICOM規格のPS3.15、つまりあるデータセットを非識別化されたと呼べるようになる前に何が消えていなければならないかを定めた部分です。<br><br>これがあるのは、人が間違えるのが「検査画像に氏名が入っている」という点ではないからです。問題はほかにどれだけ入っているかです。生年月日、受付番号、依頼医、施設、装置の製造番号、そして検査のUID。UIDはそのファイルを作ったアーカイブへ戻る完璧な鍵です。氏名だけ消した検査画像は匿名ではありません。<br><br>この道具は見せるだけです。何も書かず何も変えないので、そのどれかを取り除くこともできません。"

[[faq]]
q = "検査画像を匿名化できますか。"
a = "できませんし、できるふりも意図的にしません。このページは読みます。DICOMファイルを書くコードはありません。このページがするのは、あなたのファイルに何が入っているのかを正確に伝えることで、それこそが調べにくく、人が間違える部分です。<br><br>特定につながる項目を取り除く道具は、はるかに高い水準を求められる別の仕事です。画素に触れずにファイルを書き直し、検査全体でUIDを一貫して置き換え、装置によっては氏名の2つめの写しを隠している私的要素についても正しくなければなりません。それはビューアに付け足すものではなく、このサイトのロードマップにあるものです。"

[[faq]]
q = ".dcm拡張子のないファイルや、壊れたファイルも開けますか。"
a = "どちらも開けます。拡張子は見ておらず、確かめるのはファイルそのものです。よくある128バイトの前置きなしに書かれたデータセット、つまりネットワークから直接出てきた検査画像はそう見えますが、それは最初の要素から符号化を割り出して読み、ページはそうしたと書きます。<br><br>途中で切れているファイルは、行けるところまで読みます。壊れる前のすべてを表示し、何バイト目で止まったかを添えます。ビューアがいちばん必要になるのはまさにそういう場合なので、最後の12バイトのために全体を捨てるのは間違った振る舞いになります。"

[[faq]]
q = "これは診断用のビューアですか。"
a = "いいえ。医療機器ではなく、いかなる規制上の評価も受けておらず、ここにあるどれも臨床的な判断に使うべきではありません。画面は校正されておらず、ブラウザは検証された描画系ではありませんし、そのどちらもウェブページの内側からは直せません。<br><br>一方で、人が検査画像を開くほかのすべての理由には向いています。ディスクに何が入っているかを確かめる、講義や論文のために1枚取り出す、ヘッダーを読む、別のプログラムがなぜこのファイルを拒むのかを調べる、そして検査画像がその人について何を抱えているのかを見る、といったことです。"

[[faq]]
q = "ファイルは書き換えられますか。"
a = "いいえ。この道具は読むだけです。出力ファイルも再エンコードもなく、DICOMを書くボタンもここにはありません。ダウンロードできるのは画面に出ている画像のPNGと、ヘッダーのテキストです。元のファイルはディスクにそのまま残ります。"

[[faq]]
q = "無料ですか。アカウントは必要ですか。"
a = "無料で、アカウントもログインも試用期間もありません。ファイルの大きさにも、いくつ開くかにも制限はなく、あるのは手元の端末のメモリだけです。このサイトは広告で運営されていて、広告側にはあなたのファイルについて何も渡されません。"

[[faq]]
q = "オフラインで動きますか。"
a = "はい。ページを一度読み込んだあと、回線を切っても動き続けます。何もアップロードされていないことを示すいちばん簡単な方法でもあります。検査画像をどこかへ送って描かせる道具なら、線を抜いた瞬間に止まるからです。"

[schema]
