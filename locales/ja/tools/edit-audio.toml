browser_requirements = "JavaScriptと、Web Audioに対応したブラウザが必要です。現行のブラウザはすべて対応しています。ファイルを再生するためにブラウザがすでに備えている以上のコーデックは要りません。"
description = "音声を逆にし、音程を保ったまま、または音程ごと速さを変え、音量を決める操作をブラウザの中で行います。動画の中の音声にも使えます。アップロードはなく、結果はWAVで書き出すので、何もエンコードし直しません。"
features = [
  "音声を正確に逆再生します",
  "0.25倍から4倍まで速さを変えられ、音程は保つことも動かすこともできます",
  "音量を上げ下げでき、フルスケールのすぐ下まで揃えることもできます",
  "MP4・MOV・WebMから、映像に触れずに音声だけ取り出します",
  "16ビットまたは32ビット浮動小数点のWAVを書き出します。エンコーダーは介在しません",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

