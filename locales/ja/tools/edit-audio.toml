[[privacy]]
title = "録音には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
このツールにはネットワーク機能が一切ありません。貼り付けるアドレスも、\
      ダウンロードするものも、初回に取りに行くエンジンもありません。音声に触れる\
      コードは、1バイト残らずページを読み込んだときにこのオリジンから届いた\
      ものです。"""

[[privacy]]
title = "デコーダーはブラウザにすでにあるものです。"
body = """
ファイルを渡す先は<code>decodeAudioData</code>、\
      <code>&lt;audio&gt;</code>要素で音声を再生するのと同じコードです。形式を\
      読むためにここから何かを配ることはありませんし、読むためにこのページの\
      外の何かに頼むこともありません。"""

[[privacy]]
title = "動画の映像は、そもそも一度もデコードしません。"
body = """
動画を入れた場合も、要求するのは音声トラックだけです。フレームは読まず、\
      デコードもせず、描きも見もしません。そうできるコードがこのページに存在\
      しないからです。出てくるファイルには音だけが入っています。"""

[[privacy]]
title = "サンプルは書き留めるだけで、エンコードし直しません。"
body = """
WAVとは、このページが計算したサンプルの前にヘッダーを付けたものです。\
      録音について判断を下すエンコーダーは、この流れの中にありません。そして\
      アップロードと呼べるものが存在しないので、判断が起きる場所もありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、録音に関する\
      情報は渡されません。ファイルも、サンプルも、名前も、サイズも、長さも、\
      音量もです。読み込み、編集、書き出しを行うコードはすべてこのオリジンから\
      配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者やファイルに関する情報も\
      渡されません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。"""

[[howto]]
title = "ファイルを選びます。"
body = """
MP3、WAV、FLAC、M4A、Ogg、Opusを選択欄にドロップしてください。動画から音を\
      取り出したいなら、動画でも構いません。ブラウザがディスクから直接読み出し\
      ます。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "目的が逆再生なら、ここで裏返します。"
body = """
チェックボックスひとつです。サンプルを最後のものから順に書き出します。\
      これは完全に元へ戻せる操作で、2回かければサンプル単位で元のファイルに\
      戻ります。"""

[[howto]]
title = "速さを決めます。"
body = """
スライダーを動かすか、倍率を打ち込むか、用意したボタンを押してください。\
      次に、音程をどうするかを選びます。そのまま保つなら、1.5倍で講義を聴く\
      ようなときにちょうどいい設定です。速さに合わせて動かすほうはテープと\
      同じで、声が高くなったり低くなったりします。"""

[[howto]]
title = "音量を決めます。"
body = """
デシベルで変化量を指定するか、いちばん大きい瞬間が上限のすぐ下に来るまで\
      持ち上げるよう指示します。その瞬間がどこに着地するかは、何かを押す前に\
      ページが表示します。選んだ設定が上限を超えてしまう場合は警告します。"""

[[howto]]
title = "保存します。"
body = """
処理は手元のハードウェアで起きるので、かかる時間は順番待ちではなく端末の\
      性能次第です。出てくるのはWAV、つまりサンプルそのものの前にヘッダーを\
      付けたものです。まずページ上で再生してから、そのままブラウザの\
      ダウンロードへ渡します。"""

[[faq]]
q = "音声はどこかにアップロードされますか？"
a = """
        されません。読み込みも編集も書き出しも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。言われるより\
        確かめたい方は、回線を抜いてから逆再生してみてください。"""

[[faq]]
q = "動画から音声だけ取り出せますか？"
a = """
        できます。ここではMP3を開くのとまったく同じ仕事です。MP4、MOV、WebMを\
        入れると、デコードするのは音声トラックだけです。映像は一度も読まず、\
        出てくるのは動画の入っていない音声ファイルです。\
        欲しいのがそれだけ——音を、そのまま——なら、<a href="../extract-audio-from-video/">動画から音声を抽出</a>が、他に何も載っていないページで同じ仕事をします。音も変えたくなったら、ここへ戻ってきてください。"""

[[faq]]
q = "速さを変えると音程も変わりますか？"
a = """
        そう指示した場合だけです。「音程を保つ」は、録音を約50ミリ秒の重なり合う\
        窓に切り分け、間隔を詰めたり広げたりして並べ直します。波形が交差する\
        ところで揃うように各位置を選ぶので、1.5倍にしても声は同じ声のままです。\
        「音程も動かす」のほうはリサンプリングを行います。テープを速く回したときと\
        同じで、2倍の速さはちょうど1オクターブ上になります。"""

[[faq]]
q = "MP3ではなくWAVで保存されるのはなぜですか？"
a = """
        MP3のエンコーダーを備えたブラウザが存在せず、このツールはそれを持つ\
        サーバーへ録音を送ることを拒むからです。WAVにはエンコーダーがまったく\
        要りません。サンプルの前に44バイトのヘッダーを付けただけのものだからです。\
        ですから、正直な選択であると同時に、音質を損ないようのない唯一の選択でも\
        あります。サイズは大きく、ステレオで1分あたり約10メガバイトです。どの\
        再生機も、スマホも、編集ソフトも開けますし、MP3が必要ならそこから作れます。"""

[[faq]]
q = "どの形式を開けますか？"
a = """
        ブラウザがデコードできるものすべてです。実際にはMP3、WAV、FLAC、M4Aと\
        AAC、Ogg VorbisとOpus、そしてMP4・M4V・MOV・WebMの動画の中の音声です。\
        外れるのはほかと同じ短い一覧で、AVI、WMA、そして大半のMKVです。この\
        ブラウザが読まないファイルは、途中で失敗するのではなく、その旨の\
        メッセージを出して断ります。"""

[[faq]]
q = "大きくすると音が割れませんか？"
a = """
        上限を超えた場合だけで、そうなる前にページが知らせます。デジタル音声には\
        固い天井があります。サンプルはフルスケールより大きくなれないので、それを\
        超えた分は天井に押し潰されます。歪みとして聞こえるのがこれです。「限界まで\
        大きく」は、そうなりようのない設定です。その録音にどれだけ余裕が残って\
        いるかを計算し、ちょうどその分だけ使います。上限より下で行われているのは\
        掛け算だけです。6dB上げて6dB下げれば、サンプルは元の位置に戻ります。"""

[[faq]]
q = "逆再生や速度変更で音質は落ちますか？"
a = """
        逆再生では落ちません。同じサンプルが逆の順に出てくるだけで、これは完全に\
        正確です。速さを変えるとすべてのサンプルが動くので、複製ではなく計算に\
        なります。リサンプリングの過程できちんとフィルターをかけるので、速くしても\
        高い音が金属的な鳴りとして折り返してくることはありませんし、伸縮の窓も\
        計算上たまたま来た位置ではなく、波形が揃う位置に置きます。どちらの経路でも\
        何かをエンコードし直すことはありません。エンコードし直すためのエンコーダーが\
        ここにないからです。"""

[[faq]]
q = "ファイルの長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。現実的な上限はメモリです。録音全体を\
        一度にこのページへデコードし、ダウンロード前にWAVをメモリ上で組み立てるので、\
        ステレオ1時間なら1ギガバイト弱の作業領域が要ります。4ギガバイトのWAVは\
        そもそも受け付けません。形式自身のサイズ欄がその大きさを記述できないから\
        です。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に録音の情報が渡される\
        ことはありません。"""

