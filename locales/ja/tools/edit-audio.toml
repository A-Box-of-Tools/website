title = "音声の逆再生・速度変更・音量アップ｜無料・アップロード不要"
description = "音声を逆から再生し、速くしたり遅くしたりし、小さな録音を大きくします。動画から音声だけ取り出すこともできます。処理はブラウザの中だけ。アップロードはありません。"
