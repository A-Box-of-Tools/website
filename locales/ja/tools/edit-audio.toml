[[privacy]]
title = "寄付ボタンが読み込むもの、そして渡されないもの。"
body = """

      ヘッダーの「Buy me a coffee」ボタンは cdnjs.buymeacoffee.com の\
      スクリプトが描き、書体を Google Fonts から取っています。これはリンク以上の\
