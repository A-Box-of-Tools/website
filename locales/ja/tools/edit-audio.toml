[[privacy]]
title = "デコーダーはあなたのブラウザにすでにあるものです。"
body = """

      ファイルは <code>decodeAudioData</code> に渡されます。
      <code>&lt;audio&gt;</code> 要素で音声を再生するのと同じコードです。\
      あなたの形式を読むためにここから何かを配ることはなく、読むために\
      このページの外の何かに頼むこともありません。"""

[[privacy]]
title = "動画の映像は、そもそも一度も復号されません。"
body = """
 動画を入れた場合も、\
      要求されるのは音声トラックだけです。フレームは読まれず、復号されず、\
      描かれず、見られもしません &mdash; そうできるコードがこのページに\
      存在しないからです。出てくるファイルには音だけが入っています。"""

[[privacy]]
title = "サンプルは書き留められるだけで、エンコードし直されません。"
body = """

      WAV とは、このページが計算したサンプルの前にヘッダーを付けたものです。\
      あなたの録音について判断を下すエンコーダーは、この流れの中にありません。\
      そしてアップロードと呼べるものが存在しないので、判断が起きる場所も\
      ありません。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から来ています。そのどちらにも、あなたの録音に関する\
      情報は渡されません。ファイルも、サンプルも、名前も、サイズも、長さも、\
      音量もです。読み込み、編集、書き出しを行うコードはすべてこのオリジンから\
