      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 このツールにはネットワーク機能が\
      一切ありません。貼り付けるアドレスも、ダウンロードするものも、初回に取りに行く\
