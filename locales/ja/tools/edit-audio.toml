[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切っても、このページの機能はすべて\
      そのまま動きます。これがいちばん単純な証明です。"""

[[howto]]
title = "ファイルを選びます。"
body = """
 MP3、WAV、FLAC、M4A、Ogg、Opus を\
      選択欄にドロップしてください &mdash; 動画から音を取り出したいなら動画でも\
      構いません。ブラウザがディスクから直接読み出します。その間に何かがどこかへ\
      送られることはありません。"""

[[howto]]
title = "目的が逆再生なら、ここで裏返します。"
body = """
 チェックボックス\
      ひとつです。サンプルが最後のものから順に書き出されます。これは完全に\
      元へ戻せる操作で、2回かければサンプル単位で元のファイルに戻ります。"""

[[howto]]
title = "速さを決めます。"
body = """
 スライダーを動かすか、倍率を打ち込むか、\
      用意されたボタンを押してください。次に、音程をどうするかを選びます。\
      そのまま保つ &mdash; 1.5倍で講義を聴くならこちらです &mdash; か、\
      速さに合わせて動かす。後者はテープと同じで、声が高くなったり低くなったり\
      します。"""

[[howto]]
title = "音量を決めます。"
body = """
 デシベルで変化量を指定するか、いちばん大きい\
      瞬間が上限のすぐ下に来るまで持ち上げるよう頼むかです。その瞬間がどこに\
      着地するかは、何かを押す前にページが表示します。選んだ設定が上限を超えて\
      しまう場合は警告します。"""

[[howto]]
title = "保存します。"
body = """
 処理はあなた自身のハードウェアで起きるので、かかる\
      時間は順番待ちではなく端末の性能次第です。出てくるのは WAV &mdash;
      サンプルそのものの前にヘッダーを付けたもの &mdash; で、まずページ上で\
      再生してから、そのままブラウザのダウンロードへ渡されます。"""

[[faq]]
q = "音声はどこかにアップロードされますか？"
a = """
        されません。読み込みも編集も書き出しも、あなた自身のブラウザがあなた\
        自身のハードウェア上で行います。このツールにサーバー側は存在せず、\
        ページの <code>Content-Security-Policy</code> は接続してよいアドレスを\
        すべて挙げていますが &mdash; そのどれも当サイトのものではありません。\
        言われるより確かめたい方は、回線を抜いてから逆再生してみてください。"""

[[faq]]
q = "動画から音声だけ取り出せますか？"
a = """
        できます。ここでは MP3 を開くのとまったく同じ仕事です。MP4、MOV、WebM を\
        入れると、復号されるのは音声トラックだけです。映像は一度も読まれず、\
        出てくるのは動画の入っていない音声ファイルです。編集を一切せずに映像から\
        音だけ保存したい場合も、この方法で行えます &mdash; 設定に触れずに\
        ボタンを押すだけです。"""

[[faq]]
q = "速さを変えると音程も変わりますか？"
a = """
        そう頼んだ場合だけです。「音程を保つ」は、録音を約50ミリ秒の重なり合う\
        窓に切り分け、間隔を詰めたり広げたりして並べ直します。波形が交差する\
        ところで揃うように各位置を選ぶので、1.5倍にしても声は同じ声のままです。\
        「音程も動かす」のほうは再標本化を行います。テープを速く回したときと\
        同じで、2倍の速さはちょうど1オクターブ上になります。"""

[[faq]]
q = "MP3 ではなく WAV で保存されるのはなぜですか？"
a = """
        MP3 のエンコーダーを備えたブラウザが存在せず、このツールはそれを持つ\
        サーバーへあなたの録音を送ることを拒むからです。WAV にはエンコーダーが\
        まったく要りません &mdash; サンプルの前に44バイトのヘッダーを付けた\
        だけのものです &mdash; ですから、正直な選択であると同時に、画質ならぬ\
        音質を損ないようのない唯一の選択でもあります。サイズは大きく、ステレオで
        1分あたり約10メガバイトです。どの再生機も、スマホも、編集ソフトも開けます\
        し、MP3 が必要なものはそこから作れます。"""

[[faq]]
q = "どの形式を開けますか？"
a = """
        ブラウザが復号できるものすべてです。実際には MP3、WAV、FLAC、M4A と AAC、
        Ogg Vorbis と Opus、そして MP4・M4V・MOV・WebM の動画の中の音声です。\
        外れるのはほかと同じ短い一覧で、AVI、WMA、そして大半の MKV です。この\
        ブラウザが読まないファイルは、途中で失敗するのではなく、その旨の\
        メッセージを出して断ります。"""

[[faq]]
q = "大きくすると音が割れませんか？"
a = """
        上限を超えた場合だけで、そうなる前にページが知らせます。デジタル音声には\
        固い天井があります。サンプルはフルスケールより大きくなれないので、それを\
        超えた分は天井に押し潰されます。歪みとして聞こえるのがこれです。\
        「限界まで大きく」はそうなりようのない設定です &mdash; その録音に\
        どれだけ余裕が残っているかを計算し、ちょうどその分だけ使います。上限より\
        下では、行われているのは掛け算だけです。6 dB 上げて 6 dB 下げれば、\
        サンプルは元の位置に戻ります。"""

[[faq]]
q = "逆再生や速度変更で音質は落ちますか？"
a = """
        逆再生では落ちません。同じサンプルが逆の順に出てくるだけで、これは\
        完全に正確です。速さを変えるとすべてのサンプルが動くので、複製ではなく\
        計算になります &mdash; 再標本化の過程できちんとフィルターをかけるので、\
        速くしても高い音が金属的な鳴りとして折り返してくることはありませんし、\
        伸縮の窓も計算上たまたま来た位置ではなく、波形が揃う位置に置かれます。\
        どちらの経路でも何かをエンコードし直すことはありません。エンコードし直す\
        ためのエンコーダーがここにないからです。"""

[[faq]]
q = "ファイルの長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。現実的な上限はメモリです。録音全体が\
        一度にこのページへ復号され、ダウンロード前に WAV がメモリ上で組み立て\
        られるので、ステレオ1時間なら1ギガバイト弱の作業領域が要ります。4ギガ\
        バイトの WAV はそもそも受け付けません。形式自身のサイズ欄がその大きさを\
        記述できないからです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        録音に関する情報が渡されることはありません。"""

[schema]
browser_requirements = "JavaScript と Web Audio に対応したブラウザが必要です。現行のブラウザはすべて対応しています。ファイルを再生するためにブラウザがすでに備えている以上のコーデックは要りません。"
description = "音声を逆にし、音程を保ったまま、または音程ごと速さを変え、音量を決める操作をブラウザ内で行います。動画の中の音声にも使えます。アップロードはなく、結果は WAV として書き出されるので、何もエンコードし直されません。"
features = [
  "音声を正確に逆再生します",
  "0.25倍から4倍まで速さを変えられ、音程は保つことも動かすこともできます",
  "音量を上げ下げでき、フルスケールのすぐ下まで揃えることもできます",
  "MP4・MOV・WebM から、映像に触れずに音声だけ取り出します",
  "16ビットまたは32ビット浮動小数点の WAV を書き出します。エンコーダーは介在しません",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに音声ファイルか動画をドロップ"
hint = "クリックして選ぶこともできます &mdash; MP3、WAV、FLAC、M4A、Ogg、そして MP4・MOV・WebM の中の音声"
