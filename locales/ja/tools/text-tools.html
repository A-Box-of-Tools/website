<main>
  <!-- ステップ1 &mdash; 4つのうちどの仕事か -->
  <section class="card">
    <h2><span class="step">1</span> 仕事を選ぶ</h2>

    <!--
      A tab strip rather than four pages, because the four jobs share an input:
      the JSON you just formatted is the JSON you want to diff against the one
      from the other branch, and retyping it into a second tool is the thing
      this arrangement exists to avoid. `role="tablist"` and the arrow keys are
      wired in main.js.
    -->
    <div class="tabs" role="tablist" aria-label="テキストをどうするか">
      <button type="button" role="tab" id="tab-format" class="tab" data-mode="format"
              aria-selected="true" aria-controls="options-format">整形</button>
      <button type="button" role="tab" id="tab-convert" class="tab" data-mode="convert"
              aria-selected="false" tabindex="-1" aria-controls="options-convert">変換</button>
      <button type="button" role="tab" id="tab-encode" class="tab" data-mode="encode"
              aria-selected="false" tabindex="-1" aria-controls="options-encode">エンコード</button>
      <button type="button" role="tab" id="tab-diff" class="tab" data-mode="diff"
              aria-selected="false" tabindex="-1" aria-controls="options-diff">比較</button>
    </div>

    <div class="settings" id="options-format" role="tabpanel" aria-labelledby="tab-format">
      <div class="field">
        <label for="language">言語</label>
        <select id="language">
          <option value="auto" selected>テキストから判定する</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="yaml">YAML</option>
        </select>
        <p class="field-note" id="language-note">
          判定はあくまで出発点で、直すのはクリック1回です。
        </p>
      </div>

      <div class="field">
        <label for="indent">字下げ</label>
        <select id="indent">
          <option value="2" selected>半角2つ</option>
          <option value="4">半角4つ</option>
          <option value="tab">タブ</option>
        </select>
      </div>

      <div class="field">
        <label for="style">仕上げ方</label>
        <select id="style">
          <option value="pretty" selected>整える</option>
          <option value="minify">平らに詰める</option>
        </select>
        <p class="field-note" id="style-note"></p>
      </div>

      <div class="field checks">
        <label class="check" for="sort-keys">
          <input type="checkbox" id="sort-keys">
          すべてのオブジェクトのキーを並べ替える
        </label>
        <p class="field-note">
          コードポイントではなく読みの順で並べるので、<code>item2</code>が<code>item10</code>より前に来ます。JSONのみです。
        </p>
      </div>
    </div>

    <div class="settings" id="options-convert" role="tabpanel" aria-labelledby="tab-convert" hidden>
      <div class="field">
        <label for="conversion">変換</label>
        <select id="conversion"></select>
        <p class="field-note" id="conversion-note"></p>
      </div>

      <div class="field" id="root-field" hidden>
        <label for="root-name">いちばん外側の要素の名前</label>
        <input type="text" id="root-name" value="root" spellcheck="false" autocomplete="off">
        <p class="field-note">
          XMLは頂点にひとつだけ要素を持ちますが、JSONは持ちません。だから、ひとつこしらえる必要があります。
        </p>
      </div>
    </div>

    <div class="settings" id="options-encode" role="tabpanel" aria-labelledby="tab-encode" hidden>
      <div class="field">
        <label for="codec">エンコード方式</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>どちら向きか</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>エンコード</strong> 平文を入れて、符号化して出します。</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>デコード</strong> 符号化されたものを入れて、平文で出します。</span>
          </label>
        </fieldset>
      </div>
    </div>

    <div class="settings" id="options-diff" role="tabpanel" aria-labelledby="tab-diff" hidden>
      <div class="field">
        <label for="view">見せ方</label>
        <select id="view">
          <option value="split" selected>左右に並べる</option>
          <option value="unified">1列にまとめる</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          変わったところだけ、前後3行を添えて表示する
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          空白の違いを無視する
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          大文字と小文字の違いを無視する
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          空行を無視する
        </label>
      </div>
    </div>
  </section>

  <!-- ステップ2 &mdash; テキストそのもの -->
  <section class="card">
    <h2><span class="step">2</span> 貼り付ける</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes" id="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input" id="input-label">あなたのテキスト</label>
          <span class="count" id="input-count">空</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="JSON・XML・HTML・CSS・YAMLをここに貼り付けるか、上にファイルをドロップしてください。"></textarea>
      </div>

      <div class="pane" id="pane-b" hidden>
        <div class="pane-head">
          <label for="input-b">もう一方</label>
          <span class="count" id="input-b-count">空</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="比べる相手のほうを貼り付けてください。"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count" id="detected"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">例を試す</button>
        <button type="button" id="swap" class="ghost" hidden>左右を入れ替える</button>
        <button type="button" id="clear" class="ghost danger">消去</button>
      </div>
    </div>
  </section>

  <!-- ステップ3 &mdash; 出てきたもの -->
  <section class="card">
    <h2><span class="step">3</span> 結果を持ち出す</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">まだ何もありません。</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>コピー</button>
        <a id="download" class="ghost as-button" hidden download>ダウンロード</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>

    <div id="diff-view" class="diff" hidden></div>
  </section>
</main>
