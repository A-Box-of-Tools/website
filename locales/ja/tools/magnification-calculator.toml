#
# 倍率計算ツール - Japanese.
#
# Overrides for tools/magnification-calculator/tool.toml. Only words: the slug,
# the category, the icon and the list of shared parts stay where they are.
#
# What is printed on an instrument stays as it is printed - 8×42, 40×/0.65,
# 675× - because that is the mark a reader is holding the page up against. A
# magnification inside a sentence is 70倍, which is how Japanese says it and
# how the page's own `unit.times` phrase writes the figures beside these words.
#
# A measure keeps the space between its number and its unit, 42 mm. Every
# figure the page works out is written by Intl, which gives Japanese "5.25 mm",
# and these sentences sit in the same rows as those figures. Number Explorer's
# Japanese closes its measures up; here that would put 5.25 mm beside 5.25mm.
# A number that ends in a kanji is the exception the house style already makes,
# 6.29億km, because a space there would stand between Japanese and Latin.
#

