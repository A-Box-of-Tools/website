[[howto]]
title = "機器を選び、そこに書かれている数字を入力します。"
body = "天体望遠鏡には口径と焦点距離が、接眼レンズ（アイピース）にはそれぞれの焦点距離が書かれています。双眼鏡には8×42のように2つの数字があります。顕微鏡の対物レンズには、40×/0.65のように倍率と開口数（NA）が書かれています。ルーペ（虫眼鏡）には、倍率、焦点距離、ディオプトリのいずれかが書かれています。"
[[howto]]
title = "ダイヤルをドラッグして、ゾーンを順にたどります。"
body = "ダイヤルは倍率を変えます。天体望遠鏡と顕微鏡では接眼レンズを、双眼鏡とルーペでは書かれている倍率を変えます。ダイヤルの帯は、機器そのものの限界に合わせて色分けされています。「最も鮮明」から「有効な上限」へ、さらに「無効倍率」へと移るときの判定を見てください。"
[[howto]]
title = "3つの絵を見比べます。"
body = "1つ目は、のぞき込む円の全体で、対象を正しい縮尺で描いています。2つ目はその中央のクローズアップで、視力のよい目に見える鮮明さで描いています。3つ目は同じクローズアップを機器なしで見たもので、2つ目と3つ目の違いが倍率です。"
[[howto]]
title = "それぞれの数字の意味を読み、前提を確かめます。"
body = "視野、射出瞳径、見分けられる細かさ、集光力を、結果のそばで計算しています。瞳孔の幅、接眼レンズの視界、ルーペの倍率の数え方を変えて、それぞれの規則の出どころを読めます。"

[[faq]]
q = "双眼鏡の8×42は何を意味しますか？"
a = "1つ目の数字は倍率です。ものが8倍の幅に見え、8倍近づいて見たのと同じになります。2つ目は左右それぞれの対物レンズの幅で、42 mmです。2つ目を1つ目で割ると射出瞳径（ひとみ径）になり、ここでは5.25 mmです。これは目に届く光束の幅です。夕暮れに8×42が明るさを保ち、8×21が保てないのはこのためです。"
[[faq]]
q = "天体望遠鏡の倍率はどうやって計算しますか？"
a = "望遠鏡の焦点距離を、接眼レンズ（アイピース）の焦点距離で割ります。焦点距離700 mmの望遠鏡に10 mmの接眼レンズなら70倍で、2×のバローレンズを加えるとその2倍になります。望遠鏡そのものに決まった倍率はないので、箱に倍率が1つだけ書かれていれば、それは付属する最も短い接眼レンズの話で、見え方を表すものではありません。"
[[faq]]
q = "天体望遠鏡の有効な最高倍率はどれくらいですか？"
a = "口径（mm）の約2倍、つまり口径1インチあたり50倍です。口径70 mmの望遠鏡なら140倍、200 mmなら400倍になります。細部はレンズや鏡の幅で決まり、この倍率までにそのすべてが無理なく見えるようになります。それを超えると像が大きく、甘く、暗くなるだけで、これを無効倍率（過剰倍率）と呼びます。さらに、望遠鏡がどれほど大きくても、たいていの夜はシーイング（大気のゆらぎ）のために約300倍が上限になります。"
[[faq]]
q = "675×の望遠鏡は100×の望遠鏡より優れていますか？"
a = "その数字では決まりません。675×として売られている口径60 mmの望遠鏡が本当の細部を見せられるのは約120倍までで、その先は同じぼけが引き伸ばされて暗くなるだけです。比べるなら口径です。レンズや鏡が広いほうが、どの倍率でも、より細かいところ、より暗いものまで見せてくれます。"
[[faq]]
q = "土星の環や木星の衛星は何倍で見えますか？"
a = "多くの人が思うより低い倍率で見えます。木星の4つの大きな衛星は、7〜10倍のふつうの双眼鏡で光の点として見えます。土星の環は約25〜30倍から小さな楕円として見え始め、口径60 mm以上の望遠鏡で100倍以上にすると、惑星本体からはっきり離れて見えます。上でどちらも試してみてください。惑星は視野の中で小さいままですが、実際にそう見えるのです。"
[[faq]]
q = "顕微鏡の40倍、100倍、400倍、1000倍では何が見えますか？"
a = "40倍では視野の幅が約4.5 mmで、食塩の結晶、昆虫の体の各部、布の織り目が見えます。100倍では1.8 mmで、タマネギの表皮のような植物の細胞や、太いケーブルのように見える髪の毛が見えます。400倍では0.45 mmで、核のある1つ1つの細胞や、小さな円盤のような赤血球が見えます。油浸対物レンズを使った1000倍では0.18 mmで、細菌が棒や点としてはっきり見分けられます。これらの幅は、視野数18 mmの一般的な10×の接眼レンズを前提にしています。"
[[faq]]
q = "1000倍にしても新しいものが見えないことがあるのはなぜですか？"
a = "顕微鏡で見分けられる細かさは、総合倍率ではなく、対物レンズの開口数（スラッシュの後ろの数字）で決まるからです。有効な範囲はその数字の約500〜1000倍で、40×/0.65の対物レンズなら325〜650倍です。これに25×の接眼レンズを付けて1000倍にしても、ぼけが大きくなるだけです。100×/1.25の油浸対物レンズなら、同じ1000倍でも約半分の大きさの細部まで見分けられます。"
[[faq]]
q = "射出瞳径（ひとみ径）とは何ですか？"
a = "接眼レンズから出て目に入る光束の幅で、口径を倍率で割った値です。自分の瞳孔（暗闇で約7 mm、昼間で2〜3 mm）より広いと、余った光は目に入りません。約1 mmを下回ると像が甘く暗くなり始め、0.5 mmを切ると無効倍率の領域に入ります。"
[[faq]]
q = "ルーペ（虫眼鏡）の倍率は、ディオプトリや焦点距離とどう関係しますか？"
a = "焦点距離（mm）は1000をディオプトリで割った値で、倍率は250 mmを焦点距離で割った値です。つまり10倍のルーペは、焦点距離が25 mmで40ディオプトリです。ディオプトリが書かれた照明付きルーペや読書用ルーペは、目のピントを近くに合わせた状態で数えて、ふつう1を足します。+3ディオプトリは1.75×として、+20ディオプトリのレンズは6×として売られ、1を足さないメーカーなら5×になります。強いレンズほど小さく、近づけて使う必要があります。10倍のルーペは、対象から約25 mmの距離で使います。"
[[faq]]
q = "カメラの10倍ズームは、10倍の双眼鏡と同じですか？"
a = "いいえ。カメラのズームの数字は、最も長い焦点距離と最も短い焦点距離の比なので、24&ndash;240 mmのレンズは、何が写るかに関係なく10倍です。フルサイズのカメラで50 mmを標準の見え方として目と比べると、このレンズは約0.5倍から約5倍までにあたります。双眼鏡や望遠鏡の倍率は、目そのものと比べた値です。"
[[faq]]
q = "USB顕微鏡の1000×も同じ意味ですか？"
a = "計算のしかたが違います。デジタル顕微鏡の数字は、画面上の像の大きさを実物の大きさで割ったものなので、モニターが大きいほど増え、細部については何も表しません。見分けられる細かさは、やはりレンズで決まります。目安としては視野のほうが役に立ちます。幅約2 mmの範囲を映す機器は、箱に何と書かれていても、おおよそ100倍の光学顕微鏡と同じ水準で働いています。"
[[faq]]
q = "絵は写真ですか？"
a = "いいえ。数字をもとにページの中で描いた絵です。大きさは正しい縮尺で、像の甘さはその縮尺での機器そのもののぼけ、暗さは射出瞳径に従っています。月の海と最大級のクレーター、木星の衛星、土星の環、プレアデス星団（すばる）の最も明るい星は、公表されている数値をもとに配置しています。小さなクレーター、細胞、羽はイラストです。実際の見え方は、大気、光学系の品質、自分の目にも左右されます。"
[[faq]]
q = "このツールはオフラインで動きますか？"
a = "はい。ページを読み込んだ後は、計算と描画のすべてが接続なしで動きます。入力した内容がアップロードされたり保存されたりすることはありません。"

