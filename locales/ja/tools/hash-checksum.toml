title = "あなたのファイルには、出ていく先がありません。"
body = """\
      Content-Security-Policy に、このページが接続してよいアドレスがすべて\
      書いてあります。そのどれも当サイトのものではありません。あなたのファイル\
      が集まる先はここになく、仮にあったとしても、そこへ送るコードは書かれて\
      いません。以前は <code>connect-src 'none'</code> と書いてあり、それは\
      文字どおり絶対でした。広告を入れた代償がそれで、そう言うところまでが\
      約束のうちです。"""

[[privacy]]
title = "ファイルが丸ごとどこかに置かれることは、どんなサイズでもありません。"
body = """\
      4メガバイトずつ読み、読んだ分は計算中の状態に取り込んでから捨てます。\
      ですからこのページが使うメモリーは、40ギガバイトのディスクイメージでも\
      テキストファイルでも同じで、ここから先は無理という大きさもありません。\
      ブラウザー自身の <code>crypto.subtle.digest</code> を使っていないのも\
      同じ理由です。あの関数はファイル全体を一度にメモリーへ要求します。\
      それこそ、この道具が持たずに済ませたい上限そのものです。"""

[[privacy]]
title = "五つの方式、このリポジトリの五つのファイル。"
body = """\
 <code>src/md5.js</code>・\
      <code>src/sha1.js</code>・<code>src/sha256.js</code>・\
      <code>src/sha512.js</code> は、公開された仕様をそのまま書き下したもので、\
      それぞれ六十行ほどです。定数表は計算させずに書き出してあります。結果が\
      ブラウザーに左右されないようにするためです。どれもビルドのたびに、公式の\
      試験ベクターと、OS自身の実装の両方に照らして確認しています。"""

[[privacy]]
title = "貼り付けたチェックサムも、どこにも送られません。"
body = """\
      照合はこのページの中で、ここで計算した値に対して行われます。その照合に\
      ついて誰かが知ることはありません。値も、一致したかどうかも、ファイル名も\
      です。これは聞こえよりも重い話で、チェックサムとファイル名が揃えば、\
      それを集めた側にはあなたがどのソフトのどのビルドを落としたかが正確に\
      分かってしまいます。"""

