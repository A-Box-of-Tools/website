[[privacy]]
title = "画像が送られる先はありません。"
body = "Content-Security-Policyにはこのページが接続できるアドレスがすべて書かれていますが、このサイト自身のものはありません。ファイルを収集する受け口も、それを送信するコードもありません。"

[[privacy]]
title = "透明度はそのまま保ちます。"
body = "WebPにもPNGと同じアルファチャンネルがあるので、透明な背景のロゴは透明なままです。背景色を選ぶ必要も、塗りつぶす部分もありません。アルファチャンネルのないJPEGへ変換する<a href=\"../webp-to-jpg/\">WebPをJPGに変換するツール</a>との違いです。"

[[privacy]]
title = "可逆圧縮かどうかは、実際に確かめます。"
body = "キャンバスに可逆圧縮の指定スイッチはありません。ブラウザは画質の値から方式を選び、現在のブラウザは最大値で可逆圧縮を書きます。ただし仕様上の保証ではないので、書いたファイルを毎回読み直し、本当に可逆圧縮か結果に表示します。将来ブラウザの動作が変わっても、その場で伝えます。"

[[privacy]]
title = "キャンバスが引き継がない情報。"
body = "画像をデコードしてキャンバスに描画します。キャンバスは画素だけを保つので、PNGのテキストチャンク、ICC色プロファイル、XMPは残りません。可逆圧縮で保つのは画素で、その周りのメタデータではありません。<a href=\"../exif-editor/\">EXIF表示・削除ツール</a>はJPEG、PNG、WebPの画像を再エンコードせずにメタデータを閲覧・編集します。AVIFは抽出できたEXIFの読み取り専用表示に対応し、最初にデコードした画像を新しいPNGへ変換して削除します。色やHDRが変わる場合があります。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから読み込みます。画像についての情報はどれにも渡しません。ファイルを読み、デコードし、書き出すコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "オフラインでも動きます。"
body = "ページを一度開いて通信を切っても、動作は変わりません。画像を別の場所へ送って変換するツールにはできない、一番簡単な確認方法です。"

[[howto]]
title = "PNGとAVIFファイルを選びます。"
body = "選択欄にドロップするか、ファイルを選びます。名前ではなく先頭のバイトで判別するので、本当にJPEGであるファイルはそのことを伝えて受け付けません。透明な部分がある場合も行に表示します。"

[[howto]]
title = "可逆圧縮か、さらに小さくするかを選びます。"
body = "可逆圧縮では不透明な画素をすべて保ち、それでも小さくなります。スクリーンショット、図、ロゴ、文字に向いています。「さらに小さく」では画質スライダーが現れます。写真では見た目をほぼ保ったまま大きく容量を減らせます。"

[[howto]]
title = "「変換」を押し、実際の結果を読みます。"
body = "新しいサイズと変化に加え、ブラウザが実際に使った方式を表示します。可逆圧縮か、選んだ画質の非可逆圧縮かです。設定を繰り返すのではなく、完成したファイルから読み取ります。"

[[howto]]
title = "個別に、またはまとめてダウンロードします。"
body = "1個なら個別のダウンロード、2個以上ならZIPも使えます。同名のファイルには拡張子の前に番号を付け、ZIPの中で上書きされるのを防ぎます。"

[[faq]]
q = "画像はどこかへアップロードされますか？"
a = "いいえ。読み込み、デコード、書き出しはすべてお使いのブラウザとハードウェアで行います。ツールはネットワークから取得も送信もしません。<code>Content-Security-Policy</code>に書かれた接続先に、このサイト自身のものはありません。"

[[faq]]
q = "透明度は保たれますか？"
a = "はい。どちらの方式でも保ちます。PNGをJPEGではなくWebPにする主な理由です。WebPにはアルファチャンネルがあり、透明なロゴの背景はそのままです。背景色を選んだり塗りつぶしたりしません。変換前の行に透明度の有無、変換後の結果に透明度を保ったことを表示します。"

[[faq]]
q = "可逆圧縮と「さらに小さく」の違いは何ですか？"
a = "可逆圧縮では不透明な画素が元のPNGと同じで、それでも通常は5分の1から3分の1ほど小さくなります。WebPの可逆圧縮がPNGより効率的だからです。半透明な画素の注意点は次の質問にあります。「さらに小さく」は気付きにくい細部を捨てる非可逆圧縮で、写真は10分の1になることもあります。文字、単色、鋭い輪郭には可逆圧縮、写真には非可逆圧縮が目安です。"

[[faq]]
q = "「不透明な画素」とは、半透明の画素は違うのですか？"
a = "ごくわずかに変わることがあり、WebPではなくキャンバスによるものです。ブラウザは色に透明度を掛けた値を保存します。この計算は完全には元に戻せず、透明になるほど元の色の情報が失われます。キャンバスを使うブラウザの変換ツールに共通します。<br><br>完全に不透明、または完全に透明な画素はそのままです。中間の画素では、透明度が4分の3より高い場合に255段階中最大63、それ以外で最大4の差を測定しました。大きく変わるのはほぼ見えない画素なので、見た目は変わりません。影響するのはロゴの滑らかな輪郭のような場所だけです。<br><br>保存用に完全に一致する原本が必要ならPNGを残してください。同じ見た目で容量を3分の1ほど減らしたい場合にこのツールを使えます。"

[[faq]]
q = "本当に可逆圧縮だとどう分かりますか？"
a = "設定を繰り返すのではなく、完成したファイルを読み直して確かめます。WebPは可逆圧縮なら<code>VP8L</code>、非可逆圧縮なら<code>VP8&nbsp;</code>のチャンクに画素を保存します。このページは実際のチャンクを調べて結果に表示します。キャンバスに可逆圧縮のフラグはないので、画質の最大値を指定してブラウザの判断に任せます。現在のブラウザは対応していますが、それでも毎回確認します。"

[[faq]]
q = "WebPはどこでも開けますか？"
a = "ウェブでは開けます。Chrome、Edge、Firefox、Safariはすべて2020年から表示に対応しています。ブラウザ以外では違います。WindowsとmacOSはプレビューできますが、古いソフト、一部のフォーム、電子書籍端末には対応しないものがあります。相手がWebPを受け付けない場合は、逆向きの<a href=\"../webp-to-jpg/\">WebPをJPGに変換するツール</a>を使ってください。"

[[faq]]
q = "そもそもPNGが大きいのはなぜですか？"
a = "PNGは可逆圧縮で、写真はその方法では小さくしにくいためです。同じ部分が繰り返すスクリーンショットやロゴには向きますが、繰り返しの少ない写真には不向きです。電話で撮った写真をPNGで保存すると、JPEGの10倍になることもあります。その場合は非可逆圧縮が役立ちます。容量の上限に収めたいなら、画質ではなく目標サイズを指定する<a href=\"../compress-image/\">画像圧縮ツール</a>を使ってください。"

[[faq]]
q = "撮影日時、カメラ、位置情報は残りますか？"
a = "いいえ。キャンバスは画素だけを保つので、メタデータは残りません。<a href=\"../exif-editor/\">EXIF表示・削除ツール</a>はJPEG、PNG、WebPの画像を再エンコードせずにメタデータを閲覧・編集します。AVIFは抽出できたEXIFの読み取り専用表示に対応し、最初にデコードした画像を新しいPNGへ変換して削除します。色やHDRが変わる場合があります。"

[[faq]]
q = "フォルダごと変換できますか？"
a = "はい。サーバーで処理しないので、個数や容量の制限はありません。好きなだけ追加できます。ファイルごとに結果とダウンロードがあり、2個以上ならZIPも使えます。上部には全体の容量削減を表示します。"

[[faq]]
q = "無料ですか？アカウントは必要ですか？"
a = "無料で、アカウント、ログイン、お試し期間、透かしはありません。広告で運営していますが、画像の情報は広告に渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。ページを一度開いて通信を切っても同じように動きます。ファイルを別の場所へ送って処理するツールなら通信が切れた瞬間に止まるので、何もアップロードされないことの直接の確認になります。"


[[faq]]
q = "AVIF画像も変換できますか？"
a = "ブラウザがデコードできるAVIFも入力できます。出力形式はWebPのままです。AVIFシーケンスは最初にデコードされた画像だけを書き出します。ブラウザのCanvasは8ビットSDRのコピーを作るため、色やHDRが変わる場合があります。メタデータは引き継がれず、ファイルが大きくなる場合もあります。元のファイルは変わりません。"

