[[privacy]]
title = "顔写真がこの端末から出ることはありません。"
body = """
これは多くの道具よりここで重く効きます。このページが扱うファイルは\
      あなたの顔の画像であり、これからしようとしていることは、どの国の書類を\
      申請するのかまで示しているからです。<code>Content-Security-Policy</code>には\
      このページが接続してよいアドレスがすべて書かれていて、そのどれもこのサイトの\
      ものではありません。あなたの写真が集められるような受け口はここにありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も、\
      <code>XMLHttpRequest</code>も、<code>sendBeacon</code>もありません。規定集は\
      <code>src/specs.js</code>の中の表で、ページと一緒に配信され、ページと一緒に\
      キャッシュされます。参照しに行く国名リストもなければ、遠くにある何かと\
      あなたの写真を照らし合わせることもありません。"""

[[privacy]]
title = "顔は顔モデルなしで見つけます。"
body = """
 ダウンロードする重みも、それを動かす推論エンジンも、      取りに行くものもありません。頭頂は背後の壁に対する頭の輪郭から、瞳は顔の      うち周囲より暗い部分から求めます。肌の色を読む箇所はどこにもなく、そう      書いてある理由がまさにそれです&mdash;誤る模型は一様には誤らず、ある顔では      別の顔より悪くなります。これは判定ではなく出発点です。4点のうちどれを      測れなかったかはページが述べ、どの点もドラッグでき、      <em>自分で置く</em>に切り替えれば完全に止まります。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ています。そのどれにも、あなたの写真、顔、選んだ国の規定に関する情報は\
      渡されません。ファイルを読み、切り抜き、測り、書き出すコードはすべてこの\
      オリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこの道具は何も変わりません。もともと通信する段階が\
      存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "写真を選びます。"
body = """
無地の壁を背に、日中の光で、1メートル半ほど離れて撮った\
      スマートフォンの写真が向いています。ブラウザがディスクから直接読み、その間に\
      何かがどこかへ送られることはありません。"""

[[howto]]
title = "国と書類を選びます。"
body = """
すると、その規定の印刷寸法、顔の高さの幅、目の高さ、\
      背景色、提出時の制限が表示されます。それぞれの数値がどの当局のものか、いつ\
      読み取ったかも一緒に出ます。この一覧に推測はひとつもなく、ここに載っていない\
      指定を渡された場合は「その他の国」から入力してください。"""

[[howto]]
title = "顔の上の4つの点を確かめてください。"
body = """
 頭頂、あご、そして左右の瞳。規定が測るのはこの4点だけです。      点は写真そのものを測って置かれ、そのうちどれが測れてどれを算出したかは      すぐ下の行が述べます。ずれている点はドラッグして直すか、      <em>自分で置く</em>に切り替えて4点とも自分で置いてください。それから      <em>枠を合わせる</em>を押すと、その国が求める位置に切り抜きが決まります。"""

[[howto]]
title = "4つの判定と背景を読みます。"
body = """
顔の高さ、目の高さ、中心のずれ、傾き。\
      いずれも今の枠から測った値で、外れていればどちらへ動かせばよいかも出ます。\
      背景は切り抜きの上辺と左右から読み取り、規定の求める色と比べます。実際に\
      不合格の理由になるムラは、色とは別に測ります。"""

[[howto]]
title = "3つのファイルを持ち帰ります。"
body = """
印刷用は正確なミリで、解像度が\
      ファイルに書き込まれているので、店でも正しい大きさで出ます。シートはL判に\
      入るだけの枚数を並べ、すき間に裁断の目印を入れます。提出用は、ポータルが\
      求める画素数で、上限と下限の両方にわたるKBの幅に収めてあります。"""

[[faq]]
q = "写真はどこかにアップロードされますか？"
a = """
        いいえ。画像の展開も、切り抜きも、計測も、書き出しも、お使いのブラウザが\
        お手元のハードウェアで、ブラウザにもともと入っているJPEGエンコーダーを使って\
        行います。この道具にはどんなネットワーク機能もありません。何かを取りに行く\
        ことも、送ることもありません。ページの<code>Content-Security-Policy</code>には\
        接続してよいアドレスがすべて書かれていて、そのどれもこのサイトのものでは\
        ありません。ここではそれが多くの道具より重く効きます。ファイルがあなたの顔の\
        写真だからです。"""

[[faq]]
q = "どの国に対応していますか？"
a = """
        これまでに書き写した規格は、ICAO標準そのもの、アメリカ合衆国（パスポートと、\
        提出規定が異なる多様性ビザの応募）、イギリス、シェンゲンビザ、ドイツ、カナダ、\
        オーストラリア、インド（パスポート、35&nbsp;&times;&nbsp;45&nbsp;mmの焼き付け、\
        そしてSSC・UPSC用の願書写真と署名）、中国、日本です。どの項目にも、出典と\
        なる当局名と読み取った日付が付いています。それ以外は「その他の国」から入力\
        でき、そこではすべての数値をご自身で決められます。世界の大半はICAOの寸法\
        体系で発給しているため、この項目はその値から始まります。"""

[[faq]]
q = "顔モデルなしで、どうやって頭頂・あご・目を見つけているのですか。"
a = """
        一般の顔検出器には許されず、この道具には許される前提を使っています。ここに        並ぶ規定はどれも同じ場面を要求します&mdash;1人が正面を向き、無地で均一に        照らされた壁の前に立つ、という場面です。そこで壁の色を写真の縁から読み、その        色でないものすべてを人物とし、その一番上を髪を含めた頭頂とします。瞳は、        周囲より暗い斑点のうち、同じ高さで頭の中心の左右に分かれた最良の組として        探します。比較はあくまで局所的なので、顔の色に左右される箇所がありません。        あごだけはこの方法では見つかりません。首の前の下顎は色の変わらない柔らかい        境界だからです。そこで、頭の高さのほぼ半分にある瞳から算出し、輪郭と突き合わ        せて確かめます。すべて<code>src/detect.js</code>の算術です。重みも推論        エンジンもなく、何も取りに行かず、どの顔にも同じ算術を当てます。最後の点が        肝心で、同梱された検出器は一様には誤らず&mdash;ある顔では別の顔より悪くなり        &mdash;もともと写真を突き返されがちな人ほど見捨てられるからです。"""

[[faq]]
q = "置かれた点はどこまで信じてよいですか。"
a = """
        出発点にする程度には信じてよく、確かめないで済ませるほどではありません。4点の        どれにも、外す写真があります。柄のある壁や本棚では頭を切り出す輪郭が残らず、        上で切れた頭には頭頂がそもそも写っておらず、眼鏡・厚い前髪・閉じた目は瞳を        別の部位へ置いてしまいます。だからこの道具は、4点のうちどれを測りどれを算出        したかをはっきり述べ、無地の背景がない写真では答えをでっち上げずに断り、どの        点もドラッグできるままにしています。切り抜きは点が最終的にある場所から取られ、        始まった場所からは決して取られません。4点とも自分で置きたいときは、写真の上の        切り替えに<em>自分で置く</em>があります。点を手で動かせば自動でそちらへ移り、        その時点から点はあなたのもので、もう何も動かしません。"""

[[faq]]
q = "顔の高さの規定とは何ですか。なぜいつも通らないのですか？"
a = """
        どの規格も、画面のうちどれだけを頭が占めるべきかを定めています。あごの下から\
        髪を含む頭のてっぺんまでで、たいていは70から80パーセント、45&nbsp;mmの写真\
        なら31.5から36&nbsp;mmです。通らない原因でいちばん多いのは自撮りです。腕の\
        長さは60&nbsp;cmほどしかなく、顔がゆがみ、頭が大きく写りすぎます。次に多いのは\
        頭頂の取り違えです。生え際ではなく髪の最上部が頭頂であり、生え際に印を付けると\
        どの頭も小さくなってしまいます。"""

[[faq]]
q = "ファイルが20 KB以上でなければならないのはなぜで、どうやって埋めるのですか？"
a = """
        インドの試験ポータル、中国のビザ申請書、イギリスのパスポート提出は、いずれも\
        上限だけでなく下限も定めています。それを下回るファイルは、たいてい誤って\
        アップロードされたサムネイルだからです。200&nbsp;&times;&nbsp;230の写真は\
        46,000画素しかなく、ブラウザが書き出せる最高画質でも15&nbsp;KBに収まって\
        しまうことがあり、圧縮を緩めて大きくする手もありません。そこでこの道具は、\
        空白で埋めたJPEGのコメント領域を追加します。これはJPEG標準の一部で、どの\
        デコーダーも読み飛ばし、画像はビット単位でまったく同じままです。長くなるのは\
        ファイルだけです。その埋め草には、まさにそのことが英語で書いてあります。"""

[[faq]]
q = "背景は確認してくれますか。差し替えはできますか？"
a = """
        確認はしますが、差し替えはしません。色は切り抜きの上辺を横切る帯と、肩より上の\
        左右から読み取り、規定の色とRGBではなくCIE Labで比べます。RGBで40離れた2つの\
        グレーは見分けがつきませんが、青で40離れれば別の色だからです。ムラは別に\
        測ります。白い壁の影こそ実際に写真が弾かれる原因で、それは色の問題ではない\
        からです。背景を差し替えるとは人物を切り抜くことで、それは領域分割モデルの\
        仕事です。出来の悪いものは髪を食べます。壁から30センチ離れて立つほうが、\
        どんなフィルターより多くを解決します。"""

[[faq]]
q = "L判シートは何のためですか？"
a = """
        証明写真機は6枚で数百円かかります。写真店のカウンターならL判が数十円で、どこでも\
        刷ってくれます。そこでこの道具は、紙に入るだけの枚数をあなたの写真で並べます。\
        35&nbsp;&times;&nbsp;45ならL判に8枚で、すき間に裁断の目印を入れ、写真の上には\
        何も刷りません。サイズを合わせるための縮小はしません。1枚多く入れるために2\
        パーセント縮めたシートは、8枚とも寸法の違う写真になってしまうからです。\
        印刷は必ず100パーセントで。シートを狂わせるのは「用紙に合わせる」です。"""

[[faq]]
q = "画素数が同じなら、dpiは関係ないのでは？"
a = """
        JPEGは自分の寸法を名乗ることができ、名乗らなければ印刷する側が推測します。\
        解像度はJFIFヘッダーに入っていて、ブラウザのキャンバスはその単位欄を「これは\
        縦横比であって解像度ではない」として書き出します。この道具はその数バイトを\
        書き直し、ファイルが300&nbsp;dpiと名乗るようにします。それによって\
        413&nbsp;&times;&nbsp;531画素が、寸法のない画像ではなく\
        35&nbsp;&times;&nbsp;45&nbsp;mmの写真になります。そのために展開は行わず、\
        画質も使いません。"""

[[faq]]
q = "署名のファイルも作れますか？"
a = """
        作れます。SSCとUPSCの願書は140&nbsp;&times;&nbsp;60画素で10から20&nbsp;KBの\
        ものを求めており、独立した規格として一覧に入っています。署名には目の高さが\
        ないので顔の重ね表示は切られ、代わりに紙が明るいこと、そこにインクがあること、\
        罫線やページの端を切り抜きに巻き込んでいないことを確かめます。この規定で難しい\
        のは20&nbsp;KBを下回ることではなく、10&nbsp;KBに届かせることです。"""

[[faq]]
q = "これで申請が通ることは保証されますか？"
a = """
        いいえ。正直に言えば、どんな道具にも保証はできません。この道具がするのは、\
        公表された数値をそのまま当てはめ、行ったすべての計測をお見せすることです。\
        それによって、フォームが自動で測るもの、つまり画素数、ファイルサイズ、形式は\
        正しくなり、人が見て判断するもの、つまり顔の高さ、目の高さ、背景は、数字と\
        ともに目の前に並びます。規定は変わりもします。ここに載る規格はすべて、出典の\
        当局と読み取った日付を書いてあります。表を信じるのではなく、目の前のフォームと\
        突き合わせてください。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もなく、顔の上に透かしが入ることも\
        ありません。作れる枚数にも制限はありません。その費用を払うサーバーが存在しない\
        からです。このサイトには広告があり、それが費用を賄っています。広告に写真の情報が\
        渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。規定集は\
        ページと一緒に配られるファイルであって、問い合わせではないからです。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。切り抜きの\
        ために写真をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

[schema]
description = "各国の公表規格どおりに、パスポート・ビザ・身分証用の写真をブラウザの中で作ります。選んだ書類の印刷寸法、dpi、顔の高さの幅、目の高さ、背景色を当てはめ、それぞれを重ねて表示しながら計測し、背景を確認し、裁断の目印つきの印刷用シートを組み、指定の画素数でポータルのKBの幅に収めた提出ファイルを書き出します。アップロードは一切ありません。"
features = [
  "公表された規格の一覧。それぞれに出典の当局と読み取った日付つき",
  "ICAO Doc 9303の寸法体系。画面に対する顔の高さと、下辺からの目の高さ",
  "規格の縦横比に固定された切り抜き枠。中に目とあごの許容帯を描画",
  "頭頂・あご・左右の瞳を、頭の輪郭と目の暗さから取得。モデルの同梱も取得もなし",
  "4点ともドラッグ可能なまま。どれを測りどれを算出したかをページが明示",
  "顔の高さ、目の高さ、中心、傾きをその場で表示し、直す向きも示します",
  "背景の色とムラをCIE Labで測り、2つを分けて報告します",
  "正確なミリで印刷。解像度はJPEGヘッダーに書き込みます",
  "L判・2L判・A4・レターのシート。すき間に裁断の目印を入れ、写真の上には何も刷りません",
  "指定の画素数の提出ファイルを、ポータルのKBの幅に上下とも収めて書き出します",
  "SSC・UPSC願書用の200 x 230を20〜50 KBで、署名の140 x 60を10〜20 KBで",
  "オフラインで動作。アップロードなし、登録なし、顔モデルなし",
]

[picker]
title = "ここに写真をドロップ"
hint = "クリックして選ぶこともできます &mdash; 写真1枚。JPEG・PNG・WebP、そのほかブラウザで開けるものなら何でも"
