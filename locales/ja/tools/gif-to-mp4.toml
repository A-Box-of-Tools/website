[[privacy]]
title = "MP4が小さくなり、広く選ばれる理由。"
body = "GIFは各フレームを最大256色の画像として保存し、前の画像を参照しません。動画コーデックはフルカラーで変わった部分を保存します。長年改良されたH.264では、同じ動きが通常10分の1以下の容量になります。SNS、チャット、コンテンツ管理システムが大きなGIFを拒否したり、受信後にMP4へ変換したりする理由です。"

[[privacy]]
title = "時間のかかるアップロードがありません。"
body = "オンライン変換では30MBを送って3MBを受け取る前に、まず回線でファイルを送る時間が必要です。ここではこのサイトのコードでGIFを読み、ブラウザ自身のエンコーダーでMP4を書きます。移動するのはディスクとメモリの間だけです。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはありません。通信を切っても動きます。"

[[privacy]]
title = "フレームごとの表示時間を保ちます。"
body = "GIFには固定のフレームレートがなく、各フレームが表示時間を持ちます。固定レートに変換するとフレームが複製や間引きされ、スライドショーが短くなったりぎこちなくなったりします。ここではGIFの1フレームを同じ表示時間の動画1フレームにします。ブラウザと同じく0.02秒未満だけは0.1秒として再生します。完成したファイルを開き直し、全フレームと長さを確かめます。"

[[privacy]]
title = "GIFにできて動画にできない2つのこと。"
body = "GIFの透明な部分を動画では保てないので、背景色を選びます。必要な場合だけ欄が現れ、初期値は白です。GIFには繰り返し再生の設定がありますが、MP4にはなく、プレーヤーが決めます。フィードやチャットアプリは短い動画を繰り返すことが多く、ここでも継ぎ目を確認できるようプレビューは繰り返します。"

[[privacy]]
title = "端末に必要な時間とメモリ。"
body = "通常のGIFはハードウェアエンコードなら数秒、ソフトウェアでは長くなる場合があります。デコード済みの部分画像のピクセルは最大5億1200万まで保持します。また、入力、画面全体の合成、復元用のコピー、収集した動画データなど、既知のバッファの推定合計が512 MiBを超える変換は拒否します。コーデック内部のメモリは別に増える場合があります。キャンセルすると処理を破棄しますが、ネイティブの読み込みや同期的な描画が完了することはあります。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから読み込みます。GIF、フレーム、名前、サイズ、長さは渡しません。読み込み、エンコード、書き出しのコードはこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "ヘッダーの「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、Google Fontsの文字を使います。訪問を報告しないリンクで、利用者やGIFの情報は渡しません。クリックするまで何も起こらず、移動先は別のサイトです。"

[[privacy]]
title = "オフラインでも動きます。"
body = "通信を切ってもすべての機能が動きます。GIFを別の場所へ送って変換するツールなら止まるので、簡単な証明になります。"

[[howto]]
title = "GIFを選びます。"
body = "1つずつブラウザがディスクから直接読み、容量、フレーム数、再生時間、画素の大きさを表示します。"

[[howto]]
title = "書き出す内容を読みます。"
body = "大きさ、フレームと表示時間、長さ、ビットレートを1行に表示します。透明な部分がある場合だけ背景色を選ぶ欄が現れ、それ以外に設定はありません。"

[[howto]]
title = "変換し、確認結果を読みます。"
body = "各フレームを描画してエンコードし、進み具合を表示します。完成したファイルを開き直し、GIFと同じ長さで全フレームがあることを確かめます。メモリから繰り返し再生するので、保存前に継ぎ目を見られます。"

[[faq]]
q = "MP4がこんなに小さくなるのはなぜですか？"
a = "GIFは最大256色で各フレームを個別に保存しますが、動画は前から変わった部分を保存します。H.264は長年改良され、同じ動きが通常10分の1以下になります。256色の制限もなくなります。とても小さいGIFや動きの少ないGIFは大きくなることもあり、その場合は結果で伝えます。"

[[faq]]
q = "表示時間は同じですか？"
a = "はい。各フレームの表示時間を保ち、複製、間引き、固定レートへの変換はしません。0.02秒未満だけはブラウザと同じく0.1秒として扱うので、ブラウザでのGIFと同じ長さです。完成後に長さとフレーム数を確かめます。"

[[faq]]
q = "繰り返し再生しますか？"
a = "プレーヤー次第です。GIFには指定がありますが、MP4にはありません。フィードやチャットアプリは短い動画を繰り返すことが多く、このページのプレビューも継ぎ目を見られるよう繰り返します。パソコンのプレーヤーは通常1回再生します。"

[[faq]]
q = "透明な部分はどうなりますか？"
a = "動画は不透明な長方形なので、背景色で塗ります。透明なGIFの場合だけ色を選べて、初期値は白です。エンコード前にフレームの下に描くので、映像の一部になります。"

[[faq]]
q = "画像の大きさは変わりますか？"
a = "H.264には偶数の辺が必要なので、幅や高さが奇数なら補間せずに背景色の1列を加えます。最長の辺が3840ピクセルを超えるGIFは、その上限に合わせて縮小します。開始前に実際の出力サイズを表示します。出力を縮小しても、元の画面の合成バッファは小さくなりません。"

[[faq]]
q = "どれくらい時間がかかりますか？"
a = "通常のGIFはハードウェアエンコードなら数秒、対応しない場合は長くなります。進捗は現在のフレームを示します。キャンセルするとエンコーダーと出力を破棄しますが、ネイティブの対応確認、読み込み、同期的な描画が完了することはあります。遅れて完了した処理が新しい入力や結果を置き換えることはありません。"

[[faq]]
q = "GIFは送信されますか？"
a = "いいえ。読み込み、デコード、エンコード、書き出しはブラウザと端末で行います。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはありません。通信を切って使うことでも確かめられます。"

[[faq]]
q = "電話でも動きますか？"
a = "動画エンコードに対応するブラウザなら動き、電話のハードウェアエンコーダーは高速です。ただしメモリが少なく、非常に長いGIFは展開して保持できない場合があります。"

[[faq]]
q = "容量制限や料金はありますか？"
a = "デコード済みの部分画像のピクセルは最大5億1200万まで保持し、既知のバッファの推定合計が512 MiBを超える変換は拒否します。コーデック内部のメモリやブラウザのすべての割り当てについて上限を保証するものではありません。拒否した理由を表示します。無料で、アカウント、ログイン、お試し期間はありません。広告で運営していますが、GIFの情報は渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。一度開いて通信を切っても動きます。GIFを別の場所へ送って変換するツールなら止まるので、送信しないことの確認になります。"

