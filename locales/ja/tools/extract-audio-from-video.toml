  "ファイル自身の標本化周波数をまず読み、黙って再標本化しない",
  "すべてのチャンネルを平均してモノラルに混合",
  "保存する前に結果を再生",
  "保存せずに結果を音声の切り出しや編集へ運ぶ",
  "オフラインで動作。アップロードなし、アカウントなし",
]

