      ブラウザが再生できるものと同じです。"""

[[privacy]]
title = "サンプルは書き写されるだけで、再エンコードされません。"
body = """
WAVとは、デコーダーが返したサンプルの前に見出しを付けたものです。\
      あなたの録音について判断を下すエンコーダーは途中になく、そうしたことが\
