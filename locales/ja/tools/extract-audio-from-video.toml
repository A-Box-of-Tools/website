description = "MP4やMOV、WebMから音声トラックを取り出してWAVとして保存します。復号されるのは音声だけで、映像は一度も読まれず、何もアップロードされません。"
features = [
  "動画の音声を互換性の高い16ビットPCMまたは32ビット浮動小数点のWAVとして保存",
