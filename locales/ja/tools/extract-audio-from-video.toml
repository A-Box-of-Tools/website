[[privacy]]
title = "あなたの動画に、出ていく先はありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。ファイルが\
      集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "映像はそもそも復号されません。"
body = """
求めるのは音声トラックだけです。フレームは読まれず、復号されず、\
      描かれず、見られもしません。このページにはそれができるコードがないからです。\
      出てくるファイルの中身は音だけです。これは自制の約束ではありません。\
      <code>decodeAudioData</code>にバイト列を渡すと音が返ってくるだけで、\
      <code>src/</code>には動かせる映像デコーダーが存在しません。"""

[[privacy]]
title = "デコーダーは、ブラウザにもとから入っているものです。"
body = """
あなたの形式を読むために何かが配られることはなく、読むためにこの\
      ページの外へ何かを求めることもありません。どのファイルが開けるかは、そのまま\
      ブラウザが再生できるものと同じです。"""

[[privacy]]
title = """WAV形式の精度を明示します。"""
body = """互換性の高い16ビットPCMは復号後のサンプルを丸め、範囲外の値を制限します。32ビット浮動小数点はチャンネルを変えない場合にサンプルを保持します。モノラルはチャンネルを平均します。どちらも端末内で書き込み、何もアップロードしません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ます。そのどれにも、あなたの動画について何も渡されません。ファイルも、\
      サンプルも、名前も、大きさも、長さもです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
ネットワークを切っても道具は何も変わりません。もともとネットワークの\
      段階がなかったからです。これが何よりも簡単な証明です。"""

[[howto]]
title = "動画を置きます。"
body = """
スマートフォン、カメラ、画面録画、ダウンロードなどからのMP4・MOV・\
      M4V・WebM。読むのはご自分のブラウザで、省くべきアップロードの段階自体が\
      ありません。"""

[[howto]]
title = "見つかった内容を読みます。"
body = """
長さ、チャンネル数、標本化周波数が、ファイルからそのまま出てきます。\
      ファイルが自分の周波数を書いていなかった場合は、黙って再標本化して何も\
      触っていないと言い張るのではなく、そのことをページが伝えます。"""

[[howto]]
title = """形式とチャンネルを選びます。"""
body = """既定値は互換性の高い16ビットPCMです。復号後のサンプルを丸めたり制限したりせずに保持するには32ビット浮動小数点を選び、チャンネルは変えないでください。モノラルはチャンネルを平均し、ステレオの音声データを半分にします。"""

[[howto]]
title = "保存する前に聴きます。"
body = """
プレーヤーで鳴っているのは、これからダウンロードされるファイルその\
      もので、動画ではありません。ですから、聴いて正しければダウンロードも\
      正しいということです。"""

[[howto]]
title = "持ち帰るか、次へ渡します。"
body = """
WAVをダウンロードするか、保存せずにそのまま切り出しや編集へ送ります。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        いいえ。復号も書き出しも、ご自分のブラウザの中で、ご自分のハードウェア上で\
        行われます。この道具にはネットワーク機能が一切なく、取りに行くことも送ることも\
        ありません。ページの<code>Content-Security-Policy</code>には接続してよい\
        アドレスがすべて書かれていて、そのどれもこのサイトのものではありません。\
        言葉より確認という方は、インターネットを切ったうえで音声を取り出してみて\
        ください。"""

[[faq]]
q = "MP3でもらえますか？"
a = """このページはMP3ではなくWAVを書き込みます。MP3出力には、このツールに含まれないエンコーダーが必要です。互換性の高い16ビットPCMか32ビット浮動小数点を選べ、どちらもアップロードは不要です。WAVは非圧縮のため大きくなりますが、あとから別のエディターで圧縮できます。"""

[[faq]]
q = "映像が見られることはありますか？"
a = """
        ありませんし、それができるものがここにはありません。ブラウザのデコーダーに\
        ファイルを渡して音声トラックを求めているだけで、映像トラックは一度も復号されず、\
        描かれもせず、このページのコードにすら届きません。<code>src/</code>には\
        動かせる映像デコーダーがありません。出てくるファイルの中身は音だけです。"""

[[faq]]
q = "音声が読めないと出ますが、動画はふつうに再生できます。"
a = """
        それならその動画には、ほぼ間違いなく音声トラックがありません。マイクを選ばずに\
        録った画面録画は無音ですし、音を消したまま編集ソフトから書き出したクリップも\
        無音です。どちらも映像があるので問題なく再生できます。メッセージがこちらを先に\
        挙げているのは、二つのうち起こりやすいほうだからです。もう一つは、この\
        ブラウザが読まない形式である場合です。ファイルをプレーヤーで開いて、動かしても\
        何も変わらない音量つまみを探してみてください。どちらなのかを見分ける一番早い\
        方法です。"""

[[faq]]
q = "どの動画形式を開けますか？"
a = """
        ブラウザが復号できるものすべてで、実際にはMP4・M4V・MOV・WebMということに\
        なります。音声形式もすべて開けます。外れるのはこのサイトのどこでも同じ短い\
        一覧、つまりAVI、WMV、そしてほとんどのMKVです。ブラウザが読まないファイルは、\
        途中で失敗するのではなく、その旨を伝える知らせとともに断られます。"""

[[faq]]
q = "音質は落ちますか？"
a = """16ビットPCMは復号後のサンプルを丸め、最大振幅を超える値を制限します。チャンネルを変えずに32ビット浮動小数点を選ぶと、範囲を超える値も含めてデコーダーのサンプルを保持します。モノラルはチャンネルを平均します。浮動小数点でも動画にすでに含まれる損失は戻りません。検出できた場合はファイル自身の標本化周波数を使い、それ以外は仮定した周波数をページに表示します。"""

[[faq]]
q = "WAVが動画よりずっと大きいのはなぜですか？"
a = """WAVの音声は非圧縮です。44.1 kHzの16ビットステレオは1分あたり約10 MBです。浮動小数点のサンプルデータは2倍になり、モノラルはステレオのサンプルデータを半分にします。完成前に出力サイズを表示します。"""

[[faq]]
q = "どれくらい長い動画まで扱えますか？"
a = """入力をメモリー内で読み込んで復号し、WAV全体もそこで組み立てます。長い録音は使用可能なメモリーを超える場合があります。WAV形式の4 GB上限を超える出力はサンプルを書き込む前に拒否します。キャンセルすると読み込み結果を破棄し、分割した混合と書き込みを停止します。ブラウザの復号処理は戻るまで続く場合がありますが、キャンセルした結果は採用しません。"""

[[faq]]
q = "短くしたり、音量を上げたりできますか？"
a = """
        できますが、ここではできません。このページの仕事は一つだけです。結果ができると\
        ダウンロードの横にリンクの列が現れ、保存しないまま\
        <a href="../trim-audio/">音声の切り出し</a>や<a href="../edit-audio/">音声の編集</a>へ\
        そのまま運びます。どちらもアップロードはしません。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、サインインも、試用期間もなく、開ける動画の数にも制限は\
        ありません。このサイトには広告があり、それが費用をまかなっています。広告には\
        あなたのファイルについて何も渡されません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んだあとインターネットを切っても、そのまま使えます。\
        これは何もアップロードされていないことを示す一番簡単な方法でもあります。処理の\
        ために動画を送り出す道具なら、線を抜いた瞬間に止まってしまうはずです。"""

