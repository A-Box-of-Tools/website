[[privacy]]
title = "オフラインで動きます。"
body = """
ネットワークを切っても道具は何も変わりません。もともとネットワークの\
      段階がなかったからです。これが何よりも簡単な証明です。"""

[[howto]]
title = "動画を置きます。"
body = """
スマートフォン、カメラ、画面録画、ダウンロードなどからのMP4・MOV・\
      M4V・WebM。読むのはご自分のブラウザで、省くべきアップロードの段階自体が\
      ありません。"""

[[howto]]
title = "見つかった内容を読みます。"
body = """
長さ、チャンネル数、標本化周波数が、ファイルからそのまま出てきます。\
      ファイルが自分の周波数を書いていなかった場合は、黙って再標本化して何も\
      触っていないと言い張るのではなく、そのことをページが伝えます。"""

[[howto]]
title = "小さくしたければモノラルを選びます。"
body = """
チャンネルをそのままにすれば、録音はもとのままです。モノラルに混ぜると\
      ファイルは半分になり、文字起こしや声の録音が求めるのはこちらです。片方を\
      捨てるのではなく、両チャンネルを平均します。"""

[[howto]]
title = "保存する前に聴きます。"
body = """
プレーヤーで鳴っているのは、これからダウンロードされるファイルその\
      もので、動画ではありません。ですから、聴いて正しければダウンロードも\
      正しいということです。"""

[[howto]]
title = "持ち帰るか、次へ渡します。"
body = """
WAVをダウンロードするか、保存せずにそのまま切り出しや編集へ送ります。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        いいえ。復号も書き出しも、ご自分のブラウザの中で、ご自分のハードウェア上で\
        行われます。この道具にはネットワーク機能が一切なく、取りに行くことも送ることも\
        ありません。ページの<code>Content-Security-Policy</code>には接続してよい\
        アドレスがすべて書かれていて、そのどれもこのサイトのものではありません。\
        言葉より確認という方は、インターネットを切ったうえで音声を取り出してみて\
        ください。"""

[[faq]]
q = "MP3でもらえますか？"
a = """
        いいえ、そのふりもしません。MP3の符号化器を積んでいるブラウザはなく、そこへ\
        至る唯一の道は、符号化器を持つサーバーに動画を送ることです。それこそが、この\
        サイトが行わないためにある唯一のことです。お渡しするのはWAV、つまりサンプルの\
        前に44バイトの見出しを置いたもので、符号化器をまったく必要とせず、品質を\
        損ないようがありません。容量は大きく、ステレオで1分あたり約10メガバイトですが、\
        どのプレーヤーでも、スマートフォンでも、編集ソフトでも開けます。MP3が必要な\
        ものは、そこから一瞬で作れます。"""

[[faq]]
q = "映像が見られることはありますか？"
a = """
        ありませんし、それができるものがここにはありません。ブラウザのデコーダーに\
        ファイルを渡して音声トラックを求めているだけで、映像トラックは一度も復号されず、\
        描かれもせず、このページのコードにすら届きません。<code>src/</code>には\
        動かせる映像デコーダーがありません。出てくるファイルの中身は音だけです。"""

[[faq]]
q = "音声が読めないと出ますが、動画はふつうに再生できます。"
a = """
        それならその動画には、ほぼ間違いなく音声トラックがありません。マイクを選ばずに\
        録った画面録画は無音ですし、音を消したまま編集ソフトから書き出したクリップも\
        無音です。どちらも映像があるので問題なく再生できます。メッセージがこちらを先に\
        挙げているのは、二つのうち起こりやすいほうだからです。もう一つは、この\
        ブラウザが読まない形式である場合です。ファイルをプレーヤーで開いて、動かしても\
        何も変わらない音量つまみを探してみてください。どちらなのかを見分ける一番早い\
        方法です。"""

[[faq]]
q = "どの動画形式を開けますか？"
a = """
        ブラウザが復号できるものすべてで、実際にはMP4・M4V・MOV・WebMということに\
        なります。音声形式もすべて開けます。外れるのはこのサイトのどこでも同じ短い\
        一覧、つまりAVI、WMV、そしてほとんどのMKVです。ブラウザが読まないファイルは、\
        途中で失敗するのではなく、その旨を伝える知らせとともに断られます。"""

[[faq]]
q = "音質は落ちますか？"
a = """
        その動画が作られたときに自分の音声へ既に加えていた分より先は、何も落ちません。\
        デコーダーが返したサンプルはそのまま書き写されます。二度目の符号化がないので、\
        二世代目の劣化もありません。知っておくべきなのは標本化周波数だけです。ファイル\
        自身の周波数をまず見出しから読み、その周波数で復号するので、録音が黙って\
        再標本化されることはありません。ファイルが周波数を書いていない場合は、何を\
        仮定したかをページが伝えます。"""

[[faq]]
q = "WAVが動画よりずっと大きいのはなぜですか？"
a = """
        WAVが非圧縮で、動画の音声トラックは圧縮されていたからです。CD品質の音は中身が\
        何であれステレオで1分あたり約10メガバイトになりますが、MP4の中のAACトラックは\
        おそらくその10分の1ほどです。モノラルに混ぜれば半分になります。これは再符号化\
        しないことの代償で、支払うのは一度きりです。次にそのファイルを開いたものが\
        圧縮できます。"""

[[faq]]
q = "どれくらい長い動画まで扱えますか？"
a = """
        ここに制限は設けていません。その費用を払うサーバーがないからです。実際の上限は\
        ご自分の端末のメモリーです。ファイルを読み込み、音声トラック全体をサンプルとして\
        保持するので、小さな端末で非常に長い録音を扱うと容量が足りなくなることが\
        あります。数時間の動画ならたいてい問題なく、スマートフォンはノートパソコンより\
        短いところで限界が来ます。"""

[[faq]]
q = "短くしたり、音量を上げたりできますか？"
a = """
        できますが、ここではできません。このページの仕事は一つだけです。結果ができると\
        ダウンロードの横にリンクの列が現れ、保存しないまま\
        <a href="../trim-audio/">音声の切り出し</a>や<a href="../edit-audio/">音声の編集</a>へ\
        そのまま運びます。どちらもアップロードはしません。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、サインインも、試用期間もなく、開ける動画の数にも制限は\
        ありません。このサイトには広告があり、それが費用をまかなっています。広告には\
        あなたのファイルについて何も渡されません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んだあとインターネットを切っても、そのまま使えます。\
        これは何もアップロードされていないことを示す一番簡単な方法でもあります。処理の\
        ために動画を送り出す道具なら、線を抜いた瞬間に止まってしまうはずです。"""

