[[privacy]]
title = "画像が送られる先はありません。"
body = "Content-Security-Policyにはこのページが接続できるアドレスがすべて書かれていますが、このサイト自身のものはありません。ファイルを収集する受け口も、それを送信するコードもありません。"

[[privacy]]
title = "デコーダーはすでにブラウザにあります。"
body = "写真ビューアーで開けないAVIFも、ブラウザのタブでは開けます。ChromeとFirefoxは2021年から、Safariは2023年から対応しています。このページはそのデコーダーに保存ボタンを付けたものです。画像を開き、描画し、JPEGを書き出します。初回にエンジンをダウンロードする必要も、サーバーを使う理由もありません。アップロードを求める変換サイトが説明していないことです。"

[[privacy]]
title = "透明な部分と、その背景色。"
body = "AVIFにはアルファチャンネルがありますが、JPEGにはありません。そこで下に置く色を選びます。初期値は白で、デコード後の画素に本当に透明な部分がある場合だけ表示されます。ウェブから保存したAVIFの多くは不透明な写真なので、通常はこの欄は現れません。"

[[privacy]]
title = "AVIFからJPEGへ引き継げないもの。"
body = "AVIFはチャンネルごとに10ビットや12ビットの色、HDRの明るい光を保存できます。JPEGは8ビットでHDRに対応しないため、そうした画像は通常の範囲に変換されます。ほとんどの画像は最初から通常の範囲で、見た目は変わりませんが、HDR写真のスクリーンショットでは違いが出ることがあります。変換前に知っておけるよう、ここで説明しています。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから読み込みます。画像についての情報はどれにも渡しません。ファイルを読み、デコードし、書き出すコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "オフラインでも動きます。"
body = "ページを一度開いて通信を切っても、動作は変わりません。画像を別の場所へ送って変換するツールにはできない、一番簡単な確認方法です。"

[[howto]]
title = "AVIFファイルを選びます。"
body = "選択欄にドロップするか、ファイルを選びます。名前ではなく先頭のバイトで判別するので、名前を変更したAVIFも使えます。本当にPNGであるファイルは、実際の形式を伝えて受け付けません。"

[[howto]]
title = "画質と、透明な部分の背景色を選びます。"
body = "画質は92から始まります。写真を元の画像と見分けにくい値です。JPEGでは透明度を保てないので、透明な部分のある画像が含まれる場合だけ背景色の欄が現れます。"

[[howto]]
title = "「変換」を押してダウンロードします。"
body = "結果には元のファイル、新しいサイズ、サイズの変化が表示されます。AVIFの圧縮効率は高いので、互換性と引き換えに容量はかなり増えることが普通です。1個なら個別のダウンロード、複数ならZIPも使えます。"

[[faq]]
q = "画像はどこかへアップロードされますか？"
a = "いいえ。ファイルの読み込み、デコード、書き出しはすべてお使いのブラウザとハードウェアで行います。ツールはネットワークから取得も送信もしません。<code>Content-Security-Policy</code>に書かれた接続先に、このサイト自身のものはありません。デコーダーを読み込む必要さえなく、ブラウザがすでに持っています。"

[[faq]]
q = "端末のどのアプリでも開けないのはなぜですか？"
a = "AVIFへの対応が新しいためです。同じ画質でJPEGより大幅に小さくなるので、ウェブサイトが採用し、保存すると<code>.avif</code>を受け取ることがあります。開こうとするソフトウェアは形式より古いかもしれません。Windowsでは拡張機能が必要で、対応しない編集アプリ、電子書籍端末、プリンター、アップロードフォームも多くあります。ブラウザは読めるので、このページで変換できます。"

[[faq]]
q = "JPGはAVIFより大きくなりますか？"
a = "ほぼ必ず大きくなり、数倍になることもあります。結果に差を表示します。AVIFは効率のよい新しいコーデック、JPEGは古いコーデックです。同じ見た目の画質でも40KBのAVIFが200KBのJPEGになることがあります。互換性と容量の交換です。後から容量を減らすなら、<a href=\"../compress-image/\">画像圧縮ツール</a>で目標サイズを指定できます。"

[[faq]]
q = "透明な部分はどうなりますか？"
a = "選んだ色で塗りつぶし、変換前にそのことを伝えます。AVIFにはアルファチャンネルがありますが、JPEGにはなく、透明度は残せません。置く色は利用者が選びます。AVIFの多くは不透明な写真なので、背景色の欄は表示されません。透明度を保つなら、AVIFを読んでPNGやWebPを書ける<a href=\"../compress-image/\">画像圧縮ツール</a>を使ってください。"

[[faq]]
q = "HDRや10ビットの色はどうなりますか？"
a = "JPEGでは保存できないため失われます。AVIFはチャンネルごとに10ビットや12ビット、通常の画面より明るい光を記録できますが、JPEGは8ビットで通常の範囲だけです。HDRのAVIFは通常の画像になります。どこでも開ける画像には便利ですが、保存用原本としては情報が失われます。一般的なウェブ画像にはHDRがほぼないので、通常は影響しません。"

[[faq]]
q = "画像は再圧縮されますか？"
a = "はい。AVIFとJPEGは異なるコーデックなので、デコードと再エンコードは避けられません。アップロードを求めるサイトも同じです。画質は自分で選べます。初期値92では写真を元の画像と見分けにくくなります。"

[[faq]]
q = "逆にJPGをAVIFにできますか？"
a = "ここではできません。ブラウザのキャンバスはAVIFを書き出せず、指定しても種類の違うPNGを返します。ブラウザでAVIFを作るなら、独自のエンコーダーが必要です。サーバーを使わずに正しく実装するための作業は<a href=\"../roadmap/\">ロードマップ</a>に載っています。"

[[faq]]
q = "撮影日時、カメラ、位置情報は残りますか？"
a = "いいえ。キャンバスは画素だけを保つので、EXIF、GPS、色プロファイル、XMPは残りません。ウェブから保存した画像には通常それらはありません。再圧縮せずに内容を確認・編集するには<a href=\"../exif-editor/\">EXIF表示・削除ツール</a>を使ってください。"

[[faq]]
q = "フォルダごと変換できますか？"
a = "はい。サーバーで処理しないので、個数や容量の制限はありません。好きなだけ追加できます。ファイルごとに結果とダウンロードがあり、2個以上ならまとめたZIPも使えます。"

[[faq]]
q = "無料で、オフラインでも動きますか？"
a = "はい。アカウント、ログイン、お試し期間、透かしはありません。広告で運営していますが、画像の情報は広告に渡しません。ページを一度開いて通信を切っても同じように動きます。それが何もアップロードされないことの直接の確認にもなります。"

