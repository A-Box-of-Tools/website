[[privacy]]
title = "貼り付けたものには出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。貼り付けられた\
      トークンが集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も、<code>XMLHttpRequest</code>も、<code>sendBeacon</code>もありません。どのエンコーダーも、どのデコーダーも、文字列を受け取って文字列を返す、このページの中の関数です。"""

[[privacy]]
title = "何かがおかしいときは、デコーダーがそう言います。"
body = """
ブラウザの<code>atob</code>は、拒むべき入力を受け取ってそれらしい何かを返します。ここのBase64は手書きで、RFC&nbsp;4648のテストベクターで検証していて、貼り付けたものがBase64でなければ、そうであることも、その理由も言います。<code>tests/js/text-encode.test.js</code>のテストが確かめているのは、まさにそれです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ています。そのどれにも、あなたのテキストは1文字も渡されません。テキストを\
      読み、解析し、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこの道具は何も変わりません。もともと通信する段階が\
      存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "エンコードを選びます。"
body = """
2つのアルファベットのBase64、値1つまたはURL全体のパーセントエンコード、5つのHTMLエンティティ、16進のバイト、そして文字列リテラルのバックスラッシュのエスケープ。メニューの下の説明が、それぞれの用途を教えてくれます。"""

[[howto]]
title = "向きを選びます。"
body = """
「エンコード」は平文を受け取ってエンコード済みの形を作り、「デコード」はエンコード済みの形を平文に戻します。結果は入力に付いてくるので、向きの切り替えはクリック1回、打ち直しはありません。"""

[[howto]]
title = "貼り付けるか、ファイルをドロップします。"
body = """
選択してコピーできるものなら何でも構いません。選択欄に落としたファイルはお使いのブラウザが読んで欄に入れます。省略できるアップロードの段階が、そもそもありません。"""

[[howto]]
title = "エラーが出たら読みます。"
body = """
ここで失敗するデコーダーは、何を見つけたかを言います。Base64が使わない文字、間違った位置のパディング、テキストではないバイト。それらしくて間違ったものを返す代わりにです。"""

[[howto]]
title = "結果を持ち帰ります。"
body = """
コピーするか、テキストファイルとしてダウンロードしてください。欄の下のカウンターが、何バイト入って何バイト出たかを教えてくれます。"""

[[faq]]
q = "テキストはどこかにアップロードされますか？"
a = """
        いいえ。このページのエンコーダーもデコーダーも、お使いのブラウザの中で、お手元のハードウェアで動く関数です。この道具にはどんなネットワーク機能もありません。何かを取りに行くことも、送ることもありません。ページの<code>Content-Security-Policy</code>には接続してよいアドレスがすべて書かれていて、そのどれもこのサイトのものではありません。アクセストークンやセッションのクッキーをここで扱う理由はそれです。そういうものを他人のデコーダーに貼り付けるのは、相手に渡すのと同じことだからです。"""

[[faq]]
q = "ここのBase64は、ほかと同じBase64ですか？"
a = """
        同じです。自分自身とではなく、RFC 4648のテストベクトルと突き合わせて確かめて\
        います。どちらのアルファベットもデコードできるので、<code>-</code>と\
        <code>_</code>で書かれたJWTも、<code>+</code>と<code>/</code>のものと同じように\
        読めます。64文字で折り返された入力は、こちらでつなぎ直します。エンコードは\
        UTF-8のバイト単位なので、アクセント付きの文字も絵文字も往復して無事です。"""

[[faq]]
q = "Base64は暗号化ですか？"
a = """
        いいえ。そう思い込むのが典型的な間違いです。Base64は綴り方です。同じバイト列を、URLでもメールでもJSONの文字列でも生き残るアルファベットで書いたものにすぎません。誰でも読み戻せます。このページは1ミリ秒でやります。つまり何も隠さず、何も守りません。手元にあるものが秘密なら、エンコードの前に本物の暗号化が必要です。代わりにではなく。"""

[[faq]]
q = "デコードはなぜ失敗したのですか？"
a = """
        貼り付けたものが、コーデックに伝えたとおりのものと少し違うからで、エラーはどこが違うかを言います。Base64のアルファベットにない文字、間違った位置のパディング、後ろに16進2桁のないパーセント記号、あるいはBase64からは解けてもUTF-8のテキストではないバイト列。最後のものはたいてい、元が文字列ではなくファイルだったという意味です。ブラウザの<code>atob</code>なら代わりにそれらしい何かを返していたでしょう。教えてもらえること自体が、デコーダーに何かを貼り付ける意味のすべてです。"""

[[faq]]
q = "2つのウェブアドレス用エンコードは何が違うのですか？"
a = """
        値1つか、アドレス全体かです。「値1つ」のエンコードは、URLが意味を持たせるものすべて（スラッシュ、疑問符、アンパサンド）をエスケープします。クエリ文字列のパラメーター1つに欲しいのはこれです。「URL全体」のエンコードはアドレスを動くままにします。スラッシュと<code>?</code>は残り、URLがそもそも運べない文字だけがエスケープされます。前者をアドレス全体に使うとアドレスが壊れ、後者を値に使うと値の終わりがどこか分からなくなります。"""

[[faq]]
q = "どれくらい大きいファイルまで扱えますか？"
a = """
        ここに上限は設けていません。その費用を払うサーバーが存在しないからです。実際の頭打ちはお使いの端末です。数メガバイトのテキストなら問題ありません。とても長い文書では、キーボードを取り合う代わりに、入力が一息つくのを待ってからエンコードし直します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もなく、貼り付けられる量にも制限は\
        ありません。このサイトには広告があり、それが費用を賄っています。広告に\
        テキストの情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何もアップロードされていないことを示す、いちばん簡単な方法でもあります。デコードのためにテキストをどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

