[[privacy]]
title = "処理はこのブラウザー内で行います。"
body = "入力と結果はブラウザー内で処理し、処理コードはそれらを処理用にアップロードしません。Content-Security-Policyは資源と接続先を制限しますが、許可済みの相手はリクエストを受け取れます。内容は検査せず、何も送られないことを単独で証明しません。具体的な操作の要求とソースを比較するか、切断中にローカル操作を完了してください。"

[[privacy]]
title = "エンコードは手元で行います。"
body = """
WebCodecsが動くのはブラウザの中で、できあがったファイルはそのまま\
      ダウンロードへ渡ります。このアプリにサーバー側は存在しません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、画像に関する\
      情報は渡されません。ファイルも、サムネイルも、名前も、サイズも、枚数もです。\
      画像を読み、デコードし、合成し、エンコードするコードはすべてこのオリジンから\
      配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンは何も読み込まず、何も渡されません。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、このページ自身が描いており、どこからも何も読み込みません。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や画像に関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "意図した例外がひとつあります。"
body = """
「ウェブアドレスから追加」を使うと、画像を取得するためにそのサーバーへ接続\
      するので、相手にはこちらのIPアドレスが見えます。取りに行くのは貼り付けた画像\
      だけで、向きは内側だけです。開いているのは<code>img-src</code>であって、\
      <code>connect-src</code>ではありません。下のカウンターは、接続した外部\
      オリジンをすべて列挙します。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、ウェブアドレスからの読み込み以外はすべてそのまま動きます。\
      これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
フォルダごと選択欄にドロップするか、ファイルを手で選んでください。ブラウザが\
      ディスクから直接読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "連番ならフレーム、スライドショーなら秒を選びます。"
body = "番号付きのレンダリング画像には「名前順に並べる」を使い、最初と最後のタイルを確認します。レンダリング連番や写真のタイムラプスは画像1枚につき1フレームのままにし、フレームレートを素材に合わせます。スライドショーでは秒に切り替え、3などの表示時間を入力して「全部に適用」を押します。ドラッグで並べ替えられ、画像ごとに表示時間を変えることもできます。"

[[howto]]
title = "解像度とフレームレートを選びます。"
body = "最初の書き出しには1080pを選ぶか、出力先に合わせて正方形や縦長を使います。「いちばん大きい画像に合わせる」は、画像全体で最大の幅と最大の高さを取ります。「内側に収める」は画像全体を残し、「画面いっぱいに」は端を切ります。エンコードの前に長さと出力サイズの概要を確認してください。"

[[howto]]
title = "動画を作ってダウンロードします。"
body = """
エンコードは手元のハードウェアで動くので、かかる時間は順番待ちではなく端末の\
      性能次第です。できあがったMP4は、そのままブラウザのダウンロードへ渡します。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みも合成もエンコードも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。唯一の例外は任意\
        機能の「ウェブアドレスから追加」で、貼り付けた画像を取得しに行くため、その\
        サーバーにはこちらのIPアドレスが見えます。"""

[[faq]]
q = "どの画像形式が使えますか？"
a = """
        ブラウザがデコードできる静止画形式ならどれでもです。実際にはJPG、PNG、WebP、\
        GIF、AVIF、そしてAppleの端末ではHEICです。ここに別途の対応表を作って保守する\
        必要はありません。デコードは当サイトではなく、ブラウザの仕事だからです。"""

[[faq]]
q = "どの動画形式で書き出されますか？"
a = "推奨の出力はH.264映像のMP4です。代替手段はリアルタイムで録画し、通常はWebMになりますが、WebMに対応する編集ソフトは少なめです。代替の録画中はタブを表示したままにしてください。タイミングはおおよそで、デコードが遅れると画像が飛ばされることがあります。番号付きの連番を正確に出力するには、ブラウザーが対応していればMP4エンコーダーを使ってください。"

[[faq]]
q = "BlenderやAfter Effectsのレンダリング連番に使えますか？"
a = """
        使えます。番号付きのレンダリング連番こそ、これが想定している用途です。\
        レンダラーが書き出したフレームを追加し、表示時間を1フレームのままにして、\
        フレームレートをレンダリングに合わせてください。「名前順に並べる」は期待\
        どおりの数え方をするので、<code>frame_2</code>は<code>frame_10</code>より\
        後ではなく前に来ます。\
        <br><br>\
        始める前に知っておく価値のあることがひとつあります。H.264にはアルファ\
        チャンネルがないので、透過は引き継がれず、背景色に合成されて平らになります。\
        アルファを保ちたい場合は、お使いの編集ソフトでフレームを合成してください。"""

[[faq]]
q = "写真からタイムラプスを作れますか？"
a = " 作れますし、レンダリング連番と同じ仕事です。各写真を1フレームだけ映すようにして、フレームレートを選んでください。30fpsなら写真30枚が動画1秒に、12fpsなら同じ写真が2.5秒になります。<br><br>「日付順に並べる」はファイルの更新日時を使います。更新日時は写真をコピーしたり編集したりすると変わることがあります。ファイル名が0001からやり直しになっている場合は順序を確認してください。大きさの違う写真が混ざっていても問題はありません。「いちばん大きい画像に合わせる」は最大の幅と最大の高さから始め、長辺を7680ピクセルまでに制限して偶数の寸法に丸めます。出力サイズの概要を確認してください。非常に大きな元画像は縮小されることがあります。"

[[faq]]
q = "画像の枚数や動画の長さに制限はありますか？"
a = "画像の枚数に固定の上限はありませんが、MP4の書き出しは4 GiB（約4.3 GB）未満に収める必要があります。完成した動画はダウンロードの前にメモリ上で組み立てられるため、その上限よりかなり前に端末のメモリが足りなくなることがあります。ブラウザーのエンコーダーも出力の寸法を制限します。大きな書き出しが失敗したら、解像度を下げるか、連番を短くするか、分割してください。"

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには広告が\
        あり、それが費用を賄っています。広告に画像の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。処理の\
        ために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

[[faq]]
q = "音楽やBGMを付けられますか？"
a = """
        まだできません。このツールが作るのは映像だけで、書き出すMP4には映像トラックが\
        1本あるだけで、音声トラックはありません。必要な場合は、あとから動画編集ソフト\
        で音を足してください。"""

