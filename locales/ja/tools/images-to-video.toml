      そろえてあり、どれも合わなければサイズを自分で指定できます。"""

[[howto]]
title = "動画を作ってダウンロードします。"
body = """
 書き出しはあなた自身の\
      ハードウェアで動くので、かかる時間は順番待ちではなく端末の性能次第です。\
      できあがった MP4 は、そのままブラウザのダウンロードへ渡されます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みも合成も書き出しも、あなた自身のブラウザが\
        あなた自身のハードウェア上で行います。このツールにサーバー側は存在せず、\
        ページの <code>Content-Security-Policy</code> は接続してよいアドレスを\
        すべて挙げていますが &mdash; そのどれも当サイトのものではありません。\
        唯一の例外は任意機能の「ウェブアドレスから追加」で、貼り付けた画像を\
        取得しに行くため、そのサーバーにはあなたのIPアドレスが見えます。"""

[[faq]]
q = "どの画像形式が使えますか？"
a = """
        ブラウザが復号できる静止画形式ならどれでもです。実際には JPG、PNG、WebP、
        GIF、AVIF、そして Apple の端末では HEIC です。ここに別途の対応表を作って\
        保守する必要はありません。復号は私たちではなくブラウザの仕事だからです。"""

[[faq]]
q = "どの動画形式で書き出されますか？"
a = """
        H.264 の映像を収めた MP4 で、事実上どこでも再生できます。WebCodecs のない\
        ブラウザでは、代わりに WebM への録画に切り替わります &mdash; 同じ映像を、\
        受け付ける編集ソフトがより少ない入れ物に収めたものです。"""

[[faq]]
q = "Blender や After Effects のレンダリング連番に使えますか？"
a = """
        使えます &mdash; 番号付きのレンダリング連番こそ、これが想定している用途\
        です。レンダラーが書き出したフレームを追加し、表示時間を1フレームのままに\
        して、フレームレートをレンダリングに合わせてください。「名前順に並べる」は\
        期待どおりの数え方をするので、<code>frame_2</code> は
        <code>frame_10</code> より後ではなく前に来ます。
        <br><br>
        始める前に知っておく価値のあることがひとつ。H.264 にはアルファチャンネルが\
        ないので、透過は引き継がれず、背景色に合成されて平らになります。アルファを\
        保ちたい場合は、お使いの編集ソフトでフレームを合成してください。"""

[[faq]]
q = "写真からタイムラプスを作れますか？"
a = """
        作れますし、レンダリング連番と同じ仕事です。各写真を1フレームだけ映すように\
        して、フレームレートを選んでください。30 fps なら写真30枚が動画1秒に、
        12 fps なら同じ写真が2.5秒になります。
        <br><br>
        「日付順に並べる」は、カメラの写真を撮影した順に戻します。ファイル名が
        0001 に戻ってしまっている場合には、これが効きます。大きさの違う写真が\
        混ざっていても問題ありません &mdash; 「いちばん大きい画像に合わせる」を\
        選べば、どれも縮小されない大きさで動画が作られます。"""

[[faq]]
q = "画像の枚数や動画の長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。現実的な上限はあなたの端末のメモリ\
        です。できあがった動画はダウンロード前にそこで組み立てられるからです。\
        最初にそれを感じるのは、非常に大きな 4K のスライドショーです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには\
        広告があり、それが費用を賄っています。広告にあなたの画像に関する情報が\
        渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。処理のために画像をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

[[faq]]
q = "音楽やBGMを付けられますか？"
a = """
        まだできません。このツールが作るのは映像だけで、書き出す MP4 には映像\
        トラックが1本あるだけで音声トラックはありません。必要な場合は、あとから\
        動画編集ソフトで音を足してください。"""

[schema]
browser_requirements = "JavaScript が必要です。MP4 での書き出しには WebCodecs 対応のブラウザが必要で、それ以外では WebM に切り替わります。"
description = "画像の入ったフォルダーを MP4 のスライドショー動画にします。すべての工程がブラウザの中で動くので、画像がアップロードされることはありません。"
features = [
  "JPG、PNG、WebP、GIF、AVIF の画像を動画にします",
  "MP4（H.264）で書き出し、対応していない場合は WebM に切り替わります",
  "解像度は 3840x2160 まで、フレームレートは 12 から 60 fps まで",
  "1枚ごとの表示時間を、フレーム数でも秒でも指定できます",
  "オフラインで動作。アップロードなし、登録なし",
]

