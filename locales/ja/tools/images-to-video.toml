text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[facts]]
text = "ファイルは端末に残ります"

[[privacy]]
title = "画像には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。ここは\
      かつて<code>connect-src 'none'</code>でした。絶対的な宣言です。広告を入れた\
      ことで、それを手放しました。そう書いておくことも取引のうちです。"""

[[privacy]]
title = "エンコードは手元で行います。"
body = """
WebCodecsが動くのはブラウザの中で、できあがったファイルはそのまま\
      ダウンロードへ渡ります。このアプリにサーバー側は存在しません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、画像に関する\
      情報は渡されません。ファイルも、サムネイルも、名前も、サイズも、枚数もです。\
      画像を読み、デコードし、合成し、エンコードするコードはすべてこのオリジンから\
      配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や画像に関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "意図した例外がひとつあります。"
body = """
「ウェブアドレスから追加」を使うと、画像を取得するためにそのサーバーへ接続\
      するので、相手にはこちらのIPアドレスが見えます。取りに行くのは貼り付けた画像\
      だけで、向きは内側だけです。開いているのは<code>img-src</code>であって、\
      <code>connect-src</code>ではありません。下のカウンターは、接続した外部\
      オリジンをすべて列挙します。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、ウェブアドレスからの読み込み以外はすべてそのまま動きます。\
      これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
フォルダごと選択欄にドロップするか、ファイルを手で選んでください。ブラウザが\
      ディスクから直接読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "順番を決め、1枚をどれだけ映すかを決めます。"
body = """
ドラッグで並べ替えられます。表示時間はフレーム数でも秒でも指定でき、全体\
      まとめてでも1枚ずつでも設定できます。"""

[[howto]]
title = "解像度とフレームレートを選びます。"
body = """
「いちばん大きい画像に合わせる」を選ぶと、最大の画像に従います。プリセットは\
      4K、1080p、720p、正方形、縦長をそろえてあり、どれも合わなければサイズを自分で\
      指定できます。"""

[[howto]]
title = "動画を作ってダウンロードします。"
body = """
エンコードは手元のハードウェアで動くので、かかる時間は順番待ちではなく端末の\
      性能次第です。できあがったMP4は、そのままブラウザのダウンロードへ渡します。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みも合成もエンコードも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。唯一の例外は任意\
        機能の「ウェブアドレスから追加」で、貼り付けた画像を取得しに行くため、その\
        サーバーにはこちらのIPアドレスが見えます。"""

[[faq]]
q = "どの画像形式が使えますか？"
a = """
        ブラウザがデコードできる静止画形式ならどれでもです。実際にはJPG、PNG、WebP、\
        GIF、AVIF、そしてAppleの端末ではHEICです。ここに別途の対応表を作って保守する\
        必要はありません。デコードは当サイトではなく、ブラウザの仕事だからです。"""

[[faq]]
q = "どの動画形式で書き出されますか？"
a = """
        H.264の映像を収めたMP4で、事実上どこでも再生できます。WebCodecsのない\
        ブラウザでは、代わりにWebMへの録画に切り替わります。同じ映像を、受け付ける\
        編集ソフトがより少ない入れ物に収めたものです。"""

[[faq]]
q = "BlenderやAfter Effectsのレンダリング連番に使えますか？"
a = """
        使えます。番号付きのレンダリング連番こそ、これが想定している用途です。\
        レンダラーが書き出したフレームを追加し、表示時間を1フレームのままにして、\
        フレームレートをレンダリングに合わせてください。「名前順に並べる」は期待\
        どおりの数え方をするので、<code>frame_2</code>は<code>frame_10</code>より\
        後ではなく前に来ます。\
        <br><br>\
        始める前に知っておく価値のあることがひとつあります。H.264にはアルファ\
        チャンネルがないので、透過は引き継がれず、背景色に合成されて平らになります。\
        アルファを保ちたい場合は、お使いの編集ソフトでフレームを合成してください。"""

[[faq]]
q = "写真からタイムラプスを作れますか？"
a = """
        作れますし、レンダリング連番と同じ仕事です。各写真を1フレームだけ映すように\
        して、フレームレートを選んでください。30fpsなら写真30枚が動画1秒に、12fpsなら\
        同じ写真が2.5秒になります。\
        <br><br>\
        「日付順に並べる」は、カメラの写真を撮影した順に戻します。ファイル名が0001に\
        戻ってしまっているときに効きます。大きさの違う写真が混ざっていても問題は\
        ありません。「いちばん大きい画像に合わせる」を選べば、どれも縮小されない\
        大きさで動画を作ります。"""

[[faq]]
q = "画像の枚数や動画の長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。現実的な上限は端末のメモリです。\
        できあがった動画をダウンロード前にそこで組み立てるからです。最初にそれを\
        感じるのは、非常に大きな4Kのスライドショーです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには広告が\
        あり、それが費用を賄っています。広告に画像の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。処理の\
        ために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

[[faq]]
q = "音楽やBGMを付けられますか？"
a = """
        まだできません。このツールが作るのは映像だけで、書き出すMP4には映像トラックが\
        1本あるだけで、音声トラックはありません。必要な場合は、あとから動画編集ソフト\
        で音を足してください。"""

[schema]
browser_requirements = "JavaScriptが必要です。MP4での書き出しにはWebCodecs対応のブラウザが必要で、それ以外ではWebMに切り替わります。"
description = "画像の入ったフォルダをMP4のスライドショー動画にします。すべての工程がブラウザの中で動くので、画像がアップロードされることはありません。"
features = [
  "JPG、PNG、WebP、GIF、AVIFの画像を動画にします",
  "MP4（H.264）で書き出し、対応していない場合はWebMに切り替わります",
  "解像度は3840x2160まで、フレームレートは12から60fpsまで",
  "1枚ごとの表示時間を、フレーム数でも秒でも指定できます",
  "オフラインで動作。アップロードなし、登録なし",
]

