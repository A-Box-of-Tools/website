features = [
  "JPG、PNG、WebP、GIF、AVIFの画像を動画にします",
  "MP4（H.264）で書き出し、対応していない場合はWebMに切り替わります",
  "4Kまでの解像度プリセット、ブラウザーの制限内で指定できる任意の寸法、1〜120 fpsの任意の整数フレームレート",
  "1枚ごとの表示時間を、フレーム数でも秒でも指定できます",
  "オフラインで動作。アップロードなし、登録なし",
]

