#
# HEIC から JPG へ - Japanese.
#
# Overrides for tools/heic-to-jpg/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# The English name is a phrase, "HEIC to JPG"; Japanese names a tool with a
# noun, so it is HEIC→JPG変換ツール, which is also what people type.
#

name = "HEIC→JPG変換ツール"
# 後半の span が検索される語です。
heading = "HEIC→JPG変換<span class=\"h1-kw\">｜iPhoneの写真を変換</span>"
tagline = "iPhoneが作る写真を、どこでも開ける形式に。"

title = "HEICをJPGに変換｜無料・アップロード不要"
description = "iPhoneのHEIC写真をブラウザの中でJPGに変換します。デコーダーが動くのは手元の端末です。アップロードなし、登録なし、オフラインでも動作。撮影日時やカメラ情報も引き継げます。"
og_title = "HEIC写真を、アップロードせずにJPGにする"
og_description = "写真を欲しがらない変換ツールです。HEICのデコーダーはこのページから配信され、手元の端末で動くので、写真がそこから出ることはありません。"
og_image_alt = "HEICをJPGに - iPhoneの写真を、どこでも開ける形式に"

pledge = """
    デコードを行うのは、お使いのブラウザと手元のハードウェアです。HEICは\
    ブラウザが単体では開けない唯一の画像形式なので、このページはデコーダーを\
    抱えたまま配信されます。約1.4MB、このサイトから届き、初回以降は\
    キャッシュされます。ほかのHEIC変換サイトがどこもアップロードを求めるのは、\
    まさにここが理由です。コーデックをサーバーに置いているので、写真のほうが\
    そこへ行かなければなりません。こちらは代わりに、コーデックをここへ置きました。\
    このページにネットワーク機能は一切なく、向こう側に写真を送るサーバーも\
    ありません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      写真を変換してみてください。このページ自身のファイルと、その中のデコーダーが\
      読み込まれるのは見えますが、写真もサムネイルもファイル名も、選んだファイルの\
      1バイトも運ぶリクエストはひとつもありません。ページを一度読み込んでから\
      回線を抜き、フォルダ1つ分をまとめて変換してみるのでも構いません。"""

read_first = """
、デコーダーがどう読み込まれ何を許されているかについては\
      <code>src/heif.js</code>、写真のメタデータを見つけ出す入れ物の解析については\
      <code>src/boxes.js</code>、そのメタデータがJPEGへ入る途中で何をされるかに\
      ついては<code>src/exif.js</code>です。エンジン本体は\
      <code>vendor/libheif.js</code>で、無改変のまま、ライセンスを添えて置いて\
      あります。"""

howto_heading = "HEIC写真をJPGに変換する手順"

card = """
            iPhoneが作る写真を、どこでも開ける形式に。誰かのサーバーではなく、\
            手元の端末でデコードします。"""

[words]
plural = "写真"
choose = "写真"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "容量制限なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[privacy]]
title = "写真には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "デコーダーはここから来て、どこへも行きません。"
body = """
HEICとは箱形式に入ったHEVCで、Safari以外のブラウザはこれをデコードしません。\
      そこでこのページは、WebAssemblyにコンパイルした<code>libheif</code>を配ります。\
      約1.4MB、このリポジトリに登録され、このオリジンから配信され、ほかのファイル\
      と同じくサービスワーカーがキャッシュします。CDNから取りに行くことはしません。\
      それでは訪問のたびに第三者が経路に入り、オフラインで動かなくなるからです。\
      バイナリを別ファイルにせずスクリプトの中に入れてあるのも、起動に通信を\
      必要としないためです。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
このツールのために書かれたファイルのどこにも<code>fetch</code>も\
      <code>XMLHttpRequest</code>も<code>sendBeacon</code>もありません。同梱の\
      エンジンには、Emscriptenのビルドがどれもそうであるように、URLから\
      <code>.wasm</code>を取りに行く読み込み経路が含まれています。それは通りません。\
      バイナリがすでに手元にあるからです。仮に通ったとしても、\
      <code>connect-src</code>はGoogleの計測用エンドポイントしか挙げていないので、\
      ブラウザが拒みます。証拠になるのは約束ではなくポリシーのほうです。"""

[[privacy]]
title = "メタデータはここで読み、ここで表示します。"
body = """
ページ上の一覧は、各写真が何を抱えているのかを示します。撮影日時、カメラ、\
      そしてGPS座標が入っているかどうか。そのJPEGを誰かに渡す前に知っておきたい\
      ことだからです。これはこのブラウザの中で<code>src/boxes.js</code>がファイル\
      から読み出し、このページに表示し、選択に従ってJPEGに書き込むか外すかします。\
      ファイル名も、日付も、座標も、件数も運ぶような独自の解析イベントは、この\
      リポジトリのどこにもありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、写真に関する情報は渡されません。ファイルを読み、\
      デコードし、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
ページを一度読み込んでから通信を切っても、このツールは何も変わりません。\
      デコーダーも一緒にキャッシュされているからです。これがいちばん単純な証明で\
      あり、このサイトのどのページよりも強い証明です。デコードのために写真を\
      どこかへ送っている変換ツールに、これはどうやってもできません。"""

[[howto]]
title = "HEIC写真を選びます。"
body = """
選択欄にドロップするか、手で選んでください。スマホのバックアップからでも、\
      デスクトップのフォルダからでも構いません。ブラウザがディスクから読み出します。\
      その間に何かがどこかへ送られることはありません。一覧には、それぞれが何で\
      あり、中に何が入っているのかが表示されます。"""

[[howto]]
title = "写真が何を抱えているのかを確かめます。"
body = """
各行に、撮影日、カメラ、そしてGPS座標が入っているかどうかが表示されます。\
      座標だけ緑色なのは、そこがいちばん気にとめる価値のある部分だからです。これは\
      画像をデコードせずに入れ物から読み出すので、負荷がなく、すぐに表示されます。"""

[[howto]]
title = "形式を選び、付随情報をどうするかを決めます。"
body = """
理由がなければJPEGです。どこでも開ける形式であり、それこそが変換する目的\
      だからです。画質のスライダーは92になっています。写真であれば元と見分けにくい\
      設定です。チェックボックスで、撮影日時、カメラ、位置情報を引き継ぐかどうかを\
      決めます。"""

[[howto]]
title = "「変換」を押して、ダウンロードします。"
body = """
デコーダーは最初の変換時に届きます。約1.4MB、一度だけです。それ以降はどの\
      写真も、手元の端末でデコードして書き出します。1枚ならダウンロードボタンが、\
      複数ならzipも出ます。"""

[[faq]]
q = "写真はどこかにアップロードされますか？"
a = """
        されません。読み込みもデコードも書き出しも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにはネットワーク機能が一切なく、何も\
        取りに行かず、何も送りません。ページの<code>Content-Security-Policy</code>\
        には接続してよいアドレスがすべて挙がっていますが、そのどれも当サイトの\
        ものではありません。唯一読み込まれるのはデコーダーそのもので、それはこの\
        サイトから、一度だけ、写真が関わる前に届きます。"""

[[faq]]
q = "初回に1.4MBもダウンロードされるのはなぜですか？"
a = """
        HEICが、ブラウザの開けない唯一の画像形式だからです。箱形の入れ物に入った\
        HEVCのフレームで、デコーダーを持っているのはAppleのハードウェア上のSafari\
        だけです。ChromeもFirefoxもEdgeも、そのファイルをただ断ります。ですから\
        HEICの変換にはどこかからデコーダーが要り、置き場所は2つしかありません。\
        サーバーか、ページかです。ほかの変換サイトはすべてサーバーを選びました。\
        だからどこも、写真をアップロードさせる必要があるのです。こちらは代わりに、\
        WebAssemblyにコンパイルした<code>libheif</code>を抱えています。このサイト\
        から配信され、初回以降はキャッシュされます。これが、写真がどこにも行かない\
        ことの代金のすべてです。"""

[[faq]]
q = "JPEGに撮影日時、カメラ、位置情報は残りますか？"
a = """
        残したければ残ります。ページ上のチェックボックスです。有効なままなら、EXIF\
        ブロックがHEICから取り出され、スマホが書いたとおりにJPEGへ書き込まれます。\
        ですから変換後の写真も、変換した日ではなく撮影した日で並びます。HEIC変換\
        ツールへの不満として、いちばんよく聞くのがこれです。変わるタグはひとつだけ、\
        向きです。「正立」に設定されます。回転はすでにピクセルに適用されているので、\
        ビューアーがもう一度適用すると、縦向きの写真がすべて横倒しになってしまう\
        からです。チェックを外すと、JPEGには画像だけが入り、ほかは何も入りません。"""

[[faq]]
q = "GPS座標は削除されますか？"
a = """
        入っていることをまず知らせ、そのうえで指示どおりにします。各写真の行には、\
        何かを変換する前の段階で、そのファイルが座標を抱えているかどうかが表示\
        されます。スマホがしてくれる以上のことです。「撮影日時、カメラ、設定を残す」\
        のチェックを外せば、ほかのすべてと一緒にJPEGから外れます。入れたままなら\
        引き継がれます。タグを細かく見たいときや、すでにJPEGになっている写真から\
        消したいときは、<a href="../exif-editor/">EXIFビューアー・削除ツール</a>が\
        その役目を担い、しかも画像を再圧縮せずに行います。"""

[[faq]]
q = "画像は再圧縮されますか？"
a = """
        されますし、そうするしかありません。HEICとJPEGは別のコーデックなので、画像を\
        デコードして書き直さずに一方から他方へ移る方法がありません。決められるのは、\
        その代償の大きさです。画質のスライダーは既定で92で、写真であれば元との区別が\
        非常に難しい値です。まったく劣化させたくなく、ファイルが5倍から10倍になっても\
        構わない場合のために、PNGも選べるようにしてあります。"""

[[faq]]
q = "拡張子が.jpgでも中身がHEICの場合は？"
a = """
        それでも動きます。ここに入れたファイルは、名前ではなく先頭のバイト列で判別\
        します。名前は、そのファイルに最後に触れたアプリが決めたものにすぎません。\
        そして「.jpg」という名前で届いたHEICは、こういう道具を探しに来る理由として\
        もっとも多いもののひとつです。本当にJPEGやPNGであるファイルは、自分自身の\
        複製に変換されるのではなく、その旨のメッセージを出して断ります。"""

[[faq]]
q = "Live Photoやバースト撮影も変換できますか？"
a = """
        中の静止画は変換できます。1つのHEICは複数の画像を抱えられ、抱えているものは\
        すべて変換して、元の名前に連番を付けて保存します。Live Photoの動画のほうは、\
        スマホがHEICの隣に置いている別ファイルなので、ここには入っておらず、変換の\
        対象にもなりません。深度マップとサムネイルは入れ物の中にありますが、誰かが\
        求めた画像ではないので、手をつけません。"""

[[faq]]
q = "AVIFを受け付けないのはなぜですか？"
a = """
        することがないからです。AVIFはHEICと同じ入れ物に、HEVCの代わりにAV1が入った\
        もので、現行のブラウザはどれもそのままデコードできます。ですから変換ツールを\
        用意することは、存在しない問題のために1メガバイトのエンジンを配ることに\
        なります。AVIFをJPEGにしたいときは、\
        <a href="../compress-image/">画像圧縮ツール</a>と\
        <a href="../resize-image/">画像リサイズツール</a>のどちらも、ブラウザが\
        すでに持っているデコーダーでAVIFを読み、JPEGを書き出します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。ファイル\
        の数にもサイズにも制限はありません。その費用を払うサーバーが存在せず、処理が\
        手元の端末で起きているからです。このサイトには広告があり、それが費用を賄って\
        います。広告に写真の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        デコーダーごと動きます。ページを一度読み込んでから通信を切っても、写真の処理\
        はそれまでとまったく同じように続きます。何もアップロードされていないことを\
        示す、手に入るかぎり最も強い証明でもあります。デコードのためにHEICをどこかへ\
        送っている変換ツールなら線を抜いた瞬間に止まりますが、これは止まりません。"""

