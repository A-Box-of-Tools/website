[[privacy]]
title = "写真には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "デコーダーはここから来て、どこへも行きません。"
body = """
 HEIC とは箱形式に入った
      HEVC で、Safari 以外のブラウザはこれをデコードしません。そこでこのページは
      WebAssembly にコンパイルした <code>libheif</code> を配ります &mdash; 約1.4MB、\
      このリポジトリに登録され、このオリジンから配信され、ほかのファイルと同じく\
      サービスワーカーがキャッシュします。CDN から取りに行くことはしません。\
      それでは訪問のたびに第三者が経路に入り、オフラインで動かなくなるからです。\
      バイナリを別ファイルにせずスクリプトの中に入れてあるのは、まさに起動に\
      通信を必要としないためです。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 このツールのために書かれた\
      ファイルのどこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。同梱のエンジンには、Emscripten の\
      ビルドがどれもそうであるように、URL から <code>.wasm</code> を取りに行く\
      読み込み経路が含まれています。それは通りません。バイナリがすでに手元に\
      あるからです &mdash; 仮に通ったとしても、<code>connect-src</code> は
      Google の計測用エンドポイントしか挙げていないので、ブラウザが拒みます。\
      証拠は約束ではなくポリシーのほうです。"""

[[privacy]]
title = "メタデータはここで読まれ、あなたに報告されます。"
body = """
 ページ上の一覧は、\
      各写真が何を抱えているかを示します &mdash; 撮影日時、カメラ、そして GPS
      座標が入っているかどうか &mdash; その JPEG を誰かに渡す前に知っておきたい\
      ことだからです。これはこのブラウザの中で <code>src/boxes.js</code> が\
      ファイルから読み出し、このページに表示し、あなたの選択に従って JPEG に\
      書き込むか外すかします。ファイル名も、日付も、座標も、件数も運ぶような\
      独自の解析イベントは、このリポジトリのどこにもありません。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたの写真に関する情報は渡されません。ファイルを読み、\
      デコードし、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 ページを一度読み込んでから通信を切っても、\
      このツールは何も変わりません &mdash; デコーダーも一緒にキャッシュされて\
      います。これがいちばん単純な証明であり、このサイトのどのページよりも強い\
      証明です。デコードのために写真をどこかへ送っている変換ツールに、これは\
      どうやってもできません。"""

[[howto]]
title = "HEIC 写真を選びます。"
body = """
 選択欄にドロップするか、手で選んで\
      ください。スマホのバックアップからでも、デスクトップのフォルダーからでも\
      構いません。ブラウザがディスクから読み出します。その間に何かがどこかへ\
      送られることはありません。一覧には、それぞれが何であり、中に何が入って\
      いるかが表示されます。"""

[[howto]]
title = "写真が何を抱えているかを確かめます。"
body = """
 各行には、撮影日、カメラ、\
      そして &mdash; 気にとめる価値のある部分なので緑色で &mdash; GPS 座標が\
      入っているかどうかが表示されます。これは画像をデコードせずに入れ物から\
      読み出すので、負荷がなく、すぐに表示されます。"""

[[howto]]
title = "形式を選び、付随情報をどうするか決めます。"
body = """
 理由がなければ JPEG です。\
      どこでも開ける形式であり、それこそが変換する目的だからです。画質のスライダーは
      92 になっています。写真であれば元と見分けにくい設定です。チェックボックスで、\
      撮影日時、カメラ、位置情報を引き継ぐかどうかを決めます。"""

[[howto]]
title = "「変換」を押して、ダウンロードします。"
body = """
 デコーダーは最初の変換時に\
      届きます &mdash; 約1.4MB、一度だけです &mdash; それ以降はどの写真も、\
      あなた自身の端末でデコードされ書き出されます。1枚ならダウンロードボタンが、\
      複数なら zip も出ます。"""

[[faq]]
q = "写真はどこかにアップロードされますか？"
a = """
        されません。ファイルの読み込みもデコードも書き出しも、あなた自身の\
        ブラウザがあなた自身のハードウェア上で行います。このツールにはネットワーク\
        機能が一切なく &mdash; 何も取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。唯一読み込まれる\
        のはデコーダーそのもので、それはこのサイトから、一度だけ、あなたの写真が\
        関わる前に届きます。"""

[[faq]]
q = "初回に1.4MB もダウンロードされるのはなぜですか？"
a = """
        HEIC が、ブラウザの開けない唯一の画像形式だからです。箱形の入れ物に入った
        HEVC のフレームで、デコーダーを持っているのは Apple のハードウェア上の
        Safari だけです。Chrome も Firefox も Edge も、そのファイルをただ断ります。\
        ですから HEIC の変換にはどこかからデコーダーが要り、置き場所は2つしか\
        ありません。サーバーか、ページかです。ほかの変換サイトはすべてサーバーを\
        選びました。だからどこも、あなたの写真をアップロードさせる必要があるの\
        です。こちらは代わりに、WebAssembly にコンパイルした <code>libheif</code>
        を抱えています。このサイトから配信され、初回以降はキャッシュされます。\
        これが、あなたの写真がどこにも行かないことの代金のすべてです。"""

[[faq]]
q = "JPEG に撮影日時、カメラ、位置情報は残りますか？"
a = """
        残したければ残ります。ページ上のチェックボックスです。有効なままなら、
        EXIF ブロックが HEIC から取り出され、スマホが書いたとおりに JPEG へ\
        書き込まれます。ですから変換後の写真も、変換した日ではなく撮影した日で\
        並びます &mdash; HEIC 変換ツールへの不満として、いちばんよく聞くのが\
        これです。変わるタグはひとつだけ、向きです。「正立」に設定されます。\
        回転はすでにピクセルに適用されているので、ビューアーがもう一度適用すると、\
        縦向きの写真がすべて横倒しになってしまうからです。チェックを外すと、
        JPEG には画像だけが入り、ほかは何も入りません。"""

[[faq]]
q = "GPS 座標は削除されますか？"
a = """
        入っていることをまず知らせ、そのうえであなたの指示どおりにします。各写真の\
        行には、何かを変換する前の段階で、そのファイルが座標を抱えているかどうかが\
        表示されます。スマホがしてくれる以上のことです。「撮影日時、カメラ、設定を\
        残す」のチェックを外せば、ほかのすべてと一緒に JPEG から外れます。入れた\
        ままなら引き継がれます。タグを細かく見たい場合や、すでに JPEG になっている\
        写真から消したい場合は、<a href="../exif-editor/">EXIF ビューアー &amp;
        削除ツール</a> がその役目を担い、しかも画像を再圧縮せずに行います。"""

[[faq]]
q = "画像は再圧縮されますか？"
a = """
        されますし、そうするしかありません。HEIC と JPEG は別のコーデックなので、\
        画像をデコードして書き直さずに一方から他方へ移る方法がありません。あなたが\
        決められるのは、その代償の大きさです。画質のスライダーは既定で92で、写真で\
        あれば元との区別が非常に難しい値です。まったく劣化させたくなく、ファイルが
        5倍から10倍になっても構わない場合のために、PNG も選べるようにしてあります。"""

[[faq]]
q = "拡張子が .jpg でも中身が HEIC の場合は？"
a = """
        それでも動きます。ここに入れたファイルは名前ではなく先頭のバイト列で判別\
        されます。名前は、そのファイルに最後に触れたアプリが決めたものにすぎません
        &mdash; そして「.jpg」という名前で届いた HEIC は、こういう道具を探しに\
        来る理由としてもっとも多いもののひとつです。本当に JPEG や PNG である\
        ファイルは、自分自身の複製に変換されるのではなく、その旨のメッセージを\
        出して断られます。"""

[[faq]]
q = "Live Photo やバースト撮影も変換できますか？"
a = """
        中の静止画は変換できます。1つの HEIC は複数の画像を抱えられ、抱えている\
        ものはすべて変換され、元の名前に連番を付けて保存されます。Live Photo の\
        動画のほうは、スマホが HEIC の隣に置いている別ファイルなので、ここには\
        入っておらず変換の対象にもなりません。深度マップとサムネイルは入れ物の\
        中にありますが、誰かが求めた画像ではないので、手をつけません。"""

[[faq]]
q = "AVIF を受け付けないのはなぜですか？"
a = """
        することがないからです。AVIF は HEIC と同じ入れ物に、HEVC の代わりに AV1 が\
        入ったもので、現行のブラウザはどれもそのまま復号できます &mdash; ですから\
        変換ツールを用意することは、存在しない問題のために1メガバイトのエンジンを\
        配ることになります。AVIF を JPEG にしたい場合は、
        <a href="../compress-image/">画像圧縮ツール</a> と
        <a href="../resize-image/">画像リサイズツール</a> のどちらも、ブラウザが\
        すでに持っているデコーダーで AVIF を読み、JPEG を書き出します。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在しないからです &mdash; 処理はあなた自身の端末で起きています。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        写真に関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        デコーダーごと動きます。ページを一度読み込んでから通信を切っても、\
        写真の処理はそれまでとまったく同じように続きます。これは、何も\
        アップロードされていないことを示す、手に入るかぎり最も強い証明でも\
        あります。デコードのために HEIC をどこかへ送っている変換ツールなら\
        線を抜いた瞬間に止まりますが、これは止まりません。"""

[schema]
description = "iPhone の HEIC・HEIF 写真を JPEG、PNG、WebP に変換します。HEIC のデコーダーはページ自身から配信される WebAssembly なので、画像はあなた自身の端末でデコードされ、アップロードされることはありません。撮影日時、カメラ、位置情報は、JPEG に引き継ぐことも外すこともできます。"
features = [
  "HEIC と HEIF を JPEG、PNG、WebP に変換します",
  "Safari だけでなく、どのブラウザでもブラウザ内でデコードします",
  "何もアップロードされず、通信を切ったままでも動作します",
  "撮影日時、カメラ、GPS を JPEG に引き継ぐことも、外すこともできます",
  "何かを変換する前に、どの写真が GPS 座標を抱えているかを表示します",
  "向きのタグを直すので、縦向きの写真が横倒しになりません",
  "ファイルを中身で判別するので、.jpg という名前の HEIC でも動きます",
  "バーストや Live Photo の中の画像を、1枚目だけでなくすべて変換します",
  "まとめて処理でき、結果は1つの zip にまとまります",
]

[picker]
title = "ここに HEIC 写真をドロップ"
hint = "クリックして選ぶこともできます &mdash; .heic と .heif、名前が何であっても"
