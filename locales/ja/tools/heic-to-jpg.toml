title = "HEIC を JPG に変換 &mdash; 無料・アップロード不要"
description = "iPhone の HEIC 写真をブラウザ内で JPG に変換します。デコーダーはあなた自身の端末で動きます。アップロードなし、登録なし、オフラインでも動作。撮影日時やカメラ情報も引き継げます。"
og_title = "HEIC 写真を、アップロードせずに JPG にする"
og_description = "あなたの写真を欲しがらない変換ツール。HEIC のデコーダーはこのページから配信され、あなた自身の端末で動くので、写真がそこから出ることはありません。"
og_image_alt = "HEIC を JPG に - iPhone の写真を、どこでも開ける形式に"

pledge = """
    デコードはあなた自身のブラウザの中で、あなた自身のハードウェア上で行われます。
    HEIC はブラウザが単体では開けない唯一の画像形式なので、このページはデコーダーを\
    抱えて配信されます &mdash; 約1.4MBで、このサイトから配信され、初回以降は\
    キャッシュされます。ほかのすべての HEIC 変換サイトがアップロードを求める理由は、\
    まさにこれです。コーデックをサーバーに置いているので、写真のほうがそこへ\
    行かなければなりません。こちらは代わりにコーデックをここに置きました。この\
    ページにネットワーク機能は一切なく、向こう側に写真を送るサーバーもありません。"""

live_hint = """
      鵜呑みにする必要はありません。DevTools を開いてネットワークタブを見ながら\
      写真を変換してみてください。このページ自身のファイル、その中のデコーダーが\
      読み込まれるのが見えますが、写真も、サムネイルも、ファイル名も、選んだ\
      ファイルの1バイトも運ぶリクエストはひとつもありません。あるいはページを\
      一度読み込んでから回線を抜き、フォルダー1つ分をまとめて変換してみて\
      ください。"""

read_first = """
、デコーダーがどう読み込まれ何を許されているかについては
      <code>src/heif.js</code>、写真のメタデータを見つけ出す入れ物の解析については
      <code>src/boxes.js</code>、そのメタデータが JPEG へ入る途中で何をされるかに\
      ついては <code>src/exif.js</code> です。エンジン本体は
      <code>vendor/libheif.js</code> で、無改変のまま、ライセンスを添えて\
      置いてあります。"""

howto_heading = "HEIC 写真を JPG に変換する手順"

card = """
            iPhone が作る写真を、どこでも開ける形式に &mdash; 誰かのサーバー\
            ではなく、あなた自身の端末でデコードします。"""

