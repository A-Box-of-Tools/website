[[privacy]]
title = "人の一覧は、軽々しく渡すものではありません。"
body = """
たいていの身長図表はアカウントを求めますし、求めないものにも、\
      打ち込まれた名前と数字をすべて見ているサーバーがあります。ここで打ち込むのは、\
      あなたの家族が誰で、その一人ひとりが何センチかということで、名前の隣の図から子どもの\
      年齢まで見当がついてしまうことも少なくありません。そのどれもどこにも送られません。\
      ここには送る先がないからです。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も\
      <code>XMLHttpRequest</code>も<code>sendBeacon</code>もありません。\
      Content-Security-Policyには、このページが接続してよいアドレスがすべて書かれていて、\
      そのどれもこのサイトのものではありません。"""

[[privacy]]
title = "訪問と訪問のあいだにも、何も覚えていません。"
body = """
図表はページの中だけに存在します。タブを閉じれば一覧は消えます。\
      保持するアカウントもなければ、運ぶクッキーもなく、このブラウザの保存領域にも何も\
      書き込まれません。取っておきたい図表がダウンロードする図表になるのは、そのためです。"""

[[privacy]]
title = "リンクは図表を運びません。"
body = """
この種の道具のいくつかは、共有できるようにと一覧まるごとを\
      アドレス欄に入れます。そうすると、あらゆる名前と身長が、そのリンクが通る先すべてに\
      記録されるものへ変わります。チャットのサーバー、メールの検査装置、誰かの閲覧履歴。\
      このページのアドレスは、打っているあいだ一度も変わりません。"""

[[privacy]]
title = "PNGは、画面に出ているSVGから作られます。"
body = """
ダウンロードは、プレビューと食い違うかもしれない二度目の描画では\
      ありません。同じマークアップをブラウザに渡してキャンバスに描いているだけで、だからこそ\
      ネットワークを抜いたままでもできます。取りに行くフォントも、中に読み込む画像も\
      ないからです。"""

[[privacy]]
title = "足した画像はここで読み、どこへも送りません。"
body = """
ファイルがこのページを出ることはありません。ブラウザ自身の<code>FileReader</code>で読み、\
      何も実行しない不活性な文書として解析します。描かれるのはそのファイルではありません。\
      <code>src/import-svg.js</code>が、図形と幾何だけを許可した一覧から新しい絵を組み立てるので、\
      スクリプトもスタイルシートもフォントも、リンクされた画像も、他の文書への参照も、\
      運ばれずにその場へ置いていかれます。これが二重に効いてくるのは、ダウンロードした図表が\
      他人に送るファイルだからです。もし何かが生き残っていたら、それは何日も後に、\
      このページが書いたものから、相手のブラウザが見知らぬサーバーを呼ぶということになります。

      写真やPNGはプログラムではなく、組み直すものが何もありません。ブラウザ自身のデコーダーが読み、図表に載る前にここでキャンバスへ描き直されます。ファイルのメタデータ——カメラ、場所、プロファイル、その中にあった何もかも——が置いていかれるのは、この描き直しのためです。キャンバスを通り抜けられるものは一つもありません。図表に入るのはこのページが符号化した画像で、アドレスではなくデータとして書き込まれるので、図表は相変わらずどこも指しません。"""

[[privacy]]
title = "絵はここにあり、取りに行くものではありません。"
body = """
四体の図はどれもパブリックドメインの絵で、ページの残りと一緒に\
      このオリジンから配信されます。アイコンフォントもCDNも、打っているあいだによその\
      サーバーから引っぱるスプライトもありません。ネットワークを抜いても図表が描けるのは、\
      これも理由の一つです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ます。そのどれにも、名前も身長も渡されません。あなたの一覧を絵に変えるすべての行は、\
      このオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
ネットワークを切っても道具は何も変わりません。もともと\
      ネットワークの段階がなかったからです。これが何よりも簡単な証明です。"""

[[howto]]
title = "まず全員を入れて、見た目はそのあとで。"
body = """
1行が、図と名前と身長と色です。名前は任意で——名前のない\
      シルエット二つに身長だけを添えた図が、まさに求められていることも多くあります&mdash;\
      順番が大事なら、各行の矢印で左右に動かせます。"""

[[howto]]
title = "身長は普段の書き方のまま打ち込みます。"
body = """
<code>173</code>、<code>1.73 m</code>、<code>5'8\"</code>、\
      <code>68 in</code>、<code>5 ft 8</code>はどれも正しく読まれます。欄の下の行が、何と\
      解釈したかを両方の単位系で示すので、読み違いは印刷したあとではなく描かれる前に\
      見えます。単位のない数字は、メートル法の図ではセンチメートル、ヤード・ポンド法の図では\
      インチで、3未満の裸の数字はメートルです。身長1.73 cmの人はいません。"""

[[howto]]
title = "その人に合う図を選びます。"
body = """
子どもはおよそ頭六つ、大人は七つ半の背丈です。ですから縮めた大人\
      として描かれた子どもは、名指しにくく、それでいてすぐ目につく形で違って見えます。\
      男の子と女の子は小さくした大人ではなく実在の子どもを描いたもので、家族の図表が\
      家族らしく見えるかどうかは、その大半がここで決まります。どの行にも最初から身長が\
      入っているので、誰かを足せば誰かが描かれます。そのまま上から打ち込んでください。"""

[[howto]]
title = "見慣れたものを図表に置きます。"
body = """
数字は抽象的で、戸口はそうではありません。誰もが大きさを知っている\
      ものを一つ加えること——ドア、窓、教室のホワイトボード、自動販売機——それが、\
      二つの身長を述べるだけの図表を、それを見せる図表に変えます。メニューには二十点が\
      分類して並んでいて、どれも自分の数字を上書きできる普通の行として入ります。ものには\
      高さのほかに幅もあるので、ドアは細い帯ではなく203に81です。"""

[[howto]]
title = "あるいは、自分の絵を載せます。"
body = """
<strong>自分の画像</strong>は、お手元のファイルを受け取り、指定した高さで目盛りの上に置きます。図表の主題が人ではなく製品や車両、建物であるときに手を伸ばすものです。SVGは他の図と同じくその行の色で描かれ、写真やPNGはそのままの姿で載ります。どちらも自身の比率を保ち、どちらもどこにも送らずにここで読みます。"""

[[howto]]
title = "読み手が慣れた単位に目盛りを合わせます。"
body = """
センチメートルとフィートの切り替えは、欄の中身を解釈し直すのではなく\
      書き換えます。ですから図表そのものは動かず、表記だけが変わります。読み手が二種類いる\
      図表なら、各図の上に書かれる身長は図表の単位で、各欄の下の行には両方が出ます。"""

[[howto]]
title = "貼るならPNG、印刷するならSVG。"
body = """
PNGは指定したピクセル高さの絵で、チャット欄や文書やスライドが\
      求めるのはこちらです。SVGは図表を指示として持っているので、どんな大きさでも鮮明に\
      印刷でき、ベクターを開けるものなら後から色を変えられます。"""

[[faq]]
q = "打ち込んだ内容はどこかに送られますか？"
a = """
        送られません。図表はこのページのJavaScriptが、ご自分の端末の上で描いています。この\
        道具にはネットワーク機能そのものがなく、何かを取りに行くことも送ることもありません。\
        ページの<code>Content-Security-Policy</code>には接続してよいアドレスがすべて書かれて\
        いて、そのどれもこのサイトのものではありません。ここではっきり言っておくべきなのは、\
        入力が人の名前と、その一人ひとりの背丈の一覧であり、このサイトが扱うもののほとんど\
        より私的なものだからです。"""

[[faq]]
q = "図表はダウンロードできますか？"
a = """
        できます。PNGでもSVGでも、透かしもアカウントもなしにです。PNGは指定したピクセル\
        高さで描かれ、文書やスライド、チャットに貼るのはこちらです。SVGは図表をピクセルでは\
        なく指示として持っているので、どんな大きさでも鮮明に印刷でき、後からどのベクター\
        エディターでも開いて色を変えられます。どちらも画面に出ているのと同じマークアップから\
        作られるので、プレビューと食い違いようがありません。"""

[[faq]]
q = "身長はどう書けばいいですか。センチメートルですか、フィートですか？"
a = """
        どちらでも、どの行でも、普段お書きになるとおりで構いません。<code>173</code>、\
        <code>173 cm</code>、<code>1.73 m</code>、<code>5'8\"</code>、\
        <code>5 ft 8 in</code>、<code>68 in</code>はすべて理解され、欄の下の行が何と読んだかを\
        両方の単位系で示します。単位のない数字は、図表がメートル法ならセンチメートル、\
        ヤード・ポンド法ならインチです。3未満の裸の数字はメートルと受け取ります。1.73 cmは\
        誰も打ち込まない身長だからです。"""

[[faq]]
q = "子どもが小さな大人に見えないのはなぜですか？"
a = """
        子どもは小さな大人ではないからです。身体のプロポーションは年齢で変わります。2歳児は\
        だいたい頭四つ半、8歳児は六つ、大人は七つ半の背丈です。ですから頭は幼い子どものほぼ\
        4分の1、大人の8分の1を占めます。ここでの男の子と女の子は、縮小したシルエット一つでは\
        なく実在の子どもを描いたもので、家族の図表が、大きさの違う大人四人ではなく家族に\
        見えるのはそのためです。"""

[[faq]]
q = "図はどこから来たものですか？"
a = """
        四つとも他の方の絵で、すべてパブリックドメインです。男性はpitr氏、女性は\
        Madeleine Price Ball氏、女の子はOpenClipart-Vectors、男の子はNIH BioArtライブラリの\
        ためにRyan Kissinger氏が描いたものです。どのファイルも公開されたままの姿で\
        <code>vendor/</code>に入ってこのページと一緒に配られるので、原典と突き合わせられます。\
        パブリックドメインは何も求めません。そこが肝心で、絵はあなたがダウンロードする画像の\
        中に入るので、表示を求めるライセンスなら、その義務があなたの図表にくっついてしまい\
        ます。"""

[[faq]]
q = "自分の画像を図表に載せられますか？"
a = """
        はい——<strong>自分の画像</strong>は、絵でも写真でも受け取り、打ち込んだ高さで目盛りの上に置きます。ロゴでも、間取り図でも、機械の部品でも、車でも、その物そのものの写真でも構いません。比率はその画像自身のものなので、幅を書き入れる必要はありません。
        <br><br>
        <strong>SVG</strong>は一色の塗りで描かれます。その行に設定した色で、図表の他の部分がそうだからです。ですから塗られた図形ではなく細い輪郭線で描かれた絵はしみになって出てきますし、それにはこの道具は向きません。残るのは<em>図形</em>だけです。ファイルはパスと長方形と円から一から組み直され、ネットワークに手が届きうるもの——リンクされた画像、スタイルシート、フォント、スクリプト——は置いていかれます。
        <br><br>
        <strong>写真やPNG</strong>はそのままの姿で載り、自分の色を保ちます。行の色は名前を書くためだけのものになります。載る前にここで描き直されるので、図表に持ち込む量には上限があり、ファイルのメタデータは置いていかれます。透明は保たれるので、切り抜いた画像は目盛りの上にきれいに立ちます——写真は背景ごと連れてくるので、先に切り落としておく価値があります。
        <br><br>
        どちらのファイルもどこにも行きません。それが二重に大事なのは、ダウンロードした図表が、誰かに送るかもしれないファイルだからです。"""

[[faq]]
q = "幼児や赤ちゃんの図がないのはなぜですか？"
a = """
        誰も描いてパブリックドメインに置いていないからです。ウィキメディア・コモンズに使える\
        自由な子どもの絵はちょうど一つ——あの女の子——だけ、NIH BioArtライブラリに\
        男の子が一つ。学齢より下は検索が空で返り、筋の通った無料の人物セットはどれもトイレの\
        ピクトグラムで、どの年齢でも同じ形をしています。この道具全体が避けようとしているのが、\
        まさにその間違いです。しばらくのあいだ、このページ自身のコードが描いた幼児がいました。\
        図表の上で誰も描いていない唯一のfigureで、誰かが描いた四体の隣に立つと、それが\
        見て取れました。男の子や女の子より小さい人には、どちらかを実際の身長に合わせて\
        ください。比較を担っているのは目盛りで、それは正しく出ます。"""

[[faq]]
q = "一つの図表に何人まで載せられますか？"
a = """
        12人です。技術的な限界ではなく——描画は30人でも喜んでこなします——ただ、\
        1ダースを超えると列が上に書かれた名前より狭くなり、絵が読めなくなります。もっと必要\
        なら、名前を消せば幅が戻りますし、二枚に分けたほうが一枚より伝わります。"""

[[faq]]
q = "ものを図表に置けますか？"
a = """
        置けます。しかも大半は絵付きで届きます。メニューには出発点として二十点が四つの組に入っています。ドアと窓、学校とオフィス（ホワイトボード、机、書類キャビネット、プロジェクタースクリーン）、街のもの（自動販売機、キャスター付きごみ箱、バスケットゴール、20フィートの海上コンテナ）、そして家のもの。そのうち十七点には絵が付いています——取っ手のあるドア、上に冷凍室のある冷蔵庫、見ればソファと分かるソファ——絵は行の高さと幅に合わせて収められるので、大きさを決めるのは相変わらず数字で、その上から打ち込んだご自分の数字も相変わらず効きます。残りの三点はただの長方形です。正しく、かつ比率も正しい自由な絵が見つからなかったからで、大きさを扱う図表では、間違った絵より正直な四角のほうがましだからです。
        <br><br>
        本当の規格もあれば典型的な寸法もあり、ページはそれを声に出して言います。見慣れたもの一つは、人を何人増やすよりも図表のためになります。比較を、大きさの実感に変えてくれるからです。"""

[[faq]]
q = "犬や猫の図はありますか？"
a = """
        ありません。見落としではなく、意図した欠けです。どちらも作ってはみました——横向き、\
        立った姿勢で、頭を肩の高さに合わせ、絵の上端が隣に書かれた身長になるように。どの犬種\
        標準も動物をそこで測るからです。ただ、出せるほどの出来にはなりませんでした。正面を\
        向いた四人の隣に横から見た四足動物が立っていると、絵がよくても間違いに見えてしまい\
        ます。当面は、その動物の肩の高さの長方形が正直なところです。"""

[[faq]]
q = "図表をリンクで共有できますか？"
a = """
        ここからはできません。これも意図したことです。それを提供する道具は、一覧まるごとを\
        アドレスに入れることで実現しています。つまり、あらゆる名前と身長が、そのリンクが旅する\
        先すべてに残ります。チャットサーバーのログ、メールの検査装置、誰かの閲覧履歴、リンク\
        プレビューを取りに行くサービス。絵をダウンロードして、そちらを送ってください。同じことを\
        伝えますし、一覧は持って行きません。"""

[[faq]]
q = "無料ですか。図表を商用に使えますか？"
a = """
        無料で、アカウントも透かしもなく、結果を報告書やプレゼン、広告や製品に入れて構いません。\
        このサイトには広告があり、それが費用をまかなっています。ここで作った図表について、私たちの\
        ものは何一つなく、何も保存されません。"""

[[faq]]
q = "目盛りが1ではなく10刻みなのはなぜですか？"
a = """
        間隔が、決まった数ではなく、その絵が何本の線を支えられるかから選ばれるからです。大人\
        二人の図表なら10センチごとに1本、そこにバスケットゴールを置けば線は25センチに移ります。\
        一枚に90本の線は、目盛りではなく灰色のにじみだからです。フィートとインチでは1・3・6・12\
        インチの段階なので、線は中途半端なところではなく丸いインチに載ります。"""

[[faq]]
q = "図表を暗いスライドに置けますか？"
a = """
        置けます。背景を、載せる先の色に設定すれば、目盛りと文字がそれに合わせて濃くも淡くも\
        切り替わります——当て推量ではなく、その色の輝度から計算しています。そのうえで絵自体を\
        透明にしたければ「背景をまったく付けない」にチェックを入れてください。インクを決めるのは\
        選んだ色のままなので、濃紺のスライドに向かう透明な図表は、その上で読めるように出てきます。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んだあとインターネットを切っても、そのまま使えます。これは\
        何もアップロードされていないことを示す一番簡単な方法でもあります。図表を描いてもらうために\
        一覧を送り出す道具なら、線を抜いた瞬間に止まってしまうはずです。"""

