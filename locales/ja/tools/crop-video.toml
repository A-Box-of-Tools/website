[[privacy]]
title = "動画には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 このツールにはネットワーク機能が\
      一切ありません。貼り付けるアドレスも、ダウンロードするものも、初回に取りに行く\
      エンジンもありません。あなたの動画に触れるコードは、1バイト残らずページを\
      読み込んだときにこのオリジンから届いたものです。"""

[[privacy]]
title = "読み込みも書き出しもローカルです。"
body = """
 フレームはあなた自身のブラウザの
      WebCodecs を通るか、そうでなければ、そもそもその映像を再生するのに使われる\
      のと同じ再生エンジンを通ります。できあがったファイルはこの端末のメモリ上で\
      組み立てられ、そのままダウンロードへ渡されます。"""

[[privacy]]
title = "音声は複製されるだけで、聴かれてはいません。"
body = """
 MP4の経路では、音声の\
      サンプルは一度も復号されずにそのまま移されます &mdash; ここには\
      それを音に戻すものが存在せず、仮に戻したとしてもどこかへ渡すものが\
      ありません。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から来ています。そのどちらにも、あなたの動画に関する\
      情報は渡されません。ファイルも、フレームも、名前も、サイズも、長さも、\
      切り抜いた形もです。読み込み、復号、切り抜き、書き出しを行うコードはすべて\
      このオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むもの、そして渡されないもの。"
body = """

      ヘッダーの「Buy me a coffee」ボタンは cdnjs.buymeacoffee.com の\
      スクリプトが描き、書体を Google Fonts から取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、あなたや動画に関する情報も\
      渡されません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切っても、このページの機能はすべて\
      そのまま動きます。これがいちばん単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
 MP4、MOV、M4V、WebM を選択欄に\
      ドロップするか、手で選んでください。ブラウザがディスクから直接読み出します。\
      その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "残したいところに枠をドラッグします。"
body = """
 枠の内側をドラッグ\
      すれば移動、四隅をつかめば大きさが変わります。先に形を固定することも\
      できます &mdash; 正方形の投稿なら1:1、スマホなら9:16、横長の画面なら
      16:9 &mdash; あるいは下の4つの欄にピクセル数を直接打ち込めます。"""

[[howto]]
title = "画質にどこまで費やすかを決めます。"
body = """
 切り抜いたフレームは\
      別の絵なので、映像はもう一度書き出す必要があります。「バランス」は、元の\
      ファイルがその範囲に費やしていた量に近づけます。「最高画質」はもっと\
      費やします。音声は、外さない限りそのまま残ります。"""

[[howto]]
title = "切り抜いてダウンロードします。"
body = """
 処理はあなた自身のハードウェアで\
      起きるので、かかる時間は順番待ちではなく端末の性能次第です。できあがった\
      動画は、そのままブラウザのダウンロードへ渡されます。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        されません。読み込みも復号も切り抜きも書き出しも、あなた自身のブラウザが\
        あなた自身のハードウェア上で行います。このツールにサーバー側は存在せず、\
        ページの <code>Content-Security-Policy</code> は接続してよいアドレスを\
        すべて挙げていますが &mdash; そのどれも当サイトのものではありません。\
        言われるより確かめたい方は、回線を抜いてから切り抜いてみてください。"""

[[faq]]
q = "どの動画形式を切り抜けますか？"
a = """
        MP4、M4V、MOV は中身が何であれ直接読みます。H.264、HEVC、AV1、VP9 の\
        いずれも、ブラウザがそのコーデックを復号できる限り扱えます。それ以外で\
        ブラウザが再生できるもの &mdash; いちばん多いのは WebM です &mdash;
        は、再生しながら録画する方法で切り抜きます。これでも動きますが、映像の\
        長さと同じだけ時間がかかります。ブラウザが読むことも再生することも\
        できないファイル、実際には AVI、WMV、FLV、そして大半の MKV は、途中で\
        失敗するのではなく、その旨のメッセージを出して断ります。"""

[[faq]]
q = "動画のサイズや長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。ファイルを一度にメモリへ読み込む\
        こともなく &mdash; 数メガバイトずつ辿っていきます。現実的な上限は、\
        ダウンロード前にメモリ上で組み立てられる完成後の動画と、それを書き出す\
        のに端末がかける時間です。"""

[[faq]]
q = "音声は残りますか？"
a = """
        MP4の経路では、そのまま残ります。音声は一度も復号されずにサンプル単位で\
        複製されるので、ファイルの中にあったものと1バイトも違いません。録画の\
        経路では再生から取り込んで書き出し直すので、少しだけ画質ならぬ音質を\
        費やします。どちらの場合も、音声を丸ごと外すチェックボックスがあります。"""

[[faq]]
q = "切り抜くと画質は落ちますか？"
a = """
        映像はもう一度書き出されます。切り抜いたフレームは別の絵で、ピクセルを\
        書き直さずに保存する方法がないからです。ただしこのツールは、同じ範囲に\
        元のファイルが費やしていた以上を費やしません。それを超えて書き出しても、\
        見た目は良くならずファイルが大きくなるだけだからです。"""

[[faq]]
q = "長さも切り詰められますか？"
a = """
        ここではできませんが、隣でできます。このツールは映像の形だけを変え、\
        ほかは何も変えません。出てくる映像は入れたものとまったく同じ長さで、\
        タイミングも音声もそのままです。長さを切り詰めるのは別の仕事で、別の\
        ツールがあります &mdash;
        <a href="../trim-video/">動画カットツール</a>
        は、残す価値のある部分に印を付けて1つのファイルとして保存します。\
        フレームを書き出し直すことはありません。"""

[[faq]]
q = "幅と高さが2ずつしか動かないのはなぜですか？"
a = """
        MP4の中身であるコーデック H.264 は映像をブロック単位で保持していて、\
        一辺が奇数ピクセルのフレームを記述する方法を持っていません。あなたが\
        決めたあとで黙って丸めるのではなく、そもそも枠が偶数しか出さないように\
        してあります。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        動画に関する情報が渡されることはありません。"""

[schema]
browser_requirements = "JavaScript が必要です。MP4 での書き出しには WebCodecs 対応のブラウザが必要で、それ以外では WebM への録画に切り替わります。"
description = "動画をブラウザ内で好きな形やピクセル指定の枠に切り抜きます。MP4・MOV・M4V はフレームごとに読み込んで書き出し直し、元の音声は手を加えずに引き継ぎます。それ以外でブラウザが再生できるものは、録画によって切り抜きます。アップロードは一切ありません。"
features = [
  "MP4、MOV、M4V、WebM の動画を切り抜きます",
  "H.264、HEVC、AV1、VP9 の映像を WebCodecs で復号します",
  "自由な形、比率の固定（1:1、4:5、9:16、16:9、4:3、3:2）、ピクセル指定の枠に対応",
  "元の音声を、書き出し直さずにそのまま保ちます",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます &mdash; MP4、MOV、M4V、WebM、その他このブラウザが再生できるもの"
