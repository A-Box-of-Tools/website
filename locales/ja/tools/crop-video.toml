#
# 動画の切り抜き - Japanese.
#
# Overrides for tools/crop-video/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# トリミング is the word Japanese video and photo UI uses for cropping a frame;
# カット is reserved for shortening a clip, which is the trim-video tool.
#

name = "動画トリミングツール"
# 後半の span が検索される語です。
heading = "動画トリミング<span class=\"h1-kw\">｜動画を好きな形に切り抜く</span>"
tagline = "肝心なところだけを残します。"

title = "動画をオンラインで切り抜き｜無料・アップロード不要・オフライン対応"
description = "MP4・MOV・WebMを正方形、9:16、ピクセル指定など好きな形に切り抜きます。処理はブラウザの中だけ。アップロードなし、音声はそのまま、オフラインでも動きます。"
og_title = "動画トリミング｜アップロードせずに切り抜く"
og_description = "映像の上に枠をドラッグして、好きな形に切り抜きます。フレームのデコードもエンコードも手元の端末で行い、元の音声は手を加えずに引き継ぎます。"
og_image_alt = "動画トリミング - ブラウザ内で切り抜き、何もアップロードしません"

pledge = """
    すべてのフレームを読み込み、切り抜き、エンコードするのは、お使いの\
    ブラウザと手元のハードウェアです。何かを取りに行ったり送ったりできる\
    部分はここにありません。このツールにはネットワーク機能が一切なく、\
    仮にあったとしても、このページの向こう側に動画を受け取るサーバーが\
    存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      映像を切り抜いてみてください。フレームもファイル名も、選んだファイルの\
      1バイトも、どのリクエストにも載りません。回線を抜いてから切り抜いてみるの\
      でも構いません。処理のために動画をどこかへ送っている道具なら、そこで\
      止まります。"""

read_first = """
、MP4の中からフレームを見つけ出す読み取り側については\
      <code>src/demux.js</code>、それをデコードし、切り抜き、エンコードする\
      ループについては<code>src/transcode.js</code>です。どちらもリクエストを\
      出せるものを読み込んでいません。"""

howto_heading = "動画を切り抜く手順"

card = """
            映像の上に枠をドラッグして、その形に切り落とします。フィード用に\
            正方形、スマホ用に縦長、ピクセル指定でもかまいません。"""

[words]
plural = "動画"
choose = "動画"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "透かしなし"

[[facts]]
text = "音声はそのまま"

[[facts]]
text = "オフラインで動作"

[[privacy]]
title = "動画には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
このツールにはネットワーク機能が一切ありません。貼り付けるアドレスも、\
      ダウンロードするものも、初回に取りに行くエンジンもありません。動画に触れる\
      コードは、1バイト残らずページを読み込んだときにこのオリジンから届いた\
      ものです。"""

[[privacy]]
title = "デコードもエンコードも手元で行います。"
body = """
フレームが通るのは、お使いのブラウザのWebCodecsか、そうでなければ、\
      そもそもその映像を再生するのに使われるのと同じ再生エンジンです。できあがった\
      ファイルはこの端末のメモリ上で組み立て、そのままダウンロードへ渡します。"""

[[privacy]]
title = "音声は複製するだけで、聴いてはいません。"
body = """
MP4の経路では、音声のサンプルを一度もデコードせずにそのまま移します。\
      ここにはそれを音に戻すものが存在せず、仮に戻したとしてもどこかへ渡す\
      ものがありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、動画に関する\
      情報は渡されません。ファイルも、フレームも、名前も、サイズも、長さも、\
      切り抜いた形もです。読み込み、デコード、切り抜き、エンコードを行うコードは\
      すべてこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者や動画に関する情報も\
      渡されません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
MP4、MOV、M4V、WebMを選択欄にドロップするか、手で選んでください。\
      ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られる\
      ことはありません。"""

[[howto]]
title = "残したいところに枠をドラッグします。"
body = """
枠の内側をドラッグすれば移動、四隅をつかめば大きさが変わります。先に形を\
      固定することもできます。正方形の投稿なら1:1、スマホなら9:16、横長の画面\
      なら16:9。下の4つの欄にピクセル数を直接打ち込むこともできます。"""

[[howto]]
title = "画質にどこまで費やすかを決めます。"
body = """
切り抜いたフレームは別の絵なので、映像はもう一度エンコードし直す必要が\
      あります。「バランス」は、元のファイルがその範囲に費やしていた量に\
      近づけます。「最高画質」はもっと費やします。音声は、外さない限りそのまま\
      残ります。"""

[[howto]]
title = "切り抜いてダウンロードします。"
body = """
処理は手元のハードウェアで起きるので、かかる時間は順番待ちではなく端末の\
      性能次第です。できあがった動画は、そのままブラウザのダウンロードへ\
      渡します。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        されません。読み込みもデコードも切り抜きもエンコードも、お使いの\
        ブラウザが手元のハードウェア上で行います。このツールにサーバー側は\
        存在しません。ページの<code>Content-Security-Policy</code>には接続\
        してよいアドレスがすべて挙がっていますが、そのどれも当サイトのものでは\
        ありません。言われるより確かめたい方は、回線を抜いてから切り抜いて\
        みてください。"""

[[faq]]
q = "どの動画形式を切り抜けますか？"
a = """
        MP4、M4V、MOVは中身が何であれ直接読みます。H.264、HEVC、AV1、VP9の\
        いずれも、ブラウザがそのコーデックをデコードできる限り扱えます。それ以外で\
        ブラウザが再生できるもの、いちばん多いのはWebMですが、それらは再生しながら\
        録画する方法で切り抜きます。これでも動きますが、映像の長さと同じだけ時間が\
        かかります。ブラウザが読むことも再生することもできないファイル、実際には\
        AVI、WMV、FLV、そして大半のMKVは、途中で失敗するのではなく、その旨の\
        メッセージを出して断ります。"""

[[faq]]
q = "動画のサイズや長さに制限はありますか？"
a = """
        ツールに組み込まれた制限はありません。ファイルを一度にメモリへ読み込む\
        こともなく、数メガバイトずつ辿っていきます。現実的な上限になるのは、\
        ダウンロード前にメモリ上で組み立てる完成後の動画と、それをエンコードする\
        のに端末がかける時間です。"""

[[faq]]
q = "音声は残りますか？"
a = """
        MP4の経路では、そのまま残ります。音声は一度もデコードせずにサンプル単位で\
        複製するので、ファイルの中にあったものと1バイトも違いません。録画の経路では\
        再生から取り込んでエンコードし直すので、音質を少しだけ費やします。どちらの\
        場合も、音声を丸ごと外すチェックボックスがあります。"""

[[faq]]
q = "切り抜くと画質は落ちますか？"
a = """
        映像はもう一度エンコードされます。切り抜いたフレームは別の絵で、ピクセルを\
        書き直さずに保存する方法がないからです。ただしこのツールは、同じ範囲に元の\
        ファイルが費やしていた以上を費やしません。それを超えてエンコードしても、\
        見た目は良くならず、ファイルが大きくなるだけだからです。"""

[[faq]]
q = "長さも切り詰められますか？"
a = """
        ここではできませんが、隣でできます。このツールは映像の形だけを変え、ほかは\
        何も変えません。出てくる映像は入れたものとまったく同じ長さで、タイミングも\
        音声もそのままです。長さを切り詰めるのは別の仕事なので、別のツールに\
        なっています。<a href="../trim-video/">動画カットツール</a>は、残す価値の\
        ある部分に印を付けて1つのファイルとして保存します。フレームをエンコード\
        し直すことはありません。"""

[[faq]]
q = "幅と高さが2ずつしか動かないのはなぜですか？"
a = """
        MP4の中身であるコーデックH.264は映像をブロック単位で保持していて、一辺が\
        奇数ピクセルのフレームを記述する方法を持っていません。指定したあとで黙って\
        丸めるのではなく、そもそも枠が偶数しか出さないようにしてあります。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に動画の情報が渡される\
        ことはありません。"""

[schema]
browser_requirements = "JavaScriptが必要です。MP4での書き出しにはWebCodecs対応のブラウザが必要で、それ以外ではWebMへの録画に切り替わります。"
description = "動画をブラウザの中で、好きな形やピクセル指定の枠に切り抜きます。MP4・MOV・M4Vはフレームごとにデコードしてエンコードし直し、元の音声は手を加えずに引き継ぎます。それ以外でブラウザが再生できるものは、録画によって切り抜きます。アップロードは一切ありません。"
features = [
  "MP4、MOV、M4V、WebMの動画を切り抜きます",
  "H.264、HEVC、AV1、VP9の映像をWebCodecsでデコードします",
  "自由な形、比率の固定（1:1、4:5、9:16、16:9、4:3、3:2）、ピクセル指定の枠に対応",
  "元の音声を、エンコードし直さずにそのまま保ちます",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

[picker]
title = "ここに動画をドロップ"
hint = "クリックして選ぶこともできます。MP4、MOV、M4V、WebM、その他このブラウザが再生できるものに対応"
