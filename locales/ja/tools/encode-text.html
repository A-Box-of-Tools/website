<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> エンコードを選ぶ</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">エンコード方式</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>どちら向きか</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>エンコード</strong> 平文を入れて、符号化して出します。</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>デコード</strong> 符号化されたものを入れて、平文で出します。</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> 貼り付ける</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">あなたのテキスト</label>
          <span class="count" id="input-count">空</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="エンコードするテキストか、デコードするBase64をここに貼り付け - または上にファイルをドロップ。"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">例を試す</button>
        <button type="button" id="clear" class="ghost danger">消去</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> 結果を持ち出す</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">まだ何もありません。</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>コピー</button>
        <a id="download" class="ghost as-button" hidden download>ダウンロード</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
