[[privacy]]
title = "あなたの図版には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 <code>src/</code> の\
      どこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。描画処理の全体は、あなた自身の\
      ファイルの blob を抱えた <code>&lt;img&gt;</code>、キャンバスへの
      <code>drawImage</code> ひとつ、そして <code>canvas.toBlob</code> ひとつ\
      です。"""

[[privacy]]
title = "SVG は文書であり、これはそれが何もできないモードです。"
body = """
 SVG は
      <code>&lt;script&gt;</code>、外部の
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>、\
      スタイルシート、ウェブフォントを抱えられます。<code>&lt;img&gt;</code> を\
      通して描かれると、仕様が <em>secure static mode</em> と呼ぶ状態に入ります。\
      スクリプトは走らず、それらのアドレスはひとつも取得されません。これは私たちの\
      約束ではなくブラウザの保証であり、このページが見たこともないファイルを、\
      そのファイルに外部へ連絡させることなく開ける理由です。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたの図版に関する情報は渡されません。ファイルを読み、\
      サイズを決め、描くコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切ってもこのツールは何も変わりません。\
      もともと通信する段階が存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "SVG を選びます。"
body = """
 選択欄にドロップするか、フォルダーごと選んで\
      まとめて変換してください。ブラウザがディスクから直接読み出します。その間に\
      何かがどこかへ送られることはありません。各行には、そのファイルが自分を何\
      ピクセルだと思っているかが表示されます &mdash; そのサイズが
      <code>viewBox</code> から来た場合や、ファイルが何も宣言していないので\
      仮定した場合には、そう書き分けます。"""

[[howto]]
title = "大きさを指定します。"
body = """
 ファイル自身のサイズに対する倍率が\
      いちばん手早く、まとめて処理する場合の正解です。どの図もそれぞれの出発点から\
      拡大されるので、アイコン一式なら比率が保たれます。そうでなければ、幅、高さ、\
      長辺、あるいは両辺を指定した枠で決めてください。ここでは大きな数値を指定しても、\
      写真のような代償はありません &mdash; 図はその大きさで描き直されるのであって、\
      引き伸ばされるのではないからです。"""

[[howto]]
title = "必要なら高DPI用の複製も作ります。"
body = """
 スマホや Retina のノートPCは、
      CSS の1ピクセルに対して2から3の実ピクセルを描くので、200ピクセルのロゴには
      400または600ピクセルのファイルが必要です。<code>@2x</code> と
      <code>@3x</code> を指定すれば、Xcode も Android のツールも CSS の
      <code>image-set()</code> も期待する名前で出てきます。しかもそれぞれ、別々に\
      丸められるのではなく、最初のものの正確に2倍・3倍です。"""

[[howto]]
title = "形式を選び、透過をどうするか決めます。"
body = """
 理由がなければ PNG です。\
      可逆で、透過を保ち、平坦な色がよく圧縮されます。JPEG には透過がまったく\
      ないので、選んでも選ばなくても背景色が塗られます &mdash; それがなければ\
      透過だったピクセルはすべて黒くなります。WebP は両方に対応し、ファイルも\
      小さくなりますが、それを読めないほど古いソフトが代償です。"""

[[howto]]
title = "ダウンロードの前にプレビューを見てください。"
body = """
 プレビューは、ファイルを書き出すのと\
      同じコードが、あなたのファイルから、あなたの端末で描いたものです。図がピクセルに\
      なるときに変わるものは2つあり、どちらもここに現れます。幅が半ピクセルだった\
      髪の毛のような線は灰色になり、文字はウェブから取ってきたのではなく、この\
      コンピューターにあるフォントで描かれます。"""

[[howto]]
title = "ファイルを受け取ります。"
body = """
 1ファイルにつき1つのダウンロード、\
      またはまとめて1つの zip です。名前は元の SVG に従い、複製には
      <code>@2x</code> や <code>@3x</code> が付きます。同じ名前になってしまう
      2つのファイルは、一方が黙って他方を置き換えるのではなく、番号が付きます。"""

[[faq]]
q = "SVG はどこかにアップロードされますか？"
a = """
        されません。ファイルはあなた自身のブラウザがあなた自身のハードウェア上で\
        読み、あなたが見ているほかのすべての画像を描くのと同じエンジンがキャンバスに\
        描き、そのままダウンロードとして返します。このツールにはネットワーク機能が\
        一切なく &mdash; 何も取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "SVG はどの大きさで書き出すべきですか？"
a = """
        それを読む相手が求める値に、表示される画面のデバイスピクセル比を掛けた\
        ものです。CSS で200ピクセルを占めるロゴなら、Retina のノートPCには400、\
        最近のスマホには600が必要で、それがここでいう <code>@2x</code> と
        <code>@3x</code> です。アプリのアイコンやストアの掲載画像なら、ストアが\
        正確な数値を指定しており、それがその数値です。何も指定されていない場合は、\
        長辺1024が便利な初期値です。たいていの用途に十分大きく、メールで送れる\
        程度には小さいからです。"""

[[faq]]
q = "大きくすると画質は落ちますか？"
a = """
        落ちません。そしてここは、その答えが正直に「落ちません」になる唯一の場所\
        です。ベクターはピクセルではなく指示なので、ブラウザは求められた大きさで\
        曲線を描き直します。24ピクセルのアイコンから作った4000ピクセルは、24の\
        ときとまったく同じだけ鮮明です。できないのは逆向きです。いったん PNG に\
        なればほかと同じくピクセルなので、あとから結果をリサイズするのではなく、\
        必要な大きさで書き出してください。"""

[[faq]]
q = "SVG に width も height もありません。どの大きさになりますか？"
a = """
        <code>viewBox</code> があれば、それです &mdash; その幅と高さはピクセル\
        ではなくユーザー単位ですが、ファイルの中にある唯一の数値であり、ブラウザは\
        それを図の自然な大きさとして扱います。viewBox もない場合は、行の横に
        <em>仮定</em> と表示し、300&nbsp;&times;&nbsp;150 を使います。
        <code>&lt;img&gt;</code> が描いたであろう大きさです。いずれの場合も、\
        ほしい大きさを指定すれば、その大きさで描かれます。"""

[[faq]]
q = "PNG にすると文字の見た目が変わるのはなぜですか？"
a = """
        フォントが SVG の中にないからです。文字を描く SVG はフォント名を指定し、\
        探すのは端末に任せます。<code>@import</code> で Google Fonts から取って\
        くるファイルは、ここでは何も得られません。<code>&lt;img&gt;</code> を\
        通して描かれる SVG は何も取りに行くことを許されないからです。これは、その\
        ファイルがあなたの情報を外部へ送ることを止めているのと同じ規則です。直し方は\
        どのデザイナーもすでに知っているもので &mdash; 書き出す前に、作図ソフトで\
        文字をパスに変換することです。そうすれば図形になり、どこでも同じに見えます。"""

[[faq]]
q = "複数のファイルを一度に変換できますか？"
a = """
        できます。リスト上のどの SVG も同じ設定で描かれ、まとめて1つの zip で\
        届きます。まとめて処理する場合は、たいてい倍率 &mdash;「ファイルが求める\
        サイズの4倍」&mdash; が正しい設定です。すべてを同じピクセル数に押し込める\
        のではなく、それぞれが自分のサイズから拡大されるからです。行をクリック\
        すれば、その1つをプレビューに出せます。"""

[[faq]]
q = "サイズの上限はありますか？"
a = """
        私たちのではなく、ブラウザの上限があります。キャンバスは一辺16,384ピクセルを\
        少し超えたあたりで音を上げ、iPhone や iPad の Safari は面積およそ1670万\
        ピクセル &mdash; 4096&nbsp;&times;&nbsp;4096 &mdash; で止まります。それを\
        超えると、真っ白な画像を返すのではなく警告します。ブラウザは行き詰まると
        <code>toBlob</code> が何も返さず、しかも説明するエラーも出さないからです。
        1億ピクセルを超えると、このツールは拒みます。1バイトも書き出さないうちに、\
        キャンバスだけで400&nbsp;MB になるからです。"""

[[faq]]
q = "透過はどうなりますか？"
a = """
        PNG と WebP では保たれます。JPEG にはアルファチャンネルがまったくないので、\
        頼んでも頼まなくても画像全体の後ろに色が塗られます &mdash; それがなければ\
        透過部分がすべて黒くなり、JPEG の仕様ではなく不具合のように見えるからです。
        PNG で背景色を指定するのも、まったくふつうの要望です。図をその色に合成して、\
        穴を残さないようにします。"""

[[faq]]
q = "スクリプトや外部画像を含む SVG も読めますか？"
a = """
        読めますし、ブラウザが描く気のある部分だけを正確に描きます。
        <code>&lt;img&gt;</code> から読み込まれた SVG は <em>secure static mode</em>
        にあります。スクリプトは走らず、外部参照は取得されず、アニメーションも\
        再生されません &mdash; 得られるのは最初のフレームです。ですから外部の
        <code>&lt;image&gt;</code> を含むファイルは、その部分が欠けた状態で出てきます。\
        それはブラウザがあなたに代わって拒んでいるということであり、このページが\
        見たこともないファイルを安全に開ける理由です。"""

[[faq]]
q = "画像リサイズツールとは何が違いますか？"
a = """
        出発点です。画像リサイズツールはピクセルから始まるので &mdash; JPEG や
        PNG です &mdash; 大きくするには、そもそもなかった細部を発明しなければ\
        なりません。こちらは図から始まるので、発明するものがなく、気にすべき上限も\
        ありません。手元にあるのが SVG ならこちらが鮮明な結果をくれますし、写真なら\
        あちらです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在しないからです &mdash; 処理はあなた自身の端末で起きています。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        ファイルに関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。描画のために図版をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

