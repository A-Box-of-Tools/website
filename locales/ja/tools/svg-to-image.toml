[[privacy]]
title = "図版には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありません。描画処理の全体は、選んだファイルのblobを\
      抱えた<code>&lt;img&gt;</code>、キャンバスへの<code>drawImage</code>ひとつ、\
      そして<code>canvas.toBlob</code>ひとつです。"""

[[privacy]]
title = "SVGは文書であり、これはそれが何もできないモードです。"
body = """
SVGは<code>&lt;script&gt;</code>、外部の\
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>、スタイルシート、\
      ウェブフォントを抱えられます。<code>&lt;img&gt;</code>を通して描かれると、\
      仕様が<em>secure static mode</em>と呼ぶ状態に入り、スクリプトは走らず、それらの\
      アドレスはひとつも取得されません。これは当サイトの約束ではなくブラウザの保証で、\
      このページが見たこともないファイルを、そのファイルに外部へ連絡させることなく\
      開ける理由です。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、図版に関する情報は渡されません。ファイルを読み、サイズを\
      決め、描くコードはすべてこのオリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "SVGを選びます。"
body = """
選択欄にドロップするか、フォルダごと選んでまとめて変換してください。\
      ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られること\
      はありません。各行には、そのファイルが自分を何ピクセルだと思っているのかが\
      表示されます。そのサイズが<code>viewBox</code>から来た場合や、ファイルが何も\
      宣言していないので仮定した場合には、そう書き分けます。"""

[[howto]]
title = "大きさを指定します。"
body = """
ファイル自身のサイズに対する倍率がいちばん手早く、まとめて処理する場合の\
      正解です。どの図もそれぞれの出発点から拡大されるので、アイコン一式なら比率が\
      保たれます。そうでなければ、幅、高さ、長辺、あるいは両辺を指定した枠で決めて\
      ください。ここでは大きな数値を指定しても、写真のような代償はありません。図は\
      その大きさで描き直されるのであって、引き伸ばされるのではないからです。"""

[[howto]]
title = "必要なら高DPI用の複製も作ります。"
body = """
スマホやRetinaのノートPCは、CSSの1ピクセルに対して2から3の実ピクセルを描く\
      ので、200ピクセルのロゴには400または600ピクセルのファイルが必要です。\
      <code>@2x</code>と<code>@3x</code>を指定すれば、XcodeもAndroidのツールもCSSの\
      <code>image-set()</code>も期待する名前で出てきます。しかもそれぞれ、別々に\
      丸められるのではなく、最初のものの正確に2倍・3倍です。"""

[[howto]]
title = "形式を選び、透過をどうするかを決めます。"
body = """
理由がなければPNGです。可逆で、透過を保ち、平坦な色がよく圧縮されます。\
      JPEGには透過がまったくないので、選んでも選ばなくても背景色が塗られます。それが\
      なければ、透過だったピクセルはすべて黒くなってしまいます。WebPは両方に対応し、\
      ファイルも小さくなりますが、それを読めないほど古いソフトが代償です。"""

[[howto]]
title = "ダウンロードの前にプレビューを見てください。"
body = """
プレビューは、ファイルを書き出すのと同じコードが、同じファイルから、手元の\
      端末で描いたものです。図がピクセルになるときに変わるものは2つあり、どちらも\
      ここに現れます。幅が半ピクセルだった髪の毛のような線は灰色になり、文字はウェブ\
      から取ってきたのではなく、このコンピューターにあるフォントで描かれます。"""

[[howto]]
title = "ファイルを受け取ります。"
body = """
1ファイルにつき1つのダウンロード、またはまとめて1つのzipです。名前は元の\
      SVGに従い、複製には<code>@2x</code>や<code>@3x</code>が付きます。同じ名前に\
      なってしまう2つのファイルは、一方が黙って他方を置き換えるのではなく、番号が\
      付きます。"""

[[faq]]
q = "SVGはどこかにアップロードされますか？"
a = """
        されません。ファイルを読むのはお使いのブラウザで、読む場所は手元の\
        ハードウェアの上です。ほかのすべての画像を描くのと同じエンジンがキャンバスに\
        描き、そのままダウンロードとして返します。このツールにはネットワーク機能が\
        一切なく、何も取りに行かず、何も送りません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "SVGはどの大きさで書き出すべきですか？"
a = """
        それを読む相手が求める値に、表示される画面のデバイスピクセル比を掛けたもの\
        です。CSSで200ピクセルを占めるロゴなら、RetinaのノートPCには400、最近の\
        スマホには600が必要で、それがここでいう<code>@2x</code>と<code>@3x</code>\
        です。アプリのアイコンやストアの掲載画像なら、ストアが正確な数値を指定して\
        おり、それがその数値です。何も指定されていない場合は、長辺1024が便利な初期値\
        です。たいていの用途に十分大きく、メールで送れる程度には小さいからです。"""

[[faq]]
q = "大きくすると画質は落ちますか？"
a = """
        落ちません。そしてここは、その答えが正直に「落ちません」になる唯一の場所です。\
        ベクターはピクセルではなく指示なので、ブラウザは求められた大きさで曲線を描き\
        直します。24ピクセルのアイコンから作った4000ピクセルは、24のときとまったく\
        同じだけ鮮明です。できないのは逆向きです。いったんPNGになればほかと同じく\
        ピクセルなので、あとから結果をリサイズするのではなく、必要な大きさで書き出して\
        ください。"""

[[faq]]
q = "SVGにwidthもheightもありません。どの大きさになりますか？"
a = """
        <code>viewBox</code>があれば、それです。その幅と高さはピクセルではなくユーザー\
        単位ですが、ファイルの中にある唯一の数値であり、ブラウザはそれを図の自然な\
        大きさとして扱います。viewBoxもない場合は、行の横に<em>仮定</em>と表示し、\
        300&nbsp;&times;&nbsp;150を使います。<code>&lt;img&gt;</code>が描いたであろう\
        大きさです。いずれの場合も、ほしい大きさを指定すれば、その大きさで描かれます。"""

[[faq]]
q = "PNGにすると文字の見た目が変わるのはなぜですか？"
a = """
        フォントがSVGの中にないからです。文字を描くSVGはフォント名を指定し、探すのは\
        端末に任せます。<code>@import</code>でGoogle Fontsから取ってくるファイルは、\
        ここでは何も得られません。<code>&lt;img&gt;</code>を通して描かれるSVGは、何も\
        取りに行くことを許されないからです。これは、そのファイルが手元の情報を外部へ\
        送ることを止めているのと同じ規則です。直し方はどのデザイナーもすでに知っている\
        もので、書き出す前に、作図ソフトで文字をパスに変換することです。そうすれば\
        図形になり、どこでも同じに見えます。"""

[[faq]]
q = "複数のファイルを一度に変換できますか？"
a = """
        できます。リスト上のどのSVGも同じ設定で描かれ、まとめて1つのzipで届きます。\
        まとめて処理する場合は、たいてい倍率、つまり「ファイルが求めるサイズの4倍」が\
        正しい設定です。すべてを同じピクセル数に押し込めるのではなく、それぞれが自分の\
        サイズから拡大されるからです。行をクリックすれば、その1つをプレビューに\
        出せます。"""

[[faq]]
q = "サイズの上限はありますか？"
a = """
        当サイトのではなく、ブラウザの上限があります。キャンバスは一辺16,384ピクセルを\
        少し超えたあたりで音を上げ、iPhoneやiPadのSafariは面積およそ1670万ピクセル、\
        つまり4096&nbsp;&times;&nbsp;4096で止まります。それを超えると、真っ白な画像を\
        返すのではなく警告します。ブラウザは行き詰まると<code>toBlob</code>が何も返さず、\
        しかも説明するエラーも出さないからです。1億ピクセルを超えると、このツールは\
        拒みます。1バイトも書き出さないうちに、キャンバスだけで400&nbsp;MBになるから\
        です。"""

[[faq]]
q = "透過はどうなりますか？"
a = """
        PNGとWebPでは保たれます。JPEGにはアルファチャンネルがまったくないので、指示の\
        有無にかかわらず画像全体の後ろに色が塗られます。それがなければ透過部分がすべて\
        黒くなり、JPEGの仕様ではなく不具合のように見えるからです。PNGで背景色を指定\
        するのも、まったくふつうの要望です。図をその色に合成して、穴を残さないように\
        します。"""

[[faq]]
q = "スクリプトや外部画像を含むSVGも読めますか？"
a = """
        読めますし、ブラウザが描く気のある部分だけを正確に描きます。\
        <code>&lt;img&gt;</code>から読み込まれたSVGは<em>secure static mode</em>に\
        あります。スクリプトは走らず、外部参照は取得されず、アニメーションも再生され\
        ません。得られるのは最初のフレームです。ですから外部の\
        <code>&lt;image&gt;</code>を含むファイルは、その部分が欠けた状態で出てきます。\
        それはブラウザが代わりに拒んでいるということであり、このページが見たことも\
        ないファイルを安全に開ける理由です。"""

[[faq]]
q = "画像リサイズツールとは何が違いますか？"
a = """
        出発点です。画像リサイズツールはピクセル、つまりJPEGやPNGから始まるので、\
        大きくするにはそもそもなかった細部を発明しなければなりません。こちらは図から\
        始まるので、発明するものがなく、気にすべき上限もありません。手元にあるのが\
        SVGならこちらが鮮明な結果をくれますし、写真ならあちらです。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。ファイル\
        の数にもサイズにも制限はありません。その費用を払うサーバーが存在せず、処理が\
        手元の端末で起きているからです。このサイトには広告があり、それが費用を賄って\
        います。広告にファイルの情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。描画の\
        ために図版をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

