og_title = "写真から書類をスキャンする、アップロードせずに"
og_description = "紙の四隅を見つけ、傾きを戻し、むらのある明るさを割って取り除く。それがすべて手元のブラウザで起こります。人がこうして撮るのはパスポートや給与明細や契約書で、それこそアップロードすべきでないものです。"
og_image_alt = "書類スキャナー - 紙の写真を、まっすぐに整えて、アップロードせずに"

