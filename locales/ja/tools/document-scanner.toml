features = [
  "紙の四隅を、モデルなし・ダウンロードなし・取得なしで見つける",
  "紙の本当の形を遠近から復元し、斜めの写真が潰れて出ないようにする",
  "コントラストを上げるのではなく、むらのある明るさと影を割って取り除く",
  "白黒のページは1画素1ビットで保存し、それがスキャンをメールで送れる大きさにする",
  "複数の写真が1つのPDFのページになり、各ページが自分の四隅を持つ",
  "四隅はドラッグでも、キーボードで1画素ずつでも動かせる",
  "四隅が見つけたものではなく推測であるときはそう書く",
  "書類に日付も作成者も端末名も書かない",
  "オフラインで動作。アップロードもアカウントもなし",
]

[picker]
title = "ページの写真をここにドロップ"
hint = "またはクリックして選択｜1ページにつき写真1枚、ページの順に"
