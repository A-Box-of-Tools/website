      むらのある明るさを割って取り除く処理は<code>src/clean.js</code>です。"""

howto_heading = "スマホのカメラで書類をスキャンする方法"

card = """
            紙の写真を、まっすぐに整えて書類にします。四隅は自動で見つけ、傾きを\
            戻し、影は割って取り除きます。"""

[words]
plural = "書類"
choose = "紙の写真"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "アカウント不要"

[[facts]]
text = "透かしなし"

[[facts]]
text = "オフラインで動く"

[[facts]]
text = "オープンソース"

[[privacy]]
title = "書類には出ていく先がありません。"
body = """
 Content-Security-Policyには、この\
      ページが接続しうるアドレスがすべて書かれていて、そのどれもこのサイトのもの\
      ではありません。写真が集まりうるエンドポイントはここにはなく、あったとしても\
      送るコードがありません。"""

[[privacy]]
title = "モデルがないので、ダウンロードするものも問い合わせる先もありません。"
body = """
 紙の四隅を見つけるのは\
      計算です。画像の勾配、その中の直線への投票、そして勝った四角形の各辺の下に\
      実際に何があるかの確認です。重みも、推論ランタイムも、初回に取りに行くものも\
      なく、他人の書類で違う振る舞いをするものもありません。<code>src/detect.js</code>\
      を見てください。"""

[[privacy]]
title = "書類には日付も作成者も端末名も入りません。"
body = """
 スキャンは人が他人に送るもので、\
      たいていは役所に求められて送ります。PDFにページ以外で書かれるのはこの道具の\
      名前だけで、題名を入力すればそれが加わります。作成日も、作成者も、製造番号も\
      なく、時計やファイル名や端末から導いたものもありません。<code>src/document.js</code>\
      を見てください。"""

[[privacy]]
title = "ここでは何もどこからも取ってきません。"
body = """
 <code>src/</code>のどこにも\
      <code>fetch</code>も<code>XMLHttpRequest</code>も<code>sendBeacon</code>も\
      ありません。やっているのは<code>getImageData</code>と、バイト列を回るいくつかの\
      ループと、ブラウザ自身のJPEGエンコーダーだけで、どれもすでに端末に入っている\
      ものです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 回線を切っても道具は変わりません。もともと\
      ネットワークの段階がなかったからです。いちばん簡単な証拠であり、パスポートを\
      スキャンする前に一度試しておく価値のあることです。"""

[[howto]]
title = "紙を撮ります。"
body = """
 真上あたりから、紙全体が画面に入り、四隅が\
      見えているかほぼ見えている状態で撮ってください。正面である必要も、明るさが\
      そろっている必要もありません。傾きと影こそ、この道具がある理由です。大事なのは\
      画面を埋めることです。部屋の反対側から撮った紙には、取り戻せる細部が残って\
      いません。"""

[[howto]]
title = "四隅を確かめます。"
body = """
 写真を読んだ時点で自動的に見つけますし、\
      確信が持てないときはページがそう言います。紙と同じ色の机に置かれた紙は、実際に\
      縁がほとんど見えません。写真のどこかを押せばいちばん近い隅が指のところへ来ますし、\
      <kbd>Tab</kbd>で隅に移って矢印キーで動かすこともできます。"""

[[howto]]
title = "明るさをどうするか選びます。"
body = """
 「色つき、むらを取る」は紙の明るさを\
      ページ全体で測って割り、影が消えても印影や署名は色を保ちます。「白黒」はさらに\
      進み、スキャンをメールで送れる大きさにするのがまさにこれです。画面に出ているものが\
      本当の結果で、ファイルを書くのと同じコードが作っています。"""

[[howto]]
title = "残りのページを足します。"
body = """
 足した写真はそのまま同じ書類の次の\
      ページになり、順番は一覧に並んでいるとおりで、各ページは自分の四隅を保ちます。\
      帯のページに付いた矢印がそれを前後に動かします。"""

[[howto]]
title = "PDFを保存し、送る前に開いて確かめます。"
body = """
 書類はここ、この\
      ページのメモリの中で作られます。作るために何もアップロードされていませんし、\
      それについてどこかに報告されたこともありません。"""

[[faq]]
q = "書類はどこかへアップロードされますか。"
a = """
        いいえ。写真のデコード、まっすぐにすること、整えること、PDFへ書き出すことは、\
        すべて手元のブラウザが手元のハードウェアで行います。この道具にはネットワーク\
        機能がそもそもなく、何かを取りに行くことも送ることもありません。ページの\
        <code>Content-Security-Policy</code>には接続しうるアドレスがすべて書かれて\
        いますが、そのどれもこのサイトのものではありません。ページを一度読み込んで\
        回線を切っても、そのまま動きます。"""

[[faq]]
q = "モデルなしでどうやって紙の四隅を見つけているのですか。"
a = """
        四角形を作る4本の長い直線の縁を探しています。写真を縮め、勾配を取り、つまり画像が\
        どこでどちら向きに変わるかを見て、縁の上にある画素はそれぞれ自分が乗るはずの直線に\
        投票します。強い直線を組み合わせて候補の四角形を作り、候補ごとにその4辺をたどって、\
        各辺の下に本当にどれだけ縁があるか、そしてその4本が1つのものの境界になっているかを\
        問いながら点を付けます。紙は周りより明るいか暗いかのどちらかですが、4辺すべてで同じ\
        向きにそうであり、それが文字の一行を紙の下端と取り違えるのを防ぎます。重みはなく、\
        何もダウンロードされず、どの書類が通っても計算は同じ計算です。"""

[[faq]]
q = "見つかった四隅が違います。どうすればいいですか。"
a = """
        ドラッグして直してください。四隅は出発点であって、決定ではありません。スキャンは\
        4つの隅が最後に落ち着いた場所から取られます。写真のどこかを押せばいちばん近い隅が\
        指のところへ飛んできますし、そのほうが小さなつまみを正確に触るより簡単です。矢印\
        キーは、選ばれている隅を1画素ずつ動かします。四隅が見つけたものではなく推測である\
        ときもページがそう言い、その1ページを帯で目印します。だいたいの原因は、紙が自分と\
        似た色の机に置かれていることで、そこには本当に見つけるべき縁がほとんどないから\
        です。"""

[[faq]]
q = "まっすぐにした紙が、なぜ潰れずに正しい形で出るのですか。"
a = """
        形を縁から測るのではなく、遠近から復元しているからです。斜めから撮った紙は遠い側の\
        縁が縮んで見えるので、いかにもな方法、つまり向かい合う辺のいちばん長い組を取って\
        それを比とみなす方法では、目に見えて寸詰まりのA4ができます。ウェブのスキャナーの\
        多くがそれを返します。実は四角形の写真には、カメラがふつうのカメラでありさえすれば、\
        その四角形の縦横比とカメラの焦点距離の両方を復元できるだけの情報が入っています。\
        2003年のZhangとHeの結果で、<code>src/geometry.js</code>がしているのがそれです。\
        正面から撮った写真には復元すべき遠近がなく、その必要もありません。そのときは縁が\
        正確だからです。そこで縁のほうへ戻り、どちらが答えたのかをページが書きます。"""

[[faq]]
q = "「整える」は画像に実際何をしているのですか。"
a = """
        明るさを割って取り除いています。紙自身の明るさをページ全体で測ります。細かい升目に\
        分け、升目ごとに明るさの高い側の分位点を取るのですが、文字はそれを動かすには暗すぎ\
        まばらすぎます。そして各画素を、その場所で見積もった紙の明るさで割ります。残るのは\
        インクで、明るさはそろい、影も周辺の落ち込みもありません。これはコントラストを上げる\
        のとは違います。撮った紙のコントラストを上げると、明るい側は白く、暗い側は黒くなり、\
        暗い側に書かれたものは読めなくなります。「自動レベル補正」がこうした写真をよくする\
        どころか悪くするのはそのためです。"""

[[faq]]
q = "白黒モードはなぜそんなに小さいのですか。"
a = """
        色が2つの画像は、1600万色の画像に比べて本当にごくわずかなデータで、ここでもそのまま\
        そう保存するからです。1画素1ビットを1バイトに8つずつ詰め、正確に圧縮します。白黒の\
        画像をJPEGにするのとは違います。同じページでカラーモードの18分の1ほどになるので、\
        20ページの契約書が15メガバイト前後ではなく1メガバイト未満に収まります。しきい値は\
        Sauvolaのもので、各画素をページ全体のひとつの数値ではなく、その画素自身の近傍の平均と\
        ばらつきに照らして決めます。それが影の中の文字を読めるまま保ちます。中間調がないので、\
        写真の載ったページはほかのモードを使ってください。"""

[[faq]]
q = "複数のページを1つのPDFに入れられますか。"
a = """
        はい。足した写真はそのまま次のページになり、順番は一覧に並んでいるとおりで、各ページ\
        は自分の四隅を保ちます。ですから続けて撮った紙の束が1つの書類になります。帯の各\
        ページに付いた矢印がそれを前後に動かします。整える設定をすべてのページで共有するのは\
        意図的です。同じ書類の中で違う整え方をされたページは、2つの書類のように見えるから\
        です。"""

[[faq]]
q = "文字を読み取って、PDFを検索できるようにしてくれますか。"
a = """
        いいえ。テキストの層も文字認識もありません。出てくるのはページの画像が1ページに載った\
        ものです。きちんとやるならOCRエンジンが要り、それは数十メガバイトのモデルをダウン\
        ロードすることになります。給与明細を読む前にモデルを取りに行く書類スキャナーは、\
        給与明細について本国へ電話をかける理由のある書類スキャナーです。文字が必要なら、\
        白黒モードが作るファイルこそ、手元のOCRソフトがいちばんうまく扱える種類のものです。"""

[[faq]]
q = "ぼやけて出ました。なぜですか。"
a = """
        ほとんどの場合、写真の中で紙が小さかったからです。プレビューの下の欄が、紙が画面の\
        何割を埋めたか、そしてその大きさの用紙でおよそ何dpiに当たるかを書いています。150 DPI\
        あたりを下回ると印刷したスキャンは眠く見えますし、そもそもファイルに入っていなかった\
        細部については、どんな道具にもできることはありません。拡大するのではなく近づき、\
        じっとして、押す前にカメラに紙で焦点を合わせさせてください。手ぶれがもう一つの原因で、\
        それも取り戻せません。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか。"
a = """
        無料で、アカウントもログインも試用期間もページ数の制限も透かしもありません。写真の\
        大きさにも制限はありません。その費用を払うサーバーがないからです。処理は手元の端末で\
        起こります。このサイトは広告で運営されていて、広告側にはあなたの書類について何も\
        渡されません。"""

