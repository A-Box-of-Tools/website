  "SVGはパーセントエンコードするので、base64より短く、読める形のまま残ります",
  "CSSルール、CSSカスタムプロパティ、HTMLのimgタグ、Markdownを、常に正しく引用符で囲んで用意します",
  "メディアタイプを拡張子ではなく、ファイル自身のバイト列から読み取ります",
  "エンコードが何文字の代償になったか、その大きさで埋め込む価値があるかを示します",
  "EXIF・XMP・カラープロファイルがスタイルシートに複製されようとしているときに警告します",
  "ファイルを1バイトずつそのまま複製します。再エンコードも画質の劣化もありません",
  "まとめて処理でき、全体を1つのファイルとしてコピーまたはダウンロードできます",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここに画像をドロップ"
hint = "クリックして選ぶこともできます。PNG、JPEG、SVG、WebP、GIF、ICOなどに対応"
