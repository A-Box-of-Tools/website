[[privacy]]
title = "画像には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありません。エンコードの実体は<code>btoa</code>と\
      <code>encodeURIComponent</code>、ブラウザが最初から持っている2つの関数です。\
      どちらもバイト列を受け取ってテキストを返すだけで、どこへも行きません。"""

[[privacy]]
title = "プレビューが証拠です。"
body = """
各結果の横に出る画像は、元のファイルからではなく、このページがいま組み立てた\
      データURIから描いています。表示されるのは、そのURIがサーバーを介さずに手元の\
      端末で正しくできているからです。もし表示されなければ、壊れたものを渡すのでは\
      なく、ページがそう伝えます。"""

[[privacy]]
title = "メタデータの警告は、使う側に立っています。"
body = """
データURIはファイルをそのまま複製するので、写真のGPS座標もそれに乗って\
      スタイルシートへ入っていきます。このページはそれがどれだけあるのかを読み\
      取ってお知らせします。そうしなければ、コミットしたあとで気づくことに\
      なるからです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、画像に関する情報は渡されません。ファイルを読み、\
      エンコードするコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
選択欄にドロップするか、手で選んでください。ブラウザがディスクから直接\
      読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "結果をどこへ持っていくのかを決めます。"
body = """
URIそのもの、CSSルール、カスタムプロパティ、<code>&lt;img&gt;</code>タグ、\
      Markdown。どれもURIを引用符で囲んで出します。インライン化したSVGが動くか、\
      黙って動かないかを決めるのは、この細部です。"""

[[howto]]
title = "代償を読みます。"
body = """
各結果には、何文字になったか、ファイルよりどれだけ大きいか、そしてこの\
      大きさで埋め込むのが良い考えかどうかが表示されます。base64は3分の1を\
      足します。その3分の1がリクエスト1回の節約に見合うかはサイズ次第なので、\
      線のどちら側にいるのかをページが示します。"""

[[howto]]
title = "警告を確かめます。"
body = """
画像がEXIF、カラープロファイル、XMPを抱えている場合は、結果の何バイトが\
      それなのかとともに示します。拡張子が実際の形式と食い違っている場合は、\
      形式のほうを採用してその旨を伝えます。ブラウザが結果を描けない場合も、\
      そう伝えます。"""

[[howto]]
title = "コピーするか、ダウンロードします。"
body = """
結果ごとにボタンが1つ、全部まとめて用にもう1つあります。カスタム\
      プロパティは<code>:root</code>ブロックに包まれて出てくるので、スタイル\
      シートの先頭にそのまま貼れます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。読み込みもエンコードも、お使いのブラウザが手元のハードウェア\
        上で、すでに持っている2つの関数を使って行います。このツールにはネットワーク\
        機能が一切なく、何も取りに行かず、何も送りません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "データURIとは何ですか？"
a = """
        ふつうウェブアドレスが入る場所に、ファイルまるごとを書く方法です。\
        <code>url("logo.png")</code>はブラウザに取りに行けと指示するものですが、\
        代わりに<code>url("data:image/png;base64,iVBORw0...")</code>と書けば、そこに\
        画像そのものが入っています。ブラウザはその場でデコードします。実際の効果は\
        リクエストが1回減ることです。画像はスタイルシートやページのあとではなく、\
        それと一緒に届きます。"""

[[faq]]
q = "SVGがbase64にならないのはなぜですか？"
a = """
        SVGにはbase64が適さないからです。SVGはテキストで、URLはもともとテキストを\
        運べます。逃がす必要がある文字はごくわずかです。そのわずかだけをパーセント\
        エンコードして残りをそのままにすると、同じファイルのbase64よりだいたい5分の1\
        短いURIができ、しかもスタイルシートの中で読めるままです。要素名も、色も、\
        <code>viewBox</code>もそこにあり、編集できます。どうしてもbase64を要求する\
        ツールチェーン向けに、強制するチェックボックスも用意してあります。"""

[[faq]]
q = "base64にすると画像はどれくらい大きくなりますか？"
a = """
        だいたい3分の1です。ファイルの3バイトがbase64の4文字になるので、先頭の\
        <code>data:image/png;base64,</code>を数える前で33%増です。これが下限で、\
        避けられません。URLが許す文字だけで任意のバイト列を書くことの代金だから\
        です。だからこのページは、スタイルシートを配備してから気づくことのないよう、\
        ファイルサイズの隣に文字数を表示します。"""

[[faq]]
q = "画像を埋め込むのが本当に良い考えなのは、どんなときですか？"
a = """
        小さくて、すぐに必要なときです。どのページも読み込むスタイルシートの中の\
        2KBのアイコンなら明らかに得です。往復が1回減り、CSSが届いた瞬間に画像も\
        そこにあります。10KBあたりを超えると割に合わなくなります。埋め込んだ画像は\
        もはや独立したファイルではないので、単独ではキャッシュされず、ほかと並行して\
        取得されず、周りのファイルが変わるたびに丸ごと再ダウンロードされます。\
        スタイルシートの中の200KBの写真は、サイトのすべてのページのクリティカル\
        パスに200KB足すということです。各結果がその線のどちら側に落ちるのかは、\
        ページが示します。"""

[[faq]]
q = "gzipをかければbase64の増加分は帳消しになりますか？"
a = """
        期待されるほどにはなりません。すでに圧縮済みのファイル、つまりPNGもJPEGも\
        WebPもそうですが、そのbase64は圧縮が効きません。圧縮器が見つけられる冗長性が\
        ほとんど残っていないからです。取り戻せるのはたいてい、base64が足した3分の1の\
        さらに10分の1程度で、全部ではありません。パーセントエンコードしたSVGは逆で、\
        依然としてテキストなので以前と同じくらいよく圧縮されます。SVGをbase64に\
        すべきでない理由が、もうひとつあるわけです。"""

[[faq]]
q = "画像そのものは変わりますか？"
a = """
        変わりません。ここにあるほかの多くのツールとの、意図した違いです。ピクセルへ\
        デコードして書き直すことは一切ありません。ディスクから読んだバイト列が、その\
        ままURIに入ります。JPEGは同じ画質、同じ寸法の、まったく同じJPEGのままです。\
        結果を複製ではなく同じファイルと言い切れるのは、そのためです。"""

[[faq]]
q = "ではEXIFやGPSの情報もスタイルシートに入るのですか？"
a = """
        入ります。貼る前に考えておく価値があるのがここです。何も再エンコードしない\
        ので、カメラが書いたものはすべて画像と一緒に移動します。位置情報も、撮影\
        日時も、カメラのシリアル番号もです。スマホの写真ではそれが30KBに達すること\
        もあり、ページのクリティカルパス上で40KBのbase64になり、しかも自宅の住所が\
        リポジトリにコミットされるものの中に入ります。このページはJPEG、PNG、WebPに\
        どれだけメタデータがあるのかを読み取ってお知らせします。先に外すには、\
        <a href="../exif-editor/">EXIFビューアー・削除ツール</a>をお使いください。"""

[[faq]]
q = "ファイルの拡張子と違う種類が使われたのはなぜですか？"
a = """
        拡張子は間違いうるのに、バイト列は間違わないからです。<code>logo.png</code>\
        という名前なのに実際はJPEGとして書き出されたファイルは、どの画像ツールも\
        対処しなければならない程度にはよくあります。そして種類を誤って宣言した\
        データURIは、ただ表示されません。代替手段も、読む価値のあるエラーメッセージも\
        ありません。ですから種類はファイルの先頭数バイトから読み取ります。ここで扱う\
        どの形式でも、そこには曖昧さなく何であるかが書かれています。両者が食い違う\
        場合は、ページがお知らせします。"""

[[faq]]
q = "プレビューが真っ白です。何が起きたのですか？"
a = """
        おそらくURIの問題ではありません。HEICとTIFFはどちらも完全に正しいデータURIに\
        なりますが、Safari以外のブラウザはそれを描きません。ですから貼った先でも画像は\
        出ません。<a href="../compress-image/">画像圧縮ツール</a>か\
        <a href="../resize-image/">画像リサイズツール</a>で、先にPNG、JPEG、WebPに\
        変換してください。形式がありふれたものなら、ファイル自体が壊れている可能性が\
        高いです。プレビューはこのページが組み立てたURIから描くので、真っ白なら画像が\
        デコードできなかったということです。"""

[[faq]]
q = "データURIにサイズの上限はありますか？"
a = """
        CSSの中や<code>&lt;img&gt;</code>タグの中で行き当たる上限はありません。最近の\
        ブラウザはそこに現実的な上限を設けていません。ブラウザが制限しているのは\
        アドレスバーにデータURIを打ち込むことのほうで、いまではたいてい、ごく単純な\
        もの以外は拒みます。この用途とは関係のないセキュリティ上の理由です。本当の\
        上限は上に書いたほうです。技術的に何かが壊れるはるか手前で、そのページは\
        ふつうの画像ファイルを使った場合より遅くなっています。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。ファイル\
        の数にもサイズにも制限はありません。その費用を払うサーバーが存在せず、処理が\
        手元の端末で起きているからです。このサイトには広告があり、それが費用を賄って\
        います。広告に画像の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。エンコード\
        のために画像をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

[schema]
