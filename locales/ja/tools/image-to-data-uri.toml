tagline = "画像まるごとを1行のテキストに。そのままCSSやHTMLに貼れます。"

title = "画像をデータURIに変換｜CSS用base64エンコード・無料・アップロード不要"
description = "PNG・JPEG・SVG・WebPを、CSSやHTMLに貼れるデータURIに変換します。SVGはbase64ではなくパーセントエンコードするので、短いまま、読める形で残ります。処理はブラウザの中だけ。アップロードはありません。"
og_title = "画像を、CSSに貼れる1行に変える"
og_description = "画像にはbase64、SVGにはパーセントエンコード。それを包むCSSルール、カスタムプロパティ、imgタグまで用意します。処理は手元の端末で行い、何もアップロードしません。"
og_image_alt = "画像をデータURIに - 画像をスタイルシートの中に貼り込む"

pledge = """
    エンコードを行うのは、お使いのブラウザと手元のハードウェアです。ページが\
    すでに持っているバイト列に対する計算にすぎず、エンコーダーも、サーバーも、\
    省くべき通信の段階もありません。このツールにはネットワーク機能が一切\
    ありません。取りに行く先も、送る先もありません。仮に送ろうとしても、この\
    ページの向こう側に画像を受け取るサーバーが存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      画像を入れてみてください。画像もサムネイルもファイル名も、選んだファイルの\
      1バイトも、どのリクエストにも載りません。回線を抜いてからエンコードして\
      みるのでも構いません。"""

read_first = """
、2種類のエンコードとそれぞれの理由については\
      <code>src/encode.js</code>、メディアタイプを名前ではなくファイルの中身から\
      読み取る方法については<code>src/sniff.js</code>、これから貼ろうとしている\
      もののうちどれだけが画像でないのかを調べる部分については\
      <code>src/metadata.js</code>です。"""

howto_heading = "画像をデータURIに変える手順"

card = """
            画像にはbase64、SVGにはパーセントエンコード。CSSルールや\
            <code>&lt;img&gt;</code>タグまで組み立てて渡します。"""

