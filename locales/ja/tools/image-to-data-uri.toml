[[privacy]]
title = "画像には出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 <code>src/</code> の\
      どこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。エンコードの実体は <code>btoa</code>
      と <code>encodeURIComponent</code> &mdash; ブラウザが最初から持っている
      2つの関数で、どちらもバイト列を受け取ってテキストを返すだけで、どこへも\
      行きません。"""

[[privacy]]
title = "プレビューが証拠です。"
body = """
 各結果の横に出る画像は、あなたの\
      ファイルからではなく、このページがいま組み立てたデータURIから描かれて\
      います。表示されるのは、そのURIがサーバーを介さずにあなたの端末で正しく\
      できているからです &mdash; もし表示されなければ、壊れたものを渡すのでは\
      なく、ページがそう伝えます。"""

[[privacy]]
title = "メタデータの警告は、あなたの側に立っています。"
body = """
 データURIはファイルを\
      そのまま複製するので、写真の GPS 座標もそれに乗ってスタイルシートへ入って\
      いきます。このページはそれがどれだけあるかを読み取ってお知らせします。\
      そうしなければ、コミットしたあとで気づくことになるからです。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたの画像に関する情報は渡されません。ファイルを読み、\
      エンコードするコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切ってもこのツールは何も変わりません。\
      もともと通信する段階が存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
 選択欄にドロップするか、手で選んでください。\
      ブラウザがディスクから直接読み出します。その間に何かがどこかへ送られる\
      ことはありません。"""

[[howto]]
title = "結果をどこへ持っていくかを言います。"
body = """
 URI そのもの、CSS ルール、\
      カスタムプロパティ、<code>&lt;img&gt;</code> タグ、Markdown。どれも URI を\
      引用符で囲んで出します。インライン化した SVG が動くか、黙って動かないかを\
      決めるのは、この細部です。"""

[[howto]]
title = "代償を読みます。"
body = """
 各結果には、何文字になったか、ファイルより\
      どれだけ大きいか、そしてこの大きさで埋め込むのは良い考えかが表示されます。
      base64 は3分の1を足します。その3分の1がリクエスト1回の節約に見合うかは\
      サイズ次第なので、あなたが線のどちら側にいるかをページが示します。"""

[[howto]]
title = "警告を確かめます。"
body = """
 画像が EXIF、カラープロファイル、XMP を\
      抱えている場合は、結果の何バイトがそれなのかとともに示されます。拡張子が\
      実際の形式と食い違っている場合は、形式のほうを採用してその旨を伝えます。\
      ブラウザが結果を描けない場合も、そう伝えます。"""

[[howto]]
title = "コピーするか、ダウンロードします。"
body = """
 結果ごとにボタンが1つ、\
      全部まとめて用にもう1つあります &mdash; カスタムプロパティは
      <code>:root</code> ブロックに包まれて出てくるので、スタイルシートの\
      先頭にそのまま貼れます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。ファイルの読み込みもエンコードも、あなた自身のブラウザが\
        あなた自身のハードウェア上で、ブラウザがすでに持っている2つの関数を\
        使って行います。このツールにはネットワーク機能が一切なく &mdash; 何も\
        取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "データURIとは何ですか？"
a = """
        ふつうウェブアドレスが入る場所に、ファイルまるごとを書く方法です。
        <code>url("logo.png")</code> はブラウザに取りに行けと指示するものですが、\
        代わりに <code>url("data:image/png;base64,iVBORw0...")</code> と書けば、\
        そこに画像そのものが入っています。ブラウザはその場で復号します。実際の\
        効果はリクエストが1回減ることです。画像はスタイルシートやページのあとで\
        ではなく、それと一緒に届きます。"""

[[faq]]
q = "SVG が base64 にならないのはなぜですか？"
a = """
        SVG には base64 が適さないからです。SVG はテキストで、URL はもともと\
        テキストを運べます &mdash; 逃がす必要がある文字はごくわずかです。その\
        わずかだけをパーセントエンコードして残りをそのままにすると、同じファイルの
        base64 よりだいたい5分の1短い URI ができ、しかもスタイルシートの中で\
        読めるままです。要素名も、色も、<code>viewBox</code> もそこにあり、\
        編集できます。どうしても base64 を要求するツールチェーン向けに、強制する\
        チェックボックスも用意してあります。"""

[[faq]]
q = "base64 にすると画像はどれくらい大きくなりますか？"
a = """
        だいたい3分の1です。ファイルの3バイトが base64 の4文字になるので、\
        先頭の <code>data:image/png;base64,</code> を数える前で33%増です。これが\
        下限で、避けられません。URL が許す文字だけで任意のバイト列を書くことの\
        代金だからです。だからこのページは、スタイルシートを配備してから気づく\
        ことのないように、ファイルサイズの隣に文字数を表示します。"""

[[faq]]
q = "画像を埋め込むのが本当に良い考えなのはどんなときですか？"
a = """
        小さくて、すぐに必要なときです。どのページも読み込むスタイルシートの中の
        2KBのアイコンなら明らかに得です。往復が1回減り、CSS が届いた瞬間に画像も\
        そこにあります。10KBあたりを超えると割に合わなくなります。埋め込まれた\
        画像はもはや独立したファイルではないので、単独ではキャッシュされず、\
        ほかと並行して取得されず、周りのファイルが変わるたびに丸ごと再ダウンロード\
        されます &mdash; スタイルシートの中の200KBの写真は、サイトのすべての\
        ページのクリティカルパスに200KB足すということです。各結果がその線のどちら側に\
        落ちるかは、ページが示します。"""

[[faq]]
q = "gzip をかければ base64 の増加分は帳消しになりますか？"
a = """
        期待されるほどにはなりません。すでに圧縮済みのファイル &mdash; PNG も
        JPEG も WebP もそうです &mdash; の base64 は圧縮が効きません。圧縮器が\
        見つけられる冗長性がほとんど残っていないからです。取り戻せるのはたいてい、
        base64 が足した3分の1のさらに10分の1程度で、全部ではありません。パーセント\
        エンコードした SVG は逆で、依然としてテキストなので以前と同じくらいよく\
        圧縮されます。SVG を base64 にすべきでない理由が、もうひとつあるわけです。"""

[[faq]]
q = "画像そのものは変わりますか？"
a = """
        変わりません。ここにあるほかの多くのツールとの、意図した違いです。ピクセルへ\
        復号して書き直すことは一切ありません。ディスクから読んだバイト列が、その\
        まま URI に入ります。JPEG は同じ画質、同じ寸法の、まったく同じ JPEG のまま\
        です。結果を複製ではなく同じファイルと言い切れるのは、そのためです。"""

[[faq]]
q = "では EXIF や GPS の情報もスタイルシートに入るのですか？"
a = """
        入ります。貼る前に考えておく価値があるのがここです。何も再エンコードしない\
        ので、カメラが書いたものはすべて画像と一緒に移動します。位置情報も、撮影\
        日時も、カメラのシリアル番号もです。スマホの写真ではそれが30KBに達すること\
        もあり、ページのクリティカルパス上で40KBの base64 になり、しかも自宅の\
        住所がリポジトリにコミットされるものの中に入ります。このページは JPEG、
        PNG、WebP にどれだけメタデータがあるかを読み取ってお知らせします。先に\
        外すには、<a href="../exif-editor/">EXIF ビューアー &amp; 削除ツール</a>
        をお使いください。"""

[[faq]]
q = "ファイルの拡張子と違う種類が使われたのはなぜですか？"
a = """
        拡張子は間違いうるが、バイト列は間違わないからです。<code>logo.png</code>
        という名前なのに実際は JPEG として書き出されたファイルは、どの画像ツールも\
        対処しなければならない程度にはよくあります。そして種類を誤って宣言した\
        データURIは、ただ表示されません &mdash; 代替手段も、読む価値のあるエラー\
        メッセージもありません。ですから種類はファイルの先頭数バイトから読み取ります。\
        ここで扱うどの形式でも、そこには曖昧さなく何であるかが書かれています。\
        両者が食い違う場合は、ページがお知らせします。"""

[[faq]]
q = "プレビューが真っ白です。何が起きたのですか？"
a = """
        おそらく URI の問題ではありません。HEIC と TIFF はどちらも完全に正しい\
        データURIになりますが、Safari 以外のブラウザはそれを描きません。ですから\
        貼った先でも画像は出ません &mdash; <a href="../compress-image/">画像圧縮\
        ツール</a> か <a href="../resize-image/">画像リサイズツール</a> で、先に
        PNG、JPEG、WebP に変換してください。形式がありふれたものなら、ファイル\
        自体が壊れている可能性が高いです。プレビューはこのページが組み立てた URI
        から描かれるので、真っ白なら画像が復号できなかったということです。"""

[[faq]]
q = "データURIにサイズの上限はありますか？"
a = """
        CSS の中や <code>&lt;img&gt;</code> タグの中で行き当たる上限はありません。\
        最近のブラウザはそこに現実的な上限を設けていません。ブラウザが制限して\
        いるのはアドレスバーにデータURIを打ち込むことのほうで、いまではたいてい、\
        ごく単純なもの以外は拒みます。この用途とは関係のないセキュリティ上の理由\
        です。本当の上限は上に書いたほうです。技術的に何かが壊れるはるか手前で、\
        そのページはふつうの画像ファイルを使った場合より遅くなっています。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在しないからです &mdash; 処理はあなた自身の端末で起きています。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        画像に関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。エンコードのために画像をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

[schema]
description = "PNG、JPEG、SVG、WebP、GIF、ICO を、CSS や HTML にそのまま貼れるデータURIに変換します。ラスター形式には base64、SVG にはパーセントエンコードを使い、CSS ルール、カスタムプロパティ、img タグ、Markdown に包んで出力し、サイズの代償と埋め込まれたメタデータも報告します。すべてブラウザ内で動作し、アップロードはありません。"
features = [
  "PNG、JPEG、WebP、GIF、ICO、AVIF などを base64 のデータURIにします",
  "SVG はパーセントエンコードするので、base64 より短く、読める形のまま残ります",
  "CSS ルール、CSS カスタムプロパティ、HTML の img タグ、Markdown を、常に正しく引用符で囲んで用意します",
  "メディアタイプを拡張子ではなくファイル自身のバイト列から読み取ります",
  "エンコードが何文字の代償になったか、その大きさで埋め込む価値があるかを示します",
  "EXIF・XMP・カラープロファイルがスタイルシートに複製されようとしているときに警告します",
  "ファイルを1バイトずつそのまま複製します。再エンコードも画質の劣化もありません",
  "まとめて処理でき、全体を1つのファイルとしてコピーまたはダウンロードできます",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここに画像をドロップ"
hint = "クリックして選ぶこともできます &mdash; PNG、JPEG、SVG、WebP、GIF、ICO など"
