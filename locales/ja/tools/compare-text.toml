text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "サイズ制限なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[privacy]]
title = "貼り付けたものには出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。貼り付けられた\
      トークンが集められるような受け口はここになく、仮にあったとしても、そこへ送る\
      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も、<code>XMLHttpRequest</code>も、<code>sendBeacon</code>もありません。比較は、2つの文字列を受け取って何が変わったかを返す、このページの中の関数です。"""

[[privacy]]
title = "アルゴリズムは標準のもので、全部読めます。"
body = """
Myersの最短編集スクリプトのアルゴリズム、<code>git diff</code>が使っているのと同じものを、判断の理由をコメントに残しながら<code>src/diff.js</code>に手書きしています。<code>tests/js/text-diff.test.js</code>のテストは、削除が左のテキストを、挿入が右のテキストを組み立て直すことを証明します。差分にとって「正しい」とはそういう意味だからです。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから\
      来ています。そのどれにも、あなたのテキストは1文字も渡されません。テキストを\
      読み、解析し、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこの道具は何も変わりません。もともと通信する段階が\
      存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "2つのテキストを貼り付けるか、ファイルを2つドロップします。"
body = """
元のものは左、変わったほうは右。選択欄に同時に落とした2つのファイルは、落とした順で左右に入ります。逆だったら、左右を入れ替えてください。"""

[[howto]]
title = "読み方を選びます。"
body = """
左右に並べるか、1列か。スマートフォンは1列で始まります。並べて見るにはテキストの列が2本要りますが、スマートフォンにはだいたい1本分の幅しかないからです。どちらにしてもメニューはすぐそこにあります。"""

[[howto]]
title = "どうでもいい違いは無視します。"
body = """
空白、大文字と小文字、空行。それぞれ別々に無視できるので、整形し直しただけのファイルが100個の変更のようには読めなくなります。既定では、変わっていない真ん中は数に畳まれ、各変更の前後3行だけが残ります。"""

[[howto]]
title = "何が変わったかを読みます。"
body = """
削られた行は左側に、増えた行は右側に印が付き、変わった行の中では違う単語が強調されます。2つの段落の差分は、段落2つの丸ごとではなく、動いた単語を見せてくれます。"""

[[howto]]
title = "パッチを持ち帰ります。"
body = """
ダウンロードはunified形式の<code>.patch</code>で、コードレビューも<code>git apply</code>もあらゆる差分ビューアーも、期待しているのはこれです。コピーも同じものをクリップボードに入れます。"""

[[faq]]
q = "テキストはどこかにアップロードされますか？"
a = """
        いいえ。比較は、お使いのブラウザの中で、お手元のハードウェアで動く関数です。この道具にはどんなネットワーク機能もありません。何かを取りに行くことも、送ることもありません。ページの<code>Content-Security-Policy</code>には接続してよいアドレスがすべて書かれていて、そのどれもこのサイトのものではありません。契約書や設定ファイル、未公開のコードをここで扱う理由はそれです。そういうものを他人の差分ツールに貼り付けるのは、両方の版を一度に渡すのと同じことだからです。"""

[[faq]]
q = "比較は実際に何をしていますか？"
a = """
        左のテキストを右のテキストに変える、いちばん短い編集の組み合わせを見つけます。\
        Myersのアルゴリズムで、<code>git diff</code>が使っているのと同じものです。\
        いちばん短いことこそが差分を読みやすくします。途中に1行足したのなら、1件の\
        挿入として出るべきで、それ以降の全行が変わったように見えてはいけません。\
        変わった行の中では、違っている語にも印が付きます。段落を2つ比べたときに、\
        段落まるごと2つではなく、動いた語が見えるのはそのためです。"""

[[faq]]
q = "貼り付けではなく、ファイル2つを比較できますか？"
a = """
        できます。2つとも同時に選択欄に落とせば、落とした順で左右に入ります。読むのはお使いのブラウザで、行き先はこのページだけです。順番を間違えたら、左右を入れ替えてください。"""

[[faq]]
q = "比較からは何が出てきますか。適用もできますか？"
a = """
        ダウンロードされるのはunified diff、つまり<code>@@ -3,5 +3,5 @@</code>の形式\
        で、<code>git apply</code>も<code>patch</code>も、どのコードレビュー用の道具も\
        読めます。コピーも同じものをクリップボードへ入れます。画面に出ているのはその\
        表示で、左右に並べるか1列にするかを選べ、変わっていない部分は件数にまとめて\
        たたまれます。すべて見たいときはそう指定してください。"""

[[faq]]
q = "空白や大文字小文字、空行を無視できますか？"
a = """
        できます。それぞれ別々にです。空白を無視すれば、整形し直しただけのファイルは変更なしとして比較されます。大文字小文字を無視すれば、<code>Error</code>と<code>error</code>は同じ単語として扱われます。空行を無視すれば、何も載っていない行は飛ばされます。そのとき結果の上のカウンターは、「無視するよう頼んだ違いを無視すれば2つは同じ」と言います。これは「同一」とは別の主張で、このページは2つの主張を混ぜません。"""

[[faq]]
q = "どれくらい大きい比較まで扱えますか？"
a = """
        ここに上限は設けていません。その費用を払うサーバーが存在しないからです。2万行のテキスト2つに変更がひと握りなら、一瞬で比較が終わります。本当の仕事が始まる前に、共通の先頭と末尾を切り落とすからです。共通点がまったくない2つのテキストの比較は、当たり前のことを証明するのに1分かける代わりに、早めに打ち切ってその旨を伝えます。とても長い比較は、はじめの数千行を描き、残りはダウンロードしたパッチに任せます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もなく、貼り付けられる量にも制限は\
        ありません。このサイトには広告があり、それが費用を賄っています。広告に\
        テキストの情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何もアップロードされていないことを示す、いちばん簡単な方法でもあります。比較のためにテキストをどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

[schema]
description = "2つのテキストを行と単語の差分で、左右に並べて、または1列で比較し、結果をunified形式のパッチとしてダウンロードする。比較はブラウザの中で動き、アップロードは一切ありません。"
features = [
  "Myersのアルゴリズムで2つのテキストを比較。左右並びか1列で表示",
  "変わった行の中で、変わった語に印を付けます",
  "左右に並べても1列でも。変わっていない真ん中は数に畳んで",
  "空白・大文字小文字・空行を、それぞれ別々に無視できる",
  "比較をコードレビューで読めるunified diffとしてダウンロード",
  "ドロップした2つのファイルも、2回の貼り付けと同じ手軽さで比較",
  "共通の先頭と末尾を切り落とすので、長くて似たファイルも一瞬で比較できる",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここにファイルを2つドロップ"
hint = "クリックして選ぶこともできます &mdash; テキストファイルなら何でも、左右に1つずつ。"
