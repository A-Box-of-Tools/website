read_first = """
、そして<code>src/diff.js</code>を読んでください。Myersのアルゴリズム、変わった行の中を単語単位でもう一度なぞる処理、そして病的な比較がページを固めてしまわないようにする3つの安全装置がそこにあります。"""

howto_heading = "2つのテキストをアップロードせずに比較する手順"

card = """
            2つのテキストを比較して、どこが変わったかを行単位・単語単位で見ます。契約書や未公開のコードを、誰にも渡さずに貼り付けられます。"""

