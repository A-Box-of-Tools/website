[[privacy]]
title = "画像が送られる先はありません。"
body = "Content-Security-Policyにはこのページが接続できるアドレスがすべて書かれていますが、このサイト自身のものはありません。ファイルを収集する受け口も、それを送信するコードもありません。"

[[privacy]]
title = "ブラウザにデコーダーがあるので、サーバーは不要です。"
body = "2020年以降のブラウザはすべてWebPを読み、それより前からJPEGを書けます。このツールにはエンジンがなく、初回に何かをダウンロードする必要も、サーバーを使う理由もありません。アップロードを求めるサイトが説明しないことです。<a href=\"../heic-to-jpg/\">HEIC変換ツール</a>にはコーデックを含めています。Safari以外ではHEICを開けないためで、そのページで詳しく説明しています。"

[[privacy]]
title = "透明な部分と、その背景色。"
body = "WebPには透明度がありますが、JPEGにはアルファチャンネルがなく、背景色が必要です。初期値は白で、デコード後の画素に本当に透明な部分がある場合だけ色を選べます。何も聞かない変換ツールも透明度を残しているわけではありません。黒い背景のロゴになるのは、その色をツールが選んだためです。"

[[privacy]]
title = "キャンバスが引き継がない情報。"
body = "画像をデコードしてキャンバスに描画します。キャンバスは画素だけを保つので、EXIF、ICC色プロファイル、XMP、著作権情報は残りません。便利な場合も困る場合もあるので、事前に説明しています。メタデータを扱いたいなら、再圧縮せずに読み書きする<a href=\"../exif-editor/\">EXIF表示・削除ツール</a>を使ってください。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから読み込みます。画像についての情報はどれにも渡しません。ファイルを読み、デコードし、書き出すコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "オフラインでも動きます。"
body = "ページを一度開いて通信を切っても、動作は変わりません。画像を別の場所へ送って変換するツールにはできない、一番簡単な確認方法です。"

[[howto]]
title = "WebPファイルを選びます。"
body = "選択欄にドロップするか、ファイルを選びます。名前ではなく先頭のバイトで判別するので、「.jpg」という名前のWebPも使えます。本当にPNGであるファイルは、実際の形式を伝えて受け付けません。"

[[howto]]
title = "各行のファイル情報を読みます。"
body = "容量と画像の大きさに加え、変換前に知っておきたい3点を表示します。可逆圧縮か、透明な部分があるか、アニメーションかです。そのファイルに当てはまるものだけが現れます。"

[[howto]]
title = "画質と、透明な部分の背景色を選びます。"
body = "画質は92から始まります。写真を元の画像と見分けにくい値です。JPEGでは透明度を保てないので、透明な部分のある画像が含まれる場合だけ背景色の欄が現れます。"

[[howto]]
title = "「変換」を押してダウンロードします。"
body = "結果には元のファイル、新しいサイズ、サイズの変化を表示します。透明な部分を塗った場合やアニメーションの先頭だけを保存した場合は、そのことも伝えます。1個なら個別のダウンロード、複数ならZIPも使えます。"

[[faq]]
q = "画像はどこかへアップロードされますか？"
a = "いいえ。読み込み、デコード、書き出しはすべてお使いのブラウザとハードウェアで行います。ツールはネットワークから取得も送信もしません。<code>Content-Security-Policy</code>に書かれた接続先に、このサイト自身のものはありません。HEIC変換ツールと違い、デコーダーの読み込みさえ不要で、ブラウザがすでに持っています。"

[[faq]]
q = "WebPをJPGに変換する理由は何ですか？"
a = "画像を渡す先のソフトウェアがWebPに対応していない場合です。WebPはウェブから保存すると受け取ることが多く、容量の小さな形式ですが、古いOfficeやPhotoshop、印刷店、拡張子で判別するフォーム、電子書籍端末、カメラやプリンターの付属ソフトには対応しないものがあります。JPGは長く広く使われてきた形式です。"

[[faq]]
q = "透明な部分はどうなりますか？"
a = "選んだ色で塗りつぶし、変換前に伝えます。JPEGにはアルファチャンネルがなく、透明度は保てません。背景色は自分で選びます。書類に入れるロゴに向くので、初期値は白です。透明度を保つならWebPのまま使うか、JPEG以外にPNGやWebPも書ける<a href=\"../compress-image/\">画像圧縮ツール</a>でPNGに変換してください。"

[[faq]]
q = "アニメーションWebPも変換できますか？"
a = "先頭のフレームだけを変換します。そのことを変換前の行と変換後の結果で伝えます。JPEGは静止画1枚しか保存できません。全フレームを個別に保存したり、動画にしたりするには、アニメーションをGIFにしたうえで<a href=\"../split-gif/\">GIF分割ツール</a>や<a href=\"../gif-to-mp4/\">GIFをMP4に変換するツール</a>を使ってください。"

[[faq]]
q = "画像は再圧縮されますか？"
a = "はい。WebPとJPEGは異なるコーデックなので、デコードと再エンコードは避けられません。アップロードを求めるサイトも同じです。画質は自分で選べて、初期値92では写真を元の画像と見分けにくくなります。可逆圧縮のWebPからは、その画像で初めての非可逆圧縮のコピーが生まれます。事前に可逆圧縮であることを行に表示します。"

[[faq]]
q = "JPGはWebPより大きくなりますか？"
a = "多くの場合は大きくなり、差を結果に表示します。同じ見た目の画質ではWebPのほうが圧縮効率がよいためです。WebPに対応しない相手へ渡すため、容量を互換性と交換します。その後で容量を減らすなら、<a href=\"../compress-image/\">画像圧縮ツール</a>で目標サイズを指定できます。"

[[faq]]
q = "撮影日時、カメラ、位置情報は残りますか？"
a = "いいえ。キャンバスは画素だけを保つので、EXIF、GPS、色プロファイル、XMPは残りません。ウェブのWebPはすでに除去されていることが多く、共有する画像には便利な場合もあります。再圧縮せずに内容を確認・編集するには<a href=\"../exif-editor/\">EXIF表示・削除ツール</a>を使ってください。"

[[faq]]
q = "フォルダごと変換できますか？"
a = "はい。サーバーで処理しないので、個数や容量の制限はありません。好きなだけ追加できます。ファイルごとに結果とダウンロードがあり、2個以上ならZIPも使えます。同名のファイルには拡張子の前に番号を付け、上書きを防ぎます。"

[[faq]]
q = "無料ですか？アカウントは必要ですか？"
a = "無料で、アカウント、ログイン、お試し期間、透かしはありません。広告で運営していますが、画像の情報は広告に渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。ページを一度開いて通信を切っても同じように動きます。ファイルを別の場所へ送って処理するツールなら通信が切れた瞬間に止まるので、何もアップロードされないことの直接の確認になります。"

