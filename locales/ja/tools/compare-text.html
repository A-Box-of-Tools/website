<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> 2つのテキストを貼り付ける</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">元のテキスト</label>
          <span class="count" id="input-count">空</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="元のテキストをここに貼り付け - または上に2つのファイルをドロップ。"></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">変わったほう</label>
          <span class="count" id="input-b-count">空</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="比べる相手のほうを貼り付けてください。"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">例を試す</button>
        <button type="button" id="swap" class="ghost">左右を入れ替える</button>
        <button type="button" id="clear" class="ghost danger">消去</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> 読み方を選ぶ</h2>

    <div class="settings">
      <div class="field">
        <label for="view">見せ方</label>
        <select id="view">
          <option value="split" selected>左右に並べる</option>
          <option value="unified">1列にまとめる</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          変わったところだけ、前後3行を添えて表示する
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          空白の違いを無視する
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          大文字と小文字の違いを無視する
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          空行を無視する
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> 何が変わったかを読む</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">まだ何もありません。</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>コピー</button>
        <a id="download" class="ghost as-button" hidden download>ダウンロード</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
