read_first = "、センサーをデコードせずに埋め込みRAWプレビューを見つける仕組みは<code>src/raw.js</code>、各手法の計算は<code>src/stack.js</code>、推定作業メモリとスタック時の予定デコード回数は<code>src/plan.js</code>で確認できます。ブラウザ内部やメモリ回収のために、モデル化したバッファ以外のメモリが必要な場合があります。"

howto_heading = "ブラウザで写真をスタックする方法"

