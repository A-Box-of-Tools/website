title = "画像スタック｜ブラウザで平均・中央値・深度合成"
description = "連写した写真を1枚にまとめます。平均でノイズを消し、中央値で場面から人を消し、比較明で星の軌跡にし、あるいはマクロ撮影を深度合成します。CR2・NEF・ARW・DNG・RAF・CR3は、カメラ自身のプレビューを取り出して読みます。すべてブラウザの中で動きます。"
og_title = "連写した写真をスタックする、RAWも含めて"
og_description = "平均・中央値・シグマクリッピング・比較明・比較暗・加算・深度合成に対応し、先にフレームを位置合わせします。RAWファイルは利用できるJPEGプレビューがあればそれを開き、センサーのデータはデコードしません。何もアップロードしません。"
og_image_alt = "画像スタック - 複数のフレームをブラウザで1枚にまとめる"

