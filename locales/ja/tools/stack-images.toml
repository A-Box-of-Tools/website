#
# Image Stacker - Japanese.
#
# Overrides for tools/stack-images/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 手法の名前は日本語の写真の文章で通っている語を使います。中央値、シグマクリッピング、
# 深度合成。RAWは訳さず、形式の略号もそのままです。
#

name = "画像スタック"
heading = "画像スタック<span class=\"h1-kw\">｜連写をまとめる、RAWも含めて</span>"
tagline = "20枚を1枚に。20回のアップロードもRAW現像ソフトもなしで。"

title = "画像スタック｜ブラウザで平均・中央値・深度合成"
description = "連写した写真を1枚にまとめます。平均でノイズを消し、中央値で場面から人を消し、比較明で星の軌跡にし、あるいはマクロ撮影を深度合成します。CR2・NEF・ARW・DNG・RAF・CR3は、カメラ自身のプレビューを取り出して読みます。すべてブラウザの中で動きます。"
og_title = "連写した写真をスタックする、RAWも含めて"
og_description = "平均・中央値・シグマクリッピング・比較明・比較暗・加算・深度合成。フレームは先に位置合わせします。RAWファイルはカメラがすでに書き込んでいるプレビューを読んで開くので、60 MBの1枚がJPEG並みの速さで開きます。何もアップロードしません。"
og_image_alt = "画像スタック - 複数のフレームをブラウザで1枚にまとめる"

pledge = """
    各フレームを開き、デコードし、位置を合わせ、合成し、書き出す処理は、すべて手元の\
    ブラウザが手元の端末で行います。60&nbsp;MBのRAWファイル20枚はおよそ1ギガバイトの\
    写真ですが、その1バイトも動きません。この道具にはネットワーク機能がそもそもなく、\
    ファイルは送り先を持たないworkerがディスクから直接読みます。"""

live_hint = """
      言葉を信じる必要はありません。開発者ツールを開き、ネットワークタブを見ながらRAW\
      ファイルの入ったフォルダをスタックしてみてください。写真もサムネイルもファイル名も\
      カメラの機種も、運んでいるリクエストはひとつもありません。あるいは回線を切ってから\
      スタックしてみてください。道具は何も変わりません。"""

read_first = """
、RAWファイルをメガバイトではなくキロバイトだけ\
      読んでどう開くのかは<code>src/raw.js</code>、各手法の計算は\
      <code>src/stack.js</code>、そしてページに出るメモリとデコード回数の数字がどこから\
      来るのかは<code>src/plan.js</code>です。それらは見積もりではなく、そのファイルの\
      出す答えです。"""

howto_heading = "ブラウザで写真をスタックする方法"

card = """
            連写を1枚にまとめます。平均でノイズを消し、中央値で通行人を消し、比較明で\
            星の軌跡にできます。RAWファイルも現像ソフトなしで読みます。"""

[words]
plural = "写真"
choose = "写真を何枚か"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "アカウント不要"

[[facts]]
text = "透かしなし"

[[facts]]
text = "RAWを読む"

[[facts]]
text = "オフラインで動く"

[[facts]]
text = "オープンソース"

[[privacy]]
title = "写真には出ていく先がありません。"
body = """
 Content-Security-Policyには、この\
      ページが接続しうるアドレスがすべて書かれていて、そのどれもこのサイトのものでは\
      ありません。ファイルが集まりうるエンドポイントはここにはなく、あったとしても送る\
      コードがありません。<code>src/</code>にもworkerにも、<code>fetch</code>も\
      <code>XMLHttpRequest</code>も<code>sendBeacon</code>もありません。"""

[[privacy]]
title = "RAWファイルは読まれるだけで、送られませんし、読まれる量もごくわずかです。"
body = """
 カメラのRAWファイルには、\
      撮影のときにカメラ自身が現像した原寸のJPEGがすでに入っています。この道具は\
      ディレクトリのエントリをいくつかたどってそれを見つけ、そのあと1か所だけを求めます。\
      60&nbsp;MBのファイルでもたいてい100キロバイト未満です。作業中、ページはその数字を\
      ファイルの大きさと並べて見せ続けます。センサーのデータはそもそも一度も読みません。"""

[[privacy]]
title = "処理はサーバーではなく、この端末のWorkerで動きます。"
body = """
 ここでworkerを使う道具は\
      これだけです。スタックは秒ではなく分の計算で、固まったページは進み具合を見せることも\
      中止されることもできないからです。Workerはこの同じブラウザの中の2本目の流れです。\
      <code>src/worker.js</code>を見てください。そこにはファイルそのものが渡されますが、\
      ファイルへの参照はバイト列ではないので、それは無料です。そしてページとまったく同じ\
      Content-Security-Policyの下にあります。つまり送り先がありません。"""

[[privacy]]
title = "この一組について、どこにも報告されません。"
body = """
 何枚スタックしたか、どのカメラが\
      書いたか、それぞれがどれだけずれていたか、どの手法を選んだか、どれだけ時間がかかったか。\
      それらは閉じるまでこのページのメモリにあるだけです。このリポジトリにはその内容を運ぶ\
      独自の分析イベントはありませんし、ダウンロードのあとにこのサイトが尋ねる唯一の質問は、\
      親指の向きと道具の名前を送るだけで、ほかには何も送りません。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 回線を切っても道具は変わりません。もともと\
      ネットワークの段階がなかったからです。workerとそれが読み込むすべてのモジュールは\
      このページ自身のservice workerがキャッシュしているので、入れておいた写しは回線を\
      抜いたままでもRAWファイルをスタックします。"""

[[howto]]
title = "フレームを選びます。"
body = """
 連写でも、段階露光の一組でも、\
      インターバル撮影の並びでも、RAWファイルの入ったフォルダでもかまいません。届いた順に\
      1枚ずつ開き、その行が何が出てきたかを書きます。RAWファイルならカメラ、中で見つかった\
      プレビューの大きさ、そしてそれを見つけるのにファイルをどれだけ読まずに済んだかです。"""

[[howto]]
title = "何を失いたいのかに合う手法を選びます。"
body = """
 ノイズなら平均、\
      何かが動いていたならシグマクリッピングです。人や車や通り過ぎる飛行機なら中央値。\
      暗い空を星の軌跡にしたいなら比較明。フォーカスリングを回しながら撮ったマクロなら\
      深度合成です。メニューの下の説明が、あなたの枚数に対して各手法が何をするのかを書きます。"""

[[howto]]
title = "フレームの位置合わせが要るか決めます。"
body = """
 手持ちなら、はい、平行移動だけ。\
      手持ちで向きも変えていたなら、平行移動と回転と拡大縮小。固定した三脚やインターバル\
      撮影ならいいえで、そのほうが速くなります。各フレームは一覧の最初のフレームに対して\
      測られるので、どのフレームでも最初に繰り上げられます。"""

[[howto]]
title = "4つの数字を読んでから、ボタンを押します。"
body = """
 何かが走り出す前に、\
      ページが結果の大きさ、おおよそのメモリ使用量、フレームを何回デコードするか、ファイルを\
      どれだけ読んだかを書きます。一組が一度にメモリへ収まらなければそう書きますし、どの\
      作業解像度なら収まるのかも書きます。"""

[[faq]]
q = "写真はどこかへアップロードされますか。"
a = """
        いいえ。各フレームを開き、デコードし、位置を合わせ、スタックし、書き出す処理は、\
        すべて手元のブラウザが手元のハードウェアで行います。この道具にはネットワーク機能が\
        そもそもなく、何かを取りに行くことも送ることもありません。ページの\
        <code>Content-Security-Policy</code>には接続しうるアドレスがすべて書かれていますが、\
        そのどれもこのサイトのものではありません。ページを一度読み込んで回線を切っても、\
        そのまま動きます。ここでそれがほかの道具より効いてくるのは、単に量のせいです。\
        RAWフレーム20枚はおよそ1ギガバイトで、その平均を取ってもらうために1ギガバイトの\
        写真をアップロードすることこそ、この道具が避けるためにある事柄です。"""

[[faq]]
q = "どのRAW形式を読めますか。どうやって読むのですか。"
a = """
        <span id="faq-raw"></span>CR2、CR3、NEF、NRW、ARW、SR2、SRF、DNG、ORF、RAF、RW2、\
        PEF、SRW、3FR、IIQ、DCR、KDC、MRW、MEF、RWLなど、カメラが書くもののほとんどです。\
        そこから読むのは、撮影のときにカメラ自身が現像した原寸のJPEGプレビューです。カメラの\
        背面に映るあの画像であり、OSがサムネイルとして描くあの画像です。ファイルのディレクトリ\
        構造をたどって見つけますが、それは数キロバイトの読み取りが数回で済み、そのあと1か所を\
        取り出すだけです。<strong>センサーデータのデモザイクではありません。</strong>結果には\
        カメラのホワイトバランスとピクチャースタイルが入り、1チャンネル8ビットです。RAW現像\
        ソフトが渡す12ビットや14ビットの線形なセンサーデータではありません。"""

[[faq]]
q = "ではなぜセンサーデータをきちんとデコードしないのですか。"
a = """
        LibRawかdcrawを同梱することになるからです。ひとつの形式の系統のためだけに数十メガ\
        バイトの2つめのエンジンを抱えることになり、その大半はメーカーごとの圧縮方式です。\
        その取引はこのサイトのソースの<code>docs/what-can-be-built-here.md</code>で論じられて\
        いて、カメラRAWはこの道具ができる前から除外一覧に載っていました。変わったのはその問いへの\
        答えではなく、スタックにはそれが要らないと分かったことです。プレビューは原寸ですし、\
        どのみちカメラがJPEGとして渡していた画像そのものですし、それを読むのはデモザイクの\
        およそ100倍速いのです。センサーデータが要るなら、先にRAW現像ソフトで現像して、そこから\
        出たTIFFやJPEGをスタックしてください。この道具はそれも受け取ります。"""

[[faq]]
q = "何枚まで、どのくらいの大きさまで扱えますか。"
a = """
        7つの手法のうち6つは流しながら処理します。累算器をひとつ持ち、各フレームをちょうど\
        一度だけ読むので、100枚でも2枚と同じメモリで済み、増えるのは時間だけです。中央値だけが\
        例外で、ある集合の真ん中の値は全部そろうまで分からないため、すべてのフレームを同時に\
        抱えます。2400万画素20枚でおよそ1.4&nbsp;GBになり、それを渡してくれるブラウザはあり\
        ません。そうなったときは画像を横帯に切り、1帯ずつスタックしますが、帯ごとにフレームを\
        読み直す分の費用がかかります。ページはこれをすべてボタンを押す前に計算して数字で見せる\
        ので、遅い実行が驚きになることはありません。"""

[[faq]]
q = "フレームの位置合わせは実際に何をしているのですか。"
a = """
        各フレームが最初の1枚に対してどれだけずれたかを求め、そのぶん戻します。1画素の何分の\
        1という精度です。手法は位相相関です。2枚の画像のあいだのずれは、2つのスペクトルの\
        あいだの位相差として現れるので、それぞれ1回のフーリエ変換で、200画素のずれも2画素の\
        ずれと同じ安さで見つかります。2つめの設定は、同じ手を対数極座標のスペクトルに当てて\
        回転と拡大縮小も取り戻します。どれも大域的で、フレーム全体に対してずれが1つ、角度が1つ、\
        倍率が1つです。ですから動いたカメラは直せますが、動いた被写体は直せませんし、一歩左から\
        撮った写真も直せません。目に見える結果もひとつあります。左へ20画素動かしたフレームは\
        もう右端に届かないので、結果はすべてのフレームが覆う範囲まで切り詰められます。位置を\
        合わせたスタックが元のフレームよりわずかに小さく返るのはそのためで、そこになかった\
        フレームでできた黒い縁を避ける唯一の方法でもあります。"""

[[faq]]
q = "どの手法を使えばいいですか。"
a = """
        何も動かなかった一組のノイズには<strong>平均</strong>です。ランダムなノイズを、枚数の\
        平方根ほど減らします。一部の時間だけそこにあったものを消すなら<strong>中央値</strong>で、\
        混み合った広場を十数回撮って無人の広場を得るという古典的な使い方がそれです。両方が\
        欲しいなら<strong>シグマクリッピング</strong>で、各画素がふだん何であるかを学んでから、\
        それと合う値だけを平均するので、通り過ぎる車に対する中央値の強さと、平均のノイズ低減を\
        あわせて得られます。星の軌跡や花火やライトペインティングには<strong>比較明</strong>。\
        動いた明るいものを消すなら<strong>比較暗</strong>。1回の長時間露光を真似るなら\
        <strong>加算</strong>。フォーカスリングを回しながら撮ったマクロには<strong>深度合成\
        </strong>です。"""

[[faq]]
q = "RAWファイルは14ビットなのに、結果がなぜ8ビットなのですか。"
a = """
        スタックされているのがカメラ自身のプレビューで、それがJPEGだからです。ただしスタックが\
        その代償の一部を取り戻すことは言っておく価値があります。8ビットのフレーム16枚の平均は、\
        そのどの1枚よりも本当に細かい階調を持ちます。各フレームの丸め方を違わせていたノイズ\
        こそが、平均を段と段のあいだに落ち着かせるからです。ここでの計算は浮動小数点で行い、\
        いちばん最後に一度だけ丸めるので、途中で捨てられるものはありません。それでも線形な\
        センサーデータをスタックするのとは違いますし、この道具はそのふりをしません。"""

[[faq]]
q = "大きさの違うフレームや、別のカメラのフレームをスタックできますか。"
a = """
        できますが、たいていは間違いですし、そのつもりだったか確かめる価値があります。結果は\
        いちばん大きいフレームの大きさになり、ほかのフレームはそこに収まるよう拡大縮小されて\
        中央に置かれます。カメラを混ぜると色の解釈も混ざるので、2つの平均は同じ光に対する2つの\
        違う解釈の平均になります。本当に役に立つのは、2つの解像度で撮った一組や、同じ場面のRAW\
        ファイルとJPEGです。"""

[[faq]]
q = "実行が帯に分かれると出ました。どういう意味ですか。"
a = """
        その手法に必要な作業メモリが、この道具が一度に確保しようとする量を超えているという意味\
        です。ですから画像を横帯に切り、1帯ずつスタックします。結果はまったく同じものになります。\
        ただ帯ごとにフレームを読み直すので時間がかかりますし、それが何回のデコードになるのかを\
        ページが書きます。作業解像度を1段下げるとメモリは4分の1になり、帯に分かれる実行はほぼ\
        いつも一度きりの実行に戻ります。どの設定ならそうなるのかも説明に出ます。"""

[[faq]]
q = "ほかの道具はWorkerを使っていないのに、これだけ使うのはなぜですか。"
a = """
        処理が分単位で測られる唯一の道具だからです。ここのほかの道具は1、2秒で終わることを\
        していて、そこで処理をメインスレッドの外へ出すのは儀式にすぎません。大きなフレーム20枚を\
        スタックするのは数百メガバイトにわたる密な計算で、メインスレッドではそれは固まったページ\
        を意味します。進捗バーは動かず、中止ボタンは応じず、しまいにはブラウザがタブを閉じよう\
        かと言ってきます。Workerはこの同じブラウザの中の2本目の流れで、この同じフォルダの\
        ファイルを、この同じポリシーの下で動かします。サーバーでもネットワーク機能でもありま\
        せん。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか。"
a = """
        無料で、アカウントもログインも試用期間も透かしもありません。何枚スタックするかにも、\
        それがどれだけ大きいかにも制限はありません。その費用を払うサーバーがないからです。\
        処理は手元の端末で起こり、天井は手元のメモリだけです。このサイトは広告で運営されていて、\
        広告側にはあなたの写真について何も渡されません。"""

[schema]
description = "ブラウザで連写した写真をスタックします。平均・中央値・シグマクリッピング平均・比較明・比較暗・加算・深度合成に対応し、フレームは先に位相相関で位置合わせします。カメラのRAWファイルは、カメラが埋め込んだ原寸プレビューを取り出して読むので、RAW現像ソフトは要りません。何もアップロードしません。"
features = [
  "7つのスタック手法。平均・中央値・シグマクリッピング平均・比較明・比較暗・加算・深度合成",
  "CR2・CR3・NEF・ARW・DNG・ORF・RAF・RW2などを、カメラ自身の原寸プレビューを取り出して読む",
  "60 MBのRAWファイルを、およそ100キロバイトだけ読んで開く",
  "自動位置合わせ。平行移動だけ、平行移動と回転と拡大縮小、または無し",
  "ずれを総当たりで探すのではなく、位相相関で1画素以下まで合わせる",
  "7つのうち6つは累算器をひとつだけ持つので、100枚が2枚ぶんのメモリで済む",
  "メモリとデコードの費用を、実行が始まる前に計算して表示",
  "処理はWorkerで動くので、進捗が動き、中止が応じる",
  "PNGまたはJPEGで出力。オフラインで動作。アップロードもアカウントもなし",
]

[picker]
title = "フレームをここにドロップ"
hint = "またはクリックして選択｜JPEG、PNG、WebP、TIFF、そしてカメラRAW"
