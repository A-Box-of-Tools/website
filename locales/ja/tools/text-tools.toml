      コードがありません。"""

[[privacy]]
title = "ここからは何も取りに行きません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も、\
      <code>XMLHttpRequest</code>も、<code>sendBeacon</code>もありません。どの\
      パーサーも、どのエンコーダーも、比較も、文字列を受け取って文字列を返す、この\
