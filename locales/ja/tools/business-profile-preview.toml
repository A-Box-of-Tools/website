[[privacy]]
title = "入力内容を送る先がありません。"
body = "Content-Security-Policyにはこのページが接続できるアドレスがすべて書かれていますが、このサイト自身のものはありません。住所や電話番号を収集する受け口も、送信するコードもありません。"

[[privacy]]
title = "外部から何も取得しません。"
body = "<code>src/</code>に<code>fetch</code>、<code>XMLHttpRequest</code>、<code>sendBeacon</code>はありません。リスティングを検索できず、貼り付けて取り込む理由です。取得できる能力は送信できる能力でもあるため、持たせていません。"

[[privacy]]
title = "写真はここで読み、メタデータを除きます。"
body = "カバー写真をページ内でデコードしてキャンバスに描き直すので、大きさを抑え、撮影日時や場所の記録を除きます。見本に入るのは元のファイルではなく画像です。"

[[privacy]]
title = "画面の見本と同じものを保存します。"
body = "PNGは別の描画ではなく、プレビューと同じマークアップをブラウザに渡してキャンバスへ描きます。取得するフォントやリンクされた画像はなく、通信を切っても保存できる自己完結したファイルです。"

[[privacy]]
title = "保存はファイルで、アカウントではありません。"
body = "JSONはディスクにだけ書き、開き直したときだけ内容を戻します。訪問の間にブラウザへ保存しません。ビジネスの住所や営業時間をこのサイトが保持する必要はないからです。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから読み込みます。入力内容はどれにも渡しません。入力欄を画像にするコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "オフラインでも動きます。"
body = "最初から通信する処理がないので、通信を切っても動作は変わりません。一番簡単な確認方法です。"

[[howto]]
title = "既存のリスティングがあれば、そこから始めます。"
body = "Googleで自分のビジネスを開き、名前、星、その下の行を含むカード全体をコピーして、ページ上部へ貼り付けます。名前、カテゴリ、評価、クチコミ数、住所、電話番号、ウェブサイト、1週間の営業時間を認識し、入力した項目を報告するので、誤った推定を確認できます。APIの書き出しも開けます。"

[[howto]]
title = "まず名前とカテゴリを確認します。"
body = "特に重要な2つの項目です。名前は3つの表示すべてで省略され、検索結果では最も短くなります。末尾に町名や業種を足すと、探す人には省略記号になることがあります。カテゴリは狭い地域検索にも残る行で、検索する語句に対応します。"

[[howto]]
title = "1週間を入力し、表示を見ます。"
body = "営業状態は触らなくても<em>営業中 &middot; 午後9時に閉店</em>から<em>営業時間外 &middot; 火曜日の午前9時に開店</em>へ変わります。端末の時計と営業時間で計算し、休業日にすればその夜の表示を確認できます。22:00から02:00のように終了が開始より前なら、翌日までの営業と扱います。<em>指定した日時でプレビュー</em>をオンにすると、この端末のタイムゾーンで特定の夕方や翌朝を確認できます。オフにすると時計に従う表示に戻ります。この選択はプロフィールのJSONには保存されません。"

[[howto]]
title = "表示されるボタンを確認します。"
body = "住所がなければ<em>経路</em>、ウェブサイトがなければ<em>ウェブサイト</em>、電話番号がなければ<em>電話</em>はありません。この3つがボタンになり、欠けると読者は別の場所で探す必要があります。すぐ確認でき、実際にも抜けやすい情報です。"

[[howto]]
title = "3つの表示をすべて見ます。"
body = "同じプロフィールでも長さが違います。名前を知る人が見るパネルは広く、電話のカードは多くの訪問者が使い、地域検索は狭くて競合と比較する場所です。パネルで読める説明も検索結果では見えません。"

[[howto]]
title = "画像を保存します。"
body = "PNGは実寸、2倍、3倍で保存し、改行位置を保ちます。書類に入れるなら写真を内包したSVGも保存できます。鮮明に印刷でき、外部へのリンクはありません。また使うなら、3つ目の保存であるプロフィールのJSONも残してください。"

[[faq]]
q = "Googleが作ったものですか？"
a = "いいえ。このサイトはGoogleと提携、承認、関係を持ちません。GoogleビジネスプロフィールはGoogleの商標で、対象を説明するために使っています。画面の撮影や実際のリスティングではなく、入力内容からブラウザで描いた見本です。Googleアカウントに接続せず、実際のプロフィールは変更しません。変更はGoogleで行ってください。"

[[faq]]
q = "既存のプロフィールを自動で取り込めますか？"
a = "自動取得はできません。サーバーへ取得できるページは入力内容を送信もできるため、このサイトはその能力を持たせていません。リスティングをコピーして貼り付けると、読めた内容を入力して項目を報告します。APIから書き出したJSONも直接開けます。"

[[faq]]
q = "入力内容は送信されますか？"
a = "いいえ。コードに<code>fetch</code>、<code>XMLHttpRequest</code>、<code>sendBeacon</code>はなく、<code>Content-Security-Policy</code>の接続先にこのサイト自身のものはありません。自宅の住所や個人の電話番号を含むことの多いプロフィールなので、特に大切な性質です。"

[[faq]]
q = "見本はどの程度正確ですか？"
a = "収まる内容は正確で、見た目は近似です。実際のGoogle Sansは端末のフォントではなく、検索やマップの更新で間隔も変わります。名前のどこまでが各幅に残るか、狭い表示でもカテゴリを読めるか、どのボタンが付くかを確認できます。"

[[faq]]
q = "新しいリスティングに星がないのはなぜですか？"
a = "実際もそう表示し、空の5つ星は一見1つ星に見えるためです。評価とクチコミ数が空なら「クチコミはまだありません」を表示します。両方に値を入れると、4.6なら4つと5つ目の5分の3のように、正しい割合で星を塗ります。"

[[faq]]
q = "営業中・営業時間外は何から決まりますか？"
a = "入力した1週間の営業時間と、通常はこの端末のローカル時計で決まります。状態は毎分更新します。ローカルの日付と時刻を指定して、週の特定の時間帯を確認することもできます。端末のタイムゾーンを使い、店舗のタイムゾーンへの変換や祝日の特別営業時間には対応しません。店舗が別の地域にある場合は、確認したい現地の時刻を入力してください。この選択は保存するプロフィールのJSONには含まれません。"

[[faq]]
q = "提案書、スライド、報告書に使えますか？"
a = "はい。透かし、アカウント、作成数の制限、このサイトへのリンクはありません。自分の情報を自分の端末で描いた画像です。実際の画面の撮影と誤解しやすいので、渡す相手にはリスティングの見本であることを伝えてください。"

[[faq]]
q = "3つのプレビューの違いは何ですか？"
a = "幅と、それによって残る情報が違います。<strong>ナレッジパネル</strong>はパソコンで名前を検索したとき右側にある広い縦長のカード、<strong>電話のカード</strong>は多くの訪問者が見る表示です。<strong>検索結果</strong>は地図の下の3件の地域検索の1件で、最も狭く、知らない人が競合と比較する場所です。"

[[faq]]
q = "追加した写真は送信されますか？"
a = "いいえ。ページ内でデコードし、カードに合う大きさへキャンバスで描き直し、データとして画像内に埋め込みます。ファイルは端末から出ず、キャンバスにメタデータはないため撮影日時や場所の記録もなくなります。見本はコピーなので原本を残してください。"

[[faq]]
q = "入力を保存して後で続けられますか？"
a = "はい。<em>プロフィールを保存</em>で全項目と写真を含むJSONをディスクに書き、ここで開き直すと戻ります。訪問の間にブラウザへ保存せず、アカウントもありません。住所、電話番号、営業時間をサイトが保持する必要はないためです。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。一度開いて通信を切っても、入力、描画、PNG保存のすべてが動きます。情報を別の場所へ送って描画するツールなら止まるので、送信しないことの確認になります。"

[schema]
description = "ブラウザでGoogleビジネスプロフィールのパネル、電話のカード、地域検索をプレビューします。名前、カテゴリ、評価、クチコミ数、住所、電話番号、ウェブサイト、説明、属性、営業時間、写真から描き、営業状態を計算し、PNGやSVGを保存します。既存のリスティングの貼り付けやAPIの書き出しにも対応します。アップロードは不要です。"
features = ["1つのプロフィールからパネル・電話・地域検索の3つの表示", "日をまたぐ時間を含む1週間から営業状態を計算", "評価の割合で星を塗り、クチコミのない場合は星を非表示", "対応する項目を入力した場合だけ操作ボタンを表示", "既存のリスティングを貼り付け、認識した項目を報告", "GoogleビジネスプロフィールAPIの拠点の書き出しに対応", "写真をページ内で読み、メタデータを除いて内包", "実寸・2倍・3倍のPNGと自己完結したSVG", "JSONをディスクへ保存して再開、ブラウザへの保存やアカウントなし", "オフラインで動作、アップロード・透かし・登録なし"]
