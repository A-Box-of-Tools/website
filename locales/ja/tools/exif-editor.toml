[[privacy]]
title = "写真には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
この道具箱のほかのツールと違い、これには「ウェブアドレスから読み込む」\
      機能も、任意のネットワーク処理も一切ありません。<code>src/</code>のどこにも\
      <code>fetch</code>も<code>XMLHttpRequest</code>も<code>sendBeacon</code>も\
      ありません。"""

[[privacy]]
title = "読み取ったメタデータが外へ読み上げられることはありません。"
body = """
GPSの座標はこのページに表示されるだけで、ほかのどこへも行きません。タグも、\
      ファイル名も、サイズも、件数も運ぶような独自の解析イベントは、この\
      リポジトリのどこにもありません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、写真に関する\
      情報は渡されません。ファイルを読み、解析し、書き直すコードはすべてこの\
      オリジンから配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体をGoogle Fontsから取っています。これはリンク以上の\
      ものではありません。訪問を報告しませんし、閲覧者やファイルに関する情報も\
      渡されません。押さない限り何も起きませんし、押した先は他人のサイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "写真を選びます。"
body = """
選択欄にドロップするか、手で選んでください。ブラウザがディスクから直接\
      読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "中身を読みたければ読みます。"
body = """
気にとめる価値のあるもの、つまりGPSの座標、撮影日時、シリアル番号を\
      「見つかったもの」の一覧にまとめ、そのあとに全タグの表が続きます。"""

[[howto]]
title = "「メタデータをすべて削除」を押します。"
body = """
たいていの方はこれで仕事が終わります。すべてのタグ、XMPとIPTCのブロック、\
      コメント、埋め込みサムネイルが、リスト上のすべての写真から一度に消えます。"""

[[howto]]
title = "消す代わりに、編集することもできます。"
body = """
日付を変える、著作権表示を直す、位置情報だけ落としてカメラの設定は残す。\
      そのうえで、その写真だけを保存できます。"""

[[faq]]
q = "写真はどこかにアップロードされますか？"
a = """
        されません。読み込みも解析も書き直しも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにはネットワーク機能が一切なく、何も\
        取りに行かず、何も送りません。ページの<code>Content-Security-Policy</code>\
        には接続してよいアドレスがすべて挙がっていますが、そのどれも当サイトの\
        ものではありません。"""

[[faq]]
q = "EXIFとは何で、写真にはほかに何が隠れていますか？"
a = """
        EXIFは、カメラが画像の隣に書き込むタグのかたまりです。メーカーと機種、\
        露出の設定、秒単位の日時、多くの場合GPSの座標、ときにはシリアル番号も\
        入っています。写真はそれ以外のものも抱えていることがよくあります。編集ソフト\
        が書いたXMLのXMPパケット、キャプションや署名欄からなるIPTCブロック、カラー\
        プロファイル、サムネイルという小さな複製画像、そして仕様の公開されていない\
        メーカー独自データのメーカーノートです。このツールはそのすべてを一覧に\
        します。"""

[[faq]]
q = "メタデータを削除すると画質は落ちますか？"
a = """
        落ちません。写真を保存し直すのではなく、こういう道具を使う理由がまさに\
        これです。メタデータは圧縮された画像の中ではなく、その周りの入れ物に\
        あります。削除とは一覧から項目を消して一覧を書き戻すことで、圧縮された\
        画像データは1バイトずつそのまま複製されるので、結果はまったく同じ\
        ピクセルにデコードされます。何もデコードされず、何も再圧縮されません。"""

[[faq]]
q = "どのファイル形式に対応していますか？"
a = """
        JPEG、PNG、WebPです。HEICとAVIFは認識しますが書き直しません。入れ子の\
        アトムから成るボックス形式で別の解析器が必要になるため、壊れたファイルを\
        作るのではなく、その旨を表示します。裸のTIFFも扱いません。TIFFでは\
        メタデータとピクセルが同じオフセットで参照されているからです。"""

[[faq]]
q = "メタデータを削除すると写真が回転して表示されませんか？"
a = """
        そうなることがあり、そのための設定があります。スマホはたいてい、センサーが\
        見たままの向きで画像を記録し、どう回すかを示すOrientationタグを添えます。\
        このタグを消すと、ビューアーによっては横向きに表示されます。既定で有効な\
        「向きのタグは残す」を選ぶと、そのタグ1つだけを含む極小のEXIFブロックが\
        書き戻ります。しかも、その写真が実際に必要としていた場合だけです。EXIFを\
        一切持たないファイルにしたい場合は、この設定を外してください。"""

[[faq]]
q = "GPSの位置情報も消えますか？"
a = """
        消えます。すべて削除すればGPSディレクトリ全体が消えますし、位置情報だけを\
        消してほかを残すこともできます。座標はまず十進度で表示します。「51度30分\
        26秒」では、その写真が撮影された建物を名指ししていることが伝わらないから\
        です。"""

[[faq]]
q = "タグを削除せずに書き換えられますか？"
a = """
        できます。文字のタグ、日付、ISO、向き、解像度はどれも編集でき、よく使う\
        いくつかのタグは、持っていない写真に追加することもできます。ひとつだけ注意\
        があります。ファイルを書くとEXIFブロックが作り直されますが、メーカーノートは\
        元のブロック内へのオフセットを含んでいるため、作り直したあとはメーカー純正の\
        ソフトで読めなくなることがあります。それが重要な場合は、メーカーノートを\
        削除するか、そのファイルを編集せずに残してください。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには\
        広告があり、それが費用を賄っています。広告に写真の情報が渡されることは\
        ありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。処理の\
        ために写真をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

[schema]
description = "写真の中のEXIF・GPS・XMP・IPTCのメタデータを読み、個々のタグを編集し、あるいはワンクリックですべて削除します。JPEG・PNG・WebPに対応し、画像をエンコードし直さずにブラウザの中で処理します。"
features = [
  "GPSの座標、カメラのシリアル番号、メーカーノートを含め、すべてのEXIFタグを表示します",
  "個々のタグを編集または削除して、ファイルを書き戻します",
  "EXIF、GPS、XMP、IPTC、コメント、埋め込みサムネイルをワンクリックで削除します",
  "JPEG、PNG、WebPに対応",
  "入れ物だけを書き直すので、画像が再圧縮されることはありません",
  "オフラインで動作。アップロードなし、登録なし",
]

[picker]
title = "ここに写真をドロップ"
hint = "クリックして選ぶこともできます。JPEG、PNG、WebPに対応"
