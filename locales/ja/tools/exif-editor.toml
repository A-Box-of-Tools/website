[[howto]]
title = "中身を読みたければ読みます。"
body = "気にとめる価値のあるもの、つまりGPSの座標、撮影日時、シリアル番号を「見つかったもの」の一覧にまとめ、そのあとに全タグの表が続きます。 JPEG、PNG、WebPではこれらのブロックを一覧表示します。AVIFは抽出できたEXIFだけを表示し、他のメタデータは一覧化しません。"

[[howto]]
title = "「メタデータをすべて削除」を押します。"
body = "JPEG、PNG、WebPの場合：たいていの方はこれで仕事が終わります。すべてのタグ、XMPとIPTCのブロック、コメント、埋め込みサムネイルが、リスト上のすべての写真から一度に消えます。 AVIFはブラウザでデコードし、元のメタデータをコピーせずに新しいPNGとして保存します。抽出できたEXIFタグは閲覧できますが、編集はできません。PNGが大きくなったり、変換で色やHDRの表示が変わったりする場合があります。元のファイルは変わりません。"

[[howto]]
title = "消す代わりに、編集することもできます。"
body = "JPEG、PNG、WebPの場合：日付を変える、著作権表示を直す、位置情報だけ落としてカメラの設定は残す。そのうえで、その写真だけを保存できます。"

[[faq]]
q = "写真はどこかにアップロードされますか？"
a = """
        されません。読み込みも解析も書き直しも、お使いのブラウザが手元の\
        ハードウェア上で行います。このツールにはネットワーク機能が一切なく、何も\
        取りに行かず、何も送りません。ページの<code>Content-Security-Policy</code>\
        には接続してよいアドレスがすべて挙がっていますが、そのどれも当サイトの\
        ものではありません。"""

[[faq]]
q = "EXIFとは何で、写真にはほかに何が隠れていますか？"
a = "JPEG、PNG、WebPの場合：EXIFは、カメラが画像の隣に書き込むタグのかたまりです。メーカーと機種、露出の設定、秒単位の日時、多くの場合GPSの座標、ときにはシリアル番号も入っています。写真はそれ以外のものも抱えていることがよくあります。編集ソフトが書いたXMLのXMPパケット、キャプションや署名欄からなるIPTCブロック、カラープロファイル、サムネイルという小さな複製画像、そして仕様の公開されていないメーカー独自データのメーカーノートです。このツールはそのすべてを一覧にします。 JPEG、PNG、WebPではこれらのブロックを一覧表示します。AVIFは抽出できたEXIFだけを表示し、他のメタデータは一覧化しません。"

[[faq]]
q = "メタデータを削除すると画質は落ちますか？"
a = "JPEG、PNG、WebPの削除はコンテナを編集し、圧縮済み画像データをデコードも再圧縮もせず、バイト単位でコピーします。AVIFは最初の画像をデコードし、元のメタデータをコピーせず、新しい可逆PNGを書き出します。PNGが大きくなったり、ブラウザのデコードで色やHDRの表現が変わったりする場合があります。元のファイルは変わりません。"

[[faq]]
q = "どのファイル形式に対応していますか？"
a = "JPEG、PNG、WebPはメタデータの閲覧、編集、コンテナ内での削除に対応します。AVIFは抽出できたEXIFのプレビューと、新しいPNGへの変換による削除に対応します。AVIFタグは読み取り専用で、他のメタデータは一覧化しません。アニメーションAVIFは最初の画像だけを使います。HEICと単独のTIFFは識別しますが書き直しません。"

[[faq]]
q = "メタデータを削除すると写真が回転して表示されませんか？"
a = "JPEG、PNG、WebPでは、必要に応じて向きのタグだけを小さなEXIFブロックに残します。削除するには設定をオフにしてください。AVIFはブラウザが正しい向きでデコードした画像からPNGを作ります。向きとカラープロファイルの設定はJPEG、PNG、WebPだけに適用されます。"

[[faq]]
q = "GPSの位置情報も消えますか？"
a = "削除操作でGPS情報も除去します。JPEG、PNG、WebPでは位置情報だけを削除し、他の項目を残すこともできます。AVIFタグは読み取り専用で、PNGへの変換は元のメタデータをコピーしません。"

[[faq]]
q = "タグを削除せずに書き換えられますか？"
a = "JPEG、PNG、WebPはタグの編集と追加に対応します。メーカーノートの再構築でメーカー独自のオフセットが無効になる場合があるため、必要なら元のファイルを残してください。AVIFのEXIFは読み取り専用です。削除時はAVIFコンテナを書き直さず、元のメタデータをコピーしないPNGを作ります。"

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには\
        広告があり、それが費用を賄っています。広告に写真の情報が渡されることは\
        ありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。処理の\
        ために写真をどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

