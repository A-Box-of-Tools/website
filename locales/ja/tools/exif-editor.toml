[[howto]]
title = "「メタデータをすべて削除」を押します。"
body = """
 たいていの方はこれで\
      仕事は終わりです。すべてのタグ、XMP と IPTC のブロック、コメント、埋め込み\
      サムネイルが、リスト上のすべての写真から一度に消えます。"""

[[howto]]
title = "あるいは、消す代わりに編集します。"
body = """
 日付を変える、著作権表示を\
      直す、位置情報だけ落としてカメラの設定は残す &mdash; そのうえで、その写真\
      だけを保存できます。"""

[[faq]]
q = "写真はどこかにアップロードされますか？"
a = """
        されません。ファイルの読み込みも解析も書き直しも、あなた自身のブラウザが\
        あなた自身のハードウェア上で行います。このツールにはネットワーク機能が\
        一切なく &mdash; 何も取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "EXIF とは何で、写真にはほかに何が隠れていますか？"
a = """
        EXIF は、カメラが画像の隣に書き込むタグのかたまりです。メーカーと機種、\
        露出の設定、秒単位の日時、多くの場合 GPS の座標、ときにはシリアル番号も\
        入っています。写真はそれ以外のものも抱えていることがよくあります &mdash;
        編集ソフトが書いた XML の XMP パケット、キャプションや署名欄からなる
        IPTC ブロック、カラープロファイル、サムネイルという小さな複製画像、\
        そして仕様の公開されていないメーカー独自データのメーカーノートです。\
        このツールはそのすべてを一覧にします。"""

[[faq]]
q = "メタデータを削除すると画質は落ちますか？"
a = """
        落ちません。写真を保存し直すのではなくこういう道具を使う理由が、まさに\
        これです。メタデータは圧縮された画像の中ではなく、その周りの入れ物に\
        あります。削除とは一覧から項目を消して一覧を書き戻すことで、圧縮された\
        画像データは1バイトずつそのまま複製されるので、結果はまったく同じ\
        ピクセルに復号されます。何も復号されず、何も再圧縮されません。"""

[[faq]]
q = "どのファイル形式に対応していますか？"
a = """
        JPEG、PNG、WebP です。HEIC と AVIF は認識しますが書き直しません。入れ子の\
        アトムから成るボックス形式で別の解析器が必要になるため、壊れたファイルを\
        作るのではなく、その旨を表示します。裸の TIFF も扱いません。TIFF では\
        メタデータとピクセルが同じオフセットで参照されているからです。"""

[[faq]]
q = "メタデータを削除すると写真が回転して表示されませんか？"
a = """
        そうなることがあり、そのための設定があります。スマホはたいてい、センサーが\
        見たままの向きで画像を記録し、どう回すかを示す Orientation タグを添えます。\
        このタグを消すと、ビューアーによっては横向きに表示されます。既定で有効な\
        「向きのタグは残す」を選ぶと、そのタグ1つだけを含む極小の EXIF ブロックが\
        書き戻されます &mdash; しかも、その写真が実際に必要としていた場合だけです。
        EXIF を一切持たないファイルにしたい場合は、この設定を外してください。"""

[[faq]]
q = "GPS の位置情報も消えますか？"
a = """
        消えます。すべて削除すれば GPS ディレクトリ全体が消えますし、位置情報だけを\
        消してほかを残すこともできます。座標はまず十進度で表示します。「51度30分26秒」\
        では、その写真が撮影された建物を名指ししていることが伝わらないからです。"""

[[faq]]
q = "タグを削除せずに書き換えられますか？"
a = """
        できます。文字のタグ、日付、ISO、向き、解像度はどれも編集でき、よく使う\
        いくつかのタグは、持っていない写真に追加することもできます。ひとつだけ注意\
        があります。ファイルを書くと EXIF ブロックが作り直されますが、メーカーノートは\
        元のブロック内へのオフセットを含んでいるため、作り直したあとはメーカー純正の\
        ソフトで読めなくなることがあります。それが重要な場合は、メーカーノートを\
        削除するか、そのファイルを編集せずに残してください。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もありません。このサイトには\
        広告があり、それが費用を賄っています。広告にあなたの写真に関する情報が\
        渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。処理のために写真をどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

[schema]
description = "写真の中の EXIF・GPS・XMP・IPTC のメタデータを読み、個々のタグを編集し、あるいはワンクリックですべて削除します。JPEG・PNG・WebP に対応し、画像を再エンコードせずにブラウザ内で処理します。"
features = [
  "GPS の座標、カメラのシリアル番号、メーカーノートを含め、すべての EXIF タグを表示します",
  "個々のタグを編集または削除して、ファイルを書き戻します",
  "EXIF、GPS、XMP、IPTC、コメント、埋め込みサムネイルをワンクリックで削除します",
  "JPEG、PNG、WebP に対応",
  "入れ物だけを書き直すので、画像が再圧縮されることはありません",
  "オフラインで動作。アップロードなし、登録なし",
]

