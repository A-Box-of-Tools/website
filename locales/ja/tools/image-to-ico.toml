text = "ソース公開"

[[privacy]]
title = "ロゴには出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      挙がっていますが、そのどれも当サイトのものではありません。ファイルを\
      集めるための受け口はここになく、あったとしても送るコードがありません。"""

[[privacy]]
title = "何かを取りに行くコードがありません。"
body = """
<code>src/</code>のどこにも<code>fetch</code>も<code>XMLHttpRequest</code>も\
      <code>sendBeacon</code>もありません。縮小はキャンバスへの\
      <code>drawImage</code>で、各アイコンはそのピクセルの前に\
      <code>src/ico.js</code>か<code>src/icns.js</code>がこのページの中でヘッダーを\
      書いたものです。"""

[[privacy]]
title = "ファイルの説明は、そのファイル自身のバイト列から作っています。"
body = """
できあがったアイコンの横に並ぶサイズの一覧は、指定したサイズの一覧では\
      ありません。いま書いたばかりのファイルから<code>readIcoDirectory</code>や\
      <code>readIcnsElements</code>が読み返したものです。ですから書き手が設定と\
      食い違うことがあれば、Windowsが何も描かずmacOSが白紙を描いたときに気づくの\
      ではなく、その場でページがそう伝えます。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから、寄付ボタンはBuy Me a Coffeeから来て\
      います。そのどれにも、画像に関する情報は渡されません。ファイルを読み、\
      縮小し、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切ってもこのツールは何も変わりません。もともと通信する段階が存在\
      しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
PNG、JPEG、WebP、SVGを選択欄にドロップするか、複数選んで一度に変換して\
      ください。正方形がいちばん扱いやすく、256ピクセル以上あればどのサイズにも\
      十分な情報が入っています。ブラウザがディスクから直接読み出します。その間に\
      何かがどこかへ送られることはありません。"""

[[howto]]
title = "必要なファイルを選びます。"
body = """
Windowsとブラウザが読むのは<code>.ico</code>、Macが読むのは\
      <code>.icns</code>で、こちらはもう一方を見向きもしません。どちらか、あるいは\
      両方に配るものなら両方にチェックを入れてください。ウェブサイトにはApple、\
      Android、タイル用の画像も必要で、それが3つ目のチェックです。"""

[[howto]]
title = "そのアイコンが何のためのものかを決めます。"
body = """
ウェブサイトのファビコンは16、32、48ピクセル。Windowsのアプリケーションは\
      それに加えて256を求めます。高DPIのノートPCできちんと見せたいアプリケーション\
      なら、Windowsが125%と150%の拡大時に求める中間サイズも要ります。仕事に合う\
      ものを選ぶか、サイズを自分で選んでください。一覧のどのサイズにも、それを\
      求めているのが何なのかを書いてあります。<code>.icns</code>にこの選択は\
      ありません。Appleがちょうど10個の枠を定めていて、その10個すべてが入るからです。"""

[[howto]]
title = "形と背景を決めます。"
body = """
アイコンは正方形ですが、ロゴの多くはそうではありません。余白を足せば、上下に\
      空きを作って画像全体が残ります。切り抜けば中央が取られ、引き伸ばせば潰れます。\
      透過は、後ろに置く色を選ばない限り透過のまま保たれます。"""

[[howto]]
title = "ダウンロードの前に、16ピクセルのものを見てください。"
body = """
そのアイコンがいちばんよく目にされる大きさであり、細い線や小さな文字が\
      消えるのもそこです。プレビューの各正方形は、選んだファイルから実寸で描いて\
      います。いちばん小さいものがにじみになっているなら、直すべきは設定ではなく、\
      もっと単純な絵にすることです。"""

[[howto]]
title = "ファイルを受け取ります。"
body = """
すべてのサイズを収めた.icoが1つ、そう指定した場合は\
      <code>favicon.ico</code>という名前で出てきます。ブラウザが探しに行くアドレスが\
      それだからです。macOSアイコンにチェックを入れていれば、その隣に、Macの\
      アプリケーションバンドルへそのまま入れられる.icnsが出ます。ウェブサイト用一式に\
      もチェックを入れれば、Apple、Android、Windowsタイルの画像、マニフェスト、\
      そしてページに貼るHTMLのかたまりまで付いてきます。ファイルが2つ以上になる\
      場合は、1つのzipにまとめて届きます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みと縮小はお使いのブラウザが手元のハードウェア上で\
        行い、.icoはこのページから配信されたコードがそのピクセルから組み立てます。\
        このツールにはネットワーク機能が一切なく、何も取りに行かず、何も送りません。\
        ページの<code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "favicon.icoにはどのサイズを入れるべきですか？"
a = """
        16、32、48です。これは好みの問題ではありません。16はブラウザがタブに描く\
        大きさ、32はWindowsがデスクトップのショートカットに使い、いくつかのブラウザが\
        ブックマークに使う大きさ、48はGoogleがサイトのアイコンを読む大きさです。それ\
        より大きいものは.icoの中ではなく、その隣のPNGに置くべきです。ここのウェブ\
        サイト用一式が作るのが、まさにそれです。"""

[[faq]]
q = "Windowsのアプリケーションアイコンにはどのサイズが必要ですか？"
a = """
        16、32、48、256です。Visual Studioが既定で用意するapp.icoの中身もこれです。\
        16はタイトルバーとエクスプローラーの小アイコン、32はデスクトップとタスクバー、\
        48はエクスプローラーの中アイコン、256はスタートメニューと特大表示です。高DPIの\
        ディスプレイではWindowsは20、24、40、64、96も求め、なければ手持ちのいちばん\
        近いサイズから作り直します。「すべての拡大率」のプリセットは、それらを入れます。"""

[[faq]]
q = "元の画像よりファイルが大きくなるのはなぜですか？"
a = """
        .icoは1枚の画像ではなく複数枚であり、しかも小さいものは何でも読めるように\
        非圧縮で保存するからです。32×32のエントリは中身が何であれきっかり4,264バイト、\
        256×256の非圧縮エントリは264KBになります。だから64を超えるサイズは既定でPNG\
        として保存します。「すべてのサイズをPNGに」を選べばいちばん小さいファイルに、\
        「すべて非圧縮」を選べばいちばん互換性の高いファイルになります。"""

[[faq]]
q = "PNGのエントリと非圧縮のエントリは何が違うのですか？"
a = """
        .icoの中でピクセルをどう保存するかだけです。非圧縮のエントリはWindows本来の\
        並べ方、つまりビットマップのヘッダー、上下逆さのピクセル、1ビットの透過マスク\
        で、これまでに出たすべてのWindowsが読めます。PNGのエントリはアイコンの中に\
        PNGファイルを丸ごと入れたもので、大きなサイズでは3分の1から10分の1になりますが、\
        理解されるようになったのはWindows Vistaからです。既定では、それぞれが勝つ場所\
        で使います。64ピクセルまでは非圧縮、それより上はPNGです。"""

[[faq]]
q = "256ピクセルより大きいアイコンは作れますか？"
a = """
        作れませんし、どんな道具にも作れません。この形式は一辺を1バイトで保存し、\
        しかも0は予約済みで、256を意味します。それが天井なので、512ピクセルの画像が\
        入った.icoは「大きなアイコン」ではなく壊れたアイコンです。512が必要なら、\
        必要なのはPNGのほうです。それはウェブサイト用一式に、Androidとウェブアプリの\
        スプラッシュ画面のために入っています。"""

[[faq]]
q = "透過は保たれますか？"
a = """
        どちらの種類のエントリでも保たれます。さらに、アルファチャンネルの隣に昔\
        ながらの1ビットマスクも書きます。アルファを読めないほど古いソフトでも、黒い\
        四角を描くのではなくアイコンを切り抜けるようにするためです。意図的に不透明に\
        する唯一のファイルは、ウェブサイト用一式の中のAppleタッチアイコンです。iOSは\
        それを自分のタイルに合成し、透過を黒に変えてしまうので、既定では白の背景色に\
        合成して平らにします。"""

[[faq]]
q = "ロゴが横長のワードマークです。どうなりますか？"
a = """
        何かをするしかありません。アイコンは正方形だからです。余白を足せば全体は\
        残りますが小さくなります。16ピクセルの正方形に収めたワードマークは高さ3\
        ピクセルほどで、読めません。中央で切り抜くほうがたいていうまくいきます。\
        組み合わせからシンボルだけを取り出して使う、ほとんどのブランドがファビコンに\
        対してしているやり方です。どちらが生き残るのかは、何かをダウンロードする前に\
        プレビューでわかります。"""

[[faq]]
q = "ウェブサイト用一式には何が入っていて、全部必要ですか？"
a = """
        7つのPNG、ウェブアプリのマニフェスト、browserconfig.xml、そして貼り付ける\
        HTMLのかたまりです。必要な理由は、.icoがブラウザとWindowsしかカバーしない\
        からです。iPhoneのホーム画面は独自の名前で180ピクセルのPNGを読み、Androidと\
        すべてのインストール案内はマニフェストを読み、スタートメニューに固定された\
        タイルはXMLを読みます。そのどれも.icoの中を見ません。すべてここで、手元の\
        端末で生成し、zipの中には各ファイルの用途を書いたメモを入れてあります。"""

[[faq]]
q = "macOSのアイコンも作れますか？"
a = """
        作れます。<em>macOSアイコン</em>にチェックを入れると、<code>.ico</code>の隣に、\
        あるいはその代わりに<code>.icns</code>が出てきます。同じ考えに対する別の\
        入れ物で、どちらのシステムも相手のものを読みません。Windowsは.icoを求め、Macの\
        アプリケーションバンドルは.icnsを求めます。そちらではサイズを選べません。Apple\
        がちょうど10個の枠を公開しているからです。16、32、64、128、256、512、1024\
        ピクセルで、そのうち3つは1段下のサイズのRetina版として2度ずつ登場します。7回の\
        描画から10個すべてを作ります。.icnsのほうがファイルが大きいのは、そのためです。"""

[[faq]]
q = ".icnsファイルはどう使えばいいですか？"
a = """
        アプリケーションなら、バンドルの\
        <code>YourApp.app/Contents/Resources/</code>に置き、\
        <code>Info.plist</code>の<code>CFBundleIconFile</code>で名前を指定します。Mac用の\
        パッケージングツールにはどれもその欄があります。それ以外では、Finderでファイルを\
        選んでcommand + Cを押し、変えたいフォルダやディスクイメージで「情報を見る」を\
        開き、左上の小さなアイコンをクリックしてからcommand + Vを押してください。"""

[[faq]]
q = "この.icnsはiconutilが作るものと同じですか？"
a = """
        同じ10個の枠、同じ4文字のタイプ、そしてそれぞれにPNGが入っています。\
        <code>iconutil</code>が<code>.iconset</code>フォルダから作るものと同じです。\
        意図した違いがひとつあります。Appleのツールは<code>TOC&nbsp;</code>要素も\
        書きます。後続する要素のタイプと長さの索引です。これは形式の一部というより\
        最適化で、索引を持たない読み手は要素を端から辿って同じ答えにたどり着きます。\
        誤った索引は索引がないより悪いので、入れていません。"""

[[faq]]
q = "複数の画像を一度に変換できますか？"
a = """
        できます。リスト上のどの画像も同じ設定で自分の.icoになり、まとめて1つのzipに、\
        画像ごとのフォルダに分けて届きます。そうしないと2つがどちらもfavicon.icoという\
        名前になり、一方がもう一方を上書きしてしまうからです。チェックを入れた出力は、\
        どの画像に対しても作ります。行をクリックすれば、その画像をプレビューに出せます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。ファイル\
        の数にもサイズにも制限はありません。その費用を払うサーバーが存在せず、処理が\
        手元の端末で起きているからです。このサイトには広告があり、それが費用を賄って\
        います。広告に画像の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。何も\
        アップロードされていないことを示す、いちばん簡単な方法でもあります。変換の\
        ためにロゴをどこかへ送っている道具なら、線を抜いた瞬間に止まるからです。"""

