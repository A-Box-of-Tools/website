name = "画像を ICO に"
# 後半の span が検索される語です。
heading = "画像を&nbsp;ICO&nbsp;に <span class=\"h1-kw\">&mdash; ファビコン作成・Windows と macOS のアイコン</span>"
tagline = "画像を1枚入れれば、ブラウザや Windows や Mac が求めるすべてのサイズが出てきます。"

title = "画像を ICO に &mdash; ファビコン・アプリアイコン・ICNS 作成、アップロード不要"
description = "PNG・JPEG・SVG を、複数サイズを収めた本物の .ico や macOS の .icns にブラウザ内で変換します。ファビコン、Windows のアプリアイコン、Mac のアプリアイコン、さらにサイトに必要な Apple と Android 向けファイルも。アップロードはありません。"
og_title = "すべてのサイズを収めた .ico や .icns を、何もアップロードせずに作る"
og_description = "ウェブサイト用の favicon.ico、Windows プログラム用の app.ico、Mac 用の .icns を。ダウンロードの前に16ピクセルでの見え方も確認できます。すべてあなた自身の端末で動きます。"
og_image_alt = "画像を ICO に - ファビコン、Windows と macOS のアイコン作成、アップロードなし"

pledge = """
    縮小もアイコンファイルの組み立ても、どちらもあなた自身のブラウザの中で\
    行われます。画像はブラウザにすでに入っているキャンバスが描き、それぞれの\
    入れ物 &mdash; Windows の <code>.ico</code>、macOS の <code>.icns</code>
    &mdash; は、あなたが読める数百行の <code>src/ico.js</code> と
    <code>src/icns.js</code> がそのピクセルから組み立てます。このツールには\
    ネットワーク機能が一切ありません &mdash; 取りに行く先も、送る先もありません
    &mdash; 仮に送ろうとしても、このページの向こう側にロゴを受け取るサーバーは\
    存在しません。"""

live_hint = """
      鵜呑みにする必要はありません。DevTools を開いてネットワークタブを見ながら\
      アイコンを作ってみてください。画像も、サムネイルも、ファイル名も、選んだ\
      ファイルの1バイトも、どのリクエストにも載りません。あるいは回線を抜いてから\
      作ってみてください。"""

read_first = """
、2つのアイコン形式については <code>src/ico.js</code> と
      <code>src/icns.js</code> &mdash; 一方はディレクトリとエントリとマスク、\
      もう一方は Apple が定めた10個の枠です &mdash; そしてページ上のすべての\
      サイズがどこから来ているかについては <code>src/sizes.js</code> です。"""

howto_heading = "何もアップロードせずに .ico ファイルを作る手順"

card = """
            ファビコン、Windows のアプリアイコン、macOS の .icns &mdash;
            すべてのサイズを1つのファイルに。ダウンロード前に16ピクセルでの\
            見え方も確認できます。"""

[words]
plural = "画像"
choose = "画像"
analytics_extra = """、このツールが\
  割り出したサイズも形式もファイル名も送られません"""

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "透かしなし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[privacy]]
title = "ロゴには出ていく先がありません。"
body = """
 Content-Security-Policy
      はこのページが接続してよいアドレスをすべて挙げていますが、そのどれも\
      当サイトのものではありません。あなたのファイルを集めるための受け口は\
      ここにはなく、あったとしても送るコードがありません。"""

[[privacy]]
title = "ここには何かを取りに行くコードがありません。"
body = """
 <code>src/</code> の\
      どこにも <code>fetch</code> も <code>XMLHttpRequest</code> も
      <code>sendBeacon</code> もありません。縮小はキャンバスへの
      <code>drawImage</code> で、各アイコンはそのピクセルの前に
      <code>src/ico.js</code> か <code>src/icns.js</code> がこのページの中で\
      ヘッダーを書いたものです。"""

[[privacy]]
title = "ファイルの説明は、そのファイル自身のバイト列から作っています。"
body = """
 できあがったアイコンの\
      横に並ぶサイズの一覧は、あなたが指定したサイズの一覧ではありません。いま\
      書いたばかりのファイルから <code>readIcoDirectory</code> や
      <code>readIcnsElements</code> が読み返したものです。ですから、書き手が\
      設定と食い違うことがあれば、Windows が何も描かず macOS が白紙を描いたとき\
      に気づくのではなく、その場でページがそう伝えます。"""

[[privacy]]
title = "Google が読み込むもの、そして渡されないもの。"
body = """
 広告と計測の\
      スクリプトは Google から、寄付ボタンは Buy Me a Coffee から来ています。\
      そのどれにも、あなたの画像に関する情報は渡されません。ファイルを読み、\
      縮小し、書き出すコードはすべてこのオリジンから配信され、リポジトリに\
      載っています。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
 通信を切ってもこのツールは何も変わりません。\
      もともと通信する段階が存在しないからです。これがいちばん単純な証明です。"""

[[howto]]
title = "画像を選びます。"
body = """
 PNG、JPEG、WebP、SVG を選択欄にドロップするか、\
      複数選んで一度に変換してください。正方形がいちばん扱いやすく、256ピクセル\
      以上あればどのサイズにも十分な情報が入っています。ブラウザがディスクから\
      直接読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "必要なファイルを選びます。"
body = """
 Windows とブラウザが読むのは
      <code>.ico</code>、Mac が読むのは <code>.icns</code> で、こちらは\
      もう一方を見向きもしません。どちらか、あるいは両方に配るものなら両方に\
      チェックを入れてください。ウェブサイトには Apple、Android、タイル用の画像も\
      必要で、それが3つ目のチェックです。"""

[[howto]]
title = "そのアイコンが何のためのものかを言います。"
body = """
 ウェブサイトのファビコンは
      16、32、48ピクセル。Windows のアプリケーションはそれに加えて256を求めます。\
      高DPIのノートPCできちんと見せたいアプリケーションは、Windows が125%と150%の\
      拡大時に求める中間サイズも必要です。仕事に合うものを選ぶか、サイズを自分で\
      選んでください。一覧のどのサイズにも、それを求めているのが何かが書いてあります。
      <code>.icns</code> にはこの選択がありません。Apple がちょうど10個の枠を定めて\
      いて、その10個すべてが入るからです。"""

[[howto]]
title = "形と背景を決めます。"
body = """
 アイコンは正方形ですが、ロゴの多くはそうでは\
      ありません。余白を足せば、上下に空きを作って画像全体が残ります。切り抜けば\
      中央が取られ、引き伸ばせば潰れます。透過は、後ろに置く色を選ばない限り透過の\
      まま保たれます。"""

[[howto]]
title = "ダウンロードの前に、16ピクセルのものを見てください。"
body = """
 そのアイコンが\
      いちばんよく目にされる大きさであり、細い線や小さな文字が消えるのもそこです。\
      プレビューの各正方形は、あなたのファイルから実寸で描かれています。いちばん\
      小さいものがにじみになっているなら、直すべきは設定ではなく、もっと単純な\
      絵にすることです。"""

[[howto]]
title = "ファイルを受け取ります。"
body = """
 すべてのサイズを収めた .ico が1つ、\
      そう指定した場合は <code>favicon.ico</code> という名前で出てきます。\
      ブラウザが探しに行くアドレスがそれだからです。macOS アイコンにチェックを\
      入れていれば、その隣に Mac のアプリケーションバンドルへそのまま入れられる
      .icns が出ます。ウェブサイト用一式にもチェックを入れれば、Apple、Android、
      Windows タイルの画像、マニフェスト、そしてページに貼る HTML のかたまりも\
      付いてきます。ファイルが2つ以上になる場合は、1つの zip にまとめて届きます。"""

[[faq]]
q = "画像はどこかにアップロードされますか？"
a = """
        されません。画像の読み込みと縮小はあなた自身のブラウザがあなた自身の\
        ハードウェア上で行い、.ico はこのページから配信されたコードがそのピクセル\
        から組み立てます。このツールにはネットワーク機能が一切なく &mdash; 何も\
        取りに行かず、何も送りません &mdash; ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが、そのどれも当サイトのものではありません。"""

[[faq]]
q = "favicon.ico にはどのサイズを入れるべきですか？"
a = """
        16、32、48です。これは好みの問題ではありません。16はブラウザがタブに描く\
        大きさ、32は Windows がデスクトップのショートカットに使い、いくつかの\
        ブラウザがブックマークに使う大きさ、48は Google がサイトのアイコンを読む\
        大きさです。それより大きいものは .ico の中ではなく、その隣の PNG に\
        置くべきです &mdash; ここのウェブサイト用一式が作るのが、まさにそれです。"""

[[faq]]
q = "Windows のアプリケーションアイコンにはどのサイズが必要ですか？"
a = """
        16、32、48、256です。Visual Studio が既定で用意する app.ico の中身も\
        これです。16はタイトルバーとエクスプローラーの小アイコン、32はデスクトップと\
        タスクバー、48はエクスプローラーの中アイコン、256はスタートメニューと特大\
        表示です。高DPIのディスプレイでは Windows は20、24、40、64、96も求め、\
        なければ手持ちのいちばん近いサイズから作り直します &mdash;
        「すべての拡大率」のプリセットは、それらを入れます。"""

[[faq]]
q = "元の画像よりファイルが大きくなるのはなぜですか？"
a = """
        .ico は1枚の画像ではなく複数枚であり、しかも小さいものは何でも読めるように\
        非圧縮で保存されるからです。32×32のエントリは中身が何であれきっかり4,264
        バイトで、256×256の非圧縮エントリは264KBになります &mdash; だから64を\
        超えるサイズは既定で PNG として保存されます。「すべてのサイズを PNG に」を\
        選べばいちばん小さいファイルになり、「すべて非圧縮」を選べばいちばん互換性の\
        高いファイルになります。"""

[[faq]]
q = "PNG のエントリと非圧縮のエントリは何が違うのですか？"
a = """
        .ico の中でピクセルをどう保存するかだけです。非圧縮のエントリは Windows
        本来の並べ方 &mdash; ビットマップのヘッダー、上下逆さのピクセル、1ビットの\
        透過マスク &mdash; で、これまでに出たすべての Windows が読めます。PNG の\
        エントリはアイコンの中に PNG ファイルを丸ごと入れたもので、大きなサイズでは
        3分の1から10分の1になりますが、理解されるようになったのは Windows Vista
        からです。既定では、それぞれが勝つ場所で使います。64ピクセルまでは非圧縮、\
        それより上は PNG です。"""

[[faq]]
q = "256ピクセルより大きいアイコンは作れますか？"
a = """
        作れませんし、どんな道具にも作れません。この形式は一辺を1バイトで保存し、\
        しかも0は予約済みです &mdash; 256を意味します。それが天井なので、512
        ピクセルの画像が入った .ico は「大きなアイコン」ではなく壊れたアイコンです。
        512が必要なら必要なのは PNG で、それはウェブサイト用一式に、Android と\
        ウェブアプリのスプラッシュ画面のために入っています。"""

[[faq]]
q = "透過は保たれますか？"
a = """
        どちらの種類のエントリでも保たれます。さらに、アルファチャンネルの隣に\
        昔ながらの1ビットマスクも書きます。アルファを読めないほど古いソフトでも、\
        黒い四角を描くのではなくアイコンを切り抜けるようにするためです。意図的に\
        不透明にする唯一のファイルは、ウェブサイト用一式の中の Apple タッチ\
        アイコンです。iOS はそれを自分のタイルに合成し、透過を黒に変えてしまうので、\
        既定では白の背景色に合成して平らにします。"""

[[faq]]
q = "ロゴが横長のワードマークです。どうなりますか？"
a = """
        何かをするしかありません。アイコンは正方形だからです。余白を足せば全体は\
        残りますが小さくなります &mdash; 16ピクセルの正方形に収めたワードマークは\
        高さ3ピクセルほどで、読めません。中央で切り抜くほうがたいていうまくいきます。\
        組み合わせからシンボルだけを取り出して使う、ほとんどのブランドがファビコンに\
        対してしているやり方です。どちらが生き残るかは、何かをダウンロードする前に\
        プレビューでわかります。"""

[[faq]]
q = "ウェブサイト用一式には何が入っていて、全部必要ですか？"
a = """
        7つの PNG、ウェブアプリのマニフェスト、browserconfig.xml、そして貼り付ける
        HTML のかたまりです。必要な理由は、.ico がブラウザと Windows しか\
        カバーしないからです。iPhone のホーム画面は独自の名前で180ピクセルの PNG を\
        読み、Android とすべてのインストール案内はマニフェストを読み、スタート\
        メニューに固定されたタイルは XML を読みます。そのどれも .ico の中を見ません。\
        すべてここで、あなたの端末で生成され、zip の中には各ファイルの用途を書いた\
        メモが入っています。"""

[[faq]]
q = "macOS のアイコンも作れますか？"
a = """
        作れます &mdash; <em>macOS アイコン</em> にチェックを入れると、
        <code>.ico</code> の隣に、あるいはその代わりに <code>.icns</code> が\
        出てきます。同じ考えに対する別の入れ物で、どちらのシステムも相手のものを\
        読みません。Windows は .ico を求め、Mac のアプリケーションバンドルは .icns
        を求めます。そちらではサイズを選べません。Apple がちょうど10個の枠を公開して\
        いるからです &mdash; 16、32、64、128、256、512、1024ピクセルで、そのうち
        3つは1段下のサイズの Retina 版として2度ずつ登場します。7回の描画から10個\
        すべてを作ります。.icns のほうがファイルが大きいのは、そのためです。"""

[[faq]]
q = ".icns ファイルはどう使えばいいですか？"
a = """
        アプリケーションなら、バンドルの
        <code>YourApp.app/Contents/Resources/</code> に置き、
        <code>Info.plist</code> の <code>CFBundleIconFile</code> で名前を指定\
        します。Mac 用のパッケージングツールにはどれもその欄があります。それ以外\
        では、Finder でファイルを選んで Command-C を押し、変えたいフォルダーや\
        ディスクイメージで「情報を見る」を開き、左上の小さなアイコンをクリック\
        してから Command-V を押してください。"""

[[faq]]
q = "この .icns は iconutil が作るものと同じですか？"
a = """
        同じ10個の枠、同じ4文字のタイプ、そしてそれぞれに PNG が入っています。
        <code>iconutil</code> が <code>.iconset</code> フォルダーから作るものと\
        同じです。意図的な違いがひとつあります。Apple のツールは
        <code>TOC&nbsp;</code> 要素も書きます。後続する要素のタイプと長さの索引\
        です。これは形式の一部というより最適化で &mdash; 索引を持たない読み手は\
        要素を端から辿って同じ答えにたどり着きます &mdash; 誤った索引は索引が\
        ないより悪いので、入れていません。"""

[[faq]]
q = "複数の画像を一度に変換できますか？"
a = """
        できます。リスト上のどの画像も同じ設定で自分の .ico になり、まとめて1つの
        zip に、画像ごとのフォルダーに分けて届きます &mdash; そうしないと2つが\
        どちらも favicon.ico という名前になり、一方がもう一方を上書きしてしまう\
        からです。チェックを入れた出力は、どの画像に対しても作られます。行を\
        クリックすれば、その画像をプレビューに出せます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        ファイルの数にもサイズにも制限はありません。その費用を払うサーバーが\
        存在しないからです &mdash; 処理はあなた自身の端末で起きています。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        画像に関する情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        これは、何もアップロードされていないことを示すいちばん簡単な方法でも\
        あります。変換のためにロゴをどこかへ送っている道具なら、線を抜いた\
        瞬間に止まるからです。"""

