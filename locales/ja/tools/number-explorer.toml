#
# 数字エクスプローラー - Japanese.
#
# Overrides for tools/number-explorer/tool.toml. Only words: the slug, the
# category, the icon and the list of shared parts stay where they are.
#
# Every figure here was carried over by value and not by word: a billion is
# 10億 and a trillion is 1兆. Japanese counts in fours, so 54.6 million is
# 5460万 and not a translation of "million".
#

name = "数字エクスプローラー"
heading = "数字エクスプローラー <span class=\"h1-kw\">&mdash; 100万、10億、その先を思い描く</span>"
tagline = "好きな数字を入力して、育っていく様子を見てください。積み上げた本、注がれる水、満天の星、砂の山、とても長いカウントになります。"

title = "数字の可視化ツール——100万や10億の大きさがわかる——無料・オフライン"
description = "数字が本当はどれくらい大きいのかを見てみましょう。積み上げた本、注がれる水、満天の星、砂の山、数えるのにかかる時間として育ち、エベレストから天の川銀河までの目印と並びます。無料でオフラインでも使えます。"
og_title = "10億ってどれくらい？"
og_description = "とても大きな数字を、目に見えるものに変えます。本、水、星、砂、時間で、前提を明示し、AIもアップロードも使いません。"
og_image_alt = "数字エクスプローラー - 大きな数字を本、水、星、砂、時間で表す"

pledge = "比較とは、数と選んだ基準と少しの計算のことで、そのすべてがこのページの中にあります。問い合わせるAIサービスも、アップロードする入力もありません。本、水、星、砂、数える時間はそれぞれ別々に扱い、前提は絵の裏に隠さず結果のそばに書いています。"
live_hint = "ネットワークタブを開いたまま数字を変えてみてください。計算機はリクエストを送りません。ページを一度読み込んだら接続を切って、そのまま続けられます。"
read_first = "、数の読み取りとモデルと目印については<code>src/scale.js</code>、色の付いた面積が何を測るかについては<code>src/containers.js</code>、絵については<code>src/stage.js</code>と<code>src/scene-*.js</code>の各ファイル、ページのつながりについては<code>src/main.js</code>です。"
howto_heading = "大きな数字を絵にする方法"
card = "本を10億冊積むとどれくらいの高さ？水滴10億個はどれくらいの水？好きな数字を入力すると、本、水、星、砂、時間に育っていきます。前提もいつでも見られます。"

[words]
plural = "数字と比較"
choose = "数字"

[[facts]]
text = "オフラインで動作"
[[facts]]
text = "AIやAPIの費用なし"
[[facts]]
text = "前提が明確"
[[facts]]
text = "絵を保存"
[[facts]]
text = "オープンソース"

[[privacy]]
title = "計算機はこのブラウザの中で動きます。"
body = "ツールの処理コードは、結果の計算と絵の描画を手元の端末で行います。入力や結果をどのサービスにも送りません。Content-Security-Policyは接続先を制限しますが中身は検査しません。ソースをネットワークタブと見比べるか、接続を切って計算機を使ってみてください。"
[[privacy]]
title = "モデルもオンライン検索もありません。"
body = "目印と計算式はこのページと一緒に届きます。比較はその一覧に対する計算で選ばれます。出典のリンクは、読もうと選んだときにだけ開きます。"
[[privacy]]
title = "入力はページの中にとどまります。"
body = "計算機は入力をストレージにもアドレスバーにも書き込みません。再読み込みすると最初に戻ります。保存した絵は、自分で手元の端末に残すファイルです。"
[[privacy]]
title = "サイトのほかのスクリプトには、それぞれの境界があります。"
body = "ページの枠組みは広告、計測、寄付のスクリプトを読み込むことがあります。計算機は入力も結果もそれらに送りません。ライブのネットワーク表示がページの接続を報告します。"

[[howto]]
title = "数字を入力するか、ダイヤルをドラッグします。"
body = "10億、1.5億、3兆などを試してください。0から100穣までの整数を入力できます。ダイヤルは10の累乗で動き、ドラッグに合わせて絵も変わります。"
[[howto]]
title = "本、水、星、砂、時間から選びます。"
body = "どれも同じ数字を別の形で表し、1つが何かを示します。本では、1つを1語やAIのテキストトークン1個にすることもでき、数が文章の長さに変わります。"
[[howto]]
title = "育つ様子を見て、比べます。"
body = "数字が上がるとカメラが引いていきます。× 10や「1から育てる」を押してもう一度見て、あなたの数字の横の目印でそれぞれ何倍かを読み取ってください。10倍で次の目印に届くか予想できます。"
[[howto]]
title = "前提を確かめて、絵を残します。"
body = "本の厚さ、水滴の大きさ、砂粒の直径、数える速さを変えて、各目印の数値の出どころを読めます。絵はPNGで保存でき、前提が下に書き込まれます。"

[[faq]]
q = "AIモデルは必要ですか？"
a = "いいえ。ブラウザがあなたの数字を小さな目印の一覧に当てはめ、結果を自分で計算します。APIキーもモデルのダウンロードも、継続的なAIの費用もありません。"
[[faq]]
q = "本を10億冊積むとどれくらいの高さですか？"
a = "厚さ3cmの本で約3万kmです。地球の幅の2倍以上で、月までの道のりの約8%にあたります。月に届くには約130億冊必要です。厚さは前提の欄で変えられます。"
[[faq]]
q = "水滴10億個はどれくらいの水ですか？"
a = "スポイトの1滴にあたる0.05mLで5万リットルです。200リットルの浴槽で約250杯分、オリンピックプールの2%です。水漏れの蛇口のもっと大きな約0.25mLの水滴なら5倍になります。"
[[faq]]
q = "星10億個はどれくらいですか？"
a = "ESAの切りのよい数である1000億個を使うと、天の川銀河の約1%です。実際の数はその数倍かもしれません。また、全天で望遠鏡なしに見える約9,100個の星の約11万倍です。"
[[faq]]
q = "砂粒10億個はどれくらいの砂ですか？"
a = "直径0.5mmの球形の砂粒で、容器の中が砂粒60%、空気40%というモデルでは約109リットルです。10リットルのバケツでおよそ11杯分です。本物の砂粒はさまざまなので、これはこの前提での見積もりです。"
[[faq]]
q = "100万トークンは本何冊分ですか？"
a = "英語の文章では、1トークンあたり0.75語という大まかな目安で約75万語です。既定の1冊7万5000語なら10冊分で、積むと高さ約30cmです。言語、トークン化の方式、本の長さで答えは変わります。これは文章量の目安で、実際に読まれたり生成されたりした本の証拠ではありません。"
[[faq]]
q = "どの山を使っていますか？"
a = "意図的に定めた例で、高さ1,000m、底面の半径1,000mの円錐です。体積は円周率×半径の2乗×高さの3分の1です。実在の山にはその山の形が必要で、高さだけでは体積はわかりません。"
[[faq]]
q = "地球上のすべての砂と比べられますか？"
a = "このバージョンでは、世界の砂粒の正確な数を作り上げることはしません。そうした見積もりには、まず浜辺や砂漠といった範囲を決め、面積、深さ、粒径を仮定する必要があります。比較には、前提を確かめられる容器と目印を使ってください。"
[[faq]]
q = "絵は実際の縮尺で描かれていますか？"
a = "積んだ本とその目印は同じ本物の物差しの上にあります。ただし、細すぎて見えなくなるときは本を実物より太く描きます。時間軸も同じように本物です。水と砂は同じ物差しの上にはありません。容器はイラストで、色の付いた面積がその容器に占める実際の割合です。星は描ける間は点1つが1個で、それを超えると、点1つが何個を表すかを説明文で示します。"
[[faq]]
q = "アニメーションを止められますか？"
a = "はい。「動きを止める」ですべてが止まり、完成した絵が画面に残ります。端末で視差効果を減らす設定にしていると、ページは最初から完成した絵を表示します。"
[[faq]]
q = "このツールはオフラインで動きますか？"
a = "はい。ページを読み込んだ後は、計算、比較、描画、絵の保存のすべてが接続なしで動きます。処理のために入力がアップロードされることはありません。"

[schema]
description = "大きな数字を、積み上げた本、水の量、星空、砂の山、数える時間としてブラウザの中だけで可視化します。"
features = ["10^30までの正確な整数入力", "10の累乗で動くダイヤルとライブのアニメーション", "テーブルから観測可能な宇宙の果てまで、同じ本物の物差しの上に積む本", "名前の付いた容器を満たす水と砂", "1つの点から観測可能な宇宙までの星", "本物の時間軸の上の数える時間", "語とAIトークンの文章量への換算", "本の厚さ、水滴の大きさ、砂粒の大きさ、数える速さを調整可能", "前提を添えて保存できる絵", "動きを減らす設定に対応", "AIモデルなしでオフラインで動作"]
