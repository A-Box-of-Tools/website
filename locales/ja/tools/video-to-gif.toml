[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページの機能はすべてそのまま動きます。これがいちばん\
      単純な証明です。"""

[[howto]]
title = "動画を選びます。"
body = """
MP4、MOV、M4V、WebMを選択欄にドロップするか、手で選んでください。ブラウザが\
      ディスクから直接読み出します。その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "範囲に印を付けます。"
body = """
映像を再生しながら、始まりで<kbd>I</kbd>、終わりで<kbd>O</kbd>を押すか、\
      バーのつまみをドラッグしてください。GIFは数秒のものです。ファイルが小さく済むか\
      巨大になるかを決めるのは、ほかの2つよりずっと、この設定です。"""

[[howto]]
title = "幅とフレームレートを選びます。"
body = """
GIFの用途のほとんどには、幅480ピクセル、1秒あたり12フレームが合います。幅を\
      半分にすればピクセルは4分の1になります。1秒12フレームは動きとして読み取れます\
      し、誰にも見えないフレームに費用を払わずに済みます。"""

[[howto]]
title = "作って、ダウンロードします。"
body = """
フレームを読み込み、アニメーション全体に対して256色のパレットを1つ選び、\
      各フレームは変化した部分だけを書き出します。できあがるとページ上で再生され\
      ますが、それはダウンロードで得られるのと同じファイルです。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        されません。読み込みも抽出も変換も、お使いのブラウザが手元のハードウェア上で\
        行います。このツールにサーバー側は存在しません。ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        挙がっていますが、そのどれも当サイトのものではありません。言われるより\
        確かめたい方は、回線を抜いてからGIFを作ってみてください。"""

[[faq]]
q = "どの動画形式を変換できますか？"
a = """
        MP4、M4V、MOVは中身が何であれ直接読みます。H.264、HEVC、AV1、VP9のいずれも、\
        ブラウザがそのコーデックをデコードできる限り扱えます。それ以外でブラウザが\
        再生できるもの、いちばん多いのはWebMですが、それらは再生位置を各瞬間へ送って\
        読み取ります。こちらは遅く、どのフレームがどこに来るのかもわずかに不正確です。\
        ブラウザが読むことも再生することもできないファイル、実際にはAVI、WMV、FLV、\
        そして大半のMKVは、途中で失敗するのではなく、その旨のメッセージを出して\
        断ります。"""

[[faq]]
q = "GIFがこんなに大きいのはなぜですか？"
a = """
        GIFが1987年の形式で、動きではなく画像を丸ごと保存するからです。5秒の映像から\
        作ったGIFを、元の5秒のMP4と同じ大きさにする方法はありません。動画から作った\
        GIFは、その動画の10倍の大きさになるのがふつうです。実際に大きさを決める3つの\
        設定は、効く順に、範囲の長さ、画像の幅、1秒あたりのフレーム数です。幅を半分に\
        すればピクセルは4分の1になり、費用がかかるのはピクセルです。"""

[[faq]]
q = "なぜ256色しかないのですか？"
a = """
        それが形式そのものだからです。GIFは最大256色の表を1つ持ち、各ピクセルをその表\
        への番号として保存します。このツールは、指定された範囲の全フレームの色を数え、\
        256のまとまりに分けることでその256色を選びます。メディアンカットという標準的な\
        手法です。ですからパレットは、固定の色の組ではなく、その映像に合ったものに\
        なります。足りない色があるところでは、ディザリングが最も近い2色を混ぜるので、\
        グラデーションが縞にならずにグラデーションのまま残ります。"""

[[faq]]
q = "ディザリングの設定は何をするものですか？"
a = """
        わずかなノイズと引き換えに、大量の縞を消します。有効にすると、そのままでは4本の\
        平坦な帯になってしまう空が、グラデーションのまま残ります。代償はかすかな質感と、\
        大きくなるファイルです。無効にすると画像は平坦になり、ファイルは小さくなります。\
        画面録画、線画、もともと平坦な色でできているものに向きます。ここで使っているのは\
        誤差拡散ではなく組織的ディザなので、変化のない背景がフレーム間でちらつかず、\
        完全に静止したままになります。"""

[[faq]]
q = "長さやサイズに制限はありますか？"
a = """
        制限されるのは範囲のほうで、規則ではなくメモリによってです。パレットを選ぶ\
        あいだ、その範囲の全フレームが同時に保持されるので、ページは指定した設定が\
        どれだけ要るのかを計算し、始める前にお知らせします。タブがメモリ切れで消えるのを\
        許すのではなく、拒みます。範囲を短くする、幅を小さくする、フレームレートを下げる、\
        そのいずれでも下がります。"""

[[faq]]
q = "音声は残りますか？"
a = """
        GIFは音を運べません。音声を持つ版の形式は存在せず、ウェブがGIFを無音のループ動画で\
        おおむね置き換えた主な理由がこれです。音が大事なら、動画のままにしてください。\
        <a href="../trim-video/">動画カットツール</a>なら、フレームをエンコードし直さずに\
        一部を切り出せます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。この\
        サイトには広告があり、それが費用を賄っています。広告に動画の情報が渡される\
        ことはありません。"""

