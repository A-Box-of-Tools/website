[[howto]]
title = "動画を選びます。"
body = """
 MP4、MOV、M4V、WebM を選択欄に\
      ドロップするか、手で選んでください。ブラウザがディスクから直接読み出します。\
      その間に何かがどこかへ送られることはありません。"""

[[howto]]
title = "範囲に印を付けます。"
body = """
 映像を再生しながら、始まりで
      <kbd>I</kbd>、終わりで <kbd>O</kbd> を押すか、バーのつまみをドラッグして\
      ください。GIF は数秒のものです &mdash; ファイルが小さく済むか巨大になるかを\
      決めるのは、ほかの2つよりずっと、この設定です。"""

[[howto]]
title = "幅とフレームレートを選びます。"
body = """
 GIF の用途のほとんどには、\
      幅480ピクセル、1秒あたり12フレームが合います。幅を半分にすればピクセルは
      4分の1になります。1秒12フレームは動きとして読み取れますし、誰にも見えない\
      フレームに費用を払わずに済みます。"""

[[howto]]
title = "作って、ダウンロードします。"
body = """
 フレームが読み込まれ、\
      アニメーション全体に対して256色のパレットが1つ選ばれ、各フレームは変化した\
      部分だけとして書き出されます。できあがるとページ上で再生されますが、それは\
      ダウンロードで得られるのと同じファイルです。"""

[[faq]]
q = "動画はどこかにアップロードされますか？"
a = """
        されません。読み込みも抽出も変換も、あなた自身のブラウザがあなた自身の\
        ハードウェア上で行います。このツールにサーバー側は存在せず、ページの
        <code>Content-Security-Policy</code> は接続してよいアドレスをすべて\
        挙げていますが &mdash; そのどれも当サイトのものではありません。言われるより\
        確かめたい方は、回線を抜いてから GIF を作ってみてください。"""

[[faq]]
q = "どの動画形式を変換できますか？"
a = """
        MP4、M4V、MOV は中身が何であれ直接読みます。H.264、HEVC、AV1、VP9 の\
        いずれも、ブラウザがそのコーデックを復号できる限り扱えます。それ以外で\
        ブラウザが再生できるもの &mdash; いちばん多いのは WebM です &mdash; は、\
        再生位置を各瞬間へ送って読み取ります。こちらは遅く、どのフレームがどこに\
        来るかもわずかに不正確です。ブラウザが読むことも再生することもできない\
        ファイル、実際には AVI、WMV、FLV、そして大半の MKV は、途中で失敗するのでは\
        なく、その旨のメッセージを出して断ります。"""

[[faq]]
q = "GIF がこんなに大きいのはなぜですか？"
a = """
        GIF が1987年の形式で、動きではなく画像を丸ごと保存するからです。5秒の映像\
        から作った GIF を、元の5秒の MP4 と同じ大きさにする方法はありません
        &mdash; 動画から作った GIF は、その動画の10倍の大きさになるのがふつうです。\
        実際に大きさを決める3つの設定は、効く順に、範囲の長さ、画像の幅、1秒あたりの\
        フレーム数です。幅を半分にすればピクセルは4分の1になり、費用がかかるのは\
        ピクセルです。"""

[[faq]]
q = "なぜ256色しかないのですか？"
a = """
        それが形式そのものだからです。GIF は最大256色の表を1つ持ち、各ピクセルを\
        その表への番号として保存します。このツールは、指定された範囲の全フレームの\
        色を数え、256のまとまりに分けることでその256色を選びます &mdash; メディアン\
        カットという標準的な手法です &mdash; ですからパレットは、固定の色の組では\
        なく、あなたの映像に合ったものになります。足りない色があるところでは、\
        ディザリングが最も近い2色を混ぜるので、グラデーションが縞にならずに\
        グラデーションのまま残ります。"""

[[faq]]
q = "ディザリングの設定は何をするものですか？"
a = """
        わずかなノイズと引き換えに、大量の縞を消します。有効にすると、そのままでは
        4本の平坦な帯になってしまう空がグラデーションのまま残ります。代償はかすかな\
        質感と、大きくなるファイルです。無効にすると画像は平坦になりファイルは\
        小さくなります。画面録画、線画、もともと平坦な色でできているものに向きます。\
        ここで使っているのは誤差拡散ではなく組織的ディザなので、変化のない背景が\
        フレーム間でちらつかず、完全に静止したままになります。"""

[[faq]]
q = "長さやサイズに制限はありますか？"
a = """
        制限されるのは範囲のほうで、規則ではなくメモリによってです。パレットを選ぶ\
        あいだ、その範囲の全フレームが同時に保持されるので、ページはあなたの設定が\
        どれだけ要るかを計算し、始める前にお知らせします。タブがメモリ切れで消える\
        のを許すのではなく、拒みます。範囲を短くする、幅を小さくする、フレーム\
        レートを下げる、そのいずれでも下がります。"""

[[faq]]
q = "音声は残りますか？"
a = """
        GIF は音を運べません。音声を持つ版の形式は存在せず、ウェブが GIF を無音の\
        ループ動画でおおむね置き換えた主な理由がこれです。音が大事なら、動画のまま\
        にしてください &mdash; <a href="../trim-video/">動画カットツール</a> なら、\
        フレームを書き出し直さずに一部を切り出せます。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間も、透かしもありません。\
        このサイトには広告があり、それが費用を賄っています。広告にあなたの\
        動画に関する情報が渡されることはありません。"""

[schema]
browser_requirements = "JavaScript が必要です。MP4 と MOV には WebCodecs 対応のブラウザが必要で、ブラウザが再生できるものはそれなしでも動きます。"
description = "動画の一部をアニメーション GIF にブラウザ内で変換します。指定したレートでフレームを抽出し、アニメーション全体に対してメディアンカットで256色のパレットを1つ選び、各フレームは変化した領域だけを書き出します。アップロードは一切ありません。"
features = [
  "MP4、MOV、M4V、WebM の動画をアニメーション GIF に変換します",
  "H.264、HEVC、AV1、VP9 の映像を WebCodecs で復号します",
  "タイムライン上で範囲に印を付けるか、正確な時刻を打ち込めます",
  "幅は自由、1秒あたり5から25フレーム、組織的ディザリングは任意",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

