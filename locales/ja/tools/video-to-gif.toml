browser_requirements = "JavaScriptが必要です。MP4とMOVにはWebCodecs対応のブラウザが必要で、ブラウザが再生できるものはそれなしでも動きます。"
description = "動画の一部をアニメーションGIFにブラウザの中で変換します。指定したレートでフレームを抽出し、アニメーション全体に対してメディアンカットで256色のパレットを1つ選び、各フレームは変化した領域だけを書き出します。アップロードは一切ありません。"
features = [
  "MP4、MOV、M4V、WebMの動画をアニメーションGIFに変換します",
  "H.264、HEVC、AV1、VP9の映像をWebCodecsでデコードします",
  "タイムライン上で範囲に印を付けるか、正確な時刻を打ち込めます",
  "幅は自由、1秒あたり5から25フレーム、組織的ディザリングは任意",
  "オフラインで動作。アップロードなし、登録なし、透かしなし",
]

