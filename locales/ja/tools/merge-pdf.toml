name = "PDF結合・分割"
heading = "PDFを結合 <span class=\"h1-kw\">&mdash; 分割もページの並べ替えも</span>"
tagline = "サーバーを一往復せずに、ページを入れ替える。"

title = "PDFの結合・分割・ページ並べ替え｜無料・アップロードなし"
description = "PDFをまとめる、1つを複数に分ける、ページをドラッグして好きな順にする。すべてお使いのブラウザの中で行われます。アップロードもアカウントも不要で、仕上がったファイルは渡す前にもう一度開いてページ数を数え直します。"
og_title = "PDFのページを結合・分割・並べ替え——アップロードなし"
og_description = "書類をまとめ、1つを切り分け、ページを動かし、回し、抜く。作業をするのはお使いのブラウザで、ファイルが端末から出ることはありません。"
og_image_alt = "PDFのページを、アップロードせずに結合・分割・並べ替えする"

pledge = """
    選んだ書類は、このアドレスから配信されたコードによって、この端末のメモリの中で\
    開かれ、分解され、書き戻されます。ここにはアップロードを起こせるものがなく、\
    このページの向こう側にそれを受け取るサーバーもありません。"""

live_hint = """
      鵜呑みにする必要はありません。DevToolsの「ネットワーク」タブを開いたまま\
      2つのファイルを結合してみてください。ページも画像もファイル名も、どの\
      リクエストにも載りません。回線を抜いてから結合してみるのでも構いません。"""

read_first = """
、そして複製の全体、つまりページを1つの書類から\
      持ち上げて別の書類に置く手順と、意図して置いていくものについては\
      <code>src/assemble.js</code>です。これはネットワークに触れられず、隣にある\
      読み取り側も書き出し側も同じです。"""

howto_heading = "PDFを結合・分割・並べ替えする手順"

card = """
            書類をまとめ、1つを複数に切り分け、ページをドラッグして好きな順に\
            します。リンクとしおりは、指し示すページを追いかけるように組み直され、\
            仕上がったファイルはお渡しする前にもう一度開いてページ数を\
            数え直します。"""

[words]
plural = "書類"
choose = "PDF"

[[facts]]
text = "アップロードなし"

[[facts]]
text = "登録なし"

[[facts]]
text = "オフラインで動作"

[[facts]]
text = "ソース公開"

[[facts]]
text = "ファイルは端末から出ない"

[[privacy]]
title = "書類には出ていく先がありません。"
body = """
Content-Security-Policyには、このページが接続してよいアドレスがすべて\
      書かれていて、そのどれもこのサイトのものではありません。この道具はその\
      一覧に何も足しません。自前のネットワーク機能を、任意のものすら持って\
      いないからです。ファイルが集められるような受け口はここになく、仮に\
      あったとしても、そこへ送るコードがありません。"""

[[privacy]]
title = "結合こそ、いちばんアップロードしたくない作業です。"
body = """
人がまとめる書類は、たいてい\
      どこかから来たものです。契約書とその署名ページ、パスポートの写しと\
      取引明細、診断書と申請書。オンラインの結合サービスは、それらを一か所に、\
      すでに並べ終えた状態で手にします。この道具が持っているのはブラウザの中の\
      1ページだけで、もう半分がありません。"""

[[privacy]]
title = "フォーマットの全体がこのリポジトリにあります。"
body = """
PDFはオブジェクトの一覧と、\
      それぞれがどこから始まるかの表です。<code>src/objects.js</code>がその文法を\
      読み、<code>src/reader.js</code>が表をたどり、<code>src/assemble.js</code>が\
      書類のあいだでページを複製し、<code>src/writer.js</code>が結果を書き出します。\
      4つのどれも、リクエストを出せるものは読み込んでいません。ライブラリを\
      取りに行くことはなく、サーバーで描画されるものもありません。"""

[[privacy]]
title = "暗号化されたファイルは、開かずにお断りします。"
body = """
パスワードのかかったPDFは受け付けません。スキャナーが空のパスワードで\
      作る、技術的には開けてしまう種類のものも同じです。書類の保護を外すのは、\
      ページを入れ替えるのとは別の仕事です。黙ってそれをするのは、道具が代わりに\
      やることとしては驚きが大きすぎます。"""

[[privacy]]
title = "仕上がったファイルは、どこで作られたかを語りません。"
body = """
作成ソフトの行も、作成日も、道具の名前もありません。組版ソフトが置いて\
      いくXMPパケットや独自ブロックも運びません。それらは以前あった書類のもので\
      あって、いま作った書類のものではないからです。ページの中身そのものは\
      そのまま複製されます。この道具はページを動かすだけで、そこに書かれている\
      ものは書き換えません。"""

[[privacy]]
title = "「ページへ移動」以外の動作は複製しません。"
body = """
PDFには、開いたときに走る命令を入れられます。これを再生せよ、この\
      フォームをあのアドレスへ送れ、このJavaScriptを実行せよ。この道具を通った\
      ページは、他のページやウェブアドレスへのリンクを残し、それ以外を失います。\
      他人のページを並べ替えることは、その書類のスクリプトを新しいファイルへ\
      持ち込む理由にはなりません。"""

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = """
広告と計測のスクリプトはGoogleから来ています。そのどちらにも、\
      書類に関する情報は渡されません。ファイルも、ページも、名前も、サイズも、\
      ページ数もです。PDFを読み、複製し、書き出すコードはすべてこのオリジンから\
      配信され、リポジトリに載っています。"""

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = """
ヘッダーの「Buy me a coffee」ボタンは、cdnjs.buymeacoffee.comの\
      スクリプトが描き、書体はGoogle Fontsから読み込みます。それはリンク\
      以上のものではありません。訪問を報告することもなく、あなたや書類について\
      渡されるものもありません。押さないかぎり何も起こらず、押した先は他人の\
      サイトです。"""

[[privacy]]
title = "オフラインで動きます。"
body = """
通信を切っても、このページのすべてがそのまま動きます。\
      これがいちばん単純な証明です。結合のために書類を送っている道具なら、\
      そこで止まります。"""

[[howto]]
title = "PDFを選びます。"
body = """
選択欄にドラッグするか、手で選んでください。あとから\
      追加しても構いません。各ファイルのページは、いまの並びの末尾に付きます。\
      2つのフォルダを別々のタイミングで結合できるのはそのためです。読み込むのは\
      ブラウザで、ディスクから直接です。"""

[[howto]]
title = "ページを好きな順に並べます。"
body = """
つまみを持ってページをドラッグするか、\
      矢印で少しずつ動かします。横向きにスキャンされたページを回す、1枚抜く、\
      あるいは欄に<code>1-3, 8, 12-</code>と打てば、まとまった範囲を一度に\
      残す・外す・回すことができます。番号は動かすたびに振り直されるので、\
      見えているものがそのまま仕上がりです。"""

[[howto]]
title = "1つの書類にするか、複数にするかを決めます。"
body = """
たいていは1つです。残りは\
      切り方です。何ページごとか、指定したページ番号で、1ページに1ファイル、\
      あるいは元のファイルごとに戻す。複数になる場合は1つのZIPでまとめて\
      渡されるので、保存の確認は50回ではなく1回で済みます。"""

[[howto]]
title = "組み立て、検証したという行を読みます。"
body = """
書類が書き終わると、そのそれぞれを\
      このページの同じ読み取り側がもう一度開き、ページ数を数えます。それが\
      指定した内容と食い違えば、その実行は失敗として報告され、ダウンロードは\
      提示されません。"""

[[faq]]
q = "PDFはどこかにアップロードされますか？"
a = """
        いいえ。読み込みも、複製も、書き出しも、お使いのブラウザがお手元の\
        ハードウェアで行います。この道具にサーバー側はなく、ページの\
        <code>Content-Security-Policy</code>には接続してよいアドレスがすべて\
        書かれていて、そのどれもこのサイトのものではありません。この道具には、\
        任意のネットワーク機能すら存在しません。"""

[[faq]]
q = "何個まで結合できますか。ファイルの大きさに上限はありますか？"
a = """
        道具に書かれた上限はありません。上限はお使いの端末です。書類は作業のあいだ\
        メモリに置かれるので、ノートパソコンなら数百メガバイトは難なく結合し、\
        それより上のどこかで苦しくなります。課金も、速度制限も、透かしも、順番待ちも\
        ありません。それを行う相手が向こう側にいないからです。"""

[[faq]]
q = "結合や分割で画質は落ちますか？"
a = """
        落ちません。ページ上のものは再符号化も、再描画も、再圧縮もされません。\
        各ページの内容ストリームと、それが参照するフォント・画像・ベクター図形は\
        すべてバイト単位で複製されます。文字は選択も検索もできるままで、写真は\
        同じ写真です。変わるのはページの順番と、その周りの構造だけです。"""

[[faq]]
q = "しおりとリンクはどうなりますか？"
a = """
        どちらも捨てるのではなく、組み直します。ページが出力に残っているしおりは、\
        そのページの移動先を指します。ページを外したしおりは消えますが、下に\
        残った項目があれば見出しとして残ります。複数のファイルを結合すると、\
        各ファイルのしおりはそのファイル名の見出しの下に入ります。ページ間の\
        リンクも同じようにたどられ、WordやLaTeXが書く名前付きの行き先も含みます。\
        行き先が一緒に来なかったリンクは、読み手を誤った場所へ送るくらいなら、\
        何も起こらないまま残されます。ウェブアドレスへのリンクはそのままです。"""

[[faq]]
q = "引き継がれないものは何ですか？"
a = """
        4つあり、道具はそれを小さな注記ではなく結果の画面で伝えます。スクリーン\
        リーダーが使うタグ付きの読み上げ順のツリー、ページラベル\
        （「iii, iv, 1, 2」といった番号付け）、埋め込まれた添付ファイル、そして\
        「ページへ移動」でも「ウェブアドレスを開く」でもないすべての動作、書類の\
        JavaScriptを含みます。はじめの2つは、ページが動いた時点で存在しなくなった\
        順序を記述したものです。最後のものは、新しいファイルへ持ち込んでほしいと\
        頼まれていないものです。書類のタグ付けが大事なら、元のファイルも残して\
        おいてください。"""

[[faq]]
q = "記入済みのフォームは残りますか？"
a = """
        残ります。フォームの項目と入力された内容はページと一緒に来て、新しい書類も\
        フォームとして登録されるので、閲覧ソフトはそれをフォームとして扱います。\
        結合するときに知っておきたいことが1つあります。同じ名前の項目は、どの\
        閲覧ソフトにとっても1つの項目です。同じフォームの写しを2つ結合すると、\
        片方のページで欄を埋めればもう片方も埋まります。道具はその場合に気づいて\
        知らせます。"""

[[faq]]
q = "パスワード付きのPDFは開けますか？"
a = """
        いいえ。これは意図した動作です。暗号化された書類は、その旨を伝えて受け付け\
        ません。パスワードが空の場合も同じで、多くのスキャナーやコピー機はその形で\
        保存します。ファイルの保護を外すのはページを動かすのとは別の仕事であり、\
        黙ってそれをする道具は、頼まれてもいないことをしていることになります。"""

[[faq]]
q = "ページのプレビューがないのはなぜですか？"
a = """
        ページを描くには、フォント、シェーディング、透明グループ、描画モードまで\
        含む完全なPDFレンダラーが要るからです。サムネイルのために1メガバイト以上の\
        エンジンを取ってきて走らせることになります。代わりにタイルが見せているのは、\
        並べ替えが実際に扱う情報です。ページ番号、紙の形と大きさ、書き出しに使われる\
        回転、そしてどのファイルから来たか。縦のページの束に横向きのスキャンが1枚\
        混じっていれば、これでも一目でわかります。"""

[[faq]]
q = "仕上がったファイルはどこでも開けますか？"
a = """
        開けます。出力はPDF 1.5、または渡されたファイルのいずれかが必要とした\
        最も高い版で書かれます。1.5は2003年以降に出たすべての閲覧ソフトが理解します。\
        道具はそれをお手元でも実際に確かめます。仕上がったファイルをもう一度開き、\
        ページツリーをたどってページ数を数えてから、はじめてお渡しします。"""

[[faq]]
q = "無料ですか。アカウントは必要ですか？"
a = """
        無料です。アカウントも、ログインも、試用期間もなく、ファイルサイズの制限も\
        端末のメモリが許す範囲のほかにはありません。このサイトには広告があり、それが\
        費用を賄っています。広告に書類の情報が渡されることはありません。"""

[[faq]]
q = "オフラインでも動きますか？"
a = """
        動きます。ページを一度読み込んでから通信を切っても、そのまま使えます。\
        何もアップロードされていないことを示す、いちばん簡単な方法でもあります。\
        結合のために書類をどこかへ送っている道具なら、線を抜いた瞬間に止まる\
        からです。"""

[schema]
description = "ブラウザの中でPDFを結合し、1つを複数のファイルに分割し、ページの並べ替え・回転・削除ができます。ページは手元で書類のあいだを複製されるので、ファイルがアップロードされることはありません。"
features = [
  "PDFを何個でも結合でき、途中でファイルを足していけます",
  "ページをドラッグして並べ替え、回転、削除。範囲を指定して一度に処理もできます",
  "1ページ1ファイル、何ページごと、指定ページ番号、または元のファイルごとに分割",
  "残ったページに合わせて、しおりと内部リンクを組み直します",
  "記入済みのフォーム項目を保持し、名前が重なった場合は知らせます",
  "仕上がったファイルはすべて、渡す前に開き直してページ数を数えます",
  "オフラインで動作。アップロードなし、登録なし、サイズ制限なし",
]

