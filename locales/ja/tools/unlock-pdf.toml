[[privacy]]
title = "保護されたPDFの多くは、開封を防いでいません。"
body = "PDFには異なる2種類の保護があります。<em>開くためのパスワード</em>がなければ内容は読めず、ここで探すこともできません。<em>操作の制限</em>だけなら誰でも開け、ファイルに鍵の生成に必要な情報があります。印刷などを防ぐのは、リーダーが守ることに同意する権限欄です。Adobeは最初からそのように説明しています。制限を外すのは暗号を破るのではなく、依頼を無視することです。種類を表示し、必要な場合だけパスワードを求めます。"

[[privacy]]
title = "パスワードを推測するループはありません。"
body = "開くためのパスワードがある場合は入力が必要です。辞書、単語リスト、総当たりはなく、実際には探せる1990年代の40ビット鍵も探索しません。意図した方針です。開くためのパスワードと所有者パスワードの両方を受け付けます。どちらも持っている人が入力するパスワードだからです。"

[[privacy]]
title = "パスワードはここで入力し、ここで使います。"
body = "入力した値はタブでの鍵生成にだけ使います。保存せず、別のファイルで覚えず、アドレス欄にも書きません。<code>Content-Security-Policy</code>の接続先に、このサイト自身のものはありません。書類のパスワードを求めてから通信するようなことはありません。"

[[privacy]]
title = "渡す前に、完成したファイルをここで開き直します。"
body = "完成したバイトを<a href=\"../compress-pdf/\">圧縮ツール</a>、<a href=\"../merge-pdf/\">結合ツール</a>、<a href=\"../redact-pdf/\">墨消しツール</a>と共通のリーダーへ戻します。暗号化された書類を拒否するリーダーが、パスワードなしで同じページ数を読める必要があります。暗号化が残っていれば通りません。失敗した場合は伝え、ダウンロードを提供しません。"

[[privacy]]
title = "ページを描き直し、再圧縮、再配置はしません。"
body = "変えるのは書類を包む暗号化です。各ページの描画命令、埋め込みフォント、画像は元のままです。文字の選択や検索、スキャンの解像度、配置を保ちます。過去の編集で残った古いオブジェクトのコピーは引き継がず、少し小さくなることがあります。"

[[privacy]]
title = "電子署名は残せず、見つけた場合は伝えます。"
body = "電子署名はファイルの正確なバイト列を対象とするので、書き直すと無効になります。結果には署名がなく、署名を見つけたら警告します。元の署名付きファイルはそのままです。どのツールでもこの性質は変えられません。"

[[privacy]]
title = "保護の実際の強さを説明します。"
body = "1998年の40ビットRC4と現在のAES-256は、リーダーでは同じ「パスワード保護」と表示されても強さが違います。このページは方式、鍵長、リビジョンを示し、破られる方式、旧式の方式、現在の方式を区別します。安全だと言われたファイルを判断するための情報です。"

[[privacy]]
title = "証明書による保護は明示して受け付けません。"
body = "企業の書類などには、スマートカードや鍵ストアの証明書で暗号化されたものがあります。種類を説明して拒否します。パスワードの入力で秘密鍵を代用することはできません。"

[[privacy]]
title = "Googleが読み込むものと、渡されないもの。"
body = "広告と計測のスクリプトはGoogleから読み込みます。ファイル、ページ、名前、サイズ、ページ数、パスワード、保護方式は渡しません。PDFを読み、復号し、書くコードはすべてこのサイト自身から配信され、リポジトリで公開されています。"

[[privacy]]
title = "寄付ボタンが読み込むものと、渡されないもの。"
body = "ヘッダーの「Buy me a coffee」ボタンはcdnjs.buymeacoffee.comのスクリプトが描き、Google Fontsの文字を使います。訪問を報告する機能のないリンクで、利用者や書類の情報は渡しません。クリックするまで何も起こらず、移動先は別のサイトです。"

[[privacy]]
title = "オフラインでも動きます。"
body = "通信を切ってもすべての機能が動きます。書類を別の場所へ送って解除するツールなら止まるので、簡単な証明になります。"

[[howto]]
title = "PDFを選びます。"
body = "書類は1つずつ、ブラウザがディスクから直接読みます。最初に空のパスワードを試します。保護されたファイルの多くは開封を防いでいないため、これで開けます。"

[[howto]]
title = "見つかった保護を読みます。"
body = "保護の種類、暗号化方式と現在の強さ、すべての操作制限を表示します。印刷、コピー、編集、コメント、フォーム入力、ページの並べ替え、読み上げなどです。"

[[howto]]
title = "求められた場合だけパスワードを入力します。"
body = "空のパスワードで開けなかった場合だけ欄が現れます。開くためのパスワードでも所有者パスワードでも使えます。推測はせず、入力した値はタブの中だけで使います。"

[[howto]]
title = "解除し、確認結果を読みます。"
body = "書類自身の鍵で復号し、暗号化辞書を外して書きます。完成したファイルを、暗号化を拒否するリーダーでパスワードなしに開き直します。開けない場合やページ数が違う場合は伝え、ダウンロードを提供しません。"

[[faq]]
q = "パスワードは必要ですか？"
a = "通常は不要で、選んでからすぐに分かります。明細、給与票、レポート、Officeの編集制限など、多くのPDFは誰でも開けて操作の依頼だけがあるので、パスワードなしで解除できます。開くときに本当にパスワードを求める種類には、そのパスワードが必要です。"

[[faq]]
q = "知らないパスワードのPDFも開けますか？"
a = "いいえ。推測も試しません。辞書、単語リスト、総当たり探索はなく、<code>src/shared/pdf-crypt.js</code>で確かめられます。古い40ビット鍵は実際には探索できますが、意図して行いません。自分の書類でもパスワードを失った場合は、このページでは復元できません。"

[[faq]]
q = "2つのパスワードはどう違いますか？"
a = "<em>利用者</em>パスワードがなければ開けません。<em>所有者</em>パスワードは印刷、コピー、編集の制限を解除します。所有者パスワードだけの書類は誰でも開けますが、印刷などを拒否します。このツールはどちらも受け付け、実際にどちらで開いたかを表示します。"

[[faq]]
q = "操作の制限を外してよいのですか？"
a = "書類と地域による、ファイルを使う権利の問題です。形式上の制限は、Adobeが当初から説明するように、リーダーが合意して守る欄であり暗号による障壁ではありません。このツールは自分の印刷できない明細、購入したコピーできないレポート、並べ替えたいスキャンなど、利用する権利のある書類に使ってください。権利を持たないファイルの扱いは変わりません。"

[[faq]]
q = "どの暗号化に対応しますか？"
a = "公開された方式すべてに対応します。40・128ビットRC4（リビジョン2・3）、AES-128（4）、撤回された2008年と現在のPDF 2.0のAES-256（5・6）です。スマートカードや鍵ストアを使う証明書暗号化と、Adobeの未公開の派生方式は対応せず、種類を明示して拒否します。"

[[faq]]
q = "書類の見た目は変わりますか？"
a = "変わりません。描画命令、埋め込みフォント、画像はそのままで、描き直しや再圧縮や再配置はしません。文字を選択でき、スキャンの解像度と配置も保ちます。過去の編集の古いオブジェクトを除く分だけ、少し小さくなることがあります。"

[[faq]]
q = "署名付き書類はどうなりますか？"
a = "電子署名は無効になります。署名は正確なバイト列を対象とするので、どのプログラムでも変更すれば無効になります。このツールは新しいファイルを書き、元の署名を検出したら結果で伝えます。元の署名付きファイルを残してください。"

[[faq]]
q = "書類やパスワードは送信されますか？"
a = "いいえ。書類はブラウザで読み、復号し、書き、パスワードからの鍵生成もタブで行います。サーバーはなく、<code>Content-Security-Policy</code>の接続先にこのサイト自身のものはありません。通信を切って使うことでも確認できます。"

[[faq]]
q = "保護が外れたことをどう確かめますか？"
a = "端末で完成したファイルを、暗号化を拒否する共通リーダーでパスワードなしに開き直します。同じページ数を読めなければ失敗を伝え、ダウンロードは提供しません。保存後にリーダーで開き、文書のプロパティですべての権限が許可になったことも確認できます。"

[[faq]]
q = "容量制限や料金はありますか？"
a = "ツール自体には制限を設けていません。処理中は書類をメモリに保持するため、限界は端末によります。ノートパソコンは数百MBなら通常扱えますが、それを大きく超えると難しくなります。無料で、アカウント、ログイン、お試し期間はありません。広告で運営していますが、書類の情報は広告に渡しません。"

[[faq]]
q = "オフラインでも動きますか？"
a = "はい。一度開いて通信を切っても動きます。書類を別の場所へ送って解除するツールなら止まるので、何も送信しないことの確認になります。"

