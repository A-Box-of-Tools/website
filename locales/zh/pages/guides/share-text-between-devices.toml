title = "设备间分享文本与文件 | 不在服务器保存副本"
description = "通过加密连接把文本或文件从一个浏览器交给另一个。不用给自己发邮件，不用账号，服务器不保存分享副本。"
heading = "如何不上传副本就分享文本与文件"
lede = "把笔记或文件移到另一台设备，常见办法会在邮件、聊天或分享网站上留下副本。实时浏览器分享让双方同时在线，完成交接后关闭链接。先了解连接方式、批准设置和保存副本的边界。"
