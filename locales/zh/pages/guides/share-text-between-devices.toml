description = "在浏览器之间分享文本与文件，默认直接连接，也可选择经 Cloudflare 转发的加密云中继。不用账号，服务器不保存分享副本；接收方仍可自行保存收到的内容。"
heading = "如何分享文本与文件而不在服务器保存副本"
