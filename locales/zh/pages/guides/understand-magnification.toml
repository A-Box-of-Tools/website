title = "怎么看懂天文望远镜、显微镜和双筒望远镜上的放大倍率"
description = "8×42、40×/0.65 和 675× 到底在说什么：东西看起来多大，视野里装得下多少，以及为什么决定细节的是镜片的宽度。还能按你自己的仪器算出极限。"

heading = "放大倍率告诉你什么，又漏掉了什么"
lede = "一台标着 675× 的望远镜，能看到的并不比它在 120 倍时更多。标着 8×42 的双筒望远镜，只有在光线变暗时才胜过 8×21。这个数字说的是东西看起来多大。能看到多少，要看它旁边的另外几个数字。"

