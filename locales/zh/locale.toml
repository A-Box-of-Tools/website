#
# 简体中文.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# No [slugs] table, for the reason set out at length in locales/ja/locale.toml:
# a Han slug has to be percent-encoded to survive being pasted around, and pinyin
# is a phrase nobody searches for. The keyword weight goes into the title, the
# description and the h1 instead.
#
# WORTH KNOWING BEFORE THIS ONE IS MARKED COMPLETE
#
# Google is blocked in mainland China, so both the ad script and the measurement
# script fail there and neither the revenue nor the analytics that justify this
# page will appear. What this locale actually serves is Chinese readers outside
# the mainland - Singapore, Malaysia, and the diaspora - who read simplified
# characters. Traditional Chinese for Taiwan and Hong Kong would be its own
# folder (zh-TW), and is the variant that works end to end.
#
# `hreflang` is zh-Hans rather than zh-CN: the distinction that matters to a
# reader here is the script, not the country, and zh-Hans is what tells Google
# that.
#
# HOUSE STYLE, decided here and held to across every file in this locale
#
#   * the reader is 你, never 您, on every page including the legal ones;
#   * one half-width space between Han text and Latin letters or digits, and
#     none between Han text and full-width punctuation. Dates are the standing
#     exception, because Chinese typography sets them closed up: 2026年8月20日;
#   * full-width punctuation throughout: ，。、；：“”‘’（）《》;
#   * no 破折号. An English em-dash aside is re-hinged into short clauses joined
#     by commas, so `&mdash;` survives only where the markup itself needs it;
#   * the title separator is " | " rather than a dash, because that is what a
#     Chinese search result actually looks like.
#

lang = "zh"
name = "Chinese (Simplified)"
endonym = "简体中文"
hreflang = "zh-Hans"

complete = true

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "免费在线工具 | 文件不上传，也不用注册 | abox.tools"
# 中文搜索结果大约在这个长度截断。
description = "全部免费，文件不上传。图片合成 PDF 或 MP4、把图片压到指定大小、裁剪视频、清除 EXIF 信息，都在你的浏览器里完成。"
heading = "不碰服务器的工具箱"
og_title = "A Box of Tools | 不碰服务器的工具"
og_description = "每个工具只做一件事，全部工作都在你的浏览器里完成。文件不会离开你的设备。"
og_image_alt = "abox.tools - 不碰服务器的工具"
schema_description = "每个工具只做一件事，全部工作都在浏览器里完成。不上传任何东西，也不需要账号。"
schema_about = "在浏览器里运行、在本地处理文件而不上传的文件工具"

lede = """
    每个工具只做一件事，全部工作都在你的浏览器里完成。文件留在你自己的设备
    上，没有什么要上传，不用注册账号，也不做任何追踪。"""

support_note = """
      这些工具免费，以后也一直免费。如果哪个帮你省了事，本站开口向你要东西
      的地方只有这一处。"""

# 不是承诺，是三条你自己就能验证的事实（与英文版一致）。
[[hub.guarantees]]
title = "文件不会离开你的设备"
body = """
        打开、读取、处理文件的是你自己的浏览器，用的是你自己的硬件。每个工具
        的 <code>Content-Security-Policy</code> 都把允许连接的地址一条不漏地
        列了出来，其中没有一条属于我们。"""

[[hub.guarantees]]
title = "关于你文件的信息也不会外传"
body = """
        文件本身不会，缩略图、文件名、大小、你选了几个，也都不会。这里没有哪
        个工具去读这些东西，另一端也没有服务器可以接收。"""

[[hub.guarantees]]
title = "断网也照样能用"
body = """
        把工具打开一次，然后断开网络，它照样处理你的文件，和联网时一模一样。
        这一点很难作假，真要把文件送出去处理，断网那一刻就动不了了。"""

[[hub.categories]]
id = "images-and-video"
name = "图片与视频"
note = "处理照片和素材，不用交给任何人。"

[[hub.categories]]
id = "gif-and-animation"
name = "GIF 与动画"
note = "做一段动画，或者把动画拆成帧，文件都不离开你的设备。"

[[hub.categories]]
id = "audio"
name = "音频"
note = "处理录音不用交给别人，视频里的声音也一样。"

[[hub.categories]]
id = "documents-and-pdf"
name = "文档与 PDF"
note = "做文档、重排文档，都不用送出去处理。"

[[hub.categories]]
id = "codes-and-data"
name = "编码与数据"
note = "把你输入的内容变成机器读得懂的东西，不用离开这个页面。"

[[hub.categories]]
id = "text-and-code"
name = "文本与代码"
note = "查看、比对、编码，不用把令牌或者配置文件粘到别人的服务器上。"

#
# ---------------------------------------------------------------------------
# The guides index.
# ---------------------------------------------------------------------------
#

[guides]
nav = "全部指南"
title = "指南 | 这件事怎么做，每个选择又要付出什么"
description = "用大白话讲清楚怎么压缩、缩放、裁剪、剪辑、转换自己的文件。设置是什么意思，代价在哪里，为什么这些全都不用上传。"
heading = "指南"
lede = """
    一个工具一篇，写给那些被要求交出某个大小或者某种格式、又想弄明白手上这个
    设置到底在动什么的人。这里讲的每一步都发生在你自己的设备上。"""
og_title = "abox.tools 指南"
og_description = "怎么压缩、缩放、裁剪、剪辑、转换自己的文件，每个设置又要付出什么。全程不涉及上传。"
og_image_alt = "abox.tools - 不碰服务器的工具"


[[guides.groups]]
id = "doing-the-job"
name = "把事做完"
note = "一个工具一篇，讲这件事要做什么、哪个设置真正管用、又要付出什么。"

[[guides.groups]]
id = "before-you-upload"
name = "上传任何东西之前"
note = "把文件交给一个网站到底意味着什么，以及怎么判断这一步是不是非做不可。"

#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "路线图"
title = "路线图 | abox.tools 接下来要做什么"
description = "abox.tools 计划中的工具全都分好类公开列在这里，已经做完的也在。它们都在浏览器里跑，都不上传任何东西。"
heading = "接下来做什么"
lede = """
    下面两份清单上的每一项，都在你的浏览器里干活，都不上传东西，一个名字要想
    进这份清单，先得过这一关。数字没有写死在任何地方，是构建脚本从这两份清单
    上数出来的。"""

intro_heading = "这份清单是怎么定下来的"
intro = """
    <p>
      这不是许愿单。做法是把网上最大的 GIF 和视频站点的工具列表从头到尾过一
      遍，那份列表大概是现存最接近“人们到底想拿文件做什么”的一份目录，然后
      只留下那些能做到让处理发生在你自己设备上、拔掉网线也照样干活的条目。
    </p>
    <p>
      留下来的绝大多数靠浏览器本来就带的接口就够了。少数几个得把编解码器打包
      进唯一用到它的那个工具里，这也算过关，文件照样不离开设备。达不到这条线
      的宁可不写，所以下面几个看着很明显的空缺，是故意空着的。
    </p>
    <p>
      已经做出来的工具排在各自分组最前面，标着<em>已完成</em>，点进去就是它
      自己的页面。下面的都还没做，做出来之前不会变成链接。
    </p>"""

planned_heading = "每一类文件，以及能拿它做什么"

og_title = "abox.tools 路线图"
og_description = "哪些做好了，接下来做什么。全部在浏览器里运行，都不上传任何东西。"
og_image_alt = "abox.tools - 不碰服务器的工具"

