#
# 简体中文.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# No [slugs] table, for the reason set out at length in locales/ja/locale.toml:
# a Han slug has to be percent-encoded to survive being pasted around, and pinyin
# is a phrase nobody searches for. The keyword weight goes into the title, the
# description and the h1 instead.
#
# WORTH KNOWING BEFORE THIS ONE IS MARKED COMPLETE
#
# Google is blocked in mainland China, so both the ad script and the measurement
# script fail there and neither the revenue nor the analytics that justify this
# page will appear. What this locale actually serves is Chinese readers outside
# the mainland - Singapore, Malaysia, and the diaspora - who read simplified
# characters. Traditional Chinese for Taiwan and Hong Kong would be its own
# folder (zh-TW), and is the variant that works end to end.
#
# `hreflang` is zh-Hans rather than zh-CN: the distinction that matters to a
# reader here is the script, not the country, and zh-Hans is what tells Google
# that.
#
# HOUSE STYLE, decided here and held to across every file in this locale
#
# This locale is written, not translated, and is not meant to be diffable
# against the English sentence for sentence. Same tools, same claims, same
# order - said the way a Chinese writer would say them. English builds one long
# sentence out of a relative clause and an appositive; this builds three short
# ones. English needs a pronoun in every clause; this drops the subject. So a
# paragraph here often has a different number of sentences than the English
# paragraph it stands for, and that is the point rather than drift.
#
#   * the reader is 你, never 您, on every page including the legal ones;
#   * short sentences. If a clause can end, end it. A 逗号 chain longer than
#     about three clauses is an English sentence wearing Chinese characters;
#   * no 破折号, and no colon sprung the English way to reveal something. A
#     Chinese colon introduces a list or a quotation and little else;
#   * 的 is rationed, a passive becomes topic-comment, and 它/它们 appear only
#     where a Chinese reader would otherwise lose the thread;
#   * one half-width space between Han text and Latin letters or digits, and
#     none between Han text and full-width punctuation. Dates are the standing
#     exception, because Chinese typography sets them closed up: 2026年8月20日;
#   * full-width punctuation throughout: ，。、；：“”‘’（）《》;
#   * NO LINE BREAK INSIDE A SENTENCE. Between two Han characters a break is a
#     gap the reader can see, and there is no English space for it to hide in.
#     Long values wrap with a trailing backslash, which TOML eats along with
#     the indentation of the line after it;
#   * the title separator is " | " rather than a dash, because that is what a
#     Chinese search result actually looks like.
#

lang = "zh"
name = "Chinese (Simplified)"
endonym = "简体中文"
hreflang = "zh-Hans"

complete = true

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "免费在线工具箱 | 不上传文件，不用注册 | abox.tools"
# 中文搜索结果大约在这个长度截断。
description = "全部免费，文件不用上传。图片拼成 PDF 或 MP4、把图压到指定大小、裁视频、清 EXIF，都在你自己的浏览器里做完。"
heading = "一箱子工具，都不走服务器"
og_title = "A Box of Tools | 不走服务器的工具"
og_description = "一个工具只干一件事，全程在你的浏览器里跑。文件不出这台机器。"
og_image_alt = "abox.tools - 不走服务器的工具"
schema_description = "一个工具只干一件事，活全在浏览器里干完。没有东西要上传，也不用账号。"
schema_about = "在浏览器里就地处理文件、不需要上传的文件工具"

lede = """
    一个工具只干一件事，全程在你的浏览器里跑。文件留在你自己的机器上，没有\
    东西要传，没有账号要注册，也没人在旁边记你干了什么。"""

support_note = """
      这些工具免费，以后也一样。要是哪个真帮你省了事，全站开口跟你要点什么\
      的地方，就这一处。"""

# 不是承诺，是三条你自己就能验证的事实（与英文版一致）。
[[hub.guarantees]]
title = "文件不出你这台机器"
body = """
        打开、读取、处理，全是你自己的浏览器在做，用的是你自己的硬件。每个\
        工具的 <code>Content-Security-Policy</code> 都把允许联的地址列全了，\
        里面没有一个是我们的。"""

[[hub.guarantees]]
title = "连你文件的信息也传不出去"
body = """
        文件本身不传，缩略图、文件名、大小、选了几个，一样不传。这里没有哪个\
        工具去读这些，另一头也没有服务器等着收。"""

[[hub.guarantees]]
title = "断网照样能用"
body = """
        把工具打开一次，然后拔掉网线，它照干不误，跟联网时没有区别。这一步很\
        难作假。真要把文件送出去处理，断网当场就停。"""

[[hub.categories]]
id = "images-and-video"
name = "图片与视频"
note = "修图、剪片，不用把东西交给谁。"

[[hub.categories]]
id = "gif-and-animation"
name = "GIF 与动画"
note = "做一段动画，或者把动画拆开看，文件都不出这台机器。"

[[hub.categories]]
id = "audio"
name = "音频"
note = "剪录音不用交给别人，剪视频里的声音也一样。"

[[hub.categories]]
id = "documents-and-pdf"
name = "文档与 PDF"
note = "拼文档、拆文档、给文档瘦身，不用送出去处理。"

[[hub.categories]]
id = "codes-and-data"
name = "编码与数据"
note = "把你打进去的内容变成机器读得懂的东西，不用离开这个页面。"

[[hub.categories]]
id = "text-and-code"
name = "文本与代码"
note = "看一看、比一比、编个码，不用把令牌和配置文件贴到别人的服务器上。"

[[hub.categories]]
id = "passwords-and-security"
name = "密码与安全"
note = "秘密就在你自己的设备上生成，别人从来没有过副本，也就无从丢失。"

