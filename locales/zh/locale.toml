#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "路线图"
title = "路线图 | abox.tools 接下来做什么"
description = "abox.tools 打算做的工具都在这儿，分好类，公开列着，已经做完的也在。全都在浏览器里跑，全都不上传。"
heading = "接下来做什么"
lede = """
    下面两份清单上的每一项，都得在你的浏览器里干活，都得不上传东西。过不了\
    这一关，名字根本上不了榜。两个数字没写死在任何地方，是构建脚本从清单上\
    数出来的。"""

intro_heading = "这份清单是怎么定出来的"
intro = """
    <p>
      这不是许愿单。做法是把网上最大那家 GIF 和视频站点的工具列表从头到尾过\
      一遍，那份列表大概是现存最接近“人们到底想拿文件做什么”的一份目录，然后\
      只留下那些能做到在你自己机器上完成、拔了网线也照干的条目。
    </p>
    <p>
      留下来的绝大多数，靠浏览器本来就带的接口就够了。少数几个得把编解码器\
      打包进唯一用到它的那个工具里，这也算过关，文件照样不出这台机器。达不到\
      这条线的宁可不写，所以下面几个看着很明显的空缺，是故意空着的。
    </p>
    <p>
      已经做出来的排在各自分组最前面，标着<em>已完成</em>，点进去就是它自己的\
      页面。下面的都还没做，做出来之前不会变成链接。
    </p>"""

planned_heading = "每一类文件，以及能拿它做什么"

og_title = "abox.tools 路线图"
og_description = "哪些做好了，接下来做什么。全都在浏览器里跑，全都不上传。"
og_image_alt = "abox.tools - 不走服务器的工具"

