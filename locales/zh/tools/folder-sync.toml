name = "文件夹同步"
heading = "文件夹同步 <span class=\"h1-kw\">&mdash; 让两台设备上的文件夹保持一致</span>"
tagline = "在两台设备上各选一个文件夹，查看每一处差异。缺少或较新的文件，会在同一网络的两个浏览器之间直接复制。不上传任何文件，也绝不删除任何文件。"

title = "在两台设备之间同步文件夹 | 浏览器直连，不上传"
description = "让两台电脑上的文件夹保持一致。比较两个文件夹，逐一检查每处改动，再在同一网络的浏览器之间直接复制文件。不上传，不用账号，不删除任何文件。"
og_title = "让两台设备上的文件夹保持一致"
og_description = "比较两个文件夹，在同一网络的浏览器之间直接复制缺少或较新的文件。不上传，不用账号，不删除任何文件。"
og_image_alt = "文件夹同步 - 让两台设备上的文件夹保持一致"

pledge = "你在两台设备上各选一个文件夹，并批准加入的设备。随后，两个浏览器通过彼此直接建立的加密连接比较文件名、大小和日期，再复制你同意的文件，中间不经过任何服务器。这里没有中转，所以两台设备需要处在同一个能互相访问的网络中。配对要用到互联网上的引介服务。它能看到连接准备的元数据，但看不到任何文件、文件名或比较结果。收到的文件全部到达后才会替换旧文件，任何文件都不会被删除。选择“停止”或关闭任一页面，即可结束会话。"
pledge_line = "文件加密后<strong>在你的两台设备之间直接传输</strong>。不上传任何内容，由引介服务把两个浏览器连接起来。"
md_note = "在两个已获批准的浏览器之间直接比较文件夹、复制文件，全程加密，没有中转。互联网引介只传递连接准备的元数据，从不传递文件、文件名或文件列表。任何文件都不会被删除。"
live_hint = "开发者工具里能看到一条连往引介服务的 WebSocket，用来传递引介消息。勾选“在可用连接中显示”或选择“查找连接”，会另开一条用于发现的 WebSocket。文件列表和文件通过加密的 WebRTC 在两台设备之间直接传输。仅凭网络面板和 CSP，检查不到这部分点对点流量。网站框架照常加载第三方资源。"
read_first = "，<code>src/plan.js</code> 说明两份文件列表如何变成差异清单，以及为什么不删除任何文件；<code>src/transfer.js</code> 是带确认的传输，大文件不必整个放进内存；<code>src/folder.js</code> 负责写入，文件完整后才替换原文件；<code>src/session.js</code> 负责在比较任何文件夹之前完成批准。引介服务的源码发布在工具旁边的 <code>workers/rendezvous/</code> 里。"
howto_heading = "如何在两台设备之间同步文件夹"
card = "比较两台设备上的文件夹，在同一网络的浏览器之间直接复制缺少或较新的文件。不上传，不删除。"

