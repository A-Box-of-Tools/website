[[privacy]]
title = "文件夹由你选，设备由你批准。"
body = "每台设备都在浏览器自带的选择器里选自己的文件夹，本页触及不到文件夹以外的任何东西。发起同步的设备要先批准加入的设备，才会发送任一文件夹的任何信息。在此之前，第一条点对点连接只承载一条加密的控制通道，以及加入设备的请求和可选备注。备注是对方自己填写的文字，不是经过验证的身份。同一时间只能有一台设备与主机同步，另外最多可有四个请求排队等待。加入的浏览器会在本地保存一张随机批准凭据，只通过加密的点对点通道出示，因此重新连接同一会话时无需再次批准。停止同步或断开那台设备，凭据随即作废。"
[[privacy]]
title = "另一台设备能看到你的文件列表，以及你同步的文件。"
body = "获批后，每台设备都会把所选文件夹里每个文件的路径、大小和最后修改日期发给对方，供两边比较。不会被复制的文件也在其中。两个文件大小相同、日期不同时，每台设备会读取自己的副本，发送内容的指纹，而不是内容本身。只有按下“立即同步”，才会发送文件本身，而且只发送同步计划中两台设备的设置都允许的文件。设为“仅发送”的设备不接收任何文件，设为“仅接收”的设备不发送任何文件。另一台设备会留下它收到的一切。"
[[privacy]]
title = "文件加密后在设备之间直接传输。"
body = "文件列表、指纹和文件，都通过两个浏览器之间直接建立的加密 WebRTC 连接传输。只接受主机候选地址，不配置公共 STUN 服务器，也没有中转，所以途中不经过任何服务器。两台设备需要处在能互相访问的网络中，比如同一个 Wi-Fi、以太网或手机热点。访客网络隔离、防火墙、VPN 路由和浏览器的本地网络权限，都可能阻止连接。主机地址可能包括公网接口，也可能走 VPN 路由，因此这并不能证明流量始终留在一栋建筑之内。"
[[privacy]]
title = "配对时，引介服务能看到连接准备的元数据。"
body = "发起或加入同步时，页面会打开一条连往 <code>rendezvous.abox.tools</code> 的 WebSocket。这项服务能看到随机房间代码、IP 地址、连接时间、WebRTC 会话描述和 ICE 候选地址，这些准备消息对它并不隐藏。文件名、文件列表、指纹、文件、备注和批准决定，都通过加密的点对点连接传输。房间内容不会写入存储。运行这项服务的 Cloudflare 会把连接日志保留七天，日志里有代码、地址和时间等请求元数据。发现和建立连接都需要联网。"
[[privacy]]
title = "发现功能可选，只列出邀请码。"
body = "“在可用连接中显示”默认关闭。发起前勾选它，才会公布随机邀请码，在你停止之前，邀请码保持不变。另一台设备选择“查找连接”就能看到它。不会列出文件夹名、文件名或文件数量。这项服务按公网 IPv4 地址或 IPv6 /64 子网以及网站来源，为本工具的页面分组。因此，共享的运营商网关或 VPN 可能把陌生人包括进来，不同的网络路径也可能让附近的设备不出现。私密群组则在每台设备上使用同一个随机群组代码。服务会收到这个代码，用来验证对应的目录；本工具既不保存它，也不把它放进同步链接。任何持有群组代码的人都能看到列出的会话，但仍然需要批准。"
[[privacy]]
title = "要么完整写入，要么不写，而且什么都不删除。"
body = "收到的文件先写入旁边的一个临时副本，每个字节都到达后才替换旧文件。所以同步即使被取消或中断，也不会留下写了一半的文件。如果写入中断，而这个文件此前并不存在，它会被重新移除。两个文件夹里的任何文件都不会被删除。写入会把文件的日期改成今天，因为网页无法设置文件的修改日期。在无法写入文件夹的浏览器里，收到的文件会收集在本页的内存中，等你选择保存时，存成一个 ZIP。"
[[privacy]]
title = "页面脚本能看到邀请。"
body = "每次会话都使用一个新的随机链接。持有链接就能尝试连接，接下来如何仍由批准决定。本页带有本站常规的 Google 广告和统计脚本。本工具不会主动把文件名、文件列表或文件交给它们，但在页面中运行的脚本能读取页面地址和同一页面内的状态，包括链接里的代码。请把预期设备发来的请求和你的批准，当作放行的关口。"

[[howto]]
title = "在两台设备上打开本工具。"
body = "要让文件夹既能发送又能接收，请在电脑上使用 Chrome、Edge 或其他大多数 Chromium 浏览器。Firefox 和 Safari 可以发送文件夹，接收时存成 ZIP。把两台设备连到同一个 Wi-Fi、以太网或手机热点，并保持联网，以便完成引介。"
[[howto]]
title = "在每台设备上选择文件夹。"
body = "选好文件夹。如果这台设备要接收文件，请允许浏览器修改这个文件夹。再选定每台设备做什么：“发送和接收”“仅发送”或“仅接收”。系统文件、临时副本，以及 Windows、macOS 或 Linux 中任何一个无法保存的名称，都会被排除并列出。"
[[howto]]
title = "在一台设备上发起，从另一台加入。"
body = "选择“发起同步”，然后在另一台设备上打开同步链接。如果你勾选了“在可用连接中显示”，也可以让另一台设备选择“查找连接”，再选择“加入”。批准你认得的请求。在你批准之前，任何一个文件夹的信息都不会发出。"
[[howto]]
title = "检查比较结果。"
body = "两台设备都会列出每一处差异：只在一侧的文件、一侧较新的文件，以及内容不同但日期相同的文件。每一行都显示默认处理方式，你可以改成“发送过去”“复制到这里”或“保持原样”。工具不会删除任何文件，所以你特意删掉的文件，应设为“保持原样”，或者在两台设备上都删除。"
[[howto]]
title = "同步，以后再重新比较。"
body = "在任一台设备上选择“立即同步”。两边都会显示进度，文件全部到达后才会替换较旧的副本。完成后，两个文件夹会重新读取并比较。保持两个页面开启，以后就能再次同步；也可以停止，需要时再开始新的会话。"

[[faq]]
q = "我的文件会上传到什么地方吗？"
a = "不会。文件、文件名和文件夹列表，都通过你的两个浏览器之间直接建立的加密连接传输，也没有中转。负责连接浏览器的引介服务能看到房间代码和 IP 地址等连接准备的元数据，但永远看不到任何一个文件夹里有什么。"
[[faq]]
q = "我在另一台设备上删掉的文件，它也会删掉吗？"
a = "不会，永远不会。没有上次同步的记录，一台设备上缺少的文件，看起来就和另一台设备上新建的文件一模一样，猜错会毁掉别人的工作。一侧缺少的文件，会提议复制到那一侧。你可以把它那一行设为“保持原样”，或者在两台设备上都删除它。"
[[faq]]
q = "同一个文件在两台设备上都改过，以哪一份为准？"
a = "默认由修改日期较晚的副本替换较旧的那份，那一行会写明复制的方向。同步之前，任何一行都可以改。两份内容不同、日期完全相同的副本，会保持原样，直到你做出选择。大小相同、日期不同的文件，会先比较内容，所以相同的副本绝不会再发送一次。"
[[faq]]
q = "哪些浏览器可以使用？"
a = "电脑上的 Chrome、Edge 和其他大多数 Chromium 浏览器，能读取文件夹，也能写入文件夹。Firefox 和 Safari 可以选择要发送的文件夹，接收时把文件存成一个 ZIP，由你自己解压，上限 512 MB。完全不能选择文件夹的浏览器（大多数手机上就是这样）只能以 ZIP 形式接收。"
[[faq]]
q = "两台设备需要在同一个网络上吗？"
a = "需要。文件在设备之间直接传输，所以它们需要处在能互相访问的网络中，比如同一个 Wi-Fi、以太网或手机热点。两台设备还都需要联网，才能完成引介。访客网络、客户端隔离、防火墙和 VPN 都可能阻断连接。不在同一网络的设备，没有中转可用。"
[[faq]]
q = "别人能加入我的同步吗？"
a = "必须经过你批准。同步链接或列出的邀请码，只能让一台设备申请加入。每个请求都由你批准或拒绝，在此之前，你文件夹的任何信息都不会发出。同一时间只能有一台设备与你的设备同步。请求里的备注是对方自己填写的，所以批准之前，请确认你认得这台设备，时机也对得上。"
[[faq]]
q = "能不能不让另一台设备修改我的文件夹？"
a = "能。开始之前，把这台设备设为“仅发送”。另一台设备可以从你的文件夹复制文件，但不能写入，任何需要写入的同步计划都会被本页拒绝。“仅接收”正好相反，文件只进不出。你的文件一个也不会发出，不过文件列表仍会参与比较。"
[[faq]]
q = "同步到一半连接断了，会怎样？"
a = "已完整收到的文件都会保留。仍在传输的文件会被丢弃，它的旧副本（如果有）原封不动，因为收到的文件要等每个字节都到达，才会替换旧文件。重新连接并比较，下一份同步计划会补上仍然缺少的文件。"
[[faq]]
q = "为什么同步过来的文件显示今天的日期？"
a = "网页能写入文件内容，却无法设置文件的最后修改日期，所以收到的文件，日期就是写入的时间。下次比较时，会检查大小相同、日期不同的文件内容，内容相同的副本视为已经同步。"
[[faq]]
q = "文件夹大小有上限吗？"
a = "每个文件夹最多 50,000 个文件。写入文件夹时，每个文件以流的方式写到磁盘，所以大文件没有问题。接收到 ZIP 时，文件放在内存里，上限 512 MB。层级很深或很长的路径，以及 Windows、macOS 或 Linux 中任何一个无法保存的名称，都会被排除并列出。"
[[faq]]
q = "帮忙建立连接的服务能知道什么？"
a = "引介服务能看到邀请码、IP 地址、连接时间、WebRTC 会话描述和候选地址。如果主机选择公开到发现列表，所选网络或私密群组里的设备就能看到这个随机邀请码。私密群组代码会发给这项服务，用来验证群组目录；同步链接里不带它。Cloudflare 会把引介请求的元数据保留七天。文件名、文件列表、指纹、文件、备注和批准结果，都走加密的点对点连接。"

