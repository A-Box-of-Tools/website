<main id="main">
  <!-- 第一步 &mdash; 四件事里的哪一件 -->
  <section class="card">
    <h2><span class="step">1</span> 选好要做的事</h2>

    <!--
      A tab strip rather than four pages, because the four jobs share an input:
      the JSON you just formatted is the JSON you want to diff against the one
      from the other branch, and retyping it into a second tool is the thing
      this arrangement exists to avoid. `role="tablist"` and the arrow keys are
      wired in main.js.
    -->
    <div class="tabs" role="tablist" aria-label="要拿这段文本做什么">
      <button type="button" role="tab" id="tab-format" class="tab" data-mode="format"
              aria-selected="true" aria-controls="options-format">格式化</button>
      <button type="button" role="tab" id="tab-convert" class="tab" data-mode="convert"
              aria-selected="false" tabindex="-1" aria-controls="options-convert">转换</button>
      <button type="button" role="tab" id="tab-encode" class="tab" data-mode="encode"
              aria-selected="false" tabindex="-1" aria-controls="options-encode">编码</button>
      <button type="button" role="tab" id="tab-diff" class="tab" data-mode="diff"
              aria-selected="false" tabindex="-1" aria-controls="options-diff">比对</button>
    </div>

    <div class="settings" id="options-format" role="tabpanel" aria-labelledby="tab-format">
      <div class="field">
        <label for="language">语言</label>
        <select id="language">
          <option value="auto" selected>从文本里判断</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="yaml">YAML</option>
        </select>
        <p class="field-note" id="language-note">
          判断只是个起点，改正只要一次点击。
        </p>
      </div>

      <div class="field">
        <label for="indent">缩进</label>
        <select id="indent">
          <option value="2" selected>两个空格</option>
          <option value="4">四个空格</option>
          <option value="tab">一个制表符</option>
        </select>
      </div>

      <div class="field">
        <label for="style">排法</label>
        <select id="style">
          <option value="pretty" selected>排开</option>
          <option value="minify">压平</option>
        </select>
        <p class="field-note" id="style-note"></p>
      </div>

      <div class="field checks">
        <label class="check" for="sort-keys">
          <input type="checkbox" id="sort-keys">
          给每个对象的键排序
        </label>
        <p class="field-note">
          按键读起来的顺序，而不是按码位，所以 <code>item2</code> 排在
          <code>item10</code> 前面。仅限 JSON。
        </p>
      </div>
    </div>

    <div class="settings" id="options-convert" role="tabpanel" aria-labelledby="tab-convert" hidden>
      <div class="field">
        <label for="conversion">转换</label>
        <select id="conversion"></select>
        <p class="field-note" id="conversion-note"></p>
      </div>

      <div class="field" id="root-field" hidden>
        <label for="root-name">最外层元素的名字</label>
        <input type="text" id="root-name" value="root" spellcheck="false" autocomplete="off">
        <p class="field-note">
          XML 顶上只有一个元素，JSON 没有，所以得替它造一个。
        </p>
      </div>
    </div>

    <div class="settings" id="options-encode" role="tabpanel" aria-labelledby="tab-encode" hidden>
      <div class="field">
        <label for="codec">编码方式</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>哪个方向</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>编码</strong> 进去是明文，出来是编码后的。</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>解码</strong> 进去是编码后的，出来是明文。</span>
          </label>
        </fieldset>
      </div>
    </div>

    <div class="settings" id="options-diff" role="tabpanel" aria-labelledby="tab-diff" hidden>
      <div class="field">
        <label for="view">怎么显示</label>
        <select id="view">
          <option value="split" selected>左右并排</option>
          <option value="unified">单列</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          只显示改动的地方，前后各带三行
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          忽略空白
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          忽略大小写
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          忽略空行
        </label>
      </div>
    </div>
  </section>

  <!-- 第二步 &mdash; 文本本身 -->
  <section class="card">
    <h2><span class="step">2</span> 贴进来</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes" id="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input" id="input-label">你的文本</label>
          <span class="count" id="input-count">空的</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="把 JSON、XML、HTML、CSS 或 YAML 贴在这里，或者把文件拖到上面。"></textarea>
      </div>

      <div class="pane" id="pane-b" hidden>
        <div class="pane-head">
          <label for="input-b">另一份</label>
          <span class="count" id="input-b-count">空的</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="把用来比对的那一版贴进来。"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count" id="detected"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">试个例子</button>
        <button type="button" id="swap" class="ghost" hidden>左右对调</button>
        <button type="button" id="clear" class="ghost danger">清空</button>
      </div>
    </div>
  </section>

  <!-- 第三步 &mdash; 出来的东西 -->
  <section class="card">
    <h2><span class="step">3</span> 把结果带走</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">还没有结果。</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>复制</button>
        <a id="download" class="ghost as-button" hidden download>下载</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>

    <div id="diff-view" class="diff" hidden></div>
  </section>
</main>
