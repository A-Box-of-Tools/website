      白天，对着一面素净的墙，从大约一米半外用手机拍的一张就行。浏览器直接从\
      磁盘上读，这期间没有任何东西发往别处。"""

[[howto]]
title = "选好国家和证件。"
body = """\
      面板随即显示那条规定的打印尺寸、头高区间、眼线、背景色和上传限制，并注明\
      每个数字出自哪个机构、哪天读的。这份清单里没有一条是猜的；要是人家给你的\
      要求不在上面，就走“其他国家和地区”自己填。"""

[[howto]]
title = "把四个点拖到脸上。"
body = """\
      头顶、下巴，以及左右瞳孔。规定要量的全部就是这四个点，所以这个工具宁愿\
      让你放，也不去猜。放好之后按<em>套用裁切框</em>，裁切就落在那个国家要的\
