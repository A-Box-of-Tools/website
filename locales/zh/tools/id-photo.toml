      <code>Content-Security-Policy</code> 里写着这个页面允许联系的每一个地址，\
      没有一个属于本站。这里没有任何可以收走你照片的接收端。"""

[[privacy]]
title = "这里不会去取任何东西。"
body = """\
      整个 <code>src/</code> 里没有 <code>fetch</code>，没有 \
