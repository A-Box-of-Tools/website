[[howto]]
title = "看那四项检查，还有背景。"
body = """\
      头高、眼线、居中和倾斜，每一项都是按当前的框量出来的，超标的还会说明该往\
      哪边拖。背景取自裁切框的顶边和两侧，再和规定要求的颜色比对；真正让照片被\
      退回的“不均匀”，是和颜色分开量的。"""

[[howto]]
title = "把三个文件带走。"
body = """\
      打印用的那张，尺寸精确到毫米，分辨率写在文件里，冲印店才会按正确大小出。\
      拼版那张，10&nbsp;&times;&nbsp;15 上能排几张就排几张，缝隙里带裁切标记。\
      还有上传用的那张，像素尺寸按门户要求，并落在它两头都卡的 KB 区间里。"""

[[faq]]
q = "我的照片会被传到哪里去吗？"
a = """
        不会。图像的解码、裁切、测量和写出，都由你自己的浏览器在你自己的硬件上\
        完成，用的是浏览器本来就带的 JPEG 编码器。这个工具没有任何形式的网络功能：\
        它从不去取什么，也从不发出什么；页面的 <code>Content-Security-Policy</code> \
        里写着它允许联系的每一个地址，没有一个属于本站。这一点在这儿比在别的工具上\
        更值钱，因为这个文件是你脸的照片。"""

[[faq]]
q = "覆盖了哪些国家？"
a = """
        目前抄录的规格有：国际民航组织（ICAO）标准本身，美国（护照，以及上传规则\
        不同的多元化签证抽签申请），英国，申根签证，德国，加拿大，澳大利亚，印度\
        （护照、35&nbsp;&times;&nbsp;45&nbsp;mm 冲印，以及 SSC/UPSC 表单照片和\
        签名），中国和日本。每一条都注明出自哪个机构、哪天读的。其他的走“其他国家\
        和地区”，那里每个数字都由你自己填；而由于世界上大多数地方都按 ICAO 的\
        几何要求签发，那一项一开始就用的是它。"""

[[faq]]
q = "为什么要我自己标脸，而不是自动找出来？"
a = """
        因为找脸意味着要带一个模型：要下载的权重、跑权重的推理运行时，以及一种\
        并不均匀的失败方式。检测器在某些脸上明显比在另一些脸上差，而照片本来就\
        最常被退回的那些人，恰恰是它会辜负的人。拖四个点大约八秒，是准的，而且\
        对每个人都是同样的八秒。浏览器那个实验性的人脸检测，只在一种浏览器里、\
        还得开开关才能用——那不是功能，那是一个换个地方打开就换个行为的工具。"""

[[faq]]
q = "头高规定是什么，为什么我的老是不合格？"
a = """
        这些规格每一条都写明头部要占画面多少，从下巴底量到头顶，含头发在内；通常\
        是 70% 到 80%，对一张 45&nbsp;mm 高的照片来说就是 31.5 到 36&nbsp;mm。\
        最常见的不合格原因是自拍：一臂长大约 60&nbsp;cm，会让脸变形，也让头在画面\
        里显得太大。第二常见的原因是头顶：头顶指的是头发的最高点，不是发际线，标在\
        发际线上会让每个头都偏小。"""

[[faq]]
q = "为什么文件至少要 20 KB，又怎么把它填大？"
a = """
        印度的考试门户、中国的签证表单和英国的护照上传，都同时规定了最小和最大\
        文件大小，因为小于下限的文件通常是有人误传的缩略图。一张 \
        200&nbsp;&times;&nbsp;230 的照片是 46,000 个像素，即便用浏览器能写出的\
        最高画质，也可能只有 15&nbsp;KB，而且没法靠少压缩把它变大。于是这个工具\
        加了一段塞满空格的 JPEG 注释。这本来就是 JPEG 标准的一部分，任何解码器都\
        会跳过，画面逐位都还是同一幅画面，变长的只有文件本身。那段填充里就用英文\
        写着这件事。"""

[[faq]]
q = "它会检查背景吗，能替换背景吗？"
a = """
        它检查，但不替换。颜色取自裁切框顶部的一条带子，以及两侧肩膀以上的部分，\
        再和规定的颜色在 CIE Lab 里比对，而不是在 RGB 里：相差四十个 RGB 单位的\
        两种灰根本分不出来，而四十个单位的蓝就是另一种颜色了。不均匀是单独测的，\
        因为白墙上的一道影子才是真正让照片被退回的原因，而那不是颜色问题。替换\
        背景意味着把人从画面里抠出来，那是分割模型的活，做得不好会吃掉头发。往后\
        退半米离墙远一点，比任何滤镜都更能解决问题。"""

[[faq]]
q = "10 x 15 拼版是干什么用的？"
a = """
        自助照相亭六张要收好几十块。照片店柜台印一张 10&nbsp;&times;&nbsp;15 只要\
        几毛钱，而且哪家都能印。所以这个工具会在纸上排下你这张照片能排的份数——\
        35&nbsp;&times;&nbsp;45 排在 10&nbsp;&times;&nbsp;15 上是八张——缝隙里带\
        裁切标记，任何东西都不会压在照片上。这里不会为了排下而缩放：每一份都严格\
        是规定要求的尺寸，因为一张为了多塞一份而把它们缩小百分之二的拼版，等于\
        八张全都尺寸不对的照片。请按 100% 打印；把拼版弄错的正是“适应页面”。"""

[[faq]]
q = "像素一样的话，DPI 还有什么关系？"
a = """
        因为 JPEG 可以声明自己有多大，不声明的话，打印它的东西就只能猜。分辨率\
        住在 JFIF 文件头里，而浏览器的画布写这个头时，会把单位字段设成“这是宽高\
        比，不是分辨率”。这个工具改写那几个字节，让文件写明 300&nbsp;dpi，正是\
        这一点把 413&nbsp;&times;&nbsp;531 个像素变成一张 \
        35&nbsp;&times;&nbsp;45&nbsp;mm 的照片，而不是一幅没有具体尺寸的图。为此\
        不需要解码，也不消耗画质。"""

[[faq]]
q = "签名文件也能做吗？"
a = """
        能。SSC 和 UPSC 的表单要求 140&nbsp;&times;&nbsp;60 像素、10 到 20&nbsp;KB \
        的签名，它作为单独一条规格列在清单里。做签名时人脸叠加会关掉，因为签名\
        没有眼线；换成检查纸张是否够白、上面是否有墨，以及裁切有没有带进一条格线\
        或者页边。这条规定难的是够到 10&nbsp;KB，而不是不超过 20。"""

[[faq]]
q = "用了这个，我的申请就一定能过吗？"
a = """
        不能，而且任何工具都无法诚实地作此保证。它做的是把公布的数字一字不差地\
        套用，并把它做过的每一次测量都摆给你看：这样表单自动测的那些东西——像素\
        尺寸、文件大小、格式——是对的；而人工审核会看的那些东西——头高、眼线、\
        背景——就带着数字摆在你面前。规定也会变：这里的每一条规格都写明出自哪个\
        机构、哪天读的，好让你拿它去对照眼前那份表单，而不是盲信一张表。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也不会在你脸上盖水印。做多少张照片\
        也没有上限，因为没有哪台服务器在为它们掏钱。本站带广告，经费就是从那儿\
        来的，广告拿不到任何关于你照片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活——规格册是随页面一起送来的文件，\
        不是一次查询。这也是证明“什么都没上传”最省事的办法，真要把你的照片送出去\
        裁切，拔线那一刻就停了。"""

[schema]
description = "在浏览器里按某个国家公布的规格制作护照、签证或身份证件照片。套用所选证件的打印尺寸、DPI、头高区间、眼线和背景色，实时显示并测量每一项，检查背景，排出带裁切标记的可打印 10x15 拼版，并按规定的像素尺寸写出落在门户 KB 区间内的上传文件。什么都不上传。"
features = [
  "一本公布规格的册子，每条都注明出自哪个机构、哪天读的",
  "ICAO Doc 9303 的几何要求：头高占画面的比例，以及眼线距下边缘的高度",
  "锁定规格比例的裁切框，框内画出眼位带和下巴带",
  "四个手动拖放的标记——头顶、下巴和两只瞳孔——而不是人脸检测",
  "实时的头高、眼线、居中和倾斜，每项都说明该往哪边改",
  "背景颜色和均匀度在 CIE Lab 里测量，两者分开报告",
  "按精确毫米打印，分辨率写进 JPEG 文件头",
  "10 x 15、13 x 18、A4 或 Letter 拼版，缝隙里带裁切标记，任何东西都不压在照片上",
  "按规定像素尺寸生成上传文件，并把体积两头都调进门户的 KB 区间",
  "SSC 和 UPSC 表单照 200 x 230、20-50 KB，签名 140 x 60、10-20 KB",
  "断网可用；不上传、不注册、无人脸检测",
]

[picker]
title = "把照片拖到这里"
hint = "也可以点击选择 &mdash; 一张照片，JPEG、PNG、WebP，或者你浏览器能打开的任何格式"
