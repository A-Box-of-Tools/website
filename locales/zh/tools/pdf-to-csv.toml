[[privacy]]
title = "人们拿来转换的 PDF，恰恰是最经不起上传的那些。"
body = """\

      没有人会为一张自己能重新敲一遍的表去找转换工具。来到这里的是对账单、发票、\
      工资条和报告：一份你付给了谁、付完还剩多少的名单，一位客户的报价，一家公司的\
      数字。把这些交给陌生人的服务器去换一张表格，意味着他们拿到了、留下了，并且\
      因此成了一个值得攻击的目标。这一页没有另一头：根本没有可以发过去的地方。"""

[[privacy]]
title = "表格带着余额的时候，每一行都会拿它核对。"
body = """\

      在 PDF 里找出一张表是推断，不是阅读：哪几行属于一起、一栏在哪里结束、一行是\
      新的一行还是上一行的延续，都是推断。碰上这里没见过的排版，任何一步都可能推错。\
      对账单上的余额就是对付这件事的证明：这一行的余额，必须等于上一行的余额加上这\
      一行的金额，任何一个数字读错、任何一行漏掉或者重复，都会正好在出问题的那一行\
      把这条链子打断。页面会说有多少行对上了。大多数表格没有余额，这时页面什么都\
      不说：这些行是页面上写的内容，这里不会声称比这更多。"""

[[privacy]]
title = "表格是从纸面上看出来的，不是靠每家银行、每种表单一套模板。"
body = """\

      这个工具里没有银行列表，也没有版式列表，也就不存在「你的版式不在里面」。一页\
      纸会在旁边有一栏小字的地方被分开，然后在每一块里找那些单元格对得齐的连续几行。\
      所以它在一家没人听说过的银行的对账单上、在一份没人见过的报告上也能用，而碰上\
      栏与栏真的挤在一起的那种表，它也真的会失败。"""

[[privacy]]
title = "密码不由它来取，页面会告诉你去哪里取。"
body = """\

      带密码的 PDF 会被拒绝，而不是被打开。把一份文件的保护取掉，跟读出里面的表格\
      是两回事，一声不响地替你做掉，是一个工具不该有的举动。页面做的是另一件事：把\
      那些不用把文件交出去的办法列给你。头一条是本站的 \
      <a href=\"../unlock-pdf/\">PDF 解锁工具</a>，它在你自己的浏览器里把密码取\
      下来，页面上什么都不改写；也可以用浏览器或者「预览」把它打印、导出成一份新的 \
      PDF。它仍然明明白白地说，不要把这份文件交给别的任何一个说能替你解锁的网站，\
      那正是这一页要挡住的那一次上传。"""

[[privacy]]
title = "它读不了一页纸的照片，也不假装能读。"
body = """\

      扫描件是一张图：那些行是像素，文件里根本没有可以对齐成栏的文字。这一点会被\
      如实报告，同时给出不用上传任何东西的几条路；如果那是一份对账单，头一条是大多数\
      人都有、却想不起来的那条，银行几乎一定可以直接给你同一份对账单的 CSV。从图里\
      认字叫 OCR，那是另一个工具，不是这一个。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
 广告和统计脚本来自 Google。这两个都没有拿到关于你文件的\
      任何东西：不是文件，不是某张表、某一行，不是某个数字、文件名或者页数。每一行\
      读 PDF 或者写 CSV 的代码都由这个源站发出，并且列在代码仓库里。"""

[[privacy]]
title = "打赏按钮加载了什么，又没拿到什么。"
body = """\

      页眉上那个「Buy me a coffee」按钮，是由 cdnjs.buymeacoffee.com 的一段脚本\
      画出来的，字体取自 Google Fonts。它就是一个链接，仅此而已：它不上报访问，\
      也拿不到任何关于你或者你文件的东西。你不点它就什么都不会发生，而点下去\
      要去的是别人的网站。"""

[[privacy]]
title = "断网也能用。"
body = """\
 把网络断掉，这一页上的所有功能照常。这是最简单的一个\
      证明：一个把你的文件发出去转换的工具，这时候就停了。"""

[[howto]]
title = "选一份 PDF。"
body = """\
 一次一份。浏览器直接从你的硬盘上把它读进来，\
      而且是整份都读完再决定任何事，因为这份文件写的是 1.240,00 还是 1,240.00、\
      日期是哪一种顺序，都是关于这份文件的事实，不是关于某一页的。"""

[[howto]]
title = "看看它找出来的那些表。"
body = """\
 每一页上的每一张表，各有各的栏位，页面上印了\
      表头的地方就用它自己的表头。跨两个小节或者两页、表头相同的一张表算一张，中间\
      不会重复表头。折到第二行的单元格会并回它那一行。合计、小计和标签，都按它们在\
      页面上的样子作为行出来。"""

[[howto]]
title = "挑一张，或者全要。"
body = """\
 表不止一张的时候，表格上方那个选项决定哪些进 \
      CSV：全部一张接一张，或者只要你来找的那一张。要是某张表带着余额，表格上方那\
      一行会说每一行是不是都对上了。带年份的日期写成 YYYY-MM-DD，金额是带正负号的\
      普通数字；没有年份的日期原样保留，因为它属于哪一年只能靠猜。"""

[[howto]]
title = "把 CSV 拿走。"
body = """\
 它按 RFC 4180 写，该加的引号都加，行尾是 \
      CRLF，编码是带字节序标记的 UTF-8，这样 Excel 打开它的时候货币符号还是货币\
      符号，而不会变成一串字母。所有表放在一个文件里的时候，每张表保留自己的表头行，\
      表与表之间空一行。做出它来没有上传过任何东西。"""

[[faq]]
q = "PDF 里根本没有表格，它怎么找出表格来？"
a = """
        从文字落在哪里看出来。一页纸先在旁边有一栏小字的地方被分开；这一栏小字跟\
        表格里的一栏分得开，是因为表格的单元格恰好落在同一条基线上，而小字只是碰巧\
        挨在旁边。然后每一块从上往下走，在标题和空白处切成一段一段，每一段的栏位，\
        就是好几行都认同一个单元格在那里开始或者结束的位置。栏位相同的几段会重新拼成\
        一张表。这里没有按银行或者按表单分的模板，所以也不存在哪种版式它没学过。"""

[[faq]]
q = "它只能处理对账单吗？"
a = """
        不是。它一开始是个对账单转换工具，后来改成找出一份文件里的每一张表，因为头\
        一份真正拿来试的对账单只有两笔交易，却有另外五张表，一个只要交易的工具在上面\
        什么都没找到。发票、价目表、时刻表、成绩和报告，同样都是表格。对账单多出来的\
        是余额，只要有，工具就拿它核对每一行。"""

[[faq]]
q = "摘要太长、一栏放不下的时候会怎么样？"
a = """
        它会被并回它那一行，而这正是大多数 PDF 转 CSV 的结果没法用的原因。只有一格\
        文字、紧挨着某一行的一行，就是那一行的单元格的延续；如果它离下面那一行更近，\
        就并到下面那一行里，一段放在数值上方、太长而折行的标签就是这么印的。带着不止\
        一格、或者带着数字的一行，是它自己的一行。"""

[[faq]]
q = "它到底怎么可能知道我的对账单读对了没有？"
a = """
        因为大多数对账单都带着余额，而余额是一次证明，不是装饰。如果每一行上印着的\
        余额，确实等于上一行的余额加上这一行的金额，那么金额就读对了、行就分对了，\
        而且没有哪一行被漏掉或者算了两遍，因为上面任何一种错误，都会正好在出错的\
        那一行把链子打断。工具在每一行上做这道减法，然后把结果告诉你。它找余额\
        那一栏用的也是同一道算术，而不是去读表头，所以一张能通过的表，必然意味着\
        栏位也认对了。没有余额的表格没法这样核对，页面也不会假装核对过。"""

[[faq]]
q = "日期出错了。03/04 是 3 月 4 日，不是 4 月 3 日。"
a = """
        改表格上方那个选项，全部立刻重算。纯数字的日期确实有歧义，而工具是从这份\
        文件本身来定它，不是从你所在的地区：只要这份文件里任何一处的日期有大于 \
        12 的那一位，仅这一行就把所有日期的顺序定下来了，页面也会说明这一点。当\
        每一个日期都落在 12 号或者更早的时候，文件里没有任何东西能把两种顺序分开，\
        所以它会说的正是<em>这件事</em>，并且先按日在前来算，直到你另行指定。像\
        信用卡对账单那样不带年份印出来的日期，原样保留。"""

[[faq]]
q = "扫描出来的 PDF 能用吗？"
a = """
        不能，而且它会直说，而不是丢给你一个空文件。扫描件是一张照片：那些行是\
        像素，没有可以对齐的文字。页面接着会告诉你可以怎么办；如果是对账单，头一条\
        建议正是大多数人会忽略的那条，几乎每一家网上银行都可以直接给你同一份对账单\
        的 CSV、OFX 或者 QIF，那既不用转换，也比从任何一张图里读出来更准确。"""

[[faq]]
q = "带密码的 PDF 它能打开吗？"
a = """
        不能，而且这是故意的。银行会给很多对账单上锁，通常用出生日期或者账号的后\
        几位。把这层保护取掉，跟读出一张表是两回事，所以工具会拒绝，并且指给你几条\
        不用把文件交出去的路。最好的一条是本站的 \
        <a href=\"../unlock-pdf/\">PDF 解锁工具</a>：它在你自己的浏览器里把密码\
        取下来，页面上一个字都不改写，所以文字会原样落在它当初被印上去的位置。\
        用 Chrome 或者 Edge 输入密码打开再打印回 PDF，或者在 Mac 上用「预览」\
        导出，也一样可以。不要用别的那些说能替你解锁的网站，那正是把这一页存在的\
        意义所要挡住的那份文件传上去。"""

[[faq]]
q = "我的 PDF 会被上传到什么地方吗？"
a = """
        不会。文件是你自己的浏览器在你自己的硬件上读的，CSV 也是这样写出来的。\
        这个工具没有服务器那一端，页面的 <code>Content-Security-Policy</code> 列出了\
        它可以联系的每一个地址，其中没有一个属于本站。最简单的证明，是断开网络，\
        照样转一份 PDF。"""

[[faq]]
q = "CSV 开头那个奇怪的字符是什么？"
a = """
        那是字节序标记，是故意留的。Windows 上的 Excel 读一个没有它的 CSV 时，会\
        按系统的旧代码页来解，于是一张以英镑或者欧元记账的表格，货币符号会变成\
        一个字母。这个标记告诉它这是 UTF-8。所有要紧的读取程序都会悄悄跳过它；\
        严格到会把它显示出来的解析器，会给你一个开头带着不可见字符的首列表头，\
        这就是这个取舍的代价。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        工具里没有写死任何限制。限制是你自己的机器：文件在读的时候是放在内存里的，\
        几百页的量，一台笔记本处理起来不会有怨言。它是免费的，不注册、不登录，也\
        没有试用期。本站带广告，那是养活它的东西；广告拿不到任何关于你文件的内容。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没被上传的\
        最简单的办法：一个把你的文件发出去转换的工具，你一拔网线它就停了。"""

