#
# PDF to CSV - 简体中文。
#
# Overrides for tools/pdf-to-csv/tool.toml. Only words: the slug,
# the category, the icon, the CSP and the list of shared parts stay where they
# are.
#
# 改这一页的话术时要守住的一件事：这个工具是「推断」出表格，不是「读」出表格。
# PDF 里根本没有表格，只有落在纸面各个位置上的文字，栏位是好几行都认同一个单元格
# 在那里开始或者结束的位置。下面每一句话都必须让这一点成立。余额核对是一次证明，
# 也照证明来写，但只有一部分表格带着余额；不要在改写里把「这是页面上写的内容」
# 悄悄升级成「这是对的」。
#
# 它原来是「对账单转 CSV」，后来改成找出一份 PDF 里的每一张表：头一份真正拿来试
# 的对账单只有两笔交易，却有另外五张表。名字因此改成「PDF 转 CSV」；「对账单」仍
# 是本站对 bank statement 的说法，只在说到对账单本身的地方用。
#
# [[faq]] 是按顺序跟英文一一对应的，不是按 id。英文加一条、删一条，这里就要在同一
# 个位置加、删，否则后面每一个问题都会配上别的问题的答案。
#

