[[privacy]]
title = "你的视频没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个\
      属于本站。这里没有任何可以收走你文件的接收端，就算有，代码里也没有\
      把文件送过去的东西。"""

[[privacy]]
title = "这里不会去取任何东西。"
body = """\
      这个工具压根就没有网络功能：没有地址可填，没有东西要下载，第一次用也\
      不会拉什么引擎。碰到你视频的每一个字节，都是页面加载时从这个源来的。"""

[[privacy]]
title = "解码在本地完成。"
body = """\
      帧要么走你自己浏览器里的 WebCodecs，要么走本来就会给你放这个片子的\
      那套播放引擎。画面画在这台机器的 canvas 上，然后直接交给下载。"""

[[privacy]]
title = "文件是几兆几兆读的。"
body = """\
      视频是这里唯一一种不能保证塞得进内存的文件，所以从来不整个加载。读取\
      器只取你要的那一帧前后的一小段窗口，这也是两个 G 的片子和小片子开得\
      一样快的原因。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你视频的信息，一条也没有交给它们，\
      文件、某一帧、名字、大小、时长、你停在哪一刻，都没有。读取、解码、\
      绘制的每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页首那个“Buy me a coffee”按钮由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它不过是个链接，不上报访问，也拿不到关于你或\
      你视频的任何东西。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是最省事的一条证明。"""

[[howto]]
title = "选一个视频。"
body = """\
      把 MP4、MOV、M4V 或 WebM 拖到选择框里，或者自己找出来。浏览器直接从\
      磁盘上读，这期间没有任何东西发往别处。"""

[[howto]]
title = "找到那个瞬间。"
body = """\
      播放然后在想要的地方停下，或者拖动滑块。MP4 的滑块一格就是一帧，所以\
      你看到的和你存下的之间不存在取整。方向键一次挪一帧，按住 \
      <kbd>Shift</kbd> 一次挪十帧。"""

[[howto]]
title = "挑一个格式。"
body = """\
      PNG 会把解码出来的帧原样存下，这就是这里说的“原画质”。JPEG 和 WebP \
      更小，但会在视频自身的压缩之上再压一遍，用来预览没问题，用在之后还要\
      再编辑的图上就不合适。"""

[[howto]]
title = "截一张，或者截一串。"
body = """\
      单张会直接进你的下载。“每 N 秒”会把片子走一遍，在每个刻度取一张，做\
      一览图和缩略图时很好用，而且它们会打包成一个 ZIP，而不是弹一百次保存\
      提示。"""

[[faq]]
q = "我的视频会被传到哪里去吗？"
a = """
        不会。它由你自己的浏览器在你自己的硬件上读取和解码。这个工具没有服务\
        端，页面的 <code>Content-Security-Policy</code> 里写着它允许联系的每一\
        个地址，没有一个属于本站。你要是宁可自己查也不愿听我们说，拔掉网线，\
        照样截一帧试试。"""

[[faq]]
q = "“原画质”到底是什么意思？"
a = """
        两件事。一是这张图按视频本身的分辨率保存，而不是按页面上预览的大小，\
        4K 的片子给的就是 3840 x 2160 的图。二是选了 PNG 的话，这一帧就是从\
        解码器出来时的样子，文件里装的正是视频里装的画面，上面没有再压一层。\
        对着播放器窗口截屏两样都得不到：尺寸是窗口的尺寸，而且是播放器缩放\
        并做完色彩管理之后的画面。"""

[[faq]]
q = "哪些视频格式可以截帧？"
a = """
        MP4、M4V 和 MOV 直接读，里面装什么都行：H.264、HEVC、AV1 或 VP9，只要\
        你的浏览器能解那个编码。这是精确路径，工具能点名到具体某一帧。其他\
        浏览器能播的东西，最典型的是 WebM，则靠把播放器挪过去、再把它显示的\
        内容画下来，一样能存出原尺寸的图，但落到的是播放器选的那一帧，而不是\
        你要的那一帧。浏览器既读不了也播不了的文件，实际上就是 AVI、WMV、FLV \
        和大多数 MKV，会带一句说明直接拒掉。"""

[[faq]]
q = "能一帧一帧地挪吗？"
a = """
        MP4 可以，而且是精确的：工具读的是文件自己的帧列表，所以方向键是在真正\
        存在的那些画面之间移动，哪怕片子的帧率忽高忽低也一样，而按三十分之一秒\
        固定步进就会越走越偏。走播放路径时没有这份列表，一次操作大约挪一帧，\
        页面也会明说。"""

[[faq]]
q = "我竖着拍的手机视频在这儿为什么是正的？"
a = """
        因为旋转是特意应用上去的。手机是横着拍的，然后把“转四分之一圈”写进文件\
        里，而不是真的把像素转过来，所以解码器交出来的帧是躺着的，每个播放器\
        都会在送到你屏幕的路上把它扶正。跳过这一步的工具，会存下一张时刻没错、\
        但躺着的图。这个工具会从轨道里读出旋转值，在画任何东西之前先应用。"""

[[faq]]
q = "视频的大小或时长有上限吗？"
a = """
        工具里没有写死的上限，文件也不会一次性读进内存，而是几兆几兆地走过去，\
        所以长片子和短片子开得一样快。你截下的图在下载之前留在页面里，所以真正\
        的天花板是几百张 4K PNG，而不是视频本身。"""

[[faq]]
q = "截下来的图之后能缩放或裁剪吗？"
a = """
        这里不行，隔壁可以。这个工具只是把帧原样存下来；改尺寸或改形状是另一件\
        事，里面有自己的取舍，<a href="../resize-image/">图片尺寸调整</a>两件都\
        能做，同样什么都不上传。想在不改画面的前提下把文件变小，用\
        <a href="../compress-image/">图片压缩</a>。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你视频的信息。"""

[schema]
browser_requirements = "需要 JavaScript。精确到帧的截取需要支持 WebCodecs 的浏览器，其余情况会退回到移动播放器的方式。"
description = "在浏览器里把视频的任意一帧存成原尺寸 PNG、JPEG 或 WebP。MP4、MOV 和 M4V 通过 WebCodecs 逐帧读取，你要的那一帧就是存下的那一帧；其他浏览器能播的内容则从播放器上取。什么都不上传。"
features = [
  "从 MP4、MOV、M4V 和 WebM 视频里存出静帧",
  "H.264、HEVC、AV1 和 VP9 源，经 WebCodecs 解码",
  "沿着文件自己的帧列表逐帧步进",
  "PNG 原样保存这一帧，JPEG 和 WebP 换取更小的体积",
  "每 N 秒一张，一起打包成 ZIP 下载",
  "断网可用；不上传、不注册、无水印",
]

[picker]
