#
# GIF to MP4 - 简体中文。
#
# Overrides for tools/gif-to-mp4/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样。
#
# 第一件：视频一帧一帧地保留 GIF 的时间。GIF 没有帧率，只有每一帧各自的
# 延时，而且各不相同；一个把它重采样到固定帧率的转换器会把有些帧翻倍、
# 有些帧扔掉，幻灯片式的 GIF 就走样了。这里每一帧就是一个样本，时长就是
# 它的延时，核对的时候会把帧数数回来。
#
# 第二件：老实说清什么变了：GIF 自己会循环而视频不会（由播放器决定），
# GIF 可以让底下的东西透出来而视频不能（页面会问那里填什么颜色）。
# 两件事都写在页面上，而不是事后才发现。
#
# 用词：frame 写「帧」，delay 写「延时」，frame rate 写「帧率」，loop 写
# 「循环」，transparent 写「透明」，resample 写「重采样」。格式名一律不译。
#

