description = "在浏览器里给图片涂黑：在不该被看到的地方拉框，然后涂成纯色、打码或者模糊。被遮的像素在文件编码之前就被覆盖，所以结果里没有图层、没有批注，也没有元数据。什么都不上传。"
features = [
