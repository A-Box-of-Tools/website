[[privacy]]
title = "你的图片没有地方可去。"
body = """\
      这个页面能联系的每一个地址\
      都写在 Content-Security-Policy 里，没有一个是本站的。这里不存在一个能收走\
      你文件的接口，代码里也没有哪一处会去送。"""

[[privacy]]
title = "被遮的像素在这里就没了，不是在出门的路上。"
body = """\
      图片先解码成一块\
      像素缓冲区，框直接写进这块缓冲区，缓冲区再交给编码器。这个页面里不存在一份\
      把框当成单独图层的图片，因为这样的东西从来没被造出来，见\
      <code>src/redact.js</code>。"""

[[privacy]]
title = "这里不去取任何东西。"
body = """\
      <code>src/</code> 里没有 <code>fetch</code>，\
      没有 <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。全部工作\
      就是 <code>getImageData</code>、三个在字节上跑的循环，以及\
      <code>canvas.toBlob</code>，都是浏览器里本来就装好的。"""

[[privacy]]
title = "框的事不会报给任何地方。"
body = """\
      你在哪里拉的框、拉了几个、多大、\
      选了哪一种，都只在这个页面的内存里，关掉就没了。这个仓库里没有任何一个统计\
      事件会带走其中任何一项；下载之后弹出的那一个问题，送出去的只有一个赞成或\
      反对和工具的名字。"""

[[privacy]]
title = "断网也能用。"
body = """\
      拔掉网线，工具照旧，因为它里面本来就没有联网\
      这一步。这是所有证明里最简单的一个，也是涂黑护照之前值得先做一次的那一个。"""

[[howto]]
title = "选一张图片。"
body = """\
      截图、扫描件或者照片都行，只要浏览器打得开。\
      它直接从你的硬盘读进来，这个过程里没有任何东西出去。"""

[[howto]]
title = "在不该被看到的地方拉一个框。"
body = """\
      下一处再拉一个。框可以拖着移动，\
      可以拉四周的把手改大小，也可以用 Tab 键选中再用方向键调整。框下面显示的就是\
      真实结果，画它的正是稍后写文件的那段代码。"""

[[howto]]
title = "在涂黑、打码、模糊里选一个，能选涂黑就选涂黑。"
body = """\
      涂成一片纯色，\
      什么都不会留下。打码和模糊只是把像素换成它们自己的平均值，对付背景里的人脸\
      够用，对付任何能读成文字的东西不够用。"""

[[howto]]
title = "按「涂黑并保存」，然后检查文件。"
body = """\
      之后显示的那张图，就是成品文件\
      被重新解码出来的样子。用编辑器打开找找图层，或者试着选中被遮住的文字：只有\
      平平的一张图，你遮住的地方在它被写出来之前就已经被覆盖了。"""

[[faq]]
q = "我的图片会被上传到什么地方吗？"
a = """
        不会。解码、涂改、重新写出来，都由你自己的浏览器在你自己的机器上完成。这个\
        工具没有任何联网功能，不去取也不去送，页面的\
        <code>Content-Security-Policy</code> 写着它能联系的每一个地址，没有一个是\
        本站的。把页面加载一次，然后断网，它照样能用。"""

[[faq]]
q = "被遮住的那块，真的从文件里没了吗？"
a = """
        是的，这个工具就是为这一点存在的。图片被解码成一块像素缓冲区；框覆盖掉框内\
        的像素；缓冲区再被编码成一个新文件。编码器拿到任何东西之前，原来的数值已经\
        不在内存里了，所以没有图层可以藏，没有批注可以删，也没有历史可以撤销。你可以\
        像检查别人说法那样检查它：把结果用图像编辑器打开找第二个图层，或者试着选中你\
        遮掉的那段文字。"""

[[faq]]
q = "打过码或者模糊过的地方能被还原吗？"
a = """
        有时候能，这也是选之前唯一值得读的一段。涂成纯色，下面的一切都变成同一种\
        颜色，什么都不剩：边缘不剩，平均值不剩，连有几个字都不剩。打码是把每一块换成\
        那一块的平均色，而一格一格的平均值仍然是对下面内容的一次测量。对于常见字体、\
        大小也猜得到的文字，已经有公开的研究把候选字符串照同样的方式渲染、打码，再\
        比对平均值，从而还原出原文。模糊是一次卷积，而卷积原则上可以反过来算。所以\
        背景里的人脸尽管打码，凡是能读成文字的都涂黑。"""

[[faq]]
q = "在文档软件里画一个黑色矩形，为什么不是一回事？"
a = """
        因为大多数软件把那个矩形存在图片旁边，而不是存进图片里。在 PDF 阅读器、\
        幻灯片、文字处理软件或者带图层的图像编辑器里画出来的形状，是一个带位置的\
        对象，压在页面上面。把它挪开、删掉，或者换一个程序打开这个文件，被它盖住的\
        东西就原样回来了。报社、法院和政府部门都这样发布过文件。这里根本不保存那个\
        矩形，留下的只是写在原来数值之上的像素值。"""

[[faq]]
q = "它会不会一并去掉 EXIF 和 GPS 信息？"
a = """
        会，顺带的。保存的意思是把一块画满像素的画布写出来，而画布不带任何标签，所以\
        拍摄地点、相机型号、时间戳和内嵌缩略图根本不会被写进新文件。缩略图在这里尤其\
        要紧：它是图片的第二份小副本，照片被编辑之后不一定会重新生成，一张涂黑过的\
        照片带着没涂黑的缩略图出门，整件事就白做了。如果你只想去掉元数据、又不想让\
        图片被重新编码，<a href="../exif-editor/">EXIF 查看与清除</a>改写的是容器\
        本身。"""

[[faq]]
q = "它能读能写哪些格式？"
a = """
        凡是你的浏览器能解码的它都能读，实际上就是 JPEG、PNG、WebP、GIF、BMP，以及\
        大多数当前浏览器上的 AVIF。写出来的是 JPEG、PNG 和 WebP，因为浏览器自带的\
        就是这三个编码器。选「自动」时，JPEG 还是 JPEG，其余一律 PNG，这样照片保持\
        照片的体积，截图上没被遮住的文字也保持清楚。这个选择跟涂黑没关系：编码器看到\
        它们的时候，那些像素早就没了。"""

[[faq]]
q = "不用鼠标能做吗？"
a = """
        能。「在中间加一个框」会放一个到图上，Tab 键在框之间切换，方向键移动当前的框，\
        Alt 加方向键改它的大小，按住 Shift 每步走十个像素，Delete 键删掉它。每个框在\
        图片下面还有一行，写着大小、位置、它做什么，以及一个删除按钮，所以整个工具都\
        可以用键盘操作，也读得出来。"""

[[faq]]
q = "手机上能用吗？"
a = """
        能。拉框、移动和改大小走的是指针事件，不是鼠标事件，所以手指的效果一样，触摸\
        屏上把手还会画得更大一些。屏幕上的图片在你操作时是按屏幕尺寸重画的；文件本身\
        永远是在你按下按钮的那一刻，按原始分辨率涂黑的。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号、没有登录、没有试用期，也没有水印。图片大小也没有上限，因为没有\
        哪台服务器在为它付钱，活儿是在你自己的设备上干的。站点靠广告养着，而广告那边\
        拿不到任何关于你图片的东西。"""

