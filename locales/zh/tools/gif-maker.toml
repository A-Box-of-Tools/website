[[privacy]]
title = "你的图片没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个\
      属于本站。这里没有任何可以收走你文件的接收端，就算有，代码里也没有\
      把文件送过去的东西。这行以前写的是 <code>connect-src 'none'</code>，\
      那是没有例外的。加广告付出的代价就是它，把这句说出来也是约定的一部分。"""

[[privacy]]
title = "编码器就是仓库里的四个文件。"
body = """\
      做一个 GIF 需要颜色量化和 LZW 压缩，而浏览器这两样都不提供，所以两样都\
      在这儿写了出来：<code>src/quantize.js</code> 和 <code>src/lzw.js</code>，\
      容器部分在 <code>src/gif.js</code>。做一个 GIF 不需要去取任何东西，第一次\
      用也不会下载什么引擎。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你图片的信息，一条也没有交给它们，\
      文件、缩略图、名字、尺寸、张数都没有。读取、解码、绘制、压缩图片的\
      每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页首那个“Buy me a coffee”按钮由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它不过是个链接，不上报访问，也拿不到关于你或\
      你图片的任何东西。不点它就什么都不会发生，点下去到的是别人的站。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上每一部分都照常工作。这是最省事的一条证明，真要把\
      你的图片送出去做成 GIF，拔线那一刻就停了。"""

[[howto]]
title = "选好你的图片。"
body = """\
      把一个文件夹拖到选择框里，或者自己挑文件。浏览器直接从磁盘上读，这期间\
      没有任何东西发往别处。"""

[[howto]]
title = "按播放顺序排好。"
body = """\
      抓住把手拖动，或者用箭头。“按名称排序”是按你以为的方式数数的，所以 \
      <code>frame_2</code> 会排在 <code>frame_10</code> 前面。"""

[[howto]]
title = "定下每一帧停多久。"
body = """\
      每张半秒是幻灯片，二十分之一秒就是动画了。可以一次给所有帧同一个时长，\
      也可以单独让某一张多停一会儿。"""

[[howto]]
title = "选尺寸，并决定颜色怎么挑。"
body = """\
      GIF 的体积随面积和帧数一起涨，而且没有画质滑杆能把它拉回来，所以尺寸\
      才是最要紧的那个设置。每帧 256 色最好看，也是默认值；共用一套调色板\
      则更小、更稳。"""

[[howto]]
title = "做出 GIF，然后下载。"
body = """\
      它是在你自己的硬件上拼出来的，所以花多久取决于你的机器，而不是排队。\
      做好的动画会先在页面上放一遍，然后你再保存。"""

[[faq]]
q = "我的图片会被传到哪里去吗？"
a = """
        不会。你的图片由你自己的浏览器在你自己的硬件上读取、绘制、量化和压缩。\
        这个工具没有服务端，页面的 <code>Content-Security-Policy</code> 里写着\
        它允许联系的每一个地址，没有一个属于本站。拔掉网线，它照样做 GIF。"""

[[faq]]
q = "能用哪些图片格式？"
a = """
        凡是你浏览器能解码的静态图片格式都行，实际上就是 JPG、PNG、WebP、GIF、\
        AVIF，在苹果设备上还有 HEIC。这里没有另外一份需要维护的清单，因为解码\
        是浏览器的活，不是我们的。"""

[[faq]]
q = "我的 GIF 为什么这么大？"
a = """
        因为 GIF 把每一帧都当作完整像素来存。没有运动补偿，没有“和上一帧一样、\
        只是挪了个位置”这种存法，也没有画质旋钮：体积大约就是面积乘帧数，能把它\
        压下来的只有三件事。
        <br><br>
        做小一点：尺寸减半，文件就只剩四分之一。少用几帧，或者让每一帧停久一点。\
        降到 64 色或 32 色，并关掉抖动——对平涂画面来说这代价比听上去小，对照片\
        来说则很大。要是还塞不下，老实说，你在做的其实是视频，同样的内容做成 MP4，\
        大概只有十分之一大。"""

[[faq]]
q = "GIF 最快能放多快？"
a = """
        没有那个数字看上去那么快。这个格式把每帧的停留时间按百分之一秒来存，而从\
        九十年代起，浏览器就把小于两个百分之一秒的值一律抬到十分之一秒。这条规矩\
        是为当年那些转动的地球图写的，后来一直没删。所以 0.01 秒并不会按每秒 100 \
        帧来播，而是每秒 10 帧。正因如此，这个工具不提供低于 0.02 秒的选项，而 \
        0.05 秒（每秒 20 帧）差不多就是值得去要的上限了。"""

[[faq]]
q = "调色板这个设置改的是什么？"
a = """
        GIF 的一帧最多装 256 种颜色，总得有人来挑这 256 种。
        <br><br>
        <strong>每帧各自最合适的颜色</strong>会给每一张图单独挑 256 种，看起来最\
        清爽，一组互不相干的照片就该这么选。<strong>整个 GIF 共用一套调色板</strong>\
        则把所有帧放在一起，只建一张表。文件更小，而且能消掉同一场景各帧之间调色板\
        来回跳所造成的闪烁，所以当这些帧是一段连续画面而不是一堆合集时，就选它。"""

[[faq]]
q = "能保留透明背景吗？"
a = """
        能，只要你的图片本身有：把“透明”改成“保留透明区域”。不过动手前有件事得\
        知道。GIF 的透明只有一位，一个像素要么完全看不见，要么完全画上去，中间\
        没有过渡，所以抗锯齿的边缘、柔和的阴影，以及任何渐隐的东西，都会变成\
        硬边。要是你的动画会放在一个你已知颜色的背景上，那把它压到那个颜色上\
        会更好看。"""

[[faq]]
q = "能用的图片张数有上限吗？"
a = """
        工具里没有写死的上限。真正的天花板是你机器的内存，以及你对出来那个文件\
        大小的耐心：图片是一张一张读的，所以一百帧没问题，但 640 像素的一百帧\
        同样是个非常大的 GIF。见上面的“我的 GIF 为什么这么大？”。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。出来的文件上同样没有水印。本站\
        带广告，经费就是从那儿来的，广告拿不到任何关于你图片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最省事\
        的办法，真要把你的图片送出去处理，拔线那一刻就停了。"""

