      任何一处会把它送过去。这一行从前写的是 <code>connect-src 'none'</code>，
      那是不打折扣的；广告换掉了那一句，把这件事讲出来也是约定的一部分。"""

[[privacy]]
title = "文件从不整个待在什么地方，多大都一样。"
body = """

      它按每次四兆读进来，每一块并进正在进行的状态后就丢掉。所以这个页面占的
      内存，四十吉字节的磁盘镜像和一个文本文件是一样的，也不存在超过多大就
      放弃的界线。浏览器自带的 <code>crypto.subtle.digest</code> 没有被用上，
      原因也在这里：那个函数要求整个文件一次性进内存，而那正是这个工具不想
      要的天花板。"""

