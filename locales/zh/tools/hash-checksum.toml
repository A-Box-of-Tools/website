[[faq]]
q = "我的文件会被上传到什么地方吗？"
a = """
        不会。是你自己的浏览器从你的磁盘上读，你自己的处理器按每次四兆去算。
        这个工具没有服务端，页面的 <code>Content-Security-Policy</code> 列出了
        它可以连的每一个地址，没有一个是我们的。断开网络，它照样能用。"""

[[faq]]
q = "有大小上限吗？"
a = """
        没有。文件从不整个待在什么地方：分块读，每一块算过就丢掉，所以四十
        吉字节的磁盘镜像和一个文本文件用的是同样的几兆内存。要花的是时间，而
        花多少，页面会一边跑一边告诉你。
        <br><br>
        这也正是这些算法写在这里、而不是交给浏览器的
        <code>crypto.subtle.digest</code> 的原因，尽管后者更快。那个调用要把整段
        消息放进一个缓冲区，没有办法把文件分块喂给它。用了它，能校验的最大文件
        就要看这个标签页碰巧分到多少内存。在手机上那是几百兆，而人们最想校验的
        恰恰是磁盘镜像。"""

[[faq]]
q = "校验和对上了，这到底证明了什么？"
a = """
        证明你磁盘上的这些字节，就是某个人写下那串数字时手边的那些字节。仅此
        而已，而这条界线值得说清楚。
        <br><br>
        它证明了下载没有被截断、没有被坏盘弄脏、没有在路上被掉包。它
        <strong>没有</strong>证明这个文件无害，因为发布方量恶意软件也一样准。
        而如果这串校验和是和文件从同一个页面、同一条连接过来的，那它证明的东西
        就很少了：能改掉其中一个的人，也能改掉另一个。校验和最值钱的时候，是它
        走的路和文件不同的时候：一份带签名的 <code>SHA256SUMS</code>、发行版的
        发布公告、第二个镜像，或者一个本来就知道这个值的包管理器。"""

[[faq]]
q = "对不上，那现在怎么办？"
a = """
        先从同一个地方重新下一次。断掉或者续传过的传输是遥遥领先的头号原因，
        第二份副本通常就把事情了结了。
        <br><br>
        如果第二份给出同样错误的结果，检查你比的是不是那一行：发布页面上会列好
        几个文件，ARM 构建的校验和永远不会和 x86 的对上。然后检查版本号。这些都
        没问题却还是对不上，那就别打开这个文件。换一个镜像取一份，把两份的校验和
        彼此对一下。"""

[[faq]]
q = "我该用哪一种？"
a = """
        用发布方公布的那一种。这件事的意义就在于和他们的数字对照，而他们那一份
        你替不了。
        <br><br>
        如果你是在产生校验和而不是核对校验和，用 SHA-256。MD5 和 SHA-1 在要紧的
        那个意义上已经破了：可以刻意造出两个不同却同值的文件，MD5 只要几小时，
        SHA-1 也只要不算高的花费。这不等于它们对付意外也没用了，毕竟一次截断的
        下载不会碰巧和原文同值；但它们确实不能再告诉你没人动过手脚。SHA-384 和
        SHA-512 都很好，实际用起来也不见得更好；它们在这里，是因为有些项目公布
        的是它们。"""

[[faq]]
q = "既然 MD5 破了，为什么还留着？"
a = """
        因为印在页面上的还是它。镜像站、固件下载、高校的软件页面，还有非常多
        厂商的网站，二十年前放了一个 MD5 就再没动过那一页。一个拒绝计算它的工具，
        等于拒绝回答访客真正带着来的那个问题。
        <br><br>
        它能做的是说清楚这个答案值多少，勾选框旁边那一行就是在做这件事。对上的
        MD5 依然排除了一次损坏的下载，只是排除不了一次蓄意的调包。"""

[[faq]]
q = "比对框里可以粘哪些格式？"
a = """
        常见的都行，而且是哪一种由页面自己认出来。
        <br><br>
        光是十六进制，中间有没有空格都行。<code>md5sum</code> 或
        <code>sha256sum</code> 的一行输出，后面跟着文件名也行。整份四十行的
        <code>SHA256SUMS</code> 文件也行，这时用的是写着你这个文件名的那一行。
        BSD 那种写法 <code>SHA256 (disk.iso) = &hellip;</code> 也行。前面带标签的
        <code>SHA-256: &hellip;</code> 也行。还有 subresource integrity 属性
        <code>sha384-&hellip;</code>，那是 base64 而不是十六进制，比对前会先
        解码。
        <br><br>
        是哪种算法由长度决定：32 个十六进制字符是 MD5，40 个是 SHA-1，64 个是
        SHA-256，96 个是 SHA-384，128 个是 SHA-512。没有两种长度相同，所以既没有
        什么可选，也没有什么可选错。"""

[[faq]]
q = "结果会和 sha256sum 或 certutil 一样吗？"
a = """
        一样，一个字节都不差。这些是有公开测试向量的严格规范，这里的每一种算法
        在每次构建时都会拿那些向量和操作系统的实现两头核对。
        <br><br>
        唯一看得出的差别是显示方式。Windows 的
        <code>certutil -hashfile</code> 用大写并且带空格，这个页面用小写，因为
        几乎所有发布方用的都是小写。比对时两边都不看大小写和空格，所以从
        certutil 里复制来的校验和，和粘在这里的小写值一样能对上。"""

[[faq]]
q = "可以把两个文件互相比对吗？"
a = """
        可以，多一步而已：先校验第一个文件，复制它的校验和，再选第二个文件，把
        那串校验和粘进框里。两个文件相同的话，页面会告诉你。
        <br><br>
        这一手值得记住，因为校验和最不动声色也最擅长的正是这种场合：备份盘上的
        那一份，究竟是不是笔记本上的同一个文件，而两边都声称大小相同、日期
        相同。"""

[[faq]]
q = "它会改动我的文件吗？"
a = """
        不会。这个工具只读。没有输出文件，没有重新编码，也没有什么会被写回去：
        唯一能下载的是一个列着校验和的小文本文件。你的原件原封不动地留在磁盘上，
        这同样是「关掉标签页会怎样」这个问题的诚实答案。"""

[[faq]]
q = "免费吗？要不要账号？"
a = """
        免费，没有账号、没有注册、没有试用期。文件大小没有上限，校验多少个也没有
        上限。站点上有广告，那是维持它的钱；广告拿不到关于你文件的任何东西。"""

[[faq]]
q = "断网还能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明什么都没有上传
        的最简单办法：一个把你的文件发出去算的工具，会在你拔掉网线的那一刻停住。"""

