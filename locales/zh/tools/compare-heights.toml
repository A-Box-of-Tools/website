[[privacy]]
title = "一份人的名单，不是可以随手交出去的小东西。"
body = """\
      大多数身高图工具要你注册，不要你注册的那些，也还是有一台服务器看着你打的每个\
      名字和每个数字。你在这里打的，是你家里有谁、每个人多高，而且名字旁边那个人形\
      往往还把孩子的年纪一并说了出来。这些一样也不会被送去哪里，因为这里根本没有\
      可去的地方。"""

[[privacy]]
title = "这里不会去取任何东西。"
body = """\
      <code>src/</code> 里哪儿都没有 <code>fetch</code>，没有\
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个属于本站。"""

[[privacy]]
title = "两次来访之间，也什么都不记。"
body = """\
      这张图只活在页面里，别处没有。关掉标签页，名单就没了：没有账号存着它，没有\
      cookie 带着它，这个浏览器的存储里也什么都没写——这也是为什么你想留下的图，就是\
      你下载下来的那张。"""

[[privacy]]
title = "链接不会把图带走。"
body = """\
      好几个同类工具会把整份名单塞进地址栏，好让它能分享，而这就把每个名字和每个\
      身高，变成了链接经过的一切都会记下来的东西——聊天服务器、邮件扫描器、某人的\
      浏览记录。这个页面的地址，在你打字的时候从不改变。"""

[[privacy]]
title = "PNG 是从屏幕上那份 SVG 做出来的。"
body = """\
      下载的东西不是第二次渲染，不会跟预览对不上。同一份标记交给浏览器，画到画布上，\
      而这也是为什么拔了网线照样能做：里面没有字体要取，也没有图片要加载。"""

[[privacy]]
title = "画就在这里，不是去取来的。"
body = """\
      四个人形都是公有领域的画作，跟页面其余部分一样从这个源提供——没有图标字体，\
      没有 CDN，也没有在你打字时从别人服务器上拽下来的雪碧图。断网还能画出图，这也是\
      原因之一。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
      广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们谁也没拿到一个\
      名字或者一个身高。把你的名单变成一幅图的每一行代码，都从这个源提供，也都列在\
      仓库里。"""

[[privacy]]
title = "断网可用。"
body = """\
      拔掉网线，这个工具一点变化都没有，因为它里面本来就没有联网这一步。这是最简单的\
      证明。"""

[[howto]]
title = "先把人都加进去，好不好看以后再说。"
body = """\
      一行就是一个人形、一个名字、一个身高和一种颜色。名字可以不填——两个没名字的\
      剪影，上面标着身高，常常正是有人想要的那种图——如果顺序要紧，每行的箭头能把它\
      往左往右挪。"""

[[howto]]
title = "身高按你平时的写法打。"
body = """\
      <code>173</code>、<code>1.73 m</code>、<code>5'8\"</code>、<code>68 in</code> 和\
      <code>5 ft 8</code> 都能正确读出来。框下面那行会用两套单位显示它读成了什么，\
      所以读错是在画出来之前就看得见，而不是印出来之后。一个光秃秃的数字，在公制图上\
      是厘米，在英制图上是英寸；小于三的光秃秃的数字是米——没有人身高 1.73 厘米。"""

[[howto]]
title = "挑跟这个人对得上的人形。"
body = """\
      孩子大约六个头高，大人是七个半，所以把孩子画成缩小的大人，会以一种说不上来但\
      一眼看得出的方式显得不对。男孩和女孩画的是真孩子，不是缩小的大人，一张全家的图\
      看着像一家人，多半就靠这个。而且每一行进来就带着一个身高，所以加一个人就画出\
      一个人——直接盖着改就行。"""

[[howto]]
title = "在图上放一件眼熟的东西。"
body = """\
      数字是抽象的，一道门不是。加一件大家都知道多大的东西——一扇门、一扇窗、教室里\
      的白板、一台自动售货机——就是把一张只说出两个身高的图，变成一张让人看见这两个\
      身高的图。菜单里有二十件，分了组，每一件进来都是普通的一行，你可以把自己的数字\
      盖上去。物件除了高度还有宽度，所以一扇门是 203 乘 81，不是一根条。"""

[[howto]]
title = "把标尺调成你读者习惯的单位。"
body = """\
      在厘米和英尺之间切换，是把框里的内容重写一遍，而不是重新解释一遍，所以图本身\
      不动，动的只是记法。要是这张图给两拨人看，每个人形上方写的身高用图表的单位，\
      而每个框下面那行两套都有。"""

[[howto]]
title = "要粘就用 PNG，要印就用 SVG。"
body = """\
      PNG 是一张按你设定的像素高度出的图，聊天窗口、文档或者幻灯片要的就是它。SVG 是\
      把图表存成指令，所以放到多大都印得清楚，之后任何能打开矢量的东西都还能给它\
      换颜色。"""

[[faq]]
q = "我打进去的东西会被送到什么地方吗？"
a = """\
        不会。图是这个页面里的 JavaScript 在你自己的设备上画的，而这个工具压根就没有\
        任何网络功能——从不取任何东西，也从不发任何东西。页面的\
        <code>Content-Security-Policy</code> 里写着它允许联系的每一个地址，没有一个\
        属于本站。这话在这里值得挑明，因为输入的是一份人名和各自身高的清单，比本站\
        处理的绝大多数东西都更私人。"""

[[faq]]
q = "图能下载吗？"
a = """\
        能，PNG 或者 SVG 都行，没有水印，也不用账号。PNG 按你设定的像素高度画出来，\
        是往文档、幻灯片或聊天里粘的那一个。SVG 是把图表存成指令而不是像素：放到多大\
        都印得清楚，以后还能在任何矢量编辑器里打开重新上色。两个都是从屏幕上那份同样的\
        标记做出来的，所以哪个都不会跟预览对不上。"""

[[faq]]
q = "身高该怎么写——厘米还是英尺？"
a = """\
        都行，哪一行都行，你平时怎么写就怎么写。<code>173</code>、<code>173 cm</code>、\
        <code>1.73 m</code>、<code>5'8\"</code>、<code>5 ft 8 in</code> 和\
        <code>68 in</code> 全都读得懂，框下面那行会用两套单位显示它读成了什么。一个\
        光秃秃的数字，图是公制时算厘米，是英制时算英寸；小于三的光秃秃的数字按米算，\
        因为 1.73 厘米不是谁会打进去的身高。"""

[[faq]]
q = "孩子为什么看着不像缩小的大人？"
a = """\
        因为孩子本来就不是。身体比例随年龄变：两岁孩子大概四个半头高，八岁六个，大人\
        七个半——所以头差不多占小孩子的四分之一，占大人的八分之一。这里的男孩和女孩\
        画的是真孩子，不是把一个剪影缩小。一张全家的图看着像一家人而不像四个不同尺寸\
        的大人，原因就在这儿。"""

[[faq]]
q = "这些人形是哪儿来的？"
a = """\
        四个都是别人的画，全都在公有领域：男性出自 pitr，女性出自 Madeleine Price \
        Ball，女孩出自 OpenClipart-Vectors，男孩出自 Ryan Kissinger 为 NIH BioArt \
        图库所作。每个文件都按发布时的样子放在 <code>vendor/</code> 里随页面一起发\
        出去，所以你可以拿去跟原件对。公有领域什么都不要，而这正是关键：画最后会进到\
        你下载的那张图里，一份要求署名的许可，就会把那份要求粘到你的图上。"""

[[faq]]
q = "为什么没有幼儿或者婴儿？"
a = """\
        因为没人画过一个并把它放进公有领域。维基共享资源上能用的自由儿童画正好只有\
        一个——就是那个女孩——NIH BioArt 图库里有那个男孩；学龄以下，搜索一无所获，\
        而每一套完整的免费人形都是厕所指示牌那种图标，各个年龄同一个形状，那恰恰是\
        这个工具整体要避开的错误。有一阵子这里有个由页面自己代码画出来的幼儿，它是\
        图上唯一一个没人画过的人形：站在四个有人画过的旁边，这一点看得出来。比男孩或\
        女孩还小的人，把其中一个设成真实身高就行——扛着这个比较的是标尺，而它是准的。"""

[[faq]]
q = "一张图能放多少人？"
a = """\
        十二个。这不是技术上的限制——画三十个它也乐意——但过了一打，列就比上面写的\
        名字还窄，图也就读不成了。要是需要更多，把名字关掉能把宽度还给你，或者两张图\
        会比一张说得更清楚。"""

[[faq]]
q = "能在图上放一件物件吗？"
a = """\
        能——一个普通矩形接受一个高度和一个宽度，所以任何有两个尺寸的东西都能挨着\
        人站。菜单里有二十件可以起步，分成四组：门和窗，学校和办公室（白板、办公桌、\
        文件柜、投影幕），街上的东西（自动售货机、带轮垃圾桶、篮球架、20 英尺的海运\
        集装箱），还有家里的东西。其中一些真的是标准，一些只是常见尺寸，页面把这话\
        说在明处；每一件进来都是普通的一行，可以直接盖着改。一件眼熟的东西，对一张图\
        的作用比再多几个人都大：它把一次比较，变成对尺度的感觉。"""

[[faq]]
q = "有狗或者猫的人形吗？"
a = """\
        没有，而且这是故意留的空缺，不是疏漏。两个都做过——侧面、站着、头与肩同高，\
        好让画的顶端就是旁边写的那个高度，因为所有品种标准都是那么量动物的。做出来的\
        效果不够好，就没发：一只从侧面看的四足动物，站在四个正面看的人旁边，哪怕画得\
        好，读起来也像出了错。在那之前，用一个到动物肩高的矩形是诚实的。"""

[[faq]]
q = "能用链接把图分享出去吗？"
a = """\
        从这里不能，而且是故意的。提供这功能的工具，做法是把整份名单塞进地址，这就\
        意味着每个名字和每个身高，都会落进这条链接经过的一切里——聊天服务器的日志、\
        邮件扫描器、某人的浏览记录、一个去抓链接预览的服务。把图下载下来发那个：它说\
        的是同一件事，却不带着名单走。"""

[[faq]]
q = "免费吗？做出来的图能商用吗？"
a = """\
        免费，没有账号也没有水印，做出来的东西你可以放进报告、演示、广告或者产品里。\
        本站有广告，站点靠它维持。你在这里做的图，没有一处是我们的，也什么都不留存。"""

[[faq]]
q = "标尺为什么是十格一跳，不是一格一跳？"
a = """\
        因为间距是按这张图能承得住多少条线来定的，而不是按一个固定数字。两个大人的图，\
        每十厘米一条线；放上一个篮球架，线就挪到二十五，因为一张图上九十条线是一片\
        灰，不是标尺。用英尺英寸时，梯级是一、三、六、十二英寸，好让线落在整英寸上，\
        而不是落在旁边。"""

[[faq]]
q = "能把图放到深色幻灯片上吗？"
a = """\
        能。把背景设成它将要落在的那个颜色，标尺和文字就会在深浅之间切换来配合它——\
        这是从那个颜色的亮度算出来的，不是猜的。然后如果你想让图本身透明，就勾上“完全\
        不要背景”：决定墨色的还是你选的那个颜色，所以一张要去深蓝幻灯片的透明图，落上去\
        照样读得清。"""

[[faq]]
q = "断网还能用吗？"
a = """\
        能。页面加载一次之后拔掉网线，它照样工作。这也是证明没有上传的最简单办法：一个\
        把你的名单送出去让别人画图的工具，在你拔线的那一刻就停了。"""

