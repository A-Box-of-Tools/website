<main id="main">
  <!-- 第一步 &mdash; 文件 -->
  <section class="card">
    <h2><span class="step">1</span> 选一个 GIF</h2>

    <!--
      A real <label> drives the file picker natively. Calling .click() on a
      display:none input is refused by Safari and some Chrome configurations,
      so the input stays in the layout: visually hidden, still focusable, and
      reachable by keyboard. There is no JavaScript in this path at all.
    -->
    {% include "partials/file-picker.html" %}

    <dl class="source" id="source" hidden>
      <div><dt>文件</dt><dd id="src-name">&mdash;</dd></div>
      <div><dt>大小</dt><dd id="src-size">&mdash;</dd></div>
      <div><dt>画面</dt><dd id="src-picture">&mdash;</dd></div>
      <div><dt>帧数</dt><dd id="src-frames">&mdash;</dd></div>
      <div><dt>播放时长</dt><dd id="src-duration">&mdash;</dd></div>
      <div><dt>循环</dt><dd id="src-loop">&mdash;</dd></div>
    </dl>

    <p id="notice" class="path-note" hidden></p>
    <p id="error" class="error" role="alert" hidden></p>
  </section>

  <!-- 第二步 &mdash; 出来的东西 -->
  <section class="card" id="settings-card" hidden>
    <h2><span class="step">2</span> 帧怎么出</h2>

    <div class="settings">
      <div class="field">
        <label for="mode">每张 PNG 里放</label>
        <select id="mode">
          <option value="composited" selected>看上去的那一帧</option>
          <option value="stored">只要这一帧真正存下的像素</option>
        </select>
        <p class="field-note" id="mode-note"></p>
      </div>

      <div class="field">
        <label for="background">透明区域</label>
        <select id="background">
          <option value="keep" selected>保持透明</option>
          <option value="flatten">填一个颜色&hellip;</option>
        </select>
        <div id="colour-row" class="inline-pair" hidden>
          <input type="color" id="colour" value="#ffffff" aria-label="用来填充透明区域的颜色">
          <span id="colour-note">会写进每一帧，之后取不出来。</span>
        </div>
      </div>

      <div class="field">
        <label for="every">每隔多少帧留一帧</label>
        <div class="inline-pair">
          <input type="number" id="every" min="1" max="100" step="1" value="1">
          <span id="every-note">帧</span>
        </div>
        <p class="field-note">
          不要全部，改成每两帧或每五帧取一帧，适合做一览图或者处理长录像。
        </p>
      </div>

      <div class="field">
        <label for="timing">时间清单</label>
        <select id="timing">
          <option value="yes" selected>ZIP 里附上 frames.txt</option>
          <option value="no">只要帧</option>
        </select>
        <p class="field-note">
          每一帧停留了多久、放在什么位置。一堆 PNG 摆在文件夹里带不走这些。
        </p>
      </div>
    </div>

    <div class="export-row">
      <button type="button" id="download-all" class="primary">打包成 ZIP 下载全部帧</button>
      <button type="button" id="download-selected" class="ghost" hidden>下载勾选的帧</button>
      <button type="button" id="cancel" class="ghost" hidden>取消</button>
    </div>

    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <p id="progress-label" class="progress-label" role="status" aria-live="polite"></p>
    </div>
  </section>

  <!-- 第三步 &mdash; 帧本身 -->
  <section class="card" id="frames-card" hidden>
    <h2><span class="step">3</span> 拆出来的帧</h2>

    <div class="toolbar">
      <p class="count" id="frames-count" role="status" aria-live="polite"></p>
      <div class="toolbar-actions">
        <button type="button" id="select-all" class="ghost">全选</button>
        <button type="button" id="select-none" class="ghost">全不选</button>
        <button type="button" id="clear" class="ghost danger">重新来过</button>
      </div>
    </div>

    <!-- Checkboxes rather than a click-to-select grid: this is a list of files
         somebody is about to save, and a checkbox is the one control everybody
         already knows is safe to press. -->
    <ul class="frames" id="frames"></ul>
  </section>
</main>
