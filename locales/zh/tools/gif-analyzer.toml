[[privacy]]
title = "你的 GIF 没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个\
      属于本站。这里没有任何可以收走你文件的接收端，就算有，代码里也没有\
      把文件送过去的东西。这行以前写的是 <code>connect-src 'none'</code>，\
      那是没有例外的。加广告付出的代价就是它，把这句说出来也是约定的一部分。"""

[[privacy]]
title = "读取器就是仓库里的四个文件。"
body = """\
      这里没有用浏览器自带的 GIF 解码器去弄清文件里有什么，因为那个解码器\
      不会告诉你某个字节去了哪儿。所以格式是手写代码一步步读出来的：\
      <code>src/gif.js</code> 走完所有块，<code>src/lzw.js</code> 展开像素，\
      <code>src/frames.js</code> 把它们叠起来，<code>src/budget.js</code> \
      再把各部分加回去，核对是否正好等于文件大小。"""

[[privacy]]
title = "注释和元数据只给你看，不给别人。"
