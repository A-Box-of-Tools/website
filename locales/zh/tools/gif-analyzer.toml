[[faq]]
q = "我的 GIF 会被传到哪里去吗？"
a = """
        不会。文件的读取、解压和绘制都由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务端，页面的 <code>Content-Security-Policy</code> 里\
        写着它允许联系的每一个地址，没有一个属于本站。拔掉网线，它照样分析\
        GIF。"""

[[faq]]
q = "为什么我的 GIF 播得比延时写的还慢？"
a = """
        因为所有浏览器都拒绝照办小于百分之二秒的延时，改成把那一帧停十分之\
        一秒。这条规则 1996 年写进了 Netscape，是为当年那些转动的地球和\
        “施工中”标牌准备的，此后被抄进了每一个浏览器，从来没人删掉。
        <br><br>
        所以一个每帧都写着 0.01 秒的 GIF 并不会以每秒 100 帧播放，而是每秒\
        10 帧，比做它的软件所设想的慢五到十倍。这个页面把两个数字都摆出来，\
        文件写的和它实际会做的，并标出受影响的帧。要修，就在做这个文件的\
        软件里把 0.01 写成 0.02。"""

[[faq]]
q = "“处置方式”是什么意思？"
a = """
        一帧的时间到了之后，屏幕上要留下什么。动画看起来正常还是拖影，就由\
        这个字段决定。
        <br><br>
        <strong>原样留下</strong>意思是下一帧直接盖在这一帧上，帧本身不透明、\
        彼此互相遮住时就该这么做。<strong>清回背景</strong>会先把这一帧的矩形\
        擦干净，透明就需要它：不擦的话，下一帧透出来的部分会露出上一帧。\
        <strong>还原底下原有的内容</strong>把这一帧画之前那儿的东西放回去，\
        静止背景上一个小物体在动，就是这么存的。至于<strong>未指定</strong>，\
        意思是文件没说，而所有查看器都按“原样留下”处理。"""

[[faq]]
q = "我的 GIF 为什么这么大？"
a = """
        “字节去了哪里”那张表针对你这个具体文件回答，而不是泛泛而谈，可能\
        的答案就那么几种。
        <br><br>
        要是几乎全在<strong>压缩像素</strong>里，那这个文件就是画面本身太多：\
        GIF 把每一帧都当作完整像素来存，没有运动补偿，也没有画质旋钮，所以\
        体积大约就是面积乘帧数。减少帧数、缩小尺寸、减少颜色，就这三个把手。
        <br><br>
        要是一大块在<strong>颜色表</strong>里，说明文件在给每一帧各写一份调色\
        板，每份 768 字节。要是一大块在<strong>元数据</strong>里，那是某个编辑\
        软件留下了 XMP 数据包，不动画面就能删掉。要是所有帧都覆盖整个画布，\
        说明编码器压根没算过究竟哪一部分变了，而对拍摄或录制来的内容来说，\
        那就是文件的绝大部分。"""

[[faq]]
q = "两种帧视图有什么区别？"
a = """
        <strong>每帧之后的画布</strong>是查看器在那一刻显示的东西：这一帧画在\
        前面几帧留下的内容之上。<strong>每帧实际存下的内容</strong>是文件为\
        这一帧真正保存的那个矩形，单独摆出来，底下什么都不垫。
        <br><br>
        有意思的是后者。GIF 允许一帧只存画面里变了的那部分，所以一个几乎不动\
        的窗口的录屏可以很小。要是你文件里每一帧都是整块画布，那说明没人做过\
        这件事，而且光看动画是看不出来的，只有看存下来的内容才知道。"""

[[faq]]
q = "它说我的文件里有注释或 XMP。那是什么？"
a = """
        随画面一起走、但任何查看器都不会画出来的文字。注释块通常是写出这个\
        文件的软件名。XMP 数据包是图像编辑软件用来记录自己做了什么的 XML，\
        里面可能有编辑历史、软件版本，有时还有作者名字。
        <br><br>
        这个页面把两者都完整打印出来，因为关于元数据，值得关心的是它写了\
        什么，而不是它存在。这些只给你看，不给别人：这个仓库里没有任何东西\
        会把其中内容念给谁听。"""

[[faq]]
q = "坏掉的 GIF 打得开吗？"
a = """
        会试，并且会告诉你它在哪儿放弃了。文件在某个块中间断掉、该出现块\
        标记的位置换成了别的字节、某一帧的压缩数据提前用完，这些情况它照样\
        会把那之前能读出来的全部显示出来，并把问题写在最上面。分析器最派得\
        上用场的恰好就是这种时候，为了一个坏字节把整个文件丢掉，才是错的。"""

[[faq]]
q = "它会改动我的文件吗？"
a = """
        不会。这个工具只读。没有输出文件，没有重新编码，这里也没有哪个按钮\
        会写出一个 GIF，你唯一能下载的是一份纯文本的分析结果。你的原件在\
        磁盘上原封不动，这也是“关掉标签页会怎样”的老实答案。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。除了你自己机器的内存之外，\
        文件大小没有上限。本站带广告，经费就是从那儿来的，广告拿不到任何\
        关于你文件的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的 GIF 送出去分析，拔线那一刻就停了。"""

[schema]
description = "在浏览器里把 GIF 拆开看：每一帧的延时、矩形和处置方式，颜色表，循环次数，各种元数据，以及文件体积的逐字节账目。什么都不上传。"
features = [
  "每一帧的延时、矩形、处置方式和压缩后大小",
  "一帧的两种看法：它存了什么，以及查看器看到的画布",
  "一份加起来正好等于文件的字节账目，不留下说不清的部分",
  "把颜色表画出来，并标出没有任何像素引用的条目",
  "读取注释、XMP 数据包、ICC 配置文件和 Netscape 循环块",
  "报告哪些延时没有浏览器会照办，以及动画实际的播放速度",
  "能打开损坏和截断的文件，并指出它们在哪里停下",
  "断网可用；不上传、不注册、不改动你的文件",
]

[picker]
