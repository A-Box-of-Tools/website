read_first = """，<code>src/json.js</code> 是那个会按你写的顺序保留键的解析器；至于为什么一次转换就是一个解析器加一个写出器、中间没有任何同时懂两种格式的东西，看 <code>src/convert.js</code>。"""

howto_heading = "怎样在不上传的前提下格式化或转换 JSON"

