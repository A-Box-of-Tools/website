pledge = """格式化和转换都是对一串字符做算术，就在这个页面里做完。解析器是手写的，都在 <code>src/</code> 里：<code>json.js</code>、<code>xml.js</code>、<code>css.js</code>、<code>yaml.js</code>；此外别无他物。这个工具没有任何形式的网络功能，没有什么可取，也没有什么可发。这一点在本站几乎别处都不如在这里要紧：人们往格式化器里贴的，是访问令牌、会话 cookie、客户记录，还有尚未发布的代码。"""

