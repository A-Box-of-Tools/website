[[howto]]
title = "有错误就读一读。"
body = """在这里失败的解码器会说出它遇到了什么——Base64 不用的字符、填充放错了地方、不是文本的字节——而不是返回一个貌似像样却错了的结果。"""

[[howto]]
title = "把结果带走。"
body = """复制它，或者下载成文本文件。输入框下面的计数会告诉你进了多少字节、出了多少字节。"""

[[faq]]
q = "我的文本会被传到哪里去吗？"
a = """
        不会。这个页面上的每个编码器和解码器，都是在你自己的浏览器里、你自己的硬件上运行的函数。这个工具没有任何形式的网络功能：它从不去取什么，也从不发出什么；页面的 <code>Content-Security-Policy</code> 里写着它允许联系的每一个地址，没有一个属于本站。这正是拿它来处理访问令牌或会话 cookie 的理由：把这类东西贴进别人的解码器，等于把它交给了对方。"""

[[faq]]
q = "这里的 Base64 和别处的 Base64 一样吗？"
a = """
        一样——它是拿 RFC 4648 的测试向量来核对的，而不是拿自己核对自己。两套字母表\
        都能解码，所以用 <code>-</code> 和 <code>_</code> 写的 JWT，和用 \
        <code>+</code> 和 <code>/</code> 写的一样好读；按 64 个字符折行的输入，会\
        替你接回去。编码走的是 UTF-8 字节，所以带重音的字母或者 emoji 一来一回都\
        安然无恙。"""

[[faq]]
q = "Base64 是加密吗？"
a = """
        不是，把它当加密正是经典的误会。Base64 是一种写法：同样的字节，换一套能在 URL、邮件或 JSON 字符串里活下来的字母表写出来。谁都能把它读回去——这个页面一毫秒就做到了——所以它什么都藏不住，什么都保护不了。你手里的东西要是机密，那它需要的是编码之前的真加密，而不是拿编码来顶替。"""

[[faq]]
q = "为什么解码失败了？"
a = """
        因为贴进来的东西和编解码器以为的不完全是一回事，错误信息会说清差在哪儿：Base64 字母表之外的字符、放错位置的填充、后面没跟两位十六进制数的百分号，或者能从 Base64 解出来、却不是 UTF-8 文本的字节——最后这种通常说明原始内容是个文件，不是字符串。换成浏览器自带的 <code>atob</code>，它会返回一个貌似像样的结果；而能被告知哪里不对，正是把东西贴进解码器的全部意义。"""

[[faq]]
q = "两种网址编码有什么区别？"
a = """
        一个值，还是整个地址。编码“单个值”会转义 URL 赋予了含义的一切——斜杠、问号、和号——这正是查询串里单个参数需要的。编码“整个 URL”则让地址继续能用：斜杠和 <code>?</code> 留着，只转义 URL 根本带不动的字符。拿前者去编码整个地址，地址就坏了；拿后者去编码一个值，就分不清值到哪儿结束。"""

[[faq]]
q = "它能处理多大的文件？"
a = """
        这里没有设上限，因为没有哪台服务器在为上限掏钱。真正的天花板是你自己的机器：几兆字节的文本没问题；文档特别长的时候，页面会等你敲字停一下再重新编码，而不是跟你抢键盘。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，贴多少也没有上限。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你文本的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最省事的办法，真要把你的文本送出去解码，拔线那一刻就停了。"""

