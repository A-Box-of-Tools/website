[[privacy]]
title = "这里不会去取任何东西。"
body = """整个 <code>src/</code> 里没有 <code>fetch</code>，没有 <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。每个编码器和每个解码器，都是这个页面里接收一串字符、返回一串字符的函数。"""

