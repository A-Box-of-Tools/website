[words]
plural = "图片"
choose = "图片"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[facts]]
text = "文件留在你的设备上"

[[privacy]]
title = "你的图片无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。这一条以前写的是\
      <code>connect-src 'none'</code>，那是绝对的，加广告让它变了，而把这件事\
      说出来是交易的一部分。"""

[[privacy]]
title = "编码在本地。"
body = """\
      WebCodecs 在你的浏览器里运行，写好的文件直接交给下载。这个应用没有\
      服务器端。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你图片的信息，一条也没有交给它们，\
      文件不给，缩略图不给，名字、大小、数量也不给。读取、解码、合成、编码\
      图片的每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也\
      拿不到任何关于你或者你图片的信息。你不点它就什么都不会发生，点过去到\
      的也是别人的网站。"""

[[privacy]]
title = "一个刻意留下的例外。"
body = """\
      你要是用“从网址添加”，那台服务器会被联系上以取回图片，也会看到你的
      IP 地址。只有你自己粘进来的图片才会被抓取，而且只进不出，\
      <code>img-src</code> 放开了，<code>connect-src</code> 没有。下面那个\
      计数器会列出被联系过的每一个外部来源。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，除了从网址加载，一切照常运转。这是最省事的一条证明。"""

[[howto]]
title = "选好你的图片。"
body = """\
      把一整个文件夹拖到下面的方框里，或者点开自己挑文件。浏览器直接从你的\
      硬盘上读，整个过程没有东西被送去别处。"""

[[howto]]
title = "排好顺序，定好每张停多久。"
body = """\
      拖动就能重排。停留时间可以按帧数给，也可以按秒给，可以一次给所有图片，\
      也可以一张一张给。"""

[[howto]]
title = "挑一个分辨率和帧率。"
body = """\
      选“跟随最高分辨率”，视频就跟着你最大的那张图走。预设涵盖 4K、1080p、
      720p、方形和竖版，都不合适还可以自己填尺寸。"""

[[howto]]
title = "生成视频，然后下载。"
body = """\
      编码在你自己的硬件上跑，所以快慢看你的机器，不用排队。做好的 MP4 直接\
      交给浏览器下载。"""

[[faq]]
q = "我的图片会被传到什么地方去吗？"
a = """
        不会。读取、合成、编码，都由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器端，而页面的 <code>Content-Security-Policy</code> 把它\
        可能联系的地址全列了出来，其中没有一个属于本站。唯一的例外是那个可选\
        的“从网址添加”，它会去取你粘进来的图片，那台服务器也会看到你的 IP
        地址。"""

[[faq]]
q = "我能用哪些图片格式？"
a = """
        你浏览器解得了的静态图片格式都行，实际上就是 JPG、PNG、WebP、GIF、
        AVIF，苹果设备上还有 HEIC。这里没有另一份要跟着维护的清单，因为解码\
        是浏览器的活儿，不是我们的。"""

[[faq]]
q = "它输出什么视频格式？"
a = """
        MP4，视频编码是 H.264，基本上什么设备都能播。在没有 WebCodecs 的\
        浏览器里，工具会退回到录制 WebM，同样的画面，只是装在一个更少编辑\
        软件认的容器里。"""

[[faq]]
q = "我能用它处理 Blender 或 After Effects 的渲染序列吗？"
a = """
        能，带编号的渲染序列正是它的用武之地。把渲染器写出来的帧加进来，停留\
        时间保持每张一帧，再把帧率设成和渲染一致。“按名称排序”是按你期望的\
        方式数数的，所以 <code>frame_2</code> 排在 <code>frame_10</code>\
        前面，不是后面。
        <br><br>
        动手之前有一件事值得先知道：H.264 没有 alpha 通道，所以透明会被压平\
        到背景色上，而不是原样带过去。你要保住 alpha，就在自己的编辑软件里\
        合成这些帧。"""

[[faq]]
q = "我能用照片做延时视频吗？"
a = """
        能，这和渲染序列是同一件事，让每张照片只停一帧，再挑一个帧率。30 fps
        下每三十张照片变成一秒视频，12 fps 下同样这些照片会放两秒半。
        <br><br>
        “按日期排序”能把一卷相机胶卷放回拍摄时的顺序，文件名从 0001 重新开始\
        过的时候，这一点很要紧。照片尺寸不一样也没关系，“跟随最高分辨率”会把\
        视频尺寸定得让它们谁都不必被缩小。"""

[[faq]]
q = "图片数量或者视频时长有上限吗？"
a = """
        工具本身没有内建上限。真正的天花板是你自己机器的内存，做好的视频要在\
        那里拼出来你才能下载。最先撞上它的是非常大的 4K 幻灯片。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是从那儿\
        来的，广告拿不到任何关于你图片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的图片送出去处理，拔线那一刻就停了。"""

[[faq]]
q = "我能加背景音乐或者配乐吗？"
a = """
        暂时不能。这个工具只出画面，它写出来的 MP4 只有一条视频轨，没有音频\
        轨。要配乐的话，事后在视频编辑软件里加。"""

