[[privacy]]
title = "你的图片没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。这一条以前写的是 <code>connect-src 'none'</code>，\
      那是绝对的；加了广告之后就没了这个绝对，把这话说出来也是交易的一部分。"""

[[privacy]]
title = "编码在本地。"
body = """\
      WebCodecs 在你的浏览器里跑，成品直接交给下载。这个应用没有服务器那\
      一半。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你图片的信息，一条都没给它们，文件\
      不给，缩略图不给，文件名、大小、数量也不给。读图、解码、合成、编码的\
      每一行代码都从本站发出，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也拿不到\
      关于你或者你图片的任何东西。你不点它，什么都不会发生；点了，跳过去的\
      是别人的网站。"""

[[privacy]]
title = "有一个例外，而且是明说的例外。"
body = """\
      你要是用了“从网址添加”，那台服务器会被联上以取回图片，它也就看得到你的
      IP 地址。只有你亲手粘进去的图才会被取，而且只有进来这一个方向：\
      <code>img-src</code> 开着，<code>connect-src</code> 没开。下面那个计数器\
      会列出联过的每一个外部来源。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，除了“从网址加载”，这个页面上的一切照常工作。这是最省事的一条\
      证明。"""

[[howto]]
title = "选好你的图片。"
body = """\
      把整个文件夹拖到下面的方框里，或者一个个自己挑。浏览器直接从你的硬盘上\
      读，这期间没有东西发出去。"""

[[howto]]
title = "排好顺序，定好每张停多久。"
body = """\
      拖着换顺序。停留时间可以按帧算，也可以按秒算，可以一次改全部，也可以\
      一张一张改。"""

[[howto]]
title = "挑分辨率和帧率。"
body = """\
      “跟最大的那张走”按你最大的一张图来定；预设里有 4K、1080p、720p、方形和\
      竖屏；都不合适，还能自己填一个尺寸。"""

[[howto]]
title = "生成视频，然后下载。"
body = """\
      编码在你自己的硬件上跑，所以快慢取决于你这台机器，不取决于排队。做好的
      MP4 直接交给浏览器的下载。"""

[[faq]]
q = "我的图片会传到什么地方去吗？"
a = """
        不会。读图、合成、编码，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器那一半，页面的 <code>Content-Security-Policy</code> 把它\
        可能联的地址全列了出来，没有一个是本站的。唯一的例外是那个可选的\
        “从网址添加”，它会去取你粘进来的图，那台服务器也就看得到你的 IP
        地址。"""

[[faq]]
q = "支持哪些图片格式？"
a = """
        你的浏览器能解码的静态图都行，实际上就是 JPG、PNG、WebP、GIF、AVIF，\
        苹果设备上还包括 HEIC。这里没有另一份需要不断维护的清单，因为解码是\
        浏览器的活，不是我们的。"""

[[faq]]
q = "输出的是什么格式？"
a = """
        MP4，视频编码是 H.264，基本上什么设备都能放。浏览器要是没有 WebCodecs，\
        工具会退回到录制 WebM，画面还是那些画面，只是这个容器接受它的剪辑软件\
        少一些。"""

[[faq]]
q = "Blender 或者 After Effects 的渲染序列能用吗？"
a = """
        能，带编号的渲染序列正是这个工具的本行。把渲染器写出来的帧加进来，\
        停留时间保持一帧，帧率跟渲染设置对齐就行。“按名字排序”是按人的直觉数\
        的，所以 <code>frame_2</code> 排在 <code>frame_10</code> 前面，而不是\
        后面。
        <br><br>
        动手前有一点要知道：H.264 没有 alpha 通道，所以透明会被压平到衬底色上，\
        不会带过去。要保住 alpha，那就在你的剪辑软件里合成。"""

[[faq]]
q = "能拿照片做延时视频吗？"
a = """
        能，跟渲染序列是同一件事：每张照片停一帧，再挑个帧率。30 fps 下每三十\
        张照片一秒；同样这些照片放到 12 fps，能跑两秒半。
        <br><br>
        “按日期排序”能把相机胶卷放回拍摄时的顺序，文件名从 0001 重新开始过的\
        时候尤其管用。照片尺寸不一样也没关系，“跟最大的那张走”会把视频尺寸定\
        得谁都不用缩小。"""

[[faq]]
q = "图片数量或者视频长度有限制吗？"
a = """
        工具里没设上限。真正的天花板是你这台机器的内存，因为成品视频要在那儿\
        拼好你才能下载。最先撑不住的是很大的 4K 幻灯片。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是这么来的，\
        广告拿不到关于你图片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图片送出去处理的工具，拔线那一刻就停了。"""

[[faq]]
q = "能加音乐或者配乐吗？"
a = """
        暂时不能。这个工具只出视频，写出来的 MP4 只有一条视频轨，没有音轨。\
        需要配乐的话，之后在剪辑软件里加。"""

