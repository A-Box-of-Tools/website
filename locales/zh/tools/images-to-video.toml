features = [
  "把 JPG、PNG、WebP、GIF 和 AVIF 图片转成视频",
  "输出 MP4（H.264），退路是 WebM",
  "分辨率最高 3840x2160，帧率 12 到 60 fps",
  "每张图片的停留时间可按帧数或秒数设置",
  "断网可用；不上传，不注册",
]

