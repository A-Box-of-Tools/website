browser_requirements = "需要 JavaScript。输出 MP4 需要支持 WebCodecs 的浏览器，其他情况会退回到 WebM。"
description = "把一整个文件夹的图片变成 MP4 幻灯片视频。每一步都在你的浏览器里完成，所以没有任何图片被上传过。"
features = [
  "把 JPG、PNG、WebP、GIF 和 AVIF 图片转成视频",
  "输出 MP4（H.264），退路是 WebM",
  "分辨率最高 3840x2160，帧率 12 到 60 fps",
  "每张图片的停留时间可按帧数或秒数设置",
  "断网可用，不上传，不注册",
]

