[words]
plural = "图片"
choose = "图片"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[facts]]
text = "文件留在你的设备上"

[[privacy]]
title = "你的图片没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集你文件的接口，代码里也没有任何一处\
      会去发送它们，哪怕真有这么个接口。这一条以前写的是\
      <code>connect-src 'none'</code>，那是绝对的；加广告让它变了，而把这件事\
      说出来是交易的一部分。"""

[[privacy]]
title = "编码在本地。"
body = """\
      WebCodecs 在你的浏览器里运行，写好的文件直接交给下载。这个应用没有\
      服务器端。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。它们谁都没有被交给任何关于你图片的\
      信息：不是文件，不是缩略图，也不是名字、大小或数量。每一行读取、解码、\
      合成或编码图片的代码，都由这个源提供，也都列在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是一个链接，没有别的：它不上报访问，\
      也没有被交给任何关于你或你图片的信息。你不点它就什么都不会发生，而\
      点过去到达的是别人的网站。"""

[[privacy]]
title = "一个刻意留下的例外。"
body = """\
      如果你用“从网址添加”，那台服务器会被联系上以取回图片，并且会看到你的
      IP 地址。只有你自己粘进来的图片才会被抓取，而且只进不出：\
      <code>img-src</code> 被放开了，<code>connect-src</code> 没有。下面那个\
      计数器会列出被联系过的每一个外部来源。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，除了从网址加载之外，一切照常运转。这是所有证明里最简单的\
      一个。"""

[[howto]]
title = "选择你的图片。"
body = """\
      把一个文件夹拖到选择框上，或者手动挑文件。浏览器直接从你的硬盘上读\
      它们；这个过程中没有任何东西被送去哪里。"""

[[howto]]
title = "排好顺序，定好每张停多久。"
body = """\
      拖动即可重排。停留时间可以按帧数给，也可以按秒给，可以一次给所有图片，\
      也可以一张一张给。"""

[[howto]]
title = "挑一个分辨率和帧率。"
body = """\
      “跟随最高分辨率”会跟着你最大的那张图；预设覆盖 4K、1080p、720p、方形和\
      竖版，都不合适的话还有自定义尺寸。"""

[[howto]]
title = "生成视频，然后下载。"
body = """\
      编码在你自己的硬件上跑，所以要多久取决于你的机器，而不是排队。做好的
      MP4 直接交给你浏览器的下载。"""

[[faq]]
q = "我的图片会被上传到什么地方吗？"
a = """
        不会。你的图片由你自己的浏览器、在你自己的硬件上读取、合成和编码。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        列出了它可能联系的每一个地址 &mdash; 其中没有一个属于本站。唯一的\
        例外是那个可选的“从网址添加”功能，它会去取你粘进来的图片，而那台\
        服务器会看到你的 IP 地址。"""

[[faq]]
q = "我能用哪些图片格式？"
a = """
        任何你浏览器解得了的静态图片格式，实际上就是 JPG、PNG、WebP、GIF、
        AVIF，以及在苹果设备上的 HEIC。这里没有另一份需要跟着维护的清单，\
        因为解码是浏览器的活儿，不是我们的。"""

[[faq]]
q = "它输出什么视频格式？"
a = """
        MP4，视频编码是 H.264，基本上什么设备都能播。在没有 WebCodecs 的\
        浏览器里，工具会退回到录制 WebM &mdash; 同样的画面，只是装在一个\
        更少编辑软件认的容器里。"""

[[faq]]
q = "我能用它处理 Blender 或 After Effects 的渲染序列吗？"
a = """
        能 &mdash; 带编号的渲染序列正是它的用武之地。把渲染器写出来的帧加\
        进来，停留时间保持每张一帧，再把帧率设成和渲染一致。“按名称排序”\
        是按你期望的方式数数的，所以 <code>frame_2</code> 排在\
        <code>frame_10</code> 前面，而不是后面。
        <br><br>
        动手之前有一件事值得知道：H.264 没有 alpha 通道，所以透明会被压平到\
        背景色上，而不是原样带过去。如果你要保住 alpha，就在你的编辑软件里\
        合成这些帧。"""

[[faq]]
q = "我能用照片做延时视频吗？"
a = """
        能，而且这和渲染序列是同一件事：让每张照片只停一帧，再挑一个帧率。
        30 fps 下每三十张照片变成一秒视频；12 fps 下同样这些照片会放两秒半。
        <br><br>
        “按日期排序”能把一卷相机胶卷放回拍摄时的顺序，文件名从 0001 重新\
        开始过的时候，这一点很要紧。照片尺寸不一样也没关系 &mdash;
        “跟随最高分辨率”会把视频尺寸定得让它们谁都不必被缩小。"""

[[faq]]
q = "图片数量或者视频时长有上限吗？"
a = """
        工具本身没有内建上限。实际的天花板是你自己机器的内存，因为做好的\
        视频要在那里拼出来你才能下载。最先撞上它的是非常大的 4K 幻灯片。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期。本站带广告，这就是它的\
        经费来源；广告拿不到任何关于你图片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的图片送出去处理的工具，在你拔线的那一刻\
        就会停下来。"""

[[faq]]
q = "我能加背景音乐或者配乐吗？"
a = """
        暂时不能。这个工具只出画面：它写出来的 MP4 只有一条视频轨，没有音频\
        轨。需要配乐的话，事后在视频编辑软件里加。"""

