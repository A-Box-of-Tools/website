[[privacy]]
title = "处理在这个浏览器里完成。"
body = "本工具在浏览器里处理输入和结果，处理代码不把它们上传去处理。Content-Security-Policy 限制可用资源和连接目的地，但已允许的主机仍可接收请求。策略不检查载荷，不能单独证明什么都没有发出。请把具体操作的请求与源码核对，或断网完成该本地操作。"

[[privacy]]
title = "编码在本地。"
body = """\
      WebCodecs 在你的浏览器里跑，成品直接交给下载。这个应用没有服务器那\
      一半。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你图片的信息，一条都没给它们，文件\
      不给，缩略图不给，文件名、大小、数量也不给。读图、解码、合成、编码的\
      每一行代码都从本站发出，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮什么也不加载，也什么都拿不到。"
body = """\
      页头那个“Buy me a coffee”按钮是这个页面自己画的，不从任何地方加载东西。它就是个链接，仅此而已，不上报访问，也拿不到\
      关于你或者你图片的任何东西。你不点它，什么都不会发生；点了，跳过去的\
      是别人的网站。"""

[[privacy]]
title = "有一个例外，而且是明说的例外。"
body = """\
      你要是用了“从网址添加”，那台服务器会被联上以取回图片，它也就看得到你的
      IP 地址。只有你亲手粘进去的图才会被取，而且只有进来这一个方向：\
      <code>img-src</code> 开着，<code>connect-src</code> 没开。下面那个计数器\
      会列出联过的每一个外部来源。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，除了“从网址加载”，这个页面上的一切照常工作。这是最省事的一条\
      证明。"""

[[howto]]
title = "选好你的图片。"
body = """\
      把整个文件夹拖到下面的方框里，或者一个个自己挑。浏览器直接从你的硬盘上\
      读，这期间没有东西发出去。"""

[[howto]]
title = "序列选帧，幻灯片选秒。"
body = "带编号的渲染帧用“按名字排”，再看看第一张和最后一张。渲染序列或照片延时保持每张图一帧，帧率跟素材一致。幻灯片就切到秒，填一个停留时间，比如 3，再点“全部套用”。拖动可以换顺序，也可以单独改某一张的停留时间。"

[[howto]]
title = "挑分辨率和帧率。"
body = "第一次导出选 1080p，或者按目标平台选方形或竖屏。“跟最大的那张走”取所有图片里最大的宽度和最大的高度。“整张放进去”保留完整画面，“铺满画面”会裁掉边缘。编码前看一下时长和输出大小的摘要。"

[[howto]]
title = "生成视频，然后下载。"
body = """\
      编码在你自己的硬件上跑，所以快慢取决于你这台机器，不取决于排队。做好的
      MP4 直接交给浏览器的下载。"""

[[faq]]
q = "我的图片会传到什么地方去吗？"
a = """
        不会。读图、合成、编码，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器那一半，页面的 <code>Content-Security-Policy</code> 把它\
        可能联的地址全列了出来，没有一个是本站的。唯一的例外是那个可选的\
        “从网址添加”，它会去取你粘进来的图，那台服务器也就看得到你的 IP
        地址。"""

[[faq]]
q = "支持哪些图片格式？"
a = """
        你的浏览器能解码的静态图都行，实际上就是 JPG、PNG、WebP、GIF、AVIF，\
        苹果设备上还包括 HEIC。这里没有另一份需要不断维护的清单，因为解码是\
        浏览器的活，不是我们的。"""

[[faq]]
q = "输出的是什么格式？"
a = "首选输出是 H.264 视频的 MP4。备用方式是实时录制，通常是 WebM，能接受它的剪辑软件少一些。备用录制时要让标签页保持可见；时间只是近似值，解码跟不上时可能跳过图片。浏览器支持时，精确的编号序列请用 MP4 编码器。"

[[faq]]
q = "Blender 或者 After Effects 的渲染序列能用吗？"
a = """
        能，带编号的渲染序列正是这个工具的本行。把渲染器写出来的帧加进来，\
        停留时间保持一帧，帧率跟渲染设置对齐就行。“按名字排序”是按人的直觉数\
        的，所以 <code>frame_2</code> 排在 <code>frame_10</code> 前面，而不是\
        后面。
        <br><br>
        动手前有一点要知道：H.264 没有 alpha 通道，所以透明会被压平到衬底色上，\
        不会带过去。要保住 alpha，那就在你的剪辑软件里合成。"""

[[faq]]
q = "能拿照片做延时视频吗？"
a = " 能，跟渲染序列是同一件事：每张照片停一帧，再挑个帧率。30 fps 下每三十张照片一秒；同样这些照片放到 12 fps，能跑两秒半。 <br><br>“按日期排”用的是文件的修改日期，照片复制或编辑后这个日期可能会变。文件名从 0001 重新开始过时，请检查顺序。照片尺寸不一样也没关系，“跟最大的那张走”先取最大的宽度和最大的高度，再把最长边限制在 7680 像素，并取整到偶数尺寸。看一下输出大小的摘要；很大的原图仍可能被缩小。"

[[faq]]
q = "图片数量或者视频长度有限制吗？"
a = "图片数量没有固定上限，但 MP4 导出必须小于 4 GiB（约 4.3 GB）。成品视频要先在内存里拼好才能下载，所以设备可能远没到这个上限就内存不足。浏览器的编码器也会限制输出尺寸。大文件导出失败时，可以降低分辨率、缩短序列，或者分成几段。"

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是这么来的，\
        广告拿不到关于你图片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图片送出去处理的工具，拔线那一刻就停了。"""

[[faq]]
q = "能加音乐或者配乐吗？"
a = """
        暂时不能。这个工具只出视频，写出来的 MP4 只有一条视频轨，没有音轨。\
        需要配乐的话，之后在剪辑软件里加。"""

