[[privacy]]
title = "你贴进来的东西没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个属于\
      本站。这里没有任何可以收走一个贴进来的 token 的接收端，就算有，代码里也没有\
      把它送过去的东西。"""

[[privacy]]
title = "这里不会去取任何东西。"
body = """\
      整个 <code>src/</code> 里没有 <code>fetch</code>，没有 \
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。每个解析器、\
      每个编码器和那套比对，都是这个页面里接收一串字符、返回一串字符的函数。"""

[[privacy]]
title = "格式化器会原样保留交给它的东西。"
body = """\
      一个 JSON 对象回来时，键还是你写的顺序，数字还是你写的那些位，因为 \
      <code>src/json.js</code> 是一个解析器，而不是对 <code>JSON.parse</code> 的\
      调用——后者会把像整数的键挪到前面，还会把二十位的 id 变成最接近的双精度。\
      <code>tests/js/text-format.test.js</code> 里的测试查的正是这些。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。你的文本，一个\
      字符也没有交给它们。读取、解析、写出文本的每一行代码都由这个源提供，也都摆在\
      仓库里。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个工具跟原来一模一样，因为它里面从来就没有联网这一步。这是最\
      省事的一条证明。"""

[[howto]]
title = "选好要做的事。"
body = """\
      四个标签页共用一个输入框：<em>格式化</em>把 JSON、XML、HTML、CSS 和 YAML \
      排开或者压平；<em>转换</em>把 JSON 变成 YAML 或 XML，也能变回来；\
      <em>编码</em>做 Base64、URL、HTML 实体、十六进制和反斜杠转义，两个方向都行；\
      <em>比对</em>显示两段文本之间改了什么。"""

[[howto]]
title = "贴进来，或者把文件拖进来。"
body = """\
      凡是你能选中并复制的都行。拖到选择框上的文件由你自己的浏览器读进输入框：\
      这里根本没有可省略的上传步骤。比对时拖两个文件进来，它们会各落一边。"""

[[howto]]
title = "让它自己判断语言，或者直接告诉它。"
body = """\
      菜单里写着它把这段文本当成了什么，改正只要一次点击。判断只是个起点，所以\
      它被摆出来，而不是悄悄套用。"""

[[howto]]
title = "选好缩进，或者干脆压平。"
body = """\
      两个空格、四个空格，或者一个制表符。压平就是同一份文档，只是把纯粹为了阅读\
      才存在的空白都去掉，结果里会写明这样省下了多少字节。"""

[[howto]]
title = "在出错的地方读错误。"
body = """\
      这里的解析器失败时，会说它看到了什么，以及在第几行第几列，而不是“位置 4193 \
      处有意外的 token”。通常这就足够把一份配置文件改对，不用再打开别的东西。"""

[[howto]]
title = "把结果带走。"
body = """\
      复制它，或者下载成文件。比对下载下来是 unified 格式的 <code>.patch</code>，\
      而这正是代码评审、<code>git apply</code> 和各种差异查看器所期望的。"""

[[faq]]
q = "我的文本会被传到哪里去吗？"
a = """
        不会。这个页面上的每个解析器、编码器和那套比对，都是在你自己的浏览器里、\
        你自己的硬件上运行的函数。这个工具没有任何形式的网络功能：它从不去取什么，\
        也从不发出什么；页面的 <code>Content-Security-Policy</code> 里写着它允许\
        联系的每一个地址，没有一个属于本站。这正是拿它来处理访问令牌、会话 cookie \
        或客户记录的理由：把这类东西贴进别人的格式化器，等于把它交给了对方。"""

[[faq]]
q = "格式化 JSON 除了排版之外还会改动什么吗？"
a = """
        不会，而这比听上去难。键会保持你写的顺序：建在 <code>JSON.parse</code> 上的\
        格式化器会悄悄把像整数的键挪到前面，于是 <code>{"10":a,"2":b}</code> 回来\
        就成了 <code>{"2":b,"10":a}</code>。数字会保留你敲的那些位，所以二十位的 id \
        不会把最后三位丢给双精度，<code>1e999</code> 也不会变成 <code>null</code>。\
        重复的键两个都留着，因为标准并没说哪个胜出，丢掉一个就是替你做决定。"""

[[faq]]
q = "它能格式化哪些语言？"
a = """
        JSON、XML、HTML、CSS 和 YAML。JSON、XML、HTML 和 CSS 还能压平；YAML 不行，\
        因为它的短写法是流式风格，那是读不下去的，而读不下去恰恰是把文件留在 YAML \
        的理由的反面。JavaScript 是有意不在名单上的，见下面那条问题。"""

[[faq]]
q = "为什么它不格式化 JavaScript、Python 或 SQL？"
a = """
        因为要排开一门编程语言，就得把它真正解析明白，而一个差不多对的格式化器比\
        没有还糟：它产出的代码看着没问题，做的却是另一回事。JSON、XML、CSS 和 YAML \
        的文法小到可以手读，也能用你自己跑得动的测试查清楚。JavaScript 的格式化器\
        叫 Prettier，那是一兆字节的解析器，它该待在你的编辑器里，而不是一个网页上。"""

[[faq]]
q = "这个比对到底在做什么？"
a = """
        它找出把左边那段文本变成右边那段所需的最短一组编辑，用的是 Myers 算法——\
        <code>git diff</code> 用的那个。最短，正是让差异读得下去的关键：在中间插入\
        一行，就该显示为一次插入，而不是后面每一行都变了。在改动行的内部，不同的\
        词也会被标出来，所以比较两段文字时看到的是挪动的那个词，而不是整整两段。"""

[[faq]]
q = "能比对两个文件，而不是两段粘贴吗？"
a = """
        能。在“比对”标签页打开时把两个都拖到选择框上，它们会按你放下的顺序各落\
        一边。读它们的是你的浏览器，读进这个页面，而这也是它们唯一去的地方。要是\
        放反了，把两边换过来就行。"""

[[faq]]
q = "比对会输出什么，我能应用它吗？"
a = """
        下载的是一份 unified diff，也就是 <code>@@ -3,5 +3,5 @@</code> 那种格式，\
        <code>git apply</code>、<code>patch</code> 和所有代码评审工具都读得懂。\
        复制则是把同样的东西放进剪贴板。屏幕上看到的只是它的一种呈现：左右并排，\
        或者单列，未改动的部分折叠成一个计数，除非你要求全部展开。"""

[[faq]]
q = "这里的 Base64 和别处的 Base64 一样吗？"
a = """
        一样——它是拿 RFC 4648 的测试向量来核对的，而不是拿自己核对自己。两套字母表\
        都能解码，所以用 <code>-</code> 和 <code>_</code> 写的 JWT，和用 \
        <code>+</code> 和 <code>/</code> 写的一样好读；按 64 个字符折行的输入，会\
        替你接回去。编码走的是 UTF-8 字节，所以带重音的字母或者 emoji 一来一回都\
        安然无恙。"""

[[faq]]
q = "我的 YAML 写的是 no，转成 JSON 却成了字符串。为什么？"
a = """
        因为它本来就是字符串，而这里读的是 YAML 1.2，不是 1.1。在 YAML 1.1 里，\
        <code>yes</code>、<code>no</code>、<code>on</code> 和 <code>off</code> 是\
        布尔值，这就是那个把挪威的国家代码变成 <code>false</code> 的著名毛病。\
        YAML 1.2 把它去掉了，这个工具也一样：只有 <code>true</code>、\
        <code>false</code>、<code>null</code> 和 <code>~</code> 会被读成文本之外的\
        东西。反过来写出去时，这些词会<em>加上引号</em>，尽管这里不加引号也照样读成\
        文本——因为下一个打开这个文件的东西未必如此。PyYAML 至今默认还是 1.1。读得\
        严、写得稳，是唯一在两个方向上都不出错的组合。"""

[[faq]]
q = "把 YAML 转成 JSON 会丢什么？"
a = """
        注释，因为 JSON 没地方放。锚点、别名和标签会被直接拒绝，而不是替你猜：它们\
        每一个说的都是 JSON 说不出来的事，而一个悄悄挑了个解释的转换器，交给你的将是\
        一份并非原文所说的文档。反方向不丢任何东西：每一份 JSON 文档本来就已经是一份\
        YAML 文档。"""

[[faq]]
q = "把 JSON 转成 XML 会丢什么？"
a = """
        空对象、空数组和空字符串之间的区别，它们都会变成一个空元素；还有每个值的\
        类型，因为 XML 没有类型——这也是为什么反向转换会把一切都留成字符串，而不是\
        断定 <code>8080</code> 是个数字。数组会变成重复出现的元素，因为只有这种形状\
        读得回来；而元素名承载不了的键，会把不便的字符替换掉，而不是吐出一份没有\
        解析器读得动的文档。"""

[[faq]]
q = "重新缩进 HTML 会改变页面的样子吗？"
a = """
        可能会，这一点这里说得很老实。两个行内元素之间的空白，就是两个词之间的一个\
        空格，挪动它并不免费。有两件事把这个风险摁住：<code>&lt;pre&gt;</code> 和 \
        <code>&lt;textarea&gt;</code> 原样照抄，而一个只装着文本的元素会留在一行上。\
        其余的才会被排开。"""

[[faq]]
q = "它能处理多大的文件？"
a = """
        这里没有设上限，因为没有哪台服务器在为上限掏钱。真正的天花板是你自己的机器：\
        几兆字节的 JSON 没问题。两段毫无共同之处的文本比对会提前停下并说明，而不是\
        花一分钟去证明本来就明摆着的事；而非常长的比对会画出前几千行，其余交给下载\
        下来的补丁。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，贴多少也没有上限。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你文本的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最省事的\
        办法，真要把你的文本送出去格式化，拔线那一刻就停了。"""

