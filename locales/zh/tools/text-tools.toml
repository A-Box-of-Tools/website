features = [
  "格式化并压缩 JSON、XML、HTML 和 CSS，并排开 YAML",
  "保留 JSON 键的顺序，以及每个数字一位不差的写法",
  "用人话说明错误在第几行第几列",
  "用 Myers 算法比对两段文本，可并排或单列显示",
  "在改动行内部标出变化的词",
  "把比对结果下载成代码评审读得懂的 unified diff",
  "两套字母表的 Base64、百分号编码、HTML 实体、十六进制和反斜杠转义",
  "在 JSON 与 YAML、XML 之间互转，并说明每个方向会丢什么",
  "读 YAML 1.2，所以 yes 和 no 仍然是字符串",
  "拖进来的文件和粘贴的文本一样好用",
  "断网可用；不上传、不注册",
]

