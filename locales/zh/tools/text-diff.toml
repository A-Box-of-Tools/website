[[privacy]]
title = "你贴进来的东西没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个属于\
      本站。这里没有任何可以收走一个贴进来的 token 的接收端，就算有，代码里也没有\
      把它送过去的东西。"""

[[privacy]]
title = "这里不会去取任何东西。"
body = """整个 <code>src/</code> 里没有 <code>fetch</code>，没有 <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。比对是这个页面里接收两串字符、返回哪里变了的函数。"""

[[privacy]]
title = "算法就是那个标准算法，整个都能读。"
body = """Myers 的最短编辑脚本算法，和 <code>git diff</code> 用的是同一个，手写在 <code>src/diff.js</code> 里，每处取舍都写了注释。<code>tests/js/text-diff.test.js</code> 里的测试证明：删除能重建左边的文本，插入能重建右边的文本——对一份 diff 来说，“正确”指的就是这个。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。你的文本，一个\
      字符也没有交给它们。读取、解析、写出文本的每一行代码都由这个源提供，也都摆在\
      仓库里。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个工具跟原来一模一样，因为它里面从来就没有联网这一步。这是最\
      省事的一条证明。"""

[[howto]]
title = "贴上两段文本，或者拖进两个文件。"
body = """原文在左，改过的在右。同时拖到选择框上的两个文件会按你放下的顺序各落一边；放反了就把两边换过来。"""

[[howto]]
title = "选好怎么读。"
body = """并排，或者单列。手机上从单列开始，因为并排需要两栏文字，而手机差不多只装得下一栏；反正菜单就在旁边。"""

[[howto]]
title = "忽略无关紧要的。"
body = """空白、大小写、空行——每一样都可以单独忽略，免得一个只是重新排版过的文件读起来像改了一百处。默认把没变的中段折叠成一个数字，每处改动两侧各留三行。"""

[[howto]]
title = "读一读改了什么。"
body = """删掉的行标在左边，新增的行标在右边；改动行内部，不同的词会被高亮——两段文字的比对显示的是挪动的那个词，而不是两整段。"""

[[howto]]
title = "把补丁带走。"
body = """下载下来的是统一格式的 <code>.patch</code>，代码评审、<code>git apply</code> 和所有差异查看器认的就是它。复制会把同样的内容放进剪贴板。"""

[[faq]]
q = "我的文本会被传到哪里去吗？"
a = """
        不会。比对是在你自己的浏览器里、你自己的硬件上运行的函数。这个工具没有任何形式的网络功能：它从不去取什么，也从不发出什么；页面的 <code>Content-Security-Policy</code> 里写着它允许联系的每一个地址，没有一个属于本站。这正是拿它来处理合同、配置文件或未发布代码的理由：把这类东西贴进别人的比对器，等于把两个版本一次全交了出去。"""

[[faq]]
q = "这个比对到底在做什么？"
a = """
        它找出把左边那段文本变成右边那段所需的最短一组编辑，用的是 Myers 算法——\
        <code>git diff</code> 用的那个。最短，正是让差异读得下去的关键：在中间插入\
        一行，就该显示为一次插入，而不是后面每一行都变了。在改动行的内部，不同的\
        词也会被标出来，所以比较两段文字时看到的是挪动的那个词，而不是整整两段。"""

[[faq]]
q = "能比对两个文件，而不是两段粘贴吗？"
a = """
        能。把两个同时拖到选择框上，它们会按你放下的顺序各落一边。读它们的是你的浏览器，读进这个页面，而这也是它们唯一去的地方。要是放反了，把两边换过来就行。"""

[[faq]]
q = "比对会输出什么，我能应用它吗？"
a = """
        下载的是一份 unified diff，也就是 <code>@@ -3,5 +3,5 @@</code> 那种格式，\
        <code>git apply</code>、<code>patch</code> 和所有代码评审工具都读得懂。\
        复制则是把同样的东西放进剪贴板。屏幕上看到的只是它的一种呈现：左右并排，\
        或者单列，未改动的部分折叠成一个计数，除非你要求全部展开。"""

[[faq]]
q = "能忽略空白、大小写或空行吗？"
a = """
        能，每一样单独控制。忽略空白后，只是重新排版过的文件会被比对成没有变化；忽略大小写会把 <code>Error</code> 和 <code>error</code> 当成同一个词；忽略空行会跳过什么都不装的行。这时结果上方的计数会说：把你要求忽略的差异忽略之后，两边是一样的——这和“完全相同”不是同一个论断，页面把两个论断分得清清楚楚。"""

[[faq]]
q = "它能处理多大的比对？"
a = """
        这里没有设上限，因为没有哪台服务器在为上限掏钱。两万行的两段文本只改了几处，眨眼就比完了，因为共同的开头和结尾在真正干活之前就被裁掉了。两段毫无共同之处的文本比对会提前停下并说明，而不是花一分钟去证明本来就明摆着的事；而非常长的比对会画出前几千行，其余交给下载下来的补丁。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，贴多少也没有上限。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你文本的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最省事的办法，真要把你的文本送出去比对，拔线那一刻就停了。"""

