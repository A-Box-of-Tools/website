  "并排或单列，没变的中段折叠成一个数字",
  "空白、大小写、空行，每一样都能单独忽略",
  "把比对结果下载成代码评审读得懂的 unified diff",
  "拖进来的两个文件，比起来和两段粘贴一样容易",
  "共同的开头结尾先裁掉，又长又像的文件眨眼就比完",
  "断网可用；不上传、不注册",
]

