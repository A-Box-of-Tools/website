[[privacy]]
title = "你的照片没有地方可去。"
body = """\
 Content-Security-Policy 里写着这一页能\
      联系的每一个地址，没有一个属于本站。这里没有一个能收集你文件的接口，就算有，\
      代码里也没有任何东西会把它们送出去。<code>src/</code> 里没有，worker 里也没有 \
      <code>fetch</code>、<code>XMLHttpRequest</code> 或者 <code>sendBeacon</code>。"""

[[privacy]]
title = "RAW 文件是被读，不是被上传，而且只读了一点点。"
body = """\
 相机的 RAW 文件里本来就有一张\
      相机在按下快门那一刻渲染好的原尺寸 JPEG。这个工具走几条目录项把它找出来，然后只要\
      其中一段，在一个 60&nbsp;MB 的文件上通常不到一百 KB。你干活的时候，页面会一直\
      把这个数字摆在你文件的大小旁边。传感器数据根本一次都没读过。"""

[[privacy]]
title = "活是在这台机器的 Worker 里干的，不是在服务器上。"
body = """\
 这是本站唯一用 worker 的\
      工具，因为堆栈是几分钟的算术而不是几秒，而一个卡死的页面既显示不了进度也没法\
      被取消。Worker 是同一个浏览器里的第二条线程，看 <code>src/worker.js</code>。\
      交给它的是文件本身，这不花什么代价，因为文件句柄不是那些字节；而它受着和页面\
      完全一样的 Content-Security-Policy，也就是说无处可送。"""

[[privacy]]
title = "关于这一组，没有向任何地方报告过什么。"
body = """\
 你堆了几帧、是哪台相机写的、\
      每一帧偏了多少、你选了哪种手法、花了多久，这些都留在这一页的内存里，直到你关掉它。\
      本仓库里没有任何一个自定义分析事件会带走其中一星半点，而本站在下载之后问的那一个\
      问题，送出去的是一个大拇指的方向和工具的名字，别的什么都没有。"""

[[privacy]]
title = "断网也能用。"
body = """\
 把网络断掉，这个工具一点不变，因为它里面从来就没有\
      联网那一步。worker 和它加载的每一个模块都由这一页自己的 service worker 缓存着，\
      所以装下来的那一份，拔了网线照样能堆 RAW 文件。"""

[[howto]]
title = "选帧。"
body = """\
 一串连拍、一组包围曝光、一段间隔拍摄，或者一整个装着 \
      RAW 文件的文件夹都行。每一个到了就打开，那一行会告诉你从里面读出了什么。RAW 文件\
      的话，是相机型号、里面找到的预览图尺寸，以及为了找到它只需要读多少。"""

[[howto]]
title = "按你想失去的东西挑手法。"
body = """\
 噪点：平均值；要是有什么动过，\
      Sigma 裁剪。人、车、飞过去的飞机：中位数。想变成星轨的暗夜空：最亮。沿着对焦环\
      拍的微距：景深合成。菜单下面那行字会说明，对你手上这个帧数，每种手法会做什么。"""

[[howto]]
title = "决定要不要对齐。"
body = """\
 手持：要，只平移。手持而且还在转：\
      平移加旋转加缩放。锁死的三脚架或者间隔拍摄：不要，而且会更快。每一帧都是拿列表里\
      第一帧当基准来量的，所以任何一帧都可以被提上去当第一帧。"""

[[howto]]
title = "读那四个数字，再按按钮。"
body = """\
 在任何东西开跑之前，页面会说清\
      结果会有多大、大概要多少内存、这些帧会被解码多少次，以及你的文件被读了多少。\
      这一组要是没法一次装进内存，它也会说，并且说清换哪一档工作分辨率就够了。"""

[[faq]]
q = "我的照片会被上传吗？"
a = """
        不会。每一帧的打开、解码、对齐、堆栈和写出，全都由你自己的浏览器在你自己的\
        硬件上完成。这个工具没有任何联网功能，从不取东西，也从不发东西，页面的 \
        <code>Content-Security-Policy</code> 里写着它能联系的每一个地址，没有一个属于\
        本站。把页面加载一次，断网，它照样能用。这件事在这里比在多数工具上更要紧，\
        单纯是因为量：二十个 RAW 帧差不多一个 G，而为了让别人算一次平均值就上传一个 G \
        的照片，正是这个工具存在的意义所要避开的事。"""

[[faq]]
q = "它能读哪些 RAW 格式？怎么读的？"
a = """
        <span id="faq-raw"></span>CR2、CR3、NEF、NRW、ARW、SR2、SRF、DNG、ORF、RAF、RW2、\
        PEF、SRW、3FR、IIQ、DCR、KDC、MRW、MEF、RWL 等等，也就是相机会写的绝大多数。\
        从里面读出来的是相机自己在按下快门那一刻渲染好的原尺寸 JPEG 预览图，也就是相机\
        背后屏幕上显示的那张，以及你的操作系统拿来当缩略图画的那张。它是靠走文件的目录\
        结构找到的，代价是几次每次几十 KB 的读取，然后取其中一段。<strong>这不是对传感器\
        数据做去马赛克。</strong>结果带的是相机自己的白平衡和照片风格，每通道八位，\
        而不是 RAW 转换器会给你的那十二位或者十四位线性传感器数据。"""

[[faq]]
q = "那为什么不好好解码传感器数据？"
a = """
        因为那意味着要把 LibRaw 或者 dcraw 随包带上：为了一个格式家族多背一个几十兆的\
        引擎，而其中大半还是各家厂商自己的压缩方案。这笔账在本站源码的 \
        <code>docs/what-can-be-built-here.md</code> 里算过，相机 RAW 早在这个工具出现\
        之前就在排除名单上了。变的不是那个问题的答案，而是我们发现堆栈根本不需要它：\
        预览图是全分辨率的，本来也就是相机会给你的那张 JPEG，而读它比去马赛克快大约\
        一百倍。你要是要传感器数据，先在 RAW 转换器里冲一遍，再把它给出的 TIFF 或者 \
        JPEG 拿来堆栈，这个工具也收那些。"""

[[faq]]
q = "它能处理多少帧？多大的？"
a = """
        七种手法里有六种是流式的：只留一个累加器，每一帧恰好读一次，所以一百帧跟两帧\
        占一样的内存，长的只有时间。中位数是例外，因为一组数的中间那个值，不把整组拿全\
        就无从知道，于是它得同时抱着每一帧。二十张 2400 万像素差不多是 1.4&nbsp;GB，\
        没有哪个浏览器给得起。碰上这种情况，图会被切成横条，一条一条地堆，代价是每条都要\
        把这些帧重读一遍。这些页面在你按下按钮之前就全算好并且写出来了，所以跑得慢从来\
        不会是个意外。"""

[[faq]]
q = "对齐到底做了什么？"
a = """
        它算出每一帧相对第一帧偏了多少，再把它挪回去，精度到一个像素的几分之一。用的方法\
        是相位相关：两张图之间的位移，在它们的频谱之间表现为一个相位差，所以各做一次\
        傅里叶变换，找两百像素的偏移和找两像素的一样便宜。第二档设置把同一个把戏用在\
        对数极坐标下的频谱上，连旋转和缩放也一起还原。这些都是全局的，整帧一个位移、\
        一个角度、一个缩放。所以它能纠正动了的相机，纠正不了动了的被摄体，也纠正不了\
        往左挪了一步再拍的那一张。有一个看得见的后果：往左挪了二十像素的一帧，右边缘\
        够不到了，所以结果会裁到每一帧都覆盖到的那块。对齐过的堆栈比进去的帧略小一点，\
        原因就在这里，而这也是不让画面出现一圈由缺帧造成的黑边的唯一办法。"""

[[faq]]
q = "我该用哪种手法？"
a = """
        什么都没动的一组，要消噪点就用<strong>平均值</strong>，它把随机噪点大约按帧数的\
        平方根压下去。要去掉只在一部分时间里出现过的东西，用<strong>中位数</strong>，\
        最经典的用法就是把一个人来人往的广场拍上十几张，然后得到一个空广场。两样都想要，\
        用 <strong>Sigma 裁剪</strong>：它先学出每个像素通常是什么，再只对跟这个说法\
        一致的数值取平均，于是既有中位数那种对开过去的车的免疫，也有平均值那种消噪能力。\
        星轨、烟花和光绘用<strong>最亮</strong>。要去掉任何动过的亮东西，用\
        <strong>最暗</strong>。要模拟一次长曝光，用<strong>相加</strong>。沿着对焦环拍的\
        微距，用<strong>景深合成</strong>。"""

[[faq]]
q = "我的 RAW 是十四位的，为什么结果是八位？"
a = """
        因为被堆的是相机自己的预览图，而那是一张 JPEG。不过值得说一句：堆栈能把这笔代价\
        找回来一部分。十六张八位的帧取平均，得到的层次确实比其中任何一张都细，因为正是\
        那个让每一帧四舍五入得不一样的噪点，才让平均值能落在两级之间。这里的算术是用\
        浮点做的，只在最后一步取整一次，所以中间没有丢掉任何东西。它终究还是不等于堆栈\
        线性的传感器数据，这个工具也不装作是。"""

[[faq]]
q = "尺寸不同的帧，或者不同相机的帧，能堆吗？"
a = """
        能，不过那通常是个误会，值得确认一下你真是这个意思。结果的尺寸取最大的那一帧，\
        其余每一帧都缩放到能放进去并居中。混相机也就混了色彩的解释，所以两者的平均值，\
        是对同一束光的两种不同解释的平均值。真正用得上的场合，是一组用两种分辨率拍的，\
        或者同一帧的 RAW 文件和 JPEG。"""

[[faq]]
q = "它说这一次会分条跑，什么意思？"
a = """
        意思是这种手法需要的工作内存，超过了这个工具愿意一次性申请的量，所以图会被切成\
        横条，一条一条地堆。结果完全一样，只是每条都要把这些帧重读一遍，所以更慢，而页面\
        会告诉你那会是多少次解码。把工作分辨率降一档，内存就变成四分之一，几乎总能把分条\
        跑变回一遍跑完，而且提示里也写了换哪一档就行。"""

[[faq]]
q = "为什么只有这个工具用 Worker，别的都不用？"
a = """
        因为只有它的活是按分钟算的。本站其他每一个工具做的事都是一两秒的量，把活挪出主\
        线程只是走个过场。堆二十张大帧是在几百兆上做扎实的算术，放在主线程上就意味着一个\
        卡死的页面：进度条不动，取消按钮不应，最后浏览器出来问要不要关掉这个标签页。\
        Worker 是同一个浏览器里的第二条线程，跑的是同一个文件夹里的文件，受的是同一套\
        策略。它不是服务器，也不是联网功能。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。堆多少帧、帧有多大都没有限制，\
        因为根本没有服务器在为它掏钱，活是在你自己的机器上干的，天花板只有你自己的内存。\
        本站靠广告养活，广告那边拿不到关于你照片的任何东西。"""

