features = [
  "七种堆栈手法：平均值、中位数、Sigma 裁剪平均、最亮、最暗、相加和景深合成",
  "靠取出相机自己的原尺寸预览图来读 CR2、CR3、NEF、ARW、DNG、ORF、RAF、RW2 等等",
  "一个 60 MB 的 RAW 文件，只读其中大约一百 KB 就能打开",
  "自动对齐：只平移，或者平移加旋转加缩放，或者不对齐",
  "用相位相关做亚像素对齐，而不是去逐个试偏移量",
  "七种里有六种只留一个累加器，所以一百帧只占两帧的内存",
  "内存和解码的代价在开跑之前就算好并显示出来",
  "活跑在 Worker 里，所以进度会走，取消也应",
  "输出 PNG 或者 JPEG，断网可用，不上传，不注册",
]

[picker]
title = "把这些帧拖到这里"
hint = "或者点击选择 | JPEG、PNG、WebP、TIFF，以及相机 RAW"
