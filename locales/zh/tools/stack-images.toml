[[howto]]
title = "选帧。"
body = "选一串连拍、间隔拍摄序列，或内含可用 JPEG 预览图的 RAW 文件。等文件全部打开。每一行都会显示找到的内容：RAW 会显示相机型号和内嵌预览图的实际尺寸。打不开的文件会留在列表里，方便你检查哪些被排除了。"

[[howto]]
title = "按你想失去的东西挑手法。"
body = "噪点用平均值，想排除与其余不同的值就用 Sigma 裁剪。人、车或飞机用中位数，前提是它们在画面的每个位置出现的帧数不到一半。星轨用最亮，沿对焦环拍的微距用景深合成。菜单下面会说明手法和限制。"

[[howto]]
title = "决定要不要对齐。"
body = "先用自动：测量平移、旋转和缩放，整张图中可靠区域一致时再校正透视。它适合广角星空。稳定的连拍用只平移可以减少测量。各帧已对齐，或要保留天空运动来制作星轨时，选不对齐。固定三脚架并不能让星星保持对齐。每帧都与标着基准的帧比较，默认是第一帧。“拿它当基准”只更换标记，不重排列表。"

[[howto]]
title = "读那四个数字，再按按钮。"
body = "开始前，页面会显示计划结果尺寸、堆栈估计内存、堆栈计划解码次数，以及检查时读过的字节数。浏览器内部和内存回收可能需要建模缓冲区之外的内存，这些数字是计划，不保证浏览器的总用量。如果要分条，页面会建议降低工作分辨率。完成后按实际像素大小对比基准和结果，检查对齐详情，再下载。"

[[faq]]
q = "我的照片会被上传吗？"
a = """
        不会。每一帧的打开、解码、对齐、堆栈和写出，全都由你自己的浏览器在你自己的\
        硬件上完成。这个工具没有任何联网功能，从不取东西，也从不发东西，页面的 \
        <code>Content-Security-Policy</code> 里写着它能联系的每一个地址，没有一个属于\
        本站。把页面加载一次，断网，它照样能用。这件事在这里比在多数工具上更要紧，\
        单纯是因为量：二十个 RAW 帧差不多一个 G，而为了让别人算一次平均值就上传一个 G \
        的照片，正是这个工具存在的意义所要避开的事。"""

[[faq]]
q = "它能读哪些 RAW 格式？怎么读的？"
a = "<span id=\"faq-raw\"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF, RAF, RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL 等格式在文件内含可用 JPEG 预览图时受支持。工具会遍历目录，使用找到的最大预览图；它可能比传感器图像小，也可能根本不存在。<strong>不解码传感器数据。</strong>像素保留相机的白平衡和照片风格，每通道八位。请检查列表里的尺寸。检查读取量只统计文件头和目录，解码时还会读取 JPEG 片段。"

[[faq]]
q = "那为什么不好好解码传感器数据？"
a = "解码传感器需要 LibRaw 或 dcraw 这样的 RAW 引擎，处理各相机专有的压缩方式。使用内嵌 JPEG 可以让工具保持小巧，并使用浏览器自己的图片解码器。代价是接受相机的渲染，以及文件里预览图的实际分辨率。要自行选择 RAW 冲洗设置，请先冲洗各帧，再导出 JPEG 或 PNG 来这里堆栈。"

[[faq]]
q = "它能处理多少帧？多大的？"
a = "七种手法里有六种的累加器大小不随帧数增长。平均值、最亮、最暗、相加和景深合成每条处理一遍，Sigma 裁剪处理两遍。中位数保存当前条带内每一帧的数值，所以帧数越多，内存越大。任何手法的工作缓冲区超过工具预算时都可以分条，这就需要为每条重新解码各帧。页面会估计这些缓冲区，并显示堆栈计划解码次数。检查和对齐还会增加处理，浏览器编解码器和 GPU 内部可能需要估计之外的内存。"

[[faq]]
q = "对齐到底做了什么？"
a = "工具测量每一帧相对基准帧的偏移，再以亚像素精度移回去。方法是相位相关：偏移表现为两张图片频谱之间的相位差，所以每张图一次傅里叶变换，就能用相同成本找到两百像素或两像素的偏移。旋转和缩放则用同样的方法在对数极坐标频谱中找出。自动还会测量分布在整张图上的区域，足够多的可靠测量一致时就校正透视。这有助于广角星空在边缘和中央都保持对齐。如果无法可靠测量额外修正，就保留旋转和缩放，并在对齐详情中说明未做透视校正。修正作用于整帧，不能对齐独立移动的物体，也不能让往旁边迈一步再拍的场景里所有深度都对齐。向左移的帧够不到右边缘，因此结果会裁到所有帧共同覆盖的范围，可能略小。这样可以避免未覆盖区域形成的暗边。"

[[faq]]
q = "我该用哪种手法？"
a = "没有东西移动、只想消噪点时用<strong>平均值</strong>，独立的随机噪点大约按帧数的平方根降低。<strong>中位数</strong>用于移除在画面每个位置出现帧数不到一半的东西。<strong>Sigma 裁剪</strong>只对靠近平均值的数值取平均，排除超出所选阈值的值。帧数少或移动物体频繁出现时，它们可能留在结果里；如果去除它们最重要，中位数更可靠。星轨、烟花和光绘用<strong>最亮</strong>，移除移动的亮东西用<strong>最暗</strong>。<strong>相加</strong>把解码后的各帧做加法混合，处理的是八位图像值，并不能模拟相机更长的曝光。沿对焦环拍的微距用<strong>景深合成</strong>。"

[[faq]]
q = "我的 RAW 是十四位的，为什么结果是八位？"
a = "RAW 输入用的是相机的 JPEG 预览图，输出是八位 PNG 或 JPEG。平均值和 Sigma 裁剪用更宽的累加器，只在最后取整，这样能从有噪点的各帧估计更干净的值，不用每一步都取整。保存后的图片仍是每通道八位，得不到线性传感器数据的位深或动态范围。"

[[faq]]
q = "尺寸不同的帧，或者不同相机的帧，能堆吗？"
a = "能，但请确认是有意混用。最大的帧决定工作范围，其余各帧缩放后居中。保存的结果会裁到各帧共有的区域，所以形状不同或对齐可能让它比计划范围小。混用相机也会混合它们的色彩渲染。保持曝光和构图一致，并通过基准对比检查结果。"

[[faq]]
q = "它说这一次会分条跑，什么意思？"
a = "该手法需要的工作内存超过工具愿意一次分配的量，因此图片会切成水平条带，一条一条堆栈。使用相同的对齐几何和堆栈手法，但浏览器重采样可能让最低位略有差异。每条都会重新读取各帧，所以更慢，页面会显示计划解码次数。工作分辨率降一档，内存变为四分之一，几乎总能变回一遍处理，注记会说明对应的设置。"

[[faq]]
q = "为什么只有这个工具用 Worker，别的都不用？"
a = """
        因为只有它的活是按分钟算的。本站其他每一个工具做的事都是一两秒的量，把活挪出主\
        线程只是走个过场。堆二十张大帧是在几百兆上做扎实的算术，放在主线程上就意味着一个\
        卡死的页面：进度条不动，取消按钮不应，最后浏览器出来问要不要关掉这个标签页。\
        Worker 是同一个浏览器里的第二条线程，跑的是同一个文件夹里的文件，受的是同一套\
        策略。它不是服务器，也不是联网功能。"""

[[faq]]
q = "免费吗？要注册吗？"
a = "免费，没有账号、登录、试用期或水印。服务不对帧数或尺寸设额度。实际限制来自设备内存、浏览器的画布和解码器限制，以及处理时间。本站由广告支持，广告拿不到关于照片的信息。"

