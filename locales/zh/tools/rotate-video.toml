#
# Rotate a video - 简体中文。
#
# Overrides for tools/rotate-video/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样。
#
# 第一件：旋转改的是文件头，不是画面。手机拍横了的时候，是往显示矩阵里写了一个
# 四分之一转，每个播放器都会照着转；这一页写一个不一样的矩阵，把每一帧、每一个
# 声音包原样复制过去。所以它快、什么都不丢，页面也一直在说「一帧都不用解码」，
# 这是它的承诺，而且是真的。
#
# 第二件：这个文件头每一部手机、每一个浏览器和现代播放器都认，少数老的桌面
# 播放器不认，页面两边都要说，哪一边都不能装作没有。「把旋转烧进画面」是为那些
# 播放器准备的，也是 WebM、MKV 里不是 H.264 的画面唯一的路；它要重新编码，
# 会丢一代，页面把它当作第二选择来写。
#
# 用词：header 写「文件头」，display matrix 写「显示矩阵」，bake in 写
# 「烧进画面」，re-encode 写「重新编码」，copy 写「原样复制」，a quarter turn
# 写「转四分之一圈」，clockwise 写「顺时针」。格式名一律不译。
#

