[[privacy]]
title = "旋转是文件头里的九个数字，这一页只改这九个。"
body = """\

      手机拍横了的时候并没有把像素转过来。它把画面按传感器看到的样子存下，然后\
      往轨道的文件头里写一个四分之一转，也就是一个九个数字的显示矩阵，每个播放器\
      在送到屏幕的路上都会照着转。所以一段显示成横的视频需要的是另一个矩阵，不是\
      另一幅画面。这一页写下你选的那个方向的矩阵，把每一帧、每一个声音包原样复制\
      过去，一帧都不解码。这就是为什么一个 GB 只要几秒，为什么画面一个比特都没变，\
      也是为什么出来的文件几乎跟进去的一样大。"""

[[privacy]]
title = "上传才是最慢的那一步，而这一步在这里不会发生。"
body = """\

      每一个在线旋转工具都要先把整个文件拿到手：一个 GB 沿着你的网络传上去，为的是\
      换一个转过的 GB 传回来，上传花的时间通常比它换来的活儿还长，这还没算谁留着那份\
      文件的问题。它们多半还会重新编码一遍，为一件只需要九个数字的事丢掉一代画质。\
      这一页用从这个地址发来的代码读文件，在内存里写出新文件，所以唯一在动的字节，\
      是从你的硬盘到内存再回去。这一页的 <code>Content-Security-Policy</code> 列出了\
      它可以联系的每一个地址，没有一个属于本站，而且断了网它照样能用。"""

[[privacy]]
title = "谁认这个文件头，少数不认的怎么办。"
body = """\

      每一部手机、每一个浏览器、每一个现代播放器和剪辑软件都会应用显示矩阵；\
      从 2010 年起手机拍的视频就是这么被正着显示的。少数老的桌面播放器不理它，\
      直接把存着的帧横着放出来。为了它们，也为了那些你没法亲自检查的去处，页面\
      提供把旋转烧进画面：每一帧转好画到画布上，再重新编码成 H.264。这会丢一代\
      画质，也要花一次编码的时间，所以它是第二选择，页面也把它当第二选择来写。"""

[[privacy]]
title = "结果会重新打开核对一遍。"
body = """\

      一个写错了矩阵、或者矩阵对了尺寸错了的旋转工具，做出来的文件仍然打得开。\
      所以做好的文件会在这里重新打开，用的就是读你拿来那个文件的同一个读取器，\
      它必须跟原来一样长、按你要的方向显示、尺寸也对得上、并且带着说好的声音。\
      它在下载按钮下面从内存里播放，你保存之前就能看到它是正的。"""

[[privacy]]
title = "它读哪些文件，写出什么。"
body = """\

      MP4、MOV 和 M4V，里面是什么画面都行（H.264、HEVC、VP9 或 AV1），因为写进\
      文件头的旋转不在乎帧是什么；WebM 和 MKV，里面是 H.264 就原样复制帧，不是的\
      就烧进画面，因为 MP4 的文件头只能围着 H.264 搭起来。AAC 声音原样复制；\
      Opus、Vorbis、MP3 或 FLAC 重新编码成 AAC；浏览器解不开的声音会点名去掉。\
      结果永远是 MP4，因为那是什么都能播的那一种容器。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
 广告和\
      统计脚本来自 Google。它们都拿不到任何关于你视频的东西：没有文件、没有\
      一帧画面、没有文件名、大小、时长，也不知道你往哪边转的。每一行读取、\
      旋转或写出视频的代码都从这个源发出，并列在代码仓库里。"""

[[privacy]]
title = "打赏按钮加载了什么，又没拿到什么。"
body = """\

      顶部的「Buy me a coffee」按钮由 cdnjs.buymeacoffee.com 的一个脚本画出来，\
      字体来自 Google Fonts。它只是一个链接，不多不少：它不上报访问，也拿不到\
      任何关于你或你视频的东西。除非你点它，否则什么都不会发生，点了以后去的\
      是别人的网站。"""

[[privacy]]
title = "断网也能用。"
body = """\
 断开网络，这一页上的所有东西照常工作。这是最简单的证明：\
      一个把你的视频发出去旋转的工具会停下来。"""

[[howto]]
title = "选那段视频。"
body = """\
 一次一个：MP4、MOV、M4V、WebM 或 MKV。浏览器直接从你的硬盘读它，\
      页面会说它是什么，以及它现在是朝哪边显示的。"""

[[howto]]
title = "选方向，看预览。"
body = """\
 往右转四分之一圈、往左转四分之一圈，或者倒过来。\
      第一帧会按你选的方向、用文件将要写进去的同一套算法画出来，所以你看到的就是\
      播放器会做的。只有播放器把片段放横了的时候才勾「烧进画面」；宁愿这段视频\
      没有声音的话，勾上去掉声音。"""

[[howto]]
title = "旋转，然后读那句写着「已核对」的话。"
body = """\

      文件头写好，每一帧复制过去，只要几秒；烧进画面要花一次编码的时间，进度条\
      会说到哪了。然后做好的文件会在这里重新打开，它必须跟原来一样长、按你要的\
      方向显示、并且带着它的声音。它在下载按钮下面从内存里播放，你能看到它是\
      正的。"""

[[faq]]
q = "旋转会损失画质吗？"
a = """
        按普通的方式转，不会。旋转写进文件头，每一帧一个字节不差地复制过去，所以\
        画面跟原来一模一样，文件也几乎跟原来一样大。只有「烧进画面」会重新编码，\
        页面在你勾之前就会说。一个默认重新编码的旋转工具（大多数在线的都是）是在\
        为一件只需要九个数字的事做一次重新编码。"""

[[faq]]
q = "为什么在某个播放器里文件还是横的？"
a = """
        因为那个播放器不理显示矩阵。每一部手机、每一个浏览器、每一个现代播放器和\
        剪辑软件都认它；少数老的桌面播放器不认，直接把存着的帧放出来。勾上「把旋转\
        烧进画面」，帧本身会被转过来并重新编码成 H.264，那样每个播放器放出来都一样，\
        代价是丢一代画质。"""

[[faq]]
q = "往右转四分之一圈是哪边？"
a = """
        顺时针，就是你把手机往右转的时候画面顶部移动的方向。预览会把第一帧按你选的\
        方向画出来，所以挑那个让它看起来是正的按钮，然后按大的那个。"""

[[faq]]
q = "它读哪些文件？"
a = """
        MP4、MOV 和 M4V，里面是什么画面都行，因为写进文件头的旋转不在乎帧是什么。\
        WebM 和 MKV，里面是 H.264 就原样复制帧，其余的烧进画面，因为 MP4 的文件头\
        只能围着 H.264 搭起来。AAC 声音原样复制；Opus、Vorbis、MP3 和 FLAC 重新编码\
        成 AAC；浏览器解不开的声音会点名去掉。结果永远是 MP4。"""

[[faq]]
q = "要多久？"
a = """
        普通的旋转只要几秒：文件读一遍拿布局，写的时候再读一遍，一个 GB 走的是\
        你硬盘的速度。烧进画面要花你的机器编码这段视频所需的时间，有硬件编码器的话\
        （大多数笔记本和近年的每一部手机都有）比视频本身还短；没有的话更慢。"""

[[faq]]
q = "我的视频会被上传到哪里吗？"
a = """
        不会。文件由你自己的浏览器在你自己的硬件上读取、换文件头、重新写出，\
        这一页的 <code>Content-Security-Policy</code> 列出了它可以联系的每一个\
        地址，没有一个属于本站。最简单的自证办法是断开网络照样用。对这么大的文件\
        来说，这也是最快的办法：上传比整件活儿还慢。"""

[[faq]]
q = "手机上能用吗？"
a = """
        能。普通的旋转什么都不解码，所以手机跟笔记本一样快；做好的文件会一直放在\
        内存里直到你保存它，这是唯一的限制，几百兆的结果一部手机吃得下。烧进画面是\
        一次编码，手机自带的硬件编码器做得很快。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        文件是分块从硬盘读的，所以进来的文件比内存还大也没问题；做好的文件会一直\
        放在内存里直到你下载，而且这里写出的 MP4 不能超过 4 GB。它是免费的，\
        不注册、不登录，也没有试用期。本站带广告，那是养活它的东西；广告拿不到\
        任何关于你视频的内容。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没被上传的\
        最简单的办法：一个把你的视频发出去旋转的工具，你一拔网线它就停了。"""

