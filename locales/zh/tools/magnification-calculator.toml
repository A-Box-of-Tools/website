[[howto]]
title = "选好仪器，输入上面印的数字。"
body = "天文望远镜上标着口径和焦距，每只目镜标着自己的焦距。双筒望远镜标着两个数字，比如 8×42。显微镜物镜标着倍率和数值孔径，比如 40×/0.65。放大镜标的是倍率、焦距或屈光度。"
[[howto]]
title = "拖动滑块，穿过各个区段。"
body = "滑块改变的是放大倍率。在天文望远镜和显微镜上，它换的是目镜；在双筒望远镜和放大镜上，它改的是印着的倍率。轨道的颜色来自这台仪器自身的极限。留意结论的变化，看它从最清晰进入有效高倍，再进入空放大。"
[[howto]]
title = "比较三张图。"
body = "第一张是你往里看的整个圆，目标按真实比例画在里面。第二张是它中央的特写，清晰程度和一双好眼睛看到的一样。第三张是不用仪器时的同一处特写，所以后两张的差别就是放大倍率。"
[[howto]]
title = "看看每个数字的含义，再核对假设。"
body = "视场、出瞳、最小细节和集光力，都算好了放在结果旁边。改一改瞳孔的宽度、目镜的视场，或者放大镜倍率的算法，看看每条规则从哪儿来。"

[[faq]]
q = "双筒望远镜上的 8×42 是什么意思？"
a = "第一个数字是放大倍率。东西看起来有八倍宽，就像你走近到八分之一的距离。第二个数字是每个物镜的口径，42 毫米。第二个数除以第一个数就是出瞳，这里是 5.25 毫米，也就是到达眼睛的那束光的宽度。8×42 在黄昏时依然明亮，8×21 却不行，原因就在这里。"
[[faq]]
q = "天文望远镜的放大倍率怎么算？"
a = "用望远镜的焦距除以目镜的焦距。焦距 700 毫米的望远镜配 10 毫米目镜是 70 倍，再加一只 2 倍巴洛镜就翻一番。望远镜本身没有一个固定的放大倍率，所以包装盒上印的那个倍率，说的是它最短的那只目镜，不是你会看到的视野。"
[[faq]]
q = "天文望远镜的最高有效倍率是多少？"
a = "大约是口径毫米数的两倍，也就是每英寸口径 50 倍。70 毫米的望远镜是 140 倍，200 毫米的是 400 倍。细节由物镜或主镜的宽度决定，到了这个倍率，所有细节都已经能轻松看清。再往上，画面只会更大、更糊、更暗，这就叫空放大。不管望远镜多大，大气在多数夜晚还会再加一道上限，大约 300 倍。"
[[faq]]
q = "标着 675× 的望远镜比 100× 的好吗？"
a = "光凭这个数字，说明不了。一台标称 675× 的 60 毫米望远镜，真正的细节只到大约 120 倍，再往上只是把同样的模糊放得更大、更暗。该比的是口径。物镜或主镜越宽，在任何倍率下都能看到更细的细节、更暗的天体。"
[[faq]]
q = "多少倍能看到土星环和木星的卫星？"
a = "比多数人以为的低。木星的四颗大卫星，在 7 到 10 倍的普通双筒望远镜里就是几个光点。土星环从大约 25 到 30 倍起就能看出来，是一个小小的椭圆。口径 60 毫米以上的望远镜用到 100 倍以上，就能看清光环和行星本体是分开的。两个都可以在上面试试。行星在视野里一直很小，它们看起来真的就是这样。"
[[faq]]
q = "显微镜在 40 倍、100 倍、400 倍和 1000 倍下能看到什么？"
a = "40 倍时视野宽约 4.5 毫米，能看盐的晶体、昆虫的各个部位和布料的纹理。100 倍时宽 1.8 毫米，能看洋葱表皮这样的植物细胞，头发粗得像一根缆绳。400 倍时宽 0.45 毫米，能看到单个细胞和细胞核，红细胞是一个个小圆盘。用油浸物镜到 1000 倍时宽 0.18 毫米，细菌是分明的杆状和点状。这些宽度按常见的 10 倍目镜、视场数 18 毫米来算。"
[[faq]]
q = "为什么 1000 倍有时看不到任何新东西？"
a = "因为显微镜的细节由物镜的数值孔径决定，也就是斜杠后面的那个数，和总倍率无关。有效范围大约是这个数的 500 到 1000 倍，所以 40×/0.65 的物镜是 325 到 650 倍。给它配 25 倍目镜凑到 1000 倍，只是把模糊放大。100×/1.25 的油浸物镜同样是 1000 倍，能分开的细节却只有一半大小。"
[[faq]]
q = "什么是出瞳？"
a = "离开目镜、进入眼睛的那束光的宽度，等于口径除以放大倍率。你的瞳孔在暗处约 7 毫米，白天是 2 到 3 毫米。出瞳比它宽，多出来的光就进不了眼睛。出瞳小于约 1 毫米，视野开始变柔、变暗。不到半毫米，就进入空放大了。"
[[faq]]
q = "放大镜的倍率和屈光度、焦距是什么关系？"
a = "焦距的毫米数是 1000 除以屈光度，放大倍率是 250 毫米除以焦距，所以 10 倍的珠宝放大镜焦距 25 毫米，屈光度是 40。标着屈光度的带灯放大镜和阅读放大镜，通常假定眼睛对焦在近处，再加上 1。+3 屈光度标成 1.75×，+20 屈光度的镜片标成 6×，不加 1 的厂家则标 5×。倍率越高的镜片越小，也要离得越近。10 倍的珠宝放大镜，离物体大约 25 毫米。"
[[faq]]
q = "相机的 10 倍变焦和 10 倍的双筒望远镜是一回事吗？"
a = "不是。相机的变焦倍数是最长焦距和最短焦距之比，所以 24&ndash;240 毫米的镜头不管拍出来什么样，都是 10 倍变焦。和眼睛相比，把全画幅相机上的 50 毫米当作正常视角，这只镜头的范围是从大约一半大小到大约 5 倍。双筒望远镜和天文望远镜的放大倍率，是直接和眼睛比出来的。"
[[faq]]
q = "USB 显微镜的 1000× 是同一个意思吗？"
a = "那是另一种算法。数码显微镜的倍数，是屏幕上图像的大小除以物体的大小，所以显示器越大它越大，和细节无关。它能分开多细的东西，仍然由镜头决定。视场是更好的参考。不管包装盒上怎么写，一台能看到约 2 毫米宽范围的仪器，大致相当于 100 倍光学显微镜的水平。"
[[faq]]
q = "这些图是照片吗？"
a = "不是。它们是页面根据这些数字画出来的图。大小按真实比例，柔化是仪器在这个比例下自身的模糊，变暗的程度跟着出瞳走。月海和最大的环形山、木星的卫星、土星环和昴星团最亮的几颗星，位置都取自公开发表的数据。较小的环形山、细胞和羽毛只是示意。真实的视野还取决于大气、光学质量和你自己的眼睛。"
[[faq]]
q = "这个工具能离线使用吗？"
a = "能。页面加载后，所有计算和绘图都不需要联网。你输入的内容不会上传，也不会保存。"

