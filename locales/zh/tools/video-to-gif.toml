features = [
  "把 MP4、MOV、M4V 和 WebM 视频转成动图 GIF",
  "H.264、HEVC、AV1 和 VP9 片源，通过 WebCodecs 解码",
  "在时间轴上标出那一段，也可以直接输入精确时间",
  "宽度任意，每秒 5 到 25 帧，可选有序抖动",
  "断网可用，不上传，不注册，无水印",
]

