[[faq]]
q = "我的视频会传到什么地方去吗？"
a = """
        不会。读取、取帧、转换，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器那一半，页面的 <code>Content-Security-Policy</code> 把它\
        可能联的地址全列了出来，没有一个是本站的。与其听我们说，不如拔掉网线，\
        照做一张试试。"""

[[faq]]
q = "能转哪些格式？"
a = """
        MP4、M4V 和 MOV 直接读，里面装的是 H.264、HEVC、AV1 还是 VP9 都行，只要\
        你的浏览器解得了那个编码。其他浏览器能播的格式，最典型的是 WebM，改成\
        把播放器逐个时间点跳过去取帧，慢一些，落在哪一帧上也没那么精确。浏览器\
        既读不了也播不了的文件，实际上就是 AVI、WMV、FLV 和大多数 MKV，会被直接\
        拒收并说明原因，不会干到一半才崩。"""

[[faq]]
q = "我的 GIF 怎么这么大？"
a = """
        因为 GIF 是 1987 年的格式，它存的是一张张完整的图，不是运动。一段五秒的\
        片子，做成 GIF 不可能跟它自己那个五秒的 MP4 一样小，视频转出来的 GIF
        通常是原视频的十倍。真正决定大小的是三个设置，按要紧程度排：这一段多长、\
        画面多宽、每秒几帧。宽度砍一半，像素就少四分之三，而花钱的正是像素。"""

[[faq]]
q = "为什么只有 256 种颜色？"
a = """
        格式就是这么定的：一张 GIF 带一张最多 256 色的颜色表，每个像素存的是\
        表里的编号。这个工具的做法是把你选中那一段里每一帧的颜色都数一遍，再\
        分成 256 组，用的是中位切分法，业界标准做法，所以配色板是贴着你这段片子\
        长出来的，不是一套固定颜色。缺了某个颜色的地方，抖动会把最接近的两种混\
        在一起，让渐变还是渐变，而不是一道道色带。"""

[[faq]]
q = "抖动那个设置是干什么的？"
a = """
        拿一点噪点，换掉一大片色带。开着的时候，一片本来会变成四道平色的天空还是\
        渐变，代价是有点细微的纹理，文件也大一点。关掉则画面更平、文件更小，适合\
        屏幕录像、线稿，以及本来就由大片纯色构成的东西。这里用的是有序抖动，不是\
        误差扩散那种，所以没变化的背景在帧之间稳稳当当，不会满屏爬。"""

[[faq]]
q = "长度和体积有限制吗？"
a = """
        受限的是你标的那一段，而且卡住它的是内存，不是什么规矩：选好配色板之前，\
        这一段的每一帧都得同时留在手上。所以页面会先算出你这套设置要花多少内存，\
        提前告诉你，超了就直接拒绝，而不是让标签页耗尽内存凭空消失。段落短一点、\
        宽度小一点、帧率低一点，都能把这个数降下来。"""

[[faq]]
q = "声音能保住吗？"
a = """
        GIF 装不了声音。这个格式压根没有带音频的版本，这也正是后来网上大多改用\
        无声循环视频的主要原因。声音要紧的话，那就别转，留着视频，\
        <a href="../trim-video/">视频剪切</a>能从里面剪出一段，而且一帧都不\
        重编。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费就是\
        这么来的，广告拿不到关于你视频的任何信息。"""

