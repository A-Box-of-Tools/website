[[howto]]
title = "标出那一段。"
body = """\
      播放片子，它该开始的地方按 <kbd>I</kbd>，该结束的地方按 <kbd>O</kbd>，\
      或者拖动条上的两个手柄。GIF 本来就是几秒钟的东西，这个设置决定了文件\
      是小还是大得吓人，分量远超另外两个。"""

[[howto]]
title = "选好宽度和帧率。"
body = """\
      宽 480 像素、每秒 12 帧，够应付大多数用 GIF 的场合。宽度减半，像素就只\
      剩四分之一；每秒十二帧看着就是动的，又不用为谁也看不见的那些帧掏钱。"""

[[howto]]
title = "生成，然后下载。"
body = """\
      帧被读出来，整段动画选定一份 256 色的调色板，每一帧只写出画面里变化了\
      的那一块。做完之后它会在页面上播放，而那和下载给你的是同一个文件。"""

[[faq]]
q = "我的视频会被传到什么地方去吗？"
a = """
        不会。读取、取样、转换，都由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器端，而页面的 <code>Content-Security-Policy</code> 把它\
        可能联系的地址全列了出来，其中没有一个属于本站。与其听我们说，不如\
        拔掉网线，照样做一张 GIF 试试。"""

[[faq]]
q = "我能转哪些视频格式？"
a = """
        MP4、M4V 和 MOV 是直接读的，里面装什么都行，H.264、HEVC、AV1 或者
        VP9，只要你的浏览器解得了那个编码。其他你的浏览器能播的格式，最典型\
        的是 WebM，改成把播放器逐个跳到每一个时刻来读，这样更慢，哪一帧落在\
        哪儿也稍微不那么精确。浏览器既读不了也播不了的文件，实际上就是 AVI、
        WMV、FLV 和大部分 MKV，会当场拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "我的 GIF 为什么这么大？"
a = """
        因为 GIF 是 1987 年的格式，它存的是一整张一整张的画面，不是运动。一段\
        五秒的片子，没办法做出一张和它来源的那个五秒 MP4 一样小的 GIF，视频\
        转成的 GIF 通常是视频体积的十倍。真正决定它的三个设置，按分量排是\
        这一段有多长、画面有多宽、每秒多少帧。宽度减半，像素就只剩四分之一，\
        而花钱的正是像素。"""

[[faq]]
q = "为什么只有 256 色？"
a = """
        格式就是这么定的，一张 GIF 带着一张至多 256 色的表，每个像素存的是\
        指向这张表的一个编号。这个工具挑这 256 色的办法，是把你那一段里每一帧\
        的颜色都数一遍、再分成 256 组，也就是标准的中位切分法，所以调色板是\
        贴着你的片子来的，不是一套固定的颜色。缺某个颜色的地方，抖动会把最\
        接近的两个混在一起，让渐变还是渐变，而不是变成一道道条带。"""

[[faq]]
q = "抖动那个设置是干什么的？"
a = """
        它拿一点点噪点，换掉一大片色带。开着的时候，一片本来会变成四条平色带\
        的天空还是渐变，代价是一层淡淡的纹理和更大的文件。关掉的时候画面更\
        平整、文件更小，适合屏幕录像、线稿，以及任何本来就由平色块构成的\
        东西。这里用的是有序抖动，不是误差扩散那一类，所以没有变化的背景在\
        各帧之间纹丝不动，不会一直闪。"""

[[faq]]
q = "长度或者大小有上限吗？"
a = """
        受限的是那一段，而且限它的是内存，不是某条规定。挑调色板时，那一段的\
        每一帧都要同时留在手上，所以页面会算出你这套设置要花多少，并赶在你\
        开始之前说出来。它会拒绝，而不是让标签页耗尽内存然后消失。段短一点、\
        宽度小一点、帧率低一点，都能把它压下来。"""

[[faq]]
q = "它会保留声音吗？"
a = """
        GIF 装不了声音。这个格式没有任何一个带音频的版本，这也是网上后来大多\
        用无声循环视频取代 GIF 的主要原因。声音要紧的话，那就留着视频，\
        <a href="../trim-video/">视频剪辑</a>能从里面切出一段，而且一帧都不\
        重新编码。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费\
        就是从那儿来的，广告拿不到任何关于你视频的信息。"""

