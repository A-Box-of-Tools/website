  "按精确像素、按长边或者按百分比改尺寸",
  "只填一边，另一边跟着图片自己的比例走",
  "装进框内、铺满并裁掉、补白到精确画幅，或者拉伸",
  "每张图片一个可拖动的裁剪框，可锁定为 1:1、4:5、9:16、16:9、4:3 或 3:2",
  "可以每张图片裁得不一样，也可以一键把同一种取景铺到整批上",
  "每张做好的图片都能按原尺寸打开，背后的每一个数字都在，旁边还有原图可以对照",
  "在 JPEG、PNG 和 WebP 之间转换，带质量控制和背景色",
  "你不主动要求，它绝不把图片放大",
  "没被要求改动的文件，原样还给你",
  "支持批量，所有结果打成一个 zip",
  "断网可用，不上传，不注册",
]

[picker]
title = "把图片拖到这里"
hint = "或者点击选择，JPEG、PNG、WebP 以及你浏览器打得开的其他格式都行"
