[words]
plural = "图片"
choose = "图片"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "没有水印"

[[facts]]
text = "断网能用"

[[facts]]
text = "开源"

[[privacy]]
title = "你的图片没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      整个 <code>src/</code> 里，一个 <code>fetch</code>、一个\
      <code>XMLHttpRequest</code>、一个 <code>sendBeacon</code> 都找不到。\
      缩放就是往画布上做一次 <code>drawImage</code>，再来一次\
      <code>canvas.toBlob</code>，缩放器和编码器都是你浏览器里早就装好的。"""

[[privacy]]
title = "没人要求改的文件，一个字节都不改。"
body = """\
      没裁、没缩、也没换格式，那你选的那个文件会被逐字节原样还给你，不会重新\
      存一遍。这不只是客气：正因如此，这个工具不可能悄悄替你重编一张图，也\
      不可能把你只想看一眼的那张图的元数据悄悄丢掉。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      图片的信息，一条都没给它们。读文件、裁切、缩放、写文件的每一行代码都\
      从本站发出，也都摆在仓库里。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，这个工具跟原来一模一样，因为它本来就没有联网这一步。这是最\
      省事的一条证明。"""

[[howto]]
title = "选好你的图片。"
body = """\
      拖到下面的方框里，或者点开自己挑。浏览器直接从你的硬盘上读，这期间没有\
      东西发出去。"""

[[howto]]
title = "想裁就裁。"
body = """\
      裁剪框一开始罩着整张图，所以你不动它就等于没裁。拖动它，或者锁定一个\
      形状，头像用 1:1，快拍用 9:16，视频封面用 16:9，再按“拉到最大”取这个\
      形状下能放进去的最大一块。每张图各有各的框，点列表里任意一行，就改在\
      那张上画。要是全都想按同一种取景，也有一个按钮一次搞定。"""

[[howto]]
title = "说清楚出来要多大。"
body = """\
      给宽，给高，或者两个都给；给一个长边，这样竖构图和横构图出来一样大；\
      或者干脆给个百分比。两个框里留空一个，图片就保持自己原来的比例。"""

[[howto]]
title = "挑好格式，然后按按钮。"
body = """\
      可以各自保持进来时的格式，也可以一律写成 JPEG、PNG 或 WebP。每个结果都\
      写明它变成了什么、小了多少，点开就是全尺寸大图，背后那些数字全在，旁边\
      还摆着原图供你对照。整批下载会打成一个 zip。"""

[[faq]]
q = "我的图片会传到什么地方去吗？"
a = """
        不会。解码、裁切、缩放、写出，全由你自己的浏览器在你自己的硬件上完成，\
        用的是浏览器自带的 JPEG、PNG 和 WebP 编码器。这个工具没有任何联网功能，\
        不取东西，也不发东西。页面的 <code>Content-Security-Policy</code> 把它\
        可能联的地址全列了出来，没有一个是本站的。"""

[[faq]]
q = "只给宽、不给高会怎么样？"
a = """
        高按图片自己的比例算出来，这几乎总是你要的：说“宽 1920”，意思就是\
        “宽 1920，高该多少是多少”。两个都填上，它们就可能跟图片本身的比例\
        对不上，也只有这时候才会冒出“比例对不上怎么办”那个选择：整张放进框里、\
        铺满并裁掉溢出、用背景色垫成这个框、或者直接拉伸认了变形。"""

[[faq]]
q = "缩小会掉画质吗？"
a = """
        缩小不会，至少你看不出来：进去的像素比出来的多，留下的细节都是真的。\
        放大则补不出当初没拍到的东西，结果是同一张图的一份更糊的副本，不会\
        更清楚，所以“绝不把图片放大”默认开着。真正要花点代价的是之后那次重新\
        编码，格式是 JPEG 或 WebP 时才有，而质量滑块就是你在那儿花钱的地方。"""

[[faq]]
q = "能给每张图裁得不一样吗？"
a = """
        能，而且默认就是这样。列表上每张图都带着自己的框，按自己的像素算，点\
        某一行，那张图就连着它自己的框和锁定的形状一起回到预览里。你动其中一张，\
        不会影响别的。每个框一开始都罩着整张图，所以你从没画过的那张，压根没\
        被裁。"""

[[faq]]
q = "能一次给整批图裁成一样的吗？"
a = """
        能，用预览下面那个按钮。它会给其余每张图同样的相对区域，也就是各自宽高\
        的同样比例。一批本来尺寸就一致的截图或者导出图，那就是完全相同的一个框，\
        页面也会这么写。要是锁了形状，它会在那块区域里给每张图取这个形状下最大\
        的一个框，所以先按 1:1 再按这个按钮，横竖混杂的一个文件夹就能全出方图。\
        之后每个框还是照样能改。"""

[[faq]]
q = "它能读、能写哪些格式？"
a = """
        你的浏览器能解码的它都能读，实际上就是 JPEG、PNG、WebP、GIF、BMP，\
        现在多数浏览器还包括 AVIF。写出来的是 JPEG、PNG 和 WebP，因为浏览器\
        自带的编码器就这三种。选“保持原格式”时，JPEG 还是 JPEG，PNG 还是 PNG；\
        浏览器写不了的格式，比如 GIF 和 BMP，会出成 PNG，因为它既保得住透明，\
        也保得住大片纯色。"""

[[faq]]
q = "存成 JPEG 的话，透明会怎么样？"
a = """
        会被背景色填掉，因为 JPEG 没有 alpha 通道可以装它。颜色由你挑，默认\
        白色，这是多数人想要的，也是几乎所有别的工具会一声不吭直接替你做的。\
        垫成固定尺寸时用的也是这个颜色。存成 PNG 或者 WebP，透明就原样过来。"""

[[faq]]
q = "它会去掉 EXIF 和 GPS 信息吗？"
a = """
        真正被处理过的图会，属于顺带的效果：裁切或者缩放都得把画面解码成像素、\
        再把像素编回去，而一张画布上只有像素，不带任何标签，所以位置、相机型号\
        和时间戳干脆就没写进新文件。你完全没动过的文件是另一回事，它逐字节原样\
        还给你，标签一个不少。想清掉元数据、画面别动，那该用\
        <a href="../exif-editor/">EXIF 查看与清除</a>，它只重写容器，不重新\
        压缩任何东西。"""

[[faq]]
q = "这个跟图片压缩有什么区别？"
a = """
        这个管的是尺寸：你说要多少像素，它就给你多少像素。\
        <a href="../compress-image/">图片压缩</a>管的是文件大小：你说只准多少
        KB，它去找刚好塞得进去的最高画质，只有画质单独够不到才动尺寸。人家跟你\
        说“宽 1200 像素”，你就来对了地方；人家说“不能超过 500 KB”，那边更\
        对路。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小同样\
        没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上干的。\
        本站带广告，经费就是这么来的，广告拿不到关于你图片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图片送出去缩放的工具，拔线那一刻就停了。"""

[schema]
description = "在浏览器里给 JPEG、PNG 和 WebP 改尺寸、裁切、转格式。可以按精确像素、百分比或者长边定尺寸，可以拖裁剪框或者锁定比例，结果写成 JPEG、PNG 或 WebP。支持批量，什么都不上传。"
features = [
  "按精确像素、按长边或者按百分比改尺寸",
  "只填一边，另一边跟着图片本身的比例走",
  "放进框里、铺满并裁掉、垫成固定尺寸，或者直接拉伸",
  "每张图一个可拖动的裁剪框，可锁定 1:1、4:5、9:16、16:9、4:3 或 3:2",
  "可以每张裁得不一样，也可以一键把同一种取景套到整批上",
  "每张成品都能全尺寸打开，背后的数字全在，旁边还有原图对照",
  "JPEG、PNG 和 WebP 互转，带质量控制和背景色",
  "你不要求，绝不把图片放大",
  "没要求改的文件，原样还给你",
  "支持批量，结果打成一个 zip",
  "断网能用，不上传，不注册",
]

[picker]
title = "把图片拖到这儿"
hint = "或者点击选择，JPEG、PNG、WebP，以及你浏览器打得开的其他格式"
