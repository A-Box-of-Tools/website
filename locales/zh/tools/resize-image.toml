      <code>src/codecs.js</code> 里是那一次 <code>drawImage</code> 调用，裁切\
      和缩放是在同一步里做完的。"""

howto_heading = "不上传怎么改图片尺寸"

card = """
            精确到像素、按百分比，或者定个长边，顺路还能裁一刀、换个格式。\
