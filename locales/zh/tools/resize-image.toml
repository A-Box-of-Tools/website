[words]
plural = "图片"
choose = "图片"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "无水印"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[privacy]]
title = "你的图片无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      <code>src/</code> 里找不到 <code>fetch</code>，找不到\
      <code>XMLHttpRequest</code>，也找不到 <code>sendBeacon</code>。缩放就是\
      往 canvas 上做一次 <code>drawImage</code>，再做一次\
      <code>canvas.toBlob</code>，用的是你浏览器里本来就装着的缩放器和\
      编码器。"""

[[privacy]]
title = "没人要求改的文件，就不会被改。"
body = """\
      不裁、不改尺寸、也不换格式时，你选的那个文件会逐字节原样还给你，而不是\
      重新保存一遍。这不只是客气，正因如此，这个工具没法悄悄把一张图片重新\
      编码，也没法悄悄丢掉一张你只是想看看的图片的元数据。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      图片的信息，一条也没有交给它们。读取、裁剪、缩放、写出文件的每一行\
      代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个工具跟原来一模一样，因为它里面从来就没有联网这一步。\
      这是最省事的一条证明。"""

[[howto]]
title = "选好你的图片。"
body = """\
      拖到下面的方框里，或者点开自己挑。浏览器直接从你的硬盘上读，整个过程\
      没有东西被送去别处。"""

[[howto]]
title = "想裁就裁。"
body = """\
      框一开始罩着整张图片，不动它就什么都不裁。拖它，或者把它锁成某个形状，\
      头像用 1:1，快拍用 9:16，缩略图用 16:9，再按“最大”得到该形状下塞得进去\
      的最大的那个。每张图片各有自己的框，点列表里任意一行，就改在那一张上\
      画。要是它们都该按同一种方式取景，也有一个按钮能一次搞定。"""

[[howto]]
title = "说明出来应该多大。"
body = """\
      一个宽度、一个高度，或者两个都给；一个长边，这样竖拍和横拍的照片彼此\
      一样大；再不然干脆一个百分比。两个框留空一个，图片就保持它自己的比例。"""

[[howto]]
title = "挑好格式，然后按按钮。"
body = """\
      保持每个文件原来的样子，或者全部写成 JPEG、PNG 或 WebP。每个结果都会\
      说明它变成了什么、小了多少，点一下能按原尺寸打开，背后的每一个数字都在，\
      旁边还有原图可以对照。一整批会打成一个 zip 下来。"""

[[faq]]
q = "我的图片会被传到什么地方去吗？"
a = """
        不会。解码、裁剪、缩放、写出，都由你自己的浏览器在你自己的硬件上完成，\
        用的是浏览器本来就带的 JPEG、PNG 和 WebP 编码器。这个工具没有任何\
        形式的网络功能，从不取什么，也从不发什么，而页面的\
        <code>Content-Security-Policy</code> 把它可能联系的地址全列了出来，\
        其中没有一个属于本站。"""

[[faq]]
q = "如果我只给宽度不给高度会怎样？"
a = """
        高度会跟着图片自己的比例来，这几乎总是大家想要的，“宽 1920”的意思就是\
        “宽 1920，高多少算多少”。两个都填上，它们就可能和图片的比例对不上，\
        也只有那时才会冒出“比例对不上怎么办”这个选项，装进框以内、铺满并把\
        溢出的切掉、用背景色补白，或者拉伸并接受变形。"""

[[faq]]
q = "改尺寸会损失质量吗？"
a = """
        把图片改小不会，至少不会以你看得出来的方式，进去的像素比出来的多，\
        留下的细节是真细节。把图片放大，补不出当初没拍下来的东西，结果是同一\
        张图更软的一份副本，不是更锐的，所以“绝不把图片放得比原来更大”默认\
        开着。真正要花点代价的是之后的重新编码，格式是 JPEG 或 WebP 的话，\
        而质量滑块就是你在那儿花的钱。"""

[[faq]]
q = "我能给每张图片裁得不一样吗？"
a = """
        能，而且这是默认行为。列表上每张图片都带着自己的框，用的是它自己的\
        像素，点一行就把那张图片连同它自己的框和它自己锁定的形状一起放回预览。\
        你对其中一张做的任何事都不影响另一张。每个框也都是从整张图片开始的，\
        所以一张你从没画过的图片，压根没被裁过。"""

[[faq]]
q = "它能一次把一整批按同样的方式裁掉吗？"
a = """
        能，用预览下面那个按钮。它会给其他每一张图片同样的相对区域，也就是各自\
        宽高的同样比例，对一组尺寸相同的截图或者导出图来说，那就是完全相同的\
        框，页面也会这么说。锁定了形状时，它改成给每一张在那块区域里塞得下的、\
        该形状的最大的框，所以先按 1:1 再按那个按钮，就能从一个竖图横图混着的\
        文件夹里得到一堆方图。之后每个框仍然可以改。"""

[[faq]]
q = "它能读和写哪些格式？"
a = """
        你浏览器解得开的它都能读，实际上就是 JPEG、PNG、WebP、GIF、BMP，在\
        大多数新版浏览器上还有 AVIF。能写的是 JPEG、PNG 和 WebP，因为浏览器\
        带的就是这几个编码器。选“保持原格式”时，JPEG 还是 JPEG，PNG 还是 PNG；\
        浏览器写不了的格式，比如 GIF 或者 BMP，会输出成 PNG，因为它是那个能\
        完整保住透明和纯色块的。"""

[[faq]]
q = "存成 JPEG 的时候，透明怎么办？"
a = """
        它会被背景色填上，因为 JPEG 没有存放它的 alpha 通道。颜色由你挑，默认\
        白色，那是大多数人想要的，也是几乎每个别的工具一声不吭就替你做了的事。\
        补白的边框后面用的也是同一个颜色。改存成 PNG 或者 WebP，透明就原封\
        不动过去了。"""

[[faq]]
q = "它会删掉 EXIF 和 GPS 数据吗？"
a = """
        凡是它真的处理过的，会，而且属于副作用。裁剪或者改尺寸就是把图片解码\
        成像素、再把这些像素编码一遍，而一张装满像素的画布不带任何标签，所以\
        位置、相机型号和时间戳根本没被写进新文件。一个你完全没改动的文件是\
        另一回事，它是逐字节还给你的，标签一个不少。想去掉元数据又不动画面，\
        用 <a href="../exif-editor/">EXIF 查看与清除</a>，它只重写容器，什么都\
        不重新压缩。"""

[[faq]]
q = "这个和图片压缩有什么区别？"
a = """
        这一个管的是尺寸，你说要多少像素，它就给你多少。<a href="../compress-image/">图片压缩</a>\
        管的是文件大小，你说允许多少 KB，它去搜索塞得进去的最高质量，只有在\
        光靠质量够不到时才改尺寸。别人告诉你“宽 1200 像素”，你来对地方了；\
        别人告诉你“不超过 500 KB”，那一个能让你更接近。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小\
        同样没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上\
        干的。本站带广告，经费就是从那儿来的，广告拿不到任何关于你图片的\
        信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的图片送出去改尺寸，拔线那一刻就停了。"""

