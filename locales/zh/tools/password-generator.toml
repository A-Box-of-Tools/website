[[faq]]
q = "密码会被发到什么地方，或者被保存下来吗？"
a = """
        都不会。它们在你的浏览器里、你自己的机器上生成，而这个工具根本没有任何联网\
        功能，从不去取什么，也从不发送什么。它也不往存储里写任何东西：没有
        localStorage，没有 Cookie，没有历史记录。刷新页面，它给你看过的密码就从\
        屏幕上、也从它自己的内存里消失了。页面的 <code>Content-Security-Policy</code> 写着它允许连接的每一个地址，没有一个是\
        我们的，所以就算有什么想送出去，也没有地方收。"""

[[faq]]
q = "随机数是从哪儿来的？"
a = """
        来自 <code>crypto.getRandomValues</code>，浏览器为密码学用途提供的随机数，\
        由你自己操作系统的熵池播种并不断重新播种。浏览器取 TLS 密钥材料用的也是同一个\
        来源。这个工具里任何地方都没有用 <code>Math.random</code>，这个区分不是抠\
        字眼：<code>Math.random</code> 是一个很快的算术随机数，它的整个内部状态能从\
        连续几个输出里还原出来，建立在它上面的密码生成器产生的密码只是看起来随机，\
        任何见过其中一个的人都能把其余的全部列举出来。"""

[[faq]]
q = "浏览器里生成的密码，和装在电脑上的程序生成的一样好吗？"
a = """
        就随机数而言是一样的，两边都是操作系统的同一个来源，只是走的门不同。不同的是\
        屋子里还有谁。浏览器标签页是和你的扩展一起运行的，一个有权限读页面的扩展也能\
        读这一页。这对任何网页上的生成器都成立，包括这一个，也正是“手边有密码管理器\
        时就用它自带的生成器”这条建议的诚实理由：算术是一样的，只是那个进程旁边站的\
        人少。这个页面是给你手边没有它的时候用的。"""

[[faq]]
q = "密码还是密码短语，到底该用哪个？"
a = """
        凡是密码管理器替你敲的，都用密码，因为你根本不会去看它，而长度在那里是白送\
        的。那几件必须你自己从脑子里敲出来、或者念给别人听的，用密码短语：管理器的\
        主密码、磁盘加密的密钥、一台你远程配置的设备。长词表里六个词是 77 比特，比\
        十二个字符的随机密码还强，而且凌晨四点也能一次输对，这一点差得不是一星\
        半点。"""

[[faq]]
q = "密码该有多长？"
a = """
        全字符集下 20 个字符大约是 130 比特，早就过了还需要担心长度的那个点。16 个也\
        很够。12 个是任何你不想丢的东西的下限，而且是下限，不是目标。再短，你就是在赌\
        那个网站把它妥善存了起来，而过去二十年的泄露通知劝你别赌。长度胜过这个页面上\
        任何别的设置：多一个字符，比任何关于必须包含哪些字符的规则都管用。"""

[[faq]]
q = "密码短语该用几个词？"
a = """
        长词表里六个词，如果它守着别的密码就七个。那张著名的四个词的图是 2011 年画\
        的，值 51 比特，今天已经在一次认真的离线攻击的射程之内。五个词是 64，六个词是
        77，超过了攻击者会为一个普通账号花的代价。长词表里每多一个词就多 12.9 比特，\
        而且只有词在往上加，连字符和大写字母都不加。"""

[[faq]]
q = "什么是“比特”，这个页面为什么要数它？"
a = """
        一个比特就是翻一倍。60 比特的意思是，这个页面本来可能产生的、概率相同的结果\
        有 2^60 种，所以就算有人完全清楚它是怎么工作的，也还是有这么多要试。这是\
        <em>过程</em>的性质，不是这串字符的性质：页面能把它说准，是因为选的人就是它，\
        它知道自己选了多少次。这就是它和注册表单上那根彩色条的区别，那根条只是读了\
        字符然后猜。在那根条上，<code>correct horse battery staple</code> 评分很差，\
        实际值 44 比特；<code>P@ssw0rd!</code> 评分很好，实际几乎一文不值。"""

[[faq]]
q = "为什么“必须包含一个符号”反而让密码变弱？"
a = """
        因为规则只能拿走可能性。要求每一类至少出现一个字符，就把所有恰好没抽到的密码\
        全排除掉了，而可能的密码这个集合越小，要搜的范围也越小。影响不大，常见长度下\
        大约半个比特，但它是真实存在的，而这个页面把它减掉了，没有去报那个对自己更\
        好看的数。而且是精确算出来的：数的是这条规则真正允许的密码，而不是它排除掉\
        的。"""

[[faq]]
q = "这是哪个词表，攻击者能下载到它要紧吗？"
a = """
        是电子前哨基金会（EFF）的 diceware 词表，原样打包进来：长的 7776 个词，短的
        1296 个。它们本来就是为这件事做的：没有冒犯性的词，没有同音词，没有连起来会\
        变成第三个词的组合，短表里也没有哪个词是另一个词的开头。至于词表是公开的，不\
        要紧：这里给出的强度本来就假定攻击者手里有这份表，正在读这个页面的源码，还\
        知道你用的每一项设置。他唯一不知道的，是每一次抽中的是 7776 个里的哪一个。正是\
        这个假定，让这个数字值得信。"""

[[faq]]
q = "密码短语不就是等着被字典攻击吗？"
a = """
        按这种方式选词就不是。字典攻击对付的是<em>人</em>想出来的短语，因为人挑的词\
        彼此搭调、顺序讲得通，而且来自自己每天用的那几千个词。这个页面是从一份固定的\
        词表里，一个词一个词独立地、均匀地抽，完全不管结果读起来顺不顺，所以它通常\
        读起来并不顺。一个知道词表也知道词数的攻击者，面前仍然是 7776 的词数次方。"""

[[faq]]
q = "离开页面之后还能把密码找回来吗？"
a = """
        找不回来，而且是故意的。任何地方都没记下来，所以没有什么可找的：没有历史面板，\
        没有“最近生成”列表，也没有缓存。一个能把上周二的密码翻给你看的生成器，就是一个\
        把它存下来了的生成器，而存在你够得着的地方，也就是存在别的东西够得着的地方。\
        离开之前先复制到密码管理器里。"""

[[faq]]
q = "复制到剪贴板安全吗？"
a = """
        这是常见的那一类风险，知道它比担心它有用。剪贴板和所有以你身份运行的程序共享，\
        通常会留到你下一次复制，有些配置下还会在设备之间同步。所以该粘的地方立刻粘，\
        粘完再随便复制点别的，这是好习惯；但这不构成改用手敲一个更弱密码的理由。这个\
        页面读不到你的剪贴板，它只能往里写，而且只在你按下按钮的时候写。"""

[[faq]]
q = "同一个能在多个地方用吗？"
a = """
        不能，而这是这个页面上唯一一条压过其他所有建议的建议。几乎每一个被盗的账号，\
        用的都是先在别处对过的密码：某个网站被攻破，名单被公开，同样的邮箱配同样的\
        密码被拿到各处去试。一个网站一个密码，能把一次泄露变成一个账号而不是全部，\
        这才是值得用密码管理器的理由，而不是它里面某一个密码有多强。"""

[[faq]]
q = "免费吗？要注册账号吗？"
a = """
        免费，没有账号，不用登录，没有试用期，生成多少个都不限。网站靠广告养着，而广告\
        拿不到关于这个页面生成的东西的任何信息，长度和强度都拿不到。"""

[[faq]]
q = "离线能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样生成密码。随机数来自你自己的设备，词表\
        本来就在页面里。这也是证明它既没在取什么、也没在发什么的最简单办法：一个要向\
        服务器要数字的生成器，在你拔线的那一刻就会停下来。"""

