[[privacy]]
title = "密码就在你读这行字的地方生成。"
body = """\
 它在这个页面里，由这个\
      页面，从你自己的操作系统交给浏览器的随机数中抽出来。生成它不需要去取任何\
      东西，生成完也不会上报任何东西。<code>Content-Security-Policy</code> 里写着\
      这个页面允许连接的每一个地址，没有一个是我们的。这里没有一个可以收集生成出来\
      的密码的落点，就算有，代码里也没有把它送过去的那一行。"""

[[privacy]]
title = "这里没有任何东西会去取东西。"
body = """\
 <code>src/</code> 里没有 <code>fetch</code>，没有 <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。词表不是下载来的，它就是 <code>src/wordlist.js</code>，跟页面其他部分一起从这个源下发，你可以打开来\
      看。"""

[[privacy]]
title = "随机数是浏览器的，而且是对的那一种。"
body = """\
 <code>crypto.getRandomValues</code> 是浏览器为密钥和令牌提供的随机数，由操作系统播种，并且不断重新播种。<code>Math.random</code> 在这个文件夹里一次都没有出现过，出现了才是真正的\
      缺陷：它的内部状态能从几个输出里还原出来，谁看过它产生的一个密码，就能算出\
      它以后会产生的每一个。"""

[[privacy]]
title = "什么都不保存，所以没有历史记录要清。"
body = """\
 没有 localStorage，没有
      sessionStorage，没有 Cookie，没有 URL 参数，也没有浏览器会主动提出记住的 <code>&lt;input&gt;</code>。屏幕上的东西只活在这个页面内存里的一个数组中，\
      关掉标签页就是全部的清理。这里生成的东西，只有你带走的那些副本。"""

[[privacy]]
title = "谷歌加载了什么，又拿不到什么。"
body = """\
 广告和统计脚本来自谷歌，捐赠\
