description = "从照片、截图或摄像头读取二维码，在打开之前就看清这个链接到底通向哪里。EAN、UPC、Code 128、Code 39 和 ITF 条形码也能读。什么都不上传。"
og_title = "读一个二维码，不把图片发给任何人"
og_description = "从图片或摄像头扫二维码，在决定打不打开之前先看完整的地址。图片不离开你的机器，摄像头的画面一帧也不留。"
og_image_alt = "二维码与条形码识读 - 从图片或摄像头读码，什么都不上传"

pledge = """
    读一个码是对像素做算术，而像素本来就在这里。找到符号、把拍摄角度校正回来、\
    把掩码解掉、用里德-所罗门把损坏的地方补上、再把比特读回来，这些全都发生在\
    这一页里两千来行你能读的 JavaScript 中。<strong>摄像头是同一个承诺，\
    不是它的例外：</strong>一帧画面以像素的形式进到这个标签页，被看一眼，\
    然后就没了。什么都不录，什么都不留，而且这一页压根就没有任何能把东西\
    送出去的网络功能。"""

live_hint = """
      你不用信我们这张嘴。打开开发者工具，盯着"网络"面板，开着摄像头去扫一个码。\
      没有哪一条请求带走过一帧画面，也没有带走过码里的一个字。或者干脆断网，\
      照样把码读出来。"""

read_first = """
，其中 <code>src/binarize.js</code> 和 \
      <code>src/detect.js</code> 负责在照片里找到符号，也就是阈值、定位图形和\
      透视变换；<code>src/qr-decode.js</code> 负责把它读回来；\
      <code>src/reed-solomon.js</code> 负责修补读错的地方；\
      <code>src/linear.js</code> 负责那些带条纹的；而 <code>src/camera.js</code> \
      就是这一页里所有碰到摄像头的行。"""

howto_heading = "怎样不上传图片就读出二维码"

card = """
            从照片、截图或摄像头读二维码，并在打开之前看到完整地址。\
            条形码也行。"""

[picker]
title = "把带码的图片拖到这里"
hint = "或者点一下去挑一张｜照片、截图、PNG，凡是你的浏览器打得开的都行"

[words]
plural = "图片和图片里的码"
choose = "要读的那张图"

[[facts]]
text = "不上传"

[[facts]]
text = "不用账号"

[[facts]]
text = "不做记录"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[privacy]]
title = "图片永远不会被上传，摄像头也不例外。"
body = """
\
      你丢进来的照片会在这一页的画布上解码，然后就在那里被读。摄像头的一帧\
      是同一件事，只是每秒发生三十次：画到那块画布上，被看一眼，再被下一帧盖掉。\
      没有哪一帧被录下来，也没有哪一帧留下来；你按下停止时摄像头的灯灭掉，\
      整件事就到此为止。"""

[[privacy]]
title = "这里没有任何东西去取任何东西。"
body = """
\
      <code>src/</code> 里没有 <code>fetch</code>，没有 \
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>；而这一页的 \
      <code>Content-Security-Policy</code> 连一个这个源可以发送的地址都没留下，\
      就算真有那样的代码也发不出去。这也正是这一页没法告诉你一个短链接最后通向\
      哪里的原因：要弄清楚就得去问，而它不问。"""

[[privacy]]
title = "它把地址给你看。它从不替你打开。"
body = """
\
      印出来的二维码是一个谁也读不出来的地址，而这正是在它上面贴一张贴纸对某些人\
      划得来的原因。这里什么都不打开。整串字符原样印出来给你看，你真正会落到的\
      主机被单独拎出来放一行，那些让一个地址看起来像另一个地址的花招也在它们出现\
      的地方被点名：<code>@</code> 前面的用户名、用形状和我们的字母一模一样的\
      另一套文字写的名字、还有转跳。"""

[[privacy]]
title = "它连采到的样子也一并给你看。"
body = """
\
      每个二维码结果下面都有一张图，是这一页真正从你照片里读到的那些模块。\
      如果它看起来就是你扫的那个码，上面的答案就站得住；如果它看起来像雪花点，\
      那就站不住。一个只把一串字符丢给你就完事的识读器，没法这样查。"""

[[privacy]]
title = "谷歌加载了什么，又拿不到什么。"
body = """
\
      广告和统计脚本来自谷歌，捐助按钮来自 Buy Me a Coffee。它们谁也拿不到一张\
      图片、一帧画面，或者从里面读出来的任何东西。把像素变成字符的每一行代码都\
      由这个源自己提供，也都在仓库里摆着。"""

[[privacy]]
title = "它断网也能用。"
body = """
\
      把网断掉，这个工具一点不变，摄像头也一样，因为它里面本来就没有过一步走网络。\
      这是所有证明里最简单的一个。"""

[[howto]]
title = "把图给它。"
body = """
\
      把照片或截图拖到那个框上，或者直接粘贴一张，或者按摄像头那个按钮。一次\
      好几张也行，每张各读各的，各有各的答案。已经在你屏幕上的码，截个图是最快\
      也最靠谱的路子，因为那里既没有镜头，也没有角度，更没有光。"""

[[howto]]
title = "让整个符号连同留白一起进画面。"
body = """
\
      码周围那圈白是码的一部分：识读器就是靠它知道符号到哪儿为止的。裁到方块边缘\
      的照片，是一个码读不出来的最常见原因，没有之一。让码占到画面一半左右差不多\
      正好；再靠近，四个角就跑到画面外面去了。"""

[[howto]]
title = "在决定任何事情之前，先把地址读一遍。"
body = """
\
      去扫海报、停车缴费机或者信件上的码，图的就是弄清楚它通向哪里；而这恰恰是\
      手机摄像头真正不让你做的那一件事。这里主机单独占一行。要不是你预想中的\
      那个名字，你要的东西其实已经到手了，也就没什么好打开的了。"""

[[howto]]
title = "把提示当回事，尤其是那些不响的。"
body = """
\
      光秃秃的 <code>http://</code> 地址、用看起来不是那套文字的字母写的名字、\
      短链接服务，或者地址里 <code>@</code> 前面的任何东西——每一样都会在它出现\
      的地方被点名。它们单拿出来谁也证明不了什么，但在你过去之前，每一样都值\
      十秒钟。"""

[[howto]]
title = "读不出来，先改光，别先改别的。"
body = """
\
      几乎所有失败都是阈值的问题：横在中间的反光、压在一角的阴影，或者以某个\
      恰好把背光收进来的角度拍下的屏幕。挪个位置让反光别落在码上，或者把摄像头的\
      灯打开。还不行就正对着拍一张平的照片，把那张丢进来——一张静止的图会得到\
      比实时画面细致得多的搜索。"""

[[howto]]
title = "答案看着不对劲，就看看采样出来的那张图。"
body = """
\
      把"这一个是怎么读出来的"展开，看那个小格子。它是这一页认为这个码长什么样，\
      从采到的模块重新画回去的结果。一个把符号读错、又修补成了某种像模像样东西的\
      识读器，只会在那里露出马脚，别处都不会。"""

[[faq]]
q = "图片会被上传到什么地方去吗？"
a = """
        不会，从图里读出来的东西也不会。图片在这一页的画布上解码，然后就在那里被\
        读，用的是这个站点提供的 JavaScript。这个工具压根没有任何网络功能——它从不\
        去取东西，也从不发东西——而这一页的 <code>Content-Security-Policy</code> \
        把它可以联系的地址一个不落地写了出来，其中没有一个是我们的。最简单的证明\
        就是断网：它照样能用。"""

[[faq]]
q = "摄像头会录下什么吗？"
a = """
        不会。摄像头的一帧以像素的形式进到这个标签页，画到画布上，被看一眼，\
        大约十分之一秒后就被下一帧盖掉。没有东西写到硬盘上，也没有东西留下来。\
        你一按停止，流就断了；标签页退到后台时会断，你离开这一页时也会断。而值得\
        信的指示是你摄像头上的那盏灯，因为没有哪一个网页能把它关掉。"""

[[faq]]
q = "为什么它只把链接给我看，不直接打开？"
a = """
        因为有用的正是这一步。二维码是一个你读不出来的地址，贴在停车缴费机码上的\
        那张贴纸之所以管用，靠的就是这一点：等你知道它去了哪儿，你已经在那儿了。\
        这里整串字符原样印出来，主机被拎出来单独占一行，打开是另一个按钮，读完\
        之后你自己按。这是多一次点击，而这一次点击正是这个格式一直都缺的。"""

[[faq]]
q = "它能读什么？"
a = """
        二维码从版本 1 到 40 全都能读，四个纠错等级都能读，数字、字母数字、字节和\
        汉字模式都能读，ECI 字符集和属于一组连拼符号的码会被报出来，而不是悄悄扔掉。\
        条纹那一边：EAN-13、EAN-8、UPC-A、UPC-E、ITF-14、交叉二五码、Code 128 和 \
        Code 39。Data Matrix、PDF417、Aztec 和 MaxiCode 它不读。"""

[[faq]]
q = "我的码读不出来，是哪里不对？"
a = """
        十次里有九次是三件事里的一件。白色留白被裁掉了，而识读器要靠它知道符号到\
        哪儿为止。码有一块被反光或阴影盖住了，于是没有哪个阈值能把深色方块和浅色\
        方块分开。或者码在画面里太小，模块只有一两个像素宽。换个光，让码占到画面\
        一半左右，正对着拍而不是斜着拍。"""

[[faq]]
q = "破损的或被挡住一部分的码，它能读吗？"
a = """
        多半能，而这是这个格式按设计在工作，不是我们这边有什么本事。每个二维码都\
        带着里德-所罗门校验数据，用 H 等级做出来的符号丢掉大约 30% 的模块，仍然能\
        被原样重建。这一页会在"这一个是怎么读出来的"里说明它修了多少个码字，你能\
        看出当时有多悬。它不做的事情是猜：损坏程度超过校验能扛住的符号，会被报成\
        读不出来，而不是给你一个错答案。"""

[[faq]]
q = "为什么它说不出一个 bit.ly 链接通向哪里？"
a = """
        因为要弄清楚就得去问 bit.ly，而那是一次网络请求。这一页别的所有说法都\
        立在"这里没有任何代码会去联系任何东西"上面，为这件事偷偷开个口子，比这个\
        答案本身亏得多。所以短链接服务的名字会被点出来，它藏起来的东西则老老实实\
        地留作未知。你真想解开，就把它粘到一个愿意去问的地方。"""

[[faq]]
q = "扫二维码这件事本身安全吗？"
a = """
        扫是安全的。照着它做才是风险，而且是真实的风险：贴在真码上面的假码，在\
        停车缴费机上、在餐馆桌上、在快递取件单上，已经常见到有了专门的名字。它们\
        之所以管用，是因为没人能靠看把一个码读出来。读它但不打开它——也就是这一页\
        在做的事——把那点便宜整个拿掉了，而看一眼主机所花的十秒钟就是全部的防守。"""

[[faq]]
q = "每个结果下面那个小格子是什么？"
a = """
        是这一页真正从你的图里采到的那些模块，按一个模块一格重新画出来的。它放在\
        那里，是为了让读出来的结果可以用眼睛核对，而不是只能相信：要是那个格子看\
        起来就是你拍的那个码，上面的答案就来自正确的像素。几乎没有识读器给你看\
        这个，而这正是"能查的工具"和"只能信的工具"之间的差别。"""

[[faq]]
q = "一张图里有好几个码，它都能读吗？"
a = """
        眼下一张图一个。一次拖进来好几张，每张各读各的；开着摄像头慢慢移，它会一个\
        接一个地读，把每个还没见过的新码留下来。一张照片里拍下一整页码，那是该去\
        裁图，或者把摄像头一个一个对过去的场合。"""

[[faq]]
q = "为什么它给我的条形码起了个跟我要的不一样的名字？"
a = """
        因为条形码不带着自己的名字走。UPC-A 就是首位为零的 EAN-13，ITF-14 就是\
        十四位、校验位对得上的交叉二五码，而 Code 128 在数字模式下不像别的任何东西。\
        这一页报的是那些条纹说了什么，加上校验位确认了什么——符号自己知道的也就\
        这么多。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断网，它照样能用，摄像头也一样。这同时也是证明\
        什么都没被上传的最简单办法：一个要把你的图送出去解码的识读器，在你拔线的\
        那一刻就停了。"""

[schema]
description = "在浏览器里完成，从图片、截图或实时摄像头读取二维码或一维条形码。显示解码出来的字符串；如果是链接，还会在打开任何东西之前给出真正会落到的主机。支持带里德-所罗门纠错的二维码版本 1 到 40，以及 EAN-13、EAN-8、UPC-A、UPC-E、ITF-14、交叉二五码、Code 128 和 Code 39。什么都不上传，摄像头画面一帧也不记录。"
features = [
  "从照片、截图、粘贴进来的图片或实时摄像头读取二维码",
  "版本 1 到 40 的全部二维码、四个纠错等级，以及数字、字母数字、字节和汉字模式",
  "里德-所罗门纠错，划花的、折过的、被挡住一部分的码照样读得出来",
  "用校正图形把角度和透视校正回来",
  "读得了深底浅印的码，也读得了倒过来拍的码",
  "EAN-13、EAN-8、UPC-A、UPC-E、ITF-14、交叉二五码、Code 128 和 Code 39",
  "在打开任何东西之前，把完整地址和真正会落到的主机给你看",
  "把伪装链接的花招点名：@ 前面的用户名、长得像的另一套文字、转跳",
  "把 Wi-Fi、名片、邮件、短信、电话和地图内容拆成看得懂的字段",
  "把采到的模块画出来，让读出来的结果可以核对而不是只能相信",
  "摄像头画面不记录也不保存，流随标签页一起停",
  "断网可用；不上传，不要账号",
]
