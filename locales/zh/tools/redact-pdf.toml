      要是你拿掉的某个词还搜得到，你拿不到下载，只会拿到一句说明这件事的话。"""

[[faq]]
q = "这跟在 PDF 阅读器里画个黑块有什么不一样？"
a = """
        在阅读器里画的方块是一个批注，一个带位置的对象，存在页面旁边。它下面的文字\
        分毫未动。谁把那块区域选中按复制、谁把文件在别的程序里打开、谁拿任何一个文本\
        提取器过一遍，都能把词拿回去。有些阅读器提供的「redact」命令确实会真的执行删除，\
        也有好几款只提供画方块。这个工具没有什么方块可以挪开：字是从页面的绘制指令里\
        切掉的，而那个黑块，如果你留着它，是事后画在一处早就空了的位置上。"""

[[faq]]
q = "我怎么知道那些词真的没了？"
a = """
        因为这个工具会在你的机器上查一遍，并且把数量给你看。文件写完之后，它会被这一页上\
        同一个读取模块重新打开，每一页重新读，每一个书签、批注、表单域和属性都收集起来，\
        再把你拿掉的每一个词搜一遍。结果那一行会写清原来有多少、现在还剩多少。答案要是不对，\
        这一次就失败，什么都不给下载。你也可以事后自己查：在任何阅读器里按 Ctrl+F 搜那个词。"""

[[faq]]
q = "拿掉一个词，这一页别的地方会移位吗？"
a = """
        不会。文字是靠一支笔在页面上往前推着画出来的，所以删掉五个字符，照常理会把这一行\
        剩下的部分往左拽五个字符。被删部分的确切宽度会从字体自己的度量里量出来，再作为一条\
        字距指令放回去，那条指令只挪笔，不画任何东西。表格的列还是对齐的，合计还在它自己的\
        表头下面。"""

[[faq]]
q = "扫描出来的文档能涂黑吗？"
a = """
        图不能，而且它照实说，不装。扫描件是一页纸的照片，上面的词是像素，没有可拿走的文字。\
        不过扫描件常常还带着一层看不见的文字，是扫描仪的 OCR 写在图上面、为了让这一页可以\
        搜索的。这个工具会找到那一层，从里面拿掉你挑的内容，并在页面上告诉你图没有变。\
        于是搜索和复制再也找不到那个词，而看着这一页的人还是读得到。要处理图本身，\
        <a href=\"../redact-image/\">图片涂黑</a>会去覆盖像素。"""

[[faq]]
q = "文档里那些不在页面上的部分呢？"
a = """
        也一起处理，因为涂黑漏掉的通常正是那里。同样的词会从书签、批注和便签里拿走，\
        从表单域里填过的内容里拿走，从给屏幕阅读器的文字里拿走，也从阅读器用来\
        <em>代替</em>页面上那些字符去复制的替换文本里拿走。最后这一样存在的意义是让连字\
        和行末断开的词能正确复制，而它里面可以装下一整句话。文档属性和 XMP 包整个删除。\
        附件和文件打开时会运行的东西全部丢弃，因为这两样都没法拿你要删的词去搜。"""

[[faq]]
q = "我的文档会被上传吗？"
a = """
        不会。文件的读取、修改和写出全都由你自己的浏览器在你自己的硬件上完成。这个工具\
        根本没有服务器那一半，页面的 <code>Content-Security-Policy</code> 里写着它能\
        联系的每一个地址，没有一个属于本站。你在搜索框里打的字，是拿来跟这个标签页内存里\
        的文本比对的，它也不去任何地方。"""

[[faq]]
q = "为什么不能像别的工具那样在页面上拖一个框？"
a = """
        因为画出一页来意味着一个完整的 PDF 渲染器，字体、渐变、透明度、混合模式全都要，\
        那是一兆以上的引擎要去取来运行，而本站根本不发这种东西。这件事反倒正合适：\
        拖一个方块选中的是<em>纸上的一块区域</em>，而纸上的一块区域跟它下面的文字不是\
        同一样东西，黑块那个失误正是从这里开始的。你拿到的是文档的文字，按阅读顺序排好，\
        每个词都可以点。而且这也是唯一一种能告诉你「眼前这些词到底是不是文字」的视图，\
        一张页面的图片说不出这一点。"""

[[faq]]
q = "做好的文件到哪儿都打得开吗？"
a = """
        打得开。输出写成 PDF 1.5，或者你给的那份文件所需要的最高版本，而 1.5 是 2003 年\
        以后出的每一个阅读器都懂的。页面上的东西没有一样被重新编码：字体、图片和矢量图形\
        逐字节原样通过，所以留下的文字还跟原来一样可以选中、可以搜索。"""

[[faq]]
q = "它能打开带密码的 PDF 吗？"
a = """
        不能，而且这是故意的。加密的文档会被拒收，并附上一句说明，密码是空的时候也一样，\
        而很多扫描仪和复印机就是那样存的。去掉一个文件的保护，跟从里面拿走几个词是两件事，\
        一个悄悄替你做掉的工具，做的是你没要求过的事。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        工具里没有写死任何限制。限制是你自己的机器：处理期间文档放在内存里，所以笔记本\
        吃下几百兆不会有意见，再往上某处就开始吃力了。免费，没有账号，不用登录，也没有\
        试用期。本站靠广告养活，广告那边拿不到关于你文档的任何东西。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断网，它照样能用。这也是证明什么都没被上传的最简单办法。\
        要是有个工具把你的文档送出去让别人涂，拔掉网线的那一刻它就停了。"""

