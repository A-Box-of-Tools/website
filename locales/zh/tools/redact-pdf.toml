[[privacy]]
title = "黑块不是涂黑，而这里也不会在任何东西上面画一个。"
body = """

      几乎每一个说自己能涂黑一页的程序里，不管是 PDF 阅读器、文字处理软件还是设计\
      工具，那个黑块都是存在文字旁边的一个对象，而不是存进文字里。文字还在那里，\
      在同一个文件的同一个位置，把那块区域选中按复制就拿回来了。就是这个失误让法院\
      文书、情报报告，以及 2025 年 12 月美国司法部大批文件里被涂黑的姓名公之于众，\
      而那些姓名在几小时内就被读了出来。这个工具是把字从绘制页面的指令里删掉。\
      这里没有哪个黑块底下还压着什么，因为底下什么都没有。"""

[[privacy]]
title = "做好的文件在交给你之前，会在这里重新打开、重新搜一遍。"
body = """

      在那之前，上面这些话都只是这个工具在给自己判卷。所以那些马上就要变成你下载\
      内容的字节，会被当作陌生人寄来的一样重新交回同一个读取模块：每一页重新读一遍，\
      每一个书签、批注、表单域和文档属性都收集起来，然后去搜你拿掉的那些词。数量会写在\
      结果里。要是有东西活了下来，这一次就报告为失败，不给下载。"""

[[privacy]]
title = "词不会离开这个标签页，搜索也不会。"
body = """
 Content-Security-Policy 里写着\
      这一页能联系的每一个地址，没有一个属于本站。这个工具没往那份名单里加任何东西，\
      因为它没有自己的联网功能，连可选的都没有。你在搜索框里打的字，是拿来跟这个标签页\
      内存里的文本比对的一串字符，这两样都没有地方可去。"""

[[privacy]]
title = "涂黑是最经不起上传的那件事。"
body = """

      人们拿去涂黑的东西，正是它不该被上传的理由。证人证言、诊断书、要交给房东的银行\
      流水、带着一个客户名字却要发给另一个客户的合同。把这些交给陌生人的服务器去掉\
      私密部分，意味着私密部分先完完整整地到了那边，而留在他们那里的也正是那一版。\
      这一页没有另一半。"""

[[privacy]]
title = "留下的部分原样传过去。"
body = """

      一页上会变的字节，只有那些包含了被删字符的文字绘制指令。其他每一条指令，以及这一页\
      用到的每一个字体、图片和线条，都按进来时的样子精确复制。不重绘，不重新编码，也不\
      重排。删掉部分的宽度会量出来，再作为一条字距指令放回去，于是这一行的其余部分\
      还停在文档原本安排的位置上。"""

[[privacy]]
title = "它拿不掉照片里的词，而且会说清哪些页面是这种。"
body = """

      扫描出来的一页是一张图。上面的词是像素，不是文字，这里没有任何东西能碰到它们。\
      要是这份扫描件带着扫描仪 OCR 做的那层看不见的可搜索文字，这个工具会把那一层拿掉，\
      而搜索和复制原本找到的正是它。同时它会在页面上明说：图里的词还看得见。要盖住那张图\
      是另一件事，负责覆盖像素的是\
      <a href=\"../redact-image/\">图片涂黑</a>。"""

[[privacy]]
title = "文档不再交代自己从哪里来。"
body = """

      属性和 XMP 包每次都会被清掉：没有 producer 那一行，没有创建日期，没有作者，\
      没有标题，也没有排版软件留下的那些私有块。一份从页面上删掉了姓名、属性里却还写着\
      <code>张某_和解稿3.docx</code> 的文件，不是一份涂黑过的文件，而这件事不该交给\
      一个勾选框去管。"""

[[privacy]]
title = "加密的文件会被退回，而不是打开。"
body = """

      带密码的 PDF 会被拒收，包括扫描仪用空密码生成、技术上打得开的那一类。\
      去掉一份文档的保护，跟从里面拿走几个词是两件事，而悄悄替你做掉，对一个替你干活的\
      工具来说是件出人意料的事。"""

[[privacy]]
title = "谷歌加载了什么，又拿不到什么。"
body = """
 广告和统计脚本来自谷歌。这两个都拿不到\
      关于你文档的任何东西：文件拿不到，页面拿不到，姓名、大小、页数，以及你搜过的词，\
      都拿不到。读取、修改、写出 PDF 的每一行都由本站自己提供，也都写在仓库里。"""

[[privacy]]
title = "捐赠按钮加载了什么，又拿不到什么。"
body = """

      页面顶部那个「Buy me a coffee」按钮由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它就是个链接而已，不会报告访问，也拿不到关于你或者你文档的\
      任何东西。你不点它就什么都不会发生，点下去到的是别人的网站。"""

[[privacy]]
title = "断网也能用。"
body = """
 把网络断掉，这一页上的一切照样运转。这是最简单的\
      证明。要是有个工具把你的文档送出去让别人涂，它就停了。"""

[[howto]]
title = "选 PDF。"
body = """
 一次只处理一份文档，这是故意的。涂黑是一件必须\
      一页一页看过去的活，而一个让你在这份文件里勾词、又悄悄把它用到另一份上的工具，\
      正是错的东西被发出去的那条路。文件由浏览器直接从你的硬盘读取。"""

[[howto]]
title = "说清什么要走。"
body = """
 把词打进去，姓名、地址、案号都行，它们\
      出现的每一处都会连着所在的那一行、带一个勾选框列出来。框旁边那些检测项会去找\
      电子邮箱、卡号、IBAN、身份证号和社保号，以及电话号码。它们只是列给你看，绝不替你\
