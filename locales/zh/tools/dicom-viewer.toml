#
# DICOM Viewer - 简体中文。
#
# Overrides for tools/dicom-viewer/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# DICOM 的字段名保持英文，也保留后面的编号，比如 Pixel Spacing (0028,0030) 和
# Series Instance UID (0020,000E)。文件里就是这么写的，标准里也是这么写的，要查
# 一个字段的人搜的正是这几个词。transfer syntax 和 PS3.15 同理。
#
# 这一页是全站承诺最锋利的地方。这个文件不是带元数据的图片，是装着图片的病历。
# 所以「里面写了什么」这几句，和「它不会去任何地方」那几句一样，都是逐字斟酌过的。
#

