  "把额度用满，结果落在目标下方一点点，不会白白小一半",
  "用 SSIM 和 PSNR 把结果跟原图量一遍",
  "本来就没超标的文件原样放行，一个字节都不动",
  "JPEG、PNG 和 WebP，格式还能自动挑",
  "支持批量，结果打成一个 zip",
  "断网能用，不上传，不注册",
]

