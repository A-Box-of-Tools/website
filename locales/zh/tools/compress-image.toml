body = """\
      每个结果都会说明它被写成了什么格式、用了多少质量、尺寸有没有变，以及\
      量出来跟原图有多接近。“对比”会把两张图并排放在一起。"""

[[faq]]
q = "我的图片会被上传到什么地方吗？"
a = """
        不会。文件由你自己的浏览器、在你自己的硬件上解码、压缩和测量，用的是\
        浏览器本来就带的 JPEG、PNG 和 WebP 编码器。这个工具没有任何形式的\
        网络功能 &mdash; 它从不取任何东西，也从不发任何东西 &mdash; 而页面的\
        <code>Content-Security-Policy</code> 列出了它可能联系的每一个地址，\
        其中没有一个属于本站。"""

[[faq]]
q = "它是怎么正好压到某个大小的？"
a = """
        靠试。没有哪个公式能把一个质量设置换算成字节数 &mdash; 那完全取决于\
        这张图片 &mdash; 所以工具会把图片编码好几次，把答案搜出来。它从质量\
        范围的顶端开始，用对半折的方式逼近，大约八次编码就能找到塞得进去的\
        最高质量。你在页面上看到的每一个大小，都是一个真实编码出来的文件，\
        不是估算。"""

[[faq]]
q = "这里说的“损失最小”到底指什么？"
a = """
        三件具体的事。第一，已经小于你目标大小的图片会被逐字节原样放行，而不是\
        重新编码。第二，先花质量，再动分辨率，而且质量只降到压缩痕迹开始显现\
        的那条底线为止 &mdash; 过了那条线，工具会把图片改小、把质量重新调高，\
        因为少一些好像素比多一些烂像素好看。第三，一旦找到一个塞得进去的结果，\
        搜索会再往上顶，直到把预算用满 &mdash; 所以你要 500 KB，不会拿到一个\
        300 KB 的文件。"""

[[faq]]
q = "每个结果上的 SSIM 和 PSNR 是什么？"
a = """
        它们量的是这次压缩的代价：把结果解码出来，跟原图作比较。SSIM 比较的是\
        局部的亮度、对比度和结构，比“数一数有多少像素变了”更接近眼睛真正会\
        挑剔的东西；大约 0.98 以上，两张并排看已经很难分辨。PSNR 是传统的\
        分贝值。两者都在你的机器上算出来，也都显示出来，好让“损失很小”这句话\
        是可以核对的，而不只是一句断言。"""

[[faq]]
q = "它能读和写哪些格式？"
a = """
        凡是你浏览器能解码的它都能读，实际上就是 JPEG、PNG、WebP、GIF、BMP，\
        以及 &mdash; 在大多数当前的浏览器上 &mdash; AVIF。它能写 JPEG、PNG 和\
        WebP，因为浏览器带的就是这几个编码器。选“自动”时，它保持你文件原本的\
        格式，只有在保持原格式就意味着要缩小尺寸或者会有肉眼可见的质量下降时，\
        才换成 WebP。"""

[[faq]]
q = "为什么 PNG 压不了多少？"
a = """
        因为 PNG 是无损的：它没有质量旋钮可以拧。把一个 PNG 变小只能靠减少\
        像素或者减少颜色，所以选中 PNG 时，工具只能靠改尺寸来够到目标。如果\
        这张图是照片，JPEG 或 WebP 能在一个你看得出没问题的质量下，离你的目标\
        近得多 &mdash; 如果它是带透明的 logo 或截图，WebP 会保住那份透明，而\
        JPEG 会拿白色把它填掉。"""

[[faq]]
q = "压缩图片会不会顺带删掉 EXIF 和 GPS 数据？"
a = """
        会，作为副作用。压缩意味着把图片解码成像素、再把这些像素编码一遍，\
        而一张装满像素的画布不带任何标签，所以位置、相机型号、时间戳以及其他\
        一切，根本就没被写进新文件里。如果你想去掉元数据但不动画面，请改用\
        <a href="../exif-editor/">EXIF 查看与清除</a> &mdash; 它重写容器，\
        什么都不重新压缩。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。文件的数量和大小\
        也没有上限，因为没有一台服务器在为它们付钱 &mdash; 活是在你自己的机器\
        上干的。本站带广告，这就是它的经费来源；广告拿不到任何关于你图片的\
        信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的图片送出去压缩的工具，在你拔线的那一刻\
        就会停下来。"""

