[[privacy]]
title = "你的图片无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      <code>src/</code> 里找不到 <code>fetch</code>，找不到\
      <code>XMLHttpRequest</code>，也找不到 <code>sendBeacon</code>。压缩靠的\
      是 <code>canvas.toBlob</code>，也就是你浏览器里本来就装着的那个编码器。"""

[[privacy]]
title = "那些数字是当场量出来的，不是报上去的。"
body = """\
      大小、质量数值和 SSIM 对比全在这个页面上算出来，算完直接给你看。这个\
      仓库里没有哪个自定义统计事件会带上文件名、大小、数量或者结果。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      图片的信息，一条也没有交给它们。读取、压缩、测量文件的每一行代码都由\
