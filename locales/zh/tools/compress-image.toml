      跟原图有多接近。按“对比”，两张图并排放着看。"""

[[faq]]
q = "我的图片会传到什么地方去吗？"
a = """
        不会。解码、压缩、测量，全由你自己的浏览器在你自己的硬件上完成，用的是\
        浏览器自带的 JPEG、PNG 和 WebP 编码器。这个工具没有任何联网功能，不取\
        东西，也不发东西。页面的 <code>Content-Security-Policy</code> 把它可能\
        联的地址全列了出来，没有一个是本站的。"""

[[faq]]
q = "它怎么做到刚好压到那个大小？"
a = """
        试出来的。没有哪个公式能把一个画质档位换算成字节数，这完全取决于图片\
        本身。所以工具把图编码好几遍，一路找答案。它从画质上限往下折半逼近，\
        大约八次编码就能定位到那个塞得进去、画质又最高的档位。页面上每一个\
        大小都是真编出来的文件，不是估算。"""

[[faq]]
q = "所谓“损失最小”，具体指什么？"
a = """
        三件很具体的事。第一，本来就没超标的图原样放行，不重新编码。第二，先\
        花画质，后动分辨率，而且画质只降到压缩痕迹开始露出来那一档为止。再往\
        下，工具改成把图片做小、把画质提回去，因为像素少一点但个个干净，比\
        像素多一堆却全糊了好看。第三，一旦找到塞得进去的结果，搜索还会往回顶，\
        把剩下的额度用满。你要 500 KB，就不会拿回一个 300 KB 的文件。"""

[[faq]]
q = "每个结果上的 SSIM 和 PSNR 是什么？"
a = """
        是这次压缩的代价，做法是把结果解码回来跟原图逐一比对。SSIM 比的是局部\
        的明暗、对比和结构，比数一数多少像素变了更接近人眼在意的东西，大约在
        0.98 以上，两张图并排看已经很难分辨。PSNR 是传统的那个分贝值。两个数\
        都在你自己的机器上算，也都摆出来，好让“损失很小”这句话是能核对的，\
        而不只是嘴上说说。"""

[[faq]]
q = "它能读、能写哪些格式？"
a = """
        你的浏览器能解码的它都能读，实际上就是 JPEG、PNG、WebP、GIF、BMP，\
        现在多数浏览器还包括 AVIF。写出来的是 JPEG、PNG 和 WebP，因为浏览器\
        自带的编码器就这三种。选“自动”时，它保持文件原来的格式，只有在“保持\
        原格式就得缩尺寸、或者画质会明显掉下去”的时候才换成 WebP。"""

[[faq]]
q = "为什么 PNG 压不下去多少？"
a = """
        因为 PNG 是无损的，根本没有画质这个旋钮可拧。想让一个 PNG 变小，只能\
        减像素或者减颜色，所以选了 PNG，工具只能靠缩尺寸去够那个目标。图片\
        要是照片，换 JPEG 或 WebP 能离目标近得多，而且看上去完全没问题。要是 \
        logo 或者带透明的截图，WebP 能留住透明，换成 JPEG 那块地方会被填成\
        白色。"""

[[faq]]
q = "压缩会把 EXIF 和 GPS 信息一起去掉吗？"
a = """
        会，属于顺带的效果。压缩就是把图解码成像素、再把像素编回去，而一张\
        画布上只有像素，不带任何标签，所以位置、相机型号、时间戳这些干脆就\
        没写进新文件。你要是只想清掉元数据、画面别动，那该用 \
        <a href="../exif-editor/">EXIF 查看与清除</a>，它只改容器，不重新\
        压缩画面。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小\
        同样没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上\
        干的。本站带广告，经费就是这么来的，广告拿不到关于你图片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图片送出去压缩的工具，拔线那一刻就停了。"""

