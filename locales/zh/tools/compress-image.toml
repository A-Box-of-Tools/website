      这是最省事的一条证明。"""

[[howto]]
title = "选好你的图片。"
body = """\
      拖到下面的方框里，或者点开自己挑。浏览器直接从你的硬盘上读，整个过程\
      没有东西被送去别处。"""

[[howto]]
title = "填上人家要求的那个大小。"
body = """\
      那个死活不肯收你照片的上传表单要 100 KB，申请门户要 500 KB，讲究加载\
      速度的页面要 2 MB。最常见的四个已经做成按钮了。"""

[[howto]]
title = "按“压缩到目标大小”。"
body = """\
      工具会把每张图片编码好几次，一点点逼近还塞得进去的最高质量。已经小于\
      目标大小的，原样不动。"""

[[howto]]
title = "看看代价，再下载。"
body = """\
      每个结果都会说明写成了什么格式、用了多少质量、尺寸有没有变，以及量\
      出来跟原图有多接近。点“对比”能把两张图并排放着看。"""

[[faq]]
q = "我的图片会被传到什么地方去吗？"
a = """
        不会。解码、压缩、测量都由你自己的浏览器在你自己的硬件上完成，用的是\
        浏览器本来就带的 JPEG、PNG 和 WebP 编码器。这个工具没有任何形式的网络\
        功能，从不取什么，也从不发什么，而页面的\
        <code>Content-Security-Policy</code> 把它可能联系的地址全列了出来，\
        其中没有一个属于本站。"""

[[faq]]
q = "它是怎么正好压到某个大小的？"
a = """
        靠试。质量设置换算不出字节数，这完全取决于图片本身，所以工具会把图片\
        编码好几次，硬把答案搜出来。它从质量范围的顶端起步，一路对半折着逼近，\
        大约八次编码就能定下塞得进去的最高质量。页面上每一个大小，都是真编码\
        出来的文件，不是估的。"""

[[faq]]
q = "这里说的“损失最小”到底指什么？"
a = """
        三件具体的事。第一，已经小于目标大小的图片逐字节原样放行，不重新编码。\
        第二，先花质量，再动分辨率，而且质量只降到压缩痕迹开始显形的那条底线\
        为止，再往下就改成把图片缩小、把质量重新调高，因为少一些好像素比多\
        一些烂像素好看。第三，一旦找到塞得进去的结果，搜索还会往上顶，直到把\
        预算用满，所以你要 500 KB，不会拿到一个 300 KB 的文件。"""

[[faq]]
q = "每个结果上的 SSIM 和 PSNR 是什么？"
a = """
        它们量的是这次压缩的代价，办法是把结果解码出来跟原图比。SSIM 比的是\
        局部的亮度、对比度和结构，比数一数有多少像素变了更接近眼睛真正会挑剔\
        的东西，大约 0.98 以上，两张并排看已经很难分辨。PSNR 是传统的分贝值。\
        两个都在你的机器上算，也都摆出来给你看，好让“损失很小”这句话可以核对，\
        而不只是一句断言。"""

[[faq]]
q = "它能读和写哪些格式？"
a = """
        你浏览器解得开的它都能读，实际上就是 JPEG、PNG、WebP、GIF、BMP，在\
        大多数新版浏览器上还有 AVIF。能写的是 JPEG、PNG 和 WebP，因为浏览器\
        带的就是这几个编码器。选“自动”时它保持文件原本的格式，只有在保持原\
        格式就得缩小尺寸、或者会有肉眼可见的质量下降时，才换成 WebP。"""

[[faq]]
q = "为什么 PNG 压不下去多少？"
a = """
        因为 PNG 是无损的，没有质量旋钮可拧。把 PNG 变小只能减少像素或者减少\
        颜色，所以选中 PNG 时，工具只能靠改尺寸去够目标。要是这张图是照片，\
        JPEG 或 WebP 能在一个你看不出问题的质量下离目标近得多；要是带透明的\
        logo 或者截图，WebP 保得住那份透明，JPEG 会拿白色把它填掉。"""

[[faq]]
q = "压缩图片会不会顺带删掉 EXIF 和 GPS 数据？"
a = """
        会，属于副作用。压缩就是把图片解码成像素、再把这些像素编码一遍，而\
        一张装满像素的画布不带任何标签，所以位置、相机型号、时间戳这些东西\
        根本没被写进新文件。要是你想去掉元数据又不动画面，请改用\
        <a href="../exif-editor/">EXIF 查看与清除</a>，它只重写容器，什么都\
        不重新压缩。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小\
        同样没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上\
        干的。本站带广告，经费就是从那儿来的，广告拿不到任何关于你图片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的图片送出去压缩，拔线那一刻就停了。"""

[schema]
description = "把 JPEG、PNG 和 WebP 图片压到你指定的大小。工具会搜出塞得进目标的最高质量，只有在光靠质量够不到时才缩小尺寸，并把结果与原图作对比测量。全程在浏览器里运行，不上传。"
features = [
  "压到你自己选的目标文件大小，而不是一个要靠猜的质量数字",
  "能保住全分辨率就保住，只有在光靠质量够不到目标时才缩小尺寸",
  "把预算用满，结果落在刚好低于目标的位置，而不是远远低于",
  "用 SSIM 和 PSNR 把结果与原图作比较",
  "已经小于目标大小的文件完全不动",
  "JPEG、PNG 和 WebP，格式可以自动选",
  "支持批量，所有结果打成一个 zip",
  "断网可用，不上传，不注册",
]

[picker]
title = "把图片拖到这里"
hint = "或者点击选择，JPEG、PNG、WebP 以及你浏览器打得开的其他格式都行"
