read_first = """\
      ，<code>src/heif.js</code> 里是解码器怎么加载、允许干什么，\
      <code>src/boxes.js</code> 里是找出照片元数据的容器解析，\
      <code>src/exif.js</code> 里是这些元数据进 JPEG 时的遭遇。引擎本身是 \
      <code>vendor/libheif.js</code>，原样未改，许可证就放在旁边。"""

howto_heading = "HEIC 照片怎么转成 JPG"

card = """
            iPhone 拍的照片，换成什么都打得开的格式。解码在你自己的机器上，\
            不在谁的服务器上。"""

