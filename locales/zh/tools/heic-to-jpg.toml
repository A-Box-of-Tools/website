[[privacy]]
title = "你的照片无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。"""

[[privacy]]
title = "解码器从这里来，也哪儿都不去。"
body = """\
      HEIC 就是装在盒式容器里的 HEVC，除了 Safari 没有哪个浏览器解得了，所以\
      这个页面自带一份编译成 WebAssembly 的 <code>libheif</code>，大约
      1.4 MB，提交在这个仓库里，由这个源提供，并且和这里其他每个文件一样由
      service worker 缓存。它不从 CDN 取，那样会把一个第三方塞进每一次访问\
      的路径里，还会让这个工具没法离线使用。二进制放在脚本内部而不是旁边，\
      正是为了启动它时一次 fetch 都不用发。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      为这个工具写的任何一个文件里，都找不到 <code>fetch</code>、\
      <code>XMLHttpRequest</code> 或者 <code>sendBeacon</code>。随附的这份\
      引擎和每一个 Emscripten 构建一样，含有从某个 URL 取 <code>.wasm</code>\
      的加载路径，那些路径走不到，因为二进制本来就在手上；就算走到了，\
      <code>connect-src</code> 里只列了 Google 的统计端点，别的什么都没有，\
      浏览器会当场拒绝。拿得出手的证据是那条策略，不是那句承诺。"""

[[privacy]]
title = "元数据在这里读出来，也报告给你。"
body = """\
      页面上那份列表会说明每张照片带着什么，日期、相机，还有里面有没有 GPS
      坐标，因为把 JPEG 交给别人之前，这是你多半想知道的事。它由\
      <code>src/boxes.js</code> 在这个浏览器里从文件中读出，显示在这个页面\
      上，写进你的 JPEG 还是留下不要，完全由你决定。这个仓库里没有哪个\
      自定义统计事件会带上文件名、日期、坐标或者数量。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      照片的信息，一条也没有交给它们。读取、解码、写出文件的每一行代码都由\
      这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      把页面加载一次，然后断开网络，这个工具跟原来一模一样，解码器也一并\
      缓存下来了。这是最省事的一条证明，而且在这个页面上它比本站任何别处都\
      更有分量，一个把你的照片送出去解码的转换器，绝无可能做到这一点。"""

[[howto]]
title = "选好你的 HEIC 照片。"
body = """\
      拖到下面的方框里，或者点开自己挑，直接从手机备份或者桌面上的文件夹里\
      选都行。浏览器直接从你的硬盘上读，整个过程没有东西被送去别处。列表会\
      说明每一张是什么，里面有些什么。"""

[[howto]]
title = "看看这些照片都带着什么。"
body = """\
      每一行会写出拍摄日期、相机型号，还有这个文件里有没有 GPS 坐标，最后\
      这项用绿色标出来，因为它才是值得留神的那一条。这些是不解码画面、直接\
