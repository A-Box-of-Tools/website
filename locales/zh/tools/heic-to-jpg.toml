[[privacy]]
title = "你的照片没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集你文件的接口，代码里也没有任何一处\
      会去发送它们，哪怕真有这么个接口。"""

[[privacy]]
title = "解码器是从这里来的，而且哪儿也不去。"
body = """\
      HEIC 就是装在盒式容器里的 HEVC，除了 Safari 没有哪个浏览器解得了，\
      所以这个页面自带一份编译成 WebAssembly 的 <code>libheif</code>
      &mdash; 大约 1.4 MB，提交在这个仓库里，由这个源提供，并且像这里其他\
      每个文件一样被 service worker 缓存。它不是从 CDN 取的，因为那会把一个\
      第三方塞进每一次访问的路径里，还会让这个工具没法离线使用。二进制被\
      放在脚本内部而不是旁边，正是为了启动它时不需要任何一次 fetch。"""

[[privacy]]
title = "这里没有任何东西会去取什么。"
body = """\
      为这个工具写的任何一个文件里，都没有 <code>fetch</code>、\
      <code>XMLHttpRequest</code> 或 <code>sendBeacon</code>。这份随附的引擎\
      和每一个 Emscripten 构建一样，含有从某个 URL 取\
      <code>.wasm</code> 的加载路径；那些路径没有被走到，因为二进制本来就在\
      手上 &mdash; 而且就算走到了，<code>connect-src</code> 里只列了 Google
      的统计端点，别的什么都没有，浏览器会直接拒绝。证据是那条策略，不是\
      那句承诺。"""

[[privacy]]
title = "元数据在这里读出来，并报告给你。"
