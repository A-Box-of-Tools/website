[[howto]]
title = "选个格式，再定那些细节。"
body = """\
      没有特别理由就选 JPEG，它是到哪儿都打得开的格式，转换的意义本来就在\
      这儿。质量滑块停在 92，这一档上照片很难跟原图区分开。那个勾选框决定\
