      每一张照片都在你自己的机器上解码和写出。一个文件给你一个下载按钮；\
      多个文件还会额外给你一个 zip。"""

[[faq]]
q = "我的照片会被上传到什么地方吗？"
a = """
        不会。文件由你自己的浏览器、在你自己的硬件上读取、解码和写出。这个\
        工具没有任何形式的网络功能 &mdash; 它从不取任何东西，也从不发任何\
        东西 &mdash; 而页面的 <code>Content-Security-Policy</code> 列出了它\
        可能联系的每一个地址，其中没有一个属于本站。唯一确实会加载的东西是\
        解码器本身，它来自本站，只加载一次，而且发生在你的照片被牵扯进来\
        之前。"""

[[faq]]
q = "这个页面第一次为什么要下载 1.4 MB？"
a = """
        因为 HEIC 是浏览器唯一打不开的图片格式。它是装在盒式容器里的一帧
        HEVC，只有 Safari 在苹果硬件上有解码器；Chrome、Firefox 和 Edge
        干脆拒收这个文件。所以一个 HEIC 转换器总得从某处弄来一个解码器，\
        而地方只有两个：服务器，或者这个页面。别的转换器都选了服务器，这\
        正是它们全都要你上传照片的原因。这一个改成自带一份编译成
        WebAssembly 的 <code>libheif</code>。它由本站提供，第一次访问之后\
        就有缓存，而这就是“你的照片哪儿也不去”的全部代价。"""

[[faq]]
q = "转出来的 JPEG 会保留日期、相机和位置吗？"
a = """
        你要它保留就保留，页面上有一个勾选框。开着的时候，EXIF 块会从 HEIC
        里原样复制出来、按手机写的样子写进 JPEG，所以转换后的照片仍然按\
        拍摄那天排序，而不是按转换那天 &mdash; 这正是大家抱怨 HEIC 转换器\
        的地方。只有一个标签会被改，而且只有这一个：方向，它被设成“正立”，\
        因为旋转已经作用到像素上了，再应用一次的看图软件会把每一张竖构图的\
        照片放倒。把勾选框关掉，出来的 JPEG 就只有画面，别的什么都没有。"""

[[faq]]
q = "它会去掉 GPS 坐标吗？"
a = """
        它会告诉你坐标在那儿，然后照你说的做。在你转换任何东西之前，每张\
        照片那一行就会说明这个文件里有没有坐标 &mdash; 这一点比手机做得多。\
        取消勾选“保留日期、相机和参数”，坐标会和其他一切一起被排除在 JPEG
        之外；保持勾选，它们就跟着过去。如果你要的是逐条细看那些标签，或者\
        把已经是 JPEG 的照片里的标签清掉，<a href="../exif-editor/">EXIF
        查看与清除</a>才是干这个的工具，而且它不重新压缩画面。"""

[[faq]]
q = "画面会被重新压缩吗？"
a = """
        会，而且必须重新压缩：HEIC 和 JPEG 是两种不同的编码，从一个到另一个，\
        除了把画面解码再编码一遍别无他法。你能控制的是这一下的代价有多大。\
        质量滑块默认是 92，在这一档上照片非常难和原图区分开；如果你完全不想\
        有损失、又不介意文件大上五到十倍，菜单里还有 PNG。"""

[[faq]]
q = "文件名叫 .jpg 但其实是 HEIC，怎么办？"
a = """
        照样能用。拖进来的每一个文件都是按它开头那几个字节来判断的，不是按\
        名字 &mdash; 因为名字取决于最后碰过这个文件的那个应用怎么叫它，而\
        一个名叫“.jpg”的 HEIC，正是大家最后跑来找这类工具的常见原因之一。\
        真的是 JPEG 或 PNG 的文件会被拒绝并给出说明，而不是被转换成一份\
        自己的副本。"""

[[faq]]
q = "它能转 Live Photo 或者连拍吗？"
a = """
        里面的静态画面能转。一个 HEIC 可以装不止一张画面，它装了几张就转\
        几张，并按原文件名加编号命名。Live Photo 的视频那一半是手机放在
        HEIC 旁边的另一个文件，所以它不在这里，也就无从转起。深度图和缩略图\
        在容器里，但不是谁想要的画面，会被留着不动。"""

[[faq]]
q = "为什么它不肯收我的 AVIF？"
a = """
        因为没什么可做的。AVIF 和 HEIC 是同一种容器，只是里面装的是 AV1
        而不是 HEVC，而当前每一个浏览器都能原生解码 &mdash; 所以一个转换器\
        为此下发一兆的引擎，是在解决一个你并不存在的问题。如果你需要把 AVIF
        变成 JPEG，<a href="../compress-image/">图片压缩</a>和\
        <a href="../resize-image/">图片缩放</a>都能用你浏览器本来就有的解码器\
        读 AVIF、写 JPEG。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。文件的数量和\
        大小也没有上限，因为没有一台服务器在为它们付钱 &mdash; 活是在你自己\
        的机器上干的。本站带广告，这就是它的经费来源；广告拿不到任何关于你\
        照片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能，连解码器一起。把页面加载一次，然后断开网络，它照样处理你的照片，\
        和之前完全一样。这也是能拿得出的最有力的“什么都没被上传”的证明：一个\
        把你的 HEIC 送出去解码的转换器，在你拔线的那一刻就会停下来，而这一个\
        不会。"""

