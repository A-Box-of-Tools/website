[[privacy]]
title = "你的照片没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。"""

[[privacy]]
title = "解码器从这儿来，也哪儿都不去。"
body = """\
      HEIC 说白了就是装在盒式容器里的 HEVC，除了 Safari 没有浏览器解得开，\
      所以这个页面自带一份编译成 WebAssembly 的 <code>libheif</code>，大约
      1.4 MB，提交在这个仓库里，从本站发出，跟这里其他文件一样由 service
      worker 缓存。它不从 CDN 取。走 CDN 等于把一个第三方塞进每一次访问，\
      还会让这个工具离线用不成。二进制放在脚本内部而不是搁在旁边，就是为了\
      启动它连一次 fetch 都不用发。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      为这个工具写的文件里，一个 <code>fetch</code>、一个 \
      <code>XMLHttpRequest</code>、一个 <code>sendBeacon</code> 都找不到。\
      随附的这份引擎跟所有 Emscripten 构建一样，带着从某个 URL 取 \
      <code>.wasm</code> 的加载路径，但那些路径走不到，二进制本来就在手上；\
      就算走到了，<code>connect-src</code> 里只列了 Google 的统计端点，\
      浏览器当场就会拒绝。能当证据的是那条策略，不是那句话。"""

[[privacy]]
title = "元数据在这儿读出来，也报给你看。"
body = """\
      页面上那份列表会写明每张照片带着什么，拍摄日期、相机，还有里面有没有
      GPS 坐标。把 JPEG 交给别人之前，这些多半是你想先知道的。读取由 \
      <code>src/boxes.js</code> 在这个浏览器里完成，结果显示在这个页面上，\
      写进你的 JPEG 还是丢掉，你自己定。这个仓库里没有哪个统计事件会带上\
      文件名、日期、坐标或者数量。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      照片的信息，一条都没给它们。读文件、解码、写文件的每一行代码都从本站\
      发出，也都摆在仓库里。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      把页面开一次，然后断网，这个工具跟原来一模一样，解码器也一起缓存下来\
      了。这是最省事的一条证明，在这个页面上还格外有分量。一个把照片送出去\
      解码的转换器，绝无可能做到这一点。"""

[[howto]]
title = "选好你的 HEIC 照片。"
body = """\
      拖到下面的方框里，或者点开自己挑，直接从手机备份、桌面文件夹里选都行。\
      浏览器直接从你的硬盘上读，这期间没有东西发出去。列表会写明每一张是\
      什么，里面有些什么。"""

[[howto]]
title = "看看这些照片都带着什么。"
body = """\
      每一行写出拍摄日期、相机型号，还有这个文件里有没有 GPS 坐标，最后这项\
      用绿色标出来，因为它才是值得留神的。这些不用解码画面，直接从容器里读，\
      所以不花什么代价，也立刻就有。"""

[[howto]]
title = "选格式，再定那些细节。"
body = """\
      没有特别理由就选 JPEG。转换图的本来就是到哪儿都打得开。质量滑块停在
      92，这一档上照片很难跟原图区分开。那个勾选框决定日期、相机和位置要不要\
      一起带过去。"""

[[howto]]
title = "按“转换”，然后下载。"
body = """\
      解码器在第一次转换时到位，大约 1.4 MB，只这一次。之后每张照片都在你\
      自己的机器上解码、写出。一个文件给你一个下载按钮，多个文件另外给你一个
      zip。"""

[[faq]]
q = "我的照片会传到什么地方去吗？"
a = """
        不会。读取、解码、写出，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有任何联网功能，不取东西，也不发东西。页面的 \
        <code>Content-Security-Policy</code> 把它可能联的地址全列了出来，\
        没有一个是本站的。确实会加载的只有解码器，它来自本站，只加载一次，\
        而且发生在你的照片被牵扯进来之前。"""

[[faq]]
q = "为什么第一次打开要下载 1.4 MB？"
a = """
        因为 HEIC 是浏览器唯一打不开的图片格式。它是装在盒式容器里的一帧
        HEVC，只有苹果设备上的 Safari 有解码器，Chrome、Firefox 和 Edge 干脆\
        不认这个文件。所以 HEIC 转换器总得从某处弄个解码器来，能放的地方只有\
        两个，服务器或者这个页面。别人都选了服务器，这就是它们个个要你上传\
        照片的原因。这一个改成自带一份编译成 WebAssembly 的 \
        <code>libheif</code>。它从本站发出，第一次访问之后就有缓存。你的照片\
        哪儿也不去，代价就是这 1.4 MB，仅此而已。"""

[[faq]]
q = "转出来的 JPEG 还保留拍摄日期、相机和位置吗？"
a = """
        你要它留就留，页面上有个勾选框。开着的时候，EXIF 块从 HEIC 里原样\
        复制出来，按手机写的样子写进 JPEG，所以转换后的照片仍然按拍摄那天\
        排序，而不是按转换那天。大家抱怨 HEIC 转换器的，正是这一点。只有一个\
        标签会改，就是方向。它被设成“正立”，因为旋转已经作用在像素上了，\
        看图软件要是再转一次，每一张竖构图都得躺下。把勾选框关掉，出来的
        JPEG 里只剩画面。"""

[[faq]]
q = "它会去掉 GPS 坐标吗？"
a = """
        它先告诉你坐标在那儿，然后照你说的办。还没开始转，每张照片那一行就\
        已经写明文件里有没有坐标，这一步比手机做得多。取消勾选“保留日期、\
        相机和参数”，坐标跟别的一切一起被挡在 JPEG 之外；勾着，它们就跟过去。\
        想逐条细看那些标签，或者把已经是 JPEG 的照片里的标签清掉，那是 \
        <a href="../exif-editor/">EXIF 查看与清除</a>干的活，而且它不重新压缩\
        画面。"""

[[faq]]
q = "画面会重新压缩吗？"
a = """
        会，而且非压不可。HEIC 和 JPEG 是两种编码，从一种到另一种，只能把\
        画面解开再编一遍。你能拿捏的是这一下的代价有多大。质量滑块默认 92，\
        这一档上照片非常难跟原图区分开。要是一点损失都不想要，又不介意文件\
        大上五到十倍，菜单里还有 PNG。"""

[[faq]]
q = "文件名叫 .jpg，其实是 HEIC，怎么办？"
a = """
        照样能用。拖进来的文件按开头那几个字节判断，不按名字。名字取决于最后\
        碰过它的那个应用怎么叫它，而一个名叫“.jpg”的 HEIC，正是大家跑来找\
        这类工具的常见原因之一。真的是 JPEG 或者 PNG 的文件会被挡下来，并\
        告诉你它其实是什么，不会被转成一份自己的副本。"""

[[faq]]
q = "Live Photo 或者连拍能转吗？"
a = """
        里面的静态画面能转。一个 HEIC 可以装不止一张画面，装几张就转几张，\
        按原文件名加编号命名。Live Photo 的视频那一半，是手机搁在 HEIC 旁边\
        的另一个文件，不在这里，也就无从转起。深度图和缩略图在容器里，但不是\
        谁想要的画面，原样留着不动。"""

[[faq]]
q = "为什么它不收我的 AVIF？"
a = """
        因为没什么可做的。AVIF 和 HEIC 是同一种容器，只是里面装的是 AV1 而不\
        是 HEVC，现在的浏览器个个都能原生解码。为它下发一兆的引擎，是在解决\
        一个你根本没有的问题。真要把 AVIF 变成 JPEG，\
        <a href="../compress-image/">图片压缩</a>和\
        <a href="../resize-image/">图片缩放</a>都能用浏览器自带的解码器读
        AVIF、写 JPEG。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小\
        同样没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上\
        干的。本站带广告，经费就是这么来的，广告拿不到关于你照片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能，连解码器一起。页面开一次之后断网，它照样处理你的照片，跟之前没有\
        区别。这也是“什么都没上传”最有分量的证明。一个把 HEIC 送出去解码的\
        转换器，拔线那一刻就停了，这一个不会。"""

