[[howto]]
title = "按“转换”，然后下载。"
body = """\
      解码器在第一次转换时到位，大约 1.4 MB，只一次，之后每一张照片都在你\
      自己的机器上解码和写出。一个文件给你一个下载按钮，多个文件还额外给你\
      一个 zip。"""

[[faq]]
q = "我的照片会被传到什么地方去吗？"
a = """
        不会。读取、解码、写出，都由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有任何形式的网络功能，从不取什么，也从不发什么，而页面的\
        <code>Content-Security-Policy</code> 把它可能联系的地址全列了出来，\
        其中没有一个属于本站。唯一确实会加载的东西是解码器本身，它来自本站，\
        只加载一次，而且发生在你的照片被牵扯进来之前。"""

[[faq]]
q = "这个页面第一次为什么要下载 1.4 MB？"
a = """
        因为 HEIC 是浏览器唯一打不开的图片格式。它是装在盒式容器里的一帧
        HEVC，只有 Safari 在苹果硬件上有解码器，Chrome、Firefox 和 Edge 干脆\
        拒收这个文件。所以 HEIC 转换器总得从某处弄来一个解码器，能放的地方\
        只有两个，服务器或者这个页面。别的转换器都选了服务器，这正是它们\
        个个要你上传照片的原因。这一个改成自带一份编译成 WebAssembly 的\
        <code>libheif</code>。它由本站提供，第一次访问之后就有缓存，而这就是\
        “你的照片哪儿也不去”的全部代价。"""

[[faq]]
q = "转出来的 JPEG 会保留日期、相机和位置吗？"
a = """
        你要它保留就保留，页面上有一个勾选框。开着的时候，EXIF 块会从 HEIC
        里原样复制出来，按手机写的样子写进 JPEG，所以转换后的照片仍然按拍摄\
        那天排序，而不是按转换那天，大家抱怨 HEIC 转换器的正是这一点。只有\
        一个标签会被改，也只有这一个，方向，它被设成“正立”，因为旋转已经\
        作用到像素上了，再应用一次的看图软件会把每一张竖构图的照片放倒。\
        把勾选框关掉，出来的 JPEG 就只有画面，别的什么都没有。"""

[[faq]]
q = "它会去掉 GPS 坐标吗？"
a = """
        它会先告诉你坐标在那儿，然后照你说的做。你还没转换任何东西，每张照片\
        那一行就已经写明这个文件里有没有坐标，这一点比手机做得多。取消勾选\
        “保留日期、相机和参数”，坐标会和别的一切一起被挡在 JPEG 之外；保持\
        勾选，它们就跟着过去。你要是想逐条细看那些标签，或者把已经是 JPEG
        的照片里的标签清掉，<a href="../exif-editor/">EXIF 查看与清除</a>才是\
        干这个的工具，而且它不重新压缩画面。"""

[[faq]]
q = "画面会被重新压缩吗？"
a = """
        会，而且非重新压缩不可，HEIC 和 JPEG 是两种不同的编码，从一个到另一\
        个，除了把画面解码再编码一遍别无他法。你能拿捏的是这一下的代价有多\
        大。质量滑块默认 92，这一档上照片非常难跟原图区分开；你要是完全不想\
        有损失、又不介意文件大上五到十倍，菜单里还有 PNG。"""

[[faq]]
q = "文件名叫 .jpg 但其实是 HEIC，怎么办？"
a = """
        照样能用。拖进来的每一个文件都按它开头那几个字节判断，不按名字，因为\
        名字取决于最后碰过它的那个应用怎么叫它，而一个名叫“.jpg”的 HEIC，\
        正是大家最后跑来找这类工具的常见原因之一。真的是 JPEG 或者 PNG 的\
        文件会被拒绝并给出说明，而不是被转换成一份自己的副本。"""

[[faq]]
q = "它能转 Live Photo 或者连拍吗？"
a = """
        里面的静态画面能转。一个 HEIC 可以装不止一张画面，装了几张就转几张，\
        并按原文件名加编号命名。Live Photo 的视频那一半，是手机放在 HEIC
        旁边的另一个文件，所以它不在这里，也就无从转起。深度图和缩略图在\
        容器里，但不是谁想要的画面，会留着不动。"""

[[faq]]
q = "为什么它不肯收我的 AVIF？"
a = """
        因为没什么可做的。AVIF 和 HEIC 是同一种容器，只是里面装的是 AV1 而不\
        是 HEVC，而现在的浏览器个个都能原生解码，为此下发一兆的引擎，是在解决\
        一个你并不存在的问题。你要是需要把 AVIF 变成 JPEG，\
        <a href="../compress-image/">图片压缩</a>和\
        <a href="../resize-image/">图片缩放</a>都能用你浏览器本来就有的解码器\
        读 AVIF、写 JPEG。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小\
        同样没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上\
        干的。本站带广告，经费就是从那儿来的，广告拿不到任何关于你照片的\
        信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能，连解码器一起。页面加载一次之后断开网络，它照样处理你的照片，和\
        之前完全一样。这也是拿得出的最有分量的“什么都没上传”的证明，一个把你\
        的 HEIC 送出去解码的转换器，拔线那一刻就停了，而这一个不会。"""

