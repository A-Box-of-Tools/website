og_title = "不上传，也能把 HEIC 照片变成 JPG"
og_description = "一个不想要你照片的转换器。HEIC 解码器由这个页面自己带着，在你的机器上跑，照片从头到尾没离开过。"
og_image_alt = "HEIC 转 JPG - iPhone 照片，换成什么都打得开的格式"

pledge = """
    解码这一步，在你自己的浏览器里、用你自己的硬件完成。HEIC 是浏览器唯一\
    打不开的图片格式，所以这个页面把解码器一并带上了，大约 1.4 MB，从本站\
