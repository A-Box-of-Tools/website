    这边。页面上根本没有联网功能，另一头也没有服务器能接住照片。"""

live_hint = """
      别信我们嘴上说的。打开开发者工具，盯着“网络”面板，转一张照片试试。你\
      会看到页面自己的文件在加载，解码器也在里头，但没有一条请求带着照片、\
      缩略图、文件名，或者你选中内容里的任何一个字节。嫌麻烦就把页面开一次，\
