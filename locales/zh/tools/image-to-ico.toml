title = "图片转 ICO &mdash; 制作 favicon、应用图标或 ICNS，无需上传"
description = "在浏览器里把 PNG、JPEG 或 SVG 转成一个真正多尺寸的 .ico，或者一个 macOS 的 .icns。网站 favicon、Windows 应用图标、Mac 应用图标，外加一个网站需要的 Apple 和 Android 文件。什么都不上传。"
og_title = "做一个装齐所有尺寸的 .ico 或 .icns，什么都不用上传"
og_description = "给网站的 favicon.ico，给 Windows 程序的 app.ico，给 Mac 的 .icns —— 下载之前先看一眼 16 像素下长什么样。全部在你自己的机器上跑。"
og_image_alt = "图片转 ICO - favicon 与 Windows、macOS 图标制作，无需上传"

pledge = """
    缩放和图标文件本身，都是在你自己的浏览器里做出来的。画面由你浏览器本来\
    就带的 canvas 绘制，而每一种容器 &mdash; Windows 的 <code>.ico</code>、
    macOS 的 <code>.icns</code> &mdash; 都是由 <code>src/ico.js</code> 和\
    <code>src/icns.js</code> 里两百来行你可以读的代码，从那些像素拼出来的。\
    这个工具没有任何形式的网络功能 &mdash; 没有要取的东西，也没有要发的东西
    &mdash; 而且这个页面的另一端根本没有服务器，就算有路可走也没地方送 logo。"""

live_hint = """
      别听我们说：打开开发者工具，盯着“网络”面板，做一个图标。没有任何一个\
      请求带着图片、缩略图、文件名，或者你选中内容的一个字节。或者干脆拔掉\
