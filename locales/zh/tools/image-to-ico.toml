title = "图片转 ICO | 制作 favicon、应用图标或 ICNS，不用上传"
description = "在浏览器里把 PNG、JPEG 或 SVG 转成真正多尺寸的 .ico，或者一个 macOS 的 .icns。网站 favicon、Windows 应用图标、Mac 应用图标，外加一个网站要用的 Apple 和 Android 文件。什么都不上传。"
og_title = "做一个装齐所有尺寸的 .ico 或 .icns，什么都不用上传"
og_description = "网站要的 favicon.ico，Windows 程序要的 app.ico，Mac 要的 .icns，下载之前先看一眼 16 像素下长什么样。全程在你自己的设备上跑。"
og_image_alt = "图片转 ICO - favicon 与 Windows、macOS 图标制作，无需上传"

pledge = """
