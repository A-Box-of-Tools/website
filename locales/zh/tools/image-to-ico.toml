features = [
  "写出真正多尺寸的 .ico，从 16 到 256 像素",
  "写出含苹果全部十个槽位的 macOS .icns，从 16 到 1024 像素",
  "一张图、一遍处理生成两种格式，每个尺寸只画一次",
  "预设涵盖网站 favicon、Windows 应用图标、高 DPI Windows，以及最大兼容性",
  "每个尺寸都注明谁在要它，所以没有哪一个是白放进去的",
  "小尺寸用不压缩条目、大尺寸用 PNG，也可以全部统一用其中一种",
  "保留透明，并且额外写上 Vista 之前那张透明掩码",
  "对不是正方形的图片可以留白、裁剪或拉伸，背景可以是某个颜色，也可以什么都不垫",
  "下载之前，按真实像素大小展示每一个尺寸",
  "可选的网站整套：Apple touch icon、Android 图标、maskable 图标、Windows 磁贴、manifest，以及可粘贴的 HTML",
