read_first = """\
      ，<code>src/ico.js</code> 和 <code>src/icns.js</code> 里是这两种图标\
      格式 &mdash; 一个是目录、条目和掩码，另一个是苹果那十个具名槽位
      &mdash; 而 <code>src/sizes.js</code> 里是页面上每一个尺寸的来历。"""

howto_heading = "怎么做一个 .ico 文件，而且什么都不上传"

card = """
            一个 favicon、一个 Windows 应用图标，或者一个 macOS 的 .icns
            &mdash; 所有尺寸装在一个文件里，下载前先看 16 像素下的样子。"""

[words]
plural = "图片"
choose = "图片"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "无水印"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[privacy]]
title = "你的 logo 没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集你文件的接口，代码里也没有任何一处\
      会去发送它们，哪怕真有这么个接口。"""

[[privacy]]
title = "这里没有任何东西会去取什么。"
body = """\
      <code>src/</code> 里没有 <code>fetch</code>，没有\
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。缩放就是\
      往 canvas 上做一次 <code>drawImage</code>；每个图标就是由\
      <code>src/ico.js</code> 或 <code>src/icns.js</code> 在这个页面里，在\
      那些像素前面写上一个文件头。"""

[[privacy]]
title = "这个文件是用它自己的字节来描述的。"
body = """\
      做好的图标旁边列出的尺寸清单，不是你要求的那份清单。它是由\
      <code>readIcoDirectory</code> 或 <code>readIcnsElements</code> 从刚刚\
      写出来的那个文件里重新读出来的，所以万一写入的结果和设置对不上，页面\
      会当场说出来，而不是等 Windows 什么都不画、macOS 画出一张白纸时你才\
      发现。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。它们没有\
      一个被交给过任何关于你图片的信息。每一行读取、缩放或写出文件的代码，\
      都由这个源提供，也都列在仓库里。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个工具毫无变化，因为它里面从来就没有过一个联网的步骤。\
      这是所有证明里最简单的一个。"""

[[howto]]
title = "选那张图。"
body = """\
      把一个 PNG、JPEG、WebP 或 SVG 拖到选择框上，或者一次挑好几个一起转。\
      正方形最省事，而 256 像素以上的图，细节足够撑起每一个尺寸。浏览器直接\
      从你的硬盘上读它；这个过程中没有任何东西被送去哪里。"""

[[howto]]
title = "挑你需要的那些文件。"
body = """\
      Windows 和浏览器读 <code>.ico</code>；Mac 读 <code>.icns</code>，而且\
      根本不看另一个。勾一个，或者两个都勾 —— 如果你做的东西两边都要发。\
      网站还要额外的 Apple、Android 和磁贴图片，那是第三个勾选框。"""

[[howto]]
title = "说明这个图标是干什么用的。"
body = """\
      网站 favicon 要 16、32 和 48 像素；Windows 应用还要 256；一个必须在\
      高 DPI 笔记本上看着不糊的应用，还要 Windows 在 125% 和 150% 缩放下\
      索取的那几个中间尺寸。挑一个和你的活儿对得上的，或者自己勾尺寸。清单上\
      每一个尺寸都注明了谁在要它。<code>.icns</code> 没有这种选择：苹果明确\
      规定了十个槽位，十个全都得进去。"""

[[howto]]
title = "处理形状和背景。"
body = """\
      图标是正方形，而大多数 logo 不是。留白会保住整张图，上下留出空间；\
      裁剪会取中间那块；拉伸会把它挤变形。透明会被当作透明保留，除非你选一个\
      颜色垫在后面。"""

[[howto]]
title = "下载之前，看一眼 16 像素那个。"
body = """\
      那是这个图标被看到最多的尺寸，也是细线条和小字消失的地方。预览里每一个\
      方块都是按它的真实尺寸、从你自己的文件画出来的。如果最小的那个糊成一团，\
      解法是换一张更简单的图，不是换一个设置。"""

[[howto]]
title = "把文件拿走。"
body = """\
      一个把所有尺寸都装在里面的 .ico，在你要的就是这个时命名为\
      <code>favicon.ico</code>，因为那是浏览器会去找的地址。勾了 macOS 的话，\
      旁边还有一个 .icns，可以直接放进 Mac 应用包里。再勾上网站那一套，你还会\
      拿到 Apple、Android 和 Windows 磁贴图片、manifest，以及一段可以粘进你\
      页面的 HTML。只要不止一个文件，就打成一个 zip 下来。"""

[[faq]]
q = "我的图片会被上传到什么地方吗？"
a = """
        不会。画面由你自己的浏览器、在你自己的硬件上解码和缩放，而 .ico 是由\
        这个页面提供的代码从那些像素拼出来的。这个工具没有任何形式的网络功能
        &mdash; 它从不取任何东西，也从不发任何东西 &mdash; 而页面的\
        <code>Content-Security-Policy</code> 列出了它可能联系的每一个地址，\
        其中没有一个属于本站。"""

[[faq]]
q = "一个 favicon.ico 里应该装哪些尺寸？"
a = """
        16、32 和 48。这不是偏好：16 是浏览器在标签页里画的那个，32 是 Windows
        用于桌面快捷方式、也是好几个浏览器用于书签的那个，48 是 Google 读取\
        站点图标时用的尺寸。比这更大的，应该放在 .ico 旁边的 PNG 里，而不是\
        塞进 .ico 里面 &mdash; 这里的网站那一套做的正是这件事。"""

[[faq]]
q = "一个 Windows 应用图标需要哪些尺寸？"
a = """
        16、32、48 和 256，也就是 Visual Studio 自己默认的 app.ico 里装的\
        那些。16 用于标题栏和资源管理器的小图标视图，32 用于桌面和任务栏，
        48 用于资源管理器的中等图标，256 用于开始菜单和超大图标视图。在高 DPI
        显示器上，Windows 还会索取 20、24、40、64 和 96，没有的话它就从最接近\
        的尺寸重采样 &mdash; “覆盖所有缩放”那个预设会把它们都放进去。"""

[[faq]]
q = "为什么文件比我原来那张图还大？"
a = """
        因为一个 .ico 不是一张图，是好几张，而且小尺寸是不压缩存的，好让什么\
        东西都读得了。一个 32x32 的条目不管里面是什么，都正好是 4,264 字节，\
        而一个 256x256 的不压缩条目是 264 KB &mdash; 这就是为什么 64 以上的\
        尺寸默认存成 PNG。选“所有尺寸都用 PNG”得到的是最小的文件；选“所有\
        尺寸都不压缩”得到的是兼容性最好的那个。"""

[[faq]]
q = "PNG 条目和不压缩条目有什么区别？"
a = """
        只在于像素在 .ico 里怎么存。不压缩的条目是 Windows 最初的那套安排
        &mdash; 一个位图头、上下颠倒的像素，加一张一位的透明掩码 &mdash;
        任何一个发行过的 Windows 版本都读得了。PNG 条目是把一整个 PNG 文件\
        塞进图标里，在大尺寸上要小三到十倍，但从 Windows Vista 起才被认得。\
        默认设置是各用各的强项：64 像素以内不压缩，以上用 PNG。"""

[[faq]]
q = "它能做比 256 像素更大的图标吗？"
a = """
        不能，谁都不能。这个格式用一个字节存每条边的长度，而 0 已经被占用了
        &mdash; 它表示 256。这就是天花板，所以一个装着 512 像素图像的 .ico
        不是更大的图标，而是一个坏掉的图标。要 512 的话你需要的是 PNG，网站\
        那一套里就为 Android 和 web 应用的启动画面准备了它。"""

[[faq]]
q = "它会保留透明吗？"
a = """
        两种条目都会，而且它还会在 alpha 通道旁边写上那张老式的一位掩码，\
        好让老到读不了 alpha 的软件仍然能把图标抠出来，而不是画一个黑方块。\
        唯一一个被故意做成不透明的文件，是网站那一套里的 Apple touch icon：
        iOS 会把它合成到自己的方块上，并把透明变成黑色，所以它被压平到你选的\
        背景色上，默认是白色。"""

[[faq]]
q = "我的 logo 是一个横排的文字标，会怎么样？"
a = """
        总得有点变化，因为图标是正方形。留白会把整个东西保下来，然后让它变得\
        很小 &mdash; 一个文字标塞进 16 像素的方块里，大概只有三个像素高，\
        根本认不出来。裁到中间通常效果更好：把符号从整个组合标里拿出来单用，\
        几乎每个品牌的 favicon 都是这么干的。预览会在你下载任何东西之前，先\
        告诉你哪一个活得下来。"""

[[faq]]
q = "网站那一套里有什么，我全都需要吗？"
a = """
        七个 PNG、一个 web app manifest、一个 browserconfig.xml，以及一段可以\
        粘贴的 HTML。你需要它们，是因为一个 .ico 只管浏览器和 Windows，别的\
        一概不管：iPhone 的主屏幕读的是一个 180 像素、名字自成一格的 PNG，
        Android 和每一个安装提示读的是 manifest，而钉在开始菜单上的磁贴读的\
        是那个 XML。它们没有一个会往 .ico 里面看。所有东西都在这里、在你的\
        机器上生成，zip 里还附了一张说明，写清楚每个文件是干什么的。"""

[[faq]]
q = "它也能做 macOS 图标吗？"
a = """
        能 &mdash; 勾上 <em>macOS 图标</em>，你会在 <code>.ico</code> 旁边\
        拿到一个 <code>.icns</code>，或者干脆只要它。它是同一个想法的另一种\
        容器，而且两个系统谁也不读对方的：Windows 要 .ico，Mac 应用包要 .icns。\
        那边的尺寸不是选择题，因为苹果明确公布了十个槽位 &mdash; 16、32、64、
        128、256、512 和 1024 像素，其中三个会出现两次，作为下一档的 Retina
        版本。十个全都进去，由七次渲染画出来，这也是为什么 .icns 是更大的那个\
        文件。"""

[[faq]]
q = "这个 .icns 文件怎么用？"
a = """
        对一个应用来说，它放在应用包的\
        <code>YourApp.app/Contents/Resources/</code> 里，并在\
        <code>Info.plist</code> 的 <code>CFBundleIconFile</code> 下写明；\
        每一个 Mac 打包工具都有对应的字段。别的用途：在访达里选中这个文件，\
        按 Command-C，然后对你想改的文件夹或磁盘映像“显示简介”，点左上角那个\
        小图标，按 Command-V。"""

[[faq]]
q = "这个 .icns 和 iconutil 做出来的一样吗？"
a = """
        一样的十个槽位、一样的四字母类型，每个里面装的都是 PNG，也就是\
        <code>iconutil</code> 从一个 <code>.iconset</code> 文件夹生成出来的\
        东西。有一处是故意不同的：苹果的工具还会写一个 <code>TOC&nbsp;</code>\
        元素，它是后面那些类型和长度的一份索引。它是一项优化，不是格式的一\
        部分 &mdash; 没有它的读取器会从头到尾走一遍元素，得到同样的答案
        &mdash; 而一个错的索引比没有索引更糟，所以它被省掉了。"""

[[faq]]
q = "我能一次转好几张图吗？"
a = """
        能。列表上每一张图都会用同一套设置变成它自己的 .ico，这一批打成一个
        zip 下来，每张图一个文件夹 &mdash; 否则其中两个都会叫 favicon.ico，\
        一个会把另一个盖掉。你勾选的每一种输出，都会为每一张图生成。点任意\
        一行，就能把那张图放进预览。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。文件的数量和大小\
        也没有上限，因为没有一台服务器在为它们付钱 &mdash; 活是在你自己的\
        机器上干的。本站带广告，这就是它的经费来源；广告拿不到任何关于你图片\
        的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的 logo 送出去转换的工具，在你拔线的那一刻\
        就会停下来。"""

