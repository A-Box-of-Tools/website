#
# Protect a PDF - 简体中文。
#
# Overrides for tools/protect-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样，也跟隔壁解锁那一页一样。
#
# 第一件：「保护」在 PDF 里是两回事，这一页任何时候都不能把它们混在一起说。
# 「打开密码」是真的锁：文档确实被加密了，没有密码谁都读不了。「限制」，不许
# 打印、不许复制、不许编辑，是一个请求，靠的是行为端正的阅读器之间的约定，
# 任何一个阅读器都可以不理，Adobe 从一开始就是这么写的，而本站隔壁就有一页专门
# 不理它。所以两个都提供的工具，必须在复选框旁边说清楚它写的是哪一种、各值多少。
#
# 第二件：在这里设的密码是唯一的回头路。本站不猜密码，别处任何诚实的东西也不猜，
# 所以这一页让人把密码打两遍，用一句大白话说一次「忘了密码就等于丢了文档」，
# 并且从不会误写出一个谁都打不开的文件：权限密码留空会被补上而不是留空，一份
# 文档只会被访客亲手打了两遍的那个密码关上。
#
# 用词：user password 写「打开密码」，owner password 写「权限密码」，
# revision 写「修订」，跟 /R 对应，与解锁那一页一致。
#

