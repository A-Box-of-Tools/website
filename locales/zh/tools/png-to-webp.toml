[[privacy]]
title = "你的图片无处可去。"
body = "内容安全策略列出了本页可以联系的每一个地址，其中没有任何地址属于本网站。这里没有收集文件的接口，也没有发送文件的代码。"

[[privacy]]
title = "透明区域保留，这是人们通常最关心的事。"
body = "WebP 和 PNG 一样有透明通道，透明背景的徽标仍有透明背景。无需选背景颜色，也无需填充。这与旁边的 <a href=\"../webp-to-jpg/\">WebP 转 JPG</a> 不同：JPEG 完全没有透明通道，因此必须询问。"

[[privacy]]
title = "无损经过验证，不只是口头保证。"
body = "画布没有无损 WebP 的开关，浏览器根据质量值选择编码。所有当前浏览器在最高质量时输出无损编码。但这是引擎行为，不是规范保证。所以本页会重新读取每个结果，并报告字节中是否真的是无损编码。若浏览器以后改变行为，你会当场收到提示。"

[[privacy]]
title = "画布不会保留的内容。"
body = "图片解码后绘制到画布，画布只有像素。因此 PNG 中的文本块、ICC 色彩配置和 XMP 信息不会保留。像素会保留，这就是这里“无损”的含义；周围的元数据不会。<a href=\"../exif-editor/\">EXIF 查看与移除工具</a>可查看和编辑 JPEG、PNG 和 WebP 元数据，不重新编码图片。AVIF 支持只读查看提取到的 EXIF，清理时将第一张解码后的图片转换为新的 PNG，颜色或 HDR 可能改变。"

[[privacy]]
title = "Google 加载什么，又拿不到什么。"
body = "广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们都不会获得你的图片信息。读取、解码和写入文件的每一行代码都来自本站，并列在代码仓库中。"

[[privacy]]
title = "可以离线使用。"
body = "先加载页面再断开网络，工具仍然照常工作。这是最简单的证明：如果转换器把图片发送出去处理，它就不可能做到这一点。"

[[howto]]
title = "选择 PNG 和 AVIF 文件。"
body = "拖入文件或手动选择。工具通过文件开头的字节识别格式，不看名称。因此真正的 JPEG 会被拒绝并说明原因，而不是转换成自身的副本。带透明区域的文件会有提示，因为人们尤其担心这部分丢失。"

[[howto]]
title = "选择无损，或者选择更小。"
body = "无损保留 PNG 的每个不透明像素，文件仍然更小，适合截图、示意图、徽标和带文字的图片。“更小”启用质量滑块，适合照片：差别很难看出，节省却很大。"

[[howto]]
title = "点击“转换”，阅读实际处理结果。"
body = "每个结果显示新大小和变化，并说明浏览器实际写出的编码：无损，或选定质量的有损编码。这一行从完成后的文件中读取，不是复述设置。"

[[howto]]
title = "逐个下载，或全部一起下载。"
body = "单个文件有下载按钮，两个或更多文件还可打包成 ZIP。同名文件会在扩展名前加数字，避免归档中相互覆盖。"

[[faq]]
q = "图片会被上传到哪里吗？"
a = "不会。文件在你的浏览器、你的硬件上读取、解码和写入。本工具没有任何网络功能：不获取也不发送内容。本页的 <code>Content-Security-Policy</code> 列出了全部允许联系的地址，没有一个属于本网站。"

[[faq]]
q = "透明区域会保留吗？"
a = "会，两种模式都保留。这是将 PNG 转为 WebP 而非 JPEG 的主要原因。WebP 有真正的透明通道，透明背景的徽标仍然透明。无需选择颜色，也不会被填平。转换前文件行显示是否有透明，结果也会确认透明已保留。"

[[faq]]
q = "无损和更小有什么不同？"
a = "无损意味着 WebP 的每个不透明像素都与 PNG 相同，文件仍然通常缩小五分之一到三分之一，因为 WebP 的无损编码比 PNG 更高效。半透明像素的限制在下一条单独说明。“更小”采用有损编码，丢弃不易察觉的细节，可把照片缩小到十分之一。原则是文字、平坦颜色和锐利边缘用无损，照片用另一种。"

[[faq]]
q = "你说“每个不透明像素”，半透明像素呢？"
a = "可能有极小变化，这是画布造成的，不是 WebP。浏览器在画布中把颜色与透明度预先相乘，而这个乘法无法完全逆转。越淡的像素，其原始颜色保留得越少。所有基于浏览器的转换器都有这个特性，包括本工具，因为画布负责在格式间传递图片。<br><br>实际效果是：完全不透明和完全不可见的像素都逐位保留。两者之间，储存的颜色可能变动。这里测得，透明度低于四分之一的像素颜色最多变化 255 中的 63，其余最多 4。你看不到它，因为变化最大的像素贡献的颜色最少。几乎不可见的像素无论存什么值，仍只贡献几乎不可见的颜色。它只存在于徽标的抗锯齿边缘，转换后看起来一样。<br><br>要逐位准确的归档副本，请保留 PNG。要外观一样、体积减少三分之一，本工具正适合。"

[[faq]]
q = "怎么知道真的无损？"
a = "因为会重新读取并检查成品，而不是复述设置。WebP 用两种数据块之一存储像素：无损是 <code>VP8L</code>，有损是 <code>VP8&nbsp;</code>。本页读取实际数据块并显示在结果行。画布没有无损标志，只能请求最高质量并让浏览器理解。所有当前浏览器都会，本页仍然逐个核实。"

[[faq]]
q = "WebP 真能到处打开吗？"
a = "在网页上可以。Chrome、Edge、Firefox 和 Safari 自 2020 年起都支持，所以网站无需再考虑备用格式。浏览器之外不太一致：Windows 和 macOS 已能预览，但旧桌面软件、某些上传表单和很多电子书阅读器仍不接受。给这种目标使用 <a href=\"../webp-to-jpg/\">WebP 转 JPG</a>，也就是反向转换。"

[[faq]]
q = "PNG 为什么原本这么大？"
a = "PNG 是无损的，照片不适合这样压缩。截图和徽标有大片重复区域，很适合 PNG；照片几乎没有重复内容，效果很差。手机照片存为 PNG，常常比同图的 JPEG 大十倍。这正是有损模式适用的情况。若必须低于指定大小，<a href=\"../compress-image/\">图片压缩器</a>可以设目标大小，而非质量。"

[[faq]]
q = "日期、相机和位置会保留吗？"
a = "不会。画布只存像素，周围的元数据都会丢弃。PNG 通常没有重要的相机信息，因此大多无妨。<a href=\"../exif-editor/\">EXIF 查看与移除工具</a>可查看和编辑 JPEG、PNG 和 WebP 元数据，不重新编码图片。AVIF 支持只读查看提取到的 EXIF，清理时将第一张解码后的图片转换为新的 PNG，颜色或 HDR 可能改变。"

[[faq]]
q = "能一次转换整个文件夹吗？"
a = "能。拖入任意数量的文件即可。没有数量或大小限制，因为没有服务器承担处理。每个文件单独显示并可下载，两个或更多文件可打包成 ZIP，顶部显示总节省量。"

[[faq]]
q = "免费吗？需要账号吗？"
a = "免费，无需账号、登录或试用，没有水印。网站通过广告维持运营，广告不会获得你的图片信息。"

[[faq]]
q = "可以离线使用吗？"
a = "可以。先加载页面，再断开网络，工具完全照常运行。这也是确认没有上传的最有力证据：向服务器发送文件的转换器断网就会停止，本工具不会。"


[[faq]]
q = "也能转换 AVIF 图片吗？"
a = "只要浏览器能够解码，也接受 AVIF 输入。输出格式仍为 WebP。AVIF 序列只输出第一张解码后的图片。浏览器画布会生成 8 位 SDR 副本：颜色或 HDR 可能改变，不保留元数据，文件也可能变大。原文件保持不变。"

