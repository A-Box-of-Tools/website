[[privacy]]
title = "你打进去的东西没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集 Wi-Fi 密码的接口，代码里也没有\
      任何一处会去发送它，哪怕真有这么个接口。"""

[[privacy]]
title = "这里没有任何东西会去取什么。"
body = """\
      <code>src/</code> 里没有 <code>fetch</code>，没有\
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。码是靠算术\
      从那串字符构造出来、再画成 SVG 的，就在这个页面里，在你的机器上。"""

[[privacy]]
title = "这个码不指向我们。"
body = """\
      你打进去什么，码里就装什么。好几个免费生成器还给你的码里装着一个指向\
      他们自己网站的链接，再由那边跳转到你那儿 &mdash; 于是每一次扫描都被\
      他们数了一遍，而且他们哪天不再为那个域名付钱、或者认定免费额度到期了，\
      这个码就失效了。这里不做短链、不跳转、不追踪：页面上显示的那串字符，\
      就是图里的那串字符。"""

[[privacy]]
title = "PNG 是从屏幕上那个 SVG 做出来的。"
body = """\
      下载的东西不是另一次渲染、可能和预览对不上。同一份标记被交给浏览器，\
      画到一张画布上，这也是为什么这件事不联系任何东西就能做成：里面既没有\
      字体要取，也没有图片要加载。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。它们没有\
      一个被交给过你打进去的任何东西。每一行把字符串变成码的代码，都由这个\
      源提供，也都列在仓库里。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个工具毫无变化，因为它里面从来就没有过一个联网的步骤。\
      这是所有证明里最简单的一个。"""

[[howto]]
title = "挑一种码。"
body = """\
      二维码什么都能装，也是手机摄像头会去找的那一种，所以除非有人另有交代，\
      答案就是它。条形码装的是一个数字，你需要哪一种由将来扫它的那个人决定
      &mdash; 商店要 EAN-13 或 UPC-A，运输纸箱要 ITF-14，内部用途通常是
      Code 128。"""

[[howto]]
title = "说明里面装什么。"
body = """\
      链接是最常见的情形，而它上面那几个框会拼出手机认得的其他格式：一个\
      会主动提示加入的 Wi-Fi 网络、一张会主动提示保存的联系人名片、一个邮件\
      地址、一条短信、一个电话号码、地图上的一个地点。不管你挑哪个，拼好的\
      那串字符都会显示在页面上 &mdash; 二维码里装的从来就只有它。"""

[[howto]]
title = "决定它能扛多少损伤。"
body = """\
      四个等级放进去的纠错数据有多有少，而纠错越多，码就越大越密。屏幕上用
      L 就够，普通纸张用 M，会被摸来摸去、印得很小，或者贴在太阳晒得到的\
      玻璃上的用 H。菜单上那种每天要擦一遍的码，值得上 Q 或 H。"""

[[howto]]
title = "设好尺寸、留白和颜色。"
body = """\
      留白是码的一部分：规范要求四周各留四个模块的静区，而把它裁掉，是印出来\
      的码扫不出来最常见的单一原因。深色在浅色上，而且要有真实的对比 &mdash;
      扫描器读的是两者之间的差，所以白底浅灰不行，而浅色在深底上在相当多的\
      读取设备上会直接失败。"""

[[howto]]
title = "用你手上那台手机试一下。"
body = """\
      在印一千份之前，先扫一下屏幕上这一个。这要十秒钟，而它能抓住预览抓不到\
      的一整类错误：一个 Wi-Fi 密码里有个字符本该转义、一个链接漏了\
      <code>https://</code>、一个条形码数字少了一位。"""

[[howto]]
title = "把 SVG 拿走。"
body = """\
      它是以指令而不是以像素表达的码，所以印成任何尺寸都不会发虚，而发虚的\
      边缘正是扫描器分辨不了的东西。如果你要粘进去的地方不收 SVG，那就把
      PNG 也拿走；它是按每个模块整数个像素画的，所以边缘同样不糊。"""

[[faq]]
q = "我打进去的东西会被发到什么地方吗？"
a = """
        不会。二维码就是对一串字符做算术，而这套算术在你自己的机器上、你自己\
        的浏览器里跑。这个工具没有任何形式的网络功能 &mdash; 它从不取任何\
        东西，也从不发任何东西 &mdash; 而页面的\
        <code>Content-Security-Policy</code> 列出了它可能联系的每一个地址，\
        其中没有一个属于本站。这一点在这个页面上比在大多数页面上更值钱，因为\
        人们最常放进二维码里的东西，是自家 Wi-Fi 的密码。"""

[[faq]]
q = "这些码会过期，或者过一阵子就不能用了吗？"
a = """
        不会，而且它们做不到过期。你打进去什么，码里就装什么，所以扫它永远\
        原样还给你那串字符。会过期的是那些里面装着别人地址的码：一个“动态”\
        二维码装的是一个指向生成方服务器的链接，再由那边跳转到你那儿，这就\
        意味着他们可以数每一次扫描、可以改它跳去哪儿，也可以在试用期结束时\
        把它关掉。这里没有任何东西经过跳转。"""

[[faq]]
q = "它免费吗，能商用吗？"
a = """
        免费，没有账号，没有水印，生成多少个也没有限制，而且你可以把结果放到\
        产品、海报或者店面上。QR Code 是电装波动（Denso Wave）的注册商标，\
        而他们已经声明不会对使用这些码的人主张这项权利 &mdash; 规范以
        ISO/IEC 18004 发布，可以自由实现，这个页面做的就是这件事。本站带\
        广告，这就是它的经费来源。"""

[[faq]]
q = "我该选哪个纠错等级？"
a = """
        没有特别理由就选 M。L 生成的码最小，在屏幕上完全够用；M 扛得住普通\
        的翻来翻去；Q 和 H 是给那些会被印得很小、覆膜、贴在玻璃上，或者被
        logo 挡掉一部分的码用的。每往上一级都会多放进一些校验数据，同样多的\
        文字就需要一个更大的图形 &mdash; 从 L 换到 H，同一串字符的模块数大约\
        会翻倍。"""

[[faq]]
q = "一个二维码能装多少？"
a = """
        在最大的尺寸、177 个模块见方时，最多 7,089 位数字、4,296 个大写字母\
        和数字，或者 2,953 字节的其他内容 &mdash; 而这还是在最弱的纠错下；\
        最强纠错下大约只有这些的三分之一。实际上，限制不在格式而在扫描器：\
        超过几百个字符之后，模块小到普通手机摄像头在一臂距离外分辨不出来。\
        一个很长的码，通常说明该往里面放的是一个短链接。"""

[[faq]]
q = "为什么我把链接写成小写，码就变大了？"
a = """
        因为二维码有一个专给大写字母和数字用的模式，两个字符只占十一位，而\
        小写没有这样的模式，每个要占八位。一个写成\
        <code>HTTPS://EXAMPLE.COM/PAGE</code> 的网址，可以比同一个小写网址\
        小三分之一。协议名和主机名不区分大小写，所以把它们喊出来除了尺寸\
        什么都不改；主机名后面的路径是区分的，那部分别动。"""

[[faq]]
q = "它除了生成，还能读二维码吗？"
a = """
        暂时不能。读一个码意味着解一张图 &mdash; 在照片里找出那个图形、\
        校正拍摄的角度、把损伤修回来 &mdash; 这和画一个码是两件事，而且要\
        大得多。它可以按和这里其他一切相同的条件建起来，它也在清单上。眼下\
        你手机的摄像头本来就能做，而且做得很好。"""

[[faq]]
q = "留白是干什么用的，能不能小一点？"
a = """
        二维码周围那圈空白是码的一部分。读取器靠它判断图形在哪儿结束，而\
        规范要求四边各留四个模块；条形码要十个左右。你在这里可以把它设成零，\
        画面会显得更齐整，然后相当多的扫描器会干脆看不见它 &mdash; 尤其是在\
        花哨的背景上。如果问题是地方不够，那就把码做小，而不是把它的留白裁掉。"""

[[faq]]
q = "我需要哪种条形码？"
a = """
        扫它的那个人要哪种就是哪种。EAN-13 是北美以外的零售条形码，UPC-A 是\
        北美那个 &mdash; 两者都需要一个由 GS1 发给你的号码，因为那个号码标识\
        的是你的公司，不只是这件商品。EAN-8 是给小包装用的短版本。ITF-14 印\
        在运输纸箱上。Code 128 和 Code 39 除了数字还能装文本，而且完全不需要\
        注册，这让它们成为一切内部用途的正确答案：资产、货架、工单。"""

[[faq]]
q = "校验位是什么，工具为什么给我加了一位？"
a = """
        它是零售条形码的最后一位，由它前面那些数字算出来，好让扫描器能区分\
        “读错了”和“读到了”。EAN-13 要十二位数字，第十三位由它算；UPC-A 要\
        十一位，第十二位由它算。你输短的那个号，这个页面把它补上。你输完整的\
        号，它会核对你给的那一位 &mdash; 而且是拒绝，不是悄悄改掉，因为一位\
        被悄悄改对的数字，意味着一张扫出来是别人商品的标签。"""

[[faq]]
q = "我能在二维码中间放一个 logo 吗？"
a = """
        这里不能，但别处能行的道理值得知道：靠的是纠错。在 H 级下，大约 30%
        的模块被毁掉，码依然读得出来，所以一个盖住比这少一些、又正好落在中间
        &mdash; 那里没有定位图形 &mdash; 的 logo，属于可修复的损伤。用 H 级\
        生成，拿进你的图像编辑软件，把 logo 控制在面积的五分之一以内，然后\
        用一台真手机测一下，别光凭信任。"""

[[faq]]
q = "为什么 SVG 比 PNG 好？"
a = """
        因为码就是一堆边缘，而 PNG 只有固定数量的像素来拼出这些边缘。把它\
        放大，每条边都会发虚；而发虚的边缘正是扫描器最头疼的东西，一台
        1200 dpi 的打印机拿到一张 512 像素的 PNG，等于被要求去凭空编出那些\
        差别。SVG 是以指令表达的那些方块，所以印在名片上和印在广告牌上都\
        一样锐利。这里的 PNG 是按每个模块整数个像素画的，那是 PNG 能做到的\
        最好情况。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的文字送出去画码的工具，在你拔线的那一刻\
        就会停下来。"""

