      倍数下面那行才是真正要发生的事，原片每隔多少秒取一帧。相机上设的就是\
      这个数，开始之前值得看一眼。"""

[[howto]]
title = "做完就下载。"
body = """\
      活在你自己的硬件上干，所以快慢取决于你这台机器，不取决于排队。做好的\
      视频直接交给浏览器的下载。"""

[[faq]]
q = "我的视频会传到什么地方去吗？"
a = """
        不会。读取、解码、挑帧、编码，全由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器那一半，页面的 <code>Content-Security-Policy</code> \
        把它可能联的地址全列了出来，没有一个是本站的。与其听我们说，不如拔掉\
        网线，照做一段试试。"""

[[faq]]
q = "倍数到底指什么？"
a = """
        进去多长比出来多长。60&times; 就是一小时的素材变成一分钟，你用多少帧率\
        播都还是一分钟。往里拆，工具每隔<em>倍数 &divide; 帧率</em>秒取一帧。\
        30 帧每秒下的 60&times;，就是两秒一帧。开始之前页面会把这个间隔写出来，\
        真正说明发生了什么的是它。"""

[[faq]]
q = "能加速哪些格式？"
a = """
        MP4、M4V 和 MOV 直接读，里面装的是 H.264、HEVC、AV1 还是 VP9 都行，\
        只要你的浏览器解得了那个编码。其他浏览器能播的格式，最典型的是 WebM，\
        改成把播放器挪到每个时刻上去读，凡是它能播的都走得通。浏览器既读不了\
        也播不了的文件，实际上就是 AVI、WMV、FLV 和大多数 MKV，会被直接拒收\
        并说明原因，不会干到一半才崩。出来的永远是 MP4。"""

[[faq]]
q = "延时视频为什么没声音？"
a = """
        因为没什么值得留的。快三十倍的声音既不是说话也不是音乐，只剩一串尖响。\
        反过来把原速的声音垫在早就跑到前头的画面下面，那就成了另一段片子，不是\
        你要的那段。所以音轨直接丢掉。一小时的视频最后只有几兆，主要也是因为\
        这个。你要是想单留声音，<a href="../edit-audio/">音频编辑</a>能存。"""

[[faq]]
q = "这比整段转码快吗？"
a = """
        快得多，直接读文件就是为了这个。一帧只能从它前面的关键帧开始解，可中间\
        那些帧没人规定必须留下。一小时做成 60&times;，解的是几千帧，不是十万帧。\
        按下按钮之前，摘要会告诉你它到底要读多少帧。"""

[[faq]]
q = "会掉画质吗？"
a = """
        留下的帧要再编一遍，这点损失躲不掉，成品把它们放在原文件里根本没编码过\
        的时刻上。这个工具跟这里其他视频工具不一样的地方，是码率给得更足，而且\
        是故意的。隔了两秒的两帧，比隔了三十分之一秒的两帧共同处少得多，编码器\
        能复用的就少，按普通素材调出来的数值在这里会糊成一块一块。"""

[[faq]]
q = "视频的大小和长度有限制吗？"
a = """
        工具里没设上限，文件也不整个读进内存，只读每个时刻前后那一小段。真正的\
        天花板是成品，它要在内存里拼好你才能下载，而延时视频按定义就是短的。\
        开始之前摘要会给出大概多大。"""

[[faq]]
q = "能只加速其中一段吗？"
a = """
        这里不行。这个工具从第一帧一直取到最后一帧。想要哪一段，先用\
        <a href="../trim-video/">视频剪切</a>切出来，那边一帧都不用重编，再把\
        切出来的文件拿到这里加速。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费\
        就是这么来的，广告拿不到关于你视频的任何信息。"""

[schema]
browser_requirements = "需要 JavaScript，以及能用 WebCodecs 编码视频的浏览器：Chrome、Edge、Safari 16.4 及以上，或 Firefox 133 及以上。"
description = "在浏览器里把长视频做成延时视频。从原片每隔几秒取一帧，把这些帧写成一段 24、30 或 60 帧每秒的短 MP4。MP4、MOV 和 M4V 直接读，而且只读需要的时刻前后那几段；浏览器能播的其他格式改用挪动播放位置的方式读。什么都不上传。"
features = [
  "把 MP4、MOV、M4V、WebM 视频加速 1.1 倍到 1000 倍",
  "可以说倍数，也可以说成品要多长",
  "只读所选时刻用得上的那几段",
  "24、30 或 60 帧每秒，原尺寸或缩小",
  "断网能用，不上传，不注册，没有水印",
]

