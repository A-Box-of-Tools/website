[[privacy]]
title = "你的视频没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      这个工具完全没有联网功能。没有网址可以粘，没有东西要下载，第一次用也\
      不去取什么引擎。碰过你视频的每一个字节，都是页面加载时从本站来的。"""

