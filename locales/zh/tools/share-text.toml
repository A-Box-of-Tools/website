[[privacy]]
title = "内容只去往你的读者，不去任何别处。"
body = """
文本和文件走 WebRTC 数据通道：你的浏览器与每位读者的浏览器之间一条直连、DTLS 加密的连接。这条路上没有服务器。局域网模式使用浏览器自身的网络地址，不使用公共地址发现或互联网中转。VPN 或浏览器网络策略可能影响这些地址的路径，所以这不是关于某栋建筑的保证。普通模式下，无法直连的读者可以在自己的页面上选择加密中转，它只转发同样的密文，读不了内容。"""

[[privacy]]
title = "引见服务器是什么，以及它能看到的一切。"
body = "直连需要引介。这个起始页面会自动为可被发现的本地链接名建立一条通往引见服务器的 WebSocket；开始分享后会为分享本身再开一条。读者使用一条引介连接。服务器按链接名把读者和分享方对上，并转递几 KB 的连接协商。它不写入存储，房间和发现条目随开放连接结束。它能看到名称、连接时间、IP 地址和连接协商，看不到文字、文件、放行决定或私密介绍。目录只显示使用同一公共 IP 地址的在线分享方所发布的名称。共享 VPN 或运营商共享地址可能包括其他网络；身边的设备若使用不同公共地址，也可能不出现在列表里。全部源码在仓库中。Cloudflare 保留七天连接日志：地址、链接名和时间，从不包含内容。"

[[privacy]]
title = "什么都不存，所以关标签页就是删除本身。"
body = """
分享只在你的标签页开着时存在。一关，新来的读者什么也找不到，正在读的人会看到自己的副本消失——不过别人之前复制或下载的东西归他，就像任何你亲手递出去的东西一样。你敲的草稿只放在你自己浏览器的存储里，好让下次还在，也只放在那里；勾上一次性，哪里都不放。"""

[[privacy]]
title = "链接名是地址，私密模式是那把锁。"
body = "知道或猜中名称的人能打开背后的分享。可被发现的本地分享会向使用同一公共 IP 地址的其他浏览器显示名称，此时名称在这个群组内是公开的。敏感内容请保持私密开启。私密默认开启：每位读者通过加密直连通道介绍自己，你批准之前不会发送内容。"

[[privacy]]
title = "直连让两边看见彼此的地址。"
body = """
点对点就是这个意思，而读者在事情发生前就会知道：打开分享链接只是问引见服务器有没有人在分享；然后页面明说，连接会让双方看到彼此的 IP 地址，并等待一次点击。在那次点击之前，分享方连读者存在都不知道。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们谁也拿不到文本、文件、名字和大小、谁连接过。例外是这个页面自己的地址：读者的链接里带着链接名，广告脚本会读取这个地址。想保密的分享，应该打开私密开关。碰到内容的每一行代码都由本源提供，并且都在仓库里。"""

[[howto]]
title = "写下文本，或附上文件。"
body = """
编辑器就是分享本身：读者连上时里面是什么，他拿到的就是什么；此后每次修改都随着你的键入实时抵达已连接的读者。文件走同一条通道，每个最大 200&nbsp;MB；读者看到列表，只下载自己要的那份——没人的带宽会耗在不想要的文件上。"""

[[howto]]
title = "文本配得上排版，就打开 Markdown。"
body = """
就一个开关。标题、加粗、列表、代码、链接随着键入在编辑器旁边实时渲染；读者默认看到排好版的样子，还有一个切回原文的按钮。渲染器随页面一起送达并转义一切：无论谁写的，分享的文本都无法在读者的机器上变成脚本。"""

[[howto]]
title = "给链接起名，或者就用建议。"
body = "名称就是地址：<code>brave-otter-42</code> 可以隔着房间喊、在电话里念，也能从白板上抄。可被发现的本地分享会把名称列出来，所以敏感内容请保持私密开启。仅通过链接分享时，不易猜中的名称也有帮助。正在使用的名称会被拒绝，停止分享后便会重新空出来。"

[[howto]]
title = "决定放谁进来。"
body = """
私密是默认：每位读者都会被请自报家门——名字、暗号、任何你认得出的东西——你看到那条消息，旁边是“让他读”和“请回”两个按钮。自我介绍走直连通道，连引见服务器都不知道是谁敲的门。取消勾选就是公开分享，知道名字的谁都能读。"""

[[howto]]
title = "开始分享，别关标签页。"
body = """
标签页就是服务器：它开着、醒着，分享就在；多一刻都没有。合上笔记本盖子同样会终结它。复制链接，或者干脆把名字说出去——读者在本页地址末尾敲上 <code>#name</code> 就行。局域网模式请复制链接：名称前会带上 <code>?local=1</code>。读者若使用了不同模式，必须先选择，才能按你的模式重试。"""

[[howto]]
title = "在另一头：先同意，再敲门。"
body = """
打开链接的人会得知有人在分享，被告知直连会让双方看到彼此的网络地址，只有自己选择时才会连接。遇到私密分享，就自报家门等你放行。他拿到的内容随你的编辑实时变化，你关掉标签页就消失。"""

[[faq]]
q = "有任何东西被上传到任何地方吗？"
a = "文字或文件不会上传。它们通过加密 WebRTC 通道从你的浏览器直达每位读者的浏览器。服务器只运送引介和已发布的本地链接名，从不运送内容。房间和发现条目随开放连接结束。Cloudflare 保留七天的连接日志包含元数据，从不包含内容。"

[[faq]]
q = "那这个工具为什么还要和服务器说话，偏偏还是在这个网站上？"
a = "因为两个浏览器不能自己找到彼此。引见服务器把输入 <code>brave-otter-42</code> 的人和用这个名称分享的人对上，并运送连接协商。本页的 <code>Content-Security-Policy</code> 里注明了它，源码在同一个仓库。它还向使用同一公共 IP 地址的浏览器列出已发布的本地链接名。它不持有内容，读不了加密直连通道。"

[[faq]]
q = "那台服务器究竟能看到什么？"
a = "它能看到正在使用的链接名、分享方和读者的连接与离开时间、IP 地址和连接协商。发现列表按服务器看到的公共 IP 地址把已发布的名称分组。它看不到文字、文件、文件名或大小、私密审批或自我介绍，这些都经过端到端加密的直连通道。Cloudflare 保留七天连接日志：链接名、地址和时间，从不包含内容。"

[[faq]]
q = "我关掉标签页会发生什么？"
a = """
        分享在所有地方同时结束。链接一两秒内失效；页面还开着的读者会看到自己的副本消失，附一句分享已结束的提示。这不是向哪台服务器提交删除申请——根本不存在要删的服务器副本。标签页是分享存在过的唯一地方，关掉它就是全部的收尾。"""

[[faq]]
q = "读者能留下我分享的东西吗？"
a = """
        分享开着的时候，能——分享本来就是这么回事。读者可以复制文本、下载文件，拿走的就是他的了，和你用任何别的方式亲手交给他没有两样。结束分享保证的是未来：新来的人拿不到了，开着的页面也不再显示。没有工具能撤回已经送达的东西，这个页面不装作可以。"""

[[faq]]
q = "私密模式是什么？"
a = """
        就是默认。每位到来的读者都会得知分享是私密的，并被请自报家门；你看到那条消息——“是我，站会上的 Alice”——旁边是放行与请回的按钮，你拍板之前什么都不会发出。自我介绍走的是本就加密的直连通道，所以谁敲了门、你怎么决定，服务器永远不知道。分享前取消勾选，就是公开分享。"""

[[faq]]
q = "为什么读者会看到我的 IP 地址？"
a = """
        因为连接是货真价实的直连，而直连跑在两个地址之间：每一端必然知道另一端，跟打电话一个道理。读者在任何连接存在之前就被提醒，只有自己选择时才连接；在那之前，你甚至不知道他打开过链接。如果这笔交换不适合某次分享，替代方案是经服务器中转的服务——交换的方向正好相反。"""

[[faq]]
q = "文件能有多大，速度怎么样？"
a = """
每个文件最大 200&nbsp;MB，类型不限，速度取决于两条连接中较慢的那条。可用的本地连接按该网络的速度传输；VPN 和浏览器路由设置可能影响路径。读者逐个按需下载，所以大文件也要等真有人请求后才会传输。"""

[[faq]]
q = "离线能用吗？"
a = """
        老实说：一半。编辑器能——页面照常加载，草稿还在，Markdown 照常渲染，写和保存完全不需要网络。分享不能，也不可能：够到另一个人的浏览器本身就是网络行为，引见还得靠引见服务器。这是本站唯一一个任务在离线时根本不可能完成的工具，暗示别的说法都是不诚实。"""

[[faq]]
q = "要是我们连不上呢？"
a = """
下面的中转选项只适用于普通连接模式。大多数浏览器对经引见后都能直连；少数不行，通常是有一头在移动运营商的共享地址网络里，或者躲在严苛的公司网后面。这个页面绝不会悄悄切到中转——那会不声不响地改变这个工具是什么——而是二十秒后明说直连没有建立，并向读者提供一条中转：由 Cloudflare 运行，在两个浏览器之间只转发加密后的字节，读不了内容，因为密钥从不离开两端。读者在自己的页面上、被告知中转能看到什么之后——两边的地址，直连本来也会看到——才亲自选它，那里同样什么都不存。你这一边什么都没变：你的浏览器仍然只发给那一位读者，就像对方用着 VPN 时一样。局域网模式从不提供中转。请检查两台设备是否使用同一 Wi-Fi 或以太网，以及访客网络隔离、防火墙或 VPN 是否阻止了连接。"""

[[faq]]
q = "谁都能分享任何东西，渲染 Markdown 还安全吗？"
a = """
        这个问题正是渲染器是本页源码里的八十行、而不是一个库的原因。任何标签产出之前，每个字符都先被转义；能产出的只有一组固定的无害标签；链接只认 <code>http</code>、<code>https</code> 和 <code>mailto</code>——<code>javascript:</code> 链接只会留成一行死文本。无论谁写的，分享的文本都无法在你的机器上变成脚本，而那八十行你自己就能读。"""

[[faq]]
q = "两个人能用同一个名字分享吗？"
a = """
        不能同时。每个名字只有一个活着的分享，由引见服务器强制执行：后来的会被拒绝，请他另选名字。分享一结束，名字立刻空出——这也意味着存下来的链接只和背后的分享一样新鲜：同一个名字，下周可能属于别人。把链接当成属于某个时刻的东西，而不是属于某个人的。"""

[[faq]]
q = "免费吗？要账号吗？"
a = """
        免费；没有账号，没有注册，也没有值得一提的限制——每次分享最多十六位读者同时在线。网站靠广告维持；广告拿不到这个页面分享的任何东西，而引见服务器恰恰因为什么都不存、几乎什么都不做，才轻轻松松待在免费套餐里。"""

[[faq]]
q = "能通过局域网分享文件吗？"
a = "能。开始前选择“局域网——不使用互联网中转”，把两台设备连到同一 Wi-Fi 或以太网，再把链接复制给读者。链接会带上模式；读者若使用了不同模式，必须明确选择后才能按分享方的模式重试。引介浏览器仍需要互联网。此模式不使用公共地址发现，也绝不切换到互联网中转。VPN 或浏览器网络策略可能改变路径或阻止连接；这个设置不能证明字节一直留在某栋建筑里。私密审批仍默认开启，每个文件的上限仍是 200&nbsp;MB。一次分享最多可以附上 256 个文件。此模式默认开启可被发现：另一个浏览器打开起始页面，就能从这条连接的列表中选择你的名称。取消可被发现，只通过链接分享。在共享网络上请保持私密开启。"

[[faq]]
q = "列表如何找到本地分享？"
a = "这个列表显示与你使用同一公共 IP 地址的浏览器所分享的链接名。通常这意味着同一路由器；共享 VPN 或运营商共享地址可能把其他网络也包括进来。IPv6 或不同路径也可能让身边的设备不出现在列表里。需要互联网。打开分享仍会在连接前征求同意，私密分享仍需要分享方批准。本地分享默认发布名称，取消可被发现即可只通过链接分享。选择名称会打开同意页面，绝不自动连接或绕过私密审批。目录只在分享方连接期间保留链接名，从不保留文字、文件名或文件内容。如果发现暂不可用，分享链接仍可使用。"

[schema]
description = "把文本和文件经直连的端到端加密 WebRTC 连接从一个浏览器分享到另一个。链接名说得出口，边打字边实时同步，Markdown 渲染，逐个批准读者。任何服务器都不存任何东西；分享方关掉标签页，分享即止。"
features = ["文本和文件从浏览器到浏览器，端到端加密，永不经过服务器", "分享活在打开的标签页里：一关就结束，读者的页面也随之清空", "说得出口的链接名 - brave-otter-42 -，可自定义，每个名字只有一个活着的分享", "默认私密：每位读者先自报家门，分享方决定放行还是请回", "任何连接存在之前读者先同意，并被明确告知 IP 将互相可见", "实时同步：修改随着键入送达已连接的读者", "两侧都可开关的 Markdown，由先转义的内置渲染器渲染", "文件每个最大 200 MB，按需下载，逐个显示进度", "草稿只留在分享方自己的浏览器里——勾上一次性，则哪里都不留", "服务器部分整个就是一个零存储的引见服务器，发布在仓库里", "可选局域网模式，不使用公共地址发现或互联网中转", "向使用同一公共 IP 地址的浏览器显示可被发现的本地链接名，同时保留连接前同意和私密审批"]
