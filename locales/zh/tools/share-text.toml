name = "文本与文件分享"
heading = "文本与文件分享 <span class=\"h1-kw\">&mdash; 从你的浏览器直达对方浏览器，不上传</span>"
tagline = "分享只活在这个打开的标签页里。读的人从你的浏览器直接取走加密内容，关掉标签页就结束——任何服务器上都不留一点东西。"

title = "设备间分享文本与文件——直连、加密、零存储"
description = "把文本或文件经由直连加密通道从一个浏览器送到另一个。链接名说得出口，边打字边实时同步，逐个批准读者——任何服务器上永远不存任何东西。免费，无需注册。"
og_title = "关掉标签页的那一刻，分享就结束了"
og_description = "文本和文件加密后从你的浏览器直达读者的浏览器。服务器只负责引见双方，永远看不到内容。没有存储、没有历史、没有账号——关掉标签页，处处消失。"
og_image_alt = "文本与文件分享 - 浏览器到浏览器，零存储"

pledge = """
    你在这里分享的内容，经端到端加密的 WebRTC 通道，从你的浏览器去往每位读者的浏览器，不去任何别处。唯一牵涉的服务器——名字写在本页的 <code>Content-Security-Policy</code> 里，源码在仓库中——把两个浏览器互相引见之后就退到一边：它什么也不存，内容也从不经过它。没有历史，没有账号。关掉这个标签页，分享在所有地方同时结束，包括读者仍开着的页面。"""

live_hint = """
      分享时打开开发者工具，盯着“网络”面板。你会看到一条通往引见服务器的 WebSocket，只载着几 KB 的连接协商——而无论你打了多少字、附了多少文件，没有哪条请求带走其中一个字节。"""

read_first = """
，还有装着交换双方逻辑的 <code>src/main.js</code>——分享方的标签页和读者的标签页是同一个文件——以及 <code>src/markdown.js</code>：这个渲染器处理的是线路另一头传来的文本，所以在输出任何东西之前先转义一切。服务器的全部源码是同一仓库里的 <code>workers/rendezvous/worker.js</code>：每个链接名一个房间，除了打开的连接什么都不持有。"""

howto_heading = "如何不向任何地方上传就分享文本与文件"

card = """
            文本与文件，经加密直连从浏览器到浏览器。哪里都不存；关掉标签页，分享即止。"""

[words]
plural = "分享的文本与文件"
choose = "一个链接名"
analytics_extra = """，以及这个工具分享的任何东西——文本、文件、它们的名字和大小、谁读过，一概不给"""

