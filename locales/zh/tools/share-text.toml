title = "在设备之间分享文本与文件&mdash;加密传输，不在服务器保存内容"
description = "从打开的浏览器加密分享文本与文件。默认直连，也可选择云中转。你可以逐一批准读者。"
og_title = "关掉标签页的那一刻，分享就结束了"
og_description = "从打开的浏览器加密分享文本与文件。默认直连，也可选择云中转。你可以逐一批准读者。"
og_image_alt = "从打开的浏览器加密分享文本与文件。默认直连，也可选择云中转。你可以逐一批准读者。"

pledge = "文本与文件在你的浏览器和每位读者之间加密。默认直连。选择云中转后，加密数据包会通过 Cloudflare，中转无法读取内容。引介服务只传输连接准备和可被发现的链接名，不接收文本或文件。我们不在服务器保存分享内容。关闭标签页会结束源端；读者收到结束通知或检测到连接故障后清空显示。已经保存的副本仍归读者。"

live_hint = "分享时打开开发者工具，查看网络面板。这个起始页面打开时，会为本地链接名建立一条通往引见服务器的 WebSocket。开始分享后会为连接协商再开一条；读者使用一条引介连接。无论你输入多少字、附上多少文件，这些连接都不会运送文字或文件。"

read_first = "，还有装着交换双方逻辑的 <code>src/main.js</code>——分享方的标签页和读者的标签页是同一个文件——以及 <code>src/markdown.js</code>：这个渲染器处理的是线路另一头传来的文本，所以在输出任何东西之前先转义一切。服务器的全部源码是同一仓库里的 <code>workers/rendezvous/worker.js</code>：每个链接名一个房间，除了打开的连接什么都不持有。额外的发现目录只保留开放连接上发布的链接名，从不保留文字或文件。"

howto_heading = "如何在浏览器之间分享文本与文件"

card = "从打开的浏览器加密分享文本与文件。默认直连，也可选择云中转。你可以逐一批准读者。"

