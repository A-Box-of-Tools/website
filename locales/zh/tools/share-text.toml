[[privacy]]
title = "你来选择加密连接的路径。"
body = "直连在浏览器之间传输内容，不经过中转。普通直连使用公共地址发现；局域网模式只接受主机候选地址。云中转通过 Cloudflare TURN 转发加密数据包，可连接不同网络上的设备。主机在开始前选择，邀请带上该选项，读者在连接前检查。直连绝不会自动切换。网络或浏览器限制仍可能阻止任一路径。"

[[privacy]]
title = "引见服务器是什么，以及它能看到的一切。"
body = "直连需要引介。这个起始页面会自动为可被发现的本地链接名建立一条通往引见服务器的 WebSocket；开始分享后会为分享本身再开一条。读者使用一条引介连接。服务器按链接名把读者和分享方对上，并转递几 KB 的连接协商。它不写入存储，房间和发现条目随开放连接结束。它能看到名称、连接时间、IP 地址和连接协商，看不到文字、文件、放行决定或私密介绍。目录只显示使用同一公网 IPv4 地址或 IPv6 子网的在线分享方所发布的名称。共享 VPN 或运营商共享地址可能包括其他网络；身边的设备若混用 IPv4 与 IPv6，或使用不同路径，也可能不出现在列表里。全部源码在仓库中。Cloudflare 保留七天连接日志：地址、链接名和时间，从不包含内容。"

[[privacy]]
title = "什么都不存，所以关标签页就是删除本身。"
body = """
分享只在你的标签页开着时存在。一关，新来的读者什么也找不到，正在读的人会看到自己的副本消失——不过别人之前复制或下载的东西归他，就像任何你亲手递出去的东西一样。你敲的草稿只放在你自己浏览器的存储里，好让下次还在，也只放在那里；勾上一次性，哪里都不放。"""

[[privacy]]
title = "链接名是地址，私密模式是那把锁。"
body = "知道或猜中名称的人能打开背后的分享。可被发现的本地分享会向使用同一公网 IPv4 地址或 IPv6 子网的其他浏览器显示名称，此时名称在这个群组内是公开的。敏感内容请保持私密开启。私密默认开启：每位读者通过加密直连通道介绍自己，你批准之前不会发送内容。"

[[privacy]]
title = "直连让两边看见彼此的地址。"
body = "直连会交换到达设备所需的网络地址。云中转使用中转候选地址，Cloudflare 能看到双方设备的网络地址及流量元数据。这不是匿名保证。请先检查上方的连接选项，再明确选择连接。"

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们谁也拿不到文本、文件、名字和大小、谁连接过。例外是这个页面自己的地址：读者的链接里带着链接名，广告脚本会读取这个地址。想保密的分享，应该打开私密开关。碰到内容的每一行代码都由本源提供，并且都在仓库里。"""

[[howto]]
title = "写下文本，或附上文件。"
body = """
编辑器就是分享本身：读者连上时里面是什么，他拿到的就是什么；此后每次修改都随着你的键入实时抵达已连接的读者。文件走同一条通道，每个最大 200&nbsp;MB；读者看到列表，只下载自己要的那份——没人的带宽会耗在不想要的文件上。"""

[[howto]]
title = "文本配得上排版，就打开 Markdown。"
body = """
就一个开关。标题、加粗、列表、代码、链接随着键入在编辑器旁边实时渲染；读者默认看到排好版的样子，还有一个切回原文的按钮。渲染器随页面一起送达并转义一切：无论谁写的，分享的文本都无法在读者的机器上变成脚本。"""

[[howto]]
title = "给链接起名，或者就用建议。"
body = "名称就是地址：<code>brave-otter-42</code> 可以隔着房间喊、在电话里念，也能从白板上抄。可被发现的本地分享会把名称列出来，所以敏感内容请保持私密开启。仅通过链接分享时，不易猜中的名称也有帮助。正在使用的名称会被拒绝，停止分享后便会重新空出来。"

[[howto]]
title = "决定放谁进来。"
body = """
私密是默认：每位读者都会被请自报家门——名字、暗号、任何你认得出的东西——你看到那条消息，旁边是“让他读”和“请回”两个按钮。自我介绍走直连通道，连引见服务器都不知道是谁敲的门。取消勾选就是公开分享，知道名字的谁都能读。"""

[[howto]]
title = "开始分享，别关标签页。"
body = """标签页就是服务器。要持续分享，请保持标签页开启、设备唤醒。隐藏页面不会主动断开正常的连接，但手机或休眠的电脑仍可能暂停浏览器。返回页面后，会尝试恢复同一分享。停止分享会结束会话，且不会自动重启。复制链接，或者直接告诉读者名称；读者可在本页地址末尾添加 <code>#name</code>。局域网模式请复制名称前带有 <code>?local=1</code> 的链接。若连接模式不同，必须由读者选择后才能更换模式。"""

[[howto]]
title = "在另一头：先同意，再敲门。"
body = """
打开链接的人会得知有人在分享，被告知直连会让双方看到彼此的网络地址，只有自己选择时才会连接。遇到私密分享，就自报家门等你放行。他拿到的内容随你的编辑实时变化，你关掉标签页就消失。"""

[[faq]]
q = "有任何东西被上传到任何地方吗？"
a = "文本与文件在你的浏览器和每位读者之间加密。默认直连。选择云中转后，加密数据包会通过 Cloudflare，中转无法读取内容。引介服务只传输连接准备和可被发现的链接名，不接收文本或文件。我们不在服务器保存分享内容。关闭标签页会结束源端；读者收到结束通知或检测到连接故障后清空显示。已经保存的副本仍归读者。Cloudflare 保留引介连接元数据七天；我们的应用不会记录分享内容。"

[[faq]]
q = "那这个工具为什么还要和服务器说话，偏偏还是在这个网站上？"
a = "因为两个浏览器不能自己找到彼此。引见服务器把输入 <code>brave-otter-42</code> 的人和用这个名称分享的人对上，并运送连接协商。本页的 <code>Content-Security-Policy</code> 里注明了它，源码在同一个仓库。它还向使用同一公网 IPv4 地址或 IPv6 子网的浏览器列出已发布的本地链接名。它不持有内容，读不了加密直连通道。"

[[faq]]
q = "那台服务器究竟能看到什么？"
a = "它能看到正在使用的链接名、分享方和读者的连接与离开时间、IP 地址和连接协商。发现列表按公网 IPv4 地址或 IPv6 子网，以及页面来源，把已发布的名称分组。它看不到文字、文件、文件名或大小、私密审批或自我介绍，这些都经过端到端加密的直连通道。Cloudflare 保留七天连接日志：链接名、地址和时间，从不包含内容。"

[[faq]]
q = "我关掉标签页会发生什么？"
a = """唯一的分享来源消失后，分享就会结束。读者页面在检测到结束或连接故障时清除显示的副本。停止分享会发送明确的结束通知；临时网络中断则可能触发有限次数的恢复尝试。服务器上没有副本可供删除。读者已经复制或下载的内容仍会保留。"""

[[faq]]
q = "读者能留下我分享的东西吗？"
a = """
        分享开着的时候，能——分享本来就是这么回事。读者可以复制文本、下载文件，拿走的就是他的了，和你用任何别的方式亲手交给他没有两样。结束分享保证的是未来：新来的人拿不到了，开着的页面也不再显示。没有工具能撤回已经送达的东西，这个页面不装作可以。"""

[[faq]]
q = "私密模式是什么？"
a = """
        就是默认。每位到来的读者都会得知分享是私密的，并被请自报家门；你看到那条消息——“是我，站会上的 Alice”——旁边是放行与请回的按钮，你拍板之前什么都不会发出。自我介绍走的是本就加密的直连通道，所以谁敲了门、你怎么决定，服务器永远不知道。分享前取消勾选，就是公开分享。"""

[[faq]]
q = "为什么读者会看到我的 IP 地址？"
a = "直连会交换到达设备所需的网络地址。云中转使用中转候选地址，Cloudflare 能看到双方设备的网络地址及流量元数据。这不是匿名保证。请先检查上方的连接选项，再明确选择连接。"

[[faq]]
q = "文件能有多大，速度怎么样？"
a = "每个文件最大 200&nbsp;MB。速度取决于双方设备及网络路径。直连可利用局域网速度；云中转还取决于互联网带宽和服务限制。文件仅按读者请求传输。"

[[faq]]
q = "离线能用吗？"
a = "页面保存后，编辑器可离线使用：你可以写字、渲染 Markdown 和保留草稿。分享时，两台设备都需要互联网，让引见服务连接两个浏览器。保存页面并不提供离线配对。局域网模式仍需这一步引见，尽管内容直接在浏览器之间传送。"

[[faq]]
q = "要是我们连不上呢？"
a = "请检查两台设备的互联网连接。局域网模式需要 Wi-Fi 或以太网允许设备互通。直连失败时，主机可以停止分享，选择云中转，重新开始并发送新邀请。读者连接前会检查该选项。正在进行的直连分享绝不会自动切换。受管理的设备或严格网络也可能阻止中转。"

[[faq]]
q = "谁都能分享任何东西，渲染 Markdown 还安全吗？"
a = """
        这个问题正是渲染器是本页源码里的八十行、而不是一个库的原因。任何标签产出之前，每个字符都先被转义；能产出的只有一组固定的无害标签；链接只认 <code>http</code>、<code>https</code> 和 <code>mailto</code>——<code>javascript:</code> 链接只会留成一行死文本。无论谁写的，分享的文本都无法在你的机器上变成脚本，而那八十行你自己就能读。"""

[[faq]]
q = "两个人能用同一个名字分享吗？"
a = """
        不能同时。每个名字只有一个活着的分享，由引见服务器强制执行：后来的会被拒绝，请他另选名字。分享一结束，名字立刻空出——这也意味着存下来的链接只和背后的分享一样新鲜：同一个名字，下周可能属于别人。把链接当成属于某个时刻的东西，而不是属于某个人的。"""

[[faq]]
q = "免费吗？要账号吗？"
a = """
        免费；没有账号，没有注册，也没有值得一提的限制——每次分享最多十六位读者同时在线。网站靠广告维持；广告拿不到这个页面分享的任何东西，而引见服务器恰恰因为什么都不存、几乎什么都不做，才轻轻松松待在免费套餐里。"""

[[faq]]
q = "能通过局域网分享文件吗？"
a = "能。开始前选择“局域网——不使用互联网中转”，把两台设备连到同一 Wi-Fi 或以太网，再把链接复制给读者。链接会带上模式；读者若使用了不同模式，必须明确选择后才能按分享方的模式重试。引介浏览器仍需要互联网。此模式不使用公共地址发现，也绝不切换到互联网中转。VPN 或浏览器网络策略可能改变路径或阻止连接；这个设置不能证明字节一直留在某栋建筑里。私密审批仍默认开启，每个文件的上限仍是 200&nbsp;MB。一次分享最多可以附上 256 个文件。此模式默认开启可被发现：另一个浏览器打开起始页面，就能从这条连接的列表中选择你的名称。取消可被发现，只通过链接分享。在共享网络上请保持私密开启。"

[[faq]]
q = "列表如何找到本地分享？"
a = "列表按公网 IPv4 地址或 IPv6 子网以及页面来源对分享分组，并不证明物理距离。共享网关或 VPN 可能包括陌生人，也可能隐藏附近设备。需要互联网。只有开启发现的局域网直连分享或云中转分享会出现。可用时，可被发现默认选中；只想通过链接分享时请取消，在共享网络上请保持私密开启。选择名称只会打开同意页面，不会自动连接或绕过批准。"

