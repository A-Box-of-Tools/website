[[privacy]]
title = "内容只去往你的读者，不去任何别处。"
body = """
文本和文件走 WebRTC 数据通道：你的浏览器与每位读者的浏览器之间一条直连的、DTLS 加密的连接。这条路上没有服务器。同一网络里，字节甚至出不了这栋楼——同一 Wi-Fi 下的两台笔记本，一切都在本地交接。"""

[[privacy]]
title = "引见服务器是什么，以及它能看到的一切。"
body = """
直连需要引见，所以这个页面——全站仅此一页——向我们的一台服务器开一条 WebSocket。它把输入链接名的人和用这个名字分享的人对上，转递几 KB 的协商，然后什么都不留：从不写入存储，分享方一断开，房间就不复存在。它能看到：某个名字正在使用、谁何时来去、IP 地址。它看不到：文本、文件、谁被放行、谁写了什么——连私密分享的敲门都走加密直连通道。它的全部源码就在仓库里，与这个工具的源码相邻。"""

[[privacy]]
title = "什么都不存，所以关标签页就是删除本身。"
body = """
分享只在你的标签页开着时存在。一关，新来的读者什么也找不到，正在读的人会看到自己的副本消失——不过别人之前复制或下载的东西归他，就像任何你亲手递出去的东西一样。你敲的草稿只放在你自己浏览器的存储里，好让下次还在，也只放在那里；勾上一次性，哪里都不放。"""

[[privacy]]
title = "链接名是唯一的秘密，私密模式是那把锁。"
body = """
知道或猜中名字的人，就能打开背后的分享。所以建议名是三个随机词，所以敏感内容值得一个猜不中的名字——或者用默认就开着的私密开关：每位到来的读者都得经直连通道自报家门，你放行之前什么也不会发出。"""

[[privacy]]
title = "直连让两边看见彼此的地址。"
body = """
点对点就是这个意思，而读者在事情发生前就会知道：打开分享链接只是问引见服务器有没有人在分享；然后页面明说，连接会让双方看到彼此的 IP 地址，并等待一次点击。在那次点击之前，分享方连读者存在都不知道。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们谁也拿不到文本、文件、名字和大小、谁连接过。例外是这个页面自己的地址：读者的链接里带着链接名，广告脚本会读取这个地址。想保密的分享，应该打开私密开关。碰到内容的每一行代码都由本源提供，并且都在仓库里。"""

[[howto]]
title = "写下文本，或附上文件。"
body = """
编辑器就是分享本身：读者连上时里面是什么，他拿到的就是什么；此后每次修改都随着你的键入实时抵达已连接的读者。文件走同一条通道，每个最大 200&nbsp;MB；读者看到列表，只下载自己要的那份——没人的带宽会耗在不想要的文件上。"""

[[howto]]
title = "文本配得上排版，就打开 Markdown。"
body = """
就一个开关。标题、加粗、列表、代码、链接随着键入在编辑器旁边实时渲染；读者默认看到排好版的样子，还有一个切回原文的按钮。渲染器随页面一起送达并转义一切：无论谁写的，分享的文本都无法在读者的机器上变成脚本。"""

[[howto]]
title = "给链接起名，或者就用建议。"
body = """
名字就是地址：<code>brave-otter-42</code> 可以隔着房间喊、在电话里念、从白板上抄。它也是唯一的秘密：私密的东西要么起个没人猜得到的名字，要么靠私密开关。别人正用着的名字会被拒绝；你一停，你的名字就重新空出来。"""

[[howto]]
title = "决定放谁进来。"
body = """
私密是默认：每位读者都会被请自报家门——名字、暗号、任何你认得出的东西——你看到那条消息，旁边是“让他读”和“请回”两个按钮。自我介绍走直连通道，连引见服务器都不知道是谁敲的门。取消勾选就是公开分享，知道名字的谁都能读。"""

[[howto]]
title = "开始分享，别关标签页。"
body = """
标签页就是服务器：它开着、醒着，分享就在；多一刻都没有。合上笔记本盖子同样会终结它。复制链接，或者干脆把名字说出去——读者在本页地址末尾敲上 <code>#名字</code> 就行。"""

[[howto]]
title = "在另一头：先同意，再敲门。"
body = """
打开链接的人会得知有人在分享，被告知直连会让双方看到彼此的网络地址，只有自己选择时才会连接。遇到私密分享，就自报家门等你放行。他拿到的内容随你的编辑实时变化，你关掉标签页就消失。"""

[[faq]]
q = "有任何东西被上传到任何地方吗？"
a = """
        没有。文本和文件经加密 WebRTC 通道，从你的浏览器直达每位读者的浏览器。唯一牵涉的服务器只运送引见——几 KB 的连接协商——从不运送内容。它那里没有可泄露、可调取、可丢失的东西：你的字节它一个都不拿，你一断开，房间就不复存在。"""

[[faq]]
q = "那这个工具为什么还要和服务器说话，偏偏还是在这个网站上？"
a = """
        因为两个浏览器无法自己找到彼此：必须有个东西把输入 <code>brave-otter-42</code> 的人和用这个名字分享的人对上，并在两者之间传递连接提议。这个东西就是引见服务器，本页唯一的网络依赖，名字写在它的 <code>Content-Security-Policy</code> 里，和页面发布在同一个仓库。它是能干成这件事的最小服务器：什么都不存，什么都不读，两个浏览器一握上直连通道就退到一边。"""

[[faq]]
q = "那台服务器究竟能看到什么？"
a = """
        某个链接名正在使用、分享方和读者何时连接何时离开、他们的 IP 地址，以及双方交换的加密连接握手。看不到文本，看不到文件，看不到名字和大小，看不到私密分享里谁被放行，也看不到谁在自我介绍里写了什么——这一切都走端到端加密的直连通道，根本不经过服务器。"""

[[faq]]
q = "我关掉标签页会发生什么？"
a = """
        分享在所有地方同时结束。链接一两秒内失效；页面还开着的读者会看到自己的副本消失，附一句分享已结束的提示。这不是向哪台服务器提交删除申请——根本不存在要删的服务器副本。标签页是分享存在过的唯一地方，关掉它就是全部的收尾。"""

[[faq]]
q = "读者能留下我分享的东西吗？"
a = """
        分享开着的时候，能——分享本来就是这么回事。读者可以复制文本、下载文件，拿走的就是他的了，和你用任何别的方式亲手交给他没有两样。结束分享保证的是未来：新来的人拿不到了，开着的页面也不再显示。没有工具能撤回已经送达的东西，这个页面不装作可以。"""

[[faq]]
q = "私密模式是什么？"
a = """
        就是默认。每位到来的读者都会得知分享是私密的，并被请自报家门；你看到那条消息——“是我，站会上的 Alice”——旁边是放行与请回的按钮，你拍板之前什么都不会发出。自我介绍走的是本就加密的直连通道，所以谁敲了门、你怎么决定，服务器永远不知道。分享前取消勾选，就是公开分享。"""

[[faq]]
q = "为什么读者会看到我的 IP 地址？"
a = """
        因为连接是货真价实的直连，而直连跑在两个地址之间：每一端必然知道另一端，跟打电话一个道理。读者在任何连接存在之前就被提醒，只有自己选择时才连接；在那之前，你甚至不知道他打开过链接。如果这笔交换不适合某次分享，替代方案是经服务器中转的服务——交换的方向正好相反。"""

[[faq]]
q = "文件能有多大，速度怎么样？"
a = """
        每个文件最大 200&nbsp;MB，类型不限；速度就是两条连接里较慢的那条——中间没有服务器来限速或计量。同一 Wi-Fi 下的两台机器按局域网速度传，字节出不了这栋楼。读者按需取件，所以附上大文件不花任何代价，直到真有人来要。"""

[[faq]]
q = "离线能用吗？"
a = """
        老实说：一半。编辑器能——页面照常加载，草稿还在，Markdown 照常渲染，写和保存完全不需要网络。分享不能，也不可能：够到另一个人的浏览器本身就是网络行为，引见还得靠引见服务器。这是本站唯一一个任务在离线时根本不可能完成的工具，暗示别的说法都是不诚实。"""

[[faq]]
q = "要是我们连不上呢？"
a = """
        大多数浏览器对经引见后都能直连；少数不行，通常是两头都躲在最严苛的公司网或移动网络后面。这个页面不会悄悄退回到中转服务器——那会不声不响地改变这个工具是什么——而是二十秒后明说直连没有建立。换个网络再试，多半就好了。"""

[[faq]]
q = "谁都能分享任何东西，渲染 Markdown 还安全吗？"
a = """
        这个问题正是渲染器是本页源码里的八十行、而不是一个库的原因。任何标签产出之前，每个字符都先被转义；能产出的只有一组固定的无害标签；链接只认 <code>http</code>、<code>https</code> 和 <code>mailto</code>——<code>javascript:</code> 链接只会留成一行死文本。无论谁写的，分享的文本都无法在你的机器上变成脚本，而那八十行你自己就能读。"""

[[faq]]
q = "两个人能用同一个名字分享吗？"
a = """
        不能同时。每个名字只有一个活着的分享，由引见服务器强制执行：后来的会被拒绝，请他另选名字。分享一结束，名字立刻空出——这也意味着存下来的链接只和背后的分享一样新鲜：同一个名字，下周可能属于别人。把链接当成属于某个时刻的东西，而不是属于某个人的。"""

[[faq]]
q = "免费吗？要账号吗？"
a = """
        免费；没有账号，没有注册，也没有值得一提的限制——每次分享最多十六位读者同时在线。网站靠广告维持；广告拿不到这个页面分享的任何东西，而引见服务器恰恰因为什么都不存、几乎什么都不做，才轻轻松松待在免费套餐里。"""

