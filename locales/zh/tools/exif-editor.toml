[[howto]]
title = "想看的话，先看看里面有什么。"
body = "在列出全部标签之前，先有一份“值得知道”的清单：GPS 位置、各种时间戳、机身序列号。 JPEG、PNG 和 WebP 会列出这些块。AVIF 只显示提取到的 EXIF，不列出其他元数据。"

[[howto]]
title = "按“清除全部元数据”。"
body = "对于 JPEG、PNG 和 WebP: 对多数人来说，这一步就是全部。每一个标签，XMP 和 IPTC 块，注释，内嵌的缩略图，列表上所有照片一次全清。 AVIF 由浏览器解码并保存为新的 PNG，不复制原有元数据。这里可以查看提取到的 EXIF 标签，但无法编辑。PNG 可能更大，转换也可能改变颜色或 HDR 显示。原文件保持不变。"

[[howto]]
title = "也可以改，而不是删。"
body = "对于 JPEG、PNG 和 WebP: 改个日期、订正一行版权、把位置删掉而把拍摄参数留着，然后单独保存这一张。"

[[faq]]
q = "我的照片会传到什么地方去吗？"
a = """
        不会。读取、解析、重写，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有任何联网功能，不取东西，也不发东西。页面的 \
        <code>Content-Security-Policy</code> 把它可能联的地址全列了出来，\
        没有一个是本站的。"""

[[faq]]
q = "EXIF 是什么？照片里还藏着别的吗？"
a = "对于 JPEG、PNG 和 WebP: EXIF 是相机写在画面旁边的一堆标签：厂牌和型号、曝光参数、精确到秒的日期时间，常常还有 GPS 位置，有时候连机身序列号都在。照片往往还带着更多东西，修图软件留下的 XMP（一段 XML）、装着图说和署名字段的 IPTC 块、色彩配置文件、一份当缩略图用的小副本，还有厂商自己那套没有公开文档的 maker note。这些，这个工具全给你列出来。 JPEG、PNG 和 WebP 会列出这些块。AVIF 只显示提取到的 EXIF，不列出其他元数据。"

[[faq]]
q = "删元数据会让画质变差吗？"
a = "JPEG、PNG 和 WebP 清理只编辑容器，逐字节复制压缩后的图片数据，不解码或重新压缩。AVIF 清理则解码第一张图片，输出新的无损 PNG，不复制原有元数据。PNG 可能更大，浏览器解码也可能改变颜色或 HDR 表现。原文件保持不变。"

[[faq]]
q = "支持哪些格式？"
a = "JPEG、PNG 和 WebP 支持查看、编辑元数据以及容器内清理。AVIF 支持预览提取到的 EXIF，并转换为新的 PNG 来清理。AVIF 标签只读，其他元数据不会列出。动画 AVIF 仅使用第一张图片。HEIC 和独立 TIFF 可以识别，但不会重写。"

[[faq]]
q = "清完元数据，照片会不会躺倒？"
a = "对于 JPEG、PNG 和 WebP，保留方向选项会在需要时写入仅含方向标签的小型 EXIF 块。关闭此选项即可去除。AVIF 清理使用浏览器按正确方向解码的图片生成 PNG。方向和色彩配置文件选项仅适用于 JPEG、PNG 和 WebP。"

[[faq]]
q = "它会删掉 GPS 位置吗？"
a = "清理会去除 GPS 数据。JPEG、PNG 和 WebP 也可以仅删除位置并保留其余内容。AVIF 标签只读，PNG 转换不复制原有元数据。"

[[faq]]
q = "能改标签，而不是删掉吗？"
a = "JPEG、PNG 和 WebP 支持编辑和新增标签。重写厂商注记可能让厂商专用偏移失效，如有需要请保留原文件。AVIF 的 EXIF 只读，清理会生成不复制原有元数据的 PNG，而不会重写 AVIF 容器。"

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是这么来的，\
        广告拿不到关于你照片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把照片送出去处理的工具，拔线那一刻就停了。"""

