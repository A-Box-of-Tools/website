[[faq]]
q = "我的照片会被上传到什么地方吗？"
a = """
        不会。文件由你自己的浏览器、在你自己的硬件上读取、解析和重写。这个\
        工具没有任何形式的网络功能 &mdash; 它从不取任何东西，也从不发任何\
        东西 &mdash; 而页面的 <code>Content-Security-Policy</code> 列出了它\
        可能联系的每一个地址，其中没有一个属于本站。"""

[[faq]]
q = "EXIF 是什么，一张照片里还藏着什么别的？"
a = """
        EXIF 是相机写在画面旁边的一块标签：品牌和型号、曝光参数、精确到秒的\
        日期时间，常常还有一个 GPS 位置，有时还有一个序列号。照片里往往还有\
        更多东西 &mdash; 编辑软件写进去的一段 XMP 格式的 XML，一块装着图说和\
        署名字段的 IPTC，一份色彩配置，一份作为缩略图的小尺寸副本，以及一段\
        厂商自定义、没有公开文档的 maker note。这个工具会把它们全部列出来。"""

[[faq]]
q = "删掉元数据会降低图像质量吗？"
a = """
        不会，而这正是用这类工具、而不是把照片另存一遍的主要理由。元数据待在\
        压缩后画面外面的容器里，不在画面内部。删掉它，就是从一份清单里划掉\
        几项、再把清单写回去；压缩过的图像数据是逐字节复制过去的，所以结果\
        解码出来的像素和原来一模一样。没有任何东西被解码，也没有任何东西被\
        重新压缩。"""

[[faq]]
q = "它支持哪些文件格式？"
a = """
        JPEG、PNG 和 WebP。HEIC 和 AVIF 能被识别，但不会被重写：它们是由\
        嵌套原子搭起来的盒式格式，需要另一套解析器，所以工具会直说，而不是\
        给你一个坏文件。裸的 TIFF 也不处理，因为在 TIFF 里，元数据和像素是\
        由同一套偏移量寻址的。"""

[[faq]]
q = "删掉元数据以后，我的照片会不会变成横躺的？"
a = """
        有可能，所以为此有一个设置。手机通常按传感器看到的样子记录画面，再\
        加一个 Orientation 标签说明该怎么转。把那个标签删掉，有些看图软件就\
        会把照片横着显示。“保留方向标签”这个选项默认开着，它会写回一小块
        EXIF，里面除了那一个标签什么都没有 &mdash; 而且只在照片确实需要它的\
        时候才写。要是你宁可让文件一点 EXIF 都不带，把它关掉。"""

[[faq]]
q = "它会删掉 GPS 位置吗？"
a = """
        会。全部删除会把整个 GPS 目录一起删掉，你也可以只删位置、保留其余\
        部分。位置先以十进制度显示，因为“北纬 51 度 30 分 26 秒”看不出来\
        这张照片其实点名了拍摄时所在的那栋楼。"""

[[faq]]
q = "我能改一个标签，而不是删掉它吗？"
a = """
        能。文本标签、日期、ISO、方向和分辨率都可以编辑，还有几个常见标签\
        可以加到本来没有标签的照片上。有一点要注意：写文件时 EXIF 块会被\
        重建，而 maker note 里含有指向原来那一块的偏移量，所以重建之后的
        maker note，厂商自己的软件可能读不了。如果你在意这件事，就把它删掉，\
        或者干脆别编辑这个文件。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期。本站带广告，这就是它的\
        经费来源；广告拿不到任何关于你照片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的照片送出去处理的工具，在你拔线的那一刻\
        就会停下来。"""

