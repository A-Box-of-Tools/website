[[faq]]
q = "我的照片会传到什么地方去吗？"
a = """
        不会。读取、解析、重写，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有任何联网功能，不取东西，也不发东西。页面的\
        <code>Content-Security-Policy</code> 把它可能联的地址全列了出来，\
        没有一个是本站的。"""

[[faq]]
q = "EXIF 是什么？照片里还藏着别的吗？"
a = """
        EXIF 是相机写在画面旁边的一堆标签：厂牌和型号、曝光参数、精确到秒的\
        日期时间，常常还有 GPS 位置，有时候连机身序列号都在。照片往往还带着\
        更多东西，修图软件留下的 XMP（一段 XML）、装着图说和署名字段的 IPTC
        块、色彩配置文件、一份当缩略图用的小副本，还有厂商自己那套没有公开\
        文档的 maker note。这些，这个工具全给你列出来。"""

[[faq]]
q = "删元数据会让画质变差吗？"
a = """
        不会。这也正是该用这类工具、而不是把照片另存一遍的主要理由。元数据待\
        在压缩画面外面的容器里，不在画面里面。删它，等于从一张清单上划掉几项\
        再把清单写回去，压缩后的图像数据逐字节照抄过去，所以结果解码出来的\
        像素跟原来一模一样。全程不解码，也不重新压缩。"""

[[faq]]
q = "支持哪些格式？"
a = """
        JPEG、PNG 和 WebP。HEIC 和 AVIF 认得出来，但不重写：它们是嵌套原子\
        搭起来的盒式格式，得换一套解析器，所以工具直说做不了，而不是给你一个\
        坏文件。裸 TIFF 也不做，因为 TIFF 里元数据和像素用的是同一套偏移量。"""

[[faq]]
q = "清完元数据，照片会不会躺倒？"
a = """
        有可能，所以专门留了个开关。手机一般按传感器看到的样子存画面，另外加\
        一个方向标签说明该往哪边转。这个标签一删，有些看图软件就把照片横过来\
        显示。“保留方向标签”默认是开的，开着的时候会写回一个极小的 EXIF 块，\
        里面只有这一个标签，而且只在照片确实需要的时候才写。你要是宁可文件里\
        一点 EXIF 都不剩，把它关掉。"""

[[faq]]
q = "它会删掉 GPS 位置吗？"
a = """
        会。全清会把整个 GPS 目录一起带走，你也可以只删位置、别的都留着。位置\
        先按十进制度显示，因为“北纬 51 度 30 分 26 秒”这种写法，看不出一张照片\
        其实点名了它是在哪栋楼里拍的。"""

[[faq]]
q = "能改标签，而不是删掉吗？"
a = """
        能。文字类标签、日期、ISO、方向和分辨率都能改，还有几个常用标签可以\
        给本来没有的照片补上。有一点要说在前头：写文件会重建整个 EXIF 块，而
        maker note 里存的是指向原来那个块的偏移量，重建之后，厂商自己的软件\
        可能就读不出它了。你要是在意这个，那就把它删掉，或者干脆不改这个文件。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是这么来的，\
        广告拿不到关于你照片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把照片送出去处理的工具，拔线那一刻就停了。"""

