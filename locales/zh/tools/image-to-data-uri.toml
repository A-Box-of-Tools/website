[[howto]]
title = "选好你的图片。"
body = """\
      拖到下面的方框里，或者点开自己挑。浏览器直接从你的硬盘上读，整个过程\
      没有东西被送去别处。"""

[[howto]]
title = "说明结果要用在哪儿。"
body = """\
      只要 URI，还是要一条 CSS 规则、一个自定义属性、一个\
      <code>&lt;img&gt;</code> 标签，或者 Markdown。每一种都会给 URI 加上\
      引号，而正是这个细节决定了内联的 SVG 是能用，还是悄无声息地不能用。"""

[[howto]]
title = "看清它花了多少。"
body = """\
      每个结果都会说明它变成了多少个字符、比原文件大了多少，以及这个体积\
      值不值得内联。base64 会多出三分之一，这三分之一换不换得回一次省下的\
