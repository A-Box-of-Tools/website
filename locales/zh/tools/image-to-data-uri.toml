[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      <code>src/</code> 里找不到 <code>fetch</code>，找不到\
      <code>XMLHttpRequest</code>，也找不到 <code>sendBeacon</code>。编码用的\
      是 <code>btoa</code> 和 <code>encodeURIComponent</code>，浏览器从一开始\
