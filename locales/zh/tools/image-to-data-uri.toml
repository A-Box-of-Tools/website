      服务器参与 &mdash; 而如果它显示不出来，页面会照实说，而不是把一个坏\
      东西塞给你。"""

[[privacy]]
title = "元数据提醒是站在你这边的。"
body = """\
      data URI 是原样复制文件，所以一张照片的 GPS 定位会跟着它一起进到你的\
