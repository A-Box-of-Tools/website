[[faq]]
q = "我的图片会传到什么地方去吗？"
a = """
        不会。读取和编码都由你自己的浏览器在你自己的硬件上完成，用的是浏览器\
        早就有的两个函数。这个工具没有任何联网功能，不取东西，也不发东西。\
        页面的 <code>Content-Security-Policy</code> 把它可能联的地址全列了\
        出来，没有一个是本站的。"""

[[faq]]
q = "data URI 是什么？"
a = """
        一种把整个文件写在“本该写网址的地方”的办法。原来写\
        <code>url("logo.png")</code>，浏览器就得跑一趟去取；改写成\
        <code>url("data:image/png;base64,iVBORw0...")</code>，图片本身就在\
        这串字里，浏览器当场解出来。实际效果是少一次请求，图片跟着样式表或者\
        页面一起到，而不是等它们到了之后再去取。"""

[[faq]]
q = "为什么我的 SVG 没走 base64？"
a = """
        因为 base64 对它来说是错的编码。SVG 本身是文本，而网址本来就能装文本，\
        只有少数几个字符需要转义。把那几个转成百分号写法、别的原样留着，生成的
        URI 通常比同一个文件的 base64 短五分之一左右，而且在样式表里还看得懂，\
        元素名、颜色、<code>viewBox</code> 都还在，随手能改。个别工具链非要\
        <code>;base64</code> 不可，页面上有个勾选框可以强制。"""

[[faq]]
q = "base64 会让图片大多少？"
a = """
        大约三分之一。三个字节的文件变成四个字符的 base64，也就是 33%，前面还要\
        再加上 <code>data:image/png;base64,</code> 这一截。这是底线，躲不掉，\
        用网址允许的那些字符去表示任意字节，代价就是这么多。也正因如此，页面把\
        字符数摆在文件大小旁边，省得你等样式表都发布了才发现。"""

[[faq]]
q = "什么时候内联图片才真的划算？"
a = """
        又小又必须马上出现的时候。每个页面都要加载的样式表里放一个 2 KB 的图标，\
        这是明摆着的赚：少一次往返，CSS 一到图就在。过了大约 10 KB，这笔账就\
        翻过来了。内联进去的图片不再是一个独立文件，没法单独缓存，没法跟别的\
        东西并行下载，而且外面那个文件一改，它就得整个再下一遍。样式表里塞一张
        200 KB 的照片，等于给全站每个页面的关键路径都加了 200 KB。每个结果落在\
        界线的哪一边，页面会告诉你。"""

[[faq]]
q = "gzip 能把 base64 多出来的那部分压回去吗？"
a = """
        没大家想的那么灵。base64 编的要是本来就压过的文件，PNG、JPEG、WebP 都\
        是这种，压出来效果很差，因为里头几乎没有冗余留给压缩器去找了。通常也就\
        找回 base64 多出来那三分之一里的十分之一，绝不是全部。百分号编码的 SVG
        正好相反，它还是文本，压缩效果跟原来差不多，这也是不该给 SVG 上 base64
        的又一个理由。"""

[[faq]]
q = "这一步会动我的图片吗？"
a = """
        不会，而且这一点跟这里多数工具是刻意不同的。没有哪一步把它解码成像素\
        再编回去，从你硬盘上读出来的字节，就是进 URI 的那些字节。JPEG 还是原来\
        那个 JPEG，画质一样，尺寸一样。也正因为如此，结果可以说就是同一个文件，\
        而不是它的一份副本。"""

[[faq]]
q = "那 EXIF 和 GPS 也一起进样式表了？"
a = """
        是的，而这正是粘出去之前值得想一想的地方。因为什么都不重新编码，相机\
        写下的东西全都跟着画面走：位置、时间戳、机身序列号。手机照片里这些能\
        占到 30 KB，编成 base64 就是 40 KB 压在你页面的关键路径上，同时还把一个\
        家庭住址提交进了仓库。JPEG、PNG 和 WebP 里到底带了多少元数据，页面会读\
        出来告诉你。想先清干净，用<a href="../exif-editor/">EXIF 查看与清除</a>。"""

[[faq]]
q = "为什么它用的类型跟我的扩展名不一样？"
a = """
        因为扩展名可能是错的，字节不会。一个叫 <code>logo.png</code>、其实是按
        JPEG 导出的文件，常见到每个图片工具都得应付。而一个类型声明错了的 data
        URI 根本不显示，没有兜底，也没有一句值得看的报错。所以类型是从文件开头\
        那几个字节读出来的，这里涉及的每种格式，开头都说得毫不含糊。两边对不上\
        时，页面会告诉你。"""

[[faq]]
q = "预览是空白，哪儿出问题了？"
a = """
        多半不是 URI 的问题。HEIC 和 TIFF 都能生成完全合法的 data URI，可除了
        Safari 没有浏览器画得出来，所以你粘到哪儿它就在哪儿缺一块。先用\
        <a href="../compress-image/">图片压缩</a>或者\
        <a href="../resize-image/">图片缩放</a>转成 PNG、JPEG 或 WebP 再说。\
        要是格式本来就很普通，那多半是文件本身坏了：预览是拿这个页面生成的 URI
        画的，画不出来，就说明这张图没能解码。"""

[[faq]]
q = "data URI 有长度上限吗？"
a = """
        在 CSS 里和 <code>&lt;img&gt;</code> 标签里，你碰不到什么上限，现在的\
        浏览器在这两处基本没有实际限制。浏览器真正限制的是把 data URI 打进地址栏，\
        稍微长一点的现在多半直接拒绝，那是出于安全考虑，跟这里的用法没关系。真正\
        的限制是上面那条：早在技术上出问题之前，你这个页面已经比老老实实放张图\
        片更慢了。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小同样\
        没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上干的。\
        本站带广告，经费就是这么来的，广告拿不到关于你图片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图片送出去编码的工具，拔线那一刻就停了。"""

[schema]
description = "把 PNG、JPEG、SVG、WebP、GIF 或 ICO 转成能直接粘进 CSS 和 HTML 的 data URI。位图走 base64，SVG 走百分号编码，外面套好 CSS 规则、自定义属性、img 标签或者 Markdown，并报出体积代价和内嵌的元数据。全程在浏览器里跑，不上传。"
features = [
  "PNG、JPEG、WebP、GIF、ICO、AVIF 等格式的 base64 data URI",
  "SVG 走百分号编码，比 base64 短，而且在样式表里还看得懂",
  "现成的 CSS 规则、CSS 自定义属性、HTML img 标签或 Markdown，引号一律加对",
  "媒体类型从文件自己的字节里读，不看扩展名",
  "算出这次编码多花了多少字符，以及这么大内联进去值不值",
  "EXIF、XMP 或色彩配置文件即将被抄进样式表时，提前提醒",
  "逐字节复制文件，不重新编码，不掉画质",
  "支持批量，全部结果一次复制或者存成一个文件",
  "断网能用，不上传，不注册",
]

[picker]
title = "把图片拖到这儿"
hint = "或者点击选择，PNG、JPEG、SVG、WebP、GIF、ICO 等都行"
