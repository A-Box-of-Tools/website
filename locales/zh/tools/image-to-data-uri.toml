[[privacy]]
title = "你的图片没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集你文件的接口，代码里也没有任何一处\
      会去发送它们，哪怕真有这么个接口。"""

[[privacy]]
title = "这里没有任何东西会去取什么。"
body = """\
      <code>src/</code> 里没有 <code>fetch</code>，没有\
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。编码用的是\
      <code>btoa</code> 和 <code>encodeURIComponent</code> &mdash; 浏览器从\
      一开始就有的两个函数，它们接收字节、返回文本，哪儿也不去。"""

[[privacy]]
title = "预览本身就是证据。"
body = """\
      每个结果旁边那张图，是从这个页面刚刚拼出来的 data URI 画出来的，不是\
