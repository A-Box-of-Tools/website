[[howto]]
title = "看一眼那些提醒。"
body = """\
      图片带着 EXIF、色彩配置或者 XMP，它会被点名，并附上它在你结果里占了\
      多少字节。扩展名和实际格式对不上，页面会按实际格式来，并告诉你。你的\
      浏览器画不出这个结果，它也会说。"""

[[howto]]
title = "复制，或者下载。"
body = """\
      每个结果一个按钮，另外还有一个把全部一次拿走。自定义属性会包在一个\
      <code>:root</code> 块里出来，直接粘到样式表最上面就行。"""

[[faq]]
q = "我的图片会被传到什么地方去吗？"
a = """
        不会。读取和编码都由你自己的浏览器在你自己的硬件上完成，用的是浏览器\
        本来就有的两个函数。这个工具没有任何形式的网络功能，从不取什么，也\
        从不发什么，而页面的 <code>Content-Security-Policy</code> 把它可能\
        联系的地址全列了出来，其中没有一个属于本站。"""

[[faq]]
q = "data URI 是什么？"
a = """
        它是一种把整个文件写在本该放网址的位置上的写法。不写\
        <code>url("logo.png")</code> 让浏览器去取点什么，而是写\
        <code>url("data:image/png;base64,iVBORw0...")</code>，里面装的就是\
        图片本身，浏览器当场把它解出来。落到实处就是少一次请求，图片和样式表\
        或者页面一起到，而不是在它们之后才到。"""

[[faq]]
q = "我的 SVG 为什么不是 base64？"
a = """
        因为对它来说 base64 是错的编码。SVG 是文本，而 URL 本来就装得下文本，\
        只有少数几个字符需要转义。把这几个做百分号编码、其余原样留下，得到的
        URI 通常比同一个文件的 base64 短五分之一，而且你在样式表里还读得懂，\
        元素名、颜色和 <code>viewBox</code> 都还在那儿，随时可以改。碰上非要\
        base64 不可的工具链，有一个勾选框能强制用它。"""

[[faq]]
q = "base64 会让我的图片大多少？"
a = """
        大约三分之一。文件里三个字节变成四个 base64 字符，也就是 33%，这还没\
        算前面那段 <code>data:image/png;base64,</code>。这是下限，也躲不掉，\
        用 URL 允许的那些字符去写任意字节，代价就是这个。页面把字符数摆在\
        文件大小旁边，正是不想让你等样式表上线之后才发现。"""

[[faq]]
q = "什么时候内联一张图片才真的划算？"
a = """
        它很小、而且马上就要用的时候。每个页面都会加载的样式表里放一个 2 KB
        的图标，明显划算，少一次往返，CSS 一到位图片就在。过了大约 10 KB，\
        这笔账就反过来了。内联的图片不再是一个独立文件，没法单独缓存，没法\
        和别的东西并行下载，外面那个文件一变，它还得完整重新下载一遍。样式表\
        里一张 200 KB 的照片，等于给全站每个页面的关键路径上加了 200 KB。\
        页面会告诉你每个结果落在这条线的哪一边。"""

[[faq]]
q = "gzip 能把 base64 多出来的部分抵消掉吗？"
a = """
        比大家想的少得多。已经压过的文件，PNG、JPEG 和 WebP 都算，再做
        base64，压缩效果很差，因为压缩器几乎找不到剩下的冗余了。通常你能拿\
        回来的，只是 base64 多出的那三分之一里的十分之一左右，不是全部。\
        百分号编码的 SVG 恰好相反，它还是文本，压缩率跟之前差不多，这又是\
        一条不该给它上 base64 的理由。"""

[[faq]]
q = "这会不会改动我的图片？"
a = """
        不会，这也是它和这里大多数工具刻意不同的一点。没有任何东西被解码成\
        像素再编码一遍，从你硬盘上读出来的字节，就是进到 URI 里的字节。一个
        JPEG 还是原来那个 JPEG，质量一样，尺寸一样。正因为这样，结果算得上\
        是同一个文件，而不是它的一份副本。"""

[[faq]]
q = "那我的 EXIF 和 GPS 数据也会进到样式表里？"
a = """
        会，所以这正是粘贴之前值得想一想的地方。因为什么都不重新编码，相机\
        写下的一切都跟着图片走，位置、时间戳、相机的序列号。一张手机照片上\
        这可能占到 30 KB，落到你页面的关键路径上就是 40 KB 的 base64，而且\
        是一个即将提交进代码仓库的家庭住址。这个页面会读出 JPEG、PNG 或者
        WebP 里有多少元数据并告诉你。想先把它们拿掉，用\
        <a href="../exif-editor/">EXIF 查看与清除</a>。"""

[[faq]]
q = "它为什么用了和我文件扩展名不一样的类型？"
a = """
        因为扩展名可能是错的，字节不会。一个名叫 <code>logo.png</code>、其实\
        按 JPEG 导出的文件常见到每个图片工具都得应付，而一个声明了错误类型的
        data URI 干脆画不出来，既没有回退，也没有一条值得一读的报错。所以\
        类型是从文件开头那几个字节读出来的，这里涉及的每一种格式里，那几个\
        字节都说得毫不含糊，两者对不上时，页面会告诉你。"""

[[faq]]
q = "预览是空白的，出什么问题了？"
a = """
        多半不是 URI 的问题。HEIC 和 TIFF 都能生成完全合法的 data URI，但除了
        Safari 没有哪个浏览器画得出来，所以你粘到哪儿它都是缺的，先用\
        <a href="../compress-image/">图片压缩</a>或者\
        <a href="../resize-image/">图片缩放</a>把它转成 PNG、JPEG 或 WebP。\
        格式很普通却还是空白，那多半是文件本身坏了，预览是拿这个页面拼出来\
        的 URI 画的，画不出来就说明画面没能解码。"""

[[faq]]
q = "data URI 有大小上限吗？"
a = """
        在 CSS 里和 <code>&lt;img&gt;</code> 标签里，你碰不到上限，现代浏览器\
        在那儿没有什么实际的封顶。浏览器确实限制的是往地址栏里输入 data URI，\
        现在大多数浏览器对稍微复杂一点的都会拒绝，理由是安全，跟这里的用法\
        无关。真正的限制还是上一条，远在任何技术上的东西崩掉之前，那个页面\
        就已经比用普通图片文件时更慢了。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小\
        同样没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上\
        干的。本站带广告，经费就是从那儿来的，广告拿不到任何关于你图片的\
        信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的图片送出去编码，拔线那一刻就停了。"""

[schema]
description = "把 PNG、JPEG、SVG、WebP、GIF 或 ICO 转成能直接粘进 CSS 或 HTML 的 data URI。位图用 base64，SVG 用百分号编码，外面配好 CSS 规则、自定义属性、img 标签或 Markdown，并报告体积代价和内嵌的元数据。全程在浏览器里运行，不上传。"
features = [
  "为 PNG、JPEG、WebP、GIF、ICO、AVIF 等生成 base64 data URI",
  "为 SVG 生成百分号编码的 data URI，比 base64 更短，而且还读得懂",
  "现成的 CSS 规则、CSS 自定义属性、HTML img 标签或 Markdown，引号永远加对",
  "媒体类型从文件自己的字节里读，不看扩展名",
  "说明这次编码花了多少字符，以及这个体积值不值得内联",
  "当 EXIF、XMP 或色彩配置即将被复制进你的样式表时给出提醒",
  "逐字节复制文件，不重新编码，不损失质量",
  "支持批量，全部内容可以一次复制或下载成一个文件",
  "断网可用，不上传，不注册",
]

[picker]
title = "把图片拖到这里"
hint = "或者点击选择，PNG、JPEG、SVG、WebP、GIF、ICO 等等"
