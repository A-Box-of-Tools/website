[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。它们没有\
      一个被交给过任何关于你图片的信息。每一行读取或编码文件的代码，都由\
      这个源提供，也都列在仓库里。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个工具毫无变化，因为它里面从来就没有过一个联网的步骤。\
      这是所有证明里最简单的一个。"""

[[howto]]
title = "选择你的图片。"
body = """\
      把它们拖到选择框上，或者手动挑。浏览器直接从你的硬盘上读它们；这个\
      过程中没有任何东西被送去哪里。"""

[[howto]]
title = "说明结果要用在哪儿。"
body = """\
      光要 URI，还是要一条 CSS 规则、一个自定义属性、一个\
      <code>&lt;img&gt;</code> 标签，或者 Markdown。每一种都会给 URI 加上\
      引号，而正是这个细节决定了一个内联的 SVG 是能用，还是悄无声息地不能用。"""

[[howto]]
title = "看清它花了多少。"
body = """\
      每个结果都会说明它变成了多少个字符、比原文件大了多少，以及这个体积的\
      东西值不值得内联。base64 会多出三分之一；这三分之一换不换得回一次\
      省下的请求，完全取决于体积，所以页面会告诉你你落在这条线的哪一边。"""

[[howto]]
title = "看一眼那些提醒。"
body = """\
      如果图片带着 EXIF、色彩配置或 XMP，它会被点名，并附上它占了你结果里\
      多少字节。如果扩展名和实际格式对不上，页面会按实际格式来，并告诉你。\
      如果你的浏览器画不出这个结果，它也会说。"""

[[howto]]
title = "复制，或者下载。"
body = """\
      每个结果一个按钮，还有一个把全部一次拿走 &mdash; 自定义属性会被包在\
      一个 <code>:root</code> 块里出来，可以直接粘到样式表最上面。"""

[[faq]]
q = "我的图片会被上传到什么地方吗？"
a = """
        不会。文件由你自己的浏览器、在你自己的硬件上读取和编码，用的是浏览器\
        本来就有的两个函数。这个工具没有任何形式的网络功能 &mdash; 它从不取\
        任何东西，也从不发任何东西 &mdash; 而页面的\
        <code>Content-Security-Policy</code> 列出了它可能联系的每一个地址，\
        其中没有一个属于本站。"""

[[faq]]
q = "data URI 是什么？"
a = """
        它是一种把整个文件写在本该放网址的位置上的写法。不写\
        <code>url("logo.png")</code> —— 那是让浏览器去取点什么 —— 而是写\
        <code>url("data:image/png;base64,iVBORw0...")</code>，里面装着图片\
        本身。浏览器当场把它解出来。实际效果是少一次请求：图片和样式表或者\
        页面一起到，而不是在它们之后才到。"""

[[faq]]
q = "我的 SVG 为什么不是 base64？"
a = """
        因为对它来说 base64 是错的编码。SVG 是文本，而 URL 本来就能装文本
        &mdash; 只有少数几个字符需要转义。把这几个做百分号编码、其余原样留下，\
        得到的 URI 通常比同一个文件的 base64 短五分之一，而且你在样式表里还\
        读得懂它：元素名、颜色和 <code>viewBox</code> 都还在那儿，随时可以改。\
        有一个勾选框可以强制用 base64，给那些非要不可的工具链。"""

[[faq]]
q = "base64 会让我的图片大多少？"
a = """
        大约三分之一。文件里三个字节变成四个 base64 字符，也就是 33%，这还\
        没算前面那段 <code>data:image/png;base64,</code>。这是下限，而且无法\
        避免：这就是用 URL 允许的那些字符去写任意字节所要付的代价。这也是\
        为什么页面会把字符数摆在文件大小旁边，而不是让你等样式表上线之后\
        才发现。"""

[[faq]]
q = "什么时候内联一张图片才真的划算？"
a = """
        当它很小、而且马上就要用的时候。一个每个页面都会加载的样式表里放一个
        2 KB 的图标，是明显划算的：少一次往返，而且 CSS 一到位图片就在。\
        过了大约 10 KB，这笔交易就反过来了。内联的图片不再是一个独立文件，\
        所以它没法被单独缓存，没法和别的东西并行下载，而且外面那个文件一变，\
        它就要被完整地重新下载一遍 &mdash; 样式表里一张 200 KB 的照片，就是\
        给全站每个页面的关键路径上加了 200 KB。页面会告诉你每个结果落在这条\
        线的哪一边。"""

[[faq]]
q = "gzip 能把 base64 多出来的部分抵消掉吗？"
a = """
        比大家想的要少。已经压过的文件 &mdash; PNG、JPEG 和 WebP 都是 &mdash;
        再做 base64，压缩效果很差，因为压缩器几乎找不到剩余的冗余了；通常你\
        能拿回来的只是 base64 多出的那三分之一里的十分之一左右，不是全部。\
        百分号编码的 SVG 恰好相反：它还是文本，所以压缩率和之前差不多，这\
        又是一条不该给它上 base64 的理由。"""

[[faq]]
q = "这会不会改动我的图片？"
a = """
        不会，而且这是和这里大多数工具刻意不同的一点。没有任何东西被解码成\
        像素再编码一遍：从你硬盘上读出来的字节，就是进到 URI 里的字节。\
        一个 JPEG 还是原来那个 JPEG，质量一样，尺寸一样。正因为如此，结果\
        可以说是同一个文件，而不是它的一份副本。"""

[[faq]]
q = "那我的 EXIF 和 GPS 数据也会进到样式表里？"
a = """
        会，而且这正是你在粘贴之前值得想一想的地方。因为什么都不重新编码，\
        相机写下的一切都跟着图片走：位置、时间戳、相机的序列号。在一张手机\
        照片上这可能占到文件的 30 KB，在你页面的关键路径上就变成 40 KB 的
        base64，而且是一个即将被提交进代码仓库的家庭住址。这个页面会读出
        JPEG、PNG 或 WebP 里有多少元数据并告诉你。想先把它们拿掉，用\
        <a href="../exif-editor/">EXIF 查看与清除</a>。"""

[[faq]]
q = "它为什么用了和我文件扩展名不一样的类型？"
a = """
        因为扩展名可能是错的，字节不会。一个名叫 <code>logo.png</code>、\
        其实是按 JPEG 导出的文件常见到每个图片工具都得应付，而一个声明了错误\
        类型的 data URI 干脆就画不出来 &mdash; 没有回退，也没有一条值得一读的\
        错误信息。所以类型是从文件开头那几个字节读出来的，这里涉及的每一种\
        格式里那几个字节都说得毫不含糊，而当两者不一致时，页面会告诉你。"""

[[faq]]
q = "预览是空白的，出什么问题了？"
a = """
        大概率不是 URI 的问题。HEIC 和 TIFF 都能生成完全合法的 data URI，\
        但除了 Safari 没有哪个浏览器画得出来，所以你粘到哪儿它都是缺的
        &mdash; 先用<a href="../compress-image/">图片压缩</a>或者\
        <a href="../resize-image/">图片缩放</a>把它转成 PNG、JPEG 或 WebP。\
        如果格式很普通，那多半是文件本身坏了：预览是从这个页面拼出来的 URI
        画的，画不出来就说明画面没能解码。"""

[[faq]]
q = "data URI 有大小上限吗？"
a = """
        在 CSS 里和 <code>&lt;img&gt;</code> 标签里，你碰不到一个上限；现代\
        浏览器在那儿没有什么实际的封顶。浏览器确实限制的是往地址栏里输入
        data URI，现在大多数浏览器对稍微复杂一点的都会拒绝，理由是安全，和\
        这里的用法无关。真正的限制是上面那条：远在任何技术上的东西崩掉之前，\
        那个页面就已经比用一个普通图片文件时更慢了。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。文件的数量和大小\
        也没有上限，因为没有一台服务器在为它们付钱 &mdash; 活是在你自己的\
        机器上干的。本站带广告，这就是它的经费来源；广告拿不到任何关于你图片\
        的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的图片送出去编码的工具，在你拔线的那一刻\
        就会停下来。"""

[schema]
description = "把 PNG、JPEG、SVG、WebP、GIF 或 ICO 转成可以直接粘进 CSS 或 HTML 的 data URI。位图用 base64，SVG 用百分号编码，外面配好 CSS 规则、自定义属性、img 标签或 Markdown，并报告体积代价和内嵌的元数据。全程在浏览器里运行，不上传。"
features = [
  "为 PNG、JPEG、WebP、GIF、ICO、AVIF 等生成 base64 data URI",
  "为 SVG 生成百分号编码的 data URI，比 base64 更短，而且还读得懂",
  "现成的 CSS 规则、CSS 自定义属性、HTML img 标签或 Markdown，引号永远加对",
  "媒体类型从文件自己的字节里读，不看扩展名",
  "说明这次编码花了多少字符，以及这个体积值不值得内联",
  "当 EXIF、XMP 或色彩配置即将被复制进你的样式表时给出提醒",
  "逐字节复制文件：不重新编码，不损失质量",
  "支持批量，全部内容可以一次复制或下载成一个文件",
  "断网可用；不上传，不注册",
]

[picker]
title = "把图片拖到这里"
hint = "或者点击选择 &mdash; PNG、JPEG、SVG、WebP、GIF、ICO 等等"
