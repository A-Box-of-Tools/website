description = "在浏览器里把音频倒放、变速（音高可跟随也可保持）、设定电平。视频里的音频同样适用。什么都不上传，结果写成 WAV，所以没有任何东西被重新编码。"
features = [
  "把一段音频精确地倒着放",
  "速度可在四分之一倍到四倍之间调整，音高可保持也可跟随",
  "提高或降低电平，或者归一化到刚好顶在满刻度之下",
  "从 MP4、MOV 或 WebM 里取出音频，完全不碰画面",
  "写出 16 位或 32 位浮点 WAV，流程里没有编码器",
  "断网可用，不上传，不注册，无水印",
]

