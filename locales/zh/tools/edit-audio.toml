[[faq]]
q = "我的音频会传到什么地方去吗？"
a = """
        不会。读取、编辑、写出，全由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器那一半，页面的 <code>Content-Security-Policy</code> 把它\
        可能联的地址全列了出来，没有一个是本站的。与其听我们说，不如拔掉网线，\
        照倒放一段试试。"""

[[faq]]
q = "能把视频里的声音抽出来吗？"
a = """
        能，在这儿这跟打开一个 MP3 是同一件事。丢一个 MP4、MOV 或者 WebM 进来，\
        只有音轨会被解码，画面根本不读，出来的是一个纯声音文件，里头没有视频。\
        想原样保存一段片子的声音也是这么办，什么设置都别动，直接按按钮。"""

[[faq]]
q = "变速会连音高一起变吗？"
a = """
        你不要求它就不变。“保持音高”的做法是把录音切成一段段大约五十毫秒、\
        彼此重叠的小窗，再把它们铺得密一点或者疏一点，每一段落在哪儿都挑在\
        波形接得上的位置，所以 1.5 倍速下一个人的嗓音还是那个嗓音。“跟着变”\
        走的是重采样，也就是磁带放快的那套，两倍速正好高一个八度。"""

[[faq]]
q = "为什么存成 WAV，不是 MP3？"
a = """
        因为没有哪个浏览器自带 MP3 编码器，而这个工具不肯把你的录音送去有\
        编码器的服务器。WAV 根本不需要编码器，它就是采样加前面四十四个字节的\
        文件头，所以它既是老实的选择，也是唯一不可能掉质量的选择。代价是文件\
        大，立体声大约一分钟十兆。播放器、手机、编辑软件都打得开，真要 MP3，\
        拿它转一个就是。"""

[[faq]]
q = "能打开哪些格式？"
a = """
        你的浏览器解得了的都行，实际上就是 MP3、WAV、FLAC、M4A 和 AAC、Ogg
        Vorbis 和 Opus，以及 MP4、M4V、MOV、WebM 视频里的音轨。打不开的还是\
        那张老名单：AVI、WMA，还有大多数 MKV。浏览器读不了的文件会被直接拒收\
        并说明原因，不会干到一半才崩。"""

[[faq]]
q = "调大音量会不会破音？"
a = """
        只有冲过满刻度才会，而页面在你动手之前就会提醒。数字音频有一道硬顶，\
        一个采样不可能比满刻度更响，超出去的部分会被压平在顶上，那就是破音的\
        声音。“提到最响”这一档不可能出这个问题，它先算出这段录音头顶还剩多少\
        空间，就用掉那么多。顶以下的操作只是乘法，别的什么都没发生，提 6 dB
        再降 6 dB，采样还回到原处。"""

[[faq]]
q = "倒放和变速会掉质量吗？"
a = """
        倒放不会，同样那些采样换个顺序出来，分毫不差。变速要动到每一个采样，\
        算的是数，不是复制。重采样这条路上有正经的滤波，所以放快不会把高音\
        折回来变成金属味的嗡响；变速不变调那条路上，每一段小窗都落在波形接得上\
        的位置，不是算到哪儿算哪儿。两条路都不重新编码，因为这里根本没有编码器\
        可用。"""

[[faq]]
q = "文件长度有限制吗？"
a = """
        工具里没设上限。真正的天花板是内存：整段录音一次性解码进这个页面，WAV
        也要在内存里拼好你才能下载，所以一小时的立体声大约需要不到一 GB 的\
        腾挪空间。四 GB 的 WAV 会被直接拒绝，因为这个格式自己的大小字段就\
        描述不了那么大的文件。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费\
        就是这么来的，广告拿不到关于你录音的任何信息。"""

