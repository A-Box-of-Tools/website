      上放给你听，然后直接交给你浏览器的下载。"""

[[faq]]
q = "我的音频会被上传到什么地方吗？"
a = """
        不会。它由你自己的浏览器、在你自己的硬件上读取、编辑和写出。这个工具\
        没有服务器端，而页面的 <code>Content-Security-Policy</code> 列出了它\
        可能联系的每一个地址 &mdash; 其中没有一个属于本站。与其听我们说，\
        不如拔掉网线，照样倒放一段试试。"""

[[faq]]
q = "我能把视频里的声音取出来吗？"
a = """
        能，而且在这里这跟打开一个 MP3 是同一件事。拖一个 MP4、MOV 或 WebM
        进来，只有它的音频轨会被解码：画面从头到尾没被读过，出来的是一个\
        没有视频的声音文件。这也是把一段片子的声音存下来、又完全不做编辑的\
        办法 &mdash; 什么设置都别动，直接按按钮。"""

[[faq]]
q = "改速度会不会改音高？"
a = """
        你要它改才会改。“保持音高”会把录音切成大约五十毫秒长、互相重叠的窗，\
        再把它们更密或更疏地放回去，每一个位置都挑在波形交界处对得上的地方
        &mdash; 1.5&times; 下人声还是那个人声。“让它跟着变”走的是重采样，\
        也就是把磁带放快的效果：两倍速正好高一个八度。"""

[[faq]]
q = "为什么它存成 WAV 而不是 MP3？"
a = """
        因为没有哪个浏览器自带 MP3 编码器，而这个工具拒绝把你的录音送到一台\
        有编码器的服务器上去。WAV 根本不需要编码器 &mdash; 它就是采样，前面\
        加一个四十四字节的文件头 &mdash; 所以它既是诚实的选项，也是唯一不会\
        损失质量的那个。它更大：立体声大约每分钟十兆。任何播放器、手机和\
        编辑软件都打得开，想要 MP3 的话，用它转一个就是了。"""

[[faq]]
q = "我能打开哪些格式？"
a = """
        凡是你浏览器解得了的都行，实际上就是 MP3、WAV、FLAC、M4A 和 AAC、
        Ogg Vorbis 和 Opus，以及 MP4、M4V、MOV 和 WebM 视频里的音频。落在\
        外面的还是别处那份短名单：AVI、WMA，以及大部分 MKV。这个浏览器读不了\
        的文件会被直接拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "把它调响会不会失真？"
a = """
        只有在你把它顶过满刻度时才会，而且页面会在你这么做之前告诉你。数字\
        音频有一条硬上限：一个采样不可能比满刻度更响，所以超过的部分会被压\
        在上限上，那听起来就是失真。“能多响就多响”这一档不可能出这种事
        &mdash; 它会算出这段录音还剩多少余量，然后正好用掉那么多。上限以下\
        的一切都只是乘法，别的没有：调高 6 dB 再调低 6 dB，采样回到出发的\
        地方。"""

[[faq]]
q = "倒放或者变速会损失质量吗？"
a = """
        倒放不会：同样的采样按另一个顺序出来，这是精确的。改速度会移动每一个\
        采样，所以那是算术，不是复制 &mdash; 重采样器一路上做了正经的滤波，\
        所以加速不会把高音折回来变成金属味的嗡嗡声，而伸缩器的窗是放在波形\
        对得上的地方，不是算到哪儿就放哪儿。两条路都不重新编码任何东西，\
        因为这里根本没有编码器可以拿来重新编码。"""

[[faq]]
q = "文件长度有上限吗？"
a = """
        工具本身没有内建上限。实际的天花板是内存：整段录音会被一次性解码进\
        这个页面，而 WAV 要在内存里拼出来你才能下载，所以一小时的立体声大约\
        需要不到一个 GB 的工作空间。四个 GB 的 WAV 会被直接拒绝，因为这个\
        格式自己的大小字段描述不了那么大。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。本站带广告，这就是\
        它的经费来源；广告拿不到任何关于你录音的信息。"""

