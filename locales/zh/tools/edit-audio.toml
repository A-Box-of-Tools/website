      断开网络，这个页面上的一切照常运转。这是最省事的一条证明。"""

[[howto]]
title = "选一个文件。"
body = """\
      把 MP3、WAV、FLAC、M4A、Ogg 或者 Opus 文件拖到下面的方框里，要的是\
      视频里的声音，那就拖个视频进来。浏览器直接从你的硬盘上读，整个过程\
