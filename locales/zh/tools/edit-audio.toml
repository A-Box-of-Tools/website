[[howto]]
title = "定速度。"
body = """\
      拖滑块、填一个倍数，或者按一下预设。然后决定音高怎么办。钉在原处，\
      用 1.5&times; 听讲座要的就是这个；让它跟着速度走，那是磁带的脾气，\
      人声也就跟着变高变低。"""

[[howto]]
title = "定电平。"
body = """\
      要么直接给一个以分贝计的变化量，要么让它把录音提到最响的那一瞬间刚好\
      顶在上限之下。你还没按按钮，页面就先告诉你那一瞬间会落在哪儿，你选的\
      设置要是会把它顶过满刻度，它也会提醒你。"""

[[howto]]
title = "保存。"
body = """\
      活是在你自己的硬件上干的，所以快慢看你的机器，不用排队。出来的是一个\
      WAV，也就是那些采样本身加一个文件头，先在页面上放给你听，然后直接交给\
      浏览器下载。"""

[[faq]]
q = "我的音频会被传到什么地方去吗？"
a = """
        不会。读取、编辑、写出，都由你自己的浏览器在你自己的硬件上完成。这个\
        工具没有服务器端，而页面的 <code>Content-Security-Policy</code> 把它\
        可能联系的地址全列了出来，其中没有一个属于本站。与其听我们说，不如\
        拔掉网线，照样倒放一段试试。"""

[[faq]]
q = "我能把视频里的声音取出来吗？"
a = """
        能，而且在这里，这跟打开一个 MP3 是同一件事。拖一个 MP4、MOV 或者
        WebM 进来，只有音频轨会被解码，画面从头到尾没被读过，出来的是一个\
        没有视频的声音文件。想把一段片子的声音存下来又不做任何编辑，也是这么\
        干，什么设置都别动，直接按按钮。"""

[[faq]]
q = "改速度会不会改音高？"
a = """
        你要它改才会改。选“保持音高”，录音会被切成大约五十毫秒长、互相重叠\
        的窗，再更密或更疏地放回去，每一个位置都挑在波形交界处对得上的地方，\
        所以 1.5&times; 下人声还是那个人声。选“让它跟着变”走的是重采样，也\
        就是把磁带放快的效果，两倍速正好高一个八度。"""

[[faq]]
q = "为什么它存成 WAV 而不是 MP3？"
a = """
        因为没有哪个浏览器自带 MP3 编码器，而这个工具拒绝把你的录音送到一台\
        有编码器的服务器上去。WAV 压根不需要编码器，它就是采样加一个四十四\
        字节的文件头，所以既是诚实的选项，也是唯一不会损失质量的那个。代价是\
        文件大，立体声大约每分钟十兆。任何播放器、手机和编辑软件都打得开，\
        想要 MP3，拿它转一个就是了。"""

[[faq]]
q = "我能打开哪些格式？"
a = """
        你浏览器解得了的都行，实际上就是 MP3、WAV、FLAC、M4A 和 AAC、
        Ogg Vorbis 和 Opus，以及 MP4、M4V、MOV 和 WebM 视频里的音频。落在\
        外面的还是别处那份短名单，AVI、WMA 和大部分 MKV。这个浏览器读不了的\
        文件会当场拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "把它调响会不会失真？"
a = """
        只有顶过满刻度才会，而且页面会赶在你这么做之前告诉你。数字音频有一条\
        硬上限，一个采样不可能比满刻度更响，超过的部分只能压在上限上，那听起来\
        就是失真。“能多响就多响”这一档出不了这种事，它会算出这段录音还剩多少\
        余量，然后正好用掉那么多。上限以下的一切都只是乘法，调高 6 dB 再调低
        6 dB，采样回到出发的地方。"""

[[faq]]
q = "倒放或者变速会损失质量吗？"
a = """
        倒放不会，同样的采样按另一个顺序出来，分毫不差。改速度会移动每一个\
        采样，那是算术，不是复制。重采样器一路上都做了正经的滤波，所以加速\
        不会把高音折回来变成金属味的嗡嗡声；伸缩器的窗也放在波形对得上的\
        地方，不是算到哪儿就放哪儿。两条路都不重新编码任何东西，因为这里根本\
        没有编码器可用。"""

[[faq]]
q = "文件长度有上限吗？"
a = """
        工具本身没有内建上限。真正的天花板是内存，整段录音要一次性解码进这个\
        页面，WAV 也得先在内存里拼出来你才能下载，所以一小时的立体声大约需要\
        不到一个 GB 的工作空间。四个 GB 的 WAV 会被直接拒绝，因为这个格式\
        自己的大小字段描述不了那么大。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你录音的信息。"""

