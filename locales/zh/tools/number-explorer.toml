#
# 数字探索器 - Simplified Chinese.
#
# Overrides for tools/number-explorer/tool.toml. Only words: the slug, the
# category, the icon and the list of shared parts stay where they are.
#
# Every figure here was carried over by value and not by word. A billion is
# 10 亿 and a trillion is 1 万亿. 兆 is avoided, because in mainland usage it is
# a million as often as it is a trillion, and the input box refuses it for the
# same reason.
#

name = "数字探索器"
heading = "数字探索器 <span class=\"h1-kw\">&mdash; 想象一百万、十亿，乃至更大的数</span>"
tagline = "输入任意一个数字，看着它长大：一摞书、一汪水、满天星星、一堆沙子、一次很长的计数。"

title = "看懂百万和亿：数字可视化工具——免费，可离线"
description = "看看一个数字到底有多大。它会长成一摞书、一汪水、满天星星和一堆沙子，也会变成数完它所要的时间，旁边是从珠穆朗玛峰到银河系的地标。免费，可离线使用。"
og_title = "10 亿长什么样？"
og_description = "把一个巨大的数字变成看得见的东西：书、水、星星、沙子和时间。假设都写得清清楚楚，不用 AI，也不用上传。"
og_image_alt = "数字探索器 - 把大数字画成书、水、星星、沙子和时间"

pledge = "一次比较就是一个数量、一个选定的参照物，再加一点算术，这些全都在这个页面里。没有要询问的 AI 服务，也没有要上传的输入。书、水、星星、沙子和计数时间各算各的，它们的假设就写在结果旁边，不藏在图后面。"
live_hint = "打开开发者工具的“网络”面板，改一改数字。计算器不发任何请求。把页面加载一次，断开网络，接着探索。"
read_first = "，数量解析、模型和地标阶梯看 <code>src/scale.js</code>，着色面积量的是什么看 <code>src/containers.js</code>，图像看 <code>src/stage.js</code> 和 <code>src/scene-*.js</code> 这几个文件，页面怎么串起来看 <code>src/main.js</code>。"
howto_heading = "怎么把一个大数字画出来"
card = "10 亿本书能叠多高？10 亿滴水有多少？输入任意一个数字，看着它长成书、水、星星、沙子和时间，假设一直摆在眼前。"

[words]
plural = "数字和比较结果"
choose = "一个数字"

[[facts]]
text = "可离线使用"
[[facts]]
text = "没有 AI 或 API 费用"
[[facts]]
text = "假设清楚"
[[facts]]
text = "可保存图片"
[[facts]]
text = "开源"

[[privacy]]
title = "计算器就在这个浏览器里运行。"
body = "工具的处理代码在本地计算结果、绘制图像，不会把任何输入或结果发给任何服务。Content-Security-Policy 限制连接目标，但不检查内容；你可以拿源代码和“网络”面板对照，或者断网使用计算器。"
[[privacy]]
title = "没有模型，也没有联网查询。"
body = "地标和公式都随页面下发。比较结果是对这份目录做算术得出的。来源链接只有在你想读时才会打开。"
[[privacy]]
title = "你输入的内容只留在页面里。"
body = "计算器不会把输入写进存储或地址栏。刷新页面就重新开始。保存下来的图片是你特意留在设备上的文件。"
[[privacy]]
title = "网站的其他脚本有各自的边界。"
body = "页面框架可能加载广告和统计脚本。计算器不会把你的输入或结果发给它们。实时网络面板会报告页面的连接。"

[[howto]]
title = "输入一个数字，或者拖动滑块。"
body = "试试 10 亿、1.5 亿或 1e12。可以输入 0 到 10³⁰ 的整数。滑块按 10 的幂移动，拖动时图像跟着变。"
[[howto]]
title = "选择书、水、星星、沙子或时间。"
body = "每一种都用不同的方式画同一个数字，并说明一个单位是什么。在书这一栏，每一个也可以是一个词或一个 AI 文本 token，这样数量就变成了一段文字的长度。"
[[howto]]
title = "看它长大，再做比较。"
body = "数字往上走，镜头就往后退。按 × 10 或“从 1 开始长大”再看一遍，再看看你的数字旁边的地标，每一个差了多少倍。猜猜多十倍能不能到下一个。"
[[howto]]
title = "核对假设，然后把图留下。"
body = "改一改书的厚度、水滴大小、沙粒直径或计数速度，看看每个地标的数字从哪儿来。把图保存成 PNG，假设就写在图下面。"

[[faq]]
q = "需要 AI 模型吗？"
a = "不需要。浏览器把你的数字放进一份小小的地标目录，自己算出结果。没有 API 密钥，不用下载模型，也没有持续的 AI 费用。"
[[faq]]
q = "10 亿本书能叠多高？"
a = "书厚 3 厘米时，约 3 万公里：比地球宽度的两倍还多，大约是到月球路程的 8%。要到月球，大约需要 130 亿本书。厚度可以在假设里修改。"
[[faq]]
q = "10 亿滴水有多少？"
a = "按滴管滴出的 0.05 毫升一滴算，是 5 万升：约 250 个 200 升的浴缸，或者一个奥运泳池的 2%。漏水龙头滴下的水滴更大，约 0.25 毫升，水量就是五倍。"
[[faq]]
q = "10 亿颗恒星是多少？"
a = "约占银河系的 1%，这里取 ESA 给出的 1000 亿颗这个整数，真实数字可能是它的好几倍。它也约是全天空不用望远镜能看到的 9100 颗恒星的 11 万倍。"
[[faq]]
q = "10 亿粒沙有多少？"
a = "按选定的模型，球形沙粒直径 0.5 毫米，容器里沙粒占 60%、空气占 40%，约 109 升，差不多是 11 个 10 升的水桶。真实的沙粒各不相同，所以这只是这些假设下的估算。"
[[faq]]
q = "100 万个 token 相当于多少本书？"
a = "对英文文本，按每个 token 约 0.75 个词粗略估算，约 75 万个词。按默认的每本书 7.5 万词，就是十本书，一摞约 30 厘米高。语言、分词方式和书的长度都会改变答案。这只是写作量的换算，不能证明真的读过或生成过这么多书。"
[[faq]]
q = "用的是哪座山？"
a = "一个特意定义的例子：高 1000 米、底面半径 1000 米的圆锥。体积是三分之一乘圆周率乘半径的平方乘高。真实的山要看它自己的形状，光凭高度算不出体积。"
[[faq]]
q = "能和地球上所有的沙子比吗？"
a = "这个版本不会编造一个全球沙粒的精确数字。要做这样的估算，得先划定范围，比如海滩或沙漠，再假定面积、深度和粒径。比较时请用这里定义好的容器和地标，它们的假设都能查。"
[[faq]]
q = "这些图是按实际比例画的吗？"
a = "书堆和它的地标共用一把真实的标尺，只是书堆细到快看不见时会画得比实际宽；时间轴也同样是真实的。水和沙不在同一把标尺上：容器只是示意，着色面积才是所标容器的真实占比。恒星在画得下时一个点一颗，多到画不下后，说明文字会告诉你每个点代表多少颗。"
[[faq]]
q = "可以关掉动画吗？"
a = "可以。“暂停动画”会让一切停下，把画好的图留在屏幕上。如果你的设备设置了减少动态效果，页面一开始就显示画好的图。"
[[faq]]
q = "这个工具能离线使用吗？"
a = "能。页面加载后，所有计算、比较、绘图和图片保存都不需要联网。不会为了处理而上传任何输入。"

[schema]
description = "在浏览器里把大数字变成一摞摞书、一汪汪水、满天星星、一堆堆沙子和计数时间。"
features = ["精确的整数输入，最大到 10^30", "按 10 的幂移动的滑块，配实时动画", "书堆用同一把真实的标尺，从桌子一直到可观测宇宙的边缘", "水和沙装进有名字的容器", "恒星从一个点到整个可观测宇宙", "真实时间轴上的计数时间", "词和 AI token 的写作量换算", "可调整书的厚度、水滴大小、沙粒大小和计数速度", "保存的图片带着假设", "支持减少动态效果", "不用 AI 模型，可离线使用"]
