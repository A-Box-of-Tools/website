heading = "SVG 转图片 <span class=\"h1-kw\">矢量图转 PNG、JPEG 或 WebP，尺寸随你定</span>"
tagline = "说个尺寸。矢量图本来就没有尺寸可丢。"

title = "SVG 转 PNG | 任意尺寸导出，不用上传"
description = "在浏览器里把 SVG 转成 PNG、JPEG 或 WebP，尺寸随你定。给宽度、给倍数，或者给一个框，还能顺手出 @2x 和 @3x。透明保住，什么都不上传。"
og_title = "不上传，也能把 SVG 变成任意尺寸的 PNG"
og_description = "矢量图自己没有像素尺寸，所以这个数字由你定，32 也好 8000 也好，一样锐利。全部在你自己的机器上完成。"
og_image_alt = "SVG 转图片 - 矢量图转 PNG、JPEG 或 WebP，尺寸随你定"

pledge = """
    光栅化用的，就是刚把这张图显示在你屏幕上的那个引擎。文件从你的硬盘上读进来，\
    根标签由 <code>src/svg.js</code> 里一百来行你能读的代码改写成你要的尺寸，\
    再画到浏览器自带的画布上。这个工具没有任何联网功能，不取东西，也不发东西。\
    就算真有，这个页面的另一头也没有服务器能接住一个 logo。"""

live_hint = """
      别信我们嘴上说的。打开开发者工具，盯着“网络”面板，转一张试试。没有一条\
      请求带着文件、缩略图、文件名，或者你选中内容里的任何一个字节。或者干脆\
      拔掉网线，照转不误。"""

read_first = """\
      ，<code>src/svg.js</code> 里是文件自身尺寸怎么读出来、根标签怎么改写，\
      <code>src/render.js</code> 里是干光栅化那八行，一个 &lt;img&gt;、一次 \
      <code>drawImage</code>、一次 <code>toBlob</code>，中间什么都没有。"""

howto_heading = "不上传怎么把 SVG 转成 PNG"

card = """
            SVG 自己没有像素尺寸，所以这个数字由你定，32 也好 8000 也好，\
            一样锐利。"""

[words]
plural = " SVG 文件"
choose = " SVG "

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "没有水印"

[[facts]]
text = "断网能用"

[[facts]]
text = "开源"

[[privacy]]
title = "你的图稿没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      整个 <code>src/</code> 里，一个 <code>fetch</code>、一个 \
      <code>XMLHttpRequest</code>、一个 <code>sendBeacon</code> 都找不到。\
      整个光栅化就是一个装着你自己文件 blob 的 <code>&lt;img&gt;</code>、\
      一次往画布上的 <code>drawImage</code>，再加一次 \
      <code>canvas.toBlob</code>。"""

[[privacy]]
title = "SVG 是文档，而这是它动弹不得的那种模式。"
body = """\
      一个 SVG 里可以装 <code>&lt;script&gt;</code>、装远程的 \
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>、装样式表和\
      网络字体。经由 <code>&lt;img&gt;</code> 绘制时，它处在规范所说的\
      <em>安全静态模式</em>：脚本不会跑，那些地址一个都不会去取。这是浏览器给\
      的保证，不是我们的承诺，也正因如此，这个页面才敢打开一个从没见过的文件，\
      而不用担心它偷偷往家里打电话。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      图稿的信息，一条都没给它们。读文件、定尺寸、画图的每一行代码都从本站\
      发出，也都摆在仓库里。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，这个工具跟原来一模一样，因为它本来就没有联网这一步。这是最\
      省事的一条证明。"""

[[howto]]
title = "选 SVG。"
body = """\
      拖一个到下面的方框里，或者挑一整个文件夹一次转完。浏览器直接从你的硬盘上\
      读，这期间没有东西发出去。每一行都写着这个文件认为自己有多大，而且会分清\
      这个尺寸是来自它的 <code>viewBox</code>，还是因为文件根本没声明尺寸而\
      替它假定的。"""

[[howto]]
title = "定多大。"
body = """\
      给个倍数最省事，整批处理时也最合适：每张图都从自己的尺寸出发去放大，所以\
      一套图标之间的比例关系不会乱。其他办法是给宽、给高、给最长边，或者给一个\
      两边都定死的框。这里填个大数字不像处理照片那样要付代价，因为图是按那个\
      尺寸重画一遍，不是硬拉过去的。"""

[[howto]]
title = "需要高分屏的那几份，就一起出了。"
body = """\
      手机和 Retina 笔记本每个 CSS 像素要画两到三个设备像素，所以一个 200 像素\
      的 logo，背后得垫一张 400 或者 600 像素的文件。勾上 <code>@2x</code> 和 \
      <code>@3x</code>，出来的文件名正是 Xcode、安卓工具链和 CSS
      <code>image-set()</code> 各自期待的那种，而且每一份都严格是第一份的两倍\
      或三倍，不是各自取整。"""

[[howto]]
title = "挑格式，顺便定透明怎么办。"
body = """\
      没有特别理由就用 PNG：无损，保得住透明，大片纯色在它里面压得也好。JPEG
      根本没有透明可言，所以不管你挑不挑，都会给它垫一个背景色，不垫的话每一个\
      透明像素都会变黑。WebP 两样都行，文件还更小，代价是老一点的软件读不了。"""

[[howto]]
title = "下载之前先看预览。"
body = """\
      预览由写文件的同一段代码、拿你的文件、在你的机器上画出来。一张图变成像素\
      时有两件事会变，而这两件在预览里都看得见：只有半个像素宽的发丝线会发灰，\
      文字则用这台电脑上有的字体来画，而不是从网上取一个。"""

[[howto]]
title = "把文件拿走。"
body = """\
      一个文件一个下载，或者整批打成一个 zip。名字跟着来源的 SVG 走，多出来的\
      那几份带 <code>@2x</code> 和 <code>@3x</code> 后缀。两个文件要是会重名，\
      会给它们编号，而不是让其中一个悄悄把另一个盖掉。"""

[[faq]]
q = "我的 SVG 会传到什么地方去吗？"
a = """
        不会。文件由你自己的浏览器在你自己的硬件上读进来，再由那个负责渲染你\
        看到的每一张图的引擎画到画布上，然后作为下载还给你。这个工具没有任何\
        联网功能，不取东西，也不发东西。页面的 \
        <code>Content-Security-Policy</code> 把它可能联的地址全列了出来，\
        没有一个是本站的。"""

[[faq]]
q = "SVG 该转成多大？"
a = """
        读它的那个东西要多大，就乘上它将要出现的那块屏幕的设备像素比。一个占
        200 CSS 像素的 logo，Retina 笔记本上要 400，近几年的手机上要 600，这里\
        的 <code>@2x</code> 和 <code>@3x</code> 就是干这个的。做应用图标或者\
        商店素材，那是商店给你一个确切数字，照着填。什么依据都没有的时候，最长边
        1024 是个好用的默认值，够大多数场合用，也还发得动邮件。"""

[[faq]]
q = "放大会掉画质吗？"
a = """
        不会。这也是唯一一处这个回答能老老实实说“不会”的地方。矢量图是指令，\
        不是像素，浏览器会按要的尺寸把曲线重画一遍。从一个 24 像素的图标出发画到
        4000 像素，跟 24 像素时一样锐利。反过来就不行了：一旦变成 PNG，它就跟\
        别的图一样是像素，所以要多大就直接按多大转，别转完再去缩放。"""

[[faq]]
q = "我的 SVG 没写宽高，出来是多大？"
a = """
        看 <code>viewBox</code>，有的话就用它。它的宽高是用户单位而不是像素，\
        但那是文件里仅有的数字，浏览器也就把它当成这张图的自然尺寸。要是连
        viewBox 都没有，页面会在那一行旁边标上<em>假定</em>，并按
        300&nbsp;&times;&nbsp;150 处理，一个 <code>&lt;img&gt;</code> 本来也是\
        这么画它的。哪种情况都不妨碍你自己指定尺寸，指定了就按那个画。"""

[[faq]]
q = "为什么 PNG 里的文字变了样？"
a = """
        因为字体不在 SVG 里。一个画文字的 SVG 只是点了字体的名字，剩下的交给机器\
        自己去找，而那种用 <code>@import</code> 从 Google Fonts 拉字体的文件，\
        在这儿什么都拉不到：经由 <code>&lt;img&gt;</code> 绘制的 SVG 不许取任何\
        东西，这跟拦住它偷偷把你文件送出去的是同一条规则。解决办法每个设计师都\
        知道：导出之前在绘图软件里把文字转成路径。转完它就是几何图形了，到哪儿\
        都长一个样。"""

[[faq]]
q = "能一次转好几个文件吗？"
a = """
        能。列表上每个 SVG 都按同一套设置渲染，整批打成一个 zip。整批处理时通常\
        该选倍数，比如“按文件自己声明的尺寸放大 4 倍”，因为这样每张图都是从自己\
        的尺寸出发，而不是被一起硬拽到同一个像素数上。点任意一行，就能把那张\
        换进预览。"""

[[faq]]
q = "有尺寸上限吗？"
a = """
        有，是浏览器的上限，不是我们的。画布过了每边 16384 像素左右就撑不住，\
        iPhone 和 iPad 上的 Safari 大约停在 1670 万像素的面积，也就是
        4096&nbsp;×&nbsp;4096。超过这个数，页面会先警告你，而不是甩给你一张空\
        白图，而空白正是浏览器撑不住时的表现：<code>toBlob</code> 什么都不返回，\
        连个说明原因的报错都没有。超过一亿像素的，工具直接拒绝，因为那还没编码\
        一个字节，画布本身就已经 400&nbsp;MB 了。"""

[[faq]]
q = "透明会怎么样？"
a = """
        PNG 和 WebP 都保住。JPEG 根本没有 alpha 通道，所以不管你要不要，都会在\
        整张图后面垫一层颜色，不垫的话所有透明的地方都会变黑，那看着像个 bug，\
        而不像 JPEG 该有的样子。选 PNG 时也想垫个背景色，同样是很正常的需求：\
        它会把图压平到那个颜色上，而不是留一个洞。"""

[[faq]]
q = "SVG 里带脚本或者外部图片，它能读吗？"
a = """
        能读，而且浏览器肯画的部分它都会画出来。经由 <code>&lt;img&gt;</code> \
        加载的 SVG 处在<em>安全静态模式</em>：脚本不跑，外部引用不取，动画也不\
        播，你拿到的是第一帧。所以一个里面引了远程 <code>&lt;image&gt;</code> \
        的文件，出来会缺那一块。那是浏览器替你拒掉的，也正因如此，这个页面才敢\
        放心打开一个从没见过的文件。"""

[[faq]]
q = "这个跟图片缩放有什么区别？"
a = """
        区别在源头。<a href="../resize-image/">图片缩放</a>从像素出发，JPEG 或者
        PNG，所以放大就得编造本来不存在的细节。这个从一张图纸出发，没什么可编造，\
        也没有值得操心的上限。你手上是 SVG，这边能给你锐利的结果；你手上是照片，\
        那边才对路。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。文件的数量和大小同样\
        没有上限，因为没有哪台服务器在为它们掏钱，活是在你自己的机器上干的。\
        本站带广告，经费就是这么来的，广告拿不到关于你文件的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图稿送出去渲染的工具，拔线那一刻就停了。"""

[schema]
description = "在浏览器里把 SVG 光栅化成 PNG、JPEG 或 WebP，尺寸随你定。可按倍数、宽度、高度、最长边或者一个框来定尺寸，可加出 @2x 和 @3x，透明可留可压平，也支持整批转换。什么都不上传。"
features = [
  "每个尺寸都把矢量重画一遍，所以多大都锐利",
  "按倍数、宽度、高度、最长边，或者一个带适配方式的框来定尺寸",
  "@2x 和 @3x 严格按第一份的整数倍出，不是各自取整两次",
  "PNG、JPEG 和 WebP，透明可以留着，也可以压平到某个颜色上",
  "从 width、height 或 viewBox 里读出尺寸，并说明用的是哪一个",
  "浏览器画布真的做不出来的尺寸，事先就警告",
  "预览由写文件的同一段代码画出来",
  "支持批量，结果打成一个 zip",
  "文件里的脚本和远程引用，绝不执行，也绝不去取",
  "断网能用，不上传，不注册",
]

[picker]
title = "把 SVG 拖到这儿"
hint = "或者点击选择，一次拖好几个也行"
