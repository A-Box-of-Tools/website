  "@2x 和 @3x 副本，每一个都是第一个的精确倍数，而不是分别取整两次",
  "PNG、JPEG 和 WebP，透明可保留，也可压平到某个颜色上",
  "从 width、height 或 viewBox 里读出尺寸，并说明用的是哪一个",
  "在浏览器画布实际做不出来的尺寸之前先给出提醒",
