      一个 &lt;img&gt;、一次 <code>drawImage</code> 和一次\
      <code>toBlob</code>，中间什么都没有。"""

howto_heading = "怎么在不上传的情况下把 SVG 转成 PNG"

card = """
            SVG 没有自己的像素尺寸，所以那个数字由你定 &mdash; 32 还是 8000，\
            一样锐利。"""

[words]
plural = "SVG 文件"
choose = "SVG"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "无水印"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[privacy]]
title = "你的图稿没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集你文件的接口，代码里也没有任何一处\
      会去发送它们，哪怕真有这么个接口。"""

[[privacy]]
title = "这里没有任何东西会去取什么。"
body = """\
      <code>src/</code> 里没有 <code>fetch</code>，没有\
      <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>。整个\
      栅格化器就是一个装着你自己文件 blob 的 <code>&lt;img&gt;</code>、\
      一次往画布上的 <code>drawImage</code>，和一次\
      <code>canvas.toBlob</code>。"""

[[privacy]]
title = "SVG 是一份文档，而这里用的是它动不了手的那种模式。"
body = """\
      一个 SVG 里可以带 <code>&lt;script&gt;</code>、一个远程的\
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>、一份样式表\
      和一个网络字体。透过 <code>&lt;img&gt;</code> 绘制时，它处在规范所说的\
      <em>安全静态模式</em>：脚本不运行，那些地址一个都不会被请求。这是浏览器\
      给的保证，不是我们给的承诺，也正因如此，这个页面才能打开一个从没见过的\
      文件，而那个文件没法往家里打电话。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。它们没有\
      一个被交给过任何关于你图稿的信息。每一行读取、定尺寸或绘制文件的代码，\
      都由这个源提供，也都列在仓库里。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个工具毫无变化，因为它里面从来就没有过一个联网的步骤。\
      这是所有证明里最简单的一个。"""

[[howto]]
title = "选那个 SVG。"
body = """\
      拖一个到选择框上，或者挑一整个文件夹一次转完。浏览器直接从你的硬盘上\
      读文件；这个过程中没有任何东西被送去哪里。每一行都会说明这个文件认为\
      自己有多大 &mdash; 而且当这个尺寸来自它的 <code>viewBox</code>、或者\
      因为文件根本没声明而只是被假定时，说法会不一样。"""

[[howto]]
title = "说明要多大。"
body = """\
      给文件自身尺寸的一个倍数，是最快的答案，也是处理一整批时正确的那个：\
      每张图都从它自己的起点缩放，所以一套图标之间的比例不会乱。否则就说一个\
      宽度、一个高度、最长边，或者一个两边都给定的框。这里给一个很大的数字\
      不像处理照片那样要付代价 &mdash; 图是按那个尺寸重新画的，不是被拉上去\
      的。"""

[[howto]]
title = "需要的话，加上高 DPI 副本。"
body = """\
      手机和 Retina 笔记本每个 CSS 像素要画两到三个设备像素，所以一个 200 像素\
      的 logo，背后需要一个 400 或 600 像素的文件。勾上 <code>@2x</code> 和\
      <code>@3x</code>，它们出来时的命名正是 Xcode、Android 工具链和 CSS
      <code>image-set()</code> 都期待的那种，而且每一个都正好是第一个的两倍或\
      三倍，不是各自单独取整。"""

[[howto]]
title = "挑格式，再决定透明怎么办。"
body = """\
      没有特别理由就选 PNG：它无损，保留透明，而且纯色块在里面压得很好。
      JPEG 根本没有透明，所以不管你挑不挑，都会有一个背景色被画进去 &mdash;
      没有它，每一个透明像素都会变成黑的。WebP 两样都行，文件还更小，代价是\
      老到读不了它的软件。"""

[[howto]]
title = "下载之前看一眼预览。"
body = """\
      它是由写文件的同一套代码、从你的文件、在你的机器上画出来的。一幅图变成\
      像素时有两件事会变，而它们都会显示在这里：一条本来只有半个像素宽的\
      发丝线会变灰，而任何文字都会用这台电脑上有的字体来画，而不是从网上取\
      来的那一个。"""

[[howto]]
title = "把文件拿走。"
body = """\
      一个文件一次下载，或者整批打成一个 zip。名字跟着它们来源的那个 SVG，\
      副本上带 <code>@2x</code> 和 <code>@3x</code>，而两个本来会重名的文件\
      会被加上编号，而不是让其中一个悄悄把另一个盖掉。"""

[[faq]]
q = "我的 SVG 会被上传到什么地方吗？"
a = """
        不会。文件由你自己的浏览器、在你自己的硬件上读取，由渲染你看到的其他\
        每一张图片的同一个引擎画到画布上，然后作为下载还给你。这个工具没有\
        任何形式的网络功能 &mdash; 它从不取任何东西，也从不发任何东西 &mdash;
        而页面的 <code>Content-Security-Policy</code> 列出了它可能联系的每一个\
        地址，其中没有一个属于本站。"""

[[faq]]
q = "我该按多大的尺寸栅格化一个 SVG？"
a = """
        读它的那个东西要多大就多大，再乘以它将要出现的那块屏幕的设备像素比。\
        一个占 200 CSS 像素的 logo，Retina 笔记本需要 400，近几年的手机需要
        600，这也正是这里 <code>@2x</code> 和 <code>@3x</code> 副本的来历。\
        应用图标或者商店素材则由商店给出一个确切的数字，那个数字就是答案。\
        什么都没人告诉你的时候，最长边 1024 是一个好用的默认值：大到几乎什么\
        用途都够，小到还能用邮件发。"""

[[faq]]
q = "放大会损失质量吗？"
a = """
        不会，而且这是少有的、这个答案可以老老实实说“不会”的地方。矢量图是\
        指令而不是像素，所以浏览器会按要求的尺寸把那些曲线重新画一遍。从一个
        24 像素的图标出发画到 4000 像素，和 24 像素时一样锐利。做不到的是反过来\
        走：一旦它成了 PNG，它就和别的东西一样是像素了，所以请按你需要的尺寸\
        栅格化，而不是事后再去缩放结果。"""

[[faq]]
q = "我的 SVG 没有 width 和 height，我会得到多大的图？"
a = """
        <code>viewBox</code> 里的尺寸，如果有的话 &mdash; 它的宽高是用户单位\
        而不是像素，但那是文件里仅有的数字，浏览器会把它们当作这幅图的自然\
        尺寸。如果连 viewBox 也没有，页面会在那一行旁边写<em>假定</em>，并使用
        300&nbsp;&times;&nbsp;150，那也正是一个 <code>&lt;img&gt;</code> 会用\
        的尺寸。不管哪种情况，你都可以直接说出你要的尺寸，图就按那个画。"""

[[faq]]
q = "为什么 PNG 里的文字看起来不一样？"
a = """
        因为字体不在 SVG 里。一个画文字的 SVG 只是写下一个字体名字，剩下的\
        交给这台机器去找，而一个用 <code>@import</code> 从 Google Fonts 拉字体\
        的文件，在这里什么也拿不到：透过 <code>&lt;img&gt;</code> 绘制的 SVG
        不被允许请求任何东西，而这正是让它没法带着你的文件往家里打电话的同一\
        条规则。解法是每个设计师都已经知道的那个 &mdash; 导出之前先在绘图软件\
        里把文字转成路径。那样它就是几何图形，在哪儿看都一样。"""

[[faq]]
q = "它能一次转好几个文件吗？"
a = """
        能。列表上每一个 SVG 都用同一套设置渲染，这一批打成一个 zip 下来。\
        用倍数 &mdash; “文件自己要求尺寸的 4&times;” &mdash; 通常是处理一整批\
        时正确的设置，因为每张图都从它自己的尺寸缩放，而不是被一律逼到同一个\
        像素数。点任意一行，就能把那一个放进预览。"""

[[faq]]
q = "有尺寸上限吗？"
a = """
        有浏览器的，没有我们的。画布在一条边超过 16,384 像素之后的某处就撑不住\
        了，而 iPhone 和 iPad 上的 Safari 在大约 1670 万像素的面积上就停了
        &mdash; 也就是 4096&nbsp;&times;&nbsp;4096。超过这个数，页面会提醒你，\
        而不是还给你一张空白图 —— 后者才是浏览器撑不住时的表现：\
        <code>toBlob</code> 干脆什么都不返回，也不给一句错误来解释自己。超过\
        一亿像素，工具会直接拒绝，因为那意味着还没编码一个字节，画布就已经\
        占了 400&nbsp;MB。"""

[[faq]]
q = "透明会怎么样？"
a = """
        在 PNG 和 WebP 里会被保留。JPEG 根本没有 alpha 通道，所以不管你要不要，\
        整张图后面都会被刷上一个颜色 &mdash; 没有它，所有透明的地方都会变成\
        黑的，那看起来像个 bug，而不像 JPEG 的正常行为。用 PNG 时也挑一个背景\
        色，同样是完全正常的需求：它把图压平到那个颜色上，而不是留一个洞。"""

[[faq]]
q = "它能读一个里面带脚本或者外部图片的 SVG 吗？"
a = """
        能读，而且它会精确地画出浏览器愿意画的那些部分。透过\
        <code>&lt;img&gt;</code> 加载的 SVG 处在<em>安全静态模式</em>：脚本\
        不运行，外部引用不被请求，动画也不播放 &mdash; 你拿到的是第一帧。所以\
        一个里面有远程 <code>&lt;image&gt;</code> 的文件，出来时那一块是缺的。\
        那是浏览器替你拒绝了，也正因如此，这个页面才能安全地打开一个从没见过\
        的文件。"""

[[faq]]
q = "这个和图片缩放有什么区别？"
a = """
        区别在源头是什么。图片缩放从像素出发
        &mdash; 一个 JPEG、一个 PNG &mdash; 所以放大就不得不编造本来不存在的\
        细节。这一个从一幅图出发，所以没有什么要编造，也没有值得担心的上限。\
        你手上是 SVG，这一个能给你锐利的结果；你手上是照片，那就用那一个。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。文件的数量和大小\
        也没有上限，因为没有一台服务器在为它们付钱 &mdash; 活是在你自己的\
        机器上干的。本站带广告，这就是它的经费来源；广告拿不到任何关于你文件\
        的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的图稿送出去渲染的工具，在你拔线的那一刻\
        就会停下来。"""

