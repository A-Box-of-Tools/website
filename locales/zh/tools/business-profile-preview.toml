#
# 商家资料预览 - Simplified Chinese.
#
# Overrides for tools/business-profile-preview/tool.toml. Only words: the slug,
# the category, the icon and the list of shared parts stay where they are.
#
# Every prose value below ends its lines with a backslash. Chinese puts no
# space between words, so a newline inside a sentence arrives as a space inside
# a sentence once the markup is collapsed - see "The strings in the JavaScript"
# in docs/languages.md.
#
# Google 的产品名留作原文。中文里把 "Google Business Profile" 译成“谷歌商家资料”
# 会让一句话既像官方说法又不是官方说法，而这个页面最不能给人的印象，就是它跟
# Google 有关系 - 所以产品名保持原样，页面自己是谁则说得明明白白。
#

