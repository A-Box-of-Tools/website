      打进这些框里。没有哪一个请求会带走其中的一个字符。或者干脆拔掉网线，\
      整张预览图照样能做出来。"""

read_first = """\
，<code>src/surfaces.js</code> \
      是那三张卡片本身&mdash;&mdash;里面每一个坐标都是写死在那儿的&mdash;&mdash;\
      <code>src/profile.js</code> 是这个页面上唯一一处算术，也就是此刻这家店\
      开着还是关着，而 <code>src/parse-listing.js</code> 管的是你粘贴进来的\
      那份资料会经历什么。"""

howto_heading = "怎样在 Google 商家资料上线之前先预览它"

card = """\
            你的 Google 商家资料会长成什么样：知识面板、手机上的卡片，\
