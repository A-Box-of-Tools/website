[[privacy]]
title = "你的图片无处可去。"
body = "内容安全策略列出了本页可以联系的每一个地址，其中没有任何地址属于本网站。这里没有收集文件的接口，也没有发送文件的代码。"

[[privacy]]
title = "解码器已经在浏览器中，这就是全部诀窍。"
body = "照片查看器打不开的 AVIF，在浏览器标签页里却能正常打开：Chrome 和 Firefox 自 2021 年起支持 AVIF，Safari 自 2023 年起支持。本页只是给现成的解码器加上保存按钮：打开文件、绘制图片、写出 JPEG。因此无需下载引擎，无需等待第一次转换，也无需服务器。这恰恰是那些要求上传的转换器没有告诉你的事。"

[[privacy]]
title = "透明区域，以及它们背后的颜色。"
body = "AVIF 可以有透明通道，JPEG 却没有，因此透明处必须垫上一种颜色。本页会询问颜色，默认白色，而且只在文件确实有透明像素时询问。它检查的是解码后的像素，而非猜测格式。从网站保存的 AVIF 大多是不透明的照片，所以颜色控件通常不会出现。"

[[privacy]]
title = "JPEG 无法从 AVIF 保留的东西。"
body = "AVIF 可以容纳更多颜色、更亮的高光：每通道十位或十二位，以及 HDR。JPEG 只有八位，没有 HDR，使用这些特性的图片会被压到普通动态范围。绝大多数图片并没有需要压缩的动态范围，你看不出变化；HDR 照片的截图可能不同。我们事先说明，避免转换后才发现。"

[[privacy]]
title = "Google 加载什么，又拿不到什么。"
body = "广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们都不会获得你的图片信息。读取、解码和写入文件的每一行代码都来自本站，并列在代码仓库中。"

[[privacy]]
title = "可以离线使用。"
body = "先加载页面再断开网络，工具仍然照常工作。这是最简单的证明：如果转换器把图片发送出去处理，它就不可能做到这一点。"

[[howto]]
title = "选择 AVIF 文件。"
body = "拖入文件或手动选择。工具通过文件开头的字节识别格式，不看文件名，因此下载时被改名的 AVIF 仍然可用。真正的 PNG 会被拒绝，并明确显示实际格式。"

[[howto]]
title = "设置质量，以及透明区域背后的颜色。"
body = "滑块从 92 开始，此时照片很难与原图区分。颜色控件只在列表中有透明图片时出现，因为 JPEG 必须填充这些区域。"

[[howto]]
title = "点击“转换”，然后下载。"
body = "每个结果都显示来源、转换后的大小和变化。文件通常会大不少，因为 AVIF 是更高效的编码，你用体积换取兼容性。单个文件有下载按钮，多个文件还提供 ZIP 压缩包。"

[[faq]]
q = "图片会被上传到哪里吗？"
a = "不会。文件在你的浏览器、你的硬件上读取、解码和写入。本工具没有任何网络功能：不获取也不发送任何内容。本页的 <code>Content-Security-Policy</code> 列出了所有允许联系的地址，没有一个属于本网站。连解码器也不用先加载，浏览器已经有了。"

[[faq]]
q = "为什么电脑上的软件都打不开这张图片？"
a = "因为 AVIF 在相关软件中仍然很新。它在相同质量下比 JPEG 小得多，所以网站开始使用它，保存图片便会得到 <code>.avif</code>。而你拿来打开图片的软件常常比格式更老。Windows 需要扩展，许多桌面编辑器仍不支持，电子书阅读器、打印机和上传表单大多也不认识。浏览器却能正常读取，这既是本页能帮忙的原因，也是你最初得到这份文件的原因。"

[[faq]]
q = "JPG 会比 AVIF 更大吗？"
a = "几乎一定会，经常大数倍。结果会明确显示差别。AVIF 是最高效的静态图像编码之一，JPEG 则是最老的一批。40 KB 的 AVIF 在相同可见质量下变成 200 KB 的 JPEG 很正常。这是用体积换兼容性。如果之后还要限制大小，<a href=\"../compress-image/\">图片压缩器</a>可以把 JPEG 压到指定大小。"

[[faq]]
q = "透明区域会怎样？"
a = "会填充你选择的颜色，而且页面在转换前就会说明。AVIF 有透明通道，JPEG 没有，因此这次转换无法保留透明，只能由你决定垫什么颜色。多数 AVIF 是不透明的照片，颜色控件便不会出现。需要保留透明时，可用<a href=\"../compress-image/\">图片压缩器</a>转为 PNG 或 WebP，它能读取 AVIF 并输出两者。"

[[faq]]
q = "HDR 和十位色彩呢？"
a = "它们不能保留，因为 JPEG 装不下。AVIF 可以存储每通道十位或十二位，以及超出普通屏幕亮度的高光；JPEG 只有八位，没有这种动态范围概念。HDR AVIF 会输出为普通图片。想要到处都能打开时，这符合目的；用于归档则是真正的损失。普通网页保存的图片几乎都没有 HDR，所以大多数人不会损失这部分内容。"

[[faq]]
q = "图片会被重新压缩吗？"
a = "会，而且无法避免。AVIF 和 JPEG 使用不同编码，必须先解码再重新编码。所有 AVIF 转换器都如此，包括要求上传的那些。你能控制损失多少：滑块默认 92，此时照片很难与原图区分。"

[[faq]]
q = "可以反过来把 JPG 转成 AVIF 吗？"
a = "这里不可以。原因是没有浏览器能写出 AVIF。向画布请求 AVIF，它会默默返回标错类型的 PNG。因此，宣称在浏览器中写出 AVIF 的页面要么有误，要么把图片发送到服务器编码。真正离线完成需要提供编码器，这是实质性的开发工作，列在<a href=\"../roadmap/\">路线图</a>上，而不是假装已经完成。"

[[faq]]
q = "日期、相机和位置会保留吗？"
a = "不会。图片绘制到画布上，而画布只有像素，所以 EXIF、GPS、色彩配置和 XMP 都会丢弃。网页上的图片通常本来就没有这些信息。需要查看或编辑文件携带的内容时，<a href=\"../exif-editor/\">EXIF 查看与移除工具</a>可以完成，而且不会重新压缩图片。"

[[faq]]
q = "能一次转换整个文件夹吗？"
a = "能。你想放多少文件都可以。没有数量或大小限制，因为没有服务器承担处理。每个文件都有一行结果和单独下载，两个或更多文件还提供包含全部结果的 ZIP 压缩包。"

[[faq]]
q = "免费吗？可以离线用吗？"
a = "免费，不用账号、登录或试用，也没有水印。网站通过广告维持运营，广告不会获得图片信息。先加载页面，再断开网络，工具会完全照常运行。这也是确认没有上传的最有力证据。"

