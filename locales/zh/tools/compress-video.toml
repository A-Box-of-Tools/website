#
# Compress a video - 简体中文。
#
# Overrides for tools/compress-video/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样。
#
# 第一件：这一页说的是一个数字，不是一种偏好。人们来这里是因为文件发不出去，
# 聊天软件的上限、邮件的上限、表单的上限，他们要的是文件压到那个数字以下、
# 并且在数字允许的范围内尽量少丢东西。所以页面先问数字，在编码之前就说这个数字
# 能买到什么，做完再拿结果去量。每一句话都把那个数字放在前面。
#
# 第二件：压缩过的视频是重新编码过的视频，页面要说出来，不能让「压缩」听起来
# 像压缩包那种无损的意思。画面被解码后重新写一遍，离相机又远了一代；声音原样
# 复制过去；结果是 MP4 里的 H.264，因为那是每一部手机、每一个浏览器和聊天软件
# 都能播的唯一一种，而本站早就决定不再承诺 WebM。这里没有一句话声称画面没变。
#
# 用词：bitrate 写「码率」，frame size 写「画面尺寸」，target 写「目标大小」
# 或直接说「那个数字」，re-encode 写「重新编码」。
#

name = "视频压缩"
heading = "视频压缩 <span class=\"h1-kw\">压到一个真的发得出去的大小</span>"
tagline = "说一个它最多能有多大。剩下的工具来算，做完先量一遍再交给你。"

title = "视频压缩 | 压到指定大小，MP4，免费，不上传 | abox.tools"
description = "在浏览器里把视频压到 8、16、25 或任意兆字节以下。说出大小，工具选画面尺寸和码率，编码，再量结果。什么都不上传，声音原样复制过去。"
og_title = "把视频压到发得出去的大小，不用上传"
og_description = "一个 900 MB 的视频不必先传到服务器再拿回一个小的。说一个它最多能有多大，工具在你的浏览器里算好剩下的。"
og_image_alt = "在浏览器里压缩视频，不用上传"

pledge = """
    你选的那段视频，解码、缩小、重新编码、写回，全都在这台机器的内存里完成，用的是\
    你自己浏览器里的编解码器，和从这个地址发来的代码。这里根本没有能做上传的东西，\
    这一页的另一头也没有服务器可以接收。一个 GB 的文件不会为了变小而先跑一趟上传。"""

live_hint = """
      别听我们说。打开开发者工具，盯着网络面板，然后压缩点什么。没有任何一条\
      请求带着视频、一帧画面或者文件名。或者干脆断网，照样能压。"""

read_first = """
，一个数字是怎么变成画面尺寸和码率的，看 <code>src/plan.js</code>；\
      解码、缩小、编码，以及绕在它们外面原样复制的声音，看 \
      <code>src/encode.js</code>。这几个都够不着网络，旁边负责读和写的部分也一样。"""

howto_heading = "怎么把视频压到一个发得出去的大小"

card = """
            说一个文件最多能有多大，8 MB、25 MB、现在的一半，工具就选好画面\
            尺寸和码率，在你的机器上重新编码画面，把声音原样复制过去，然后拿\
            结果对着那个数字量一遍，再给你下载。"""

[words]
plural = "视频"
choose = "一段视频"
analytics_extra = """，你要求的\
  大小，一样都不会"""

