text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[facts]]
text = "文件留在你的设备上"

[[privacy]]
title = "上传才是最慢的那一步，而这一步在这里不会发生。"
body = """\

      视频是大多数人这辈子试着发出去的最大的文件，这正是它发不出去的原因。每一个\
      在线压缩工具都要先把整个文件收过去，900 MB 沿着你的网络传上去，才能拿回 \
      25 MB，而那次上传通常比它换来的编码本身还要久，这还没算上谁留着这个文件的\
      问题。这一页用你浏览器里本来就有的编解码器，在你自己的机器上编码，唯一移动\
      的字节是从你的硬盘到内存再回来。页面的 <code>Content-Security-Policy</code> \
      列出了这一页可以联系的每一个地址，其中没有一个属于本站，把网络断掉它照样能用。"""

[[privacy]]
title = "它从那个数字出发，因为那个数字才是重点。"
body = """\

      聊天软件允许 8 MB 或者 25 MB；邮件允许 25 MB；表单允许它写着的那个数。你要的\
      是文件压到那个数以下，并且在数字允许的范围内尽量少丢东西。所以页面先问数字，\
      再算剩下的：声音原样复制，容器占一点，剩下的摊到视频的时长上，就是画面可以\
      花的码率。码率只有相对于它要画的像素数才有意义，所以画面会沿着一架大家熟悉\
      的尺寸阶梯往下走，直到每一帧分到的比特足够让它看起来像一幅画面，并且从不\
      往上走。这些页面在开始之前全都会说，画面尺寸你也可以自己定。"""

[[privacy]]
title = "压缩过的视频是重新编码过的视频，页面会这么说。"
body = """\

      「压缩」对压缩包来说是无损的，对视频来说完全不是那回事。画面被解码、缩小，\
      再用 H.264 按数字允许的码率重新编码一遍，这让它比你一开始的那个文件离相机\
      又远了一代。声音不是：它的采样原样复制进新文件。结果是一个 MP4，因为那是\
      每一部手机、每一个浏览器和聊天软件都能播的唯一一种容器，而本站早就决定不再\
      承诺一种它一半访客做不出来的格式。"""

[[privacy]]
title = "结果会量一遍，超了就再紧一次。"
body = """\

      编码器落在码率附近，而不是正好落在上面，所以文件会按比数字略低一点去要，\
      然后量。要是量出来还是超了，就按超了多少重新算码率，把视频再编码一遍；两遍\
      总是够的，用了两遍的时候页面会说。接着做好的文件会在这里重新打开，时长必须\
      跟原来一样：一个丢掉最后一秒、或者丢掉声音的压缩工具，做出来的文件也一样\
      更小，只有把结果读回来才分得出区别。"""

[[privacy]]
title = "它在你机器上的代价，如实说。"
body = """\

      编码要花多久，取决于你的机器。有硬件编码器的话，最近十年的大多数笔记本和\
      每一部手机都有，它比视频本身的时长还快；没有的话就慢一些，一段很长的 4K \
      视频不管怎样都要等一阵。整个文件是分块从硬盘读的，所以比内存还大的视频没\
      问题，但做好的文件会一直放在内存里直到你下载它，笔记本的上限就在这里。取消\
      随时有效。"""

[[privacy]]
title = "它读哪些文件，不读哪些。"
body = """\

      MP4 和 MOV，也就是手机、相机和录屏软件写出来的那种，里面装着 H.264、HEVC、\
      VP9 或者 AV1 都行，只要你的浏览器解得开。iPhone 的 HEVC 视频在有 HEVC 许可\
      的机器上都打得开，大多数机器都有。WebM、MKV 和 AVI 这里还不读，页面会明说，\
      而不是含糊地失败。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
 广告和统计脚本来自 Google。这两个都没有拿到关于你视频的任何\
      东西：不是文件，不是一帧，不是文件名、大小、时长，也不是你要求的数字。每一\
      行读取、编码或者写出视频的代码都由这个源站发出，并且列在代码仓库里。"""

[[privacy]]
title = "打赏按钮加载了什么，又没拿到什么。"
body = """\

      页眉上那个「Buy me a coffee」按钮，是由 cdnjs.buymeacoffee.com 的一段脚本\
      画出来的，字体取自 Google Fonts。它就是一个链接，仅此而已：它不上报访问，\
      也拿不到任何关于你或者你视频的东西。你不点它就什么都不会发生，而点下去要去\
      的是别人的网站。"""

[[privacy]]
title = "断网也能用。"
body = """\
 把网络断掉，这一页上的所有功能照常。这是最简单的一个证明：\
      一个把你的视频发出去压缩的工具，这时候就停了。"""

[[howto]]
title = "选那段视频。"
body = """\
 一次一段，MP4 或者 MOV。浏览器直接从你的\
      硬盘上把它读进来，页面会说它是什么：多长、多大、画面尺寸多少、每秒花多少。"""

[[howto]]
title = "说它最多能有多大。"
body = """\
 打一个兆字节数，或者按下别人给你的那个\
      上限，8、16、25、50、100，或者现在这个文件的一半、四分之一。下面那一行会说\
      这个数字能买到什么：视频的时长和声音给画面留下的尺寸和码率，以及结果大概会\
      出来多大。要是你宁愿把整个数字都给画面，就把声音去掉。"""

[[howto]]
title = "想自己定画面尺寸也可以。"
body = """\

      数字会自己选一级阶梯。你更清楚的时候就自己选，一段必须在 1080p 下还能看清\
      字的录屏、一段只会在手机上看的视频，码率就摊在你选的那一级上。阶梯是上限：\
      画面从不会被放得比进来时更大。"""

[[howto]]
title = "压缩，然后读那句写着「已量过」的话。"
body = """\

      画面一帧一帧地解码、缩小、重新编码，进度条说它到了哪里。接着做好的文件会拿\
      去对着数字量一遍，再在这里重新打开核对时长；要是超了，就再紧一点编码一次，\
      页面会说。结果在下载按钮下面从内存里播放，你能亲眼看到它还好好的。"""

[[faq]]
q = "视频能压到多小？"
a = """
        压到你打的那个数字那么小，直到什么都看不清的那个点为止，页面会告诉你那个\
        点在哪。声音原样复制，所以它花多少就是多少（普通立体声大约每分钟一兆），\
        画面在最小的尺寸下也需要每秒几百 kbit 才勉强是一幅画面。把声音去掉，它那\
        份就归画面，对一段上限很紧的短视频来说，这常常是能看和糊成一团之间的差别。"""

[[faq]]
q = "为什么画面尺寸变了？"
a = """
        因为码率只有相对于它要画的像素数才有意义。每秒两兆比特在 720p 下很宽裕，在 \
        4K 下就是一团泥，所以数字定下码率之后，画面会沿着阶梯往下走，直到每一帧\
        分到的比特足够让它像一幅画面。一幅小而清楚的画面胜过一幅大而糊的，每一个\
        接收上传的服务都在悄悄这么干。这里是在开始之前就说出来，你也可以自己选\
        哪一级。"""

[[faq]]
q = "画质会变差吗？"
a = """
        会，差的程度正好是数字要求的那么多，不会更多。压缩过的视频是重新编码过的\
        视频：画面按更低的码率重新写一遍，离相机又远了一代。声音不动。丢多少由你\
        打的数字决定，一段 900 MB 的视频压成 25 MB 丢掉了大部分比特，一段压成一半\
        的视频丢得很少，而页面会说出它选的码率和画面尺寸，让这笔交换看得见，而不是\
        藏起来。"""

[[faq]]
q = "它写出来的是什么格式？"
a = """
        H.264 视频的 MP4，声音轨原样复制过去。那是每一部手机、每一个浏览器、聊天\
        软件和邮件客户端都能播的唯一一种组合，而一个必须发得出去的文件要的正是\
        这个。它不写 WebM、HEVC 或者 AV1：同样画质下更小，但你要发给的人里一半\
        打不开。"""

[[faq]]
q = "它读哪些文件？"
a = """
        MP4 和 MOV，也就是手机、相机和录屏软件写出来的那种，里面装着 H.264、HEVC、\
        VP9 或者 AV1 都行，只要你的浏览器解得开。iPhone 的 HEVC 视频在有 HEVC 许可\
        的机器上都打得开，大多数机器都有。WebM、MKV 和 AVI 这里还不读；碰到的时候\
        页面会明说，而不是含糊地失败。"""

[[faq]]
q = "要多久？"
a = """
        取决于你的机器编码这段视频要多久。有硬件编码器的话，大多数笔记本和最近的\
        每一部手机都有，它比视频本身的时长还快；一分钟的 1080p 通常不到一分钟。\
        没有的话就慢一些，一段很长的 4K 视频不管怎样都要等一阵。进度条说它到了\
        哪一帧，取消立刻停下，什么都不写。"""

[[faq]]
q = "为什么编了两遍？"
a = """
        因为编码器落在它被要求的码率附近，而不是正好落在上面，画面很忙的视频可能\
        落在上方。文件会按比数字略低一点去要，然后量；要是量出来还是超了，就按超了\
        多少重新算码率，再编码一遍。两遍总是够的，用了两遍的时候页面会说。"""

[[faq]]
q = "我的视频会被上传到什么地方吗？"
a = """
        不会。视频是你自己的浏览器在你自己的硬件上读取、解码、编码、写出的，页面的 \
        <code>Content-Security-Policy</code> 列出了它可以联系的每一个地址，其中\
        没有一个属于本站。最简单的验证办法，是把网线拔掉，照样用这一页。对这么大的\
        文件来说，这也是最快的办法：上传通常比编码还久。"""

[[faq]]
q = "手机上能用吗？"
a = """
        浏览器能编码视频的手机上能用，而且手机自带的硬件编码器很快。手机缺的是\
        内存：做好的文件会一直放在内存里直到你保存它，所以一段很长的视频可能超出\
        手机能装下的量。先用<a href=\"../trim-video/\">视频剪辑</a>剪短，或者在\
        笔记本上压。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        工具里没有写死任何限制。视频是分块从硬盘读的，所以进来的文件比内存还大也\
        没问题；限制在做好的文件，它会一直放在内存里直到你下载，几百兆的结果一台\
        笔记本吃得下。它是免费的，不注册、不登录，也没有试用期。本站带广告，那是\
        养活它的东西；广告拿不到任何关于你视频的内容。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没被上传的\
        最简单的办法：一个把你的视频发出去压缩的工具，你一拔网线它就停了。"""

