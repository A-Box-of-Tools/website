[[privacy]]
title = "对账单是最经不起上传的一种文件。"
body = """\

      它是一份名单：你付给了谁、为什么付、什么时候付、付完还剩多少，顶上还写着\
      你的账号。把这些交给陌生人的服务器去换一张表格，意味着他们拿到了、留下了，\
      并且因此成了一个值得攻击的目标。会计事务所自己的客户数据规定就不允许这么做，\
      所以这个领域里收费的工具，广告词讲的是「在浏览器里」而不是「转换」。这一页\
      没有另一头：根本没有可以发过去的地方。"""

[[privacy]]
title = "它会核对自己的结果，核不了的时候也会告诉你。"
body = """\

      在 PDF 里找出一张表是推断，不是阅读，哪一条纸面是栏与栏之间的空白、折下来的\
      那一行属不属于上面那笔，都是推断。碰上这里没见过的排版，任何一步都可能推错。\
      所以只要你的对账单印了余额，每一行都会拿它验一遍：这一行的余额，必须等于\
      上一行的余额加上这一行的金额，任何一个数字读错、任何一行漏掉或者重复，都会\
      正好在出问题的那一行把这条链子打断。页面会说有多少行对上了。没有余额那一栏\
      的时候，它就直说，而不是让你以为这些行已经验过。"""

[[privacy]]
title = "栏位是从纸面上看出来的，不是靠每家银行一套模板。"
body = """\

      这个工具里没有银行列表，也就不存在「你的银行不在里面」。一份对账单的栏位，\
      是把每一页每一行都投影到横轴上，再找出那些从来没印过东西的窄条，也就是让你\
      能看懂这一页的同一批空白。所以它在一家没人听说过的银行的对账单上也能用，\
      而碰上栏与栏真的挤在一起的那种，它也真的会失败。"""

[[privacy]]
title = "密码不由它来取，页面会告诉你去哪里取。"
body = """\

      带密码的对账单会被拒绝，而不是被打开。把一份文件的保护取掉，跟从里面读出\
      一张表是两回事，一声不响地替你做掉，是一个工具不该有的举动。页面做的是另一件\
      事：把那些不用把文件交出去的办法列给你。头一条是本站的 \
      <a href=\"../unlock-pdf/\">PDF 解锁工具</a>，它在你自己的浏览器里把密码取\
      下来，页面上什么都不改写；也可以用浏览器或者「预览」把它打印、导出成一份新的 \
      PDF。它仍然明明白白地说，不要把这份对账单交给别的任何一个说能替你解锁的\
      网站，那正是这一页要挡住的那一次上传。"""

[[privacy]]
title = "它读不了对账单的照片，也不假装能读。"
body = """\

      扫描件是一张图：那些行是像素，文件里根本没有可以对齐成栏的文字。这一点会被\
      如实报告，同时给出不用上传任何东西的几条路，头一条是大多数人都有、却想不起来\
      的那条，银行几乎一定可以直接给你同一份对账单的 CSV。从图里认字叫 OCR，那是\
      另一个工具，不是这一个。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
 广告和统计脚本来自 Google。这两个都没有拿到关于你对账单的\
      任何东西：不是文件，不是某一行，不是收款方、金额、余额、文件名或者页数。\
      每一行读 PDF 或者写 CSV 的代码都由这个源站发出，并且列在代码仓库里。"""

[[privacy]]
title = "打赏按钮加载了什么，又没拿到什么。"
body = """\

      页眉上那个「Buy me a coffee」按钮，是由 cdnjs.buymeacoffee.com 的一段脚本\
      画出来的，字体取自 Google Fonts。它就是一个链接，仅此而已：它不上报访问，\
      也拿不到任何关于你或者你对账单的东西。你不点它就什么都不会发生，而点下去\
      要去的是别人的网站。"""

[[privacy]]
title = "断网也能用。"
body = """\
 把网络断掉，这一页上的所有功能照常。这是最简单的一个\
      证明：一个把你的对账单发出去转换的工具，这时候就停了。"""

[[howto]]
title = "选一份对账单。"
body = """\
 一次一份 PDF。浏览器直接从你的硬盘上把它\
      读进来，而且是整份都读完再决定任何事，因为这份对账单写的是 1.240,00 还是 \
      1,240.00、日期是哪一种顺序，都是关于这份文件的事实，不是关于某一页的。"""

[[howto]]
title = "看看它推出来的那张表。"
body = """\
 栏位按文字落在哪里找出来，\
      对账单自己印了表头的地方就用它自己的表头，折行的摘要并回上面那一行，页码、\
      重复的表头和结转合计都不要。日期统一成 YYYY-MM-DD，金额是带正负号的普通\
      数字，这是表格软件要的样子；其余每一栏都原样保留页面上的写法。"""

[[howto]]
title = "读表格下面那一行，那才是重点。"
body = """\

      如果你的对账单印了余额，工具刚刚已经拿它把每一行都核过一遍，并且会说有多少行\
      对上了。那一行字比读这张表本身更有价值：它是「看着没问题的行」和「被证明过的\
      行」之间的差别。要是日期的顺序反了，表格上方那个选项一改，全部重算。"""

[[howto]]
title = "把 CSV 拿走。"
body = """\
 它按 RFC 4180 写，该加的引号都加，行尾是 \
      CRLF，编码是带字节序标记的 UTF-8，这样 Excel 打开它的时候货币符号还是货币\
      符号，而不会变成一串字母。做出它来没有上传过任何东西。"""

[[faq]]
q = "页面上一条线都没有，它怎么知道栏位在哪？"
a = """
        从空白看出来的。每一页的每一行都被投影到横轴上，那些在几乎所有行里都保持\
        空着的窄条，就是栏与栏之间的空隙，也正是这一页对人来说能看懂的原因。字号跟\
        正文不一样的行，比如标题或者很大的页码，不参与这次测量，否则一个横跨所有\
        栏位的标题就会把它底下的空隙全抹掉。这里没有按银行分的模板，所以也不存在\
        哪一家银行它没学过。"""

[[faq]]
q = "摘要太长、一栏放不下的时候会怎么样？"
a = """
        它会被并回上面那一行，而这正是大多数 PDF 转 CSV 的结果没法用的原因。一个\
        折到第二行的收款方，旁边既没有日期也没有金额，所以一个把每一行都当成一笔\
        交易的程序，会产出一行空了一半的记录，外加一行少了半截摘要的记录。在这里，\
        没有日期也没有金额的一行是续行，会接到它所属的那笔交易上；有金额但没有日期\
        的一行是结转合计，会被丢掉。"""

[[faq]]
q = "它到底怎么可能知道我的对账单读对了没有？"
a = """
        因为大多数对账单都带着余额，而余额是一次证明，不是装饰。如果每一行上印着的\
        余额，确实等于上一行的余额加上这一行的金额，那么金额就读对了、行就分对了，\
        而且没有哪一行被漏掉或者算了两遍，因为上面任何一种错误，都会正好在出错的\
        那一行把链子打断。工具在每一行上做这道减法，然后把结果告诉你。它找余额\
        那一栏用的也是同一道算术，而不是去读表头，所以一份能通过的对账单，必然\
        意味着栏位也认对了。"""

[[faq]]
q = "我的对账单没有余额那一栏怎么办？"
a = """
        那你会拿到这些行，外加一句话，明说没有任何东西可以拿来核对它们。这是故意的。\
        这些行仍然是页面上写的内容，仍然值得拿走，但是在没有东西验过它们的时候管它们\
        叫「已验证」，会训练你在那些真的有意义的对账单上，也不再看那一行字。"""

[[faq]]
q = "日期出错了。03/04 是 3 月 4 日，不是 4 月 3 日。"
a = """
        改表格上方那个选项，全部立刻重算。纯数字的日期确实有歧义，而工具是从这份\
        文件本身来定它，不是从你所在的地区：只要这份对账单上任何一处的日期有大于 \
        12 的那一位，仅这一行就把所有日期的顺序定下来了，页面也会说明这一点。当\
        每一个日期都落在 12 号或者更早的时候，文件里没有任何东西能把两种顺序分开，\
        所以它会说的正是<em>这件事</em>，并且先按日在前来算，直到你另行指定。"""

[[faq]]
q = "扫描出来的对账单能用吗？"
a = """
        不能，而且它会直说，而不是丢给你一个空文件。扫描件是一张照片：那些行是\
        像素，没有可以对齐的文字。页面接着会告诉你可以怎么办，头一条建议正是大多数\
        人会忽略的那条，几乎每一家网上银行都可以直接给你同一份对账单的 CSV、OFX \
        或者 QIF，那既不用转换，也比从任何一张图里读出来更准确。"""

[[faq]]
q = "带密码的对账单它能打开吗？"
a = """
        不能，而且这是故意的。银行会给很多对账单上锁，通常用出生日期或者账号的后\
        几位。把这层保护取掉，跟读出一张表是两回事，所以工具会拒绝，并且指给你几条\
        不用把文件交出去的路。最好的一条是本站的 \
        <a href=\"../unlock-pdf/\">PDF 解锁工具</a>：它在你自己的浏览器里把密码\
        取下来，页面上一个字都不改写，所以文字会原样落在你的银行放的那个位置上。\
        用 Chrome 或者 Edge 输入密码打开再打印回 PDF，或者在 Mac 上用「预览」\
        导出，也一样可以。不要用别的那些说能替你解锁的网站，那正是把这一页存在的\
        意义所要挡住的那份文件传上去。"""

[[faq]]
q = "我的对账单会被上传到什么地方吗？"
a = """
        不会。文件是你自己的浏览器在你自己的硬件上读的，CSV 也是这样写出来的。\
        这个工具没有服务器那一端，页面的 <code>Content-Security-Policy</code> 列出了\
        它可以联系的每一个地址，其中没有一个属于本站。最简单的证明，是断开网络，\
        照样转一份对账单。"""

[[faq]]
q = "CSV 开头那个奇怪的字符是什么？"
a = """
        那是字节序标记，是故意留的。Windows 上的 Excel 读一个没有它的 CSV 时，会\
        按系统的旧代码页来解，于是一份以英镑或者欧元记账的对账单，货币符号会变成\
        一个字母。这个标记告诉它这是 UTF-8。所有要紧的读取程序都会悄悄跳过它；\
        严格到会把它显示出来的解析器，会给你一个开头带着不可见字符的首列表头，\
        这就是这个取舍的代价。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        工具里没有写死任何限制。限制是你自己的机器：对账单在读的时候是放在内存里的，\
        几百页的量，一台笔记本处理起来不会有怨言。它是免费的，不注册、不登录，也\
        没有试用期。本站带广告，那是养活它的东西；广告拿不到任何关于你对账单的\
        内容。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没被上传的\
        最简单的办法：一个把你的对账单发出去转换的工具，你一拔网线它就停了。"""

