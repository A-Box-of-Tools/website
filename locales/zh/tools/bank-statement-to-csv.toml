#
# Bank statement PDF to CSV - 简体中文。
#
# Overrides for tools/bank-statement-to-csv/tool.toml. Only words: the slug,
# the category, the icon, the CSP and the list of shared parts stay where they
# are.
#
# 改这一页的话术时要守住的一件事：这个工具是「推断」出一张表，不是「读」出一张
# 表。PDF 里根本没有表格，只有落在纸面各个位置上的文字，那几道栏是没人印过的
# 空白。下面每一句话都必须让这一点成立。工具给出的答案是余额核对，那是一次证明，
# 也照证明来写；统计单上没有余额可对的时候，页面就直说，而不是暗示这些行已经
# 验过了。不要在改写里把「这是页面上写的内容」悄悄升级成「这是对的」。
#
# 「对账单」是本站对 bank statement 的说法；「流水」在中国大陆更口语，但它同时
# 指银行流水单和账目流水，写进标题会含混，所以正文里只在解释「running balance」
# 的时候用「余额」这个词。
#

