      请求带着某一页、某一行、某一笔金额或者文件名。或者干脆断网，照样能转。"""

read_first = """
，一道道栏在没有任何表格线可依的情况下是\
      怎么找出来的，看 <code>src/layout.js</code>；哪些行算交易、哪些行被丢掉，看 \
      <code>src/rows.js</code>；证明这一切的那段算术在 <code>src/check.js</code>。\
      这几个都够不着网络，它们底下负责读 PDF 的部分也一样。"""

howto_heading = "怎么把 PDF 对账单转成 CSV"

card = """
            把 PDF 对账单变成表格。栏位按文字落在纸上的位置推出来，折行的摘要\
            放回它自己那一行，然后每一行都拿对账单印着的余额核一遍，所以读得\
