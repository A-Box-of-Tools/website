tagline = "大多数「加了密」的 PDF 其实根本不用密码。这一页会先告诉你手上是哪一种，再动它。"

title = "PDF 解锁 | 去掉密码和打印复制限制，免费，不上传 | abox.tools"
description = "在浏览器里去掉 PDF 的密码，以及不许打印、不许复制、不许编辑这些限制。大多数被保护的文件根本不用密码，这一页会告诉你手上是哪一种。什么都不上传，也从不猜密码。"
og_title = "解锁 PDF，不用把文件交出去"
og_description = "大多数「被保护」的 PDF 谁都打得开，只是请阅读器别打印、别复制。这个工具在你的浏览器里把它去掉，并且告诉你那层保护到底值多少。"
og_image_alt = "在浏览器里解锁 PDF，不用上传"

