      别听我们说。打开开发者工具，盯着网络面板，然后解锁点什么。没有任何一条\
      请求带着文档、密码或者文件名。或者干脆断网，照样能解。"""

read_first = """
，一个密码是怎么变成文档密钥的，\
      以及那里面根本没有循环这件事，看 <code>src/shared/pdf-crypt.js</code>；两种密码算法\
