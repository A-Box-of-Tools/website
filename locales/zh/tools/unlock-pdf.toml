#
# Unlock a PDF - 简体中文。
#
# Overrides for tools/unlock-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样。
#
# 第一件：「保护」在 PDF 里是两回事，这一页任何时候都不能把它们混在一起说。带
# 「打开密码」的文档，没有密码谁都读不了，这个工具也找不出来。带「限制」的文档
# 是任何人都能打开的，它只是请阅读器不要打印、不要复制，这个请求靠的是程序之间
# 的约定，不是密码学，Adobe 从一开始就是这么写的。第二种远远更常见，也正是这个
# 工具一键就能处理、根本不用密码的那一种。
#
# 第二件：这个工具不猜密码。src/ 里没有任何一个循环在做这件事，页面是明说的，
# 不是让人自己推断。1990 年代那种 40 位的密钥确实是搜得出来的，正因为如此，这条
# 拒绝才必须写出来。
#
# 用词：user password 写「打开密码」，owner password 写「权限密码」，因为中文里
# 「用户密码」和「所有者密码」两个词并排放，读者分不出哪个管开、哪个管权限。
# revision 写「修订」，跟 /R 对应。
#

