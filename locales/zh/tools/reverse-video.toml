[[howto]]
title = "选一个视频。"
body = """\
      把 MP4、MOV、M4V 或 WebM 拖到选择框里，或者自己找出来。浏览器直接从\
      磁盘上读，这期间没有任何东西发往别处。"""

[[howto]]
title = "决定声音怎么办。"
body = """\
      “声音也倒过来”会把音轨一个采样一个采样地掉头，说话声因此出来的是倒着\
      放的说话声，而不是一片安静。要做无声片子就把它关掉，那样还更快。"""

[[howto]]
title = "决定花多少画质。"
body = """\
      画面必须重新编码，因为帧出来的顺序是原文件里根本没有为之编码过的。\
      “均衡”会贴近原片花掉的量，“最佳画质”则花得更多。"""

[[howto]]
title = "倒过来，然后下载。"
body = """\
      活是在你自己的硬件上干的，所以花多久取决于你的机器，而不是排队。做好\
      的视频直接交给浏览器的下载。"""

[[faq]]
q = "我的视频会被传到哪里去吗？"
a = """
        不会。它由你自己的浏览器在你自己的硬件上读取、解码、倒序和编码。这个\
        工具没有服务端，页面的 <code>Content-Security-Policy</code> 里写着它\
        允许联系的每一个地址，没有一个属于本站。你要是宁可自己查也不愿听我们\
        说，拔掉网线，照样倒一个试试。"""

[[faq]]
q = "哪些视频格式可以倒放？"
a = """
        MP4、M4V 和 MOV 直接读，里面装什么都行：H.264、HEVC、AV1 或 VP9，只要\
        你的浏览器能解那个编码。其他浏览器能播的东西，最典型的是 WebM，则是\
        靠让浏览器自己的播放器一步步往回走来倒放，能成，但慢一些。浏览器既\
        读不了也播不了的文件，实际上就是 AVI、WMV、FLV 和大多数 MKV，会带一句\
        说明直接拒掉，而不是走到一半才失败。出来的一律是 MP4。"""

[[faq]]
q = "声音会一起倒过来吗？"
a = """
        会，除非你把它关掉。整条音轨会被解码，采样按相反顺序排好，再重新编码成 \
        AAC。这第二遍编码没法省：一个音频包是几十毫秒的声音，而且是相对前一个\
        包编码出来的，所以把包倒着写出去，只会让一小段一小段正着播、顺序却是\
        乱的，那听上去像故障，不像倒放。"""

[[faq]]
q = "倒放会掉画质吗？"
a = """
        画面会被编码第二遍，这要付一点代价。这里没法像剪辑那样避开：倒过来的\
        片子按一个原文件根本没为之编码过的顺序显示帧，所以每一帧都得重写一遍。\
        这个工具不会做的是花得比原片更多，因为超过那条线之后再编码，只会把\
        文件撑大，画面并不会更好看。"""

[[faq]]
q = "视频的大小或时长有上限吗？"
a = """
        工具里没有写死的上限，文件也不会一次性读进内存，而是一组一组帧地往回\
        走。真正的天花板有两个：一个是下载前要在内存里拼起来的成品视频，另一个\
        是声音，它必须整条留着，因为倒放得先拿到最后一个采样才能写出第一个。"""

[[faq]]
q = "为什么有的文件慢，有的快？"
a = """
        因为进去的路有两条。MP4 或 MOV 由这个工具直接读取，一组一组帧地解码，\
        机器多快它就多快。其他的则是不停地向浏览器自己的播放器要片子的某一\
        时刻，而每一次这样的跳转都会让浏览器从前面的关键帧重新解码。页面会在\
        你开始之前说明它走的是哪一条，以及为什么。"""

[[faq]]
q = "能只倒放其中一段吗？"
a = """
        这里不行。这个工具倒的是整段：出来的片子和进去的一样长，只是最后一帧\
        排在最前。先用<a href="../trim-video/">视频剪辑</a>把你要的那段剪出来，\
        那个工具剪的时候一帧都不用重新编码，然后再把剪出来的东西拿来倒。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你视频的信息。"""

