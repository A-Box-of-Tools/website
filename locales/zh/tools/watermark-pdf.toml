[[privacy]]
title = "断网也能用。"
body = """\
 把网络断掉，这一页上的所有功能照常。这是最简单的一个证明：\
      一个把你的文档发出去盖章的工具，这时候就停了。"""

[[howto]]
title = "选那份 PDF。"
body = """\
 一次一份文档。浏览器直接从你的硬盘上把它\
      读进来，在这里打开。要密码的文档会被退回，附一个去解锁那一页的链接；其他的，\
