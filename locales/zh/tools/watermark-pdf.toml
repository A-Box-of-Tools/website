[[faq]]
q = "水印能被去掉吗？"
a = """
        能，任何一个有 PDF 编辑器的人都能，这一页不会告诉你别的。水印不是保护。它\
        做的是让一份副本说出自己去了哪里：一份盖着「仅供某某银行使用」的扫描件出现\
        在另一家贷款机构，就带着它泄露出去的那个地方的名字，这正是贷款机构、房东和\
        律师要求盖章的原因。如果这份文档根本不能被错误的人读到，那要的是密码，本站的 \
        <a href=\"../protect-pdf/\">PDF 加密</a>能加上一个。"""

[[faq]]
q = "水印可以是中文、阿拉伯文或者别的语言吗？"
a = """
        可以，你能打出来的都可以。字是你的浏览器用你自己机器上的字体画的，作为一张\
        图压在每一页上，所以水印不像 PDF 里没有嵌字体的文字那样只限于拉丁字母。代价\
        是做完之后这些字不能被选中、不能被搜索，对水印来说这反而是对的。"""

[[faq]]
q = "为什么预览里看不到我的文档？"
a = """
        因为本站没有 PDF 渲染器，这是有意的。要忠实地画出一页 PDF，得有字体引擎和\
        完整的图形模型，一个浏览器那么大的引擎，而背上它会改变这里每一个工具的\
        性质。所以预览显示的是它能诚实显示的东西：一张跟你第一页大小形状完全一样的\
        空白页，水印压在文件会把它放的位置上，用的是写文件的同一段代码。用任何一个\
        阅读器打开结果，就能看到两者合在一起的样子。"""

[[faq]]
q = "水印底下的文档看上去会不一样吗？"
a = """
        不会。页面自己的绘制没有被读取，更没有被改动：每一条指令、每一个嵌入字体、\
        每一张图片都原样复制过去，水印以你选的透明度画在上面。文字还能选、还能搜，\
        扫描件还是原来的分辨率，什么都不会移位。文件会大一张图的大小，每一页共用\
        这一张，几个字的水印也就几十 KB。"""

[[faq]]
q = "扫描件和横着存的页面能用吗？"
a = """
        都能。扫描件就是一页上放着一张图，水印跟盖在别的东西上一样盖在图上。横着存\
        的页面，也就是带着旋转、显示出来是横向的那种，会按它显示出来的样子盖：屏幕\
        上的对角线就是屏幕上的对角线，不是扫描仪以为的那张纸的对角线。"""

[[faq]]
q = "带签名的文档会怎么样？"
a = """
        它的签名会失效，而且没有办法绕过去。签名覆盖的是它当初签的那个文件的确切\
        字节，所以任何改动，任何程序做的，都会让它失效。这个工具写的是一个新文件，\
        发现原件带签名时会在结果里说明。把你的原件留着：那一份仍然是签过名的。"""

[[faq]]
q = "带密码的 PDF 能加水印吗？"
a = """
        不能直接加，也不是在这里输密码：这一页不问密码。先在同一个浏览器里用 \
        <a href=\"../unlock-pdf/\">PDF 解锁</a>把密码去掉，再把解锁后的副本拿到这里\
        盖章，然后想要的话用 <a href=\"../protect-pdf/\">PDF 加密</a>把密码加回去。\
        只带着限制的文件，也就是谁都打得开、却不肯打印的那种，同样会被退回，因为盖章\
        意味着重写，而重写会把那些限制丢掉。"""

[[faq]]
q = "我的文档或者我打的字会被上传到什么地方吗？"
a = """
        不会。文件是你自己的浏览器在你自己的硬件上读取、盖章、写出的，字也是它画的。\
        这个工具没有服务器那一端，页面的 <code>Content-Security-Policy</code> 列出了\
        它可以联系的每一个地址，其中没有一个属于本站。最简单的验证办法，是把网线\
        拔掉，照样用这一页。"""

[[faq]]
q = "我怎么知道每一页真的都盖上了？"
a = """
        因为这个工具会在你的机器上核对，并且把结果给你看。文件写好之后，它会被交给\
        本站其他 PDF 工具用的同一个读取器，每一页回来时都必须在它的资源里带着水印\
        的名字、并且以画出水印的那条指令收尾，页数跟原来一样。有任何一页不是这样，\
        这次运行就报告为失败，什么都不会给你下载。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        工具里没有写死任何限制。限制是你自己的机器：文档在处理的时候是放在内存里的，\
        几百兆的量，一台笔记本吃得下，再往上就会吃力。它是免费的，不注册、不登录，\
        也没有试用期。本站带广告，那是养活它的东西；广告拿不到任何关于你文档的\
        内容。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没被上传的\
        最简单的办法：一个把你的文档发出去盖章的工具，你一拔网线它就停了。"""

