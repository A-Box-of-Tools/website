#
# Watermark a PDF - 简体中文。
#
# Overrides for tools/watermark-pdf/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样。
#
# 第一件：水印是什么、不是什么。它是压在每一页上的一行字，让一份副本自己说出
# 它去了哪里、是干什么用的，「仅供某某银行使用」、一个日期、一个名字。这对扫描件
# 被拿去别处冒用是一道真实的防线，因为冒用会被看见。它不是保护：任何一个有编辑器
# 的人都能把它去掉，这一页从不暗示别的。锁文档的工具在隔壁，页面会指过去。
#
# 第二件：水印是一张图，不是文字。浏览器用它自己的字体把字画出来，什么文字都行，
# 这张图带着透明度压在每一页上。所以中文、阿拉伯文的水印不用嵌字体就能做，也所以
# 做完之后这些字不能被选中、不能被搜索。页面两半都说了。预览画的是文件会得到的
# 位置，用同一套算法，画在一张跟访客第一页一样大的空白页上，从来不是他们文档的
# 渲染，本站做不了那件事。
#

