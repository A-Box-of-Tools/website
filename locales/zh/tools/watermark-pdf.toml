[[privacy]]
title = "人们要加水印的文档，正是他们最不想上传的那份。"
body = """\

      给房东的护照扫描件。给贷款经纪的对账单。不能泄露的合同草稿。给一份文档盖上\
      「这是给谁的」，理由就是它马上要离开你的手，而每一个提供盖章的在线工具都要\
      你先把它交给一台陌生的服务器，那恰恰是水印要防的事。这一页做不到那件事。文件\
      是你自己的浏览器读的，字是你自己的浏览器画的，盖好章的副本在内存里写出，页面\
      的 <code>Content-Security-Policy</code> 列出了这一页可以联系的每一个地址，其中\
      没有一个属于本站。把网络断掉它照样能用。"""

[[privacy]]
title = "水印说的是一份副本去了哪里。它拦不住有人复制。"
body = """\

      这就是这件事诚实的大小。每一页上都压着「仅供某某银行使用，2026 年 9 月 12 \
      日」，意味着一份出现在别处的扫描件带着它泄露出去的那个地方的名字，这正是银行、\
      律师和房东要求盖章的原因，也是这件事值得做的原因。它不是保护：任何一个有 PDF \
      编辑器的人都能把水印再去掉，一个告诉你别的说法的页面是在推销什么。如果这份\
      文档根本不能被错误的人读到，那就用 <a href=\"../protect-pdf/\">PDF 加密</a>\
      给它加上密码，结果下面那一排「接着去」的链接直接通到那里。"""

[[privacy]]
title = "水印是一张图，所以任何语言、任何字体都行。"
body = """\

      一份 PDF 只能用它自己带着的字体、或者每个阅读器都默认有的那十四种字体来画\
      文字，而那十四种是拉丁字母。这里没有去嵌一个字体，那要好几兆，还要一个本站\
      决定不去背的引擎，而是让你的浏览器用你自己机器上的字体把字画一次，你打什么\
      文字都行，然后作为一张带透明遮罩的图压在每一页上。画的分辨率打印机看不出\
      区别。代价是做完之后这些字不能被选中、不能被搜索，对水印来说这反而是对的：\
      它是给人看的，不是给人复制出去的。"""

[[privacy]]
title = "页面本身不会被读取、重新渲染或者重排。"
body = """\

      这个工具往文档里加的是三个小对象，那张图、它的遮罩和一个透明度设置，往每一页\
      加的是两条极小的绘制指令，一条在页面原有内容之前，一条在之后。页面自己的\
      内容没有被解码，更没有被改动：每一条绘制指令、每一个嵌入字体、每一张图片都按\
      原样写回去，所以扫描件还是扫描时的分辨率，文字还能选、还能搜，什么都不会\
      移位。唯一会变的是任何一次重写都会变的东西：早先编辑留下的、已经被取代的旧\
      对象不再带过来。"""

[[privacy]]
title = "预览画的是位置，不是你文档的渲染。"
body = """\

      本站没有 PDF 渲染器，这是有意的，它也不假装有。预览显示的是一张跟你第一页\
      大小形状完全一样的空白页，水印压在文件会把它放的位置上，用的是写文件的同一\
      套算法，所以两者不可能不一致。你自己页面上的内容不会被画出来，因为画它需要\
      一个浏览器那么大的引擎，而一个靠猜的预览比没有预览更糟。"""

[[privacy]]
title = "做好的文件在交给你之前，会在这里重新打开一次。"
body = """\

      在那之前，上面这些话都只是这个工具在给自己判卷。所以那些马上就要变成你下载\
      的字节，会被交给本站每一个 PDF 工具用的同一个读取器，而每一页回来时都必须在\
      它的资源里带着水印的名字、并且以画出水印的那条指令收尾，页数跟原来一样。过不\
      了这一关的文件会报告为失败，也不会有下载。"""

[[privacy]]
title = "数字签名过不了这一关，有签名的时候页面会说。"
body = """\

      签名覆盖的是它当初签的那个文件的确切字节，所以任何重写都会让它失效，这正是\
      签名的用处。这个工具写的是一个新文件，所以你拿回去的那份是没有签名的；发现\
      文件带着签名时，它会在结果里说明。你的原件仍然是那份签过名的。"""

[[privacy]]
title = "锁着的文档会先被送到隔壁。"
body = """\

      要密码才能打开的文件，不打开就没法盖章，而这一页不问密码。它会把这样的文件\
      退回，附一个去 <a href=\"../unlock-pdf/\">PDF 解锁</a>的链接，在同一个浏览器里\
      把保护去掉；解锁后的副本拿回这里盖章，之后再用 <a href=\"../protect-pdf/\">\
      PDF 加密</a>把密码加回去。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
 广告和统计脚本来自 Google。这两个都没有拿到关于你文档的任何\
      东西：不是文件，不是某一页，不是文件名、大小、页数，也不是水印上的字。每一\
      行读取、盖章或者写出 PDF 的代码都由这个源站发出，并且列在代码仓库里。"""

[[privacy]]
title = "打赏按钮加载了什么，又没拿到什么。"
body = """\

      页眉上那个「Buy me a coffee」按钮，是由 cdnjs.buymeacoffee.com 的一段脚本\
      画出来的，字体取自 Google Fonts。它就是一个链接，仅此而已：它不上报访问，\
