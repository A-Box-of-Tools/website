[[privacy]]
title = "你的图片无处可去。"
body = "内容安全策略列出了本页可以联系的每一个地址，其中没有任何地址属于本网站。这里没有收集文件的接口，也没有发送文件的代码。"

[[privacy]]
title = "无需提供解码器，所以无需服务器。"
body = "2020 年以来的每个浏览器都能解码 WebP，也早就能写 JPEG。因此本工具没有引擎，第一次使用也不下载任何内容，没有服务器存在的理由。这正是要求上传的转换器没告诉你的事。这里唯一提供编解码器的是 <a href=\"../heic-to-jpg/\">HEIC 转换器</a>，因为 HEIC 的确只有 Safari 能打开，其页面已详细说明。"

[[privacy]]
title = "透明区域，以及它们背后的颜色。"
body = "WebP 可以透明，JPEG 没有透明通道，必须填充背景。本页询问颜色并默认白色，仅在文件确实有透明像素时询问，检查的是解码后的像素而非格式。没询问的转换器不是保留透明，而是替你选择了黑色，这就是徽标黑底的来源。"

[[privacy]]
title = "画布不会保留的内容。"
body = "图片解码并绘制到画布，画布只有像素，因此 EXIF、ICC 色彩配置、XMP 和版权信息都无法保留。多数人认为这是好处，另一些人认为是损失，所以事先说明。若需要元数据，<a href=\"../exif-editor/\">EXIF 查看与移除工具</a>可读写它们而不重新压缩。"

[[privacy]]
title = "Google 加载什么，又拿不到什么。"
body = "广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们都不会获得你的图片信息。读取、解码和写入文件的每一行代码都来自本站，并列在代码仓库中。"

[[privacy]]
title = "可以离线使用。"
body = "先加载页面再断开网络，工具仍然照常工作。这是最简单的证明：如果转换器把图片发送出去处理，它就不可能做到这一点。"

[[howto]]
title = "选择 WebP 文件。"
body = "拖入或手动选择。工具根据开头字节识别真实格式，不看文件名，所以叫“.jpg”的 WebP 也能使用。真正的 PNG 会被拒绝并说明实际格式，而不是转成自身的副本。"

[[howto]]
title = "阅读每一行的文件信息。"
body = "列表显示大小、尺寸以及转换前应知道的三件事：是否无损、是否透明、是否动画。只有实际具备时才显示对应提示。"

[[howto]]
title = "设置质量和透明区域背后的颜色。"
body = "滑块从 92 开始，此时照片很难与原图区分。颜色控件只在列表中有透明图片时出现，因为 JPEG 必须填充这些区域。"

[[howto]]
title = "点击“转换”，然后下载。"
body = "每个结果显示来源、转换后大小和变化，若透明被填充或只保留动画首帧，也会提示。单个文件可直接下载，多个文件还能打包成 ZIP。"

[[faq]]
q = "图片会被上传到哪里吗？"
a = "不会。文件由你的浏览器在你的硬件上读取、解码和写出。本工具没有网络功能，不获取也不发送任何内容。<code>Content-Security-Policy</code> 列出所有允许联系的地址，没有一个属于本网站。与旁边的 HEIC 转换器不同，这里连解码器也不用先加载，浏览器已经有了。"

[[faq]]
q = "为什么要把 WebP 转为 JPG？"
a = "因为接收图片的软件还不支持。浏览器右键保存网页图片常得到 WebP，它体积很小，但很多软件仍不接受：旧版 Office 和 Photoshop、部分印刷店、检查扩展名的上传表单、多数电子书阅读器，以及很多相机或打印机附带软件。JPG 则一直普遍支持。"

[[faq]]
q = "透明区域会怎样？"
a = "会填充你选择的颜色，页面在转换前就会说明。JPEG 没有透明通道，所以透明无法保留，能选择的只有背景颜色。决定权在你而非转换器。默认白色适合放入文档的徽标。若要透明，请保留 WebP，或用<a href=\"../compress-image/\">图片压缩器</a>转为 PNG；它也能输出 PNG 和 WebP。"

[[faq]]
q = "能转换动态 WebP 吗？"
a = "只转换第一帧，转换前的文件行和转换后的结果都会说明。JPEG 只能保存一张图片，无法容纳其余帧。若需要每帧单独文件或动画视频，可先转成 GIF，再使用<a href=\"../split-gif/\">拆分 GIF</a> 或 <a href=\"../gif-to-mp4/\">GIF 转 MP4</a>。"

[[faq]]
q = "图片会被重新压缩吗？"
a = "会，无法避免。WebP 和 JPEG 是不同编码，必须先解码再重新编码。所有 WebP 转 JPG 转换器都这样，包括要求上传的。你控制损失多少，滑块默认 92，照片很难与原图区分。无损 WebP 尤其要注意：生成的 JPEG 会成为这张图的第一份有损副本。工具在列表中标记无损文件，避免意外。"

[[faq]]
q = "JPG 会比 WebP 大吗？"
a = "经常会，结果明确显示差别。WebP 在相同可见质量下比 JPEG 更高效，因此网页开始使用它。反向转换通常会增加大小。这是用体积换兼容性，对不接受 WebP 的目标很合理。需要再限制大小时，<a href=\"../compress-image/\">图片压缩器</a>可把 JPEG 压到指定值。"

[[faq]]
q = "日期、相机和位置会保留吗？"
a = "不会。画布只有像素，所以 EXIF、GPS、色彩配置和 XMP 全部丢弃。实际网页上的 WebP 大多已经移除这些内容，发送图片的人通常也希望如此。需要查看或修改携带的信息时，<a href=\"../exif-editor/\">EXIF 查看与移除工具</a>可处理而不重新压缩图片。"

[[faq]]
q = "能一次转换整个文件夹吗？"
a = "能。拖入任意数量的文件，没有数量或大小限制，因为没有服务器承担处理。每个文件单独显示并可下载，两个或更多文件可打包成 ZIP。同名文件在扩展名前加数字，避免归档中静默覆盖。"

[[faq]]
q = "免费吗？需要账号吗？"
a = "免费，无需账号、登录或试用，没有水印。网站通过广告维持运营，广告不会获得你的图片信息。"

[[faq]]
q = "可以离线使用吗？"
a = "可以。先加载页面，再断开网络，工具完全照常运行。这也是确认没有上传的最有力证据：向服务器发送文件的转换器断网就会停止，本工具不会。"

