name = "视频剪切"
# 后半段是人们真正会搜的词。和英文一样，产品名仍然是响亮的那一半。
heading = "视频剪切 <span class=\"h1-kw\">在线剪视频</span>"
tagline = "一边看一边标出要留的段落，最后拿回一个视频。"

title = "在线剪视频 | 只留你要的段落，不用上传"
description = "一边看一边把值得留的段落标出来，然后把这些段落存成一个文件。在浏览器里跑，不上传，不重新编码，断网也能用。"
og_title = "视频剪切 | 只留你要的段落，什么都不用上传"
og_description = "播放时按 I 和 O 标出每一段要留的。标好的段落会被逐帧原样写成一个视频，全程不上传。"
og_image_alt = "视频剪切 - 标出要留的段落，在浏览器里存成一个视频"

pledge = """
    你的视频由你自己的浏览器读取、标记、剪切、写出，用的是你自己的硬件。这里\
    没有任何东西能取数据或者发数据，这个工具压根没有联网功能。就算真有，这个\
    页面的另一头也没有服务器能接住一段视频。"""

live_hint = """
      别信我们嘴上说的。打开开发者工具，盯着“网络”面板，剪一段试试。没有一条\
      请求带着画面帧、文件名，或者你选中内容里的任何一个字节。或者干脆拔掉\
      网线照剪，一个把视频送出去剪的工具，这时候就该停了。"""

read_first = """\
      ，<code>src/segments.js</code> 里是那些标记和它们存成的文件，\
      <code>src/demux.js</code> 里是在 MP4 里找出帧的那个读取器，\
      <code>src/ranges.js</code> 里是把一个标记换算成一串采样的那套算术，\
      <code>src/copy.js</code> 里是把这些采样搬进新文件的那个循环。这几个都\
      没有引入任何能发请求的东西。"""

howto_heading = "视频怎么剪"

card = """
            一边看一边把值得留的段落标出来，再把它们存成一个视频。画面帧是\
            搬过去的，不是重编的，所以什么都不会丢。"""

[words]
plural = "视频"
choose = "视频"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "没有水印"

[[facts]]
text = "想标几段就标几段"

[[facts]]
text = "画质不掉"

[[facts]]
text = "断网能用"

[[privacy]]
title = "你的视频没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      这个工具完全没有联网功能。没有网址可以粘，没有东西要下载，第一次用也\
      不去取什么引擎。碰过你视频的每一个字节，都是页面加载时从本站来的。"""

[[privacy]]
title = "走常规那条路，连解码都没有。"
body = """\
      剪切不会改变任何一帧的样子，所以你标出来那些段落的编码帧，是照原样搬进\
      新文件的。每一帧在这期间只是你硬盘上那个文件的一小段引用，也就是一句\
      “从第几个字节到第几个字节”，而不是字节本身。真正把它们读出来，是你的\
      浏览器在写下载文件的那一刻。这里从来没有哪一步把你的视频还原成画面。"""

[[privacy]]
title = "标记文件是在这个页面里生成的。"
body = """\
      保存标记，就是把屏幕上那些数字写成一个文本文件，直接进你的下载目录。\
      载入标记则在这儿把它读回来。两边都不沾网络，文件里除了时间点什么\
      都没有。"""

[[privacy]]
title = "声音只是搬过去，没人听。"
body = """\
      两条 MP4 路径上，音频采样都是整块搬过去的，根本不解码。这里没有任何东西\
      会把它们还原成声音，就算还原了，也没地方可送。"""

[[privacy]]
title = "需要解码的地方，也在这儿解。"
body = """\
      精确剪切，以及这个浏览器放不了的文件的预览，走的是你自己机器上的
      WebCodecs。那本来就是要放给你看这段视频的同一个解码器，跑在同一个\
      地方。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你视频的信息，一条都没给它们，文件\
      不给，画面帧不给，文件名、大小、时长、你在哪儿下的刀，也都不给。读取、\
      剪切、写出的每一行代码都从本站发出，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也拿不到\
      关于你或者你视频的任何东西。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是最省事的一条证明。"""

[[howto]]
title = "选一段视频。"
body = """\
      把 MP4、MOV、M4V 或者 WebM 拖到下面的方框里。浏览器直接从你的硬盘上读，\
      这期间没有东西发出去。一次拖好几个，它们会按你放进去的顺序接起来。"""

[[howto]]
title = "放起来，把要留的段落标出来。"
body = """\
      该开始的地方按 <kbd>I</kbd>，该结束的地方按 <kbd>O</kbd>，想标几次标几次。\
      每一对就是下面表格里的一行，也是时间轴上的一条色带。<kbd>U</kbd> 撤销刚才\
      那一次，<kbd>Space</kbd> 播放和暂停，方向键一次跳五秒。那一下不好抓的话，\
      把播放速度放慢。"""

[[howto]]
title = "把标记调准。"
body = """\
      每一行都能单独回放，也能直接打进一个精确时间来改，还能上下调顺序或者\
      删掉。选中那一段的两个端点，也可以在时间轴上直接拖。上面那个合计，就是\
      成品视频将有多长。"""

[[howto]]
title = "是留下它们，还是剪掉它们。"
body = """\
      通常是留下：成品就是你标出来的那些段落，按顺序接在一起。剪掉是另一件\
      大家想干、却很少找得到工具的活，把广告、冷场、废镜头标出来，剩下的部分\
      会自动接上。"""

[[howto]]
title = "剪完就下载。"
body = """\
      “一个字节都不动”是把画面帧原样搬过去，快，而且不可能掉画质，代价是每一段\
      从你标记之前那个关键帧开始。“就在这儿下刀”会把画面解码重写一遍，每一段\
      都从你选中的那一帧开始。你按按钮之前，页面就写明了你将拿到哪一种，以及\
      它的代价。"""

[[faq]]
q = "我的视频会传到什么地方去吗？"
a = """
        不会。读取、标记、剪切、写出，全由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器那一半，页面的 <code>Content-Security-Policy</code>\
        把它可能联的地址全列了出来，没有一个是本站的。与其听我们说，不如拔掉\
        网线，照剪一段试试。"""

[[faq]]
q = "同一段视频里能留好几处吗？"
a = """
        这正是它的本行。播放时想按几次 <kbd>I</kbd> 和 <kbd>O</kbd> 就按几次，\
        每一对成为一行，成品就是这些行按顺序接起来，别的全没了。网上多数剪切\
        工具只给你一对滑块，问你要留哪一段。掐头去尾还行，可要是你只想把一小时\
        素材看一遍、留下其中值得的六个瞬间，那就完全不够用。"""

[[faq]]
q = "剪切会掉画质吗？"
a = """
        走常规那条路不会，至少在要紧的意义上不会。剪切不改变任何一帧的样子，\
        所以那些帧是原样搬进新文件的，字节一样，编码参数一样，什么都一样。这里\
        唯一会重新编码的是精确剪切，而按钮上就写着。"""

[[faq]]
q = "为什么有一段开始得比我标的早？"
a = """
        这跟视频的存储方式有关，而且只在那些忽略了格式中一项标准约定的播放器上\
        才看得出来。多数帧存的是“我跟邻居有哪些不同”，离开邻居就解不出来；只有\
        关键帧能独立成立，而关键帧一般每隔一到十秒才有一个。所以靠复制帧来剪，\
        就必须把你标记前面那个关键帧起的一段一并带上。文件里同时写明了\
        <em>从你标记的位置开始播</em>，主流播放器都认这一条。你要是需要在任何\
        播放器上都精确，那就选“就在这儿下刀”，它会重新编码。导出之前，页面会\
        告诉你落在哪种情况，以及差了多少。"""

[[faq]]
q = "反过来，能把广告剪掉吗？"
a = """
        能。把它们标出来，然后选“剪掉它们”，于是接起来的是你<em>没</em>标的那些\
        部分，顺序不变。同一份标记回答的是同一个问题的两面，所以你可以来回切换，\
        看着时长变化，而不用重标一遍。"""

[[faq]]
q = "标记能保存下来，回头再接着弄吗？"
a = """
        能。“保存标记”写出一个纯文本文件，一行一段，开始和结束用逗号隔开；\
        “载入标记”把它读回来。两种格式可选，纯秒数和 <code>HH:MM:SS.mmm</code>，\
        都遵循同类工具早就在用的那种排布，所以这儿写出来的文件能拿给它们用，\
        它们写出来的文件也能拖到这个页面上。标记是个细致活，谁都不该干第二遍。"""

[[faq]]
q = "能剪哪些格式？"
a = """
        MP4、M4V 和 MOV 直接读，里面装的是 H.264、HEVC、AV1 还是 VP9 都行。复制\
        帧这件事根本不涉及解码，所以哪怕你的浏览器压根没有那个编码的解码器，这\
        条路照样走得通。其他浏览器能播的格式，最典型的是 WebM，改成一边播一边录\
        来剪，能用，结果多长就得花多长时间，而且只能留一段。浏览器既读不了也\
        播不了的文件，实际上就是 AVI、WMV、FLV 和大多数 MKV，会被直接拒收并说明\
        原因，不会干到一半才崩。"""

[[faq]]
q = "视频的大小和长度有限制吗？"
a = """
        工具里没设上限，而且走复制那条路时，文件基本没被读过：你要留的那些帧只是\
        被指着，不是被装进来的，所以从一个四 GB 的录像里留四分钟，花的代价大约\
        就等于把这四分钟写到硬盘上。精确剪切则一次几兆地走过整个文件。两条路的\
        真正天花板都是成品，它要在内存里拼好你才能下载。"""

[[faq]]
q = "声音会保住吗？"
a = """
        两条 MP4 路径上，音频都是逐个采样复制过去、全程不解码的，跟原文件里的\
        字节一模一样，而且每一段的声音跟画面对齐到千分之一秒以内。唯一的例外是\
        把几个声音描述方式不同的视频接在一起，比如采样率不一样，那种情况下不解码\
        就没法把它们塞进同一条音轨，页面会在动手之前说明。走录制那条路，声音是从\
        播放里采下来再编一遍的。两种情况都有个勾选框，可以干脆不要声音。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费就是\
        这么来的，广告拿不到关于你视频的任何信息。"""

[schema]
browser_requirements = "需要 JavaScript。复制帧那条路完全不需要视频编解码支持；精确剪切需要浏览器支持 WebCodecs，其他格式则退回到录制。"
description = "视频播放时想标多少段就标多少段，然后把这些段落存成一个文件，或者反过来把它们剪掉、留下其余部分。MP4、MOV 和 M4V 是把编码帧原样搬进新文件来剪的，原音频逐采样带过去，什么都不上传，也什么都不重新编码。"
features = [
  "播放时用 I 和 O 标记任意多个段落",
  "把标好的段落按你定的顺序接成一个文件",
  "也可以反过来剪掉标记的部分，留下其余",
  "不重新编码就能剪，画质一点不掉",
  "标记能存成纯文本时间戳文件，也能读回来",
  "标记精确到帧，时间轴上标出关键帧位置",
  "原来的音频照搬，不重新编码",
  "断网能用，不上传，不注册，没有水印",
]

[picker]
title = "把视频拖到这儿"
hint = "或者点击选择，MP4、MOV、M4V、WebM。一次拖好几个就接起来。"
