browser_requirements = "需要 JavaScript。复制帧完全不需要任何视频编解码支持；精确剪切需要一个支持 WebCodecs 的浏览器，其他格式则退回到录制。"
description = "一边播放一边把视频里任意多个部分标出来，然后把这些部分存成一个文件 —— 或者反过来把它们剪掉、留下其余部分。MP4、MOV 和 M4V 是把编码帧原样搬进新文件来剪的，原音频也逐采样带过去；什么都不上传，什么都不重新编码。"
features = [
  "播放时用 I 和 O 标出任意多个部分",
  "把标出来的部分按你选的顺序接成一个文件",
  "也可以反过来把标出来的部分剪掉，留下其余全部",
  "剪切不重新编码，所以不损失任何质量",
  "标记可以存成纯文本时间戳文件，也可以再读回来",
  "帧级精确的标记，时间轴上标出关键帧",
  "保留原音频，不重新编码",
  "断网可用；不上传，不注册，无水印",
]

[picker]
