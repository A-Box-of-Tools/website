[[privacy]]
title = "你的视频无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      这个工具根本没有网络功能，没有地址可粘，没有东西要下载，第一次用也不会\
      去拉什么引擎。碰过你视频的每一个字节，都是页面加载时从这个源来的。"""

[[privacy]]
title = "走常规那条路时，连解码都不发生。"
body = """\
      剪切并不改变任何一帧的样子，所以你标出来那几段的编码帧，是按找到时的\
      原样搬进新文件的。每一帧都以“你硬盘上那个文件的一个切片”的形式存在，\
      也就是一条写明哪些字节的记录，不是那些字节本身，而你的浏览器直到写\
      下载的那一刻才第一次读它们。这里没有任何东西会把你的视频变回画面。"""

[[privacy]]
title = "标记文件是在页面里生成的。"
body = """\
      保存标记，就是把屏幕上已经有的那些数字写成一个文本文件，直接进你的\
      下载。加载一个标记文件，也在这里读。两者都不靠近网络，也都只带着\
      时间点，别的什么都没有。"""

[[privacy]]
title = "声音只是搬了个地方，没人听。"
body = """\
      两条 MP4 路径上，音频采样都原样搬过去，根本不解码。这里没有任何东西会\
      把它们变回声音，就算变了，也没有任何东西能把它们送去哪里。"""

[[privacy]]
title = "确实要解码帧的地方，也发生在这里。"
body = """\
      精确剪切，以及给这个浏览器播不了的文件做的预览，走的是你自己机器上的
      WebCodecs。那就是本来会把视频放给你看的同一个解码器，跑在同一个地方。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你视频的信息，一条也没有交给它们，\
      文件不给，某一帧不给，名字、大小、时长、你在哪儿下的刀，都不给。读取、\
      剪切、写出的每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也\
      拿不到任何关于你或者你视频的信息。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上的一切照常运转。这是最省事的一条证明。"""

[[howto]]
title = "选一段视频。"
body = """\
      把 MP4、MOV、M4V 或者 WebM 拖到下面的方框里。浏览器直接从你的硬盘上读，\
      整个过程没有东西被送去别处。一次拖好几个的话，它们会按你放进去的顺序\
      接起来。"""

[[howto]]
title = "播放，把你要的部分标出来。"
body = """\
      一段该开始的地方按 <kbd>I</kbd>，该结束的地方按 <kbd>O</kbd>。想标多少\
      次就标多少次，每一对都会在下面的表格里成为一行，也会在时间轴上成为一条\
      色带。<kbd>U</kbd> 撤回最后一次，<kbd>Space</kbd> 播放和暂停，方向键\
      一次跳五秒。那一瞬间不好抓的话，把播放速度放慢。"""

[[howto]]
title = "把标记修一修。"
body = """\
      每一行都可以单独回放、可以填一个精确时间来改时间点、可以在顺序里上下\
      移动，也可以删掉。选中那一段的两端还能沿着时间轴拖动。顶上那个总时长，\
      就是最终视频的长度。"""

[[howto]]
title = "留下它们，或者把它们剪掉。"
body = """\
      留下是常见的那个方向，最终视频就是你标出来的那些部分，按顺序接起来。\
      把它们剪掉是大家想要、却很少找得到的另一件事，把广告、静音段或者说砸\
      了的开头标出来，剩下的会被接起来，中间没有它们。"""

[[howto]]
title = "剪切，然后下载。"
body = """\
      选“每个字节都保留”，帧就原样搬过去，快，而且不可能损失质量，代价是每\
      一段会从你标记之前的那个关键帧开始。选“就在这里精确切开”，画面会解码\
      并重新写一遍，这样每一段都正好从你选的那一帧开始。你还没按按钮，页面\
      就先告诉你即将拿到的是哪一种，以及它的代价。"""

[[faq]]
q = "我的视频会被传到什么地方去吗？"
a = """
        不会。读取、标记、剪切、写出，都由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        把它可能联系的地址全列了出来，其中没有一个属于本站。与其听我们说，\
        不如拔掉网线，照样剪一段试试。"""

[[faq]]
q = "我能从同一段视频里留下好几个部分吗？"
a = """
        这就是它的用武之地。播放时想按多少次 <kbd>I</kbd> 和 <kbd>O</kbd> 就\
        按多少次，每一对成为一行，最终视频就是所有行按顺序接起来，其余部分\
        全都不要。大多数在线剪辑工具只给你一对手柄，问你要留下哪一段连续的\
        区间，这对于掐头去尾还行，碰上“把一小时素材看一遍、留下值得留的那\
        六个瞬间”就完全没用了。"""

[[faq]]
q = "剪切会损失质量吗？"
a = """
        走常规那条路不会，而且在要紧的意义上不会。剪切并不改变任何一帧的\
        样子，所以那些帧是按原样搬进新文件的，同样的字节、同样的编码器设置、\
        同样的一切。这里唯一会重新编码的路径是精确剪切，而按钮上就写着这\
        一点。"""

[[faq]]
q = "为什么有一段比我标的位置开始得早？"
a = """
        因为视频的存储方式，而且只发生在那些忽略了格式中一项标准约定的播放器\
        上。大多数帧是以“它和邻居有什么不同”的描述保存的，离了邻居就解不出来，\
        只有关键帧能独立存在，而关键帧通常相隔一到十秒。所以一次靠复制帧完成\
        的剪切，必须把你标记之前那个关键帧起的一段一并带上，而文件里写着\
        <em>从你标记的位置开始播</em>，主流播放器都遵守这一点。你要是需要在\
        每一个播放器里都精确，就选“就在这里精确切开”，它会重新编码。导出之前，\
        页面会告诉你你落在哪种情况，以及差了多少。"""

[[faq]]
q = "我能反过来，把广告剪掉吗？"
a = """
        能。把它们标出来，然后选“把它们剪掉”，这次被接起来的是你<em>没有</em>\
        标出来的所有部分，按顺序排列。同一份标记同时回答这两个问题，所以你\
        可以在两者之间来回切换、看着时长变化，而不用把任何东西标第二遍。"""

[[faq]]
q = "我能把标记存下来，以后回来接着做吗？"
a = """
        能。“保存标记”会写出一个纯文本文件，一段一行，起点和终点用逗号隔开，\
        “加载标记”再把它读回来。提供两种格式，纯秒数和\
        <code>HH:MM:SS.mmm</code>，两种都沿用其他同类工具已经在用的排版，所以\
        这里写出的文件可以交给那些工具，那边写出的文件也可以拖到这个页面上。\
        做标记是个细致活，谁也不该干第二遍。"""

[[faq]]
q = "我能剪哪些视频格式？"
a = """
        MP4、M4V 和 MOV 是直接读的，里面装什么都行，H.264、HEVC、AV1 或者
        VP9。复制帧并不涉及解码它们，所以哪怕你的浏览器根本没有对应的解码器，\
        这条路照样走得通。其他你的浏览器能播的格式，最典型的是 WebM，改成\
        一边播一边录来剪，能用，但结果多长就要花多长时间，而且只能留下一段。\
        浏览器既读不了也播不了的文件，实际上就是 AVI、WMV、FLV 和大部分 MKV，\
        会当场拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "视频的大小或时长有上限吗？"
a = """
        工具本身没有内建上限，而且走复制那条路时，文件几乎没被读过，你留下的\
        那些帧是被指向的，不是被载入的，所以从一个四 GB 的录像里留下四分钟，\
        代价大约就是把那四分钟写到硬盘上的代价。精确剪切则是一次几兆地把文件\
        走一遍。两种情况下，真正的天花板都是最终那个文件，它得先在内存里拼\
        出来你才能下载。"""

[[faq]]
q = "声音保得住吗？"
a = """
        两条 MP4 路径上，音频都是一个采样一个采样复制过去的，从头到尾没解码，\
        跟原文件里的逐字节相同，而一条编辑标记会让每一段的声音和它的画面对齐\
        到千分之一秒以内。唯一的例外是把声音描述方式不同的多个视频接起来，\
        比如采样率不一样，那种情况下不解码就没办法把两者放进同一条音轨，页面\
        会在动手之前说明这一点。走录制那条路时，声音是从播放里录下来再编码\
        一次的。两种情况都有一个勾选框可以干脆不要声音。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费\
        就是从那儿来的，广告拿不到任何关于你视频的信息。"""

[schema]
browser_requirements = "需要 JavaScript。复制帧完全不需要任何视频编解码支持；精确剪切需要一个支持 WebCodecs 的浏览器，其他格式则退回到录制。"
description = "一边播放一边把视频里任意多个部分标出来，再把这些部分存成一个文件，或者反过来把它们剪掉、留下其余部分。MP4、MOV 和 M4V 是把编码帧原样搬进新文件来剪的，原音频也逐采样带过去，什么都不上传，什么都不重新编码。"
features = [
  "播放时用 I 和 O 标出任意多个部分",
  "把标出来的部分按你选的顺序接成一个文件",
  "也可以反过来把标出来的部分剪掉，留下其余全部",
  "剪切不重新编码，所以不损失任何质量",
  "标记可以存成纯文本时间戳文件，也可以再读回来",
  "帧级精确的标记，时间轴上标出关键帧",
  "保留原音频，不重新编码",
  "断网可用，不上传，不注册，无水印",
]

[picker]
title = "把视频拖到这里"
hint = "或者点击选择，MP4、MOV、M4V、WebM 都行。一次拖好几个就会把它们接起来。"
