[[privacy]]
title = "你的视频没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这里不存在能收集你文件的接口，代码里也没有任何一处\
      会去发送它，哪怕真有这么个接口。"""

[[privacy]]
title = "这里没有任何东西会去取什么。"
body = """\
      这个工具根本没有网络功能：没有地址可粘，没有东西要下载，第一次用的\
      时候也不会去拉什么引擎。每一个碰到你视频的字节，都是页面加载时从这个\
      源来的。"""

[[privacy]]
title = "走常规那条路时，连解码都不发生。"
body = """\
      剪切并不改变任何一帧的样子，所以你标出来那几段的编码帧，是按找到时的\
      原样搬进新文件的。每一帧都以“你硬盘上那个文件的一个切片”的形式存在
      &mdash; 是一条写明哪些字节的记录，不是那些字节本身 &mdash; 而你的浏览器\
      直到写下载的那一刻才第一次读它们。这里没有任何东西会把你的视频变回\
      画面。"""

[[privacy]]
title = "标记文件是在页面里生成的。"
body = """\
      保存标记，就是把屏幕上已经有的那些数字写成一个文本文件，直接进你的\
      下载。加载一个标记文件，也在这里读。两者都不靠近网络，也都只带着\
      时间点，别的什么都没有。"""

[[privacy]]
title = "声音是被复制，不是被听。"
body = """\
      两条 MP4 路径上，音频采样都是原样搬过去的，根本没有被解码 &mdash; 这里\
      没有任何东西会把它们变回声音，就算变了也没有任何东西能把它们送去哪里。"""

[[privacy]]
title = "确实要解码帧的地方，也发生在这里。"
body = """\
      精确剪切，以及给这个浏览器播不了的文件做的预览，走的是你自己机器上的
      WebCodecs。那就是本来会把视频放给你看的同一个解码器，跑在同一个地方。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。它们谁都没有被交给任何关于你视频的\
      信息：不是文件，不是某一帧，也不是名字、大小、时长，或者你在哪儿下的\
      刀。每一行读取、剪切和写出的代码，都由这个源提供，也都列在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是一个链接，没有别的：它不上报访问，\
      也没有被交给任何关于你或你视频的信息。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是所有证明里最简单的一个。"""

[[howto]]
title = "选一段视频。"
body = """\
      把一个 MP4、MOV、M4V 或 WebM 拖到选择框上。浏览器直接从你的硬盘上读\
      它；这个过程中没有任何东西被送去哪里。一次拖好几个的话，它们会按你放\
      进去的顺序接起来。"""

[[howto]]
title = "播放，把你要的部分标出来。"
body = """\
      在一段该开始的地方按 <kbd>I</kbd>，该结束的地方按 <kbd>O</kbd>。想标\
      多少次就标多少次 &mdash; 每一对都会在下面的表格里成为一行，也会在时间\
      轴上成为一条色带。<kbd>U</kbd> 撤回最后一次，<kbd>Space</kbd> 播放和\
      暂停，方向键一次跳五秒。那一瞬间不好抓的话，把播放速度放慢。"""

[[howto]]
title = "把标记修一修。"
body = """\
      每一行都可以单独回放、可以往里面输入一个精确时间来改时间点、可以在\
      顺序里上下移动，也可以删掉。选中那一段的两端还可以沿着时间轴拖动。\
      顶上那个总时长，就是最终视频的长度。"""

[[howto]]
title = "留下它们，或者把它们剪掉。"
body = """\
      留下是常见的那个方向：最终视频就是你标出来的那些部分，按顺序接起来。\
      把它们剪掉是大家想要、却很少找得到的另一件事 &mdash; 把广告、静音段\
      或者说砸了的开头标出来，剩下的会被接起来，中间没有它们。"""

[[howto]]
title = "剪切，然后下载。"
body = """\
      “每个字节都保留”会把帧原样搬过去：快，而且不可能损失质量，但每一段会\
      从你标记之前的那个关键帧开始。“就在这里精确切开”会把画面解码并重新\
      写一遍，这样每一段都正好从你选的那一帧开始。你还没按按钮，页面就会\
      告诉你即将拿到的是哪一种，以及它的代价。"""

[[faq]]
q = "我的视频会被上传到什么地方吗？"
a = """
        不会。它由你自己的浏览器、在你自己的硬件上读取、标记、剪切和写出。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        列出了它可能联系的每一个地址 &mdash; 其中没有一个属于本站。与其听\
        我们说，不如拔掉网线，照样剪一段试试。"""

[[faq]]
q = "我能从同一段视频里留下好几个部分吗？"
a = """
        这就是它的用武之地。播放时想按多少次 <kbd>I</kbd> 和 <kbd>O</kbd> 就\
        按多少次；每一对成为一行，最终视频就是所有行按顺序接起来，其余部分\
        全都不要。大多数在线剪辑工具只给你一对手柄，问你要留下哪一段连续的\
        区间，这对于掐头去尾还行，对于“把一小时素材看一遍、留下值得留的那\
        六个瞬间”则完全没用。"""

[[faq]]
q = "剪切会损失质量吗？"
a = """
        走常规那条路不会，而且在要紧的意义上不会。剪切并不改变任何一帧的\
        样子，所以那些帧是按原样搬进新文件的：同样的字节、同样的编码器设置、\
        同样的一切。这里唯一会重新编码的路径是精确剪切，而按钮上就写着这\
        一点。"""

[[faq]]
q = "为什么有一段比我标的位置开始得早？"
a = """
        因为视频的存储方式，而且只发生在那些忽略了格式中一项标准约定的播放器\
        上。大多数帧是以“它和邻居有什么不同”的描述保存的，所以离了邻居就解不\
        出来；只有关键帧能独立存在，而关键帧通常相隔一到十秒。因此，一次靠\
        复制帧完成的剪切，必须把你标记之前那个关键帧起的一段一并带上 &mdash;
        而文件里写着<em>从你标记的位置开始播</em>，主流播放器都遵守这一点。\
        如果你需要在每一个播放器里都精确，就选“就在这里精确切开”，它会重新\
        编码。导出之前，页面会告诉你你落在哪种情况，以及差了多少。"""

[[faq]]
q = "我能反过来，把广告剪掉吗？"
a = """
        能。把它们标出来，然后选“把它们剪掉”：这次被接起来的是你<em>没有</em>\
        标出来的所有部分，按顺序排列。同一份标记同时回答这两个问题，所以你\
        可以在两者之间来回切换、看着时长变化，而不用把任何东西标第二遍。"""

[[faq]]
q = "我能把标记存下来，以后回来接着做吗？"
a = """
        能。“保存标记”会写出一个纯文本文件 &mdash; 一段一行，起点和终点用\
        逗号隔开 &mdash; “加载标记”把它读回来。提供两种格式，纯秒数和\
        <code>HH:MM:SS.mmm</code>，两种都沿用其他同类工具已经在用的排版，\
        所以这里写出的文件可以交给那些工具，那边写出的文件也可以拖到这个\
        页面上。做标记是个细致活，谁也不该干第二遍。"""

[[faq]]
q = "我能剪哪些视频格式？"
a = """
        MP4、M4V 和 MOV 是直接读的，里面装的是什么都行：H.264、HEVC、AV1 或
        VP9。复制帧并不涉及解码它们，所以哪怕你的浏览器根本没有对应的解码器，\
        这条路照样走得通。其他你的浏览器能播的格式 &mdash; 最典型的是 WebM
        &mdash; 则改成一边播一边录来剪，能用，但结果多长就要花多长时间，而且\
        只能留下一段。浏览器既读不了也播不了的文件，实际上就是 AVI、WMV、FLV
        和大部分 MKV，会被直接拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "视频的大小或时长有上限吗？"
a = """
        工具本身没有内建上限，而且走复制那条路时，文件几乎没被读过：你留下的\
        那些帧是被指向的，不是被载入的，所以从一个四 GB 的录像里留下四分钟，\
        代价大约就是把那四分钟写到硬盘上的代价。精确剪切则是一次几兆地把文件\
        走一遍。两种情况下，实际的天花板都是最终文件 —— 它要在内存里拼出来\
        你才能下载。"""

[[faq]]
q = "声音保得住吗？"
a = """
        两条 MP4 路径上，音频都是一个采样一个采样复制过去的，从头到尾没被\
        解码，所以它和原文件里的逐字节相同，而一条编辑标记会让每一段的声音\
        和它的画面对齐到千分之一秒以内。唯一的例外是把声音描述方式不同的\
        多个视频接起来 &mdash; 比如采样率不一样 &mdash; 那种情况下，不解码就\
        没办法把两者放进同一条音轨，页面会在动手之前说明这一点。走录制那条路\
        时，声音是从播放里录下来再编码一次的。两种情况下都有一个勾选框可以\
        干脆不要声音。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。本站带广告，\
        这就是它的经费来源；广告拿不到任何关于你视频的信息。"""

