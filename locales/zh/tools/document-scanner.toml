[[faq]]
q = "我的文档会被上传吗？"
a = """
        不会。照片的解码、摆正、清理，以及写成 PDF，全都由你自己的浏览器在你自己的\
        硬件上完成。这个工具没有任何联网功能，从不取东西，也从不发东西，页面的 \
        <code>Content-Security-Policy</code> 里写着它能联系的每一个地址，没有一个\
        属于本站。把页面加载一次，断网，它照样能用。"""

[[faq]]
q = "没有模型，它怎么找到纸的四个角？"
a = """
        靠找出组成一个四边形的那四条又长又直的边。照片先缩小，取梯度，也就是看图像\
        在哪里变、朝哪个方向变，然后每一个落在边缘上的像素都为自己应该落在的那条直线\
        投一票。强的直线两两配成候选四边形，每个候选再走一遍自己的四条边打分：每条边\
        下面究竟有多少真的是边缘，以及这四条边是不是同一样东西的边界。纸要么比周围亮，\
        要么比周围暗，但四条边上是同一种关系，正是这一点让一行字不会被当成纸的下边缘。\
        没有权重，不下载任何东西，任何文档进来算的都是同一套算术。"""

[[faq]]
q = "它找的角不对，怎么办？"
a = """
        拖过去就行。四个角是起点，从来不是决定，扫描的是四个角最后停在哪里。在照片上\
        随便按一下，最近的那个角就跳到你手指这儿来，比去戳一个小手柄容易得多；方向键\
        每次把当前选中的角挪一个像素。角是猜出来的而不是找出来的时候，页面也会说，\
        并在缩略图条上给那一页做个标记。常见的原因是纸放在跟它颜色差不多的桌上，那里\
        确实几乎没有边缘可找。"""

[[faq]]
q = "摆正之后的纸为什么形状是对的，不是被压扁的？"
a = """
        因为形状是从透视里还原出来的，不是从边缘量出来的。斜着拍的纸，远端那条边会被\
        压短，所以最顺手的办法，也就是取最长的一对对边当成比例，会做出一张明显偏矮胖的 \
        A4，网上多数扫描工具给你的就是这个。其实一张四边形的照片里，只要相机是台普通\
        相机，信息就足够同时还原出这个四边形的真实长宽比和相机的焦距。这是 Zhang 和 He \
        在 2003 年的结果，<code>src/geometry.js</code> 做的就是这个。正对着拍的照片\
        没有透视可用，也不需要，因为那时边缘本来就是准的，于是它退回去用边缘，并且\
        页面会说明是哪一种给出了答案。"""

[[faq]]
q = "「清理」到底对图像做了什么？"
a = """
        把光除掉。纸自己的亮度在整页上量一遍：分成一格一格的小块，每块取亮度的一个高\
        分位数，文字太暗也太稀疏，动不了这个数；然后每个像素都除以那一点估出来的纸的\
        亮度。剩下的就是墨迹，光线均匀，阴影和边角发暗都没有了。这跟提高对比度不是一\
        回事：把一张拍下来的纸提高对比度，亮的地方变白，暗的地方变黑，暗处写的字也跟\
        着看不见了。「自动色阶」把这类图片弄得更糟而不是更好，原因就在这里。"""

[[faq]]
q = "黑白模式为什么小那么多？"
a = """
        因为只有两种颜色的图像，数据量确实只是一千六百万色图像的一个零头，这里也就\
        真按那样存：每像素一位，八个一组塞进一个字节，再精确压缩，而不是把一张黑白\
        图片存成 JPEG。在同样的页面上，它比彩色模式小十八倍左右，于是二十页的合同\
        从十五兆左右降到一兆以内。阈值用的是 Sauvola 的方法，每个像素是拿它自己邻域\
        的均值和离散程度来判，而不是拿整页一个数字，这正是阴影里的字还看得清的原因。\
        它没有中间调，所以带照片的页面应该换别的模式。"""

[[faq]]
q = "可以把好几页放进同一个 PDF 吗？"
a = """
        可以。每加一张照片就是下一页，顺序就是列表里的顺序，每一页各自保留自己的四个\
        角，于是接连拍下来的一叠纸就成了一份文档。缩略图条上每一页的箭头可以把它往前\
        或者往后挪。清理设置是所有页共用的，这是故意的：同一份文档里清理方式不同的\
        页面，看着像两份文档。"""

[[faq]]
q = "它会识别文字，让 PDF 可以搜索吗？"
a = """
        不会。这里没有文字层，也没有字符识别，出来的是一页纸的图像放在一页上。真要\
        做好就得用 OCR 引擎，那是几十兆的模型要下载，而一个在读你的工资单之前先去\
        取模型的文档扫描工具，就是一个有理由为工资单往家里打电话的工具。你要是需要\
        文字，黑白模式做出来的文件，恰恰是你自己机器上的 OCR 软件最好处理的那一种。"""

[[faq]]
q = "拍糊了，为什么？"
a = """
        几乎总是因为纸在照片里太小。预览下面那一栏会写纸填满了画面的多少，以及在那个\
        尺寸的纸上大致相当于每英寸多少点。低到 150 DPI 上下，打印出来的扫描件就显得\
        发虚，而文件里本来就没有的细节，任何工具都变不出来。别用变焦，直接走近；\
        端稳；按下之前先让相机在纸上对上焦。另一个原因是手抖，那也救不回来。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，不限页数，也没有水印。照片多大也没有\
        限制，因为根本没有服务器在为它掏钱，活是在你自己的机器上干的。本站靠广告\
        养活，广告那边拿不到关于你文档的任何东西。"""

