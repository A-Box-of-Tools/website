[[privacy]]
title = "你的视频没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个\
      属于本站。这里没有任何可以收走你文件的接收端，就算有，代码里也没有\
      把文件送过去的东西。"""

[[privacy]]
title = "画面根本不会被解码。"
body = """\
      这里只要音轨。每一帧都不读、不解码、不绘制、也不看一眼，因为这个页面上\
      就没有能做这件事的代码，出来的文件里只有声音。这不是一句克制的承诺：\
      把字节交给 <code>decodeAudioData</code>，它返回的就是声音，而 \
      <code>src/</code> 里没有任何视频解码器可以运行。"""

[[privacy]]
title = "解码器就是你浏览器里本来就有的那个。"
body = """\
      这里没有为读你的格式而下发任何东西，也没有为读它去求这个页面之外的\
      任何东西。哪些文件能打开，就是你的浏览器本来能播放的那些。"""

[[privacy]]
title = """WAV 格式明确说明采样精度。"""
body = """16 位 PCM 为了兼容性，会舍入并限制解码后的采样值。保持声道不变时，32 位浮点会保留这些值。单声道会对各声道取平均。两种格式均在本机写入，不上传任何内容。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
      广告和统计脚本来自 Google，捐赠按钮来自 Buy Me a Coffee。它们谁也没\
      拿到关于你视频的任何东西：文件、采样、文件名、大小、时长，都没有。"""

[[privacy]]
title = "断网可用。"
body = """\
      拔掉网线，这个工具一点变化都没有，因为它里面本来就没有联网这一步。\
      这是最简单的证明。"""

[[howto]]
title = "把视频拖进来。"
body = """\
      MP4、MOV、M4V 或 WebM，来自手机、相机、录屏工具，或者一次下载。读它的\
      是你自己的浏览器，这里没有上传这一步可以省略。"""

[[howto]]
title = "看看它读出了什么。"
body = """\
      时长、声道数和采样率，都直接来自文件本身。如果文件没写自己的采样率，\
      页面会说出来，而不是悄悄重采样，再宣称什么都没动过。"""

[[howto]]
title = """选择格式和声道。"""
body = """默认使用兼容性广的 16 位 PCM。选择 32 位浮点并保持声道不变，可保留解码后的采样值，不做舍入或截断。单声道会对声道取平均，并将立体声数据减半。"""

[[howto]]
title = "存之前先听一遍。"
body = """\
      播放器里放的就是马上要下载的那个文件，不是视频。听着对，下载就对。"""

[[howto]]
title = "拿走，或者接着往下传。"
body = """\
      下载这个 WAV，或者不先保存，直接送去剪辑或编辑。"""

[[faq]]
q = "我的视频会被上传到什么地方吗？"
a = """\
        不会。解码和写出都在你自己的浏览器里、你自己的硬件上完成。这个工具压根\
        就没有网络功能，从不取任何东西，也从不发任何东西，页面的 \
        <code>Content-Security-Policy</code> 里写着它允许联系的每一个地址，\
        没有一个属于本站。与其听我们说，不如拔掉网线，照样把声音取出来。"""

[[faq]]
q = "能给我一个 MP3 吗？"
a = """此页面写出 WAV，而非 MP3。MP3 输出需要此工具没有提供的编码器。可选择兼容性广的 16 位 PCM 或 32 位浮点，均无需上传。WAV 的音频未压缩，因此文件更大；之后可用其他编辑器压缩。"""

[[faq]]
q = "画面会被看到吗？"
a = """\
        不会，这里也没有任何东西能看。把文件交给浏览器的解码器，向它要音轨；\
        视频轨从不解码、从不绘制，甚至到不了这个页面的代码里。\
        <code>src/</code> 里没有任何视频解码器可以运行。出来的文件里只有声音。"""

[[faq]]
q = "它说读不到声音，可视频明明能正常播放。"
a = """\
        那这个视频几乎可以肯定就没有音轨。录屏时没选麦克风，录出来是静音的；\
        剪辑软件导出时把声音静音了，也是静音的。两者都能正常播放，因为有画面\
        可放。提示先说这一种，因为它是两种原因里更常见的那个；另一种是这个\
        浏览器读不了的格式。用播放器打开文件，找一找那个怎么调都没反应的音量\
        条，这是分辨两者最快的办法。"""

[[faq]]
q = "我能打开哪些视频格式？"
a = """\
        你的浏览器能解码的都行，实际上就是 MP4、M4V、MOV 和 WebM，另外还有\
        所有音频格式。被挡在外面的还是本站各处都一样的那张短名单：AVI、WMV，\
        以及大多数 MKV。你的浏览器读不了的文件会被拒绝，并说明原因，而不是\
        走到一半才失败。"""

[[faq]]
q = "会损失音质吗？"
a = """16 位 PCM 会舍入解码后的采样值，并限制超出满幅范围的值。选择 32 位浮点并保持声道不变，可保留解码器的采样值，包括超出范围的值。单声道会对声道取平均。浮点无法恢复视频中已有的损失。检测到文件自身的采样率时就使用该采样率；否则页面会说明假定值。"""

[[faq]]
q = "为什么 WAV 比视频大这么多？"
a = """WAV 音频未压缩。44.1 kHz 的 16 位立体声每分钟约 10 MB。浮点会使采样数据加倍；单声道将立体声采样数据减半。文件生成完成前会显示输出大小。"""

[[faq]]
q = "视频最长能有多长？"
a = """输入在内存中读取和解码，整个 WAV 也在内存中组装。较长的录音可能超出可用内存；超过 WAV 格式 4 GB 上限的输出会在写入采样前被拒绝。取消会使待完成的读取结果失效，或停止分块混合与写入。浏览器的解码可能继续到返回时，但取消后的结果不会被采用。"""

[[faq]]
q = "能剪短或者调大音量吗？"
a = """\
        能，但不在这里，这个页面只做一件事。有结果之后，下载旁边会出现一排\
        链接，不用先保存就把它直接送进<a href="../trim-audio/">音频剪辑</a>或者\
        <a href="../edit-audio/">音频编辑</a>，那两个也一样不上传。"""

[[faq]]
q = "免费吗？需要注册吗？"
a = """\
        免费，没有账号，不用登录，没有试用期，也不限制你打开多少个视频。本站\
        有广告，站点靠它维持；广告拿不到关于你文件的任何东西。"""

[[faq]]
q = "断网还能用吗？"
a = """\
        能。页面加载一次之后拔掉网线，它照样工作。这也是证明没有上传的最简单\
        办法：一个把你的视频送出去处理的工具，在你拔线的那一刻就停了。"""

[schema]
description = "把 MP4、MOV 或 WebM 里的音轨取出来，存成 WAV。只有音频会被解码，画面从不读取，也不上传任何东西。"
features = [
  "将视频音频保存为兼容性广的 16 位 PCM 或 32 位浮点 WAV",
  "只解码音轨，画面从不读取",
  "先读文件自己的采样率，不会悄悄重采样",
  "对所有声道取平均以混合为单声道",
  "存之前先播放结果",
  "不用保存就把结果送进音频剪辑或音频编辑",
  "断网可用；不上传，不注册",
]

[picker]
title = "把视频拖到这里"
hint = "也可以点击选择 &mdash; MP4、MOV、M4V 或 WebM"
