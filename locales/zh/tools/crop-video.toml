features = [
  "裁 MP4、MOV、M4V 和 WebM 视频",
  "H.264、HEVC、AV1 和 VP9 片源，走 WebCodecs 解码",
  "自由裁、锁定比例（1:1、4:5、9:16、16:9、4:3、3:2），或者精确到像素的框",
  "原来的音频照搬，不重新编码",
  "断网能用，不上传，不注册，没有水印",
]

