      视频直接交给浏览器的下载。"""

[[faq]]
q = "我的视频会传到什么地方去吗？"
a = """
        不会。读取、解码、裁剪、编码，全由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器那一半，页面的 <code>Content-Security-Policy</code> \
        把它可能联的地址全列了出来，没有一个是本站的。与其听我们说，不如拔掉\
        网线，照裁一段试试。"""

[[faq]]
q = "能裁哪些格式？"
a = """
        MP4、M4V 和 MOV 直接读，里面装的是 H.264、HEVC、AV1 还是 VP9 都行，\
        只要你的浏览器解得了那个编码。其他浏览器能播的格式，最典型的是 WebM，\
        改成一边播一边录来裁，能用，但片子多长就得花多长时间。浏览器既读不了\
        也播不了的文件，实际上就是 AVI、WMV、FLV 和大多数 MKV，会被直接拒收\
        并说明原因，不会干到一半才崩。"""

[[faq]]
q = "视频的大小和长度有限制吗？"
a = """
        工具里没设上限，文件也不是一口气读进内存的，而是一次几兆地走过去。真正\
        的天花板是成品，它要在内存里拼好你才能下载，再就是你这台机器编码要\
        花多久。"""

[[faq]]
q = "声音会保住吗？"
a = """
        走 MP4 这条路是分毫不差的：音频逐个采样复制过去，全程不解码，跟原文件\
        里的字节一模一样。走录制那条路，声音是从播放里采下来再编一遍的，会掉\
        一点质量。两条路都有个勾选框，可以干脆不要声音。"""

[[faq]]
q = "裁剪会掉画质吗？"
a = """
        画面要重新编码，因为裁过的一帧已经是另一张图，不把像素重写一遍就存不\
        下来。工具不肯做的是在同一块区域上花得比原来还多，超过那个数只会让\
        文件变大，看着并不会更好。"""

[[faq]]
q = "能顺便剪时长吗？"
a = """
        这里不行，隔壁可以。这个工具只改画面的形状，别的都不动，出来的片子跟\
        进去的一样长，时间轴和声音原封不动。剪时长是另一件活，也是另一个工具，\
        <a href="../trim-video/">视频剪切</a>把片子里值得留的段落标出来，存成\
        一个文件，而且一帧都不重编。"""

[[faq]]
q = "宽和高为什么只能按 2 跳？"
a = """
        MP4 里的 H.264 把画面按块存，根本没办法描述一条边是奇数像素的帧。与其\
        等你设完再悄悄替你取整，不如这个框从一开始就只给偶数。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费\
        就是这么来的，广告拿不到关于你视频的任何信息。"""

