[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。它们谁都没有被交给任何关于你视频的\
      信息：不是文件，不是某一帧，也不是名字、大小、时长，或者你把它裁成了\
      什么形状。每一行读取、解码、裁剪或编码的代码，都由这个源提供，也都\
      列在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是一个链接，没有别的：它不上报访问，\
      也没有被交给任何关于你或你视频的信息。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是所有证明里最简单的一个。"""

[[howto]]
title = "选一段视频。"
body = """\
      把一个 MP4、MOV、M4V 或 WebM 拖到选择框上，或者手动挑一个。浏览器直接\
      从你的硬盘上读它；这个过程中没有任何东西被送去哪里。"""

[[howto]]
title = "把框拖到你想留下的那一块上。"
body = """\
      在框里面拖动可以移动它，拖任意一个角可以改大小。也可以先锁定一个形状
      &mdash; 发方图用 1:1，给手机看用 9:16，宽画幅用 16:9 &mdash; 或者在\
      下面四个输入框里填一个精确到像素的框。"""

[[howto]]
title = "决定花多少质量。"
body = """\
      画面必须重新编码一次，因为裁过的一帧就是另一张画面了。“均衡”让它接近\
      原文件在这块区域上本来就花的量；“最高质量”会花得更多。声音默认保留，\
      除非你关掉它。"""

[[howto]]
title = "裁剪，然后下载。"
body = """\
      活是在你自己的硬件上干的，所以要多久取决于你的机器，而不是排队。做好的\
      视频直接交给你浏览器的下载。"""

[[faq]]
q = "我的视频会被上传到什么地方吗？"
a = """
        不会。它由你自己的浏览器、在你自己的硬件上读取、解码、裁剪和编码。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        列出了它可能联系的每一个地址 &mdash; 其中没有一个属于本站。与其听\
        我们说，不如拔掉网线，照样裁一段试试。"""

[[faq]]
q = "我能裁哪些视频格式？"
a = """
        MP4、M4V 和 MOV 是直接读的，里面装的是什么都行：H.264、HEVC、AV1 或
        VP9，只要你的浏览器解得了那个编码。其他你的浏览器能播的格式 &mdash;
        最典型的是 WebM &mdash; 则改成一边播一边录来裁，能用，但片子多长就\
        要花多长时间。浏览器既读不了也播不了的文件，实际上就是 AVI、WMV、FLV
        和大部分 MKV，会被直接拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "视频的大小或时长有上限吗？"
a = """
        工具本身没有内建上限，而且文件不是一次性读进内存的 &mdash; 它是一次\
        走几兆地过一遍。实际的天花板是做好的视频，它要在内存里拼出来你才能\
        下载，还有你的机器把它编码完要花的时间。"""

[[faq]]
q = "声音保得住吗？"
a = """
        走 MP4 这条路时，一模一样：音频是一个采样一个采样复制过去的，从头到尾\
        没被解码，所以它和原文件里的逐字节相同。走录制那条路时，声音是从播放\
        里录下来再编码一次的，会损失一点质量。两种情况下都有一个勾选框可以\
        干脆不要声音。"""

[[faq]]
q = "裁剪会损失质量吗？"
a = """
        画面会被重新编码，因为裁过的一帧就是另一张画面，不把像素重新写一遍\
        就没法存下来。工具不会做的是：在同一块区域上花得比原来更多 &mdash;
        超过那个量再编码，只会让文件变大，并不会让它更好看。"""

[[faq]]
q = "我能顺便剪掉一段时长吗？"
a = """
        这里不能，隔壁能。这个工具只改画面的形状，别的什么都不动：出来的片子\
        和进去的一样长，时间轴和声音都完好。剪时长是另一件事，也是另一个工具
        &mdash; <a href="../trim-video/">视频剪辑</a>会把一段片子里值得留下的\
        部分标出来，存成一个文件，而且一帧都不重新编码。"""

[[faq]]
q = "宽和高为什么是按 2 跳的？"
a = """
        H.264，也就是 MP4 里的那个编码，把画面按块存储，没有办法描述一条边\
        是奇数像素的帧。与其在你设好之后悄悄把裁剪框凑整，不如从一开始就只\
        提供偶数。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期、没有水印。本站带广告，这就是\
        它的经费来源；广告拿不到任何关于你视频的信息。"""

