[[faq]]
q = "我的视频会被传到什么地方去吗？"
a = """
        不会。读取、解码、裁剪、编码，都由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        把它可能联系的地址全列了出来，其中没有一个属于本站。与其听我们说，\
        不如拔掉网线，照样裁一段试试。"""

[[faq]]
q = "我能裁哪些视频格式？"
a = """
        MP4、M4V 和 MOV 是直接读的，里面装什么都行，H.264、HEVC、AV1 或者
        VP9，只要你的浏览器解得了那个编码。其他你的浏览器能播的格式，最典型\
        的是 WebM，改成一边播一边录来裁，能用，但片子多长就要花多长时间。\
        浏览器既读不了也播不了的文件，实际上就是 AVI、WMV、FLV 和大部分 MKV，\
        会当场拒绝并给出说明，而不是做到一半才失败。"""

[[faq]]
q = "视频的大小或时长有上限吗？"
a = """
        工具本身没有内建上限，文件也不是一次性读进内存的，而是一次几兆地走\
        一遍。真正的天花板是做好的那个视频，它得先在内存里拼出来你才能下载，\
        再就是你的机器把它编码完要花的时间。"""

[[faq]]
q = "声音保得住吗？"
a = """
        走 MP4 这条路时，一模一样。音频是一个采样一个采样复制过去的，从头到尾\
        没解码，跟原文件里的逐字节相同。走录制那条路时，声音是从播放里录下来\
        再编码一次的，会损失一点质量。两种情况都有一个勾选框可以干脆不要声音。"""

[[faq]]
q = "裁剪会损失质量吗？"
a = """
        画面要重新编码，因为裁过的一帧就是另一张画面，不把像素重新写一遍就\
        存不下来。工具不会做的一件事，是在同一块区域上花得比原来还多，超过\
        那个量再编码，只会让文件变大，不会让它更好看。"""

[[faq]]
q = "我能顺便剪掉一段时长吗？"
a = """
        这里不能，隔壁能。这个工具只改画面的形状，别的什么都不动，出来的片子\
        和进去的一样长，时间轴和声音都完好。剪时长是另一件事，也是另一个工具，\
        <a href="../trim-video/">视频剪辑</a>会把一段片子里值得留下的部分标\
        出来，存成一个文件，而且一帧都不重新编码。"""

[[faq]]
q = "宽和高为什么是按 2 跳的？"
a = """
        H.264 也就是 MP4 里的那个编码，把画面按块存储，描述不了一条边是奇数\
        像素的帧。与其等你设好之后再悄悄把裁剪框凑整，不如从一开始就只给\
        偶数。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，也没有水印。本站带广告，经费就是\
        从那儿来的，广告拿不到任何关于你视频的信息。"""

[schema]
browser_requirements = "需要 JavaScript。输出 MP4 需要支持 WebCodecs 的浏览器，其他情况会退回到录制 WebM。"
description = "在浏览器里把视频裁成任意形状或者精确到像素的框。MP4、MOV 和 M4V 逐帧解码、重新编码，原来的音频原封不动带过去；其他浏览器能播的格式则靠录制来裁。什么都不上传。"
features = [
  "可裁剪 MP4、MOV、M4V 和 WebM 视频",
  "H.264、HEVC、AV1 和 VP9 片源，通过 WebCodecs 解码",
  "自由裁剪、锁定比例（1:1、4:5、9:16、16:9、4:3、3:2）或精确到像素的框",
  "保留原音频，不重新编码",
  "断网可用，不上传，不注册，无水印",
]

