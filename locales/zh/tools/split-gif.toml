[[privacy]]
title = "你的 GIF 没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个\
      属于本站。这里没有任何可以收走你文件的接收端，就算有，代码里也没有\
      把文件送过去的东西。这行以前写的是 <code>connect-src 'none'</code>，\
      那是没有例外的。加广告付出的代价就是它，把这句说出来也是约定的一部分。"""

[[privacy]]
title = "读 GIF 的就是仓库里的两个文件。"
body = """\
      浏览器会放 GIF，却不会把它的零件交给你，所以格式是在这里自己读的：\
      <code>src/gif.js</code> 是容器和 LZW 解压，<code>src/compose.js</code> \
      是处置规则，决定前面几帧垫在下面之后，这一帧看起来是什么样。打开文件\
      不需要去取任何东西，第一次用也不会下载什么引擎。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你动图的信息，一条也没有交给它们，\
      文件、某一帧、名字、尺寸、帧数都没有。读取、解压、绘制、写出图片的\
      每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页首那个“Buy me a coffee”按钮由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它不过是个链接，不上报访问，也拿不到关于你或\
      你文件的任何东西。不点它就什么都不会发生，点下去到的是别人的站。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上每一部分都照常工作。这是最省事的一条证明，真要\
      把你的动图送出去拆，拔线那一刻就停了。"""

[[howto]]
title = "选一个 GIF。"
body = """\
      拖到选择框里，或者自己找出来。浏览器直接从磁盘上读，页面会告诉你它\
      看到了什么：尺寸、帧数、播多久、循环几遍。"""

[[howto]]
title = "决定每张 PNG 里放什么。"
body = """\
      <strong>看上去的那一帧</strong>是绝大多数人要的，也就是动画在那一刻的\
      整幅画面。<strong>只要这一帧真正存下的像素</strong>是文件里实际带着的\
      那块补丁，保持它自己的大小和位置。GIF 之所以小就是靠它，而它并不是\
      动画看起来的样子。"""

[[howto]]
title = "决定透明怎么处理。"
body = """\
      PNG 能原样保留透明，这是诚实的默认值。要是这些帧要拿去的地方根本不认\
      透明、会把它变成黑色，那就改成填一个颜色。"""

[[howto]]
title = "挑出你要的帧。"
body = """\
      默认全要。“每两帧留一帧”用来给长录像瘦身，网格里的勾选框比它优先。\
      编号从来不会变，所以不管你把邻居丢掉多少，第 42 帧还是第 42 帧。"""

[[howto]]
title = "下载。"
body = """\
      从网格里一帧一帧存，或者打包成一个 ZIP 一次拿走，这样保存提示只弹\
      一次，而不是几百次。ZIP 里可以放一个 <code>frames.txt</code>，写明\
      每一帧停留了多久，这是一堆 PNG 摆在文件夹里唯一说不出来的事。"""

[[faq]]
q = "我的 GIF 会被传到哪里去吗？"
a = """
        不会。文件的读取、解压和绘制都由你自己的浏览器在你自己的硬件上完成，\
        每张 PNG 也是在这里的内存里编码的。这个工具没有服务端，页面的 \
        <code>Content-Security-Policy</code> 里写着它允许联系的每一个地址，\
        没有一个属于本站。拔掉网线，它照样拆 GIF。"""

[[faq]]
q = "为什么有一帧看着像画面的一小块？"
a = """
        因为文件里存的就是那样。GIF 是一张起始画面加上后面一连串补丁：后面\
        每一帧只存变化的那个矩形，屏幕上其余部分是前面几帧留在那儿的。一个\
        人对着不动的墙说话，于是每帧存的是一张脸，而不是一整幅画面，这个\
        格式不至于大得离谱，全靠这一点。
        <br><br>
        你现在看到这个，是因为选的是“只要这一帧真正存下的像素”。改成“看上去\
        的那一帧”，每张 PNG 就都是动画在那一刻的整幅画面了。"""

[[faq]]
q = "透明保留得住吗？"
a = """
        保留得住。GIF 的透明只有一位，一个像素要么画上了要么看不见，中间没有\
        过渡，而 PNG 存的正好就是这个，所以帧出来时透明区域是完好的。你要是\
        更想要实心背景，把“透明区域”改成填一个颜色，那个颜色会写进 PNG，\
        之后就取不出来了。"""

[[faq]]
q = "为什么帧延时不是我以为的数字？"
a = """
        GIF 里每帧延时是按百分之一秒存的，而从九十年代起，浏览器就把小于两个\
        百分之一秒的值一律抬到十分之一秒。这条规矩是为当年那些转动的地球图\
        写的，后来一直没删。所以文件里写 0.01 秒的帧，在哪儿都是按 0.10 秒\
        播。这个工具显示的是真正播出来的延时，两者对不上时，会把文件里存的\
        值写在旁边。"""

[[faq]]
q = "拆出来的帧还能拼回去吗？"
a = """
        能，用本站的 <a href="../gif-maker/">GIF 制作</a>，或者任何接受一\
        文件夹图片的工具都行。ZIP 里那个 <code>frames.txt</code> 就是为这个\
        准备的：拆动图会把时间信息丢掉，因为 PNG 没有地方记自己停留了多久，\
        所以由这份清单把每帧的延时和位置一起带出来。"""

[[faq]]
q = "帧可以存成哪些格式？"
a = """
        PNG，而且是有意只给 PNG。GIF 的一帧最多 256 色、一位透明，PNG 能\
        原样无损地存下来；换成 JPEG 就会把透明丢掉，凭空造出这一帧本来没有\
        的颜色，而且对平涂画面来说通常还会更<em>大</em>。要是你确实需要 \
        JPEG，事后用<a href="../resize-image/">图片尺寸调整</a>转一遍。"""

[[faq]]
q = "能读的帧数有上限吗？"
a = """
        没有固定上限。真正的天花板是你机器的内存：GIF 在读取过程中会膨胀到\
        每帧每像素约一个字节，所以一个小文件也可能是很大一块内存。这个页面\
        宁可停下不读，也不会让标签页崩掉。真发生了它会说明，并把已经取到的\
        帧交给你。"""

[[faq]]
q = "坏掉的 GIF 打得开吗？"
a = """
        多数打得开。下载截断、结束标记丢失、最后一帧在数据中间断掉，这些都\
        很常见，而一个见了就拒的读取器，恰好对最需要拆开的那些文件毫无用处。\
        凡是完整的帧都会给出来，并附上哪里不对。只有压根不是 GIF 的文件才\
        会被直接挡掉。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。帧上同样没有水印。本站带\
        广告，经费就是从那儿来的，广告拿不到任何关于你文件的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的动图送出去处理，拔线那一刻就停了。"""

