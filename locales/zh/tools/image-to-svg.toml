name = "图片转 SVG"
# 后半段是人们真正会搜的词。
heading = "图片转 SVG <span class=\"h1-kw\">把 logo、镂空模板或剪影描成曲线</span>"
tagline = "一个形状，一条轮廓。不该有的东西，点一下就好。"

title = "图片转 SVG | 把 logo 或剪影矢量化，不用上传"
description = "在浏览器里把黑白图片描成真正的 SVG 轮廓。logo、镂空模板、签名、线稿和剪影都变成能放大到任意尺寸的曲线。描多了的部分，点一下就去掉。什么都不上传。"
og_title = "不上传，也能把 logo 或剪影变成 SVG"
og_description = "放大的位图是一段楼梯，轮廓是一条指令。这个工具找出形状，用曲线贴上去，不该有的东西点一下就能去掉，全部在你自己的机器上完成。"
og_image_alt = "图片转 SVG - 把 logo、镂空模板或剪影描成曲线"

pledge = """
    图片由你自己的浏览器从硬盘上读进来，<code>src/mask.js</code> 把它压成每像素\
    一位，<code>src/contour.js</code> 沿着形状的边缘走一圈，<code>src/fit.js</code> \
    再往上贴曲线，总共六百来行你能读的代码，背后没有引擎，也不用为了跑起来\
    下载任何东西。这个工具没有任何联网功能：不取东西，不发东西，就算真有，\
    这个页面的另一头也没有服务器能接住一张图。"""

live_hint = """
      别信我们嘴上说的。打开开发者工具，盯着“网络”面板，描一张试试。没有一条\
      请求带着图片、缩略图、文件名，或者你选中内容里的任何一个字节。或者干脆\
      拔掉网线，照描不误。"""

read_first = """\
      ，<code>src/mask.js</code> 里是一张图怎么变成每像素一位，\
      <code>src/contour.js</code> 里是沿形状边缘走的那一圈，<code>src/fit.js</code> \
      里是楼梯怎么变成曲线，<code>src/subject.js</code> 里是没有明暗可分的时候\
      怎么把背景算出来。"""

howto_heading = "不上传怎么把图片描成 SVG"

card = """
            放大的位图是一段楼梯。轮廓是一条指令，所以任何尺寸都锐利，\
            前提是你手里的是个形状，不是照片。"""

[words]
plural = "图片"
choose = "图片"
analytics_extra = """，这个工具算出来的\
  颜色、尺寸和文件名同样如此"""

