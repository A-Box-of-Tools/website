text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "没有水印"

[[facts]]
text = "断网能用"

[[facts]]
text = "开源"

[[privacy]]
title = "你的图片没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这里没有能收文件的接口，代码里也没有一行会把文件发出去，就算\
      真有那么个接口也一样。"""

[[privacy]]
title = "这里没有任何东西会去联网取数据。"
body = """\
      整个 <code>src/</code> 里，一个 <code>fetch</code>、一个 \
      <code>XMLHttpRequest</code>、一个 <code>sendBeacon</code> 都找不到。\
      整个工具就是对一张图片的像素做算术：一个阈值，沿着找到的形状的边缘\
      走一圈，再贴几段曲线。"""

[[privacy]]
title = "没有引擎要下载。"
body = """\
      描图通常是别人的程序在做的事，放到网页上就意味着第一下点击之前先要下来\
      好几兆编译过的代码。这里没有这回事。整个工具就是几百行从本站发出的普通 \
      JavaScript，这也是页面一打开就能用、不用等的原因。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google，捐助按钮来自 Buy Me a Coffee。关于你\
      图片的信息，一条都没给它们。读图、取阈值、描边的每一行代码都从本站\
      发出，也都摆在仓库里。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，这个工具跟原来一模一样，因为它本来就没有联网这一步。这是最\
      省事的一条证明。"""

[[howto]]
title = "选一张图片。"
body = """\
      logo、镂空模板、签名、印章、扫描的图纸、剪影。只要里面有一个清楚的形状，\
      就描得干净；一张房间的照片不行，下面会明说，而不是等到最后给你个意外。\
      文件直接从你的硬盘上读，期间什么都不会发到任何地方。"""

[[howto]]
title = "告诉它形状是什么。"
body = """\
      纸上的图按<strong>明暗</strong>分开，分界值替你算好。一张物件的照片不行——\
      深灰石头上的一尊深红塑像，是深色叠深色，亮度分不开它们。这种要选\
      <strong>主体</strong>：它从图片边缘的一圈带子里学会什么是背景，然后把不是\
      背景的都留下。"""

[[howto]]
title = "看红线，别看设置。"
body = """\
      轮廓画在它来自的那些像素上面，因为只有在那里，这个问题才有答案：一条轮廓\
      对不对，只相对于那些像素，跟别的无关。拖任意一张图，两张一起动；滚滚轮\
      放大到能看清这条线到底在做什么。"""

[[howto]]
title = "不该有的东西，点一下去掉。"
body = """\
      一个斑点、一枚订书钉、一个印章、一行说明、一片阴影。一下点中的是那一整块\
      同色区域而不是一个像素，所以你指的是一个形状；再点一下就回来。点一块被\
      围住的背景，则是把它填上——不该是洞的洞，就是这么补上的。"""

[[howto]]
title = "只在需要时调平滑。"
body = """\
      <em>细节</em>是简化时线条允许偏离像素多远，除非你另有指定，否则按形状算。\
      <em>拐角锐度</em>决定轮廓要拐多大的弯，那个弯才保留为角而不是被磨圆。\
      大多数图片这两项都不用碰。"""

[[howto]]
title = "拿走 SVG。"
body = """\
      一个文件，一条 <code>&lt;path&gt;</code>，没有填充规则要操心：外轮廓朝\
      一个方向转，洞朝另一个方向转，所以一个带四十个洞的形状也只是一个元素。\
      Illustrator、Inkscape、Figma、浏览器和切割机都打得开。"""

[[faq]]
q = "我的图片会被上传到哪里吗？"
a = """\
        不会。文件由你自己的浏览器在你自己的硬件上读取，由本站发出的几百行 \
        JavaScript 描边，再作为下载交还给你。这个工具没有任何联网功能——从不取\
        东西，也从不发东西——页面的 <code>Content-Security-Policy</code> 把它\
        允许联的地址全列了出来，没有一个是本站的。"""

[[faq]]
q = "它能把我的照片变成 SVG 吗？"
a = """\
        变不出有用的东西，而且页面会直接告诉你，而不是等你下载完才发现。描图会\
        把每一块颜色相近的区域都变成一个独立的形状，所以一张照片回来时是几千个\
        叠在一起的色块，文件比 JPEG 大好多倍，打开慢，还不像那张照片。描得好的，\
        是里面有一个<em>形状</em>的图片：logo、镂空模板、签名、线稿、剪影。如果\
        是只拍了一样东西的照片，<em>主体</em>这个设置会把它抠成一整块实心剪影——\
        那是另一回事，而且真的有用。"""

[[faq]]
q = "找形状的两种方法有什么区别？"
a = """\
        问的问题不一样。<strong>明暗</strong>问的是每个像素是否比某个值更暗，这对\
        纸上的墨迹再合适不过，而在主体和背景一样暗的时候毫无用处。<strong>主体\
        </strong>问的是背景是什么——它从图片边缘的一圈带子里学，拿每个像素跟它\
        比，留下不是背景的最大一块。这在一张物件照片配上大致均匀的背景时管用；\
        在裁得太紧、主体从三边出画的图片上会失败，因为它学习用的边缘本身就是\
        主体。遇到这种情况，你可以自己把背景指给它。"""

[[faq]]
q = "为什么描出来的形状有洞，或者细的部分丢了？"
a = """\
        因为图片变成每像素一位的那一刻就已经是这样了。打开<em>描图器拿到的</em>\
        看看：小于十二像素左右，字母的内空已经糊上，竖笔已经粘在一起，没有哪种\
        描图能找回一个不存在的洞。补救在上游——挪一挪阈值，或者从更大的扫描\
        开始。在<em>主体</em>模式下，<em>补上不超过</em>会封住小洞，<em>整个填实\
        </em>会把背景从图片边缘够不到的洞全部填上。"""

[[faq]]
q = "它弄错的地方能改吗？"
a = """\
        能，第三步基本上就是做这个的。点任何不该出现在图里的东西，它就消失；\
        再点一下，它就回来。一下点中的是那一整块同色区域，所以一下去掉的是整个\
        斑点或整个印章，而不是一个像素。点一块被围住的背景则是把它填上。改动和\
        阈值分开保存，之后再拖滑块也不会把它们丢掉。"""

[[faq]]
q = "SVG 会有多大？"
a = """\
        如果是形状，比图片小：描出来的剪影通常一到五千字节，logo 再多几千。页面\
        会在下载旁边告诉你确切数字。如果是照片，会大得吓人——这是这个工具不适合\
        那个文件最明确的信号——超过一千个左右的独立形状，页面就会停止绘制并\
        明说。"""

[[faq]]
q = "能描彩色的吗？"
a = """\
        不能。这个工具做的是单色的一个形状，只有这种情况出来的才是一张图，而不是\
        一张劣质复印件。彩色描图意味着先量化成几种颜色，再把每种颜色当作一个\
        图层单独描，结果会让大多数提出这个要求的人失望。要颜色的话，在这里描出\
        形状，再到你的绘图软件里上色。"""

[[faq]]
q = "拿到 SVG 之后能做什么？"
a = """\
        放大到任意尺寸而不发虚、改一个属性就换颜色、做动画、打印，或者送去\
        切割机、激光机。它是一条没有填充规则可弄错的 <code>&lt;path&gt;</code>，\
        所以 Illustrator、Inkscape、Figma、浏览器和大多数 CNC 软件读出来都一样。"""

[[faq]]
q = "图片大小有上限吗？"
a = """\
        上限是你机器的，不是我们的。一页 300 dpi 扫描的 A4——大约九百万像素——\
        不到一秒就描完。更大的图片也能用，只是更慢，而且活儿是在你自己的处理器\
        上做的，不是排在哪个队列里。"""

[[faq]]
q = "免费吗？需要账号吗？"
a = """\
        免费，没有账号、没有登录、没有试用期、没有水印。文件的数量和大小也没有\
        限制，因为没有服务器替它们买单——活儿在你自己的机器上做。网站上有广告，\
        靠广告维持；广告拿不到任何关于你文件的信息。"""

[[faq]]
q = "断网能用吗？"
a = """\
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没上传\
        最简单的办法：一个要把你的图片送出去描的工具，拔掉网线那一刻就会停。"""

[schema]
description = "在浏览器里把黑白图片描成 SVG 轮廓。按明暗分开，或者从背景里找出主体，给形状贴上曲线，不该描的东西点一下就能去掉。什么都不上传。"
features = [
  "把位图形状描成真正的三次曲线，任何尺寸都锐利",
  "找形状的两种方法：按明暗分，或者从背景里找主体",
  "点一下某个部分就去掉，点一下被围住的缺口就填上",
  "轮廓画在它来自的像素上面，最多放大十六倍",
  "洞和套着的洞一起输出成一条路径，不用设置填充规则",
  "拐角和平滑的阈值按形状计算，除非你另有指定",
  "遇到照片而不是线稿时会提醒",
  "断网能用；不上传、不注册、没有引擎要下载",
]

[picker]
title = "把图片拖到这儿"
hint = "或者点击选择，PNG、JPEG、WebP、GIF、AVIF"
