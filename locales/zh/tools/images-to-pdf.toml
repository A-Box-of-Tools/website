[[privacy]]
title = "你的图片没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这个工具没往那份名单上添任何东西，因为它自己就没有联网功能，\
      连可选的都没有。这里没有能收文件的接口，代码里也没有一行会把文件发\
      出去，就算真有那么个接口也一样。"""

[[privacy]]
title = "PDF 是在这儿写出来的。"
body = """\
      一个 PDF 说白了就是一串对象，外加一张记着每个对象从哪儿开始的表，两样\
      都由 <code>src/shared/pdf-page-writer.js</code> 写。没有库要去外面取，没有哪一步在服务器上\
      渲染，成品直接从内存交给下载。"""

[[privacy]]
title = "这个文档对你一无所知。"
body = """\
      多数工具会给 PDF 盖上时间戳和自己的程序名。这一个只在你亲手填了标题、\
      作者和日期时才写这几项，你图片的文件名一个都不会出现在文档里，关于你\
      这台机器的信息也一样。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你图片的信息，一条都没给它们，文件\
      不给，缩略图不给，文件名、大小、数量也不给。读图、解码、写图的每一行\
      代码都从本站发出，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也拿不到\
      关于你或者你图片的任何东西。你不点它，什么都不会发生；点了，跳过去的\
      是别人的网站。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是最省事的一条证明。一个把图片\
      送出去做文档的工具，这时候就该停了。"""

[[howto]]
title = "选好你的图片。"
body = """\
      把整个文件夹拖到下面的方框里，或者一个个自己挑。浏览器直接从你的硬盘上\
      读，这期间没有东西发出去。"""

[[howto]]
title = "排好页序，该转的转过来。"
body = """\
      一张图一页，顺序就是你看到的顺序。抓住卡片上的手柄拖动，或者按上面的\
      箭头。旋转按钮一次转九十度，横着扫进来的那种一般就得这么办。"""

[[howto]]
title = "选页面大小。"
body = """\
      “页面跟着每张图走”会让每一页正好等于那张图，不裁边，也没有白框。选 A4、\
      Letter、Legal 这些固定尺寸，则是把每张图摆到一张固定大小的纸上，要留边\
      就留边。"""

[[howto]]
title = "生成 PDF，然后下载。"
body = """\
      文档在你自己的机器上写出来，所以快慢取决于你这台机器，不取决于排队。\
      成品直接交给浏览器的下载。"""

[[faq]]
q = "我的图片会传到什么地方去吗？"
a = """
        不会。读图和写 PDF，全由你自己的浏览器在你自己的硬件上完成。这个工具\
        没有服务器那一半，页面的 <code>Content-Security-Policy</code> 把它可能\
        联的地址全列了出来，没有一个是本站的。跟这里另外几个工具不同，它连\
        可选的联网功能都没有。"""

[[faq]]
q = "转成 PDF 会掉画质吗？"
a = """
        默认设置下，JPEG 不会。PDF 本来就能直接装 JPEG 数据，所以照片是逐字节\
        抄进文档的，不解码，也不再压一遍，PDF 里那张图就是文件里那张图。别的\
        格式得重新编码，因为 PDF 里没有对应的滤镜可用，除非你选无损那一档，\
        它照原样存下来，代价是文件更大。"""

[[faq]]
q = "支持哪些图片格式？"
a = """
        你的浏览器能解码的静态图都行，实际上就是 JPG、PNG、WebP、GIF、AVIF，\
        苹果设备上还包括 HEIC。这里没有另一份需要不断维护的清单，因为解码是\
        浏览器的活，不是我们的。"""

[[faq]]
q = "页面大小和页序能自己定吗？"
a = """
        能。页面可以是 A4、Letter、Legal、A3、A5、Tabloid，也可以自己填一个\
        尺寸，或者干脆等于每张图本身。卡片拖着换顺序，按名字或日期排序，任意\
        一张转九十度，页边距按毫米填。"""

[[faq]]
q = "一个 PDF 最多能放多少张图？"
a = """
        工具里没设上限。真正的天花板是你这台机器的内存，因为成品文档要在那儿\
        拼好你才能下载。最先撑不住的，是几百张全分辨率的手机照片。设置里把最长\
        边缩一缩，这道天花板一下能抬高很多。"""

[[faq]]
q = "PDF 里会带上我的文件名或者时间戳吗？"
a = """
        你不要求就不会。文档信息那一块除了这个工具的名字之外是空的：没有文件名，\
        没有机器名，没有用户名，你不勾那个框，连创建日期都没有。这是故意的，\
        PDF 本来就是拿去给别人看的东西。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是这么来的，\
        广告拿不到关于你图片的任何信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把图片送出去做文档的工具，拔线那一刻就停了。"""

