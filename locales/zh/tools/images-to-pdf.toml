[[privacy]]
title = "你的图片没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这个工具没有往那份名单上添过任何东西：它自己没有\
      网络功能，连可选的都没有。这里不存在能收集你文件的接口，代码里也没有\
      任何一处会去发送它们，哪怕真有这么个接口。"""

[[privacy]]
title = "PDF 是在这里写出来的。"
body = """\
      一个 PDF 就是一串对象，外加一张记录每个对象从哪儿开始的表，而\
      <code>src/pdf.js</code> 两样都写。没有库要下载，没有任何东西是在服务器\
      上渲染的，写好的文件直接从内存交给下载。"""

[[privacy]]
title = "这个文档不被告知任何关于你的事。"
body = """\
      大多数工具会往 PDF 上盖一个时间戳和生成它的程序名。这一个只有在你亲手\
      输入时才写标题、作者和日期；你图片的文件名从不出现在文档里，任何关于\
      你机器的信息也不会。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。它们谁都没有被交给任何关于你图片的\
      信息：不是文件，不是缩略图，也不是名字、大小或数量。每一行读取、解码\
      或写出图片的代码，都由这个源提供，也都列在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是一个链接，没有别的：它不上报访问，\
      也没有被交给任何关于你或你图片的信息。你不点它就什么都不会发生，而\
      点过去到达的是别人的网站。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个页面上的一切照常运转。这是所有证明里最简单的一个：一个\
      把你的图片送出去做成文档的工具，那一刻就会停下来。"""

[[howto]]
title = "选择你的图片。"
body = """\
      把一个文件夹拖到选择框上，或者手动挑文件。浏览器直接从你的硬盘上读\
      它们；这个过程中没有任何东西被送去哪里。"""

[[howto]]
title = "把页面排好序，该转的转一下。"
body = """\
      一张图变成一页，顺序就是你看到的顺序。抓住小方块上的把手拖动可以调整\
      位置，也可以用箭头；旋转按钮每次转四分之一圈，扫歪了的件通常正需要\
      这个。"""

[[howto]]
title = "选一个页面尺寸。"
body = """\
      “让页面适应每张图片”会让每一页正好就是它那张图，什么都不裁，也没有白边。\
      那些具名的尺寸 &mdash; A4、Letter、Legal 之类 &mdash; 则是把每张图片\
      放到一个固定页面上，你要页边距的话也可以有。"""

[[howto]]
title = "生成 PDF，然后下载。"
body = """\
      文档是在你自己的机器上写出来的，所以要多久取决于你的硬件，而不是排队。\
      写好的文件直接交给你浏览器的下载。"""

[[faq]]
q = "我的图片会被上传到什么地方吗？"
a = """
        不会。你的图片由你自己的浏览器、在你自己的硬件上读取，PDF 也在那里\
        写出来。这个工具没有服务器端，而页面的\
        <code>Content-Security-Policy</code> 列出了它可能联系的每一个地址
        &mdash; 其中没有一个属于本站。和这里其他一些工具不同，这一个连一个\
        可选的网络功能都没有。"""

[[faq]]
q = "转成 PDF 会损失质量吗？"
a = """
        默认设置下，JPEG 不会。PDF 可以直接装 JPEG 数据，所以一张照片是逐字节\
        复制进文档的：它从不被解码，也从不被再压一遍，PDF 里的画面就是文件里\
        的画面。其他格式必须重新编码，因为 PDF 没有对应的滤镜 &mdash; 除非你\
        选无损那一档，它会原样保存，代价是文件更大。"""

[[faq]]
q = "我能用哪些图片格式？"
a = """
        任何你浏览器解得了的静态图片，实际上就是 JPG、PNG、WebP、GIF、AVIF，\
        以及在苹果设备上的 HEIC。这里没有另一份需要跟着维护的清单，因为解码\
        是浏览器的活儿，不是我们的。"""

[[faq]]
q = "我能选页面尺寸和页面顺序吗？"
a = """
        能。页面可以是 A4、Letter、Legal、A3、A5、Tabloid、你自己输入的尺寸，\
        或者正好是每张图片的尺寸。拖动小方块可以重排，也可以按名字或日期排序，\
        任意一页都能转四分之一圈，页边距按毫米设置。"""

[[faq]]
q = "一个 PDF 里能放多少张图片？"
a = """
        工具本身没有内建上限。实际的天花板是你自己机器的内存，因为写好的文档\
        要在那里拼出来你才能下载。最先撞上它的通常是几百张全分辨率的手机\
        照片；在设置里把最长边缩小一些，能把这个天花板抬高很多。"""

[[faq]]
q = "PDF 里会不会有我的文件名或者时间戳？"
a = """
        不会，除非你要。文档信息块除了这个工具的名字之外是空的：没有文件名，\
        没有机器名，没有用户名，也没有创建日期 —— 除非你把那个框勾上。这是\
        故意的 &mdash; PDF 是一种人们发给别人的东西。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期。本站带广告，这就是它的\
        经费来源；广告拿不到任何关于你图片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的图片送出去做成文档的工具，在你拔线的\
        那一刻就会停下来。"""

