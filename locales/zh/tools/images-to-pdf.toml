[[privacy]]
title = "你的图片无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这个工具往那份名单上什么都没添，它自己没有网络功能，连\
      可选的都没有。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。"""

[[privacy]]
title = "PDF 是在这里写出来的。"
body = """\
      一个 PDF 就是一串对象，外加一张记录每个对象从哪儿开始的表，而\
      <code>src/pdf.js</code> 两样都写。没有库要下载，没有哪一步是在服务器上\
      渲染的，写好的文件直接从内存交给下载。"""

[[privacy]]
title = "这个文档不会被告知任何关于你的事。"
body = """\
      大多数工具会往 PDF 上盖一个时间戳和生成它的程序名。这一个只有在你亲手\
      输入时才写标题、作者和日期，你图片的文件名从不出现在文档里，任何关于\
      你机器的信息也不会。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你图片的信息，一条也没有交给它们，\
      文件不给，缩略图不给，名字、大小、数量也不给。读取、解码、写出图片的\
      每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也\
      拿不到任何关于你或者你图片的信息。你不点它就什么都不会发生，点过去到\
      的也是别人的网站。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上的一切照常运转。这是最省事的一条证明，真要把你的\
      图片送出去做成文档，那一刻就停了。"""

[[howto]]
title = "选好你的图片。"
body = """\
      把一整个文件夹拖到下面的方框里，或者点开自己挑文件。浏览器直接从你的\
      硬盘上读，整个过程没有东西被送去别处。"""

[[howto]]
title = "把页面排好序，该转的转一下。"
body = """\
      一张图变成一页，顺序就是你看到的顺序。抓住小方块上的把手拖动可以调位置，\
      用箭头也行；旋转按钮每次转四分之一圈，扫歪了的件通常正需要这个。"""

[[howto]]
title = "选一个页面尺寸。"
body = """\
      选“让页面适应每张图片”，每一页正好就是它那张图，不裁，也没有白边。选
      A4、Letter、Legal 这些具名尺寸，则是把每张图片放到一个固定页面上，要\
      页边距也可以有。"""

[[howto]]
title = "生成 PDF，然后下载。"
body = """\
      文档在你自己的机器上写出来，所以快慢看你的硬件，不用排队。写好的文件\
      直接交给浏览器下载。"""

[[faq]]
q = "我的图片会被传到什么地方去吗？"
a = """
        不会。你的图片由你自己的浏览器在你自己的硬件上读取，PDF 也在那里写\
        出来。这个工具没有服务器端，而页面的\
        <code>Content-Security-Policy</code> 把它可能联系的地址全列了出来，\
        其中没有一个属于本站。和这里另外一些工具不同，这一个连一个可选的\
        网络功能都没有。"""

[[faq]]
q = "转成 PDF 会损失质量吗？"
a = """
        默认设置下，JPEG 不会。PDF 装得下 JPEG 数据，所以一张照片是逐字节复制\
        进文档的，从不解码，也从不再压一遍，PDF 里的画面就是文件里的画面。\
        别的格式必须重新编码，因为 PDF 没有对应的滤镜，除非你选无损那一档，\
        它会原样保存，代价是文件更大。"""

[[faq]]
q = "我能用哪些图片格式？"
a = """
        你浏览器解得了的静态图片都行，实际上就是 JPG、PNG、WebP、GIF、AVIF，\
        苹果设备上还有 HEIC。这里没有另一份要跟着维护的清单，因为解码是浏览器\
        的活儿，不是我们的。"""

[[faq]]
q = "我能选页面尺寸和页面顺序吗？"
a = """
        能。页面可以是 A4、Letter、Legal、A3、A5、Tabloid、你自己填的尺寸，\
        或者正好是每张图片的尺寸。拖动小方块可以重排，也可以按名字或日期排序，\
        任意一页都能转四分之一圈，页边距按毫米设置。"""

[[faq]]
q = "一个 PDF 里能放多少张图片？"
a = """
        工具本身没有内建上限。真正的天花板是你自己机器的内存，写好的文档要在\
        那里拼出来你才能下载。最先撞上它的通常是几百张全分辨率的手机照片，\
        在设置里把最长边缩小一些，这个天花板能抬高很多。"""

[[faq]]
q = "PDF 里会不会有我的文件名或者时间戳？"
a = """
        不会，除非你要。文档信息块除了这个工具的名字之外是空的，没有文件名，\
        没有机器名，没有用户名，也没有创建日期，除非你把那个框勾上。这是故意\
        的，PDF 本来就是一种人们要发给别人的东西。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，也没有试用期。本站带广告，经费就是从那儿\
        来的，广告拿不到任何关于你图片的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的图片送出去做成文档，拔线那一刻就停了。"""

