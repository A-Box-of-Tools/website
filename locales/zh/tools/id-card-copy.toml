[[privacy]]
title = "处理在这个浏览器里完成。"
body = "本工具在浏览器里处理输入和结果，处理代码不把它们上传去处理。Content-Security-Policy 限制可用资源和连接目的地，但已允许的主机仍可接收请求。策略不检查载荷，不能单独证明什么都没有发出。请把具体操作的请求与源码核对，或断网完成该本地操作。"

[[privacy]]
title = "根本没有模型，所以没什么要下载的。"
body = """\
 找出证件靠的是算术：照片的梯度，对其中直线的\
      一次投票，再检查胜出那个四边形的每条边下面到底有什么。这就是文档扫描的找角\
      程序，两个工具共用。没有权重，没有推理运行时，第一次用时也不去取任何东西。\
      看 <code>src/shared/document-detect.js</code>。"""

[[privacy]]
title = "复印件里除了证件，不带照片里的任何东西。"
body = """\
 每一面都是按像素重新画出来的，所以手机写进照片\
      里的位置、相机型号和拍摄时间，都不会进复印件。PDF 只记录这个工具的名字，\
      别的什么都没有，没有日期，没有作者，没有机器名。看 <code>src/document.js</code>。"""

[[privacy]]
title = "写在证件上的字在图里，不是盖在上面。"
body = """\
 你打的字在保存之前就画进了每一面的像素里，所以\
      没法像 PDF 里的图层或批注那样从复印件上揭下来。看 <code>src/card.js</code>。"""

[[privacy]]
title = "这里没有任何东西去取任何东西，断网也能用。"
body = """\
 <code>src/</code> 里的任何地方都没有 <code>fetch</code>，\
      没有 <code>XMLHttpRequest</code>，也没有 <code>sendBeacon</code>，这个页面也\
      没有为任何东西打开 <code>connect-src</code>。把网络断掉，这个工具一点不变。\
      拍护照之前，这是值得先跑一遍的证明。"""

[[howto]]
title = "把两面都拍下来。"
body = """\
 把证件放在比它深或者比它浅的东西上，手机举在\
      正上方，让整张证件都在画面里，并且尽量把画面填满。证件反光的话，稍微倾斜\
      一下。反光会盖住下面的东西，之后什么办法都补不回来。"""

[[howto]]
title = "把两张照片加进来。"
body = """\
 两张一起拖进来，第一张当正面；也可以用每一面\
      各自的按钮。「正反面对调」可以把它们换过来。"""

[[howto]]
title = "核对四个角。"
body = """\
 每张照片里的证件都会被找出来并描上轮廓。在照片上\
      随便按一下，最近的那个角就到你手指这儿来；也可以用 <kbd>Tab</kbd> 选中一个角，\
      再用方向键挪。旋转按钮可以把证件转正。"""

[[howto]]
title = "排好复印件。"
body = """\
 选纸张：A4、Letter，或者不要纸张，把两面合成\
      一张图片。再选两面是上下排列还是左右并排。想在证件上写明复印件的用途，就把\
      它打进去。"""

[[howto]]
title = "保存，并按 100% 打印。"
body = """\
 打印用 PDF。把打印机设为「实际大小」或 100%，\
      不要选「适合页面」，然后把证件放在纸上比一比。JPEG 或 PNG 用来上传或者\
      发邮件。"""

[[faq]]
q = "我的身份证照片会被上传吗？"
a = """
        不会。两张照片的解码、摆正、排版，以及写进复印件，全都由你自己的浏览器在你\
        自己的硬件上完成。这个工具没有任何联网功能，从不取东西，也从不发东西。页面的 \
        <code>Content-Security-Policy</code> 连读回它自己做出来的结果都不让它开一个\
        连接。把页面加载一次，打开飞行模式，它照样能用。"""

[[faq]]
q = "打印出来的证件大小对吗？"
a = """
        对，只要打印机设成按 100% 打印。PDF 用文件自己的度量单位，把每一面精确地放成\
        证件的大小，银行卡大小的证件就是 85.6 乘 53.98 毫米，而不是把一整页的图片缩放\
        过去。复印件打出来偏小，原因是打印对话框里的「适合页面」或「缩小以适合」，它会\
        把整张纸缩小几个百分点。改选「实际大小」，再把证件放在打印出来的复印件上，看\
        两者是否吻合。"""

[[faq]]
q = "证件出来为什么形状是对的，不是被压扁的？"
a = """
        因为形状根本不是从照片上量出来的，而是证件本身的形状。斜着拍的证件，远端看起来\
        会短一些。一个工具要是把它看到的四边形裁下来、硬拉成一个方框，做出来的证件就\
        明显偏矮胖或者偏瘦高。这里是把四个角通过透视变换，映射到一个比例和证件完全一样\
        的长方形上。所以证件上是直的线，复印件上也是直的，不管照片是从什么角度拍的，\
        证件都是它自己的形状。"""

[[faq]]
q = "「写在证件上的字」是做什么的？该不该用？"
a = """
        它把你打的字，通常是复印件的用途和日期，比如「仅供幸福路 12 号租房使用，\
        2027年3月」，斜着一行行重复地写满两面，颜色和浓淡由你选。字在文件保存之前就\
        画进了像素里，所以没法像 PDF 上的批注那样从复印件上删掉。一份写明了交出去做\
        什么用的身份证复印件，想把它挪作他用的人就拿它没多大办法，有些国家的政府对证件\
        复印件给的建议正是这样。字要淡一些，让底下的证件仍然看得清。"""

[[faq]]
q = "它找的角不对，怎么办？"
a = """
        拖过去就行。四个角是起点，不是决定，每一面取的都是四个角最后停在哪里。在照片上\
        随便按一下，最近的那个角就跳到你手指这儿来；方向键每次把当前选中的角挪一个像素。\
        证件放在跟它颜色差不多的表面上时最难找，白桌子上的白卡片就是最常见的原因。把它\
        放到深一点的东西上重拍，或者自己摆好四个角。证件是圆角的，把每个角放在两条直边\
        延长后相交的地方。"""

[[faq]]
q = "它适用于哪些证件？"
a = """
        任何两面值得一起复印的卡片。几乎所有身份证、驾驶证、居留许可、医保卡、学生证\
        和银行卡都是同一个尺寸，也就是银行卡的 ISO ID-1 尺寸，这也是默认值。一些老式\
        身份证用的 ID-2 尺寸更大，这里也有；护照的资料页（ID-3）可以单独放在一张纸上。\
        有些驾驶证是竖着印的，用旋转按钮把那一面转过来，它就会竖着排版。"""

[[faq]]
q = "能不能不要整页，只要一张两面合在一起的图片？"
a = """
        能。纸张选「不要纸张，只要两面」，文件选 JPEG 或 PNG，复印件就是一张带窄白边的\
        两面合图，正是要求两面一次上传的网上表单要的东西。图片里记着自己的分辨率，按\
        分辨率打印的程序会把证件打成原大；不过很多程序只是把图片铺满纸张，所以打印还是\
        用 PDF。"""

[[faq]]
q = "点下载没反应，为什么？"
a = """
        通常是因为页面开在另一个 App 里，比如聊天软件或者社交网络，它自带的浏览器不保存\
        下载的文件。改用手机自己的浏览器打开这个页面，同样的步骤就能把文件存下来。页面\
        加载完之后就不再需要网络，所以在那里断网也能用。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，复印多少份都不限，复印件上也没有我们的\
        水印。证件上唯一的字，就是你自己打的那些。本站靠广告养活，广告那边拿不到关于\
        你证件的任何东西。"""

