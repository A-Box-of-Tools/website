#
# Convert to MP4 - 简体中文。
#
# Overrides for tools/convert-to-mp4/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 改这一页的话术时，有两件事必须守住，跟英文原文一样。
#
# 第一件：这里的「MP4」只指一样东西：普通 MP4 容器里的 H.264 画面加 AAC 声音，
# 因为那是每一部手机、每一个浏览器、每一个聊天软件和上传表单都不会拒绝的那一种。
# WebM、MKV，或者里面装着 HEVC、VP9 的 MP4，被拒的地方多到人们会带着它来这里。
# 页面只写这一种，从不把 H.264 之外的画面编码原样复制进结果，不管它多好：
# 一个能打开的地方比原文件还少的文件，不叫转换。
#
# 第二件：转换不一定是重新编码，页面在开始之前就按轨道说清是哪一种。MKV 里的
# H.264 一帧一帧原样复制；WebM 里的 VP9 要解码后重新编码。不许让「转换」这个词
# 把这两者的区别藏起来，因为一种什么都不丢，另一种要丢掉一代。
#
# 用词：container 写「容器」，codec 写「编码」，re-encode 写「重新编码」，
# copy 写「原样复制」，track 写「轨道」。格式名（MP4、WebM、MKV、MOV、H.264、
# AAC、HEVC、VP9、Opus）一律不译。
#

