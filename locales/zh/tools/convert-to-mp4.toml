      是别人的网站。"""

[[privacy]]
title = "断网也能用。"
body = """\
 断开网络，这一页上的所有东西照常工作。这是最简单的证明：\
      一个把你的视频发出去转换的工具会停下来。"""

[[howto]]
title = "选那段视频。"
body = """\
 一次一个：WebM、MKV、MOV、M4V 或 MP4。浏览器直接从你的硬盘读它，\
      页面会说它是什么：多长、多大、画面多大、装在什么容器里。"""

[[howto]]
title = "读那两句话。"
body = """\
 一句说画面，一句说声音。每一句要么说这条轨道已经是 MP4 要的样子、\
      会原样复制过去，要么说它现在是什么、会被重新编码成什么。没有什么要设的，\
      文件自己决定。要是声音是浏览器读不了的格式，或者你宁愿这段视频没有声音，\
      勾上那个框把声音去掉。"""

[[howto]]
title = "转换，然后读那句写着「已核对」的话。"
body = """\

      该复制的复制，该重新编码的一帧一帧重新编码，进度条会说到哪了。然后做好的\
      文件会在这里重新打开，它必须跟原来一样长、是 H.264、并且带着说好的声音。\
      它在下载按钮下面从内存里播放，你能亲眼看到它还好好的。"""

[[faq]]
q = "画质会变差吗？"
a = """
        复制过去的部分不会，页面会说哪些是复制的。H.264 的帧和 AAC 的包一个字节\
        不差地过去，所以一个里面是 H.264 的 MKV 出来就是画面一模一样的 MP4。非重新\
        编码不可的轨道（VP9、VP8、AV1、HEVC 的画面；Opus、Vorbis、MP3、FLAC 的声音）\
        会离相机远一代，码率按原文件花的量来定，所以丢的是一点而不是没有。无论\
        哪种，都留着你的原文件。"""

[[faq]]
q = "为什么不把 HEVC 或 VP9 留在 MP4 里？它们更小。"
a = """
        因为那样的文件能打开的地方比你手上这个还少，而转换的意义就是让它到哪都能\
        打开。MP4 里的 HEVC 需要机器可能没有的授权；MP4 里的 VP9 或 AV1 被大多数\
        上传表单和每一个邮件客户端拒绝。H.264 加 AAC 是唯一没有人拒绝的组合，所以\
        页面写的就是它，代价也事先说清，而不是藏起来。"""

[[faq]]
q = "我的 WebM 是录屏。声音能保住吗？"
a = """
        能。浏览器录的是 Opus，MP4 装不下它，所以会解码后重新编码成 160 kbit/s \
        的 AAC，比麦克风需要的多得多。画面（VP8 或 VP9）重新编码成 H.264。两样\
        都在你的机器上做，做好的文件会在这里重新打开，核对它跟原来一样长、声音\
        还在。"""

[[faq]]
q = "我的 MOV 为什么要转？它不就是 MP4 吗？"
a = """
        差不多。MOV 和 MP4 是同一个设计，一个里面是 H.264 和 AAC 的 MOV 几秒钟\
        就原样复制过去，一帧都不重新编码，变的只是容器，而这正是那个只看扩展名\
        的表单在拒绝的东西。里面是 HEVC 的 iPhone MOV 是另一种情况：画面会重新\
        编码成 H.264，只要浏览器解得开 HEVC，大多数机器可以，但不是全部。"""

[[faq]]
q = "它读哪些文件？"
a = """
        WebM 和 MKV，画面是 VP8、VP9、AV1、H.264 或 HEVC，声音是 Opus、Vorbis、\
        AAC、MP3 或 FLAC；MP4、MOV 和 M4V，画面是 H.264、HEVC、VP9 或 AV1，声音\
        是 AAC。浏览器解不开的会点名：画面解不开就停下转换，声音解不开就去掉，\
        画面照样转。AVI、WMV、FLV 和 MPEG-2 这里不读。"""

[[faq]]
q = "要多久？"
a = """
        复制大约等于把文件读两遍的时间：大多数视频几秒钟。重新编码要花你的机器\
        编码画面所需的时间，有硬件编码器的话（大多数笔记本和近年的每一部手机都有）\
        比视频本身还短；没有的话更慢，一段很长的 4K 视频怎么都要等一会儿。进度条\
        会说到第几帧了，取消立刻停下，什么都不写。"""

[[faq]]
q = "我的视频会被上传到哪里吗？"
a = """
        不会。文件由你自己的浏览器在你自己的硬件上读取、按需解码、编码、写出，\
        这一页的 <code>Content-Security-Policy</code> 列出了它可以联系的每一个\
        地址，没有一个属于本站。最简单的自证办法是断开网络照样用。对这么大的文件\
        来说，这也是最快的办法：上传通常比转换本身还慢。"""

[[faq]]
q = "手机上能用吗？"
a = """
        浏览器能解码和编码视频的手机上能用，而且手机自带的硬件编码器很快。手机缺\
        的是内存：做好的文件会一直放在内存里直到你保存它，所以一段很长的视频可能\
        超出手机能装下的量。先用<a href=\"../trim-video/\">视频剪辑</a>剪短，或者\
        在笔记本上转。"""

[[faq]]
q = "有大小限制吗？要钱吗？"
a = """
        文件是分块从硬盘读的，所以进来的文件比内存还大也没问题；做好的文件会一直\
        放在内存里直到你下载，而且这里写出的 MP4 不能超过 4 GB。它是免费的，\
        不注册、不登录，也没有试用期。本站带广告，那是养活它的东西；广告拿不到\
        任何关于你视频的内容。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样能用。这也是证明什么都没被上传的\
        最简单的办法：一个把你的视频发出去转换的工具，你一拔网线它就停了。"""

