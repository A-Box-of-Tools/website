[[privacy]]
title = "上传才是最慢的那一步，而这一步在这里不会发生。"
body = """\

      视频是大多数人这辈子要挪动的最大的文件，而每一个在线转换器都要先把整个\
      文件拿到手：一个 GB 沿着你的网络传上去，为的是换一个不一样的 GB 传回来，\
      上传花的时间通常比它换来的转换还长，这还没算谁留着那份文件的问题。这一页用\
      从这个地址发来的代码读文件，用你浏览器里本来就有的编解码器写新文件，所以唯一\
      在动的字节，是从你的硬盘到内存再回去。这一页的 \
      <code>Content-Security-Policy</code> 列出了它可以联系的每一个地址，没有一个\
      属于本站，而且断了网它照样能用。"""

[[privacy]]
title = "这里的「MP4」是什么意思，以及为什么别的都不写。"
body = """\

      到哪都传得上去的那种文件，是普通 MP4 容器里的 H.264 画面加 AAC 声音。手机\
      录出来的是它，每一个浏览器播的是它，聊天软件、邮件客户端和上传表单不问\
      一句就收的也是它。WebM、MKV，或者里面装着 HEVC、VP9、AV1 的 MP4，被拒的\
      地方多到人们会带着它来这里。所以这一页只写这一种。它从不把 H.264 之外的\
      画面编码原样复制进结果，不管那个编码多好，因为一个能打开的地方比原文件还少\
      的文件，不叫转换。"""

[[privacy]]
title = "能复制的复制，非改不可的才重新编码，而且会说清是哪一种。"
body = """\

      转换不一定是重新编码。MKV 里的 H.264 帧和 MP4 要的是同一串字节，所以它们\
      一帧一帧原样复制过去，什么都不丢；AAC 也一样。WebM 里的 VP9 或 VP8、iPhone \
      MOV 里的 HEVC、声音里的 Opus 或 Vorbis：这些要解码后重新编码，结果离相机又\
      远了一代。页面在你按任何东西之前就算好每条轨道是哪一种，用两句话说出来，\
      好让「转换」这个词从来不用来遮住一次重新编码。"""

[[privacy]]
title = "结果会重新打开核对一遍。"
body = """\

      一个丢了最后一秒、或者写了声音轨道却没写进声音的转换器，做出来的仍然是一个 \
      MP4。所以做好的文件会在这里重新打开，用的就是读你上传那个文件的同一个读取器，\
      它必须跟原来一样长、是 H.264、并且带着说好的声音。它在下载按钮下面从内存里\
      播放，你保存之前就能亲眼看到它还好好的。"""

[[privacy]]
title = "它在你机器上的代价，如实说。"
body = """\

      复制很快：文件读一遍拿布局，写的时候再读一遍。重新编码要花你的机器编码这段\
      视频所需的时间，有硬件编码器的话（大多数笔记本和近年的每一部手机都有）比视频\
      本身还短；没有的话会更慢，一段很长的 4K 视频怎么都要等一会儿。文件是分块从\
      硬盘读的，所以进来的文件比内存还大也没问题，但做好的文件会一直放在内存里\
      直到你下载它，笔记本的上限就在这里。「取消」随时有效。"""

[[privacy]]
title = "它读哪些文件，不读哪些。"
body = """\

      WebM 和 MKV（同一种格式的两个名字），里面可以是 VP8、VP9、AV1、H.264 或 \
      HEVC 的画面，配 Opus、Vorbis、AAC、MP3 或 FLAC 的声音；还有 MP4、MOV 和 \
      M4V，里面是 H.264、HEVC、VP9 或 AV1 的画面，配 AAC 的声音。浏览器解不开的\
      画面（最常见的是没有授权的机器上的 HEVC）会点名拒绝；解不开的声音会点名\
      去掉，画面照样转。AVI、WMV、FLV 和 MPEG-2 这里不读，页面会直说，而不是\
      含糊地失败。"""

[[privacy]]
title = "Google 加载了什么，又没拿到什么。"
body = """\
 广告和\
      统计脚本来自 Google。它们都拿不到任何关于你视频的东西：没有文件、没有\
      一帧画面、没有文件名、大小、时长，也不知道它原来是什么格式。每一行读取、\
      编码或写出视频的代码都从这个源发出，并列在代码仓库里。"""

[[privacy]]
title = "打赏按钮加载了什么，又没拿到什么。"
body = """\

      顶部的「Buy me a coffee」按钮由 cdnjs.buymeacoffee.com 的一个脚本画出来，\
      字体来自 Google Fonts。它只是一个链接，不多不少：它不上报访问，也拿不到\
