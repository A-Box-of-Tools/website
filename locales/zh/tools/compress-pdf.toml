[[privacy]]
title = "你的文档没地方可去。"
body = """\
      Content-Security-Policy 把这个页面允许联的地址全列了出来，没有一个是\
      本站的。这个工具没往那份名单上添任何东西，因为它自己就没有联网功能，\
      连可选的都没有。这里没有能收文件的接口，代码里也没有一行会把文件发\
      出去，就算真有那么个接口也一样。"""

[[privacy]]
title = "整套格式的处理都在这个仓库里。"
body = """\
      一个 PDF 说白了就是一串对象，外加一张记着每个对象从哪儿开始的表。\
      <code>src/objects.js</code> 读这套语法，<code>src/reader.js</code> 跟着\
      那张表走，<code>src/writer.js</code> 写出一份新的，三个文件谁都没有\
      引入能发请求的东西。没有库要去外面取，也没有哪一步是在服务器上渲染的。"""

[[privacy]]
title = "加密的文件直接挡下来，不去打开它。"
body = """\
      带密码的 PDF 一律拒收，包括扫描仪常留的那种空密码，技术上明明能打开。\
      给文档解保护跟给文档瘦身是两码事，一声不吭就替你办了，这种工具才叫\
      吓人。"""

[[privacy]]
title = "它是往外拿东西，不是往里塞东西。"
body = """\
      写出来的文件里没有创建日期，没有生成器署名，也没有做它那个工具的名字。\
      勾上那个选项，XMP 数据包和排版软件留下的私有块也一并去掉。EXIF 那个\
      工具讲的是同一个道理，只不过换了一种容器。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你文档的信息，一条都没给它们，文件\
      不给，页面不给，文件名、大小、页数也不给。读 PDF、解码、写 PDF 的每一\
      行代码都从本站发出，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，也拿不到\
      关于你或者你文档的任何东西。你不点它，什么都不会发生；点了，跳过去的\
      是别人的网站。"""

[[privacy]]
title = "断网照样能用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是最省事的一条证明。一个把文档\
      送出去压缩的工具，这时候就该停了。"""

[[howto]]
title = "选一个 PDF。"
body = """\
      拖到下面的方框里，或者点开自己挑。浏览器直接从你的硬盘上读，这期间没有\
      东西发出去。"""

[[howto]]
title = "先看清体积压在哪儿。"
body = """\
      第二步的重点就是这张分布图。条形图里大半是图片，这个工具就有东西可做；\
      大半是字体和页面内容，它会直说，老实说也就能省下百分之几。这事儿花一\
      分钟之前就知道，总比之后才知道强。"""

[[howto]]
title = "定个力度。"
body = """\
      那几档给的是分辨率，不是“高中低”这种含糊的等级。96 DPI 给屏幕上看的，\
      130 给要发邮件的，220 给还得打印的。每一档都按图片在页面上实际画多大\
      来算，所以一张只当缩略图用的照片，不会被当成整页扫描件对待。"""

[[howto]]
title = "压完之后，看一眼那句“已核对”。"
body = """\
      重写完成后，成品会被这个页面上同一个读取器再打开一遍，页数点一遍。跟\
      原来对不上，这一次就算失败，也不会给你下载。"""

[[faq]]
q = "我的 PDF 会传到什么地方去吗？"
a = """
        不会。读取、重新压缩、写出，全由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器那一半，页面的 <code>Content-Security-Policy</code>\
        把它可能联的地址全列了出来，没有一个是本站的。连可选的联网功能都\
        没有。"""

[[faq]]
q = "我的 PDF 能小多少？"
a = """
        完全取决于里面装的是什么，所以工具在动手之前先量一遍、摆给你看。扫描\
        件几乎全是照片，通常能小 60% 到 90%。合同、论文这类是文字、矢量图形\
        和内嵌字体，做它的软件早就压过一轮了，这种一般只能省下百分之几，来源\
        是重新打包文件、丢掉已经没人引用的东西。哪个工具连你的文件都没看就\
        承诺一个固定百分比，那是在猜。"""

[[faq]]
q = "压缩 PDF 会掉画质吗？"
a = """
        里面的图片要重新编码，这部分会。别的都不动：文字还是文字，选得中也\
        搜得到，字体整份留着，矢量图形原样复制过去。工具也不会白白把一张图\
        弄差。重编之后要是并不比原来小，那就把原来的字节放回文档里，一点没动。"""

[[faq]]
q = "这里的 DPI 是什么意思，为什么要问我？"
a = """
        PDF 里记着每张图在页面上画多大，所以工具能算出它的有效分辨率。一张
        4000 像素的扫描图，铺在八英寸宽的纸上，等于每英寸 500 个像素。屏幕\
        根本用不上这么多，纸上也用不上多少，所以超过你选定那一档的像素被最先\
        扔掉，它们换来的画质谁也看不见。正因为量过这一下，一个放得很小的
        logo 才不会跟整页扫描件被同等对待。"""

[[faq]]
q = "带密码的 PDF 能打开吗？"
a = """
        不能，这是故意的。加密的文档会被拒收并说明原因，哪怕密码是空的也一样，\
        而很多扫描仪和复印机就是这么存的。给文件解保护跟给文件瘦身是两码事，\
        一声不吭就办了，等于替你做了你没要求的事。"""

[[faq]]
q = "有压不动的 PDF 吗？"
a = """
        有些内嵌图片压不动。JPEG 2000、JBIG2 和传真编码（CCITT）这几种，任何\
        浏览器都没有解码器，所以原样放行，并在结果里注明。后两种本来就是双色\
        编码，一般已经接近最小了。CMYK 图片也不动，重编有可能让印出来的颜色\
        偏掉。凡是工具跳过的，结果里都会点名，并说明原因。"""

[[faq]]
q = "压完的文件还能到处打开吗？"
a = """
        能。输出按 PDF 1.5 写，2003 年之后出的阅读器都认。而且工具在你自己的\
        机器上验一遍：把成品重新打开，把页数点一遍，再交给你。表单、链接、\
        书签、无障碍结构和内嵌附件都带过去，留下不要的只有文档里已经没人\
        引用的那些东西。"""

[[faq]]
q = "免费吗？要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期。文件大小的上限只取决于你这台\
        机器的内存。本站带广告，经费就是这么来的，广告拿不到关于你文档的任何\
        信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面开一次之后断网，它照干不误。这也是证明“什么都没上传”最省事的\
        办法。一个把文档送出去压缩的工具，拔线那一刻就停了。"""

