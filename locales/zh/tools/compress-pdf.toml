[[privacy]]
title = "你的文档无处可去。"
body = """\
      Content-Security-Policy 把这个页面允许联系的地址全列了出来，其中没有\
      一个属于本站。这个工具往那份名单上什么都没添，它自己没有网络功能，连\
      可选的都没有。这里没有能收你文件的接口，代码里也没有一行会去发送文件，\
      就算真有那么个接口也一样。"""

[[privacy]]
title = "整个格式的处理都摆在这个仓库里。"
body = """\
      一个 PDF 就是一串对象，外加一张记录每个对象从哪儿开始的表。\
      <code>src/objects.js</code> 读这套语法，<code>src/reader.js</code>\
      顺着那张表走，<code>src/writer.js</code> 写出一张新的，这三个文件谁都\
      没有引入能发请求的东西。没有库要下载，也没有哪一步是在服务器上渲染的。"""

[[privacy]]
title = "加了密的文件直接挡回去，不打开。"
body = """\
      带密码的 PDF 一律拒绝，扫描仪生成的那种空密码、技术上其实打得开的文件\
      也一样。去掉文档的保护和把文档变小是两回事，一个工具悄悄替你做了，那\
      才叫意外。"""

[[privacy]]
title = "它是往外拿东西，不是往里塞东西。"
body = """\
      写出来的文件不带创建日期，不带制作程序那一行，也不带做出它的工具的\
      名字。勾上那个选项，它还会丢掉 XMP 数据包和排版软件留下的私有块，跟\
      EXIF 工具讲的是同一个道理，只是换了个容器。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你文档的信息，一条也没有交给它们，\
      文件不给，某一页不给，名字、大小、页数也不给。读取、解码、写出 PDF 的\
      每一行代码都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是个链接，仅此而已，不上报访问，\
      也拿不到任何关于你或者你文档的信息。你不点它就什么都不会发生，点过去\
      到的也是别人的网站。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上的一切照常运转。这是最省事的一条证明，真要把你的\
      文档送出去压缩，那一刻就停了。"""

[[howto]]
title = "选一个 PDF。"
body = """\
      拖到下面的方框里，或者点开自己挑。浏览器直接从你的硬盘上读，整个过程\
      没有东西被送去别处。"""

[[howto]]
title = "看清体积堆在哪儿。"
body = """\
      第二步的意义就在这张分布图上。条形大部分是图片，这个工具就有东西可做。\
      大部分是字体和页面内容，它会照实说，能省下的老实讲也就百分之几，与其\
      白花一分钟，不如先知道这件事。"""

[[howto]]
title = "说明要压多狠。"
body = """\
      那几个档位写的是分辨率，不是含糊的等级。屏幕上看用 96 DPI，发邮件用
      130，还要打印的用 220。每一档都按图片在页面上实际画出来的大小来衡量，\
      所以当缩略图放的照片，不会跟整页扫描件一个待遇。"""

[[howto]]
title = "压缩，再看一眼那句“已核对”。"
body = """\
      重写完成之后，这个页面上的同一个读取器会把新文件重新打开一遍，数一遍\
      页数。跟原来对不上，这一次就算失败，也不会给你下载。"""

[[faq]]
q = "我的 PDF 会被传到什么地方去吗？"
a = """
        不会。读取、重新压缩、写出，都由你自己的浏览器在你自己的硬件上完成。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        把它可能联系的地址全列了出来，其中没有一个属于本站。这个工具连一个\
        可选的网络功能都没有。"""

[[faq]]
q = "我的 PDF 能小多少？"
a = """
        完全看里面装的是什么，所以工具会在动手之前先量一遍给你看。扫描出来的\
        文档几乎全是照片，通常能小 60&ndash;90%。合同或者论文是文字、矢量图形\
        加嵌入字体，这些在生成它的软件那里就已经压过一轮，那种情况下能省的\
        通常是百分之几，来自重新打包文件、丢掉不再被引用的内容。不看你的文件\
        就承诺一个固定百分比的工具，都是在猜。"""

[[faq]]
q = "压缩 PDF 会不会损失质量？"
a = """
        里面的图片要重新编码，对图片来说会。别的什么都不动，文字还是文字，\
        能选中也能搜索，字体完整保留，矢量图形原样复制过去。工具也不会白白\
        把一张图弄差，重新编码的结果要是并不比原来小，原来的字节就原封不动\
        放回文档里。"""

[[faq]]
q = "这里说的 DPI 是什么，它为什么要问？"
a = """
        PDF 记录了每张图片在页面上画多大，工具因此能算出它的有效分辨率。\
        一张 4000 像素的扫描件铺在八英寸纸上，就是每英寸 500 个像素。屏幕上\
        用不了那么多，纸上也几乎用不了，所以超过你所选档位的像素优先丢掉，\
        它们花掉的质量谁也看不见。正是这套测量，让放得很小的 logo 不会跟\
        整页扫描件一个待遇。"""

[[faq]]
q = "它能打开加了密码的 PDF 吗？"
a = """
        不能，这是故意的。加了密的文档会被拒绝，并给出一条说明，密码是空的\
        也一样，很多扫描仪和复印机就是这么存的。去掉文件的保护和压缩文件是\
        两回事，一个工具悄悄做了，就是在做你没要求它做的事。"""

[[faq]]
q = "有没有它压不了的 PDF？"
a = """
        有些内嵌图片压不了。JPEG 2000、JBIG2 和传真编码（CCITT）的图片在任何\
        浏览器里都没有解码器，只能原样通过，并如实标出，后两种是二值编码，\
        本来通常也已经接近最小。CMYK 图片同样不动，因为重新编码有可能让\
        打印机输出的颜色跑掉。工具跳过的每一样都会列在结果里，连同原因。"""

[[faq]]
q = "压缩后的文件到哪儿都还能打开吗？"
a = """
        能。输出写成 PDF 1.5，2003 年以后出的每一个阅读器都认得，而且工具会\
        在你自己的机器上把这一点证明给你看，它把写好的文件重新打开一遍、数\
        一遍页数，然后才交给你。表单、链接、书签、无障碍结构和内嵌附件都会\
        带过去，留下不要的是文档里已经没有任何东西再引用的那些材料。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，除了你自己机器的内存之外也没有\
        文件大小限制。本站带广告，经费就是从那儿来的，广告拿不到任何关于你\
        文档的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最\
        省事的办法，真要把你的文档送出去压缩，拔线那一刻就停了。"""

