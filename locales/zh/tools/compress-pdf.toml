features = [
  "动手之前先让你看清文档的体积到底堆在哪儿",
  "按图片在页面上量出来的实际分辨率重新压缩",
  "重新编码要是压不小，就原样保留那张图",
  "丢掉先前编辑留下的废弃对象，以及可选的元数据",
  "把写好的文件重新打开核对一遍，然后才交给你",
  "断网可用，不上传，不注册，不限文件大小",
]

[picker]
