[[facts]]
text = "开源"

[[facts]]
text = "文件留在你的设备上"

[[privacy]]
title = "你的文档没有地方可去。"
body = """\
      Content-Security-Policy 列出了这个页面被允许联系的每一个地址，其中\
      没有一个属于本站。这个工具没有往那份名单上添过任何东西：它自己没有\
      网络功能，连可选的都没有。这里不存在能收集你文件的接口，代码里也没有\
      任何一处会去发送它，哪怕真有这么个接口。"""

[[privacy]]
title = "整个格式的处理都在这个仓库里。"
body = """\
      一个 PDF 就是一串对象，外加一张记录每个对象从哪儿开始的表。\
      <code>src/objects.js</code> 读这套语法，<code>src/reader.js</code>\
      顺着那张表走，<code>src/writer.js</code> 写出一张新的，这三个文件\
      谁都没有引入任何能发请求的东西。没有库要下载，也没有任何东西是在\
      服务器上渲染的。"""

[[privacy]]
title = "加密的文件会被挡回去，而不是被打开。"
body = """\
      带密码的 PDF 会被拒绝，包括扫描仪生成的那种空密码、技术上其实打得开的\
      文件。把一个文档的保护去掉，和把它变小是两件事，而悄悄替你做了这件事，\
      对一个工具来说是件很意外的事。"""

[[privacy]]
title = "它是往外拿东西，不是往里塞东西。"
body = """\
      写出来的文件不带创建日期，不带制作程序那一行，也不带做出它的工具的\
      名字。勾上那个选项，它还会丢掉 XMP 数据包和排版软件留下的私有块
      &mdash; 和 EXIF 工具讲的是同一个道理，只是换了个容器。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。它们谁都没有被交给任何关于你文档的\
      信息：不是文件，不是某一页，也不是名字、大小或页数。每一行读取、解码\
      或写出 PDF 的代码，都由这个源提供，也都列在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页头那个“Buy me a coffee”按钮，由 cdnjs.buymeacoffee.com 的一个脚本\
      画出来，字体取自 Google Fonts。它就是一个链接，没有别的：它不上报访问，\
      也没有被交给任何关于你或你文档的信息。你不点它就什么都不会发生，而\
      点过去到达的是别人的网站。"""

[[privacy]]
title = "它可以离线使用。"
body = """\
      断开网络，这个页面上的一切照常运转。这是所有证明里最简单的一个：一个\
      把你的文档送出去压缩的工具，那一刻就会停下来。"""

[[howto]]
title = "选一个 PDF。"
body = """\
      把它拖到选择框上，或者手动挑。浏览器直接从你的硬盘上读它；这个过程中\
      没有任何东西被送去哪里。"""

[[howto]]
title = "看清体积堆在哪儿。"
body = """\
      第二步的意义就在这张分布图上。如果条形大部分是图片，这个工具有东西\
      可做。如果大部分是字体和页面内容，它会照实说，能省下的老实说也就\
      百分之几 &mdash; 与其花上一分钟，不如先知道这件事。"""

[[howto]]
title = "说明要压多狠。"
body = """\
      那几个命名的档位是分辨率，不是含糊的等级：96 DPI 用于屏幕上阅读，
      130 用于发邮件，220 用于还要打印的东西。每一档都是按图片在页面上\
      实际画出来的大小来衡量的，所以一张当缩略图放的照片，不会被当成\
      整页扫描件对待。"""

[[howto]]
title = "压缩，然后看一眼那句“已核对”。"
body = """\
      重写完成之后，写出来的文件会被这个页面上的同一个读取器重新打开一遍，\
      并数一遍页数。如果和原来的对不上，这一次就被报告为失败，也不会给你\
      下载。"""

[[faq]]
q = "我的 PDF 会被上传到什么地方吗？"
a = """
        不会。文件由你自己的浏览器、在你自己的硬件上读取、重新压缩和写出。\
        这个工具没有服务器端，而页面的 <code>Content-Security-Policy</code>\
        列出了它可能联系的每一个地址 &mdash; 其中没有一个属于本站。这个\
        工具连一个可选的网络功能都没有。"""

[[faq]]
q = "我的 PDF 能小多少？"
a = """
        完全取决于里面装的是什么，所以工具会在压缩任何东西之前先量一遍、\
        给你看。扫描出来的文档几乎全是照片，通常能小 60&ndash;90%。一份合同\
        或者一篇论文是文字、矢量图形和嵌入字体，这些在生成它的软件那里就\
        已经压过了；那种情况下能省的通常是百分之几，来自重新打包文件和丢掉\
        不再被引用的内容。任何不看你的文件就承诺一个固定百分比的工具，都是\
        在猜。"""

[[faq]]
q = "压缩 PDF 会不会损失质量？"
a = """
        里面的图片会被重新编码，所以对图片来说会。别的什么都不动：文字还是\
        文字，能选中也能搜索，字体完整保留，矢量图形原样复制过去。工具还\
        拒绝白白把一张图弄差 &mdash; 如果重新编码的结果并不比原来小，原来的\
        字节就原封不动地放回文档里。"""

[[faq]]
q = "这里说的 DPI 是什么，它为什么要问？"
a = """
        PDF 记录了每张图片在页面上画多大，所以工具可以算出它的有效分辨率：\
        一张 4000 像素的扫描件铺在八英寸纸上，就是每英寸 500 个像素。屏幕上\
        用不了那么多，纸上也几乎用不了，所以超过你所选档位的那些像素会被\
        优先丢掉 &mdash; 它们花掉的质量谁也看不见。正是这套测量，让一个放得\
        很小的 logo 不会和整页扫描件被同样对待。"""

[[faq]]
q = "它能打开加了密码的 PDF 吗？"
a = """
        不能，而且这是故意的。加密的文档会被拒绝，并给出一条说明，哪怕密码\
        是空的也一样 &mdash; 很多扫描仪和复印机就是这么存的。把一个文件的\
        保护去掉，和压缩它是两件事，一个工具悄悄做了这件事，就是在做你没有\
        要求的事。"""

[[faq]]
q = "有没有它压不了的 PDF？"
a = """
        有些内嵌图片压不了。JPEG 2000、JBIG2 和传真编码（CCITT）的图片在\
        任何浏览器里都没有解码器，所以它们会原样通过，并被如实标出 &mdash;
        后两种是二值编码，本来通常也已经接近最小了。CMYK 图片同样不动，\
        因为重新编码有可能让打印机输出的颜色跑掉。工具跳过的每一样都会\
        列在结果里，连同原因。"""

[[faq]]
q = "压缩后的文件到哪儿都还能打开吗？"
a = """
        能。输出写成 PDF 1.5，2003 年以后出的每一个阅读器都认得，而且工具\
        会在你自己的机器上把这一点证明给你看：它把写好的文件重新打开一遍、\
        数一遍页数，然后才交给你。表单、链接、书签、无障碍结构和任何内嵌\
        附件都会被带过去；留下不要的，是文档里已经没有任何东西再引用的\
        那些材料。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，而且没有账号、没有登录、没有试用期，除了你自己机器的内存之外\
        也没有文件大小限制。本站带广告，这就是它的经费来源；广告拿不到任何\
        关于你文档的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。把页面加载一次，然后断开网络，它照样工作。这也是证明“什么都没被\
        上传”最简单的办法：一个把你的文档送出去压缩的工具，在你拔线的那一刻\
        就会停下来。"""

