name = "PDF 合并与拆分"
heading = "PDF 合并 <span class=\"h1-kw\">&mdash; 还能拆分和重排页面</span>"
tagline = "挪动页面，不用往服务器跑一趟。"

title = "PDF 合并、拆分与页面重排 | 免费、不上传"
description = "把多个 PDF 合到一起，把一个拆成好几个，把页面拖成你要的顺序，全都在你自己的浏览器里完成。什么都不上传，不用注册，成品文件在交给你之前还会被重新打开、重新数一遍页数。"
og_title = "PDF 页面合并、拆分与重排 &mdash; 什么都不上传"
og_description = "把文档拼起来，把一个切成几块，挪页、转页、删页。干活的是你自己的浏览器，文件从不离开你的机器。"
og_image_alt = "不上传就能合并、拆分和重排 PDF 页面"

pledge = """\
    你选中的每一份文档，都是由这个地址提供的代码，在这台机器的内存里打开、拆开、\
    再写回去的。这里没有任何东西能发起上传，页面的另一端也没有服务器来接。"""

live_hint = """
      不用信我们说的。打开开发者工具，盯着“网络”面板，合并两个文件试试。没有\
      哪个请求带上某一页、某张图，或者文件名。嫌麻烦就直接拔掉网线，照样合。"""

read_first = """\
，以及负责全部复制工作的 <code>src/assemble.js</code>：\
      一页是怎么从一份文档里抽出来、放进另一份的，又有什么是有意留下不带走的。\
      它够不着网络，旁边的读取器和写入器同样够不着。"""

howto_heading = "PDF 合并、拆分或重排的步骤"

card = """\
            把文档拼起来，把一个切成好几个，把页面拖成你要的顺序。链接和书签会\
            重新搭好，跟着它们指向的页面走；每一个成品文件在交给你之前，都会被\
            重新打开、重新数一遍页数。"""

[words]
plural = "文档"
choose = "PDF"

[[facts]]
text = "不上传"

[[facts]]
text = "不注册"

[[facts]]
text = "断网可用"

[[facts]]
text = "开源"

[[facts]]
text = "文件不出这台机器"

[[privacy]]
title = "你的文档没有出去的路。"
body = """\
      Content-Security-Policy 里写着这个页面允许联系的每一个地址，没有一个\
      属于本站。这个工具没往那份名单里加任何东西，因为它连一项自己的网络功能\
      都没有，连可选的都没有。这里没有任何可以收走你文件的接收端，就算有，\
      代码里也没有把文件送过去的东西。"""

[[privacy]]
title = "合并恰恰是最不该上传的那类活。"
body = """\
      人们要拼在一起的文档，往往正是从别处来的那些：合同和它的签字页、护照\
      扫描件和银行流水、诊断书和理赔表。一个在线合并服务因此拿到了全部，放在\
      一处，还已经排好了序。这个工具只有你浏览器里的一个页面，没有另外那一半。"""

[[privacy]]
title = "整个格式都在这个仓库里。"
body = """\
      一份 PDF 就是一串对象，加上一张记录每个对象从哪儿开始的表。\
      <code>src/objects.js</code> 读这套语法，<code>src/reader.js</code> 顺着\
      那张表走，<code>src/assemble.js</code> 在文档之间复制页面，\
      <code>src/writer.js</code> 写出结果。这四个里没有一个引入了能发出请求的\
      东西。不会去取任何库，也没有什么是在服务器上渲染的。"""

[[privacy]]
title = "加密的文件会被挡下，而不是被打开。"
body = """\
      带密码的 PDF 一律拒收，包括扫描仪用空密码生成、技术上其实打得开的那种。\
      给文档解除保护，和挪动它的页面是两码事，一声不吭地替你做了，对一个工具\
      来说太越界了。"""

[[privacy]]
title = "成品文件不会说自己是在哪儿做的。"
body = """\
      没有生成器一行，没有创建日期，没有工具名字。它也不带走排版软件留下的 \
      XMP 数据包和私有块，那些属于此前存在过的那份文档，而不属于你刚做出来的\
      这一份。页面里的内容会被原样复制：这个工具挪的是页，不改页面上写着什么。"""

[[privacy]]
title = "不是“跳到某一页”的动作不会被复制。"
body = """\
      PDF 里可以放打开时就执行的指令：播放这个、把这张表单提交到那个地址、运行\
      这段 JavaScript。经过这个工具的页面，会保留通向其他页面和网址的链接，其余\
      的都丢掉。你要重排别人的页面，不构成把人家文档的脚本一起带进你新文件的\
      理由。"""

[[privacy]]
title = "Google 加载了什么，又拿不到什么。"
body = """\
      广告脚本和统计脚本来自 Google。关于你文档的信息，一条也没有交给它们，\
      文件、某一页、名字、大小、页数都没有。读取、复制、写出 PDF 的每一行代码\
      都由这个源提供，也都摆在仓库里。"""

[[privacy]]
title = "捐助按钮加载了什么，又拿不到什么。"
body = """\
      页首那个“Buy me a coffee”按钮由 cdnjs.buymeacoffee.com 的脚本画出来，\
      字体取自 Google Fonts。它不过是个链接，不上报访问，也拿不到关于你或\
      你文档的任何东西。不点它就什么都不会发生，点下去到的是别人的站。"""

[[privacy]]
title = "断网也照样能用。"
body = """\
      断开网络，这个页面上的一切照常工作。这是最省事的一条证明，真要把你的\
      文档送出去合并，那时候就停了。"""

[[howto]]
title = "选好你的 PDF。"
body = """\
      拖到选择框里，或者自己找出来，之后还能再加：每个文件的页面都会接在当前\
      顺序的末尾，正因如此，两个文件夹可以分两次合。浏览器直接从你的磁盘上读。"""

[[howto]]
title = "把页面排成你要的顺序。"
body = """\
      抓住把手拖动一页，或者用箭头一格格挪。把扫歪了的那页转正，把某页删掉，\
      或者在框里敲 <code>1-3, 8, 12-</code>，一次性保留、删除或旋转一整串。\
      编号会随着你的操作重新编排，所以你看到的永远就是成品的样子。"""

[[howto]]
title = "说清楚出来的是一份文档还是好几份。"
body = """\
      一份是常见答案。其余都是切法：每隔多少页切一次、在你指定的页码处切、\
      一页一个文件，或者切回它们原本所属的文件。多于一份的时候会打包成一个 \
      ZIP 交给你，这样只保存一次，而不是五十次。"""

[[howto]]
title = "生成它，然后读那行“已核对”的说明。"
body = """\
      文档写完之后，页面上同一个读取器会把每一份重新打开，数一遍页数。要是数出来\
      和你要的对不上，这次操作会被报为失败，也不会给你下载。"""

[[faq]]
q = "我的 PDF 会被传到哪里去吗？"
a = """
        不会。它们由你自己的浏览器在你自己的硬件上读取、复制和写出。这个工具没有\
        服务端，页面的 <code>Content-Security-Policy</code> 里写着它允许联系的\
        每一个地址，没有一个属于本站。这个工具连可选的网络功能都完全没有。"""

[[faq]]
q = "能合并多少个文件，文件能有多大？"
a = """
        工具里没写任何上限。上限是你自己的机器：文档在处理期间是放在内存里的，\
        所以一台笔记本合个几百兆不会有意见，再往上就开始吃力。这里不收费、不限速、\
        不加水印、不排队，因为另一端根本没人来做这些事。"""

[[faq]]
q = "合并或拆分会掉画质吗？"
a = """
        不会。页面上的任何东西都不会被重新编码、重新渲染或重新压缩。每一页的内容\
        流，以及它引用的每种字体、每张图片、每个矢量图形，都是逐字节复制过去的，\
        所以文字照样能选能搜，照片还是那张照片。变的只有页面的顺序，以及它们外面\
        那层结构。"""

[[faq]]
q = "书签和链接会怎样？"
a = """
        两者都是重新搭好，而不是直接丢掉。目标页还在结果里的书签，会指向那一页新的\
        位置；目标页被你删掉的书签会消失，除非它下面还有活着的条目，那它就作为一个\
        标题留下来。合并多个文件时，每个文件的书签会归到一个以它命名的标题下面。\
        页面之间的链接用同样的办法跟过去，包括 Word 和 LaTeX 写的具名目标；目标\
        没有跟过来的链接会被留成什么都不做，而不是把读者送到错的地方。指向网址的\
        链接原样保留。"""

[[faq]]
q = "有什么是不会带过去的？"
a = """
        四样，而且工具会在结果里说明，而不是写在小字里。屏幕阅读器用的带标签阅读\
        顺序树、页面标签（“iii、iv、1、2”那套编号）、内嵌的附件，以及任何既不是\
        “跳到某一页”也不是“打开某个网址”的动作，包括文档里的 JavaScript。前两样\
        描述的是页面一挪就不复存在的顺序；最后一样，你并没有要求把它带进新文件。\
        要是文档的无障碍标签对你重要，那就把原件也留着。"""

[[faq]]
q = "填好的表单还在吗？"
a = """
        在。表单字段和里面填的内容会跟着页面一起过来，新文档也会被登记成表单，\
        阅读器就会按表单来对待它。合并时有一点要知道：在任何阅读器看来，同名的两个\
        字段就是同一个字段，所以如果你把同一张表单的两份合在一起，在其中一页填一个\
        框，另一页那个也会跟着填上。工具会发现这种情况并说明。"""

[[faq]]
q = "能打开带密码的 PDF 吗？"
a = """
        不能，而且是故意的。加密的文档会被拒收，并附上说明，哪怕密码是空的也一样，\
        而不少扫描仪和复印机正是那样保存的。给文件解除保护，和挪动它的页面是两码\
        事，一个悄悄这么干的工具，就是在做你没要求它做的事。"""

[[faq]]
q = "为什么没有页面缩略预览？"
a = """
        因为要把一页画出来，就得有一个完整的 PDF 渲染器：字体、渐变、透明组、混合\
        模式，那是一兆开外的引擎，为了几张缩略图要下载并跑起来。方块上显示的，是\
        重排真正会用到的东西：页码、纸张的形状和尺寸、写出时会带的旋转，以及它出自\
        哪个文件。一叠竖版页面里混进一张横版扫描，照样一眼就看得出来。"""

[[faq]]
q = "做好的文件到哪儿都能打开吗？"
a = """
        能。输出写成 PDF 1.5，或者写成你给的这些文件里所需的最高版本，而 1.5 自 \
        2003 年以来出厂的每一个阅读器都懂。工具还会在你自己的机器上把这一点做实：\
        它会把每个成品文件重新打开，沿着页面树数一遍页数，然后才把它给你。"""

[[faq]]
q = "它免费吗，需要注册吗？"
a = """
        免费，没有账号，不用登录，没有试用期，除了你自己机器的内存之外也没有文件\
        大小限制。本站带广告，经费就是从那儿来的，广告拿不到任何关于你文档的信息。"""

[[faq]]
q = "断网能用吗？"
a = """
        能。页面加载一次之后断开网络，它照样干活。这也是证明“什么都没上传”最省事的\
        办法，真要把你的文档送出去合并，拔线那一刻就停了。"""

[schema]
description = "在浏览器里合并 PDF、把一个拆成多个文件，并重排、旋转或删除页面。页面是在本地于文档之间复制的，所以任何文件都不会被上传。"
features = [
  "合并任意数量的 PDF，过程中还能继续加文件",
  "拖动页面排序、旋转、删除，也可以一次处理一整段范围",
  "可按一页一个文件、每隔多少页、指定页码，或切回原本所属的文件来拆分",
  "按留下的页面重新搭好书签和内部链接",
  "保留填好的表单字段，并在两个字段同名时给出提示",
  "每个成品文件在交出之前都会被重新打开并数一遍页数",
  "断网可用；不上传、不注册、无大小限制",
]

[picker]
title = "把 PDF 拖到这里"
hint = "也可以点击选择 &mdash; 一个或多个，之后还能再加"
