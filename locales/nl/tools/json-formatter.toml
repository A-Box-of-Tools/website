[[faq]]
q = "Wordt mijn tekst ergens naartoe geüpload?"
a = """
        Nee. Elke parser en elke schrijver op deze pagina is een functie die in je
        eigen browser draait, op je eigen hardware. Deze tool heeft geen enkele
        netwerkfunctie: hij haalt nooit iets op en verstuurt nooit iets, en de
        <code>Content-Security-Policy</code> van de pagina noemt elk adres dat ze
        mag benaderen, waarvan er geen enkele van ons is. Dat is de reden om hem te
        gebruiken voor een toegangstoken, een sessiecookie of een klantgegeven:
        zoiets in andermans formatter plakken is het weggeven."""

[[faq]]
q = "Verandert JSON formatteren iets anders dan de opmaak?"
a = """
        Nee, en dat is lastiger dan het klinkt. Sleutels houden de volgorde waarin je ze
        schreef: een formatter die op <code>JSON.parse</code> is gebouwd verplaatst
        sleutels die op gehele getallen lijken stilletjes naar voren, dus
        <code>{"10":a,"2":b}</code> komt terug als <code>{"2":b,"10":a}</code>. Getallen
        houden de cijfers die je typte, dus een id van twintig cijfers raakt zijn laatste
        drie niet kwijt aan een double en <code>1e999</code> wordt geen
        <code>null</code>. Dubbele sleutels blijven allebei staan, want de standaard
        zegt niet welke wint en er eentje weggooien zou voor jou kiezen zijn."""

[[faq]]
q = "Welke talen kan hij formatteren?"
a = """
        JSON, XML, HTML, CSS en YAML. JSON, XML, HTML en CSS kunnen ook platgeperst
        worden; YAML niet, want zijn korte vorm is flowstijl, en die is onleesbaar, en
        onleesbaar is het tegenovergestelde van de reden om een bestand in YAML te
        houden. JavaScript staat er met opzet niet bij: zie de vraag daarover
        hieronder."""

[[faq]]
q = "Waarom formatteert hij geen JavaScript, Python of SQL?"
a = """
        Omdat een programmeertaal netjes neerzetten betekent dat je hem echt moet
        ontleden, en een formatter die het bijna goed doet is erger dan geen: hij levert
        code op die er prima uitziet en iets anders doet. JSON, XML, CSS en YAML hebben
        grammatica's die klein genoeg zijn om met de hand te lezen en met tests te
        controleren die je zelf kunt draaien. Een JavaScript-formatter is Prettier, en
        dat is een megabyte parser, die thuishoort in je editor en niet op een
        webpagina."""

[[faq]]
q = "Mijn YAML zegt no en de JSON kwam eruit als tekenreeks. Waarom?"
a = """
        Omdat het een tekenreeks ís, en dit YAML 1.2 leest en geen 1.1. In YAML 1.1
        waren <code>yes</code>, <code>no</code>, <code>on</code> en <code>off</code>
        booleans, en dat is de beroemde bug die de landcode van Noorwegen in
        <code>false</code> verandert. YAML 1.2 heeft dat geschrapt en deze tool ook:
        alleen <code>true</code>, <code>false</code>, <code>null</code> en
        <code>~</code> worden als iets anders dan tekst gelezen. De andere kant op
        worden die woorden <em>tussen aanhalingstekens</em> teruggeschreven, ook al zou
        deze tool ze zonder die tekens ook als tekst lezen, want wat het bestand daarna
        opent misschien niet. PyYAML staat nog altijd standaard op 1.1. Streng lezen en
        behoudend schrijven is de enige combinatie die beide kanten op klopt."""

[[faq]]
q = "Wat gaat er verloren bij het omzetten van YAML naar JSON?"
a = """
        Opmerkingen, want JSON heeft er geen plek voor. Ankers, aliassen en tags worden
        botweg geweigerd in plaats van geraden: elk daarvan zegt iets wat JSON niet kan
        zeggen, en een omzetter die stilletjes een uitleg koos zou je een document geven
        dat niet is wat het bestand zei. De andere kant op gaat er niets verloren: elk
        JSON-document is al een YAML-document."""

[[faq]]
q = "Wat gaat er verloren bij het omzetten van JSON naar XML?"
a = """
        Het verschil tussen een leeg object, een lege array en een lege tekenreeks, die
        alle drie een leeg element worden, en het type van elke waarde, want XML heeft
        geen types. Daarom laat de omgekeerde omzetting alles tekenreeks in plaats van te
        besluiten dat <code>8080</code> een getal was. Een array wordt een herhaald
        element, want dat is de enige vorm die weer teruggelezen kan worden, en bij een
        sleutel die een elementnaam niet kan dragen worden de lastige tekens vervangen,
        in plaats van een document uit te spugen dat geen enkele parser leest."""

[[faq]]
q = "Verandert HTML opnieuw inspringen hoe de pagina eruitziet?"
a = """
        Dat kan, en daar is deze tool eerlijk over. Witruimte tussen twee inline-elementen
        is een spatie tussen twee woorden, dus die verplaatsen is niet gratis. Twee
        dingen houden dat in toom: <code>&lt;pre&gt;</code> en
        <code>&lt;textarea&gt;</code> worden precies overgenomen zoals ze waren, en een
        element dat niets dan tekst bevat blijft op één regel staan. Al het andere wordt
        netjes neergezet."""

[[faq]]
q = "Hoe groot mag het bestand zijn?"
a = """
        Hier is geen limiet ingesteld, want er is geen server die ervoor betaalt. Het
        echte plafond is je eigen machine: een paar megabyte JSON gaat prima, en bij
        een heel lang document wacht de pagina op een pauze in je typen voordat ze
        opnieuw formatteert, in plaats van met je om het toetsenbord te vechten."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        limiet op hoeveel je plakt aan te pas. De site draait op advertenties, en die
        betalen hem; die advertenties krijgen niets over je tekst mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij werkt
        gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er niets
        geüpload wordt, want een tool die je tekst wegstuurde om hem te laten formatteren
        zou ermee ophouden zodra je de stekker eruit trok."""

