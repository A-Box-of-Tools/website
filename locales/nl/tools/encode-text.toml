[[privacy]]
title = "Wat je plakt kan nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en geen
      daarvan is van ons. Er is hier geen eindpunt waar een geplakt token verzameld zou
      kunnen worden, en er staat ook niets in de code dat het daarheen zou sturen als
      dat er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 Er staat nergens in <code>src/</code> een
      <code>fetch</code>, een <code>XMLHttpRequest</code> of een
      <code>sendBeacon</code>. Elke codeerder en elke decodeerder zijn functies in
      deze pagina die een tekenreeks aannemen en een tekenreeks teruggeven."""

[[privacy]]
title = "De decodeerder zegt het als er iets mis is."
body = """
 De <code>atob</code> van de browser
