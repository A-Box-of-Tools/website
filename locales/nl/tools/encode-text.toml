      terug. De Base64 hier is met de hand geschreven en wordt gecontroleerd tegen
      de testvectoren van RFC&nbsp;4648, en als wat je plakte geen Base64 is, zegt
      hij dat, en zegt hij waarom. De tests in
      <code>tests/js/text-encode.test.js</code> controleren precies dat."""

