[[faq]]
q = "Wordt mijn tekst ergens naartoe geüpload?"
a = """
        Nee. Elke codeerder en elke decodeerder op deze pagina is een functie die in
        je eigen browser draait, op je eigen hardware. Deze tool heeft geen enkele
        netwerkfunctie: hij haalt nooit iets op en verstuurt nooit iets, en de
        <code>Content-Security-Policy</code> van de pagina noemt elk adres dat ze
        mag benaderen, waarvan er geen enkele van ons is. Dat is de reden om hem te
        gebruiken voor een toegangstoken of een sessiecookie: zoiets in andermans
        decodeerder plakken is het weggeven."""

[[faq]]
q = "Is de Base64 hier dezelfde Base64 als overal?"
a = """
        Ja: hij wordt getoetst aan de testvectoren uit RFC 4648 en niet aan zichzelf.
        Beide alfabetten decoderen, dus een JWT geschreven met <code>-</code> en
        <code>_</code> leest net zo makkelijk als een met <code>+</code> en
        <code>/</code>, en invoer die op 64 tekens is afgebroken wordt voor je
        aaneengeplakt. Coderen gaat via UTF-8-bytes, dus een letter met een accent of
        een emoji overleeft de heen- en terugweg."""

[[faq]]
q = "Is Base64 versleuteling?"
a = """
        Nee, en het daarvoor aanzien is de klassieke fout. Base64 is een spelling:
        dezelfde bytes, geschreven in een alfabet dat een URL, een e-mail of een
        JSON-tekenreeks overleeft. Iedereen kan het terugvertalen &mdash; deze
        pagina doet het in een milliseconde &mdash;, dus het verbergt niets en
        beschermt niets. Als wat je hebt geheim is, heeft het echte versleuteling
        nodig voordat het gecodeerd wordt, niet in plaats daarvan."""

[[faq]]
q = "Waarom mislukte het decoderen?"
a = """
        Omdat wat er geplakt is net niet is wat de codec verteld werd dat het was,
        en de fout zegt waar het aan ligt: een teken buiten het Base64-alfabet,
        opvulling op de verkeerde plek, een procentteken zonder twee hexcijfers
        erachter, of bytes die wel uit Base64 te decoderen zijn maar geen UTF-8-tekst
        zijn &mdash; wat meestal betekent dat het origineel een bestand was en geen
        tekenreeks. De <code>atob</code> van de browser had in plaats daarvan iets
        aannemelijks teruggegeven; het te horen krijgen is precies waarom je iets in
        een decodeerder plakt."""

[[faq]]
q = "Wat is het verschil tussen de twee webadres-coderingen?"
a = """
        Eén waarde, of het hele adres. <em>Eén waarde</em> coderen escapet alles
        waar een URL betekenis aan geeft &mdash; schuine strepen, vraagtekens,
        ampersands &mdash;, wat je wilt voor één parameter in een querystring. Een
        <em>hele URL</em> coderen laat het adres werken: de schuine strepen en het
        <code>?</code> blijven staan, en alleen de tekens die een URL helemaal niet
        kan dragen worden ge-escapet. Het eerste op een heel adres toepassen breekt
        het adres; het tweede op een waarde toepassen verliest waar de waarde
        ophoudt."""

[[faq]]
q = "Hoe groot mag het bestand zijn?"
a = """
        Hier is geen limiet ingesteld, want er is geen server die ervoor betaalt. Het
        echte plafond is je eigen machine: een paar megabyte tekst gaat prima, en bij
        een heel lang document wacht de pagina op een pauze in je typen voordat ze
        opnieuw codeert, in plaats van met je om het toetsenbord te vechten."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        limiet op hoeveel je plakt aan te pas. De site draait op advertenties, en die
        betalen hem; die advertenties krijgen niets over je tekst mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je tekst wegstuurde om hem te laten
        decoderen zou ermee ophouden zodra je de stekker eruit trok."""

