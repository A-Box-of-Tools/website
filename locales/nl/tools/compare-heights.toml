pledge = """
    Een lengtegrafiek is rekenwerk en een tekening: er is geen bestand om te
    versturen en geen dienst om iets aan te vragen &mdash; en het ene bestand
    dat deze pagina aanneemt, een eigen afbeelding voor op de meetlat, wordt hier
    gelezen en gaat nergens heen. De man, de vrouw, de jongen en het meisje zijn
    illustraties uit het publieke domein die met deze pagina meekomen, en de
    jongen en het meisje zijn tekeningen van echte kinderen in plaats van klein
    gemaakte volwassenen &mdash; en dat is precies wat een gezinsgrafiek behoedt
    voor een fout die niemand kan benoemen. Elke stap gebeurt in een paar
    honderd regels JavaScript op deze pagina die je kunt lezen. Er is überhaupt
    geen netwerkfunctie, en dat telt hier omdat wat je typt een lijst van mensen
    is en hoe lang ze elk zijn."""

live_hint = """
