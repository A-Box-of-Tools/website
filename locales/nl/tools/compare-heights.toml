title = "Lengtes vergelijken &mdash; gratis, zonder aanmelden, zonder upload"
description = "Vergelijk lengtes naast elkaar. Voeg een man, een vrouw, een jongen, een meisje, een peuter en voorwerpen toe &mdash; een deur, een raam, een whiteboard, een automaat &mdash; in centimeters of in voet en inches, en download de grafiek als PNG of SVG. Hij wordt in je browser getekend."
