pledge = """
    Een lengtegrafiek is rekenwerk en een tekening: er is geen bestand om te
    versturen en geen dienst om iets aan te vragen. De man, de vrouw, de jongen
    en het meisje zijn illustraties uit het publieke domein die met deze pagina
    meekomen; de peuter wordt hier opgebouwd uit een tabel met
    lichaamsverhoudingen, en daarom heeft hij de vorm van een peuter en niet van
    een kleine volwassene. Elke stap gebeurt in ongeveer zeshonderd regels
    JavaScript op deze pagina die je kunt lezen. Er is überhaupt geen
    netwerkfunctie, en dat telt hier omdat wat je typt een lijst van mensen is
    en hoe lang ze elk zijn."""

live_hint = """
      Je hoeft ons niet op ons woord te geloven: open de DevTools, kijk naar het
      netwerktabblad en typ een naam en een lengte. Geen enkele aanvraag draagt
      van geen van beide een teken. Of trek de stekker uit het internet en maak
      de grafiek toch."""

read_first = """
, <code>src/traced.js</code> en
      <code>vendor/</code> voor de vier getekende figuren en waar hun
      illustraties vandaan komen, <code>src/figures.js</code> voor de
      verhoudingstabel waaruit de peuter is opgebouwd, <code>src/units.js</code>
      voor hoe een getypte lengte een getal wordt en hoe de meetlat wordt
      gelabeld, <code>src/chart.js</code> voor de opmaak, en
      <code>src/save.js</code> voor de twee downloads &mdash; dat zijn de SVG op
      het scherm, en diezelfde SVG op een canvas geschilderd."""

howto_heading = "Zo maak je een lengtevergelijkingsgrafiek"

