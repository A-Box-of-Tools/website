[[howto]]
title = "Kopieer, of download."
body = """
 Eén knop per resultaat, en één voor
      alles tegelijk. De custom properties komen eruit in een
      <code>:root</code>-blok, klaar om boven aan een stylesheet te plakken."""

[[faq]]
q = "Wordt mijn afbeelding ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest en codeert het bestand op je eigen hardware, met
        twee functies die de browser toch al heeft. Deze tool heeft geen enkele
        netwerkfunctie en haalt dus nooit iets op en verstuurt nooit iets. In de
        <code>Content-Security-Policy</code> van de pagina staat bovendien elk adres
        dat hij mag benaderen, en geen daarvan hoort bij deze site."""

[[faq]]
q = "Wat is een data-URI?"
a = """
        Een manier om een heel bestand op te schrijven op de plek waar normaal een
        webadres staat. In plaats van <code>url("logo.png")</code>, waarmee je de
        browser opdraagt iets te gaan halen, schrijf je
        <code>url("data:image/png;base64,iVBORw0...")</code>, met het plaatje er zelf
        in. De browser decodeert het ter plekke. In de praktijk scheelt dat één
        verzoek, want het plaatje komt mee met de stylesheet of de pagina in plaats
        van erna."""

[[faq]]
q = "Waarom is mijn SVG geen base64?"
a = """
        Omdat base64 er de verkeerde codering voor is. Een SVG is tekst, en een URL
        kan tekst al meedragen, want er hoeft maar een handvol tekens ontsnapt te
        worden. Codeer je alleen die als procenttekens en laat je de rest met rust,
        dan krijg je een URI die meestal een vijfde korter is dan de base64 van
        hetzelfde bestand en die je in je stylesheet gewoon kunt blijven lezen. De
        elementnamen, de kleuren en de <code>viewBox</code> staan er allemaal nog om
        te bewerken. Voor de zeldzame toolchain die op base64 staat, is er een
        vinkje."""

[[faq]]
q = "Hoeveel groter maakt base64 mijn afbeelding?"
a = """
        Ongeveer een derde. Drie bytes bestand worden vier tekens base64, en dat is
        33% nog vóór de <code>data:image/png;base64,</code> die ervoor komt. Die
        ondergrens ontloop je niet, want zoveel kost het nu eenmaal om willekeurige
        bytes op te schrijven met alleen de tekens die een URL toestaat. Daarom zet
        de pagina het aantal tekens naast de bestandsgrootte, in plaats van je het te
        laten ontdekken zodra de stylesheet live staat."""

[[faq]]
q = "Wanneer is het eigenlijk een goed idee om een afbeelding inline te zetten?"
a = """
        Als hij klein is en je hem meteen nodig hebt. Een icoontje van 2 KB in een
        stylesheet die op elke pagina geladen wordt is pure winst: één heen-en-weer
        minder, en het plaatje is er zodra de CSS er is. Voorbij zo'n 10 KB kantelt
        de ruil. Een inline plaatje is namelijk geen apart bestand meer, dus het kan
        niet los in de cache, het kan niet parallel met iets anders opgehaald worden,
        en bij elke wijziging van het bestand eromheen wordt het volledig opnieuw
        gedownload. Een foto van 200 KB in een stylesheet legt er dus 200 KB bij op
        het kritieke pad van elke pagina op de site. Bij elk resultaat zegt de pagina
        aan welke kant van die streep het valt."""

[[faq]]
q = "Maakt gzip de base64-overhead weer ongedaan?"
a = """
        Minder dan mensen verwachten. Base64 van een bestand dat al gecomprimeerd is,
        en een PNG, een JPEG en een WebP zijn dat alle drie, comprimeert slecht,
        omdat er bijna geen herhaling meer over is die de compressor kan vinden. Je
        krijgt er meestal zoiets als een tiende van terug van de derde die base64
        erbij deed, en niet het geheel. Bij een procentgecodeerde SVG ligt het net
        andersom. Dat is nog steeds tekst, dus die comprimeert ongeveer net zo goed
        als daarvoor, en dat is nog een reden om er geen base64 van te maken."""

[[faq]]
q = "Verandert dit ook maar iets aan mijn afbeelding?"
a = """
        Nee, en dat is een bewust verschil met de meeste tools hier. Er wordt niets
        naar pixels gedecodeerd en opnieuw gecodeerd, want de bytes die van je schijf
        kwamen zijn precies de bytes die de URI in gaan. Een JPEG blijft de JPEG die
        hij was, op dezelfde kwaliteit en met dezelfde afmetingen. Daarom mag je het
        resultaat hetzelfde bestand noemen en niet een kopie ervan."""

[[faq]]
q = "Dus mijn EXIF- en gps-gegevens gaan ook de stylesheet in?"
a = """
        Ja, en daar wil je over nadenken voordat je plakt. Omdat er niets opnieuw
        gecodeerd wordt, reist alles wat de camera schreef gewoon met het plaatje
        mee: de locatie, de tijdstempel en het serienummer van de camera. Bij een
        telefoonfoto kan dat 30 KB van het bestand zijn, wat 40 KB base64 wordt op
        het kritieke pad van je pagina, plus een woonadres in iets dat naar een
        repository gecommit gaat worden. De pagina leest hoeveel metagegevens er in
        een JPEG, PNG of WebP zitten en zegt het je. Wil je ze er eerst uit halen,
        gebruik dan de <a href="../exif-gegevens-verwijderen/">EXIF-lezer &amp;
        -wisser</a>."""

[[faq]]
q = "Waarom koos hij een ander type dan de extensie van mijn bestand?"
a = """
        Omdat de extensie fout kan zijn en de bytes niet. Een bestand dat
        <code>logo.png</code> heet maar in werkelijkheid als JPEG geëxporteerd is,
        komt zo vaak voor dat elke beeldtool ermee om moet kunnen. En een data-URI
        die het verkeerde type opgeeft verschijnt domweg niet, zonder terugval en
        zonder foutmelding die het lezen waard is. Daarom wordt het type uit de
        eerste paar bytes van het bestand gelezen, die in elk formaat hier
        ondubbelzinnig zeggen wat het is, en hoor je het zodra de twee elkaar
        tegenspreken."""

[[faq]]
q = "De voorvertoning is leeg. Wat ging er mis?"
a = """
        Waarschijnlijk niets aan de URI. HEIC en TIFF leveren allebei volkomen
        geldige data-URI's op die geen enkele browser behalve Safari wil tekenen,
        waardoor het plaatje overal ontbreekt waar je het plakt. Zet het daarom eerst
        om naar PNG, JPEG of WebP met de
        <a href="../afbeelding-comprimeren/">Afbeeldingscompressor</a> of
        <a href="../afbeelding-formaat-wijzigen/">Afbeeldingsformaat wijzigen</a>.
        Gaat het om een alledaags formaat, dan is het bestand zelf waarschijnlijk
        beschadigd. De voorvertoning wordt namelijk getekend uit de URI die deze
        pagina bouwde, dus een lege betekent dat het plaatje niet decodeerde."""

[[faq]]
q = "Zit er een groottelimiet op een data-URI?"
a = """
        Geen die je in CSS of in een <code>&lt;img&gt;</code>-tag tegenkomt, want
        moderne browsers leggen daar geen praktisch plafond op. Wat browsers wel
        beperken is een data-URI in de adresbalk tikken, en dat weigeren de meeste
        inmiddels voor alles wat niet triviaal is, om veiligheidsredenen die niets
        met dit gebruik te maken hebben. De echte grens is die hierboven. Lang
        voordat er technisch iets breekt, is de pagina waar hij in zit al trager dan
        hij met een gewoon afbeeldingsbestand geweest zou zijn."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        watermerk aan te pas. Er zit ook geen limiet op het aantal bestanden of op de
        grootte ervan, omdat er geen server is die daarvoor betaalt: het werk gebeurt
        op je eigen apparaat. De site draait op advertenties, en die betalen hem. Die
        advertenties krijgen niets over je afbeeldingen mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je afbeeldingen wegstuurde om ze te
        laten coderen zou ermee ophouden zodra je de stekker eruit trok."""

