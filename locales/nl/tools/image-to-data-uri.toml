 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Er is hier geen eindpunt waar je bestanden
      verzameld zouden kunnen worden, en in de code staat niets wat ze zou
      versturen als dat eindpunt er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 In <code>src/</code> staat
      nergens een <code>fetch</code>, een <code>XMLHttpRequest</code> of een
      <code>sendBeacon</code>. Het coderen gebeurt met <code>btoa</code> en
      <code>encodeURIComponent</code>, twee functies die de browser al sinds het
      begin heeft en die allebei bytes aannemen en tekst teruggeven zonder ook maar
      ergens heen te gaan."""

[[privacy]]
title = "De voorvertoning is het bewijs."
body = """
 Het plaatje naast elk
      resultaat wordt getekend uit de data-URI die deze pagina zojuist bouwde, en
      dus niet uit je bestand. Het verschijnt omdat de URI klopt, op jouw apparaat,
      zonder dat er een server aan te pas komt. Verschijnt het niet, dan zegt de
      pagina dat, in plaats van je iets kapots aan te reiken."""

[[privacy]]
title = "De metagegevenswaarschuwing staat aan jouw kant."
