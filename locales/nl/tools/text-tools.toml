 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en geen
      daarvan is van ons. Er is hier geen eindpunt waar een geplakt token verzameld zou
      kunnen worden, en er staat ook niets in de code dat het daarheen zou sturen als
      dat er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 Er staat nergens in <code>src/</code> een
      <code>fetch</code>, een <code>XMLHttpRequest</code> of een
      <code>sendBeacon</code>. Elke parser, elke codeerder en de vergelijking zijn
      functies in deze pagina die een tekenreeks aannemen en een tekenreeks
      teruggeven."""

[[privacy]]
title = "De formatters houden wat ze kregen."
body = """
 Een JSON-object komt terug met zijn
      sleutels in de volgorde waarin je ze schreef en met zijn getallen gespeld zoals
      jij ze spelde, want <code>src/json.js</code> is een parser en geen aanroep van
      <code>JSON.parse</code>, die sleutels die op gehele getallen lijken naar voren
      haalt en een id van twintig cijfers in de dichtstbijzijnde double verandert. De
      tests in <code>tests/js/text-format.test.js</code> controleren precies dat."""

