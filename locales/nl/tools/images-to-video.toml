#
# Afbeeldingen naar video - Dutch.
#
# Overrides for tools/images-to-video/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# This is the one tool with a [picker.urls] table, so it is also the one whose
# translation has to supply the noun the importer's warning in [ui.picker] is
# written around. Dutch needs it in the singular, and the sentences there were
# written so the bare noun fits without an ending - Dutch does not make a plural
# with a lone "s".
#

name = "Afbeeldingen naar video"
heading = "Afbeeldingen&nbsp;naar&nbsp;video <span class=\"h1-kw\">&mdash; een mp4-diavoorstelling maken</span>"
tagline = "Maak van een map vol afbeeldingen een video."

title = "Beeldreeks naar mp4 &mdash; gratis, zonder uploaden, werkt offline"
description = "Maak van jpg-, png- of WebP-afbeeldingen een mp4-diavoorstelling, gratis en volledig in je browser. Er wordt niets geüpload, je hoeft je niet aan te melden, en het werkt offline."
og_title = "Beeldreeks naar mp4 &mdash; gratis, in je browser"
og_description = "Maak van een renderreeks, een timelapse of een map vol foto's een mp4. Het coderen gebeurt op je eigen apparaat; er wordt niets geüpload."
og_image_alt = "Afbeeldingen naar video - van een map vol afbeeldingen een mp4-diavoorstelling maken"

pledge = """
    Je eigen browser codeert elk frame, en de video wordt op dit apparaat in het
    geheugen opgebouwd. Bij de encoder komt het netwerk nooit te pas, en al deed
    hij dat wel, dan stond aan de andere kant van deze pagina nog steeds geen
    server om een afbeelding naartoe te sturen."""

live_hint = """
      Geloof ons vooral niet op ons woord. Open DevTools, hou het tabblad
      &ldquo;Netwerk&rdquo; in de gaten en maak een video. Geen enkel verzoek draagt
      een afbeelding, een miniatuur of een bestandsnaam. Of trek de stekker uit je
      internet en maak er alsnog een."""

read_first = """
, en <code>src/encoder.js</code> voor de codeerlus,
      waar het netwerk nooit aan te pas komt."""

howto_heading = "Zo maak je van afbeeldingen een video"

card = """
            Maak van een map vol afbeeldingen een mp4-diavoorstelling. Het
            coderen gebeurt op je eigen apparaat, met je eigen hardware."""

[words]
plural = "afbeeldingen"
choose = "afbeeldingen"

[[facts]]
text = "Geen upload"

[[facts]]
text = "Geen account"

[[facts]]
text = "Werkt offline"

[[facts]]
text = "Open source"

[[facts]]
text = "Bestanden blijven op je apparaat"

[[privacy]]
title = "Je afbeeldingen kunnen nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Er is hier geen eindpunt waar je bestanden
      verzameld zouden kunnen worden, en in de code staat niets wat ze zou versturen
      als dat eindpunt er wel was. Hier stond ooit <code>connect-src 'none'</code>,
      en dat was absoluut. Advertenties toevoegen heeft dat gekost, en het hardop
      zeggen hoort bij de afspraak."""

[[privacy]]
title = "Het coderen gebeurt hier."
body = """
 WebCodecs draait in je eigen browser, en
      het gereedgekomen bestand gaat rechtstreeks naar een download. Deze app heeft
      geen serverkant."""

[[privacy]]
title = "Wat Google laadt, en wat het niet te zien krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google. Geen van beide krijgt iets over je
      afbeeldingen mee: geen bestand, geen miniatuur, geen naam, geen grootte,
      geen aantal. Elke regel die een afbeelding leest, decodeert, samenstelt of
      codeert, wordt vanaf deze herkomst geserveerd en staat in de repository."""

[[privacy]]
title = "Wat de doneerknop laadt, en wat hij niet te zien krijgt."
body = """

      De knop &ldquo;Buy me a coffee&rdquo; in de kop wordt getekend door een
      script van cdnjs.buymeacoffee.com en haalt zijn letters bij Google Fonts.
      Het is een link en verder niets. Hij meldt geen bezoek en krijgt niets over
      jou of je afbeeldingen mee. Er gebeurt niets tenzij je erop klikt, en waar je
      dan naartoe klikt is de site van iemand anders."""

[[privacy]]
title = "Eén bewuste uitzondering."
body = """
 Gebruik je &ldquo;Toevoegen vanaf een
      webadres&rdquo;, dan wordt die server benaderd om de afbeelding op te halen en
      ziet hij je IP-adres. Er wordt alleen opgehaald wat jij er zelf in plakt, en
      het verkeer gaat maar één kant op, want <code>img-src</code> staat open en
      <code>connect-src</code> niet. De teller hieronder noemt elke herkomst van
      buiten die benaderd is."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en alles doet het
      nog, op het laden vanaf een webadres na. Eenvoudiger bewijs bestaat er niet."""

[[howto]]
title = "Kies je afbeeldingen."
body = """
 Sleep een map het vak in, of kies de
      bestanden met de hand. De browser leest ze rechtstreeks van je schijf, en er
      gaat ondertussen niets ergens heen."""

[[howto]]
title = "Zet ze op volgorde en bepaal hoe lang elke afbeelding blijft staan."
body = """
 Sleep
      om te herordenen. De vasthoudtijd kun je in frames of in seconden opgeven, voor
      alle afbeeldingen tegelijk of per afbeelding apart."""

[[howto]]
title = "Kies een resolutie en beeldsnelheid."
body = """
 Met &ldquo;Volg de hoogste
      resolutie&rdquo; wordt je grootste afbeelding aangehouden. De voorkeuzes dekken
      4K, 1080p, 720p, vierkant en staand, en past geen daarvan, dan stel je het
      formaat zelf in."""

[[howto]]
title = "Maak de video en download hem."
body = """
 Het coderen gebeurt op je eigen
      hardware, dus hoe lang het duurt hangt van je apparaat af en niet van een
      wachtrij. De gereedgekomen mp4 gaat rechtstreeks naar de downloads van je
      browser."""

[[faq]]
q = "Worden mijn afbeeldingen ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest, stelt samen en codeert je afbeeldingen, op je
        eigen hardware. Deze tool heeft geen serverkant, en in de
        <code>Content-Security-Policy</code> van de pagina staat elk adres dat hij mag
        benaderen, waarvan er geen enkele bij deze site hoort. De enige uitzondering
        is de optionele functie &ldquo;toevoegen vanaf een webadres&rdquo;, die een
        afbeelding ophaalt die jij er zelf in plakt. Die server ziet dan je IP-adres."""

[[faq]]
q = "Welke afbeeldingsformaten kan ik gebruiken?"
a = """
        Elk formaat voor stilstaand beeld dat je browser kan decoderen, in de praktijk
        dus jpg, png, WebP, gif, AVIF en op Apple-apparaten ook HEIC. Er valt hier
        geen aparte lijst bij te houden, omdat het decoderen het werk van de browser
        is en niet van ons."""

[[faq]]
q = "Welk videoformaat levert het op?"
a = """
        Mp4 met H.264-video, en dat speelt vrijwel overal af. In een browser zonder
        WebCodecs valt de tool terug op het opnemen van WebM, oftewel hetzelfde beeld
        in een container die minder editors accepteren."""

[[faq]]
q = "Kan ik dit gebruiken voor een renderreeks uit Blender of After Effects?"
a = """
        Ja, een genummerde renderreeks is precies waar dit voor bedoeld is. Voeg de
        frames toe die je renderer schreef, laat de vasthoudtijd op één frame per stuk
        staan en zet de beeldsnelheid gelijk aan die van de render. &ldquo;Sorteer op
        naam&rdquo; telt zoals je zou verwachten, dus <code>frame_2</code> landt vóór
        <code>frame_10</code> in plaats van erna.
        <br><br>
        Eén ding weet je liever voordat je begint. H.264 heeft geen alfakanaal, dus
        transparantie wordt op de achtergrondkleur platgeslagen in plaats van
        doorgegeven. Moet het alfa blijven, stel de frames dan in je editor samen."""

[[faq]]
q = "Kan ik een timelapse van foto's maken?"
a = """
        Ja, en dat is dezelfde klus als een renderreeks. Hou elke foto één frame vast
        en kies een beeldsnelheid. Op 30 fps wordt elke dertig foto's één seconde
        video, en op 12 fps lopen diezelfde foto's tweeënhalve seconde.
        <br><br>
        Met &ldquo;Sorteer op datum&rdquo; zet je een camerarol terug in de volgorde
        waarin hij geschoten is, en dat telt zodra de bestandsnamen weer bij 0001
        begonnen zijn. Foto's van verschillende formaten leveren geen probleem op,
        want &ldquo;Volg de hoogste resolutie&rdquo; kiest de videogrootte zo dat er
        geen enkele verkleind hoeft te worden."""

[[faq]]
q = "Zit er een limiet op het aantal afbeeldingen of de lengte van de video?"
a = """
        In de tool zit geen limiet ingebouwd. Het praktische plafond is het geheugen
        van je eigen apparaat, omdat de gereedgekomen video daar wordt opgebouwd
        voordat je hem downloadt. Bij heel grote 4K-diavoorstellingen merk je dat het
        eerst."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog en geen proefperiode aan
        te pas. De site draait op advertenties, en die betalen hem. Die advertenties
        krijgen niets over je afbeeldingen mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je afbeeldingen wegstuurde om ze te
        laten verwerken zou ermee ophouden zodra je de stekker eruit trok."""

[[faq]]
q = "Kan ik muziek of een soundtrack toevoegen?"
a = """
        Nog niet. Deze tool levert alleen beeld, want de mp4 die hij schrijft heeft
        één videospoor en geen audiospoor. Heb je toch een soundtrack nodig, zet die
        er dan achteraf in een video-editor bij."""

[schema]
browser_requirements = "Vereist JavaScript. Voor mp4-uitvoer is een browser met WebCodecs nodig; andere vallen terug op WebM."
description = "Maak van een map vol afbeeldingen een mp4-diavoorstelling. Elke stap draait in je browser, dus er wordt nooit een afbeelding geüpload."
features = [
  "Zet jpg-, png-, WebP-, gif- en AVIF-afbeeldingen om naar video",
  "Mp4-uitvoer (H.264), met WebM als terugval",
  "Resoluties tot 3840x2160, beeldsnelheden van 12 tot 60 fps",
  "Vasthoudtijd per afbeelding in frames of seconden",
  "Draait offline; geen upload, geen account",
]

[picker]
title = "Sleep afbeeldingen hierheen"
hint = "of klik om te bladeren &mdash; JPEG, PNG, WebP, GIF, AVIF"

[picker.urls]
summary = "Toevoegen vanaf een webadres"
button = "Afbeeldingen downloaden"
