[[privacy]]
title = "Je afbeeldingen kunnen nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en geen
      daarvan is van ons. Er is hier geen eindpunt waar je bestanden verzameld zouden
      kunnen worden, en er staat ook niets in de code dat ze daarheen zou sturen als
      dat er wel was. Hier stond ooit <code>connect-src 'none'</code>, en dat was
      absoluut. Advertenties hebben dat gekost, en dat erbij zeggen hoort bij de
      afspraak."""

[[privacy]]
title = "De encoder bestaat uit vier bestanden in deze repository."
body = """
 Een GIF heeft een
      kleurkwantiseerder en een LZW-compressor nodig, en de browser levert geen van
      beide, dus staan ze hier allebei uitgeschreven, in
      <code>src/quantize.js</code> en <code>src/lzw.js</code>, met de container in
      <code>src/gif.js</code>. Er wordt niets opgehaald om er een te maken, en er komt
      geen engine binnen bij het eerste gebruik."""

[[privacy]]
title = "Wat Google laadt, en wat het niet te zien krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google. Geen van beide krijgt iets over je afbeeldingen
      mee: geen bestand, geen miniatuur, geen naam, geen formaat en geen aantal. Elke
      regel die een afbeelding leest, decodeert, tekent of comprimeert, wordt vanaf
      deze herkomst geserveerd en staat in de repository."""

[[privacy]]
title = "Wat de doneerknop laadt, en wat die niet te zien krijgt."
body = """

      De knop &ldquo;Buy me a coffee&rdquo; in de kop wordt getekend door een script
      van cdnjs.buymeacoffee.com en haalt zijn letters bij Google Fonts. Het is niet
      meer dan een link: hij meldt geen bezoek en krijgt niets over jou of je
      afbeeldingen mee. Er gebeurt niets zolang je er niet op klikt, en waar je dan op
      zou klikken is de site van iemand anders."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en alles op deze pagina
      blijft werken. Eenvoudiger bewijs bestaat er niet: een tool die je plaatjes
      wegstuurde om er een GIF van te laten maken zou stoppen op het moment dat je de
      stekker eruit trok."""

[[howto]]
title = "Kies je afbeeldingen."
body = """
 Sleep een map op de kiezer, of zoek de
      bestanden met de hand op. De browser leest ze rechtstreeks van je schijf, en er
      gaat ondertussen niets ergens heen."""

[[howto]]
title = "Zet ze in de volgorde waarin ze moeten spelen."
body = """
 Sleep aan het
      handvat, of gebruik de pijltjes. &ldquo;Sorteer op naam&rdquo; telt zoals je
      verwacht, dus <code>frame_2</code> komt voor <code>frame_10</code>."""

[[howto]]
title = "Bepaal hoe lang elk frame blijft staan."
body = """
 Een halve seconde per
      frame is een diavoorstelling; een twintigste is animatie. Geef alle frames in
      één keer dezelfde tijd, of laat er eentje langer hangen."""

[[howto]]
title = "Kies een formaat, en hoe de kleuren gekozen worden."
body = """
 Een GIF groeit met
      zijn oppervlak en zijn aantal frames, en er is geen kwaliteitsschuif die dat
      weer terugbrengt, dus het formaat is de instelling die het meest uitmaakt. 256
      kleuren per frame ziet er het best uit en is de standaard; één gedeeld palet is
      kleiner en rustiger."""

[[howto]]
title = "Maak de GIF en download hem."
body = """
 Hij wordt op je eigen hardware
      gebouwd, dus hoe lang het duurt hangt af van je machine en niet van een
      wachtrij. De klaargemaakte animatie speelt op de pagina voordat je hem
      opslaat."""

[[faq]]
q = "Worden mijn afbeeldingen ergens naartoe geüpload?"
a = """
        Nee. Je afbeeldingen worden gelezen, getekend, gekwantiseerd en gecomprimeerd
        door je eigen browser op je eigen hardware. Deze tool heeft geen serverkant, en
        de <code>Content-Security-Policy</code> van de pagina noemt elk adres dat ze
        mag benaderen: geen daarvan is van ons. Trek de stekker eruit en hij maakt nog
        steeds GIF's."""

[[faq]]
q = "Welke afbeeldingsformaten kan ik gebruiken?"
a = """
        Elk stilstaand-beeldformaat dat je browser kan decoderen, wat in de praktijk
        JPG, PNG, WebP, GIF, AVIF en, op Apple-apparaten, HEIC betekent. Er is hier
        geen aparte lijst die bijgehouden moet worden, want decoderen is het werk van
        de browser en niet van ons."""

[[faq]]
q = "Waarom is mijn GIF zo groot?"
a = """
        Omdat een GIF elk frame als hele pixels opslaat. Er is geen
        bewegingscompensatie, niets wordt opgeslagen als &ldquo;hetzelfde als vorige
        keer maar verschoven&rdquo;, en er is geen kwaliteitsknop: de grootte is
        ruwweg het oppervlak maal het aantal frames, en maar drie dingen brengen hem
        omlaag.
        <br><br>
        Maak hem kleiner: het formaat halveren maakt het bestand een kwart. Gebruik
        minder frames, of laat elk frame langer staan. Ga naar 64 of 32 kleuren en zet
        dithering uit, wat bij vlak werk minder kost dan het klinkt en bij foto's heel
        veel. Past het dan nog niet, dan is het eerlijke antwoord dat wat je maakt een
        video is, en dat een MP4 daarvan misschien een tiende zo groot is."""

[[faq]]
q = "Hoe snel kan een GIF spelen?"
a = """
        Niet zo snel als het getal suggereert. Het formaat slaat de duur van elk frame
        op in honderdsten van een seconde, en browsers trekken sinds de jaren negentig
        alles onder twee honderdsten op naar een tiende seconde. Die regel is
        geschreven voor de draaiende wereldbollen van toen en is nooit meer weggehaald.
        Een duur van 0,01 s speelt dus niet op 100 frames per seconde, maar op 10.
        Daarom biedt deze tool je niets onder 0,02 s aan, en 0,05 s, oftewel 20 frames
        per seconde, is ongeveer het snelste wat de moeite waard is om te vragen."""

[[faq]]
q = "Wat verandert de paletinstelling?"
a = """
        Een GIF-frame bevat hooguit 256 kleuren, en iets moet die kiezen.
        <br><br>
        <strong>De beste kleuren voor elk frame</strong> kiest er voor elk plaatje
        apart 256, wat er het scherpst uitziet en het juiste antwoord is voor een reeks
        losstaande foto's. <strong>Eén palet voor de hele GIF</strong> bouwt één tabel
        uit alle frames tegelijk. Dat geeft een kleiner bestand, en het haalt het
        flikkeren weg dat je krijgt als het palet tussen frames van dezelfde scène heen
        en weer schiet. Dat is dus wat je pakt als de frames een reeks zijn en geen
        verzameling."""

[[faq]]
q = "Kan ik een transparante achtergrond houden?"
a = """
        Ja, als je afbeeldingen die hebben: zet &ldquo;Transparantie&rdquo; op
        &ldquo;Transparante vlakken houden&rdquo;. Eén ding om te weten voordat je dat
        doet. Transparantie in een GIF is één bit, een pixel is onzichtbaar of
        helemaal geverfd en daartussen zit niets, dus geanti-aliasde randen, zachte
        schaduwen en alles wat vervaagt krijgen in plaats daarvan een harde rand. Gaat
        je animatie op een achtergrond waarvan je de kleur kent, dan ziet hij er beter
        uit als je hem op die kleur plaatslaat."""

[[faq]]
q = "Zit er een limiet op het aantal afbeeldingen?"
a = """
        Er zit geen limiet in de tool. Het echte plafond is het geheugen van je eigen
        apparaat en je geduld met het bestand dat eruit komt: de plaatjes worden een
        voor een gelezen, dus honderd frames gaat prima, maar honderd frames op 640 px
        is ook een enorme GIF. Zie hierboven, &ldquo;Waarom is mijn GIF zo
        groot?&rdquo;"""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog en geen proefperiode aan te
        pas. Op het resultaat zit ook geen watermerk. De site draait op advertenties,
        en die betalen hem; die advertenties krijgen niets over je afbeeldingen mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij werkt
        gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er niets
        geüpload wordt, want een tool die je afbeeldingen wegstuurde om ze te laten
        verwerken zou ermee ophouden zodra je de stekker eruit trok."""

