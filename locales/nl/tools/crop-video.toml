[[privacy]]
title = "Je video's kunnen nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Er is hier geen eindpunt waar je bestand
      verzameld zou kunnen worden, en in de code staat niets wat het zou versturen
      als dat eindpunt er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 Deze tool heeft helemaal geen
      netwerkfunctie: geen adres om te plakken, niets om te downloaden, geen engine
      die bij het eerste gebruik opgehaald wordt. Elke byte die je video aanraakt,
      kwam bij het laden van de pagina van deze herkomst."""

[[privacy]]
title = "Het decoderen en coderen gebeuren allebei hier."
body = """
 De frames gaan door
      WebCodecs in je eigen browser, of door dezelfde afspeelmotor die je het
      filmpje toch al zou tonen. Het gereedgekomen bestand wordt op dit apparaat in
      het geheugen opgebouwd en meteen aan een download doorgegeven."""

[[privacy]]
title = "Het geluid wordt gekopieerd, niet beluisterd."
body = """
 Op de mp4-route gaan de
      audiomonsters over zonder ook maar gedecodeerd te worden. Niets hier maakt er
      ooit weer geluid van, en zelfs als dat wel gebeurde, was er niets wat ze
      ergens heen kon doorgeven."""

[[privacy]]
title = "Wat Google laadt, en wat het niet te zien krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google. Geen van beide krijgt iets over je video mee:
      geen bestand, geen frame, geen naam, geen grootte, geen lengte, en ook niet
      de vorm waarnaar je bijsneed. Elke regel die leest, decodeert, bijsnijdt of
      codeert, wordt vanaf deze herkomst geserveerd en staat in de repository."""

[[privacy]]
title = "Wat de doneerknop laadt, en wat hij niet te zien krijgt."
body = """

      De knop &ldquo;Buy me a coffee&rdquo; in de kop wordt getekend door een
      script van cdnjs.buymeacoffee.com en haalt zijn letters bij Google Fonts.
      Het is een link en verder niets. Hij meldt geen bezoek en krijgt niets over
      jou of je video mee."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en alles op deze
      pagina doet het nog. Eenvoudiger bewijs bestaat er niet."""

[[howto]]
title = "Kies een video."
body = """
 Sleep een mp4, mov, m4v of WebM het vak
      in, of kies er een met de hand. De browser leest hem rechtstreeks van je
      schijf, en er gaat ondertussen niets ergens heen."""

[[howto]]
title = "Sleep het kader over het stuk dat je wilt houden."
body = """
 Sleep
      binnen het kader om het te verplaatsen en aan een hoek om het formaat te
      wijzigen. Zet het eerst vast op een vorm, bijvoorbeeld 1:1 voor een vierkante
      post, 9:16 voor een telefoon of 16:9 voor een breed beeld. Of tik een exact
      pixelkader in de vier velden eronder.
      Speel de clip af, of sleep de schuif eronder, om het frame te kiezen waarop je het kader uitlijnt."""

[[howto]]
title = "Kies hoeveel kwaliteit eraan opgaat."
body = """
 Het beeld moet opnieuw
      gecodeerd worden, want een bijgesneden frame is een ander beeld. Met
      &ldquo;In balans&rdquo; blijft het dicht bij wat het bestand al aan dat gebied
      uitgaf, en met &ldquo;Beste kwaliteit&rdquo; gaat er meer aan op. Het geluid
      blijft staan, tenzij je het uitzet."""

[[howto]]
title = "Snijd hem bij en download."
body = """
 Het werk gebeurt op je eigen
      hardware, dus hoe lang het duurt hangt van je apparaat af en niet van een
      wachtrij. De gereedgekomen video gaat rechtstreeks naar de downloads van je
      browser."""

[[faq]]
q = "Wordt mijn video ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest, decodeert, snijdt en codeert hem op je eigen
        hardware. Deze tool heeft geen serverkant, en in de
        <code>Content-Security-Policy</code> van de pagina staat elk adres dat hij
        mag benaderen, waarvan er geen enkele bij deze site hoort. Controleer je het
        liever dan dat je het aanneemt, trek dan de stekker uit je internet en snijd
        er alsnog een bij."""

[[faq]]
q = "Welke videoformaten kan ik bijsnijden?"
a = """
        Mp4, m4v en mov worden rechtstreeks gelezen, wat er ook in zit: H.264, HEVC,
        AV1 of VP9, zolang je browser die codec kan decoderen. Al het andere dat je
        browser kan afspelen, en dan denk je meteen aan WebM, wordt bijgesneden door
        het af te spelen en het resultaat op te nemen. Dat werkt, maar het duurt zo
        lang als het filmpje zelf. Een bestand dat de browser niet kan lezen en ook
        niet kan afspelen, in de praktijk avi, wmv, flv en de meeste mkv's, wordt
        geweigerd met een melding die dat zegt, in plaats van halverwege te
        stranden."""

[[faq]]
q = "Zit er een limiet op de grootte of de lengte van de video?"
a = """
        In de tool zit geen limiet ingebouwd, en het bestand gaat ook niet in één
        keer het geheugen in, want er wordt een paar megabyte tegelijk doorheen
        gelopen. Het praktische plafond is de gereedgekomen video, die in het
        geheugen wordt opgebouwd voordat je hem downloadt, plus de tijd die je
        apparaat nodig heeft om hem te coderen."""

[[faq]]
q = "Blijft het geluid intact?"
a = """
        Op de mp4-route precies. De audio gaat monster voor monster over zonder ooit
        gedecodeerd te worden, dus het is byte voor byte wat er in het bestand zat.
        Op de opnameroute wordt hij van de weergave opgevangen en opnieuw gecodeerd,
        en dat kost een beetje kwaliteit. Hoe dan ook staat er een vinkje klaar om
        hem er helemaal uit te laten."""

[[faq]]
q = "Kost bijsnijden kwaliteit?"
a = """
        Het beeld wordt opnieuw gecodeerd, want een bijgesneden frame is een ander
        beeld en er bestaat geen manier om het op te slaan zonder de pixels opnieuw
        weg te schrijven. Wat de tool niet doet, is meer uitgeven dan het origineel
        aan datzelfde gebied uitgaf, omdat hercoderen daarboven het bestand alleen
        groter maakt zonder dat het er beter uitziet."""

[[faq]]
q = "Kan ik hem ook korter maken?"
a = """
        Hier niet, maar hiernaast wel. Deze tool verandert de vorm van het beeld en
        verder niets. Het filmpje dat eruit komt is precies zo lang als dat wat erin
        ging, met zijn timing en zijn geluid intact. Inkorten is een andere klus en
        dus ook een andere tool: de <a href="../video-knippen/">Videoknipper</a>
        markeert de stukken van een filmpje die het bewaren waard zijn en slaat ze
        op als één bestand, zonder ook maar één frame opnieuw te coderen."""

[[faq]]
q = "Waarom gaan de breedte en de hoogte met stappen van twee?"
a = """
        H.264, de codec in een mp4, slaat het beeld in blokken op en kan een frame
        met een oneven aantal pixels op een zijde eenvoudigweg niet beschrijven. In
        plaats van je bijsnijding stilletjes af te ronden nadat je hem hebt
        ingesteld, biedt het kader van meet af aan alleen even getallen aan."""

[[faq]]
q = "Is het gratis, en heb ik er een account voor nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        watermerk aan te pas. De site draait op advertenties, en die betalen hem. Die
        advertenties krijgen niets over je video mee."""

