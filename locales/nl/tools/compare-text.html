<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> Plak de twee teksten</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Het origineel</label>
          <span class="count" id="input-count">leeg</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Plak hier het origineel - of sleep hierboven de twee bestanden."></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">De gewijzigde versie</label>
          <span class="count" id="input-b-count">leeg</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Plak de versie om mee te vergelijken."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Een voorbeeld proberen</button>
        <button type="button" id="swap" class="ghost">Kanten wisselen</button>
        <button type="button" id="clear" class="ghost danger">Wissen</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> Kies hoe je het leest</h2>

    <div class="settings">
      <div class="field">
        <label for="view">Hoe het getoond wordt</label>
        <select id="view">
          <option value="split" selected>Naast elkaar</option>
          <option value="unified">In één kolom</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          Alleen tonen wat veranderde, met drie regels aan weerskanten
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          Witruimte negeren
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          Hoofd- en kleine letters negeren
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          Lege regels negeren
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> Lees wat er veranderde</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Nog niets.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Kopiëren</button>
        <a id="download" class="ghost as-button" hidden download>Downloaden</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
