[[privacy]]
title = "Je afbeelding kan nergens heen."
body = """
 De
      Content-Security-Policy noemt elk adres dat deze pagina mag benaderen, en
      geen daarvan is van deze site. Er is hier geen eindpunt waar je bestanden
      verzameld zouden kunnen worden, en niets in de code dat ze erheen zou
      sturen als het er was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 Er staat nergens
      in <code>src/</code> een <code>fetch</code>, een
      <code>XMLHttpRequest</code> of een <code>sendBeacon</code>. Het hele
      gereedschap is rekenwerk op de pixels van één afbeelding: een drempel,
      een wandeling langs de rand van wat het vond, en wat curven passen."""

[[privacy]]
title = "Er is geen engine om te downloaden."
body = """
 Overtrekken is
      meestal het programma van iemand anders, en op het web betekent dat een
      paar megabyte gecompileerde code die binnenkomt vóór de eerste klik. Dat
      is hier niet. Het hele ding is een paar honderd regels gewoon JavaScript
      van deze oorsprong, en daarom werkt de pagina ook zodra ze opent in plaats
      van na een wachttijd."""

[[privacy]]
title = "Wat Google laadt, en wat het niet krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google, en de doneerknop van Buy Me a Coffee. Geen
      van hen krijgt iets over je afbeelding in handen. Elke regel die haar
      leest, drempelt of overtrekt wordt van deze oorsprong geserveerd en staat
      in de repository."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de netwerkverbinding en het
      gereedschap is onveranderd, want er zat nooit een netwerkstap in. Dat is
      het simpelste bewijs van allemaal."""

[[howto]]
title = "Kies de afbeelding."
body = """
 Een logo, een sjabloon, een
      handtekening, een stempel, een gescande tekening, een silhouet. Alles met
      een duidelijke vorm erin trekt goed over; een foto van een kamer niet, en
      verderop staat daar een eerlijke waarschuwing over in plaats van een
      verrassing aan het eind. Het bestand wordt rechtstreeks van je schijf
      gelezen en er wordt ondertussen niets ergens heen gestuurd."""

[[howto]]
title = "Zeg wat de vorm is."
body = """
 Een tekening op papier scheidt op
      <strong>licht en donker</strong>, en het niveau wordt voor je uitgerekend.
      Een foto van één voorwerp niet &mdash; een donkerrode figuur op
      donkergrijze steen is donker op donker, en geen helderheid scheidt ze. Die
      wil <strong>het onderwerp</strong>, dat uit een strook langs de rand van
      de afbeelding leert wat de achtergrond is en alles houdt wat dat niet
      is."""

[[howto]]
title = "Kijk naar de rode lijn, niet naar de instellingen."
body = """
 De omtrek wordt getekend over de
      pixels waar hij uit komt, want dat is de enige plek waar de vraag beslist
      kan worden: een omtrek is goed of fout ten opzichte van die pixels en van
      niets anders. Sleep een van beide afbeeldingen om ze allebei te
      verschuiven, en rol het wieltje om ver genoeg in te zoomen om te zien wat
      de lijn echt doet."""

[[howto]]
title = "Klik weg wat er niet in hoort."
body = """
 Een spikkel, een nietje, een stempel,
      een bijschrift, een schaduw. Een klik neemt het hele vlak van die kleur
      in plaats van één pixel, dus je wijst een vorm aan; klik hem nog eens om
      hem terug te zetten. Op een ingesloten stuk achtergrond klikken vult het
      juist, en zo gaat een gat dicht dat geen gat hoort te zijn."""

[[howto]]
title = "Pas de gladheid alleen aan als het moet."
body = """
 <em>Detail</em> is hoe ver de lijn
      van de pixels mag afwijken terwijl ze vereenvoudigd wordt, en wordt per
      vorm uitgerekend tenzij je anders zegt. <em>Hoekscherpte</em> bepaalt hoe
      ver de omtrek moet draaien voordat die draai als hoek blijft staan in
      plaats van rond te worden afgeslepen. De meeste afbeeldingen hebben aan
      geen van beide iets te veranderen."""

[[howto]]
title = "Neem de svg."
body = """
 Eén bestand, één
      <code>&lt;path&gt;</code>, geen vulregel om je druk over te maken: de
      omtrekken draaien de ene kant op en de gaten de andere, en dat is wat van
      een vorm met veertig gaten één element maakt. Hij opent in Illustrator,
      Inkscape, Figma, een browser en een snijmachine."""

[[faq]]
q = "Wordt mijn afbeelding ergens geüpload?"
a = """
        Nee. Het bestand wordt door je eigen browser op je eigen hardware
        gelezen, overgetrokken door een paar honderd regels JavaScript van deze
        oorsprong, en als download teruggegeven. Dit gereedschap heeft geen
        enkele netwerkfunctie &mdash; het haalt nooit iets op en verstuurt
        nooit iets &mdash; en de <code>Content-Security-Policy</code> van de
        pagina noemt elk adres dat ze mag benaderen, waarvan geen enkel van deze
        site is."""

[[faq]]
q = "Maakt dit van mijn foto een svg?"
a = """
        Niet op een bruikbare manier, en de pagina zegt het je in plaats van
        het je na het downloaden te laten ontdekken. Overtrekken maakt van elk
        vlak met ongeveer dezelfde kleur een eigen vorm, dus een foto komt terug
        als duizenden overlappende klodders en een bestand dat vele malen
        groter is dan de jpeg, traag opent en niet op de foto lijkt. Wat goed
        overtrekt is een afbeelding met een <em>vorm</em> erin: een logo, een
        sjabloon, een handtekening, een lijntekening, een silhouet. Voor een
        foto van één voorwerp snijdt de instelling <em>het onderwerp</em> het
        uit als één silhouet, en dat is iets anders en werkelijk nuttig."""

[[faq]]
q = "Wat is het verschil tussen de twee manieren om de vorm te vinden?"
a = """
        De vraag die ze stellen. <strong>Licht en donker</strong> vraagt of
        elke pixel donkerder is dan één niveau, wat precies goed is voor inkt
        op papier en nutteloos als onderwerp en achtergrond even donker zijn.
        <strong>Het onderwerp</strong> vraagt wat de achtergrond is &mdash; het
        leert dat uit een strook langs de rand van de afbeelding, meet elke
        pixel ertegen af en houdt het grootste ding dat het niet is. Dat werkt
        op een foto van één voorwerp tegen een redelijk effen achtergrond, en
        faalt op een afbeelding die zo strak is bijgesneden dat het onderwerp
        er aan drie kanten uitloopt, want de randen waar het van leert zijn dan
        het onderwerp zelf. Je kunt in dat geval zelf de achtergrond
        aanwijzen."""

[[faq]]
q = "Waarom heeft de overgetrokken vorm gaten, of raakt hij dunne delen kwijt?"
a = """
        Omdat de afbeelding die al had zodra ze één bit per pixel werd. Zet
        <em>wat de overtrekker kreeg</em> aan om het te zien: onder ongeveer
        twaalf pixels is het oog van een letter al dichtgelopen en zijn de
        stokken al versmolten, en geen overtrekken haalt een gat terug dat er
        niet is. De oplossingen zitten eerder in de keten &mdash; verschuif de
        drempel, of begin met een grotere scan. In de stand <em>het
        onderwerp</em> dicht <em>gaten sluiten tot</em> kleine gaten en sluit
        <em>helemaal opvullen</em> elk gat dat de achtergrond vanaf de rand van
        de afbeelding niet kan bereiken."""

[[faq]]
q = "Kan ik de delen die het fout had verbeteren?"
a = """
        Ja, en daar is de derde stap grotendeels voor. Klik op alles wat niet in
        de tekening hoort en het verdwijnt; klik het nog eens en het komt
        terug. Een klik neemt het hele vlak van die kleur, dus één klik
        verwijdert een hele spikkel of een hele stempel in plaats van een pixel.
        Op een ingesloten stuk achtergrond klikken vult het. Verbeteringen
        worden los van de drempel bewaard, dus de schuif daarna verplaatsen
        gooit ze niet weg."""

[[faq]]
q = "Hoe groot wordt de svg?"
a = """
        Voor een vorm kleiner dan de afbeelding: een overgetrokken silhouet is
        meestal één tot vijf kilobyte, en een logo een paar meer. De pagina
        zegt het precies, naast de download. Voor een foto wordt hij enorm, wat
        het duidelijkste teken is dat dit het verkeerde gereedschap is voor dat
        bestand &mdash; en voorbij ongeveer duizend losse vormen stopt de
        pagina met tekenen en zegt dat."""

[[faq]]
q = "Trekt het in kleur over?"
a = """
        Nee. Dit maakt één vorm in één kleur, en dat is het geval dat eruit komt
        als een tekening in plaats van als een slechte fotokopie. In kleur
        overtrekken betekent terugbrengen tot een paar kleuren en elk daarvan
        als eigen laag overtrekken, en het resultaat stelt de meeste mensen die
        erom vragen teleur. Heb je kleur nodig, trek de vorm dan hier over en
        vul hem in je tekenprogramma."""

[[faq]]
q = "Wat kan ik daarna met de svg?"
a = """
        Hem naar elk formaat schalen zonder dat hij zacht wordt, hem met één
        attribuut een andere kleur geven, animeren, afdrukken, of naar een
        snijmachine of een laser sturen. Het is één <code>&lt;path&gt;</code>
        zonder vulregel om fout te zetten, dus Illustrator, Inkscape, Figma,
        een browser en de meeste CNC-software lezen hem allemaal hetzelfde."""

[[faq]]
q = "Zit er een grens aan de grootte van de afbeelding?"
a = """
        Die van je machine, niet die van ons. Een A4'tje gescand op
        300&nbsp;dpi &mdash; zo'n negen megapixel &mdash; trekt over in een
        fractie van een seconde. Grotere afbeeldingen werken ook; ze duren
        alleen langer, en het werk gebeurt op je eigen processor in plaats van
        in een wachtrij ergens."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er is geen account, geen inloggen, geen proefperiode
        en geen watermerk. Er zit ook geen grens aan het aantal of de grootte
        van de bestanden, want er is geen server die ervoor betaalt &mdash; het
        werk gebeurt op je eigen machine. De site draagt advertenties, en die
        betalen ervoor; de advertenties krijgen niets over je bestanden."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek dan de internetverbinding, en ze
        blijft werken. Dat is ook de simpelste manier om te bewijzen dat er
        niets wordt geüpload: een gereedschap dat je afbeelding wegstuurde om
        overgetrokken te worden zou stilvallen zodra je de stekker eruit
        trok."""

