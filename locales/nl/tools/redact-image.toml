body = """
 Een zwart
      vlak laat helemaal niets over. Pixelen en blurren vervangen de pixels door
      gemiddelden van zichzelf, en dat is genoeg voor een gezicht op de achtergrond
      en niet genoeg voor iets dat als tekst te lezen is."""

[[howto]]
title = "Klik op &lsquo;Onleesbaar maken en opslaan&rsquo; en controleer het bestand."
body = """
 De
      afbeelding die daarna verschijnt is het klaargemaakte bestand, opnieuw
      gedecodeerd. Open het in een editor en zoek naar een laag, of probeer de
      afgedekte tekst te selecteren: er is één platte afbeelding, en wat je hebt
      afgedekt was overschreven voordat hij werd geschreven."""

[[faq]]
q = "Wordt mijn afbeelding ergens naartoe geüpload?"
a = """
        Nee. Je eigen browser decodeert het bestand op je eigen hardware, maakt het
        onleesbaar en codeert het opnieuw. Dit gereedschap heeft geen enkele
        netwerkfunctie, het haalt nooit iets op en stuurt nooit iets, en in de
        <code>Content-Security-Policy</code> van de pagina staat elk adres dat hij
        mag benaderen, waarvan er geen enkele van ons is. Laad de pagina één keer,
        trek de internetverbinding eruit en hij werkt gewoon door."""

[[faq]]
q = "Is het afgedekte deel echt weg uit het bestand?"
a = """
        Ja, en daarom bestaat dit gereedschap. De afbeelding wordt gedecodeerd naar
        een buffer met pixels; de vakjes overschrijven de pixels die erbinnen
        liggen; daarna wordt de buffer als een nieuw bestand gecodeerd. De
        oorspronkelijke waarden zijn uit het geheugen verdwenen voordat de encoder
        iets krijgt, dus er is geen laag om te verbergen, geen aantekening om te
        verwijderen en geen geschiedenis om ongedaan te maken. Je kunt het
        controleren zoals je iemand anders zijn bewering zou controleren: open het
        resultaat in een beeldbewerker en zoek naar een tweede laag, of probeer de
        tekst die je hebt afgedekt te selecteren."""

[[faq]]
q = "Kan een gepixeld of geblurd gebied worden hersteld?"
a = """
        Soms, en dit is het enige dat je echt moet lezen voordat je kiest. Een
        zwart vlak vervangt alles eronder door één kleur, dus er blijft niets over:
        geen rand, geen gemiddelde, niet eens het aantal tekens. Pixelen vervangt
        elk blok door het gemiddelde van dat blok, en een raster van gemiddelden is
        nog altijd een meting van wat eronder lag: voor tekst in een gewoon
        lettertype op een voorspelbare grootte is dat in gepubliceerd onderzoek
        genoeg geweest om het origineel te reconstrueren, door kandidaat-teksten te
        renderen en hun gemiddelden te vergelijken. Blurren is een convolutie, en
        convoluties zijn in principe omkeerbaar. Pixel dus gerust een gezicht op de
        achtergrond, en maak alles wat als tekst te lezen is zwart."""

[[faq]]
q = "Waarom is een zwarte rechthoek uit een tekstprogramma niet hetzelfde?"
a = """
        Omdat de meeste programma's de rechthoek naast de afbeelding opslaan en niet
        erin. Een vorm die je tekent in een pdf-lezer, een presentatie, een
        tekstverwerker of een beeldbewerker met lagen is een object met een positie
        dat bovenop de pagina ligt, en wie het verplaatst, verwijdert of het bestand
        in een ander programma opent krijgt precies terug wat eronder zat. Kranten,
        rechtbanken en ministeries hebben op die manier documenten gepubliceerd.
        Hier wordt de rechthoek helemaal niet opgeslagen: het zijn pixelwaarden die
        over de vorige heen geschreven zijn."""

[[faq]]
q = "Verdwijnen de EXIF- en GPS-gegevens ook?"
a = """
        Ja, als bijeffect. Opslaan betekent hier dat een canvas vol pixels wordt
        gecodeerd, en een canvas draagt geen tags, dus de locatie, het cameramodel,
        de tijdstempels en de ingebedde miniatuur worden simpelweg niet in het
        nieuwe bestand geschreven. Die miniatuur doet er hier toe: het is een kleine
        tweede kopie van de afbeelding, hij wordt niet altijd opnieuw aangemaakt als
        een foto bewerkt wordt, en een onleesbaar gemaakte foto die met een
        ongeschonden miniatuur op reis gaat doet al het werk teniet. Wil je de
        metadata kwijt zonder dat de afbeelding opnieuw gecodeerd wordt, dan
        herschrijft de <a href="../exif-gegevens-verwijderen/">EXIF-lezer &amp; -wisser</a> in
        plaats daarvan de container."""

[[faq]]
q = "Welke formaten kan het lezen en schrijven?"
a = """
        Het leest alles wat je browser kan decoderen, in de praktijk dus JPEG, PNG,
        WebP, GIF, BMP en op de meeste huidige browsers ook AVIF. Het schrijft JPEG,
        PNG en WebP, want dat zijn de encoders die browsers meebrengen. Op
        &lsquo;automatisch&rsquo; komt een JPEG terug als JPEG en al het andere als
        PNG, waardoor een foto een fotoformaat houdt en de tekst die op een
        screenshot wél zichtbaar blijft scherp blijft. Voor het onleesbaar maken
        maakt de keuze niets uit: de pixels zijn al weg voordat de encoder ze
        ziet."""

[[faq]]
q = "Kan het ook zonder muis?"
a = """
        Ja. &lsquo;Vakje in het midden toevoegen&rsquo; zet er een op de afbeelding,
        met Tab spring je tussen de vakjes, de pijltjestoetsen verplaatsen het vakje
        met focus en Alt met de pijltjes verandert het formaat; met Shift is elke
        stap tien pixels en met Delete verdwijnt het. Bij elk vakje hoort bovendien
        een regel onder de afbeelding met het formaat, de positie, wat het doet en
        een knop om het te verwijderen, dus het hele gereedschap is met het
        toetsenbord te bedienen en met een schermlezer te lezen."""

[[faq]]
q = "Werkt het op een telefoon?"
a = """
        Ja. Tekenen, verplaatsen en formaat wijzigen gaan via pointergebeurtenissen
        en niet via muisgebeurtenissen, dus een vinger werkt net zo, en de grepen
        worden op een aanraakscherm groter getekend. De afbeelding op het scherm
        wordt tijdens het werken op schermformaat opnieuw getekend; het bestand zelf
        wordt altijd op de volle resolutie onleesbaar gemaakt zodra je op de knop
        drukt."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er is geen account, geen inlog, geen proefperiode en geen
        watermerk. Er is ook geen limiet aan de grootte van de afbeelding, want er
        is geen server die ervoor betaalt: het werk gebeurt op je eigen apparaat. De
        site draait advertenties, en die betalen hem; de advertenties krijgen niets
        over je afbeeldingen te zien."""

