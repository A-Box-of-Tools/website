[[privacy]]
title = "Je afbeeldingen kunnen nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan is van ons. Er is hier geen eindpunt waar je bestanden terecht
      zouden kunnen komen, en in de code staat ook niets dat ze erheen zou sturen
      als dat er wel was."""

[[privacy]]
title = "De afgedekte pixels verdwijnen hier, niet onderweg naar buiten."
body = """
 De afbeelding
      wordt gedecodeerd naar een buffer met pixels, de vakjes worden in die buffer
      geschreven en de buffer gaat naar de encoder. Er bestaat op deze pagina geen
      versie van de afbeelding met de vakjes als aparte laag, want die versie
      wordt nooit gemaakt. Zie <code>src/redact.js</code>."""

[[privacy]]
title = "Hier haalt niets iets op."
body = """
 Er is geen
      <code>fetch</code>, geen <code>XMLHttpRequest</code> en geen
      <code>sendBeacon</code> ergens in <code>src/</code>. Het werk is
      <code>getImageData</code>, drie lussen over de bytes en
      <code>canvas.toBlob</code>, en dat zit allemaal al in je browser."""

[[privacy]]
title = "De vakjes worden nergens gemeld."
body = """
 Waar je hebt getekend,
      hoeveel het er zijn, hoe groot ze zijn en welke soort je koos, blijft in het
      geheugen van deze pagina tot je hem sluit. In deze repository staat geen
      enkele analytics-gebeurtenis die daar iets van meeneemt, en de ene vraag die
      de site na een download stelt stuurt een duim omhoog of omlaag en de naam
      van het gereedschap, verder niets."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en het gereedschap is
      hetzelfde, want er heeft nooit een netwerkstap in gezeten. Dat is het
      eenvoudigste bewijs van allemaal, en het bewijs dat je wilt draaien voordat
      je een paspoort onleesbaar maakt."""

