[[faq]]
q = "Wordt mijn foto ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest het bestand, ontleedt het en schrijft het
        opnieuw, op je eigen hardware. Deze tool heeft geen enkele netwerkfunctie en
        haalt dus nooit iets op en verstuurt nooit iets. In de
        <code>Content-Security-Policy</code> van de pagina staat bovendien elk adres
        dat hij mag benaderen, en geen daarvan hoort bij deze site."""

[[faq]]
q = "Wat is EXIF, en wat zit er nog meer in een foto verstopt?"
a = """
        EXIF is een blok tags dat een camera naast het plaatje schrijft: het merk en
        model, de belichtingsinstellingen, de datum en tijd op de seconde nauwkeurig,
        vaak een gps-positie en soms een serienummer. Foto's dragen vaak nog meer
        mee. Denk aan een XMP-pakket met XML uit een fotobewerker, een IPTC-blok met
        bijschrift- en naamsvermeldingsvelden, een kleurprofiel, een kleine tweede
        kopie van het beeld als miniatuur, en een makernotitie met ongedocumenteerde
        fabrikantgegevens. Deze tool zet het allemaal op een rij."""

[[faq]]
q = "Gaat er beeldkwaliteit verloren als de metagegevens eruit gaan?"
a = """
        Nee, en dat is meteen de belangrijkste reden om zo'n tool te gebruiken in
        plaats van de foto opnieuw op te slaan. Metagegevens zitten in de container
        om het gecomprimeerde plaatje heen, niet erin. Ze verwijderen komt neer op
        items uit een lijst schrappen en die lijst weer wegschrijven. De
        gecomprimeerde beeldgegevens gaan byte voor byte mee, waardoor het resultaat
        naar precies dezelfde pixels decodeert. Er wordt niets gedecodeerd en niets
        opnieuw gecomprimeerd."""

[[faq]]
q = "Welke bestandsformaten kan hij aan?"
a = """
        JPEG, PNG en WebP. HEIC en AVIF worden wel herkend maar niet herschreven,
        want het zijn doosformaten die uit geneste atomen bestaan en die een andere
        parser nodig hebben. De tool zegt dat dan ook, in plaats van een kapot
        bestand te maken. Een kale TIFF gaat evenmin, omdat in een TIFF dezelfde
        offsets zowel de metagegevens als de pixels aanwijzen."""

[[faq]]
q = "Staat mijn foto gedraaid nadat de metagegevens eruit zijn?"
a = """
        Dat kan, en daar is een instelling voor. Telefoons leggen een foto meestal
        vast zoals de sensor hem zag en zetten er een Orientation-tag bij die zegt
        hoe hij gedraaid moet worden. Haal je die tag eruit, dan tonen sommige
        kijkers de foto op zijn kant. De optie &ldquo;hou de oriëntatietag&rdquo;
        staat daarom standaard aan en schrijft een piepklein EXIF-blok terug met
        niets anders dan die ene tag erin, en alleen wanneer de foto hem echt nodig
        had. Zet hem uit als je liever hebt dat het bestand helemaal geen EXIF
        draagt."""

[[faq]]
q = "Haalt hij de gps-locatie eruit?"
a = """
        Ja. Alles verwijderen haalt de hele gps-directory weg, en je kunt de locatie
        ook los weghalen en de rest laten staan. De positie komt eerst in decimale
        graden in beeld, omdat je aan &ldquo;51 graden, 30 minuten, 26
        seconden&rdquo; niet ziet dat een foto het gebouw noemt waarin hij genomen
        is."""

[[faq]]
q = "Kan ik een tag wijzigen in plaats van hem te verwijderen?"
a = """
        Ja. Teksttags, datums, de ISO, de oriëntatie en de resolutie zijn allemaal te
        bewerken, en een paar veelvoorkomende tags kun je toevoegen aan een foto die
        ze niet heeft. Er zit wel één kanttekening aan. Het bestand schrijven bouwt
        het EXIF-blok opnieuw op, en een makernotitie bevat offsets naar het
        oorspronkelijke blok, waardoor een herbouwde makernotitie daarna misschien
        niet meer leesbaar is voor de eigen software van de fabrikant. Maakt dat voor
        jou uit, verwijder hem dan of laat het bestand onbewerkt."""

[[faq]]
q = "Is het gratis, en heb ik er een account voor nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog en geen proefperiode aan
        te pas. De site draait op advertenties, en die betalen hem. Die advertenties
        krijgen niets over je foto's mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je foto's wegstuurde om ze te laten
        verwerken zou ermee ophouden zodra je de stekker eruit trok."""

