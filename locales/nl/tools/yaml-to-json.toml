title = "YAML-naar-JSON-omzetter &mdash; beide kanten op, zonder upload"
description = "Zet YAML om naar JSON en JSON naar YAML in je browser. Het leest YAML 1.2, dus yes en no blijven tekenreeksen, en het zegt precies wat elke richting kost. Er wordt niets geüpload, dus een configuratiebestand blijft op je eigen apparaat."
og_title = "YAML omzetten zonder het in een server te plakken"
og_description = "Een YAML- en JSON-omzetter die op je eigen apparaat draait. Sleutels houden hun volgorde, getallen hun cijfers, en wat je plakt gaat nergens heen."
og_image_alt = "YAML-naar-JSON-omzetter - beide richtingen, zonder upload"

pledge = """
    Omzetten is rekenen aan een tekenreeks, hier, in deze pagina. De twee
    parsers zijn met de hand geschreven en staan in <code>src/</code> &mdash;
    <code>shared/parse-yaml.js</code> en <code>shared/parse-json.js</code> &mdash; en meer is er niet. Dit
    gereedschap heeft überhaupt geen netwerkfunctie &mdash; niets op te halen,
    niets te versturen &mdash; en dat weegt hier zwaarder dan bijna overal
    anders op deze site: een YAML-bestand is meestal een deployconfiguratie, en
    een deployconfiguratie zit meestal vol hostnamen, bucketnamen en geheimen."""

live_hint = """
      Je hoeft ons niet op ons woord te geloven: open de DevTools, kijk naar het
      netwerktabblad en zet iets om. Geen enkele aanvraag draagt een teken van
      wat je hebt geplakt. Of trek de stekker uit het internet en zet het toch
      om."""

read_first = """
, <code>src/shared/parse-yaml.js</code> voor de lezer die een
      anker weigert in plaats van te raden wat het betekende, en
      <code>src/convert.js</code> voor waarom een omzetting één parser en één
      printer is, met niets ertussen dat beide formaten tegelijk kent."""

howto_heading = "Zo zet je YAML om naar JSON zonder het te uploaden"

card = """
            Maak van YAML JSON of van JSON YAML, en laat je vertellen wat de reis
