[[privacy]]
title = "Je video kan nergens heen."
body = """
 In het
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan is van ons. Er is hier geen eindpunt waar een bestand
      opgehaald zou kunnen worden, en er staat ook niets in de code dat het
      erheen zou sturen als dat er wel was."""

[[privacy]]
title = "Het beeld wordt helemaal niet gedecodeerd."
body = """
 Er wordt alleen om
      het geluidsspoor gevraagd. De beeldjes worden niet gelezen, niet
      gedecodeerd, niet getekend en niet bekeken, want op deze pagina staat geen
      code die dat zou kunnen, en in het bestand dat eruit komt zit geluid en
      verder niets. Dat is geen belofte over terughoudendheid:
      <code>decodeAudioData</code> krijgt de bytes en geeft geluid terug, en in
      <code>src/</code> staat geen videodecoder die zou kunnen draaien."""

[[privacy]]
title = "De decoder is degene die je browser al heeft."
body = """
 Er wordt hier
      niets meegeleverd om jouw formaat te lezen, en er wordt ook niets buiten
      deze pagina om gevraagd om het te lezen. Welke bestanden werken is daarom
      precies wat je browser al afspeelt."""

[[privacy]]
title = "De samples worden opgeschreven, niet opnieuw gecodeerd."
body = """

      Een WAV zijn de samples die de decoder teruggaf met een kop ervoor. Er zit
      geen encoder in de lus die beslissingen neemt over jouw opname, en er is
      niets dat je een upload zou kunnen noemen waarop dat zou gebeuren."""

[[privacy]]
title = "Wat Google laadt, en wat het niet krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google en de donatieknop van Buy Me a Coffee. Geen
      van hen krijgt iets over je video: geen bestand, geen sample, geen naam,
      grootte of duur."""

[[privacy]]
title = "Het werkt offline."
body = """
 Trek de netwerkstekker eruit en het
      gereedschap is onveranderd, want er zat nooit een netwerkstap in. Dat is
      het eenvoudigste bewijs dat er is."""

[[howto]]
title = "Sleep de video erin."
body = """
 Een MP4, MOV, M4V of WebM, van een
      telefoon, een camera, een schermopnemer of een download. Je eigen browser
      leest hem, dus er is geen uploadstap om over te slaan."""

[[howto]]
title = "Lees wat er gevonden is."
body = """
 De duur, het aantal kanalen en de
      samplefrequentie, rechtstreeks uit het bestand. Als het bestand zijn
      frequentie niet opgaf zegt de pagina dat, in plaats van stilletjes opnieuw
      te bemonsteren en te beweren dat er niets is aangeraakt."""

[[howto]]
title = "Kies mono als het kleiner moet."
body = """
 De kanalen met rust laten
      houdt de opname precies zoals hij was. Naar mono mixen halveert het bestand
      en is wat een transcriptie of een spraakopname wil; het middelt de kanalen
      in plaats van er een weg te gooien."""

[[howto]]
title = "Luister ernaar voordat je het bewaart."
body = """
 De speler speelt het
      bestand dat zo dadelijk gedownload wordt, niet de video, dus als het goed
      klinkt is de download goed."""

[[howto]]
title = "Neem het mee, of geef het door."
body = """
 Download de WAV, of stuur
      hem meteen door naar de knipper of de editor zonder hem eerst te
      bewaren."""

[[faq]]
q = "Wordt mijn video ergens geüpload?"
a = """
        Nee. Het decoderen en het schrijven gebeuren allebei in je eigen browser,
        op je eigen hardware. Dit gereedschap heeft überhaupt geen netwerkfunctie
        &mdash; het haalt nooit iets op en stuurt nooit iets weg &mdash; en in
        het <code>Content-Security-Policy</code> van de pagina staat elk adres
        dat ze mag benaderen, en geen daarvan is van ons. Als je liever
        controleert dan gelooft: trek de stekker uit het internet en haal het
        geluid er toch uit."""

[[faq]]
q = "Kan ik er een MP3 uit krijgen?"
a = """
        Nee, en het doet ook niet alsof. Geen enkele browser levert een
        MP3-encoder mee, en de enige weg naar een encoder is je video naar een
        server sturen die er een heeft, en dat is precies het enige dat deze site
        bestaat om niet te doen. Wat je krijgt is een WAV: de samples met een kop
        van vierenveertig bytes ervoor, waar helemaal geen encoder bij nodig is
        en wat geen kwaliteit kan kosten. Hij is groter, ongeveer tien megabyte
        per minuut in stereo, en elke speler, telefoon en editor opent er een.
        Wat een MP3 wil, kan er in een seconde een van maken."""

[[faq]]
q = "Wordt er ooit naar het beeld gekeken?"
a = """
        Nee, en er is hier niets dat ernaar zou kunnen kijken. De decoder van de
        browser krijgt het bestand en wordt om het geluidsspoor gevraagd; het
        videospoor wordt nooit gedecodeerd, nooit getekend en bereikt de code van
        deze pagina niet eens. In <code>src/</code> staat geen videodecoder die
        zou kunnen draaien. In het bestand dat eruit komt zit geluid en verder
        niets."""

[[faq]]
q = "Er staat dat er geen geluid gelezen kon worden, maar de video speelt prima."
a = """
        Dan heeft de video vrijwel zeker helemaal geen geluidsspoor. Een
        schermopname zonder gekozen microfoon is stil, en een clip die een editor
        met gedempt geluid heeft geëxporteerd ook: allebei spelen ze perfect,
        omdat er beeld te tonen is. Het bericht noemt dit als eerste omdat het de
        waarschijnlijkste van de twee oorzaken is; de andere is een formaat dat
        deze browser niet leest. Open het bestand in een speler en zoek een
        volumeknop die niets doet, want dat is de snelste manier om te zien welke
        van de twee je hebt."""

[[faq]]
q = "Welke videoformaten kan ik openen?"
a = """
        Wat je browser decodeert, wat in de praktijk MP4, M4V, MOV en WebM
        betekent, en daarnaast elk audioformaat. Wat erbuiten valt is hetzelfde
        korte lijstje als overal elders op deze site: AVI, WMV en de meeste
        MKV's. Een bestand dat je browser niet leest wordt geweigerd met een
        bericht dat dat zegt, in plaats van halverwege te stranden."""

[[faq]]
q = "Gaat er kwaliteit verloren?"
a = """
        Niets bovenop wat de video zijn eigen audio al had aangedaan toen hij
        gemaakt werd. De samples die de decoder teruggeeft worden opgeschreven
        zoals ze zijn, dus er is geen tweede codering en daarom ook geen tweede
        generatie verlies. Het enige om te weten is de samplefrequentie: die van
        het bestand zelf wordt eerst uit de kop gelezen en het decoderen gebeurt
        op die frequentie, waardoor je opname niet stilletjes opnieuw bemonsterd
        wordt. Geeft een bestand er geen op, dan zegt de pagina welke frequentie
        ze heeft aangenomen."""

[[faq]]
q = "Waarom is de WAV zoveel groter dan de video?"
a = """
        Omdat een WAV niet gecomprimeerd is en het geluidsspoor van de video dat
        wel was. Geluid op cd-kwaliteit is ongeveer tien megabyte per minuut in
        stereo, wat er ook op staat; het AAC-spoor in een MP4 misschien een
        tiende daarvan. Naar mono mixen halveert het. Dat is de prijs van niet
        opnieuw coderen, en die betaal je één keer, want waar je het bestand
        daarna ook in opent kan het comprimeren."""

[[faq]]
q = "Hoe lang mag de video zijn?"
a = """
        Er is hier geen limiet ingesteld, want er is geen server die ervoor
        betaalt. Het echte plafond is het geheugen van je eigen apparaat: het
        bestand wordt ingelezen en het hele geluidsspoor blijft als samples in
        het geheugen staan, dus bij een heel lange opname op een klein apparaat
        kan de ruimte opraken. Een paar uur video gaat doorgaans prima, en een
        telefoon houdt het korter vol dan een laptop."""

[[faq]]
q = "Kan ik het inkorten of harder maken?"
a = """
        Ja, maar niet hier, want deze pagina doet één klus. Zodra er een
        resultaat is, staat er naast de download een rij links die het meteen
        doorzet naar de <a href="../audio-knippen/">audioknipper</a> of de
        <a href="../audio-bewerken/">audio-editor</a>, zonder het eerst te bewaren en
        zonder dat een van beide het alsnog uploadt."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er is geen account, geen inloggen, geen proefperiode en
        geen limiet op hoeveel video's je opent. De site draait op advertenties,
        want die betalen hem; de advertenties krijgen niets over je bestand."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, trek daarna de stekker uit het internet en
        ze blijft werken. Dat is meteen de eenvoudigste manier om te bewijzen dat
        er niets geüpload wordt: gereedschap dat je video wegstuurt om verwerkt
        te worden zou stoppen op het moment dat je de stekker eruit trekt."""

