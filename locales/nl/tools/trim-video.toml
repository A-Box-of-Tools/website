title = "Video knippen online &mdash; hou alleen wat je wilt, zonder uploaden"
description = "Bekijk een video, markeer tijdens het afspelen elk stuk dat het bewaren waard is en sla die stukken op als één bestand. Draait in je browser, uploadt niets, codeert niets opnieuw en werkt offline."
og_title = "Videoknipper &mdash; hou alleen de stukken die je wilt, zonder iets te uploaden"
