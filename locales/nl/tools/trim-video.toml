[[privacy]]
title = "Je video's kunnen nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Er is hier geen eindpunt waar je bestand
      verzameld zou kunnen worden, en in de code staat niets wat het zou versturen
      als dat eindpunt er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 Deze tool heeft helemaal geen
      netwerkfunctie: geen adres om te plakken, niets om te downloaden, geen
      engine die bij het eerste gebruik opgehaald wordt. Elke byte die je video
      aanraakt, kwam bij het laden van de pagina van deze herkomst."""

[[privacy]]
title = "Op de gewone route wordt er niet eens iets gedecodeerd."
body = """

      Knippen verandert niets aan hoe een frame eruitziet, dus de gecodeerde frames
      van de stukken die je markeerde gaan precies zoals ze gevonden werden naar het
      nieuwe bestand. Elk frame wordt opgeslagen als een plakje van het bestand op
      je schijf, oftewel een aantekening welke bytes het zijn en niet de bytes zelf,
      en je browser leest ze pas voor het eerst terwijl hij de download schrijft.
      Niets hier maakt ooit weer een beeld van je video."""

[[privacy]]
title = "Het markeringenbestand wordt in de pagina gemaakt."
body = """
 Sla je je markeringen op, dan wordt
      er een tekstbestand geschreven uit de getallen die al op het scherm staan, en
      dat gaat rechtstreeks naar je downloads. Laad je er een, dan wordt hij hier
      ingelezen. Geen van beide komt bij een netwerk in de buurt, en geen van beide
      draagt iets anders dan tijden."""

[[privacy]]
title = "Het geluid wordt gekopieerd, niet beluisterd."
body = """
 Op beide mp4-routes gaan de
      audiomonsters over zonder ook maar gedecodeerd te worden. Niets hier maakt er
      ooit weer geluid van, en zelfs als dat wel gebeurde, was er niets wat ze
      ergens heen kon doorgeven."""

[[privacy]]
title = "Waar frames wel gedecodeerd worden, gebeurt dat hier."
body = """
 Het exacte
      knippen, en de voorvertoning van een bestand dat deze browser niet
      afspeelt, gaan door WebCodecs op je eigen apparaat. Dat is dezelfde decoder
      die je de video toch al zou tonen, draaiend op dezelfde plek."""

[[privacy]]
title = "Wat Google laadt, en wat het niet te zien krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google. Geen van beide krijgt iets over je video mee:
      geen bestand, geen frame, geen naam, geen grootte, geen lengte, en niet
      waar je knipte. Elke regel die leest, knipt en schrijft, wordt vanaf deze
      herkomst geserveerd en staat in de repository."""

[[privacy]]
title = "Wat de doneerknop laadt, en wat hij niet te zien krijgt."
body = """

      De knop &ldquo;Buy me a coffee&rdquo; in de kop wordt getekend door een
      script van cdnjs.buymeacoffee.com en haalt zijn letters bij Google Fonts.
      Het is een link en verder niets. Hij meldt geen bezoek en krijgt niets over
      jou of je video mee."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en alles op deze
      pagina doet het nog. Eenvoudiger bewijs bestaat er niet."""

[[howto]]
title = "Kies een video."
body = """
 Sleep een mp4, mov, m4v of WebM het vak
      in. De browser leest hem rechtstreeks van je schijf, en er gaat ondertussen
      niets ergens heen. Sleep er meerdere naar binnen, dan worden ze aan elkaar
      gezet in de volgorde waarin je ze erin zette."""

[[howto]]
title = "Speel hem af en markeer de stukken die je wilt."
body = """
 Druk op <kbd>I</kbd> waar een stuk moet
      beginnen en op <kbd>O</kbd> waar het moet eindigen, zo vaak als je wilt. Elk
      paar wordt een regel in de tabel eronder en een band op de tijdlijn. Met
      <kbd>U</kbd> neem je de laatste terug, met de <kbd>spatiebalk</kbd> speel je
      af en pauzeer je, en met de pijltjes spring je vijf seconden tegelijk. Krijg
      je het moment lastig te pakken, zet het afspelen dan langzamer."""

[[howto]]
title = "Werk de markeringen bij."
body = """
 Elke regel kun je apart afspelen,
      opnieuw timen door er een exacte tijd in te tikken, in de volgorde omhoog of
      omlaag schuiven, of verwijderen. De twee uiteinden van het geselecteerde stuk
      sleep je desgewenst over de tijdlijn. Het totaal bovenaan is wat de
      gereedgekomen video gaat duren."""

[[howto]]
title = "Hou ze, of knip ze eruit."
body = """
 Houden is de gebruikelijke kant op, en
      dan bestaat de gereedgekomen video uit de stukken die je markeerde, op
      volgorde aan elkaar gezet. Ze eruit knippen is die andere klus die mensen
      willen en zelden vinden. Markeer de reclames, de stiltes of de valse starts,
      en wat overblijft wordt zonder die aan elkaar gezet."""

[[howto]]
title = "Knip hem, en download."
body = """
 Met &ldquo;Hou elke byte&rdquo; gaan de
      frames onaangeroerd over. Dat gaat snel en het kan geen kwaliteit kosten,
      alleen begint elk stuk dan bij het keyframe vóór je markering. &ldquo;Knip
      precies hier&rdquo; decodeert het beeld en schrijft het opnieuw, zodat elk
      stuk begint op het frame dat je koos. Voordat je op de knop drukt, zegt de
      pagina welke van de twee je krijgt en wat dat kost."""

[[faq]]
q = "Wordt mijn video ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest, markeert, knipt en schrijft hem op je eigen
        hardware. Deze tool heeft geen serverkant, en in de
        <code>Content-Security-Policy</code> van de pagina staat elk adres dat hij
        mag benaderen, waarvan er geen enkele bij deze site hoort. Controleer je het
        liever dan dat je het aanneemt, trek dan de stekker uit je internet en knip
        er alsnog een."""

[[faq]]
q = "Kan ik meerdere stukken uit dezelfde video houden?"
a = """
        Daar is dit juist voor. Druk zo vaak je wilt op <kbd>I</kbd> en <kbd>O</kbd>
        terwijl hij speelt. Elk paar wordt een regel, en de gereedgekomen video is
        elke regel op volgorde aan elkaar gezet, met al het andere weg. De meeste
        online knippers geven je één paar grepen en vragen welk enkel stuk je wilt
        houden. Dat is prima om een filmpje aan de voor- en achterkant bij te
        snijden, en volstrekt waardeloos als je een uur beeldmateriaal één keer wilt
        doorkijken om de zes momenten te houden die de moeite waard zijn."""

[[faq]]
q = "Kost knippen kwaliteit?"
a = """
        Op de gewone route niet, en zeker niet op de manier die ertoe doet. Knippen
        verandert niets aan hoe een frame eruitziet, dus de frames gaan precies zoals
        ze waren naar het nieuwe bestand: dezelfde bytes, dezelfde
        encoderinstellingen, alles hetzelfde. De enige route hier die iets opnieuw
        codeert is het exacte knippen, en dat staat gewoon op de knop."""

[[faq]]
q = "Waarom begint een stuk eerder dan waar ik het markeerde?"
a = """
        Door de manier waarop video opgeslagen wordt, en alleen bij spelers die
        een standaardonderdeel van het formaat negeren. De meeste frames worden
        bewaard als een beschrijving van hoe ze van hun buren verschillen, dus ze
        zijn zonder die buren niet te decoderen. Alleen een keyframe staat op
        zichzelf, en keyframes liggen meestal een tot tien seconden uit elkaar. Een
        knip die frames kopieert moet dus de reeks vanaf het keyframe vóór je
        markering meenemen, en in het bestand staat dan <em>begin met afspelen bij
        jouw markering</em>, waar elke gangbare speler zich aan houdt. Moet het in
        elke speler exact zijn, kies dan &ldquo;Knip precies hier&rdquo;, want die
        codeert opnieuw. Voordat je exporteert, zegt de pagina in welk geval je zit
        en om hoeveel het gaat."""

[[faq]]
q = "Kan ik in plaats daarvan de reclames eruit knippen?"
a = """
        Ja. Markeer ze en kies daarna &ldquo;Knip ze eruit&rdquo;, dan wordt juist
        alles wat je <em>niet</em> gemarkeerd hebt op volgorde aan elkaar gezet.
        Dezelfde lijst markeringen beantwoordt allebei de vragen, dus je kunt ertussen
        wisselen en de lengte zien veranderen zonder ook maar iets twee keer te
        markeren."""

[[faq]]
q = "Kan ik mijn markeringen opslaan en er later op terugkomen?"
a = """
        Ja. &ldquo;Markeringen opslaan&rdquo; schrijft een gewoon tekstbestand met
        één regel per stuk, waarin een begin en een eind door een komma gescheiden
        worden, en &ldquo;Markeringen laden&rdquo; leest er een terug. Er worden twee
        formaten aangeboden, gewone seconden en
        <code>HH:MM:SS.mmm</code>, en allebei houden zich aan de indeling die
        andere tools die zo werken al gebruiken, dus een bestand dat hier
        geschreven is kun je aan zo'n tool geven en een bestand dat daar
        geschreven is kun je op deze pagina slepen. Markeren is nauwkeurig werk en
        niemand hoort het twee keer te doen."""

[[faq]]
q = "Welke videoformaten kan ik knippen?"
a = """
        Mp4, m4v en mov worden rechtstreeks gelezen, wat er ook in zit: H.264,
        HEVC, AV1 of VP9. Frames kopiëren houdt niet in dat ze gedecodeerd worden,
        dus deze route werkt zelfs voor een codec waarvoor je browser helemaal geen
        decoder heeft. Al het andere dat je browser kan afspelen, en dan denk je
        meteen aan WebM, wordt geknipt door het af te spelen en het resultaat op te
        nemen. Dat werkt, maar het duurt zo lang als het resultaat zelf en het kan
        maar één stuk houden. Een bestand dat de browser niet kan lezen en ook niet
        kan afspelen, in de praktijk avi, wmv, flv en de meeste mkv's, wordt geweigerd
        met een melding die dat zegt, in plaats van halverwege te stranden."""

[[faq]]
q = "Zit er een limiet op de grootte of lengte van de video?"
a = """
        In de tool zit geen limiet ingebouwd, en op de kopieerroute wordt het bestand
        nauwelijks gelezen. Naar de frames die je houdt wordt alleen gewezen in plaats
        van dat ze geladen worden, dus vier minuten overhouden uit een opname van vier
        gigabyte kost ongeveer evenveel als die vier minuten naar schijf schrijven.
        Het exacte knippen loopt een paar megabyte tegelijk door het bestand. Hoe dan
        ook is het praktische plafond het gereedgekomen bestand, dat in het geheugen
        wordt opgebouwd voordat je het downloadt."""

[[faq]]
q = "Blijft het geluid intact?"
a = """
        Op beide mp4-routes gaat het monster voor monster over zonder ooit
        gedecodeerd te worden, dus het is byte voor byte wat er in het bestand zat,
        en een bewerkingsmarkering houdt elk stuk tot op een duizendste seconde
        gelijk met zijn beeld. Er is één uitzondering, en dat is het aan elkaar zetten
        van losse video's waarvan het geluid anders beschreven is, bijvoorbeeld met
        verschillende bemonsteringsfrequenties. Die krijg je niet in één spoor zonder
        ze te decoderen, en de pagina zegt dat voordat ze het doet. Op de opnameroute
        wordt het van de weergave opgevangen en opnieuw gecodeerd. Hoe dan ook staat
        er een vinkje klaar om het er helemaal uit te laten."""

[[faq]]
q = "Is het gratis, en heb ik er een account voor nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        watermerk aan te pas. De site draait op advertenties, en die betalen hem. Die
        advertenties krijgen niets over je video mee."""

