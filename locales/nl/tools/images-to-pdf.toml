[[privacy]]
title = "Je afbeeldingen kunnen nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Deze tool voegt niets aan die lijst toe,
      want hij heeft geen eigen netwerkfunctie, ook geen optionele. Er is hier geen
      eindpunt waar je bestanden verzameld zouden kunnen worden, en in de code staat
      niets wat ze zou versturen als dat eindpunt er wel was."""

[[privacy]]
title = "De pdf wordt hier geschreven."
body = """
 Een pdf is een lijst objecten plus
      een tabel van waar elk object begint, en <code>src/pdf.js</code> schrijft ze
      allebei. Er wordt geen bibliotheek opgehaald en er wordt niets op een server
      gerenderd, en het gereedgekomen bestand gaat rechtstreeks vanuit het geheugen
      naar een download."""

[[privacy]]
title = "Het document krijgt niets over jou te horen."
body = """
 De meeste tools stempelen een pdf
      met een tijdstempel en de naam van het programma dat hem maakte. Deze schrijft
      alleen een titel, een auteur en een datum als je die zelf intikt. De
      bestandsnamen van je plaatjes komen nooit in het document voor, en over je
      apparaat staat er evenmin iets in."""

[[privacy]]
title = "Wat Google laadt, en wat het niet te zien krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google. Geen van beide krijgt iets over je
      afbeeldingen mee: geen bestand, geen miniatuur, geen naam, geen grootte,
      geen aantal. Elke regel die een plaatje leest, decodeert of schrijft, wordt
      vanaf deze herkomst geserveerd en staat in de repository."""

[[privacy]]
title = "Wat de doneerknop laadt, en wat hij niet te zien krijgt."
body = """

      De knop &ldquo;Buy me a coffee&rdquo; in de kop wordt getekend door een
      script van cdnjs.buymeacoffee.com en haalt zijn letters bij Google Fonts.
      Het is een link en verder niets. Hij meldt geen bezoek en krijgt niets over
      jou of je afbeeldingen mee. Er gebeurt niets tenzij je erop klikt, en waar je
      dan naartoe klikt is de site van iemand anders."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en alles op deze
      pagina doet het nog. Eenvoudiger bewijs bestaat er niet, want een tool die je
      plaatjes wegstuurde om er een document van te laten maken zou ermee ophouden."""

[[howto]]
title = "Kies je afbeeldingen."
body = """
 Sleep een map het vak in, of kies de
      bestanden met de hand. De browser leest ze rechtstreeks van je schijf, en er
      gaat ondertussen niets ergens heen."""

[[howto]]
title = "Zet de pagina's op volgorde, en draai wat gedraaid moet."
body = """
 Eén
      afbeelding wordt één pagina, in de volgorde die je ziet staan. Sleep een tegel
      aan zijn handvat om hem te verplaatsen, of doe het met de pijltjes. De
      draaiknoppen draaien een pagina een kwartslag tegelijk, en meer heeft een
      scheve scan meestal niet nodig."""

[[howto]]
title = "Kies een paginaformaat."
body = """
 Met &ldquo;Pas de pagina op elke
      afbeelding aan&rdquo; wordt elke pagina precies zijn eigen plaatje, zonder dat
      er iets bijgesneden wordt en zonder witte banen. De benoemde formaten, van A4
      en Letter tot Legal en de rest, zetten elk plaatje juist op een vaste pagina,
      met een marge als je die wilt."""

[[howto]]
title = "Maak de pdf en download hem."
body = """
 Het document wordt op je eigen
      apparaat geschreven, dus hoe lang het duurt hangt van je hardware af en niet
      van een wachtrij. Het gereedgekomen bestand gaat rechtstreeks naar de downloads
      van je browser."""

[[faq]]
q = "Worden mijn afbeeldingen ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest je afbeeldingen en schrijft de pdf, op je eigen
        hardware. Deze tool heeft geen serverkant, en in de
        <code>Content-Security-Policy</code> van de pagina staat elk adres dat hij
        mag benaderen, waarvan er geen enkele bij deze site hoort. Anders dan sommige
        andere tools hier heeft deze helemaal geen optionele netwerkfunctie."""

[[faq]]
q = "Kost omzetten naar pdf kwaliteit?"
a = """
        Voor een JPEG niet, op de standaardinstelling. Pdf kan JPEG-gegevens
        rechtstreeks meedragen, dus een foto gaat byte voor byte het document in. Hij
        wordt nooit gedecodeerd en nooit opnieuw gecomprimeerd, en het plaatje in de
        pdf is precies het plaatje in het bestand. Andere formaten moeten wel opnieuw
        gecodeerd worden, omdat pdf er geen filter voor heeft. Kies je de verliesloze
        instelling, dan blijven ze exact bewaard, alleen wordt het bestand dan
        groter."""

[[faq]]
q = "Welke afbeeldingsformaten kan ik gebruiken?"
a = """
        Elk stilstaand beeld dat je browser kan decoderen, in de praktijk dus jpg,
        png, WebP, gif, AVIF en op Apple-apparaten ook HEIC. Er valt hier geen aparte
        lijst bij te houden, omdat het decoderen het werk van de browser is en niet
        van ons."""

[[faq]]
q = "Kan ik het paginaformaat en de volgorde van de pagina's kiezen?"
a = """
        Ja. Pagina's kunnen A4, Letter, Legal, A3, A5 of Tabloid zijn, een formaat
        dat je zelf intikt, of precies de grootte van elk plaatje. Sleep de tegels
        om ze te herordenen, sorteer ze op naam of datum, draai er een een
        kwartslag, en stel een marge in millimeters in."""

[[faq]]
q = "Hoeveel afbeeldingen kan ik in één pdf zetten?"
a = """
        In de tool zit geen limiet ingebouwd. Het praktische plafond is het geheugen
        van je eigen apparaat, omdat het gereedgekomen document daar wordt opgebouwd
        voordat je het downloadt. Bij een paar honderd telefoonfoto's op volle
        resolutie merk je dat het eerst. Verklein je in de instellingen de langste
        zijde, dan schuift dat plafond een heel eind op."""

[[faq]]
q = "Staan mijn bestandsnamen of een tijdstempel in de pdf?"
a = """
        Nee, tenzij je erom vraagt. Het informatieblok van het document blijft leeg op
        de naam van deze tool na. Er komen geen bestandsnamen in, geen apparaatnaam,
        geen gebruikersnaam, en geen aanmaakdatum tenzij je het vinkje daarvoor
        aanzet. Dat is met opzet zo, want een pdf is nu eenmaal iets wat mensen naar
        andere mensen sturen."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog en geen proefperiode aan
        te pas. De site draait op advertenties, en die betalen hem. Die advertenties
        krijgen niets over je afbeeldingen mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je afbeeldingen wegstuurde om er een
        document van te laten maken zou ermee ophouden zodra je de stekker eruit
        trok."""

