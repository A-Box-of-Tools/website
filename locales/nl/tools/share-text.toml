name = "Tekst en bestanden delen"
heading = "Tekst &amp; bestanden delen <span class=\"h1-kw\">&mdash; rechtstreeks van jouw browser naar de hunne, zonder upload</span>"
tagline = "Wat je deelt leeft in dit open tabblad. Lezers halen het versleuteld rechtstreeks uit je browser, en het tabblad sluiten beëindigt het - geen server bewaart iets."

title = "Tekst en bestanden delen tussen apparaten &mdash; rechtstreeks, versleuteld, niets opgeslagen"
description = "Stuur tekst of bestanden van de ene browser naar de andere over een rechtstreekse, versleutelde verbinding. Een uitspreekbare linknaam, live bijgewerkt terwijl je typt, goedkeuring per lezer - en nooit iets op een server. Gratis, zonder account."
og_title = "Iets delen dat stopt zodra je het tabblad sluit"
og_description = "Tekst en bestanden reizen versleuteld, rechtstreeks van jouw browser naar die van de lezer. De server stelt jullie alleen aan elkaar voor en ziet de inhoud nooit. Geen opslag, geen geschiedenis, geen account - tabblad dicht en alles is weg, overal."
og_image_alt = "Tekst en bestanden delen - van browser naar browser, niets opgeslagen"

pledge = """
    Wat je hier deelt reist van jouw browser naar die van elke lezer over
    een eind-tot-eind versleuteld WebRTC-kanaal, en nergens anders heen. De
    ene betrokken server &mdash; genoemd in de
    <code>Content-Security-Policy</code> van deze pagina, broncode in de
    repository &mdash; stelt de twee browsers aan elkaar voor en stapt dan
    opzij: hij slaat niets op, en de inhoud passeert hem nooit. Er is geen
    geschiedenis en geen account. Sluit dit tabblad en het delen stopt
    overal tegelijk, ook op de open pagina's van de lezers."""

live_hint = """
      Open DevTools en hou het tabblad &ldquo;Netwerk&rdquo; in de gaten
      terwijl je deelt. Je ziet één WebSocket naar de tussenpersoon met een
      paar kilobyte verbindingsopbouw &mdash; en hoeveel je ook typt of
      bijvoegt, geen enkel verzoek dat er iets van draagt."""

read_first = """
, <code>src/main.js</code> voor beide
      helften van de uitwisseling &mdash; het tabblad van de deler en dat
      van de lezer zijn hetzelfde bestand &mdash; en
      <code>src/markdown.js</code> voor de renderer die draait op tekst van
      de andere kant van de lijn, en die daarom alles escapet voordat hij
      iets uitstuurt. De volledige broncode van de server is
      <code>workers/rendezvous/worker.js</code>, in dezelfde repository: één
      kamer per linknaam, die niets vasthoudt behalve de open verbindingen."""

howto_heading = "Zo deel je tekst en bestanden zonder ze ergens te uploaden"

card = """
            Tekst en bestanden, van browser naar browser over een
            rechtstreekse versleutelde verbinding. Nergens opgeslagen; het
            delen stopt als je het tabblad sluit."""

[words]
plural = "gedeelde teksten en bestanden"
choose = "een linknaam"
analytics_extra = """, en niets van wat
  dit gereedschap deelt - niet de tekst, niet de bestanden, hun namen of
  groottes, en niet wie er meelas"""

