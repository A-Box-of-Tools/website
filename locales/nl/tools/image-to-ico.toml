pledge = """
    Het schalen en de icoonbestanden zelf komen allebei in je eigen browser tot
    stand. Het plaatje wordt getekend door het canvas dat je browser toch al
    meelevert, en elke container, of dat nu de Windows-<code>.ico</code> is of de
    macOS-<code>.icns</code>, wordt uit die pixels opgebouwd door een paar honderd
    regels in <code>src/ico.js</code> en <code>src/icns.js</code> die je gewoon kunt
