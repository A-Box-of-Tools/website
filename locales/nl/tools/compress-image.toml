[[faq]]
q = "Wordt mijn afbeelding ergens heen geüpload?"
a = """
        Nee. Je eigen browser decodeert, comprimeert en meet het bestand op je eigen
        hardware, met de JPEG-, PNG- en WebP-encoders die de browser al meelevert.
        Deze tool heeft geen enkele netwerkfunctie en haalt dus nooit iets op en
        verstuurt nooit iets. In de <code>Content-Security-Policy</code> van de
        pagina staat bovendien elk adres dat hij mag benaderen, en geen daarvan
        hoort bij deze site."""

[[faq]]
q = "Hoe komt hij precies op een exacte grootte uit?"
a = """
        Door het te proberen. Er bestaat geen formule die een kwaliteitsinstelling
        omrekent naar een aantal bytes, want dat hangt volledig van het plaatje af.
        Daarom codeert de tool de afbeelding een aantal keer en zoekt hij het
        antwoord. Hij begint bovenaan het kwaliteitsbereik en halveert zich naar
        beneden, waardoor hij de hoogste passende kwaliteit in een stuk of acht
        rondes te pakken heeft. Elke grootte die je op de pagina ziet, is een echt
        gecodeerd bestand en geen schatting."""

[[faq]]
q = "Wat betekent &ldquo;minimaal verlies&rdquo; hier eigenlijk?"
a = """
        Drie concrete dingen. Om te beginnen gaat een afbeelding die al onder je doel
        zit byte voor byte door zonder opnieuw gecodeerd te worden. Verder gaat er
        eerst kwaliteit op en pas daarna resolutie, en alleen tot een ondergrens
        waaronder compressieartefacten zichtbaar worden. Voorbij dat punt maakt de
        tool het plaatje kleiner en draait hij de kwaliteit weer omhoog, omdat minder
        goede pixels er beter uitzien dan meer verpeste. En zodra er een passend
        resultaat is, kruipt de zoektocht weer omhoog tot het budget op is, zodat je
        geen bestand van 300 KB krijgt als je om 500 KB vroeg."""

[[faq]]
q = "Wat zijn die SSIM- en PSNR-cijfers bij elk resultaat?"
a = """
        Een meting van wat de compressie gekost heeft, gedaan door het resultaat te
        decoderen en met het originele plaatje te vergelijken. SSIM vergelijkt
        plaatselijke helderheid, contrast en structuur, en dat ligt veel dichter bij
        waar een oog zich aan stoort dan het tellen van veranderde pixels. Boven de
        0,98 zijn de twee naast elkaar nauwelijks uit elkaar te houden. PSNR is het
        klassieke decibelgetal. Ze worden allebei op je eigen apparaat berekend, en
        ze staan er allebei bij zodat je de bewering over weinig verlies kunt
        natrekken in plaats van hem te moeten geloven."""

[[faq]]
q = "Welke formaten kan hij lezen en schrijven?"
a = """
        Hij leest alles wat je browser kan decoderen, in de praktijk dus JPEG, PNG,
        WebP, GIF, BMP en in de meeste browsers van nu ook AVIF. Schrijven doet hij
        in JPEG, PNG en WebP, want dat zijn de encoders die browsers meeleveren. Op
        &ldquo;automatisch&rdquo; houdt hij het formaat waarin je bestand binnenkwam,
        en stapt hij alleen over op WebP wanneer vasthouden een verkleining of een
        zichtbaar kwaliteitsverlies had gekost."""

[[faq]]
q = "Waarom valt een PNG niet ver te comprimeren?"
a = """
        Omdat PNG verliesloos is en er dus geen kwaliteitsknop aan zit om aan te
        draaien. Een PNG kleiner maken kan alleen met minder pixels of minder
        kleuren, dus met PNG geselecteerd haalt de tool een doel puur via het
        formaat. Is het plaatje een foto, dan komen JPEG of WebP veel dichter bij je
        doel, op een kwaliteit waarvan je zelf kunt zien dat hij prima is. Gaat het
        om een logo of een schermafbeelding met transparantie, dan houdt WebP die
        transparantie die JPEG met wit zou opvullen."""

[[faq]]
q = "Verdwijnen de EXIF- en gps-gegevens als ik een afbeelding comprimeer?"
a = """
        Ja, als bijwerking. Comprimeren betekent dat het plaatje tot pixels wordt
        gedecodeerd en dat die pixels opnieuw worden gecodeerd, en een canvas vol
        pixels draagt geen tags. De locatie, het cameramodel, de tijdstempels en al
        het andere belanden daardoor domweg niet in het nieuwe bestand. Wil je de
        metagegevens kwijt maar het plaatje onaangeroerd houden, gebruik dan de
        <a href="../exif-gegevens-verwijderen/">EXIF-lezer &amp; -wisser</a>, want
        die schrijft de container opnieuw zonder ook maar iets opnieuw te
        comprimeren."""

[[faq]]
q = "Is het gratis, en heb ik er een account voor nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        watermerk aan te pas. Er zit ook geen limiet op het aantal bestanden of op de
        grootte ervan, omdat er geen server is die daarvoor betaalt: het werk gebeurt
        op je eigen apparaat. De site draait op advertenties, en die betalen hem. Die
        advertenties krijgen niets over je afbeeldingen mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je afbeeldingen wegstuurde om ze te
        laten comprimeren zou ermee ophouden zodra je de stekker eruit trok."""

