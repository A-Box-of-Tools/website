 In <code>src/</code> staat
      nergens een <code>fetch</code>, een <code>XMLHttpRequest</code> of een
      <code>sendBeacon</code>. Het comprimeren gebeurt met
      <code>canvas.toBlob</code>, de encoder die al in je browser zit."""

