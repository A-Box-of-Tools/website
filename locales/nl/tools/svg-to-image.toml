[[privacy]]
title = "Je tekenwerk kan nergens heen."
body = """
 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Er is hier geen eindpunt waar je bestanden
      verzameld zouden kunnen worden, en in de code staat niets wat ze zou
      versturen als dat eindpunt er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 In <code>src/</code> staat
      nergens een <code>fetch</code>, een <code>XMLHttpRequest</code> of een
      <code>sendBeacon</code>. De hele rasteraar bestaat uit een
      <code>&lt;img&gt;</code> met een blob van je eigen bestand erin, één
      <code>drawImage</code> op een canvas, en één <code>canvas.toBlob</code>."""

[[privacy]]
title = "Een svg is een document, en dit is de modus waarin het niets kan doen."
body = """
 Een svg kan een
      <code>&lt;script&gt;</code>, een externe
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>, een
      stylesheet en een weblettertype meedragen. Getekend via een
      <code>&lt;img&gt;</code> zit hij in wat de specificatie <em>secure static
      mode</em> noemt, en dan draait het script niet en wordt geen van die adressen
      opgehaald. Dat is een garantie van de browser en geen belofte van ons, en
      juist daarom kan deze pagina een bestand openen dat ze nooit eerder gezien
      heeft zonder dat dat bestand naar huis kan bellen."""

[[privacy]]
title = "Wat Google laadt, en wat het niet te zien krijgt."
body = """
 De advertentie- en
      meetscripts komen van Google, de doneerknop van Buy Me a Coffee. Geen van
      alle krijgt iets over je tekening mee. Elke regel die een bestand leest, op
      formaat zet of tekent, wordt vanaf deze herkomst geserveerd en staat in de
      repository."""

[[privacy]]
title = "Het werkt offline."
body = """
 Verbreek de verbinding en de tool
      werkt onveranderd door, omdat er nooit een netwerkstap in zat. Eenvoudiger
      bewijs bestaat er niet."""

[[howto]]
title = "Kies de svg."
body = """
 Sleep er een het vak in, of kies een map
      vol en zet ze in één keer om. De browser leest het bestand rechtstreeks van
      je schijf, en er gaat ondertussen niets ergens heen. Bij elke regel staat welk
      formaat het bestand denkt te hebben, en dat wordt er anders bij gezegd wanneer
      dat formaat uit de <code>viewBox</code> kwam of aangenomen is omdat het
      bestand er geen opgeeft."""

[[howto]]
title = "Zeg hoe groot."
body = """
 Een factor van het eigen formaat van het
      bestand is het snelste antwoord, en voor een stapel ook het juiste. Elke
      tekening wordt dan vanaf zijn eigen beginpunt geschaald, waardoor een set
      iconen onderling in verhouding blijft. Anders noem je een breedte, een hoogte,
      de langste zijde, of een kader met beide zijden erbij. Een groot getal kost je
      hier niets, anders dan bij een foto, want de tekening wordt op dat formaat
      opnieuw getekend en er niet naartoe uitgerekt."""

[[howto]]
title = "Voeg de hi-dpi-kopieën toe als je ze nodig hebt."
body = """
 Een telefoon en een
      Retina-laptop tekenen twee of drie apparaatpixels per CSS-pixel, dus een
      logo van 200 pixels heeft een bestand van 400 of 600 pixels achter zich
      nodig. Vraag om <code>@2x</code> en <code>@3x</code> en ze komen eruit met
      de namen die Xcode, het gereedschap van Android en CSS
      <code>image-set()</code> alle drie verwachten, en elk is precies twee of
      drie keer de eerste in plaats van apart afgerond."""

[[howto]]
title = "Kies het bestandstype en beslis over transparantie."
body = """
 Png, tenzij je een reden hebt om iets
      anders te nemen, want het is verliesloos, het houdt transparantie en vlakke
      kleur comprimeert er goed in. Jpeg kent helemaal geen transparantie, dus daar
      wordt hoe dan ook een achtergrondkleur in geschilderd, of je er nu een kiest
      of niet. Kies je er geen, dan komt elke transparante pixel er zwart uit. WebP
      doet allebei en maakt een kleiner bestand, alleen leest software die oud
      genoeg is het niet."""

[[howto]]
title = "Kijk naar de voorvertoning voordat je downloadt."
body = """
 Die wordt getekend door dezelfde code
      die het bestand schrijft, uit jouw bestand, op jouw apparaat. Zodra een
      tekening pixels wordt veranderen er twee dingen, en allebei zie je ze hier.
      Een haarlijn die een halve pixel breed was wordt grijs, en tekst wordt
      getekend in een lettertype dat deze computer heeft in plaats van in een dat
      van het web gehaald wordt."""

[[howto]]
title = "Neem de bestanden mee."
body = """
 Eén download per bestand, of de hele
      stapel als één zip. De namen volgen de svg waar ze uit kwamen, met
      <code>@2x</code> en <code>@3x</code> op de kopieën, en twee bestanden die
      dezelfde naam gekregen zouden hebben, worden genummerd in plaats van dat de
      een de ander stilletjes vervangt."""

[[faq]]
q = "Wordt mijn svg ergens heen geüpload?"
a = """
        Nee. Je eigen browser leest het bestand op je eigen hardware, tekent het op
        een canvas met dezelfde motor die elk ander plaatje rendert dat je ziet, en
        geeft het als download terug. Deze tool heeft geen enkele netwerkfunctie en
        haalt dus nooit iets op en verstuurt nooit iets. In de
        <code>Content-Security-Policy</code> van de pagina staat bovendien elk adres
        dat hij mag benaderen, en geen daarvan hoort bij deze site."""

[[faq]]
q = "Op welk formaat moet ik een svg rasteren?"
a = """
        Op wat het ding dat hem leest vraagt, vermenigvuldigd met de
        pixelverhouding van het scherm waarop hij gezien wordt. Een logo dat 200
        CSS-pixels beslaat, heeft er 400 nodig voor een Retina-laptop en 600 voor
        een recente telefoon, en dat zijn hier de <code>@2x</code>- en
        <code>@3x</code>-kopieën. Voor een app-icoon of een winkelvermelding noemt
        de winkel een exact getal, en dat is het getal. Heeft niets je iets
        verteld, dan is 1024 op de langste zijde een bruikbare standaard: groot
        genoeg voor vrijwel elk gebruik en klein genoeg om te mailen."""

[[faq]]
q = "Kost het groter maken kwaliteit?"
a = """
        Nee, en dit is de ene plek waar dat antwoord eerlijk nee is. Een vector is
        instructies in plaats van pixels, dus de browser tekent de krommen opnieuw
        op welk formaat er ook gevraagd wordt. 4000 pixels uit een icoon van 24
        pixels is precies zo scherp als die 24 was. Wat je niet kunt, is de andere
        kant op: zodra het een png is, is het pixels als al het andere, dus raster
        op het formaat dat je nodig hebt in plaats van het resultaat later te
        schalen."""

[[faq]]
q = "Mijn svg heeft geen breedte of hoogte. Welk formaat krijg ik?"
a = """
        De <code>viewBox</code>, als die er is. De breedte en hoogte daarvan zijn
        gebruikerseenheden en geen pixels, maar het zijn de enige getallen in het
        bestand en een browser behandelt ze als het natuurlijke formaat van de
        tekening. Is er ook geen viewBox, dan zet de pagina <em>aangenomen</em> naast
        de regel en gebruikt ze
        300&nbsp;&times;&nbsp;150, en dat is waarop een <code>&lt;img&gt;</code>
        hem getekend zou hebben. Hoe dan ook kun je zelf het gewenste formaat
        noemen en wordt het bestand op dat formaat getekend."""

[[faq]]
q = "Waarom ziet de tekst er in de png anders uit?"
a = """
        Omdat het lettertype niet in de svg zit. Een svg die tekst tekent noemt een
        lettertype en laat het aan de machine over om het te vinden, en een bestand
        dat er een met een <code>@import</code> van Google Fonts haalt, krijgt hier
        niets, want een svg die via een <code>&lt;img&gt;</code> getekend wordt mag
        niets ophalen. Dat is dezelfde regel die hem belet met jouw bestand naar huis
        te bellen. De oplossing kent elke ontwerper al: zet de tekst in het
        tekenprogramma om naar paden voordat je exporteert. Dan is het meetkunde, en
        dan ziet het er overal hetzelfde uit."""

[[faq]]
q = "Kan hij meerdere bestanden tegelijk omzetten?"
a = """
        Ja. Elke svg op de lijst wordt met dezelfde instellingen gerenderd en de
        stapel komt binnen als één zip. Voor een stapel is een factor meestal de
        juiste instelling, dus zoiets als &ldquo;4&times; het formaat dat het bestand
        vraagt&rdquo;. Elke tekening wordt dan vanaf zijn eigen formaat geschaald in
        plaats van dat ze allemaal naar hetzelfde aantal pixels gedwongen worden.
        Klik op een regel om die in de voorvertoning te zetten."""

[[faq]]
q = "Zit er een groottelimiet op?"
a = """
        Die van de browser, niet die van ons. Een canvas geeft het ergens voorbij
        16.384 pixels op een zijde op, en Safari op een iPhone of iPad stopt al bij
        zo'n 16,7 megapixel oppervlak, oftewel 4096&nbsp;&times;&nbsp;4096. Daarboven
        waarschuwt de pagina je in plaats van je een leeg plaatje te geven, want dat
        is wat een browser doet zodra hij op is. <code>toBlob</code> geeft dan
        helemaal niets terug, zonder foutmelding die zichzelf uitlegt. Voorbij 100
        megapixel weigert de tool, omdat dat 400&nbsp;MB canvas is nog voordat er één
        byte gecodeerd is."""

[[faq]]
q = "Wat gebeurt er met transparantie?"
a = """
        Die blijft, in png en in WebP. Jpeg heeft helemaal geen alfakanaal, dus daar
        wordt hoe dan ook een kleur achter het hele plaatje geschilderd, of je er nu
        om vraagt of niet. Zonder die kleur zou alles wat transparant is er zwart uit
        komen, en dat ziet eruit als een fout in plaats van als jpeg. Ook bij png is
        een achtergrondkleur kiezen een volstrekt normale wens, want dan wordt de
        tekening op die kleur platgeslagen in plaats van dat er een gat blijft."""

[[faq]]
q = "Kan hij een svg lezen met een script of een externe afbeelding erin?"
a = """
        Lezen kan hij, en hij tekent precies de delen die een browser bereid is te
        tekenen. Een svg die via een <code>&lt;img&gt;</code> geladen wordt zit in
        <em>secure static mode</em>. Scripts draaien dan niet, externe verwijzingen
        worden niet opgehaald en animatie speelt niet, dus je krijgt het eerste
        frame. Een bestand met een externe <code>&lt;image&gt;</code> erin komt er
        dus uit met dat deel eruit. Dat is de browser die namens jou weigert, en juist
        daarom kan deze pagina veilig een bestand openen dat ze nooit eerder gezien
        heeft."""

[[faq]]
q = "Wat is het verschil tussen dit en Afbeeldingsformaat wijzigen?"
a = """
        De bron. <a href="../afbeelding-formaat-wijzigen/">Afbeeldingsformaat
        wijzigen</a> begint bij pixels, bij een jpeg of een png, dus daar moet groter
        maken detail verzinnen dat er nooit geweest is. Dit begint bij een tekening,
        dus valt er niets te verzinnen en is er geen bovengrens om je druk over te
        maken. Heb je een svg, dan levert deze je een scherp resultaat. Heb je een
        foto, dan zit je bij die andere goed."""

[[faq]]
q = "Is het gratis, en heb ik een account nodig?"
a = """
        Het is gratis, en er komt geen account, geen inlog, geen proefperiode en geen
        watermerk aan te pas. Er zit ook geen limiet op het aantal bestanden of op de
        grootte ervan, omdat er geen server is die daarvoor betaalt: het werk gebeurt
        op je eigen apparaat. De site draait op advertenties, en die betalen hem. Die
        advertenties krijgen niets over je bestanden mee."""

[[faq]]
q = "Werkt het offline?"
a = """
        Ja. Laad de pagina één keer, verbreek daarna je internetverbinding en hij
        werkt gewoon door. Dat is meteen de eenvoudigste manier om te bewijzen dat er
        niets geüpload wordt, want een tool die je tekenwerk wegstuurde om het te
        laten renderen zou ermee ophouden zodra je de stekker eruit trok."""

