pledge = """
    Het tekenwerk wordt gerasterd door dezelfde motor die het zojuist op je
    scherm zette. Je bestand wordt van je schijf gelezen, zijn worteltag wordt
    naar het gevraagde formaat herschreven door honderd regels in
    <code>src/svg.js</code> die je kunt lezen, en het wordt op een canvas
    getekend dat je browser toch al meelevert. Deze tool heeft geen enkele
    netwerkfunctie, dus er valt niets op te halen en niets te versturen. En al was
    die er wel, dan stond aan de andere kant van deze pagina nog steeds geen
    server om een logo naartoe te sturen."""

live_hint = """
      Geloof ons vooral niet op ons woord. Open DevTools, hou het tabblad
      &ldquo;Netwerk&rdquo; in de gaten en raster iets. Geen enkel verzoek draagt
      een bestand, een miniatuur, een bestandsnaam of ook maar één byte van wat je
      koos. Of trek de stekker uit je internet en zet er alsnog een om."""

read_first = """
, <code>src/svg.js</code> voor hoe het eigen
      formaat van een bestand gelezen wordt en hoe zijn worteltag herschreven
      wordt, en <code>src/render.js</code> voor de acht regels die het rasteren
      doen: een &lt;img&gt;, een <code>drawImage</code> en een
      <code>toBlob</code>, met niets ertussen."""

howto_heading = "Zo zet je een svg om naar een png zonder hem te uploaden"

card = """
            Een svg heeft zelf geen pixelformaat, dus het getal kies jij: 32 of
