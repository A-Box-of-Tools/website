<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> Kies de codering</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">Codering</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>Welke kant op</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>Coderen</strong> Platte tekst erin, gecodeerd eruit.</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>Decoderen</strong> Gecodeerd erin, platte tekst eruit.</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> Plak hem erin</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Jouw tekst</label>
          <span class="count" id="input-count">leeg</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Plak de tekst om te coderen, of de Base64 om te decoderen - of sleep hierboven een bestand."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Een voorbeeld proberen</button>
        <button type="button" id="clear" class="ghost danger">Wissen</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> Neem het resultaat mee</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Nog niets.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Kopiëren</button>
        <a id="download" class="ghost as-button" hidden download>Downloaden</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
