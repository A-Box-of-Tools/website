 In de
      Content-Security-Policy staat elk adres dat deze pagina mag benaderen, en
      geen daarvan hoort bij deze site. Er is hier geen eindpunt waar een
      wifiwachtwoord verzameld zou kunnen worden, en in de code staat niets wat
      het zou versturen als dat eindpunt er wel was."""

[[privacy]]
title = "Niets hier haalt iets op."
body = """
 In <code>src/</code> staat
      nergens een <code>fetch</code>, een <code>XMLHttpRequest</code> of een
      <code>sendBeacon</code>. De code wordt met rekenwerk uit de tekenreeks
      opgebouwd en als svg getekend, hier in deze pagina, op jouw eigen apparaat."""

[[privacy]]
title = "De code wijst niet naar ons."
body = """
 Wat je typt is wat de code bevat.
      Verschillende gratis generatoren geven je een code terug met een link naar
      hun eigen site erin, die daarna naar de jouwe doorstuurt. Zo tellen zij elke
