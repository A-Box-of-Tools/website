name = "Audiobewerker"
# Het staartje is de zoekterm. Net als in het Engels blijft de productnaam de
# luide helft.
heading = "Audio&nbsp;bewerken <span class=\"h1-kw\">&mdash; omkeren, versnellen of versterken</span>"
tagline = "Achterstevoren afspelen, de snelheid wijzigen, een zachte opname optillen. Alles hier, op je eigen apparaat."

title = "Audio omkeren, sneller maken en harder zetten &mdash; gratis, zonder uploaden"
description = "Speel een opname achterstevoren af, maak hem sneller of langzamer en zet een zachte opname harder. Haalt ook het geluid uit een video. Draait in je browser en uploadt niets."
og_title = "Audiobewerker &mdash; omkeren, hertimen en versterken zonder iets te uploaden"
og_description = "Keer een opname om, wijzig de snelheid met of zonder de toonhoogte mee te nemen, zet het niveau en download er een wav van. Je eigen browser leest en schrijft het bestand."
og_image_alt = "Audiobewerker - audio omkeren, hertimen en versterken in je browser"

pledge = """
    Je eigen browser leest, bewerkt en schrijft je bestand, op je eigen
    hardware. Niets hier kan iets ophalen of versturen, want er zit helemaal
    geen netwerkfunctie in deze tool. En al was die er wel, dan stond aan de
    andere kant van deze pagina nog steeds geen server om een opname naartoe
    te sturen."""

live_hint = """
      Geloof ons vooral niet op ons woord. Open DevTools, hou het tabblad
      &ldquo;Netwerk&rdquo; in de gaten en keer iets om. Geen enkel verzoek draagt
      een sample, een bestandsnaam of ook maar één byte van wat je koos. Of trek de
      stekker uit je internet en bewerk er alsnog een, want een tool die je audio
      wegstuurde om hem te laten verwerken zou er domweg mee ophouden."""

read_first = """
, <code>src/decode.js</code> voor de twintig regels
      die je bestand aan de eigen decoder van de browser geven,
      <code>src/stretch.js</code> voor het uitrekken in de tijd,
      <code>src/speed.js</code> voor de resampler, en <code>src/wav.js</code> voor
      de kop die vóór de samples komt. Geen ervan importeert iets wat een verzoek
      kan doen."""

howto_heading = "Zo bewerk je een audiobestand"

card = """
            Keer een opname om, wijzig de snelheid met of zonder de toonhoogte
            mee te nemen, en til een zachte opname op. Haalt ook het geluid uit
            een video."""

