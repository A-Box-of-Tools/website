#
# Qr- & barcodescanner - Dutch.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Je-vorm, net als bij de generator hiernaast.
#
# "Qr-code" met kleine letters en een streepje: dat is de spelling van de
# Woordenlijst, en het is ook hoe het geschreven wordt. De namen van de
# symbolieken - EAN-13, UPC-A, ITF-14, Code 128, Code 39, ISO/IEC 18004 -
# blijven zoals ze zijn: dat zijn normnamen.
#

name = "Qr- & barcodescanner"
heading = "Qr-code&nbsp;&amp;&nbsp;barcode scannen <span class=\"h1-kw\">&mdash; vanaf een afbeelding of met je camera</span>"
tagline = "Richt je camera erop, of sleep er een foto van hierheen. Het wordt hier gelezen, en nergens anders."

title = "Qr-codescanner &amp; barcodelezer &mdash; vanaf een afbeelding, zonder uploaden"
description = "Lees een qr-code vanaf een foto, een schermafbeelding of je camera, en zie precies waar de link heen gaat voordat je hem opent. Ook EAN, UPC, Code 128, Code 39 en ITF. Er wordt niets geüpload."
og_title = "Een qr-code lezen zonder de afbeelding naar iemand te sturen"
og_description = "Scan een qr-code vanaf een afbeelding of met je camera en bekijk het volledige adres voordat je besluit het te openen. De afbeelding verlaat je machine niet, en er wordt geen enkel camerabeeld opgenomen."
og_image_alt = "Qr- & barcodescanner - een code lezen vanaf een afbeelding of camera, zonder uploaden"

pledge = """
    Een code lezen is rekenwerk op pixels, en de pixels zijn er al. Het symbool
    vinden, de hoek eruit rekenen, het masker ongedaan maken, de schade
    repareren met Reed-Solomon en de bits weer uitlezen: dat gebeurt allemaal in
    zo'n tweeduizend regels JavaScript in deze pagina die je gewoon kunt lezen.
    <strong>De camera is dezelfde belofte, geen uitzondering erop:</strong> een
    beeld komt als pixels dit tabblad binnen, wordt bekeken, en is weg. Er wordt
    niets opgenomen, niets bewaard, en deze pagina heeft geen enkele
    netwerkfunctie om er iets mee te versturen."""

live_hint = """
      Geloof ons vooral niet op ons woord. Open DevTools, hou het tabblad
      &ldquo;Netwerk&rdquo; in de gaten en scan een code met de camera aan. Geen
      enkel verzoek draagt een beeld of ook maar één teken van wat erin stond. Of
      trek de stekker uit je internet en lees de code alsnog."""

read_first = """
, <code>src/binarize.js</code>
      en <code>src/detect.js</code> voor het vinden van een symbool in een foto
      &mdash; de drempelwaarde, de zoekpatronen en de perspectiefcorrectie
      &mdash;, <code>src/qr-decode.js</code> voor het teruglezen,
      <code>src/reed-solomon.js</code> voor het repareren van wat verkeerd
      gelezen is, <code>src/linear.js</code> voor de gestreepte, en
      <code>src/camera.js</code>, dat elke regel in deze pagina is die een
      camera aanraakt."""

howto_heading = "Hoe je een qr-code leest zonder de afbeelding te uploaden"

card = """
            Lees een qr-code vanaf een foto, een schermafbeelding of je camera
            &mdash; en zie het hele adres voordat je het opent. Barcodes ook."""

[picker]
title = "Sleep hier een afbeelding met een code heen"
hint = "of klik om te bladeren &mdash; een foto, een schermafbeelding, een PNG, alles wat je browser kan openen"

[words]
plural = "afbeeldingen en de codes die erin zitten"
choose = "de afbeelding die gelezen wordt"

