# reads as the object it is.
open_tool = "Open de tool {{ tool.name | e }}"

[ui.picker]
warning = """
      <strong>Dit is de enige functie die het netwerk aanspreekt.</strong>
      Haal je een adres op, dan weet die server je IP-adres en welke {{ tool.picker.urls.noun }} je
