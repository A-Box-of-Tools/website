live_check = "Live controle:"
offline = "Offline:"
checking = "bezig met controleren&hellip;"
questions_heading = "Vragen"
guide_heading = "De uitgebreide versie"
privacy_heading = "Hoe de privacybelofte te controleren is"

pledge_line = """
    Je {{ tool.words.plural }} worden <strong>nooit geüpload</strong>. Er is geen server."""

boot_title = "De code van deze pagina is niet gestart."
