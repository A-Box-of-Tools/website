#
# Nederlands.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# "je" rather than "u" throughout. The English is plain and direct and the
# formal register would make the Dutch read like a bank letter, which is the
# opposite of what this site sounds like.
#
# Written as Dutch rather than carried over from the English. Dutch hinges a
# sentence on want, omdat, waardoor and dus where the English reaches for a
# dash or a colon, so those are gone wherever they were doing an English job;
# the verb sits where Dutch puts it; and the compounds are closed, because a
# space in "bestandsgrootte" is the mistake a reader spots before they have
# finished the sentence.
#

lang = "nl"
name = "Dutch"
endonym = "Nederlands"

# Finished: every tool, every guide, the roadmap list and both legal pages are
# translated. While this is true a missing key is a build failure rather than a
# silent fall back to English, and every link on every Dutch page has to lead to
# a page that was actually built - which is what catches an English slug left
# behind in a translated body.
complete = true

#
# ---------------------------------------------------------------------------
# The addresses. Keyed by the ENGLISH slug; the Dutch is an address and appears
# only on the right.
#
# Noun first, verb last - "afbeelding-comprimeren" - which is both the Dutch
# word order and the way the search is typed.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "afbeelding-comprimeren"
"compress-pdf" = "pdf-verkleinen"
"crop-video" = "video-bijsnijden"
"edit-audio" = "audio-bewerken"
# Vrijwel niemand zoekt op "EXIF-editor"; men zoekt hoe je de gegevens uit een foto haalt.
"exif-editor" = "exif-gegevens-verwijderen"
# "Onleesbaar maken" is wat er gezocht wordt en het zegt wat er gebeurt.
# "Lakken" komt uit de Woo-hoek en leest als jargon.
"redact-image" = "afbeelding-onleesbaar-maken"
"images-to-pdf" = "afbeeldingen-naar-pdf"
"images-to-video" = "afbeeldingen-naar-video"
"resize-image" = "afbeelding-formaat-wijzigen"
"trim-video" = "video-knippen"
"video-to-gif" = "video-naar-gif"
"heic-to-jpg" = "heic-naar-jpg"
# Naar de klus genoemd, niet naar het formaat. Niemand zoekt op "afbeelding naar
# ICO"; men zoekt hoe je een favicon maakt.
"image-to-ico" = "favicon-maken"
# Ook hier de klus: "svg naar png" is wat er getypt wordt, en png is het formaat
# dat er in vrijwel alle gevallen uit moet komen.
"svg-to-image" = "svg-naar-png"
# "Data-URI" is het vakwoord; "base64" is wat er gezocht wordt, en het is de
# regel die je uiteindelijk in je CSS plakt.
"image-to-data-uri" = "afbeelding-naar-base64"
"qr-barcode" = "qr-code-maken"

"guides" = "gidsen"
"roadmap" = "roadmap"
"privacy" = "privacy"
"terms" = "voorwaarden"

"guides/compress-an-image-to-a-target-size" = "gidsen/afbeelding-naar-exact-formaat-comprimeren"
"guides/resize-an-image" = "gidsen/formaat-van-een-afbeelding-wijzigen"
"guides/remove-exif-and-gps-data" = "gidsen/exif-en-gps-gegevens-verwijderen"
"guides/redact-an-image" = "gidsen/een-afbeelding-onleesbaar-maken"
"guides/make-a-pdf-smaller" = "gidsen/een-pdf-kleiner-maken"
"guides/combine-images-into-a-pdf" = "gidsen/afbeeldingen-samenvoegen-tot-een-pdf"
"guides/turn-images-into-a-video" = "gidsen/van-afbeeldingen-een-video-maken"
"guides/trim-a-video" = "gidsen/een-video-inkorten"
"guides/crop-a-video" = "gidsen/een-video-bijsnijden"
"guides/is-it-safe-to-upload-files" = "gidsen/is-bestanden-uploaden-veilig"
"guides/make-a-favicon" = "gidsen/zelf-een-favicon-maken"
"guides/convert-an-svg-to-png" = "gidsen/een-svg-naar-png-omzetten"
"guides/turn-a-video-into-a-gif" = "gidsen/van-een-video-een-gif-maken"
"guides/convert-heic-to-jpg" = "gidsen/heic-naar-jpg-omzetten"
"guides/embed-an-image-in-css" = "gidsen/een-afbeelding-in-css-zetten"
"guides/make-a-qr-code" = "gidsen/zelf-een-qr-code-maken"

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Gratis browsertools &mdash; niets uploaden, geen account | abox.tools"
# Onder de 155 tekens, net als in het Engels: Google kapt een beschrijving daar
# af, en het staartje is hier het stuk dat de site verkoopt.
description = "Gratis tools in je browser die niets uploaden. Voeg afbeeldingen samen tot pdf of mp4, comprimeer een foto naar een exacte grootte, wis EXIF."
heading = "Gereedschap waar geen server aan te pas komt"
og_title = "A Box of Tools &mdash; gereedschap waar geen server aan te pas komt"
og_description = "Kleine tools die elk één ding doen en volledig in je eigen browser draaien. Je bestanden blijven op je apparaat."
og_image_alt = "abox.tools - gereedschap waar geen server aan te pas komt"
schema_description = "Kleine tools die elk één ding doen en al hun werk in de browser zelf afhandelen. Er wordt niets geüpload en een account heb je niet nodig."
schema_about = "Bestandstools die in de browser draaien en bestanden lokaal verwerken zonder ze te uploaden"

lede = """
    Kleine tools die elk één ding doen en al het werk in je eigen browser
    afhandelen. Je bestanden blijven op je apparaat, want er valt niets te
    uploaden, je hoeft geen account te maken en er wordt niets bijgehouden."""

support_note = """
      Deze tools zijn gratis en dat blijven ze. Heeft er eentje je een klus
      bespaard, dan is dit het enige op de site dat je om iets vraagt."""

# Drie controleerbare feiten in plaats van een belofte, net als in het Engels.
[[hub.guarantees]]
title = "Je bestanden verlaten je apparaat nooit"
body = """
        Je eigen browser opent, leest en verwerkt ze, op je eigen hardware. In
        de <code>Content-Security-Policy</code> van elke tool staat elk adres
        dat hij mag benaderen, en daar zit er niet één van ons tussen."""

[[hub.guarantees]]
title = "Er wordt niets over je bestanden verstuurd"
body = """
        Niet het bestand, niet een miniatuur, niet de naam, de grootte of het
        aantal dat je koos. Geen enkele tool hier leest dat uit. Aan de andere
        kant staat ook geen server die het zou kunnen ontvangen."""

[[hub.guarantees]]
title = "Het werkt offline"
body = """
        Open een tool één keer, verbreek daarna je internetverbinding en hij
        werkt precies zo door aan je bestanden. Dat laat zich lastig veinzen,
        want een tool die je bestanden ergens heen stuurde om ze te laten
        verwerken zou er simpelweg mee ophouden."""

[[hub.categories]]
id = "images-and-video"
name = "Afbeeldingen &amp; video"
note = "Bewerk je foto's en opnames zonder ze uit handen te geven."

[[hub.categories]]
id = "gif-and-animation"
name = "GIF &amp; animatie"
note = "Bouw een animatie of haal er een uit elkaar, zonder dat hij je apparaat verlaat."

[[hub.categories]]
id = "audio"
name = "Audio"
note = "Bewerk een opname zonder hem uit handen te geven, ook het geluid dat in een video zit."

[[hub.categories]]
id = "documents-and-pdf"
name = "Documenten &amp; pdf"
note = "Stel documenten samen en herschik ze, zonder ze op te sturen om ze te laten verwerken."

[[hub.categories]]
id = "codes-and-data"
name = "Codes &amp; gegevens"
note = "Zet iets wat je intypt om in iets wat een machine kan lezen, zonder dat het de pagina verlaat."

[[hub.categories]]
id = "text-and-code"
name = "Tekst &amp; code"
note = "Lees het, vergelijk het, codeer het, zonder dat je een token of een configuratiebestand op de server van iemand anders plakt."

