heading = "Deze pagina is hier niet"
tools_heading = "Alle tools, op één plek"
tools_note = "Allemaal gratis, allemaal in je browser, geen ervan uploadt iets."

lede = """
    Of het adres bevat een typefout, of wat er stond is verhuisd. Er is niets
    met je bestand en er is niets kwijt: deze site heeft nooit iets van jou
    gehad om kwijt te raken."""

