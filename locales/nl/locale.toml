heading = "Gidsen"
lede = """
    Eén gids per tool, geschreven voor iedereen die een bestandsgrootte of een
    afmeting opgelegd heeft gekregen en wil weten wat die ene instelling nu
    eigenlijk doet. Alles wat hier beschreven staat gebeurt op je eigen
    apparaat."""
og_title = "De gidsen van abox.tools"
og_description = "Hoe je je eigen bestanden comprimeert, verkleint, bijsnijdt, inkort en omzet, en wat elke instelling je kost. Zonder uploaden."
og_image_alt = "abox.tools - gereedschap waar geen server aan te pas komt"

[[guides.groups]]
id = "doing-the-job"
name = "De klus klaren"
note = "Eén per tool: waar de klus uit bestaat, welke instelling telt en wat die je kost."

[[guides.groups]]
id = "before-you-upload"
name = "Voordat je iets uploadt"
note = "Wat er werkelijk gebeurt als je een bestand aan een website geeft, en hoe je ziet of dat nodig was."

#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, and is
# translated in planned.toml beside this file.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roadmap"
title = "Roadmap &mdash; wat abox.tools hierna gaat bouwen"
description = "Alle tools die voor abox.tools op de planning staan, gegroepeerd en in de openbaarheid, plus de tools die er al zijn. Ze draaien allemaal in je browser en uploaden niets."
heading = "Wat er hierna komt"
lede = """
    Alles op beide lijsten hieronder doet zijn werk in je eigen browser en
    uploadt niets, en dat is meteen de regel waar een naam aan moet voldoen
    voordat hij hier überhaupt op komt. De aantallen staan nergens
    opgeschreven; de build leest ze van de twee lijsten af."""

intro_heading = "Hoe deze lijst tot stand is gekomen"
intro = """
    <p>
      Het is geen verlanglijst. Hij is samengesteld door de toolslijst van de
      grootste gif- en videosite van het internet door te lopen, want dat is
      het dichtste wat er bestaat bij een catalogus van wat mensen werkelijk
      met een bestand gedaan willen krijgen. Blijven staan is alles wat zo te
      bouwen valt dat het werk op je eigen apparaat gebeurt en blijft gebeuren
      met het netwerk eruit.
    </p>
    <p>
      Het meeste wat overbleef draait op interfaces die de browser zelf al
      meelevert. Een enkeling heeft een codec nodig, en die wordt dan
      ingebouwd in precies de ene tool die hem gebruikt. Dat mag, want het
      bestand verlaat het apparaat nog steeds niet. Wat die lat niet haalde is
      weggelaten in plaats van beloofd, dus een paar van de gaten die
      hieronder opvallen zijn gaten met opzet.
    </p>
    <p>
      De tools die al bestaan staan bovenaan in hun groep, met het label
      <em>Klaar</em> en een link naar hun eigen pagina. Alles daaronder moet
      nog komen, en niets wordt een link voordat het zover is.
    </p>"""

planned_heading = "Elk soort bestand, en wat je ermee kunt doen"

og_title = "De roadmap van abox.tools"
og_description = "Wat er klaar is en wat er hierna komt. Alles draait in je browser en uploadt niets."
og_image_alt = "abox.tools - gereedschap waar geen server aan te pas komt"

