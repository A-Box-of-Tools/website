    <a href="{{ base }}{{ links.safety_guide }}/">
      Hoe je ziet of een tool je bestanden echt nodig heeft</a>
    zet vier controles op een rij die je zelf kunt uitvoeren, hier en op elke
    andere site."""

hub_guides_note = """
