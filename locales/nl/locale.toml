# resolves, and the build refuses to render a name it cannot find. Dutch sends
# the verb to the end of the clause as readily as German does, which is why
# these are whole sentences rather than fragments.
# ---------------------------------------------------------------------------
#

[ui]
languages = "Taal"
lang_auto = "Deze pagina wordt in het Nederlands getoond, de taal waar je browser om vraagt."
breadcrumb = "Kruimelpad"
all_tools = "Alle tools"
last_updated = "Laatst bijgewerkt"
built_tag = "Klaar"
planned_count = "gepland"
built_count = "klaar"

guide_one = "gids"
