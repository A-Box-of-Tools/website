built_count = "klaar"

guide_one = "gids"
guide_many = "gidsen"

footer_tools = "Tools"
footer_site = "Deze site"
footer_contact = "Contact"
footer_sitemap = "Sitemap"
footer_source = "Lees de code op GitHub"

guarantees_note = """
    Niets daarvan hoef je op ons woord aan te nemen.
    <a href="{{ base }}{{ links.safety_guide }}/">
      Hoe je ziet of een tool je bestanden echt nodig heeft</a>
    zet vier controles op een rij die je zelf kunt doen, op deze site en op elke
    andere."""

hub_guides_note = """
    Weet je niet welke instelling je moet verzetten, of wat die kost?
    <a href="{{ base }}{{ links.guides }}/">Bij elke tool hoort een
    gids</a>."""

hub_roadmap_note = """
    Er komt meer aan, en de lijst is openbaar:
    <a href="{{ base }}{{ links.roadmap }}/">bekijk wat er gepland staat</a>."""

guides_all_note = """
    Elke gids hier beschrijft een tool die op je eigen apparaat draait:
    <a href="{{ base }}">bekijk ze allemaal</a>."""

[ui.tool]
view_source = "Bekijk de code"
