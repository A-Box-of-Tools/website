#
# De gepland-lijst op de roadmap - Dutch.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Dutch list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#

note = "Nog niet gebouwd. Hier vermeld zodat je ziet waar dit heen gaat."

[[group]]
id = "images"
name = "Afbeeldingen"
items = [
  ["Tekst toevoegen", "over de foto heen, of in een bijschrift erboven"],
  ["AVIF", "het formaat dat elke browser leest en geen enkele schrijft"],
  ["DICOM anonimiseren", "de patiënt uit een scan halen zonder de scan aan te raken"],
]

[[group]]
id = "gif"
name = "Gif &amp; animatie"
items = [
  ["Gif naar mp4 of WebM", "dezelfde animatie, meestal een tiende van de grootte"],
  ["Een gif bewerken", "schalen, bijsnijden, draaien, omkeren of de snelheid wijzigen"],
  ["Bewegende WebP", "dezelfde animatie voor een fractie van de grootte, transparantie en al"],
]

[[group]]
id = "video"
name = "Video"
items = [
  ["Formaat wijzigen", "omlaag naar een grootte die er echt doorheen komt"],
  ["Draaien", "voor dat filmpje dat op z'n kant is opgenomen, zonder ook maar één frame te decoderen"],
  ["Een video dempen", "het geluid weglaten en het beeld ongemoeid laten"],
  ["Omzetten naar mp4", "wat er ook uit de camera kwam, als het bestand dat er wél doorheen komt"],
  ["Ondertiteling inbranden", "een srt-bestand vast in beeld getekend"],
  ["Ondertiteling omzetten", "srt, vtt, ass, sbv en lrc alle kanten op, met tijden die je kunt verschuiven"],
]

[[group]]
id = "audio"
name = "Audio"
items = [
  ["Formaat omzetten", "mp3, wav en Opus, alle kanten op"],
]

[[group]]
id = "documents"
name = "Documenten &amp; pdf"
items = [
  ["Pagina's bijsnijden", "de marges van een scan eraf halen, of die van een afgedrukte dia"],
  ["Afbeeldingen eruit halen", "de plaatjes weer uit een document trekken"],
]

[[group]]
id = "beyond"
name = "Verder dan media"
items = [
  ["csv &amp; json", "beide kanten op omzetten, en opruimen wat het rekenblad exporteerde"],
  ["Certificaten &amp; sleutels", "een certificaat of een ondertekeningsverzoek lezen zonder het in andermans server te plakken"],
]
