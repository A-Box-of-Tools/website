  "Pangkasan bebas, rasio terkunci (1:1, 4:5, 9:16, 16:9, 4:3, 3:2), atau kotak piksel yang persis",
  "Menjaga audio asli tanpa mengodekannya ulang",
  "Jalan tanpa internet; tanpa unggah, tanpa akun, tanpa tanda air",
]

