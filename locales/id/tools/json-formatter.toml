tagline = "JSON, XML, HTML, CSS, dan YAML, diformat atau diubah. Tidak ada yang ditempelkan ke server orang lain."

title = "Pemformat JSON &amp; Pengubah YAML &mdash; XML, HTML, CSS &mdash; Tanpa Unggah"
description = "Format dan padatkan JSON, XML, HTML, CSS, dan YAML, dan ubah JSON menjadi YAML atau XML dan sebaliknya. Penguraiannya berjalan di peramban Anda dan tidak ada yang diunggah - sebuah token atau file konfigurasi tidak pernah meninggalkan mesin Anda."
og_title = "Format dan ubah JSON tanpa menempelkannya ke sebuah server"
og_description = "Sebuah pemformat dan pengubah JSON yang berjalan di mesin Anda sendiri. Kunci menjaga urutannya, angka menjaga digitnya, dan yang Anda tempelkan tidak pergi ke mana-mana."
og_image_alt = "Pemformat JSON - format, padatkan, dan ubah, tanpa unggah"

pledge = """
    Memformat dan mengubah format adalah aritmetika atas sebuah string,
    dikerjakan di sini, di halaman ini. Penguraiannya ditulis sendiri dan ada di
    dalam <code>src/</code> &mdash; <code>shared/parse-json.js</code>, <code>shared/parse-xml.js</code>,
    <code>css.js</code>, <code>shared/parse-yaml.js</code> &mdash; dan tidak ada yang lain.
    Alat ini tidak punya fitur jaringan dalam bentuk apa pun &mdash; tidak ada
    yang diambil, tidak ada yang dikirim &mdash; dan itu lebih penting di sini
    daripada hampir di mana pun lain di situs ini: yang ditempelkan orang ke
    sebuah pemformat adalah token akses, cookie sesi, catatan pelanggan, dan
    kode yang belum dirilis."""

