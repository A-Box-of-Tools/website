name = "Gambar ke SVG"
heading = "Gambar&nbsp;ke&nbsp;SVG <span class=\"h1-kw\">&mdash; jiplak logo, stensil, atau siluet menjadi kurva</span>"
tagline = "Satu bentuk, satu garis luar. Tunjuk saja yang seharusnya tidak ada."

title = "Gambar ke SVG &mdash; Vektorkan Logo atau Siluet, Tanpa Unggah"
description = "Jiplak gambar hitam putih menjadi garis luar SVG sungguhan, di peramban Anda. Logo, stensil, tanda tangan, gambar garis, dan siluet menjadi kurva yang bisa Anda perbesar ke ukuran berapa pun. Satu klik membuang yang salah terambil. Tidak ada yang diunggah."
og_title = "Ubah logo atau siluet menjadi SVG, tanpa mengunggahnya"
og_description = "Bitmap yang diperbesar adalah tangga; garis luar adalah perintah. Alat ini menemukan bentuknya, memasangkan kurva, dan membiarkan Anda mengeklik yang seharusnya tidak ada, semuanya di mesin Anda sendiri."
og_image_alt = "Gambar ke SVG - jiplak logo, stensil, atau siluet menjadi kurva"

pledge = """
    Gambarnya dibaca dari disk oleh peramban Anda sendiri, diringkas menjadi
    satu bit per piksel oleh <code>src/mask.js</code>, ditelusuri tepinya oleh
    <code>src/contour.js</code>, dan dipasangi kurva oleh <code>src/fit.js</code>
    &mdash; sekitar enam ratus baris yang bisa Anda baca, tanpa mesin di baliknya
    dan tanpa apa pun yang diunduh untuk menjalankannya. Alat ini tidak punya
    fitur jaringan dalam bentuk apa pun: tidak ada yang diambil, tidak ada yang
    dikirim, dan seandainya pun ada, tidak ada server di ujung lain halaman ini
    untuk menerima sebuah gambar."""

live_hint = """
      Tidak perlu percaya begitu saja: buka DevTools, perhatikan tab Network,
      lalu jiplak sesuatu. Tidak satu pun permintaan membawa gambar, gambar
      mini, nama file, atau satu byte pun dari yang Anda pilih. Atau cabut
      koneksi internet dan tetap jiplak satu."""

read_first = """
, <code>src/mask.js</code> untuk bagaimana sebuah
      gambar menjadi satu bit per piksel, <code>src/contour.js</code> untuk
      perjalanan mengelilingi tepi bentuk, <code>src/fit.js</code> untuk
      bagaimana sebuah tangga menjadi kurva, dan <code>src/subject.js</code>
      untuk bagaimana latar ditebak ketika tidak ada terang dan gelap untuk
      dipisahkan."""

howto_heading = "Cara menjiplak gambar menjadi SVG tanpa mengunggahnya"

card = """
            Bitmap yang diperbesar adalah tangga. Garis luar adalah perintah,
            jadi tajam pada ukuran berapa pun &mdash; kalau yang Anda punya
            adalah bentuk, bukan foto."""

