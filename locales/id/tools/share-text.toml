name = "Berbagi teks dan berkas"
heading = "Berbagi teks &amp; berkas <span class=\"h1-kw\">&mdash; langsung dari browser Anda ke browser mereka, tanpa unggah</span>"
tagline = "Bagikan ini hidup di tab yang terbuka. Pembaca menerimanya terenkripsi, langsung dari browser Anda, dan menutup tab mengakhirinya - tidak ada server yang menyimpan apa pun."

title = "Berbagi teks dan berkas antar perangkat &mdash; langsung, terenkripsi, tanpa penyimpanan"
description = "Kirim teks atau berkas dari satu browser ke browser lain lewat koneksi langsung yang terenkripsi. Nama tautan yang bisa diucapkan, pembaruan langsung saat mengetik, persetujuan per pembaca - dan tidak pernah ada apa pun di server mana pun. Gratis, tanpa daftar."
og_title = "Berbagi yang berakhir begitu Anda menutup tab"
og_description = "Teks dan berkas berjalan terenkripsi, langsung dari browser Anda ke browser pembaca. Server hanya memperkenalkan keduanya dan tidak pernah melihat isinya. Tanpa penyimpanan, tanpa riwayat, tanpa akun - tutup tabnya dan semuanya hilang, di mana-mana."
og_image_alt = "Berbagi teks dan berkas - dari browser ke browser, tanpa penyimpanan"

pledge = """
    Apa yang Anda bagikan di sini berjalan dari browser Anda ke browser
    setiap pembaca lewat kanal WebRTC yang terenkripsi ujung ke ujung, dan
    tidak ke mana-mana lagi. Satu-satunya server yang terlibat &mdash;
    disebut di <code>Content-Security-Policy</code> halaman ini, kodenya di
    repositori &mdash; memperkenalkan kedua browser lalu menyingkir: ia
    tidak menyimpan apa pun, dan isi tidak pernah melewatinya. Tidak ada
    riwayat, tidak ada akun. Tutup tab ini dan berbaginya berakhir di
    mana-mana sekaligus, termasuk di halaman pembaca yang masih terbuka."""

live_hint = """
      Buka DevTools dan perhatikan tab Network sambil Anda berbagi. Anda
      akan melihat satu WebSocket ke perantara yang membawa beberapa
      kilobyte negosiasi &mdash; dan sebanyak apa pun Anda mengetik atau
      melampirkan, tidak satu pun permintaan membawa isinya."""

read_first = """
, <code>src/main.js</code> untuk kedua
      belah pertukaran &mdash; tab pembagi dan tab pembaca adalah berkas
      yang sama &mdash; dan <code>src/markdown.js</code> untuk perender yang
      bekerja pada teks dari ujung kabel yang lain, dan karena itu meng-escape
      semuanya sebelum mengeluarkan apa pun. Kode lengkap servernya adalah
      <code>workers/rendezvous/worker.js</code>, di repositori yang sama:
      satu ruang per nama tautan, tidak memegang apa pun selain koneksi yang
      terbuka."""

howto_heading = "Cara berbagi teks dan berkas tanpa mengunggahnya ke mana pun"

card = """
            Teks dan berkas, dari browser ke browser lewat koneksi langsung
            terenkripsi. Tidak disimpan di mana pun; berbaginya berakhir
            saat Anda menutup tab."""

[words]
plural = "teks dan berkas yang dibagikan"
choose = "nama tautan"
analytics_extra = """, dan tidak satu pun
  yang dibagikan alat ini - bukan teksnya, bukan berkasnya, bukan nama atau
  ukurannya, bukan pula siapa yang membaca"""

[[facts]]
