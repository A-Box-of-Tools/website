  "Pembaruan langsung: perubahan sampai ke pembaca yang terhubung sambil diketik",
  "Markdown, bisa dinyalakan di kedua sisi, dirender perender bawaan yang meng-escape lebih dulu",
  "Berkas hingga 200 MB per berkas, diunduh sesuai permintaan, dengan kemajuan per berkas",
  "Draf tinggal hanya di browser pembagi - atau tidak di mana pun, bila sekali pakai",
