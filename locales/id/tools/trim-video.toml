howto_heading = "Cara memotong video"

card = """
            Tandai setiap bagian yang layak disimpan sambil diputar, lalu simpan
            sebagai satu video. Bingkainya disalin, bukan dikodekan ulang, jadi
            tidak ada yang hilang."""

