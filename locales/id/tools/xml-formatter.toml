tagline = "XML dirapikan agar terbaca atau dimampatkan agar siap kirim, dan diubah ke JSON dua arah. Tidak ada satu pun yang ditempel ke server orang lain."

title = "Pemformat XML &amp; XML ke JSON &mdash; gratis, tanpa unggah"
description = "Format, beri indentasi, dan mampatkan XML, lalu ubah XML ke JSON atau JSON ke XML. Pengurainya berjalan di peramban Anda dan tidak ada yang diunggah, jadi sebuah feed, faktur, atau berkas konfigurasi tidak pernah meninggalkan perangkat Anda."
og_title = "Memformat XML tanpa menempelkannya ke sebuah server"
og_description = "Pemformat dan pengubah XML yang berjalan di perangkat Anda sendiri. Ia menyebut galatnya ada di baris mana, dan apa yang Anda tempel tidak pergi ke mana pun."
og_image_alt = "Pemformat XML - merapikan, memampatkan, atau mengubah, tanpa unggah"

pledge = """
    Memformat dan mengubah adalah hitungan atas sebuah untai teks, dikerjakan di
    sini, di halaman ini. Pengurainya ditulis tangan dan ada di
    <code>src/xml.js</code>, dan tidak ada yang lain. Alat ini tidak punya fungsi
    jaringan apa pun &mdash; tidak ada yang diambil, tidak ada yang dikirim
    &mdash; dan di sini itu lebih berarti daripada yang disiratkan kata
    &ldquo;XML&rdquo;: yang datang dalam format ini biasanya sebuah faktur,
    rekening koran, rekam medis, atau permintaan SOAP dengan kredensial seseorang
    di headernya."""

live_hint = """
      Anda tidak perlu percaya begitu saja: buka DevTools, perhatikan tab
      jaringan, lalu format sesuatu. Tidak satu pun permintaan membawa satu
      karakter dari yang Anda tempel. Atau cabut sambungan internet dan format
      tetap."""

read_first = """
, <code>src/xml.js</code> untuk pengurai yang
      menyebutkan tag mana yang tidak pernah ditutup, dan
      <code>src/convert.js</code> untuk alasan setiap nilai keluar dari XML
      sebagai untai teks alih-alih ditebak."""

howto_heading = "Cara memformat XML tanpa mengunggahnya"

card = """
            Rapikan XML agar terbaca, mampatkan agar siap kirim, atau ubah jadi
            JSON dan kembali lagi. Tempel sebuah faktur atau feed tanpa
            menyerahkannya kepada siapa pun."""

