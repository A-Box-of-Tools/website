, <code>src/dicom.js</code> untuk pembaca yang
      menyusuri file-nya, <code>src/pixels.js</code> untuk pendekodean pikselnya,
      <code>src/jpeg-lossless.js</code> untuk kodek yang dipakai kebanyakan
