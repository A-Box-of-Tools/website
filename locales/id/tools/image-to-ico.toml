  "Menampilkan setiap ukuran pada ukuran piksel sebenarnya sebelum Anda mengunduh",
  "Set situs web opsional: ikon sentuh Apple, ikon Android, ikon maskable, ubin Windows, manifes, dan HTML untuk ditempelkan",
