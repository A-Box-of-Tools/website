      halamannya."""

howto_heading = "Cara membandingkan dua teks tanpa mengunggahnya"

card = """
            Bandingkan dua teks dan lihat apa yang berubah, baris demi baris dan
            kata demi kata. Tempelkan sebuah kontrak atau kode yang belum dirilis
