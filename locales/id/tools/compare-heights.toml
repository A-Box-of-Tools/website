title = "Bandingkan Tinggi Badan &mdash; gratis, tanpa daftar, tanpa unggah"
description = "Bandingkan tinggi badan berdampingan. Tambahkan pria, wanita, anak laki-laki, anak perempuan, dan benda &mdash; pintu, jendela, papan tulis, mesin penjual otomatis &mdash; dalam sentimeter atau kaki dan inci, lalu unduh bagannya sebagai PNG atau SVG. Ia digambar di peramban Anda."
og_title = "Bandingkan tinggi badan berdampingan dan simpan gambarnya"
og_description = "Taruh dua orang dewasa, seorang anak laki-laki, seorang anak perempuan, dan sebuah pintu pada penggaris yang sama, dalam sentimeter atau kaki dan inci, lalu unduh hasilnya. Tanpa akun, tanpa tanda air, dan tanpa satu pun daftar nama yang meninggalkan perangkat Anda."
og_image_alt = "Pembanding Tinggi Badan - membandingkan tinggi berdampingan, tanpa unggah"

pledge = """
    Bagan tinggi badan adalah hitungan dan sebuah gambar: tidak ada berkas yang
    perlu dikirim dan tidak ada layanan yang perlu ditanyai &mdash; dan satu
    berkas yang diterima halaman ini, gambar milik Anda untuk ditaruh di penggarisnya, dibaca di sini dan tidak ke mana-mana. Pria, wanita, anak
    laki-laki, dan anak perempuan adalah karya seni domain publik yang ikut
    dikirim bersama halaman ini, dan anak laki-laki serta anak perempuannya
    adalah gambar anak-anak sungguhan, bukan orang dewasa yang dikecilkan
    &mdash; dan itulah yang mencegah bagan keluarga terlihat keliru dengan cara
    yang tak bisa disebut namanya siapa pun. Setiap langkahnya terjadi di
    beberapa ratus baris JavaScript di halaman ini yang bisa Anda baca. Tidak
    ada fungsi jaringan apa pun, dan di sini itu penting karena yang Anda ketik
    adalah daftar orang dan tinggi masing-masing."""

