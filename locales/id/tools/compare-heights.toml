read_first = """, <code>src/traced.js</code> dan
      <code>vendor/</code> untuk empat figur dan asal-usul karyanya,
      <code>src/figures.js</code> untuk daftar yang menjadi bahan menunya,
      <code>src/units.js</code> untuk bagaimana tinggi yang diketik menjadi angka
      dan bagaimana penggarisnya diberi label, <code>src/chart.js</code> untuk
