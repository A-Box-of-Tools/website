title = "Pengubah YAML ke JSON &mdash; dua arah, tanpa unggah"
description = "Ubah YAML ke JSON dan JSON ke YAML di peramban Anda. Ia membaca YAML 1.2, jadi yes dan no tetap berupa teks, dan ia menyebutkan persis apa yang hilang di tiap arah. Tidak ada yang diunggah: sebuah berkas konfigurasi tidak pernah meninggalkan perangkat Anda."
og_title = "Mengubah YAML tanpa menempelkannya ke sebuah server"
og_description = "Pengubah YAML dan JSON yang berjalan di perangkat Anda sendiri. Kunci tetap pada urutannya, angka tetap pada digitnya, dan apa yang Anda tempel tidak pergi ke mana pun."
og_image_alt = "Pengubah YAML ke JSON - dua arah, tanpa unggah"

pledge = """
    Mengubah adalah hitungan atas sebuah untai teks, dikerjakan di sini, di
    halaman ini. Kedua pengurainya ditulis tangan dan ada di <code>src/</code>
    &mdash; <code>yaml.js</code> dan <code>json.js</code> &mdash; dan tidak ada
    yang lain. Alat ini tidak punya fungsi jaringan apa pun &mdash; tidak ada
    yang diambil, tidak ada yang dikirim &mdash; dan di sini itu lebih berarti
    daripada hampir di mana pun di situs ini: sebuah berkas YAML biasanya adalah
    konfigurasi penggelaran, dan konfigurasi penggelaran biasanya penuh nama
    host, nama bucket, dan rahasia."""

live_hint = """
      Anda tidak perlu percaya begitu saja: buka DevTools, perhatikan tab
      jaringan, lalu ubah sesuatu. Tidak satu pun permintaan membawa satu
      karakter dari yang Anda tempel. Atau cabut sambungan internet dan ubah
      tetap."""

read_first = """
, <code>src/yaml.js</code> untuk pembaca yang
      menolak sebuah jangkar alih-alih menebak maksudnya, dan
      <code>src/convert.js</code> untuk alasan sebuah konversi adalah satu
      pengurai dan satu pencetak, tanpa apa pun di antaranya yang mengenal kedua
      format sekaligus."""

howto_heading = "Cara mengubah YAML ke JSON tanpa mengunggahnya"

card = """
            Jadikan YAML sebagai JSON atau JSON sebagai YAML, dan biarkan ia
            menyebutkan biaya perjalanannya. Tempel sebuah konfigurasi
            penggelaran tanpa menyerahkannya kepada siapa pun."""

