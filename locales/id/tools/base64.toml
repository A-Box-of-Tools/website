[[privacy]]
title = "Apa yang Anda tempelkan tidak punya tujuan ke mana pun."
body = """
 Content-Security-Policy menyebut
      satu per satu setiap alamat yang boleh dihubungi halaman ini, dan tidak
      satu pun milik situs ini. Tidak ada titik akhir di sini tempat token yang
      ditempelkan bisa dikumpulkan, dan tidak ada kode yang akan mengirimnya
      seandainya ada."""

[[privacy]]
title = "Tidak ada di sini yang mengambil apa pun."
body = """
 Tidak ada <code>fetch</code>, tidak ada
      <code>XMLHttpRequest</code>, dan tidak ada <code>sendBeacon</code> di mana
      pun di dalam <code>src/</code>. Setiap pengode dan setiap pengurai adalah
      fungsi di halaman ini yang mengambil sebuah string dan mengembalikan sebuah
      string."""

[[privacy]]
title = "Pengurai memberi tahu Anda kalau ada yang salah."
body = """
 <code>atob</code> bawaan peramban
      menerima masukan yang seharusnya ditolaknya dan mengembalikan sesuatu yang
      tampak masuk akal. Base64 di sini ditulis sendiri dan diperiksa terhadap
      vektor uji RFC&nbsp;4648, dan ketika yang Anda tempelkan bukan Base64 ia
      mengatakannya, dan mengatakan sebabnya. Pengujian di
      <code>tests/js/text-encode.test.js</code> memeriksa persis hal itu."""

[[privacy]]
title = "Apa yang dimuat Google, dan apa yang tidak diberikan kepadanya."
body = """
 Skrip iklan dan pengukuran berasal
      dari Google, dan tombol donasi dari Buy Me a Coffee. Tidak satu pun diberi
      satu karakter pun dari teks Anda. Setiap baris yang membaca, mengurai, atau
      menulisnya disajikan dari asal ini dan terdaftar di repositori."""

[[privacy]]
title = "Jalan tanpa internet."
body = """
 Putuskan koneksi jaringan dan alat ini tidak
      berubah, karena sejak awal memang tidak ada langkah jaringan di dalamnya.
      Itulah bukti yang paling sederhana."""

[[howto]]
title = "Pilih pengodeannya."
body = """
 Base64 dalam kedua alfabet, pengodean persen
      untuk satu nilai atau seluruh URL, lima entitas HTML, byte heksadesimal, dan
      escape garis miring terbalik sebuah literal string. Catatan di bawah menunya
      menjelaskan kegunaan masing-masing."""

[[howto]]
title = "Pilih arahnya."
body = """
 <em>Encode</em> mengambil teks polos dan
      menghasilkan bentuk terkodenya; <em>Decode</em> mengembalikan bentuk terkode
      ke teks polos. Hasilnya mengikuti ketikan Anda: berganti arah cukup satu
      klik, tanpa mengetik ulang."""

[[howto]]
title = "Tempelkan, atau jatuhkan file-nya."
body = """
 Apa pun yang bisa Anda pilih dan salin
      bisa dipakai. File yang dijatuhkan ke pemilihnya dibaca peramban Anda
      sendiri dan ditaruh di kotaknya &mdash; tidak ada langkah unggah untuk
      ditinggalkan."""

[[howto]]
title = "Baca galatnya, kalau ada."
body = """
 Pengurai yang gagal di sini mengatakan apa
      yang ditemuinya &mdash; karakter yang tidak dipakai Base64, isian di tempat
      yang salah, byte yang bukan teks &mdash; alih-alih mengembalikan sesuatu
      yang tampak masuk akal tetapi salah."""

[[howto]]
title = "Ambil hasilnya."
body = """
 Salin, atau unduh sebagai file teks.
      Penghitung di bawah kotaknya menyebut berapa byte yang masuk dan berapa yang
      keluar."""

[[faq]]
q = "Apakah teks saya diunggah ke suatu tempat?"
a = """
        Tidak. Setiap pengode dan setiap pengurai di halaman ini adalah fungsi yang
        berjalan di peramban Anda sendiri, di perangkat keras Anda sendiri. Alat
        ini tidak punya fitur jaringan dalam bentuk apa pun &mdash; ia tidak
        pernah mengambil apa pun dan tidak pernah mengirim apa pun &mdash; dan
        <code>Content-Security-Policy</code> halaman ini menyebut satu per satu
        setiap alamat yang boleh dihubunginya, dan tidak satu pun milik situs ini.
        Itulah alasan memakainya untuk sebuah token akses atau cookie sesi:
        menempelkan salah satunya ke pengurai orang lain berarti memberikannya
        kepada mereka."""

[[faq]]
q = "Apakah Base64 di sini sama dengan Base64 di mana-mana?"
a = """
        Ya &mdash; ia diperiksa terhadap vektor uji di RFC 4648 alih-alih
        terhadap dirinya sendiri. Kedua alfabetnya bisa didekode, jadi JWT yang
        ditulis dengan <code>-</code> dan <code>_</code> terbaca semudah yang
        ditulis dengan <code>+</code> dan <code>/</code>, dan masukan yang
        dipatahkan pada 64 karakter dirapikan untuk Anda. Pengodeannya lewat byte
        UTF-8, jadi huruf beraksen atau sebuah emoji selamat dalam perjalanan
        bolak-balik."""

[[faq]]
q = "Apakah Base64 itu enkripsi?"
a = """
        Bukan, dan menganggapnya enkripsi adalah kekeliruan klasik. Base64 adalah
        cara menulis: byte yang sama, ditulis dengan alfabet yang selamat di dalam
        URL, surel, atau string JSON. Siapa pun bisa membacanya kembali &mdash;
        halaman ini melakukannya dalam semilidetik &mdash; jadi ia tidak
        menyembunyikan apa-apa dan tidak melindungi apa-apa. Kalau yang Anda punya
        adalah rahasia, ia butuh enkripsi sungguhan sebelum dikodekan, bukan
        sebagai gantinya."""

[[faq]]
q = "Kenapa penguraiannya gagal?"
a = """
        Karena yang ditempelkan bukan persis yang dikira kodeknya, dan galatnya
        menyebut di mana bedanya: karakter di luar alfabet Base64, isian di tempat
        yang salah, tanda persen tanpa dua digit heksadesimal di belakangnya, atau
        byte yang memang bisa diuraikan dari Base64 tetapi bukan teks UTF-8 &mdash;
        yang biasanya berarti aslinya adalah sebuah file, bukan string.
        <code>atob</code> bawaan peramban akan mengembalikan sesuatu yang tampak
        masuk akal; diberi tahu adalah seluruh gunanya menempelkan sesuatu ke
        sebuah pengurai."""

[[faq]]
q = "Apa beda kedua pengodean alamat web itu?"
a = """
        Satu nilai, atau seluruh alamat. Mengodekan <em>satu nilai</em>
        meng-escape semua yang diberi arti oleh URL &mdash; garis miring, tanda
        tanya, tanda dan &mdash; dan itulah yang Anda mau untuk satu parameter
        kueri. Mengodekan <em>seluruh URL</em> membiarkan alamatnya tetap bekerja:
        garis miring dan <code>?</code> tetap ada, dan hanya karakter yang memang
        tidak bisa dibawa URL yang di-escape. Memakai yang pertama pada seluruh
        alamat merusak alamatnya; memakai yang kedua pada sebuah nilai
        menghilangkan batas akhir nilainya."""

[[faq]]
q = "Sebesar apa file yang bisa ditanganinya?"
a = """
        Tidak ada batas yang ditetapkan di sini, karena tidak ada server yang
        membayarnya. Batas praktisnya adalah mesin Anda sendiri: beberapa megabyte
        teks tidak masalah, dan pada dokumen yang sangat panjang halaman ini
        menunggu jeda dalam ketikan Anda sebelum mengodekan ulang, alih-alih
        berebut papan ketik dengan Anda."""

[[faq]]
q = "Apakah gratis, dan apakah saya perlu akun?"
a = """
        Gratis, dan tidak ada akun, tidak ada masuk, tidak ada masa uji coba, dan
        tidak ada batas berapa banyak yang Anda tempelkan. Situs ini memasang
        iklan, dan itulah yang membiayainya; iklan tidak diberi apa pun tentang
        teks Anda."""

[[faq]]
q = "Apakah jalan tanpa internet?"
a = """
        Ya. Muat halamannya sekali, lalu putuskan koneksi internet dan ia tetap
        bekerja. Itu juga cara paling sederhana untuk membuktikan tidak ada yang
        diunggah: alat yang mengirim teks Anda ke tempat lain untuk diuraikan akan
        berhenti begitu Anda mencabut koneksi."""

