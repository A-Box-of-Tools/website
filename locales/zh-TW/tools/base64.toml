body = """瀏覽器內建的 <code>atob</code> 會接受本該拒絕的輸入，然後返回一個貌似像樣的結果。這裡的 Base64 是手寫的，用 RFC&nbsp;4648 的測試向量驗證；你貼的不是 Base64 時它會說出來，還會說出原因。<code>tests/js/text-encode.test.js</code> 裡的測試驗證的正是這一點。"""

