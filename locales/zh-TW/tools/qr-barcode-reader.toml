#
# QR Code 與條碼識讀 - Traditional Chinese.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# [words] 的兩個值會被塞進 locale.toml 的 ui.tool.pledge_line 和 boot_body
# 中間，所以它們必須在"你的⋯⋯不會被上傳"和"選擇⋯⋯的時候"這兩句裡讀得通。
#
# 長句用行尾反斜槓接起來：TOML 多行字串裡的換行是真的換行，到了 HTML 就
# 塌成一個空格，而兩個漢字之間的空格是看得見的。
#

name = "QR Code 與條碼識讀"
