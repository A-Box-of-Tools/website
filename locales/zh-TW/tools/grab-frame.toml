      器只取你要的那一幀前後的一小段視窗，這也是兩個 G 的片子和小片子開得\
      一樣快的原因。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你影片的資訊，一條也沒有交給它們，\
      檔案、某一幀、名字、大小、時長、你停在哪一刻，都沒有。讀取、解碼、\
      繪製的每一行程式碼都由這個源提供，也都擺在儲存庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁首那個「Buy me a coffee」按鈕由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它不過是個連結，不上報訪問，也拿不到關於你或\
      你影片的任何東西。"""

[[privacy]]
title = "斷網也照樣能用。"
body = """\
      斷開網路，這個頁面上的一切照常工作。這是最省事的一條證明。"""

[[howto]]
title = "選一個影片。"
body = """\
      把 MP4、MOV、M4V 或 WebM 拖到選擇框裡，或者自己找出來。瀏覽器直接從\
      磁碟上讀，這期間沒有任何東西發往別處。"""

[[howto]]
title = "找到那個瞬間。"
body = """\
      播放然後在想要的地方停下，或者拖動滑塊。MP4 的滑塊一格就是一幀，所以\
      你看到的和你存下的之間不存在取整。方向鍵一次挪一幀，按住 \
      <kbd>Shift</kbd> 一次挪十幀。"""

[[howto]]
title = "挑一個格式。"
body = """\
      PNG 會把解碼出來的幀原樣存下，這就是這裡說的「原畫質」。JPEG 和 WebP \
      更小，但會在影片自身的壓縮之上再壓一遍，用來預覽沒問題，用在之後還要\
      再編輯的圖上就不合適。"""

[[howto]]
title = "截一張，或者截一串。"
body = """\
      單張會直接進你的下載。「每 N 秒」會把片子走一遍，在每個刻度取一張，做\
      一覽圖和縮圖時很好用，而且它們會打包成一個 ZIP，而不是彈一百次儲存\
      提示。"""

[[faq]]
q = "我的影片會被傳到哪裡去嗎？"
a = """
        不會。它由你自己的瀏覽器在你自己的硬體上讀取和解碼。這個工具沒有服務\
        端，頁面的 <code>Content-Security-Policy</code> 裡寫著它允許聯絡的每一\
        個地址，沒有一個屬於本站。你要是寧可自己查也不願聽我們說，拔掉網線，\
        照樣截一幀試試。"""

[[faq]]
q = "「原畫質」到底是什麼意思？"
a = """
        兩件事。一是這張圖按影片本身的解析度儲存，而不是按頁面上預覽的大小，\
        4K 的片子給的就是 3840 x 2160 的圖。二是選了 PNG 的話，這一幀就是從\
        解碼器出來時的樣子，檔案裡裝的正是影片裡裝的畫面，上面沒有再壓一層。\
        對著播放器視窗截圖兩樣都得不到：尺寸是視窗的尺寸，而且是播放器縮放\
        並做完色彩管理之後的畫面。"""

[[faq]]
q = "哪些影片格式可以截幀？"
a = """
        MP4、M4V 和 MOV 直接讀，裡面裝什麼都行：H.264、HEVC、AV1 或 VP9，只要\
        你的瀏覽器能解那個編碼。這是精確路徑，工具能點名到具體某一幀。其他\
        瀏覽器能播的東西，最典型的是 WebM，則靠把播放器挪過去、再把它顯示的\
        內容畫下來，一樣能存出原尺寸的圖，但落到的是播放器選的那一幀，而不是\
        你要的那一幀。瀏覽器既讀不了也播不了的檔案，實際上就是 AVI、WMV、FLV \
        和大多數 MKV，會帶一句說明直接拒掉。"""

[[faq]]
q = "能一幀一幀地挪嗎？"
a = """
        MP4 可以，而且是精確的：工具讀的是檔案自己的幀列表，所以方向鍵是在真正\
        存在的那些畫面之間移動，哪怕片子的幀率忽高忽低也一樣，而按三十分之一秒\
        固定步進就會越走越偏。走播放路徑時沒有這份列表，一次操作大約挪一幀，\
        頁面也會明說。"""

[[faq]]
q = "我直拍的手機影片在這裡為什麼是正的？"
a = """
        因為旋轉是特意應用上去的。手機是橫著拍的，然後把「轉四分之一圈」寫進檔案\
        裡，而不是真的把畫素轉過來，所以解碼器交出來的幀是躺著的，每個播放器\
        都會在送到你螢幕的路上把它扶正。跳過這一步的工具，會存下一張時刻沒錯、\
        但躺著的圖。這個工具會從軌道裡讀出旋轉值，在畫任何東西之前先應用。"""

[[faq]]
q = "影片的大小或時長有上限嗎？"
a = """
        工具裡沒有寫死的上限，檔案也不會一次性讀進記憶體，而是幾 MB 幾 MB 地走過去，\
        所以長片子和短片子開得一樣快。你截下的圖在下載之前留在頁面裡，所以真正\
        的天花板是幾百張 4K PNG，而不是影片本身。"""

[[faq]]
q = "截下來的圖之後能縮放或裁剪嗎？"
a = """
        這裡不行，隔壁可以。這個工具只是把幀原樣存下來；改尺寸或改形狀是另一件\
        事，裡面有自己的取捨，<a href="../resize-image/">圖片尺寸調整</a>兩件都\
        能做，同樣什麼都不上傳。想在不改畫面的前提下把檔案變小，用\
        <a href="../compress-image/">圖片壓縮</a>。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費就是\
        從那裡來的，廣告拿不到任何關於你影片的資訊。"""

