      把檔案送過去的東西。"""

[[privacy]]
title = "這裡不會去取任何東西。"
body = """\
      這個工具壓根就沒有網路功能：沒有地址可填，沒有東西要下載，第一次用也\
      不會拉什麼引擎。碰到你影片的每一個位元組，都是頁面載入時從這個源來的。"""

[[privacy]]
title = "解碼在本地完成。"
body = """\
      幀要麼走你自己瀏覽器裡的 WebCodecs，要麼走本來就會給你放這個片子的\
