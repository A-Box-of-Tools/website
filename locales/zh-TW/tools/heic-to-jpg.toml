[[privacy]]
title = "你的照片沒地方可去。"
body = """\
      Content-Security-Policy 把這個頁面允許聯的地址全列了出來，沒有一個是\
      本站的。這裡沒有能收檔案的介面，程式碼裡也沒有一行會把檔案發出去，就算\
      真有那麼個介面也一樣。"""

[[privacy]]
title = "解碼器從這裡來，也哪裡都不去。"
body = """\
      HEIC 說白了就是裝在盒式容器裡的 HEVC，除了 Safari 沒有瀏覽器解得開，\
      所以這個頁面內建一份編譯成 WebAssembly 的 <code>libheif</code>，大約
      1.4 MB，提交在這個倉庫裡，從本站發出，跟這裡其他檔案一樣由 service
      worker 快取。它不從 CDN 取。走 CDN 等於把一個第三方塞進每一次訪問，\
      還會讓這個工具離線用不成。二進位放在指令碼內部而不是擱在旁邊，就是為了\
      啟動它連一次 fetch 都不用發。"""

[[privacy]]
title = "這裡沒有任何東西會去聯網取資料。"
body = """\
      為這個工具寫的檔案裡，一個 <code>fetch</code>、一個\
      <code>XMLHttpRequest</code>、一個 <code>sendBeacon</code> 都找不到。\
      隨附的這份引擎跟所有 Emscripten 構建一樣，帶著從某個 URL 取\
      <code>.wasm</code> 的載入路徑，但那些路徑走不到，二進位本來就在手上；\
      就算走到了，<code>connect-src</code> 裡只列了 Google 的統計端點，\
      瀏覽器當場就會拒絕。能當證據的是那條策略，不是那句話。"""

[[privacy]]
title = "後設資料在這裡讀出來，也報給你看。"
body = """\
      頁面上那份列表會寫明每張照片帶著什麼，拍攝日期、相機，還有裡面有沒有
      GPS 座標。把 JPEG 交給別人之前，這些多半是你想先知道的。讀取由\
      <code>src/boxes.js</code> 在這個瀏覽器裡完成，結果顯示在這個頁面上，\
      寫進你的 JPEG 還是丟掉，你自己定。這個倉庫裡沒有哪個統計事件會帶上\
      檔名、日期、座標或者數量。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google，捐助按鈕來自 Buy Me a Coffee。關於你\
      照片的資訊，一條都沒給它們。讀檔案、解碼、寫檔案的每一行程式碼都從本站\
      發出，也都擺在倉庫裡。"""

[[privacy]]
title = "斷網照樣能用。"
body = """\
      把頁面開一次，然後斷網，這個工具跟原來一模一樣，解碼器也一起快取下來\
      了。這是最省事的一條證明，在這個頁面上還格外有分量。一個把照片送出去\
      解碼的轉換器，絕無可能做到這一點。"""

[[howto]]
title = "選好你的 HEIC 照片。"
body = """\
      拖到下面的方框裡，或者點開自己挑，直接從手機備份、桌面資料夾裡選都行。\
      瀏覽器直接從你的硬碟上讀，這期間沒有東西發出去。列表會寫明每一張是\
      什麼，裡面有些什麼。"""

[[howto]]
title = "看看這些照片都帶著什麼。"
body = """\
      每一行寫出拍攝日期、相機型號，還有這個檔案裡有沒有 GPS 座標，最後這項\
      用綠色標出來，因為它才是值得留神的。這些不用解碼畫面，直接從容器裡讀，\
      所以不花什麼代價，也立刻就有。"""

[[howto]]
title = "選格式，再定那些細節。"
body = """\
      沒有特別理由就選 JPEG。轉換圖的本來就是到哪裡都打得開。品質滑塊停在
      92，這一檔上照片很難跟原圖區分開。那個勾選框決定日期、相機和位置要不要\
      一起帶過去。"""

[[howto]]
title = "按「轉換」，然後下載。"
body = """\
      解碼器在第一次轉換時到位，大約 1.4 MB，只這一次。之後每張照片都在你\
      自己的機器上解碼、寫出。一個檔案給你一個下載按鈕，多個檔案另外給你一個
      zip。"""

[[faq]]
q = "我的照片會傳到什麼地方去嗎？"
a = """
        不會。讀取、解碼、寫出，全由你自己的瀏覽器在你自己的硬體上完成。這個\
        工具沒有任何聯網功能，不取東西，也不發東西。頁面的\
        <code>Content-Security-Policy</code> 把它可能聯的地址全列了出來，\
        沒有一個是本站的。確實會載入的只有解碼器，它來自本站，只載入一次，\
        而且發生在你的照片被牽扯進來之前。"""

[[faq]]
q = "為什麼第一次開啟要下載 1.4 MB？"
a = """
        因為 HEIC 是瀏覽器唯一打不開的圖片格式。它是裝在盒式容器裡的一幀
        HEVC，只有蘋果裝置上的 Safari 有解碼器，Chrome、Firefox 和 Edge 乾脆\
        不認這個檔案。所以 HEIC 轉換器總得從某處弄個解碼器來，能放的地方只有\
        兩個，伺服器或者這個頁面。別人都選了伺服器，這就是它們個個要你上傳\
        照片的原因。這一個改成內建一份編譯成 WebAssembly 的\
        <code>libheif</code>。它從本站發出，第一次訪問之後就有快取。你的照片\
        哪裡也不去，代價就是這 1.4 MB，僅此而已。"""

[[faq]]
q = "轉出來的 JPEG 還保留拍攝日期、相機和位置嗎？"
a = """
        你要它留就留，頁面上有個勾選框。開著的時候，EXIF 塊從 HEIC 裡原樣\
        複製出來，按手機寫的樣子寫進 JPEG，所以轉換後的照片仍然按拍攝那天\
        排序，而不是按轉換那天。大家抱怨 HEIC 轉換器的，正是這一點。只有一個\
        標籤會改，就是方向。它被設成「正立」，因為旋轉已經作用在畫素上了，\
        看圖軟體要是再轉一次，每一張直幅構圖都得躺下。把勾選框關掉，出來的
        JPEG 裡只剩畫面。"""

[[faq]]
q = "它會去掉 GPS 座標嗎？"
a = """
        它先告訴你座標在那裡，然後照你說的辦。還沒開始轉，每張照片那一行就\
        已經寫明檔案裡有沒有座標，這一步比手機做得多。取消勾選「保留日期、\
        相機和引數」，座標跟別的一切一起被擋在 JPEG 之外；勾著，它們就跟過去。\
        想逐條細看那些標籤，或者把已經是 JPEG 的照片裡的標籤清掉，那是\
        <a href="../exif-editor/">EXIF 檢視與清除</a>做的事，而且它不重新壓縮\
        畫面。"""

[[faq]]
q = "畫面會重新壓縮嗎？"
a = """
        會，而且非壓不可。HEIC 和 JPEG 是兩種編碼，從一種到另一種，只能把\
        畫面解開再編一遍。你能拿捏的是這一下的代價有多大。品質滑塊預設 92，\
        這一檔上照片非常難跟原圖區分開。要是一點損失都不想要，又不介意檔案\
        大上五到十倍，選單裡還有 PNG。"""

[[faq]]
q = "檔名叫 .jpg，其實是 HEIC，怎麼辦？"
a = """
        照樣能用。拖進來的檔案按開頭那幾個位元組判斷，不按名字。名字取決於最後\
        碰過它的那個應用怎麼叫它，而一個名叫「.jpg」的 HEIC，正是大家跑來找\
        這類工具的常見原因之一。真的是 JPEG 或者 PNG 的檔案會被擋下來，並\
        告訴你它其實是什麼，不會被轉成一份自己的副本。"""

[[faq]]
q = "Live Photo 或者連拍能轉嗎？"
a = """
        裡面的靜態畫面能轉。一個 HEIC 可以裝不止一張畫面，裝幾張就轉幾張，\
        按原檔名加編號命名。Live Photo 的影片那一半，是手機擱在 HEIC 旁邊\
        的另一個檔案，不在這裡，也就無從轉起。深度圖和縮圖在容器裡，但不是\
        誰想要的畫面，原樣留著不動。"""

[[faq]]
q = "為什麼它不收我的 AVIF？"
a = """
        因為沒什麼可做的。AVIF 和 HEIC 是同一種容器，只是裡面裝的是 AV1 而不\
        是 HEVC，現在的瀏覽器個個都能原生解碼。為它多下載 1 MB 的引擎，是在解決\
        一個你根本沒有的問題。真要把 AVIF 變成 JPEG，\
        <a href="../compress-image/">圖片壓縮</a>和\
        <a href="../resize-image/">圖片縮放</a>都能用瀏覽器內建的解碼器讀
        AVIF、寫 JPEG。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。檔案的數量和大小\
        同樣沒有上限，因為沒有哪臺伺服器在為它們掏錢，工作是在你自己的機器上\
        乾的。本站帶廣告，經費就是這麼來的，廣告拿不到關於你照片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能，連解碼器一起。頁面開一次之後斷網，它照樣處理你的照片，跟之前沒有\
        區別。這也是「什麼都沒上傳」最有分量的證明。一個把 HEIC 送出去解碼的\
        轉換器，拔線那一刻就停了，這一個不會。"""

