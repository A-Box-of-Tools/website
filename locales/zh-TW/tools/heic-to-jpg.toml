title = "HEIC 轉 JPG 線上轉換 | 免費，不用上傳"
description = "在瀏覽器裡把 iPhone 的 HEIC 照片轉成 JPG。解碼器跑在你自己的機器上，不上傳，不註冊，斷網也能用，拍攝日期和相機資訊可以一起帶過去。"
og_title = "不上傳，也能把 HEIC 照片變成 JPG"
og_description = "一個不想要你照片的轉換器。HEIC 解碼器由這個頁面自己帶著，在你的機器上跑，照片從頭到尾沒離開過。"
og_image_alt = "HEIC 轉 JPG - iPhone 照片，換成什麼都打得開的格式"

pledge = """
    解碼這一步，在你自己的瀏覽器裡、用你自己的硬體完成。HEIC 是瀏覽器唯一\
    打不開的圖片格式，所以這個頁面把解碼器一併帶上了，大約 1.4 MB，從本站\
    發出，第一次訪問之後就有快取。別的 HEIC 轉換器為什麼個個要你上傳？因為\
    它們把編解碼器放在伺服器上，照片只能送過去。這個頁面把編解碼器放在了\
    這邊。頁面上根本沒有聯網功能，另一頭也沒有伺服器能接住照片。"""

live_hint = """
      別信我們嘴上說的。開啟開發者工具，盯著「網路」面板，轉一張照片試試。你\
      會看到頁面自己的檔案在載入，解碼器也在裡頭，但沒有一條請求帶著照片、\
      縮圖、檔名，或者你選中內容裡的任何一個位元組。嫌麻煩就把頁面開一次，\
      拔掉網線，照樣能把一整個資料夾轉完。"""

read_first = """\
      ，<code>src/heif.js</code> 裡是解碼器怎麼載入、允許做什麼，\
      <code>src/boxes.js</code> 裡是找出照片後設資料的容器解析，\
      <code>src/exif.js</code> 裡是這些後設資料進 JPEG 時的遭遇。引擎本身是\
      <code>vendor/libheif.js</code>，原樣未改，許可證就放在旁邊。"""

howto_heading = "HEIC 照片怎麼轉成 JPG"

card = """
            iPhone 拍的照片，換成什麼都打得開的格式。解碼在你自己的機器上，\
            不在誰的伺服器上。"""

