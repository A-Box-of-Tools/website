      四個人形都是公有領域的畫作，跟頁面其餘部分一樣從這個源提供——沒有圖示字型，\
      沒有 CDN，也沒有在你打字時從別人伺服器上拽下來的雪碧圖。斷網還能畫出圖，這也是\
