[[privacy]]
title = "連結不會把圖帶走。"
body = """\
      好幾個同類工具會把整份名單塞進位址列，好讓它能分享，而這就把每個名字和每個\
      身高，變成了連結經過的一切都會記下來的東西——聊天伺服器、郵件掃描器、某人的\
      瀏覽記錄。這個頁面的地址，在你打字的時候從不改變。"""

[[privacy]]
title = "PNG 是從螢幕上那份 SVG 做出來的。"
body = """\
      下載的東西不是第二次渲染，不會跟預覽對不上。同一份標記交給瀏覽器，畫到畫布上，\
      而這也是為什麼拔了網線照樣能做：裡面沒有字型要取，也沒有圖片要載入。"""

[[privacy]]
title = "你加進來的圖片在這裡讀，而且從不外發。"
body = """\
      檔案從不離開這個頁面——它用瀏覽器內建的 <code>FileReader</code> 讀進來，\
      解析成一份什麼都不執行的死文件。畫出來的並不是那個檔案：\
      <code>src/import-svg.js</code> 會照著一份只允許形狀和幾何的白名單，重新搭出一張新的圖，\
      於是指令碼、樣式表、字型、外鏈圖片，以及指向別的文件的引用，都會被留在原地，而不是跟著過來。\
      這一點要緊兩回，因為你下載的圖是一個會發給別人的檔案：任何能活下來的東西，都會變成幾天之後，\
      別人的瀏覽器從這個頁面寫出來的東西裡，去請求一臺陌生的伺服器。

      照片或 PNG 不是程式，也沒有什麼可重建的：瀏覽器內建的解碼器讀它，上圖之前先在這裡重畫到一塊畫布上。正是這一遍重畫，把檔案裡的後設資料留在了外面——相機、地點、色彩配置，不管裡面原來有什麼——因為這些沒有一樣能穿過畫布。最後進到圖裡的，是這個頁面自己編碼出來的一張圖片，寫進去的是資料而不是地址，所以這張圖仍然不指向任何地方。"""

[[privacy]]
title = "畫就在這裡，不是去取來的。"
