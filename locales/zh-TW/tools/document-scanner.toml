title = "你的文件沒有地方可去。"
body = """
 Content-Security-Policy 裡寫著這一頁能\
      聯絡的每一個地址，沒有一個屬於本站。這裡沒有一個能收集你照片的介面，就算有，\
      程式碼裡也沒有任何東西會把它們送出去。"""

[[privacy]]
title = "根本沒有模型，所以既不用下載，也不用問誰。"
body = """
 找出一張紙的四個角靠的是\
      算術：影象的梯度，對其中直線的一次投票，再檢查勝出那個四邊形的每條邊下面\
      到底有什麼。沒有權重，沒有推理執行時，第一次用時也不去取任何東西，更沒有\
