features = [
  "按排版找出欄位，沒有按銀行分的模板",
  "拿對帳單自己印的餘額核對每一行",
  "把折行的摘要並回它所屬的那筆交易",
  "丟掉重複的表頭、頁碼和結轉合計",
  "日期寫成 YYYY-MM-DD，金額寫成帶正負號的普通數字",
  "認得 1.240,00 和 1,240.00，有歧義的日期從檔案本身來定",
  "掃描檔或者帶密碼的對帳單會直說，並告訴你可以怎麼辦",
  "斷網可用；不上傳、不註冊、不限檔案大小",
]

