[[privacy]]
title = "人們拿來轉換的 PDF，恰恰是最經不起上傳的那些。"
body = """\

      沒有人會為一張自己能重新敲一遍的表去找轉換工具。來到這裡的是對帳單、發票、\
      工資條和報告：一份你付給了誰、付完還剩多少的名單，一位客戶的報價，一家公司的\
      數字。把這些交給陌生人的伺服器去換一張表格，意味著他們拿到了、留下了，並且\
      因此成了一個值得攻擊的目標。這一頁沒有另一頭：根本沒有可以發過去的地方。"""

[[privacy]]
title = "表格帶著餘額的時候，每一行都會拿它核對。"
body = """\

      在 PDF 裡找出一張表是推斷，不是閱讀：哪幾行屬於一起、一欄在哪裡結束、一行是\
      新的一行還是上一行的延續，都是推斷。碰上這裡沒見過的排版，任何一步都可能推錯。\
      對帳單上的餘額就是對付這件事的證明：這一行的餘額，必須等於上一行的餘額加上這\
      一行的金額，任何一個數字讀錯、任何一行漏掉或者重複，都會正好在出問題的那一行\
      把這條鏈子打斷。頁面會說有多少行對上了。大多數表格沒有餘額，這時頁面什麼都\
      不說：這些行是頁面上寫的內容，這裡不會聲稱比這更多。"""

[[privacy]]
title = "表格是從紙面上看出來的，不是靠每家銀行、每種表單一套模板。"
body = """\

      這個工具裡沒有銀行列表，也沒有版式列表，也就不存在「你的版式不在裡面」。一頁\
      紙會在旁邊有一欄小字的地方被分開，然後在每一塊裡找那些單元格對得齊的連續幾行。\
      所以它在一家沒人聽說過的銀行的對帳單上、在一份沒人見過的報告上也能用，而碰上\
      欄與欄真的擠在一起的那種表，它也真的會失敗。"""

[[privacy]]
title = "密碼不由它來取，頁面會告訴你去哪裡取。"
body = """\

      帶密碼的 PDF 會被拒絕，而不是被開啟。把一份檔案的保護取掉，跟讀出裡面的表格\
      是兩回事，一聲不響地替你做掉，是一個工具不該有的舉動。頁面做的是另一件事：把\
      那些不用把檔案交出去的辦法列給你。頭一條是本站的 \
      <a href=\"../unlock-pdf/\">PDF 解鎖工具</a>，它在你自己的瀏覽器裡把密碼取\
      下來，頁面上什麼都不改寫；也可以用瀏覽器或者「預覽」把它列印、匯出成一份新的 \
      PDF。它仍然明明白白地說，不要把這份檔案交給別的任何一個說能替你解鎖的網站，\
      那正是這一頁要擋住的那一次上傳。"""

[[privacy]]
title = "它讀不了一頁紙的照片，也不假裝能讀。"
body = """\

      掃描檔是一張圖：那些行是畫素，檔案裡根本沒有可以對齊成欄的文字。這一點會被\
      如實報告，同時給出不用上傳任何東西的幾條路；如果那是一份對帳單，頭一條是大多數\
      人都有、卻想不起來的那條，銀行幾乎一定可以直接給你同一份對帳單的 CSV。從圖裡\
      認字叫 OCR，那是另一個工具，不是這一個。"""

[[privacy]]
title = "Google 載入了什麼，又沒拿到什麼。"
body = """\
 廣告和統計指令碼來自 Google。這兩個都沒有拿到關於你檔案的\
      任何東西：不是檔案，不是某張表、某一行，不是某個數字、檔名或者頁數。每一行\
      讀 PDF 或者寫 CSV 的程式碼都由這個源站發出，並且列在程式碼儲存庫裡。"""

[[privacy]]
title = "打賞按鈕載入了什麼，又沒拿到什麼。"
body = """\

      頁首上那個「Buy me a coffee」按鈕，是由 cdnjs.buymeacoffee.com 的一段指令碼\
      畫出來的，字型取自 Google Fonts。它就是一個連結，僅此而已：它不上報訪問，\
      也拿不到任何關於你或者你檔案的東西。你不點它就什麼都不會發生，而點下去\
      要去的是別人的網站。"""

[[privacy]]
title = "斷網也能用。"
body = """\
 把網路斷掉，這一頁上的所有功能照常。這是最簡單的一個\
      證明：一個把你的檔案發出去轉換的工具，這時候就停了。"""

[[howto]]
title = "選一份 PDF。"
body = """\
 一次一份。瀏覽器直接從你的硬碟上把它讀進來，\
      而且是整份都讀完再決定任何事，因為這份檔案寫的是 1.240,00 還是 1,240.00、\
      日期是哪一種順序，都是關於這份檔案的事實，不是關於某一頁的。"""

[[howto]]
title = "看看它找出來的那些表。"
body = """\
 每一頁上的每一張表，各有各的欄位，頁面上印了\
      表頭的地方就用它自己的表頭。跨兩個小節或者兩頁、表頭相同的一張表算一張，中間\
      不會重複表頭。折到第二行的單元格會並回它那一行。合計、小計和標籤，都按它們在\
      頁面上的樣子作為行出來。"""

[[howto]]
title = "挑一張，或者全要。"
body = """\
 表不止一張的時候，表格上方那個選項決定哪些進 \
      CSV：全部一張接一張，或者只要你來找的那一張。要是某張錶帶著餘額，表格上方那\
      一行會說每一行是不是都對上了。帶年份的日期寫成 YYYY-MM-DD，金額是帶正負號的\
      普通數字；沒有年份的日期原樣保留，因為它屬於哪一年只能靠猜。"""

[[howto]]
title = "把 CSV 拿走。"
body = """\
 它按 RFC 4180 寫，該加的引號都加，行尾是 \
      CRLF，編碼是帶位元組序標記的 UTF-8，這樣 Excel 開啟它的時候貨幣符號還是貨幣\
      符號，而不會變成一串字母。所有表放在一個檔案裡的時候，每張表保留自己的表頭行，\
      表與表之間空一行。做出它來沒有上傳過任何東西。"""

[[faq]]
q = "PDF 裡根本沒有表格，它怎麼找出表格來？"
a = """
        從文字落在哪裡看出來。一頁紙先在旁邊有一欄小字的地方被分開；這一欄小字跟\
        表格裡的一欄分得開，是因為表格的單元格恰好落在同一條基線上，而小字只是碰巧\
        挨在旁邊。然後每一塊從上往下走，在標題和空白處切成一段一段，每一段的欄位，\
        就是好幾行都認同一個單元格在那裡開始或者結束的位置。欄位相同的幾段會重新拼成\
        一張表。這裡沒有按銀行或者按表單分的模板，所以也不存在哪種版式它沒學過。"""

[[faq]]
q = "它只能處理對帳單嗎？"
a = """
        不是。它一開始是個對帳單轉換工具，後來改成找出一份檔案裡的每一張表，因為頭\
        一份真正拿來試的對帳單隻有兩筆交易，卻有另外五張表，一個只要交易的工具在上面\
        什麼都沒找到。發票、價目表、時刻表、成績和報告，同樣都是表格。對帳單多出來的\
        是餘額，只要有，工具就拿它核對每一行。"""

[[faq]]
q = "摘要太長、一欄放不下的時候會怎麼樣？"
a = """
        它會被並回它那一行，而這正是大多數 PDF 轉 CSV 的結果沒法用的原因。只有一格\
        文字、緊挨著某一行的一行，就是那一行的單元格的延續；如果它離下面那一行更近，\
        就併到下面那一行裡，一段放在數值上方、太長而折行的標籤就是這麼印的。帶著不止\
        一格、或者帶著數字的一行，是它自己的一行。"""

[[faq]]
q = "它到底怎麼可能知道我的對帳單讀對了沒有？"
a = """
        因為大多數對帳單都帶著餘額，而餘額是一次證明，不是裝飾。如果每一行上印著的\
        餘額，確實等於上一行的餘額加上這一行的金額，那麼金額就讀對了、行就分對了，\
        而且沒有哪一行被漏掉或者算了兩遍，因為上面任何一種錯誤，都會正好在出錯的\
        那一行把鏈子打斷。工具在每一行上做這道減法，然後把結果告訴你。它找餘額\
        那一欄用的也是同一道算術，而不是去讀表頭，所以一張能透過的表，必然意味著\
        欄位也認對了。沒有餘額的表格沒法這樣核對，頁面也不會假裝核對過。"""

[[faq]]
q = "日期出錯了。03/04 是 3 月 4 日，不是 4 月 3 日。"
a = """
        改表格上方那個選項，全部立刻重算。純數字的日期確實有歧義，而工具是從這份\
        檔案本身來定它，不是從你所在的地區：只要這份檔案裡任何一處的日期有大於 \
        12 的那一位，僅這一行就把所有日期的順序定下來了，頁面也會說明這一點。當\
        每一個日期都落在 12 號或者更早的時候，檔案裡沒有任何東西能把兩種順序分開，\
        所以它會說的正是<em>這件事</em>，並且先按日在前來算，直到你另行指定。像\
        信用卡對帳單那樣不帶年份印出來的日期，原樣保留。"""

[[faq]]
q = "掃描出來的 PDF 能用嗎？"
a = """
        不能，而且它會直說，而不是丟給你一個空檔案。掃描檔是一張照片：那些行是\
        畫素，沒有可以對齊的文字。頁面接著會告訴你可以怎麼辦；如果是對帳單，頭一條\
        建議正是大多數人會忽略的那條，幾乎每一家網上銀行都可以直接給你同一份對帳單\
        的 CSV、OFX 或者 QIF，那既不用轉換，也比從任何一張圖裡讀出來更準確。"""

[[faq]]
q = "帶密碼的 PDF 它能開啟嗎？"
a = """
        不能，而且這是故意的。銀行會給很多對帳單上鎖，通常用出生日期或者帳號的後\
        幾位。把這層保護取掉，跟讀出一張表是兩回事，所以工具會拒絕，並且指給你幾條\
        不用把檔案交出去的路。最好的一條是本站的 \
        <a href=\"../unlock-pdf/\">PDF 解鎖工具</a>：它在你自己的瀏覽器裡把密碼\
        取下來，頁面上一個字都不改寫，所以文字會原樣落在它當初被印上去的位置。\
        用 Chrome 或者 Edge 輸入密碼開啟再列印回 PDF，或者在 Mac 上用「預覽」\
        匯出，也一樣可以。不要用別的那些說能替你解鎖的網站，那正是把這一頁存在的\
        意義所要擋住的那份檔案傳上去。"""

[[faq]]
q = "我的 PDF 會被上傳到什麼地方嗎？"
a = """
        不會。檔案是你自己的瀏覽器在你自己的硬體上讀的，CSV 也是這樣寫出來的。\
        這個工具沒有伺服器那一端，頁面的 <code>Content-Security-Policy</code> 列出了\
        它可以聯絡的每一個地址，其中沒有一個屬於本站。最簡單的證明，是斷開網路，\
        照樣轉一份 PDF。"""

[[faq]]
q = "CSV 開頭那個奇怪的字元是什麼？"
a = """
        那是位元組序標記，是故意留的。Windows 上的 Excel 讀一個沒有它的 CSV 時，會\
        按系統的舊內碼表來解，於是一張以英鎊或者歐元記帳的表格，貨幣符號會變成\
        一個字母。這個標記告訴它這是 UTF-8。所有要緊的讀取程式都會悄悄跳過它；\
        嚴格到會把它顯示出來的解析器，會給你一個開頭帶著不可見字元的首列表頭，\
        這就是這個取捨的代價。"""

[[faq]]
q = "有大小限制嗎？要錢嗎？"
a = """
        工具裡沒有寫死任何限制。限制是你自己的機器：檔案在讀的時候是放在記憶體裡的，\
        幾百頁的量，一臺筆記本處理起來不會有怨言。它是免費的，不註冊、不登入，也\
        沒有試用期。本站帶廣告，那是養活它的東西；廣告拿不到任何關於你檔案的內容。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。把頁面載入一次，然後斷開網路，它照樣能用。這也是證明什麼都沒被上傳的\
        最簡單的辦法：一個把你的檔案發出去轉換的工具，你一拔網線它就停了。"""

