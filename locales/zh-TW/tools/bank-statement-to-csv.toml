[words]
plural = "對帳單"
choose = "一份對帳單"
analytics_extra = """，你的餘額、你的收款方、\
  以及那些行裡寫了什麼，一樣都不會"""

[[facts]]
text = "不上傳"

[[facts]]
text = "不註冊"

[[facts]]
text = "斷網可用"

[[facts]]
text = "開源"

[[facts]]
text = "檔案留在你的裝置上"

[[privacy]]
title = "對帳單是最經不起上傳的一種檔案。"
body = """\

      它是一份名單：你付給了誰、為什麼付、什麼時候付、付完還剩多少，頂上還寫著\
      你的帳號。把這些交給陌生人的伺服器去換一張表格，意味著他們拿到了、留下了，\
      並且因此成了一個值得攻擊的目標。會計事務所自己的客戶資料規定就不允許這麼做，\
      所以這個領域裡收費的工具，廣告詞講的是「在瀏覽器裡」而不是「轉換」。這一頁\
      沒有另一頭：根本沒有可以發過去的地方。"""

[[privacy]]
title = "它會核對自己的結果，核不了的時候也會告訴你。"
body = """\

      在 PDF 裡找出一張表是推斷，不是閱讀，哪一條紙面是欄與欄之間的空白、折下來的\
      那一行屬不屬於上面那筆，都是推斷。碰上這裡沒見過的排版，任何一步都可能推錯。\
      所以只要你的對帳單印了餘額，每一行都會拿它驗一遍：這一行的餘額，必須等於\
      上一行的餘額加上這一行的金額，任何一個數字讀錯、任何一行漏掉或者重複，都會\
      正好在出問題的那一行把這條鏈子打斷。頁面會說有多少行對上了。沒有餘額那一欄\
      的時候，它就直說，而不是讓你以為這些行已經驗過。"""

[[privacy]]
title = "欄位是從紙面上看出來的，不是靠每家銀行一套模板。"
body = """\

      這個工具裡沒有銀行列表，也就不存在「你的銀行不在裡面」。一份對帳單的欄位，\
      是把每一頁每一行都投影到橫軸上，再找出那些從來沒印過東西的窄條，也就是讓你\
      能看懂這一頁的同一批空白。所以它在一家沒人聽說過的銀行的對帳單上也能用，\
      而碰上欄與欄真的擠在一起的那種，它也真的會失敗。"""

[[privacy]]
title = "密碼不會被它取下來，頁面會告訴你自己怎麼取。"
body = """\

      帶密碼的對帳單會被拒絕，而不是被開啟。把一份檔案的保護取掉，跟從裡面讀出\
      一張表是兩回事，一聲不響地替你做掉，是一個工具不該有的舉動。頁面做的是另一件\
      事：告訴你在自己機器上做一份沒有密碼的副本的兩種辦法，用瀏覽器列印回 PDF，\
      或者從「預覽」裡匯出，並且明明白白地說，不要把它交給一個說能替你解鎖的網站。"""

[[privacy]]
title = "它讀不了對帳單的照片，也不假裝能讀。"
body = """\

      掃描檔是一張圖：那些行是畫素，檔案裡根本沒有可以對齊成欄的文字。這一點會被\
      如實報告，同時給出不用上傳任何東西的幾條路，頭一條是大多數人都有、卻想不起來\
      的那條，銀行幾乎一定可以直接給你同一份對帳單的 CSV。從圖裡認字叫 OCR，那是\
      另一個工具，不是這一個。"""

[[privacy]]
title = "Google 載入了什麼，又沒拿到什麼。"
body = """\
 廣告和統計指令碼來自 Google。這兩個都沒有拿到關於你對帳單的\
      任何東西：不是檔案，不是某一行，不是收款方、金額、餘額、檔名或者頁數。\
      每一行讀 PDF 或者寫 CSV 的程式碼都由這個源站發出，並且列在程式碼儲存庫裡。"""

[[privacy]]
title = "打賞按鈕載入了什麼，又沒拿到什麼。"
body = """\

      頁首上那個「Buy me a coffee」按鈕，是由 cdnjs.buymeacoffee.com 的一段指令碼\
      畫出來的，字型取自 Google Fonts。它就是一個連結，僅此而已：它不上報訪問，\
      也拿不到任何關於你或者你對帳單的東西。你不點它就什麼都不會發生，而點下去\
      要去的是別人的網站。"""

[[privacy]]
title = "斷網也能用。"
body = """\
 把網路斷掉，這一頁上的所有功能照常。這是最簡單的一個\
      證明：一個把你的對帳單發出去轉換的工具，這時候就停了。"""

[[howto]]
title = "選一份對帳單。"
body = """\
 一次一份 PDF。瀏覽器直接從你的硬碟上把它\
      讀進來，而且是整份都讀完再決定任何事，因為這份對帳單寫的是 1.240,00 還是 \
      1,240.00、日期是哪一種順序，都是關於這份檔案的事實，不是關於某一頁的。"""

[[howto]]
title = "看看它推出來的那張表。"
body = """\
 欄位按文字落在哪裡找出來，\
      對帳單自己印了表頭的地方就用它自己的表頭，折行的摘要並回上面那一行，頁碼、\
      重複的表頭和結轉合計都不要。日期統一成 YYYY-MM-DD，金額是帶正負號的普通\
      數字，這是表格軟體要的樣子；其餘每一欄都原樣保留頁面上的寫法。"""

[[howto]]
title = "讀表格下面那一行，那才是重點。"
body = """\

      如果你的對帳單印了餘額，工具剛剛已經拿它把每一行都核過一遍，並且會說有多少行\
      對上了。那一行字比讀這張表本身更有價值：它是「看起來沒問題的行」和「被證明過的\
      行」之間的差別。要是日期的順序反了，表格上方那個選項一改，全部重算。"""

[[howto]]
title = "把 CSV 拿走。"
body = """\
 它按 RFC 4180 寫，該加的引號都加，行尾是 \
      CRLF，編碼是帶位元組序標記的 UTF-8，這樣 Excel 開啟它的時候貨幣符號還是貨幣\
      符號，而不會變成一串字母。做出它來沒有上傳過任何東西。"""

[[faq]]
q = "頁面上一條線都沒有，它怎麼知道欄位在哪？"
a = """
        從空白看出來的。每一頁的每一行都被投影到橫軸上，那些在幾乎所有行裡都保持\
        空著的窄條，就是欄與欄之間的空隙，也正是這一頁對人來說能看懂的原因。字號跟\
        正文不一樣的行，比如標題或者很大的頁碼，不參與這次測量，否則一個橫跨所有\
        欄位的標題就會把它底下的空隙全抹掉。這裡沒有按銀行分的模板，所以也不存在\
        哪一家銀行它沒學過。"""

[[faq]]
q = "摘要太長、一欄放不下的時候會怎麼樣？"
a = """
        它會被並回上面那一行，而這正是大多數 PDF 轉 CSV 的結果沒法用的原因。一個\
        折到第二行的收款方，旁邊既沒有日期也沒有金額，所以一個把每一行都當成一筆\
        交易的程式，會產出一行空了一半的記錄，外加一行少了半截摘要的記錄。在這裡，\
        沒有日期也沒有金額的一行是續行，會接到它所屬的那筆交易上；有金額但沒有日期\
        的一行是結轉合計，會被丟掉。"""

[[faq]]
q = "它到底怎麼可能知道我的對帳單讀對了沒有？"
a = """
        因為大多數對帳單都帶著餘額，而餘額是一次證明，不是裝飾。如果每一行上印著的\
        餘額，確實等於上一行的餘額加上這一行的金額，那麼金額就讀對了、行就分對了，\
        而且沒有哪一行被漏掉或者算了兩遍，因為上面任何一種錯誤，都會正好在出錯的\
        那一行把鏈子打斷。工具在每一行上做這道減法，然後把結果告訴你。它找餘額\
        那一欄用的也是同一道算術，而不是去讀表頭，所以一份能透過的對帳單，必然\
        意味著欄位也認對了。"""

[[faq]]
q = "我的對帳單沒有餘額那一欄怎麼辦？"
a = """
        那你會拿到這些行，外加一句話，明說沒有任何東西可以拿來核對它們。這是故意的。\
        這些行仍然是頁面上寫的內容，仍然值得拿走，但是在沒有東西驗過它們的時候管它們\
        叫「已驗證」，會訓練你在那些真的有意義的對帳單上，也不再看那一行字。"""

[[faq]]
q = "日期出錯了。03/04 是 3 月 4 日，不是 4 月 3 日。"
a = """
        改表格上方那個選項，全部立刻重算。純數字的日期確實有歧義，而工具是從這份\
        檔案本身來定它，不是從你所在的地區：只要這份對帳單上任何一處的日期有大於 \
        12 的那一位，僅這一行就把所有日期的順序定下來了，頁面也會說明這一點。當\
        每一個日期都落在 12 號或者更早的時候，檔案裡沒有任何東西能把兩種順序分開，\
        所以它會說的正是<em>這件事</em>，並且先按日在前來算，直到你另行指定。"""

[[faq]]
q = "掃描出來的對帳單能用嗎？"
a = """
        不能，而且它會直說，而不是丟給你一個空檔案。掃描檔是一張照片：那些行是\
        畫素，沒有可以對齊的文字。頁面接著會告訴你可以怎麼辦，頭一條建議正是大多數\
        人會忽略的那條，幾乎每一家網上銀行都可以直接給你同一份對帳單的 CSV、OFX \
        或者 QIF，那既不用轉換，也比從任何一張圖裡讀出來更準確。"""

[[faq]]
q = "帶密碼的對帳單它能開啟嗎？"
a = """
        不能，而且這是故意的。銀行會給很多對帳單上鎖，通常用出生日期或者帳號的後\
        幾位。把這層保護取掉，跟讀出一張表是兩回事，所以工具會拒絕，並且告訴你怎麼\
        自己做一份沒有密碼的副本：用 Chrome 或者 Edge 輸入密碼開啟它，再列印回 \
        PDF；或者在 Mac 上用「預覽」匯出。兩種都完全在你自己的機器上完成。不要用\
        那些說能替你解鎖的網站，那正是把這一頁存在的意義所要擋住的那份檔案傳上去。"""

[[faq]]
q = "我的對帳單會被上傳到什麼地方嗎？"
a = """
        不會。檔案是你自己的瀏覽器在你自己的硬體上讀的，CSV 也是這樣寫出來的。\
        這個工具沒有伺服器那一端，頁面的 <code>Content-Security-Policy</code> 列出了\
        它可以聯絡的每一個地址，其中沒有一個屬於本站。最簡單的證明，是斷開網路，\
        照樣轉一份對帳單。"""

[[faq]]
q = "CSV 開頭那個奇怪的字元是什麼？"
a = """
        那是位元組序標記，是故意留的。Windows 上的 Excel 讀一個沒有它的 CSV 時，會\
        按系統的舊內碼表來解，於是一份以英鎊或者歐元記帳的對帳單，貨幣符號會變成\
        一個字母。這個標記告訴它這是 UTF-8。所有要緊的讀取程式都會悄悄跳過它；\
        嚴格到會把它顯示出來的解析器，會給你一個開頭帶著不可見字元的首列表頭，\
        這就是這個取捨的代價。"""

[[faq]]
q = "有大小限制嗎？要錢嗎？"
a = """
        工具裡沒有寫死任何限制。限制是你自己的機器：對帳單在讀的時候是放在記憶體裡的，\
        幾百頁的量，一臺筆記本處理起來不會有怨言。它是免費的，不註冊、不登入，也\
        沒有試用期。本站帶廣告，那是養活它的東西；廣告拿不到任何關於你對帳單的\
        內容。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。把頁面載入一次，然後斷開網路，它照樣能用。這也是證明什麼都沒被上傳的\
        最簡單的辦法：一個把你的對帳單發出去轉換的工具，你一拔網線它就停了。"""

