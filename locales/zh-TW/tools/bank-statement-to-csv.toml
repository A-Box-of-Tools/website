#
# PDF to CSV - 繁體中文。
#
# Overrides for tools/bank-statement-to-csv/tool.toml. Only words: the slug,
# the category, the icon, the CSP and the list of shared parts stay where they
# are.
#
# 改這一頁的話術時要守住的一件事：這個工具是「推斷」出表格，不是「讀」出表格。
# PDF 裡根本沒有表格，只有落在紙面各個位置上的文字，欄位是好幾行都認同一個單元格
# 在那裡開始或者結束的位置。下面每一句話都必須讓這一點成立。餘額核對是一次證明，
# 也照證明來寫，但只有一部分表格帶著餘額；不要在改寫裡把「這是頁面上寫的內容」
# 悄悄升級成「這是對的」。
#
# 它原來是「對帳單轉 CSV」，後來改成找出一份 PDF 裡的每一張表：頭一份真正拿來試
# 的對帳單隻有兩筆交易，卻有另外五張表。名字因此改成「PDF 轉 CSV」；「對帳單」仍
# 是本站對 bank statement 的說法，只在說到對帳單本身的地方用。
#
# [[faq]] 是按順序跟英文一一對應的，不是按 id。英文加一條、刪一條，這裡就要在同一
# 個位置加、刪，否則後面每一個問題都會配上別的問題的答案。
#

