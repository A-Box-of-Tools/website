description = "把 PDF 對帳單變成表格軟體打得開的 CSV。欄位是按文字落在紙上的位置推出來的，折行的摘要會並回它那一行，然後每一行都拿餘額驗一遍。什麼都不上傳。"
og_title = "對帳單 PDF 轉 CSV，不用把對帳單交出去"
og_description = "轉一份對帳單，通常意味著把你的帳目歷史交給別人的伺服器。這個工具在你的瀏覽器裡跑，而且拿餘額自己核對，不用你來核。"
og_image_alt = "在瀏覽器裡把對帳單 PDF 轉成 CSV"

pledge = """
    你選的那份對帳單，是在這臺機器的記憶體裡開啟、讀取的，用的是從這個地址發來的\
    程式碼，CSV 也是這樣寫出來的。這裡根本沒有能做上傳的東西，這一頁的另一頭也沒有\
    伺服器可以接收。你的帳號、你的餘額、上面每一個收款方，都留在這個分頁裡。"""

live_hint = """
      別聽我們說。開啟開發者工具，盯著網路面板，然後轉一份對帳單。沒有任何一條\
      請求帶著某一頁、某一行、某一筆金額或者檔名。或者乾脆斷網，照樣能轉。"""

read_first = """
，一道道欄在沒有任何表格線可依的情況下是\
      怎麼找出來的，看 <code>src/layout.js</code>；哪些行算交易、哪些行被丟掉，看 \
      <code>src/rows.js</code>；證明這一切的那段算術在 <code>src/check.js</code>。\
      這幾個都夠不著網路，它們底下負責讀 PDF 的部分也一樣。"""

howto_heading = "怎麼把 PDF 對帳單轉成 CSV"

card = """
            把 PDF 對帳單變成表格。欄位按文字落在紙上的位置推出來，折行的摘要\
            放回它自己那一行，然後每一行都拿對帳單印著的餘額核一遍，所以讀得\
