#
# Bank statement PDF to CSV - 繁體中文。
#
# Overrides for tools/bank-statement-to-csv/tool.toml. Only words: the slug,
# the category, the icon, the CSP and the list of shared parts stay where they
# are.
#
# 改這一頁的話術時要守住的一件事：這個工具是「推斷」出一張表，不是「讀」出一張
# 表。PDF 裡根本沒有表格，只有落在紙面各個位置上的文字，那幾道欄是沒人印過的
# 空白。下面每一句話都必須讓這一點成立。工具給出的答案是餘額核對，那是一次證明，
# 也照證明來寫；統計單上沒有餘額可對的時候，頁面就直說，而不是暗示這些行已經
# 驗過了。不要在改寫裡把「這是頁面上寫的內容」悄悄升級成「這是對的」。
#
# 「對帳單」是本站對 bank statement 的說法；「流水」在中國大陸更口語，但它同時
# 指銀行流水單和帳目流水，寫進標題會含混，所以正文裡只在解釋「running balance」
# 的時候用「餘額」這個詞。
#

