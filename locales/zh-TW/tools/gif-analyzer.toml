      <code>src/gif.js</code> 走完所有塊，<code>src/lzw.js</code> 展開畫素，\
      <code>src/frames.js</code> 把它們疊起來，<code>src/budget.js</code> \
      再把各部分加回去，核對是否正好等於檔案大小。"""

