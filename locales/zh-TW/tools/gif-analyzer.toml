[[howto]]
title = "需要的話把報告帶走。"
body = """\
      整份分析的純文字，可以貼進訊息裡，也可以和檔案放在一起留著。它是在\
      頁面裡、用你螢幕上已有的內容拼出來的。"""

[[faq]]
q = "我的 GIF 會被傳到哪裡去嗎？"
a = """
        不會。檔案的讀取、解壓和繪製都由你自己的瀏覽器在你自己的硬體上完成。\
        這個工具沒有服務端，頁面的 <code>Content-Security-Policy</code> 裡\
        寫著它允許聯絡的每一個地址，沒有一個屬於本站。拔掉網線，它照樣分析 \
        GIF。"""

[[faq]]
q = "為什麼我的 GIF 播得比延時寫的還慢？"
a = """
        因為所有瀏覽器都拒絕照辦小於百分之二秒的延時，改成把那一幀停十分之\
        一秒。這條規則 1996 年寫進了 Netscape，是為當年那些轉動的地球和\
        「施工中」標牌準備的，此後被抄進了每一個瀏覽器，從來沒人刪掉。
        <br><br>
        所以一個每幀都寫著 0.01 秒的 GIF 並不會以每秒 100 幀播放，而是每秒 \
        10 幀，比做它的軟體所設想的慢五到十倍。這個頁面把兩個數字都擺出來，\
        檔案寫的和它實際會做的，並標出受影響的幀。要修，就在做這個檔案的\
        軟體裡把 0.01 寫成 0.02。"""

[[faq]]
q = "「處置方式」是什麼意思？"
a = """
        一幀的時間到了之後，螢幕上要留下什麼。動畫看起來正常還是拖影，就由\
        這個欄位決定。
        <br><br>
        <strong>原樣留下</strong>意思是下一幀直接蓋在這一幀上，幀本身不透明、\
        彼此互相遮住時就該這麼做。<strong>清回背景</strong>會先把這一幀的矩形\
        擦乾淨，透明就需要它：不擦的話，下一幀透出來的部分會露出上一幀。\
        <strong>還原底下原有的內容</strong>把這一幀畫之前那裡的東西放回去，\
        靜止背景上一個小物體在動，就是這麼存的。至於<strong>未指定</strong>，\
        意思是檔案沒說，而所有檢視器都按「原樣留下」處理。"""

[[faq]]
q = "我的 GIF 為什麼這麼大？"
a = """
        「位元組去了哪裡」那張表針對你這個具體檔案回答，而不是泛泛而談，可能\
        的答案就那麼幾種。
        <br><br>
        要是幾乎全在<strong>壓縮畫素</strong>裡，那這個檔案就是畫面本身太多：\
        GIF 把每一幀都當作完整畫素來存，沒有運動補償，也沒有畫質旋鈕，所以\
        體積大約就是面積乘幀數。減少幀數、縮小尺寸、減少顏色，就這三個把手。
        <br><br>
        要是一大塊在<strong>顏色表</strong>裡，說明檔案在給每一幀各寫一份調色\
        板，每份 768 位元組。要是一大塊在<strong>後設資料</strong>裡，那是某個編輯\
        軟體留下了 XMP 資料包，不動畫面就能刪掉。要是所有幀都覆蓋整個畫布，\
        說明編碼器壓根沒算過究竟哪一部分變了，而對拍攝或錄製來的內容來說，\
        那就是檔案的絕大部分。"""

[[faq]]
q = "兩種幀檢視有什麼區別？"
a = """
        <strong>每幀之後的畫布</strong>是檢視器在那一刻顯示的東西：這一幀畫在\
        前面幾幀留下的內容之上。<strong>每幀實際存下的內容</strong>是檔案為\
        這一幀真正儲存的那個矩形，單獨擺出來，底下什麼都不墊。
        <br><br>
        有意思的是後者。GIF 允許一幀只存畫面裡變了的那部分，所以一個幾乎不動\
        的視窗的錄屏可以很小。要是你檔案裡每一幀都是整塊畫布，那說明沒人做過\
        這件事，而且光看動畫是看不出來的，只有看存下來的內容才知道。"""

[[faq]]
q = "它說我的檔案裡有註釋或 XMP。那是什麼？"
a = """
        隨畫面一起走、但任何檢視器都不會畫出來的文字。註釋塊通常是寫出這個\
        檔案的軟體名。XMP 資料包是影像編輯軟體用來記錄自己做了什麼的 XML，\
        裡面可能有編輯歷史、軟體版本，有時還有作者名字。
        <br><br>
        這個頁面把兩者都完整列印出來，因為關於後設資料，值得關心的是它寫了\
        什麼，而不是它存在。這些只給你看，不給別人：這個儲存庫裡沒有任何東西\
        會把其中內容念給誰聽。"""

[[faq]]
q = "壞掉的 GIF 打得開嗎？"
a = """
        會試，並且會告訴你它在哪裡放棄了。檔案在某個塊中間斷掉、該出現塊\
        標記的位置換成了別的位元組、某一幀的壓縮資料提前用完，這些情況它照樣\
        會把那之前能讀出來的全部顯示出來，並把問題寫在最上面。分析器最派得\
        上用場的恰好就是這種時候，為了一個壞位元組把整個檔案丟掉，才是錯的。"""

[[faq]]
q = "它會改動我的檔案嗎？"
a = """
        不會。這個工具只讀。沒有輸出檔案，沒有重新編碼，這裡也沒有哪個按鈕\
        會寫出一個 GIF，你唯一能下載的是一份純文字的分析結果。你的原件在\
        磁碟上原封不動，這也是「關掉分頁會怎樣」的老實答案。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，也沒有試用期。除了你自己機器的記憶體之外，\
        檔案大小沒有上限。本站帶廣告，經費就是從那裡來的，廣告拿不到任何\
        關於你檔案的資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面載入一次之後斷開網路，它照樣運作。這也是證明「什麼都沒上傳」最\
        省事的辦法，真要把你的 GIF 送出去分析，拔線那一刻就停了。"""

