[[faq]]
q = "我的檔案會被上傳到什麼地方嗎？"
a = """
        不會。是你自己的瀏覽器從你的磁碟上讀，你自己的處理器按每次 4 MB 去算。\
        這個工具沒有服務端，頁面的 <code>Content-Security-Policy</code> 列出了\
        它可以連的每一個地址，沒有一個是我們的。斷開網路，它照樣能用。"""

[[faq]]
q = "有大小上限嗎？"
a = """
        沒有。檔案從不整個待在什麼地方：分塊讀，每一塊算過就丟掉，所以四十\
        吉位元組的磁碟映象和一個文字檔案用的是同樣的幾 MB 記憶體。要花的是時間，而\
        花多少，頁面會一邊跑一邊告訴你。
        <br><br>
        這也正是這些演算法寫在這裡、而不是交給瀏覽器的
        <code>crypto.subtle.digest</code> 的原因，儘管後者更快。那個呼叫要把整段\
        訊息放進一個緩衝區，沒有辦法把檔案分塊餵給它。用了它，能校驗的最大檔案\
        就要看這個分頁碰巧分到多少記憶體。在手機上那是幾百 MB，而人們最想校驗的\
        恰恰是磁碟映象。"""

[[faq]]
q = "校驗和對上了，這到底證明了什麼？"
a = """
        證明你磁碟上的這些位元組，就是某個人寫下那串數字時手邊的那些位元組。僅此\
        而已，而這條界線值得說清楚。
        <br><br>
        它證明了下載沒有被截斷、沒有被壞盤弄髒、沒有在路上被掉包。它\
        <strong>沒有</strong>證明這個檔案無害，因為釋出方量惡意軟體也一樣準。\
        而如果這串校驗和是和檔案從同一個頁面、同一條連線過來的，那它證明的東西\
        就很少了：能改掉其中一個的人，也能改掉另一個。校驗和最值錢的時候，是它\
        走的路和檔案不同的時候：一份帶簽名的 <code>SHA256SUMS</code>、發行版的\
        釋出公告、第二個映象，或者一個本來就知道這個值的包管理器。"""

[[faq]]
q = "對不上，那現在怎麼辦？"
a = """
        先從同一個地方重新下一次。斷掉或者續傳過的傳輸是遙遙領先的頭號原因，\
        第二份副本通常就把事情了結了。
        <br><br>
        如果第二份給出同樣錯誤的結果，檢查你比的是不是那一行：釋出頁面上會列好\
        幾個檔案，ARM 構建的校驗和永遠不會和 x86 的對上。然後檢查版本號。這些都\
        沒問題卻還是對不上，那就別開啟這個檔案。換一個映象取一份，把兩份的校驗和\
        彼此對一下。"""

[[faq]]
q = "我該用哪一種？"
a = """
        用釋出方公佈的那一種。這件事的意義就在於和他們的數字對照，而他們那一份\
        你替不了。
        <br><br>
        如果你是在產生校驗和而不是核對校驗和，用 SHA-256。MD5 和 SHA-1 在要緊的\
        那個意義上已經破了：可以刻意造出兩個不同卻同值的檔案，MD5 只要幾小時，
        SHA-1 也只要不算高的花費。這不等於它們對付意外也沒用了，畢竟一次截斷的\
        下載不會碰巧和原文同值；但它們確實不能再告訴你沒人動過手腳。SHA-384 和
        SHA-512 都很好，實際用起來也不見得更好；它們在這裡，是因為有些專案公佈\
        的是它們。"""

[[faq]]
q = "既然 MD5 破了，為什麼還留著？"
a = """
        因為印在頁面上的還是它。映象站、韌體下載、高校的軟體頁面，還有非常多\
        廠商的網站，二十年前放了一個 MD5 就再沒動過那一頁。一個拒絕計算它的工具，\
        等於拒絕回答訪客真正帶著來的那個問題。
        <br><br>
        它能做的是說清楚這個答案值多少，勾選框旁邊那一行就是在做這件事。對上的
        MD5 依然排除了一次損壞的下載，只是排除不了一次蓄意的調包。"""

[[faq]]
q = "比對框裡可以貼哪些格式？"
a = """
        常見的都行，而且是哪一種由頁面自己認出來。
        <br><br>
        光是十六進位，中間有沒有空格都行。<code>md5sum</code> 或
        <code>sha256sum</code> 的一行輸出，後面跟著檔名也行。整份四十行的
        <code>SHA256SUMS</code> 檔案也行，這時用的是寫著你這個檔名的那一行。
        BSD 那種寫法 <code>SHA256 (disk.iso) = &hellip;</code> 也行。前面帶標籤的
        <code>SHA-256: &hellip;</code> 也行。還有 subresource integrity 屬性
        <code>sha384-&hellip;</code>，那是 base64 而不是十六進位，比對前會先\
        解碼。
        <br><br>
        是哪種演算法由長度決定：32 個十六進位字元是 MD5，40 個是 SHA-1，64 個是
        SHA-256，96 個是 SHA-384，128 個是 SHA-512。沒有兩種長度相同，所以既沒有\
        什麼可選，也沒有什麼可選錯。"""

[[faq]]
q = "結果會和 sha256sum 或 certutil 一樣嗎？"
a = """
        一樣，一個位元組都不差。這些是有公開測試向量的嚴格規範，這裡的每一種演算法\
        在每次構建時都會拿那些向量和作業系統的實現兩頭核對。
        <br><br>
        唯一看得出的差別是顯示方式。Windows 的
        <code>certutil -hashfile</code> 用大寫並且帶空格，這個頁面用小寫，因為\
        幾乎所有釋出方用的都是小寫。比對時兩邊都不看大小寫和空格，所以從
        certutil 裡複製來的校驗和，和貼在這裡的小寫值一樣能對上。"""

[[faq]]
q = "可以把兩個檔案互相比對嗎？"
a = """
        可以，多一步而已：先校驗第一個檔案，複製它的校驗和，再選第二個檔案，把\
        那串校驗和貼進框裡。兩個檔案相同的話，頁面會告訴你。
        <br><br>
        這一手值得記住，因為校驗和最不動聲色也最擅長的正是這種場合：備份盤上的\
        那一份，究竟是不是筆記本上的同一個檔案，而兩邊都聲稱大小相同、日期\
        相同。"""

[[faq]]
q = "它會改動我的檔案嗎？"
a = """
        不會。這個工具只讀。沒有輸出檔案，沒有重新編碼，也沒有什麼會被寫回去：\
        唯一能下載的是一個列著校驗和的小文字檔案。你的原件原封不動地留在磁碟上，\
        這同樣是「關掉分頁會怎樣」這個問題的誠實答案。"""

[[faq]]
q = "免費嗎？要不要帳號？"
a = """
        免費，沒有帳號、沒有註冊、沒有試用期。檔案大小沒有上限，校驗多少個也沒有\
        上限。網站上有廣告，那是維持它的錢；廣告拿不到關於你檔案的任何東西。"""

[[faq]]
q = "斷網還能用嗎？"
a = """
        能。把頁面載入一次，然後斷開網路，它照樣工作。這也是證明什麼都沒有上傳\
        的最簡單辦法：一個把你的檔案發出去算的工具，會在你拔掉網線的那一刻停住。"""

