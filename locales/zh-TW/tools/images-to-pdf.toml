[[privacy]]
title = "你的圖片沒地方可去。"
body = """\
      Content-Security-Policy 把這個頁面允許聯的地址全列了出來，沒有一個是\
      本站的。這個工具沒往那份名單上添任何東西，因為它自己就沒有聯網功能，\
      連可選的都沒有。這裡沒有能收檔案的介面，程式碼裡也沒有一行會把檔案發\
      出去，就算真有那麼個介面也一樣。"""

[[privacy]]
title = "PDF 是在這裡寫出來的。"
body = """\
      一個 PDF 說白了就是一串物件，外加一張記著每個物件從哪裡開始的表，兩樣\
      都由 <code>src/shared/pdf-page-writer.js</code> 寫。沒有庫要去外面取，沒有哪一步在伺服器上\
      渲染，成品直接從記憶體交給下載。"""

[[privacy]]
title = "這個文件對你一無所知。"
body = """\
      多數工具會給 PDF 蓋上時間戳和自己的程式名。這一個只在你親手填了標題、\
      作者和日期時才寫這幾項，你圖片的檔名一個都不會出現在文件裡，關於你\
      這臺機器的資訊也一樣。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你圖片的資訊，一條都沒給它們，檔案\
      不給，縮圖不給，檔名、大小、數量也不給。讀圖、解碼、寫圖的每一行\
      程式碼都從本站發出，也都擺在儲存庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁頭那個「Buy me a coffee」按鈕，由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它就是個連結，僅此而已，不上報訪問，也拿不到\
      關於你或者你圖片的任何東西。你不點它，什麼都不會發生；點了，跳過去的\
      是別人的網站。"""

[[privacy]]
title = "斷網照樣能用。"
body = """\
      斷開網路，這個頁面上的一切照常工作。這是最省事的一條證明。一個把圖片\
      送出去做文件的工具，這時候就該停了。"""

[[howto]]
title = "選好你的圖片。"
body = """\
      把整個資料夾拖到下面的方框裡，或者一個個自己挑。瀏覽器直接從你的硬碟上\
      讀，這期間沒有東西發出去。"""

[[howto]]
title = "排好頁序，該轉的轉過來。"
body = """\
      一張圖一頁，順序就是你看到的順序。抓住卡片上的手柄拖動，或者按上面的\
      箭頭。旋轉按鈕一次轉九十度，橫著掃進來的那種一般就得這麼辦。"""

[[howto]]
title = "選頁面大小。"
body = """\
      「頁面跟著每張圖走」會讓每一頁正好等於那張圖，不裁邊，也沒有白框。選 A4、\
      Letter、Legal 這些固定尺寸，則是把每張圖擺到一張固定大小的紙上，要留邊\
      就留邊。"""

[[howto]]
title = "產生 PDF，然後下載。"
body = """\
      文件在你自己的機器上寫出來，所以快慢取決於你這臺機器，不取決於排隊。\
      成品直接交給瀏覽器的下載。"""

[[faq]]
q = "我的圖片會傳到什麼地方去嗎？"
a = """
        不會。讀圖和寫 PDF，全由你自己的瀏覽器在你自己的硬體上完成。這個工具\
        沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code> 把它可能\
        聯的地址全列了出來，沒有一個是本站的。跟這裡另外幾個工具不同，它連\
        可選的聯網功能都沒有。"""

[[faq]]
q = "轉成 PDF 會掉畫質嗎？"
a = """
        預設設定下，JPEG 不會。PDF 本來就能直接裝 JPEG 資料，所以照片是逐位元組\
        抄進文件的，不解碼，也不再壓一遍，PDF 裡那張圖就是檔案裡那張圖。別的\
        格式得重新編碼，因為 PDF 裡沒有對應的濾鏡可用，除非你選無損那一檔，\
        它照原樣存下來，代價是檔案更大。"""

[[faq]]
q = "支援哪些圖片格式？"
a = """
        你的瀏覽器能解碼的靜態圖都行，實際上就是 JPG、PNG、WebP、GIF、AVIF，\
        蘋果裝置上還包括 HEIC。這裡沒有另一份需要不斷維護的清單，因為解碼是\
        瀏覽器的工作，不是我們的。"""

[[faq]]
q = "頁面大小和頁序能自己定嗎？"
a = """
        能。頁面可以是 A4、Letter、Legal、A3、A5、Tabloid，也可以自己填一個\
        尺寸，或者乾脆等於每張圖本身。卡片拖著換順序，按名字或日期排序，任意\
        一張轉九十度，頁邊距按毫米填。"""

[[faq]]
q = "一個 PDF 最多能放多少張圖？"
a = """
        工具裡沒設上限。真正的天花板是你這臺機器的記憶體，因為成品文件要在那裡\
        拼好你才能下載。最先撐不住的，是幾百張全解析度的手機照片。設定裡把最長\
        邊縮一縮，這道天花板一下能抬高很多。"""

[[faq]]
q = "PDF 裡會帶上我的檔名或者時間戳嗎？"
a = """
        你不要求就不會。文件資訊那一塊除了這個工具的名字之外是空的：沒有檔名，\
        沒有機器名，沒有使用者名稱，你不勾那個框，連建立日期都沒有。這是故意的，\
        PDF 本來就是拿去給別人看的東西。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，也沒有試用期。本站帶廣告，經費就是這麼來的，\
        廣告拿不到關於你圖片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明「什麼都沒上傳」最省事的\
        辦法。一個把圖片送出去做文件的工具，拔線那一刻就停了。"""

