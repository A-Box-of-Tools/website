  "點一下某個部分就去掉，點一下被圍住的缺口就填上",
  "輪廓畫在它來自的畫素上面，最多放大十六倍",
  "洞和套著的洞一起輸出成一條路徑，不用設定填充規則",
  "拐角和平滑的閾值按形狀計算，除非你另有指定",
