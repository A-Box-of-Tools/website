#
# Unlock a PDF - 繁體中文。
#
# Overrides for tools/unlock-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# 改這一頁的話術時，有兩件事必須守住，跟英文原文一樣。
#
# 第一件：「保護」在 PDF 裡是兩回事，這一頁任何時候都不能把它們混在一起說。帶
# 「開啟密碼」的文件，沒有密碼誰都讀不了，這個工具也找不出來。帶「限制」的文件
# 是任何人都能開啟的，它只是請閱讀器不要列印、不要複製，這個請求靠的是程式之間
# 的約定，不是密碼學，Adobe 從一開始就是這麼寫的。第二種遠遠更常見，也正是這個
# 工具一鍵就能處理、根本不用密碼的那一種。
#
# 第二件：這個工具不猜密碼。src/ 裡沒有任何一個迴圈在做這件事，頁面是明說的，
# 不是讓人自己推斷。1990 年代那種 40 位的金鑰確實是搜得出來的，正因為如此，這條
# 拒絕才必須寫出來。
#
# 用詞：user password 寫「開啟密碼」，owner password 寫「許可權密碼」，因為中文裡
# 「使用者密碼」和「所有者密碼」兩個詞並排放，讀者分不出哪個管開、哪個管許可權。
# revision 寫「修訂」，跟 /R 對應。
#

