[[privacy]]
title = "你的文件沒有出去的路。"
body = """\
      Content-Security-Policy 裡寫著這個頁面允許聯絡的每一個地址，沒有一個\
      屬於本站。這個工具沒往那份名單里加任何東西，因為它連一項自己的網路功能\
      都沒有，連可選的都沒有。這裡沒有任何可以收走你檔案的接收端，就算有，\
      程式碼裡也沒有把檔案送過去的東西。"""

[[privacy]]
title = "合併恰恰是最不該上傳的那類活。"
body = """\
      人們要拼在一起的文件，往往正是從別處來的那些：合同和它的簽字頁、護照\
      掃描檔和銀行流水、診斷書和理賠表。一個線上合併服務因此拿到了全部，放在\
      一處，還已經排好了序。這個工具只有你瀏覽器裡的一個頁面，沒有另外那一半。"""

[[privacy]]
title = "整個格式都在這個倉庫裡。"
body = """\
      一份 PDF 就是一串物件，加上一張記錄每個物件從哪裡開始的表。\
      <code>src/objects.js</code> 讀這套語法，<code>src/reader.js</code> 順著\
      那張表走，<code>src/assemble.js</code> 在文件之間複製頁面，\
      <code>src/writer.js</code> 寫出結果。這四個裡沒有一個引入了能發出請求的\
      東西。不會去取任何庫，也沒有什麼是在伺服器上渲染的。"""

[[privacy]]
title = "加密的檔案會被擋下，而不是被開啟。"
body = """\
      帶密碼的 PDF 一律拒收，包括掃描器用空密碼產生、技術上其實打得開的那種。\
      給文件解除保護，和挪動它的頁面是兩碼事，一聲不吭地替你做了，對一個工具\
      來說太越界了。"""

[[privacy]]
title = "成品檔案不會說自己是在哪裡做的。"
body = """\
      沒有產生器一行，沒有建立日期，沒有工具名字。它也不帶走排版軟體留下的 \
      XMP 資料包和私有塊，那些屬於此前存在過的那份文件，而不屬於你剛做出來的\
      這一份。頁面裡的內容會被原樣複製：這個工具挪的是頁，不改頁面上寫著什麼。"""

[[privacy]]
title = "不是「跳到某一頁」的動作不會被複制。"
body = """\
      PDF 裡可以放開啟時就執行的指令：播放這個、把這張表單提交到那個地址、執行\
      這段 JavaScript。經過這個工具的頁面，會保留通向其他頁面和網址的連結，其餘\
      的都丟掉。你要重排別人的頁面，不構成把人家文件的指令碼一起帶進你新檔案的\
      理由。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你文件的資訊，一條也沒有交給它們，\
      檔案、某一頁、名字、大小、頁數都沒有。讀取、複製、寫出 PDF 的每一行程式碼\
      都由這個源提供，也都擺在倉庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁首那個「Buy me a coffee」按鈕由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它不過是個連結，不上報訪問，也拿不到關於你或\
      你文件的任何東西。不點它就什麼都不會發生，點下去到的是別人的站。"""

[[privacy]]
title = "斷網也照樣能用。"
body = """\
      斷開網路，這個頁面上的一切照常工作。這是最省事的一條證明，真要把你的\
      文件送出去合併，那時候就停了。"""

[[howto]]
title = "選好你的 PDF。"
body = """\
      拖到選擇框裡，或者自己找出來，之後還能再加：每個檔案的頁面都會接在當前\
      順序的末尾，正因如此，兩個資料夾可以分兩次合。瀏覽器直接從你的磁碟上讀。"""

[[howto]]
title = "把頁面排成你要的順序。"
body = """\
      抓住把手拖動一頁，或者用箭頭一格格挪。把掃歪了的那頁轉正，把某頁刪掉，\
      或者在框裡敲 <code>1-3, 8, 12-</code>，一次性保留、刪除或旋轉一整串。\
      編號會隨著你的操作重新編排，所以你看到的永遠就是成品的樣子。"""

[[howto]]
title = "說清楚出來的是一份文件還是好幾份。"
body = """\
      一份是常見答案。其餘都是切法：每隔多少頁切一次、在你指定的頁碼處切、\
      一頁一個檔案，或者切回它們原本所屬的檔案。多於一份的時候會打包成一個 \
      ZIP 交給你，這樣只儲存一次，而不是五十次。"""

[[howto]]
title = "產生它，然後讀那行「已核對」的說明。"
body = """\
      文件寫完之後，頁面上同一個讀取器會把每一份重新開啟，數一遍頁數。要是數出來\
      和你要的對不上，這次操作會被報為失敗，也不會給你下載。"""

[[faq]]
q = "我的 PDF 會被傳到哪裡去嗎？"
a = """
        不會。它們由你自己的瀏覽器在你自己的硬體上讀取、複製和寫出。這個工具沒有\
        服務端，頁面的 <code>Content-Security-Policy</code> 裡寫著它允許聯絡的\
        每一個地址，沒有一個屬於本站。這個工具連可選的網路功能都完全沒有。"""

[[faq]]
q = "能合併多少個檔案，檔案能有多大？"
a = """
        工具裡沒寫任何上限。上限是你自己的機器：文件在處理期間是放在記憶體裡的，\
        所以一臺筆記本合個幾百 MB 不會有意見，再往上就開始吃力。這裡不收費、不限速、\
        不加水印、不排隊，因為另一端根本沒人來做這些事。"""

[[faq]]
q = "合併或拆分會掉畫質嗎？"
a = """
        不會。頁面上的任何東西都不會被重新編碼、重新渲染或重新壓縮。每一頁的內容\
        流，以及它引用的每種字型、每張圖片、每個向量圖形，都是逐位元組複製過去的，\
        所以文字照樣能選能搜，照片還是那張照片。變的只有頁面的順序，以及它們外面\
        那層結構。"""

[[faq]]
q = "書籤和連結會怎樣？"
a = """
        兩者都是重新搭好，而不是直接丟掉。目標頁還在結果裡的書籤，會指向那一頁新的\
        位置；目標頁被你刪掉的書籤會消失，除非它下面還有活著的條目，那它就作為一個\
        標題留下來。合併多個檔案時，每個檔案的書籤會歸到一個以它命名的標題下面。\
        頁面之間的連結用同樣的辦法跟過去，包括 Word 和 LaTeX 寫的具名目標；目標\
        沒有跟過來的連結會被留成什麼都不做，而不是把讀者送到錯的地方。指向網址的\
        連結原樣保留。"""

[[faq]]
q = "有什麼是不會帶過去的？"
a = """
        四樣，而且工具會在結果裡說明，而不是寫在小字裡。螢幕閱讀器用的帶標籤閱讀\
        順序樹、頁面標籤（「iii、iv、1、2」那套編號）、內嵌的附件，以及任何既不是\
        「跳到某一頁」也不是「開啟某個網址」的動作，包括文件裡的 JavaScript。前兩樣\
        描述的是頁面一挪就不復存在的順序；最後一樣，你並沒有要求把它帶進新檔案。\
        要是文件的無障礙標籤對你重要，那就把原件也留著。"""

[[faq]]
q = "填好的表單還在嗎？"
a = """
        在。表單欄位和裡面填的內容會跟著頁面一起過來，新文件也會被登記成表單，\
        閱讀器就會按表單來對待它。合併時有一點要知道：在任何閱讀器看來，同名的兩個\
        欄位就是同一個欄位，所以如果你把同一張表單的兩份合在一起，在其中一頁填一個\
        框，另一頁那個也會跟著填上。工具會發現這種情況並說明。"""

[[faq]]
q = "能開啟帶密碼的 PDF 嗎？"
a = """
        不能，而且是故意的。加密的文件會被拒收，並附上說明，哪怕密碼是空的也一樣，\
        而不少掃描器和影印機正是那樣儲存的。給檔案解除保護，和挪動它的頁面是兩碼\
        事，一個悄悄這麼做的工具，就是在做你沒要求它做的事。"""

[[faq]]
q = "為什麼沒有頁面縮略預覽？"
a = """
        因為要把一頁畫出來，就得有一個完整的 PDF 渲染器：字型、漸變、透明組、混合\
        模式，那是超過 1 MB 的引擎，為了幾張縮圖要下載並跑起來。方塊上顯示的，是\
        重排真正會用到的東西：頁碼、紙張的形狀和尺寸、寫出時會帶的旋轉，以及它出自\
        哪個檔案。一疊直式頁面裡混進一張橫式掃描，照樣一眼就看得出來。"""

[[faq]]
q = "做好的檔案到哪裡都能開啟嗎？"
a = """
        能。輸出寫成 PDF 1.5，或者寫成你給的這些檔案裡所需的最高版本，而 1.5 自 \
        2003 年以來出廠的每一個閱讀器都懂。工具還會在你自己的機器上把這一點做實：\
        它會把每個成品檔案重新開啟，沿著頁面樹數一遍頁數，然後才把它給你。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，除了你自己機器的記憶體之外也沒有檔案\
        大小限制。本站帶廣告，經費就是從那裡來的，廣告拿不到任何關於你文件的資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面載入一次之後斷開網路，它照樣運作。這也是證明「什麼都沒上傳」最省事的\
        辦法，真要把你的文件送出去合併，拔線那一刻就停了。"""

