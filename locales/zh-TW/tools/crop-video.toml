[[howto]]
title = "選一段影片。"
body = """\
      把 MP4、MOV、M4V 或者 WebM 拖到下面的方框裡，或者點開自己挑。瀏覽器\
      直接從你的硬碟上讀，這期間沒有東西發出去。"""

[[howto]]
title = "拉個框，框住你要留下的那塊。"
body = """\
      在框裡拖是移動，拖四角是縮放。也可以先鎖定形狀，方圖發帖用 1:1，手機上\
