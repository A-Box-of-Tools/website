      關掉。"""

[[howto]]
title = "裁完就下載。"
body = """\
      工作在你自己的硬體上執行，所以快慢取決於你這臺機器，不取決於排隊。裁好的\
      影片直接交給瀏覽器的下載。"""

[[faq]]
q = "我的影片會傳到什麼地方去嗎？"
a = """
        不會。讀取、解碼、裁剪、編碼，全由你自己的瀏覽器在你自己的硬體上完成。\
        這個工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code>\
        把它可能聯的地址全列了出來，沒有一個是本站的。與其聽我們說，不如拔掉\
        網線，照裁一段試試。"""

[[faq]]
q = "能裁哪些格式？"
a = """
        MP4、M4V 和 MOV 直接讀，裡面裝的是 H.264、HEVC、AV1 還是 VP9 都行，\
        只要你的瀏覽器解得了那個編碼。其他瀏覽器能播的格式，最典型的是 WebM，\
        改成一邊播一邊錄來裁，能用，但片子多長就得花多長時間。瀏覽器既讀不了\
        也播不了的檔案，實際上就是 AVI、WMV、FLV 和大多數 MKV，會被直接拒收\
        並說明原因，不會做到一半才崩。"""

[[faq]]
q = "影片的大小和長度有限制嗎？"
a = """
        工具裡沒設上限，檔案也不是一口氣讀進記憶體的，而是一次幾 MB 地走過去。真正\
        的天花板是成品，它要在記憶體裡拼好你才能下載，再就是你這臺機器編碼要\
        花多久。"""

[[faq]]
q = "聲音會保住嗎？"
a = """
        走 MP4 這條路是分毫不差的：音訊逐個取樣複製過去，全程不解碼，跟原檔案\
        裡的位元組一模一樣。走錄製那條路，聲音是從播放裡採下來再編一遍的，會掉\
        一點品質。兩條路都有個勾選框，可以乾脆不要聲音。"""

[[faq]]
q = "裁剪會掉畫質嗎？"
a = """
        畫面要重新編碼，因為裁過的一幀已經是另一張圖，不把畫素重寫一遍就存不\
        下來。工具不肯做的是在同一塊區域上花得比原來還多，超過那個數只會讓\
        檔案變大，看起來並不會更好。"""

[[faq]]
q = "能順便剪時長嗎？"
a = """
        這裡不行，隔壁可以。這個工具只改畫面的形狀，別的都不動，出來的片子跟\
        進去的一樣長，時間軸和聲音原封不動。剪時長是另一件事，也是另一個工具，\
        <a href="../trim-video/">影片剪輯</a>把片子裡值得留的段落標出來，存成\
        一個檔案，而且一幀都不重編。"""

[[faq]]
q = "寬和高為什麼只能按 2 跳？"
a = """
        MP4 裡的 H.264 把畫面按塊存，根本沒辦法描述一條邊是奇數畫素的幀。與其\
        等你設完再悄悄替你取整，不如這個框從一開始就只給偶數。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費\
        就是這麼來的，廣告拿不到關於你影片的任何資訊。"""

[schema]
browser_requirements = "需要 JavaScript。輸出 MP4 需要瀏覽器支援 WebCodecs，否則退回到錄製 WebM。"
description = "在瀏覽器裡把影片裁成任意形狀，或者精確到畫素的一個框。MP4、MOV 和 M4V 逐幀解碼重編，原來的音訊原樣帶過去；其他瀏覽器能播的格式改用錄製的方式裁。什麼都不上傳。"
features = [
  "裁 MP4、MOV、M4V 和 WebM 影片",
  "H.264、HEVC、AV1 和 VP9 片源，走 WebCodecs 解碼",
  "自由裁、鎖定比例（1:1、4:5、9:16、16:9、4:3、3:2），或者精確到畫素的框",
  "原來的音訊照搬，不重新編碼",
  "斷網能用，不上傳，不註冊，沒有水印",
]

[picker]
title = "把影片拖到這裡"
hint = "或者點選選擇，MP4、MOV、M4V、WebM，以及這個瀏覽器能播的其他格式"
