[[faq]]
q = "我的音訊會傳到什麼地方去嗎？"
a = """
        不會。讀取、編輯、寫出，全由你自己的瀏覽器在你自己的硬體上完成。這個\
        工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code> 把它\
        可能聯的地址全列了出來，沒有一個是本站的。與其聽我們說，不如拔掉網線，\
        照倒放一段試試。"""

[[faq]]
q = "能把影片裡的聲音抽出來嗎？"
a = """
        能，在這裡這跟開啟一個 MP3 是同一件事。丟一個 MP4、MOV 或者 WebM 進來，\
        只有音軌會被解碼，畫面根本不讀，出來的是一個純聲音檔案，裡頭沒有影片。\
        想原樣儲存一段片子的聲音也是這麼辦，什麼設定都別動，直接按按鈕。"""

[[faq]]
q = "變速會連音高一起變嗎？"
a = """
        你不要求它就不變。「保持音高」的做法是把錄音切成一段段大約五十毫秒、\
        彼此重疊的小窗，再把它們鋪得密一點或者疏一點，每一段落在哪裡都挑在\
        波形接得上的位置，所以 1.5 倍速下一個人的嗓音還是那個嗓音。「跟著變」\
        走的是重取樣，也就是磁帶放快的那套，兩倍速正好高一個八度。"""

[[faq]]
q = "為什麼存成 WAV，不是 MP3？"
a = """
        因為沒有哪個瀏覽器內建 MP3 編碼器，而這個工具不肯把你的錄音送去有\
        編碼器的伺服器。WAV 根本不需要編碼器，它就是取樣加前面四十四個位元組的\
        檔案頭，所以它既是老實的選擇，也是唯一不可能掉品質的選擇。代價是檔案\
        大，立體聲大約一分鐘 10 MB。播放器、手機、編輯軟體都打得開，真要 MP3，\
        拿它轉一個就是。"""

[[faq]]
q = "能開啟哪些格式？"
a = """
        你的瀏覽器解得了的都行，實際上就是 MP3、WAV、FLAC、M4A 和 AAC、Ogg
        Vorbis 和 Opus，以及 MP4、M4V、MOV、WebM 影片裡的音軌。打不開的還是\
        那張老名單：AVI、WMA，還有大多數 MKV。瀏覽器讀不了的檔案會被直接拒收\
        並說明原因，不會做到一半才崩。"""

[[faq]]
q = "調大音量會不會破音？"
a = """
        只有衝過滿刻度才會，而頁面在你動手之前就會提醒。數字音訊有一道硬頂，\
        一個取樣不可能比滿刻度更響，超出去的部分會被壓平在頂上，那就是破音的\
        聲音。「提到最響」這一檔不可能出這個問題，它先算出這段錄音頭頂還剩多少\
        空間，就用掉那麼多。頂以下的操作只是乘法，別的什麼都沒發生，提 6 dB
        再降 6 dB，取樣還回到原處。"""

[[faq]]
q = "倒放和變速會掉品質嗎？"
a = """
        倒放不會，同樣那些取樣換個順序出來，分毫不差。變速要動到每一個取樣，\
        算的是數，不是複製。重取樣這條路上有正經的濾波，所以放快不會把高音\
        折回來變成金屬味的嗡響；變速不變調那條路上，每一段小窗都落在波形接得上\
        的位置，不是算到哪裡算哪裡。兩條路都不重新編碼，因為這裡根本沒有編碼器\
        可用。"""

[[faq]]
q = "檔案長度有限制嗎？"
a = """
        工具裡沒設上限。真正的天花板是記憶體：整段錄音一次性解碼進這個頁面，WAV
        也要在記憶體裡拼好你才能下載，所以一小時的立體聲大約需要不到一 GB 的\
        騰挪空間。四 GB 的 WAV 會被直接拒絕，因為這個格式自己的大小欄位就\
        描述不了那麼大的檔案。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費\
        就是這麼來的，廣告拿不到關於你錄音的任何資訊。"""

