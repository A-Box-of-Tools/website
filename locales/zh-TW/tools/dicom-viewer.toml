#
# DICOM Viewer - 繁體中文。
#
# Overrides for tools/dicom-viewer/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# DICOM 的欄位名保持英文，也保留後面的編號，比如 Pixel Spacing (0028,0030) 和
# Series Instance UID (0020,000E)。檔案裡就是這麼寫的，標準裡也是這麼寫的，要查
# 一個欄位的人搜的正是這幾個詞。transfer syntax 和 PS3.15 同理。
#
# 這一頁是全站承諾最鋒利的地方。這個檔案不是帶後設資料的圖片，是裝著圖片的病歷。
# 所以「裡面寫了什麼」這幾句，和「它不會去任何地方」那幾句一樣，都是逐字斟酌過的。
#

