[[privacy]]
title = "捐贈按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁面頂部那個「Buy me a coffee」按鈕由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它就是個連結而已，不會報告訪問，也拿不到關於你或者\
