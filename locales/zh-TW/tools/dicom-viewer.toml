features = [
  "開啟 CT、MR、X 光、超音波、PET 和 secondary capture 檔案",
  "窗寬窗位可以拖、可以輸入，CT 還可以直接選帶名字的預設",
  "整個資料夾自動歸併成序列，並按在身體裡的位置排序",
  "多幀檔案按迴圈播放",
