[[faq]]
q = "我的影片會傳到什麼地方去嗎？"
a = """
        不會。讀取、取幀、轉換，全由你自己的瀏覽器在你自己的硬體上完成。這個\
        工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code> 把它\
        可能聯的地址全列了出來，沒有一個是本站的。與其聽我們說，不如拔掉網線，\
        照做一張試試。"""

[[faq]]
q = "能轉哪些格式？"
a = """
        MP4、M4V 和 MOV 直接讀，裡面裝的是 H.264、HEVC、AV1 還是 VP9 都行，只要\
        你的瀏覽器解得了那個編碼。其他瀏覽器能播的格式，最典型的是 WebM，改成\
        把播放器逐個時間點跳過去取幀，慢一些，落在哪一幀上也沒那麼精確。瀏覽器\
        既讀不了也播不了的檔案，實際上就是 AVI、WMV、FLV 和大多數 MKV，會被直接\
        拒收並說明原因，不會做到一半才崩。"""

[[faq]]
q = "我的 GIF 怎麼這麼大？"
a = """
        因為 GIF 是 1987 年的格式，它存的是一張張完整的圖，不是運動。一段五秒的\
        片子，做成 GIF 不可能跟它自己那個五秒的 MP4 一樣小，影片轉出來的 GIF
        通常是原影片的十倍。真正決定大小的是三個設定，按要緊程度排：這一段多長、\
        畫面多寬、每秒幾幀。寬度砍一半，畫素就少四分之三，而花錢的正是畫素。"""

[[faq]]
q = "為什麼只有 256 種顏色？"
a = """
        格式就是這麼定的：一張 GIF 帶一張最多 256 色的顏色表，每個畫素存的是\
        表裡的編號。這個工具的做法是把你選中那一段裡每一幀的顏色都數一遍，再\
        分成 256 組，用的是中位切分法，業界標準做法，所以配色板是貼著你這段片子\
        長出來的，不是一套固定顏色。缺了某個顏色的地方，抖動會把最接近的兩種混\
        在一起，讓漸變還是漸變，而不是一道道色帶。"""

[[faq]]
q = "抖動那個設定是做什麼的？"
a = """
        拿一點噪點，換掉一大片色帶。開著的時候，一片本來會變成四道平色的天空還是\
        漸變，代價是有點細微的紋理，檔案也大一點。關掉則畫面更平、檔案更小，適合\
        螢幕錄影、線稿，以及本來就由大片純色構成的東西。這裡用的是有序抖動，不是\
        誤差擴散那種，所以沒變化的背景在幀之間穩穩當當，不會滿屏爬。"""

[[faq]]
q = "長度和體積有限制嗎？"
a = """
        受限的是你標的那一段，而且卡住它的是記憶體，不是什麼規矩：選好配色板之前，\
        這一段的每一幀都得同時留在手上。所以頁面會先算出你這套設定要花多少記憶體，\
        提前告訴你，超了就直接拒絕，而不是讓分頁耗盡記憶體憑空消失。段落短一點、\
        寬度小一點、幀率低一點，都能把這個數降下來。"""

[[faq]]
q = "聲音能保住嗎？"
a = """
        GIF 裝不了聲音。這個格式壓根沒有帶音訊的版本，這也正是後來網上大多改用\
        無聲循環影片的主要原因。聲音要緊的話，那就別轉，留著影片，\
        <a href="../trim-video/">影片剪輯</a>能從裡面剪出一段，而且一幀都不\
        重編。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費就是\
        這麼來的，廣告拿不到關於你影片的任何資訊。"""

