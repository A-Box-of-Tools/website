[[privacy]]
title = "你的圖片沒地方可去。"
body = """\
      Content-Security-Policy 把這個頁面允許聯的地址全列了出來，沒有一個是\
      本站的。這裡沒有能收檔案的介面，程式碼裡也沒有一行會把檔案發出去，就算\
      真有那麼個介面也一樣。這一條以前寫的是 <code>connect-src 'none'</code>，\
      那是絕對的；加了廣告之後就沒了這個絕對，把這話說出來也是交易的一部分。"""

[[privacy]]
title = "編碼在本地。"
body = """\
      WebCodecs 在你的瀏覽器裡跑，成品直接交給下載。這個應用沒有伺服器那\
      一半。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你圖片的資訊，一條都沒給它們，檔案\
      不給，縮圖不給，檔名、大小、數量也不給。讀圖、解碼、合成、編碼的\
      每一行程式碼都從本站發出，也都擺在倉庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁頭那個「Buy me a coffee」按鈕，由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它就是個連結，僅此而已，不上報訪問，也拿不到\
      關於你或者你圖片的任何東西。你不點它，什麼都不會發生；點了，跳過去的\
      是別人的網站。"""

[[privacy]]
title = "有一個例外，而且是明說的例外。"
body = """\
      你要是用了「從網址新增」，那臺伺服器會被聯上以取回圖片，它也就看得到你的
      IP 位址。只有你親手貼進去的圖才會被取，而且只有進來這一個方向：\
      <code>img-src</code> 開著，<code>connect-src</code> 沒開。下面那個計數器\
      會列出聯過的每一個外部來源。"""

[[privacy]]
title = "斷網照樣能用。"
body = """\
      斷開網路，除了「從網址載入」，這個頁面上的一切照常工作。這是最省事的一條\
      證明。"""

[[howto]]
title = "選好你的圖片。"
body = """\
      把整個資料夾拖到下面的方框裡，或者一個個自己挑。瀏覽器直接從你的硬碟上\
      讀，這期間沒有東西發出去。"""

[[howto]]
title = "排好順序，定好每張停多久。"
body = """\
      拖著換順序。停留時間可以按幀算，也可以按秒算，可以一次改全部，也可以\
      一張一張改。"""

[[howto]]
title = "挑解析度和幀率。"
body = """\
      「跟最大的那張走」按你最大的一張圖來定；預設裡有 4K、1080p、720p、方形和\
      直式；都不合適，還能自己填一個尺寸。"""

[[howto]]
title = "產生影片，然後下載。"
body = """\
      編碼在你自己的硬體上跑，所以快慢取決於你這臺機器，不取決於排隊。做好的
      MP4 直接交給瀏覽器的下載。"""

[[faq]]
q = "我的圖片會傳到什麼地方去嗎？"
a = """
        不會。讀圖、合成、編碼，全由你自己的瀏覽器在你自己的硬體上完成。這個\
        工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code> 把它\
        可能聯的地址全列了出來，沒有一個是本站的。唯一的例外是那個可選的\
        「從網址新增」，它會去取你貼進來的圖，那臺伺服器也就看得到你的 IP
        地址。"""

[[faq]]
q = "支援哪些圖片格式？"
a = """
        你的瀏覽器能解碼的靜態圖都行，實際上就是 JPG、PNG、WebP、GIF、AVIF，\
        蘋果裝置上還包括 HEIC。這裡沒有另一份需要不斷維護的清單，因為解碼是\
        瀏覽器的工作，不是我們的。"""

[[faq]]
q = "輸出的是什麼格式？"
a = """
        MP4，影片編碼是 H.264，基本上什麼裝置都能放。瀏覽器要是沒有 WebCodecs，\
        工具會退回到錄製 WebM，畫面還是那些畫面，只是這個容器接受它的剪輯軟體\
        少一些。"""

[[faq]]
q = "Blender 或者 After Effects 的渲染序列能用嗎？"
a = """
        能，帶編號的渲染序列正是這個工具的本行。把渲染器寫出來的幀加進來，\
        停留時間保持一幀，幀率跟渲染設定對齊就行。「按名字排序」是按人的直覺數\
        的，所以 <code>frame_2</code> 排在 <code>frame_10</code> 前面，而不是\
        後面。
        <br><br>
        動手前有一點要知道：H.264 沒有 alpha 通道，所以透明會被壓平到襯底色上，\
        不會帶過去。要保住 alpha，那就在你的剪輯軟體裡合成。"""

[[faq]]
q = "能拿照片做延時影片嗎？"
a = """
        能，跟渲染序列是同一件事：每張照片停一幀，再挑個幀率。30 fps 下每三十\
        張照片一秒；同樣這些照片放到 12 fps，能跑兩秒半。
        <br><br>
        「按日期排序」能把相機膠捲放回拍攝時的順序，檔名從 0001 重新開始過的\
        時候尤其管用。照片尺寸不一樣也沒關係，「跟最大的那張走」會把影片尺寸定\
        得誰都不用縮小。"""

[[faq]]
q = "圖片數量或者影片長度有限制嗎？"
a = """
        工具裡沒設上限。真正的天花板是你這臺機器的記憶體，因為成品影片要在那裡\
        拼好你才能下載。最先撐不住的是很大的 4K 投影片。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，也沒有試用期。本站帶廣告，經費就是這麼來的，\
        廣告拿不到關於你圖片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明「什麼都沒上傳」最省事的\
        辦法。一個把圖片送出去處理的工具，拔線那一刻就停了。"""

[[faq]]
q = "能加音樂或者配樂嗎？"
a = """
        暫時不能。這個工具只出影片，寫出來的 MP4 只有一條影片軌，沒有音軌。\
        需要配樂的話，之後在剪輯軟體裡加。"""

