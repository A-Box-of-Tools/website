features = [
  "把 JPG、PNG、WebP、GIF 和 AVIF 做成影片",
  "輸出 MP4（H.264），並以 WebM 備援",
  "解析度最高 3840×2160，幀率 12 到 60 fps",
  "每張圖的停留時間可按幀或按秒單獨設定",
  "斷網能用，不上傳，不註冊",
]

