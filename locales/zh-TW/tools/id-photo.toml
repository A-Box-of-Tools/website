body = """
 沒有要下載的權重，      沒有跑權重的推理執行時，也不去取任何東西：頭頂來自你的頭在背後那面牆前的      輪廓，瞳孔來自臉上比周圍更暗的那幾塊。裡頭沒有一處讀膚色，之所以這麼寫      正是為了這個&mdash;&mdash;會出錯的模型不會均勻地出錯，在某些臉上比在別的      臉上更糟。它是起點而不是判決：頁面會說四個點裡哪一個沒能量出來，每個點都      還能拖，切到<em>我自己放</em>就整個關掉。"""

