      <code>Content-Security-Policy</code> 裡寫著這個頁面允許聯絡的每一個地址，\
      沒有一個屬於本站。這裡沒有任何可以收走你照片的接收端。"""

[[privacy]]
title = "這裡不會去取任何東西。"
