      連可選的都沒有。這裡沒有能收檔案的介面，程式碼裡也沒有一行會把檔案發\
      出去，就算真有那麼個介面也一樣。"""

[[privacy]]
title = "整套格式的處理都在這個倉庫裡。"
body = """\
      一個 PDF 說白了就是一串物件，外加一張記著每個物件從哪裡開始的表。\
      <code>src/objects.js</code> 讀這套語法，<code>src/reader.js</code> 跟著\
      那張表走，<code>src/writer.js</code> 寫出一份新的，三個檔案誰都沒有\
      引入能發請求的東西。沒有庫要去外面取，也沒有哪一步是在伺服器上渲染的。"""

