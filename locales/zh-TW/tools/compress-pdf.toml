[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你文件的資訊，一條都沒給它們，檔案\
      不給，頁面不給，檔名、大小、頁數也不給。讀 PDF、解碼、寫 PDF 的每一\
      行程式碼都從本站發出，也都擺在倉庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁頭那個「Buy me a coffee」按鈕，由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
