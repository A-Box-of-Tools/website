[[howto]]
title = "選一個 PDF。"
body = """\
      拖到下面的方框裡，或者點開自己挑。瀏覽器直接從你的硬碟上讀，這期間沒有\
      東西發出去。"""

[[howto]]
title = "先看清體積壓在哪裡。"
body = """\
      第二步的重點就是這張分佈圖。條形圖裡大半是圖片，這個工具就有東西可做；\
      大半是字型和頁面內容，它會直說，老實說也就能省下百分之幾。這事花一\
      分鐘之前就知道，總比之後才知道強。"""

[[howto]]
title = "定個力度。"
body = """\
      那幾檔給的是解析度，不是「高中低」這種含糊的等級。96 DPI 給螢幕上看的，\
      130 給要發郵件的，220 給還得列印的。每一檔都按圖片在頁面上實際畫多大\
      來算，所以一張只當縮圖用的照片，不會被當成整頁掃描件對待。"""

[[howto]]
title = "壓完之後，看一眼那句「已核對」。"
body = """\
      重寫完成後，成品會被這個頁面上同一個讀取器再開啟一遍，頁數點一遍。跟\
      原來對不上，這一次就算失敗，也不會給你下載。"""

[[faq]]
q = "我的 PDF 會傳到什麼地方去嗎？"
a = """
        不會。讀取、重新壓縮、寫出，全由你自己的瀏覽器在你自己的硬體上完成。\
        這個工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code>\
        把它可能聯的地址全列了出來，沒有一個是本站的。連可選的聯網功能都\
        沒有。"""

[[faq]]
q = "我的 PDF 能小多少？"
a = """
        完全取決於裡面裝的是什麼，所以工具在動手之前先量一遍、擺給你看。掃描\
        件幾乎全是照片，通常能小 60% 到 90%。合同、論文這類是文字、向量圖形\
        和內嵌字型，做它的軟體早就壓過一輪了，這種一般只能省下百分之幾，來源\
        是重新打包檔案、丟掉已經沒人引用的東西。哪個工具連你的檔案都沒看就\
        承諾一個固定百分比，那是在猜。"""

[[faq]]
q = "壓縮 PDF 會掉畫質嗎？"
a = """
        裡面的圖片要重新編碼，這部分會。別的都不動：文字還是文字，選得中也\
        搜得到，字型整份留著，向量圖形原樣複製過去。工具也不會白白把一張圖\
        弄差。重編之後要是並不比原來小，那就把原來的位元組放回文件裡，一點沒動。"""

[[faq]]
q = "這裡的 DPI 是什麼意思，為什麼要問我？"
a = """
        PDF 裡記著每張圖在頁面上畫多大，所以工具能算出它的有效解析度。一張
        4000 畫素的掃描圖，鋪在八英寸寬的紙上，等於每英寸 500 個畫素。螢幕\
        根本用不上這麼多，紙上也用不上多少，所以超過你選定那一檔的畫素被最先\
        扔掉，它們換來的畫質誰也看不見。正因為量過這一下，一個放得很小的
        logo 才不會跟整頁掃描件被同等對待。"""

[[faq]]
q = "帶密碼的 PDF 能開啟嗎？"
a = """
        不能，這是故意的。加密的文件會被拒收並說明原因，哪怕密碼是空的也一樣，\
        而很多掃描器和影印機就是這麼存的。給檔案解保護跟給檔案瘦身是兩碼事，\
        一聲不吭就辦了，等於替你做了你沒要求的事。"""

[[faq]]
q = "有壓不動的 PDF 嗎？"
a = """
        有些內嵌圖片壓不動。JPEG 2000、JBIG2 和傳真編碼（CCITT）這幾種，任何\
        瀏覽器都沒有解碼器，所以原樣放行，並在結果裡註明。後兩種本來就是雙色\
        編碼，一般已經接近最小了。CMYK 圖片也不動，重編有可能讓印出來的顏色\
        偏掉。凡是工具跳過的，結果裡都會點名，並說明原因。"""

[[faq]]
q = "壓完的檔案還能到處開啟嗎？"
a = """
        能。輸出按 PDF 1.5 寫，2003 年之後出的閱讀器都認。而且工具在你自己的\
        機器上驗一遍：把成品重新開啟，把頁數點一遍，再交給你。表單、連結、\
        書籤、無障礙結構和內嵌附件都帶過去，留下不要的只有文件裡已經沒人\
        引用的那些東西。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期。檔案大小的上限只取決於你這臺\
        機器的記憶體。本站帶廣告，經費就是這麼來的，廣告拿不到關於你文件的任何\
        資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明「什麼都沒上傳」最省事的\
        辦法。一個把文件送出去壓縮的工具，拔線那一刻就停了。"""

