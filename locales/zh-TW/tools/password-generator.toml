[[privacy]]
title = "密碼就在你讀這行字的地方產生。"
body = """\
 它在這個頁面裡，由這個\
      頁面，從你自己的作業系統交給瀏覽器的隨機數中抽出來。產生它不需要去取任何\
      東西，產生完也不會上報任何東西。<code>Content-Security-Policy</code> 裡寫著\
      這個頁面允許連線的每一個地址，沒有一個是我們的。這裡沒有一個可以收集產生出來\
      的密碼的落點，就算有，程式碼裡也沒有把它送過去的那一行。"""

[[privacy]]
title = "這裡沒有任何東西會去取東西。"
body = """\
 <code>src/</code> 裡沒有 <code>fetch</code>，沒有 <code>XMLHttpRequest</code>，也沒有 <code>sendBeacon</code>。詞表不是下載來的，它就是 <code>src/wordlist.js</code>，跟頁面其他部分一起從這個來源送出，你可以開啟來\
      看。"""

[[privacy]]
title = "隨機數是瀏覽器的，而且是對的那一種。"
body = """\
 <code>crypto.getRandomValues</code> 是瀏覽器為金鑰和令牌提供的隨機數，由作業系統播種，並且不斷重新播種。<code>Math.random</code> 在這個資料夾裡一次都沒有出現過，出現了才是真正的\
      缺陷：它的內部狀態能從幾個輸出裡還原出來，誰看過它產生的一個密碼，就能算出\
      它以後會產生的每一個。"""

[[privacy]]
title = "什麼都不儲存，所以沒有歷史記錄要清。"
body = """\
 沒有 localStorage，沒有
      sessionStorage，沒有 Cookie，沒有 URL 引數，也沒有瀏覽器會主動提出記住的 <code>&lt;input&gt;</code>。螢幕上的東西只活在這個頁面記憶體裡的一個陣列中，\
      關掉分頁就是全部的清理。這裡產生的東西，只有你帶走的那些副本。"""

[[privacy]]
title = "谷歌載入了什麼，又拿不到什麼。"
body = """\
 廣告和統計指令碼來自谷歌，捐贈\
      按鈕來自 Buy Me a Coffee。它們誰都拿不到這個頁面產生的任何一個字元，也拿不到\
      長度、強度，以及是用哪些設定產生的。每一行抽取字元或詞的程式碼都從這個來源送出，\
      都在儲存庫裡。"""

[[privacy]]
title = "它離線可用。"
body = """\
 斷開網路，這個工具一點沒變，因為它裡面從來\
      就沒有過一步聯網。這是最簡單的證明：一個要向伺服器要隨機數的產生器，在你拔線\
      的那一刻就會停下來。"""

[[howto]]
title = "先選密碼還是密碼短語。"
body = """\
 密碼是一串隨機字元：存起來短，敲起來\
      麻煩，正好適合那幾百個由密碼管理器替你填的帳號。密碼短語是從詞表裡隨機抽出來\
      的一串詞：長一些，但記得住、念得出，這正是那幾個必須你自己從腦子裡敲出來的\
      秘密所需要的，比如密碼管理器自己的密碼、膝上型電腦的密碼、手機的恢復碼。"""

[[howto]]
title = "定長度，或者定詞數。"
body = """\
 這才是那個要緊的設定，其餘的大多不是。值得\
      保護的東西，20 個字元或者六個詞是個合理的下限；那個能把其他所有密碼都重置掉的\
      帳號，就從這裡往上加。下面的讀數會跟著你拖動一起變，所以多一個字元換來什麼，\
      你當場就能看見。"""

[[howto]]
title = "把登入表單會較勁的規則開啟。"
body = """\
 「每類至少一個」、末尾一個數字、\
      一個哪個網站都收的短名單裡的符號。這些都不會讓密碼更強，第一個甚至讓它稍微\
      弱了一點，而這一點頁面已經替你減掉了。但要不來回產生六個就透過登入表單，靠的\
      就是它們。"""

[[howto]]
title = "看數字，別看顏色。"
body = """\
 位元數是從產生這串字元的設定裡數出來的：\
      字符集有多大，抽了多少次，就這些。這是一次真正的測量，跟註冊頁上那根條不一樣。\
      那根條只能給眼前的字元打分，沒有辦法知道這些字元是你選的還是產生器選的。"""

[[howto]]
title = "走之前先複製，先放好。"
body = """\
 這裡沒有歷史記錄，也沒有辦法再要回來，\
      重新整理頁面它就沒了。先貼進密碼管理器，再貼進登入表單，讓需要記住它的那一頭先拿\
      到手，中間出什麼差錯都不怕。"""

[[howto]]
title = "要一批就一次產生一批。"
body = """\
 最下面那個滑塊一次最多產生一百個，還能\
      存成純文字檔案，內容就是頁面從你螢幕上已有的東西寫出來的。批次開帳號或者發初始\
      口令時好用，等它們進了更合適的地方，這個檔案就該刪掉：硬碟上一個裝滿密碼的\
      檔案，仍然是一個裝滿密碼的檔案。"""

[[faq]]
q = "密碼會被髮到什麼地方，或者被儲存下來嗎？"
a = """
        都不會。它們在你的瀏覽器裡、你自己的機器上產生，而這個工具根本沒有任何聯網\
        功能，從不去取什麼，也從不傳送什麼。它也不往儲存裡寫任何東西：沒有
        localStorage，沒有 Cookie，沒有歷史記錄。重新整理頁面，它給你看過的密碼就從\
        螢幕上、也從它自己的記憶體裡消失了。頁面的 <code>Content-Security-Policy</code> 寫著它允許連線的每一個地址，沒有一個是\
        我們的，所以就算有什麼想送出去，也沒有地方收。"""

[[faq]]
q = "隨機數是從哪裡來的？"
a = """
        來自 <code>crypto.getRandomValues</code>，瀏覽器為密碼學用途提供的隨機數，\
        由你自己作業系統的熵池播種並不斷重新播種。瀏覽器取 TLS 金鑰材料用的也是同一個\
        來源。這個工具裡任何地方都沒有用 <code>Math.random</code>，這個區分不是咬文嚼字：<code>Math.random</code> 是一個很快的算術隨機數，它的整個內部狀態能從\
        連續幾個輸出裡還原出來，建立在它上面的密碼產生器產生的密碼只是看起來隨機，\
        任何見過其中一個的人都能把其餘的全部列舉出來。"""

[[faq]]
q = "瀏覽器裡產生的密碼，和裝在電腦上的程式產生的一樣好嗎？"
a = """
        就隨機數而言是一樣的，兩邊都是作業系統的同一個來源，只是走的門不同。不同的是\
        屋子裡還有誰。瀏覽器分頁是和你的擴充套件一起執行的，一個有許可權讀頁面的擴充套件也能\
        讀這一頁。這對任何網頁上的產生器都成立，包括這一個，也正是「手邊有密碼管理器\
        時就用它內建的產生器」這條建議的誠實理由：算術是一樣的，只是那個程序旁邊站的\
        人少。這個頁面是給你手邊沒有它的時候用的。"""

[[faq]]
q = "密碼還是密碼短語，到底該用哪個？"
a = """
        凡是密碼管理器替你敲的，都用密碼，因為你根本不會去看它，而長度在那裡是白送\
        的。那幾件必須你自己從腦子裡敲出來、或者念給別人聽的，用密碼短語：管理器的\
        主密碼、磁碟加密的金鑰、一臺你遠端配置的裝置。長詞表裡六個詞是 77 位元，比\
        十二個字元的隨機密碼還強，而且凌晨四點也能一次輸對，這一點差得不是一星\
        半點。"""

[[faq]]
q = "密碼該有多長？"
a = """
        全字符集下 20 個字元大約是 130 位元，早就過了還需要擔心長度的那個點。16 個也\
        很夠。12 個是任何你不想丟的東西的下限，而且是下限，不是目標。再短，你就是在賭\
        那個網站把它妥善存了起來，而過去二十年的洩露通知勸你別賭。長度勝過這個頁面上\
        任何別的設定：多一個字元，比任何關於必須包含哪些字元的規則都管用。"""

[[faq]]
q = "密碼短語該用幾個詞？"
a = """
        長詞表裡六個詞，如果它守著別的密碼就七個。那張著名的四個詞的圖是 2011 年畫\
        的，值 51 位元，今天已經在一次認真的離線攻擊的射程之內。五個詞是 64，六個詞是
        77，超過了攻擊者會為一個普通帳號花的代價。長詞表裡每多一個詞就多 12.9 位元，\
        而且只有詞在往上加，連字元和大寫字母都不加。"""

[[faq]]
q = "什麼是「位元」，這個頁面為什麼要數它？"
a = """
        一個位元就是翻一倍。60 位元的意思是，這個頁面本來可能產生的、機率相同的結果\
        有 2^60 種，所以就算有人完全清楚它是怎麼工作的，也還是有這麼多要試。這是\
        <em>過程</em>的性質，不是這串字元的性質：頁面能把它說準，是因為選的人就是它，\
        它知道自己選了多少次。這就是它和登入表單上那根彩色條的區別，那根條只是讀了\
        字元然後猜。在那根條上，<code>correct horse battery staple</code> 評分很差，\
        實際值 44 位元；<code>P@ssw0rd!</code> 評分很好，實際幾乎一文不值。"""

[[faq]]
q = "為什麼「必須包含一個符號」反而讓密碼變弱？"
a = """
        因為規則只能拿走可能性。要求每一類至少出現一個字元，就把所有恰好沒抽到的密碼\
        全排除掉了，而可能的密碼這個集合越小，要搜的範圍也越小。影響不大，常見長度下\
        大約半個位元，但它是真實存在的，而這個頁面把它減掉了，沒有去報那個對自己更\
        好看的數。而且是精確算出來的：數的是這條規則真正允許的密碼，而不是它排除掉\
        的。"""

[[faq]]
q = "這是哪個詞表，攻擊者能下載到它要緊嗎？"
a = """
        是電子前哨基金會（EFF）的 diceware 詞表，原樣打包進來：長的 7776 個詞，短的
        1296 個。它們本來就是為這件事做的：沒有冒犯性的詞，沒有同音詞，沒有連起來會\
        變成第三個詞的組合，短表裡也沒有哪個詞是另一個詞的開頭。至於詞表是公開的，不\
        要緊：這裡給出的強度本來就假定攻擊者手裡有這份表，正在讀這個頁面的原始碼，還\
        知道你用的每一項設定。他唯一不知道的，是每一次抽中的是 7776 個裡的哪一個。正是\
        這個假定，讓這個數字值得信。"""

[[faq]]
q = "密碼短語不就是等著被字典攻擊嗎？"
a = """
        按這種方式選詞就不是。字典攻擊對付的是<em>人</em>想出來的短語，因為人挑的詞\
        彼此搭調、順序講得通，而且來自自己每天用的那幾千個詞。這個頁面是從一份固定的\
        詞表裡，一個詞一個詞獨立地、均勻地抽，完全不管結果讀起來順不順，所以它通常\
        讀起來並不順。一個知道詞表也知道詞數的攻擊者，面前仍然是 7776 的詞數次方。"""

[[faq]]
q = "離開頁面之後還能把密碼找回來嗎？"
a = """
        找不回來，而且是故意的。任何地方都沒記下來，所以沒有什麼可找的：沒有歷史面板，\
        沒有「最近產生」列表，也沒有快取。一個能把上週二的密碼翻給你看的產生器，就是一個\
        把它存下來了的產生器，而存在你夠得著的地方，也就是存在別的東西夠得著的地方。\
        離開之前先複製到密碼管理器裡。"""

[[faq]]
q = "複製到剪貼簿安全嗎？"
a = """
        這是常見的那一類風險，知道它比擔心它有用。剪貼簿和所有以你身份執行的程式共享，\
        通常會留到你下一次複製，有些配置下還會在裝置之間同步。所以該貼的地方立刻貼，\
        貼完再隨便複製點別的，這是好習慣；但這不構成改用手敲一個更弱密碼的理由。這個\
        頁面讀不到你的剪貼簿，它只能往裡寫，而且只在你按下按鈕的時候寫。"""

[[faq]]
q = "同一個能在多個地方用嗎？"
a = """
        不能，而這是這個頁面上唯一一條壓過其他所有建議的建議。幾乎每一個被盜的帳號，\
        用的都是先在別處對過的密碼：某個網站被攻破，名單被公開，同樣的信箱配同樣的\
        密碼被拿到各處去試。一個網站一個密碼，能把一次洩露變成一個帳號而不是全部，\
        這才是值得用密碼管理器的理由，而不是它裡面某一個密碼有多強。"""

[[faq]]
q = "免費嗎？要註冊帳號嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，產生多少個都不限。網站靠廣告養著，而廣告\
        拿不到關於這個頁面產生的東西的任何資訊，長度和強度都拿不到。"""

[[faq]]
q = "離線能用嗎？"
a = """
        能。把頁面載入一次，然後斷開網路，它照樣產生密碼。隨機數來自你自己的裝置，詞表\
        本來就在頁面裡。這也是證明它既沒在取什麼、也沒在發什麼的最簡單辦法：一個要向\
        伺服器要數字的產生器，在你拔線的那一刻就會停下來。"""

[schema]
description = "在瀏覽器裡產生強隨機密碼和 diceware 密碼短語。字元用 crypto.getRandomValues 抽取，詞來自隨頁面送來的 EFF 7776 詞詞表，頁面還會給出產生結果的精確熵值。不上傳，也不儲存。"
features = [
  "從最多 94 個字元的字符集裡產生 6 到 128 位的隨機密碼",
  "用內建的 7776 詞詞表，或者 1296 詞的短表，產生 diceware 密碼短語",
  "每一次抽取都用 crypto.getRandomValues，取模帶來的偏差是丟掉而不是無視",
  "以位元給出精確的熵，從設定裡數出來，而不是給字串打分",
