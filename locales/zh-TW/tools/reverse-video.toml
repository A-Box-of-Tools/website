[[howto]]
title = "決定花多少畫質。"
body = """\
      畫面必須重新編碼，因為幀出來的順序是原檔案里根本沒有為之編碼過的。\
      「均衡」會貼近原片花掉的量，「最佳畫質」則花得更多。"""

[[howto]]
title = "倒過來，然後下載。"
body = """\
      工作是在你自己的硬體上乾的，所以花多久取決於你的機器，而不是排隊。做好\
      的影片直接交給瀏覽器的下載。"""

[[faq]]
q = "我的影片會被傳到哪裡去嗎？"
a = """
        不會。它由你自己的瀏覽器在你自己的硬體上讀取、解碼、倒序和編碼。這個\
        工具沒有服務端，頁面的 <code>Content-Security-Policy</code> 裡寫著它\
        允許聯絡的每一個地址，沒有一個屬於本站。你要是寧可自己查也不願聽我們\
        說，拔掉網線，照樣倒一個試試。"""

[[faq]]
q = "哪些影片格式可以倒放？"
a = """
        MP4、M4V 和 MOV 直接讀，裡面裝什麼都行：H.264、HEVC、AV1 或 VP9，只要\
        你的瀏覽器能解那個編碼。其他瀏覽器能播的東西，最典型的是 WebM，則是\
        靠讓瀏覽器自己的播放器一步步往回走來倒放，能成，但慢一些。瀏覽器既\
        讀不了也播不了的檔案，實際上就是 AVI、WMV、FLV 和大多數 MKV，會帶一句\
        說明直接拒掉，而不是走到一半才失敗。出來的一律是 MP4。"""

[[faq]]
q = "聲音會一起倒過來嗎？"
a = """
        會，除非你把它關掉。整條音軌會被解碼，取樣按相反順序排好，再重新編碼成\
        AAC。這第二遍編碼沒法省：一個音訊包是幾十毫秒的聲音，而且是相對前一個\
        包編碼出來的，所以把包倒著寫出去，只會讓一小段一小段正著播、順序卻是\
        亂的，那聽起來像故障，不像倒放。"""

[[faq]]
q = "倒放會掉畫質嗎？"
a = """
        畫面會被編碼第二遍，這要付一點代價。這裡沒法像剪輯那樣避開：倒過來的\
        片子按一個原檔案根本沒為之編碼過的順序顯示幀，所以每一幀都得重寫一遍。\
        這個工具不會做的是花得比原片更多，因為超過那條線之後再編碼，只會把\
        檔案撐大，畫面並不會更好看。"""

[[faq]]
q = "影片的大小或時長有上限嗎？"
a = """
        工具裡沒有寫死的上限，檔案也不會一次性讀進記憶體，而是一組一組幀地往回\
        走。真正的天花板有兩個：一個是下載前要在記憶體裡拼起來的成品影片，另一個\
        是聲音，它必須整條留著，因為倒放得先拿到最後一個取樣才能寫出第一個。"""

[[faq]]
q = "為什麼有的檔案慢，有的快？"
a = """
        因為進去的路有兩條。MP4 或 MOV 由這個工具直接讀取，一組一組幀地解碼，\
        機器多快它就多快。其他的則是不停地向瀏覽器自己的播放器要片子的某一\
        時刻，而每一次這樣的跳轉都會讓瀏覽器從前面的關鍵幀重新解碼。頁面會在\
        你開始之前說明它走的是哪一條，以及為什麼。"""

[[faq]]
q = "能只倒放其中一段嗎？"
a = """
        這裡不行。這個工具倒的是整段：出來的片子和進去的一樣長，只是最後一幀\
        排在最前。先用<a href="../trim-video/">影片剪輯</a>把你要的那段剪出來，\
        那個工具剪的時候一幀都不用重新編碼，然後再把剪出來的東西拿來倒。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費就是\
        從那裡來的，廣告拿不到任何關於你影片的資訊。"""

