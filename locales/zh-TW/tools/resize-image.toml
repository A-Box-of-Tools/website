[[privacy]]
title = "你的圖片沒地方可去。"
body = """\
      Content-Security-Policy 把這個頁面允許聯的地址全列了出來，沒有一個是\
      本站的。這裡沒有能收檔案的介面，程式碼裡也沒有一行會把檔案發出去，就算\
      真有那麼個介面也一樣。"""

[[privacy]]
title = "這裡沒有任何東西會去聯網取資料。"
body = """\
      整個 <code>src/</code> 裡，一個 <code>fetch</code>、一個\
      <code>XMLHttpRequest</code>、一個 <code>sendBeacon</code> 都找不到。\
      縮放就是往畫布上做一次 <code>drawImage</code>，再來一次\
      <code>canvas.toBlob</code>，縮放器和編碼器都是你瀏覽器裡早就裝好的。"""

[[privacy]]
title = "沒人要求改的檔案，一個位元組都不改。"
body = """\
      沒裁、沒縮、也沒換格式，那你選的那個檔案會被逐位元組原樣還給你，不會重新\
      存一遍。這不只是客氣：正因如此，這個工具不可能悄悄替你重編一張圖，也\
      不可能把你只想看一眼的那張圖的後設資料悄悄丟掉。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google，捐助按鈕來自 Buy Me a Coffee。關於你\
      圖片的資訊，一條都沒給它們。讀檔案、裁切、縮放、寫檔案的每一行程式碼都\
      從本站發出，也都擺在儲存庫裡。"""

[[privacy]]
title = "斷網照樣能用。"
body = """\
      斷開網路，這個工具跟原來一模一樣，因為它本來就沒有聯網這一步。這是最\
      省事的一條證明。"""

[[howto]]
title = "選好你的圖片。"
body = """\
      拖到下面的方框裡，或者點開自己挑。瀏覽器直接從你的硬碟上讀，這期間沒有\
      東西發出去。"""

[[howto]]
title = "想裁就裁。"
body = """\
      裁剪框一開始罩著整張圖，所以你不動它就等於沒裁。拖動它，或者鎖定一個\
      形狀，頭像用 1:1，快拍用 9:16，影片封面用 16:9，再按「拉到最大」取這個\
      形狀下能放進去的最大一塊。每張圖各有各的框，點列表裡任意一行，就改在\
      那張上畫。要是全都想按同一種取景，也有一個按鈕一次搞定。"""

[[howto]]
title = "說清楚出來要多大。"
body = """\
      給寬，給高，或者兩個都給；給一個長邊，這樣直幅構圖和橫幅構圖出來一樣大；\
      或者乾脆給個百分比。兩個框裡留空一個，圖片就保持自己原來的比例。"""

[[howto]]
title = "挑好格式，然後按按鈕。"
body = """\
      可以各自保持進來時的格式，也可以一律寫成 JPEG、PNG 或 WebP。每個結果都\
      寫明它變成了什麼、小了多少，點開就是全尺寸大圖，背後那些數字全在，旁邊\
      還擺著原圖供你對照。整批下載會打成一個 zip。"""

[[faq]]
q = "我的圖片會傳到什麼地方去嗎？"
a = """
        不會。解碼、裁切、縮放、寫出，全由你自己的瀏覽器在你自己的硬體上完成，\
        用的是瀏覽器內建的 JPEG、PNG 和 WebP 編碼器。這個工具沒有任何聯網功能，\
        不取東西，也不發東西。頁面的 <code>Content-Security-Policy</code> 把它\
        可能聯的地址全列了出來，沒有一個是本站的。"""

[[faq]]
q = "只給寬、不給高會怎麼樣？"
a = """
        高按圖片自己的比例算出來，這幾乎總是你要的：說「寬 1920」，意思就是\
        「寬 1920，高該多少是多少」。兩個都填上，它們就可能跟圖片本身的比例\
        對不上，也只有這時候才會冒出「比例對不上怎麼辦」那個選擇：整張放進框裡、\
        鋪滿並裁掉溢位、用背景色墊成這個框、或者直接拉伸認了變形。"""

[[faq]]
q = "縮小會掉畫質嗎？"
a = """
        縮小不會，至少你看不出來：進去的畫素比出來的多，留下的細節都是真的。\
        放大則補不出當初沒拍到的東西，結果是同一張圖的一份更糊的副本，不會\
        更清楚，所以「絕不把圖片放大」預設開著。真正要花點代價的是之後那次重新\
        編碼，格式是 JPEG 或 WebP 時才有，而品質滑塊就是你在那裡花錢的地方。"""

[[faq]]
q = "能給每張圖裁得不一樣嗎？"
a = """
        能，而且預設就是這樣。列表上每張圖都帶著自己的框，按自己的畫素算，點\
        某一行，那張圖就連著它自己的框和鎖定的形狀一起回到預覽裡。你動其中一張，\
        不會影響別的。每個框一開始都罩著整張圖，所以你從沒畫過的那張，壓根沒\
        被裁。"""

[[faq]]
q = "能一次給整批圖裁成一樣的嗎？"
a = """
        能，用預覽下面那個按鈕。它會給其餘每張圖同樣的相對區域，也就是各自寬高\
        的同樣比例。一批本來尺寸就一致的截圖或者匯出圖，那就是完全相同的一個框，\
        頁面也會這麼寫。要是鎖了形狀，它會在那塊區域裡給每張圖取這個形狀下最大\
        的一個框，所以先按 1:1 再按這個按鈕，橫直混雜的一個資料夾就能全出方圖。\
        之後每個框還是照樣能改。"""

[[faq]]
q = "它能讀、能寫哪些格式？"
a = """
        你的瀏覽器能解碼的它都能讀，實際上就是 JPEG、PNG、WebP、GIF、BMP，\
        現在多數瀏覽器還包括 AVIF。寫出來的是 JPEG、PNG 和 WebP，因為瀏覽器\
        內建的編碼器就這三種。選「保持原格式」時，JPEG 還是 JPEG，PNG 還是 PNG；\
        瀏覽器寫不了的格式，比如 GIF 和 BMP，會出成 PNG，因為它既保得住透明，\
        也保得住大片純色。"""

[[faq]]
q = "存成 JPEG 的話，透明會怎麼樣？"
a = """
        會被背景色填掉，因為 JPEG 沒有 alpha 通道可以裝它。顏色由你挑，預設\
        白色，這是多數人想要的，也是幾乎所有別的工具會一聲不吭直接替你做的。\
        墊成固定尺寸時用的也是這個顏色。存成 PNG 或者 WebP，透明就原樣過來。"""

[[faq]]
q = "它會去掉 EXIF 和 GPS 資訊嗎？"
a = """
        真正被處理過的圖會，屬於順帶的效果：裁切或者縮放都得把畫面解碼成畫素、\
        再把畫素編回去，而一張畫布上只有畫素，不帶任何標籤，所以位置、相機型號\
        和時間戳乾脆就沒寫進新檔案。你完全沒動過的檔案是另一回事，它逐位元組原樣\
        還給你，標籤一個不少。想清掉後設資料、畫面別動，那該用\
        <a href="../exif-editor/">EXIF 檢視與清除</a>，它只重寫容器，不重新\
        壓縮任何東西。"""

[[faq]]
q = "這個跟圖片壓縮有什麼區別？"
a = """
        這個管的是尺寸：你說要多少畫素，它就給你多少畫素。\
        <a href="../compress-image/">圖片壓縮</a>管的是檔案大小：你說只准多少
        KB，它去找剛好塞得進去的最高畫質，只有畫質單獨夠不到才動尺寸。人家跟你\
        說「寬 1200 畫素」，你就來對了地方；人家說「不能超過 500 KB」，那邊更\
        對路。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。檔案的數量和大小同樣\
        沒有上限，因為沒有哪臺伺服器在為它們掏錢，工作是在你自己的機器上乾的。\
        本站帶廣告，經費就是這麼來的，廣告拿不到關於你圖片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明「什麼都沒上傳」最省事的\
        辦法。一個把圖片送出去縮放的工具，拔線那一刻就停了。"""

