  "用 Myers 演算法比對兩段文字，可並排或單列顯示",
  "在改動行內部標出變化的詞",
  "把比對結果下載成程式碼評審讀得懂的 unified diff",
  "兩套字母表的 Base64、百分號編碼、HTML 實體、十六進位和反斜槓轉義",
