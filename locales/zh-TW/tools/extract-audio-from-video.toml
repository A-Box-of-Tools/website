[[faq]]
q = "我的影片會被上傳到什麼地方嗎？"
a = """\
        不會。解碼和寫出都在你自己的瀏覽器裡、你自己的硬體上完成。這個工具壓根\
        就沒有網路功能，從不取任何東西，也從不發任何東西，頁面的 \
        <code>Content-Security-Policy</code> 裡寫著它允許聯絡的每一個地址，\
        沒有一個屬於本站。與其聽我們說，不如拔掉網線，照樣把聲音取出來。"""

[[faq]]
q = "能給我一個 MP3 嗎？"
a = """\
        不能，也不會假裝能。沒有哪個瀏覽器內建 MP3 編碼器，唯一的方法是把你的\
        影片送到一臺有編碼器的伺服器上，而這恰恰是本站存在的意義所要避免的那\
        一件事。你拿到的是 WAV：取樣前面加四十四個位元組的檔案頭，根本不需要\
        編碼器，也不可能損失音質。它更大，立體聲每分鐘大約十兆位元組，但任何\
        播放器、手機和剪輯軟體都能開啟。要 MP3 的東西，一秒鐘就能從它做一個。"""

[[faq]]
q = "畫面會被看到嗎？"
a = """\
        不會，這裡也沒有任何東西能看。把檔案交給瀏覽器的解碼器，向它要音軌；\
        影片軌從不解碼、從不繪製，甚至到不了這個頁面的程式碼裡。\
        <code>src/</code> 裡沒有任何影片解碼器可以執行。出來的檔案裡只有聲音。"""

[[faq]]
q = "它說讀不到聲音，可影片明明能正常播放。"
a = """\
        那這個影片幾乎可以肯定就沒有音軌。錄屏時沒選麥克風，錄出來是靜音的；\
        剪輯軟體匯出時把聲音靜音了，也是靜音的。兩者都能正常播放，因為有畫面\
        可放。提示先說這一種，因為它是兩種原因裡更常見的那個；另一種是這個\
        瀏覽器讀不了的格式。用播放器開啟檔案，找一找那個怎麼調都沒反應的音量\
        條，這是分辨兩者最快的辦法。"""

[[faq]]
q = "我能開啟哪些影片格式？"
a = """\
        你的瀏覽器能解碼的都行，實際上就是 MP4、M4V、MOV 和 WebM，另外還有\
        所有音訊格式。被擋在外面的還是本站各處都一樣的那張短名單：AVI、WMV，\
        以及大多數 MKV。你的瀏覽器讀不了的檔案會被拒絕，並說明原因，而不是\
        走到一半才失敗。"""

[[faq]]
q = "會損失音質嗎？"
a = """\
        除了這個影片當初製作時已經對自己的音訊做過的那些，不會再多損失什麼。\
        解碼器交回來的取樣照抄下來，沒有第二次編碼，也就沒有第二代損失。唯一\
        要知道的是取樣率：先從檔案頭裡讀出它自己的取樣率，再按這個取樣率解碼，\
        所以你的錄音不會被悄悄重取樣。檔案要是沒寫，頁面會說明它按哪個取樣率\
        處理的。"""

[[faq]]
q = "為什麼 WAV 比影片大這麼多？"
a = """\
        因為 WAV 不壓縮，而影片的音軌壓縮過。CD 音質的聲音，不管內容是什麼，\
        立體聲每分鐘大約十兆位元組；MP4 裡的 AAC 音軌大概只有它的十分之一。混成\
        單聲道能減一半。這是不重新編碼的代價，而且只付一次：接下來用什麼開啟\
        這個檔案，那個東西都能壓縮它。"""

[[faq]]
q = "影片最長能有多長？"
a = """\
        這裡沒有設限，因為沒有伺服器在為此付錢。真正的上限是你自己裝置的記憶體：\
        檔案要讀進來，整條音軌要以取樣的形式留在記憶體裡，所以在小裝置上處理很長\
        的錄音可能會不夠用。幾個小時的影片通常沒問題，手機能扛的比筆記本少。"""

[[faq]]
q = "能剪短或者調大音量嗎？"
a = """\
        能，但不在這裡，這個頁面只做一件事。有結果之後，下載旁邊會出現一排\
        連結，不用先儲存就把它直接送進<a href="../trim-audio/">音訊剪輯</a>或者\
        <a href="../edit-audio/">音訊編輯</a>，那兩個也一樣不上傳。"""

[[faq]]
q = "免費嗎？需要註冊嗎？"
a = """\
        免費，沒有帳號，不用登入，沒有試用期，也不限制你開啟多少個影片。本站\
        有廣告，網站靠它維持；廣告拿不到關於你檔案的任何東西。"""

[[faq]]
q = "斷網還能用嗎？"
a = """\
        能。頁面載入一次之後拔掉網線，它照樣工作。這也是證明沒有上傳的最簡單\
        辦法：一個把你的影片送出去處理的工具，在你拔線的那一刻就停了。"""

