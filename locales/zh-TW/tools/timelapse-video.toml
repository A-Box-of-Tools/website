[[faq]]
q = "我的影片會傳到什麼地方去嗎？"
a = """
        不會。讀取、解碼、挑幀、編碼，全由你自己的瀏覽器在你自己的硬體上完成。\
        這個工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code> \
        把它可能聯的地址全列了出來，沒有一個是本站的。與其聽我們說，不如拔掉\
        網線，照做一段試試。"""

[[faq]]
q = "倍數到底指什麼？"
a = """
        進去多長比出來多長。60&times; 就是一小時的素材變成一分鐘，你用多少幀率\
        播都還是一分鐘。往裡拆，工具每隔<em>倍數 &divide; 幀率</em>秒取一幀。\
        30 幀每秒下的 60&times;，就是兩秒一幀。開始之前頁面會把這個間隔寫出來，\
        真正說明發生了什麼的是它。"""

[[faq]]
q = "能加速哪些格式？"
a = """
        MP4、M4V 和 MOV 直接讀，裡面裝的是 H.264、HEVC、AV1 還是 VP9 都行，\
        只要你的瀏覽器解得了那個編碼。其他瀏覽器能播的格式，最典型的是 WebM，\
        改成把播放器挪到每個時刻上去讀，凡是它能播的都走得通。瀏覽器既讀不了\
        也播不了的檔案，實際上就是 AVI、WMV、FLV 和大多數 MKV，會被直接拒收\
        並說明原因，不會做到一半才崩。出來的永遠是 MP4。"""

[[faq]]
q = "延時影片為什麼沒聲音？"
a = """
        因為沒什麼值得留的。快三十倍的聲音既不是說話也不是音樂，只剩一串尖響。\
        反過來把原速的聲音墊在早就跑到前頭的畫面下面，那就成了另一段片子，不是\
        你要的那段。所以音軌直接丟掉。一小時的影片最後只有幾 MB，主要也是因為\
        這個。你要是想單留聲音，<a href="../edit-audio/">音訊編輯</a>能存。"""

[[faq]]
q = "這比整段轉碼快嗎？"
a = """
        快得多，直接讀檔案就是為了這個。一幀只能從它前面的關鍵幀開始解，可中間\
        那些幀沒人規定必須留下。一小時做成 60&times;，解的是幾千幀，不是十萬幀。\
        按下按鈕之前，摘要會告訴你它到底要讀多少幀。"""

[[faq]]
q = "會掉畫質嗎？"
a = """
        留下的幀要再編一遍，這點損失躲不掉，成品把它們放在原檔案裡根本沒編碼過\
        的時刻上。這個工具跟這裡其他影片工具不一樣的地方，是位元速率給得更足，而且\
        是故意的。隔了兩秒的兩幀，比隔了三十分之一秒的兩幀共同處少得多，編碼器\
        能複用的就少，按普通素材調出來的數值在這裡會糊成一塊一塊。"""

[[faq]]
q = "影片的大小和長度有限制嗎？"
a = """
        工具裡沒設上限，檔案也不整個讀進記憶體，只讀每個時刻前後那一小段。真正的\
        天花板是成品，它要在記憶體裡拼好你才能下載，而延時影片按定義就是短的。\
        開始之前摘要會給出大概多大。"""

[[faq]]
q = "能只加速其中一段嗎？"
a = """
        這裡不行。這個工具從第一幀一直取到最後一幀。想要哪一段，先用\
        <a href="../trim-video/">影片剪輯</a>切出來，那邊一幀都不用重編，再把\
        切出來的檔案拿到這裡加速。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費\
        就是這麼來的，廣告拿不到關於你影片的任何資訊。"""

[schema]
browser_requirements = "需要 JavaScript，以及能用 WebCodecs 編碼影片的瀏覽器：Chrome、Edge、Safari 16.4 及以上，或 Firefox 133 及以上。"
description = "在瀏覽器裡把長影片做成延時影片。從原片每隔幾秒取一幀，把這些幀寫成一段 24、30 或 60 幀每秒的短 MP4。MP4、MOV 和 M4V 直接讀，而且只讀需要的時刻前後那幾段；瀏覽器能播的其他格式改用挪動播放位置的方式讀。什麼都不上傳。"
features = [
  "把 MP4、MOV、M4V、WebM 影片加速 1.1 倍到 1000 倍",
  "可以說倍數，也可以說成品要多長",
  "只讀所選時刻用得上的那幾段",
  "24、30 或 60 幀每秒，原尺寸或縮小",
  "斷網能用，不上傳，不註冊，沒有水印",
]

[picker]
title = "把影片拖到這裡"
hint = "或者點選選擇，MP4、MOV、M4V、WebM，以及這個瀏覽器能播的其他格式"
