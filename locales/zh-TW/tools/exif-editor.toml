[[faq]]
q = "我的照片會傳到什麼地方去嗎？"
a = """
        不會。讀取、解析、重寫，全由你自己的瀏覽器在你自己的硬體上完成。這個\
        工具沒有任何聯網功能，不取東西，也不發東西。頁面的\
        <code>Content-Security-Policy</code> 把它可能聯的地址全列了出來，\
        沒有一個是本站的。"""

[[faq]]
q = "EXIF 是什麼？照片裡還藏著別的嗎？"
a = """
        EXIF 是相機寫在畫面旁邊的一堆標籤：廠牌和型號、曝光引數、精確到秒的\
        日期時間，常常還有 GPS 位置，有時候連機身序列號都在。照片往往還帶著\
        更多東西，修圖軟體留下的 XMP（一段 XML）、裝著圖說和署名欄位的 IPTC
        塊、色彩配置檔案、一份當縮圖用的小副本，還有廠商自己那套沒有公開\
        文件的 maker note。這些，這個工具全給你列出來。"""

[[faq]]
q = "刪後設資料會讓畫質變差嗎？"
a = """
        不會。這也正是該用這類工具、而不是把照片另存一遍的主要理由。後設資料待\
        在壓縮畫面外面的容器裡，不在畫面裡面。刪它，等於從一張清單上劃掉幾項\
        再把清單寫回去，壓縮後的影像資料逐位元組照抄過去，所以結果解碼出來的\
        畫素跟原來一模一樣。全程不解碼，也不重新壓縮。"""

[[faq]]
q = "支援哪些格式？"
a = """
        JPEG、PNG 和 WebP。HEIC 和 AVIF 認得出來，但不重寫：它們是巢狀原子\
        搭起來的盒式格式，得換一套解析器，所以工具直說做不了，而不是給你一個\
        壞檔案。裸 TIFF 也不做，因為 TIFF 裡後設資料和畫素用的是同一套偏移量。"""

[[faq]]
q = "清完後設資料，照片會不會躺倒？"
a = """
        有可能，所以專門留了個開關。手機一般按感測器看到的樣子存畫面，另外加\
        一個方向標籤說明該往哪邊轉。這個標籤一刪，有些看圖軟體就把照片橫過來\
        顯示。「保留方向標籤」預設是開的，開著的時候會寫回一個極小的 EXIF 塊，\
        裡面只有這一個標籤，而且只在照片確實需要的時候才寫。你要是寧可檔案裡\
        一點 EXIF 都不剩，把它關掉。"""

[[faq]]
q = "它會刪掉 GPS 位置嗎？"
a = """
        會。全清會把整個 GPS 目錄一起帶走，你也可以只刪位置、別的都留著。位置\
        先按十進位度顯示，因為「北緯 51 度 30 分 26 秒」這種寫法，看不出一張照片\
        其實點名了它是在哪棟樓裡拍的。"""

[[faq]]
q = "能改標籤，而不是刪掉嗎？"
a = """
        能。文字類標籤、日期、ISO、方向和解析度都能改，還有幾個常用標籤可以\
        給本來沒有的照片補上。有一點要說在前頭：寫檔案會重建整個 EXIF 塊，而
        maker note 裡存的是指向原來那個塊的偏移量，重建之後，廠商自己的軟體\
        可能就讀不出它了。你要是在意這個，那就把它刪掉，或者乾脆不改這個檔案。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，也沒有試用期。本站帶廣告，經費就是這麼來的，\
        廣告拿不到關於你照片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明「什麼都沒上傳」最省事的\
        辦法。一個把照片送出去處理的工具，拔線那一刻就停了。"""

