  "列出每一個 EXIF 標籤，GPS 位置、機身序列號和 maker note 都在內",
  "逐條修改或刪除標籤，再把檔案寫回去",
  "一鍵清掉 EXIF、GPS、XMP、IPTC、註釋和內嵌縮圖",
  "支援 JPEG、PNG 和 WebP",
  "只重寫容器，畫面從不重新壓縮",
