[[privacy]]
title = "黑塊不是塗黑，而這裡也不會在任何東西上面畫一個。"
body = """

      幾乎每一個說自己能塗黑一頁的程式裡，不管是 PDF 閱讀器、文書處理軟體還是設計\
      工具，那個黑塊都是存在文字旁邊的一個物件，而不是存進文字裡。文字還在那裡，\
      在同一個檔案的同一個位置，把那塊區域選中按複製就拿回來了。就是這個失誤讓法院\
      文書、情報報告，以及 2025 年 12 月美國司法部大批檔案裡被塗黑的姓名公之於眾，\
      而那些姓名在幾小時內就被讀了出來。這個工具是把字從繪製頁面的指令裡刪掉。\
      這裡沒有哪個黑塊底下還壓著什麼，因為底下什麼都沒有。"""

[[privacy]]
title = "做好的檔案在交給你之前，會在這裡重新開啟、重新搜一遍。"
body = """

      在那之前，上面這些話都只是這個工具在給自己判卷。所以那些馬上就要變成你下載\
      內容的位元組，會被當作陌生人寄來的一樣重新交回同一個讀取模組：每一頁重新讀一遍，\
      每一個書籤、註解、表單域和文件屬性都收集起來，然後去搜你拿掉的那些詞。數量會寫在\
      結果裡。要是有東西活了下來，這一次就報告為失敗，不給下載。"""

[[privacy]]
title = "詞不會離開這個分頁，搜尋也不會。"
body = """
 Content-Security-Policy 裡寫著\
      這一頁能聯絡的每一個地址，沒有一個屬於本站。這個工具沒往那份名單裡加任何東西，\
      因為它沒有自己的聯網功能，連可選的都沒有。你在搜尋框裡打的字，是拿來跟這個分頁\
      記憶體裡的文字比對的一串字元，這兩樣都沒有地方可去。"""

[[privacy]]
title = "塗黑是最經不起上傳的那件事。"
body = """

      人們拿去塗黑的東西，正是它不該被上傳的理由。證人證言、診斷書、要交給房東的銀行\
      流水、帶著一個客戶名字卻要發給另一個客戶的合同。把這些交給陌生人的伺服器去掉\
      私密部分，意味著私密部分先完完整整地到了那邊，而留在他們那裡的也正是那一版。\
      這一頁沒有另一半。"""

[[privacy]]
title = "留下的部分原樣傳過去。"
body = """

      一頁上會變的位元組，只有那些包含了被刪字元的文字繪製指令。其他每一條指令，以及這一頁\
      用到的每一個字型、圖片和線條，都按進來時的樣子精確複製。不重繪，不重新編碼，也不\
      重排。刪掉部分的寬度會量出來，再作為一條字距指令放回去，於是這一行的其餘部分\
      還停在文件原本安排的位置上。"""

[[privacy]]
title = "它拿不掉照片裡的詞，而且會說清哪些頁面是這種。"
body = """

      掃描出來的一頁是一張圖。上面的詞是畫素，不是文字，這裡沒有任何東西能碰到它們。\
      要是這份掃描檔帶著掃描器 OCR 做的那層看不見的可搜尋文字，這個工具會把那一層拿掉，\
      而搜尋和複製原本找到的正是它。同時它會在頁面上明說：圖裡的詞還看得見。要蓋住那張圖\
      是另一件事，負責覆蓋畫素的是\
      <a href=\"../redact-image/\">圖片塗黑</a>。"""

[[privacy]]
title = "文件不再交代自己從哪裡來。"
body = """

      屬性和 XMP 包每次都會被清掉：沒有 producer 那一行，沒有建立日期，沒有作者，\
      沒有標題，也沒有排版軟體留下的那些私有塊。一份從頁面上刪掉了姓名、屬性裡卻還寫著\
      <code>張某_和解稿3.docx</code> 的檔案，不是一份塗黑過的檔案，而這件事不該交給\
      一個勾選框去管。"""

[[privacy]]
title = "加密的檔案會被退回，而不是開啟。"
body = """

      帶密碼的 PDF 會被拒收，包括掃描器用空密碼產生、技術上打得開的那一類。\
      去掉一份文件的保護，跟從裡面拿走幾個詞是兩件事，而悄悄替你做掉，對一個替你運作的\
      工具來說是件出人意料的事。"""

[[privacy]]
title = "谷歌載入了什麼，又拿不到什麼。"
body = """
 廣告和統計指令碼來自谷歌。這兩個都拿不到\
      關於你文件的任何東西：檔案拿不到，頁面拿不到，姓名、大小、頁數，以及你搜過的詞，\
      都拿不到。讀取、修改、寫出 PDF 的每一行都由本站自己提供，也都寫在倉庫裡。"""

[[privacy]]
title = "捐贈按鈕載入了什麼，又拿不到什麼。"
body = """

      頁面頂部那個「Buy me a coffee」按鈕由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它就是個連結而已，不會報告訪問，也拿不到關於你或者你文件的\
      任何東西。你不點它就什麼都不會發生，點下去到的是別人的網站。"""

[[privacy]]
title = "斷網也能用。"
body = """
 把網路斷掉，這一頁上的一切照樣運轉。這是最簡單的\
      證明。要是有個工具把你的文件送出去讓別人塗，它就停了。"""

[[howto]]
title = "選 PDF。"
body = """
 一次只處理一份文件，這是故意的。塗黑是一件必須\
      一頁一頁看過去的工作，而一個讓你在這份檔案裡勾詞、又悄悄把它用到另一份上的工具，\
      正是錯的東西被發出去的那條路。檔案由瀏覽器直接從你的硬碟讀取。"""

[[howto]]
title = "說清什麼要走。"
body = """
 把詞打進去，姓名、地址、案號都行，它們\
      出現的每一處都會連著所在的那一行、帶一個勾選框列出來。框旁邊那些檢測項會去找\
      電子信箱、卡號、IBAN、身份證號和社保號，以及電話號碼。它們只是列給你看，絕不替你\
      勾上，因為一個模式分不清電話號碼和案號。"""

[[howto]]
title = "讀這一頁，從上面挑詞。"
body = """

      這一欄顯示的是文件裡實際存著的文字，順序是讀的人複製時會得到的順序。點任何一個詞\
      就是拿掉它，再點一下就是留下它。劃了橫線的就是要消失的，所以這一步既是挑選也是\
      複核，按下按鈕之前每一頁都值得這麼過一遍。"""

[[howto]]
title = "拿掉它們，再讀那行寫著已經查過的字。"
body = """

      字被刪掉，它們空出來的寬度保留著，你要的話上面畫一個黑塊，同樣的詞也會從書籤、\
      註解、表單域和文件屬性裡拿走。然後做好的檔案會在這裡重新開啟、重新搜一遍。\
      要是你拿掉的某個詞還搜得到，你拿不到下載，只會拿到一句說明這件事的話。"""

[[faq]]
q = "這跟在 PDF 閱讀器裡畫個黑塊有什麼不一樣？"
a = """
        在閱讀器裡畫的方塊是一個註解，一個帶位置的物件，存在頁面旁邊。它下面的文字\
        分毫未動。誰把那塊區域選中按複製、誰把檔案在別的程式裡開啟、誰拿任何一個文字\
        提取器過一遍，都能把詞拿回去。有些閱讀器提供的「redact」命令確實會真的執行刪除，\
        也有好幾款只提供畫方塊。這個工具沒有什麼方塊可以挪開：字是從頁面的繪製指令裡\
        切掉的，而那個黑塊，如果你留著它，是事後畫在一處早就空了的位置上。"""

[[faq]]
q = "我怎麼知道那些詞真的沒了？"
a = """
        因為這個工具會在你的機器上查一遍，並且把數量給你看。檔案寫完之後，它會被這一頁上\
        同一個讀取模組重新開啟，每一頁重新讀，每一個書籤、註解、表單域和屬性都收集起來，\
        再把你拿掉的每一個詞搜一遍。結果那一行會寫清原來有多少、現在還剩多少。答案要是不對，\
        這一次就失敗，什麼都不給下載。你也可以事後自己查：在任何閱讀器裡按 Ctrl+F 搜那個詞。"""

[[faq]]
q = "拿掉一個詞，這一頁別的地方會移位嗎？"
a = """
        不會。文字是靠一支筆在頁面上往前推著畫出來的，所以刪掉五個字元，照常理會把這一行\
        剩下的部分往左拽五個字元。被刪部分的確切寬度會從字型自己的度量裡量出來，再作為一條\
        字距指令放回去，那條指令只挪筆，不畫任何東西。表格的列還是對齊的，合計還在它自己的\
        表頭下面。"""

[[faq]]
q = "掃描出來的文件能塗黑嗎？"
a = """
        圖不能，而且它照實說，不裝。掃描檔是一頁紙的照片，上面的詞是畫素，沒有可拿走的文字。\
        不過掃描檔常常還帶著一層看不見的文字，是掃描器的 OCR 寫在圖上面、為了讓這一頁可以\
        搜尋的。這個工具會找到那一層，從裡面拿掉你挑的內容，並在頁面上告訴你圖沒有變。\
        於是搜尋和複製再也找不到那個詞，而看著這一頁的人還是讀得到。要處理圖本身，\
        <a href=\"../redact-image/\">圖片塗黑</a>會去覆蓋畫素。"""

[[faq]]
q = "文件裡那些不在頁面上的部分呢？"
a = """
        也一起處理，因為塗黑漏掉的通常正是那裡。同樣的詞會從書籤、註解和便籤裡拿走，\
        從表單域裡填過的內容裡拿走，從給螢幕閱讀器的文字裡拿走，也從閱讀器用來\
        <em>代替</em>頁面上那些字元去複製的替換文字裡拿走。最後這一樣存在的意義是讓連字\
        和行末斷開的詞能正確複製，而它裡面可以裝下一整句話。文件屬性和 XMP 包整個刪除。\
        附件和檔案開啟時會執行的東西全部丟棄，因為這兩樣都沒法拿你要刪的詞去搜。"""

[[faq]]
q = "我的文件會被上傳嗎？"
a = """
        不會。檔案的讀取、修改和寫出全都由你自己的瀏覽器在你自己的硬體上完成。這個工具\
        根本沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code> 裡寫著它能\
        聯絡的每一個地址，沒有一個屬於本站。你在搜尋框裡打的字，是拿來跟這個分頁記憶體裡\
        的文字比對的，它也不去任何地方。"""

[[faq]]
q = "為什麼不能像別的工具那樣在頁面上拖一個框？"
a = """
        因為畫出一頁來意味著一個完整的 PDF 渲染器，字型、漸變、透明度、混合模式全都要，\
        那是一兆以上的引擎要去取來執行，而本站根本不發這種東西。這件事反倒正合適：\
        拖一個方塊選中的是<em>紙上的一塊區域</em>，而紙上的一塊區域跟它下面的文字不是\
        同一樣東西，黑塊那個失誤正是從這裡開始的。你拿到的是文件的文字，按閱讀順序排好，\
        每個詞都可以點。而且這也是唯一一種能告訴你「眼前這些詞到底是不是文字」的檢視，\
        一張頁面的圖片說不出這一點。"""

[[faq]]
q = "做好的檔案到哪裡都打得開嗎？"
a = """
        打得開。輸出寫成 PDF 1.5，或者你給的那份檔案所需要的最高版本，而 1.5 是 2003 年\
        以後出的每一個閱讀器都懂的。頁面上的東西沒有一樣被重新編碼：字型、圖片和向量圖形\
        逐位元組原樣透過，所以留下的文字還跟原來一樣可以選中、可以搜尋。"""

[[faq]]
q = "它能開啟帶密碼的 PDF 嗎？"
a = """
        不能，而且這是故意的。加密的文件會被拒收，並附上一句說明，密碼是空的時候也一樣，\
        而很多掃描器和影印機就是那樣存的。去掉一個檔案的保護，跟從裡面拿走幾個詞是兩件事，\
        一個悄悄替你做掉的工具，做的是你沒要求過的事。"""

[[faq]]
q = "有大小限制嗎？要錢嗎？"
a = """
        工具裡沒有寫死任何限制。限制是你自己的機器：處理期間文件放在記憶體裡，所以筆記本\
        吃下幾百 MB 不會有意見，再往上某處就開始吃力了。免費，沒有帳號，不用登入，也沒有\
        試用期。本站靠廣告養活，廣告那邊拿不到關於你文件的任何東西。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。把頁面載入一次，然後斷網，它照樣能用。這也是證明什麼都沒被上傳的最簡單辦法。\
        要是有個工具把你的文件送出去讓別人塗，拔掉網線的那一刻它就停了。"""

