features = [
  "PNG、JPEG、WebP、GIF、ICO、AVIF 等格式的 base64 data URI",
  "SVG 走百分號編碼，比 base64 短，而且在樣式表裡還看得懂",
  "現成的 CSS 規則、CSS 自定義屬性、HTML img 標籤或 Markdown，引號一律加對",
  "媒體型別從檔案自己的位元組裡讀，不看副檔名",
  "算出這次編碼多花了多少字元，以及這麼大內聯進去值不值",
  "EXIF、XMP 或色彩配置檔案即將被抄進樣式表時，提前提醒",
  "逐位元組複製檔案，不重新編碼，不掉畫質",
  "支援批次，全部結果一次複製或者存成一個檔案",
  "斷網能用，不上傳，不註冊",
]

