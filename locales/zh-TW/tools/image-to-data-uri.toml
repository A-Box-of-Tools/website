[[faq]]
q = "我的圖片會傳到什麼地方去嗎？"
a = """
        不會。讀取和編碼都由你自己的瀏覽器在你自己的硬體上完成，用的是瀏覽器\
        早就有的兩個函式。這個工具沒有任何聯網功能，不取東西，也不發東西。\
        頁面的 <code>Content-Security-Policy</code> 把它可能聯的地址全列了\
        出來，沒有一個是本站的。"""

[[faq]]
q = "data URI 是什麼？"
a = """
        一種把整個檔案寫在“本該寫網址的地方”的辦法。原來寫\
        <code>url("logo.png")</code>，瀏覽器就得跑一趟去取；改寫成\
        <code>url("data:image/png;base64,iVBORw0...")</code>，圖片本身就在\
        這串字裡，瀏覽器當場解出來。實際效果是少一次請求，圖片跟著樣式表或者\
        頁面一起到，而不是等它們到了之後再去取。"""

[[faq]]
q = "為什麼我的 SVG 沒走 base64？"
a = """
        因為 base64 對它來說是錯的編碼。SVG 本身是文字，而網址本來就能裝文字，\
        只有少數幾個字元需要轉義。把那幾個轉成百分號寫法、別的原樣留著，生成的
        URI 通常比同一個檔案的 base64 短五分之一左右，而且在樣式表裡還看得懂，\
        元素名、顏色、<code>viewBox</code> 都還在，隨手能改。個別工具鏈非要\
        <code>;base64</code> 不可，頁面上有個勾選框可以強制。"""

[[faq]]
q = "base64 會讓圖片大多少？"
a = """
        大約三分之一。三個位元組的檔案變成四個字元的 base64，也就是 33%，前面還要\
        再加上 <code>data:image/png;base64,</code> 這一截。這是底線，躲不掉，\
        用網址允許的那些字元去表示任意位元組，代價就是這麼多。也正因如此，頁面把\
        字元數擺在檔案大小旁邊，省得你等樣式表都發布了才發現。"""

[[faq]]
q = "什麼時候內聯圖片才真的划算？"
a = """
        又小又必須馬上出現的時候。每個頁面都要載入的樣式表裡放一個 2 KB 的圖示，\
        這是明擺著的賺：少一次往返，CSS 一到圖就在。過了大約 10 KB，這筆帳就\
        翻過來了。內聯進去的圖片不再是一個獨立檔案，沒法單獨快取，沒法跟別的\
        東西並行下載，而且外面那個檔案一改，它就得整個再下一遍。樣式表裡塞一張
        200 KB 的照片，等於給全站每個頁面的關鍵路徑都加了 200 KB。每個結果落在\
        界線的哪一邊，頁面會告訴你。"""

[[faq]]
q = "gzip 能把 base64 多出來的那部分壓回去嗎？"
a = """
        沒大家想的那麼靈。base64 編的要是本來就壓過的檔案，PNG、JPEG、WebP 都\
        是這種，壓出來效果很差，因為裡頭幾乎沒有冗餘留給壓縮器去找了。通常也就\
        找回 base64 多出來那三分之一里的十分之一，絕不是全部。百分號編碼的 SVG
        正好相反，它還是文字，壓縮效果跟原來差不多，這也是不該給 SVG 上 base64
        的又一個理由。"""

[[faq]]
q = "這一步會動我的圖片嗎？"
a = """
        不會，而且這一點跟這裡多數工具是刻意不同的。沒有哪一步把它解碼成畫素\
        再編回去，從你硬碟上讀出來的位元組，就是進 URI 的那些位元組。JPEG 還是原來\
        那個 JPEG，畫質一樣，尺寸一樣。也正因為如此，結果可以說就是同一個檔案，\
        而不是它的一份副本。"""

[[faq]]
q = "那 EXIF 和 GPS 也一起進樣式表了？"
a = """
        是的，而這正是粘出去之前值得想一想的地方。因為什麼都不重新編碼，相機\
        寫下的東西全都跟著畫面走：位置、時間戳、機身序列號。手機照片裡這些能\
        佔到 30 KB，編成 base64 就是 40 KB 壓在你頁面的關鍵路徑上，同時還把一個\
        家庭住址提交進了倉庫。JPEG、PNG 和 WebP 裡到底帶了多少後設資料，頁面會讀\
        出來告訴你。想先清乾淨，用<a href="../exif-editor/">EXIF 檢視與清除</a>。"""

[[faq]]
q = "為什麼它用的型別跟我的副檔名不一樣？"
a = """
        因為副檔名可能是錯的，位元組不會。一個叫 <code>logo.png</code>、其實是按
        JPEG 匯出的檔案，常見到每個圖片工具都得應付。而一個型別宣告錯了的 data
        URI 根本不顯示，沒有兜底，也沒有一句值得看的報錯。所以型別是從檔案開頭\
        那幾個位元組讀出來的，這裡涉及的每種格式，開頭都說得毫不含糊。兩邊對不上\
        時，頁面會告訴你。"""

[[faq]]
q = "預覽是空白，哪裡出問題了？"
a = """
        多半不是 URI 的問題。HEIC 和 TIFF 都能生成完全合法的 data URI，可除了
        Safari 沒有瀏覽器畫得出來，所以你粘到哪裡它就在哪裡缺一塊。先用\
        <a href="../compress-image/">圖片壓縮</a>或者\
        <a href="../resize-image/">圖片縮放</a>轉成 PNG、JPEG 或 WebP 再說。\
        要是格式本來就很普通，那多半是檔案本身壞了：預覽是拿這個頁面生成的 URI
        畫的，畫不出來，就說明這張圖沒能解碼。"""

[[faq]]
q = "data URI 有長度上限嗎？"
a = """
        在 CSS 裡和 <code>&lt;img&gt;</code> 標籤裡，你碰不到什麼上限，現在的\
        瀏覽器在這兩處基本沒有實際限制。瀏覽器真正限制的是把 data URI 打進位址列，\
        稍微長一點的現在多半直接拒絕，那是出於安全考慮，跟這裡的用法沒關係。真正\
        的限制是上面那條：早在技術上出問題之前，你這個頁面已經比老老實實放張圖\
        片更慢了。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。檔案的數量和大小同樣\
        沒有上限，因為沒有哪臺伺服器在為它們掏錢，工作是在你自己的機器上乾的。\
        本站帶廣告，經費就是這麼來的，廣告拿不到關於你圖片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明“什麼都沒上傳”最省事的\
        辦法。一個把圖片送出去編碼的工具，拔線那一刻就停了。"""

