[[privacy]]
title = "你貼進來的東西沒有出去的路。"
body = """\
      Content-Security-Policy 裡寫著這個頁面允許聯絡的每一個地址，沒有一個屬於\
      本站。這裡沒有任何可以收走一張貼進來的發票的接收端，就算有，程式碼裡也沒有\
      把它送過去的東西。"""

[[privacy]]
title = "這裡不會去取任何東西。"
body = """\
      <code>src/</code> 裡哪裡都沒有 <code>fetch</code>，沒有\
      <code>XMLHttpRequest</code>，也沒有 <code>sendBeacon</code>。解析器和列印器\
      都是這個頁面裡的函式：進去一段字串，出來一段字串。"""

[[privacy]]
title = "外部實體永遠不會被解析。"
body = """\
      帶外部實體的 <code>DOCTYPE</code>，是把 XML 解析器誆去讀解析它的那臺機器上的\
      檔案的辦法，也是這個格式最老的一個洞。<code>src/xml.js</code> 是手寫的讀取器，\
      裡面壓根就沒有實體解析這回事——不是關掉了，是根本沒有——而且這個頁面也從不把\
      你的文字交給瀏覽器內建的 <code>DOMParser</code>。"""

[[privacy]]
title = "從 XML 出來的每個值都是字串。"
body = """\
