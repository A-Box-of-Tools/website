[[faq]]
q = "我的 XML 會被上傳到什麼地方嗎？"
a = """\
        不會。這個頁面上的解析器和列印器都是在你自己的瀏覽器裡、你自己的硬體上跑的\
        函式。這個工具壓根就沒有網路功能，從不取任何東西，也從不發任何東西，頁面的\
        <code>Content-Security-Policy</code> 裡寫著它允許聯絡的每一個地址，沒有一個\
        屬於本站。這一點對 XML 來說比這個格式的名聲聽起來更要緊：以它送過來的多半是\
        一張發票、一份銀行流水、一份病歷，或者一個頭裡帶著憑據的 SOAP 請求。"""

[[faq]]
q = "它會解析外部實體嗎？"
a = """\
        不會，也沒有什麼可關的。解析外部實體，是把 XML 解析器誆去讀執行它的那臺機器上\
        的檔案的辦法，也就是通常寫作 XXE 的那個攻擊，而 <code>src/xml.js</code> 是\
        手寫的讀取器，裡面壓根沒有實體解析。你的文字也從不交給瀏覽器內建的\
        <code>DOMParser</code>。<code>DOCTYPE</code> 會原樣帶過去，但永遠不會被執行。"""

[[faq]]
q = "把 XML 轉成 JSON 會丟什麼？"
a = """\
        混合內容的順序、註釋，還有屬性和子元素之間的區別——最後這條是被淡化而不是抹掉，\
        因為屬性會變成一個名字以 <code>@</code> 開頭的成員。元素自己的文字在必須跟別的\
        東西並排時會變成 <code>#text</code>，重複的子元素會變成陣列。每個值都還是字串：\
        XML 沒有類型，判定 <code>8080</code> 是個數字，等於憑空造資訊。"""

[[faq]]
q = "把 JSON 轉成 XML 會丟什麼？"
a = """\
        空物件、空陣列和空字串之間的區別，三者都會變成一個空元素；還有每個值的類型，\
        因為 XML 沒有類型。陣列會變成重複的元素，那是唯一能讀回來的形狀；元素名承載不了\
        的鍵，會把不方便的字元替換掉，而不是吐出一份沒有解析器肯讀的文件。"""

[[faq]]
q = "它能格式化 SVG、RSS 訂閱源或者 POM 檔案嗎？"
a = """\
        能。三者都是 XML，而這裡讀的是 XML 本身，不是它的某種方言。這樣排開的 SVG 更\
        好手改；RSS 或 Atom 訂閱源通常是壓平了發出來的，不開啟就沒法讀。怎麼排版，一點\
        也不改變這份文件的意思。"""

[[faq]]
q = "重新縮排會改變 XML 的意思嗎？"
a = """\
        對於元素裡裝著元素的文件，不會。可能有影響的是文字：裝著詞的元素內部的空白就是\
        那段文字的一部分，所以只裝文字的元素會留在一行上，而不是被排開。\
        <code>CDATA</code> 段會原封不動地抄過去。"""

[[faq]]
q = "為什麼不直接用瀏覽器內建的 XML 解析器？"
a = """\
        因為文件壞掉時它說的話。<code>DOMParser</code> 交回來的是一份錯誤文件，措辭在\
        每個瀏覽器裡都不一樣，而且常常就歸結成「第 1 行出錯」。手寫的讀取器能說出哪個標籤\
        沒閉合、它是在哪裡開啟的，而這正是你真正需要知道的。不解析外部實體是另一個理由。"""

[[faq]]
q = "檔案最大能有多大？"
a = """\
        這裡沒有設限，因為沒有伺服器在為此付錢。真正的上限是你自己的裝置：幾 MB 的 XML \
        沒問題，文件很長的時候，頁面會等你打字停下來再重新格式化，而不是跟你搶鍵盤。"""

[[faq]]
q = "免費嗎？需要註冊嗎？"
a = """\
        免費，沒有帳號，不用登入，沒有試用期，也不限制你貼多少。本站有廣告，網站靠它\
        維持；廣告拿不到關於你文字的任何東西。"""

[[faq]]
q = "斷網還能用嗎？"
a = """\
        能。頁面載入一次之後拔掉網線，它照樣工作。這也是證明沒有上傳的最簡單辦法：一個\
        把你的 XML 送出去格式化的工具，在你拔線的那一刻就停了。"""

