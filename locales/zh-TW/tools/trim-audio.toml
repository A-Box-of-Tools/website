[[privacy]]
title = "你的錄音沒有出去的路。"
body = """\
      Content-Security-Policy 裡寫著這個頁面允許聯絡的每一個地址，沒有一個\
      屬於本站。這裡沒有任何可以收走你檔案的接收端，就算有，程式碼裡也沒有\
      把檔案送過去的東西。"""

[[privacy]]
title = "這裡不會去取任何東西。"
body = """\
      這個工具壓根就沒有網路功能：沒有地址可填，沒有東西要下載，第一次用也\
      不會拉什麼引擎。碰到你音訊的每一個位元組，都是頁面載入時從這個源來的。"""

[[privacy]]
title = "解碼器就是你瀏覽器裡本來就有的那個。"
body = """\
      檔案交給 <code>decodeAudioData</code> 處理，也就是在 \
      <code>&lt;audio&gt;</code> 元素裡放一首曲子用的同一段程式碼。這裡沒有為了\
      讀你的格式而額外發過來什麼，也沒有為此向這個頁面之外的任何東西求助。"""

[[privacy]]
title = "影片的畫面根本不會被解碼。"
body = """\
      你把影片拖進來時，只會去要它的音軌。那些幀不會被讀取、不會被解碼、不會\
      被繪製，也不會被看一眼：這個頁面上沒有能做到這些的程式碼，出來的檔案裡\
      只有聲音。"""

[[privacy]]
title = "剪輯是在這臺機器的記憶體裡做的一次複製。"
body = """\
      剪輯就是每段每聲道做一次 <code>set</code>：你留下的取樣，按你排的順序\
      挪進一個新陣列。唯一被乘過係數的，是每個淡入淡出裡的那幾百個取樣，而\
      具體幾個，頁面在你按按鈕之前就寫著。"""

[[privacy]]
title = "取樣是被寫下來的，不是重新編碼的。"
body = """\
      一個 WAV 就是這個頁面手裡的那些取樣，前面加一段檔案頭。整條流程裡沒有\
      任何編碼器在替你的錄音做決定，也沒有什麼能稱得上“上傳”的環節讓它發生。"""

[[privacy]]
title = "標記檔案是在頁面裡做出來的。"
body = """\
      儲存標記，就是用螢幕上已有的那些數字寫出一個文字檔案，直接進你的下載。\
      載入一個，也是在這裡讀的。兩件事都不靠近網路，也都只帶著時間數字。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你錄音的資訊，一條也沒有交給它們，\
      檔案、取樣、名字、大小、時長、你切在哪裡，都沒有。讀取、剪輯、寫出的\
      每一行程式碼都由這個源提供，也都擺在倉庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁首那個“Buy me a coffee”按鈕由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它不過是個連結，不上報訪問，也拿不到關於你或\
      你錄音的任何東西。"""

[[privacy]]
title = "斷網也照樣能用。"
body = """\
      斷開網路，這個頁面上的一切照常工作。這是最省事的一條證明。"""

[[howto]]
title = "選一段錄音。"
body = """\
      把 MP3、WAV、FLAC、M4A、Ogg 或 Opus 檔案拖到選擇框裡；要是你想要的是\
      某個影片裡的一段聲音，直接拖影片也行。瀏覽器直接從磁碟上讀，並畫成波形，\
      這期間沒有任何東西發往別處。"""

[[howto]]
title = "邊放邊標出你要的段落。"
body = """\
      在某段該開始的地方按 <kbd>I</kbd>，該結束的地方按 <kbd>O</kbd>。想標\
      幾次都行，每一對都會變成下面表格裡的一行，以及波形上的一條色帶。\
      <kbd>U</kbd> 撤銷最後一次，<kbd>空格</kbd> 播放和暫停，方向鍵跳五秒，\
      按住 <kbd>Shift</kbd> 時每次挪十毫秒。要是那個瞬間不好抓，就把播放\
      放慢。"""

[[howto]]
title = "修一修標記。"
body = """\
      每一行都能單獨試聽，也能在裡面填一個精確時間來改，還能在順序裡上下\
      移動或者刪掉。選中那段的兩端也可以在波形上拖動，這是把標記落在靜音上\
      而不是落在前面那口氣上的最快辦法。上面的合計，就是成品錄音的時長。"""

[[howto]]
title = "留下它們，或者把它們剪掉。"
body = """\
      留下是常見的方向：成品錄音就是你標出的段落，按順序接起來。剪掉是另一\
      件很多人想做卻少有工具提供的事：把“嗯”“啊”、響起來的電話、說岔了的\
      開頭標出來，剩下的部分會繞開它們接上。"""

[[howto]]
title = "剪好，然後下載。"
body = """\
      每一刀都落在你標的那個取樣上；這裡沒有向關鍵幀取整這回事，因為聲音\
      根本沒有關鍵幀。唯一值得挑的，是每個接縫上加多少淡入淡出：五毫秒足以\
      擋住咔噠聲，也短到根本聽不出是淡入淡出。出來的是一個 WAV，先在頁面上\
      放一遍，然後直接交給瀏覽器的下載。"""

[[faq]]
q = "我的音訊會被傳到哪裡去嗎？"
a = """
        不會。它由你自己的瀏覽器在你自己的硬體上讀取、標記、剪輯和寫出。這個\
        工具沒有服務端，頁面的 <code>Content-Security-Policy</code> 裡寫著它\
        允許聯絡的每一個地址，沒有一個屬於本站。你要是寧可自己查也不願聽我們\
        說，拔掉網線，照樣剪一段試試。"""

[[faq]]
q = "同一段錄音裡能留下好幾段嗎？"
a = """
        這正是它的用處。播放時想按幾次 <kbd>I</kbd> 和 <kbd>O</kbd> 就按幾次；\
        每一對變成一行，成品檔案就是所有行按順序接起來，其餘全部去掉。多數\
        線上剪輯工具只給你一對手柄，問你要留哪一段，這拿來給一段片頭曲掐頭去尾\
        沒問題，但要把一小時的採訪聽一遍、只留下值得的六個回答，就完全不夠用。"""

[[faq]]
q = "切點會正好落在我標的位置嗎？"
a = """
        會，每一段都會，在任何播放器裡都會。這是音訊比影片簡單的唯一一處：解碼\
        後的錄音就是一串數字，每一個都自己站得住，所以沒有關鍵幀那樣的東西可以\
        往回取整，也沒有理由讓某一刀提前開始。頁面會顯示結果從第幾個取樣開始，\
        那就是你標的位置乘以取樣率，再取到最近的整取樣。"""

[[faq]]
q = "接縫為什麼會咔噠，淡入淡出又是做什麼的？"
a = """
        因為從一個詞的中間切到另一個詞的中間，會把兩段毫不相干的波形並排放在\
        一起，而喇叭被要求在它們之間跳過去，就會發出一聲咔噠。這不是切得不好，\
        不連續本來就是這個聲音。辦法是在每個接縫兩邊各加幾毫秒的淡入淡出：長到\
        足夠讓紙盆跟上，短到完全聽不出是淡入淡出。預設五毫秒，也可以關掉。淡入\
        淡出只加在真的是切口的那種邊上，所以錄音最開頭或最末尾的邊，會原樣\
        保留。"""

[[faq]]
q = "能反過來把不好的部分剪掉嗎？"
a = """
        能。把它們標出來，然後選“把它們剪掉”：這時接起來的是你<em>沒</em>標的\
        部分，按順序。同一份標記列表能回答這兩個問題，所以你可以來回切換，看著\
        時長變化，而不用把同一處標兩遍。"""

[[faq]]
q = "標記能儲存下來，以後接著做嗎？"
a = """
        能。“儲存標記”會寫出一個純文字檔案，一行一段，起點和終點用逗號隔開；\
        “載入標記”再把它讀回來。提供兩種格式，純秒數和 \
        <code>HH:MM:SS.mmm</code>，而且兩種都和本站影片剪輯寫出來的排版一致，\
        所以對著影片做的檔案可以拿來配它的音訊，反過來也行。標記是細活，沒人\
        該做兩遍。"""

[[faq]]
q = "能開啟哪些格式？"
a = """
        凡是你瀏覽器能解碼的都行，實際上就是 MP3、WAV、FLAC、M4A 和 AAC、Ogg \
        Vorbis 和 Opus，以及 MP4、M4V、MOV 和 WebM 影片裡的音訊。落在外面的\
        還是那份老名單：AVI、WMA，以及大多數 MKV。這個瀏覽器讀不了的檔案會帶\
        一句說明直接拒掉，而不是走到一半才失敗。"""

[[faq]]
q = "為什麼存成 WAV 而不是 MP3？"
a = """
        因為沒有哪個瀏覽器自帶 MP3 編碼器，而這個工具拒絕把你的錄音送去某臺\
        裝了編碼器的伺服器。WAV 根本不需要編碼器，它就是取樣加上一小段檔案頭，\
        所以既是誠實的選項，也是唯一在輸出這一步不可能掉畫質的選項。代價是大：\
        立體聲大約每分鐘十兆。任何播放器、手機和編輯軟體都能開啟，需要 MP3 的\
        場合也能從它轉出來。要是改成靠複製幀來剪 MP3，檔案是小了，但每一刀都會\
        被挪到最近的幀邊界，而這個工具存在的意義，恰恰就是不做這種取整。"""

[[faq]]
q = "錄音時長有上限嗎？"
a = """
        工具裡沒有寫死的上限。真正的天花板是記憶體：整段錄音會一次性解碼進這個\
        頁面，WAV 也是在下載前於記憶體裡拼好的，所以一小時的立體聲大約需要不到\
        一 GB 的空間來週轉。四 GB 的 WAV 會被直接拒掉，因為這個格式自己的\
        大小欄位就描述不了那麼大的檔案。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費就是\
        從那裡來的，廣告拿不到任何關於你錄音的資訊。"""

