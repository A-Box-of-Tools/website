[[privacy]]
title = "你貼進來的東西沒有出去的路。"
body = """\
      Content-Security-Policy 裡寫著這個頁面允許聯絡的每一個地址，沒有一個屬於\
      本站。這裡沒有任何可以收走一個貼進來的 token 的接收端，就算有，程式碼裡也沒有\
      把它送過去的東西。"""

[[privacy]]
title = "這裡不會去取任何東西。"
body = """整個 <code>src/</code> 裡沒有 <code>fetch</code>，沒有 <code>XMLHttpRequest</code>，也沒有 <code>sendBeacon</code>。每個解析器和每個寫出器，都是這個頁面裡接收一串字元、返回一串字元的函式。"""

[[privacy]]
title = "格式化器會原樣保留交給它的東西。"
body = """\
      一個 JSON 物件回來時，鍵還是你寫的順序，數字還是你寫的那些位，因為 \
      <code>src/json.js</code> 是一個解析器，而不是對 <code>JSON.parse</code> 的\
      呼叫——後者會把像整數的鍵挪到前面，還會把二十位的 id 變成最接近的雙精度。\
      <code>tests/js/text-format.test.js</code> 裡的測試查的正是這些。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google，捐助按鈕來自 Buy Me a Coffee。你的文字，一個\
      字元也沒有交給它們。讀取、解析、寫出文字的每一行程式碼都由這個源提供，也都擺在\
      儲存庫裡。"""

[[privacy]]
title = "斷網也照樣能用。"
body = """\
      斷開網路，這個工具跟原來一模一樣，因為它裡面從來就沒有聯網這一步。這是最\
      省事的一條證明。"""

[[howto]]
title = "選好要做的事。"
body = """兩個分頁，一個輸入框：「格式化」把 JSON、XML、HTML、CSS 和 YAML 排好或壓扁；「轉換」把 JSON 變成 YAML 或 XML，再變回來。你剛格式化完的文字就是你要轉換的文字，不用貼第二遍。"""

[[howto]]
title = "貼進來，或者把檔案拖進來。"
body = """凡是你能選中並複製的都行。拖到選擇框上的檔案由你自己的瀏覽器讀進輸入框：這裡根本沒有可省略的上傳步驟。"""

[[howto]]
title = "讓它自己判斷語言，或者直接告訴它。"
body = """\
      選單裡寫著它把這段文字當成了什麼，改正只要一次點選。判斷只是個起點，所以\
      它被擺出來，而不是悄悄套用。"""

[[howto]]
title = "選好縮排，或者乾脆壓平。"
body = """\
      兩個空格、四個空格，或者一個製表符。壓平就是同一份文件，只是把純粹為了閱讀\
      才存在的空白都去掉，結果裡會寫明這樣省下了多少位元組。"""

[[howto]]
title = "在出錯的地方讀錯誤。"
body = """\
      這裡的解析器失敗時，會說它看到了什麼，以及在第幾行第幾列，而不是「位置 4193 \
      處有意外的 token」。通常這就足夠把一份配置檔案改對，不用再開啟別的東西。"""

[[howto]]
title = "把結果帶走。"
body = """複製它，或者下載成檔案，檔名跟著輸出語言走。"""

[[faq]]
q = "我的文字會被傳到哪裡去嗎？"
a = """
        不會。這個頁面上的每個解析器和寫出器，都是在你自己的瀏覽器裡、你自己的硬體上執行的函式。這個工具沒有任何形式的網路功能：它從不去取什麼，也從不發出什麼；頁面的 <code>Content-Security-Policy</code> 裡寫著它允許聯絡的每一個地址，沒有一個屬於本站。這正是拿它來處理訪問令牌、會話 cookie 或客戶記錄的理由：把這類東西貼進別人的格式化器，等於把它交給了對方。"""

[[faq]]
q = "格式化 JSON 除了排版之外還會改動什麼嗎？"
a = """
        不會，而這比聽起來難。鍵會保持你寫的順序：建在 <code>JSON.parse</code> 上的\
        格式化器會悄悄把像整數的鍵挪到前面，於是 <code>{"10":a,"2":b}</code> 回來\
        就成了 <code>{"2":b,"10":a}</code>。數字會保留你敲的那些位，所以二十位的 id \
        不會把最後三位丟給雙精度，<code>1e999</code> 也不會變成 <code>null</code>。\
        重複的鍵兩個都留著，因為標準並沒說哪個勝出，丟掉一個就是替你做決定。"""

[[faq]]
q = "它能格式化哪些語言？"
a = """
        JSON、XML、HTML、CSS 和 YAML。JSON、XML、HTML 和 CSS 還能壓平；YAML 不行，\
        因為它的短寫法是流式風格，那是讀不下去的，而讀不下去恰恰是把檔案留在 YAML \
        的理由的反面。JavaScript 是有意不在名單上的，見下面那條問題。"""

[[faq]]
q = "為什麼它不格式化 JavaScript、Python 或 SQL？"
a = """
        因為要排開一門程式語言，就得把它真正解析明白，而一個差不多對的格式化器比\
        沒有還糟：它產出的程式碼看起來沒問題，做的卻是另一回事。JSON、XML、CSS 和 YAML \
        的文法小到可以手讀，也能用你自己跑得動的測試查清楚。JavaScript 的格式化器\
        叫 Prettier，那是整整 1 MB 的解析器，它該待在你的編輯器裡，而不是一個網頁上。"""

[[faq]]
q = "我的 YAML 寫的是 no，轉成 JSON 卻成了字串。為什麼？"
a = """
        因為它本來就是字串，而這裡讀的是 YAML 1.2，不是 1.1。在 YAML 1.1 裡，\
        <code>yes</code>、<code>no</code>、<code>on</code> 和 <code>off</code> 是\
        布林值，這就是那個把挪威的國家程式碼變成 <code>false</code> 的著名毛病。\
        YAML 1.2 把它去掉了，這個工具也一樣：只有 <code>true</code>、\
        <code>false</code>、<code>null</code> 和 <code>~</code> 會被讀成文字之外的\
        東西。反過來寫出去時，這些詞會<em>加上引號</em>，儘管這裡不加引號也照樣讀成\
        文字——因為下一個開啟這個檔案的東西未必如此。PyYAML 至今預設還是 1.1。讀得\
        嚴、寫得穩，是唯一在兩個方向上都不出錯的組合。"""

[[faq]]
q = "把 YAML 轉成 JSON 會丟什麼？"
a = """
        註釋，因為 JSON 沒地方放。錨點、別名和標籤會被直接拒絕，而不是替你猜：它們\
        每一個說的都是 JSON 說不出來的事，而一個悄悄挑了個解釋的轉換器，交給你的將是\
        一份並非原文所說的文件。反方向不丟任何東西：每一份 JSON 文件本來就已經是一份\
        YAML 文件。"""

[[faq]]
q = "把 JSON 轉成 XML 會丟什麼？"
a = """
        空物件、空陣列和空字串之間的區別，它們都會變成一個空元素；還有每個值的\
        類型，因為 XML 沒有類型——這也是為什麼反向轉換會把一切都留成字串，而不是\
        斷定 <code>8080</code> 是個數字。陣列會變成重複出現的元素，因為只有這種形狀\
        讀得回來；而元素名承載不了的鍵，會把不便的字元替換掉，而不是吐出一份沒有\
        解析器讀得動的文件。"""

[[faq]]
q = "重新縮排 HTML 會改變頁面的樣子嗎？"
a = """
        可能會，這一點這裡說得很老實。兩個行內元素之間的空白，就是兩個詞之間的一個\
        空格，挪動它並不免費。有兩件事把這個風險摁住：<code>&lt;pre&gt;</code> 和 \
        <code>&lt;textarea&gt;</code> 原樣照抄，而一個只裝著文字的元素會留在一行上。\
        其餘的才會被排開。"""

[[faq]]
q = "它能處理多大的檔案？"
a = """
        這裡沒有設上限，因為沒有哪臺伺服器在為上限掏錢。真正的天花板是你自己的機器：幾 MB 的 JSON 沒問題；文件特別長的時候，頁面會等你敲字停一下再重新排版，而不是跟你搶鍵盤。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，貼多少也沒有上限。本站帶廣告，經費就是\
        從那裡來的，廣告拿不到任何關於你文字的資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面載入一次之後斷開網路，它照樣運作。這也是證明「什麼都沒上傳」最省事的\
        辦法，真要把你的文字送出去格式化，拔線那一刻就停了。"""

