[[privacy]]
title = "你的影片沒地方可去。"
body = """\
      Content-Security-Policy 把這個頁面允許聯的地址全列了出來，沒有一個是\
      本站的。這裡沒有能收檔案的介面，程式碼裡也沒有一行會把檔案發出去，就算\
      真有那麼個介面也一樣。"""

[[privacy]]
title = "這裡沒有任何東西會去聯網取資料。"
body = """\
      這個工具完全沒有聯網功能。沒有網址可以貼，沒有東西要下載，第一次用也\
      不去取什麼引擎。碰過你影片的每一個位元組，都是頁面載入時從本站來的。"""

[[privacy]]
title = "走常規那條路，連解碼都沒有。"
body = """\
      剪輯不會改變任何一幀的樣子，所以你標出來那些段落的編碼幀，是照原樣搬進\
      新檔案的。每一幀在這期間只是你硬碟上那個檔案的一小段引用，也就是一句\
      「從第幾個位元組到第幾個位元組」，而不是位元組本身。真正把它們讀出來，是你的\
      瀏覽器在寫下載檔案的那一刻。這裡從來沒有哪一步把你的影片還原成畫面。"""

[[privacy]]
title = "標記檔案是在這個頁面裡產生的。"
body = """\
      儲存標記，就是把螢幕上那些數字寫成一個文字檔案，直接進你的下載目錄。\
      載入標記則在這裡把它讀回來。兩邊都不沾網路，檔案裡除了時間點什麼\
      都沒有。"""

[[privacy]]
title = "聲音只是搬過去，沒人聽。"
body = """\
      兩條 MP4 路徑上，音訊取樣都是整塊搬過去的，根本不解碼。這裡沒有任何東西\
      會把它們還原成聲音，就算還原了，也沒地方可送。"""

[[privacy]]
title = "需要解碼的地方，也在這裡解。"
body = """\
      精確剪輯，以及這個瀏覽器放不了的檔案的預覽，走的是你自己機器上的
      WebCodecs。那本來就是要放給你看這段影片的同一個解碼器，跑在同一個\
      地方。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google。關於你影片的資訊，一條都沒給它們，檔案\
      不給，畫面幀不給，檔名、大小、時長、你在哪裡下的刀，也都不給。讀取、\
      剪輯、寫出的每一行程式碼都從本站發出，也都擺在儲存庫裡。"""

[[privacy]]
title = "捐助按鈕載入了什麼，又拿不到什麼。"
body = """\
      頁頭那個「Buy me a coffee」按鈕，由 cdnjs.buymeacoffee.com 的指令碼畫出來，\
      字型取自 Google Fonts。它就是個連結，僅此而已，不上報訪問，也拿不到\
      關於你或者你影片的任何東西。"""

[[privacy]]
title = "斷網照樣能用。"
body = """\
      斷開網路，這個頁面上的一切照常工作。這是最省事的一條證明。"""

[[howto]]
title = "選一段影片。"
body = """\
      把 MP4、MOV、M4V 或者 WebM 拖到下面的方框裡。瀏覽器直接從你的硬碟上讀，\
      這期間沒有東西發出去。一次拖好幾個，它們會按你放進去的順序接起來。"""

[[howto]]
title = "放起來，把要留的段落標出來。"
body = """\
      該開始的地方按 <kbd>I</kbd>，該結束的地方按 <kbd>O</kbd>，想標幾次標幾次。\
      每一對就是下面表格裡的一行，也是時間軸上的一條色帶。<kbd>U</kbd> 撤銷剛才\
      那一次，<kbd>Space</kbd> 播放和暫停，方向鍵一次跳五秒。那一下不好抓的話，\
      把播放速度放慢。"""

[[howto]]
title = "把標記調準。"
body = """\
      每一行都能單獨回放，也能直接打進一個精確時間來改，還能上下調順序或者\
      刪掉。選中那一段的兩個端點，也可以在時間軸上直接拖。上面那個合計，就是\
      成品影片將有多長。"""

[[howto]]
title = "是留下它們，還是剪掉它們。"
body = """\
      通常是留下：成品就是你標出來的那些段落，按順序接在一起。剪掉是另一件\
      大家想做、卻很少找得到工具的工作，把廣告、冷場、廢鏡頭標出來，剩下的部分\
      會自動接上。"""

[[howto]]
title = "剪完就下載。"
body = """\
      「一個位元組都不動」是把畫面幀原樣搬過去，快，而且不可能掉畫質，代價是每一段\
      從你標記之前那個關鍵幀開始。「就在這裡下刀」會把畫面解碼重寫一遍，每一段\
      都從你選中的那一幀開始。你按按鈕之前，頁面就寫明瞭你將拿到哪一種，以及\
      它的代價。"""

[[faq]]
q = "我的影片會傳到什麼地方去嗎？"
a = """
        不會。讀取、標記、剪輯、寫出，全由你自己的瀏覽器在你自己的硬體上完成。\
        這個工具沒有伺服器那一半，頁面的 <code>Content-Security-Policy</code>\
        把它可能聯的地址全列了出來，沒有一個是本站的。與其聽我們說，不如拔掉\
        網線，照剪一段試試。"""

[[faq]]
q = "同一段影片裡能留好幾處嗎？"
a = """
        這正是它的本行。播放時想按幾次 <kbd>I</kbd> 和 <kbd>O</kbd> 就按幾次，\
        每一對成為一行，成品就是這些行按順序接起來，別的全沒了。網上多數剪輯\
        工具只給你一對滑塊，問你要留哪一段。掐頭去尾還行，可要是你只想把一小時\
        素材看一遍、留下其中值得的六個瞬間，那就完全不夠用。"""

[[faq]]
q = "剪輯會掉畫質嗎？"
a = """
        走常規那條路不會，至少在要緊的意義上不會。剪輯不改變任何一幀的樣子，\
        所以那些幀是原樣搬進新檔案的，位元組一樣，編碼引數一樣，什麼都一樣。這裡\
        唯一會重新編碼的是精確剪輯，而按鈕上就寫著。"""

[[faq]]
q = "為什麼有一段開始得比我標的早？"
a = """
        這跟影片的儲存方式有關，而且只在那些忽略了格式中一項標準約定的播放器上\
        才看得出來。多數幀存的是「我跟鄰居有哪些不同」，離開鄰居就解不出來；只有\
        關鍵幀能獨立成立，而關鍵幀一般每隔一到十秒才有一個。所以靠複製幀來剪，\
        就必須把你標記前面那個關鍵幀起的一段一併帶上。檔案裡同時寫明瞭\
        <em>從你標記的位置開始播</em>，主流播放器都認這一條。你要是需要在任何\
        播放器上都精確，那就選「就在這裡下刀」，它會重新編碼。匯出之前，頁面會\
        告訴你落在哪種情況，以及差了多少。"""

[[faq]]
q = "反過來，能把廣告剪掉嗎？"
a = """
        能。把它們標出來，然後選「剪掉它們」，於是接起來的是你<em>沒</em>標的那些\
        部分，順序不變。同一份標記回答的是同一個問題的兩面，所以你可以來回切換，\
        看著時長變化，而不用重標一遍。"""

[[faq]]
q = "標記能儲存下來，回頭再接著弄嗎？"
a = """
        能。「儲存標記」寫出一個純文字檔案，一行一段，開始和結束用逗號隔開；\
        「載入標記」把它讀回來。兩種格式可選，純秒數和 <code>HH:MM:SS.mmm</code>，\
        都遵循同類工具早就在用的那種排布，所以這裡寫出來的檔案能拿給它們用，\
        它們寫出來的檔案也能拖到這個頁面上。標記是件細緻的事，誰都不該做第二遍。"""

[[faq]]
q = "能剪哪些格式？"
a = """
        MP4、M4V 和 MOV 直接讀，裡面裝的是 H.264、HEVC、AV1 還是 VP9 都行。複製\
        幀這件事根本不涉及解碼，所以哪怕你的瀏覽器壓根沒有那個編碼的解碼器，這\
        條路照樣走得通。其他瀏覽器能播的格式，最典型的是 WebM，改成一邊播一邊錄\
        來剪，能用，結果多長就得花多長時間，而且只能留一段。瀏覽器既讀不了也\
        播不了的檔案，實際上就是 AVI、WMV、FLV 和大多數 MKV，會被直接拒收並說明\
        原因，不會做到一半才崩。"""

[[faq]]
q = "影片的大小和長度有限制嗎？"
a = """
        工具裡沒設上限，而且走複製那條路時，檔案基本沒被讀過：你要留的那些幀只是\
        被指著，不是被裝進來的，所以從一個四 GB 的錄影裡留四分鐘，花的代價大約\
        就等於把這四分鐘寫到硬碟上。精確剪輯則一次幾 MB 地走過整個檔案。兩條路的\
        真正天花板都是成品，它要在記憶體裡拼好你才能下載。"""

[[faq]]
q = "聲音會保住嗎？"
a = """
        兩條 MP4 路徑上，音訊都是逐個取樣複製過去、全程不解碼的，跟原檔案裡的\
        位元組一模一樣，而且每一段的聲音跟畫面對齊到千分之一秒以內。唯一的例外是\
        把幾個聲音描述方式不同的影片接在一起，比如取樣率不一樣，那種情況下不解碼\
        就沒法把它們塞進同一條音軌，頁面會在動手之前說明。走錄製那條路，聲音是從\
        播放裡採下來再編一遍的。兩種情況都有個勾選框，可以乾脆不要聲音。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。本站帶廣告，經費就是\
        這麼來的，廣告拿不到關於你影片的任何資訊。"""

[schema]
browser_requirements = "需要 JavaScript。複製幀那條路完全不需要影片編解碼支援；精確剪輯需要瀏覽器支援 WebCodecs，其他格式則退回到錄製。"
description = "影片播放時想標多少段就標多少段，然後把這些段落存成一個檔案，或者反過來把它們剪掉、留下其餘部分。MP4、MOV 和 M4V 是把編碼幀原樣搬進新檔案來剪的，原音訊逐取樣帶過去，什麼都不上傳，也什麼都不重新編碼。"
features = [
  "播放時用 I 和 O 標記任意多個段落",
  "把標好的段落按你定的順序接成一個檔案",
  "也可以反過來剪掉標記的部分，留下其餘",
  "不重新編碼就能剪，畫質一點不掉",
  "標記能存成純文字時間戳檔案，也能讀回來",
  "標記精確到幀，時間軸上標出關鍵幀位置",
  "原來的音訊照搬，不重新編碼",
  "斷網能用，不上傳，不註冊，沒有水印",
]

[picker]
title = "把影片拖到這裡"
hint = "或者點選選擇，MP4、MOV、M4V、WebM。一次拖好幾個就接起來。"
