<!--
  tools/crop-video/body.html, in Traditional Chinese.

  Prose paragraphs are written on one line each: a line break inside Chinese
  text collapses to a space in HTML, and a space between two Han characters is
  visible on the page.
-->
<main id="main">
  <!-- 第 1 步，選檔案 -->
  <section class="card">
    <h2><span class="step">1</span> 選一段影片</h2>

    <!--
      A real <label> drives the file picker natively. Calling .click() on a
      display:none input is refused by Safari and some Chrome configurations,
      so the input stays in the layout: visually hidden, still focusable, and
      reachable by keyboard. There is no JavaScript in this path at all.
    -->
    {% include "partials/file-picker.html" %}

    <dl class="source" id="source" hidden>
      <div><dt>檔案</dt><dd id="src-name">&mdash;</dd></div>
      <div><dt>大小</dt><dd id="src-size">&mdash;</dd></div>
      <div><dt>畫面</dt><dd id="src-frame">&mdash;</dd></div>
      <div><dt>時長</dt><dd id="src-length">&mdash;</dd></div>
      <div><dt>影片編碼</dt><dd id="src-codec">&mdash;</dd></div>
      <div><dt>音訊編碼</dt><dd id="src-audio">&mdash;</dd></div>
    </dl>

    <p id="path-note" class="path-note" hidden></p>
  </section>

  <!-- 第 2 步，裁剪框 -->
  <section class="card" id="crop-card" hidden>
    <h2><span class="step">2</span> 拉出裁剪框</h2>

    <p class="stage-hint">
      在框裡拖是移動，拖四角是縮放。框選中時，方向鍵一次挪一個畫素，<kbd>Alt</kbd>&nbsp;+&nbsp;方向鍵是改大小，按住 <kbd>Shift</kbd> 一步走十個。
    </p>

    <!-- The crop box itself is added here by src/cropper.js. The stage is given
         the video's own shape, so the box can be positioned in percentages and
         needs no recalculating when the window is resized. -->
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <video id="preview" playsinline controls></video>
        <canvas id="still" hidden aria-hidden="true"></canvas>
      </div>
    </div>

    <p id="stage-note" class="stage-note" hidden></p>

    <div class="crop-controls">
      <div class="aspect-row" role="group" aria-label="把裁剪框鎖成某個比例">
        <button type="button" data-aspect="free" class="active">自由</button>
        <button type="button" data-aspect="source">原比例</button>
        <button type="button" data-aspect="1:1">1:1</button>
        <button type="button" data-aspect="4:5">4:5</button>
        <button type="button" data-aspect="9:16">9:16</button>
        <button type="button" data-aspect="16:9">16:9</button>
        <button type="button" data-aspect="4:3">4:3</button>
        <button type="button" data-aspect="3:2">3:2</button>
        <button type="button" id="swap-aspect" class="ghost" title="把鎖定的比例橫直對調">
          橫直對調
        </button>
      </div>

      <div class="numbers">
        <label>左<input type="number" id="crop-x" min="0" step="1"></label>
        <label>上<input type="number" id="crop-y" min="0" step="1"></label>
        <label>寬<input type="number" id="crop-w" min="16" step="2"></label>
        <label>高<input type="number" id="crop-h" min="16" step="2"></label>
        <div class="number-actions">
          <button type="button" id="crop-max" class="ghost">拉到最大</button>
          <button type="button" id="crop-centre" class="ghost">居中</button>
          <button type="button" id="crop-reset" class="ghost">整幅畫面</button>
        </div>
      </div>
    </div>

    <p class="even-note">
      寬和高按 2 跳，因為 H.264 沒辦法存一條邊是奇數畫素的幀。
    </p>
  </section>

  <!-- 第 3 步，匯出 -->
  <section class="card" id="export-card" hidden>
    <h2><span class="step">3</span> 開裁</h2>

    <div class="settings">
      <div class="field">
        <label for="format">輸出</label>
        <select id="format">
          <option value="mp4" selected>MP4，逐幀重新編碼</option>
          <option value="webm">WebM，一邊播一邊錄</option>
        </select>
        <p class="field-note" id="format-note"></p>
      </div>

      <div class="field">
        <label for="quality">畫質</label>
        <select id="quality">
          <option value="low">檔案小一點</option>
          <option value="medium" selected>均衡</option>
          <option value="high">最好畫質</option>
        </select>
        <p class="field-note">
          絕不會比原片在同一塊區域上花得還多，超過那個數只會讓檔案變大。
        </p>
      </div>

      <div class="field">
        <label class="check" for="keep-audio">
          <input type="checkbox" id="keep-audio" checked>
          留著聲音
        </label>
        <p class="field-note" id="audio-note"></p>
      </div>
    </div>

    <dl class="summary" id="summary">
      <div><dt>輸出畫面</dt><dd id="sum-size">&mdash;</dd></div>
      <div><dt>留下的部分</dt><dd id="sum-kept">&mdash;</dd></div>
      <div><dt>時長</dt><dd id="sum-length">&mdash;</dd></div>
      <div><dt>走哪條路</dt><dd id="sum-path">&mdash;</dd></div>
    </dl>

    <div class="export-row">
      <button type="button" id="export" class="primary" disabled>裁剪影片</button>
      <button type="button" id="cancel" class="ghost" hidden>取消</button>
    </div>

    <div id="progress-wrap" class="progress-wrap" hidden>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <p id="progress-label" class="progress-label" role="status" aria-live="polite"></p>
    </div>

    <p id="error" class="error" role="alert" hidden></p>

    <div id="result" class="result" hidden>
      <video id="result-video" controls playsinline></video>
      <div class="result-meta">
        <p id="result-info"></p>
        <a id="download" class="primary as-button" download>下載影片</a>
      </div>
    </div>
  </section>
</main>
