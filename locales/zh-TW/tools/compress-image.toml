[[howto]]
title = "按「壓到這個大小」。"
body = """\
      每張圖會被反覆編碼幾遍，工具一步步逼近那個既能塞進去、畫質又最高的等級。\
      本來就沒超標的檔案，原樣放行，一個位元組都不動。"""

[[howto]]
title = "看看代價有多大，然後下載。"
body = """\
      每個結果都寫明存成了什麼格式、用了哪一檔畫質、尺寸有沒有變，以及量出來\
      跟原圖有多接近。按「對比」，兩張圖並排放著看。"""

[[faq]]
q = "我的圖片會傳到什麼地方去嗎？"
a = """
        不會。解碼、壓縮、測量，全由你自己的瀏覽器在你自己的硬體上完成，用的是\
        瀏覽器內建的 JPEG、PNG 和 WebP 編碼器。這個工具沒有任何聯網功能，不取\
        東西，也不發東西。頁面的 <code>Content-Security-Policy</code> 把它可能\
        聯的地址全列了出來，沒有一個是本站的。"""

[[faq]]
q = "它怎麼做到剛好壓到那個大小？"
a = """
        試出來的。沒有哪個公式能把一個畫質等級換算成位元組數，這完全取決於圖片\
        本身。所以工具把圖編碼好幾遍，一路找答案。它從畫質上限往下折半逼近，\
        大約八次編碼就能定位到那個塞得進去、畫質又最高的等級。頁面上每一個\
        大小都是真編出來的檔案，不是估算。"""

[[faq]]
q = "所謂「損失最小」，具體指什麼？"
a = """
        三件很具體的事。第一，本來就沒超標的圖原樣放行，不重新編碼。第二，先\
        花畫質，後動解析度，而且畫質只降到壓縮痕跡開始露出來那一檔為止。再往\
        下，工具改成把圖片做小、把畫質提回去，因為畫素少一點但個個乾淨，比\
        畫素多一堆卻全糊了好看。第三，一旦找到塞得進去的結果，搜尋還會往回頂，\
        把剩下的額度用滿。你要 500 KB，就不會拿回一個 300 KB 的檔案。"""

[[faq]]
q = "每個結果上的 SSIM 和 PSNR 是什麼？"
a = """
        是這次壓縮的代價，做法是把結果解碼回來跟原圖逐一比對。SSIM 比的是區域性\
        的明暗、對比和結構，比數一數多少畫素變了更接近人眼在意的東西，大約在
        0.98 以上，兩張圖並排看已經很難分辨。PSNR 是傳統的那個分貝值。兩個數\
        都在你自己的機器上算，也都擺出來，好讓「損失很小」這句話是能核對的，\
        而不只是嘴上說說。"""

[[faq]]
q = "它能讀、能寫哪些格式？"
a = """
        你的瀏覽器能解碼的它都能讀，實際上就是 JPEG、PNG、WebP、GIF、BMP，\
        現在多數瀏覽器還包括 AVIF。寫出來的是 JPEG、PNG 和 WebP，因為瀏覽器\
        內建的編碼器就這三種。選「自動」時，它保持檔案原來的格式，只有在「保持\
        原格式就得縮尺寸、或者畫質會明顯掉下去」的時候才換成 WebP。"""

[[faq]]
q = "為什麼 PNG 壓不下去多少？"
a = """
        因為 PNG 是無損的，根本沒有畫質這個旋鈕可擰。想讓一個 PNG 變小，只能\
        減畫素或者減顏色，所以選了 PNG，工具只能靠縮尺寸去夠那個目標。圖片\
        要是照片，換 JPEG 或 WebP 能離目標近得多，而且看上去完全沒問題。要是 \
        logo 或者帶透明的截圖，WebP 能留住透明，換成 JPEG 那塊地方會被填成\
        白色。"""

[[faq]]
q = "壓縮會把 EXIF 和 GPS 資訊一起去掉嗎？"
a = """
        會，屬於順帶的效果。壓縮就是把圖解碼成畫素、再把畫素編回去，而一張\
        畫布上只有畫素，不帶任何標籤，所以位置、相機型號、時間戳這些乾脆就\
        沒寫進新檔案。你要是只想清掉後設資料、畫面別動，那該用 \
        <a href="../exif-editor/">EXIF 檢視與清除</a>，它只改容器，不重新\
        壓縮畫面。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。檔案的數量和大小\
        同樣沒有上限，因為沒有哪臺伺服器在為它們掏錢，工作是在你自己的機器上\
        乾的。本站帶廣告，經費就是這麼來的，廣告拿不到關於你圖片的任何資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面開一次之後斷網，它照常運作。這也是證明「什麼都沒上傳」最省事的\
        辦法。一個把圖片送出去壓縮的工具，拔線那一刻就停了。"""

