[[privacy]]
title = "內容只去往你的讀者，不去任何別處。"
body = """
文字和檔案走WebRTC資料通道：你的瀏覽器與每位讀者的瀏覽器之間一條直連的、DTLS加密的連線。這條路上沒有伺服器。同一網路裡，位元組甚至出不了這棟樓&mdash;&mdash;同一Wi-Fi下的兩臺筆記本，一切都在本地交接。"""

[[privacy]]
title = "引見伺服器是什麼，以及它能看到的一切。"
body = """
直連需要引見，所以這個頁面&mdash;&mdash;全站僅此一頁&mdash;&mdash;向我們的一臺伺服器開一條WebSocket。它把輸入連結名的人和用這個名字分享的人對上，轉遞幾KB的協商，然後什麼都不留：從不寫入儲存，分享方一斷開，房間就不復存在。它能看到：某個名字正在使用、誰何時來去、IP地址。它看不到：文字、檔案、誰被放行、誰寫了什麼&mdash;&mdash;連私密分享的敲門都走加密直連通道。它的全部原始碼就在倉庫裡，與這個工具的原始碼相鄰。"""

[[privacy]]
title = "什麼都不存，所以關分頁就是刪除本身。"
body = """
分享只在你的分頁開著時存在。一關，新來的讀者什麼也找不到，正在讀的人會看到自己的副本消失&mdash;&mdash;不過別人之前複製或下載的東西歸他，就像任何你親手遞出去的東西一樣。你敲的草稿只放在你自己瀏覽器的儲存裡，好讓下次還在，也只放在那裡；勾上一次性，哪裡都不放。"""

[[privacy]]
title = "連結名是唯一的秘密，私密模式是那把鎖。"
body = """
知道或猜中名字的人，就能開啟背後的分享。所以建議名是三個隨機詞，所以敏感內容值得一個猜不中的名字&mdash;&mdash;或者用預設就開著的私密開關：每位到來的讀者都得經直連通道自報家門，你放行之前什麼也不會發出。"""

[[privacy]]
title = "直連讓兩邊看見彼此的地址。"
body = """
點對點就是這個意思，而讀者在事情發生前就會知道：開啟分享連結只是問引見伺服器有沒有人在分享；然後頁面明說，連線會讓雙方看到彼此的IP地址，並等待一次點選。在那次點選之前，分享方連讀者存在都不知道。"""

[[privacy]]
title = "Google載入了什麼，又拿不到什麼。"
body = """廣告和統計指令碼來自Google，捐贈按鈕來自Buy Me a Coffee。它們誰也拿不到文字、檔案、名字和大小、誰連線過。例外是這個頁面自己的地址：讀者的連結裡帶著連結名，廣告指令碼會讀取這個地址。想保密的分享，應該開啟私密開關。碰到內容的每一行程式碼都由本源提供，並且都在倉庫裡。"""

[[howto]]
title = "寫下文字，或附上檔案。"
body = """
編輯器就是分享本身：讀者連上時裡面是什麼，他拿到的就是什麼；此後每次修改都隨著你的鍵入即時抵達已連線的讀者。檔案走同一條通道，每個最大200&nbsp;MB；讀者看到列表，只下載自己要的那份&mdash;&mdash;沒人的頻寬會耗在不想要的檔案上。"""

[[howto]]
title = "文字配得上排版，就開啟Markdown。"
body = """
就一個開關。標題、加粗、列表、程式碼、連結隨著鍵入在編輯器旁邊即時渲染；讀者預設看到排好版的樣子，還有一個切回原文的按鈕。渲染器隨頁面一起送達並轉義一切：無論誰寫的，分享的文字都無法在讀者的機器上變成指令碼。"""

[[howto]]
title = "給連結起名，或者就用建議。"
body = """
名字就是地址：<code>brave-otter-42</code>可以隔著房間喊、在電話裡念、從白板上抄。它也是唯一的秘密：私密的東西要麼起個沒人猜得到的名字，要麼靠私密開關。別人正用著的名字會被拒絕；你一停，你的名字就重新空出來。"""

[[howto]]
title = "決定放誰進來。"
body = """
私密是預設：每位讀者都會被請自報家門&mdash;&mdash;名字、暗號、任何你認得出的東西&mdash;&mdash;你看到那條訊息，旁邊是"讓他讀"和"請回"兩個按鈕。自我介紹走直連通道，連引見伺服器都不知道是誰敲的門。取消勾選就是公開分享，知道名字的誰都能讀。"""

[[howto]]
title = "開始分享，別關分頁。"
body = """
分頁就是伺服器：它開著、醒著，分享就在；多一刻都沒有。合上筆記本蓋子同樣會終結它。複製連結，或者乾脆把名字說出去&mdash;&mdash;讀者在本頁地址末尾敲上<code>#名字</code>就行。"""

[[howto]]
title = "在另一頭：先同意，再敲門。"
body = """
開啟連結的人會得知有人在分享，被告知直連會讓雙方看到彼此的網路地址，只有自己選擇時才會連線。遇到私密分享，就自報家門等你放行。他拿到的內容隨你的編輯即時變化，你關掉分頁就消失。"""

[[faq]]
q = "有任何東西被上傳到任何地方嗎？"
a = """
        沒有。文字和檔案經加密WebRTC通道，從你的瀏覽器直達每位讀者的瀏覽器。唯一牽涉的伺服器只運送引見&mdash;&mdash;幾KB的連線協商&mdash;&mdash;從不運送內容。它那裡沒有可洩露、可調取、可丟失的東西：你的位元組它一個都不拿，你一斷開，房間就不復存在。"""

[[faq]]
q = "那這個工具為什麼還要和伺服器說話，偏偏還是在這個網站上？"
a = """
        因為兩個瀏覽器無法自己找到彼此：必須有個東西把輸入<code>brave-otter-42</code>的人和用這個名字分享的人對上，並在兩者之間傳遞連線提議。這個東西就是引見伺服器，本頁唯一的網路依賴，名字寫在它的<code>Content-Security-Policy</code>裡，和頁面釋出在同一個倉庫。它是能做成這件事的最小伺服器：什麼都不存，什麼都不讀，兩個瀏覽器一握上直連通道就退到一邊。"""

[[faq]]
q = "那臺伺服器究竟能看到什麼？"
a = """
        某個連結名正在使用、分享方和讀者何時連線何時離開、他們的IP地址，以及雙方交換的加密連線握手。看不到文字，看不到檔案，看不到名字和大小，看不到私密分享裡誰被放行，也看不到誰在自我介紹裡寫了什麼&mdash;&mdash;這一切都走端到端加密的直連通道，根本不經過伺服器。"""

[[faq]]
q = "我關掉分頁會發生什麼？"
a = """
        分享在所有地方同時結束。連結一兩秒內失效；頁面還開著的讀者會看到自己的副本消失，附一句分享已結束的提示。這不是向哪臺伺服器提交刪除申請&mdash;&mdash;根本不存在要刪的伺服器副本。分頁是分享存在過的唯一地方，關掉它就是全部的收尾。"""

[[faq]]
q = "讀者能留下我分享的東西嗎？"
a = """
        分享開著的時候，能&mdash;&mdash;分享本來就是這麼回事。讀者可以複製文字、下載檔案，拿走的就是他的了，和你用任何別的方式親手交給他沒有兩樣。結束分享保證的是未來：新來的人拿不到了，開著的頁面也不再顯示。沒有工具能撤回已經送達的東西，這個頁面不裝作可以。"""

[[faq]]
q = "私密模式是什麼？"
a = """
        就是預設。每位到來的讀者都會得知分享是私密的，並被請自報家門；你看到那條訊息&mdash;&mdash;"是我，站會上的Alice"&mdash;&mdash;旁邊是放行與請回的按鈕，你拍板之前什麼都不會發出。自我介紹走的是本就加密的直連通道，所以誰敲了門、你怎麼決定，伺服器永遠不知道。分享前取消勾選，就是公開分享。"""

[[faq]]
q = "為什麼讀者會看到我的IP地址？"
a = """
        因為連線是貨真價實的直連，而直連跑在兩個地址之間：每一端必然知道另一端，跟打電話一個道理。讀者在任何連線存在之前就被提醒，只有自己選擇時才連線；在那之前，你甚至不知道他開啟過連結。如果這筆交換不適合某次分享，替代方案是經伺服器中轉的服務&mdash;&mdash;交換的方向正好相反。"""

[[faq]]
q = "檔案能有多大，速度怎麼樣？"
a = """
        每個檔案最大200&nbsp;MB，類型不限；速度就是兩條連線裡較慢的那條&mdash;&mdash;中間沒有伺服器來限速或計量。同一Wi-Fi下的兩臺機器按區域網速度傳，位元組出不了這棟樓。讀者按需取件，所以附上大檔案不花任何代價，直到真有人來要。"""

[[faq]]
q = "離線能用嗎？"
a = """
        老實說：一半。編輯器能&mdash;&mdash;頁面照常載入，草稿還在，Markdown照常渲染，寫和儲存完全不需要網路。分享不能，也不可能：夠到另一個人的瀏覽器本身就是網路行為，引見還得靠引見伺服器。這是本站唯一一個任務在離線時根本不可能完成的工具，暗示別的說法都是不誠實。"""

[[faq]]
q = "要是我們連不上呢？"
a = """
        大多數瀏覽器對經引見後都能直連；少數不行，通常是兩頭都躲在最嚴苛的公司網或行動網路後面。這個頁面不會悄悄退回到中轉伺服器&mdash;&mdash;那會不聲不響地改變這個工具是什麼&mdash;&mdash;而是二十秒後明說直連沒有建立。換個網路再試，多半就好了。"""

[[faq]]
q = "誰都能分享任何東西，渲染Markdown還安全嗎？"
a = """
        這個問題正是渲染器是本頁原始碼裡的八十行、而不是一個庫的原因。任何標籤產出之前，每個字元都先被轉義；能產出的只有一組固定的無害標籤；連結只認<code>http</code>、<code>https</code>和<code>mailto</code>&mdash;&mdash;<code>javascript:</code>連結只會留成一行死文字。無論誰寫的，分享的文字都無法在你的機器上變成指令碼，而那八十行你自己就能讀。"""

[[faq]]
q = "兩個人能用同一個名字分享嗎？"
a = """
        不能同時。每個名字只有一個活著的分享，由引見伺服器強制執行：後來的會被拒絕，請他另選名字。分享一結束，名字立刻空出&mdash;&mdash;這也意味著存下來的連結只和背後的分享一樣新鮮：同一個名字，下週可能屬於別人。把連結當成屬於某個時刻的東西，而不是屬於某個人的。"""

[[faq]]
q = "免費嗎？要帳號嗎？"
a = """
        免費；沒有帳號，沒有註冊，也沒有值得一提的限制&mdash;&mdash;每次分享最多十六位讀者同時線上。網站靠廣告維持；廣告拿不到這個頁面分享的任何東西，而引見伺服器恰恰因為什麼都不存、幾乎什麼都不做，才輕輕鬆鬆待在免費套餐裡。"""

