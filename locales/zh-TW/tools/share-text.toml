tagline = "分享只活在這個開啟的分頁裡。讀的人從你的瀏覽器直接取走加密內容，關掉分頁就結束——任何伺服器上都不留一點東西。"

title = "裝置間分享文字與檔案 &mdash; 直連、加密、零儲存"
description = "把文字或檔案經由直連加密通道從一個瀏覽器送到另一個。連結名說得出口，邊打字邊即時同步，逐個批准讀者——任何伺服器上永遠不存任何東西。免費，無需註冊。"
og_title = "關掉分頁的那一刻，分享就結束了"
og_description = "文字和檔案加密後從你的瀏覽器直達讀者的瀏覽器。伺服器只負責引見雙方，永遠看不到內容。沒有儲存、沒有歷史、沒有帳號——關掉分頁，處處消失。"
og_image_alt = "文字與檔案分享 - 瀏覽器到瀏覽器，零儲存"

pledge = """
    你在這裡分享的內容，經端到端加密的WebRTC通道，從你的瀏覽器去往每位讀者的瀏覽器，不去任何別處。唯一牽涉的伺服器&mdash;&mdash;名字寫在本頁的<code>Content-Security-Policy</code>裡，原始碼在倉庫中&mdash;&mdash;把兩個瀏覽器互相引見之後就退到一邊：它什麼也不存，內容也從不經過它。沒有歷史，沒有帳號。關掉這個分頁，分享在所有地方同時結束，包括讀者仍開著的頁面。"""

live_hint = """
      分享時開啟開發者工具，盯著"網路"面板。你會看到一條通往引見伺服器的WebSocket，只載著幾KB的連線協商&mdash;&mdash;而無論你打了多少字、附了多少檔案，沒有哪條請求帶走其中一個位元組。"""

read_first = """
，還有裝著交換雙方邏輯的<code>src/main.js</code>&mdash;&mdash;分享方的分頁和讀者的分頁是同一個檔案&mdash;&mdash;以及<code>src/markdown.js</code>：這個渲染器處理的是線路另一頭傳來的文字，所以在輸出任何東西之前先轉義一切。伺服器的全部原始碼是同一倉庫裡的<code>workers/rendezvous/worker.js</code>：每個連結名一個房間，除了開啟的連線什麼都不持有。"""

howto_heading = "如何不向任何地方上傳就分享文字與檔案"

card = """
            文字與檔案，經加密直連從瀏覽器到瀏覽器。哪裡都不存；關掉分頁，分享即止。"""

