      事件會帶走其中任何一項；下載之後彈出的那一個問題，送出去的只有一個贊成或\
      反對和工具的名字。"""

[[privacy]]
title = "斷網也能用。"
body = """\
      拔掉網線，工具照舊，因為它裡面本來就沒有聯網\
      這一步。這是所有證明裡最簡單的一個，也是塗黑護照之前值得先做一次的那一個。"""

[[howto]]
title = "選一張圖片。"
body = """\
      截圖、掃描檔或者照片都行，只要瀏覽器打得開。\
      它直接從你的硬碟讀進來，這個過程裡沒有任何東西出去。"""

[[howto]]
title = "在不該被看到的地方拉一個框。"
body = """\
      下一處再拉一個。框可以拖著移動，\
      可以拉四周的把手改大小，也可以用 Tab 鍵選中再用方向鍵調整。框下面顯示的就是\
      真實結果，畫它的正是稍後寫檔案的那段程式碼。"""

[[howto]]
title = "在塗黑、打碼、模糊裡選一個，能選塗黑就選塗黑。"
body = """\
      塗成一片純色，\
      什麼都不會留下。打碼和模糊只是把畫素換成它們自己的平均值，對付背景裡的人臉\
      夠用，對付任何能讀成文字的東西不夠用。"""

[[howto]]
title = "按「塗黑並儲存」，然後檢查檔案。"
body = """\
      之後顯示的那張圖，就是成品檔案\
      被重新解碼出來的樣子。用編輯器開啟找找圖層，或者試著選中被遮住的文字：只有\
      平平的一張圖，你遮住的地方在它被寫出來之前就已經被覆蓋了。"""

[[faq]]
q = "我的圖片會被上傳到什麼地方嗎？"
a = """
        不會。解碼、塗改、重新寫出來，都由你自己的瀏覽器在你自己的機器上完成。這個\
        工具沒有任何聯網功能，不去取也不去送，頁面的\
        <code>Content-Security-Policy</code> 寫著它能聯絡的每一個地址，沒有一個是\
        本站的。把頁面載入一次，然後斷網，它照樣能用。"""

[[faq]]
q = "被遮住的那塊，真的從檔案裡沒了嗎？"
a = """
        是的，這個工具就是為這一點存在的。圖片被解碼成一塊畫素緩衝區；框覆蓋掉框內\
        的畫素；緩衝區再被編碼成一個新檔案。編碼器拿到任何東西之前，原來的數值已經\
        不在記憶體裡了，所以沒有圖層可以藏，沒有註解可以刪，也沒有歷史可以撤銷。你可以\
        像檢查別人說法那樣檢查它：把結果用影像編輯器開啟找第二個圖層，或者試著選中你\
        遮掉的那段文字。"""

[[faq]]
q = "打過碼或者模糊過的地方能被還原嗎？"
a = """
        有時候能，這也是選之前唯一值得讀的一段。塗成純色，下面的一切都變成同一種\
        顏色，什麼都不剩：邊緣不剩，平均值不剩，連有幾個字都不剩。打碼是把每一塊換成\
        那一塊的平均色，而一格一格的平均值仍然是對下面內容的一次測量。對於常見字型、\
        大小也猜得到的文字，已經有公開的研究把候選字串照同樣的方式渲染、打碼，再\
        比對平均值，從而還原出原文。模糊是一次卷積，而卷積原則上可以反過來算。所以\
        背景裡的人臉儘管打碼，凡是能讀成文字的都塗黑。"""

[[faq]]
q = "在文件軟體裡畫一個黑色矩形，為什麼不是一回事？"
a = """
        因為大多數軟體把那個矩形存在圖片旁邊，而不是存進圖片裡。在 PDF 閱讀器、\
        投影片、文書處理軟體或者帶圖層的影像編輯器裡畫出來的形狀，是一個帶位置的\
        物件，壓在頁面上面。把它挪開、刪掉，或者換一個程式開啟這個檔案，被它蓋住的\
        東西就原樣回來了。報社、法院和政府部門都這樣釋出過檔案。這裡根本不儲存那個\
        矩形，留下的只是寫在原來數值之上的畫素值。"""

[[faq]]
q = "它會不會一併去掉 EXIF 和 GPS 資訊？"
a = """
        會，順帶的。儲存的意思是把一塊畫滿畫素的畫布寫出來，而畫布不帶任何標籤，所以\
        拍攝地點、相機型號、時間戳和內嵌縮圖根本不會被寫進新檔案。縮圖在這裡尤其\
        要緊：它是圖片的第二份小副本，照片被編輯之後不一定會重新產生，一張塗黑過的\
        照片帶著沒塗黑的縮圖出門，整件事就白做了。如果你只想去掉後設資料、又不想讓\
        圖片被重新編碼，<a href="../exif-editor/">EXIF 檢視與清除</a>改寫的是容器\
        本身。"""

[[faq]]
q = "它能讀能寫哪些格式？"
a = """
        凡是你的瀏覽器能解碼的它都能讀，實際上就是 JPEG、PNG、WebP、GIF、BMP，以及\
        大多數當前瀏覽器上的 AVIF。寫出來的是 JPEG、PNG 和 WebP，因為瀏覽器內建的\
        就是這三個編碼器。選「自動」時，JPEG 還是 JPEG，其餘一律 PNG，這樣照片保持\
        照片的體積，截圖上沒被遮住的文字也保持清楚。這個選擇跟塗黑沒關係：編碼器看到\
        它們的時候，那些畫素早就沒了。"""

[[faq]]
q = "不用滑鼠能做嗎？"
a = """
        能。「在中間加一個框」會放一個到圖上，Tab 鍵在框之間切換，方向鍵移動當前的框，\
        Alt 加方向鍵改它的大小，按住 Shift 每步走十個畫素，Delete 鍵刪掉它。每個框在\
        圖片下面還有一行，寫著大小、位置、它做什麼，以及一個刪除按鈕，所以整個工具都\
        可以用鍵盤操作，也讀得出來。"""

[[faq]]
q = "手機上能用嗎？"
a = """
        能。拉框、移動和改大小走的是指標事件，不是滑鼠事件，所以手指的效果一樣，觸控\
        屏上把手還會畫得更大一些。螢幕上的圖片在你操作時是按螢幕尺寸重畫的；檔案本身\
        永遠是在你按下按鈕的那一刻，按原始解析度塗黑的。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號、沒有登入、沒有試用期，也沒有水印。圖片大小也沒有上限，因為沒有\
        哪臺伺服器在為它付錢，工作是在你自己的裝置上乾的。網站靠廣告養著，而廣告那邊\
        拿不到任何關於你圖片的東西。"""

[schema]
description = "在瀏覽器裡給圖片塗黑：在不該被看到的地方拉框，然後塗成純色、打碼或者模糊。被遮的畫素在檔案編碼之前就被覆蓋，所以結果裡沒有圖層、沒有註解，也沒有後設資料。什麼都不上傳。"
features = [
  "塗黑、打碼和模糊，每個框單獨選",
  "被遮的畫素在編碼之前被覆蓋，不會留下一層可以挪開的東西",
  "預覽是寫檔案的那段程式碼畫出來的",
  "告訴你一塊馬賽克由多少格組成，而不是只說一句「強」",
  "除了滑鼠，鍵盤和觸控同樣能加框、移動、改大小和刪除",
  "重新編碼的順帶結果是 EXIF、GPS 和內嵌縮圖一併消失",
  "輸出 JPEG、PNG 和 WebP，也可以讓它自己選",
  "斷網能用，不上傳也不註冊",
]

[picker]
title = "把圖片拖到這裡"
hint = "或者點選選擇 | JPEG、PNG、WebP，以及你的瀏覽器打得開的其他格式"
