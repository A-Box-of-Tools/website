      這個頁面能聯絡的每一個地址\
      都寫在 Content-Security-Policy 裡，沒有一個是本站的。這裡不存在一個能收走\
      你檔案的介面，程式碼裡也沒有哪一處會去送。"""

[[privacy]]
title = "被遮的畫素在這裡就沒了，不是在出門的路上。"
body = """\
      圖片先解碼成一塊\
      畫素緩衝區，框直接寫進這塊緩衝區，緩衝區再交給編碼器。這個頁面裡不存在一份\
      把框當成單獨圖層的圖片，因為這樣的東西從來沒被造出來，見\
      <code>src/redact.js</code>。"""

[[privacy]]
title = "這裡不去取任何東西。"
body = """\
      <code>src/</code> 裡沒有 <code>fetch</code>，\
      沒有 <code>XMLHttpRequest</code>，也沒有 <code>sendBeacon</code>。全部工作\
      就是 <code>getImageData</code>、三個在位元組上跑的迴圈，以及\
      <code>canvas.toBlob</code>，都是瀏覽器裡本來就裝好的。"""

[[privacy]]
title = "框的事不會報給任何地方。"
