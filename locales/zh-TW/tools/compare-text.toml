[[privacy]]
title = "你貼進來的東西沒有出去的路。"
body = """\
      Content-Security-Policy 裡寫著這個頁面允許聯絡的每一個地址，沒有一個屬於\
      本站。這裡沒有任何可以收走一個貼進來的 token 的接收端，就算有，程式碼裡也沒有\
      把它送過去的東西。"""

[[privacy]]
title = "這裡不會去取任何東西。"
body = """整個 <code>src/</code> 裡沒有 <code>fetch</code>，沒有 <code>XMLHttpRequest</code>，也沒有 <code>sendBeacon</code>。比對是這個頁面裡接收兩串字元、返回哪裡變了的函式。"""

[[privacy]]
title = "演算法就是那個標準演算法，整個都能讀。"
body = """Myers 的最短編輯指令碼演算法，和 <code>git diff</code> 用的是同一個，手寫在 <code>src/diff.js</code> 裡，每處取捨都寫了註釋。<code>tests/js/text-diff.test.js</code> 裡的測試證明：刪除能重建左邊的文字，插入能重建右邊的文字——對一份 diff 來說，「正確」指的就是這個。"""

[[privacy]]
title = "Google 載入了什麼，又拿不到什麼。"
body = """\
      廣告指令碼和統計指令碼來自 Google，捐助按鈕來自 Buy Me a Coffee。你的文字，一個\
      字元也沒有交給它們。讀取、解析、寫出文字的每一行程式碼都由這個源提供，也都擺在\
      倉庫裡。"""

[[privacy]]
title = "斷網也照樣能用。"
body = """\
      斷開網路，這個工具跟原來一模一樣，因為它裡面從來就沒有聯網這一步。這是最\
      省事的一條證明。"""

[[howto]]
title = "貼上兩段文字，或者拖進兩個檔案。"
body = """原文在左，改過的在右。同時拖到選擇框上的兩個檔案會按你放下的順序各落一邊；放反了就把兩邊換過來。"""

[[howto]]
title = "選好怎麼讀。"
body = """並排，或者單列。手機上從單列開始，因為並排需要兩欄文字，而手機差不多隻裝得下一欄；反正選單就在旁邊。"""

[[howto]]
title = "忽略無關緊要的。"
body = """空白、大小寫、空行——每一樣都可以單獨忽略，免得一個只是重新排版過的檔案讀起來像改了一百處。預設把沒變的中段摺疊成一個數字，每處改動兩側各留三行。"""

[[howto]]
title = "讀一讀改了什麼。"
body = """刪掉的行標在左邊，新增的行標在右邊；改動行內部，不同的詞會被高亮——兩段文字的比對顯示的是挪動的那個詞，而不是兩整段。"""

[[howto]]
title = "把補丁帶走。"
body = """下載下來的是統一格式的 <code>.patch</code>，程式碼評審、<code>git apply</code> 和所有差異檢視器認的就是它。複製會把同樣的內容放進剪貼簿。"""

[[faq]]
q = "我的文字會被傳到哪裡去嗎？"
a = """
        不會。比對是在你自己的瀏覽器裡、你自己的硬體上執行的函式。這個工具沒有任何形式的網路功能：它從不去取什麼，也從不發出什麼；頁面的 <code>Content-Security-Policy</code> 裡寫著它允許聯絡的每一個地址，沒有一個屬於本站。這正是拿它來處理合同、配置檔案或未釋出程式碼的理由：把這類東西貼進別人的比對器，等於把兩個版本一次全交了出去。"""

[[faq]]
q = "這個比對到底在做什麼？"
a = """
        它找出把左邊那段文字變成右邊那段所需的最短一組編輯，用的是 Myers 演算法——\
        <code>git diff</code> 用的那個。最短，正是讓差異讀得下去的關鍵：在中間插入\
        一行，就該顯示為一次插入，而不是後面每一行都變了。在改動行的內部，不同的\
        詞也會被標出來，所以比較兩段文字時看到的是挪動的那個詞，而不是整整兩段。"""

[[faq]]
q = "能比對兩個檔案，而不是兩段貼上嗎？"
a = """
        能。把兩個同時拖到選擇框上，它們會按你放下的順序各落一邊。讀它們的是你的瀏覽器，讀進這個頁面，而這也是它們唯一去的地方。要是放反了，把兩邊換過來就行。"""

[[faq]]
q = "比對會輸出什麼，我能應用它嗎？"
a = """
        下載的是一份 unified diff，也就是 <code>@@ -3,5 +3,5 @@</code> 那種格式，\
        <code>git apply</code>、<code>patch</code> 和所有程式碼評審工具都讀得懂。\
        複製則是把同樣的東西放進剪貼簿。螢幕上看到的只是它的一種呈現：左右並排，\
        或者單列，未改動的部分摺疊成一個計數，除非你要求全部展開。"""

[[faq]]
q = "能忽略空白、大小寫或空行嗎？"
a = """
        能，每一樣單獨控制。忽略空白後，只是重新排版過的檔案會被比對成沒有變化；忽略大小寫會把 <code>Error</code> 和 <code>error</code> 當成同一個詞；忽略空行會跳過什麼都不裝的行。這時結果上方的計數會說：把你要求忽略的差異忽略之後，兩邊是一樣的——這和「完全相同」不是同一個論斷，頁面把兩個論斷分得清清楚楚。"""

[[faq]]
q = "它能處理多大的比對？"
a = """
        這裡沒有設上限，因為沒有哪臺伺服器在為上限掏錢。兩萬行的兩段文字只改了幾處，眨眼就比完了，因為共同的開頭和結尾在真正運作之前就被裁掉了。兩段毫無共同之處的文字比對會提前停下並說明，而不是花一分鐘去證明本來就明擺著的事；而非常長的比對會畫出前幾千行，其餘交給下載下來的補丁。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，貼多少也沒有上限。本站帶廣告，經費就是\
        從那裡來的，廣告拿不到任何關於你文字的資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面載入一次之後斷開網路，它照樣運作。這也是證明「什麼都沒上傳」最省事的辦法，真要把你的文字送出去比對，拔線那一刻就停了。"""

