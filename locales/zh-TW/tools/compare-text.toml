  "並排或單列，沒變的中段摺疊成一個數字",
  "空白、大小寫、空行，每一樣都能單獨忽略",
  "把比對結果下載成程式碼評審讀得懂的 unified diff",
  "拖進來的兩個檔案，比起來和兩段貼上一樣容易",
  "共同的開頭結尾先裁掉，又長又像的檔案眨眼就比完",
