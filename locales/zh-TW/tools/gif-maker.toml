      則更小、更穩。"""

[[howto]]
title = "做出 GIF，然後下載。"
body = """\
      它是在你自己的硬體上拼出來的，所以花多久取決於你的機器，而不是排隊。\
      做好的動畫會先在頁面上放一遍，然後你再儲存。"""

[[faq]]
q = "我的圖片會被傳到哪裡去嗎？"
a = """
        不會。你的圖片由你自己的瀏覽器在你自己的硬體上讀取、繪製、量化和壓縮。\
        這個工具沒有服務端，頁面的 <code>Content-Security-Policy</code> 裡寫著\
        它允許聯絡的每一個地址，沒有一個屬於本站。拔掉網線，它照樣做 GIF。"""

[[faq]]
q = "能用哪些圖片格式？"
a = """
        凡是你瀏覽器能解碼的靜態圖片格式都行，實際上就是 JPG、PNG、WebP、GIF、\
        AVIF，在蘋果裝置上還有 HEIC。這裡沒有另外一份需要維護的清單，因為解碼\
        是瀏覽器的工作，不是我們的。"""

[[faq]]
q = "我的 GIF 為什麼這麼大？"
a = """
        因為 GIF 把每一幀都當作完整畫素來存。沒有運動補償，沒有「和上一幀一樣、\
        只是挪了個位置」這種存法，也沒有畫質旋鈕：體積大約就是面積乘幀數，能把它\
        壓下來的只有三件事。
        <br><br>
        做小一點：尺寸減半，檔案就只剩四分之一。少用幾幀，或者讓每一幀停久一點。\
        降到 64 色或 32 色，並關掉抖動——對平塗畫面來說這代價比聽起來小，對照片\
        來說則很大。要是還塞不下，老實說，你在做的其實是影片，同樣的內容做成 MP4，\
        大概只有十分之一大。"""

[[faq]]
q = "GIF 最快能放多快？"
a = """
        沒有那個數字看上去那麼快。這個格式把每幀的停留時間按百分之一秒來存，而從\
        九十年代起，瀏覽器就把小於兩個百分之一秒的值一律抬到十分之一秒。這條規矩\
        是為當年那些轉動的地球圖寫的，後來一直沒刪。所以 0.01 秒並不會按每秒 100 \
        幀來播，而是每秒 10 幀。正因如此，這個工具不提供低於 0.02 秒的選項，而 \
        0.05 秒（每秒 20 幀）差不多就是值得去要的上限了。"""

[[faq]]
q = "調色盤這個設定改的是什麼？"
a = """
        GIF 的一幀最多裝 256 種顏色，總得有人來挑這 256 種。
        <br><br>
        <strong>每幀各自最合適的顏色</strong>會給每一張圖單獨挑 256 種，看起來最\
        清爽，一組互不相干的照片就該這麼選。<strong>整個 GIF 共用一套調色盤</strong>\
        則把所有幀放在一起，只建一張表。檔案更小，而且能消掉同一場景各幀之間調色盤\
        來回跳所造成的閃爍，所以當這些幀是一段連續畫面而不是一堆合集時，就選它。"""

[[faq]]
q = "能保留透明背景嗎？"
a = """
        能，只要你的圖片本身有：把「透明」改成「保留透明區域」。不過動手前有件事得\
        知道。GIF 的透明只有一位，一個畫素要麼完全看不見，要麼完全畫上去，中間\
        沒有過渡，所以抗鋸齒的邊緣、柔和的陰影，以及任何漸隱的東西，都會變成\
        硬邊。要是你的動畫會放在一個你已知顏色的背景上，那把它壓到那個顏色上\
        會更好看。"""

[[faq]]
q = "能用的圖片張數有上限嗎？"
a = """
        工具裡沒有寫死的上限。真正的天花板是你機器的記憶體，以及你對出來那個檔案\
        大小的耐心：圖片是一張一張讀的，所以一百幀沒問題，但 640 畫素的一百幀\
        同樣是個非常大的 GIF。見上面的「我的 GIF 為什麼這麼大？」。"""

[[faq]]
q = "它免費嗎，需要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，也沒有試用期。出來的檔案上同樣沒有水印。本站\
        帶廣告，經費就是從那裡來的，廣告拿不到任何關於你圖片的資訊。"""

[[faq]]
q = "斷網能用嗎？"
a = """
        能。頁面載入一次之後斷開網路，它照樣運作。這也是證明「什麼都沒上傳」最省事\
        的辦法，真要把你的圖片送出去處理，拔線那一刻就停了。"""

