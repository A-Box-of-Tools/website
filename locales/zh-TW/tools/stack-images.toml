[[privacy]]
title = "工作是在這臺機器的 Worker 裡乾的，不是在伺服器上。"
body = """
 這是本站唯一用 worker 的\
      工具，因為堆疊是幾分鐘的算術而不是幾秒，而一個卡死的頁面既顯示不了進度也沒法\
