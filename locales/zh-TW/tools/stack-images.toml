[[howto]]
title = "選幀。"
body = """
 一串連拍、一組包圍曝光、一段間隔拍攝，或者一整個裝著\
      RAW 檔案的資料夾都行。每一個到了就開啟，那一行會告訴你從裡面讀出了什麼。RAW 檔案\
      的話，是相機型號、裡面找到的預覽圖尺寸，以及為了找到它只需要讀多少。"""

[[howto]]
title = "按你想失去的東西挑手法。"
body = """
 雜訊：平均值；要是有什麼動過，\
      Sigma 裁剪。人、車、飛過去的飛機：中位數。想變成星軌的暗夜空：最亮。沿著對焦環\
      拍的微距：景深合成。選單下面那行字會說明，對你手上這個幀數，每種手法會做什麼。"""

[[howto]]
title = "決定要不要對齊。"
body = """
 手持：要，只平移。手持而且還在轉：\
      平移加旋轉加縮放。鎖死的三腳架或者間隔拍攝：不要，而且會更快。每一幀都是拿列表裡\
      第一幀當基準來量的，所以任何一幀都可以被提上去當第一幀。"""

[[howto]]
title = "讀那四個數字，再按按鈕。"
body = """
 在任何東西開跑之前，頁面會說清\
      結果會有多大、大概要多少記憶體、這些幀會被解碼多少次，以及你的檔案被讀了多少。\
      這一組要是沒法一次裝進記憶體，它也會說，並且說清換哪一檔工作解析度就夠了。"""

[[faq]]
q = "我的照片會被上傳嗎？"
a = """
        不會。每一幀的開啟、解碼、對齊、堆疊和寫出，全都由你自己的瀏覽器在你自己的\
        硬體上完成。這個工具沒有任何聯網功能，從不取東西，也從不發東西，頁面的\
        <code>Content-Security-Policy</code> 裡寫著它能聯絡的每一個地址，沒有一個屬於\
        本站。把頁面載入一次，斷網，它照樣能用。這件事在這裡比在多數工具上更要緊，\
        單純是因為量：二十個 RAW 幀差不多一個 G，而為了讓別人算一次平均值就上傳一個 G\
        的照片，正是這個工具存在的意義所要避開的事。"""

[[faq]]
q = "它能讀哪些 RAW 格式？怎麼讀的？"
a = """
        <span id="faq-raw"></span>CR2、CR3、NEF、NRW、ARW、SR2、SRF、DNG、ORF、RAF、RW2、\
        PEF、SRW、3FR、IIQ、DCR、KDC、MRW、MEF、RWL 等等，也就是相機會寫的絕大多數。\
        從裡面讀出來的是相機自己在按下快門那一刻渲染好的原尺寸 JPEG 預覽圖，也就是相機\
        背後螢幕上顯示的那張，以及你的作業系統拿來當縮圖畫的那張。它是靠走檔案的目錄\
        結構找到的，代價是幾次每次幾十 KB 的讀取，然後取其中一段。<strong>這不是對感測器\
        資料做去馬賽克。</strong>結果帶的是相機自己的白平衡和照片風格，每通道八位，\
        而不是 RAW 轉換器會給你的那十二位或者十四位線性感測器資料。"""

[[faq]]
q = "那為什麼不好好解碼感測器資料？"
a = """
        因為那意味著要把 LibRaw 或者 dcraw 隨包帶上：為了一個格式家族多背一個幾十兆的\
        引擎，而其中大半還是各家廠商自己的壓縮方案。這筆帳在本站原始碼的\
        <code>docs/what-can-be-built-here.md</code> 裡算過，相機 RAW 早在這個工具出現\
        之前就在排除名單上了。變的不是那個問題的答案，而是我們發現堆疊根本不需要它：\
        預覽圖是全解析度的，本來也就是相機會給你的那張 JPEG，而讀它比去馬賽克快大約\
        一百倍。你要是要感測器資料，先在 RAW 轉換器裡衝一遍，再把它給出的 TIFF 或者\
        JPEG 拿來堆疊，這個工具也收那些。"""

[[faq]]
q = "它能處理多少幀？多大的？"
a = """
        七種手法裡有六種是流式的：只留一個累加器，每一幀恰好讀一次，所以一百幀跟兩幀\
        佔一樣的記憶體，長的只有時間。中位數是例外，因為一組數的中間那個值，不把整組拿全\
        就無從知道，於是它得同時抱著每一幀。二十張 2400 萬畫素差不多是 1.4&nbsp;GB，\
        沒有哪個瀏覽器給得起。碰上這種情況，圖會被切成橫條，一條一條地堆，代價是每條都要\
        把這些幀重讀一遍。這些頁面在你按下按鈕之前就全算好並且寫出來了，所以跑得慢從來\
        不會是個意外。"""

[[faq]]
q = "對齊到底做了什麼？"
a = """
        它算出每一幀相對第一幀偏了多少，再把它挪回去，精度到一個畫素的幾分之一。用的方法\
        是相位相關：兩張圖之間的位移，在它們的頻譜之間表現為一個相位差，所以各做一次\
        傅立葉變換，找兩百畫素的偏移和找兩畫素的一樣便宜。第二檔設定把同一個把戲用在\
        對數極座標下的頻譜上，連旋轉和縮放也一起還原。這些都是全域性的，整幀一個位移、\
        一個角度、一個縮放。所以它能糾正動了的相機，糾正不了動了的被攝體，也糾正不了\
        往左挪了一步再拍的那一張。有一個看得見的後果：往左挪了二十畫素的一幀，右邊緣\
        夠不到了，所以結果會裁到每一幀都覆蓋到的那塊。對齊過的堆疊比進去的幀略小一點，\
        原因就在這裡，而這也是不讓畫面出現一圈由缺幀造成的黑邊的唯一辦法。"""

[[faq]]
q = "我該用哪種手法？"
a = """
        什麼都沒動的一組，要消雜訊就用<strong>平均值</strong>，它把隨機雜訊大約按幀數的\
        平方根壓下去。要去掉只在一部分時間裡出現過的東西，用<strong>中位數</strong>，\
        最經典的用法就是把一個人來人往的廣場拍上十幾張，然後得到一個空廣場。兩樣都想要，\
        用 <strong>Sigma 裁剪</strong>：它先學出每個畫素通常是什麼，再只對跟這個說法\
        一致的數值取平均，於是既有中位數那種對開過去的車的免疫，也有平均值那種消噪能力。\
        星軌、煙花和光繪用<strong>最亮</strong>。要去掉任何動過的亮東西，用\
        <strong>最暗</strong>。要模擬一次長曝光，用<strong>相加</strong>。沿著對焦環拍的\
        微距，用<strong>景深合成</strong>。"""

[[faq]]
q = "我的 RAW 是十四位的，為什麼結果是八位？"
a = """
        因為被堆的是相機自己的預覽圖，而那是一張 JPEG。不過值得說一句：堆疊能把這筆代價\
        找回來一部分。十六張八位的幀取平均，得到的層次確實比其中任何一張都細，因為正是\
        那個讓每一幀四捨五入得不一樣的雜訊，才讓平均值能落在兩級之間。這裡的算術是用\
        浮點做的，只在最後一步取整一次，所以中間沒有丟掉任何東西。它終究還是不等於堆疊\
        線性的感測器資料，這個工具也不裝作是。"""

[[faq]]
q = "尺寸不同的幀，或者不同相機的幀，能堆嗎？"
a = """
        能，不過那通常是個誤會，值得確認一下你真是這個意思。結果的尺寸取最大的那一幀，\
        其餘每一幀都縮放到能放進去並居中。混相機也就混了色彩的解釋，所以兩者的平均值，\
        是對同一束光的兩種不同解釋的平均值。真正用得上的場合，是一組用兩種解析度拍的，\
        或者同一幀的 RAW 檔案和 JPEG。"""

[[faq]]
q = "它說這一次會分條跑，什麼意思？"
a = """
        意思是這種手法需要的工作記憶體，超過了這個工具願意一次性申請的量，所以圖會被切成\
        橫條，一條一條地堆。結果完全一樣，只是每條都要把這些幀重讀一遍，所以更慢，而頁面\
        會告訴你那會是多少次解碼。把工作解析度降一檔，記憶體就變成四分之一，幾乎總能把分條\
        跑變回一遍跑完，而且提示裡也寫了換哪一檔就行。"""

[[faq]]
q = "為什麼只有這個工具用 Worker，別的都不用？"
a = """
        因為只有它的工作是按分鐘算的。本站其他每一個工具做的事都是一兩秒的量，把活挪出主\
        執行緒只是走個過場。堆二十張大幀是在幾百 MB 上做紮實的算術，放在主執行緒上就意味著一個\
        卡死的頁面：進度條不動，取消按鈕不應，最後瀏覽器出來問要不要關掉這個分頁。\
        Worker 是同一個瀏覽器裡的第二條執行緒，跑的是同一個資料夾裡的檔案，受的是同一套\
        策略。它不是伺服器，也不是聯網功能。"""

[[faq]]
q = "免費嗎？要註冊嗎？"
a = """
        免費，沒有帳號，不用登入，沒有試用期，也沒有水印。堆多少幀、幀有多大都沒有限制，\
        因為根本沒有伺服器在為它掏錢，工作是在你自己的機器上乾的，天花板只有你自己的記憶體。\
        本站靠廣告養活，廣告那邊拿不到關於你照片的任何東西。"""

