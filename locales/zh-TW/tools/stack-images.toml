[[privacy]]
title = "RAW 檔案是被讀，不是被上傳，而且只讀了一點點。"
body = """
 相機的 RAW 檔案裡本來就有一張\
      相機在按下快門那一刻渲染好的原尺寸 JPEG。這個工具走幾條目錄項把它找出來，然後只要\
