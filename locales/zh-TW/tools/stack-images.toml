      交給它的是檔案本身，這不花什麼代價，因為檔案控制代碼不是那些位元組；而它受著和頁面\
      完全一樣的 Content-Security-Policy，也就是說無處可送。"""

[[privacy]]
title = "關於這一組，沒有向任何地方報告過什麼。"
body = """
 你堆了幾幀、是哪臺相機寫的、\
