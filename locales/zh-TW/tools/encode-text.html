<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> 選好編碼</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">編碼方式</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>哪個方向</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>編碼</strong> 進去是明文，出來是編碼後的。</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>解碼</strong> 進去是編碼後的，出來是明文。</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> 貼進來</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">你的文字</label>
          <span class="count" id="input-count">空的</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="把要編碼的文字或要解碼的 Base64 貼到這裡 - 或者把檔案拖到上面。"></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">試個例子</button>
        <button type="button" id="clear" class="ghost danger">清空</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> 把結果帶走</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">還沒有結果。</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>複製</button>
        <a id="download" class="ghost as-button" hidden download>下載</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
