    把一則筆記或一個檔案挪到另一台機器上，慣用的辦法個個都會留下副本：在寄件備份裡，在聊天紀錄裡，或者在某個分享網站的伺服器上、一個只能選擇相信的刪除按鈕背後。有一種辦法哪裡都不留，因為壓根什麼都不存——而且它也是唯一一種名稱能隔著房間喊出來的辦法。"""

