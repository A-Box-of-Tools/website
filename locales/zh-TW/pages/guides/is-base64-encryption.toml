title = "Base64 算加密嗎？"
description = "不算。而且這個區別在實際裡很要命。編碼、加密、雜湊解決的是三個不同的問題：第一個誰都能還原，第二個持有金鑰的人能還原，第三個誰也還原不了。哪個是哪個，一眼怎麼認。"

