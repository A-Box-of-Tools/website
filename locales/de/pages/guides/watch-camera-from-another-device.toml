title = "Die Kamera eines anderen Geräts im Browser ansehen"
description = "Ein Telefon für Haustiere, den Eingangsbereich oder Heimwerkerprüfungen weiterverwenden. Zuschauer freigeben und mit Direct im erreichbaren lokalen Netz oder einem optionalen verschlüsselten Cloud relay verbinden."
heading = "Die Kamera von einem anderen Gerät aus ansehen"
lede = "Geben Sie einem alten Telefon eine neue Aufgabe: ein Blick auf Haustiere, eine Eingangskamera oder ein zweites Augenpaar unter der Spüle. Öffnen Sie die Kamera in einem Browser und geben Sie den Zuschauer in einem anderen frei. Direct verwendet ein erreichbares lokales Netz. Der Host kann stattdessen Cloud relay wählen, um verschlüsseltes Video über Cloudflare weiterzuleiten."
updated = "15. Oktober 2026"
og_title = "Eine Kameraansicht von einem anderen Gerät"
og_description = "Geben Sie den Zuschauer vor dem Livevideo frei. Verbinden Sie sich direkt in einem erreichbaren lokalen Netz oder wählen Sie ein verschlüsseltes Cloud relay. Mit Hinweisen zu Berechtigungen und Verbindungsproblemen."
