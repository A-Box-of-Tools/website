title = "AVIF in JPG umwandeln (und warum es sich sonst nicht öffnen lässt)"
description = "Ein heruntergeladenes .avif-Bild lässt sich nicht öffnen? Ihr Browser liest es bereits. Was AVIF ist, was JPEG nicht übernimmt, warum es größer wird und wie die Umwandlung ohne Upload gelingt."
heading = "Die Datei, die nur der Browser öffnet, in dem Sie gerade lesen"
lede = "Ein Bild von einer Website kommt als <code>.avif</code>, und Ihr Bildbetrachter lehnt es ab, während der Browser es problemlos anzeigt. Dieser Unterschied erklärt alles und ist der Grund, warum die Umwandlung Ihren Rechner nicht verlassen muss."
