nav = "Sprache von Personen in der Nähe empfangen"
title = "Live-Sprache von Geräten in der Nähe empfangen"
description = "Öffnen Sie einen Sprachpager im Browser mit Passwortzulassung und einzelnen Sprecherkontrollen. Wählen Sie vor dem Start Direct oder ein optionales verschlüsseltes Cloud relay."
heading = "So empfangen Sie Live-Sprache von Personen in der Nähe"
lede = "Ein Host hört zu, während mehrere Personen aus ihren Browsern sprechen. Der Host benennt den Pager und wählt vor dem Start Direct oder Cloud relay; Anrufende brauchen keinen Anzeigenamen. Die Umgebungssuche hilft beim Auffinden, ein optionales Passwort steuert die Zulassung und der Host entscheidet, welche Stimmen hörbar sind. Cloud relay leitet verschlüsselte Sprache nach Bestätigung durch die Anrufenden über Cloudflare."
updated = "14. Oktober 2026"
og_title = "Viele Sprechende, ein zuhörender Host"
og_description = "Ein Sprachpager mit Umgebungssuche, Passwortzulassung und Sprecherkontrollen. Standardmäßig direkt, mit optionalem verschlüsseltem Cloud relay."
