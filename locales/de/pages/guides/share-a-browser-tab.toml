title = "Einen Browser-Tab ohne Erweiterung live teilen"
description = "Zeigen Sie einem genehmigten Zuschauer einen Browser-Tab. Nutzen Sie Direct in einem erreichbaren lokalen Netzwerk oder ein optionales verschlüsseltes Cloud relay. Ohne Erweiterung oder Fernsteuerung."
heading = "Einen Browser-Tab ohne Erweiterung live teilen"
lede = "Zeigen Sie jemandem die Website, die Sie benutzen, und behalten Sie die Kontrolle. Ihr Browser erfasst einen gewählten Tab und sendet sein sich änderndes Bild an den Zuschauer. Direct verwendet ein erreichbares lokales Netzwerk; Cloud relay ist eine ausdrückliche Option, die verschlüsseltes Video über Cloudflare weiterleitet. Laden Sie per Link oder Umgebungssuche ein und genehmigen Sie den Zuschauer vor der Videoübertragung."
updated = "15. Oktober 2026"
og_title = "Ein Browser-Tab live, unter Ihrer Kontrolle"
og_description = "Live-Video eines Tabs mit Genehmigung und ohne Fernsteuerung. Nutzen Sie Direct in einem erreichbaren lokalen Netzwerk oder ein verschlüsseltes Cloud relay."
