heading = "So teilen Sie Text und Dateien ohne gespeicherte Serverkopie"
lede = "Übertragen Sie eine Notiz oder Datei ohne Kopie in einem E-Mail-Postfach, Chatverlauf oder Freigabeserver. Standardmäßig verbinden sich die Browser direkt. Wenn das nicht klappt, kann der Host eine neue Freigabe mit Cloud-Relay starten; Cloudflare leitet die verschlüsselten Inhalte weiter. Empfänger können erhaltene Inhalte weiterhin speichern."

