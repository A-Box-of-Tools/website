[[privacy]]
title = "Ihre Bilder haben kein Ziel außerhalb Ihres Rechners."
body = " Die Content-Security-Policy nennt jede Adresse, die diese Seite kontaktieren darf. Keine davon gehört zu dieser Website. Es gibt keinen Endpunkt, der Ihre Dateien sammeln könnte, und keinen Code, der sie versenden würde."

[[privacy]]
title = "Der Decoder steckt bereits im Browser. Das ist der ganze Trick."
body = " Ein AVIF, das Ihr Bildbetrachter ablehnt, öffnet sich in einem Browsertab problemlos: Chrome und Firefox dekodieren AVIF seit 2021, Safari seit 2023. Diese Seite ergänzt diesen Decoder um eine Speicherschaltfläche. Sie öffnet die Datei, zeichnet das Bild und schreibt ein JPEG. Es gibt also keine Engine zum Herunterladen, keine Wartezeit vor der ersten Umwandlung und keinen Grund für einen Server. Genau das verschweigen Konverter, die einen Upload verlangen."

[[privacy]]
title = "Die transparenten Bereiche und die Farbe dahinter."
body = " AVIF kann einen Alphakanal enthalten, JPEG nicht. Deshalb muss dahinter eine Farbe stehen. Diese Seite fragt nach ihr und verwendet standardmäßig Weiß. Sie fragt nur, wenn eine Datei tatsächlich Transparenz enthält, festgestellt anhand der dekodierten Pixel. Die meisten AVIF-Dateien von Websites sind undurchsichtige Fotos. Dann bleibt das Farbfeld verborgen."

[[privacy]]
title = "Was JPEG aus einem AVIF nicht übernehmen kann."
body = " AVIF kann mehr Farben und hellere Spitzlichter beschreiben als JPEG: zehn oder zwölf Bit pro Kanal und HDR. JPEG hat acht Bit und kein HDR. Ein entsprechendes Bild wird auf den gewöhnlichen Dynamikbereich reduziert. Bei der großen Mehrheit der Bilder gibt es nichts zu reduzieren und keinen sichtbaren Unterschied; bei einem Bildschirmfoto eines HDR-Fotos möglicherweise schon. Das steht deshalb vorab hier."

[[privacy]]
title = "Was Google lädt und welche Informationen es nicht erhält."
body = " Werbe- und Messskripte kommen von Google, die Spendenschaltfläche von Buy Me a Coffee. Keines davon erhält Informationen über Ihre Bilder. Jede Zeile, die eine Datei liest, dekodiert oder schreibt, wird von dieser Herkunft ausgeliefert und steht im Repository."

[[privacy]]
title = "Es funktioniert offline."
body = " Laden Sie die Seite einmal und trennen Sie die Netzwerkverbindung. Das Werkzeug arbeitet unverändert weiter. Das ist der einfachste Beweis: Ein Konverter, der Ihre Bilder zur Verarbeitung verschickt, könnte das nicht."

[[howto]]
title = "Wählen Sie Ihre AVIF-Dateien."
body = " Ziehen Sie sie auf die Dateiauswahl oder wählen Sie sie von Hand. Jede Datei wird anhand ihrer ersten Bytes statt ihres Namens erkannt. Ein beim Download umbenanntes AVIF funktioniert deshalb weiterhin. Eine tatsächliche PNG-Datei wird mit einer Erklärung ihres Formats abgelehnt."

[[howto]]
title = "Wählen Sie die Qualität und die Farbe hinter transparenten Bereichen."
body = " Der Regler beginnt bei 92. Ein Foto lässt sich damit kaum vom Original unterscheiden. Das Farbfeld erscheint nur, wenn eine Datei transparente Bereiche hat, weil JPEG diese mit einer Farbe füllen muss."

[[howto]]
title = "Drücken Sie „Umwandeln“ und laden Sie das Ergebnis herunter."
body = " Jedes Ergebnis nennt die Ausgangsdatei, die neue Größe und den Größenunterschied. Meist wird es deutlich größer, weil AVIF effizienter kodiert und Sie Speicherplatz gegen Kompatibilität tauschen. Eine Datei erhält eine Downloadschaltfläche, mehrere zusätzlich ein ZIP-Archiv."

[[faq]]
q = "Wird mein Bild irgendwo hochgeladen?"
a = "Nein. Ihr Browser liest, dekodiert und schreibt die Datei auf Ihrer eigenen Hardware. Dieses Werkzeug hat keinerlei Netzwerkfunktion: Es ruft nichts ab und versendet nichts. Die <code>Content-Security-Policy</code> der Seite nennt jede erlaubte Kontaktadresse; keine gehört zu dieser Website. Nicht einmal ein Decoder muss zuerst geladen werden, denn Ihr Browser hat bereits einen."

[[faq]]
q = "Warum öffnet kein Programm auf meinem Rechner diese Datei?"
a = "Weil AVIF dort noch neu ist, wo es darauf ankommt. Websites verwenden es, weil es bei gleicher Qualität erheblich kleiner als JPEG ist. Wer ein Bild speichert, bekommt deshalb inzwischen eine <code>.avif</code>-Datei. Das Programm zum Öffnen ist oft älter als das Format. Windows braucht eine Erweiterung, viele Desktopeditoren lehnen es ab, und die meisten E-Reader, Drucker und Uploadformulare kennen es nicht. Ihr Browser liest es dagegen problemlos. Deshalb kann diese Seite helfen, und deshalb haben Sie die Datei überhaupt erhalten."

[[faq]]
q = "Wird die JPG-Datei größer als das AVIF?"
a = "Mit großer Wahrscheinlichkeit, oft um ein Mehrfaches. Das Ergebnis zeigt den Unterschied ausdrücklich. AVIF gehört zu den effizientesten Bildcodecs und JPEG zu den ältesten. Ein Bild von 40 KB als AVIF kann bei gleicher sichtbarer Qualität als JPEG leicht 200 KB belegen. Sie tauschen Speicherplatz gegen Kompatibilität. Wenn die Größe danach wichtig ist, verkleinert der <a href=\"../bild-komprimieren/\">Bildkompressor</a> das JPEG auf eine gewünschte Größe."

[[faq]]
q = "Was passiert mit der Transparenz?"
a = "Sie wird mit einer Farbe Ihrer Wahl gefüllt. Die Seite erklärt das vor dem Start. AVIF hat einen Alphakanal, JPEG nicht; Transparenz kann bei dieser Umwandlung also nicht erhalten bleiben. Sie entscheiden, welche Farbe darunter liegt. Die meisten AVIF-Dateien sind undurchsichtige Fotos, bei denen das Farbfeld nie erscheint. Soll Transparenz bleiben, verwenden Sie den <a href=\"../bild-komprimieren/\">Bildkompressor</a>, der AVIF liest und PNG sowie WebP schreibt."

[[faq]]
q = "Was ist mit HDR und 10-Bit-Farbe?"
a = "Beides geht verloren, weil JPEG es nicht aufnehmen kann. AVIF speichert zehn oder zwölf Bit pro Kanal und Spitzlichter, die heller sind als die Anzeige eines gewöhnlichen Bildschirms. JPEG hat acht Bit und kennt keinen solchen Dynamikbereich. Ein HDR-AVIF wird deshalb zu einem gewöhnlichen Bild. Für eine überall zu öffnende Datei ist das passend, für eine Archivierung ein echter Verlust. Fast kein Bild von einer gewöhnlichen Webseite enthält HDR; für die meisten Menschen ändert sich daher nichts."

[[faq]]
q = "Wird das Bild erneut komprimiert?"
a = "Ja, das ist erforderlich. AVIF und JPEG verwenden verschiedene Codecs. Ohne Dekodierung und anschließende neue Kodierung lässt sich nicht zwischen ihnen wechseln. Das gilt für jeden AVIF-Konverter, auch für solche mit Upload. Sie bestimmen den Qualitätsverlust. Der Regler beginnt bei 92, womit sich ein Foto kaum vom Original unterscheiden lässt."

[[faq]]
q = "Geht es auch andersherum, von JPG zu AVIF?"
a = "Hier nicht. Der Grund: Kein Browser schreibt AVIF. Ein Canvas, das um AVIF gebeten wird, liefert stillschweigend PNG mit dem falschen Typ. Eine Seite, die AVIF im Browser verspricht, liegt daher entweder falsch oder sendet das Bild zur Kodierung an einen Server. Für die korrekte Verarbeitung ohne Server wäre ein eigener Encoder nötig. Diese Arbeit steht auf <a href=\"../roadmap/\">der Roadmap</a>, statt hier nur behauptet zu werden."

[[faq]]
q = "Bleiben Datum, Kamera und Standort erhalten?"
a = "Nein. Das Bild wird auf ein Canvas gezeichnet, das nur Pixel enthält. EXIF, GPS, Farbprofile und XMP bleiben zurück. Bei Bildern von Webseiten sind diese Daten meist ohnehin nicht vorhanden. Um vorhandene Daten zu sehen oder zu bearbeiten, verwenden Sie den <a href=\"../exif-daten-entfernen/\">EXIF-Betrachter und Entferner</a>; er komprimiert das Bild dabei nicht erneut."

[[faq]]
q = "Kann ich einen ganzen Ordner auf einmal umwandeln?"
a = "Ja. Ziehen Sie beliebig viele Dateien hinein. Zahl und Größe sind nicht begrenzt, weil kein Server dafür aufkommen muss. Jede erhält eine eigene Zeile und einen eigenen Download. Ab zwei Dateien gibt es zusätzlich ein ZIP-Archiv mit allen Ergebnissen."

[[faq]]
q = "Ist es kostenlos und funktioniert es offline?"
a = "Es ist kostenlos, ohne Konto, Anmeldung, Testphase oder Wasserzeichen. Werbung finanziert die Website und erhält keine Informationen über Ihre Bilder. Laden Sie die Seite einmal und trennen Sie die Internetverbindung: Sie arbeitet unverändert weiter. Das ist zugleich der stärkste verfügbare Beweis, dass nichts hochgeladen wird."

