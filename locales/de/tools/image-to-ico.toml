name = "Bild zu ICO"
heading = "Bild&nbsp;zu&nbsp;ICO <span class=\"h1-kw\">&mdash; Favicon, Windows- und macOS-Symbol erstellen</span>"
tagline = "Ein Bild hinein. Jede Größe, die ein Browser, Windows oder ein Mac verlangt, heraus."

title = "Bild zu ICO &mdash; Favicon, App-Symbol oder ICNS, ohne Upload"
description = "Ein PNG, JPEG oder SVG im Browser in eine echte .ico mit mehreren Größen oder eine macOS-.icns umwandeln. Favicon, Windows-App-Symbol, Mac-App-Symbol, dazu die Apple- und Android-Dateien, die eine Website braucht. Nichts wird hochgeladen."
og_title = "Eine .ico oder .icns mit allen Größen darin erstellen, ohne etwas hochzuladen"
og_description = "Eine favicon.ico für eine Website, eine app.ico für ein Windows-Programm, eine .icns für einen Mac - mit einer Vorschau bei 16 Pixeln vor dem Download. Alles läuft auf Ihrem eigenen Gerät."
og_image_alt = "Bild zu ICO - Favicon, Windows- und macOS-Symbol erstellen, ohne Upload"

pledge = """
    Das Skalieren und die Symboldateien selbst entstehen beide in Ihrem eigenen
    Browser. Das Bild wird von der Leinwand gezeichnet, die Ihr Browser ohnehin
    mitbringt, und jeder Container &mdash; die Windows-<code>.ico</code>, die
    macOS-<code>.icns</code> &mdash; wird aus diesen Pixeln von ein paar hundert
    Zeilen in <code>src/ico.js</code> und <code>src/icns.js</code>
    zusammengesetzt, die Sie lesen können. Dieses Werkzeug hat keinerlei
    Netzfunktion &mdash; nichts abzurufen, nichts zu senden &mdash; und es gibt
    am anderen Ende dieser Seite keinen Server, an den ein Logo ginge, selbst
    wenn es einen Weg dorthin gäbe."""

live_hint = """
      Glauben Sie es uns nicht: Öffnen Sie die DevTools, beobachten Sie den Tab
      &bdquo;Netzwerk&ldquo; und erstellen Sie ein Symbol. Keine einzige Anfrage
      trägt ein Bild, ein Vorschaubild, einen Dateinamen oder ein Byte Ihrer
      Auswahl. Oder trennen Sie die Internetverbindung und erstellen Sie trotzdem
      eines."""

read_first = """
, <code>src/ico.js</code> und
      <code>src/icns.js</code> für die beiden Symbolformate &mdash; das
      Verzeichnis, die Einträge und die Maske im einen, Apples zehn benannte
      Plätze im anderen &mdash; und <code>src/sizes.js</code> dafür, woher jede
      Größe auf der Seite kommt."""

howto_heading = "Eine .ico-Datei erstellen, ohne etwas hochzuladen"

card = """
            Ein Favicon, ein Windows-App-Symbol oder eine macOS-.icns &mdash;
            jede Größe in einer Datei, mit einer Vorschau bei 16 Pixeln vor dem
            Download."""

[words]
plural = "Bilder"
choose = "ein Bild"
analytics_extra = """, und auch keine der
  Größen, Formate oder Dateinamen, die dieses Werkzeug ermittelt"""

