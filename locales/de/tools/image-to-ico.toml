[[privacy]]
title = "Ihr Logo hat keinen Weg nach draußen."
body = """
 Die
      Content-Security-Policy nennt jede Adresse, die diese Seite kontaktieren
      darf, und keine davon gehört zu dieser Seite. Es gibt hier keinen Endpunkt,
      an dem Ihre Dateien gesammelt werden könnten, und nichts im Code, das sie
      senden würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Das Skalieren ist
      ein <code>drawImage</code> auf eine Leinwand; jedes Symbol ist ein Header,
      den <code>src/ico.js</code> oder <code>src/icns.js</code> auf dieser Seite
      vor diese Pixel schreibt."""

[[privacy]]
title = "Die Datei wird aus ihren eigenen Bytes beschrieben."
body = """
 Die Liste der Größen
      neben einem fertigen Symbol ist nicht die Liste der Größen, die Sie
      verlangt haben. Sie wird aus der eben geschriebenen Datei zurückgelesen,
      von <code>readIcoDirectory</code> beziehungsweise
      <code>readIcnsElements</code> &mdash; wäre ein Schreiber je anderer
      Meinung als die Einstellungen, sagte die Seite das, statt dass Sie es
      erfahren, wenn Windows nichts zeichnet und macOS ein leeres Blatt
      Papier."""

[[privacy]]
title = "Was Google lädt - und was es nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihr Bild übergeben. Jede Zeile, die eine
      Datei liest, skaliert oder schreibt, wird von dieser Herkunft ausgeliefert
      und ist im Repository aufgeführt."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil es nie einen Netzschritt darin gab. Das
      ist der einfachste Beweis von allen."""

[[howto]]
title = "Wählen Sie das Bild."
body = """
 Ziehen Sie ein PNG, JPEG, WebP oder SVG
      auf das Auswahlfeld, oder wählen Sie mehrere und wandeln Sie sie in einem
      Durchgang um. Quadratisch ist am einfachsten, und alles ab 256 Pixeln hat
      genug Detail für jede Größe. Der Browser liest es direkt von Ihrer
      Festplatte; dabei wird nichts irgendwohin gesendet."""

[[howto]]
title = "Wählen Sie die Dateien, die Sie brauchen."
body = """
 Windows und ein Browser lesen
      <code>.ico</code>; ein Mac liest <code>.icns</code> und sieht die andere
      gar nicht erst an. Setzen Sie das Häkchen bei einem von beiden &mdash; oder
      bei beiden, wenn das, was Sie bauen, auf beiden ausgeliefert wird. Eine
      Website will außerdem die zusätzlichen Apple-, Android- und Kachelbilder,
      und das ist das dritte Kästchen."""

[[howto]]
title = "Sagen Sie, wofür das Symbol ist."
body = """
 Ein Website-Favicon sind 16, 32 und
      48 Pixel; eine Windows-Anwendung will zusätzlich 256; eine Anwendung, die
      auf einem hochauflösenden Notebook gut aussehen muss, will die
      Zwischengrößen, die Windows bei 125&nbsp;% und 150&nbsp;% Skalierung
      verlangt. Wählen Sie das Passende, oder setzen Sie die Häkchen selbst.
      Jede Größe auf der Liste sagt, wer sie verlangt. Bei der
      <code>.icns</code> gibt es diese Wahl nicht: Apple benennt genau zehn
      Plätze, und alle zehn kommen hinein."""

[[howto]]
title = "Kümmern Sie sich um Form und Hintergrund."
body = """
 Ein Symbol ist quadratisch,
      und die meisten Logos sind es nicht. Füllen Sie auf, bleibt das ganze Bild
      erhalten, mit Platz darüber und darunter; schneiden Sie zu, wird die Mitte
      genommen; dehnen Sie, wird es gestaucht. Transparenz bleibt Transparenz,
      sofern Sie keine Farbe wählen, die dahinter sitzt."""

[[howto]]
title = "Sehen Sie sich das mit 16 Pixeln an, bevor Sie herunterladen."
body = """
 Das ist die
      Größe, in der das Symbol am häufigsten zu sehen sein wird, und dort
      verschwinden dünne Striche und kleine Schrift. Jedes Quadrat in der
      Vorschau wird in seiner echten Größe aus Ihrer eigenen Datei gezeichnet.
      Ist das kleinste ein Fleck, ist die Lösung eine einfachere Zeichnung und
      keine andere Einstellung."""

[[howto]]
title = "Nehmen Sie die Dateien."
body = """
 Eine .ico mit jeder Größe darin, benannt
      <code>favicon.ico</code>, wenn Sie das verlangt haben, denn das ist die
      Adresse, nach der Browser suchen. Eine .icns daneben, wenn Sie das Häkchen
      gesetzt haben, bereit für ein Mac-Anwendungspaket. Setzen Sie auch das
      Häkchen für den Website-Satz, bekommen Sie zusätzlich die Apple-, Android-
      und Windows-Kachelbilder, das Manifest und den HTML-Block zum Einfügen in
      Ihre Seite. Alles über eine einzelne Datei hinaus kommt als ein ZIP
      herunter."""

[[faq]]
q = "Wird mein Bild irgendwohin hochgeladen?"
a = """
        Nein. Das Bild wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware
        dekodiert und skaliert, und die .ico wird aus diesen Pixeln von Code
        zusammengesetzt, der von dieser Seite ausgeliefert wird. Dieses Werkzeug
        hat keinerlei Netzfunktion &mdash; es ruft nie etwas ab und sendet nie
        etwas &mdash; und die <code>Content-Security-Policy</code> der Seite
        nennt jede Adresse, die sie kontaktieren darf; keine davon gehört zu
        dieser Seite."""

[[faq]]
q = "Welche Größen sollte eine favicon.ico enthalten?"
a = """
        16, 32 und 48. Das ist keine Geschmacksfrage: 16 ist das, was ein Browser
        in einem Tab zeichnet, 32 nutzt Windows für eine Desktop-Verknüpfung und
        mehrere Browser für ein Lesezeichen, und 48 ist die Größe, in der Google
        ein Seitensymbol liest. Alles Größere gehört in ein PNG neben die .ico
        statt hinein &mdash; und genau das erzeugt hier der Website-Satz."""

[[faq]]
q = "Welche Größen braucht ein Windows-Anwendungssymbol?"
a = """
        16, 32, 48 und 256 &mdash; das ist es, was die Standard-app.ico von
        Visual Studio selbst enthält. 16 ist die Titelleiste und die kleine
        Explorer-Ansicht, 32 der Desktop und die Taskleiste, 48 die mittleren
        Symbole des Explorers, und 256 das Startmenü und die extragroße Ansicht.
        Auf einem hochauflösenden Bildschirm verlangt Windows außerdem 20, 24,
        40, 64 und 96 und rechnet sie aus der nächstgelegenen vorhandenen Größe
        hoch, wenn sie fehlen &mdash; die Voreinstellung &bdquo;jede
        Skalierung&ldquo; legt sie hinein."""

[[faq]]
q = "Warum ist die Datei größer als das Bild, mit dem ich angefangen habe?"
a = """
        Weil eine .ico nicht ein Bild ist, sondern mehrere &mdash; und die
        kleinen werden unkomprimiert gespeichert, damit alles sie lesen kann. Ein
        32&times;32-Eintrag ist exakt 4.264 Byte groß, was auch darin steht, und
        ein unkomprimierter 256&times;256-Eintrag 264&nbsp;KB &mdash; und deshalb
        werden Größen über 64 standardmäßig als PNG gespeichert. &bdquo;PNG für
        jede Größe&ldquo; ergibt die kleinstmögliche Datei; unkomprimiert für
        jede Größe die verträglichste."""

[[faq]]
q = "Was ist der Unterschied zwischen PNG- und unkomprimierten Einträgen?"
a = """
        Nur, wie die Pixel in der .ico gespeichert werden. Ein unkomprimierter
        Eintrag ist die ursprüngliche Windows-Anordnung &mdash; ein
        Bitmap-Header, die Pixel auf dem Kopf und eine Ein-Bit-Transparenzmaske
        &mdash;, und jede je erschienene Windows-Version kann ihn lesen. Ein
        PNG-Eintrag ist eine ganze PNG-Datei, im Symbol verstaut, die bei den
        großen Größen drei- bis zehnmal kleiner ist, aber erst ab Windows Vista
        verstanden wurde. Die Voreinstellung nimmt jeweils das, was gewinnt:
        unkomprimiert bis 64 Pixel, darüber PNG."""

[[faq]]
q = "Kann es ein Symbol größer als 256 Pixel erzeugen?"
a = """
        Nein, und nichts kann das. Das Format speichert jede Seitenlänge in einem
        einzigen Byte, und die 0 ist vergeben &mdash; sie bedeutet 256. Das ist
        die Obergrenze, eine .ico mit einem 512-Pixel-Bild darin ist also kein
        größeres Symbol, sondern ein kaputtes. Brauchen Sie 512, brauchen Sie ein
        PNG &mdash; und genau das enthält der Website-Satz, für Android und für
        den Startbildschirm einer Web-App."""

[[faq]]
q = "Bleibt die Transparenz erhalten?"
a = """
        Ja, in beiden Eintragsarten, und es wird zusätzlich die alte
        Ein-Bit-Maske neben dem Alphakanal geschrieben, damit Software, die zu
        alt ist, das Alpha zu lesen, das Symbol trotzdem freistellt, statt einen
        schwarzen Kasten zu zeichnen. Die eine Datei, die absichtlich
        undurchsichtig gemacht wird, ist das Apple-Touch-Symbol im Website-Satz:
        iOS legt es auf seine eigene Kachel und macht aus Transparenz Schwarz,
        also wird es auf Ihre Hintergrundfarbe heruntergerechnet, standardmäßig
        Weiß."""

[[faq]]
q = "Mein Logo ist ein breiter Schriftzug. Was passiert damit?"
a = """
        Irgendetwas muss passieren, denn ein Symbol ist quadratisch. Auffüllen
        behält das Ganze und macht es klein &mdash; ein in ein 16-Pixel-Quadrat
        aufgefüllter Schriftzug ist etwa drei Pixel hoch und unlesbar. Auf die
        Mitte zuschneiden funktioniert meist besser: Nehmen Sie das Zeichen aus
        der Wort-Bild-Marke heraus und benutzen Sie das, so wie es fast jede
        Marke für ihr Favicon tut. Die Vorschau zeigt Ihnen, was überlebt, bevor
        Sie irgendetwas herunterladen."""

[[faq]]
q = "Was ist im Website-Satz, und brauche ich das alles?"
a = """
        Sieben PNGs, ein Web-App-Manifest, eine browserconfig.xml und ein
        HTML-Block zum Einfügen. Sie brauchen sie, weil eine .ico Browser und
        Windows abdeckt und sonst nichts: Ein iPhone-Startbildschirm liest ein
        180-Pixel-PNG unter einem eigenen Namen, Android und jede
        Installationsaufforderung lesen das Manifest, und eine ans Startmenü
        geheftete Kachel liest die XML. Keines davon sieht in eine .ico hinein.
        Alles wird hier erzeugt, auf Ihrem Gerät, und im ZIP liegt eine Notiz,
        die sagt, wofür jede Datei da ist."""

[[faq]]
q = "Kann es auch ein macOS-Symbol erzeugen?"
a = """
        Ja &mdash; setzen Sie das Häkchen bei <em>macOS-Symbol</em>, und Sie
        bekommen eine <code>.icns</code> neben der <code>.ico</code>, oder statt
        ihrer. Es ist ein anderer Container für dieselbe Idee, und keines der
        beiden Systeme liest den des anderen: Windows will .ico, ein
        Mac-Anwendungspaket will .icns. Die Größen sind dort keine Wahl, denn
        Apple veröffentlicht genau zehn Plätze &mdash; 16, 32, 64, 128, 256, 512
        und 1024 Pixel, drei davon zweimal, als Retina-Fassung der Größe
        darunter. Alle zehn kommen hinein, gezeichnet aus sieben Renderings, und
        deshalb ist eine .icns die größere Datei."""

[[faq]]
q = "Wie benutze ich die .icns-Datei?"
a = """
        Für eine Anwendung gehört sie im Paket nach
        <code>IhreApp.app/Contents/Resources/</code> und wird in
        <code>Info.plist</code> unter <code>CFBundleIconFile</code> benannt;
        jedes Mac-Paketierwerkzeug hat ein Feld dafür. Für alles andere: Datei im
        Finder auswählen, Command-C drücken, dann &bdquo;Informationen&ldquo; für
        den Ordner oder das Festplattenabbild öffnen, das Sie ändern wollen, oben
        links auf das kleine Symbol klicken und Command-V drücken."""

[[faq]]
q = "Ist die .icns dasselbe wie das, was iconutil erzeugt?"
a = """
        Dieselben zehn Plätze mit denselben Vier-Buchstaben-Typen und PNG in
        jedem, und genau das erzeugt <code>iconutil</code> aus einem
        <code>.iconset</code>-Ordner. Ein bewusster Unterschied: Apples Werkzeug
        schreibt zusätzlich ein <code>TOC&nbsp;</code>-Element, einen Index der
        folgenden Typen und Längen. Das ist eine Optimierung und kein Teil des
        Formats &mdash; ein Leser ohne Index läuft die Elemente von vorn bis
        hinten ab und kommt zum selben Ergebnis &mdash;, und ein falscher Index
        ist schlimmer als gar keiner, also bleibt er weg."""

[[faq]]
q = "Kann ich mehrere Bilder auf einmal umwandeln?"
a = """
        Ja. Jedes Bild auf der Liste wird zu seiner eigenen .ico mit denselben
        Einstellungen, und der Stapel kommt als ein ZIP mit einem Ordner je Bild
        herunter &mdash; sonst hießen zwei davon beide favicon.ico und eines
        überschriebe das andere. Jede Ausgabe, bei der Sie das Häkchen gesetzt
        haben, wird für jedes Bild erzeugt. Klicken Sie eine beliebige Zeile an,
        um jenes Bild in die Vorschau zu holen."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Es gibt auch keine Grenze für Anzahl
        oder Größe der Dateien, weil es keinen Server gibt, der dafür zahlt
        &mdash; die Arbeit passiert auf Ihrem eigenen Gerät. Die Seite trägt
        Werbung, und die bezahlt sie; den Anzeigen wird nichts über Ihre Bilder
        übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird: Ein Werkzeug, das Ihr Logo zum Umwandeln
        wegschickt, würde in dem Moment stehen bleiben, in dem Sie den Stecker
        ziehen."""

