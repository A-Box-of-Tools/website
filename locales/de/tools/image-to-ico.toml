[[privacy]]
title = "Ihr Logo hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Skaliert wird mit
      einem <code>drawImage</code> auf ein Canvas, und jedes Symbol ist ein
      Header, den <code>src/ico.js</code> oder <code>src/icns.js</code> auf
      dieser Seite vor diese Pixel schreibt."""

[[privacy]]
title = "Die Datei wird aus ihren eigenen Bytes beschrieben."
body = """
 Die Liste der Größen
      neben einem fertigen Symbol ist nicht die Liste der Größen, die Sie
      verlangt haben. Sie wird aus der eben geschriebenen Datei zurückgelesen,
      von <code>readIcoDirectory</code> beziehungsweise
      <code>readIcnsElements</code>. Wäre ein Schreiber je anderer Meinung als
      die Einstellungen, sagte die Seite das, statt Sie es erfahren zu lassen,
      wenn Windows nichts zeichnet und macOS ein leeres Blatt Papier zeigt."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihr Bild übergeben. Jede Zeile, die eine
      Datei liest, skaliert oder schreibt, kommt von dieser Domain selbst und
      steht im Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil darin nie ein Schritt über das Netz
      vorgesehen war. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie das Bild aus."
body = """
 Ziehen Sie ein PNG, JPEG, WebP oder SVG
      auf das Auswahlfeld, oder nehmen Sie gleich mehrere und wandeln Sie sie in
      einem Durchgang um. Am einfachsten ist ein quadratisches Bild, und alles ab
      256 Pixeln hat genug Detail für jede Größe. Der Browser liest es direkt von
      Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Wählen Sie die Dateien, die Sie brauchen."
body = """
 Windows und ein Browser lesen
      <code>.ico</code>, ein Mac liest <code>.icns</code> und sieht die andere
      gar nicht erst an. Setzen Sie das Häkchen bei einem von beiden, oder bei
      beiden, wenn das, was Sie bauen, auf beiden Systemen ausgeliefert wird.
      Eine Website will außerdem die zusätzlichen Apple-, Android- und
      Kachelbilder, und dafür gibt es das dritte Kästchen."""

[[howto]]
title = "Sagen Sie, wofür das Symbol ist."
body = """
 Ein Website-Favicon sind 16, 32 und
      48 Pixel. Eine Windows-Anwendung will zusätzlich 256, und eine Anwendung,
      die auf einem hochauflösenden Notebook gut aussehen muss, will die
      Zwischengrößen, die Windows bei 125&nbsp;% und 150&nbsp;% Skalierung
      verlangt. Wählen Sie das Passende, oder setzen Sie die Häkchen selbst. Jede
      Größe auf der Liste sagt Ihnen, wer sie verlangt. Bei der
      <code>.icns</code> haben Sie diese Wahl nicht, denn Apple benennt genau
      zehn Plätze, und alle zehn kommen hinein."""

[[howto]]
title = "Kümmern Sie sich um Form und Hintergrund."
body = """
 Ein Symbol ist quadratisch,
      und die meisten Logos sind es nicht. Füllen Sie auf, bleibt das ganze Bild
      erhalten, mit Platz darüber und darunter. Schneiden Sie zu, wird die Mitte
      genommen. Dehnen Sie, wird es gestaucht. Transparenz bleibt Transparenz,
      solange Sie keine Farbe wählen, die dahinter sitzt."""

[[howto]]
title = "Sehen Sie sich das mit 16 Pixeln an, bevor Sie herunterladen."
body = """
 In dieser Größe
      wird das Symbol am häufigsten zu sehen sein, und dort verschwinden dünne
      Striche und kleine Schrift. Jedes Quadrat in der Vorschau wird in seiner
      echten Größe aus Ihrer eigenen Datei gezeichnet. Ist das kleinste ein
      Fleck, hilft eine einfachere Zeichnung und keine andere Einstellung."""

[[howto]]
title = "Nehmen Sie die Dateien."
body = """
 Eine .ico mit jeder Größe darin, benannt
      als <code>favicon.ico</code>, wenn Sie das verlangt haben, denn unter
      dieser Adresse suchen Browser danach. Eine .icns daneben, wenn Sie das
      Häkchen gesetzt haben, bereit für ein Mac-Anwendungspaket. Setzen Sie auch
      das Häkchen für den Website-Satz, kommen die Apple-, Android- und
      Windows-Kachelbilder dazu, dazu das Manifest und der HTML-Block zum
      Einfügen in Ihre Seite. Alles, was über eine einzelne Datei hinausgeht,
      kommt als ZIP herunter."""

[[faq]]
q = "Wird mein Bild irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser dekodiert und skaliert das Bild auf Ihrer
        eigenen Hardware, und die .ico setzt Code aus diesen Pixeln zusammen, den
        diese Seite selbst ausliefert. Netzfunktionen hat dieses Werkzeug keine,
        es ruft nie etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "Welche Größen sollte eine favicon.ico enthalten?"
a = """
        16, 32 und 48. Das ist keine Geschmacksfrage. 16 zeichnet ein Browser im
        Tab, 32 nutzt Windows für eine Desktop-Verknüpfung und nutzen mehrere
        Browser für ein Lesezeichen, und in 48 liest Google ein Seitensymbol.
        Alles Größere gehört als PNG neben die .ico statt hinein, und genau das
        erzeugt hier der Website-Satz."""

[[faq]]
q = "Welche Größen braucht ein Windows-Anwendungssymbol?"
a = """
        16, 32, 48 und 256, denn das enthält die Standard-app.ico von Visual
        Studio selbst. 16 ist die Titelleiste und die kleine Explorer-Ansicht, 32
        der Desktop und die Taskleiste, 48 die mittleren Symbole des Explorers
        und 256 das Startmenü und die extragroße Ansicht. Auf einem
        hochauflösenden Bildschirm verlangt Windows außerdem 20, 24, 40, 64 und
        96 und rechnet sie aus der nächstgelegenen vorhandenen Größe hoch, wenn
        sie fehlen. Die Voreinstellung &bdquo;jede Skalierung&ldquo; legt sie
        gleich mit hinein."""

[[faq]]
q = "Warum ist die Datei größer als das Bild, mit dem ich angefangen habe?"
a = """
        Weil eine .ico nicht ein Bild ist, sondern mehrere, und weil die kleinen
        unkomprimiert gespeichert werden, damit alles sie lesen kann. Ein
        32&times;32-Eintrag ist exakt 4.264 Byte groß, was auch so darin steht,
        und ein unkomprimierter 256&times;256-Eintrag bringt es auf 264&nbsp;KB.
        Deshalb werden Größen über 64 standardmäßig als PNG gespeichert. &bdquo;PNG
        für jede Größe&ldquo; ergibt die kleinstmögliche Datei, unkomprimiert für
        jede Größe die verträglichste."""

[[faq]]
q = "Was ist der Unterschied zwischen PNG- und unkomprimierten Einträgen?"
a = """
        Nur, wie die Pixel in der .ico gespeichert werden. Ein unkomprimierter
        Eintrag ist die ursprüngliche Windows-Anordnung, also ein Bitmap-Header,
        die Pixel auf dem Kopf und eine Ein-Bit-Transparenzmaske, und lesen kann
        ihn jede je erschienene Windows-Version. Ein PNG-Eintrag ist eine ganze
        PNG-Datei, im Symbol verstaut. Bei den großen Größen ist er drei- bis
        zehnmal kleiner, verstanden wird er allerdings erst ab Windows Vista. Die
        Voreinstellung nimmt jeweils das, was gewinnt: unkomprimiert bis 64
        Pixel, darüber PNG."""

[[faq]]
q = "Kann es ein Symbol größer als 256 Pixel erzeugen?"
a = """
        Nein, und das kann nichts. Das Format speichert jede Seitenlänge in einem
        einzigen Byte, und die 0 ist bereits vergeben, sie bedeutet 256. Damit
        ist die Obergrenze erreicht, und eine .ico mit einem 512-Pixel-Bild darin
        ist kein größeres Symbol, sondern ein kaputtes. Brauchen Sie 512,
        brauchen Sie ein PNG, und genau das steckt im Website-Satz, für Android
        und für den Startbildschirm einer Web-App."""

[[faq]]
q = "Bleibt die Transparenz erhalten?"
a = """
        Ja, in beiden Eintragsarten. Zusätzlich wird die alte Ein-Bit-Maske neben
        den Alphakanal geschrieben, damit Software, die zu alt ist, das Alpha zu
        lesen, das Symbol trotzdem freistellt, statt einen schwarzen Kasten zu
        zeichnen. Absichtlich undurchsichtig gemacht wird genau eine Datei,
        nämlich das Apple-Touch-Symbol im Website-Satz. iOS legt es auf seine
        eigene Kachel und macht aus Transparenz Schwarz, also wird es vorher auf
        Ihre Hintergrundfarbe heruntergerechnet, standardmäßig auf Weiß."""

[[faq]]
q = "Mein Logo ist ein breiter Schriftzug. Was passiert damit?"
a = """
        Irgendetwas muss passieren, denn ein Symbol ist quadratisch. Auffüllen
        behält das Ganze und macht es klein, und ein in ein 16-Pixel-Quadrat
        aufgefüllter Schriftzug ist etwa drei Pixel hoch und damit unlesbar.
        Meist funktioniert es besser, auf die Mitte zuzuschneiden. Nehmen Sie das
        Zeichen aus der Wort-Bild-Marke heraus und benutzen Sie nur das, so wie
        es fast jede Marke für ihr Favicon tut. Was davon überlebt, zeigt Ihnen
        die Vorschau, bevor Sie irgendetwas herunterladen."""

[[faq]]
q = "Was ist im Website-Satz, und brauche ich das alles?"
a = """
        Sieben PNGs, ein Web-App-Manifest, eine browserconfig.xml und ein
        HTML-Block zum Einfügen. Brauchen tun Sie das, weil eine .ico Browser und
        Windows abdeckt und sonst nichts. Ein iPhone-Startbildschirm liest ein
        180-Pixel-PNG unter einem eigenen Namen, Android und jede
        Installationsaufforderung lesen das Manifest, und eine ans Startmenü
        geheftete Kachel liest die XML. In eine .ico sieht keines davon hinein.
        Erzeugt wird alles hier, auf Ihrem Gerät, und im ZIP liegt eine Notiz,
        die sagt, wofür jede Datei da ist."""

[[faq]]
q = "Kann es auch ein macOS-Symbol erzeugen?"
a = """
        Ja. Setzen Sie das Häkchen bei <em>macOS-Symbol</em>, und Sie bekommen
        eine <code>.icns</code> neben der <code>.ico</code> oder auch an ihrer
        Stelle. Es ist ein anderer Container für dieselbe Idee, und keines der
        beiden Systeme liest den des anderen: Windows will .ico, ein
        Mac-Anwendungspaket will .icns. Die Größen sind dort keine Wahl, denn
        Apple veröffentlicht genau zehn Plätze, nämlich 16, 32, 64, 128, 256, 512
        und 1024 Pixel, drei davon zweimal als Retina-Fassung der Größe darunter.
        Alle zehn kommen hinein, gezeichnet aus sieben Renderings, und deshalb
        ist eine .icns die größere Datei."""

[[faq]]
q = "Wie benutze ich die .icns-Datei?"
a = """
        Für eine Anwendung gehört sie im Paket nach
        <code>IhreApp.app/Contents/Resources/</code> und wird in
        <code>Info.plist</code> unter <code>CFBundleIconFile</code> benannt.
        Jedes Mac-Paketierwerkzeug hat ein Feld dafür. Für alles andere wählen
        Sie die Datei im Finder aus, drücken Command-C, öffnen dann
        &bdquo;Informationen&ldquo; für den Ordner oder das Festplattenabbild,
        das Sie ändern wollen, klicken oben links auf das kleine Symbol und
        drücken Command-V."""

[[faq]]
q = "Ist die .icns dasselbe wie das, was iconutil erzeugt?"
a = """
        Es sind dieselben zehn Plätze mit denselben Vier-Buchstaben-Typen und PNG
        in jedem, und genau das erzeugt <code>iconutil</code> aus einem
        <code>.iconset</code>-Ordner. Einen Unterschied gibt es mit Absicht.
        Apples Werkzeug schreibt zusätzlich ein <code>TOC&nbsp;</code>-Element,
        einen Index der folgenden Typen und Längen. Das ist eine Optimierung und
        kein Teil des Formats, denn ein Leser ohne Index läuft die Elemente von
        vorn bis hinten ab und kommt zum selben Ergebnis. Ein falscher Index wäre
        schlimmer als gar keiner, also bleibt er weg."""

[[faq]]
q = "Kann ich mehrere Bilder auf einmal umwandeln?"
a = """
        Ja. Jedes Bild auf der Liste wird mit denselben Einstellungen zu seiner
        eigenen .ico, und der Stapel kommt als ein ZIP mit einem Ordner je Bild
        herunter. Sonst hießen zwei davon beide favicon.ico, und eines
        überschriebe das andere. Jede Ausgabe, bei der Sie das Häkchen gesetzt
        haben, wird für jedes Bild erzeugt. Klicken Sie eine beliebige Zeile an,
        um jenes Bild in die Vorschau zu holen."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Auch bei Anzahl und Größe der Dateien
        gibt es keine Grenze, denn es zahlt kein Server dafür. Die Arbeit
        passiert auf Ihrem eigenen Gerät. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihr Logo zum Umwandeln
        wegschickt, bliebe in dem Moment stehen, in dem Sie den Stecker
        ziehen."""

