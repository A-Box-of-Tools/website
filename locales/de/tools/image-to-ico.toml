name = "Bild zu ICO"
heading = "Bild&nbsp;zu&nbsp;ICO <span class=\"h1-kw\">&mdash; Favicon, Windows- und macOS-Symbol erstellen</span>"
tagline = "Ein Bild hinein. Jede Größe, die ein Browser, Windows oder ein Mac verlangt, heraus."

title = "Bild zu ICO &mdash; Favicon, App-Symbol oder ICNS, ohne Upload"
description = "Ein PNG, JPEG oder SVG im Browser in eine echte .ico mit mehreren Größen oder eine macOS-.icns umwandeln. Favicon, Windows-App-Symbol, Mac-App-Symbol, dazu die Apple- und Android-Dateien, die eine Website braucht. Nichts wird hochgeladen."
og_title = "Eine .ico oder .icns mit allen Größen darin erstellen, ohne etwas hochzuladen"
og_description = "Eine favicon.ico für eine Website, eine app.ico für ein Windows-Programm, eine .icns für einen Mac, jeweils mit einer Vorschau bei 16 Pixeln vor dem Download. Alles läuft auf Ihrem eigenen Gerät."
og_image_alt = "Bild zu ICO - Favicon, Windows- und macOS-Symbol erstellen, ohne Upload"

pledge = """
    Das Skalieren und die Symboldateien selbst entstehen beide in Ihrem eigenen
    Browser. Gezeichnet wird das Bild auf dem Canvas, das Ihr Browser ohnehin
    mitbringt, und jeden Container setzen aus diesen Pixeln ein paar hundert
    Zeilen in <code>src/ico.js</code> und <code>src/icns.js</code> zusammen, die
    Sie lesen können, die Windows-<code>.ico</code> ebenso wie die
    macOS-<code>.icns</code>. Netzfunktionen hat dieses Werkzeug keine, weder zum
    Abrufen noch zum Senden. Und selbst wenn es einen Weg nach draußen gäbe,
    stünde am anderen Ende dieser Seite kein Server, an den ein Logo gehen
    könnte."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und erstellen Sie ein Symbol. Keine einzige
      Anfrage trägt ein Bild, ein Vorschaubild, einen Dateinamen oder ein Byte
      dessen, was Sie ausgewählt haben. Oder trennen Sie die Internetverbindung
      und erstellen Sie trotzdem eines."""

read_first = """
, <code>src/ico.js</code> und
      <code>src/icns.js</code> für die beiden Symbolformate, also das
      Verzeichnis, die Einträge und die Maske im einen und Apples zehn benannte
      Plätze im anderen, sowie <code>src/sizes.js</code> dafür, woher jede Größe
      auf der Seite kommt."""

howto_heading = "So erstellen Sie eine .ico-Datei, ohne etwas hochzuladen"

card = """
            Ein Favicon, ein Windows-App-Symbol oder eine macOS-.icns, jede
            Größe in einer Datei, mit einer Vorschau bei 16 Pixeln vor dem
            Download."""

