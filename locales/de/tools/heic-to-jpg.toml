[[privacy]]
title = "Ihre Fotos haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Der Decoder kam von hier, und er geht nirgendwohin."
body = """
 HEIC ist HEVC
      in einem Box-Format, und außer Safari dekodiert es kein Browser. Deshalb
      liefert diese Seite <code>libheif</code> mit aus, nach WebAssembly
      kompiliert: rund 1,4 MB, in dieses Repository eingecheckt, von dieser
      Domain ausgeliefert und vom Service Worker zwischengespeichert wie jede
      andere Datei hier. Von einem CDN wird nichts geholt, denn das setzte einen
      Dritten in den Weg jedes Besuchs und nähme dem Werkzeug die
      Offline-Fähigkeit. Dass die Binärdatei im Skript steckt statt daneben, hat
      genau einen Grund: So braucht es zum Starten keinen einzigen Abruf."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> in irgendeiner Datei, die für dieses Werkzeug
      geschrieben wurde. Die mitgelieferte Engine enthält, wie jeder
      Emscripten-Build, die Ladepfade, die eine <code>.wasm</code> von einer URL
      holen würden. Genommen wird keiner davon, weil die Binärdatei schon zur
      Hand ist. Und würde doch einer genommen, nennt <code>connect-src</code>
      Googles Messendpunkte und sonst nichts, der Browser wiese ihn also ab. Die
      Richtlinie ist der Beweis, nicht das Versprechen."""

[[privacy]]
title = "Die Metadaten werden hier gelesen und Ihnen gezeigt."
body = """
 Die Liste auf der
      Seite sagt, was jedes Foto mit sich trägt, also das Datum, die Kamera und
      ob GPS-Koordinaten darin stehen. Das wollen Sie vielleicht wissen, bevor
      Sie das JPEG jemandem geben. Gelesen wird es von <code>src/boxes.js</code>
      in diesem Browser aus der Datei, auf dieser Seite angezeigt und in Ihr JPEG
      geschrieben oder weggelassen, ganz wie Sie es wählen. In diesem Repository
      gibt es kein eigenes Analytics-Ereignis, das einen Dateinamen, ein Datum,
      eine Koordinate oder eine Anzahl mitführt."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihre Fotos übergeben. Jede Zeile, die
      eine Datei liest, dekodiert oder schreibt, kommt von dieser Domain selbst
      und steht im Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Laden Sie die Seite einmal und trennen Sie die
      Netzverbindung, und das Werkzeug bleibt unverändert, denn der Decoder liegt
      mit ihr im Zwischenspeicher. Das ist der einfachste Beweis von allen und
      hier ein stärkerer als irgendwo sonst auf dieser Seite: Ein Umwandler, der
      Ihre Fotos zum Dekodieren wegschickte, brächte das unmöglich fertig."""

[[howto]]
title = "Wählen Sie Ihre HEIC-Fotos aus."
body = """
 Ziehen Sie sie auf das Auswahlfeld
      oder suchen Sie sie von Hand heraus, direkt aus einem Telefon-Backup oder
      einem Ordner auf dem Schreibtisch. Der Browser liest sie von Ihrer
      Festplatte, und dabei geht nichts nach draußen. Die Liste sagt Ihnen, was
      jedes davon ist und was darin steckt."""

[[howto]]
title = "Sehen Sie nach, was die Fotos mit sich tragen."
body = """
 Jede Zeile nennt das
      Aufnahmedatum, die Kamera und, in Grün, weil das der bemerkenswerte Teil
      ist, ob die Datei GPS-Koordinaten enthält. Gelesen wird das aus dem
      Container, ohne das Bild zu dekodieren, es kostet also nichts und erscheint
      sofort."""

[[howto]]
title = "Wählen Sie ein Format und entscheiden Sie über die Details."
body = """
 Nehmen Sie JPEG,
      solange Sie keinen Grund für etwas anderes haben, denn es ist das Format,
      das überall aufgeht, und genau darum geht es beim Umwandeln. Der
      Qualitätsregler steht auf 92, also dort, wo eine Fotografie vom Original
      kaum zu unterscheiden ist. Das Häkchen entscheidet, ob Datum, Kamera und
      Ort mitkommen."""

[[howto]]
title = "Klicken Sie auf &bdquo;Umwandeln&ldquo; und laden Sie herunter."
body = """
 Bei der ersten
      Umwandlung trifft der Decoder ein, rund 1,4 MB und nur dieses eine Mal.
      Jedes Foto danach wird auf Ihrem eigenen Gerät dekodiert und geschrieben.
      Bei einer Datei bekommen Sie eine Download-Schaltfläche, bei mehreren
      zusätzlich ein ZIP."""

[[faq]]
q = "Wird mein Foto irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, dekodiert und schreibt die Datei auf
        Ihrer eigenen Hardware. Netzfunktionen hat dieses Werkzeug keine, es ruft
        nie etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns. Das eine, was
        tatsächlich lädt, ist der Decoder selbst, und der kommt von dieser Seite,
        einmal, bevor Ihr Foto überhaupt beteiligt ist."""

[[faq]]
q = "Warum lädt diese Seite beim ersten Mal 1,4 MB herunter?"
a = """
        Weil HEIC das eine Bildformat ist, das ein Browser nicht öffnet. Es ist
        ein HEVC-Einzelbild in einem Box-Container, und nur Safari hat auf
        Apple-Hardware einen Decoder dafür. Chrome, Firefox und Edge weisen die
        Datei schlicht ab. Ein HEIC-Umwandler braucht seinen Decoder also
        irgendwoher, und dafür kommen zwei Orte in Frage: ein Server oder die
        Seite. Alle anderen Umwandler haben den Server gewählt, und deshalb
        brauchen sie Ihre Fotos hochgeladen. Dieser trägt stattdessen
        <code>libheif</code> mit sich, nach WebAssembly kompiliert. Es kommt von
        dieser Seite, liegt nach dem ersten Besuch im Zwischenspeicher, und es
        ist der ganze Preis dafür, dass Ihre Fotos nirgendwohin gehen."""

[[faq]]
q = "Behält das JPEG Datum, Kamera und Ort?"
a = """
        Wenn Sie wollen, es ist ein Häkchen auf der Seite. Bleibt es gesetzt,
        wird der EXIF-Block aus dem HEIC herauskopiert und genau so ins JPEG
        geschrieben, wie das Telefon ihn geschrieben hat. Das umgewandelte Foto
        sortiert sich damit weiter nach dem Aufnahmetag statt nach dem Tag der
        Umwandlung, und genau darüber wird bei HEIC-Umwandlern am häufigsten
        geklagt. Geändert wird genau ein Tag, nämlich die Orientierung, die auf
        &bdquo;aufrecht&ldquo; gesetzt wird. Die Drehung steckt bereits in den
        Pixeln, und ein Betrachter, der sie noch einmal anwendete, legte jedes
        Hochformatfoto auf die Seite. Nehmen Sie das Häkchen heraus, kommt das
        JPEG mit dem Bild und sonst nichts heraus."""

[[faq]]
q = "Entfernt es GPS-Koordinaten?"
a = """
        Es sagt Ihnen, dass sie da sind, und tut dann, worum Sie bitten. Schon
        bevor irgendetwas umgewandelt wird, verrät die Zeile zu jedem Foto, ob
        die Datei Koordinaten trägt, und das ist mehr, als das Telefon tut.
        Nehmen Sie das Häkchen bei &bdquo;Datum, Kamera und Einstellungen
        behalten&ldquo; heraus, bleiben sie samt allem anderen aus dem JPEG,
        lassen Sie es gesetzt, kommen sie mit. Wollen Sie die Tags im Detail
        durchsehen oder sie aus Fotos entfernen, die schon JPEGs sind, ist der
        <a href="../exif-daten-entfernen/">EXIF-Betrachter &amp; -Entferner</a>
        das Werkzeug dafür, und der schafft es sogar, ohne das Bild neu zu
        komprimieren."""

[[faq]]
q = "Wird das Bild neu komprimiert?"
a = """
        Ja, und das muss es auch. HEIC und JPEG sind verschiedene Codecs, es gibt
        also keinen Weg vom einen zum anderen, ohne das Bild zu dekodieren und
        erneut zu kodieren. Was das kostet, steuern Sie selbst. Der
        Qualitätsregler steht standardmäßig auf 92, wo eine Fotografie vom
        Original sehr schwer zu unterscheiden ist, und PNG steht für den Fall im
        Menü, dass Sie überhaupt keinen Verlust wollen und Ihnen eine fünf- bis
        zehnmal so große Datei nichts ausmacht."""

[[faq]]
q = "Was, wenn die Datei .jpg heißt, aber in Wahrheit ein HEIC ist?"
a = """
        Dann geht es trotzdem. Jede hier abgelegte Datei wird an ihren ersten
        Bytes erkannt und nicht an ihrem Namen, denn der Name ist bloß das, wofür
        sich die zuletzt beteiligte App entschieden hat. Ein HEIC, das als
        &bdquo;.jpg&ldquo; ankam, ist ohnehin einer der häufigsten Gründe, warum
        Menschen nach einem Werkzeug wie diesem suchen. Eine Datei, die wirklich
        ein JPEG oder ein PNG ist, wird mit einer entsprechenden Meldung
        abgelehnt, statt in eine Kopie ihrer selbst umgewandelt zu werden."""

[[faq]]
q = "Kann es ein Live Photo oder eine Serienaufnahme umwandeln?"
a = """
        Die Standbilder darin, ja. Ein HEIC kann mehr als ein Bild halten, und
        jedes davon wird umgewandelt und nach dem Original mit einer angehängten
        Nummer benannt. Die Videohälfte eines Live Photos ist eine eigene Datei,
        die das Telefon neben dem HEIC aufbewahrt, sie liegt hier also gar nicht
        zum Umwandeln vor. Tiefenkarten und Vorschaubilder stecken zwar im
        Container, sind aber keine Bilder, um die jemand gebeten hätte, und
        bleiben unangetastet."""

[[faq]]
q = "Warum nimmt es mein AVIF nicht?"
a = """
        Weil es damit nichts zu tun gäbe. AVIF ist derselbe Container wie HEIC,
        nur mit AV1 statt HEVC darin, und jeder aktuelle Browser dekodiert eines
        von Haus aus. Ein Umwandler lieferte also ein Megabyte Engine aus, um ein
        Problem zu lösen, das Sie gar nicht haben. Brauchen Sie ein AVIF als
        JPEG, lesen der <a href="../bild-komprimieren/">Bildkompressor</a> und
        der <a href="../bildgroesse-aendern/">Bildskalierer</a> beide AVIF und
        schreiben JPEG, und zwar mit dem Decoder, den Ihr Browser ohnehin hat."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Auch bei Anzahl und Größe der Dateien
        gibt es keine Grenze, denn es zahlt kein Server dafür. Die Arbeit
        passiert auf Ihrem eigenen Gerät. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Fotos übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja, Decoder inklusive. Laden Sie die Seite einmal, trennen Sie dann die
        Internetverbindung, und sie arbeitet an Ihren Fotos genau wie vorher
        weiter. Das ist zugleich der stärkste Beweis, der sich dafür führen
        lässt, dass nichts hochgeladen wird. Ein Umwandler, der Ihre HEICs zum
        Dekodieren wegschickte, bliebe in dem Moment stehen, in dem Sie den
        Stecker ziehen. Dieser bleibt es nicht."""

