title = "HEIC-zu-JPG-Umwandler &mdash; kostenlos, ohne Upload"
description = "HEIC-Fotos vom iPhone im Browser in JPG umwandeln. Der Decoder läuft auf Ihrem eigenen Gerät: nichts wird hochgeladen, kein Konto, auch offline, und Datum und Kameradaten dürfen mitkommen."
og_title = "HEIC-Fotos zu JPGs machen, ohne sie hochzuladen"
og_description = "Der Umwandler, der Ihre Fotos gar nicht haben will. Der HEIC-Decoder kommt von dieser Seite und läuft auf Ihrem eigenen Gerät, die Bilder verlassen es also nie."
og_image_alt = "HEIC zu JPG - iPhone-Fotos in einem Format, das jedes Programm öffnet"

pledge = """
    Das Dekodieren läuft in Ihrem eigenen Browser, auf Ihrer eigenen Hardware.
    HEIC ist das eine Bildformat, das ein Browser nicht von sich aus öffnet,
    also trägt diese Seite den Decoder mit sich: rund 1,4 MB, von hier
    ausgeliefert und nach dem ersten Besuch im Zwischenspeicher. Genau daran
    liegt es, dass jeder andere HEIC-Umwandler Sie zum Hochladen auffordert. Wer
    den Codec auf einen Server legt, muss Ihre Fotos zu ihm holen. Dieser hier
    legt den Codec stattdessen hierher. Eine Netzfunktion gibt es auf dieser
    Seite überhaupt nicht, und am anderen Ende stünde auch kein Server, an den
    ein Foto gehen könnte."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und wandeln Sie ein Foto um. Sie sehen die
      eigenen Dateien dieser Seite laden, den Decoder darunter, und keine
      einzige Anfrage, die ein Foto, ein Vorschaubild, einen Dateinamen oder ein
      Byte Ihrer Auswahl trägt. Oder laden Sie die Seite einmal, trennen Sie die
      Internetverbindung und wandeln Sie trotzdem einen ganzen Ordner um."""

read_first = """
, <code>src/heif.js</code> dafür, wie der
      Decoder geladen wird und was er darf, <code>src/boxes.js</code> für das
      Zerlegen des Containers, das die Metadaten des Fotos findet, und
      <code>src/exif.js</code> dafür, was mit diesen Metadaten auf dem Weg in ein
      JPEG geschieht. Die Engine selbst ist <code>vendor/libheif.js</code>,
      unverändert, mit ihrer Lizenz daneben."""

howto_heading = "So wandeln Sie HEIC-Fotos in JPG um"

card = """
            Die Fotos, die ein iPhone macht, in einem Format, das jedes Programm
            öffnet. Dekodiert wird auf Ihrem eigenen Gerät und nicht auf dem
            Server von irgendwem."""

