#
# Vergrößerungsrechner - German.
#
# Overrides for tools/magnification-calculator/tool.toml. Only words: the slug,
# the category, the icon and the list of shared parts stay where they are.
#
# What is printed on an instrument is carried over as printed - 8×42, 40×/0.65,
# 10×/18, 675× - and every other figure by value, with the German decimal comma.
#
# "Useful" is "sinnvoll" throughout. The optics textbooks' word is "förderliche
# Vergrößerung", which a reader who has never opened one would not recognise;
# the question as it is usually asked is "höchste sinnvolle Vergrößerung", so
# that is the word the page answers in.
#
# The "width" of a lens or a mirror is its "Durchmesser", the word a German
# listing prints, and a beam is measured in the same word. "Breite" is kept for
# what has no diameter: a field of view and a strip of specimen.
#

