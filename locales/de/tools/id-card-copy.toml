#
# Ausweiskopie - German.
#
# Overrides for tools/id-card-copy/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "Scheckkartenformat" ist das deutsche Wort für ID-1 und das, was auf einer
# deutschen Kopiervorlage steht; die Normnamen ID-1, ID-2 und ID-3 bleiben
# daneben stehen, weil sie auf den Karten selbst und in jeder Norm so heißen.
# Die Namen der Druckeinstellungen, "Tatsächliche Größe" und "An Seite
# anpassen", sind die, die deutsche Druckdialoge zeigen.
# Das Beispiel für den Vermerk ist eine deutsche Wohnungsbewerbung, weil die
# englische Mietadresse hier niemandem etwas sagt.
#

name = "Ausweiskopie"
heading = "Ausweis&shy;kopie <span class=\"h1-kw\">&mdash; Vorder- und Rückseite auf einem Blatt</span>"
tagline = "Beide Seiten der Karte auf einem Blatt, in Originalgröße."

title = "Ausweiskopie &mdash; Vorder- und Rückseite auf einem Blatt, Originalgröße, ohne Upload"
description = "Kopieren Sie Vorder- und Rückseite eines Personalausweises oder Führerscheins in Originalgröße auf ein Blatt A4 oder Letter oder in ein einziges Bild. Die Karte wird in Ihrem Browser gefunden, geradegerückt und zugeschnitten; hochgeladen wird nichts."
og_title = "Beide Seiten eines Ausweises auf ein Blatt kopieren, ohne ihn hochzuladen"
og_description = "Zwei Handyfotos hinein, ein Blatt heraus, mit Vorder- und Rückseite in genau der Größe der Karte, fertig zum Drucken. Die Karte wird in Ihrem eigenen Browser gefunden und geradegerückt, denn ein Ausweis ist das Letzte, was man hochladen sollte."
og_image_alt = "Ausweiskopie - Vorder- und Rückseite einer Karte auf einem Blatt in Originalgröße, ohne Upload"

pledge = """
    Beide Fotos werden von Ihrem eigenen Browser dekodiert, geradegerückt,
    angeordnet und in die Kopie geschrieben, mit nichts als Rechnen und den
    Codecs, die er ohnehin mitbringt. Netzfunktionen hat dieses Werkzeug
    keine, nichts zum Abrufen, nichts zum Senden, nicht einmal eine Übergabe an
    ein anderes Werkzeug. Was es bekommt, ist ein Ausweis, und eine Kopie davon
    ist alles, was jemand braucht, um sich als Sie auszugeben."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und erstellen Sie eine Kopie. Keine einzige
      Anfrage trägt ein Foto, ein Vorschaubild, einen Dateinamen, den Text, den
      Sie eingegeben haben, oder die Position einer einzigen Ecke. Oder schalten
      Sie den Flugmodus ein und erstellen Sie trotzdem eine."""

read_first = """
, <code>src/shared/document-detect.js</code> dafür, wie die Karte ohne
      jedes Modell gefunden wird, <code>src/layout.js</code> dafür, wohin jede
      Seite auf dem Papier kommt, <code>src/card.js</code> für die Ecken und den
      Vermerk quer über die Karte und <code>src/document.js</code> für das PDF."""

howto_heading = "So kopieren Sie Vorder- und Rückseite eines Ausweises auf ein Blatt"

card = """
            Vorder- und Rückseite eines Ausweises oder Führerscheins auf einem
            Blatt in Originalgröße oder in einem Bild zum Hochladen. Aus zwei
            Handyfotos gefunden, geradegerückt und zugeschnitten."""

