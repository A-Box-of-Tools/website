[[privacy]]
title = "Die Texterkennung läuft auf Ihrem Gerät."
body = """
    Ein Foto besteht aus Pixeln statt aus Text. Um es auszulesen, braucht es
    eine Texterkennung. Diese Seite enthält Tesseract und englische Sprachdaten,
    statt das Foto an einen Server zu übergeben. Der Browser liest die
    ausgewählten Dateien im Arbeitsspeicher. Weder die Fotos noch die daraus
    erkannten Felder werden von dieser Website gespeichert. Texterkennung und
    Sprachdaten umfassen vor der Übertragungskomprimierung etwa 8 MB und werden
    mit dem Werkzeug zwischengespeichert. Versionen, Quelldateien und
    <a href="vendor/README.md">Lizenzen sind dort aufgeführt</a>."""

[[privacy]]
title = "Einen vorgeschlagenen Betrag müssen Sie dennoch prüfen."
body = """
    Eine verblasste Ziffer, Spiegelung oder Zwischensumme am unteren Rand kann
    ein überzeugendes, aber falsches Ergebnis liefern. Vergleichen Sie Händler,
    Datum, Belegnummer, Währung und Gesamtbetrag mit dem Bild, korrigieren Sie
    die Angaben und prüfen Sie, dass das ganze Dokument im Ausschnitt bleibt.
    Nur bestätigte Dokumente fließen in die Summen ein. Für E-Mail und
    Anhangdownloads müssen alle verbleibenden Dokumente bestätigt sein.
    Änderungen an einem Feld, Ausschnitt oder der Drehung erfordern eine neue
    Prüfung. Ein kopierter Bericht oder eine CSV kann noch ungeprüfte Zeilen
    enthalten, die entsprechend markiert sind. Die Bestätigung hält Ihre
    Prüfung fest; sie beweist nicht unabhängig, dass die Rechnung stimmt."""

[[privacy]]
title = "Sie steuern die Übergabe an die E-Mail-App."
body = """
    Wenn das Teilen von Dateien unterstützt wird, öffnet „E-Mail mit Bildern“
    das Teilen-Menü des Geräts mit komprimierten JPEG-Kopien und dem Bericht.
    Wählen Sie dort Ihre E-Mail-App und prüfen Sie Empfänger, Nachricht und
    Anhänge. Andernfalls laden Sie die E-Mail-Datei mit dem Bericht und allen
    JPEG-Anhängen herunter. Kompatible Apps öffnen sie als Entwurf; andere
    benötigen Weiterleiten oder Erneut senden. Die Seite selbst sendet nichts.
    Ihre E-Mail-App und Ihr Anbieter übernehmen die Zustellung mit ihren
    eigenen Einstellungen."""

[[privacy]]
title = "Versendet werden zugeschnittene, komprimierte Kopien."
body = """
    Passen Sie jeden Ausschnitt so an, dass der ganze Beleg oder die Rechnung
    erhalten bleibt. Bei eindeutigen Dokumentkanten schlägt die Seite einen
    Ausschnitt vor, andernfalls behält sie das ganze Bild. Bei einem langen
    Beleg auf farbigem Papier kann dieselbe Papierfarbe jenseits einer erkannten
    Kante dafür sorgen, dass dieses Bildende vollständig erhalten bleibt.
    So bleiben Kopf oder letzte Textzeile zusammen mit etwas zusätzlichem
    Hintergrund sichtbar. Prüfen und korrigieren Sie den Vorschlag. Die Seite
    erstellt JPEG-Kopien mit höchstens 1600 Pixeln an der längsten Seite und
    strebt etwa 350 KB pro Bild an. Prüfen Sie Vorschau und angegebene Größe vor
    dem Senden; die Zielgröße ist nicht garantiert. Ihre Originalfotos bleiben
    unverändert und werden nicht angehängt. Kann Ihre E-Mail-App die E-Mail-Datei
    nicht verwenden, laden Sie das ZIP herunter, entpacken es und hängen seine
    JPEG-Kopien und CSV selbst an."""

[[privacy]]
title = "Online-Wechselkurse sind optional."
body = """
    Mit manuellen Kursen bleibt die gesamte Vorbereitung offline. Die Auswahl
    der Online-Abfrage sendet noch keine Anfrage. Drücken Sie für das betreffende
    Dokument „Historischen Kurs abrufen“. Dabei werden nur Ausgangswährung,
    E-Mail-Währung und gewähltes Datum an api.frankfurter.dev gesendet, ohne
    Zugangsdaten oder Referrer. Frankfurter sieht Ihre IP-Adresse und die
    Anfrage. Der zurückgegebene Kurs und sein Beobachtungsdatum stehen neben dem
    Dokument und im Bericht. Diese Referenzkurse können vom Kurs der Bank oder
    Kartenabrechnung abweichen. Liefert der Dienst keinen Kurs, geben Sie einen
    manuellen ein. Die Seite verwendet niemals unbemerkt den heutigen Kurs."""

[[privacy]]
title = "Der Bericht bleibt in diesem Tab, bis Sie ihn mitnehmen."
body = """
    Es gibt kein Konto und keinen Dokumentverlauf. Lassen Sie die Seite während
    der Prüfung geöffnet und kopieren Sie den Bericht oder speichern Sie die
    CSV, bevor Sie sie verlassen. Schließen oder Neuladen verwirft den Stapel
    im Arbeitsspeicher. Ein kopierter, heruntergeladener oder an eine andere App
    übergebener Bericht bleibt dort, wo Sie ihn abgelegt haben."""

[[privacy]]
title = "Was die anderen Skripte der Seite erhalten."
body = """
    Die Skripte für Werbung, Messung und die Spenden-Schaltfläche laden wie bei
    den anderen Werkzeugen. Sie erhalten keine Fotos, OCR-Texte, Dateinamen,
    Händlernamen, Beträge oder Dokumentanzahlen. Der Code, der die Fotos ausliest
    und den Bericht erstellt, kommt von dieser Website und steht im Repository."""

[[privacy]]
title = "Auslesen funktioniert offline; die Zustellung hängt von der App ab."
body = """
    Warten Sie, bis die Offline-Anzeige bereit meldet. Trennen Sie dann die
    Verbindung und lesen Sie ein weiteres Foto aus. Zwischengespeicherte
    Texterkennung, Prüfformular, Summen, Kopieren, JPEG-Vorbereitung, manuelle
    Umrechnung und Downloads funktionieren weiterhin. Online-Kursabfragen
    benötigen eine Verbindung. Ihre E-Mail-App kann einen Entwurf offline
    speichern; zum tatsächlichen Senden braucht sie ihre übliche Verbindung."""

[[howto]]
title = "Klare Fotos wählen."
body = """
    Fügen Sie bis zu 20 JPEG-, PNG-, WebP- oder AVIF-Bilder mit jeweils höchstens
    20 MB hinzu. Verwenden Sie einen Beleg oder eine Rechnung pro Bild. Die
    Texterkennung unterstützt gedruckten englischen Text. Fotografieren Sie
    das ganze Dokument bei gleichmäßigem Licht mit aufrechtem, scharfem Text."""

[[howto]]
title = "Auslesen, zuschneiden und vergleichen."
body = """
    Starten Sie die Texterkennung und prüfen Sie jedes Foto neben den
    vorgeschlagenen Feldern und dem Rohtext. Drehen Sie seitliche Bilder und
    lesen Sie sie bei Bedarf erneut aus. Passen Sie den Ausschnitt so an, dass
    alle Dokumentkanten und Texte darin bleiben, und lesen Sie diesen Ausschnitt
    erneut aus. Korrigieren Sie Händler, Datum, Belegnummer, Währung und
    Gesamtbetrag. Händler oder Belegnummer können leer bleiben, wenn sie nicht
    zuverlässig lesbar sind. Unterscheiden Sie den Gesamtbetrag besonders von
    Zwischensumme, Rabatt, gegebenem Bargeld, Rückgeld, Steuer und Restbetrag."""

[[howto]]
title = "Jedes Dokument bestätigen."
body = """
    Prüfen Sie Felder, Ausschnitt und Umrechnung. Wählen Sie die auf dem Dokument
    gedruckte Währung und dann eine gemeinsame E-Mail-Währung für alle Dokumente.
    Geben Sie jeden Wechselkurs manuell ein oder wählen Sie die Online-Abfrage
    und drücken nach der Prüfung des Belegdatums „Historischen Kurs abrufen“.
    Die Richtung wird als eine Einheit der Dokumentwährung in der Zielwährung
    angezeigt. Bei gleicher Währung gilt Kurs 1. Nur bestätigte umgerechnete
    Beträge fließen in den Gesamtbetrag ein. Entfernen Sie doppelte Fotos,
    bevor Sie einen Beleg zweimal zählen."""

[[howto]]
title = "Bericht in Ihre App übernehmen."
body = """
    Prüfen Sie die vorbereiteten JPEG-Vorschauen und Größen. Wählen Sie über
    „E-Mail mit Bildern“ eine unterstützte E-Mail-App oder laden Sie die
    E-Mail-Datei mit Bericht und JPEG-Anhängen herunter. Prüfen und senden Sie
    die Nachricht selbst. Kann Ihre App die Datei nicht öffnen, laden und
    entpacken Sie das ZIP und hängen dessen Bilder und CSV an eine neue
    Nachricht an."""

[[faq]]
q = "Wird jeder Beleg und jede Rechnung richtig erkannt?"
a = """
    Nein. Die Texterkennung kann Ziffern verwechseln oder verblassten Druck,
    winzigen Text und ein stilisiertes Firmenlogo übersehen. Die Auswertung
    vermeidet Beschriftungen für Rabatte und gegebenes Bargeld, kann aber keine
    Beschriftung verwenden, die nicht erkannt wurde. Händler und Belegnummer
    können leer bleiben, wenn kein zuverlässiger Kandidat vorliegt. Ein fehlender
    Händlername oder eine ungeklärte Dollar- oder Yen-Währung kann eine genauere
    Erkennung des Dokumentkopfs auslösen. Diese wird separat angezeigt und
    liefert nur Händlername und Währungsvorschläge anhand der Adresse. Eine
    schwache Erkennung oder ein fehlender Betrag oder ein fehlendes Datum kann
    eine zweite Erkennung mit lokaler Kontrastanpassung auslösen, die Druck und
    Papier besser trennen soll. Beide Erkennungen des ganzen Dokuments stehen
    zum Vergleich bereit. Ungeklärte Widersprüche bei Beträgen, Datumsangaben,
    Belegnummern oder Währungen können Felder leer lassen, damit Sie sie selbst
    ausfüllen. Eine gedruckte Währung hat Vorrang vor einer Vermutung anhand der
    Adresse; ein erkanntes Beleg- oder Rechnungsdatum hat Vorrang vor dem Datum
    eines angehängten Kartenzahlungsnachweises. Das kann einen Vorschlag
    verbessern, stellt aber keine durch Unschärfe verlorenen Details wieder
    her und garantiert kein richtiges Ergebnis. Vergleichen Sie jeden Vorschlag
    mit dem Foto und bestätigen Sie jedes Dokument vor dem Export selbst.
    Dieses Werkzeug erfasst keine Einzelpositionen und beweist nicht,
    dass die Rechnungsbeträge rechnerisch stimmen."""

[[faq]]
q = "Kann ein Bild mehrere Belege enthalten?"
a = """
    Verwenden Sie einen Beleg oder eine Rechnung pro Bild. Jedes Bild wird als
    ein Dokument behandelt; eine Belegsammlung oder ein Vorlagenbogen wird nicht
    aufgeteilt. Fügen Sie für jedes Dokument ein eigenes Bild oder einen eigenen
    Ausschnitt mit sichtbaren Identifikationsangaben und dem Gesamtbetrag hinzu.
    Andernfalls kann Text verschiedener Belege in einen Vorschlag geraten."""

[[faq]]
q = "Wie werden Datumsangaben und Währungssymbole interpretiert?"
a = """
    Das Dokumentdatum bleibt wie gedruckt. Prüfen Sie es für einen Online-Kurs
    und wählen Sie es im separaten Umrechnungsdatumsfeld; ein Datum wie
    24/09/2018 wird dort nicht automatisch umgewandelt. Ein Pfundzeichen schlägt
    GBP vor. Ein einzelnes Dollarzeichen kann USD, CAD, AUD oder eine andere
    Dollarwährung bedeuten. Eine beim Gesamtbetrag gedruckte Währung hat Vorrang.
    Bleibt die Währung unklar, können ein erkanntes Land oder eine eindeutige
    Postleitzahl mit Region in der Händleradresse einen Vorschlag liefern.
    Die gedruckte Adresszeile wird daneben angezeigt. Eine Stadt allein oder
    eine Kunden-, Liefer- oder Bankadresse reichen nicht. Ungeklärte mehrdeutige
    oder widersprüchliche Hinweise lassen die Währung leer. Es findet keine
    Standortabfrage statt. Prüfen Sie jeden vorgeschlagenen Code am Dokument."""

[[faq]]
q = "Welche Dateien und Sprachen werden unterstützt?"
a = """
    JPEG-, PNG-, WebP- und AVIF-Fotos, bis zu 20 pro Stapel und 20 MB pro Datei.
    Das mitgelieferte OCR-Modell liest gedruckten englischen Text. Andere
    Schriften, Handschrift, PDFs und HEIC-Dateien werden hier nicht unterstützt.
    Wandeln Sie ein HEIC-Foto vom iPhone zunächst mit der Foto-App des Geräts
    oder dem HEIC-Konverter dieser Website in ein JPEG um."""

[[faq]]
q = "Was bedeuten die Dokumentanzahl und die Summen?"
a = """
    Jedes Foto zählt als ein Dokument. Jedes Dokument zeigt seinen Originalbetrag
    und seinen umgerechneten Betrag in derselben E-Mail-Währung. Der Gesamtbetrag
    addiert die geprüften umgerechneten Beträge, jeweils auf zwei Nachkommastellen
    gerundet. Der Bericht bewahrt außerdem die Originalsummen nach Währung.
    Für E-Mail und Anhangdownloads müssen alle Dokumente geprüft sein.
    Doppelte Fotos zählen doppelt, wenn Sie keines davon entfernen."""

[[faq]]
q = "Sendet die E-Mail-Schaltfläche automatisch etwas?"
a = """
    Nein. Wo unterstützt, übergibt sie Bericht und komprimierte JPEG-Kopien
    an das Teilen-Menü des Geräts. Wählen Sie dort Ihre E-Mail-App. Andernfalls
    lädt sie eine E-Mail-Datei mit Bericht und Anhängen herunter. Der
    vorgeschlagene Betreff enthält die Dokumentanzahl und, sobald jedes
    Dokument geprüft ist, den Gesamtbetrag in der E-Mail-Währung. Nach einer
    Änderung des Betreffs bleibt Ihre Formulierung erhalten. Prüfen Sie
    Empfänger, Inhalte und Anhänge und senden Sie selbst. Die Seite kann nicht
    erkennen, ob Ihre E-Mail-App die Daten angenommen oder die Nachricht
    schließlich gesendet hat."""

[[faq]]
q = "Sind die zugeschnittenen Bilder in der E-Mail-Datei angehängt?"
a = """
    Ja. Die heruntergeladene <code>.eml</code>-Datei enthält den Bericht und
    jedes vorbereitete JPEG als Anhang. Kompatible Apps öffnen sie als Entwurf;
    andere zeigen sie als Nachricht an, die weitergeleitet oder erneut gesendet
    werden muss. Ihre Originalfotos bleiben unverändert und werden nicht
    angehängt. Das ZIP enthält dieselben JPEGs und die CSV, falls Sie sie manuell
    anhängen möchten. Kein Browser kann garantieren, dass jede E-Mail-App eine
    Entwurfsdatei oder eine Übergabe über das Teilen-Menü annimmt."""

[[faq]]
q = "Wie wird die Standardwährung für die E-Mail gewählt?"
a = """
    Jedes Dokument mit gültigem Währungscode hat eine Stimme. Der häufigste Code
    wird zur gemeinsamen E-Mail-Währung. Bei Gleichstand gilt das erste
    Vorkommen in der aktuellen Dokumentreihenfolge. Fehlende oder unvollständige
    Codes werden ignoriert. Auslesen, Korrigieren und Entfernen von Dokumenten
    aktualisiert den Standard. Eine manuelle Wahl der E-Mail-Währung bleibt
    erhalten. „Standardwährung verwenden“ stellt die automatische Auswahl
    wieder her. Eine Änderung der E-Mail-Währung setzt bisherige Wechselkurse
    und Prüfbestätigungen zurück."""

[[faq]]
q = "Kann ich eine Währung außerhalb der Liste wählen?"
a = """
    Ja. Wählen Sie „Anderen Code eingeben“ und geben Sie drei Buchstaben für
    die Dokument- oder E-Mail-Währung ein. Eine Änderung der E-Mail-Währung
    aktualisiert jedes Dokument und setzt bisherige Kurse und Prüfbestätigungen
    zurück. Die Online-Abdeckung hängt vom Währungspaar und Datum ab. Ist kein
    historischer Kurs verfügbar, geben Sie einen manuellen ein. Es wird kein
    aktueller Kurs als Ersatz eingesetzt."""

[[faq]]
q = "Werden meine Fotos zur Texterkennung hochgeladen?"
a = """
    Nein. Tesseract liest sie im Browser mit den englischen Daten aus, die mit
    der Seite geliefert werden. Kopieren und Herunterladen bleiben lokale
    Vorgänge. E-Mail oder Teilen übergeben die ausgewählten Informationen
    bewusst an eine andere App. Diese übernimmt die spätere Zustellung."""

[[faq]]
q = "Warum kann auch ein detailreiches Foto ein schlechtes Ergebnis liefern?"
a = """
    Spiegelungen, Unschärfe, Falten und eine weit entfernte Seite können auch
    in einem großen Bild Buchstaben verdecken. Kleine Ausschnitte werden für
    die Texterkennung bis zu dreifach vergrößert und mit einem schmalen weißen
    Rand versehen. Die längste Seite der Arbeitskopie bleibt dabei innerhalb
    von 2400 Pixeln. Das kann beim Lesen kleiner Schrift helfen, stellt aber
    keine fehlenden Bilddetails wieder her. Füllen Sie den Bildrahmen mit einem
    Dokument, halten Sie den Druck scharf und gleichmäßig beleuchtet und drehen
    Sie seitliche Seiten vor einer erneuten Erkennung. Original und E-Mail-Anhang
    werden für die Texterkennung nicht vergrößert."""

[[faq]]
q = "Funktioniert das Werkzeug offline?"
a = """
    Auslesen, Bearbeiten, Zuschneiden, manuelle Umrechnung, Zählen,
    JPEG-Vorbereitung und Downloads funktionieren, sobald Seite und OCR-Dateien
    zwischengespeichert sind. Die Online-Abfrage historischer Kurse braucht
    eine Verbindung; ein bereits abgerufener Kurs bleibt im offenen Tab
    verfügbar. Einen Entwurf können Sie möglicherweise offline öffnen.
    Die E-Mail-Zustellung benötigt normalerweise die Verbindung Ihrer App."""

[[faq]]
q = "Wie wird das Belegdatum für historische Kurse verwendet?"
a = """
    Prüfen Sie das gedruckte Belegdatum und tragen Sie es im Umrechnungsdatumsfeld
    ein. Mehrdeutige Datumsangaben werden nicht geraten. Wählen Sie die
    Online-Abfrage und drücken Sie „Historischen Kurs abrufen“. Das Ergebnis
    nennt sein tatsächliches Beobachtungsdatum. Dieses kann vor dem angefragten
    Datum liegen, wenn kein Kurs veröffentlicht wurde. Prüfen Sie es vor dem
    Bestätigen. Stattdessen können Sie für jedes Dokument einen eigenen
    manuellen Kurs eingeben. Die E-Mail hält Kurs, Quelle und verwendetes
    Datum für jeden umgerechneten Betrag fest."""

