# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Zwei Dinge, die beim Bearbeiten jedes Satzes hier festzuhalten sind, genau
# wie im Englischen: "MP4" heißt hier eine einzige, bewusst gewählte Sache,
# H.264-Bild und AAC-Ton in einem schlichten MP4-Container, und die Seite
# schreibt nie etwas anderes. Und eine Umwandlung ist nicht immer eine
# Neukodierung; die Seite sagt Spur für Spur, welches von beidem es ist,
# bevor sie beginnt, damit "umwandeln" den Unterschied nie versteckt.
#

