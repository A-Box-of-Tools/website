[[privacy]]
title = "Ihre Videos haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Datei landen könnte, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Eine Netzfunktion hat dieses Werkzeug
      überhaupt nicht. Es gibt keine Adresse zum Einfügen, nichts
      herunterzuladen und keine Engine, die beim ersten Gebrauch nachgeladen
      wird. Jedes Byte, das Ihr Video berührt, kam beim Laden der Seite von
      dieser Domain selbst."""

[[privacy]]
title = "Das Dekodieren ist lokal."
body = """
 Die Einzelbilder laufen durch WebCodecs
      in Ihrem eigenen Browser oder durch dieselbe Wiedergabe-Engine, die Ihnen
      den Clip ohnehin zeigen würde. Welcher von beiden genommen wurde, steht
      oben auf der Seite, denn davon hängt ab, wie die Einzelbilder gewählt
      werden, und das sollten Sie sehen können."""

[[privacy]]
title = "Das GIF wird hier geschrieben, in Code, den Sie lesen können."
body = """
 Palette,
      Dithering und LZW-Kompression sind rund sechshundert Zeilen im eigenen
      Ordner dieses Werkzeugs. Es gibt keinen Encoder-Dienst, keine zur Laufzeit
      nachgeladene Bibliothek und in alldem keine Stelle, an der ein Bild
      gesendet werden könnte."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihr
      Video übergeben, weder eine Datei noch ein Einzelbild, ein Name, eine
      Größe, eine Länge oder der Abschnitt, den Sie markiert haben. Jede Zeile,
      die liest, abtastet, quantisiert oder kodiert, kommt von dieser Domain
      selbst und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """
      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihr Video bekommt er nichts."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie ein Video aus."
body = """
 Ziehen Sie ein MP4, MOV, M4V oder WebM
      auf das Auswahlfeld oder suchen Sie eines von Hand heraus. Der Browser
      liest es direkt von Ihrer Festplatte, und dabei geht nichts nach
      draußen."""

[[howto]]
title = "Markieren Sie den Abschnitt."
body = """
 Spielen Sie den Clip ab und drücken
      Sie <kbd>I</kbd>, wo er beginnen soll, und <kbd>O</kbd>, wo er enden soll.
      Oder ziehen Sie die Griffe auf dem Balken. Ein GIF ist ein paar Sekunden
      lang, und diese Einstellung entscheidet weit mehr als die anderen beiden
      darüber, ob die Datei klein oder riesig wird."""

[[howto]]
title = "Wählen Sie Breite und Bildrate."
body = """
 480 Pixel Breite und 12 Bilder pro
      Sekunde passen zu den meisten Zwecken, für die es ein GIF gibt. Die Breite
      zu halbieren viertelt die Pixel, und zwölf Bilder pro Sekunde lesen sich
      als Bewegung, ohne dass Sie für die bezahlen, die niemand sieht."""

[[howto]]
title = "Erzeugen und herunterladen."
body = """
 Die Einzelbilder werden gelesen, eine
      Palette aus 256 Farben wird für die ganze Animation gewählt, und jedes
      Einzelbild wird nur als der Teil des Bildes geschrieben, der sich geändert
      hat. Ist es fertig, spielt es auf der Seite ab, und das ist dieselbe Datei,
      die der Download Ihnen gibt."""

[[faq]]
q = "Wird mein Video irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, tastet ab und wandelt um, auf Ihrer
        eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört uns. Wer lieber prüft als
        glaubt, trennt die Internetverbindung und erzeugt trotzdem ein GIF."""

[[faq]]
q = "Welche Videoformate kann ich umwandeln?"
a = """
        MP4, M4V und MOV werden direkt gelesen, egal was darin steckt, also
        H.264, HEVC, AV1 oder VP9, solange Ihr Browser diesen Codec dekodieren
        kann. Alles andere, was Ihr Browser abspielen kann, allen voran WebM,
        wird stattdessen gelesen, indem der Player auf jeden Zeitpunkt springt.
        Das ist langsamer und etwas weniger genau darin, welches Einzelbild wo
        landet. Was der Browser weder lesen noch abspielen kann, in der Praxis
        AVI, WMV, FLV und die meisten MKVs, wird gleich mit einer entsprechenden
        Meldung abgelehnt, statt auf halbem Weg zu scheitern."""

[[faq]]
q = "Warum ist mein GIF so groß?"
a = """
        Weil GIF ein Format von 1987 ist, das ganze Bilder speichert und keine
        Bewegung. Aus einem fünf Sekunden langen Clip lässt sich keines machen,
        das so klein ist wie das fünf Sekunden lange MP4, aus dem es kam. Ein GIF
        eines Videos ist routinemäßig zehnmal so groß wie das Video. Entschieden
        wird die Größe von drei Einstellungen, in dieser Reihenfolge: wie lang
        der Abschnitt ist, wie breit das Bild ist und wie viele Bilder pro
        Sekunde es hat. Die Breite zu halbieren viertelt die Pixel, und die Pixel
        sind es, die kosten."""

[[faq]]
q = "Warum nur 256 Farben?"
a = """
        Weil das Format es so will. Ein GIF trägt eine Tabelle von höchstens 256
        Farben und speichert jedes Pixel als Nummer darin. Dieses Werkzeug wählt
        diese 256, indem es die Farben in jedem Einzelbild Ihres Abschnitts zählt
        und sie in 256 Gruppen teilt, mit Median Cut, der Standardmethode. Die
        Palette passt damit zu Ihrem Clip, statt ein fester Farbsatz zu sein. Wo
        eine Farbe fehlt, mischt das Dithering die beiden nächstgelegenen, damit
        ein Verlauf ein Verlauf bleibt und nicht zu Streifen wird."""

[[faq]]
q = "Was macht die Dithering-Einstellung?"
a = """
        Sie tauscht ein wenig Rauschen gegen viel weniger Streifenbildung. Ist
        sie an, bleibt ein Himmel, der sonst zu vier flachen Bändern würde, ein
        Verlauf, und Sie zahlen mit einer feinen Textur und einer größeren Datei.
        Ist sie aus, wird das Bild flacher und die Datei kleiner, was zu
        Bildschirmaufnahmen, Strichzeichnungen und allem passt, was ohnehin aus
        flachen Farbflächen besteht. Verwendet wird hier geordnetes Dithering und
        nicht die fehlerverteilende Art, damit ein unveränderter Hintergrund
        zwischen den Einzelbildern vollkommen still steht statt zu flimmern."""

[[faq]]
q = "Gibt es eine Grenze für Länge oder Größe?"
a = """
        Begrenzt ist der Abschnitt, und zwar durch den Arbeitsspeicher und nicht
        durch eine Regel. Jedes seiner Einzelbilder wird gleichzeitig gehalten,
        während die Palette gewählt wird. Die Seite rechnet deshalb aus, was Ihre
        Einstellungen kosten würden, und sagt es Ihnen vor dem Start. Sie weigert
        sich lieber, als den Tab den Speicher aufbrauchen und verschwinden zu
        lassen. Herunter bringen das ein kürzerer Abschnitt, eine kleinere Breite
        oder eine niedrigere Bildrate."""

[[faq]]
q = "Behält es den Ton?"
a = """
        Ein GIF kann keinen Ton tragen. Eine Fassung des Formats mit Audio gibt
        es nicht, und das ist der Hauptgrund, warum das Web GIFs größtenteils
        durch stumm laufende Videos ersetzt hat. Ist der Ton wichtig, behalten
        Sie das Video. Der <a href="../video-schneiden/">Video-Schneider</a>
        schneidet einen Abschnitt heraus, ohne ein einziges Einzelbild neu zu
        kodieren."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihr Video übergeben."""

