#
# Video-Rotator - German.
#
# Overrides for tools/rotate-video/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# Zwei Dinge, die beim Bearbeiten jedes Satzes hier festzuhalten sind, genau
# wie im Englischen: Eine Drehung ist eine Änderung am Header der Datei, nicht
# an ihren Einzelbildern, und "kein einziges Einzelbild wird dekodiert" ist das
# Versprechen der Seite. Und der Header wird von jedem Handy, Browser und
# modernen Player beachtet und von ein paar alten Desktop-Playern ignoriert;
# das "Einbrennen" ist für die da, kodiert neu, kostet eine Generation und
# heißt hier ausdrücklich die zweite Wahl.
#

name = "Video-Rotator"
heading = "Video&nbsp;drehen <span class=\"h1-kw\">&mdash; für den Clip, der quer gefilmt wurde</span>"
tagline = "Eine Vierteldrehung, eine halbe Drehung, in die andere Richtung. In den Header der Datei geschrieben, sodass kein einziges Einzelbild dekodiert wird und nichts verloren geht."

title = "Video drehen &mdash; kostenlos, verlustfrei, im Browser, ohne Upload"
description = "Ein quer oder kopfüber gefilmtes Video im Browser um eine Viertel- oder halbe Drehung drehen. Die Drehung wird in den Header der Datei geschrieben, sodass kein Einzelbild neu kodiert wird und nichts verloren geht; oder sie wird für alte Player ins Bild eingebrannt. MP4, MOV, WebM und MKV hinein, MP4 heraus. Nichts wird hochgeladen."
og_title = "Ein Video drehen, ohne es hochzuladen und ohne es neu zu kodieren"
og_description = "Bei einem quer gefilmten Clip müssen neun Zahlen im Header geändert werden, nicht das Video neu kodiert. Drehen Sie ihn in Sekunden im Browser; die Datei verlässt Ihr Gerät nie."
og_image_alt = "Ein Video im Browser drehen, ohne es hochzuladen"

pledge = """
    Das Video, das Sie auswählen, wird von Code, der von dieser Adresse
    ausgeliefert wird, gelesen, mit einem neuen Header versehen und im
    Arbeitsspeicher dieses Geräts neu geschrieben; soll die Drehung ins Bild
    eingebrannt werden, zeichnen die Codecs Ihres eigenen Browsers. Einen
    Upload kann hier nichts auslösen, und am anderen Ende dieser Seite steht
    kein Server, der einen entgegennehmen könnte. Kein Gigabyte geht hinauf,
    um gedreht zurückzukommen."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und drehen Sie etwas. Keine einzige Anfrage
      trägt ein Video, ein Einzelbild oder einen Dateinamen. Oder trennen Sie
      die Internetverbindung und drehen Sie es trotzdem."""

read_first = """
, <code>src/plan.js</code> für die neun Zahlen, auf die
      eine Drehung hinausläuft, <code>src/rotate.js</code> für das Kopieren
      und das Schreiben, und <code>src/shared/copy-tracks.js</code> dafür, wie
      ein Einzelbild hinüberwandert, ohne gelesen zu werden. Keines davon
      erreicht das Netz, und die Leser und der Schreiber daneben ebenso
      wenig."""

howto_heading = "So drehen Sie ein Video"

card = """
            Den quer gefilmten Clip drehen: eine Vierteldrehung nach rechts
            oder links, oder auf den Kopf. Die Drehung wird in den Header der
            Datei geschrieben, und jedes Einzelbild wird übernommen, wie es
            ist: nichts dekodiert, nichts verloren, Sekunden für ein Gigabyte.
            Oder sie wird für die alten Player, die Header ignorieren, ins
            Bild eingebrannt."""

[words]
plural = "Videos"
choose = "ein Video"
analytics_extra = """, und nichts darüber,
  in welche Richtung Sie es gedreht haben"""

