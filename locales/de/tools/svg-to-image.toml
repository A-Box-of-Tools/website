[[privacy]]
title = "Ihre Grafik hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Der ganze Rasterer
      besteht aus einem <code>&lt;img&gt;</code>, das einen Blob Ihrer eigenen
      Datei hält, einem <code>drawImage</code> auf ein Canvas und einem
      <code>canvas.toBlob</code>."""

[[privacy]]
title = "Ein SVG ist ein Dokument, und hier steht es in dem Modus, in dem es nicht handeln kann."
body = """
 Ein SVG kann ein
      <code>&lt;script&gt;</code>, ein entferntes
      <code>&lt;image href=&quot;https://&hellip;&quot;&gt;</code>, ein
      Stylesheet und eine Webschrift enthalten. Durch ein
      <code>&lt;img&gt;</code> gezeichnet, befindet es sich in dem, was die
      Spezifikation <em>secure static mode</em> nennt. Das Skript läuft nicht,
      und keine einzige dieser Adressen wird abgerufen. Das sichert der Browser
      zu, wir versprechen es nicht bloß, und deshalb kann diese Seite eine nie
      gesehene Datei öffnen, ohne dass die Datei nach Hause telefonieren
      könnte."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihre Zeichnung übergeben. Jede Zeile,
      die eine Datei liest, bemisst oder zeichnet, kommt von dieser Domain selbst
      und steht im Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil darin nie ein Schritt über das Netz
      vorgesehen war. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie das SVG aus."
body = """
 Ziehen Sie eines auf das Auswahlfeld,
      oder nehmen Sie einen ganzen Ordner und wandeln Sie alles in einem
      Durchgang um. Der Browser liest die Datei direkt von Ihrer Festplatte, und
      dabei geht nichts nach draußen. Jede Zeile sagt, für wie groß die Datei
      sich selbst hält, und sie sagt es anders, je nachdem, ob diese Größe aus
      ihrer <code>viewBox</code> stammt oder angenommen wurde, weil die Datei
      keine angibt."""

[[howto]]
title = "Sagen Sie, wie groß."
body = """
 Ein Faktor der dateieigenen Größe ist die
      schnellste Antwort und für einen Stapel die richtige, denn jede Zeichnung
      wird von ihrem eigenen Ausgangspunkt aus skaliert, und ein Satz Symbole
      bleibt damit im Verhältnis. Sonst nennen Sie eine Breite, eine Höhe, die
      längste Seite oder einen Rahmen mit beiden Seiten. Eine große Zahl kostet
      hier nichts, anders als bei einer Fotografie, denn die Zeichnung wird in
      dieser Größe neu gezeichnet und nicht darauf gedehnt."""

[[howto]]
title = "Nehmen Sie die hochauflösenden Kopien dazu, wenn Sie sie brauchen."
body = """
 Ein Telefon und
      ein Retina-Notebook zeichnen zwei oder drei Gerätepixel je CSS-Pixel, ein
      200 Pixel großes Logo braucht also eine 400- oder 600-Pixel-Datei
      dahinter. Verlangen Sie <code>@2x</code> und <code>@3x</code>, kommen sie
      so benannt heraus, wie Xcode, Androids Werkzeuge und CSS
      <code>image-set()</code> es alle erwarten, und jede ist exakt das Zwei-
      oder Dreifache der ersten statt getrennt gerundet."""

[[howto]]
title = "Wählen Sie das Format und entscheiden Sie über die Transparenz."
body = """
 Nehmen Sie PNG,
      solange Sie keinen Grund für etwas anderes haben. Es ist verlustfrei, es
      behält Transparenz, und flache Farbflächen komprimieren sich darin gut.
      JPEG hat überhaupt keine Transparenz, eine Hintergrundfarbe wird also
      gemalt, ob Sie eine wählen oder nicht, denn ohne sie käme jedes
      transparente Pixel schwarz heraus. WebP kann beides und macht die kleinere
      Datei, dafür lesen es Programme, die alt genug sind, gar nicht."""

[[howto]]
title = "Sehen Sie sich die Vorschau an, bevor Sie herunterladen."
body = """
 Sie wird von demselben
      Code aus Ihrer Datei auf Ihrem Gerät gezeichnet, der auch die Datei
      schreibt. Zwei Dinge ändern sich, wenn eine Zeichnung zu Pixeln wird, und
      beide zeigen sich hier. Eine Haarlinie, die ein halbes Pixel breit war,
      wird grau, und Text wird in einer Schrift gezeichnet, die dieser Computer
      hat, und nicht in einer aus dem Netz geholten."""

[[howto]]
title = "Nehmen Sie die Dateien."
body = """
 Ein Download je Datei, oder der ganze
      Stapel als ein einziges ZIP. Die Namen folgen dem SVG, aus dem sie kamen,
      mit <code>@2x</code> und <code>@3x</code> an den Kopien. Zwei Dateien, die
      denselben Namen bekommen hätten, werden nummeriert, statt dass eine die
      andere stillschweigend ersetzt."""

[[faq]]
q = "Wird mein SVG irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest die Datei auf Ihrer eigenen Hardware,
        zeichnet sie mit derselben Engine auf ein Canvas, die jedes andere Bild
        rendert, das Sie sehen, und gibt sie als Download zurück. Netzfunktionen
        hat dieses Werkzeug keine, es ruft nie etwas ab und sendet nie etwas. In
        der <code>Content-Security-Policy</code> der Seite steht jede Adresse,
        die sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "In welcher Größe sollte ich ein SVG rastern?"
a = """
        In der, die das lesende Programm verlangt, multipliziert mit dem
        Pixelverhältnis des Bildschirms, auf dem es zu sehen sein wird. Ein Logo,
        das 200 CSS-Pixel einnimmt, braucht 400 für ein Retina-Notebook und 600
        für ein neueres Telefon, und genau das sind hier die <code>@2x</code>-
        und <code>@3x</code>-Kopien. Für ein App-Symbol oder einen Store-Eintrag
        nennt der Store eine exakte Zahl, und die gilt. Hat Ihnen niemand etwas
        gesagt, sind 1024 auf der längsten Seite ein nützlicher Standard: groß
        genug für fast jeden Zweck und klein genug zum Verschicken."""

[[faq]]
q = "Verliert es Qualität, wenn ich es größer mache?"
a = """
        Nein, und das ist die eine Stelle, an der diese Antwort ehrlich nein
        lautet. Ein Vektor besteht aus Anweisungen statt aus Pixeln, der Browser
        zeichnet die Kurven also in jeder verlangten Größe neu. 4000 Pixel aus
        einem 24-Pixel-Symbol sind genauso scharf wie 24. Was nicht geht, ist der
        Weg zurück. Sobald es ein PNG ist, sind es Pixel wie überall sonst.
        Rastern Sie also gleich in der Größe, die Sie brauchen, statt das
        Ergebnis später zu skalieren."""

[[faq]]
q = "Mein SVG hat weder Breite noch Höhe. Welche Größe bekomme ich?"
a = """
        Die der <code>viewBox</code>, falls es eine gibt. Ihre Breite und Höhe
        sind zwar Benutzereinheiten und keine Pixel, aber sie sind die einzigen
        Zahlen in der Datei, und ein Browser behandelt sie als natürliche Größe
        der Zeichnung. Gibt es auch keine viewBox, schreibt die Seite
        <em>angenommen</em> neben die Zeile und nimmt
        300&nbsp;&times;&nbsp;150, also das, womit ein <code>&lt;img&gt;</code>
        sie gezeichnet hätte. So oder so können Sie die gewünschte Größe nennen,
        und die Datei wird in dieser gezeichnet."""

[[faq]]
q = "Warum sieht der Text im PNG anders aus?"
a = """
        Weil die Schrift nicht im SVG steckt. Ein SVG, das Text zeichnet, nennt
        eine Schrift und überlässt es dem Gerät, sie zu finden. Eine Datei, die
        sich mit einem <code>@import</code> eine von Google Fonts holt, bekommt
        hier nichts, denn ein durch ein <code>&lt;img&gt;</code> gezeichnetes SVG
        darf nichts abrufen. Das ist dieselbe Regel, die es daran hindert, mit
        Ihrer Datei nach Hause zu telefonieren. Die Lösung kennt jeder Gestalter
        ohnehin: Wandeln Sie den Text im Zeichenprogramm vor dem Export in Pfade
        um. Dann ist es Geometrie und sieht überall gleich aus."""

[[faq]]
q = "Kann es mehrere Dateien auf einmal umwandeln?"
a = """
        Ja. Jedes SVG auf der Liste wird mit denselben Einstellungen gerendert,
        und der Stapel kommt als ein ZIP herunter. Für einen Stapel ist meist ein
        Faktor die richtige Einstellung, also &bdquo;4&times; die Größe, die die
        Datei verlangt&ldquo;, weil jede Zeichnung von ihrer eigenen Größe aus
        skaliert wird, statt dass alle auf dieselbe Pixelzahl gezwungen werden.
        Klicken Sie eine beliebige Zeile an, um jene in die Vorschau zu holen."""

[[faq]]
q = "Gibt es eine Größengrenze?"
a = """
        Die des Browsers, nicht unsere. Ein Canvas gibt irgendwo jenseits von
        16.384 Pixeln Seitenlänge auf, und Safari auf einem iPhone oder iPad hört
        bei etwa 16,7 Megapixeln Fläche auf, also bei
        4096&nbsp;&times;&nbsp;4096. Darüber warnt die Seite, statt Ihnen ein
        leeres Bild zurückzugeben, und genau das tut ein Browser, wenn ihm die
        Luft ausgeht: <code>toBlob</code> gibt überhaupt nichts zurück, ohne eine
        Fehlermeldung, die sich erklärte. Jenseits von 100 Megapixeln weigert
        sich das Werkzeug ganz, denn das wären 400&nbsp;MB Canvas, bevor ein
        einziges Byte kodiert ist."""

[[faq]]
q = "Was passiert mit der Transparenz?"
a = """
        Sie bleibt, in PNG und in WebP. JPEG hat überhaupt keinen Alphakanal,
        also wird eine Farbe hinter das ganze Bild gemalt, ob Sie darum bitten
        oder nicht. Ohne sie käme alles Transparente schwarz heraus, und das
        sieht nach einem Fehler aus statt nach JPEG. Bei PNG eine
        Hintergrundfarbe zu wählen ist ebenfalls ein völlig gewöhnlicher Wunsch,
        denn dann wird die Zeichnung auf diese Farbe heruntergerechnet, statt ein
        Loch zu lassen."""

[[faq]]
q = "Kann es ein SVG lesen, das ein Skript oder ein externes Bild enthält?"
a = """
        Lesen kann es eines, und es zeichnet genau die Teile, die ein Browser zu
        zeichnen bereit ist. Ein über ein <code>&lt;img&gt;</code> geladenes SVG
        steht im <em>secure static mode</em>. Skripte laufen nicht, externe
        Verweise werden nicht abgerufen, und Animation spielt nicht, Sie bekommen
        also das erste Einzelbild. Eine Datei mit einem entfernten
        <code>&lt;image&gt;</code> darin kommt daher ohne diesen Teil heraus. Da
        weigert sich der Browser an Ihrer Stelle, und deshalb kann diese Seite
        gefahrlos eine nie gesehene Datei öffnen."""

[[faq]]
q = "Worin unterscheidet sich das vom Bildskalierer?"
a = """
        In der Quelle. Der <a href="../bildgroesse-aendern/">Bildskalierer</a>
        beginnt bei Pixeln, also bei einem JPEG oder einem PNG, und muss beim
        Vergrößern Detail erfinden, das nie da war. Dieses hier beginnt bei einer
        Zeichnung, es gibt also nichts zu erfinden und keine erwähnenswerte
        Obergrenze. Haben Sie ein SVG, bringt Ihnen dieses Werkzeug ein scharfes
        Ergebnis. Haben Sie eine Fotografie, ist das andere zuständig."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Auch bei Anzahl und Größe der Dateien
        gibt es keine Grenze, denn es zahlt kein Server dafür. Die Arbeit
        passiert auf Ihrem eigenen Gerät. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Dateien übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihre Grafik zum Rendern
        wegschickt, bliebe in dem Moment stehen, in dem Sie den Stecker
        ziehen."""

