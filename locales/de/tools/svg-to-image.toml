    lesen können, auf die von Ihnen verlangte Größe um, und dann landet sie auf
    einem Canvas, das Ihr Browser ohnehin mitbringt. Netzfunktionen hat dieses
    Werkzeug keine, weder zum Abrufen noch zum Senden. Und selbst wenn es einen
    Weg nach draußen gäbe, stünde am anderen Ende dieser Seite kein Server, an
    den ein Logo gehen könnte."""

