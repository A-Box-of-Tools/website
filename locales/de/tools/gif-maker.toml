[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien eingesammelt werden könnten, und im Code steht auch nichts,
      das sie dorthin schicken würde, gäbe es einen. Früher stand hier
      <code>connect-src 'none'</code>, was keine Ausnahme kannte. Die Werbung hat
      das gekostet, und das gehört dazugesagt."""

[[privacy]]
title = "Der Kodierer sind vier Dateien in diesem Repository."
body = """
 Ein GIF braucht eine
      Farbreduktion und einen LZW-Kompressor, und der Browser bringt beides nicht
      mit. Also stehen beide hier ausgeschrieben, in <code>src/quantize.js</code>
      und <code>src/lzw.js</code>, mit dem Container in <code>src/gif.js</code>. Um
      eines zu machen, wird nichts nachgeladen, und beim ersten Gebrauch wird auch
      keine Engine heruntergeladen."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihre
      Bilder übergeben, weder eine Datei noch ein Vorschaubild, ein Name, eine Größe
      oder eine Anzahl. Jede Zeile, die ein Bild liest, dekodiert, zeichnet oder
      komprimiert, kommt von dieser Domain selbst und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihre Bilder bekommt er nichts. Es passiert nichts, solange Sie
      nicht klicken, und was Sie dann öffnen, ist die Seite von jemand anderem."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht: Ein
      Werkzeug, das Ihre Bilder zum Zusammenbauen wegschickt, bliebe in dem Moment
      stehen, in dem Sie den Stecker ziehen."""

[[howto]]
title = "Wählen Sie Ihre Bilder aus."
body = """
 Ziehen Sie einen Ordner auf das
      Auswahlfeld oder suchen Sie die Dateien von Hand heraus. Der Browser liest sie
      direkt von Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Bringen Sie sie in die Abspielreihenfolge."
body = """
 Ziehen Sie am
      Griff oder nehmen Sie die Pfeile. &bdquo;Nach Name sortieren&ldquo; zählt so,
      wie man es erwartet, <code>frame_2</code> landet also vor
      <code>frame_10</code>."""

[[howto]]
title = "Legen Sie fest, wie lange jedes Einzelbild steht."
body = """
 Eine halbe Sekunde
      je Bild ist eine Diaschau, eine Zwanzigstelsekunde ist Animation. Geben Sie
      allen auf einmal dieselbe Standzeit, oder lassen Sie eines länger
      stehen."""

[[howto]]
title = "Wählen Sie eine Größe und die Art der Farbwahl."
body = """
 Ein GIF wächst mit
      seiner Fläche und der Zahl seiner Einzelbilder, und es gibt keinen
      Qualitätsregler, der das wieder einfängt. Die Größe ist deshalb die wichtigste
      Einstellung. 256 Farben je Einzelbild sehen am besten aus und sind die
      Voreinstellung; eine gemeinsame Farbtabelle ist kleiner und ruhiger."""

[[howto]]
title = "GIF erstellen und herunterladen."
body = """
 Gebaut wird es auf Ihrer eigenen
      Hardware. Wie lange das dauert, hängt daher von Ihrem Gerät ab und nicht von
      einer Warteschlange. Die fertige Animation läuft auf der Seite, bevor Sie sie
      speichern."""

[[faq]]
q = "Werden meine Bilder irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, zeichnet, reduziert und komprimiert sie auf
        Ihrer eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und in
        der <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört uns. Trennen Sie die
        Netzverbindung, und es macht weiter GIFs."""

[[faq]]
q = "Welche Bildformate kann ich verwenden?"
a = """
        Jedes Standbildformat, das Ihr Browser dekodieren kann, in der Praxis also
        JPG, PNG, WebP, GIF, AVIF und auf Apple-Geräten HEIC. Eine eigene Liste, die
        hier gepflegt werden müsste, gibt es nicht, denn das Dekodieren ist Sache des
        Browsers und nicht unsere."""

[[faq]]
q = "Warum ist mein GIF so groß?"
a = """
        Weil ein GIF jedes Einzelbild als vollständige Pixel speichert. Es gibt
        keinen Bewegungsausgleich, nichts wird als &bdquo;wie eben, nur
        verschoben&ldquo; abgelegt, und einen Qualitätsregler gibt es auch nicht. Die
        Größe ist ungefähr die Fläche mal die Zahl der Einzelbilder, und nur drei
        Dinge drücken sie.
        <br><br>
        Machen Sie es kleiner: Halbe Maße sind ein Viertel Datei. Nehmen Sie weniger
        Einzelbilder oder lassen Sie jedes länger stehen. Gehen Sie auf 64 oder 32
        Farben herunter und schalten Sie das Rastern ab, was bei flächiger Grafik
        weniger kostet, als es klingt, und bei Fotos sehr viel. Wenn es dann immer
        noch nicht passt, ist die ehrliche Antwort: Was Sie da bauen, ist ein Video,
        und ein MP4 davon ist vielleicht ein Zehntel so groß."""

[[faq]]
q = "Wie schnell kann ein GIF laufen?"
a = """
        Nicht so schnell, wie die Zahl vermuten lässt. Das Format speichert die Dauer
        jedes Einzelbildes in Hundertstelsekunden, und Browser heben alles unter zwei
        davon seit den Neunzigern auf eine Zehntelsekunde an. Diese Regel wurde für
        die rotierenden Globen jener Zeit geschrieben und nie wieder entfernt. Eine
        Dauer von 0,01 s läuft also nicht mit 100 Bildern je Sekunde, sondern mit 10.
        Deshalb bietet dieses Werkzeug nichts unter 0,02 s an, und 0,05 s, also 20
        Bilder je Sekunde, ist ungefähr so schnell, wie zu verlangen sich lohnt."""

[[faq]]
q = "Was ändert die Einstellung zur Farbtabelle?"
a = """
        Ein GIF-Einzelbild hält höchstens 256 Farben, und irgendjemand muss sie
        auswählen.
        <br><br>
        <strong>Beste Farben für jedes Einzelbild</strong> sucht für jedes Bild
        eigene 256 aus. Das sieht am schärfsten aus und ist bei einer Reihe
        unabhängiger Fotos die richtige Antwort. <strong>Eine Farbtabelle für das
        ganze GIF</strong> baut eine einzige Tabelle aus allen Einzelbildern
        zusammen. Das ergibt eine kleinere Datei und verhindert das Flackern, das
        entsteht, wenn die Farbtabelle zwischen Einzelbildern derselben Szene
        springt. Danach greift man also, wenn die Einzelbilder eine Folge sind und
        keine Sammlung."""

[[faq]]
q = "Kann ich einen transparenten Hintergrund behalten?"
a = """
        Ja, wenn Ihre Bilder einen haben: Stellen Sie
        &bdquo;Transparenz&ldquo; auf &bdquo;Transparente Flächen behalten&ldquo;.
        Eines sollten Sie vorher wissen. GIF-Transparenz ist ein einziges Bit, ein
        Pixel ist also entweder unsichtbar oder voll gemalt und dazwischen gibt es
        nichts. Kantengeglättete Ränder, weiche Schatten und alles Verlaufende
        bekommen dadurch eine harte Kante. Wenn Ihre Animation auf einen Hintergrund
        kommt, dessen Farbe Sie kennen, sieht es besser aus, sie auf diese Farbe zu
        legen."""

[[faq]]
q = "Gibt es eine Grenze, wie viele Bilder ich nehmen kann?"
a = """
        Im Werkzeug ist keine Grenze eingebaut. Die praktische Obergrenze sind der
        Arbeitsspeicher Ihres Geräts und Ihre Geduld mit der Datei, die dabei
        herauskommt. Die Bilder werden eines nach dem anderen gelesen, hundert
        Einzelbilder sind also kein Problem, hundert Einzelbilder mit 640 px sind
        aber auch ein sehr großes GIF. Siehe oben, &bdquo;Warum ist mein GIF so
        groß?&ldquo;"""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung und keine
        Testphase. Auf dem Ergebnis liegt auch kein Wasserzeichen. Bezahlt wird die
        Seite über Werbung, und den Anzeigen wird nichts über Ihre Bilder
        übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür, dass
        nichts hochgeladen wird. Ein Werkzeug, das Ihre Bilder zum Verarbeiten
        wegschickt, bliebe in dem Moment stehen, in dem Sie den Stecker ziehen."""

