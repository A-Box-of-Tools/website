#
# Bild-Schwärzer - German.
#
# Overrides for tools/redact-image/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "Schwärzen" ist der Begriff, den deutsche Behörden und Gerichte für genau
# diese Sache verwenden, und er trägt die Bedeutung mit, auf die es hier
# ankommt: entfernt, nicht verdeckt. "Unkenntlich machen" steht daneben, weil
# das der Ausdruck ist, den Leute in die Suche tippen.
#

name = "Bild-Schwärzer"
heading = "Bild&nbsp;schwärzen <span class=\"h1-kw\">&mdash; unkenntlich machen oder verpixeln</span>"
tagline = "Was Sie abdecken, wird aus der Datei gelöscht und nicht darin versteckt."

title = "Bild schwärzen &mdash; unkenntlich machen, verpixeln, ohne Upload"
description = "Namen, Adressen oder Kontonummern in einem Foto oder Screenshot abdecken und das Bild neu speichern, sodass die verdeckten Pixel wirklich weg sind und nicht unter einem Rechteck liegen. Läuft komplett im Browser."
og_title = "Ein Bild so schwärzen, dass das Verdeckte wirklich weg ist"
og_description = "Ziehen Sie Kästen über das, was niemand sehen soll. Die Pixel darunter werden überschrieben, bevor die Datei geschrieben wird. Es bleibt keine Ebene, die sich verschieben ließe. Nichts wird hochgeladen."
og_image_alt = "Bild-Schwärzer - die verdeckten Pixel werden überschrieben, nicht versteckt"

pledge = """
    Das Bild wird von Ihrem eigenen Browser dekodiert, übermalt und wieder
    kodiert, mit den Codecs, die er ohnehin mitbringt. Netzfunktionen hat
    dieses Werkzeug keine, weder zum Abrufen noch zum Senden. Das wiegt hier
    schwerer als fast überall sonst auf dieser Seite: Wer ein Bild schwärzen
    will, hat meist eines vor sich, auf dem noch ein Name, eine Adresse oder
    eine Kontonummer zu lesen ist."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und schwärzen Sie einen Screenshot. Keine
      einzige Anfrage trägt ein Bild, ein Vorschaubild, einen Dateinamen oder
      die Position eines einzigen Kastens. Oder trennen Sie die
      Internetverbindung und schwärzen Sie trotzdem eines."""

read_first = """
, <code>src/redact.js</code> für die drei
      Funktionen, die die Pixel überschreiben, und <code>src/preview.js</code>
      dafür, warum die Vorschau auf dem Bildschirm von genau diesen drei
      Funktionen gezeichnet wird."""

howto_heading = "So schwärzen Sie ein Bild, damit das Verdeckte wirklich weg ist"

card = """
            Teile eines Bildes schwärzen, verpixeln oder weichzeichnen. Die
            verdeckten Pixel werden überschrieben, bevor die Datei entsteht.
            Es bleibt keine Ebene, die sich beiseiteschieben ließe."""

