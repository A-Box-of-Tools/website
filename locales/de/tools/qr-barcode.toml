      Formatbits im anderen, dazu <code>src/gf256.js</code> für die
      Fehlerkorrektur und <code>src/barcode.js</code> für die gestreiften."""

howto_heading = "So erzeugen Sie einen QR-Code, ohne etwas hochzuladen"

