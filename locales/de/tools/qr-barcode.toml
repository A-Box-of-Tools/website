[[privacy]]
title = "Für das, was Sie eintippen, gibt es keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem ein WLAN-Passwort landen könnte, und im Code steht auch nichts, das es
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Der Code wird aus
      der Zeichenkette errechnet und als SVG gezeichnet, auf dieser Seite und auf
      Ihrem Gerät."""

[[privacy]]
title = "Der Code zeigt nicht auf uns."
body = """
 Was Sie eintippen, ist das, was der
      Code enthält. Mehrere kostenlose Generatoren geben Ihnen einen Code
      zurück, in dem ein Link auf ihre eigene Seite steht, die dann auf Ihre
      weiterleitet. Damit zählen sie jeden Scan, und der Code hört an dem Tag auf
      zu funktionieren, an dem sie die Domain nicht mehr bezahlen oder befinden,
      die kostenlose Stufe sei abgelaufen. Hier wird nichts gekürzt,
      weitergeleitet oder gezählt. Die Zeichenkette auf der Seite ist die
      Zeichenkette im Bild."""

[[privacy]]
title = "Das PNG entsteht aus dem SVG, das auf dem Schirm steht."
body = """
 Der Download ist
      keine zweite Zeichnung, die von der Vorschau abweichen könnte. Dasselbe
      Markup geht an den Browser und wird auf ein Canvas gemalt. Genau deshalb
      geht das, ohne irgendetwas zu kontaktieren, denn darin gibt es weder eine
      Schrift zu holen noch ein Bild zu laden."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas übergeben, was Sie eintippen. Jede Zeile, die
      aus einer Zeichenkette einen Code macht, kommt von dieser Domain selbst und
      steht im Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil darin nie ein Schritt über das Netz
      vorgesehen war. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie die Art des Codes."
body = """
 Ein QR-Code fasst alles und ist das,
      wonach eine Telefonkamera sucht, also die Antwort, solange Ihnen niemand
      etwas anderes gesagt hat. Ein Barcode fasst eine Zahl, und welcher es sein
      muss, entscheidet die Person, die ihn scannen wird. Ein Geschäft will einen
      EAN-13 oder einen UPC-A, ein Versandkarton einen ITF-14, und alles Interne
      ist meist Code 128."""

[[howto]]
title = "Sagen Sie, was hineinkommt."
body = """
 Ein Link ist der häufige Fall, und
      die Felder darüber bauen die anderen Formate, die Telefone kennen: ein
      WLAN, das anbietet, sich selbst beizutreten, eine Kontaktkarte, die
      anbietet, gespeichert zu werden, eine E-Mail, eine SMS, eine Telefonnummer,
      ein Ort auf einer Karte. Was Sie auch wählen, die fertige Zeichenkette
      steht auf der Seite, denn mehr als sie enthält ein QR-Code nie."""

[[howto]]
title = "Entscheiden Sie, wie viel Schaden er aushalten darf."
body = """
 Die vier Stufen legen
      mehr oder weniger Fehlerkorrektur hinein, und mehr Korrektur heißt ein
      größerer, dichterer Code. L reicht für einen Bildschirm, M für gewöhnliches
      Papier und H für etwas, das angefasst, klein gedruckt oder in der Sonne an
      ein Fenster geklebt wird. Ein Code auf einer Speisekarte, die täglich
      abgewischt wird, ist Q oder H wert."""

[[howto]]
title = "Setzen Sie Größe, Rand und Farben."
body = """
 Der Rand gehört zum Code. Die
      Spezifikation verlangt ringsherum vier Module ruhige Fläche, und ihn zu
      beschneiden ist der mit Abstand häufigste Grund, warum ein gedruckter Code
      nicht scannt. Dunkel auf Hell, mit echtem Kontrast. Ein Scanner liest den
      Unterschied zwischen beiden, blasses Grau auf Weiß genügt also nicht, und
      Hell auf Dunkel scheitert bei etlichen Lesegeräten rundweg."""

[[howto]]
title = "Prüfen Sie ihn mit dem Telefon, das Sie haben."
body = """
 Bevor Sie tausend davon
      drucken, scannen Sie den auf Ihrem Bildschirm. Das dauert zehn Sekunden und
      fängt die ganze Sorte Fehler ab, die eine Vorschau nicht zeigen kann: ein
      WLAN-Passwort mit einem Zeichen, das maskiert werden musste, ein Link, dem
      das <code>https://</code> fehlte, eine Barcode-Nummer mit einer Ziffer zu
      wenig."""

[[howto]]
title = "Nehmen Sie das SVG."
body = """
 Darin steht der Code als Anweisungen statt
      als Pixel, es druckt also in jeder Größe, ohne weich zu werden, und eine
      weiche Kante ist genau das, was ein Scanner nicht auflösen kann. Nehmen Sie
      zusätzlich das PNG, falls das, wohin Sie es einfügen, kein SVG annimmt. Es
      wird mit einer ganzen Pixelzahl je Modul gezeichnet und hat deshalb
      ebenfalls keine verwaschenen Kanten."""

[[faq]]
q = "Wird irgendetwas, was ich eintippe, irgendwohin gesendet?"
a = """
        Nein. Ein QR-Code ist Rechnerei über einer Zeichenkette, und diese
        Rechnerei läuft in Ihrem eigenen Browser auf Ihrem eigenen Gerät.
        Netzfunktionen hat dieses Werkzeug keine, es ruft nie etwas ab und sendet
        nie etwas. In der <code>Content-Security-Policy</code> der Seite steht
        jede Adresse, die sie kontaktieren darf, und keine davon gehört uns. Das
        wiegt hier schwerer als anderswo, denn was Menschen am häufigsten in
        einen QR-Code legen, ist das Passwort ihres WLANs."""

[[faq]]
q = "Laufen diese Codes ab oder hören sie später auf zu funktionieren?"
a = """
        Nein, und sie können es gar nicht. Was Sie eintippen, ist das, was der
        Code enthält, ihn zu scannen gibt also für immer genau diese
        Zeichenkette zurück. Ablaufen können die Codes, in denen die Adresse
        eines anderen steht. In einem &bdquo;dynamischen&ldquo; QR-Code steckt
        ein Link auf den Server des Generators, der auf Ihren weiterleitet, und
        damit kann jener jeden Scan zählen, das Ziel ändern oder es abschalten,
        wenn eine Testphase endet. Hier leitet nichts irgendwohin weiter."""

[[faq]]
q = "Ist es kostenlos, und darf ich es gewerblich nutzen?"
a = """
        Es ist kostenlos, es gibt kein Konto, kein Wasserzeichen und keine Grenze
        dafür, wie viele Sie erzeugen, und Sie dürfen das Ergebnis auf ein
        Produkt, ein Plakat oder eine Ladenfront setzen. QR Code ist eine
        eingetragene Marke von Denso Wave, und Denso Wave hat erklärt, sie nicht
        gegen Menschen durchzusetzen, die die Codes verwenden. Die Spezifikation
        ist als ISO/IEC 18004 veröffentlicht und frei umzusetzen, und genau das
        tut diese Seite. Bezahlt wird sie über Werbung."""

[[faq]]
q = "Welche Fehlerkorrekturstufe soll ich nehmen?"
a = """
        M, solange Sie keinen Grund für etwas anderes haben. L ergibt den
        kleinsten Code und reicht auf einem Bildschirm. M übersteht gewöhnliche
        Behandlung. Q und H sind für einen Code, der klein gedruckt, laminiert,
        an ein Fenster geklebt oder teilweise von einem Logo verdeckt wird. Jede
        Stufe legt mehr Prüfdaten hinein und braucht bei gleicher Textmenge ein
        größeres Symbol. Von L auf H zu gehen verdoppelt die Modulzahl für
        dieselbe Zeichenkette ungefähr."""

[[faq]]
q = "Wie viel fasst ein QR-Code?"
a = """
        In der größten Größe, 177 Module im Quadrat, bis zu 7.089 Ziffern, 4.296
        Großbuchstaben und Ziffern oder 2.953 Byte von allem anderen, und das bei
        der schwächsten Fehlerkorrektur. Bei der stärksten ist es etwa ein
        Drittel davon. In der Praxis setzt allerdings nicht das Format die
        Grenze, sondern der Scanner. Jenseits einiger hundert Zeichen werden die
        Module so klein, dass eine gewöhnliche Telefonkamera sie auf Armlänge
        nicht mehr auflöst. Ein langer Code ist meist ein Zeichen dafür, dass ein
        kurzer Link hineingehört."""

[[faq]]
q = "Warum ist mein Code größer, wenn ich den Link klein schreibe?"
a = """
        Weil ein QR-Code einen Modus für Großbuchstaben und Ziffern hat, der zwei
        Zeichen in elf Bit packt, und keinen solchen für Kleinbuchstaben, die je
        acht Bit kosten. Eine als <code>HTTPS://EXAMPLE.COM/SEITE</code>
        geschriebene URL kann ein Drittel kleiner ausfallen als dieselbe URL in
        Kleinbuchstaben. Schema und Host sind unabhängig von der Groß- und
        Kleinschreibung, sie zu schreien ändert also nichts außer der Größe. Für
        den Pfad nach dem Host gilt das nicht, den lassen Sie besser in Ruhe."""

[[faq]]
q = "Kann es einen QR-Code auch lesen und nicht nur erzeugen?"
a = """
        Diese Seite nicht, die daneben schon:
        <a href="../qr-code-scannen/">der Scanner</a> nimmt ein Foto, einen
        Screenshot oder Ihre Kamera und gibt die Zeichenkette zurück. Das ist
        eine erheblich größere Aufgabe, als einen zu zeichnen &mdash; das Symbol
        in einem Bild finden, den Aufnahmewinkel herausrechnen und den Schaden
        reparieren sind drei Probleme, die diese Seite nicht hat &mdash;, und
        deshalb ist es ein eigenes Werkzeug und kein Knopf hier. Es läuft zu
        denselben Bedingungen wie alles andere: nichts hochgeladen, und kein
        Kamerabild aufgehoben."""

[[faq]]
q = "Wofür ist der Rand, und kann ich ihn kleiner machen?"
a = """
        Der weiße Raum um einen QR-Code gehört zum Code. Ein Lesegerät findet
        daran, wo das Symbol endet, und die Spezifikation verlangt vier Module
        auf jeder Seite; ein Barcode will etwa zehn. Sie können ihn hier auf null
        setzen. Das Bild sieht dann aufgeräumter aus, und eine ganze Reihe
        Scanner sieht es daraufhin gar nicht mehr, besonders vor einem unruhigen
        Hintergrund. Ist der Platz das Problem, machen Sie lieber den Code
        kleiner, statt seinen Rand zu beschneiden."""

[[faq]]
q = "Welchen Barcode brauche ich?"
a = """
        Den, nach dem die Person fragt, die ihn scannt. EAN-13 ist der
        Handels-Barcode außerhalb Nordamerikas, UPC-A der nordamerikanische, und
        beide brauchen eine Nummer, die Ihnen GS1 zuteilt, denn die Nummer
        identifiziert Ihr Unternehmen und nicht nur das Produkt. EAN-8 ist die
        Kurzfassung für kleine Verpackungen. ITF-14 kommt auf den Versandkarton.
        Code 128 und Code 39 fassen neben Ziffern auch Text und brauchen
        überhaupt keine Registrierung, was sie zur richtigen Antwort für alles
        Interne macht: Anlagen, Regale, Auftragszettel."""

[[faq]]
q = "Was ist eine Prüfziffer, und warum hat das Werkzeug eine ergänzt?"
a = """
        Sie ist die letzte Ziffer eines Handels-Barcodes, aus den vorherigen
        ausgerechnet, damit ein Scanner einen Lesefehler von einem Treffer
        unterscheiden kann. EAN-13 will zwölf Ziffern und berechnet die
        dreizehnte, UPC-A will elf und berechnet die zwölfte. Tippen Sie die
        kurze Nummer, ergänzt diese Seite sie. Tippen Sie die volle Nummer, prüft
        sie die, die Sie gegeben haben, und weigert sich lieber, als
        stillschweigend zu korrigieren. Eine leise reparierte falsche Ziffer wäre
        ein Etikett, das als fremdes Produkt scannt."""

[[faq]]
q = "Kann ich ein Logo in die Mitte eines QR-Codes setzen?"
a = """
        Hier nicht, aber es lohnt sich zu wissen, warum es anderswo funktioniert:
        Möglich macht es die Fehlerkorrektur. Auf Stufe H lassen sich rund
        30&nbsp;% der Module zerstören, und der Code ist noch lesbar. Ein Logo,
        das deutlich weniger als das in der Mitte verdeckt, wo kein Suchmuster
        sitzt, ist damit reparabler Schaden. Schicken Sie den Code auf Stufe H
        durch Ihr Bildbearbeitungsprogramm, halten Sie das Logo unter etwa einem
        Fünftel der Fläche, und testen Sie ihn mit einem echten Telefon, statt
        ihm zu vertrauen."""

[[faq]]
q = "Warum ist das SVG besser als das PNG?"
a = """
        Weil ein Code aus Kanten besteht und ein PNG eine feste Pixelzahl hat,
        aus der es sie machen muss. Vergrößern Sie eines, wird jede Kante weich,
        und mit einer weichen Kante hat ein Scanner Mühe. Ein Drucker mit
        1200 dpi, dem man ein 512-Pixel-PNG gibt, soll den Unterschied erfinden.
        In einem SVG stehen die Quadrate als Anweisungen, es druckt also scharf
        auf einer Visitenkarte wie auf einer Plakatwand. Das PNG hier wird mit
        einer ganzen Pixelzahl je Modul gezeichnet, und mehr kann ein PNG nicht
        leisten."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihren Text wegschickt, um
        anderswo einen Code zeichnen zu lassen, bliebe in dem Moment stehen, in
        dem Sie den Stecker ziehen."""

