name = "Zeitraffer-Generator"
heading = "Zeitraffer&nbsp;erstellen <span class=\"h1-kw\">&mdash; ein Video im Zeitraffer abspielen</span>"
tagline = "Eine Stunde Aufnahme in zwanzig Sekunden."

title = "Zeitraffer-Video erstellen &mdash; kostenlos, ohne Upload, auch offline"
description = "Ein langes Video zum Zeitraffer machen, mit 10x, 60x oder jedem Tempo, das Sie eintippen. Läuft im Browser: kein Upload, kein Wasserzeichen, auch offline."
og_title = "Zeitraffer-Generator &mdash; ein Video beschleunigen, ohne es hochzuladen"
og_description = "Aus einem langen Clip alle paar Sekunden ein Einzelbild nehmen und daraus einen kurzen machen. Ihr eigener Browser liest, dekodiert und kodiert die Datei."
og_image_alt = "Zeitraffer-Generator - ein langes Video im Browser beschleunigen, ohne dass etwas hochgeladen wird"

pledge = """
    Jedes Einzelbild wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware
    ausgewählt, dekodiert und neu kodiert. Abrufen oder senden kann hier nichts,
    denn eine Netzfunktion hat dieses Werkzeug überhaupt nicht. Und selbst wenn
    es einen Weg nach draußen gäbe, stünde am anderen Ende dieser Seite kein
    Server, an den ein Video gehen könnte."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und erstellen Sie einen Zeitraffer. Keine einzige
      Anfrage trägt ein Einzelbild, einen Dateinamen oder ein Byte dessen, was
      Sie ausgewählt haben. Oder trennen Sie die Internetverbindung und erstellen
      Sie trotzdem einen. Ein Werkzeug, das Ihr Video zum Verarbeiten wegschickt,
      bliebe dabei einfach stehen."""

read_first = """
, <code>src/plan.js</code> für die Rechnung, die
      festlegt, aus welchem Moment jedes Einzelbild stammt, und
      <code>src/decode.js</code> für die Schleife, die nur die Teile der Datei
      liest, die diese Momente brauchen. Keines davon importiert etwas, das eine
      Anfrage stellen könnte."""

howto_heading = "So erstellen Sie einen Zeitraffer aus einem Video"

card = """
            Aus einem langen Clip einen kurzen machen, aus Stunden Sekunden,
            ohne ihn irgendwohin zu schicken."""

