[[privacy]]
title = "Das Dokument, das Menschen mit einem Wasserzeichen versehen, ist das, das sie am wenigsten hochladen möchten."
body = """

      Ein Passscan für den Vermieter. Ein Kontoauszug für den
      Hypothekenvermittler. Ein Vertragsentwurf, der nicht durchsickern darf.
      Der Grund, ein Dokument damit zu stempeln, für wen es ist, ist, dass es
      gleich Ihre Hände verlässt, und jedes Online-Werkzeug, das anbietet, es
      zu stempeln, verlangt, dass Sie es zuerst dem Server eines Fremden
      übergeben, also genau das, wogegen der Stempel schützen soll. Diese
      Seite kann das nicht. Die Datei wird von Ihrem eigenen Browser gelesen,
      die Wörter zeichnet Ihr eigener Browser, die gestempelte Kopie wird im
      Arbeitsspeicher geschrieben, und in der
      <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
      sie kontaktieren darf; keine davon gehört dieser Website. Trennen Sie
      die Netzverbindung, und es arbeitet weiter."""

[[privacy]]
title = "Ein Wasserzeichen sagt, wohin eine Kopie gegangen ist. Es verhindert nicht, dass eine gemacht wird."
body = """

      Das ist die ehrliche Größe dessen, was hier geschieht. &bdquo;Nur für
      die Musterbank, 12. September 2026&ldquo; über jeder Seite bedeutet,
      dass ein Scan, der woanders auftaucht, den Namen der Stelle trägt, von
      der er durchgesickert ist, und deshalb verlangen Banken, Anwälte und
      Vermieter es, und deshalb lohnt es sich. Ein Schutz ist es nicht: Wer
      einen PDF-Editor hat, kann ein Wasserzeichen wieder abnehmen, und eine
      Seite, die Ihnen etwas anderes erzählte, wollte Ihnen etwas verkaufen.
      Wenn das Dokument von der falschen Person überhaupt nicht gelesen werden
      darf, versehen Sie es mit dem <a href=\"../pdf-schuetzen/\">PDF-Schutz</a>
      mit einem Passwort; die Leiste zum Weiterreichen unter dem Ergebnis
      führt direkt dorthin."""

[[privacy]]
title = "Der Stempel ist ein Bild, deshalb funktioniert er in jeder Sprache und jeder Schrift."
body = """

      Ein PDF kann Text nur in einer Schrift zeichnen, die es mitbringt, oder
      in den vierzehn, die jedes Leseprogramm mutmaßlich hat, und diese
      vierzehn sind lateinisch. Statt eine Schrift einzubetten, was Megabytes
      und eine Engine bedeutete, die diese Website bewusst nicht mitführt,
      werden die Wörter einmal von Ihrem Browser gezeichnet, mit den
      Schriften auf Ihrem eigenen Gerät, in welchem Schriftsystem auch immer
      Sie tippen, und als Bild mit seiner Transparenz in einer Soft Mask auf
      jede Seite gelegt. Gezeichnet wird in einer Auflösung, die ein Drucker
      nicht bemerkt. Was das kostet, ist, dass sich die Wörter hinterher weder
      markieren noch suchen lassen, und für ein Wasserzeichen ist das die
      richtige Richtung: Es ist da, um gesehen zu werden, nicht um
      herauskopiert zu werden."""

[[privacy]]
title = "Die Seiten selbst werden nicht gelesen, neu gerendert oder neu umbrochen."
body = """

      Was das Werkzeug hinzufügt, sind drei kleine Objekte im Dokument, das
      Bild, seine Maske und eine Deckkrafteinstellung, und auf jeder Seite
      zwei winzige Zeichenanweisungen, eine vor allem, was die Seite ohnehin
      zeichnet, und eine danach. Der eigene Inhalt der Seite wird nicht
      dekodiert, geschweige denn verändert: Jede Zeichenanweisung, jede
      eingebettete Schrift und jedes Bild wird genau so hinausgeschrieben, wie
      es ankam. Ein Scan behält also die Auflösung, mit der er gescannt wurde,
      Text bleibt markierbar und durchsuchbar, und nichts verrutscht. Das
      eine, was sich doch ändert, ändert jedes Neuschreiben: Ältere, überholte
      Kopien von Objekten, die frühere Bearbeitungen zurückgelassen haben,
      werden nicht übernommen."""

[[privacy]]
title = "Die Vorschau ist die Platzierung, keine Darstellung Ihres Dokuments."
body = """

      Diese Website hat keinen PDF-Renderer, mit Absicht, und sie tut nicht
      so, als hätte sie einen. Was die Vorschau zeigt, ist eine leere Seite in
      genau der Größe und Form Ihrer ersten Seite, mit dem Stempel dort, wo
      die Datei ihn hinsetzen wird, berechnet mit derselben Rechnung, mit der
      die Datei geschrieben wird, sodass die beiden nicht voneinander
      abweichen können.
      Der Inhalt Ihrer eigenen Seite wird nicht gezeichnet, denn ihn zu
      zeichnen bräuchte eine Engine von der Größe eines Browsers, und eine
      Vorschau, die ihn erriete, wäre schlechter als keine."""

[[privacy]]
title = "Die fertige Datei wird hier noch einmal geöffnet, bevor sie Ihnen angeboten wird."
body = """

      Bis das geschieht, korrigiert dieses Werkzeug mit allem oben nur seine
      eigene Hausaufgabe. Also werden die Bytes, die gleich Ihr Download
      werden, demselben Leser übergeben, den jedes PDF-Werkzeug dieser Website
      benutzt, und jede Seite muss zurückkommen, indem sie den Stempel in
      ihren Ressourcen nennt und mit der Anweisung endet, die ihn zeichnet,
      und mit derselben Seitenzahl wie das Original. Eine Datei, die das nicht
      besteht, wird als gescheitert gemeldet, ohne Download."""

[[privacy]]
title = "Eine digitale Signatur übersteht das nicht, und die Seite sagt es, wenn eine da ist."
body = """

      Eine Signatur deckt genau die Bytes der Datei ab, auf die sie angewendet
      wurde, jedes Neuschreiben macht sie also ungültig; genau dafür ist eine
      Signatur da. Dieses Werkzeug schreibt eine neue Datei, die Kopie, die
      Sie zurückbekommen, ist also unsigniert, und es sagt das beim Ergebnis,
      wenn es eine Signatur findet, vor der es warnen muss. Ihr Original ist
      weiterhin das signierte."""

[[privacy]]
title = "Ein gesperrtes Dokument wird erst nebenan geschickt."
body = """

      Eine Datei, die zum Öffnen ein Passwort braucht, lässt sich nicht
      stempeln, ohne sie zu öffnen, und diese Seite fragt nicht nach
      Passwörtern. Sie weist eine solche Datei ab, mit einem Link zum
      <a href=\"../pdf-entsperren/\">PDF-Entsperrer</a>, der den Schutz im
      selben Browser abnimmt; die entsperrte Kopie kommt für den Stempel
      hierher zurück, und der <a href=\"../pdf-schuetzen/\">PDF-Schutz</a>
      setzt danach wieder ein Passwort darauf."""

[[privacy]]
title = "Was Google lädt und was es nicht bekommt."
body = """
 Die Skripte für Werbung
      und Messung kommen von Google. Keines von beiden bekommt irgendetwas über
      Ihr Dokument: keine Datei, keine Seite, keinen Namen, keine Größe, keine
      Seitenzahl und nicht die Wörter auf dem Stempel. Jede Zeile, die ein PDF
      liest, stempelt oder schreibt, wird von dieser Domain ausgeliefert und
      steht im Repository."""

[[privacy]]
title = "Was der Spenden-Knopf lädt und was er nicht bekommt."
body = """

      Der Knopf &bdquo;Buy me a coffee&ldquo; im Kopfbereich wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Er ist ein Link und sonst nichts: Er meldet keinen Besuch,
      und er bekommt nichts über Sie oder Ihre Dokumente. Es passiert nichts,
      bis Sie ihn anklicken, und dann sind Sie auf einer fremden Seite."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht: Ein
      Werkzeug, das Ihr Dokument zum Stempeln wegschickt, bliebe
      stehen."""

[[howto]]
title = "Wählen Sie das PDF."
body = """
 Ein Dokument nach dem anderen. Der Browser
      liest es direkt von Ihrer Festplatte, und es wird hier geöffnet. Ein
      Dokument, das ein Passwort braucht, wird mit einem Link zum Entsperrer
      abgewiesen; alles andere, Scans eingeschlossen, wird angenommen, wie es
      ist."""

[[howto]]
title = "Tippen Sie die Wörter."
body = """
 Für wen die Kopie ist, und wann: &bdquo;Nur
      für die Musterbank &middot; 12. September 2026&ldquo; ist die Form, die
      ihre Aufgabe erfüllt. Jede Sprache, jede Schrift, denn die Wörter
      zeichnet Ihr eigener Browser; was Sie tippen können, kann der Stempel
      sagen."""

[[howto]]
title = "Legen Sie fest, wie er sitzt, und sehen Sie in der Vorschau zu."
body = """

      Die Größe, ob er entlang der Diagonale der Seite läuft oder flach liegt,
      ob er einmal in der Mitte erscheint oder sich über die Seite wiederholt,
      wie blass er ist, seine Farbe und ob jede Seite ihn bekommt oder nur die
      erste. Die Vorschau ist eine leere Seite in der Form Ihrer ersten Seite,
      mit dem Stempel genau dort, wo die Datei ihn hinsetzen wird."""

[[howto]]
title = "Stempeln Sie es, und lesen Sie die Zeile, die sagt, dass geprüft wurde."
body = """

      Das Bild wird dem Dokument einmal hinzugefügt, und jede Seite bekommt
      die Anweisung, die es zeichnet. Dann wird die fertige Datei hier noch
      einmal geöffnet, und jede Seite muss mit dem Stempel zurückkommen, bei
      derselben Seitenzahl wie im Original. Sonst bekommen Sie keinen
      Download und eine Meldung, die das sagt."""

[[faq]]
q = "Lässt sich ein Wasserzeichen entfernen?"
a = """
        Ja, von jedem, der einen PDF-Editor hat, und diese Seite behauptet
        nichts anderes. Ein Wasserzeichen ist kein Schutz. Was es tut, ist, eine
        Kopie sagen zu lassen, wohin sie gegangen ist: Ein Scan mit dem Stempel
        &bdquo;nur für die Musterbank&ldquo;, der bei einem anderen
        Kreditgeber auftaucht, trägt den Namen der Stelle, von der er
        durchgesickert ist, und genau deshalb verlangen Kreditgeber, Vermieter
        und Anwälte eines. Wenn das Dokument von der falschen Person überhaupt
        nicht gelesen werden darf, ist das eine Sache für ein Passwort, und der
        <a href=\"../pdf-schuetzen/\">PDF-Schutz</a> auf dieser Website setzt
        eines."""

[[faq]]
q = "Kann das Wasserzeichen auf Chinesisch, Arabisch oder in einer anderen Sprache sein?"
a = """
        Ja, in allem, was Sie tippen können. Die Wörter zeichnet Ihr Browser
        mit den Schriften auf Ihrem eigenen Gerät, und sie werden als Bild auf
        jede Seite gelegt. Der Stempel ist also nicht auf das lateinische
        Alphabet beschränkt, wie es Text in einem PDF ohne eingebettete
        Schrift ist. Der Preis dafür ist, dass sich die Wörter hinterher weder
        markieren noch suchen lassen, was für ein Wasserzeichen die richtige
        Richtung ist."""

[[faq]]
q = "Warum sehe ich mein Dokument nicht in der Vorschau?"
a = """
        Weil diese Website keinen PDF-Renderer hat, mit Absicht. Eine PDF-Seite
        getreu zu zeichnen, braucht eine Schrift-Engine und ein vollständiges
        Grafikmodell, also eine Engine von der Größe eines Browsers, und eine
        mitzuführen, würde ändern, was jedes Werkzeug hier ist. Deshalb zeigt
        die Vorschau das, was sie ehrlich zeigen kann: eine leere Seite in
        genau der Größe und Form Ihrer ersten Seite, mit dem Stempel dort, wo
        die Datei ihn hinsetzen wird, berechnet von demselben Code, der die
        Datei schreibt. Öffnen Sie das Ergebnis in einem beliebigen
        Leseprogramm, um beides zusammen zu sehen."""

[[faq]]
q = "Sieht das Dokument unter dem Stempel anders aus?"
a = """
        Nein. Die eigene Zeichnung der Seite wird nicht gelesen, geschweige
        denn verändert: Jede Anweisung, jede eingebettete Schrift und jedes
        Bild wird genau so übernommen, wie es ankam, und der Stempel wird mit
        der Deckkraft, die Sie gewählt haben, obendrauf gezeichnet. Text
        bleibt markierbar und durchsuchbar, Scans behalten ihre ursprüngliche
        Auflösung, und nichts verrutscht. Die Datei wächst um die Größe eines
        Bildes, das sich alle Seiten teilen, und das sind bei einem Stempel
        aus ein paar Wörtern einige Dutzend Kilobyte."""

[[faq]]
q = "Funktioniert es bei gescannten Dokumenten und bei Seiten, die quer liegen?"
a = """
        Ja, bei beiden. Ein Scan ist eine Seite mit einem Bild darauf, und der
        Stempel kommt über das Bild wie über alles andere. Eine quer
        gespeicherte Seite, die Sorte, die im Querformat erscheint, weil sie
        eine Drehung trägt, wird so gestempelt, wie sie gezeigt wird: diagonal
        auf dem Bildschirm heißt diagonal auf dem Bildschirm, nicht diagonal
        zu dem Papier, das der Scanner zu haben glaubte."""

[[faq]]
q = "Was passiert mit einem signierten Dokument?"
a = """
        Seine Signatur ist danach nicht mehr gültig, und daran führt kein Weg
        vorbei. Eine Signatur deckt genau die Bytes der Datei ab, auf die sie
        angewendet wurde, jede Änderung überhaupt, durch jedes Programm, macht
        sie also ungültig. Dieses Werkzeug schreibt eine neue Datei, bemerkt,
        wenn das Original signiert war, und sagt es beim Ergebnis. Heben Sie
        Ihr Original auf: Es ist weiterhin das signierte."""

[[faq]]
q = "Kann ich ein PDF mit Passwort mit einem Wasserzeichen versehen?"
a = """
        Nicht direkt, und nicht, indem Sie das Passwort hier eintippen: Diese
        Seite fragt nach keinem. Nehmen Sie das Passwort zuerst mit dem
        <a href=\"../pdf-entsperren/\">PDF-Entsperrer</a> ab, im selben
        Browser, stempeln Sie dann die entsperrte Kopie hier, und setzen Sie
        danach mit dem <a href=\"../pdf-schuetzen/\">PDF-Schutz</a> wieder ein
        Passwort darauf, wenn Sie eines möchten. Eine Datei, die nur
        Einschränkungen trägt, sich also für jeden öffnet und sich nicht
        drucken lässt, wird auf dieselbe Weise abgewiesen, denn sie zu
        stempeln heißt, sie neu zu schreiben, und das Neuschreiben lässt die
        Einschränkungen fallen."""

[[faq]]
q = "Werden meine Dokumente oder die Wörter, die ich tippe, irgendwohin hochgeladen?"
a = """
        Nein. Die Datei wird von Ihrem eigenen Browser auf Ihrer eigenen
        Hardware gelesen, gestempelt und geschrieben, und die Wörter zeichnet
        er ebenfalls. Dieses Werkzeug hat keine Serverseite, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört dieser Website. Am
        einfachsten überzeugen Sie sich, indem Sie die Netzverbindung trennen
        und die Seite trotzdem benutzen."""

[[faq]]
q = "Woher weiß ich, dass wirklich jede Seite den Stempel bekommen hat?"
a = """
        Weil das Werkzeug es auf Ihrem Gerät prüft und Ihnen das Ergebnis
        zeigt. Ist die Datei geschrieben, wird sie demselben Leser übergeben,
        den die anderen PDF-Werkzeuge dieser Website benutzen, und jede Seite
        muss zurückkommen, indem sie den Stempel in ihren Ressourcen nennt und
        mit der Anweisung endet, die ihn zeichnet, bei derselben Seitenzahl
        wie im Original. Tut das eine Seite nicht, gilt der Durchlauf als
        gescheitert, und es wird nichts zum Herunterladen angeboten."""

[[faq]]
q = "Gibt es eine Größenbeschränkung, und kostet es etwas?"
a = """
        In das Werkzeug ist keine Grenze geschrieben. Die Grenze ist Ihr
        eigenes Gerät: Das Dokument liegt während der Bearbeitung im Speicher,
        ein Laptop nimmt also ein paar hundert Megabyte klaglos hin und kommt
        irgendwo darüber ins Straucheln. Es ist kostenlos, es gibt kein Konto,
        keine Anmeldung und keine Testphase. Die Seite trägt Werbung, und die
        bezahlt sie; die Werbung bekommt nichts über Ihre Dokumente."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie danach die
        Internetverbindung, und sie arbeitet weiter. Das ist zugleich der
        einfachste Weg zu prüfen, dass nichts hochgeladen wird: Ein Werkzeug,
        das Ihr Dokument zum Stempeln wegschickt, bliebe in dem Moment stehen,
        in dem Sie den Stecker ziehen."""

