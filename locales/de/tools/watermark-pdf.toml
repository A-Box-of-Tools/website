#
# PDF-Wasserzeichen - German.
#
# Overrides for tools/watermark-pdf/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Zwei Dinge, die beim Bearbeiten dieser Prosa nicht verloren gehen dürfen,
# dieselben wie im englischen Original.
#
# Erstens: was ein Wasserzeichen ist und was nicht. Es sind Wörter, die über
# jede Seite gelegt werden, damit eine Kopie des Dokuments sagt, wohin sie
# gegangen ist und wofür sie war, "nur für die Musterbank", ein Datum, ein
# Name. Das ist eine echte Verteidigung dagegen, dass ein Scan irgendwo
# wiederverwendet wird, wo er nie hinsollte, weil die Wiederverwendung
# sichtbar ist. Es ist kein Schutz: Wer einen Editor hat, kann es wieder
# abnehmen, und diese Seite behauptet nie etwas anderes. Das Werkzeug, das ein
# Dokument sperrt, liegt nebenan, und die Seite zeigt darauf.
#
# Zweitens: Der Stempel ist ein Bild, kein Text. Der Browser zeichnet die
# Wörter mit seinen eigenen Schriften, in jeder Schrift der Welt, und das Bild
# wird mit seiner Transparenz in einer Soft Mask auf jede Seite gelegt.
# Deshalb funktioniert ein chinesisches oder arabisches Wasserzeichen, ohne
# dass eine Schrift eingebettet wird, und deshalb lassen sich die Wörter
# hinterher weder markieren noch suchen. Die Seite sagt beide Hälften davon,
# und die Vorschau zeigt die Platzierung, die die Datei bekommt, mit derselben
# Rechnung, auf einer leeren Seite in der Größe der ersten Seite des Besuchers,
# nie eine Darstellung seines Dokuments, denn das kann diese Website nicht.
#
# Begriffe: "stamp" heißt Stempel, "watermark" Wasserzeichen, "reader"
# Leseprogramm, und die Leiste unter dem Ergebnis, die das Ergebnis an das
# nächste Werkzeug weiterreicht, heißt so, wie locale.toml sie nennt.
#

name = "PDF-Wasserzeichen"
