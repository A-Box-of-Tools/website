[[howto]]
title = "Setzen Sie das Passwort zum Öffnen, und tippen Sie es noch einmal."
body = """

      Das ist die eigentliche Sperre. Wer dieses Passwort hat, liest das
      Dokument; sonst niemand, und nichts hier oder sonst irgendwo Ehrliches
