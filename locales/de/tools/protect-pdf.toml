#
# PDF-Schutz - German.
#
# Overrides for tools/protect-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# Zwei Dinge, die beim Bearbeiten dieser Prosa nicht verloren gehen dürfen,
# dieselben wie im englischen Original und wie beim Entsperrer nebenan.
#
# Erstens: "Geschützt" heißt bei einem PDF zweierlei, und diese Seite darf die
# beiden nie ineinanderlaufen lassen. Ein Öffnungspasswort ist echt: Das
# Dokument ist wirklich chiffriert, und ohne das Passwort liest es niemand.
# Einschränkungen, also kein Drucken, kein Kopieren, kein Bearbeiten, sind eine
# Bitte, die sich gut benehmende Leseprogramme beachten und jedes Leseprogramm
# ablehnen darf; Adobe hat das von Anfang an so dokumentiert, und die Seite,
# die ablehnt, steht auf dieser Website gleich nebenan. Ein Werkzeug, das
# beides anbietet, muss neben den Kästchen sagen, welches von beiden es
# schreibt und was jedes davon wert ist.
#
# Zweitens: Ein hier gesetztes Passwort ist der einzige Weg zurück hinein.
# Nichts auf dieser Website errät Passwörter, und nichts Ehrliches anderswo tut
# es. Deshalb verlangt die Seite das Passwort zweimal, sagt einmal in klaren
# Worten, dass ein vergessenes Passwort ein verlorenes Dokument bedeutet, und
# schreibt nie versehentlich eine Datei, die niemand öffnen könnte.
#
# Begriffe: "user password" heißt hier Öffnungspasswort, wo es um seine Wirkung
# geht, und Benutzerpasswort, wo die FAQ die beiden Passwörter des Formats
# einander gegenüberstellt; "owner password" heißt Besitzerpasswort;
# "restrictions" heißt Einschränkungen; "scheme" heißt Verfahren; "reader"
# heißt Leseprogramm. Der Entsperrer nebenan verwendet dieselben Wörter.
#

