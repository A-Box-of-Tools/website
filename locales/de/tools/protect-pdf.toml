      übereinstimmen, bevor der Knopf freigegeben wird. Lassen Sie beide leer,
      wenn Sie nur Einschränkungen für ein Dokument möchten, das sich
      weiterhin für jeden öffnet."""

[[howto]]
title = "Haken Sie die Einschränkungen an, wenn Sie welche möchten."
body = """

      Drucken, Text und Bilder herauskopieren und das Dokument verändern. Das
      sind Bitten, die sich gut benehmende Leseprogramme beachten, keine
      Verschlüsselung, und die Seite sagt das neben den Kästchen. Ein
      Besitzerpasswort hebt sie auf; lassen Sie dieses Feld leer, übernimmt
      das Öffnungspasswort beide Aufgaben, und setzen Sie gar kein Passwort,
      wird ein zufälliges verwendet und weggeworfen, damit sich die
      Einschränkungen nicht aufheben lassen, indem man einfach nichts
      eingibt."""

[[howto]]
title = "Schützen Sie es, und lesen Sie die Zeile, die sagt, dass geprüft wurde."
body = """

      Das Dokument wird unter einem frischen Schlüssel chiffriert
      hinausgeschrieben. Dann wird die fertige Datei hier zweimal noch einmal
      geöffnet, einmal ohne Passwort, wo sie abgelehnt werden muss, und einmal
      mit Ihrem, wo sie sich mit derselben Seitenzahl öffnen muss. Schlägt
      eine der beiden Prüfungen fehl, bekommen Sie keinen Download und eine
      Meldung, die das sagt."""

[[faq]]
q = "Ist ein passwortgeschütztes PDF wirklich sicher?"
a = """
        Mit der Voreinstellung hier ja, genau so sicher wie das Passwort:
        AES-256 mit dem Passwort-Hash von PDF 2.0 ist das aktuelle Verfahren,
        und es gibt keine Abkürzung hindurch. Wissenswert ist, dass nicht jedes
        &bdquo;passwortgeschützte&ldquo; PDF so entstanden ist. Das Format hat
        fünf Generationen hinter sich, von einem 40-Bit-Schlüssel aus dem Jahr
        1994, den ein Laptop schlicht durchsuchen kann, bis zu diesem hier,
        und Leseprogramme melden sie alle mit denselben Worten. Diese Seite
        schreibt das stärkste und nennt das andere, das sie schreiben kann,
        beim Namen."""

[[faq]]
q = "Was ist der Unterschied zwischen dem Passwort und den Einschränkungen?"
a = """
        Ein PDF hat Platz für zwei Passwörter. Das <em>Benutzerpasswort</em>
        ist das, nach dem ein Leseprogramm fragt; ohne es öffnet sich die Datei
        nicht, und das ist echt. Das <em>Besitzerpasswort</em> hebt die
        <em>Einschränkungen</em> auf, also Drucken, Kopieren, Bearbeiten, und
        die sind eine Bitte. Ein Dokument, das sich ohne Passwort öffnet, muss
        alles enthalten, was zum Ableiten seines eigenen Schlüssels nötig ist.
        Das Einzige, was ein Leseprogramm also vom Drucken abhält, ist ein
        Feld, das es zu beachten versprochen hat, und jedes Leseprogramm darf
        das ablehnen. Der <a href=\"../pdf-entsperren/\">PDF-Entsperrer</a>
        auf dieser Website ist eines, das ablehnt. Setzen Sie Einschränkungen,
        um zu sagen, was Sie sich wünschen; setzen Sie ein Passwort, um
        sicherzugehen."""

[[faq]]
q = "Was ist, wenn ich das Passwort vergesse?"
a = """
        Dann ist das Dokument verloren, und das hören Sie besser hier als von
        einer Website zur &bdquo;Passwort-Wiederherstellung&ldquo;, die zuerst
        Ihre Datei nimmt. Nichts auf dieser Website errät Passwörter, Sie
        können <code>src/shared/pdf-crypt.js</code> lesen und sehen, dass
        darin keine Schleife ist, und bei einem Dokument, das mit dem
        voreingestellten Verfahren gesperrt ist, hätte nichts Ehrliches
        irgendwo Erfolg. Deshalb verlangt die Seite das Passwort zweimal.
        Heben Sie Ihr Original auf: Es wird hierdurch nicht verändert, und es
        ist die Kopie, die Sie brauchen, falls das Passwort je verloren
        geht."""

[[faq]]
q = "Soll ich AES-256 oder AES-128 wählen?"
a = """
        AES-256, es sei denn, ein Leseprogramm von vor 2010 muss die Datei
        öffnen. Die 256-Bit-Option ist das Verfahren von PDF 2.0, das Acrobat
        X und neuer, jeder Browser, jedes Telefon und jedes aktuelle
        Leseprogramm verstehen. Die 128-Bit-Option ist das Verfahren von 2005,
        das diese älteren Leseprogramme kennen, und sie ist schwächer, nicht
        wegen der Chiffre, sondern wegen der Schlüsselableitung von 1994 davor,
        die das Erraten eines Passworts weit billiger macht, als die Chiffre
        vermuten lässt. Wenn Sie nicht wissen, welches Leseprogramm die Datei
        öffnen wird, wählen Sie 256."""

[[faq]]
q = "Kann ich ein PDF schützen, das schon geschützt ist?"
a = """
        Wenn es sich ohne Passwort öffnet und nur Einschränkungen trägt, ja:
        Legen Sie es ab, und was Sie setzen, ersetzt das Vorhandene. Wenn es
        zum Öffnen ein Passwort verlangt, weist diese Seite es ab und zeigt auf
        den <a href=\"../pdf-entsperren/\">PDF-Entsperrer</a>, der den alten
        Schutz im selben Browser abnimmt; bringen Sie die entsperrte Kopie für
        den neuen hierher zurück. Zwei Sperren auf einem Dokument kann das
        Format nicht ausdrücken, ein Passwort zu ändern heißt also immer: erst
        abnehmen, dann neu setzen."""

[[faq]]
q = "Sieht das Dokument danach anders aus?"
a = """
        Nein. Nichts wird neu gerendert, neu kodiert oder neu umbrochen: Die
        Zeichenanweisungen jeder Seite, jede eingebettete Schrift und jedes
        Bild werden genau so übernommen, wie sie ankamen, nur chiffriert. Für
        alle, die das Passwort haben, bleibt Text markierbar, Scans behalten
        ihre ursprüngliche Auflösung, und nichts verrutscht. Die Datei kann
        etwas kleiner herauskommen, weil ein Neuschreiben die überholten
        Kopien von Objekten zurücklässt, die frühere Bearbeitungen darin
        hinterlassen haben, und etwas größer, wo die Verschlüsselung jedem
        Stream sechzehn Bytes hinzufügt."""

[[faq]]
q = "Was passiert mit einem signierten Dokument?"
a = """
        Seine Signatur ist danach nicht mehr gültig, und daran führt kein Weg
        vorbei. Eine Signatur deckt genau die Bytes der Datei ab, auf die sie
        angewendet wurde, jede Änderung überhaupt, durch jedes Programm, auch
        das, das signiert hat, macht sie also ungültig. Dieses Werkzeug
        schreibt eine neue Datei, bemerkt, wenn das Original signiert war, und
        sagt es beim Ergebnis. Wenn Sie ein Dokument brauchen, das signiert
        und geschützt ist, schützen Sie es zuerst und signieren Sie die
        geschützte Kopie."""

[[faq]]
q = "Werden meine Dokumente oder Passwörter irgendwohin hochgeladen?"
a = """
        Nein. Die Datei wird von Ihrem eigenen Browser auf Ihrer eigenen
        Hardware gelesen, verschlüsselt und geschrieben, und das Passwort geht
        in eine Schlüsselableitung, die in diesem Tab läuft. Dieses Werkzeug
        hat keine Serverseite, und in der <code>Content-Security-Policy</code>
        der Seite steht jede Adresse, die sie kontaktieren darf; keine davon
        gehört dieser Website. Am einfachsten überzeugen Sie sich, indem Sie
        die Netzverbindung trennen und die Seite trotzdem benutzen. Bei diesem
        Werkzeug von allen ist das der Punkt: Ein Dokument, das Sie sperren,
        ist eines, das Sie vorher lieber nicht herumreichen."""

[[faq]]
q = "Woher weiß ich, dass der Schutz wirklich drauf ist?"
a = """
        Weil das Werkzeug es auf Ihrem Gerät prüft und Ihnen das Ergebnis
        zeigt. Ist die Datei geschrieben, wird sie demselben Leser übergeben,
        den die anderen PDF-Werkzeuge dieser Website benutzen, und zwar
        zweimal. Ohne Passwort muss er sie rundheraus ablehnen; mit dem
        Passwort, das Sie gesetzt haben, muss sie sich öffnen, mit derselben
        Seitenzahl zurückkommen und die Einschränkungen melden, die Sie
        angehakt haben. Schlägt eine der beiden Prüfungen fehl, gilt der
        Durchlauf als gescheitert, und es wird nichts zum Herunterladen
        angeboten. Nachprüfen können Sie es anschließend auch selbst: Öffnen
        Sie die Datei in einem beliebigen Leseprogramm, das nach dem Passwort
        fragen wird, und sehen Sie in den Dokumenteigenschaften nach den
        Berechtigungen."""

[[faq]]
q = "Gibt es eine Größenbeschränkung, und kostet es etwas?"
a = """
        In das Werkzeug ist keine Grenze geschrieben. Die Grenze ist Ihr
        eigenes Gerät: Das Dokument liegt während der Bearbeitung im Speicher,
        ein Laptop nimmt also ein paar hundert Megabyte klaglos hin und kommt
        irgendwo darüber ins Straucheln. Es ist kostenlos, es gibt kein Konto,
        keine Anmeldung und keine Testphase. Die Seite trägt Werbung, und die
        bezahlt sie; die Werbung bekommt nichts über Ihre Dokumente."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie danach die
        Internetverbindung, und sie arbeitet weiter. Das ist zugleich der
        einfachste Weg zu prüfen, dass nichts hochgeladen wird: Ein Werkzeug,
        das Ihr Dokument zum Verschlüsseln wegschickt, bliebe in dem Moment
        stehen, in dem Sie den Stecker ziehen."""

