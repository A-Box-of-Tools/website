[[privacy]]
title = "Das eine Werkzeug, bei dem ein Upload den Zweck zunichtemachte."
body = """

      Ein Dokument, das ein Passwort verdient, ist per Definition eines, das
      Sie nicht in fremden Händen sehen möchten. Jedes Online-Werkzeug, das
      anbietet, es zu schützen, verlangt zuerst, dass Sie es abgeben, erst das
      ungeschützte Original und dann das Passwort, das Sie gewählt haben, an
      einen Server, dessen Aufbewahrung Sie nicht einsehen können. Diese Seite
      kann das nicht. Die Datei wird von Ihrem eigenen Browser gelesen, der
      Schlüssel wird in diesem Tab abgeleitet, die verschlüsselte Kopie wird im
      Arbeitsspeicher geschrieben, und in der
      <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
      sie kontaktieren darf; keine davon gehört dieser Website. Trennen Sie
      die Netzverbindung, und es arbeitet weiter, und einen einfacheren Beweis
      gibt es nicht."""

[[privacy]]
title = "Ein Passwort ist echt. Eine Einschränkung ist eine Bitte. Die Seite hält beides auseinander."
body = """

      Ein <em>Öffnungspasswort</em> sperrt das Dokument wirklich: Der Inhalt
      wird mit einem daraus abgeleiteten Schlüssel chiffriert, das Passwort
      steht nirgends in der Datei, und wer es nicht hat, liest kein Wort.
      <em>Einschränkungen</em>, also kein Drucken, kein Kopieren, kein
      Bearbeiten, sind etwas anderes. Ein Dokument, das sich ohne Passwort
      öffnet, muss alles enthalten, was zum Ableiten seines eigenen Schlüssels
      nötig ist. Was ein Leseprogramm also vom Drucken abhält, ist ein
      Berechtigungsfeld, das es zu beachten verspricht, und jedes Leseprogramm
      darf das ablehnen. Adobe hat das von Anfang an so dokumentiert, und der
      <a href=\"../pdf-entsperren/\">PDF-Entsperrer</a> auf dieser Website ist
      eines der Programme, die ablehnen. Einschränkungen lohnen sich trotzdem:
      Mit ihnen sagen Sie, was Sie sich wünschen, und die meisten Leseprogramme
      hören darauf. Sie sind nur keine Sperre, und diese Seite behauptet das
      auch nicht."""

[[privacy]]
title = "AES-256, das aktuelle Verfahren, es sei denn, Sie wählen das ältere."
body = """

      Die PDF-Verschlüsselung hat fünf Generationen hinter sich, und
      Leseprogramme melden sie alle als &bdquo;passwortgeschützt&ldquo;. Die
      Voreinstellung hier ist die neueste: AES-256 mit dem Passwort-Hash von
      PDF 2.0, der absichtlich teuer zu berechnen ist, und das einzige
      Verfahren der Familie, das noch als stark gilt. Ein so gesperrtes
      Dokument ist so gut wie das Passwort darauf. Der eine Grund, die andere
      Option zu wählen, AES-128 mit der Schlüsselableitung von 1994, ist ein
      Leseprogramm von vor 2010, das die Datei öffnen muss, und die Seite sagt
      das neben der Auswahl, statt das schwächere Verfahren als gleichwertig
      neben das stärkere zu stellen."""

[[privacy]]
title = "Das Passwort wird zweimal verlangt, weil es keinen Weg zurück gibt."
body = """

      Nichts auf dieser Website errät Passwörter, und nichts Ehrliches anderswo
      tut es: Ein Dokument, das mit einem starken Verfahren und einem Passwort
      gesperrt ist, an das sich niemand erinnert, ist ein Dokument, das niemand
      mehr lesen wird. Deshalb wird das Öffnungspasswort zweimal eingetippt,
      die beiden müssen übereinstimmen, und die Seite sagt einmal in klaren
      Worten, dass ein vergessenes Passwort eine verlorene Datei bedeutet.
      Heben Sie Ihr Original auf. Daran ändert sich hier nichts."""

[[privacy]]
title = "Die fertige Datei wird hier noch einmal geöffnet, bevor sie Ihnen angeboten wird."
body = """

      Bis das geschieht, korrigiert dieses Werkzeug mit allem oben nur seine
      eigene Hausaufgabe. Also werden die Bytes, die gleich Ihr Download
      werden, demselben Leser übergeben, den jedes PDF-Werkzeug dieser Website
      benutzt, und zwar zweimal: einmal ohne Passwort, wo er ablehnen muss, und
      einmal mit dem Passwort, das Sie gesetzt haben, wo er öffnen und mit
      derselben Seitenzahl und den gewünschten Einschränkungen zurückkommen
      muss. Eine Datei, die eine der beiden Prüfungen nicht besteht, wird als
      gescheitert gemeldet, ohne Download."""

[[privacy]]
title = "Die Seiten selbst werden nicht neu gerendert, neu kodiert oder neu umbrochen."
body = """

      Was sich ändert, ist die Verschlüsselung um das Dokument herum, nicht das
      Dokument. Die Zeichenanweisungen jeder Seite, jede eingebettete Schrift
      und jedes Bild werden genau so hinausgeschrieben, wie sie ankamen, nur
      chiffriert. Text bleibt also markierbar und durchsuchbar für alle, die
      das Passwort haben, Scans behalten die Auflösung, mit der sie gescannt
      wurden, und auf keiner Seite verrutscht etwas. Das eine, was sich doch
      ändert, ändert jedes Neuschreiben: Ältere, überholte Kopien von
      Objekten, die frühere Bearbeitungen zurückgelassen haben, werden nicht
      übernommen."""

[[privacy]]
title = "Eine digitale Signatur übersteht das nicht, und die Seite sagt es, wenn eine da ist."
body = """

      Eine Signatur deckt genau die Bytes der Datei ab, auf die sie angewendet
      wurde, jedes Neuschreiben macht sie also ungültig; genau dafür ist eine
      Signatur da. Dieses Werkzeug schreibt eine neue Datei, die Kopie, die
      Sie zurückbekommen, ist also unsigniert, und es sagt das beim Ergebnis,
      wenn es eine Signatur findet, vor der es warnen muss. Ihr Original ist
      weiterhin das signierte. Wenn Sie beides brauchen, signieren Sie nach
      dem Schützen, nicht davor."""

[[privacy]]
title = "Ein Dokument, das schon gesperrt ist, wird erst nebenan geschickt."
body = """

      Eine Datei, die zum Öffnen ein Passwort braucht, wird hier nicht mit
      einem Passwort über dem Passwort noch einmal gesperrt. Sie wird
      abgewiesen, mit einem Link zum
      <a href=\"../pdf-entsperren/\">PDF-Entsperrer</a>, der den alten Schutz
      im selben Browser abnimmt, und die entsperrte Kopie kommt für den neuen
      hierher zurück. Eine Datei, die sich für jeden öffnet und nur
      Einschränkungen trägt, wird angenommen, und Sie erfahren klar, dass das,
      was Sie setzen, das Vorhandene ersetzt."""

[[privacy]]
title = "Was Google lädt und was es nicht bekommt."
body = """
 Die Skripte für Werbung
      und Messung kommen von Google. Keines von beiden bekommt irgendetwas über
      Ihr Dokument: keine Datei, keine Seite, keinen Namen, keine Größe, keine
      Seitenzahl, kein Passwort und nicht, womit die Datei geschützt war. Jede
      Zeile, die ein PDF liest, verschlüsselt oder schreibt, wird von dieser
      Domain ausgeliefert und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Knopf lädt und was er nicht bekommt."
body = """

      Der Knopf &bdquo;Buy me a coffee&ldquo; im Kopfbereich wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Er ist ein Link und sonst nichts: Er meldet keinen Besuch,
      und er bekommt nichts über Sie oder Ihre Dokumente. Es passiert nichts,
      bis Sie ihn anklicken, und dann sind Sie auf einer fremden Seite."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht: Ein
      Werkzeug, das Ihr Dokument zum Verschlüsseln wegschickt, bliebe
