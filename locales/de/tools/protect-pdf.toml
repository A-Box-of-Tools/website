[[howto]]
title = "Wählen Sie das PDF."
body = """
 Ein Dokument nach dem anderen. Der Browser
      liest es direkt von Ihrer Festplatte, und es wird hier geöffnet. Ein
      Dokument, das schon ein Passwort braucht, wird mit einem Link zum
      Entsperrer abgewiesen; eines, das nur Einschränkungen trägt, wird
