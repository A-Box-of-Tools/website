[[faq]]
q = "Werden die Passwörter irgendwohin gesendet oder gespeichert?"
a = """
        Weder noch. Sie entstehen in Ihrem Browser, auf Ihrem eigenen Gerät, und
        Netzfunktionen hat dieses Werkzeug überhaupt keine. Es ruft nie etwas ab
        und sendet nie etwas. Gespeichert wird ebenso wenig: kein localStorage,
        kein Cookie, kein Verlauf. Laden Sie die Seite neu, und jedes Passwort,
        das sie Ihnen gezeigt hat, ist fort, vom Schirm und aus ihrem eigenen
        Speicher. In der <code>Content-Security-Policy</code> der Seite steht
        jede Adresse, die sie kontaktieren darf, und keine davon gehört uns. Es
        gibt also gar keinen Ort, an dem ein Passwort landen könnte, selbst wenn
        etwas es versuchte."""

[[faq]]
q = "Woher kommt der Zufall?"
a = """
        Aus <code>crypto.getRandomValues</code>, dem Generator, den Browser für
        kryptografische Zwecke bereitstellen, gespeist aus dem Entropiepool Ihres
        Betriebssystems. Es ist dieselbe Quelle, aus der ein Browser das
        Schlüsselmaterial für TLS zieht. <code>Math.random</code> wird in diesem
        Werkzeug nirgends verwendet, und dieser Unterschied ist keine
        Wortklauberei. <code>Math.random</code> ist ein schneller arithmetischer
        Generator, dessen kompletter interner Zustand sich aus wenigen
        aufeinanderfolgenden Ausgaben rekonstruieren lässt. Ein Passwort-Generator
        auf dieser Grundlage erzeugt Passwörter, die zufällig aussehen und von
        jedem aufgezählt werden können, der eines davon gesehen hat."""

[[faq]]
q = "Ist ein Passwort aus dem Browser so gut wie eines aus einem Desktop-Programm?"
a = """
        Was den Zufall angeht, ja. Es ist in beiden Fällen dieselbe Quelle des
        Betriebssystems, nur durch eine andere Tür erreicht. Verschieden ist, was
        sonst im Raum steht. Ein Browser-Tab läuft neben Ihren Erweiterungen, und
        eine Erweiterung mit der Berechtigung, Seiten zu lesen, kann auch diese
        lesen. Das gilt für jeden webbasierten Generator, diesen eingeschlossen,
        und es ist der ehrliche Grund, den eingebauten Generator Ihres
        Passwortmanagers zu nehmen, wenn Sie einen haben. Es ist dieselbe
        Rechnerei, nur in einem Prozess, neben dem weniger steht. Diese Seite ist
        für den Fall, dass Sie keinen zur Hand haben."""

[[faq]]
q = "Passwort oder Passphrase, was soll ich nehmen?"
a = """
        Ein Passwort für alles, was ein Passwortmanager für Sie eintippt, denn
        Sie werden es nie ansehen und Länge kostet dort nichts. Eine Passphrase
        für die wenigen Dinge, die Sie aus dem Kopf tippen oder laut vorlesen
        müssen: das Hauptpasswort des Passwortmanagers, den Schlüssel einer
        Festplattenverschlüsselung, ein Gerät, das Sie aus der Ferne einrichten.
        Sechs Wörter aus der langen Liste sind 77 Bit, also stärker als ein
        zufälliges Passwort aus zwölf Zeichen, und um ein Vielfaches leichter um
        vier Uhr morgens richtig einzugeben."""

[[faq]]
q = "Wie lang sollte ein Passwort sein?"
a = """
        Zwanzig Zeichen über den vollen Zeichensatz sind rund 130 Bit und damit
        jenseits des Punktes, an dem Länge noch das Problem wäre. Sechzehn genügt
        völlig. Zwölf ist die Untergrenze für alles, dessen Verlust Sie ärgern
        würde, und zwar die Untergrenze und nicht das Ziel. Darunter verlassen
        Sie sich darauf, dass die Seite es ordentlich gespeichert hat, und das
        ist nach zwanzig Jahren Meldungen über Datenlecks keine gute Wette. Länge
        schlägt jede andere Einstellung auf dieser Seite. Ein Zeichen mehr bringt
        mehr als jede Regel darüber, welche Zeichen vorkommen müssen."""

[[faq]]
q = "Aus wie vielen Wörtern sollte eine Passphrase bestehen?"
a = """
        Aus sechs der langen Liste, und aus sieben, wenn sie andere Passwörter
        schützt. Das berühmte Bild mit vier Wörtern stammt aus dem Jahr 2011, ist
        51 Bit wert und liegt heute in Reichweite eines ernsthaften Angriffs
        außerhalb der Leitung. Fünf sind 64 Bit. Sechs sind 77, und das ist mehr,
        als ein Angreifer je für ein gewöhnliches Konto aufwenden wird. Jedes
        weitere Wort aus der langen Liste bringt 12,9 Bit, und nur die Wörter
        bringen überhaupt etwas. Die Bindestriche und die Großbuchstaben nicht."""

[[faq]]
q = "Was ist ein &bdquo;Bit&ldquo;, und warum zählt diese Seite sie?"
a = """
        Ein Bit ist eine Verdopplung. Sechzig Bit heißt, dass es 2^60 gleich
        wahrscheinliche Ergebnisse gab, die diese Seite hätte hervorbringen
        können. Wer also genau weiß, wie sie arbeitet, hat immer noch so viele
        durchzuprobieren. Es ist eine Eigenschaft des <em>Verfahrens</em> und
        nicht der Zeichenkette, und die Seite kann sie exakt angeben, weil sie
        diejenige war, die gewählt hat, und weiß, wie viele Wahlen sie getroffen
        hat. Genau das unterscheidet die Zahl von dem bunten Balken auf einem
        Anmeldeformular, der die Zeichen ansieht und rät. Auf diesem Balken
        schneidet <code>correct horse battery staple</code> schlecht ab und ist
        44 Bit wert, während <code>P@ssw0rd!</code> gut abschneidet und so gut wie
        nichts wert ist."""

[[faq]]
q = "Warum macht &bdquo;muss ein Sonderzeichen enthalten&ldquo; ein Passwort schwächer?"
a = """
        Weil eine Regel immer nur Möglichkeiten wegnehmen kann. Wer mindestens
        ein Zeichen aus jedem Satz verlangt, schließt jedes Passwort aus, in dem
        zufällig keines vorkam, und eine kleinere Menge möglicher Passwörter ist
        eine kleinere Menge zum Durchsuchen. Der Effekt ist gering, bei üblicher
        Länge etwa ein halbes Bit, und er ist real, und diese Seite zieht ihn ab,
        statt die schmeichelhaftere Zahl zu nennen. Er wird exakt bestimmt,
        indem die Passwörter gezählt werden, die die Regel tatsächlich zulässt,
        und nicht die, die sie ausschließt."""

[[faq]]
q = "Welche Wortliste ist das, und macht es etwas aus, dass ein Angreifer sie herunterladen kann?"
a = """
        Es sind die Diceware-Listen der Electronic Frontier Foundation,
        unverändert mitgeliefert: 7.776 Wörter in der langen, 1.296 in der
        kurzen. Sie wurden für genau diesen Zweck gebaut, also ohne Anstößiges,
        ohne Gleichklinger, ohne Paare, die zusammengeschrieben ein drittes Wort
        ergeben, und in der kurzen Liste ohne Wort, das der Anfang eines anderen
        ist. Und nein, dass die Liste öffentlich ist, macht nichts aus. Die hier
        genannte Stärke setzt voraus, dass ein Angreifer sie hat, den Quelltext
        dieser Seite liest und jede Einstellung kennt, die Sie verwendet haben.
        Das Einzige, was er nicht weiß, ist, welches der 7.776 Wörter jedes Mal
        gezogen wurde. Diese Annahme ist es, die die Zahl vertrauenswürdig
        macht."""

[[faq]]
q = "Ist eine Passphrase nicht bloß ein Wörterbuchangriff mit Ansage?"
a = """
        Nicht, wenn die Wörter so gewählt werden. Ein Wörterbuchangriff
        funktioniert gegen Sätze, die <em>Menschen</em> sich ausdenken, weil
        Menschen Wörter wählen, die zusammenpassen, in einer Reihenfolge, die
        Sinn ergibt, aus den paar tausend, die sie täglich benutzen. Diese Seite
        zieht jedes Wort unabhängig und gleichverteilt aus einer festen Liste,
        ohne Rücksicht darauf, ob das Ergebnis sich gut liest, weshalb es das
        meist nicht tut. Ein Angreifer, der die Liste und die Länge kennt, steht
        trotzdem vor 7.776 hoch der Anzahl der Wörter."""

[[faq]]
q = "Kann ich ein Passwort zurückbekommen, nachdem ich die Seite verlassen habe?"
a = """
        Nein, und das ist Absicht. Nirgendwo wird etwas festgehalten, es gibt
        also nichts zurückzuholen: kein Verlaufsfenster, keine Liste
        &bdquo;zuletzt erzeugt&ldquo;, keinen Zwischenspeicher. Ein Generator,
        der Ihnen das Passwort vom vergangenen Dienstag zeigen könnte, wäre ein
        Generator, der es gespeichert hat, und dort gespeichert, wo Sie
        herankommen, heißt dort gespeichert, wo auch anderes herankommt. Kopieren
        Sie es in einen Passwortmanager, bevor Sie weiterklicken."""

[[faq]]
q = "Ist das Kopieren in die Zwischenablage sicher?"
a = """
        Es ist das gewöhnliche Risiko, und es lohnt sich, es zu kennen, statt
        sich davor zu fürchten. Die Zwischenablage teilen Sie mit allem, was
        unter Ihrem Benutzerkonto läuft, sie überdauert meist bis zum nächsten
        Kopieren, und in manchen Konfigurationen wird sie zwischen Geräten
        abgeglichen. Das ist ein guter Grund, das Passwort sofort dort
        einzufügen, wo es hingehört, und danach etwas anderes zu kopieren, und
        kein Grund, stattdessen ein schwächeres Passwort von Hand zu tippen.
        Diese Seite kann Ihre Zwischenablage nicht lesen. Sie kann nur
        hineinschreiben, und nur, wenn Sie den Knopf drücken."""

[[faq]]
q = "Darf ich dasselbe an mehreren Stellen verwenden?"
a = """
        Nein, und das ist der eine Rat auf dieser Seite, der über allen anderen
        steht. Fast jedes übernommene Konto wird mit einem Passwort übernommen,
        das vorher woanders richtig war. Eine Seite wird angegriffen, die Liste
        wird veröffentlicht, und dieselbe Adresse mit demselben Passwort wird
        überall durchprobiert. Ein eigenes Passwort je Seite macht aus einem
        Datenleck ein einzelnes Konto statt aller, und genau darum lohnt sich ein
        Passwortmanager, und nicht wegen der Stärke der einzelnen Passwörter
        darin."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, es gibt kein Konto, keine Anmeldung, keine Testphase
        und keine Grenze dafür, wie viele Sie erzeugen. Bezahlt wird die Seite
        über Werbung. Den Anzeigen wird überhaupt nichts darüber übergeben, was
        hier entsteht, auch nicht, wie lang oder wie stark es war."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die
        Internetverbindung, und sie erzeugt weiter Passwörter. Der Zufall kommt
        von Ihrem eigenen Gerät, und die Wortliste liegt bereits in der Seite.
        Das ist zugleich der einfachste Beweis dafür, dass nichts abgerufen und
        nichts gesendet wird. Ein Generator, der seine Zahlen bei einem Server
        holt, bliebe in dem Moment stehen, in dem Sie den Stecker ziehen."""

