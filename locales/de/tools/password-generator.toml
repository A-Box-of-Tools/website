[[privacy]]
title = "Das Passwort entsteht dort, wo Sie das hier lesen."
body = """
 Es wird auf dieser
      Seite gezogen, von dieser Seite, aus dem Zufall, den Ihr eigenes
      Betriebssystem dem Browser übergibt. Für die Erzeugung wird nichts
      angefragt, und wenn es fertig ist, wird nichts gemeldet. In der
      <code>Content-Security-Policy</code> steht jede Adresse, die diese Seite
      kontaktieren darf, und keine einzige davon gehört uns. Es gibt hier keinen
      Endpunkt, an dem ein erzeugtes Passwort landen könnte, und im Code steht
      auch nichts, das es dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Die Wortliste wird
