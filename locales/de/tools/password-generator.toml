[[privacy]]
title = "Der Zufall ist der des Browsers, und es ist die richtige Sorte."
body = """
 <code>crypto.getRandomValues</code>
      ist der Generator, den Browser für Schlüssel und Token bereitstellen, vom
      Betriebssystem gespeist und immer wieder neu gespeist.
      <code>Math.random</code> kommt in diesem Ordner nirgends vor, und es wäre
      ein echter Fehler, wenn doch. Sein interner Zustand lässt sich aus einer
      Handvoll Ausgaben rekonstruieren, womit jedes Passwort, das er je erzeugen
