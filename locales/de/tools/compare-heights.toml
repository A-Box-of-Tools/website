pledge = """
    Ein Größendiagramm ist Rechnen und eine Zeichnung: Es gibt keine Datei zu
    verschicken und keinen Dienst zu fragen. Der Mann, die Frau, der Junge und
    das Mädchen sind gemeinfreie Zeichnungen, die mit dieser Seite ausgeliefert
    werden; das Kleinkind wird hier aus einer Tabelle von Körperproportionen
    aufgebaut, und deshalb sieht es aus wie ein Kleinkind und nicht wie ein
    kleiner Erwachsener. Jeder Schritt davon passiert in rund sechshundert
    Zeilen JavaScript auf dieser Seite, die Sie lesen können. Eine Netzfunktion
    gibt es überhaupt nicht, und das ist hier wichtig, denn was Sie eintippen,
    ist eine Liste von Menschen und wie groß jeder davon ist."""

