name = "Audio-Schneider"
heading = "Audio&nbsp;schneiden <span class=\"h1-kw\">&mdash; Tonaufnahmen online kürzen</span>"
tagline = "Markieren Sie beim Abspielen, was bleiben soll. Zurück kommt eine Datei, geschnitten genau dort, wo Sie es gesagt haben."

title = "Audio online schneiden &mdash; nur die guten Teile behalten, ohne Upload"
description = "Eine Aufnahme abspielen und im Vorbeigehen jeden Teil markieren, der bleiben soll, und diese Teile dann als eine Datei speichern. Samplegenaue Schnitte, kein Knacken an den Übergängen, kein Upload."
og_title = "Audio-Schneider &mdash; nur die gewünschten Teile behalten, ohne etwas hochzuladen"
og_description = "Drücken Sie beim Abspielen I und O, um jeden Teil zu markieren, der bleiben soll. Die markierten Teile werden als eine Datei zurückgeschrieben, auf das genaue Sample geschnitten, ohne dass etwas hochgeladen wird."
og_image_alt = "Audio-Schneider - die gewünschten Teile markieren und als eine Aufnahme speichern, im Browser"

pledge = """
    Ihre Aufnahme wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware
    gelesen, markiert, geschnitten und geschrieben. Abrufen oder senden kann hier
    nichts, denn eine Netzfunktion hat dieses Werkzeug überhaupt nicht. Und selbst
    wenn es einen Weg nach draußen gäbe, stünde am anderen Ende dieser Seite kein
    Server, an den eine Aufnahme gehen könnte."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und schneiden Sie etwas. Keine einzige Anfrage
      trägt ein Sample, einen Dateinamen oder ein Byte dessen, was Sie ausgewählt
      haben. Oder trennen Sie die Internetverbindung und schneiden Sie trotzdem
      eine Aufnahme. Ein Werkzeug, das Ihren Ton zum Schneiden wegschickt, bliebe
      dabei einfach stehen."""

read_first = """
, <code>src/segments.js</code> für die Marken und die
      Datei, in der sie landen, <code>src/decode.js</code> für die zwanzig Zeilen,
      die Ihre Datei dem Dekoder des Browsers übergeben, <code>src/trim.js</code>
      für die Rechnung, die aus einer Marke einen Sample-Abschnitt macht, und für
      die Schleife, die ihn kopiert, sowie <code>src/wav.js</code> für den Kopf,
      der davor geschrieben wird. Keines davon importiert etwas, das eine Anfrage
      stellen könnte."""

howto_heading = "So schneiden Sie eine Audiodatei"

card = """
            Markieren Sie beim Abspielen jeden Teil, der bleiben soll, und
            speichern Sie sie dann als eine Aufnahme. Die Schnitte landen auf dem
            genauen Sample, und die Übergänge knacken nicht."""

