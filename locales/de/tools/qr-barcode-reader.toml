#
# QR- & Barcode-Scanner - German.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "Scannen" rather than "lesen" throughout. Reading a code is what the program
# does; scannen is what a German speaker calls the thing they are doing, and it
# is what they type into a search box.
#
# The format names stay as they are - EAN-13, UPC-A, ITF-14, Code 128, Code 39,
# ISO/IEC 18004 - because those are the names on the specification and on
# whatever is going to scan the label.
#

name = "QR- & Barcode-Scanner"
heading = "QR-Code&nbsp;&amp;&nbsp;Barcode scannen <span class=\"h1-kw\">&mdash; aus einem Bild oder mit der Kamera</span>"
tagline = "Halten Sie die Kamera drauf oder legen Sie ein Bild ab. Gelesen wird es hier und nirgendwo sonst."

title = "QR-Code-Scanner &amp; Barcode-Leser &mdash; aus einem Bild, ohne Upload"
description = "Einen QR-Code aus einem Foto, einem Screenshot oder mit der Kamera scannen und sehen, wohin der Link wirklich führt, bevor Sie ihn öffnen. Auch EAN, UPC, Code 128, Code 39 und ITF. Nichts wird hochgeladen."
og_title = "Einen QR-Code lesen, ohne das Bild irgendjemandem zu schicken"
og_description = "Scannen Sie einen QR-Code aus einem Bild oder mit der Kamera und sehen Sie die vollständige Adresse, bevor Sie entscheiden, ob Sie sie öffnen. Das Bild verlässt Ihr Gerät nicht, und kein Kamerabild wird aufgezeichnet."
og_image_alt = "QR- & Barcode-Scanner - einen Code aus Bild oder Kamera lesen, ohne Upload"

pledge = """
    Einen Code zu lesen ist Rechnerei über Pixeln, und die Pixel sind schon hier.
    Das Symbol finden, den Blickwinkel herausrechnen, die Maske rückgängig
    machen, das Beschädigte per Reed-Solomon reparieren und die Bits wieder
    auslesen &mdash; das alles passiert in rund zweitausend Zeilen JavaScript auf
    dieser Seite, die Sie lesen können. <strong>Die Kamera ist dasselbe
    Versprechen, keine Ausnahme davon:</strong> ein Bild kommt als Pixel in
    diesem Tab an, wird untersucht und ist weg. Nichts wird aufgezeichnet, nichts
    aufgehoben, und diese Seite hat überhaupt keine Netzfunktion, mit der sich
    etwas verschicken ließe."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und scannen Sie einen Code bei laufender Kamera.
      Keine einzige Anfrage trägt ein Bild oder ein Zeichen des Inhalts. Oder
      trennen Sie die Internetverbindung und lesen Sie den Code trotzdem."""

read_first = """
, <code>src/binarize.js</code>
      und <code>src/detect.js</code> dafür, ein Symbol in einem Foto zu finden
      &mdash; der Schwellwert, die Suchmuster und die perspektivische
      Entzerrung &mdash;, <code>src/qr-decode.js</code> fürs Zurücklesen,
      <code>src/reed-solomon.js</code> fürs Reparieren des Falschgelesenen,
      <code>src/linear.js</code> für die gestreiften und
      <code>src/camera.js</code>, das jede Zeile dieser Seite ist, die eine
      Kamera anfasst."""

howto_heading = "So lesen Sie einen QR-Code, ohne das Bild hochzuladen"

card = """
            Einen QR-Code aus einem Foto, einem Screenshot oder mit der Kamera
            lesen &mdash; und die ganze Adresse sehen, bevor Sie sie öffnen.
            Barcodes auch."""

