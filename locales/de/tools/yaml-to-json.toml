pledge = """
    Umwandeln ist Rechnen auf einer Zeichenkette, und zwar hier, auf dieser
    Seite. Die beiden Parser sind von Hand geschrieben und liegen in
    <code>src/</code> &mdash; <code>shared/parse-yaml.js</code> und <code>shared/parse-json.js</code>
    &mdash; und mehr gibt es nicht. Eine Netzfunktion hat dieses Werkzeug
    überhaupt nicht, weder etwas abzurufen noch etwas zu senden. Das wiegt hier
    schwerer als fast überall sonst auf dieser Seite: Eine YAML-Datei ist meist
    eine Deployment-Konfiguration, und eine Deployment-Konfiguration steckt
    meist voller Hostnamen, Bucket-Namen und Geheimnisse."""

