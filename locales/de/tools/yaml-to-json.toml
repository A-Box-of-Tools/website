[[howto]]
title = "Lesen Sie den Fehler dort, wo der Fehler ist."
body = """
 Ein Parser, der
      hier scheitert, sagt, was er gefunden hat und in welcher Zeile und Spalte,
      statt &bdquo;unerwartetes Token an Position 4193&ldquo;. Das reicht
      üblicherweise, um eine Konfigurationsdatei zu reparieren, ohne sonst etwas
      zu öffnen."""

[[howto]]
title = "Nehmen Sie das Ergebnis mit."
body = """
 Kopieren Sie es, oder laden Sie es
      als Datei herunter, benannt nach dem Format, in dem es herauskam."""

[[faq]]
q = "Wird mein YAML irgendwohin hochgeladen?"
a = """
        Nein. Beide Parser und beide Schreiber auf dieser Seite sind Funktionen,
        die in Ihrem eigenen Browser auf Ihrer eigenen Hardware laufen. Eine
        Netzfunktion hat dieses Werkzeug überhaupt nicht &mdash; es ruft nie
        etwas ab und sendet nie etwas &mdash; und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört uns. Genau deshalb ist es das
        Werkzeug für eine Deployment-Konfiguration: Die stecken voller Hostnamen,
        Bucket-Namen und gelegentlich eines Geheimnisses, das jemand verschieben
        wollte, und eine davon in den Umwandler eines anderen einzufügen heißt,
        sie ihm zu geben."""

[[faq]]
q = "Was geht beim Umwandeln von YAML in JSON verloren?"
a = "JSON verliert Kommentare. Dieser Parser unterstützt bewusst nur eine Teilmenge von YAML 1.2 und lehnt Anker, Aliase und Tags ab, statt eine Auflösung oder Typumwandlung für Sie zu wählen. JSON stellt einen Wertebaum dar; YAML kann gemeinsame Knoten und typisierte Werte darstellen. Mehrdokument-Streams werden abgelehnt statt in ein erfundenes Array verpackt. JSON zu YAML erhält die dargestellten Werte. <a href=\"https://yaml.org/spec/1.2.2/\">Die YAML-Spezifikation</a> beschreibt das umfassendere Format."

[[faq]]
q = "In meinem YAML steht no, und im JSON kam eine Zeichenkette heraus. Warum?"
a = "YAML 1.1 las <code>yes</code>, <code>no</code>, <code>on</code> und <code>off</code> als Boolesche Werte und machte Norwegens Ländercode zu <code>false</code>. Diese unterstützte Teilmenge nutzt YAML 1.2: Diese Wörter bleiben Zeichenketten, <code>true</code> und <code>false</code> sind Boolesche Werte, <code>null</code> und <code>~</code> sind null, numerische Skalare sind Zahlen. Der YAML-Schreiber setzt mehrdeutige Wörter für ältere Leser in Anführungszeichen."

[[faq]]
q = "Bleibt die Reihenfolge meiner Schlüssel erhalten?"
a = """
        Ja, in beiden Richtungen, und das ist schwerer, als es klingt. Ein
        Umwandler, der auf <code>JSON.parse</code> aufbaut, zieht ganzzahlig
        aussehende Schlüssel stillschweigend nach vorn, aus
        <code>{"10":a,"2":b}</code> wird also <code>{"2":b,"10":a}</code>. Zahlen
        behalten die Ziffern, die Sie getippt haben, eine zwanzigstellige
        Kontonummer verliert ihre letzten drei also nicht an ein Double. Wenn Sie
        sie <em>sortiert</em> haben wollen, gibt es ein Kästchen dafür, und es
        sortiert danach, wie die Schlüssel sich lesen, und nicht nach ihren
        Codepunkten."""

[[faq]]
q = "Kann es mehrere YAML-Dokumente auf einmal umwandeln?"
a = """
        Nein, und es sagt das, statt sich eines auszusuchen. Eine Datei mit
        <code>---</code>-Trennern enthält mehr als ein Dokument, und JSON hat
        keine Form, die &bdquo;mehrere Dokumente&ldquo; bedeutet &mdash; ein
        Array wäre eine Behauptung, die die Datei nie aufgestellt hat. Wandeln
        Sie sie einzeln um."""

[[faq]]
q = "Warum gibt es hier keinen YAML-Formatierer?"
a = """
        Weil YAML keine gepresste Form hat, die sich zu schreiben lohnte &mdash;
        die kurze ist der Flow-Stil, der unlesbar ist, und unlesbar ist das
        Gegenteil des Grundes, eine Datei überhaupt in YAML zu halten. JSON, XML,
        HTML und CSS auszulegen, ist die Aufgabe des
        <a href="../json-formatieren/">JSON-Formatierers</a>, und er legt auch
        YAML aus."""

[[faq]]
q = "Wie groß darf die Datei sein?"
a = """
        Hier ist keine Grenze eingebaut, denn es gibt keinen Server, der dafür
        bezahlt. Die praktische Obergrenze ist Ihr eigenes Gerät: Ein paar
        Megabyte YAML sind unproblematisch, und bei einem sehr langen Dokument
        wartet die Seite auf eine Pause beim Tippen, bevor sie umwandelt, statt
        Ihnen die Tastatur streitig zu machen."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und keine Grenze dafür, wie viel Sie einfügen. Bezahlt wird die
        Seite über Werbung, und den Anzeigen wird nichts über Ihren Text
        übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird: Ein Werkzeug, das Ihre Konfiguration zum
        Umwandeln wegschickt, bliebe in dem Moment stehen, in dem Sie die
        Verbindung trennen."""

