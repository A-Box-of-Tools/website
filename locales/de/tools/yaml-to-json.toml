[[privacy]]
title = "Die Verarbeitung findet in diesem Browser statt."
body = "Dieses Werkzeug verarbeitet Eingaben und Ergebnisse im Browser. Sein Verarbeitungscode lädt sie nicht zur Verarbeitung hoch. Content-Security-Policy begrenzt Ressourcen und Verbindungsziele; erlaubte Hosts können jedoch Anfragen empfangen. Die Richtlinie prüft keine Nutzdaten und beweist allein keine ausbleibende Übertragung. Vergleichen Sie Quelltext und konkrete Anfragen oder führen Sie die lokale Operation ohne Verbindung aus."

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 In <code>src/</code> gibt es nirgends
      ein <code>fetch</code>, kein <code>XMLHttpRequest</code> und kein
      <code>sendBeacon</code>. Beide Parser und beide Schreiber sind Funktionen
      auf dieser Seite, die eine Zeichenkette nehmen und eine Zeichenkette
      zurückgeben."""

[[privacy]]
title = "Die unterstützte Teilmenge nutzt YAML-1.2-Skalarregeln."
body = """
 In YAML 1.1
      war <code>no</code> ein Wahrheitswert, und das ist der berühmte Fehler, der
      aus dem Ländercode für Norwegen <code>false</code> macht. Hier wird 1.2
      gelesen, wo es die Zeichenkette ist, nach der es aussieht. In der anderen
      Richtung werden diese Wörter <em>in Anführungszeichen</em>
      zurückgeschrieben, denn was die Datei als Nächstes öffnet, kann immer noch
      ein 1.1-Leser sein. <code>tests/js/text-convert.test.js</code> prüft beide
      Hälften."""

[[privacy]]
title = "Eine Umwandlung, die nicht ehrlich sein kann, hört lieber auf."
body = "JSON verliert Kommentare. Dieser Parser unterstützt bewusst nur eine Teilmenge von YAML 1.2 und lehnt Anker, Aliase und Tags ab, statt eine Auflösung oder Typumwandlung für Sie zu wählen. JSON stellt einen Wertebaum dar; YAML kann gemeinsame Knoten und typisierte Werte darstellen. Mehrdokument-Streams werden abgelehnt statt in ein erfundenes Array verpackt. JSON zu YAML erhält die dargestellten Werte."

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem von ihnen wird ein Zeichen Ihres Textes übergeben. Jede Zeile, die
      ihn liest, parst oder schreibt, kommt von dieser Domain selbst und steht im
      Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug arbeitet unverändert weiter, denn einen Netzschritt gab es darin
      nie. Einen einfacheren Beweis gibt es nicht."""

