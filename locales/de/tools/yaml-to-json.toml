title = "YAML-zu-JSON-Umwandler &mdash; in beide Richtungen, ohne Upload"
description = "Eine unterstützte Teilmenge von YAML 1.2 im Browser in JSON umwandeln und zurück. Anker, Aliase, Tags und mehrere Dokumente werden abgelehnt; Kommentare gehen in JSON verloren. Kein Upload."
