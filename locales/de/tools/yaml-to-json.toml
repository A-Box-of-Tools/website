[[howto]]
title = "Fügen Sie es ein, oder legen Sie die Datei ab."
body = """
 Alles, was sich
      markieren und kopieren lässt, funktioniert. Eine Datei, die Sie auf das
      Auswahlfeld ziehen, wird von Ihrem eigenen Browser gelesen und in das Feld
      gesetzt &mdash; es gibt keinen Upload-Schritt, den man weglassen müsste
      &mdash; und eine Endung <code>.json</code> oder <code>.yaml</code> stellt
      die Richtung gleich mit ein."""

[[howto]]
title = "Wählen Sie die Einrückung."
