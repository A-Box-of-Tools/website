      Internetverbindung und wandeln Sie es trotzdem um."""

read_first = """
, <code>src/shared/parse-yaml.js</code> für den Leser, der
      einen Anker lieber ablehnt, als zu raten, was er bedeuten sollte, und
      <code>src/convert.js</code> dafür, warum eine Umwandlung ein Parser und
      ein Schreiber ist, ohne etwas dazwischen, das beide Formate zugleich
      kennt."""

howto_heading = "So wandeln Sie YAML in JSON um, ohne es hochzuladen"

