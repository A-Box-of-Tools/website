pledge = """
    Die Kodierung läuft in Ihrem eigenen Browser, auf Ihrer eigenen Hardware.
    Sie ist Rechnerei auf Bytes, die die Seite ohnehin hat, ohne Encoder, ohne
    Server und ohne einen Schritt über das Netz, den man weglassen könnte.
    Netzfunktionen hat dieses Werkzeug keine, weder zum Abrufen noch zum Senden.
    Und selbst wenn es einen Weg nach draußen gäbe, stünde am anderen Ende
    dieser Seite kein Server, an den ein Bild gehen könnte."""

