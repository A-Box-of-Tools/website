[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Kodiert wird mit
      <code>btoa</code> und <code>encodeURIComponent</code>, zwei Funktionen, die
      der Browser seit Anbeginn hat. Beide nehmen Bytes und geben Text zurück,
      ohne dabei irgendwohin zu gehen."""

[[privacy]]
title = "Die Vorschau ist der Beweis."
body = """
 Das Bild neben jedem Ergebnis wird
      aus der Data-URI gezeichnet, die diese Seite eben gebaut hat, und nicht aus
      Ihrer Datei. Es erscheint, weil die URI stimmt, auf Ihrem Gerät und ohne
      jeden beteiligten Server. Erscheint es nicht, sagt die Seite das, statt
      Ihnen etwas Kaputtes zu geben."""

[[privacy]]
title = "Die Metadaten-Warnung ist auf Ihrer Seite."
body = """
 Eine Data-URI kopiert die
      Datei exakt, und damit reist die GPS-Position einer Fotografie mit ihr in
      Ihr Stylesheet. Diese Seite liest, wie viel davon vorhanden ist, und sagt
      es Ihnen, denn die Alternative wäre, dass Sie es erfahren, wenn schon
      eingecheckt ist."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihre Bilder übergeben. Jede Zeile, die
      eine Datei liest oder kodiert, kommt von dieser Domain selbst und steht im
      Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil darin nie ein Schritt über das Netz
      vorgesehen war. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie Ihre Bilder aus."
body = """
 Ziehen Sie sie auf das Auswahlfeld oder
      suchen Sie sie von Hand heraus. Der Browser liest sie direkt von Ihrer
      Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Sagen Sie, wohin das Ergebnis geht."
body = """
 Zur Wahl stehen die URI für
      sich, eine CSS-Regel, eine Custom Property, ein
      <code>&lt;img&gt;</code>-Element oder Markdown. Jede davon setzt die URI in
      Anführungszeichen, und genau dieses Detail entscheidet, ob ein
      eingebettetes SVG funktioniert oder stillschweigend nicht."""

[[howto]]
title = "Lesen Sie, was es gekostet hat."
body = """
 Jedes Ergebnis sagt, aus wie vielen
      Zeichen es geworden ist, um wie viel größer das als die Datei ist und ob
      sich das Einbetten in dieser Größe überhaupt lohnt. Base64 legt ein Drittel
      drauf. Ob dieses Drittel eine gesparte Anfrage wert ist, hängt ganz an der
      Größe, und deshalb sagt Ihnen die Seite, auf welcher Seite der Grenze Sie
      stehen."""

[[howto]]
title = "Achten Sie auf die Warnungen."
body = """
 Trägt das Bild EXIF, ein Farbprofil
      oder XMP, wird das benannt, samt der Zahl der Bytes Ihres Ergebnisses, die
      darauf entfallen. Widerspricht die Dateiendung dem tatsächlichen Format,
      nimmt die Seite das Format und sagt es Ihnen. Kann Ihr Browser das Ergebnis
      nicht zeichnen, sagt sie auch das."""

[[howto]]
title = "Kopieren oder herunterladen."
body = """
 Eine Schaltfläche je Ergebnis und
      eine für alle auf einmal. Die Custom Properties kommen fertig in einen
      <code>:root</code>-Block gewickelt heraus, bereit zum Einfügen oben in ein
      Stylesheet."""

[[faq]]
q = "Wird mein Bild irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest und kodiert die Datei auf Ihrer eigenen
        Hardware, mit zwei Funktionen, die er ohnehin hat. Netzfunktionen hat
        dieses Werkzeug keine, es ruft nie etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "Was ist eine Data-URI?"
a = """
        Eine Art, eine ganze Datei dorthin zu schreiben, wo sonst eine
        Webadresse stünde. Statt <code>url("logo.png")</code>, was den Browser
        losschickt, etwas zu holen, schreiben Sie
        <code>url("data:image/png;base64,iVBORw0...")</code>, worin das Bild
        selbst steckt. Der Browser dekodiert es an Ort und Stelle. In der Praxis
        heißt das eine Anfrage weniger, denn das Bild kommt mit dem Stylesheet
        oder der Seite an statt danach."""

[[faq]]
q = "Warum ist mein SVG nicht base64?"
a = """
        Weil Base64 dafür die falsche Kodierung ist. Ein SVG ist Text, und Text
        kann eine URL ohnehin tragen, maskiert werden muss nur eine Handvoll
        Zeichen. Genau die prozentzukodieren und den Rest in Ruhe zu lassen
        ergibt eine URI, die typischerweise ein Fünftel kürzer ausfällt als das
        Base64 derselben Datei und die Sie in Ihrem Stylesheet noch lesen können.
        Die Elementnamen, die Farben und die <code>viewBox</code> stehen alle
        noch da und lassen sich bearbeiten. Für die seltene Werkzeugkette, die
        darauf besteht, gibt es ein Häkchen, das Base64 erzwingt."""

[[faq]]
q = "Wie viel größer macht Base64 mein Bild?"
a = """
        Um etwa ein Drittel. Aus drei Bytes Datei werden vier Zeichen Base64,
        also 33&nbsp;% noch vor dem <code>data:image/png;base64,</code> davor.
        Das ist die Untergrenze und unvermeidlich, denn so viel kostet es,
        beliebige Bytes mit nur den Zeichen zu schreiben, die eine URL erlaubt.
        Deshalb stellt die Seite die Zeichenzahl auch gleich neben die
        Dateigröße, statt Sie das herausfinden zu lassen, wenn das Stylesheet
        schon ausgeliefert ist."""

[[faq]]
q = "Wann ist es tatsächlich eine gute Idee, ein Bild einzubetten?"
a = """
        Wenn es klein ist und sofort gebraucht wird. Ein 2&nbsp;KB großes Symbol
        in einem Stylesheet, das jede Seite lädt, ist ein klarer Gewinn: eine
        Rundreise weniger, und das Bild ist da, sobald das CSS da ist. Ab etwa
        10&nbsp;KB kippt der Handel. Ein eingebettetes Bild ist keine eigene
        Datei mehr, kann also nicht für sich zwischengespeichert und nicht
        parallel zu etwas anderem geholt werden, und es wird jedes Mal
        vollständig neu geladen, wenn sich die Datei drumherum ändert. Eine
        200&nbsp;KB große Fotografie in einem Stylesheet sind 200&nbsp;KB
        zusätzlich auf dem kritischen Pfad jeder Seite der Website. Auf welche
        Seite dieser Grenze ein Ergebnis fällt, sagt Ihnen die Seite."""

[[faq]]
q = "Macht gzip den Base64-Aufschlag wieder wett?"
a = """
        Weniger, als man denkt. Base64 einer bereits komprimierten Datei
        komprimiert schlecht, weil dem Kompressor kaum noch Redundanz bleibt, und
        ein PNG, ein JPEG und ein WebP sind alle bereits komprimiert. Zurück
        bekommen Sie typischerweise etwa ein Zehntel des Drittels, das Base64
        hinzugefügt hat, und nicht das Ganze. Ein prozentkodiertes SVG liegt
        genau andersherum. Es bleibt Text und komprimiert sich damit ungefähr so
        gut wie vorher, was ein weiterer Grund ist, keines zu base64-kodieren."""

[[faq]]
q = "Ändert das mein Bild überhaupt?"
a = """
        Nein, und darin unterscheidet es sich bewusst von den meisten Werkzeugen
        hier. Es wird nichts zu Pixeln dekodiert und erneut kodiert. Die Bytes,
        die von Ihrer Festplatte kamen, sind die Bytes, die in die URI gehen. Ein
        JPEG bleibt exakt das JPEG, das es war, in derselben Qualität und mit
        denselben Abmessungen. Deshalb lässt sich das Ergebnis als dieselbe Datei
        beschreiben und nicht bloß als Kopie davon."""

[[faq]]
q = "Dann gehen meine EXIF- und GPS-Daten also auch ins Stylesheet?"
a = """
        Ja, und darüber sollten Sie vor dem Einfügen nachdenken. Weil nichts neu
        kodiert wird, reist alles mit, was die Kamera geschrieben hat: der Ort,
        der Zeitstempel, die Seriennummer der Kamera. Bei einem Handyfoto können
        das 30&nbsp;KB der Datei sein, aus denen 40&nbsp;KB Base64 auf dem
        kritischen Pfad Ihrer Seite werden, und obendrein eine Wohnanschrift in
        etwas, das in ein Repository eingecheckt wird. Wie viele Metadaten in
        einem JPEG, PNG oder WebP stecken, liest die Seite und sagt es Ihnen.
        Herausnehmen lassen sie sich vorher mit dem
        <a href="../exif-daten-entfernen/">EXIF-Betrachter &amp; -Entferner</a>."""

[[faq]]
q = "Warum hat es einen anderen Typ genommen als die Endung meiner Datei?"
a = """
        Weil die Endung falsch sein kann und die Bytes nicht. Eine Datei namens
        <code>logo.png</code>, die in Wahrheit als JPEG exportiert wurde, kommt
        oft genug vor, dass jedes Bildwerkzeug damit umgehen muss. Eine Data-URI
        mit dem falschen Typ erscheint dagegen schlicht nicht, ohne
        Rückfalloption und ohne lesenswerte Fehlermeldung. Gelesen wird der Typ
        deshalb aus den ersten Bytes der Datei, die in jedem Format hier
        eindeutig sagen, was sie ist, und wenn beides sich widerspricht, sagt es
        Ihnen die Seite."""

[[faq]]
q = "Die Vorschau ist leer. Was ist schiefgegangen?"
a = """
        An der URI vermutlich nichts. HEIC und TIFF ergeben beide vollkommen
        gültige Data-URIs, die außer Safari kein Browser zeichnet, und damit
        fehlt das Bild auch überall dort, wo Sie sie einfügen. Wandeln Sie es
        zuerst mit dem <a href="../bild-komprimieren/">Bildkompressor</a> oder
        dem <a href="../bildgroesse-aendern/">Bildskalierer</a> nach PNG, JPEG
        oder WebP um. Ist das Format ein ganz gewöhnliches, ist wahrscheinlich
        die Datei selbst beschädigt. Die Vorschau wird ja aus der URI gezeichnet,
        die diese Seite gebaut hat, und eine leere heißt deshalb, dass das Bild
        gar nicht dekodiert hat."""

[[faq]]
q = "Gibt es eine Größengrenze für eine Data-URI?"
a = """
        Keine, der Sie in CSS oder in einem <code>&lt;img&gt;</code>-Element
        begegnen, denn moderne Browser setzen dort keine praktische Grenze.
        Begrenzt wird das Eintippen einer Data-URI in die Adressleiste, was die
        meisten Browser inzwischen für alles Nichttriviale verweigern, aus
        Sicherheitsgründen, die mit dieser Verwendung nichts zu tun haben. Die
        echte Grenze ist die von oben: Lange bevor irgendetwas Technisches
        bricht, ist die Seite, in der es steckt, langsamer geworden, als sie mit
        einer gewöhnlichen Bilddatei gewesen wäre."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Auch bei Anzahl und Größe der Dateien
        gibt es keine Grenze, denn es zahlt kein Server dafür. Die Arbeit
        passiert auf Ihrem eigenen Gerät. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihre Bilder zum Kodieren
        wegschickt, bliebe in dem Moment stehen, in dem Sie den Stecker
        ziehen."""

