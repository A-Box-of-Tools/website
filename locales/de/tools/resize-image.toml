name = "Bildskalierer"
heading = "Bildgröße&nbsp;ändern <span class=\"h1-kw\">&mdash; skalieren, zuschneiden, umwandeln</span>"
tagline = "Größe nennen. Rahmen ziehen. Format wählen."

title = "Bildgröße ändern &mdash; auch zuschneiden und umwandeln, ohne Upload"
description = "JPEG-, PNG- und WebP-Bilder im Browser skalieren, zuschneiden und umwandeln. Exakte Pixel, ein Prozentwert oder die lange Kante, für ein Bild oder einen ganzen Ordner. Nichts wird hochgeladen."
og_title = "Ein Bild skalieren, zuschneiden und umwandeln, ohne es hochzuladen"
og_description = "Die Größe in Pixeln oder als Prozentwert setzen, einen Zuschnittrahmen ziehen, das Format wechseln, für ein Bild oder einen ganzen Stapel. Alles läuft auf Ihrem eigenen Gerät."
og_image_alt = "Bildskalierer - skalieren, zuschneiden und umwandeln ohne Upload"

pledge = """
    Das Skalieren, das Zuschneiden und der Formatwechsel laufen alle in Ihrem
    eigenen Browser, auf Ihrer eigenen Hardware, mit den Bild-Encodern, die er
    ohnehin mitbringt. Netzfunktionen hat dieses Werkzeug keine, weder zum
    Abrufen noch zum Senden. Und selbst wenn es einen Weg nach draußen gäbe,
    stünde am anderen Ende dieser Seite kein Server, an den ein Bild gehen
    könnte."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und skalieren Sie ein Foto. Keine einzige
      Anfrage trägt ein Bild, ein Vorschaubild, einen Dateinamen oder ein Byte
      dessen, was Sie ausgewählt haben. Oder trennen Sie die Internetverbindung
      und skalieren Sie trotzdem eines."""

read_first = """
, <code>src/geometry.js</code> für die Rechnung, die
      entscheidet, was behalten wird und wie groß es herauskommt, und
      <code>src/codecs.js</code> für den einen <code>drawImage</code>-Aufruf, der
      Zuschnitt und Skalierung in einem erledigt."""

howto_heading = "So skalieren Sie ein Bild, ohne es hochzuladen"

card = """
            Exakte Pixel, ein Prozentwert oder die lange Kante, dazu ein
            Zuschnittrahmen und ein Formatwechsel auf dem Weg. Ein Bild oder ein
            ganzer Ordner."""

