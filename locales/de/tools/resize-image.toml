[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Skaliert wird mit
      einem <code>drawImage</code> auf ein Canvas und einem
      <code>canvas.toBlob</code>, also mit dem Skalierer und dem Encoder, die in
      Ihrem Browser ohnehin stecken."""

[[privacy]]
title = "Eine Datei, um deren Änderung niemand gebeten hat, wird nicht geändert."
body = """
 Ohne
      Zuschnitt, ohne Skalierung und ohne Formatwechsel wird die von Ihnen
      gewählte Datei Byte für Byte zurückgereicht statt neu gespeichert. Das ist
      nicht bloß Höflichkeit, sondern der Grund, warum dieses Werkzeug ein Bild
      gar nicht stillschweigend neu kodieren kann. Und warum es auch nicht
      stillschweigend die Metadaten eines Bildes wegwirft, das Sie nur ansehen
      wollten."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihre Bilder übergeben. Jede Zeile, die
      eine Datei liest, zuschneidet, skaliert oder schreibt, kommt von dieser
      Domain selbst und steht im Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil darin nie ein Schritt über das Netz
      vorgesehen war. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie Ihre Bilder aus."
body = """
 Ziehen Sie sie auf das Auswahlfeld
      oder suchen Sie sie von Hand heraus. Der Browser liest sie direkt von
      Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Schneiden Sie zu, wenn Sie möchten."
body = """
 Der Rahmen beginnt auf dem
      ganzen Bild, ihn in Ruhe zu lassen schneidet also nichts ab. Ziehen Sie
      ihn, oder legen Sie ihn auf ein Format fest, etwa 1:1 für ein Profilbild,
      9:16 für eine Story oder 16:9 für ein Vorschaubild, und klicken Sie auf
      &bdquo;Größtmöglich&ldquo; für den größten Rahmen, der hineinpasst. Jedes
      Bild behält seinen eigenen Rahmen. Klicken Sie eine beliebige Zeile in der
      Liste an, um stattdessen auf jenem zu zeichnen. Sollen alle gleich gerahmt
      sein, erledigt das ebenfalls eine Schaltfläche."""

[[howto]]
title = "Sagen Sie, wie groß es herauskommen soll."
body = """
 Eine Breite, eine Höhe
      oder beides. Eine lange Kante, die Hoch- und Querformataufnahmen gleich
      groß hält. Oder schlicht einen Prozentwert. Lassen Sie eines der beiden
      Felder leer, behält das Bild sein eigenes Seitenverhältnis."""

[[howto]]
title = "Wählen Sie das Format und klicken Sie auf die Schaltfläche."
body = """
 Behalten Sie,
      womit jede Datei ankam, oder schreiben Sie alles als JPEG, PNG oder WebP.
      Jedes Ergebnis nennt, was daraus geworden ist und wie viel kleiner es
      wurde. Klicken Sie eines an, öffnet es sich in voller Größe, mit allen
      Zahlen dahinter und dem Original daneben zum Vergleich. Ein Stapel kommt
      als ein ZIP herunter."""

[[faq]]
q = "Wird mein Bild irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser dekodiert, schneidet, skaliert und schreibt die
        Datei auf Ihrer eigenen Hardware, mit den JPEG-, PNG- und WebP-Encodern,
        die er ohnehin mitbringt. Netzfunktionen hat dieses Werkzeug keine, es
        ruft nie etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "Was passiert, wenn ich eine Breite angebe, aber keine Höhe?"
a = """
        Die Höhe ergibt sich aus dem Seitenverhältnis des Bildes, und das ist
        fast immer das Gewollte. &bdquo;1920 breit&ldquo; heißt &bdquo;1920 breit
        und so hoch, wie das eben wird&ldquo;. Füllen Sie beide aus, können die
        zwei dem Seitenverhältnis des Bildes widersprechen, und nur dann
        erscheint die Wahl &bdquo;wenn die Verhältnisse nicht
        zusammenpassen&ldquo;: hineinpassen, ausfüllen und den Überstand
        abschneiden, mit einem Hintergrund auffüllen, oder verzerren und die
        Verzerrung hinnehmen."""

[[faq]]
q = "Verliert ein Bild beim Skalieren an Qualität?"
a = """
        Kleiner machen kostet nichts Sichtbares. Es gehen mehr Pixel hinein als
        heraus, was bleibt, ist also echtes Detail. Größer machen kann dagegen
        nicht hinzufügen, was nie fotografiert wurde, und heraus kommt eine
        weichere Kopie desselben Bildes und keine schärfere. Genau deshalb ist
        &bdquo;ein Bild nie größer machen, als es angefangen hat&ldquo;
        standardmäßig aktiv. Etwas kostet dann noch die Neukodierung, wenn das
        Format JPEG oder WebP ist, und der Qualitätsregler bestimmt, wie viel Sie
        dort ausgeben."""

[[faq]]
q = "Kann ich jedes Bild anders zuschneiden?"
a = """
        Ja, und das ist die Voreinstellung. Jedes Bild auf der Liste trägt seinen
        eigenen Rahmen, in seinen eigenen Pixeln, und ein Klick auf eine Zeile
        holt jenes Bild mit seinem eigenen Rahmen und seinem eigenen festgelegten
        Seitenverhältnis in die Vorschau zurück. Nichts, was Sie an einem tun,
        wirkt sich auf ein anderes aus. Jeder Rahmen beginnt außerdem auf dem
        ganzen Bild, ein Bild, auf dem Sie nie zeichnen, wird also überhaupt
        nicht zugeschnitten."""

[[faq]]
q = "Kann es einen ganzen Stapel auf einmal gleich zuschneiden?"
a = """
        Ja, mit der Schaltfläche unter der Vorschau. Sie gibt jedem anderen Bild
        denselben relativen Ausschnitt, also dieselben Anteile seiner eigenen
        Breite und Höhe. Bei einer Reihe gleich großer Screenshots oder Exporte
        ist das exakt derselbe Rahmen, und die Seite sagt das auch. Mit einem
        festgelegten Seitenverhältnis gibt sie jedem stattdessen den größten
        Rahmen dieses Verhältnisses innerhalb jenes Ausschnitts. Wer also 1:1
        wählt und dann diese Schaltfläche drückt, bekommt aus einem Ordner mit
        gemischten Hoch- und Querformaten lauter Quadrate. Bearbeiten lässt sich
        danach jeder Rahmen weiterhin."""

[[faq]]
q = "Welche Formate kann es lesen und schreiben?"
a = """
        Es liest alles, was Ihr Browser dekodieren kann, in der Praxis also JPEG,
        PNG, WebP, GIF, BMP und, in den meisten aktuellen Browsern, AVIF.
        Geschrieben werden JPEG, PNG und WebP, denn das sind die Encoder, die
        Browser mitbringen. Bei &bdquo;Format behalten&ldquo; bleibt ein JPEG ein
        JPEG und ein PNG ein PNG. Alles, was der Browser nicht schreiben kann,
        etwa ein GIF oder ein BMP, kommt als PNG heraus, also in dem Format, das
        Transparenz und flache Farbflächen unversehrt lässt."""

[[faq]]
q = "Was passiert mit der Transparenz, wenn ich als JPEG speichere?"
a = """
        Sie wird mit der Hintergrundfarbe aufgefüllt, denn JPEG hat keinen
        Alphakanal, in dem sie sich speichern ließe. Die Farbe wählen Sie selbst,
        und sie beginnt bei Weiß, was die meisten wollen und was fast jedes
        andere Werkzeug tut, ohne es Ihnen zu sagen. Dieselbe Farbe steht auch
        hinter einem aufgefüllten Rahmen. Speichern Sie stattdessen als PNG oder
        WebP, kommt die Transparenz unangetastet durch."""

[[faq]]
q = "Entfernt es EXIF- und GPS-Daten?"
a = """
        Bei allem, was es tatsächlich verarbeitet, ja, und zwar als Nebenwirkung.
        Zuschneiden oder Skalieren heißt, das Bild zu Pixeln zu dekodieren und
        diese Pixel erneut zu kodieren, und ein Canvas voller Pixel trägt keine
        Tags. Ort, Kameramodell und Zeitstempel werden also schlicht nicht in die
        neue Datei geschrieben. Bei einer Datei, die Sie überhaupt nicht ändern,
        liegt der Fall anders, denn die wird Byte für Byte zurückgereicht, samt
        Tags. Sollen die Metadaten weg, das Bild aber unangetastet bleiben,
        nehmen Sie den <a href="../exif-daten-entfernen/">EXIF-Betrachter &amp;
        -Entferner</a>. Der schreibt nur den Container neu und komprimiert
        nichts."""

[[faq]]
q = "Worin unterscheidet sich das vom Bildkompressor?"
a = """
        Hier geht es um Abmessungen. Sie sagen, wie viele Pixel Sie wollen, und
        bekommen genau die. Beim
        <a href="../bild-komprimieren/">Bildkompressor</a> geht es um die
        Dateigröße. Sie sagen, wie viele Kilobyte erlaubt sind, und er sucht die
        höchste Qualität, die hineinpasst, und verkleinert nur dann, wenn
        Qualität allein nicht reicht. Hieß es &bdquo;1200 Pixel breit&ldquo;,
        sind Sie hier richtig. Hieß es &bdquo;unter 500 KB&ldquo;, bringt Sie das
        andere näher ans Ziel."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Auch bei Anzahl und Größe der Dateien
        gibt es keine Grenze, denn es zahlt kein Server dafür. Die Arbeit
        passiert auf Ihrem eigenen Gerät. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihre Bilder zum Skalieren
        wegschickt, bliebe in dem Moment stehen, in dem Sie den Stecker
        ziehen."""

