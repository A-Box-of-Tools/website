[[privacy]]
title = "Ihre Videos haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Datei landen könnte, und im Code steht auch nichts, das sie dorthin
      schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Eine Netzfunktion hat dieses Werkzeug
      überhaupt nicht. Es gibt keine Adresse zum Einfügen, nichts herunterzuladen
      und keine Engine, die beim ersten Gebrauch nachgeladen wird. Jedes Byte, das
      Ihr Video berührt, kam beim Laden der Seite von dieser Domain selbst."""

[[privacy]]
title = "Dekodieren und Kodieren passieren lokal."
body = """
 Die Einzelbilder laufen
      durch WebCodecs in Ihrem eigenen Browser oder durch dieselbe
      Wiedergabe-Engine, die Ihnen den Clip ohnehin zeigen würde. Die fertige Datei
      entsteht im Arbeitsspeicher dieses Geräts und geht von dort direkt in einen
      Download."""

[[privacy]]
title = "Der Ton wird ebenfalls hier umgedreht."
body = """
 Eine Tonspur umzukehren
      heißt, sie zu dekodieren, und dieses Dekodieren ist das des Browsers und
      passiert auf diesem Gerät. Nichts hört mit, nichts behält etwas, und
      weiterreichen könnte es auch nichts: Es gibt hier keinen Weg im Code, der ein
      Byte verschickt."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihr
      Video übergeben, weder eine Datei noch ein Einzelbild, ein Name, eine Größe
      oder eine Länge. Jede Zeile, die liest, dekodiert, umkehrt oder kodiert,
      kommt von dieser Domain selbst und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihr Video bekommt er nichts."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie ein Video aus."
body = """
 Ziehen Sie ein MP4, MOV, M4V oder
      WebM auf das Auswahlfeld oder suchen Sie eines von Hand heraus. Der Browser
      liest es direkt von Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Entscheiden Sie über den Ton."
body = """
 &bdquo;Den Ton mit
      umkehren&ldquo; dreht die Spur Sample für Sample um, und nur so kommt
      Sprache als rückwärts gespielte Sprache heraus statt als Stille. Für einen
      stummen Clip schalten Sie es ab, das geht schneller."""

[[howto]]
title = "Entscheiden Sie, wie viel Qualität ausgegeben wird."
body = """
 Das Bild muss neu
      kodiert werden, denn die Einzelbilder kommen in einer Reihenfolge heraus, für
      die in der Datei nichts kodiert war. &bdquo;Ausgewogen&ldquo; bleibt nah an
      dem, was das Original ausgegeben hat, &bdquo;Beste Qualität&ldquo; legt noch
      etwas drauf."""

[[howto]]
title = "Umkehren und herunterladen."
body = """
 Die Arbeit passiert auf Ihrer
      eigenen Hardware. Wie lange sie dauert, hängt daher von Ihrem Gerät ab und
      nicht von einer Warteschlange. Das fertige Video geht direkt in die Downloads
      Ihres Browsers."""

[[faq]]
q = "Wird mein Video irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, dekodiert, kehrt um und kodiert es auf
        Ihrer eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und in
        der <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört uns. Wer lieber prüft als glaubt,
        trennt die Internetverbindung und kehrt trotzdem einen Clip um."""

[[faq]]
q = "Welche Videoformate kann ich umkehren?"
a = """
        MP4, M4V und MOV werden direkt gelesen, egal was darin steckt, also H.264,
        HEVC, AV1 oder VP9, solange Ihr Browser diesen Codec dekodieren kann. Alles
        andere, was Ihr Browser abspielen kann, allen voran WebM, wird stattdessen
        umgekehrt, indem der eigene Player des Browsers rückwärts durch den Clip
        gesteppt wird. Das funktioniert, dauert aber länger. Was der Browser weder
        lesen noch abspielen kann, in der Praxis AVI, WMV, FLV und die meisten
        MKVs, wird gleich mit einer entsprechenden Meldung abgelehnt, statt auf
        halbem Weg zu scheitern. Heraus kommt immer ein MP4."""

[[faq]]
q = "Wird der Ton mit umgekehrt?"
a = """
        Ja, sofern Sie es nicht abschalten. Die ganze Spur wird dekodiert, die
        Samples werden in die andere Reihenfolge gebracht, und dann wird wieder als
        AAC kodiert. Um diese zweite Kodierung kommt man nicht herum: Ein
        Audio-Paket sind einige Dutzend Millisekunden Klang, kodiert gegen das
        Paket davor. Die Pakete verkehrt herum hinauszuschreiben, spielte also
        kurze Stücke vorwärts in der falschen Reihenfolge, und das klingt nach
        Defekt und nicht nach Umkehrung."""

[[faq]]
q = "Kostet das Umkehren Qualität?"
a = """
        Das Bild wird ein zweites Mal kodiert, und das kostet ein wenig. Hier lässt
        sich das nicht vermeiden, wie es beim Kürzen möglich ist: Ein umgekehrter
        Clip zeigt seine Einzelbilder in einer Reihenfolge, für die in der
        Originaldatei nichts kodiert war, jedes Einzelbild muss also neu
        geschrieben werden. Was das Werkzeug dabei nicht tut, ist mehr auszugeben,
        als das Original ausgegeben hat, denn darüber hinaus zu kodieren macht die
        Datei nur größer, ohne sie besser aussehen zu lassen."""

[[faq]]
q = "Gibt es eine Grenze für Größe oder Länge des Videos?"
a = """
        Im Werkzeug ist keine Grenze eingebaut, und die Datei wandert auch nicht
        auf einmal in den Arbeitsspeicher, sondern wird Einzelbildgruppe für
        Einzelbildgruppe rückwärts durchgegangen. Die praktischen Obergrenzen sind
        das fertige Video, das vor dem Download im Arbeitsspeicher zusammengesetzt
        wird, und der Ton, der ganz gehalten werden muss, weil eine Umkehrung das
        letzte Sample braucht, bevor sie das erste schreiben kann."""

[[faq]]
q = "Warum dauert es bei manchen Dateien länger als bei anderen?"
a = """
        Weil es zwei Wege hinein gibt. Ein MP4 oder MOV liest dieses Werkzeug
        direkt und dekodiert es gruppenweise, und das läuft so schnell, wie Ihr
        Gerät eben ist. Alles andere wird umgekehrt, indem der eigene Player des
        Browsers nacheinander nach einzelnen Momenten des Clips gefragt wird, und
        jeder dieser Sprünge zwingt den Browser, ab dem Schlüsselbild davor zu
        dekodieren. Welchen der beiden Wege sie nimmt und warum, sagt die Seite,
        bevor Sie anfangen."""

[[faq]]
q = "Kann ich auch nur einen Teil eines Clips umkehren?"
a = """
        Hier nicht. Dieses Werkzeug kehrt das Ganze um: Der Clip, der herauskommt,
        ist genauso lang wie der, der hineinging, nur mit dem letzten Einzelbild
        zuerst. Schneiden Sie den gewünschten Teil vorher mit dem
        <a href="../video-schneiden/">Video-Schneider</a> heraus, der das ohne die
        Neukodierung eines einzigen Einzelbildes erledigt, und kehren Sie dann um,
        was dabei herauskommt."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase
        und kein Wasserzeichen. Bezahlt wird die Seite über Werbung, und den
        Anzeigen wird nichts über Ihr Video übergeben."""

