og_image_alt = "Text & Dateien teilen - direkt von Browser zu Browser, nichts gespeichert"

pledge = "Was Sie hier teilen, wandert über einen Ende-zu-Ende-verschlüsselten WebRTC-Kanal von Ihrem Browser in den jedes Lesers, und nirgendwohin sonst. Der eine beteiligte Server — in der <code>Content-Security-Policy</code> dieser Seite benannt, Quelltext im Repository — stellt die Browser einander vor und listet auffindbare lokale Link-Namen. Er hält weder geteilten Text noch Dateien; der Inhalt läuft nie durch ihn. Die Namen in der Suche bestehen nur, solange der Teilende verbunden ist. Es gibt keinen Inhaltsverlauf und kein Konto. Schließen Sie diesen Tab, endet die Freigabe überall zugleich, auch auf den offenen Seiten der Leser."

live_hint = "Öffnen Sie die DevTools und beobachten Sie beim Teilen den Tab „Netzwerk“. Beim Öffnen dieser Startseite erscheint ein WebSocket zum Vermittler für lokale Link-Namen. Das Starten einer Freigabe öffnet einen weiteren für den Verbindungsaufbau. Ein Leser nutzt einen Vermittlungssocket. Wie viel Sie auch tippen oder anhängen: Keiner davon trägt Text oder Dateien."

