name = "Text & Dateien teilen"
heading = "Text &amp; Dateien teilen <span class=\"h1-kw\">&mdash; direkt von Ihrem Browser in ihren, ohne Upload</span>"
tagline = "Die Freigabe lebt in diesem offenen Tab. Leser holen sie verschlüsselt direkt aus Ihrem Browser, und mit dem Schließen des Tabs endet sie - auf keinem Server ist irgendetwas gespeichert."

title = "Text &amp; Dateien zwischen Geräten teilen &mdash; direkt, verschlüsselt, nichts gespeichert"
description = "Text oder Dateien über eine direkte, verschlüsselte Verbindung von einem Browser in einen anderen schicken. Ein aussprechbarer Link-Name, Live-Aktualisierung beim Tippen, Freigabe pro Leser - und niemals etwas auf einem Server. Kostenlos, ohne Anmeldung."
og_title = "Eine Freigabe, die endet, sobald Sie den Tab schließen"
og_description = "Text und Dateien wandern verschlüsselt direkt von Ihrem Browser in den des Lesers. Der Server stellt die beiden nur einander vor und sieht den Inhalt nie. Kein Speicher, kein Verlauf, kein Konto - Tab zu, und alles ist weg, überall."
og_image_alt = "Text & Dateien teilen - direkt von Browser zu Browser, nichts gespeichert"

pledge = """
    Was Sie hier teilen, wandert über einen Ende-zu-Ende-verschlüsselten
    WebRTC-Kanal von Ihrem Browser in den jedes Lesers, und nirgendwohin
    sonst. Der eine beteiligte Server &mdash; in der
    <code>Content-Security-Policy</code> dieser Seite benannt, Quelltext im
    Repository &mdash; stellt die beiden Browser einander vor und tritt dann
    beiseite: Er speichert nichts, und der Inhalt läuft nie durch ihn
    hindurch. Es gibt keinen Verlauf und kein Konto. Schließen Sie diesen
    Tab, endet die Freigabe überall zugleich, auch auf den offenen Seiten
    der Leser."""

live_hint = """
      Öffnen Sie die DevTools und sehen Sie beim Teilen im Tab
      &bdquo;Netzwerk&ldquo; zu. Sie sehen einen WebSocket zum Vermittler mit
      ein paar Kilobyte Verbindungsaufbau &mdash; und wie viel Sie auch
      tippen oder anhängen: keine einzige Anfrage, die etwas davon trägt."""

read_first = """
, <code>src/main.js</code> für beide
      Hälften des Austauschs &mdash; der Tab des Teilenden und der des Lesers
      sind dieselbe Datei &mdash; und <code>src/markdown.js</code> für den
      Renderer, der auf Text von der anderen Seite der Leitung läuft und
      deshalb alles maskiert, bevor er irgendetwas ausgibt. Der vollständige
      Quelltext des Servers ist <code>workers/rendezvous/worker.js</code> im
      selben Repository: ein Raum pro Link-Name, der nichts hält als die
      offenen Verbindungen."""

howto_heading = "So teilen Sie Text und Dateien, ohne sie irgendwohin hochzuladen"

card = """
            Text und Dateien, von Browser zu Browser über eine verschlüsselte
            Direktverbindung. Nirgendwo gespeichert; die Freigabe endet, wenn
            Sie den Tab schließen."""

[words]
plural = "geteilte Texte und Dateien"
choose = "einen Link-Namen"
analytics_extra = """, und nichts von dem,
  was dieses Werkzeug teilt - weder den Text noch die Dateien, ihre Namen
  oder Größen, noch wer mitgelesen hat"""

