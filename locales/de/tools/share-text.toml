[[privacy]]
title = "Der Inhalt geht zu Ihrem Leser, und nirgendwohin sonst."
body = """
Text und Dateien reisen über einen WebRTC-Datenkanal: eine direkte, DTLS-verschlüsselte Verbindung zwischen Ihrem Browser und dem jedes Lesers. In diesem Weg steht kein Server. Der Modus Lokales Netzwerk nutzt die eigenen Netzwerkadressen der Browser ohne öffentliche Adressermittlung oder Internet-Relais. Ein VPN oder die Netzwerkrichtlinien des Browsers können den Weg dieser Adressen beeinflussen; das ist keine Garantie für ein bestimmtes Gebäude. Im normalen Modus kann ein direkt nicht erreichbarer Leser auf seiner Seite ein verschlüsseltes Relais wählen, das denselben Chiffretext weiterreicht und nicht lesen kann."""

[[privacy]]
title = "Was der Vermittler ist, und alles, was er sieht."
body = "Eine Direktverbindung braucht eine Vorstellung. Diese Startseite öffnet automatisch einen WebSocket zum Vermittler für auffindbare lokale Link-Namen; das Starten einer Freigabe öffnet einen weiteren für die Freigabe selbst. Ein Leser nutzt einen Vermittlungssocket. Der Server bringt den Leser mit dem Teilenden unter dem Link-Namen zusammen und reicht einige Kilobyte Verbindungsaushandlung weiter. Er schreibt keinen Speicher; Räume und Sucheinträge enden mit ihren offenen Verbindungen. Er sieht Namen, Verbindungszeiten, IP-Adressen und Verbindungsaufbau, aber keinen Text, keine Dateien, keine Zulassungsentscheidung und keine private Vorstellung. Die Suche zeigt nur Namen verbundener Teilender mit derselben öffentlichen IPv4-Adresse oder im selben IPv6-Subnetz. Gemeinsame VPNs oder vom Anbieter geteilte Adressen können andere Netze einschließen; Geräte in der Nähe mit IPv4- und IPv6-Verbindungen oder anderen Routen fehlen möglicherweise. Der vollständige Quelltext liegt im Repository. Cloudflare hält Verbindungsprotokolle sieben Tage vor: Adresse, Link-Name und Zeit, niemals eine Nutzlast."

[[privacy]]
title = "Nichts ist gespeichert - das Schließen des Tabs ist die Löschung."
body = """
 Die Freigabe existiert nur,
      solange Ihr Tab offen ist. Schließen Sie ihn, finden neue Leser nichts
      mehr, und wer gerade liest, sieht seine Kopie verschwinden &mdash;
      wobei das, was jemand vorher kopiert oder heruntergeladen hat, ihm
      gehört, wie bei allem, das Sie jemandem in die Hand gegeben haben. Der
      Entwurf, den Sie tippen, liegt im Speicher Ihres eigenen Browsers,
      damit er beim nächsten Mal noch da ist, und nur dort; als einmalig
      markiert liegt er nirgendwo."""

[[privacy]]
title = "Der Link-Name ist eine Adresse, und Privat ist das Schloss."
body = "Wer einen Namen kennt oder errät, kann die Freigabe dahinter öffnen. Auffindbare lokale Freigaben zeigen ihren Namen anderen Browsern mit derselben öffentlichen IPv4-Adresse oder im selben IPv6-Subnetz. Der Name ist dann innerhalb dieser Gruppe öffentlich. Lassen Sie Privat für alles Sensible an. Es ist standardmäßig aktiv: Jeder Leser stellt sich über den verschlüsselten Peer-Kanal vor, und nichts wird gesendet, bevor Sie ihn einlassen."

[[privacy]]
title = "Eine Direktverbindung zeigt jeder Seite die Adresse der anderen."
body = """
 Das ist es, was
      Peer-to-Peer bedeutet, und der Leser erfährt es, bevor es passiert:
      Das Öffnen eines Freigabe-Links fragt nur beim Vermittler nach, ob
      jemand teilt; dann sagt die Seite klar, dass eine Direktverbindung
      beiden Seiten die IP-Adresse der jeweils anderen zeigt, und wartet auf
      einen Klick. Bis zu diesem Klick hat der Teilende nicht einmal
      erfahren, dass der Leser existiert."""

[[privacy]]
title = "Was Google lädt, und was es nicht bekommt."
body = """ Die Werbe- und Messskripte
      kommen von Google, der Spenden-Button von Buy Me a Coffee. Keines
      davon bekommt den Text, die Dateien, ihre Namen oder Größen oder wer
      sich verbunden hat. Die Ausnahme ist die Adresse dieser Seite selbst:
      der Link eines Lesers trägt den Link-Namen, und das Werbeskript liest
      die Adresse. Eine Freigabe, die für sich bleiben soll, will den
      Privat-Schalter. Jede Zeile, die den Inhalt berührt, wird von dieser
      Adresse ausgeliefert und steht im Repository."""

[[howto]]
title = "Schreiben Sie den Text, oder hängen Sie die Dateien an."
body = """
 Der Editor ist die Freigabe:
      Was darin steht, wenn ein Leser sich verbindet, ist das, was er
      bekommt, und alles danach erreicht verbundene Leser live, während Sie
      tippen. Dateien reisen über denselben Kanal, bis 200&nbsp;MB pro
      Stück; Leser sehen die Liste und holen nur, was sie anfordern &mdash;
      niemandes Bandbreite wird für eine Datei verbraucht, die er nicht
      wollte."""

[[howto]]
title = "Schalten Sie Markdown ein, wenn der Text Formatierung verdient."
body = """
 Ein Schalter.
      Überschriften, Fettdruck, Listen, Code und Links erscheinen beim
      Tippen live gerendert neben dem Editor, und Leser bekommen
      standardmäßig die formatierte Ansicht, mit einem Umschalter zurück zum
      Quelltext. Der Renderer wird mit dieser Seite ausgeliefert und
      maskiert alles: Geteilter Text kann auf dem Rechner eines Lesers nicht
      zu Skript werden, egal wer ihn geschrieben hat."""

[[howto]]
title = "Benennen Sie den Link, oder behalten Sie den Vorschlag."
body = "Der Name ist die Adresse: <code>brave-otter-42</code> lässt sich durch einen Raum rufen, am Telefon vorlesen oder von einer Tafel abtippen. Auffindbare lokale Freigaben listen ihren Namen, daher sollte Privat für sensible Inhalte an bleiben. Für eine Freigabe nur per Link ist auch ein unerratbarer Name hilfreich. Ein bereits aktiv genutzter Name wird abgelehnt und wird frei, sobald Sie aufhören."

[[howto]]
title = "Entscheiden Sie, wer hineinkommt."
body = """
 Privat ist die Voreinstellung:
      Jeder Leser wird gebeten, sich vorzustellen &mdash; ein Name, ein
      Hinweis, irgendetwas, das Sie wiedererkennen &mdash;, und Sie sehen die
      Nachricht mit einem Knopf, ihn lesen zu lassen oder abzuweisen. Die
      Vorstellung reist über den Direktkanal, nicht einmal der Vermittler
      erfährt also, wer gefragt hat. Abgehakt wird daraus eine offene
      Freigabe, die jeder mit dem Namen lesen kann."""

[[howto]]
title = "Starten Sie die Freigabe, und lassen Sie den Tab offen."
body = """
 Der Tab ist der Server: Die
      Freigabe ist erreichbar, solange er offen und wach ist, und keinen
      Moment länger. Auch ein zugeklappter Laptop beendet sie. Kopieren Sie
      den Link, oder sagen Sie einfach den Namen &mdash; ein Leser kann ihn
      als <code>#name</code> ans Ende der Adresse dieser Seite tippen. Kopieren Sie für den Modus Lokales Netzwerk den Link: Er enthält <code>?local=1</code> vor dem Namen. Ein Leser mit einem anderen Modus wird gefragt, bevor er es mit Ihrem Modus erneut versucht."""

[[howto]]
title = "Auf der anderen Seite: erst zustimmen, dann anklopfen."
body = """
 Wer den Link öffnet, erfährt,
      dass jemand teilt, wird gewarnt, dass eine Direktverbindung beiden
      Seiten die Netzadresse der anderen zeigt, und verbindet sich nur durch
      eigene Entscheidung. Bei einer privaten Freigabe stellt er sich vor
      und wartet auf Sie. Was er bekommt, aktualisiert sich live, während
      Sie schreiben, und verschwindet, wenn Sie den Tab schließen."""

[[faq]]
q = "Wird irgendetwas hochgeladen, irgendwohin?"
a = "Kein Text und keine Datei werden hochgeladen. Sie reisen direkt über einen verschlüsselten WebRTC-Kanal von Ihrem Browser in den jedes Lesers. Der Server trägt die Vorstellung und veröffentlichte lokale Link-Namen, niemals den Inhalt. Räume und Sucheinträge enden mit ihren offenen Verbindungen. Cloudflares siebentägige Verbindungsprotokolle enthalten Metadaten, niemals eine Nutzlast."

[[faq]]
q = "Warum spricht dieses Werkzeug überhaupt mit einem Server, ausgerechnet auf dieser Website?"
a = "Weil zwei Browser einander nicht allein finden: Der Vermittler verbindet die Person, die <code>brave-otter-42</code> eingegeben hat, mit der, die darunter teilt, und trägt den Verbindungsaufbau. Er ist in der <code>Content-Security-Policy</code> dieser Seite benannt, und sein Quelltext liegt im selben Repository. Er zeigt auch veröffentlichte lokale Link-Namen für Browser mit derselben öffentlichen IPv4-Adresse oder im selben IPv6-Subnetz. Er hält keinen Inhalt und kann den verschlüsselten Peer-Kanal nicht lesen."

[[faq]]
q = "Was genau kann dieser Server sehen?"
a = "Er sieht genutzte Link-Namen, wann Teilende und Leser kommen und gehen, ihre IP-Adressen und den Verbindungsaufbau. Die Suche gruppiert veröffentlichte Namen nach öffentlicher IPv4-Adresse oder IPv6-Subnetz sowie Seitenherkunft. Er sieht keinen Text, keine Dateien oder deren Namen und Größen, keine private Zulassung und keine Vorstellung. All das reist über den Ende-zu-Ende-verschlüsselten Peer-Kanal. Cloudflare hält Verbindungsprotokolle sieben Tage vor: Link-Name, Adresse und Zeit, niemals eine Nutzlast."

[[faq]]
q = "Was passiert, wenn ich den Tab schließe?"
a = """
        Die Freigabe endet überall zugleich. Der Link hört binnen ein, zwei
        Sekunden auf zu funktionieren, und Leser, die die Seite noch offen
        haben, sehen ihre Kopie verschwinden, mit dem Hinweis, dass die
        Freigabe beendet wurde. Das ist keine Löschanfrage an einen Server
        &mdash; es gibt keine Serverkopie zu löschen. Der Tab war der
        einzige Ort, an dem die Freigabe existierte, und ihn zu schließen
        ist das ganze Aufräumen."""

[[faq]]
q = "Kann ein Leser behalten, was ich geteilt habe?"
a = """
        Solange die Freigabe offen ist, ja &mdash; das ist es, was Teilen
        heißt. Ein Leser kann den Text kopieren oder eine Datei
        herunterladen, und was er genommen hat, gehört ihm, genau als
        hätten Sie es ihm auf jedem anderen Weg gegeben. Was das Beenden
        garantiert, ist die Zukunft: Niemand Neues kommt heran, und offene
        Seiten zeigen es nicht mehr. Kein Werkzeug kann zurückholen, was
        schon angekommen ist, und diese Seite behauptet es auch nicht."""

[[faq]]
q = "Was ist der Privat-Modus?"
a = """
        Die Voreinstellung. Jeder ankommende Leser erfährt, dass die
        Freigabe privat ist, und wird gebeten, sich vorzustellen; Sie sehen
        die Nachricht &mdash; &bdquo;hier ist Alice aus dem Standup&ldquo;
        &mdash; mit Knöpfen, ihn lesen zu lassen oder abzuweisen, und nichts
        wird gesendet, bevor Sie entscheiden. Die Vorstellung reist über den
        ohnehin verschlüsselten Direktkanal, der Server erfährt also nie,
        wer gefragt hat oder was Sie entschieden haben. Vor dem Teilen
        abgehakt, wird daraus eine offene Freigabe."""

[[faq]]
q = "Warum sieht der Leser meine IP-Adresse?"
a = """
        Weil die Verbindung wirklich direkt ist, und eine Direktverbindung
        zwischen zwei Adressen besteht &mdash; jedes Ende erfährt
        notwendigerweise das andere, wie bei einem Telefonat. Der Leser wird
        gewarnt, bevor irgendeine Verbindung existiert, und verbindet sich
        nur durch eigene Entscheidung; bis dahin haben Sie nicht einmal
        erfahren, dass er den Link geöffnet hat. Wenn dieser Tausch für eine
        bestimmte Freigabe falsch ist, ist ein Dienst, der über einen Server
        weiterleitet, die Alternative &mdash; mit dem umgekehrten Tausch."""

[[faq]]
q = "Wie groß dürfen die Dateien sein, und wie schnell ist es?"
a = """
Bis 200&nbsp;MB pro Datei, jeder Typ, und so schnell wie die langsamere der beiden Verbindungen. Eine funktionierende lokale Verbindung überträgt mit der Geschwindigkeit dieses Netzes; VPNs und Browser-Routing können den Weg beeinflussen. Leser holen jede Datei auf Anforderung, sodass eine große angehängte Datei erst übertragen wird, wenn jemand sie anfordert."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ehrlich gesagt: zur Hälfte. Der Editor ja &mdash; die Seite lädt,
        Ihr Entwurf ist da, Markdown rendert, Schreiben und Speichern gehen
        ganz ohne Netz. Das Teilen nicht, und das kann es nicht: Den Browser
        eines anderen Menschen zu erreichen ist ein Netzvorgang, und die
        Vorstellung braucht den Vermittler. Dies ist das eine Werkzeug
        dieser Website, dessen Aufgabe offline unmöglich ist, und etwas
        anderes anzudeuten wäre unehrlich."""

[[faq]]
q = "Was, wenn wir keine Verbindung bekommen?"
a = """
Das folgende Relais-Angebot gilt nur für den normalen Verbindungsmodus. Die meisten Browserpaare erreichen einander direkt, sobald sie
        vorgestellt sind; eine Minderheit nicht, typischerweise wenn eine
        Seite im Mobilfunknetz eines Anbieters mit geteilten Adressen oder
        hinter einem strengen Firmennetz sitzt. Diese Seite wechselt nie
        stillschweigend auf ein Relais &mdash; das würde ändern, was dieses
        Werkzeug ist, ohne es zu sagen &mdash;, sondern sagt nach zwanzig
        Sekunden klar, dass keine Direktverbindung zustande kam, und bietet
        dem Leser eines an: ein von Cloudflare betriebenes Relais, das die
        verschlüsselten Bytes zwischen den beiden Browsern weiterreicht und
        sie nicht lesen kann, weil der Schlüssel die beiden Enden nie
        verlässt. Der Leser wählt es ausdrücklich, auf seiner eigenen Seite,
        nachdem ihm gesagt wurde, was es sieht &mdash; beide Adressen, wie
        die Direktverbindung auch &mdash;, und gespeichert wird auch dort
        nichts. Ihre Seite der Freigabe ändert sich nicht: Ihr Browser
        sendet weiterhin an diesen einen Leser, so wie er es täte, säße der
        Leser hinter einem VPN. Der Modus Lokales Netzwerk bietet nie ein Relais an. Prüfen Sie, ob beide Geräte dasselbe WLAN oder Ethernet-Netz nutzen und ob die Geräteisolierung im Gastnetz, eine Firewall oder ein VPN die Verbindung blockiert."""

[[faq]]
q = "Ist das Markdown-Rendern sicher, wenn jeder alles teilen kann?"
a = """
        Diese Frage ist der Grund, warum der Renderer achtzig Zeilen im
        Quelltext dieser Seite ist und keine Bibliothek. Jedes Zeichen wird
        maskiert, bevor irgendein Tag ausgegeben wird, nur ein fester Satz
        harmloser Tags kann entstehen, und Links akzeptieren nur
        <code>http</code>, <code>https</code> und <code>mailto</code>
        &mdash; ein <code>javascript:</code>-Link bleibt lebloser Text.
        Geteilter Text kann auf Ihrem Rechner nicht zu Skript werden, egal
        wer ihn geschrieben hat, und die achtzig Zeilen können Sie lesen."""

[[faq]]
q = "Können zwei Leute unter demselben Namen teilen?"
a = """
        Nicht gleichzeitig. Eine lebende Freigabe pro Name, durchgesetzt
        beim Vermittler: Wer als Zweiter kommt, wird abgelehnt und um einen
        anderen Namen gebeten. Sobald eine Freigabe endet, ist ihr Name
        wieder frei &mdash; was auch heißt, dass ein aufgehobener Link nur
        so frisch ist wie die Freigabe dahinter: Derselbe Name kann nächste
        Woche jemand anderem gehören. Behandeln Sie einen Link als etwas,
        das zu einem Moment gehört, nicht zu einer Person."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Kostenlos, kein Konto, keine Anmeldung, und keine Grenze, die der
        Rede wert wäre &mdash; sechzehn gleichzeitige Leser pro Freigabe.
        Die Website trägt Werbung, die sie bezahlt; die Anzeigen bekommen
        nichts über das, was diese Seite teilt, und der Vermittler läuft
        bequem in einem kostenlosen Tarif, gerade weil er nichts speichert
        und fast nichts tut."""

[[faq]]
q = "Kann ich Dateien über mein lokales Netzwerk teilen?"
a = "Ja. Wählen Sie vor dem Start Lokales Netzwerk — kein Internet-Relais, verbinden Sie beide Geräte mit demselben WLAN oder Ethernet-Netz und kopieren Sie den Link für den Leser. Der Link enthält den Modus; ein Leser mit einem anderen Modus muss ausdrücklich wählen, bevor er es mit dem Modus des Teilenden erneut versucht. Internet bleibt für die Vermittlung zwischen den Browsern nötig. Dieser Modus nutzt keine öffentliche Adressermittlung und wechselt nie auf ein Internet-Relais. Ein VPN oder Browser-Netzwerkrichtlinien können den Weg ändern oder die Verbindung verhindern; die Einstellung beweist nicht, dass Bytes in einem Gebäude bleiben. Private Freigabe bleibt die Voreinstellung, und Dateien sind weiterhin auf 200&nbsp;MB pro Stück begrenzt. Eine Freigabe kann bis zu 256 Dateien enthalten. Auffindbar ist in diesem Modus standardmäßig an: Der andere Browser kann die Startseite öffnen und Ihren Namen aus der Liste an diesem Anschluss wählen. Schalten Sie Auffindbar aus, um nur per Link zu teilen. Lassen Sie Privat in gemeinsam genutzten Netzen an."

[[faq]]
q = "Wie findet die Liste lokale Freigaben?"
a = "Diese Liste zeigt Link-Namen von Browsern mit derselben öffentlichen IPv4-Adresse oder im selben IPv6-Subnetz. Meist bedeutet das denselben Router; ein gemeinsames VPN oder eine vom Internetanbieter geteilte Adresse kann andere Netze einschließen. IPv4- und IPv6-Verbindungen oder andere Routen können Geräte in der Nähe ausblenden. Internet ist erforderlich. Beim Öffnen einer Freigabe wird vor dem Verbinden gefragt; private Freigaben brauchen weiterhin die Zustimmung des Teilenden. Lokale Freigaben werden standardmäßig veröffentlicht; schalten Sie Auffindbar aus, um nur per Link zu teilen. Das Wählen eines Namens öffnet die Zustimmungsseite und stellt nie automatisch eine Verbindung her oder umgeht die private Freigabe. Die Suche hält nur Link-Namen, solange der Teilende verbunden ist, niemals Text, Dateinamen oder Dateiinhalte. Ist die Suche nicht verfügbar, funktioniert der Freigabe-Link weiterhin. In der Liste erscheinen nur Freigaben im Modus Lokales Netzwerk. Wählen Sie ihn vor dem Start; er ist standardmäßig aus."

