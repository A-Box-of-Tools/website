pledge = "Text und Dateien sind zwischen Ihrem Browser und jedem Leser verschlüsselt. Direkt ist der Standard. Bei ausgewähltem Cloud-Relais werden verschlüsselte Pakete über Cloudflare weitergeleitet; das Relais kann den Inhalt nicht lesen. Der Vermittler überträgt nur Verbindungsaufbau und auffindbare Link-Namen. Wir speichern keine geteilten Inhalte auf einem Server. Schließen Sie den Tab, endet die Quelle; Leser leeren ihre Ansicht nach der Endnachricht oder einem erkannten Verbindungsfehler. Bereits gespeicherte Kopien bleiben ihnen erhalten."

live_hint = "Öffnen Sie die DevTools und beobachten Sie beim Teilen den Tab „Netzwerk“. Beim Öffnen dieser Startseite erscheint ein WebSocket zum Vermittler für lokale Link-Namen. Das Starten einer Freigabe öffnet einen weiteren für den Verbindungsaufbau. Ein Leser nutzt einen Vermittlungssocket. Wie viel Sie auch tippen oder anhängen: Keiner davon trägt Text oder Dateien."

read_first = """
      , <code>src/main.js</code> für beide
      Hälften des Austauschs &mdash; der Tab des Teilenden und der des Lesers
      sind dieselbe Datei &mdash; und <code>src/markdown.js</code> für den
      Renderer, der auf Text von der anderen Seite der Leitung läuft und
      deshalb alles maskiert, bevor er irgendetwas ausgibt. Der vollständige
      Quelltext des Servers ist <code>workers/rendezvous/worker.js</code> im
      selben Repository: ein Raum pro Link-Name, der nichts hält als die
      offenen Verbindungen. Die zusätzliche Suche hält nur veröffentlichte Link-Namen an offenen Verbindungen, niemals Text oder Dateien."""

