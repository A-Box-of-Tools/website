[[privacy]]
title = "Die Verarbeitung findet in diesem Browser statt."
body = "Dieses Werkzeug verarbeitet Eingaben und Ergebnisse im Browser. Sein Verarbeitungscode lädt sie nicht zur Verarbeitung hoch. Content-Security-Policy begrenzt Ressourcen und Verbindungsziele; erlaubte Hosts können jedoch Anfragen empfangen. Die Richtlinie prüft keine Nutzdaten und beweist allein keine ausbleibende Übertragung. Vergleichen Sie Quelltext und konkrete Anfragen oder führen Sie die lokale Operation ohne Verbindung aus."

[[privacy]]
title = "RAW-Vorschauen werden auf diesem Gerät gelesen."
body = "Viele Kamera-RAW-Dateien enthalten eine von der Kamera gerenderte JPEG-Vorschau. Dieses Werkzeug geht die Verzeichnisse der Datei durch und nimmt die größte brauchbare Vorschau als Ausschnitt. Die Zahl für das Prüfen zählt die gelesenen Kopf- und Verzeichnisdaten; beim Dekodieren wird zusätzlich der JPEG-Ausschnitt gelesen. Die Sensordaten werden nie dekodiert, und die Zeile zeigt die tatsächlichen Maße der Vorschau."

[[privacy]]
title = "Die Arbeit passiert in einem Worker auf diesem Gerät, nicht auf einem Server."
body = "Stacken kann Minuten dauern; ein Worker rechnet, während die Seite reagiert, Fortschritt zeigt und Abbruch erlaubt. Es ist ein weiterer Thread dieses Browsers, siehe <code>src/worker.js</code>. Dateireferenzen werden lokal ohne Upload übergeben. Der Verarbeitungscode liest und kombiniert Dateien auf diesem Gerät. Prüfen Sie ihn, statt die Zielrichtlinie der Seite als Beweis für Datenwege des Workers zu behandeln."

[[privacy]]
title = "Ablauf-Ereignisse zählen feste Schritte."
body = " Die Ablauf-Ereignisse der Website können feste Schritte zählen, etwa das Hinzufügen von Eingaben, den Start eines Stacks, ein fertiges Ergebnis, ein Problem, einen Abbruch oder das Speichern. Sie verwenden den Namen des Werkzeugs und feste Schrittbezeichnungen; Navigationsereignisse verwenden feste Namen für Ausgangs- und Zielseite. Sie enthalten keine Fotos, Dateinamen, Kameradaten, Anzahl der Aufnahmen, Abmessungen, gewählten Methoden, Einstellungen, Verarbeitungszeiten oder Ergebnisinhalte. Die freiwillige Frage nach einem Download sendet einen Daumen hoch oder runter und einen festen Grund."

[[privacy]]
title = "Läuft offline."
body = """
 Trennen Sie die Netzverbindung, und das Werkzeug
      bleibt, wie es ist, weil nie ein Netzschritt darin war. Der Worker und jedes
      Modul, das er lädt, werden vom Service Worker dieser Seite
      zwischengespeichert, eine installierte Kopie stackt RAW-Dateien also mit
      gezogenem Stecker."""

[[howto]]
title = "Wählen Sie die Aufnahmen."
body = "Eine Serie, eine Intervallaufnahme oder ein Ordner voller RAW-Dateien mit brauchbaren JPEG-Vorschauen. Warten Sie, bis alle Dateien geöffnet sind. Jede Zeile zeigt, was darin gefunden wurde: bei RAW die Kamera und die tatsächlichen Maße der eingebetteten Vorschau. Dateien, die sich nicht öffnen ließen, werden aufgelistet, damit Sie sehen, was fehlt."

[[howto]]
title = "Nehmen Sie die Methode, die zu dem passt, was weg soll."
body = "Rauschen: Mittelwert oder Sigma-Clipping, um abweichende Werte zu verwerfen. Leute, Autos oder ein vorbeifliegendes Flugzeug: Median, wenn sie jeden Teil der Szene in weniger als der Hälfte der Aufnahmen verdecken. Sternspuren: Aufhellen. Eine Makroaufnahme entlang des Fokusrings: Focus Stacking. Der Hinweis unter dem Menü erklärt die Methode und ihre Grenzen."

[[howto]]
title = "Entscheiden Sie, ob die Aufnahmen ausgerichtet werden müssen."
body = "Beginnen Sie mit Automatisch: Es misst Verschiebung, Drehung und Maßstab und korrigiert dann die Perspektive, wenn zuverlässige Bereiche über das Bild verteilt übereinstimmen. Das ist hilfreich für Sternaufnahmen mit großem Bildfeld. Nur verschieben braucht weniger Messarbeit für eine ruhige Serie. Wählen Sie Nein, wenn die Aufnahmen bereits zusammenpassen, oder für Sternspuren, bei denen die Bewegung des Himmels erhalten bleiben soll. Ein festes Stativ hält die Sterne nicht ausgerichtet. Jede Aufnahme wird gegen die als Bezug markierte gemessen. Das ist zunächst die erste: &bdquo;Als Bezug nehmen&ldquo; versetzt die Markierung und lässt die Reihenfolge der Liste bestehen."

[[howto]]
title = "Lesen Sie die vier Zahlen und drücken Sie dann den Knopf."
body = " Vor dem Start zeigt die Seite die geplante Ergebnisgröße, den geschätzten Speicher für den Stack, die geplanten Dekodiervorgänge beim Stacken und die beim Prüfen gelesenen Bytes. Browserinternes und Speicherbereinigung können mehr Speicher brauchen als die modellierten Puffer; die Zahlen sind ein Plan und keine Garantie für den Gesamtverbrauch. Bei einem Stack in Bändern schlägt die Seite eine kleinere Arbeitsauflösung vor. Vergleichen Sie danach Bezug und Ergebnis in tatsächlicher Pixelgröße und prüfen Sie die Ausrichtungsdetails vor dem Download. Mit den Weitergabe-Links neben dem Download können Sie das fertige Bild skalieren oder komprimieren, ohne die Datei erneut zu wählen."

[[faq]]
q = "Werden meine Fotos irgendwohin hochgeladen?"
a = """
        Nein. Jede Aufnahme wird von Ihrem eigenen Browser auf Ihrer eigenen
        Hardware geöffnet, dekodiert, ausgerichtet, gestackt und geschrieben.
        Netzfunktionen hat dieses Werkzeug keine, es ruft nie etwas ab und sendet
        nie etwas, und in der <code>Content-Security-Policy</code> der Seite steht
        jede Adresse, die sie kontaktieren darf. Keine davon gehört uns. Laden Sie
        die Seite einmal, trennen Sie die Internetverbindung, und sie arbeitet
        weiter. Das zählt hier schwerer als bei den meisten Werkzeugen, schlicht
        wegen der Menge: Ein Stapel aus zwanzig RAW-Aufnahmen ist rund ein
        Gigabyte, und ein Gigabyte Fotos hochzuladen, damit jemand den Mittelwert
        daraus bildet, ist genau das, wozu es dieses Werkzeug gibt."""

[[faq]]
q = "Welche RAW-Formate kann er lesen, und wie?"
a = "<span id=\"faq-raw\"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF, RAF, RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL und verwandte Formate werden unterstützt, wenn eine brauchbare JPEG-Vorschau enthalten ist. Das Werkzeug geht die Verzeichnisse durch und nimmt die größte gefundene Vorschau. Sie kann kleiner als das Sensorbild sein oder ganz fehlen. <strong>Die Sensordaten werden nicht dekodiert.</strong> Die Pixel tragen Weißabgleich und Bildstil der Kamera mit acht Bit pro Kanal. Prüfen Sie die Maße in der Zeile. Die Prüfzahl zählt Kopf- und Verzeichnisdaten; beim Dekodieren wird auch der JPEG-Ausschnitt gelesen."

[[faq]]
q = "Warum dann nicht die Sensordaten richtig dekodieren?"
a = "Das Dekodieren der Sensordaten bräuchte eine RAW-Engine wie LibRaw oder dcraw mit den Kompressionsverfahren der einzelnen Kameras. Eine eingebettete JPEG-Vorschau hält dieses Werkzeug klein und nutzt den Bilddecoder des Browsers. Dabei werden die Wiedergabe der Kamera und die Vorschauauflösung der Datei übernommen. Für eigene RAW-Entwicklungseinstellungen entwickeln Sie die Aufnahmen zuerst und exportieren JPEG- oder PNG-Dateien zum Stacken."

[[faq]]
q = "Wie viele Aufnahmen schafft er, und wie groß?"
a = "Sechs der sieben Methoden verwenden Akkumulatoren, deren Größe nicht mit der Zahl der Aufnahmen wächst. Mittelwert, Aufhellen, Abdunkeln, Addieren und Focus Stacking brauchen einen Durchlauf je Band, Sigma-Clipping zwei. Median hält die Werte jeder Aufnahme für das aktuelle Band und braucht deshalb mit mehr Aufnahmen mehr Speicher. Jede Methode kann in Bänder aufgeteilt werden, wenn ihre Arbeitspuffer das Budget des Werkzeugs überschreiten. Dann werden die Aufnahmen für jedes Band erneut dekodiert. Die Seite schätzt diese Puffer und zeigt die geplanten Dekodiervorgänge beim Stacken. Prüfen und Ausrichten brauchen weitere Arbeit, und die internen Codec- und GPU-Puffer des Browsers können mehr Speicher brauchen als geschätzt."

[[faq]]
q = "Was macht das Ausrichten der Aufnahmen eigentlich?"
a = "Das Werkzeug misst die Verschiebung jeder Aufnahme gegenüber dem Bezug und schiebt sie zurück, auf Bruchteile eines Pixels genau. Es verwendet Phasenkorrelation: Verschiebung zeigt sich als Phasenunterschied zwischen den Spektren. Eine Fouriertransformation je Bild findet einen Versatz von zweihundert Pixeln so günstig wie einen von zwei. Drehung und Maßstab werden über dasselbe Verfahren mit dem Spektrum in logarithmisch-polaren Koordinaten bestimmt. Automatisch misst zusätzlich Bereiche über das Bild verteilt und korrigiert die Perspektive, wenn genügend zuverlässige Messungen übereinstimmen. Das hilft, Sterne in einem großen Bildfeld am Rand ebenso wie in der Mitte auszurichten. Lässt sich diese Zusatzkorrektur nicht zuverlässig messen, bleiben Drehung und Maßstab erhalten, und die Ausrichtungsdetails melden die Ausrichtung ohne Perspektivkorrektur. Die Korrektur gilt für das ganze Bild; sie kann weder ein unabhängig bewegtes Motiv noch jede Tiefe einer seitlich versetzten Szene ausrichten. Eine nach links verschobene Aufnahme reicht nicht mehr bis zum rechten Rand. Das Ergebnis wird deshalb auf den gemeinsamen Bereich beschnitten und kann etwas kleiner sein. So werden dunkle Ränder durch nicht abgedeckte Bereiche vermieden."

[[faq]]
q = "Welche Methode soll ich nehmen?"
a = "<strong>Mittelwert</strong> gegen Rauschen, wenn sich nichts bewegt hat: unabhängiges zufälliges Rauschen sinkt ungefähr um die Wurzel aus der Zahl der Aufnahmen. <strong>Median</strong> entfernt Dinge, die einen Teil der Szene in weniger als der Hälfte der Aufnahmen verdecken. <strong>Sigma-Clipping</strong> mittelt Werte nahe ihrem Mittelwert und verwirft Werte außerhalb der gewählten Schwelle. In kleinen Serien oder bei häufigem Auftreten können bewegte Objekte bleiben; wenn deren Entfernung Vorrang hat, ist Median die sicherere Wahl. <strong>Aufhellen</strong> für Sternspuren, Feuerwerk und Lichtmalerei. <strong>Abdunkeln</strong> gegen bewegte helle Dinge. <strong>Addieren</strong> mischt die dekodierten Aufnahmen additiv. Es arbeitet mit Acht-Bit-Bildwerten und bildet keine längere Kamerabelichtung nach. <strong>Focus Stacking</strong> für eine Makroaufnahme entlang des Fokusrings."

[[faq]]
q = "Warum hat mein Ergebnis acht Bit, wenn meine RAW-Dateien vierzehn haben?"
a = "Aus der RAW-Datei wird die JPEG-Vorschau der Kamera verwendet, und das Ergebnis ist ein Acht-Bit-PNG oder -JPEG. Mittelwert und Sigma-Clipping verwenden breitere Akkumulatoren und runden erst am Ende. So lässt sich aus verrauschten Aufnahmen ein saubererer Wert bestimmen, ohne jeden Zwischenschritt zu runden. Das gespeicherte Bild hat weiterhin acht Bit pro Kanal; Bittiefe und Dynamikumfang linearer Sensordaten gewinnt es nicht."

[[faq]]
q = "Kann ich Aufnahmen unterschiedlicher Größe oder aus verschiedenen Kameras stacken?"
a = "Ja, aber prüfen Sie, ob das beabsichtigt ist. Die größte Aufnahme bestimmt die Arbeitsfläche; andere werden eingepasst und zentriert. Das gespeicherte Ergebnis wird auf den gemeinsamen Bereich beschnitten. Verschiedene Bildformen oder die Ausrichtung können es daher kleiner als die geplante Fläche machen. Verschiedene Kameras mischen auch ihre Farbwiedergabe. Halten Sie Belichtung und Bildausschnitt gleich und prüfen Sie das Ergebnis mit dem Bezugsvergleich."

[[faq]]
q = "Er sagt, der Durchlauf werde in Bänder geteilt. Was heißt das?"
a = "Die Methode braucht mehr Arbeitsspeicher, als das Werkzeug auf einmal belegen will. Das Bild wird deshalb in waagerechte Streifen geteilt und streifenweise gestackt. Ausrichtungsgeometrie und Stacking-Methode bleiben gleich; die Neuberechnung der Pixel im Browser kann sich im letzten Bit leicht unterscheiden. Für jeden Streifen werden die Aufnahmen erneut gelesen, was länger dauert. Die Seite zeigt die Anzahl der Dekodiervorgänge. Die Arbeitsauflösung eine Stufe zu senken viertelt den Speicher und macht aus einem Durchlauf in Bändern fast immer einen einzigen. Der Hinweis nennt die passende Einstellung."

[[faq]]
q = "Warum läuft das Stacken in einem Worker?"
a = " Große Aufnahmen zu kombinieren kann Minuten dauern. Ein Worker übernimmt die Rechnerei, während die Seite reaktionsfähig genug bleibt, um den Fortschritt anzuzeigen und auf Abbrechen zu antworten. Er ist ein weiterer Strang in diesem Browser, der eine lokale Datei unter der Richtlinie der Seite ausführt. Ihre Fotos bleiben währenddessen auf diesem Gerät."

[[faq]]
q = "Ist das kostenlos, und brauche ich ein Konto?"
a = "Es ist kostenlos, ohne Konto, Anmeldung, Testphase oder Wasserzeichen. Es gibt keine Dienstquote für Zahl oder Größe der Aufnahmen. Die praktischen Grenzen sind der Speicher Ihres Geräts, die Canvas- und Decodergrenzen des Browsers und die Laufzeit. Die Seite trägt Werbung, die sie bezahlt; die Werbung bekommt nichts über Ihre Fotos."

