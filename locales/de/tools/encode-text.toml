[[privacy]]
title = "Was Sie einfügen, hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren darf,
      und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an dem ein
      eingefügtes Token eingesammelt werden könnte, und im Code steht auch nichts, das
      es dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 In <code>src/</code> gibt es nirgends ein
      <code>fetch</code>, kein <code>XMLHttpRequest</code> und kein
      <code>sendBeacon</code>. Jeder Kodierer und jeder Dekodierer sind Funktionen
      auf dieser Seite, die eine Zeichenkette nehmen und eine Zeichenkette
      zurückgeben."""

[[privacy]]
title = "Der Dekodierer sagt Ihnen, wenn etwas nicht stimmt."
body = """
 Das browsereigene <code>atob</code>
      nimmt Eingaben an, die es ablehnen sollte, und gibt etwas Plausibles zurück.
      Das Base64 hier ist von Hand geschrieben und wird gegen die Testvektoren aus
      RFC&nbsp;4648 geprüft, und wenn das Eingefügte kein Base64 ist, sagt es das,
      und sagt warum. Die Tests in <code>tests/js/text-encode.test.js</code> prüfen
      genau das."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee. Keinem
      davon wird ein Zeichen Ihres Textes übergeben. Jede Zeile, die ihn liest,
      auswertet oder schreibt, kommt von dieser Domain selbst und steht im
      Repository."""

[[privacy]]
title = "Es funktioniert offline."
