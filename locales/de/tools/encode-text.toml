[[faq]]
q = "Wird mein Text irgendwohin hochgeladen?"
a = """
        Nein. Jeder Kodierer und jeder Dekodierer auf dieser Seite sind Funktionen,
        die in Ihrem eigenen Browser auf Ihrer eigenen Hardware laufen. Eine
        Netzfunktion hat dieses Werkzeug überhaupt nicht, es ruft nie etwas ab und
        sendet nie etwas, und in der <code>Content-Security-Policy</code> der Seite
        steht jede Adresse, die sie kontaktieren darf; keine davon gehört uns. Genau
        deshalb sollte man es für ein Zugriffstoken oder ein Sitzungscookie nehmen:
        So etwas in den Dekodierer eines anderen einzufügen, heißt, es ihm zu
        geben."""

[[faq]]
q = "Ist das hier dasselbe Base64 wie überall sonst?"
a = """
        Ja, es wird gegen die Testvektoren aus RFC 4648 geprüft und nicht gegen sich
        selbst. Beide Alphabete lassen sich dekodieren, ein JWT mit <code>-</code> und
        <code>_</code> liest sich also genauso leicht wie eines mit <code>+</code> und
        <code>/</code>, und Eingaben, die auf 64 Zeichen umgebrochen sind, werden für
        Sie zusammengefügt. Kodiert wird über UTF-8-Bytes, ein Buchstabe mit Akzent
        oder ein Emoji übersteht die Hin- und Rückrunde also unbeschadet."""

[[faq]]
q = "Ist Base64 eine Verschlüsselung?"
a = """
        Nein, und es dafür zu halten, ist der klassische Fehler. Base64 ist eine
        Schreibweise: dieselben Bytes, geschrieben in einem Alphabet, das eine URL,
        eine E-Mail oder eine JSON-Zeichenkette übersteht. Jeder kann es zurücklesen
        &mdash; diese Seite tut es in einer Millisekunde &mdash;, es verbirgt also
        nichts und schützt nichts. Wenn das, was Sie haben, geheim ist, braucht es
        echte Verschlüsselung, bevor es kodiert wird, nicht an ihrer Stelle."""

[[faq]]
q = "Warum ist das Dekodieren fehlgeschlagen?"
a = """
        Weil das Eingefügte nicht ganz das ist, was dem Codec gesagt wurde, und der
        Fehler sagt, woran es liegt: ein Zeichen außerhalb des Base64-Alphabets,
        Füllzeichen an der falschen Stelle, ein Prozentzeichen ohne zwei Hex-Ziffern
        dahinter, oder Bytes, die sich zwar aus Base64 dekodieren lassen, aber kein
        UTF-8-Text sind &mdash; was meist bedeutet, dass das Original eine Datei war
        und keine Zeichenkette. Das browsereigene <code>atob</code> hätte stattdessen
        etwas Plausibles zurückgegeben; gesagt zu bekommen, was los ist, ist der
        ganze Sinn davon, etwas in einen Dekodierer einzufügen."""

[[faq]]
q = "Was ist der Unterschied zwischen den beiden URL-Kodierungen?"
a = """
        Ein einzelner Wert, oder die ganze Adresse. <em>Einen Wert</em> zu kodieren
        maskiert alles, dem eine URL eine Bedeutung gibt &mdash; Schrägstriche,
        Fragezeichen, Und-Zeichen &mdash;, und genau das wollen Sie für einen
        einzelnen Query-Parameter. Eine <em>ganze URL</em> zu kodieren lässt die
        Adresse funktionieren: Die Schrägstriche und das <code>?</code> bleiben, und
        nur die Zeichen, die eine URL gar nicht tragen kann, werden maskiert. Das
        Erste auf eine ganze Adresse angewandt zerstört die Adresse; das Zweite auf
        einen Wert angewandt verliert, wo der Wert endet."""

[[faq]]
q = "Wie groß darf die Datei sein?"
a = """
        Hier ist keine Grenze gesetzt, denn es zahlt kein Server dafür. Die praktische
        Obergrenze ist Ihr eigenes Gerät: Ein paar Megabyte Text sind kein Problem,
        und bei einem sehr langen Dokument wartet die Seite auf eine Pause in Ihrem
        Tippen, statt mit Ihnen um die Tastatur zu kämpfen."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase und
        keine Grenze dafür, wie viel Sie einfügen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihren Text übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung, und
        sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür, dass nichts
        hochgeladen wird. Ein Werkzeug, das Ihren Text zum Dekodieren wegschickt,
        bliebe in dem Moment stehen, in dem Sie den Stecker ziehen."""

