[[privacy]]
title = "Ihre Videos haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Datei landen könnte, und im Code steht auch nichts, das sie dorthin
      schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Eine Netzfunktion hat dieses Werkzeug
      überhaupt nicht. Es gibt keine Adresse zum Einfügen, nichts herunterzuladen
      und keine Engine, die beim ersten Gebrauch nachgeladen wird. Jedes Byte, das
      Ihr Video berührt, kam beim Laden der Seite von dieser Domain selbst."""

[[privacy]]
title = "Dekodiert wird lokal."
body = """
 Die Einzelbilder laufen durch WebCodecs in
      Ihrem eigenen Browser oder durch dieselbe Wiedergabe-Engine, die Ihnen den
      Clip ohnehin zeigen würde. Das Bild wird auf diesem Gerät auf eine Leinwand
      gezeichnet und geht von dort direkt in einen Download."""

[[privacy]]
title = "Die Datei wird in Häppchen von wenigen Megabyte gelesen."
body = """
 Ein Video ist
      die eine Art Datei hier, die nicht verlässlich in den Arbeitsspeicher passt,
      also wird sie nie ganz geladen. Der Leser nimmt sich ein Fenster um das
      Einzelbild herum, nach dem Sie gefragt haben. Genau deshalb öffnet sich ein
      Clip von zwei Gigabyte so schnell wie ein kleiner."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihr
      Video übergeben, weder eine Datei noch ein Einzelbild, ein Name, eine Größe,
      eine Länge oder die Stelle, an der Sie stehen geblieben sind. Jede Zeile,
      die liest, dekodiert oder zeichnet, kommt von dieser Domain selbst und steht
      im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihr Video bekommt er nichts."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie ein Video aus."
body = """
 Ziehen Sie ein MP4, MOV, M4V oder
      WebM auf das Auswahlfeld oder suchen Sie eines von Hand heraus. Der Browser
      liest es direkt von Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Suchen Sie die Stelle."
body = """
 Spielen Sie ab und halten Sie an, wo Sie
      wollen, oder ziehen Sie den Regler. Bei einem MP4 rückt der Regler je Schritt
      um genau ein Einzelbild vor, zwischen dem, was Sie sehen, und dem, was Sie
      speichern, wird also nichts gerundet. Die Pfeiltasten gehen ein Einzelbild
      weiter, mit gehaltener <kbd>Umschalttaste</kbd> zehn."""

[[howto]]
title = "Wählen Sie ein Format."
body = """
 PNG speichert das Einzelbild genau so,
      wie es dekodiert wurde, und das ist hier mit &bdquo;voller Qualität&ldquo;
      gemeint. JPEG und WebP sind kleiner und legen eine zweite Kompression über
      die des Videos. Für eine Vorschau ist das in Ordnung, für alles, was
      hinterher noch bearbeitet wird, nicht."""

[[howto]]
title = "Greifen Sie eines, oder eine Reihe."
body = """
 Ein einzelnes Standbild geht
      direkt in Ihre Downloads. &bdquo;Alle N Sekunden&ldquo; geht den Clip einmal
      durch und nimmt an jeder Marke ein Bild. Das ist für Übersichtstafeln und
      Vorschaubilder nützlich, und es kommt als ein ZIP heraus statt als hundert
      Speicherabfragen."""

[[faq]]
q = "Wird mein Video irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest und dekodiert es auf Ihrer eigenen
        Hardware. Eine Serverseite hat dieses Werkzeug nicht, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die sie
        kontaktieren darf; keine davon gehört uns. Wer lieber prüft als glaubt,
        trennt die Internetverbindung und greift trotzdem ein Standbild."""

[[faq]]
q = "Was heißt &bdquo;volle Qualität&ldquo; eigentlich?"
a = """
        Zweierlei. Das Standbild wird in der Auflösung des Videos gespeichert und
        nicht in der Größe der Vorschau auf der Seite. Ein 4K-Clip ergibt also ein
        Bild von 3840 x 2160. Und mit PNG wird das Einzelbild genau so abgelegt,
        wie es aus dem Dekoder kam, die Datei enthält also das Bild, das auch im
        Video steht, ohne eine zweite Runde Kompression darüber. Ein Bildschirmfoto
        eines Abspielfensters gibt Ihnen keines von beidem: Es hat die Größe des
        Fensters und entsteht, nachdem der Player skaliert und farblich angepasst
        hat."""

[[faq]]
q = "Aus welchen Videoformaten kann ich ein Einzelbild nehmen?"
a = """
        MP4, M4V und MOV werden direkt gelesen, egal was darin steckt, also H.264,
        HEVC, AV1 oder VP9, solange Ihr Browser diesen Codec dekodieren kann. Das
        ist der exakte Weg, auf dem das Werkzeug einzelne Einzelbilder ansprechen
        kann. Alles andere, was Ihr Browser abspielen kann, allen voran WebM, wird
        behandelt, indem der Player an die Stelle gesetzt und gezeichnet wird, was
        er zeigt. Das ergibt weiterhin ein Bild in voller Größe, landet aber auf
        dem Einzelbild, das der Player ausgesucht hat, und nicht auf dem, nach dem
        Sie gefragt haben. Was der Browser weder lesen noch abspielen kann, in der
        Praxis AVI, WMV, FLV und die meisten MKVs, wird mit einer entsprechenden
        Meldung abgelehnt."""

[[faq]]
q = "Kann ich Einzelbild für Einzelbild vorgehen?"
a = """
        Bei einem MP4 ja, und zwar genau. Das Werkzeug liest die Einzelbildliste
        der Datei selbst, die Pfeiltasten bewegen sich also zwischen den Bildern,
        die wirklich darin stehen. Das gilt auch für einen Clip mit schwankender
        Bildrate, bei dem ein fester Schritt von einer Dreißigstelsekunde
        abdriften würde. Auf dem Wiedergabeweg gibt es keine solche Liste, ein
        Schritt ist dort ungefähr ein Einzelbild, und die Seite sagt das auch."""

[[faq]]
q = "Warum steht mein Hochkantvideo vom Handy hier richtig herum?"
a = """
        Weil die Drehung mit Absicht angewendet wurde. Ein Telefon filmt im
        Querformat und schreibt eine Vierteldrehung in die Datei, statt die Pixel
        zu drehen. Das Einzelbild, das ein Dekoder herausgibt, liegt also auf der
        Seite, und jeder Player dreht es auf dem Weg zu Ihrem Bildschirm. Ein
        Werkzeug, das diesen Schritt überspringt, speichert ein plausibles Bild vom
        richtigen Moment, nur quer. Dieses liest die Drehung von der Spur ab und
        wendet sie an, bevor überhaupt etwas gezeichnet wird."""

[[faq]]
q = "Gibt es eine Grenze für Größe oder Länge des Videos?"
a = """
        Im Werkzeug ist keine Grenze eingebaut, und die Datei wandert auch nicht
        auf einmal in den Arbeitsspeicher, sondern läuft in Häppchen von wenigen
        Megabyte durch. Deshalb öffnet sich ein langer Clip so schnell wie ein
        kurzer. Die Standbilder liegen bis zum Download auf der Seite, die
        praktische Obergrenze sind also ein paar hundert 4K-PNGs und nicht das
        Video selbst."""

[[faq]]
q = "Kann ich das Standbild hinterher skalieren oder zuschneiden?"
a = """
        Hier nicht, aber nebenan. Dieses Werkzeug speichert das Einzelbild, wie es
        ist. Größe oder Form zu ändern ist eine eigene Aufgabe mit eigenen
        Entscheidungen, und die
        <a href="../bildgroesse-aendern/">Bildgrößenänderung</a> kann beides,
        ebenfalls ohne etwas hochzuladen. Die Datei kleiner machen, ohne das Bild
        zu ändern, kann die
        <a href="../bild-komprimieren/">Bildkomprimierung</a>."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase
        und kein Wasserzeichen. Bezahlt wird die Seite über Werbung, und den
        Anzeigen wird nichts über Ihr Video übergeben."""

