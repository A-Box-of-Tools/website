      Konfigurationsdatei zu reparieren, ohne sonst etwas zu öffnen."""

[[howto]]
title = "Nehmen Sie das Ergebnis mit."
body = """
 Kopieren Sie es, oder laden Sie es als
      Datei herunter. Ein Vergleich kommt als <code>.patch</code> im Unified-Format
      herunter, und genau das erwarten ein Code-Review, <code>git apply</code> und
      jeder Diff-Betrachter."""

[[faq]]
q = "Wird mein Text irgendwohin hochgeladen?"
a = """
        Nein. Jeder Parser, jeder Kodierer und der Vergleich auf dieser Seite sind
        Funktionen, die in Ihrem eigenen Browser auf Ihrer eigenen Hardware laufen.
        Eine Netzfunktion hat dieses Werkzeug überhaupt nicht, es ruft nie etwas ab und
        sendet nie etwas, und in der <code>Content-Security-Policy</code> der Seite
        steht jede Adresse, die sie kontaktieren darf; keine davon gehört uns. Genau
        deshalb sollte man es für ein Zugriffstoken, ein Sitzungscookie oder einen
        Kundendatensatz nehmen: So etwas in den Formatierer eines anderen einzufügen,
        heißt, es ihm zu geben."""

[[faq]]
q = "Ändert das Formatieren von JSON etwas außer der Anordnung?"
a = """
        Nein, und das ist schwerer, als es klingt. Die Schlüssel behalten die
        Reihenfolge, in der Sie sie geschrieben haben. Ein Formatierer, der auf
        <code>JSON.parse</code> aufbaut, zieht zahlartige Schlüssel stillschweigend
        nach vorn, aus <code>{"10":a,"2":b}</code> wird also
        <code>{"2":b,"10":a}</code>. Zahlen behalten die Ziffern, die Sie getippt
        haben, eine zwanzigstellige Kennung verliert ihre letzten drei also nicht an
        eine Fließkommazahl, und <code>1e999</code> wird nicht zu <code>null</code>.
        Doppelte Schlüssel bleiben beide erhalten, denn der Standard sagt nicht, welcher
        gewinnt, und einen wegzuwerfen hieße, für Sie zu entscheiden."""

[[faq]]
q = "Welche Sprachen kann es formatieren?"
a = """
        JSON, XML, HTML, CSS und YAML. JSON, XML, HTML und CSS lassen sich auch flach
        pressen, YAML nicht: Seine Kurzform ist der Flow-Stil, und der ist unlesbar,
        und unlesbar ist das Gegenteil des Grundes, eine Datei überhaupt in YAML zu
        halten. JavaScript steht mit Absicht nicht auf der Liste, siehe die Frage
        weiter unten."""

[[faq]]
q = "Warum formatiert es kein JavaScript, Python oder SQL?"
a = """
        Weil eine Programmiersprache auszulegen bedeutet, sie richtig zu parsen, und
        ein Formatierer, der es fast richtig macht, ist schlimmer als gar keiner: Er
        erzeugt Code, der gut aussieht und etwas anderes tut. JSON, XML, CSS und YAML
        haben kleine genug Grammatiken, um von Hand gelesen und mit Tests geprüft zu
        werden, die Sie selbst ausführen können. Ein JavaScript-Formatierer ist
        Prettier, das ist ein Megabyte Parser, und der gehört in Ihren Editor und
        nicht auf eine Webseite."""

[[faq]]
q = "Was macht der Vergleich eigentlich?"
a = """
        Er findet die kürzeste Folge von Änderungen, die den linken Text in den rechten
        verwandelt, mit dem Myers-Algorithmus, demselben, den <code>git diff</code>
        benutzt. Am kürzesten ist das, was einen Vergleich lesbar macht: Eine in der
        Mitte eingefügte Zeile sollte als eine Einfügung erscheinen und nicht so, als
        hätte sich jede Zeile danach geändert. Innerhalb einer geänderten Zeile werden
        auch die Wörter markiert, die sich unterscheiden, ein Vergleich zweier Absätze
        zeigt also das verschobene Wort und nicht zwei ganze Absätze."""

[[faq]]
q = "Kann es zwei Dateien statt zweier Einfügungen vergleichen?"
a = """
        Ja. Ziehen Sie beide auf das Auswahlfeld, während der Reiter
        &bdquo;Vergleichen&ldquo; offen ist, dann landen sie je auf einer Seite, in
        der Reihenfolge, in der Sie sie fallen gelassen haben. Ihr Browser liest sie in
        diese Seite hinein, und weiter kommen sie nicht. Wenn Sie sie falsch herum
        abgelegt haben, tauschen Sie die Seiten."""

[[faq]]
q = "Was kommt bei einem Vergleich heraus, und kann ich es anwenden?"
a = """
        Der Download ist ein Unified Diff, also das Format mit
        <code>@@ -3,5 +3,5 @@</code>, das <code>git apply</code>, <code>patch</code>
        und jedes Code-Review-Werkzeug lesen. Kopieren legt dasselbe in Ihre
        Zwischenablage. Was auf dem Bildschirm steht, ist eine Ansicht davon:
        nebeneinander oder in einer Spalte, wobei die unveränderten Teile zu einer Zahl
        zusammengeklappt sind, sofern Sie nicht alle sehen wollen."""

[[faq]]
q = "Ist das hier dasselbe Base64 wie überall sonst?"
a = """
        Ja, es wird gegen die Testvektoren aus RFC 4648 geprüft und nicht gegen sich
        selbst. Beide Alphabete lassen sich dekodieren, ein JWT mit <code>-</code> und
        <code>_</code> liest sich also genauso leicht wie eines mit <code>+</code> und
        <code>/</code>, und Eingaben, die auf 64 Zeichen umgebrochen sind, werden für
        Sie zusammengefügt. Kodiert wird über UTF-8-Bytes, ein Buchstabe mit Akzent
        oder ein Emoji übersteht die Hin- und Rückrunde also unbeschadet."""

[[faq]]
q = "Mein YAML sagt no, und aus dem JSON wurde eine Zeichenkette. Warum?"
a = """
        Weil es eine Zeichenkette ist: Hier wird YAML 1.2 gelesen und nicht 1.1. In
        YAML 1.1 waren <code>yes</code>, <code>no</code>, <code>on</code> und
        <code>off</code> Wahrheitswerte, und das ist der berühmte Fehler, der den
        Ländercode für Norwegen zu <code>false</code> macht. YAML 1.2 hat das
        abgeschafft, und dieses Werkzeug ebenso: Nur <code>true</code>,
        <code>false</code>, <code>null</code> und <code>~</code> werden als etwas
        anderes gelesen als Text. In die andere Richtung werden diese Wörter
        <em>in Anführungszeichen</em> zurückgeschrieben, obwohl dieses Werkzeug sie
        auch ohne als Text läse, denn was die Datei als Nächstes öffnet, tut das
        vielleicht nicht. PyYAML nimmt weiterhin standardmäßig 1.1. Streng zu lesen und
        vorsichtig zu schreiben ist die einzige Kombination, die in beide Richtungen
        stimmt."""

[[faq]]
q = "Was geht bei der Umwandlung von YAML nach JSON verloren?"
a = """
        Kommentare, denn JSON hat keinen Ort für sie. Anker, Aliase und Tags werden
        rundheraus abgelehnt statt geraten: Jedes davon sagt etwas, was JSON nicht sagen
        kann, und ein Umwandler, der sich stillschweigend für eine Auslegung entschiede,
        gäbe Ihnen ein Dokument, das nicht das ist, was in der Datei stand. In die
        andere Richtung geht nichts verloren: Jedes JSON-Dokument ist bereits ein
        YAML-Dokument."""

[[faq]]
q = "Was geht bei der Umwandlung von JSON nach XML verloren?"
a = """
        Der Unterschied zwischen einem leeren Objekt, einem leeren Array und einer
        leeren Zeichenkette, die alle zu einem leeren Element werden, und der Typ jedes
        Werts, denn XML hat keine Typen. Deshalb lässt die Rückumwandlung auch alles
        als Zeichenkette stehen, statt zu entscheiden, dass <code>8080</code> eine Zahl
        war. Aus einem Array wird ein wiederholtes Element, denn nur diese Form lässt
        sich zurücklesen, und bei einem Schlüssel, den ein Elementname nicht tragen
        kann, werden die sperrigen Zeichen ersetzt, statt ein Dokument auszugeben, das
        kein Parser liest."""

[[faq]]
q = "Ändert das Neu-Einrücken von HTML das Aussehen der Seite?"
a = """
        Es kann, und das wird hier ehrlich gesagt. Leerraum zwischen zwei
        Inline-Elementen ist ein Abstand zwischen zwei Wörtern, ihn zu verschieben ist
        also nicht umsonst. Zwei Dinge halten das im Zaum: <code>&lt;pre&gt;</code> und
        <code>&lt;textarea&gt;</code> werden exakt so übernommen, wie sie waren, und
        ein Element, das nichts als Text enthält, bleibt in einer Zeile. Alles andere
        wird ausgelegt."""

[[faq]]
q = "Wie groß darf die Datei sein?"
a = """
        Hier ist keine Grenze gesetzt, denn es zahlt kein Server dafür. Die praktische
        Obergrenze ist Ihr eigenes Gerät: Ein paar Megabyte JSON sind kein Problem. Ein
        Vergleich zweier Texte, die überhaupt nichts gemeinsam haben, hört früh auf und
        sagt das, statt eine Minute damit zu verbringen, das Offensichtliche zu
        beweisen. Und ein sehr langer Vergleich zeichnet die ersten paar tausend Zeilen
        und überlässt den Rest dem heruntergeladenen Patch."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase und
        keine Grenze dafür, wie viel Sie einfügen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihren Text übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung, und
        sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür, dass nichts
        hochgeladen wird. Ein Werkzeug, das Ihren Text zum Formatieren wegschickt,
        bliebe in dem Moment stehen, in dem Sie den Stecker ziehen."""

