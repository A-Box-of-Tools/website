pledge = """
    Alle vier Aufgaben sind Rechnen auf einer Zeichenkette, und zwar hier, auf dieser
    Seite. Die Parser sind von Hand geschrieben und liegen in <code>src/</code>:
    <code>json.js</code>, <code>xml.js</code>, <code>css.js</code>,
    <code>yaml.js</code>. Der Vergleich ist der Myers-Algorithmus in
    <code>diff.js</code>, derselbe, den <code>git diff</code> benutzt. Eine
