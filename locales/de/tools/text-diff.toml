[[privacy]]
title = "Was Sie einfügen, hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren darf,
      und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an dem ein
      eingefügtes Token eingesammelt werden könnte, und im Code steht auch nichts, das
      es dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 In <code>src/</code> gibt es nirgends ein
      <code>fetch</code>, kein <code>XMLHttpRequest</code> und kein
      <code>sendBeacon</code>. Der Vergleich ist eine Funktion auf dieser Seite,
      die zwei Zeichenketten nimmt und zurückgibt, was sich geändert hat."""

[[privacy]]
title = "Der Algorithmus ist der übliche, vollständig lesbar."
body = """
 Der Myers-Algorithmus für das
      kürzeste Änderungsskript, derselbe, den <code>git diff</code> benutzt, von
      Hand geschrieben in <code>src/diff.js</code>, mit den Entscheidungen
      kommentiert. Die Tests in <code>tests/js/text-diff.test.js</code> beweisen,
      dass die Löschungen den linken Text wieder aufbauen und die Einfügungen den
      rechten, und genau das heißt bei einem Diff korrekt."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee. Keinem
      davon wird ein Zeichen Ihres Textes übergeben. Jede Zeile, die ihn liest,
      auswertet oder schreibt, kommt von dieser Domain selbst und steht im
      Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil darin nie ein Schritt über das Netz vorgesehen
      war. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Fügen Sie beide Texte ein, oder ziehen Sie die beiden Dateien her."
body = """
 Das Original links, die geänderte
      Fassung rechts. Zwei zugleich auf das Auswahlfeld gezogene Dateien landen je
      eine auf jeder Seite, in der Reihenfolge, in der Sie sie fallen gelassen
      haben; tauschen Sie die Seiten, wenn es andersherum war."""

[[howto]]
title = "Wählen Sie, wie Sie es lesen."
body = """
 Nebeneinander oder in einer Spalte. Ein
      Telefon beginnt mit einer Spalte, denn nebeneinander braucht zwei
      Textspalten, und ein Telefon hat Platz für ungefähr eine; das Menü ist so
      oder so gleich daneben."""

[[howto]]
title = "Ignorieren Sie, was keine Rolle spielt."
body = """
 Leerraum, Groß- und Kleinschreibung,
      leere Zeilen &mdash; jedes davon lässt sich ignorieren, damit eine neu
      formatierte Datei nicht wie hundert Änderungen aussieht. Standardmäßig wird
      die unveränderte Mitte zu einer Zahl zusammengeklappt, mit drei Zeilen zu
      beiden Seiten jeder Änderung."""

[[howto]]
title = "Lesen Sie, was sich geändert hat."
body = """
 Entfernte Zeilen sind links markiert,
      hinzugekommene rechts, und innerhalb einer geänderten Zeile sind die Wörter
      hervorgehoben, die sich unterscheiden &mdash; ein Vergleich zweier Absätze
      zeigt also das verschobene Wort und nicht zwei ganze Absätze."""

[[howto]]
title = "Nehmen Sie den Patch mit."
body = """
 Der Download ist ein <code>.patch</code>
      im Unified-Format, und genau das erwarten ein Code-Review,
      <code>git apply</code> und jeder Diff-Betrachter. Kopieren legt dasselbe in
      Ihre Zwischenablage."""

[[faq]]
q = "Werden meine Texte irgendwohin hochgeladen?"
a = """
        Nein. Der Vergleich ist eine Funktion, die in Ihrem eigenen Browser auf
        Ihrer eigenen Hardware läuft. Eine Netzfunktion hat dieses Werkzeug
        überhaupt nicht, es ruft nie etwas ab und sendet nie etwas, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die sie
        kontaktieren darf; keine davon gehört uns. Genau deshalb sollte man es für
        einen Vertrag, eine Konfigurationsdatei oder unveröffentlichten Code
        nehmen: So etwas in den Diff-Checker eines anderen einzufügen, heißt, beide
        Fassungen auf einmal herzugeben."""

[[faq]]
q = "Was macht der Vergleich eigentlich?"
a = """
        Er findet die kürzeste Folge von Änderungen, die den linken Text in den rechten
        verwandelt, mit dem Myers-Algorithmus, demselben, den <code>git diff</code>
        benutzt. Am kürzesten ist das, was einen Vergleich lesbar macht: Eine in der
        Mitte eingefügte Zeile sollte als eine Einfügung erscheinen und nicht so, als
        hätte sich jede Zeile danach geändert. Innerhalb einer geänderten Zeile werden
        auch die Wörter markiert, die sich unterscheiden, ein Vergleich zweier Absätze
        zeigt also das verschobene Wort und nicht zwei ganze Absätze."""

[[faq]]
q = "Kann es zwei Dateien statt zweier Einfügungen vergleichen?"
a = """
        Ja. Ziehen Sie beide zugleich auf das Auswahlfeld, dann landen sie je auf
        einer Seite, in der Reihenfolge, in der Sie sie fallen gelassen haben. Ihr
        Browser liest sie in diese Seite hinein, und weiter kommen sie nicht. Wenn
        Sie sie falsch herum abgelegt haben, tauschen Sie die Seiten."""

[[faq]]
q = "Was kommt bei einem Vergleich heraus, und kann ich es anwenden?"
a = """
        Der Download ist ein Unified Diff, also das Format mit
        <code>@@ -3,5 +3,5 @@</code>, das <code>git apply</code>, <code>patch</code>
        und jedes Code-Review-Werkzeug lesen. Kopieren legt dasselbe in Ihre
        Zwischenablage. Was auf dem Bildschirm steht, ist eine Ansicht davon:
        nebeneinander oder in einer Spalte, wobei die unveränderten Teile zu einer Zahl
        zusammengeklappt sind, sofern Sie nicht alle sehen wollen."""

[[faq]]
q = "Kann es Leerraum, Groß- und Kleinschreibung oder leere Zeilen ignorieren?"
a = """
        Ja, jedes für sich. Leerraum zu ignorieren lässt eine neu formatierte Datei
        als unverändert vergleichen; Groß- und Kleinschreibung zu ignorieren
        behandelt <code>Error</code> und <code>error</code> als dasselbe Wort; leere
        Zeilen zu ignorieren überspringt die Zeilen, die nichts enthalten. Die
        Zählung über dem Ergebnis sagt dann, dass die beiden gleich sind, sobald die
        Unterschiede ignoriert sind, die Sie ignorieren wollten &mdash; was nicht
        dieselbe Aussage ist wie identisch, und die Seite hält die beiden Aussagen
        auseinander."""

[[faq]]
q = "Wie groß darf der Vergleich sein?"
a = """
        Hier ist keine Grenze gesetzt, denn es zahlt kein Server dafür. Zwei Texte
        von zwanzigtausend Zeilen mit einer Handvoll Änderungen vergleichen sich
        sofort, denn der gemeinsame Anfang und das gemeinsame Ende werden
        abgeschnitten, bevor die eigentliche Arbeit beginnt. Ein Vergleich zweier
        Texte, die überhaupt nichts gemeinsam haben, hört früh auf und sagt das,
        statt eine Minute damit zu verbringen, das Offensichtliche zu beweisen, und
        ein sehr langer Vergleich zeichnet die ersten paar tausend Zeilen und
        überlässt den Rest dem heruntergeladenen Patch."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase und
        keine Grenze dafür, wie viel Sie einfügen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihren Text übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung, und
        sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür, dass
        nichts hochgeladen wird. Ein Werkzeug, das Ihre Texte zum Vergleichen
        wegschickt, bliebe in dem Moment stehen, in dem Sie den Stecker ziehen."""

