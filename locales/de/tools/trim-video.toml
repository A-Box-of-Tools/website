name = "Video-Schneider"
heading = "Video&nbsp;schneiden <span class=\"h1-kw\">&mdash; online kürzen und zusammenfügen</span>"
tagline = "Beim Abspielen markieren, was bleiben soll. Und alles davon als ein Video zurückbekommen."

title = "Video online schneiden &mdash; nur behalten, was Sie wollen, ohne Upload"
description = "Ein Video ansehen und beim Abspielen jeden behaltenswerten Teil markieren, dann diese Teile als eine Datei speichern. Läuft im Browser: kein Upload, nichts wird neu kodiert, auch offline."
og_title = "Video-Schneider &mdash; nur behalten, was Sie wollen, ohne etwas hochzuladen"
og_description = "Drücken Sie beim Abspielen I und O, um jeden behaltenswerten Teil zu markieren. Die markierten Teile werden Einzelbild für Einzelbild als ein Video zurückgeschrieben, ohne dass etwas hochgeladen wird."
og_image_alt = "Video-Schneider - die gewünschten Teile markieren und als ein Video speichern, im Browser"

pledge = """
    Ihr Video wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware gelesen,
    markiert, geschnitten und geschrieben. Abrufen oder senden kann hier nichts,
    denn eine Netzfunktion hat dieses Werkzeug überhaupt nicht. Und selbst wenn
    es einen Weg nach draußen gäbe, stünde am anderen Ende dieser Seite kein
    Server, an den ein Video gehen könnte."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und schneiden Sie ein Video. Keine einzige
      Anfrage trägt ein Einzelbild, einen Dateinamen oder ein Byte dessen, was
      Sie ausgewählt haben. Oder trennen Sie die Internetverbindung und
      schneiden Sie trotzdem eines. Ein Werkzeug, das Ihr Video zum Schneiden
      wegschickt, bliebe dabei einfach stehen."""

read_first = """
, <code>src/segments.js</code> für die Markierungen und
      die Datei, in die sie gespeichert werden, <code>src/demux.js</code> für den
      Leser, der die Einzelbilder in einem MP4 findet, <code>src/ranges.js</code>
      für die Rechnung, die aus einer Markierung eine Folge von Samples macht,
      und <code>src/copy.js</code> für die Schleife, die diese Samples in die neue
      Datei bewegt. Keines davon importiert etwas, das eine Anfrage stellen
      könnte."""

howto_heading = "So schneiden Sie ein Video"

card = """
            Beim Abspielen jeden behaltenswerten Teil markieren und sie dann als
            ein Video speichern. Die Einzelbilder werden kopiert statt neu
            kodiert, es geht also nichts verloren."""

