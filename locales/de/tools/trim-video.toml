[[privacy]]
title = "Die Verarbeitung findet in diesem Browser statt."
body = "Dieses Werkzeug verarbeitet Eingaben und Ergebnisse im Browser. Sein Verarbeitungscode lädt sie nicht zur Verarbeitung hoch. Content-Security-Policy begrenzt Ressourcen und Verbindungsziele; erlaubte Hosts können jedoch Anfragen empfangen. Die Richtlinie prüft keine Nutzdaten und beweist allein keine ausbleibende Übertragung. Vergleichen Sie Quelltext und konkrete Anfragen oder führen Sie die lokale Operation ohne Verbindung aus."

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Eine Netzfunktion hat dieses Werkzeug
      überhaupt nicht. Es gibt keine Adresse zum Einfügen, nichts
      herunterzuladen und keine Engine, die beim ersten Gebrauch nachgeladen
      wird. Jedes Byte, das Ihr Video berührt, kam beim Laden der Seite von
      dieser Domain selbst."""

[[privacy]]
title = "Auf dem normalen Weg wird nicht einmal dekodiert."
body = "Beim Kopieren werden kompatible kodierte Bilder unverändert in die Ausgabe verschoben. Dateiausschnitte verweisen auf die Originalbytes statt sie zu dekodieren. Exakte Schnitte und Aufnahmen dekodieren und kodieren das Bild lokal neu; die Exportsteuerung zeigt diese Wahl."

[[privacy]]
title = "Die Markierungsdatei entsteht in der Seite."
body = """
 Beim Speichern Ihrer
      Markierungen wird aus den Zahlen, die ohnehin auf dem Bildschirm stehen,
      eine Textdatei geschrieben, direkt in Ihre Downloads. Beim Laden wird eine
      solche hier gelesen. Keines von beidem kommt einem Netz nahe, und keines
      trägt etwas anderes als Zeiten."""

[[privacy]]
title = "Kompatibler Ton wird kopiert."
body = "Beim MP4-Kopieren und exakten Schneiden werden kompatible Audiosamples unverändert kopiert. Inkompatibler Ton beim Verbinden kann lokal dekodiert, neu abgetastet und kodiert werden; Aufnahmen kodieren Ton ebenfalls neu. Die Seite benennt das vor dem Export. Kein Audio-Upload."

[[privacy]]
title = "Wo Einzelbilder dekodiert werden, passiert das hier."
body = """
 Der exakte
      Schnitt und die Vorschau für eine Datei, die dieser Browser nicht abspielt,
      laufen über WebCodecs auf Ihrem eigenen Gerät. Das ist derselbe Decoder,
      der Ihnen das Video ohnehin zeigen würde, am selben Ort ausgeführt."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihr
      Video übergeben, weder eine Datei noch ein Einzelbild, ein Name, eine
      Größe, eine Länge oder die Stelle, an der Sie geschnitten haben. Jede
      Zeile, die liest, schneidet und schreibt, kommt von dieser Domain selbst
      und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """
      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihr Video bekommt er nichts."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie ein Video aus."
body = """
 Ziehen Sie ein MP4, MOV, M4V oder WebM
      auf das Auswahlfeld. Der Browser liest es direkt von Ihrer Festplatte, und
      dabei geht nichts nach draußen. Ziehen Sie mehrere hinein, werden sie
      zusammengefügt, in der Reihenfolge, in der Sie sie abgelegt haben."""

[[howto]]
title = "Spielen Sie es ab und markieren Sie die gewünschten Teile."
body = """
 Drücken Sie
      <kbd>I</kbd>, wo ein Teil beginnen soll, und <kbd>O</kbd>, wo er enden
      soll, und das so oft Sie wollen. Jedes Paar wird zu einer Zeile in der
      Tabelle darunter und zu einem Band auf der Zeitleiste. <kbd>U</kbd> nimmt
      das letzte zurück, die <kbd>Leertaste</kbd> spielt ab und pausiert, und die
      Pfeiltasten springen in Fünf-Sekunden-Schritten. Ist der Moment schwer zu
      treffen, verlangsamen Sie die Wiedergabe."""

[[howto]]
title = "Bessern Sie die Markierungen nach."
body = """
 Jede Zeile lässt sich einzeln
      abspielen, durch Eintippen einer genauen Zeit neu takten, in der
      Reihenfolge nach oben oder unten schieben oder löschen. Die beiden Enden
      des ausgewählten Teils lassen sich außerdem auf der Zeitleiste ziehen. Die
      Summe oben ist die Laufzeit, auf die das fertige Video kommt."""

[[howto]]
title = "Behalten Sie sie, oder schneiden Sie sie heraus."
body = """
 Behalten ist der
      übliche Weg. Das fertige Video besteht dann aus den markierten Teilen, der
      Reihe nach zusammengefügt. Sie herauszuschneiden ist die andere Aufgabe,
      die Menschen wollen und selten finden. Markieren Sie die Werbung, die
      Stillen oder die Fehlstarts, und was übrig bleibt, wird ohne sie
      zusammengefügt."""

[[howto]]
title = "Schneiden und herunterladen."
body = """
        „Jedes Byte behalten“ übernimmt die Frames unverändert. Der erste Teil kann
        nicht abgespielte Frames ab einem früheren Keyframe enthalten; jeder spätere
        Teil muss auf einem Keyframe beginnen. „Genau hier schneiden“ dekodiert und
        kodiert jeden behaltenen Videoframe neu, damit die gewählten Schnittzeiten
        erhalten bleiben. Die Seite nennt das Verfahren und seine Auswirkungen, bevor
        Sie die Schaltfläche drücken."""

[[faq]]
q = "Wird mein Video irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, markiert, schneidet und schreibt es auf
        Ihrer eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und
        in der <code>Content-Security-Policy</code> der Seite steht jede Adresse,
        die sie kontaktieren darf; keine davon gehört uns. Wer lieber prüft als
        glaubt, trennt die Internetverbindung und schneidet trotzdem ein
        Video."""

[[faq]]
q = "Kann ich mehrere Teile desselben Videos behalten?"
a = """
        Genau dafür ist das hier da. Drücken Sie <kbd>I</kbd> und <kbd>O</kbd> so
        oft Sie wollen, während es läuft. Jedes Paar wird zu einer Zeile, und das
        fertige Video besteht aus allen Zeilen, der Reihe nach zusammengefügt,
        während alles andere verschwindet. Die meisten Online-Schneider geben
        Ihnen ein einziges Paar Griffe und fragen, welchen einen Abschnitt Sie
        behalten wollen. Das reicht, um einen Clip vorn und hinten zu stutzen,
        und nützt überhaupt nichts, wenn man eine Stunde Material einmal
        durchsieht und die sechs lohnenden Momente behalten will."""

[[faq]]
q = "Kostet das Schneiden Qualität?"
a = """
        „Jedes Byte behalten“ erhält die ursprünglich kodierten Frames und den Ton, ohne
        die Qualität zu verringern. Das ist für einen Abschnitt möglich oder für
        mehrere, wenn jeder spätere Abschnitt auf einem Keyframe beginnt. „Genau hier
        schneiden“ kodiert jeden behaltenen Videoframe neu und kopiert den Ton, soweit
        möglich. „Beim Abspielen aufzeichnen“ kodiert Bild und Ton neu. Das gewählte
        Verfahren zeigt Ihnen vor dem Export, was davon geschieht."""

[[faq]]
q = "Warum beginnt ein Teil früher, als ich ihn markiert habe?"
a = """
        Ein kopierter erster Abschnitt kann Frames ab dem vorherigen Keyframe enthalten,
        weil spätere Frames sie zum Dekodieren benötigen. Eine Schnittmarke weist den
        Player an, diese anfänglichen Frames zu überspringen; ignoriert er sie, kann die
        Wiedergabe zu früh beginnen. Browser können auch nicht abgespielte Frames an
        einer späteren Schnittstelle falsch behandeln. Deshalb ist Kopieren nicht
        verfügbar, wenn ein späterer Abschnitt zwischen Keyframes beginnt. Wählen Sie
        dafür „Genau hier schneiden“. Dieses Verfahren kodiert jeden behaltenen
        Videoframe neu. Die Seite zeigt vor dem Export das Verfahren und die Dauer
        eventuell mitgeführter Frames am Anfang an."""

[[faq]]
q = "Kann ich stattdessen die Werbung herausschneiden?"
a = """
        Ja. Markieren Sie sie und wählen Sie dann &bdquo;Sie
        herausschneiden&ldquo;. Zusammengefügt wird dann alles, was Sie
        <em>nicht</em> markiert haben, der Reihe nach. Dieselbe Liste von
        Markierungen beantwortet beide Fragen, Sie können also zwischen ihnen hin
        und her schalten und die Länge sich ändern sehen, ohne irgendetwas
        zweimal zu markieren."""

[[faq]]
q = "Kann ich meine Markierungen speichern und später weitermachen?"
a = """
        Ja. &bdquo;Markierungen speichern&ldquo; schreibt eine reine Textdatei
        mit einer Zeile je Teil, Anfang und Ende durch ein Komma getrennt, und
        &bdquo;Markierungen laden&ldquo; liest eine solche zurück. Angeboten
        werden zwei Formate, glatte Sekunden und <code>HH:MM:SS.mmm</code>, und
        beide halten sich an das Layout, das andere Werkzeuge dieser Art bereits
        verwenden. Eine hier geschriebene Datei lässt sich also an eines von
        jenen übergeben, und eine dort geschriebene auf diese Seite ziehen.
        Markieren ist sorgfältige Arbeit, und niemand sollte sie zweimal machen
        müssen."""

[[faq]]
q = "Welche Videoformate kann ich schneiden?"
a = """
        MP4, M4V und MOV werden direkt gelesen, egal was darin steckt, also
        H.264, HEVC, AV1 oder VP9. Einzelbilder zu kopieren heißt nicht, sie zu
        dekodieren, dieser Weg funktioniert also selbst bei einem Codec, für den
        Ihr Browser überhaupt keinen Decoder hat. Alles andere, was Ihr Browser
        abspielen kann, allen voran WebM, wird stattdessen abgespielt und dabei
        aufgezeichnet. Das funktioniert, dauert so lange, wie das Ergebnis lang
        ist, und kann nur einen Teil behalten. Was der Browser weder lesen noch
        abspielen kann, in der Praxis AVI, WMV, FLV und die meisten MKVs, wird
        gleich mit einer entsprechenden Meldung abgelehnt, statt auf halbem Weg
        zu scheitern."""

[[faq]]
q = "Gibt es eine Grenze für Größe oder Länge des Videos?"
a = """
        Im Werkzeug ist keine Grenze eingebaut, und auf dem Kopierweg wird die
        Datei kaum gelesen. Auf die Einzelbilder, die Sie behalten, wird nur
        gezeigt, statt sie zu laden. Vier Minuten aus einer vier Gigabyte großen
        Aufnahme zu behalten kostet damit etwa so viel, wie diese vier Minuten
        auf die Festplatte zu schreiben. Der exakte Schnitt läuft die Datei in
        Häppchen von wenigen Megabyte ab. So oder so setzt die fertige Datei die
        praktische Obergrenze, denn die wird vor dem Download im Arbeitsspeicher
        zusammengesetzt."""

[[faq]]
q = "Bleibt der Ton erhalten?"
a = """
        Auf beiden MP4-Wegen wird er Sample für Sample übernommen, ohne je
        dekodiert zu werden, und ist damit Byte für Byte das, was in der Datei
        stand. Eine Edit-Markierung hält jeden Teil auf eine Tausendstelsekunde
        genau mit seinem Bild in Deckung. Eine Ausnahme gibt es: das
        Zusammenfügen getrennter Videos, deren Ton unterschiedlich beschrieben
        ist, etwa mit verschiedenen Abtastraten. Dann lassen sich beide ohne
        Dekodierung nicht in eine Spur bringen, und die Seite sagt das, bevor sie
        es tut. Auf dem Aufzeichnungsweg wird er von der Wiedergabe abgegriffen
        und neu kodiert. So oder so gibt es ein Häkchen, um ihn ganz
        wegzulassen."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihr Video übergeben."""

