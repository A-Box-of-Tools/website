[[faq]]
q = "Wird mein Foto irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, wertet aus und schreibt neu, auf Ihrer
        eigenen Hardware. Netzfunktionen hat dieses Werkzeug keine, es ruft nie
        etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "Was ist EXIF, und was steckt sonst noch in einem Foto?"
a = """
        EXIF ist ein Block von Tags, den eine Kamera neben das Bild schreibt:
        Hersteller und Modell, die Belichtungseinstellungen, Datum und Uhrzeit
        auf die Sekunde genau, oft eine GPS-Position und manchmal eine
        Seriennummer. Häufig tragen Fotos noch mehr mit sich, etwa ein XMP-Paket
        mit XML aus einem Bildbearbeitungsprogramm, einen IPTC-Block mit
        Bildunterschrift und Urheberzeile, ein Farbprofil, eine kleine zweite
        Kopie des Bildes als Vorschaubild und eine Maker Note mit
        undokumentierten Herstellerdaten. Dieses Werkzeug listet all das auf."""

[[faq]]
q = "Verschlechtert das Entfernen der Metadaten die Bildqualität?"
a = """
        Nein, und das ist der wichtigste Grund, ein solches Werkzeug zu benutzen,
        statt das Foto neu zu speichern. Metadaten liegen im Container um das
        komprimierte Bild herum, nicht darin. Sie zu entfernen heißt, Einträge
        aus einer Liste zu löschen und die Liste wieder herauszuschreiben. Die
        komprimierten Bilddaten werden Byte für Byte übernommen, und das Ergebnis
        dekodiert daher zu exakt denselben Pixeln. Dekodiert wird nichts, und neu
        komprimiert erst recht nicht."""

[[faq]]
q = "Welche Dateiformate kann es verarbeiten?"
a = """
        JPEG, PNG und WebP. HEIC und AVIF werden zwar erkannt, aber nicht neu
        geschrieben. Es sind Box-Formate aus verschachtelten Atomen und
        bräuchten einen anderen Parser, also sagt das Werkzeug das lieber, statt
        eine kaputte Datei zu erzeugen. Ein reines TIFF bleibt ebenfalls
        draußen, weil in einem TIFF die Metadaten und die Pixel über dieselben
        Offsets adressiert werden."""

[[faq]]
q = "Erscheint mein Foto nach dem Entfernen gedreht?"
a = """
        Das kann passieren, und dafür gibt es eine Einstellung. Telefone nehmen
        das Bild meist so auf, wie der Sensor es gesehen hat, und ergänzen ein
        Orientation-Tag, das sagt, wie es zu drehen ist. Fällt dieses Tag weg,
        zeigen manche Betrachter das Foto quer. Die Option &bdquo;das
        Orientierungs-Tag behalten&ldquo; ist deshalb standardmäßig aktiv und
        schreibt einen winzigen EXIF-Block zurück, in dem nichts als dieses eine
        Tag steht, und auch das nur, wenn das Foto es tatsächlich gebraucht hat.
        Schalten Sie sie ab, wenn die Datei lieber gar kein EXIF tragen soll."""

[[faq]]
q = "Entfernt es den GPS-Standort?"
a = """
        Ja. Beim Entfernen aller Daten verschwindet das gesamte GPS-Verzeichnis,
        und Sie können den Standort auch einzeln löschen und den Rest behalten.
        Angezeigt wird die Position zuerst in Dezimalgrad, denn bei
        &bdquo;51 Grad, 30 Minuten, 26 Sekunden&ldquo; fällt nicht auf den ersten
        Blick auf, dass ein Foto das Gebäude benennt, in dem es aufgenommen
        wurde."""

[[faq]]
q = "Kann ich ein Tag ändern, statt es zu löschen?"
a = """
        Ja. Text-Tags, Datumsangaben, der ISO-Wert, die Orientierung und die
        Auflösung lassen sich alle bearbeiten, und ein paar gängige Tags können
        Sie einem Foto hinzufügen, das keine hat. Einen Vorbehalt gibt es. Beim
        Schreiben der Datei wird der EXIF-Block neu aufgebaut, und eine Maker
        Note enthält Offsets in den ursprünglichen Block. Neu aufgebaut ist sie
        für die Software des Herstellers womöglich nicht mehr lesbar. Löschen Sie
        sie in dem Fall, oder lassen Sie die Datei ganz unbearbeitet, wenn Ihnen
        daran liegt."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung und keine
        Testphase. Bezahlt wird die Seite über Werbung, und den Anzeigen wird
        nichts über Ihre Fotos übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihre Fotos zum
        Verarbeiten wegschickt, bliebe in dem Moment stehen, in dem Sie den
        Stecker ziehen."""

