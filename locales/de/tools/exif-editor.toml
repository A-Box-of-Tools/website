[[faq]]
q = "Wird mein Foto irgendwohin hochgeladen?"
a = """
        Nein. Die Datei wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware
        gelesen, ausgewertet und neu geschrieben. Dieses Werkzeug hat keinerlei
        Netzfunktion &mdash; es ruft nie etwas ab und sendet nie etwas &mdash; und
        die <code>Content-Security-Policy</code> der Seite nennt jede Adresse, die
        sie kontaktieren darf; keine davon gehört zu dieser Seite."""

[[faq]]
q = "Was ist EXIF, und was steckt sonst noch in einem Foto?"
a = """
        EXIF ist ein Block von Tags, den eine Kamera neben das Bild schreibt:
        Hersteller und Modell, die Belichtungseinstellungen, Datum und Uhrzeit auf
        die Sekunde genau, oft eine GPS-Position und manchmal eine Seriennummer.
        Häufig tragen Fotos noch mehr mit sich &mdash; ein XMP-Paket mit XML aus
        einem Bildbearbeitungsprogramm, einen IPTC-Block mit Bildunterschrift und
        Urheberzeile, ein Farbprofil, eine kleine zweite Kopie des Bildes als
        Vorschaubild und eine Maker Note mit undokumentierten Herstellerdaten.
        Dieses Werkzeug listet all das auf."""

[[faq]]
q = "Verschlechtert das Entfernen der Metadaten die Bildqualität?"
a = """
        Nein, und das ist der wichtigste Grund, ein solches Werkzeug zu benutzen,
        statt das Foto neu zu speichern. Metadaten liegen im Container um das
        komprimierte Bild herum, nicht darin. Sie zu entfernen heißt, Einträge aus
        einer Liste zu löschen und die Liste wieder herauszuschreiben; die
        komprimierten Bilddaten werden Byte für Byte übernommen, das Ergebnis
        dekodiert also zu exakt denselben Pixeln. Es wird nichts dekodiert und
        nichts neu komprimiert."""

[[faq]]
q = "Welche Dateiformate kann es verarbeiten?"
a = """
        JPEG, PNG und WebP. HEIC und AVIF werden erkannt, aber nicht neu
        geschrieben: Es sind Box-Formate aus verschachtelten Atomen und brauchen
        einen anderen Parser, also sagt das Werkzeug das, statt eine kaputte Datei
        zu erzeugen. Ein reines TIFF wird ebenfalls nicht verarbeitet, weil in
        einem TIFF die Metadaten und die Pixel über dieselben Offsets adressiert
        werden."""

[[faq]]
q = "Erscheint mein Foto nach dem Entfernen gedreht?"
a = """
        Das kann passieren, und dafür gibt es eine Einstellung. Telefone nehmen
        das Bild meist so auf, wie der Sensor es gesehen hat, und ergänzen ein
        Orientation-Tag, das sagt, wie es zu drehen ist. Entfernt man dieses Tag,
        zeigen manche Betrachter das Foto quer. Die Option &bdquo;das
        Orientierungs-Tag behalten&ldquo;, die standardmäßig aktiv ist, schreibt
        einen winzigen EXIF-Block zurück, der nichts als dieses eine Tag enthält
        &mdash; und auch nur dann, wenn das Foto es tatsächlich gebraucht hat.
        Schalten Sie sie ab, wenn die Datei lieber gar kein EXIF tragen soll."""

[[faq]]
q = "Entfernt es den GPS-Standort?"
a = """
        Ja. Beim Entfernen aller Daten verschwindet das gesamte GPS-Verzeichnis,
        und Sie können den Standort auch einzeln löschen und den Rest behalten.
        Die Position wird zuerst in Dezimalgrad angezeigt, denn
        &bdquo;51 Grad, 30 Minuten, 26 Sekunden&ldquo; macht nicht auf den ersten
        Blick deutlich, dass ein Foto das Gebäude benennt, in dem es aufgenommen
        wurde."""

[[faq]]
q = "Kann ich ein Tag ändern, statt es zu löschen?"
a = """
        Ja. Text-Tags, Datumsangaben, der ISO-Wert, die Orientierung und die
        Auflösung lassen sich alle bearbeiten, und ein paar gängige Tags können
        einem Foto hinzugefügt werden, das keine hat. Ein Vorbehalt: Beim
        Schreiben der Datei wird der EXIF-Block neu aufgebaut, und eine Maker Note
        enthält Offsets in den ursprünglichen Block &mdash; eine neu aufgebaute
        Maker Note ist danach also womöglich für die Software des Herstellers
        nicht mehr lesbar. Löschen Sie sie, oder lassen Sie die Datei unbearbeitet,
        wenn Ihnen das wichtig ist."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung und keine
        Testphase. Die Seite trägt Werbung, und die bezahlt sie; den Anzeigen wird
        nichts über Ihre Fotos übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird: Ein Werkzeug, das Ihre Fotos zum Verarbeiten
        wegschickt, würde in dem Moment stehen bleiben, in dem Sie den Stecker
        ziehen."""

