[[howto]]
title = "Wählen Sie Ihre Fotos aus."
body = """
 Ziehen Sie sie auf das Auswahlfeld
      oder suchen Sie sie von Hand heraus. Der Browser liest sie direkt von
      Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Lesen Sie, was darin steht, wenn Sie mögen."
body = " Die Fundliste nennt zuerst das Wissenswerte, also die GPS-Position, die Zeitstempel und die Seriennummern. Darunter folgt die vollständige Tabelle mit jedem einzelnen Tag. Bei JPEG, PNG und WebP listet das Werkzeug diese Blöcke auf. AVIF zeigt nur verfügbares extrahiertes EXIF; andere AVIF-Metadaten werden nicht inventarisiert."

[[howto]]
title = "Klicken Sie auf &bdquo;Alle Metadaten entfernen&ldquo;."
body = "Für JPEG, PNG und WebP: Für die meisten Menschen ist das die ganze Aufgabe. Jedes Tag, die XMP- und IPTC-Blöcke, die Kommentare und das eingebettete Vorschaubild verschwinden, und zwar bei allen Fotos auf der Liste auf einmal. AVIF wird vom Browser dekodiert und als neues PNG gespeichert, ohne die ursprünglichen Metadaten zu kopieren. Seine verfügbaren EXIF-Tags lassen sich hier ansehen, aber nicht bearbeiten. Das PNG kann größer sein und die Umwandlung Farben oder HDR verändern. Ihre Originaldatei bleibt unverändert."

[[howto]]
title = "Oder bearbeiten statt entfernen."
body = "Für JPEG, PNG und WebP: Ändern Sie ein Datum, korrigieren Sie eine Copyright-Zeile, löschen Sie den Ort und behalten Sie die Kameraeinstellungen. Dieses eine Foto speichern Sie dann einzeln."

[[faq]]
q = "Wird mein Foto irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, wertet aus und schreibt neu, auf Ihrer
        eigenen Hardware. Netzfunktionen hat dieses Werkzeug keine, es ruft nie
        etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "Was ist EXIF, und was steckt sonst noch in einem Foto?"
a = "Für JPEG, PNG und WebP: EXIF ist ein Block von Tags, den eine Kamera neben das Bild schreibt: Hersteller und Modell, die Belichtungseinstellungen, Datum und Uhrzeit auf die Sekunde genau, oft eine GPS-Position und manchmal eine Seriennummer. Häufig tragen Fotos noch mehr mit sich, etwa ein XMP-Paket mit XML aus einem Bildbearbeitungsprogramm, einen IPTC-Block mit Bildunterschrift und Urheberzeile, ein Farbprofil, eine kleine zweite Kopie des Bildes als Vorschaubild und eine Maker Note mit undokumentierten Herstellerdaten. Dieses Werkzeug listet all das auf. Bei JPEG, PNG und WebP listet das Werkzeug diese Blöcke auf. AVIF zeigt nur verfügbares extrahiertes EXIF; andere AVIF-Metadaten werden nicht inventarisiert."

[[faq]]
q = "Verschlechtert das Entfernen der Metadaten die Bildqualität?"
a = "Bei JPEG, PNG und WebP wird nur der Container bearbeitet; die komprimierten Bilddaten werden Byte für Byte kopiert, ohne Dekodierung oder erneute Komprimierung. Bei AVIF wird das erste Bild dekodiert und als neues verlustfreies PNG ohne Originalmetadaten geschrieben. Das PNG kann größer sein und die Browser-Dekodierung Farben oder HDR verändern. Die Originaldatei bleibt unverändert."

[[faq]]
q = "Welche Dateiformate kann es verarbeiten?"
a = "JPEG, PNG und WebP unterstützen Metadatenansicht, Bearbeitung und Container-Bereinigung. AVIF unterstützt die Vorschau verfügbaren extrahierten EXIFs und Bereinigung zu einem neuen PNG. AVIF-Tags sind schreibgeschützt; andere Metadaten werden nicht inventarisiert. Animiertes AVIF liefert das erste Bild. HEIC und reines TIFF werden erkannt, aber nicht neu geschrieben."

[[faq]]
q = "Erscheint mein Foto nach dem Entfernen gedreht?"
a = "Bei JPEG, PNG und WebP schreibt die Option bei Bedarf einen kleinen EXIF-Block mit nur dem Orientierungs-Tag. Schalten Sie sie aus, um das Tag zu entfernen. AVIF wird als aufrecht dekodiertes Bild in PNG umgewandelt. Die Optionen für Orientierung und Farbprofil gelten nur für JPEG, PNG und WebP."

[[faq]]
q = "Entfernt es den GPS-Standort?"
a = "Die Bereinigung entfernt die GPS-Daten. Bei JPEG, PNG und WebP lässt sich der Standort auch einzeln löschen und der Rest behalten. AVIF-Tags sind schreibgeschützt; die PNG-Umwandlung kopiert keine Originalmetadaten."

[[faq]]
q = "Kann ich ein Tag ändern, statt es zu löschen?"
a = "JPEG, PNG und WebP unterstützen das Bearbeiten und Hinzufügen von Tags. Beim Neuaufbau einer Maker Note können herstellerspezifische Offsets ungültig werden; behalten Sie dann das Original. AVIF-EXIF ist schreibgeschützt. Die Bereinigung erzeugt ein PNG ohne Originalmetadaten, statt den AVIF-Container umzuschreiben."

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung und keine
        Testphase. Bezahlt wird die Seite über Werbung, und den Anzeigen wird
        nichts über Ihre Fotos übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihre Fotos zum
        Verarbeiten wegschickt, bliebe in dem Moment stehen, in dem Sie den
        Stecker ziehen."""

