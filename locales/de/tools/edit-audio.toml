[[privacy]]
title = "Ihre Aufnahmen haben keinen Weg nach draußen."
body = """
 Die
      Content-Security-Policy nennt jede Adresse, die diese Seite kontaktieren
      darf, und keine davon gehört zu dieser Seite. Es gibt hier keinen Endpunkt,
      an dem Ihre Datei gesammelt werden könnte, und nichts im Code, das sie
      senden würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Dieses Werkzeug hat überhaupt keine
      Netzfunktion: keine Adresse zum Einfügen, nichts herunterzuladen, keine
      Engine, die beim ersten Gebrauch nachgeladen wird. Jedes Byte, das Ihr
      Audio berührt, kam beim Laden der Seite von dieser Herkunft."""

[[privacy]]
title = "Der Decoder ist der, den Ihr Browser ohnehin hat."
body = """

      Die Datei wird an <code>decodeAudioData</code> übergeben, denselben Code,
      der eine Aufnahme in einem <code>&lt;audio&gt;</code>-Element abspielt. Hier
      wird nichts ausgeliefert, um Ihr Format zu lesen, und es wird auch nichts
      außerhalb dieser Seite darum gebeten."""

[[privacy]]
title = "Das Bild eines Videos wird überhaupt nicht dekodiert."
body = """
 Wenn Sie ein Video
      hineinziehen, wird nur seine Tonspur angefordert. Die Einzelbilder werden
      nicht gelesen, nicht dekodiert, nicht gezeichnet und nicht angesehen
      &mdash; es gibt auf dieser Seite keinen Code, der das könnte, und die
      Datei, die herauskommt, enthält Klang und sonst nichts."""

[[privacy]]
title = "Die Samples werden aufgeschrieben, nicht neu kodiert."
body = """

      Eine WAV besteht aus den Samples, die diese Seite berechnet hat, mit einem
      Header davor. Es gibt keinen Encoder in der Kette, der Entscheidungen über
      Ihre Aufnahme trifft, und nichts, was sich als Upload beschreiben ließe,
      auf dem so etwas passieren könnte."""

[[privacy]]
title = "Was Google lädt - und was es nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihre
      Aufnahme übergeben: keine Datei, kein Sample, kein Name, keine Größe, keine
      Länge und nicht, wie laut sie war. Jede Zeile, die liest, bearbeitet und
      schreibt, wird von dieser Herkunft ausgeliefert und ist im Repository
      aufgeführt."""

[[privacy]]
title = "Was der Spenden-Button lädt - und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Er ist ein Link und nicht mehr: Er meldet keinen Besuch, und
      ihm wird nichts über Sie oder Ihre Datei übergeben."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Das ist der einfachste Beweis von allen."""

[[howto]]
title = "Wählen Sie eine Datei."
body = """
 Ziehen Sie eine MP3-, WAV-, FLAC-,
      M4A-, Ogg- oder Opus-Datei auf das Auswahlfeld &mdash; oder ein Video, wenn
      es Ihnen um den Ton daraus geht. Der Browser liest sie direkt von Ihrer
      Festplatte; dabei wird nichts irgendwohin gesendet."""

[[howto]]
title = "Drehen Sie sie um, falls Sie deshalb hier sind."
body = """
 Ein einziges
      Häkchen. Die Samples werden von hinten nach vorn geschrieben, was exakt
      umkehrbar ist: Machen Sie es zweimal, und Sie haben Sample für Sample die
      Datei, mit der Sie angefangen haben."""

[[howto]]
title = "Stellen Sie das Tempo ein."
body = """
 Ziehen Sie den Regler, tippen Sie
      einen Faktor ein oder nehmen Sie eine der Voreinstellungen. Entscheiden Sie
      dann, was mit der Tonhöhe passiert: sie halten, wo sie ist &mdash; das
      wollen Sie bei einer Vorlesung mit 1,5&times; &mdash; oder sie mit dem
      Tempo mitgehen lassen, was ein Tonband tut und was eine Stimme höher oder
      tiefer macht."""

[[howto]]
title = "Stellen Sie den Pegel ein."
body = """
 Nennen Sie entweder eine Änderung in
      Dezibel, oder lassen Sie die Aufnahme so weit anheben, dass ihr lautester
      Moment knapp unter der Decke liegt. Die Seite sagt Ihnen vorher, wo dieser
      Moment landen wird, und warnt Sie, wenn Ihre Einstellung ihn über die
      Vollaussteuerung hinausschieben würde."""

[[howto]]
title = "Speichern Sie."
body = """
 Die Arbeit passiert auf Ihrer eigenen Hardware, wie
      lange sie dauert, hängt also von Ihrem Gerät ab und nicht von einer
      Warteschlange. Heraus kommt eine WAV &mdash; die Samples selbst, mit einem
      Header davor &mdash; die zuerst auf der Seite abgespielt und dann direkt an
      die Downloads Ihres Browsers übergeben wird."""

[[faq]]
q = "Wird mein Audio irgendwohin hochgeladen?"
a = """
        Nein. Es wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware
        gelesen, bearbeitet und geschrieben. Dieses Werkzeug hat keine
        Serverseite, und die <code>Content-Security-Policy</code> der Seite nennt
        jede Adresse, die sie kontaktieren darf &mdash; keine davon gehört zu
        dieser Seite. Trennen Sie die Internetverbindung und kehren Sie trotzdem
        eine Aufnahme um, wenn Sie lieber prüfen als glauben."""

[[faq]]
q = "Kann ich den Ton aus einem Video holen?"
a = """
        Ja, und das ist hier dieselbe Aufgabe wie das Öffnen einer MP3. Ziehen
        Sie ein MP4, MOV oder WebM hinein, und nur seine Tonspur wird dekodiert:
        Das Bild wird nie gelesen, und heraus kommt eine Audiodatei ohne Video
        darin. Es ist auch der Weg, den Ton eines Clips zu sichern, ohne ihn
        überhaupt zu bearbeiten &mdash; lassen Sie jede Einstellung in Ruhe und
        drücken Sie auf die Schaltfläche."""

[[faq]]
q = "Ändert eine Tempoänderung die Tonhöhe?"
a = """
        Nur wenn Sie es so wollen. &bdquo;Tonhöhe halten&ldquo; schneidet die
        Aufnahme in überlappende Fenster von etwa fünfzig Millisekunden und legt
        sie enger oder weiter auseinander wieder ab, wobei jede Position so
        gewählt wird, dass die Wellen an ihrer Schnittstelle zusammenpassen
        &mdash; eine Stimme bleibt bei 1,5&times; dieselbe Stimme.
        &bdquo;Mitgehen lassen&ldquo; rechnet stattdessen neu ab, und das ist,
        was ein schneller laufendes Tonband tut: doppeltes Tempo ist genau eine
        Oktave höher."""

[[faq]]
q = "Warum speichert es eine WAV und keine MP3?"
a = """
        Weil kein Browser einen MP3-Encoder mitbringt und dieses Werkzeug sich
        weigert, Ihre Aufnahme an einen Server zu schicken, der einen hat. Eine
        WAV braucht überhaupt keinen Encoder &mdash; sie besteht aus den Samples
        mit einem vierundvierzig Byte großen Header davor &mdash; und ist damit
        zugleich die ehrliche Option und die einzige, die keine Qualität kosten
        kann. Sie ist größer: rund zehn Megabyte pro Minute in Stereo. Jeder
        Player, jedes Telefon und jeder Editor öffnet sie, und alles, was eine
        MP3 will, kann daraus eine machen."""

[[faq]]
q = "Welche Formate kann ich öffnen?"
a = """
        Alles, was Ihr Browser dekodiert, in der Praxis also MP3, WAV, FLAC, M4A
        und AAC, Ogg Vorbis und Opus sowie den Ton in MP4-, M4V-, MOV- und
        WebM-Videos. Draußen bleibt dieselbe kurze Liste wie überall sonst: AVI,
        WMA und die meisten MKVs. Eine Datei, die dieser Browser nicht lesen
        will, wird mit einer entsprechenden Meldung abgelehnt, statt auf halbem
        Weg zu scheitern."""

[[faq]]
q = "Verzerrt es, wenn ich es lauter mache?"
a = """
        Nur wenn Sie über die Vollaussteuerung hinausgehen, und die Seite sagt es
        Ihnen vorher. Digitales Audio hat eine harte Decke: Ein Sample kann nicht
        lauter sein als Vollaussteuerung, alles darüber wird also an der Decke
        plattgedrückt &mdash; und genau so klingt Verzerrung. &bdquo;So laut wie
        möglich&ldquo; ist die Einstellung, die das nicht tun kann: Sie rechnet
        aus, wie viel Luft die Aufnahme noch hat, und nutzt genau so viel. Alles
        unterhalb der Decke ist Multiplikation und nichts weiter: 6 dB hoch und
        6 dB wieder herunter, und die Samples stehen, wo sie standen."""

[[faq]]
q = "Kostet Umkehren oder Umtakten Qualität?"
a = """
        Umkehren nicht: Dieselben Samples kommen in der anderen Reihenfolge
        heraus, was exakt ist. Eine Tempoänderung verschiebt jedes Sample, ist
        also Rechnerei und keine Kopie &mdash; das Resampling filtert dabei
        ordentlich, damit hohe Töne beim Beschleunigen nicht als metallisches
        Klingeln zurückfalten, und die Fenster der Zeitdehnung werden dort
        gesetzt, wo die Wellen zusammenpassen, statt dort, wo die Rechnung
        gerade hinfiel. Keiner der beiden Wege kodiert etwas neu, denn es gibt
        hier keinen Encoder, mit dem sich etwas neu kodieren ließe."""

[[faq]]
q = "Gibt es eine Grenze für die Länge der Datei?"
a = """
        Im Werkzeug ist keine Grenze eingebaut. Die praktische Obergrenze ist der
        Arbeitsspeicher: Die gesamte Aufnahme wird auf einmal in diese Seite
        dekodiert, und vor dem Download wird eine WAV im Speicher zusammengesetzt
        &mdash; eine Stunde Stereo braucht also knapp unter einem Gigabyte
        Arbeitsraum. Eine WAV über vier Gigabyte wird rundweg abgelehnt, weil das
        Größenfeld des Formats selbst eine solche nicht beschreiben kann."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Die Seite trägt Werbung, und die
        bezahlt sie; den Anzeigen wird nichts über Ihre Aufnahme übergeben."""

