[[privacy]]
title = "Ihre Aufnahmen haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Datei landen könnte, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Eine Netzfunktion hat dieses Werkzeug
      überhaupt nicht. Es gibt keine Adresse zum Einfügen, nichts
      herunterzuladen und keine Engine, die beim ersten Gebrauch nachgeladen
      wird. Jedes Byte, das Ihr Audio berührt, kam beim Laden der Seite von
      dieser Domain selbst."""

[[privacy]]
title = "Der Decoder ist der, den Ihr Browser ohnehin hat."
body = """

      Die Datei geht an <code>decodeAudioData</code>, also an denselben Code, der
      eine Aufnahme in einem <code>&lt;audio&gt;</code>-Element abspielt. Um Ihr
      Format zu lesen, wird hier nichts ausgeliefert und auch nichts von
      außerhalb dieser Seite angefordert."""

[[privacy]]
title = "Das Bild eines Videos wird überhaupt nicht dekodiert."
body = """
 Ziehen Sie ein Video
      hinein, wird nur seine Tonspur angefordert. Die Einzelbilder werden nicht
      gelesen, nicht dekodiert, nicht gezeichnet und nicht angesehen, denn auf
      dieser Seite gibt es gar keinen Code, der das könnte. Was herauskommt,
      enthält Klang und sonst nichts."""

[[privacy]]
title = "Die Samples werden aufgeschrieben, nicht neu kodiert."
body = """

      Eine WAV besteht aus den Samples, die diese Seite berechnet hat, mit einem
      Header davor. In der Kette sitzt kein Encoder, der über Ihre Aufnahme
      entscheidet, und es gibt auch nichts, was sich als Upload beschreiben
      ließe, worauf so etwas passieren könnte."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihre
      Aufnahme übergeben, weder eine Datei noch ein Sample, ein Name, eine Größe,
      eine Länge oder wie laut sie war. Jede Zeile, die liest, bearbeitet und
      schreibt, kommt von dieser Domain selbst und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihre Datei bekommt er nichts."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie eine Datei aus."
body = """
 Ziehen Sie eine MP3-, WAV-, FLAC-,
      M4A-, Ogg- oder Opus-Datei auf das Auswahlfeld, oder gleich ein Video, wenn
      es Ihnen um den Ton daraus geht. Der Browser liest sie direkt von Ihrer
      Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Drehen Sie sie um, falls Sie deshalb hier sind."
body = """
 Dafür genügt ein
      Häkchen. Die Samples werden von hinten nach vorn geschrieben, und das ist
      exakt umkehrbar. Machen Sie es zweimal, haben Sie Sample für Sample die
      Datei, mit der Sie angefangen haben."""

[[howto]]
title = "Stellen Sie das Tempo ein."
body = """
 Ziehen Sie den Regler, tippen Sie
      einen Faktor ein oder nehmen Sie eine der Voreinstellungen. Dann
      entscheiden Sie, was mit der Tonhöhe passiert. Halten Sie sie, wo sie ist,
      wenn Sie eine Vorlesung mit 1,5&times; hören wollen. Oder lassen Sie sie
      mit dem Tempo mitgehen, so wie es ein Tonband tut, das eine Stimme höher
      oder tiefer macht."""

[[howto]]
title = "Stellen Sie den Pegel ein."
body = """
 Nennen Sie entweder eine Änderung in
      Dezibel, oder lassen Sie die Aufnahme so weit anheben, dass ihr lautester
      Moment knapp unter der Decke liegt. Wo dieser Moment landen wird, sagt
      Ihnen die Seite vorher, und sie warnt Sie, wenn Ihre Einstellung ihn über
      die Vollaussteuerung hinausschieben würde."""

[[howto]]
title = "Speichern Sie."
body = """
 Die Arbeit passiert auf Ihrer eigenen Hardware.
      Wie lange sie dauert, hängt daher von Ihrem Gerät ab und nicht von einer
      Warteschlange. Heraus kommt eine WAV, also die Samples selbst mit einem
      Header davor. Sie wird zuerst auf der Seite abgespielt und geht dann direkt
      in die Downloads Ihres Browsers."""

[[faq]]
q = "Wird mein Audio irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, bearbeitet und schreibt es auf Ihrer
        eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört uns. Wer lieber prüft als
        glaubt, trennt die Internetverbindung und kehrt trotzdem eine Aufnahme
        um."""

[[faq]]
q = "Kann ich den Ton aus einem Video holen?"
a = """
        Ja, und hier ist das dieselbe Aufgabe wie das Öffnen einer MP3. Ziehen
        Sie ein MP4, MOV oder WebM hinein, und es wird nur die Tonspur dekodiert.
        Das Bild wird nie gelesen, und heraus kommt eine Audiodatei ohne Video
        darin.
        Wenn das schon alles ist, was Sie wollen &mdash; den Ton, unverändert
        &mdash;, dann erledigt <a href="../ton-aus-video-extrahieren/">Ton aus
        Video extrahieren</a> dieselbe Aufgabe auf einer Seite, auf der sonst
        nichts steht. Kommen Sie hierher zurück, wenn der Ton auch verändert
        werden soll."""

[[faq]]
q = "Ändert eine Tempoänderung die Tonhöhe?"
a = """
        Nur wenn Sie es so wollen. &bdquo;Tonhöhe halten&ldquo; schneidet die
        Aufnahme in überlappende Fenster von etwa fünfzig Millisekunden und legt
        sie enger oder weiter auseinander wieder ab. Jede Position wird dabei so
        gewählt, dass die Wellen an der Schnittstelle zusammenpassen, und
        deshalb bleibt eine Stimme bei 1,5&times; dieselbe Stimme.
        &bdquo;Mitgehen lassen&ldquo; rechnet stattdessen neu ab, und genau das
        tut ein schneller laufendes Tonband: doppeltes Tempo ist genau eine
        Oktave höher."""

[[faq]]
q = "Warum speichert es eine WAV und keine MP3?"
a = """
        Weil kein Browser einen MP3-Encoder mitbringt und dieses Werkzeug sich
        weigert, Ihre Aufnahme an einen Server zu schicken, der einen hat. Eine
        WAV braucht überhaupt keinen Encoder, denn sie besteht aus den Samples
        mit einem vierundvierzig Byte großen Header davor. Damit ist sie zugleich
        die ehrliche Option und die einzige, die keine Qualität kosten kann.
        Größer ist sie allerdings, rund zehn Megabyte pro Minute in Stereo.
        Öffnen kann sie jeder Player, jedes Telefon und jeder Editor, und alles,
        was eine MP3 will, macht daraus eine."""

[[faq]]
q = "Welche Formate kann ich öffnen?"
a = """
        Alles, was Ihr Browser dekodiert, in der Praxis also MP3, WAV, FLAC, M4A
        und AAC, Ogg Vorbis und Opus sowie den Ton in MP4-, M4V-, MOV- und
        WebM-Videos. Draußen bleibt dieselbe kurze Liste wie überall sonst: AVI,
        WMA und die meisten MKVs. Eine Datei, die dieser Browser nicht lesen
        will, wird gleich mit einer entsprechenden Meldung abgelehnt, statt auf
        halbem Weg zu scheitern."""

[[faq]]
q = "Verzerrt es, wenn ich es lauter mache?"
a = """
        Nur wenn Sie über die Vollaussteuerung hinausgehen, und das sagt Ihnen
        die Seite vorher. Digitales Audio hat eine harte Decke. Lauter als
        Vollaussteuerung kann ein Sample nicht werden, alles darüber wird also
        an der Decke plattgedrückt, und genau so klingt Verzerrung. &bdquo;So
        laut wie möglich&ldquo; ist die Einstellung, die das gar nicht tun kann,
        denn sie rechnet aus, wie viel Luft die Aufnahme noch hat, und nutzt
        genau so viel. Unterhalb der Decke ist alles bloß Multiplikation: 6 dB
        hoch und 6 dB wieder herunter, und die Samples stehen, wo sie
        standen."""

[[faq]]
q = "Kostet Umkehren oder eine Tempoänderung Qualität?"
a = """
        Umkehren nicht. Dieselben Samples kommen in der anderen Reihenfolge
        heraus, und das ist exakt. Eine Tempoänderung verschiebt dagegen jedes
        Sample und ist damit Rechnerei statt Kopie. Das Resampling filtert dabei
        ordentlich, damit hohe Töne beim Beschleunigen nicht als metallisches
        Klingeln zurückfalten, und die Fenster der Zeitdehnung werden dort
        gesetzt, wo die Wellen zusammenpassen, statt dort, wo die Rechnung
        gerade hinfiel. Neu kodiert wird auf keinem der beiden Wege etwas, denn
        einen Encoder gibt es hier gar nicht."""

[[faq]]
q = "Gibt es eine Grenze für die Länge der Datei?"
a = """
        Im Werkzeug ist keine Grenze eingebaut. Die praktische Obergrenze setzt
        der Arbeitsspeicher, denn die gesamte Aufnahme wird auf einmal in diese
        Seite dekodiert, und vor dem Download wird eine WAV im Speicher
        zusammengesetzt. Eine Stunde Stereo braucht damit knapp unter einem
        Gigabyte Arbeitsraum. Eine WAV über vier Gigabyte wird rundweg
        abgelehnt, weil das Größenfeld des Formats selbst so etwas gar nicht
        beschreiben kann."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Aufnahme übergeben."""

