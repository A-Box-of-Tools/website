<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> Die beiden Texte einfügen</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Das Original</label>
          <span class="count" id="input-count">leer</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Das Original hier einfügen - oder oben beide Dateien ablegen."></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">Die geänderte Fassung</label>
          <span class="count" id="input-b-count">leer</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Die Fassung einfügen, mit der verglichen werden soll."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Ein Beispiel probieren</button>
        <button type="button" id="swap" class="ghost">Seiten tauschen</button>
        <button type="button" id="clear" class="ghost danger">Leeren</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> Wählen, wie Sie es lesen</h2>

    <div class="settings">
      <div class="field">
        <label for="view">Wie es gezeigt wird</label>
        <select id="view">
          <option value="split" selected>Nebeneinander</option>
          <option value="unified">In einer Spalte</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          Nur das Geänderte zeigen, mit drei Zeilen zu beiden Seiten
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          Leerraum ignorieren
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          Groß- und Kleinschreibung ignorieren
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          Leere Zeilen ignorieren
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> Lesen, was sich geändert hat</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Noch nichts.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Kopieren</button>
        <a id="download" class="ghost as-button" hidden download>Herunterladen</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
