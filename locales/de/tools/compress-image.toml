[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 Die
      Content-Security-Policy nennt jede Adresse, die diese Seite kontaktieren
      darf, und keine davon gehört zu dieser Seite. Es gibt hier keinen
      Endpunkt, an dem Ihre Dateien gesammelt werden könnten, und nichts im
      Code, das sie senden würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Die Kompression ist
      <code>canvas.toBlob</code> &mdash; der Encoder, der in Ihrem Browser
      bereits installiert ist."""

[[privacy]]
title = "Die Zahlen werden gemessen, nicht gemeldet."
body = """
 Die Größen, der
      Qualitätswert und der SSIM-Vergleich werden alle auf dieser Seite
      berechnet und Ihnen angezeigt. Es gibt in diesem Repository kein eigenes
      Analytics-Ereignis, das einen Dateinamen, eine Größe, eine Anzahl oder
      ein Ergebnis mitführt."""

[[privacy]]
title = "Was Google lädt - und was es nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihre Bilder übergeben. Jede Zeile,
      die eine Datei liest, komprimiert oder misst, wird von dieser Herkunft
      ausgeliefert und ist im Repository aufgeführt."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug bleibt unverändert, weil es nie einen Netzschritt darin gab. Das
      ist der einfachste Beweis von allen."""

[[howto]]
title = "Wählen Sie Ihre Bilder."
body = """
 Ziehen Sie sie auf das Auswahlfeld
      oder wählen Sie sie von Hand. Der Browser liest sie direkt von Ihrer
      Festplatte; dabei wird nichts irgendwohin gesendet."""

[[howto]]
title = "Tippen Sie die geforderte Größe ein."
body = """
 100 KB für das
      Upload-Formular, das Ihr Foto immer wieder ablehnt, 500 KB für das
      Bewerbungsportal, 2 MB für eine Seite, die schnell laden muss. Die vier
      häufigsten sind Schaltflächen."""

[[howto]]
title = "Klicken Sie auf &bdquo;Auf Zielgröße komprimieren&ldquo;."
body = """
 Jedes Bild wird
      mehrfach kodiert, während das Werkzeug sich an die höchste Qualität
      herantastet, die noch hineinpasst. Was bereits unter der Zielgröße
      liegt, bleibt genau so, wie es ist."""

[[howto]]
title = "Prüfen Sie, was es gekostet hat, und laden Sie herunter."
body = """
 Jedes Ergebnis
      nennt das Format, in dem es geschrieben wurde, die Qualität, ob sich die
      Abmessungen geändert haben und wie genau es dem Original entspricht.
      &bdquo;Vergleichen&ldquo; stellt beide Bilder nebeneinander."""

[[faq]]
q = "Wird mein Bild irgendwohin hochgeladen?"
a = """
        Nein. Die Datei wird von Ihrem eigenen Browser auf Ihrer eigenen Hardware
        dekodiert, komprimiert und gemessen &mdash; mit den JPEG-, PNG- und
        WebP-Encodern, die der Browser bereits mitbringt. Dieses Werkzeug hat
        keinerlei Netzfunktion &mdash; es ruft nie etwas ab und sendet nie etwas
        &mdash; und die <code>Content-Security-Policy</code> der Seite nennt jede
        Adresse, die sie kontaktieren darf; keine davon gehört zu dieser Seite."""

[[faq]]
q = "Wie trifft es eine exakte Größe?"
a = """
        Durch Ausprobieren. Es gibt keine Formel, die eine Qualitätseinstellung in
        eine Byte-Zahl umrechnet &mdash; das hängt vollständig vom Bild ab &mdash;
        also kodiert das Werkzeug das Bild mehrfach und sucht die Antwort. Es
        beginnt am oberen Ende des Qualitätsbereichs und halbiert sich heran, was
        die höchste passende Qualität in etwa acht Durchgängen findet. Jede
        Größe, die Sie auf der Seite sehen, ist eine echte kodierte Datei, keine
        Schätzung."""

[[faq]]
q = "Was heißt hier eigentlich &bdquo;minimaler Verlust&ldquo;?"
a = """
        Drei konkrete Dinge. Erstens wird ein Bild, das bereits unter Ihrer
        Zielgröße liegt, Byte für Byte durchgereicht statt neu kodiert. Zweitens
        wird Qualität vor Auflösung ausgegeben, und nur bis zu einer Untergrenze,
        ab der Kompressionsartefakte sichtbar werden &mdash; darunter verkleinert
        das Werkzeug das Bild und dreht die Qualität wieder hoch, denn weniger gute
        Pixel sehen besser aus als mehr ruinierte. Drittens tastet sich die Suche,
        sobald ein passendes Ergebnis gefunden ist, wieder nach oben, bis das Budget
        aufgebraucht ist &mdash; Sie bekommen also keine 300-KB-Datei, wenn Sie
        500 KB verlangt haben."""

[[faq]]
q = "Was sind die SSIM- und PSNR-Werte an jedem Ergebnis?"
a = """
        Sie messen, was die Kompression gekostet hat: Das Ergebnis wird dekodiert
        und mit dem Originalbild verglichen. SSIM vergleicht lokale Helligkeit,
        Kontrast und Struktur, was dem, woran sich ein Auge stört, deutlich näher
        kommt als das Zählen veränderter Pixel; ab etwa 0,98 sind beide
        nebeneinander kaum zu unterscheiden. PSNR ist der klassische Dezibelwert.
        Beide werden auf Ihrem Gerät berechnet, und beide werden angezeigt, damit
        die Behauptung geringen Verlusts nachprüfbar ist statt nur behauptet."""

[[faq]]
q = "Welche Formate kann es lesen und schreiben?"
a = """
        Es liest alles, was Ihr Browser dekodieren kann, in der Praxis also JPEG,
        PNG, WebP, GIF, BMP und &mdash; in den meisten aktuellen Browsern &mdash;
        AVIF. Es schreibt JPEG, PNG und WebP, weil das die Encoder sind, die
        Browser mitbringen. Auf &bdquo;automatisch&ldquo; behält es das Format
        bei, in dem Ihre Datei ankam, und wechselt nur dann zu WebP, wenn das
        Beibehalten eine Verkleinerung oder einen sichtbaren Qualitätsverlust
        bedeutet hätte."""

[[faq]]
q = "Warum lässt sich ein PNG nicht weit komprimieren?"
a = """
        Weil PNG verlustfrei ist: Es hat keinen Qualitätsregler zum Drehen. Ein
        PNG kleiner zu machen geht nur über weniger Pixel oder weniger Farben, und
        mit ausgewähltem PNG erreicht das Werkzeug eine Zielgröße deshalb allein
        über die Größenänderung. Ist das Bild eine Fotografie, kommt JPEG oder
        WebP Ihrer Zielgröße in einer sichtbar unbedenklichen Qualität weit
        näher &mdash; und ist es ein Logo oder ein Screenshot mit Transparenz,
        behält WebP die Transparenz, die JPEG mit Weiß auffüllen würde."""

[[faq]]
q = "Entfernt das Komprimieren die EXIF- und GPS-Daten eines Bildes?"
a = """
        Ja, als Nebenwirkung. Komprimieren heißt, das Bild zu Pixeln zu dekodieren
        und diese Pixel erneut zu kodieren, und eine Leinwand voller Pixel trägt
        keine Tags &mdash; Ort, Kameramodell, Zeitstempel und alles Weitere werden
        also schlicht nicht in die neue Datei geschrieben. Sollen die Metadaten weg,
        das Bild aber unangetastet bleiben, nehmen Sie stattdessen den
        <a href="../exif-daten-entfernen/">EXIF-Betrachter &amp; -Entferner</a>
        &mdash; er schreibt den Container neu, ohne irgendetwas neu zu
        komprimieren."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase
        und kein Wasserzeichen. Es gibt auch keine Grenze für Anzahl oder Größe
        der Dateien, weil es keinen Server gibt, der dafür zahlt &mdash; die
        Arbeit passiert auf Ihrem eigenen Gerät. Die Seite trägt Werbung, und die
        bezahlt sie; den Anzeigen wird nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung, und
        sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür, dass
        nichts hochgeladen wird: Ein Werkzeug, das Ihre Bilder zum Komprimieren
        wegschickt, würde in dem Moment stehen bleiben, in dem Sie den Stecker
        ziehen."""

