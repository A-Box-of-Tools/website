[[faq]]
q = "Wird mein Bild irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser dekodiert, komprimiert und misst die Datei auf
        Ihrer eigenen Hardware, mit den JPEG-, PNG- und WebP-Encodern, die er
        ohnehin mitbringt. Netzfunktionen hat dieses Werkzeug keine, es ruft nie
        etwas ab und sendet nie etwas. In der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf, und keine davon gehört uns."""

[[faq]]
q = "Wie kommt es auf eine exakte Größe?"
a = """
        Durch Ausprobieren. Eine Formel, die eine Qualitätseinstellung in eine
        Byte-Zahl umrechnet, gibt es nicht, denn das hängt vollständig vom Bild
        ab. Also kodiert das Werkzeug das Bild mehrfach und sucht die Antwort.
        Es beginnt am oberen Ende des Qualitätsbereichs und halbiert sich heran,
        sodass es die höchste passende Qualität in etwa acht Durchgängen findet.
        Jede Größe, die Sie auf der Seite sehen, gehört zu einer echten
        kodierten Datei und ist keine Schätzung."""

[[faq]]
q = "Was heißt hier eigentlich &bdquo;minimaler Verlust&ldquo;?"
a = """
        Drei konkrete Dinge. Erstens wird ein Bild, das bereits unter Ihrer
        Zielgröße liegt, Byte für Byte durchgereicht statt neu kodiert. Zweitens
        gibt das Werkzeug Qualität aus, bevor es an die Auflösung geht, und nur
        bis zu der Grenze, ab der Kompressionsartefakte sichtbar werden. Darunter
        verkleinert es lieber das Bild und dreht die Qualität wieder hoch, denn
        weniger gute Pixel sehen besser aus als mehr ruinierte. Drittens tastet
        sich die Suche wieder nach oben, sobald ein passendes Ergebnis gefunden
        ist, bis das Budget aufgebraucht ist. Sie bekommen also keine
        300-KB-Datei, wenn Sie 500 KB verlangt haben."""

[[faq]]
q = "Was sind die SSIM- und PSNR-Werte an jedem Ergebnis?"
a = """
        Sie messen, was die Kompression gekostet hat. Dafür wird das Ergebnis
        dekodiert und mit dem Originalbild verglichen. SSIM vergleicht lokale
        Helligkeit, Kontrast und Struktur und kommt damit dem, woran sich ein
        Auge stört, deutlich näher als das Zählen veränderter Pixel. Ab etwa
        0,98 sind beide Bilder nebeneinander kaum zu unterscheiden. PSNR ist der
        klassische Dezibelwert. Beides rechnet Ihr Gerät aus, und beides steht
        auf der Seite, damit die Rede vom geringen Verlust nachprüfbar bleibt
        und nicht bloß behauptet."""

[[faq]]
q = "Welche Formate kann es lesen und schreiben?"
a = """
        Es liest alles, was Ihr Browser dekodieren kann, in der Praxis also
        JPEG, PNG, WebP, GIF, BMP und, in den meisten aktuellen Browsern, AVIF.
        Geschrieben werden JPEG, PNG und WebP, denn das sind die Encoder, die
        Browser mitbringen. Auf &bdquo;automatisch&ldquo; behält es das Format
        bei, in dem Ihre Datei angekommen ist, und wechselt nur dann zu WebP,
        wenn das Beibehalten eine Verkleinerung oder einen sichtbaren
        Qualitätsverlust bedeutet hätte."""

[[faq]]
q = "Warum lässt sich ein PNG nicht weit komprimieren?"
a = """
        Weil PNG verlustfrei arbeitet und deshalb gar keinen Qualitätsregler
        hat. Ein PNG kleiner zu bekommen geht nur über weniger Pixel oder
        weniger Farben, und mit ausgewähltem PNG erreicht das Werkzeug eine
        Zielgröße daher allein über die Größenänderung. Bei einer Fotografie
        kommen JPEG oder WebP Ihrer Zielgröße in sichtbar unbedenklicher
        Qualität weit näher. Bei einem Logo oder einem Screenshot mit
        Transparenz behält WebP die Transparenz, die JPEG mit Weiß auffüllen
        würde."""

[[faq]]
q = "Entfernt das Komprimieren die EXIF- und GPS-Daten eines Bildes?"
a = """
        Ja, als Nebenwirkung. Komprimieren heißt, das Bild zu Pixeln zu
        dekodieren und diese Pixel erneut zu kodieren, und ein Canvas voller
        Pixel trägt keine Tags. Ort, Kameramodell, Zeitstempel und alles Weitere
        werden also schlicht nicht in die neue Datei geschrieben. Sollen die
        Metadaten weg, das Bild aber unangetastet bleiben, nehmen Sie besser den
        <a href="../exif-daten-entfernen/">EXIF-Betrachter &amp; -Entferner</a>.
        Der schreibt nur den Container neu und komprimiert nichts."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Auch bei Anzahl und Größe der Dateien
        gibt es keine Grenze, denn es zahlt kein Server dafür. Die Arbeit
        passiert auf Ihrem eigenen Gerät. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die
        Internetverbindung, und sie arbeitet weiter. Das ist zugleich der
        einfachste Beweis dafür, dass nichts hochgeladen wird. Ein Werkzeug, das
        Ihre Bilder zum Komprimieren wegschickt, bliebe in dem Moment stehen, in
        dem Sie den Stecker ziehen."""

