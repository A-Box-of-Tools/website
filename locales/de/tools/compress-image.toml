[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Es gibt weder
      <code>fetch</code> noch <code>XMLHttpRequest</code> noch
      <code>sendBeacon</code> irgendwo in <code>src/</code>. Die Kompression
      erledigt <code>canvas.toBlob</code>, also der Encoder, der in Ihrem
      Browser ohnehin steckt."""

[[privacy]]
title = "Die Zahlen werden gemessen, nicht gemeldet."
body = """
 Die Größen, der
      Qualitätswert und der SSIM-Vergleich entstehen alle auf dieser Seite und
      werden Ihnen angezeigt. In diesem Repository gibt es kein eigenes
      Analytics-Ereignis, das einen Dateinamen, eine Größe, eine Anzahl oder ein
      Ergebnis mitführt."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem davon wird irgendetwas über Ihre Bilder übergeben. Jede Zeile, die
      eine Datei liest, komprimiert oder misst, kommt von dieser Domain selbst
      und steht im Repository."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
