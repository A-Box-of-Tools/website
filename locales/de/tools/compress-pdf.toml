[[privacy]]
title = "Ihr Dokument hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Dieses Werkzeug fügt der Liste
      auch nichts hinzu, denn es hat gar keine eigene Netzfunktion, nicht einmal
      eine optionale. Es gibt hier keinen Endpunkt, an dem Ihre Datei landen
      könnte, und im Code steht auch nichts, das sie dorthin schicken würde,
      gäbe es einen."""

[[privacy]]
title = "Das ganze Format liegt in diesem Repository."
body = """
 Ein PDF ist eine
      Liste von Objekten und eine Tabelle, wo jedes beginnt.
      <code>src/objects.js</code> liest diese Syntax, <code>src/reader.js</code>
      folgt der Tabelle, <code>src/writer.js</code> schreibt eine neue, und
      keines der drei importiert irgendetwas, das eine Anfrage stellen könnte.
      Es wird keine Bibliothek nachgeladen und nichts auf einem Server
      gerendert."""

[[privacy]]
title = "Verschlüsselte Dateien werden abgewiesen statt geöffnet."
body = """

      Ein PDF mit Passwort wird abgelehnt, auch die Sorte, die Scanner mit
      leerem Passwort erzeugen und die sich technisch öffnen ließe. Einem
      Dokument den Schutz zu nehmen ist eine andere Aufgabe, als es zu
      verkleinern, und stillschweigend erledigt wäre sie ein reichlich
      überraschender Übergriff für ein Werkzeug."""

[[privacy]]
title = "Es nimmt heraus, statt hineinzuschreiben."
body = """
 Die fertige Datei trägt kein
      Erstellungsdatum, keine Producer-Zeile und keinen Namen des Werkzeugs, das
      sie gemacht hat. Mit gesetztem Häkchen verliert sie außerdem das
      XMP-Paket und die privaten Blöcke, die Layout-Programme hinterlassen. Das
      ist dasselbe Argument, das auch das EXIF-Werkzeug vorbringt, nur auf einen
      anderen Container angewendet."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihr
      Dokument übergeben, weder eine Datei noch eine Seite, ein Name, eine Größe
      oder eine Seitenzahl. Jede Zeile, die ein PDF liest, dekodiert oder
      schreibt, kommt von dieser Domain selbst und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihr Dokument bekommt er nichts. Solange Sie ihn nicht
      anklicken, passiert nichts, und was Sie damit ansteuern, ist die Seite von
      jemand anderem."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht, denn
      ein Werkzeug, das Ihr Dokument zum Komprimieren wegschickt, bliebe an
      dieser Stelle stehen."""

[[howto]]
title = "Wählen Sie ein PDF aus."
body = """
 Ziehen Sie es auf das Auswahlfeld oder
      suchen Sie es von Hand heraus. Der Browser liest es direkt von Ihrer
      Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Sehen Sie nach, wo die Größe steckt."
body = """
 Die Aufschlüsselung ist der
      eigentliche Sinn des zweiten Schritts. Besteht der Balken überwiegend aus
      Bildern, hat dieses Werkzeug etwas zu tun. Besteht er überwiegend aus
      Schriften und Seiteninhalt, sagt es das, und die ehrliche Ersparnis liegt
      dann bei wenigen Prozent. Das sollten Sie wissen, bevor Sie eine Minute
      dafür aufwenden."""

[[howto]]
title = "Sagen Sie, wie stark gepresst werden soll."
body = """
 Hinter den benannten
      Einstellungen stehen Auflösungen und keine vagen Stufen: 96 dpi zum Lesen
      am Bildschirm, 130 zum Verschicken per E-Mail, 220 für etwas, das noch
      gedruckt werden muss. Gemessen wird jede daran, wie groß das Bild auf der
      Seite tatsächlich erscheint. Ein als Miniatur platziertes Foto wird also
      anders behandelt als ein ganzseitiger Scan."""

[[howto]]
title = "Komprimieren Sie, und achten Sie auf die Zeile, die die Prüfung meldet."
body = """

      Ist das Neuschreiben fertig, öffnet derselbe Leser auf dieser Seite die
      fertige Datei noch einmal und zählt ihre Seiten. Weicht das vom Original
      ab, gilt der Durchlauf als gescheitert, und ein Download wird gar nicht
      erst angeboten."""

[[faq]]
q = "Wird mein PDF irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest die Datei auf Ihrer eigenen Hardware,
        komprimiert sie neu und schreibt sie neu. Eine Serverseite hat dieses
        Werkzeug nicht, und in der <code>Content-Security-Policy</code> der Seite
        steht jede Adresse, die sie kontaktieren darf; keine davon gehört uns.
        Eine optionale Netzfunktion gibt es hier ebenfalls nicht."""

[[faq]]
q = "Wie viel kleiner wird mein PDF?"
a = """
        Das hängt vollständig davon ab, was darin steckt, und genau deshalb misst
        das Werkzeug es und zeigt es Ihnen, bevor es irgendetwas komprimiert. Ein
        gescanntes Dokument besteht fast nur aus Fotografien und wird
        üblicherweise 60&ndash;90&nbsp;% kleiner. Ein Vertrag oder eine
        Abschlussarbeit besteht dagegen aus Text, Vektorzeichnung und
        eingebetteten Schriften, die das erzeugende Programm alle längst
        komprimiert hat. Dort liegt die Ersparnis meist bei wenigen Prozent und
        stammt aus dem Neupacken der Datei und aus allem, worauf nichts mehr
        verweist. Wer Ihnen ohne einen Blick in Ihre Datei einen festen
        Prozentsatz verspricht, rät."""

[[faq]]
q = "Verliert ein PDF beim Komprimieren an Qualität?"
a = """
        Die Bilder darin werden neu kodiert, für die also ja. Sonst wird nichts
        angefasst. Text bleibt Text, markierbar und durchsuchbar, die Schriften
        bleiben vollständig, und die Vektorzeichnung wird exakt übernommen. Ein
        Bild umsonst zu verschlechtern weigert sich das Werkzeug außerdem: Wird
        eine Neukodierung nicht kleiner als das Original, wandern die
        Originalbytes unangetastet zurück ins Dokument."""

[[faq]]
q = "Was ist hier dpi, und warum wird danach gefragt?"
a = """
        Ein PDF hält fest, wie groß jedes Bild auf der Seite dargestellt wird,
        und daraus kann das Werkzeug die tatsächliche Auflösung ausrechnen. Ein
        Scan mit 4000 Pixeln, über zwanzig Zentimeter Papier gelegt, bringt es
        auf rund 500 Pixel pro Zoll. Damit kann kein Bildschirm und kaum ein
        Drucker etwas anfangen, also fallen die Pixel oberhalb Ihrer Einstellung
        zuerst weg. Sie kosten nur Platz für Qualität, die niemand sehen kann.
        Diese Messung ist auch der Grund, warum ein klein platziertes Logo anders
        behandelt wird als ein ganzseitiger Scan."""

[[faq]]
q = "Kann es ein passwortgeschütztes PDF öffnen?"
a = """
        Nein, und das ist Absicht. Ein verschlüsseltes Dokument wird mit einer
        entsprechenden Meldung abgelehnt, selbst wenn das Passwort leer ist, und
        genau so speichern viele Scanner und Kopierer. Einer Datei den Schutz zu
        nehmen ist eine andere Aufgabe, als sie zu komprimieren. Ein Werkzeug,
        das das stillschweigend täte, täte etwas, worum Sie nie gebeten
        haben."""

[[faq]]
q = "Gibt es PDFs, die es nicht komprimieren kann?"
a = """
        Einzelne Bilder darin, ja. Für JPEG 2000, JBIG2 und faxkodierte
        (CCITT-)Bilder bringt kein Browser einen Decoder mit, also werden sie
        unangetastet durchgereicht und als solche gemeldet. Die letzten beiden
        sind ohnehin Zweiton-Codecs und meist schon nahe an ihrem Minimum.
        CMYK-Bilder bleiben ebenfalls unberührt, weil eine Neukodierung die
        Farben verschieben könnte, die am Ende aus dem Drucker kommen. Alles, was
        das Werkzeug auslässt, steht mit Begründung bei den Ergebnissen."""

[[faq]]
q = "Lässt sich die komprimierte Datei überall noch öffnen?"
a = """
        Ja. Die Ausgabe wird als PDF 1.5 geschrieben, und das versteht jeder
        Reader, der seit 2003 ausgeliefert wurde. Belegt wird das auf Ihrem
        eigenen Gerät, denn das Werkzeug öffnet die fertige Datei noch einmal
        und zählt ihre Seiten, bevor es sie Ihnen anbietet. Formulare, Links,
        Lesezeichen, die Barrierefreiheitsstruktur und eingebettete Anhänge
        kommen mit. Zurück bleibt nur das Material, auf das im Dokument nichts
        mehr verwiesen hat."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und keine Grenze für die Dateigröße außer der, die der
        Arbeitsspeicher Ihres Geräts vorgibt. Bezahlt wird die Seite über
        Werbung, und den Anzeigen wird nichts über Ihr Dokument übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihr Dokument zum
        Komprimieren wegschickt, bliebe in dem Moment stehen, in dem Sie den
        Stecker ziehen."""

