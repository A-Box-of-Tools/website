#
# PDF-Entsperrer - German.
#
# Overrides for tools/unlock-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# Zwei Dinge, die beim Bearbeiten dieser Prosa nicht verloren gehen dürfen,
# dieselben wie im englischen Original.
#
# Erstens: "Geschützt" heißt bei einem PDF zweierlei, und diese Seite darf die
# beiden nie ineinanderlaufen lassen. Ein Dokument mit Öffnungspasswort kann
# niemand lesen, der es nicht hat, und nichts hier findet eines. Ein Dokument
# mit Einschränkungen öffnet sich für jeden und bittet Leseprogramme nur, es
# nicht zu drucken oder zu kopieren; diese Bitte beruht auf einer Übereinkunft
# zwischen sich gut benehmenden Programmen, nicht auf Kryptographie, und Adobe
# hat das von Anfang an so dokumentiert. Der zweite Fall ist bei weitem der
# häufigere, und er ist der, den dieses Werkzeug mit einem Klick und ganz ohne
# Passwort erledigt.
#
# Zweitens: Dieses Werkzeug errät keine Passwörter. Nirgends in src/ gibt es
# eine Schleife dafür, und die Seite sagt das, statt es erraten zu lassen. Ein
# 40-Bit-RC4-Schlüssel fiele einer Suche tatsächlich zum Opfer, und genau
# deshalb muss die Weigerung ausgesprochen werden statt bloß mitgemeint.
#
# Begriffe: "user password" heißt Öffnungspasswort, wo es um seine Wirkung
# geht, und Benutzerpasswort, wo die FAQ die beiden Passwörter des Formats
# einander gegenüberstellt; "owner password" heißt Besitzerpasswort;
# "restrictions" heißt Einschränkungen; "scheme" heißt Verfahren; "revision"
# bleibt Revision, weil es /R entspricht; "reader" heißt Leseprogramm. Der
# Schutz nebenan verwendet dieselben Wörter.
#

name = "PDF-Entsperrer"
heading = "PDF&nbsp;entsperren <span class=\"h1-kw\">&mdash; Passwort und Einschränkungen abnehmen</span>"
tagline = "Die meisten gesperrten PDFs brauchen gar kein Passwort. Dieses Werkzeug sagt Ihnen, welche Sorte Sie haben, bevor es sie anrührt."

title = "PDF entsperren &mdash; Passwort &amp; Einschränkungen entfernen, kostenlos, ohne Upload"
description = "Das Passwort und die Einschränkungen für Drucken, Kopieren und Bearbeiten im Browser von einem PDF abnehmen. Die meisten geschützten Dateien brauchen gar kein Passwort, und dieses Werkzeug sagt Ihnen, welche Sorte Sie haben. Es wird nichts hochgeladen, und ein Passwort wird nie erraten."
og_title = "Ein PDF entsperren, ohne es irgendwohin hochzuladen"
og_description = "Die meisten &bdquo;geschützten&ldquo; PDFs öffnen sich für jeden und bitten Leseprogramme nur, sie nicht zu drucken oder zu kopieren. Dieses Werkzeug entfernt das in Ihrem Browser und sagt Ihnen, was der Schutz tatsächlich wert war."
og_image_alt = "Ein PDF im Browser entsperren, ohne es hochzuladen"

pledge = """
    Das Dokument, das Sie wählen, wird im Arbeitsspeicher dieses Geräts
    geöffnet, entschlüsselt und wieder hinausgeschrieben, von Code, der von
    dieser Adresse stammt. Einen Upload kann hier nichts auslösen, und am
    anderen Ende dieser Seite steht kein Server, der einen entgegennähme.
    Weder die Datei noch das Passwort, das Sie eintippen, verlässt den Tab."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und entsperren Sie etwas. Keine einzige Anfrage
      trägt ein Dokument, ein Passwort oder einen Dateinamen. Oder trennen Sie
      die Internetverbindung und entsperren Sie es trotzdem."""

read_first = """
, <code>src/shared/pdf-crypt.js</code> dafür, wie aus einem Passwort
      der Schlüssel eines Dokuments wird, und dafür, dass darin nirgends eine
      Schleife steht, und <code>src/shared/aes.js</code> und
      <code>src/shared/rc4.js</code> für die beiden Chiffren selbst. Keine
      dieser Dateien kommt ins Netz, und der Leser und der Schreiber daneben
      auch nicht."""

howto_heading = "So entfernen Sie ein Passwort oder die Einschränkungen von einem PDF"

card = """
            Das Passwort und die Einschränkungen für Drucken, Kopieren und
            Bearbeiten von einem PDF abnehmen. Die meisten geschützten Dateien
            öffnen sich ohnehin für jeden und brauchen gar kein Passwort. Dieses
            Werkzeug sagt, welche Sorte Sie haben und was der Schutz wert war,
            und entfernt ihn hier."""

