  "MP4-Ausgabe (H.264), mit WebM als Rückfalloption",
  "Auflösungsvoreinstellungen bis 4K, eigene Abmessungen im Rahmen der Browsergrenzen und frei wählbare ganzzahlige Bildraten von 1 bis 120 fps",
  "Standzeit je Bild, in Einzelbildern oder Sekunden",
  "Läuft offline; kein Upload, kein Konto",
