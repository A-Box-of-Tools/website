read_first = """
, sowie <code>src/encoder.js</code> für die
      Kodierschleife, die nie ans Netz geht."""

howto_heading = "So wandeln Sie eine Bildsequenz oder Diashow in MP4 um"

card = """
            Aus einem Ordner voller Bilder eine MP4-Diashow machen. Die
            Kodierung läuft auf Ihrem eigenen Gerät, mit Ihrer eigenen
            Hardware."""

