[[facts]]
text = "Funktioniert offline"

[[facts]]
text = "Quelloffen"

[[facts]]
text = "Dateien bleiben auf Ihrem Gerät"

[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Dateien landen könnten, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen. Früher stand hier
      <code>connect-src 'none'</code>, was absolut war. Die Werbung hat das
      gekostet, und es auszusprechen gehört zum Handel dazu."""

[[privacy]]
title = "Die Kodierung ist lokal."
body = """
 WebCodecs läuft in Ihrem Browser, und die
      fertige Datei geht direkt in einen Download. Eine Serverseite hat dieses
      Programm nicht."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihre
      Bilder übergeben, weder eine Datei noch ein Vorschaubild, ein Name, eine
      Größe oder eine Anzahl. Jede Zeile, die ein Bild liest, dekodiert,
      zusammensetzt oder kodiert, kommt von dieser Domain selbst und steht im
      Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihre Bilder bekommt er nichts. Solange Sie ihn nicht
      anklicken, passiert nichts, und was Sie damit ansteuern, ist die Seite von
      jemand anderem."""

[[privacy]]
title = "Eine bewusste Ausnahme."
body = """
 Benutzen Sie &bdquo;Von einer Webadresse
      hinzufügen&ldquo;, wird jener Server kontaktiert, um das Bild zu holen, und
      sieht dabei Ihre IP-Adresse. Abgerufen wird nur, was Sie selbst einfügen,
      und nur in eine Richtung, nämlich herein: <code>img-src</code> ist
      geöffnet, <code>connect-src</code> nicht. Der Zähler weiter unten führt
      jede fremde Adresse auf, die kontaktiert wurde."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles
      außer dem Laden per Webadresse arbeitet weiter. Einen einfacheren Beweis
      gibt es nicht."""

[[howto]]
title = "Wählen Sie Ihre Bilder aus."
body = """
 Ziehen Sie einen Ordner auf das
      Auswahlfeld oder suchen Sie die Dateien von Hand heraus. Der Browser liest
      sie direkt von Ihrer Festplatte, und dabei geht nichts nach draußen."""

[[howto]]
title = "Bringen Sie sie in die Reihenfolge und legen Sie die Standzeit fest."
body = """
 Umsortiert
      wird durch Ziehen. Die Standzeit lässt sich in Einzelbildern oder in
      Sekunden angeben, entweder für alle Bilder auf einmal oder Bild für
      Bild."""

[[howto]]
title = "Wählen Sie Auflösung und Bildrate."
body = """
 &bdquo;An höchste Auflösung
      anpassen&ldquo; richtet sich nach Ihrem größten Bild. Die Voreinstellungen
      decken 4K, 1080p, 720p, quadratisch und hochkant ab, und für den Fall, dass
      nichts davon passt, gibt es eine eigene Größe."""

[[howto]]
title = "Video erzeugen und herunterladen."
body = """
 Die Kodierung läuft auf Ihrer
      eigenen Hardware. Wie lange sie dauert, hängt daher von Ihrem Gerät ab und
      nicht von einer Warteschlange. Das fertige MP4 geht direkt in die Downloads
      Ihres Browsers."""

[[faq]]
q = "Werden meine Bilder irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, setzt zusammen und kodiert auf Ihrer
        eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die
        sie kontaktieren darf; keine davon gehört uns. Die eine Ausnahme ist die
        optionale Funktion &bdquo;Von einer Webadresse hinzufügen&ldquo;, die ein
        von Ihnen eingefügtes Bild abruft. Jener Server sieht dabei Ihre
        IP-Adresse."""

[[faq]]
q = "Welche Bildformate kann ich verwenden?"
a = """
        Jedes Standbildformat, das Ihr Browser dekodieren kann, in der Praxis
        also JPG, PNG, WebP, GIF, AVIF und auf Apple-Geräten HEIC. Eine eigene
        Liste, die aktuell gehalten werden müsste, gibt es hier nicht, denn das
        Dekodieren ist Sache des Browsers und nicht unsere."""

[[faq]]
q = "Welches Videoformat kommt heraus?"
a = """
        MP4 mit H.264-Video, das praktisch überall läuft. In einem Browser ohne
        WebCodecs weicht das Werkzeug darauf aus, stattdessen WebM aufzuzeichnen,
        also dasselbe Material in einem Container, den weniger Schnittprogramme
        annehmen."""

[[faq]]
q = "Kann ich das für eine Render-Sequenz aus Blender oder After Effects nutzen?"
a = """
        Ja, eine durchnummerierte Render-Sequenz ist geradezu der Anlass für
        dieses Werkzeug. Fügen Sie die Einzelbilder hinzu, die Ihr Renderer
        geschrieben hat, lassen Sie die Standzeit bei einem Einzelbild und
        stellen Sie die Bildrate passend zum Render ein. &bdquo;Nach Name
        sortieren&ldquo; zählt so, wie Sie es erwarten würden:
        <code>frame_2</code> landet vor <code>frame_10</code> und nicht dahinter.
        <br><br>
        Eines sollten Sie vorher wissen. H.264 hat keinen Alphakanal, Transparenz
        wird also auf die Hintergrundfarbe heruntergerechnet statt mitgenommen.
        Muss das Alpha erhalten bleiben, setzen Sie die Einzelbilder besser in
        Ihrem Schnittprogramm zusammen."""

[[faq]]
q = "Kann ich aus Fotos einen Zeitraffer machen?"
a = """
        Ja, und es ist dieselbe Aufgabe wie eine Render-Sequenz. Halten Sie jedes
        Foto ein einzelnes Einzelbild lang und wählen Sie eine Bildrate. Bei
        30 fps ergeben je dreißig Fotos eine Sekunde Video, bei 12 fps laufen
        dieselben Fotos zweieinhalb Sekunden.
        <br><br>
        &bdquo;Nach Datum sortieren&ldquo; bringt eine Kamerarolle zurück in die
        Reihenfolge, in der sie aufgenommen wurde, und darauf kommt es an, wenn
        die Dateinamen zwischendurch wieder bei 0001 angefangen haben. Fotos
        unterschiedlicher Größe sind kein Problem, denn &bdquo;An höchste
        Auflösung anpassen&ldquo; legt das Video so aus, dass keines von ihnen
        verkleinert wird."""

[[faq]]
q = "Gibt es eine Grenze für die Zahl der Bilder oder die Länge des Videos?"
a = """
        Im Werkzeug ist keine Grenze eingebaut. Die praktische Obergrenze setzt
        der Arbeitsspeicher Ihres Geräts, denn das fertige Video wird dort
        zusammengesetzt, bevor Sie es herunterladen. Als Erstes bekommen das sehr
        große 4K-Diashows zu spüren."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung und keine
        Testphase. Bezahlt wird die Seite über Werbung, und den Anzeigen wird
        nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird. Ein Werkzeug, das Ihre Bilder zum
        Verarbeiten wegschickt, bliebe in dem Moment stehen, in dem Sie den
        Stecker ziehen."""

[[faq]]
q = "Kann ich Musik oder eine Tonspur hinzufügen?"
a = """
        Noch nicht. Das Werkzeug erzeugt reines Video, und das MP4, das es
        schreibt, hat eine einzige Videospur und keine Tonspur. Brauchen Sie
        Ton, legen Sie ihn hinterher in einem Schnittprogramm darunter."""

