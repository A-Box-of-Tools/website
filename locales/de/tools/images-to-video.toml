[[privacy]]
title = "Ihre Bilder haben keinen Weg nach draußen."
body = """
 Die
      Content-Security-Policy nennt jede Adresse, die diese Seite kontaktieren
      darf, und keine davon gehört zu dieser Seite. Es gibt hier keinen Endpunkt,
      an dem Ihre Dateien gesammelt werden könnten, und nichts im Code, das sie
      senden würde, gäbe es einen. Früher stand hier
      <code>connect-src 'none'</code>, was absolut war; die Werbung hat das
      gekostet, und das auszusprechen gehört zum Handel dazu."""

[[privacy]]
title = "Die Kodierung ist lokal."
body = """
 WebCodecs läuft in Ihrem Browser, und die
      fertige Datei geht direkt an einen Download. Dieses Programm hat keine
      Serverseite."""

[[privacy]]
title = "Was Google lädt - und was es nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihre
      Bilder übergeben: keine Datei, kein Vorschaubild, kein Name, keine Größe,
      keine Anzahl. Jede Zeile, die ein Bild liest, dekodiert, zusammensetzt oder
      kodiert, wird von dieser Herkunft ausgeliefert und ist im Repository
      aufgeführt."""

[[privacy]]
title = "Was der Spenden-Button lädt - und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Er ist ein Link und nicht mehr: Er meldet keinen Besuch, und
      ihm wird nichts über Sie oder Ihre Bilder übergeben. Es passiert nichts,
      solange Sie ihn nicht anklicken, und was Sie damit ansteuern, ist die Seite
      von jemand anderem."""

[[privacy]]
title = "Eine bewusste Ausnahme."
body = """
 Wenn Sie &bdquo;Von einer Webadresse
      hinzufügen&ldquo; benutzen, wird jener Server kontaktiert, um das Bild zu
      holen, und sieht dabei Ihre IP-Adresse. Abgerufen werden nur Bilder, die
      Sie selbst einfügen, und nur herein: <code>img-src</code> ist geöffnet,
      <code>connect-src</code> nicht. Der Zähler weiter unten führt jede
      kontaktierte fremde Herkunft auf."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles
      außer dem Laden per Webadresse arbeitet weiter. Das ist der einfachste
      Beweis von allen."""

[[howto]]
title = "Wählen Sie Ihre Bilder."
body = """
 Ziehen Sie einen Ordner auf das
      Auswahlfeld oder wählen Sie die Dateien von Hand. Der Browser liest sie
      direkt von Ihrer Festplatte; dabei wird nichts irgendwohin gesendet."""

[[howto]]
title = "Bringen Sie sie in die Reihenfolge und legen Sie die Standzeit fest."
body = """
 Ziehen
      Sie zum Umsortieren. Die Standzeit lässt sich in Einzelbildern oder in
      Sekunden angeben, entweder für alle Bilder auf einmal oder Bild für
      Bild."""

[[howto]]
title = "Wählen Sie Auflösung und Bildrate."
body = """
 &bdquo;An höchste Auflösung
      anpassen&ldquo; richtet sich nach Ihrem größten Bild; die Voreinstellungen
      decken 4K, 1080p, 720p, quadratisch und hochkant ab, und es gibt eine
      eigene Größe, falls nichts davon passt."""

[[howto]]
title = "Video erzeugen und herunterladen."
body = """
 Die Kodierung läuft auf Ihrer
      eigenen Hardware, wie lange sie dauert, hängt also von Ihrem Gerät ab und
      nicht von einer Warteschlange. Das fertige MP4 geht direkt in die Downloads
      Ihres Browsers."""

[[faq]]
q = "Werden meine Bilder irgendwohin hochgeladen?"
a = """
        Nein. Ihre Bilder werden von Ihrem eigenen Browser auf Ihrer eigenen
        Hardware gelesen, zusammengesetzt und kodiert. Dieses Werkzeug hat keine
        Serverseite, und die <code>Content-Security-Policy</code> der Seite nennt
        jede Adresse, die sie kontaktieren darf &mdash; keine davon gehört zu
        dieser Seite. Die eine Ausnahme ist die optionale Funktion &bdquo;Von
        einer Webadresse hinzufügen&ldquo;, die ein von Ihnen eingefügtes Bild
        abruft; jener Server sieht dabei Ihre IP-Adresse."""

[[faq]]
q = "Welche Bildformate kann ich verwenden?"
a = """
        Jedes Standbildformat, das Ihr Browser dekodieren kann, in der Praxis
        also JPG, PNG, WebP, GIF, AVIF und auf Apple-Geräten HEIC. Es gibt hier
        keine eigene Liste, die aktuell gehalten werden müsste, denn das
        Dekodieren ist Sache des Browsers und nicht unsere."""

[[faq]]
q = "Welches Videoformat kommt heraus?"
a = """
        MP4 mit H.264-Video, das praktisch überall abspielt. In einem Browser
        ohne WebCodecs weicht das Werkzeug darauf aus, stattdessen WebM
        aufzuzeichnen &mdash; dasselbe Material in einem Container, den weniger
        Schnittprogramme annehmen."""

[[faq]]
q = "Kann ich das für eine Render-Sequenz aus Blender oder After Effects nutzen?"
a = """
        Ja &mdash; eine durchnummerierte Render-Sequenz ist genau das, wofür das
        hier da ist. Fügen Sie die Einzelbilder hinzu, die Ihr Renderer
        geschrieben hat, lassen Sie die Standzeit bei einem Einzelbild und stellen
        Sie die Bildrate passend zum Render ein. &bdquo;Nach Name sortieren&ldquo;
        zählt so, wie Sie es erwarten würden: <code>frame_2</code> landet vor
        <code>frame_10</code> und nicht dahinter.
        <br><br>
        Eines sollten Sie vorher wissen: H.264 hat keinen Alphakanal, Transparenz
        wird also auf die Hintergrundfarbe heruntergerechnet statt mitgenommen.
        Wenn das Alpha erhalten bleiben muss, setzen Sie die Einzelbilder
        stattdessen in Ihrem Schnittprogramm zusammen."""

[[faq]]
q = "Kann ich aus Fotos einen Zeitraffer machen?"
a = """
        Ja, und das ist dieselbe Aufgabe wie eine Render-Sequenz: Halten Sie
        jedes Foto ein einzelnes Einzelbild lang und wählen Sie eine Bildrate. Bei
        30 fps werden aus je dreißig Fotos eine Sekunde Video; bei 12 fps laufen
        dieselben Fotos zweieinhalb Sekunden.
        <br><br>
        &bdquo;Nach Datum sortieren&ldquo; bringt eine Kamerarolle zurück in die
        Reihenfolge, in der sie aufgenommen wurde &mdash; was zählt, wenn die
        Dateinamen wieder bei 0001 angefangen haben. Fotos unterschiedlicher
        Größe sind kein Problem: &bdquo;An höchste Auflösung anpassen&ldquo; legt
        das Video so aus, dass keines von ihnen verkleinert wird."""

[[faq]]
q = "Gibt es eine Grenze für die Zahl der Bilder oder die Länge des Videos?"
a = """
        Im Werkzeug ist keine Grenze eingebaut. Die praktische Obergrenze ist der
        Arbeitsspeicher Ihres Geräts, denn das fertige Video wird dort
        zusammengesetzt, bevor Sie es herunterladen. Sehr große 4K-Diashows sind
        das Erste, was sie zu spüren bekommt."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung und keine
        Testphase. Die Seite trägt Werbung, und die bezahlt sie; den Anzeigen
        wird nichts über Ihre Bilder übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird: Ein Werkzeug, das Ihre Bilder zum
        Verarbeiten wegschickt, würde in dem Moment stehen bleiben, in dem Sie
        den Stecker ziehen."""

[[faq]]
q = "Kann ich Musik oder eine Tonspur hinzufügen?"
a = """
        Noch nicht. Das Werkzeug erzeugt reines Video: Das MP4, das es schreibt,
        hat eine einzige Videospur und keine Tonspur. Legen Sie eine Tonspur
        hinterher in einem Schnittprogramm darunter, wenn Sie eine brauchen."""

