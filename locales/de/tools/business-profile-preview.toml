#
# Unternehmensprofil-Vorschau - German.
#
# Overrides for tools/business-profile-preview/tool.toml. Only words: the slug,
# the category, the icon and the list of shared parts stay where they are.
#
# Google wird auf dieser Seite überall genannt, denn das, was in der Vorschau
# steht, ist ein Google Unternehmensprofil, und das lässt sich nicht sagen,
# ohne es zu sagen. Was die Seite nie tun darf, ist den Eindruck zu erwecken,
# Google habe mit dieser hier etwas zu tun; darum sagen die FAQ rundheraus,
# dass keine Verbindung besteht und dass die Zeichnung eine Zeichnung ist und
# kein Screenshot. "Google Unternehmensprofil" ist der amtliche deutsche Name
# des Produkts und steht deshalb im Fließtext; "Knowledge Panel" bleibt, weil
# Google es auf Deutsch so nennt.
#

name = "Unternehmensprofil-Vorschau"
heading = "Unternehmensprofil-Vorschau <span class=\"h1-kw\">&mdash; Ihren Google-Eintrag sehen, bevor er live geht</span>"
tagline = "Tippen Sie es ein, und es wird die Karte, die Google zeichnen würde. Zum Zeichnen wird nichts verschickt."

title = "Google Unternehmensprofil Vorschau &mdash; kostenlos, ohne Anmeldung, ohne Upload"
description = "Sehen Sie, wie Ihr Google Unternehmensprofil aussehen wird, bevor es live geht: das Knowledge Panel, die Karte auf dem Telefon und das Suchergebnis, gezeichnet aus Name, Kategorie, Öffnungszeiten, Bewertung und Foto, die Sie eintippen. Einen bestehenden Eintrag importieren Sie durch Einfügen. Download als PNG oder SVG. Alles passiert in Ihrem Browser."
og_title = "Ein Google Unternehmensprofil in der Vorschau sehen, ohne jemandem Ihre Daten zu geben"
og_description = "Das Knowledge Panel, die Ortskarte auf einem Telefon und das lokale Suchergebnis, gezeichnet in Ihrem eigenen Browser aus dem, was Sie eintippen. Fügen Sie einen bestehenden Eintrag ein, um von ihm auszugehen. Kein Konto, kein Wasserzeichen, kein Upload."
og_image_alt = "Unternehmensprofil-Vorschau - Ihren Google-Eintrag sehen, bevor er live geht"

pledge = """
    Jedes Feld, das Sie eintippen, wird von rund tausend Zeilen JavaScript auf
    dieser Seite, die Sie lesen können, in ein Bild gezeichnet, und kein
    Schritt darin kontaktiert irgendjemanden. Nicht, um Ihr Unternehmen
    nachzuschlagen, nicht, um eine Adresse zu prüfen, nicht, um einen Stern zu
    zeichnen. Eine Netzfunktion hat dieses Werkzeug überhaupt nicht, und das
    zählt hier, denn ein Unternehmensprofil ist so oft eine Privatadresse wie
    ein Ladenlokal, und eine Telefonnummer, die auf jemandes eigenem Telefon
    klingelt."""

live_hint = """
      Sie müssen uns nicht glauben. Öffnen Sie die DevTools, sehen Sie im Tab
      &bdquo;Netzwerk&ldquo; zu und tippen Sie Ihre Adresse und Telefonnummer
      in die Felder. Keine einzige Anfrage trägt ein Zeichen davon. Oder
      trennen Sie die Internetverbindung und erstellen Sie die ganze Vorschau
      trotzdem."""

read_first = """
, <code>src/surfaces.js</code>
      für die drei Karten selbst, in denen jede Koordinate ausgeschrieben ist,
      <code>src/profile.js</code> für die eine Rechnung auf der Seite, nämlich
      ob der Ort in diesem Moment geöffnet ist, und
      <code>src/parse-listing.js</code> dafür, was mit einem Eintrag geschieht,
      den Sie einfügen."""

howto_heading = "So sehen Sie ein Google Unternehmensprofil in der Vorschau, bevor es live geht"

card = """
            Wie Ihr Google-Eintrag aussehen wird: das Knowledge Panel, die
            Karte auf einem Telefon und das lokale Suchergebnis. Fügen Sie
            einen bestehenden ein, um von ihm auszugehen."""

[words]
plural = "Profile und die Bilder davon"
choose = "ein Titelfoto"
analytics_extra = """, und kein
  Zeichen dessen, was Sie eintippen"""

