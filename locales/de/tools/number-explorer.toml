name = "Zahlenentdecker"
heading = "Zahlenentdecker <span class=\"h1-kw\">&mdash; eine Million, eine Milliarde und mehr vor Augen</span>"
tagline = "Tippen Sie eine beliebige Zahl ein und sehen Sie ihr beim Wachsen zu: ein Bücherstapel, ein Wasserguss, ein Sternenhimmel, ein Sandhaufen, ein sehr langes Zählen."

title = "Zahlen veranschaulichen &mdash; Millionen und Milliarden verstehen &mdash; kostenlos, offline"
description = "Sehen Sie, wie groß eine Zahl wirklich ist. Sie wächst als Bücherstapel, Wasserguss, Sternenhimmel und Sandhaufen und als die Zeit, die das Zählen dauert, neben Wegmarken vom Mount Everest bis zur Milchstraße. Kostenlos und offline."
og_title = "Wie sieht eine Milliarde aus?"
og_description = "Machen Sie aus einer riesigen Zahl etwas Sichtbares: Bücher, Wasser, Sterne, Sand und Zeit, mit klaren Annahmen und ohne KI oder Upload."
og_image_alt = "Zahlenentdecker - große Zahlen als Bücher, Wasser, Sterne, Sand und Zeit darstellen"

pledge = "Ein Vergleich besteht aus einer Anzahl, einem gewählten Bezug und etwas Rechnen, und all das steckt in dieser Seite. Es gibt keinen KI-Dienst, den man fragen müsste, und keine Eingabe, die hochgeladen würde. Bücher, Wasser, Sterne, Sand und Zählzeit bleiben getrennt, und ihre Annahmen stehen neben dem Ergebnis, statt hinter dem Bild versteckt zu sein."
live_hint = "Ändern Sie die Zahl bei geöffnetem Tab &bdquo;Netzwerk&ldquo;. Der Rechner stellt keine Anfragen. Laden Sie die Seite einmal, trennen Sie die Verbindung und entdecken Sie weiter."
read_first = ", <code>src/scale.js</code> für das Lesen der Anzahl, die Modelle und die Wegmarken, <code>src/containers.js</code> dafür, was eine farbige Fläche misst, <code>src/stage.js</code> und die Dateien <code>src/scene-*.js</code> für die Bilder und <code>src/main.js</code> dafür, wie die Seite zusammenhängt."
howto_heading = "So stellen Sie eine große Zahl bildlich dar"
card = "Wie hoch ist ein Stapel aus einer Milliarde Büchern? Wie viel Wasser sind eine Milliarde Tropfen? Tippen Sie eine beliebige Zahl ein und sehen Sie zu, wie sie zu Büchern, Wasser, Sternen, Sand und Zeit wird, die Annahmen immer im Blick."

