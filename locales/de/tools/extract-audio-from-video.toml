[[privacy]]
title = "Ihr Video hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem eine Datei landen könnte, und im Code steht auch nichts, das sie dorthin
      schicken würde, gäbe es einen."""

[[privacy]]
title = "Das Bild wird gar nicht erst dekodiert."
body = """
 Angefordert wird allein die
      Tonspur. Die Einzelbilder werden nicht gelesen, nicht dekodiert, nicht
      gezeichnet und nicht angesehen, denn auf dieser Seite gibt es keinen Code,
      der das könnte, und in der Datei, die herauskommt, ist Ton und sonst nichts.
      Das ist kein Versprechen über Zurückhaltung.
      <code>decodeAudioData</code> bekommt die Bytes und gibt Ton zurück, und in
      <code>src/</code> liegt kein Video-Dekoder, der laufen könnte."""

[[privacy]]
title = "Der Dekoder ist der, den Ihr Browser ohnehin schon hat."
body = """

      Hier wird nichts ausgeliefert, um Ihr Format zu lesen, und dafür wird auch
      nichts außerhalb dieser Seite gefragt. Welche Dateien funktionieren, ist
      damit genau das, was Ihr Browser ohnehin abspielt."""

[[privacy]]
title = "Die Samples werden aufgeschrieben, nicht neu kodiert."
body = """

      Ein WAV sind die Samples, die der Dekoder zurückgegeben hat, mit einem Kopf
      davor. In der Schleife sitzt kein Kodierer, der Entscheidungen über Ihre
      Aufnahme trifft, und es gibt nichts, was man als Upload beschreiben könnte,
      auf dem so etwas passieren würde."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google, der Spenden-Button von Buy Me a Coffee.
      Keinem von ihnen wird irgendetwas über Ihr Video übergeben, weder eine
      Datei noch ein Sample, ein Name, eine Größe oder eine Länge."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und das
      Werkzeug arbeitet unverändert weiter, denn einen Netzschritt gab es darin
      nie. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Ziehen Sie das Video hinein."
body = """
 Ein MP4, MOV, M4V oder WebM,
      vom Telefon, aus einer Kamera, von einem Bildschirmrekorder oder aus einem
      Download. Ihr eigener Browser liest es, und es gibt keinen Upload-Schritt,
      den man weglassen müsste."""

[[howto]]
title = "Lesen Sie, was gefunden wurde."
body = """
 Die Länge, die Zahl der Kanäle
      und die Abtastrate, direkt aus der Datei. Wenn die Datei ihre Rate nicht
      angegeben hat, sagt die Seite das, statt still neu abzutasten und zu
      behaupten, es sei nichts angerührt worden."""

[[howto]]
title = "Wählen Sie Mono, wenn es kleiner sein soll."
body = """
 Lässt man die Kanäle
      in Ruhe, bleibt die Aufnahme genau so, wie sie war. Die Mischung auf Mono
      halbiert die Datei und ist das, was eine Transkription oder eine
      Sprachaufnahme will. Dabei werden die Kanäle gemittelt, statt einen davon
      wegzuwerfen."""

[[howto]]
title = "Hören Sie es ab, bevor Sie es speichern."
body = """
 Der Player spielt die
      Datei, die gleich heruntergeladen wird, nicht das Video. Klingt es richtig,
      ist der Download richtig."""

[[howto]]
title = "Nehmen Sie es mit, oder geben Sie es weiter."
body = """
 Laden Sie das WAV
      herunter, oder schicken Sie es direkt an den Schneider oder den Editor, ohne
      es vorher zu speichern."""

[[faq]]
q = "Wird mein Video irgendwohin hochgeladen?"
a = """
        Nein. Das Dekodieren und das Schreiben geschehen beide in Ihrem eigenen
        Browser, auf Ihrer eigenen Hardware. Eine Netzfunktion hat dieses Werkzeug
        überhaupt nicht, es ruft nie etwas ab und sendet nie etwas, und in der
        <code>Content-Security-Policy</code> der Seite steht jede Adresse, die sie
        kontaktieren darf; keine davon gehört uns. Wer lieber prüft als glaubt,
        trennt die Internetverbindung und holt den Ton trotzdem heraus."""

[[faq]]
q = "Bekomme ich auch ein MP3?"
a = """
        Nein, und es wird auch nicht so getan. Kein Browser bringt einen
        MP3-Kodierer mit, und der einzige Weg zu einem führt darüber, Ihr Video an
        einen Server zu schicken, der einen hat. Genau das ist das eine, wofür es
        diese Seite nicht gibt. Was Sie bekommen, ist ein WAV: die Samples mit
        einem vierundvierzig Byte langen Kopf davor, wofür es keinen Kodierer
        braucht und was keine Qualität kosten kann. Größer ist es allerdings, rund
        zehn Megabyte je Minute in Stereo, und öffnen kann es jeder Player, jedes
        Telefon und jedes Schnittprogramm. Was ein MP3 will, macht daraus in einer
        Sekunde eines."""

[[faq]]
q = "Wird das Bild jemals angesehen?"
a = """
        Nein, und hier gibt es nichts, was es ansehen könnte. Der Dekoder des
        Browsers bekommt die Datei und wird nach ihrer Tonspur gefragt. Die
        Videospur wird nie dekodiert, nie gezeichnet und erreicht den Code dieser
        Seite überhaupt nicht. In <code>src/</code> liegt kein Video-Dekoder, der
        laufen könnte. In der Datei, die herauskommt, ist Ton und sonst nichts."""

[[faq]]
q = "Es heißt, es sei kein Ton lesbar, aber das Video läuft einwandfrei."
a = """
        Dann hat das Video mit ziemlicher Sicherheit gar keine Tonspur. Eine
        Bildschirmaufnahme ohne ausgewähltes Mikrofon ist stumm, und ein Schnitt,
        den ein Programm mit stummgeschaltetem Ton exportiert hat, ebenso. Beide
        laufen einwandfrei, weil es ein Bild zu zeigen gibt. Die Meldung nennt
        diesen Fall zuerst, weil er der wahrscheinlichere der beiden ist; der
        andere ist ein Format, das dieser Browser nicht liest. Öffnen Sie die
        Datei in einem Player und achten Sie auf einen Lautstärkeregler, der
        nichts bewirkt. Das ist der schnellste Weg zu sehen, welcher der beiden
        Fälle vorliegt."""

[[faq]]
q = "Welche Videoformate kann ich öffnen?"
a = """
        Alles, was Ihr Browser dekodiert, in der Praxis also MP4, M4V, MOV und
        WebM sowie sämtliche Audioformate dazu. Draußen bleibt dieselbe kurze
        Liste wie überall sonst auf dieser Seite: AVI, WMV und die meisten MKVs.
        Eine Datei, die Ihr Browser nicht liest, wird mit einer entsprechenden
        Meldung abgelehnt, statt auf halbem Weg zu scheitern."""

[[faq]]
q = "Geht dabei Qualität verloren?"
a = """
        Nichts über das hinaus, was das Video seinem eigenen Ton bei der Aufnahme
        schon angetan hat. Die Samples, die der Dekoder zurückgibt, werden so
        aufgeschrieben, wie sie sind. Es gibt kein zweites Kodieren und damit auch
        keine zweite Verlustgeneration. Zu wissen ist nur eines: die Abtastrate.
        Die Rate der Datei wird zuerst aus deren Kopf gelesen, und dekodiert wird
        mit genau dieser Rate, damit Ihre Aufnahme nicht stillschweigend neu
        abgetastet wird. Gibt eine Datei keine an, sagt die Seite, mit welcher
        Rate sie gerechnet hat."""

[[faq]]
q = "Warum ist das WAV so viel größer als das Video?"
a = """
        Weil ein WAV nicht komprimiert ist und die Tonspur des Videos es war. Ton
        in CD-Qualität braucht rund zehn Megabyte je Minute in Stereo, ganz
        gleich, was darauf zu hören ist; die AAC-Spur in einem MP4 vielleicht ein
        Zehntel davon. Die Mischung auf Mono halbiert das. Das ist der Preis
        dafür, nicht neu zu kodieren, und er wird einmal bezahlt: Was Sie als
        Nächstes damit öffnen, kann die Datei komprimieren."""

[[faq]]
q = "Wie lang darf das Video sein?"
a = """
        Hier ist keine Grenze eingebaut, denn es gibt keinen Server, der dafür
        bezahlt. Die praktische Obergrenze ist der Arbeitsspeicher Ihres Geräts:
        Die Datei wird eingelesen, und die ganze Tonspur liegt als Samples im
        Speicher, sodass einer sehr langen Aufnahme auf einem kleinen Gerät der
        Platz ausgehen kann. Ein paar Stunden Video sind normalerweise
        unproblematisch, und ein Telefon schafft weniger als ein Notebook."""

[[faq]]
q = "Kann ich den Ton kürzen oder lauter machen?"
a = """
        Ja, aber nicht hier. Diese Seite erledigt eine Aufgabe. Sobald es ein
        Ergebnis gibt, steht neben dem Download eine Reihe von Links, die es
        direkt in den <a href="../audio-schneiden/">Audio-Schneider</a> oder den
        <a href="../audio-bearbeiten/">Audio-Editor</a> trägt, ohne es vorher zu
        speichern und ohne dass eines von beiden es hochladen würde."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine Testphase
        und keine Grenze dafür, wie viele Videos Sie öffnen. Bezahlt wird die
        Seite über Werbung, und den Anzeigen wird nichts über Ihre Datei
        übergeben."""

[[faq]]
q = "Funktioniert es offline?"
a = """
        Ja. Laden Sie die Seite einmal, trennen Sie dann die Internetverbindung,
        und sie arbeitet weiter. Das ist zugleich der einfachste Beweis dafür,
        dass nichts hochgeladen wird: Ein Werkzeug, das Ihr Video zum Verarbeiten
        wegschickt, bliebe in dem Moment stehen, in dem Sie die Verbindung
        trennen."""

