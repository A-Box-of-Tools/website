  "Eine Upload-Datei in der vorgeschriebenen Pixelgröße, an beiden Enden ins KB-Band des Portals gebracht",
  "SSC- und UPSC-Formularfotos in 200 x 230 mit 20 bis 50 KB und Unterschriften in 140 x 60 mit 10 bis 20 KB",
