features = [
  "Ein Regelwerk veröffentlichter Vorschriften, jede mit Behörde und Lesedatum",
  "Die Geometrie aus ICAO Doc 9303: Kopfhöhe als Anteil des Bildes und Augenlinie über der Unterkante",
  "Ein Zuschnittrahmen im Format der Vorschrift, mit eingezeichnetem Augen- und Kinnband",
  "Vier gezogene Marken für Scheitel, Kinn und beide Pupillen statt Gesichtserkennung",
  "Kopfhöhe, Augenlinie, Zentrierung und Neigung mitlaufend, jeweils mit Korrekturrichtung",
  "Hintergrundfarbe und Gleichmäßigkeit in CIE Lab gemessen und getrennt ausgewiesen",
  "Druckt auf den exakten Millimeter, mit der Auflösung im JPEG-Kopf",
