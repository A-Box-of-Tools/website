name = "Bild zu SVG"
heading = "Bild&nbsp;zu&nbsp;SVG <span class=\"h1-kw\">&mdash; ein Logo, eine Schablone oder eine Silhouette in Kurven nachzeichnen</span>"
tagline = "Eine Form, eine Kontur. Zeigen Sie auf das, was nicht hineingehört."

title = "Bild zu SVG &mdash; Logo oder Silhouette vektorisieren, ohne Upload"
description = "Ein Schwarz-Weiß-Bild im Browser in eine echte SVG-Kontur nachzeichnen. Logos, Schablonen, Unterschriften, Strichzeichnungen und Silhouetten werden zu Kurven, die sich in jede Größe skalieren lassen. Ein Klick entfernt, was der Tracer falsch verstanden hat. Nichts wird hochgeladen."
og_title = "Ein Logo oder eine Silhouette in ein SVG verwandeln, ohne es hochzuladen"
og_description = "Ein vergrößertes Bitmap ist eine Treppe; eine Kontur ist eine Anweisung. Dieses Werkzeug findet die Form, legt Kurven an sie an und lässt Sie wegklicken, was nicht hineingehört. Alles auf Ihrem eigenen Gerät."
og_image_alt = "Bild zu SVG - ein Logo, eine Schablone oder eine Silhouette in Kurven nachzeichnen"

pledge = """
    Ihr Browser liest das Bild von Ihrer Festplatte, <code>src/mask.js</code>
    macht daraus ein Bit je Pixel, <code>src/contour.js</code> läuft am Rand
    der Form entlang und <code>src/fit.js</code> legt Kurven an sie an. Das
    sind rund sechshundert Zeilen, die Sie lesen können, ohne Engine dahinter
    und ohne dass etwas heruntergeladen würde, um sie auszuführen. Dieses
    Werkzeug hat keinerlei Netzwerkfunktion: nichts abzurufen, nichts zu
    senden, und hinter dieser Seite steht auch kein Server, an den eine
    Zeichnung gehen könnte, selbst wenn es eine solche Funktion gäbe."""

live_hint = """
      Sie müssen uns nicht glauben: Öffnen Sie die DevTools, behalten Sie den
      Netzwerk-Tab im Auge und zeichnen Sie etwas nach. Keine einzige Anfrage
      trägt ein Bild, ein Vorschaubild, einen Dateinamen oder ein Byte dessen,
      was Sie gewählt haben. Oder trennen Sie die Internetverbindung und
      zeichnen Sie trotzdem eines nach."""

read_first = """
, <code>src/mask.js</code> dafür, wie aus
      einem Bild ein Bit je Pixel wird, <code>src/contour.js</code> für den
      Lauf am Rand der Form entlang, <code>src/fit.js</code> dafür, wie aus
      einer Treppe Kurven werden, und <code>src/subject.js</code> dafür, wie
      der Hintergrund bestimmt wird, wenn es kein Hell und Dunkel gibt, nach dem
      sich trennen ließe."""

howto_heading = "So zeichnen Sie ein Bild als SVG nach, ohne es hochzuladen"

card = """
            Ein vergrößertes Bitmap ist eine Treppe. Eine Kontur ist eine
            Anweisung und deshalb in jeder Größe scharf &mdash; sofern Sie eine
            Form haben und keine Fotografie."""

