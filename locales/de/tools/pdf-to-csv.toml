#
# PDF zu CSV - German.
#
# Overrides for tools/pdf-to-csv/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Was beim Ändern der Texte hier festgehalten bleiben muss, wie im englischen
# Original: Dieses Werkzeug schließt. Es liest keine Tabellen aus der Datei,
# denn in der Datei gibt es keine Tabellen, nur Text an Positionen, und die
# Spalten sind die Stellen, an denen mehrere Zeilen sich einig sind, dass dort
# eine Zelle beginnt oder endet. Jeder Satz hier muss das wahr lassen. Die
# Saldoprüfung ist ein Beweis und wird als einer beschrieben, aber nur manche
# Tabellen führen einen Saldo; keine Umformulierung darf aus "das steht auf
# den Seiten" stillschweigend "das ist richtig" machen.
#
# Es begann als Umwandler für Kontoauszüge und findet heute jede Tabelle in
# einem Dokument. "Kontoauszug" ist das Wort dieser Seite für bank statement
# und steht nur dort, wo vom Auszug selbst die Rede ist.
#

