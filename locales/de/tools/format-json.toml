[[privacy]]
title = "Was Sie einfügen, hat keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren darf,
      und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an dem ein
      eingefügtes Token eingesammelt werden könnte, und im Code steht auch nichts, das
      es dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 In <code>src/</code> gibt es nirgends ein
      <code>fetch</code>, kein <code>XMLHttpRequest</code> und kein
      <code>sendBeacon</code>. Alles, was hier liest oder schreibt, sind
      Funktionen auf dieser Seite, die eine Zeichenkette nehmen und eine
      Zeichenkette zurückgeben."""

[[privacy]]
title = "Die Formatierer behalten, was sie bekommen haben."
body = """
 Ein JSON-Objekt kommt mit
      seinen Schlüsseln in der Reihenfolge zurück, in der Sie sie geschrieben haben,
      und mit den Zahlen so geschrieben, wie Sie sie geschrieben haben. Denn
      <code>src/json.js</code> ist ein Parser und kein Aufruf von
      <code>JSON.parse</code>, das zahlartige Schlüssel umsortiert und aus einer
      zwanzigstelligen Kennung die nächstgelegene Fließkommazahl macht. Die Tests in
      <code>tests/js/text-format.test.js</code> prüfen genau das."""

[[privacy]]
