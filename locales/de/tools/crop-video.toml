[[privacy]]
title = "Ihre Videos haben keinen Weg nach draußen."
body = """
 In der
      Content-Security-Policy steht jede Adresse, die diese Seite kontaktieren
      darf, und keine einzige davon gehört uns. Es gibt hier keinen Endpunkt, an
      dem Ihre Datei landen könnte, und im Code steht auch nichts, das sie
      dorthin schicken würde, gäbe es einen."""

[[privacy]]
title = "Nichts hier ruft etwas ab."
body = """
 Eine Netzfunktion hat dieses Werkzeug
      überhaupt nicht. Es gibt keine Adresse zum Einfügen, nichts
      herunterzuladen und keine Engine, die beim ersten Gebrauch nachgeladen
      wird. Jedes Byte, das Ihr Video berührt, kam beim Laden der Seite von
      dieser Domain selbst."""

[[privacy]]
title = "Dekodieren und Kodieren passieren lokal."
body = """
 Die Einzelbilder laufen
      durch WebCodecs in Ihrem eigenen Browser oder durch dieselbe
      Wiedergabe-Engine, die Ihnen den Clip ohnehin zeigen würde. Die fertige
      Datei entsteht im Arbeitsspeicher dieses Geräts und geht von dort direkt in
      einen Download."""

[[privacy]]
title = "Der Ton wird kopiert, nicht angehört."
body = """
 Auf dem MP4-Weg werden die
      Audio-Samples übernommen, ohne überhaupt dekodiert zu werden. Nichts hier
      macht daraus je wieder Klang, und selbst wenn, könnte nichts ihn
      weiterreichen."""

[[privacy]]
title = "Was Google lädt und was Google nicht bekommt."
body = """
 Die Werbe- und
      Messskripte kommen von Google. Keinem von beiden wird irgendetwas über Ihr
      Video übergeben, weder eine Datei noch ein Einzelbild, ein Name, eine
      Größe, eine Länge oder das Format, auf das Sie zugeschnitten haben. Jede
      Zeile, die liest, dekodiert, zuschneidet oder kodiert, kommt von dieser
      Domain selbst und steht im Repository."""

[[privacy]]
title = "Was der Spenden-Button lädt und was er nicht bekommt."
body = """

      Der Button &bdquo;Buy me a coffee&ldquo; in der Kopfzeile wird von einem
      Skript von cdnjs.buymeacoffee.com gezeichnet und holt seine Schrift von
      Google Fonts. Mehr als ein Link ist er nicht. Er meldet keinen Besuch, und
      über Sie oder Ihr Video bekommt er nichts."""

[[privacy]]
title = "Es funktioniert offline."
body = """
 Trennen Sie die Netzverbindung, und alles auf
      dieser Seite arbeitet weiter. Einen einfacheren Beweis gibt es nicht."""

[[howto]]
title = "Wählen Sie ein Video aus."
body = """
 Ziehen Sie ein MP4, MOV, M4V oder WebM
      auf das Auswahlfeld oder suchen Sie eines von Hand heraus. Der Browser
      liest es direkt von Ihrer Festplatte, und dabei geht nichts nach
      draußen."""

[[howto]]
title = "Ziehen Sie den Rahmen über den Teil, den Sie behalten wollen."
body = """
 Innen
      ziehen verschiebt ihn, an den Ecken ziehen ändert seine Größe. Legen Sie
      ihn vorher auf ein Format fest, etwa 1:1 für einen quadratischen Beitrag,
      9:16 fürs Handy oder 16:9 für ein breites Bild. Oder tippen Sie in die vier
      Felder darunter ein exaktes Pixelfenster.
      Spielen Sie den Clip ab oder ziehen Sie den Regler darunter, um das Einzelbild zu wählen, an dem Sie den Rahmen ausrichten."""

[[howto]]
title = "Entscheiden Sie, wie viel Qualität ausgegeben wird."
body = """
 Das Bild muss
      neu kodiert werden, denn ein zugeschnittenes Einzelbild ist ein anderes
      Bild. &bdquo;Ausgewogen&ldquo; bleibt nah an dem, was die Datei für diesen
      Ausschnitt ohnehin schon ausgegeben hat, &bdquo;Beste Qualität&ldquo; legt
      noch etwas drauf. Der Ton bleibt erhalten, sofern Sie ihn nicht
      abschalten."""

[[howto]]
title = "Zuschneiden und herunterladen."
body = """
 Die Arbeit passiert auf Ihrer
      eigenen Hardware. Wie lange sie dauert, hängt daher von Ihrem Gerät ab und
      nicht von einer Warteschlange. Das fertige Video geht direkt in die
      Downloads Ihres Browsers."""

[[faq]]
q = "Wird mein Video irgendwohin hochgeladen?"
a = """
        Nein. Ihr eigener Browser liest, dekodiert, schneidet und kodiert es auf
        Ihrer eigenen Hardware. Eine Serverseite hat dieses Werkzeug nicht, und
        in der <code>Content-Security-Policy</code> der Seite steht jede Adresse,
        die sie kontaktieren darf; keine davon gehört uns. Wer lieber prüft als
        glaubt, trennt die Internetverbindung und schneidet trotzdem einen Clip
        zu."""

[[faq]]
q = "Welche Videoformate kann ich zuschneiden?"
a = """
        MP4, M4V und MOV werden direkt gelesen, egal was darin steckt, also
        H.264, HEVC, AV1 oder VP9, solange Ihr Browser diesen Codec dekodieren
        kann. Alles andere, was Ihr Browser abspielen kann, allen voran WebM,
        wird stattdessen abgespielt und dabei aufgezeichnet. Das funktioniert,
        dauert aber so lange, wie der Clip lang ist. Was der Browser weder lesen
        noch abspielen kann, in der Praxis AVI, WMV, FLV und die meisten MKVs,
        wird gleich mit einer entsprechenden Meldung abgelehnt, statt auf halbem
        Weg zu scheitern."""

[[faq]]
q = "Gibt es eine Grenze für Größe oder Länge des Videos?"
a = """
        Im Werkzeug ist keine Grenze eingebaut, und die Datei wandert auch nicht
        auf einmal in den Arbeitsspeicher, sondern läuft in Häppchen von wenigen
        Megabyte durch. Die praktische Obergrenze setzen zwei andere Dinge: das
        fertige Video, das vor dem Download im Arbeitsspeicher zusammengesetzt
        wird, und die Zeit, die Ihr Gerät zum Kodieren braucht."""

[[faq]]
q = "Bleibt der Ton erhalten?"
a = """
        Auf dem MP4-Weg sogar exakt. Das Audio wird Sample für Sample übernommen,
        ohne je dekodiert zu werden, und ist damit Byte für Byte das, was in der
        Datei stand. Auf dem Aufzeichnungsweg wird es von der Wiedergabe
        abgegriffen und neu kodiert, was ein wenig Qualität kostet. So oder so
        gibt es ein Häkchen, um ihn ganz wegzulassen."""

[[faq]]
q = "Kostet das Zuschneiden Qualität?"
a = """
        Das Bild wird neu kodiert, denn ein zugeschnittenes Einzelbild ist ein
        anderes Bild, und speichern lässt es sich nicht, ohne die Pixel neu zu
        schreiben. Was das Werkzeug dabei nicht tut, ist mehr auszugeben, als das
        Original für denselben Ausschnitt ausgegeben hat. Eine Neukodierung
        darüber hinaus macht die Datei nur größer, ohne sie besser aussehen zu
        lassen."""

[[faq]]
q = "Kann ich auch die Länge kürzen?"
a = """
        Hier nicht, aber nebenan. Dieses Werkzeug ändert die Form des Bildes und
        sonst nichts. Der Clip, der herauskommt, ist genauso lang wie der, der
        hineinging, mit unversehrtem Timing und Ton. Kürzen ist eine eigene
        Aufgabe und hat ein eigenes Werkzeug: Der
        <a href="../video-schneiden/">Video-Schneider</a> markiert die
        behaltenswerten Teile eines Clips und speichert sie als eine Datei, ohne
        ein einziges Einzelbild neu zu kodieren."""

[[faq]]
q = "Warum ändern sich Breite und Höhe in Zweierschritten?"
a = """
        H.264, der Codec in einem MP4, speichert das Bild in Blöcken und kann ein
        Einzelbild mit einer ungeraden Pixelzahl je Seite gar nicht beschreiben.
        Statt Ihren Zuschnitt hinterher stillschweigend zu runden, bietet der
        Rahmen von vornherein nur gerade Zahlen an."""

[[faq]]
q = "Ist es kostenlos, und brauche ich ein Konto?"
a = """
        Es ist kostenlos, und es gibt kein Konto, keine Anmeldung, keine
        Testphase und kein Wasserzeichen. Bezahlt wird die Seite über Werbung,
        und den Anzeigen wird nichts über Ihr Video übergeben."""

