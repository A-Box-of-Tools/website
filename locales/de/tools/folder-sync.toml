[[privacy]]
title = "Sie wählen die Ordner und genehmigen dann das Gerät."
body = """
      Jedes Gerät wählt seinen eigenen Ordner im Auswahldialog des Browsers,
      und diese Seite kann nichts außerhalb davon erreichen. Das Gerät, das
      die Synchronisierung startet, genehmigt das beitretende Gerät, bevor
      irgendetwas über einen der beiden Ordner gesendet wird. Die erste
      Peer-Verbindung trägt nur einen verschlüsselten Steuerkanal und die
      Anfrage des beitretenden Geräts mit einer optionalen Notiz. Eine Notiz
      ist selbst gewählter Text, keine geprüfte Identität. Jeweils ein Gerät
      kann mit dem Host synchronisieren, und bis zu vier Anfragen können
      warten. Der beitretende Browser speichert lokal einen zufälligen
      Genehmigungsnachweis und legt ihn nur über den verschlüsselten
      Peer-Kanal vor, damit er sich ohne erneute Genehmigung wieder mit
      derselben Sitzung verbinden kann. Das Beenden der Synchronisierung oder
      das Trennen dieses Geräts widerruft den Nachweis."""
[[privacy]]
title = "Das andere Gerät sieht Ihre Dateiliste und die Dateien, die Sie synchronisieren."
body = """
      Nach der Genehmigung sendet jedes Gerät dem anderen Pfad, Größe und
      Änderungsdatum jeder Datei im gewählten Ordner, damit beide verglichen
      werden können. Das gilt auch für Dateien, die nicht kopiert werden.
      Haben zwei Dateien dieselbe Größe, aber verschiedene Datumsangaben,
      liest jedes Gerät seine eigene Kopie und sendet einen Fingerabdruck
      ihres Inhalts, nicht den Inhalt selbst. Die Dateien selbst werden erst
      gesendet, wenn „Jetzt synchronisieren“ gedrückt wird, und nur die im
      Plan, die nach den Einstellungen beider Geräte erlaubt sind. Ein Gerät
      mit „Nur senden“ nimmt keine Dateien an; ein Gerät mit
      „Nur empfangen“ sendet keine. Was das andere Gerät empfängt, behält es."""
[[privacy]]
title = "Dateien werden verschlüsselt direkt zwischen den Geräten übertragen."
body = """
      Dateilisten, Fingerabdrücke und Dateien laufen über eine verschlüsselte
      WebRTC-Verbindung direkt zwischen den beiden Browsern. Nur
      Host-Verbindungsadressen werden akzeptiert, kein öffentlicher
      STUN-Server ist eingerichtet, und es gibt kein Relais, sodass unterwegs
      nichts über einen Server läuft. Beide Geräte brauchen ein Netzwerk, in
      dem sie einander erreichen, also dasselbe WLAN, dasselbe Ethernet-Netz
      oder denselben Handy-Hotspot. Isolierung im Gastnetz, Firewalls,
      VPN-Routen und Berechtigungen des Browsers für das lokale Netzwerk
      können eine Verbindung verhindern. Host-Adressen können auch öffentliche
      Schnittstellen umfassen oder einer VPN-Route folgen. Das beweist also
      nicht, dass der Verkehr in einem Gebäude bleibt."""
[[privacy]]
title = "Die Kopplung zeigt dem Vermittlungsdienst Metadaten zum Verbindungsaufbau."
body = """
      Starten oder Beitreten öffnet einen WebSocket zu
      <code>rendezvous.abox.tools</code>. Der Dienst sieht den zufälligen
      Raumcode, IP-Adressen, Verbindungszeiten, WebRTC-Beschreibungen und
      ICE-Kandidaten; diese Einrichtungsnachrichten sind vor ihm nicht
      verborgen. Dateinamen, Dateilisten, Fingerabdrücke, Dateien, Notizen
      und Genehmigungsentscheidungen laufen über die verschlüsselte
      Peer-Verbindung. Der Dienst schreibt keine Rauminhalte in einen
      Speicher. Cloudflare, das den Dienst betreibt, bewahrt sieben Tage lang
      Verbindungsprotokolle mit Anfragemetadaten wie Code, Adresse und
      Uhrzeit auf. Für die Verbindungssuche und den Verbindungsaufbau ist
      Internetzugang nötig."""
[[privacy]]
title = "Die Verbindungssuche ist optional und listet nur den Einladungscode."
body = """
      „In den verfügbaren Verbindungen anzeigen“ ist standardmäßig aus.
      Aktivieren Sie es vor dem Start, um den zufälligen Einladungscode zu
      veröffentlichen; er ändert sich nicht, bis Sie die Synchronisierung
      beenden. Ein anderes Gerät wählt „Verbindungen suchen“, um ihn zu sehen. Weder Ordnername
      noch Dateiname noch Dateianzahl werden gelistet. Der Dienst gruppiert
      die Seiten dieses Werkzeugs nach öffentlicher IPv4-Adresse oder
      IPv6-/64-Subnetz und Website-Origin. Gemeinsam genutzte Gateways von
      Netzbetreibern oder VPNs können deshalb Fremde einschließen, und
      unterschiedliche Routen können Geräte in der Nähe verbergen. Eine
      private Gruppe nutzt stattdessen auf jedem Gerät denselben zufälligen
      Gruppencode. Der Dienst erhält den Code, um dieses Verzeichnis zu
      authentifizieren, und dieses Werkzeug speichert ihn nicht und schreibt
      ihn nicht in Synchronisierungslinks. Jeder mit dem Gruppencode kann
      gelistete Sitzungen sehen, und die Genehmigung gilt weiterhin."""
[[privacy]]
title = "Geschrieben wird ganz oder gar nicht, und gelöscht wird nichts."
body = """
      Eine empfangene Datei wird in eine temporäre Kopie daneben geschrieben
      und ersetzt die alte Datei erst, wenn jedes Byte angekommen ist. Eine
      abgebrochene oder gestörte Synchronisierung hinterlässt deshalb keine
      halb geschriebene Datei. Eine Datei, die es vor einem unterbrochenen
      Schreibvorgang noch nicht gab, wird wieder entfernt. In keinem der
      beiden Ordner wird je etwas gelöscht. Beim Schreiben erhält eine Datei
      das heutige Datum, weil eine Webseite das Änderungsdatum einer Datei
      nicht setzen kann. In Browsern, die nicht in einen Ordner schreiben
      können, werden empfangene Dateien im Arbeitsspeicher dieser Seite
      gesammelt und als ein ZIP gespeichert, wenn Sie das Speichern wählen."""
[[privacy]]
title = "Einladungen sind für Seitenskripte sichtbar."
body = """
      Jede Sitzung verwendet einen neuen zufälligen Link. Wer ihn hat, kann
      einen Verbindungsversuch starten; was danach geschieht, entscheidet
      weiterhin die Genehmigung. Diese Seite enthält die üblichen Werbe- und
      Messskripte von Google. Das Werkzeug übergibt ihnen nicht absichtlich
      Dateinamen, Dateilisten oder Dateien, aber Skripte, die in der Seite
      laufen, können ihre Adresse und ihren Zustand lesen, einschließlich
      eines Link-Codes. Betrachten Sie die Anfrage des erwarteten Geräts und
      Ihre Genehmigung als den Schritt, der Zugang gewährt."""

[[howto]]
title = "Öffnen Sie dieses Werkzeug auf beiden Geräten."
body = """
      Für einen Ordner, der senden und empfangen soll, eignen sich Chrome,
      Edge und die meisten anderen Chromium-Browser auf einem Computer.
      Firefox und Safari können einen Ordner senden und in ein ZIP empfangen.
      Verbinden Sie beide Geräte mit demselben WLAN, Ethernet-Netz oder
      Handy-Hotspot, und halten Sie den Internetzugang für die Vermittlung
      verfügbar."""
[[howto]]
title = "Wählen Sie auf jedem Gerät den Ordner."
body = """
      Wählen Sie einen Ordner und erlauben Sie dem Browser, ihn zu ändern,
      wenn dieses Gerät Dateien empfangen soll. Legen Sie fest, was jedes
      Gerät tut: „Senden und empfangen“, „Nur senden“ oder „Nur empfangen“.
      Systemdateien, temporäre Kopien und Namen, die eines der Systeme
      Windows, macOS oder Linux nicht speichern kann, werden ausgelassen und
      aufgeführt."""
[[howto]]
title = "Starten Sie auf einem Gerät, und treten Sie vom anderen aus bei."
body = """
      Wählen Sie „Synchronisierung starten“ und öffnen Sie dann den
      Synchronisierungslink auf dem anderen Gerät. Haben Sie die
      Synchronisierung in den verfügbaren Verbindungen angezeigt, kann das
      andere Gerät stattdessen „Verbindungen suchen“ und dann „Beitreten“
      wählen. Genehmigen Sie die Anfrage, die Sie wiedererkennen; vorher wird
      über keinen der beiden Ordner etwas gesendet."""
[[howto]]
title = "Prüfen Sie den Vergleich."
body = """
      Beide Geräte listen jeden Unterschied auf: Dateien, die nur auf einer
      Seite liegen, Dateien, die auf einer Seite neuer sind, und Dateien, die
      sich unterscheiden, aber dasselbe Datum tragen. Jede Zeile zeigt die
      Voreinstellung, die Sie ändern können, also senden, hierher kopieren
      oder unverändert lassen. Gelöscht wird nichts. Eine Datei, die Sie
      absichtlich entfernt haben, sollten Sie deshalb unverändert lassen oder
      auf beiden Geräten entfernen."""
[[howto]]
title = "Synchronisieren Sie, und vergleichen Sie später erneut."
body = """
      Wählen Sie auf einem der beiden Geräte „Jetzt synchronisieren“. Beide
      zeigen den Fortschritt, und eine Datei ersetzt ihre ältere Kopie erst,
      wenn sie vollständig angekommen ist. Danach werden beide Ordner erneut
      gelesen und verglichen. Lassen Sie beide Seiten geöffnet, um später
      erneut zu synchronisieren, oder beenden Sie die Sitzung und starten Sie
      bei Bedarf eine neue."""

[[faq]]
q = "Werden meine Dateien irgendwohin hochgeladen?"
a = "Nein. Dateien, Dateinamen und Ordnerlisten laufen über eine verschlüsselte Verbindung direkt zwischen Ihren beiden Browsern, und es gibt kein Relais. Der Vermittlungsdienst, der die Browser verbindet, sieht Metadaten zum Verbindungsaufbau wie den Raumcode und IP-Adressen, aber nie, was in einem der beiden Ordner liegt."
[[faq]]
q = "Löscht es Dateien, die ich auf dem anderen Gerät gelöscht habe?"
a = "Nein, nie. Ohne Aufzeichnung der letzten Synchronisierung sieht eine Datei, die auf einem Gerät fehlt, genauso aus wie eine neue Datei auf dem anderen, und falsch zu raten würde jemandes Arbeit zerstören. Eine Datei, die auf einer Seite fehlt, wird dieser Seite angeboten. Stellen Sie ihre Zeile auf „Unverändert lassen“, oder löschen Sie die Datei auf beiden Geräten."
[[faq]]
q = "Welche Kopie gewinnt, wenn sich eine Datei auf beiden Geräten geändert hat?"
a = "Standardmäßig ersetzt die Kopie mit dem späteren Änderungsdatum die ältere, und die Zeile zeigt, in welche Richtung es geht. Sie können jede Zeile vor dem Synchronisieren ändern. Zwei verschiedene Kopien mit exakt demselben Datum bleiben unverändert, bis Sie entscheiden. Dateien mit gleicher Größe und verschiedenem Datum werden zuerst nach ihrem Inhalt verglichen, sodass identische Kopien nie erneut gesendet werden."
[[faq]]
q = "Welche Browser können es nutzen?"
a = "Chrome, Edge und die meisten anderen Chromium-Browser auf einem Computer können einen Ordner lesen und in ihn schreiben. Firefox und Safari können einen Ordner zum Senden wählen und empfangen Dateien als ZIP mit bis zu 512 MB, das Sie selbst entpacken. Ein Browser, der überhaupt keine Ordner wählen kann, wie auf den meisten Handys, kann nur als ZIP empfangen."
[[faq]]
q = "Müssen die beiden Geräte im selben Netzwerk sein?"
a = "Ja. Die Dateien gehen direkt zwischen den Geräten, daher brauchen sie ein Netzwerk, in dem sie einander erreichen, also dasselbe WLAN, dasselbe Ethernet-Netz oder denselben Handy-Hotspot. Beide brauchen außerdem Internetzugang für die Vermittlung. Gastnetze, Client-Isolierung, Firewalls und VPNs können die Verbindung blockieren. Für Geräte in verschiedenen Netzwerken gibt es kein Relais."
[[faq]]
q = "Kann jemand anderes meiner Synchronisierung beitreten?"
a = "Nur mit Ihrer Genehmigung. Mit einem Synchronisierungslink oder einem gelisteten Einladungscode kann ein Gerät um Beitritt bitten, und Sie genehmigen jede Anfrage oder lehnen sie ab, bevor irgendetwas über Ihren Ordner gesendet wird. Jeweils ein Gerät kann mit Ihrem synchronisieren. Eine Notiz in der Anfrage ist selbst gewählter Text. Vergewissern Sie sich daher, dass Sie Gerät und Zeitpunkt wiedererkennen, bevor Sie genehmigen."
[[faq]]
q = "Kann ich verhindern, dass das andere Gerät meinen Ordner ändert?"
a = "Ja. Stellen Sie dieses Gerät vor dem Start auf „Nur senden“. Das andere Gerät kann dann Dateien aus Ihrem Ordner kopieren, aber nicht hineinschreiben, und diese Seite lehnt jeden Plan ab, der das täte. „Nur empfangen“ funktioniert umgekehrt. Dateien kommen herein und keine Ihrer Dateien wird gesendet, Ihre Dateiliste wird aber trotzdem verglichen."
[[faq]]
q = "Was passiert, wenn die Verbindung mitten in der Synchronisierung abbricht?"
a = "Vollständig angekommene Dateien bleiben erhalten. Eine Datei, die noch unterwegs war, wird verworfen, und ihre ältere Kopie, falls es eine gab, bleibt genau so, wie sie war, denn eine empfangene Datei ersetzt die alte erst, wenn jedes Byte angekommen ist. Verbinden Sie sich erneut und vergleichen Sie. Der nächste Plan holt nach, was noch fehlt."
[[faq]]
q = "Warum zeigen synchronisierte Dateien das heutige Datum?"
a = "Eine Webseite kann den Inhalt einer Datei schreiben, aber nicht das Datum ihrer letzten Änderung setzen. Eine empfangene Datei trägt deshalb das Datum, an dem sie geschrieben wurde. Der nächste Vergleich prüft den Inhalt von Dateien, deren Größe übereinstimmt, deren Datum aber nicht, und behandelt identische Kopien als bereits synchron."
[[faq]]
q = "Gibt es eine Grenze für die Ordnergröße?"
a = "Jeder Ordner kann bis zu 50.000 Dateien enthalten. Beim Schreiben in einen Ordner wird jede Datei fortlaufend auf den Datenträger geschrieben, große Dateien sind also kein Problem. Der Empfang in ein ZIP hält die Dateien im Arbeitsspeicher und endet bei 512 MB. Sehr tief verschachtelte oder sehr lange Pfade und Namen, die eines der Systeme Windows, macOS oder Linux nicht speichern kann, werden ausgelassen und aufgeführt."
[[faq]]
q = "Was erfährt der Vermittlungsdienst?"
a = "Der Vermittlungsdienst sieht den Einladungscode, IP-Adressen, Verbindungszeiten, WebRTC-Beschreibungen und Kandidaten. Schaltet der Host die Verbindungssuche ein, sehen Geräte in seinem gewählten Netzwerk oder seiner privaten Gruppe den zufälligen Einladungscode. Codes privater Gruppen werden an den Dienst gesendet, um ihr Verzeichnis zu authentifizieren; Synchronisierungslinks enthalten sie nicht. Cloudflare bewahrt die Metadaten der Vermittlungsanfragen sieben Tage lang auf. Dateinamen, Dateilisten, Fingerabdrücke, Dateien, Notizen und Genehmigungen laufen über die verschlüsselte Peer-Verbindung."

