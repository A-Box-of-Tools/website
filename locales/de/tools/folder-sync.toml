#
# Ordner synchronisieren - German.
#
# Overrides for tools/folder-sync/tool.toml. Only words: the slug lives in
# [slugs] in locale.toml, and the category, the icon and the CSP stay where
# they are.
#
# "Synchronisieren" for the job and "Vergleichen" for the comparison, which is
# how German sync software labels the two buttons. "Abgleichen" would have put
# "Jetzt abgleichen" beside "Erneut vergleichen". "Genehmigen" and "Ablehnen"
# are what the frame's approval dialog already says about the same request,
# so the list under it says them too.
#

name = "Ordner synchronisieren"
heading = "Ordner synchronisieren <span class=\"h1-kw\">&mdash; einen Ordner auf zwei Geräten auf demselben Stand halten</span>"
tagline = "Wählen Sie auf jedem Gerät einen Ordner, sehen Sie jeden Unterschied und kopieren Sie, was fehlt oder neuer ist, direkt zwischen den beiden Browsern in Ihrem Netzwerk. Nichts wird hochgeladen, und nichts wird je gelöscht."

title = "Ordner zwischen zwei Geräten synchronisieren &mdash; von Browser zu Browser, ohne Upload"
description = "Halten Sie einen Ordner auf zwei Computern auf demselben Stand. Vergleichen Sie beide Ordner, prüfen Sie jede Änderung und kopieren Sie Dateien direkt zwischen den Browsern in Ihrem Netzwerk. Kein Upload, kein Konto, nichts wird gelöscht."
og_title = "Einen Ordner auf zwei Geräten auf demselben Stand halten"
og_description = "Vergleichen Sie zwei Ordner und kopieren Sie, was fehlt oder neuer ist, direkt zwischen den Browsern in Ihrem Netzwerk. Kein Upload, kein Konto, nichts wird gelöscht."
og_image_alt = "Ordner synchronisieren - einen Ordner auf zwei Geräten auf demselben Stand halten"

pledge = """
    Sie wählen auf jedem Gerät einen Ordner und genehmigen das Gerät, das
    beitritt. Danach vergleichen die beiden Browser Dateinamen, Größen und
    Datumsangaben über eine verschlüsselte Verbindung direkt zwischen ihnen
    und kopieren die Dateien, denen Sie zustimmen, ohne einen Server
    dazwischen. Es gibt kein Relais, deshalb brauchen beide Geräte ein
    gemeinsames Netzwerk, in dem sie einander erreichen. Für die Kopplung wird
    ein Vermittlungsdienst im Internet genutzt, der Metadaten zum
    Verbindungsaufbau sieht, aber nie eine Datei, einen Dateinamen oder den
    Vergleich. Eine empfangene Datei ersetzt die alte erst, wenn sie
    vollständig angekommen ist, und gelöscht wird nie etwas. Mit „Beenden“
    oder durch Schließen einer der beiden Seiten endet die Sitzung."""
pledge_line = "Dateien werden verschlüsselt <strong>direkt zwischen Ihren beiden Geräten</strong> übertragen. Nichts wird hochgeladen; ein Vermittlungsdienst verbindet die Browser."
md_note = "Ordnervergleich und Kopieren von Dateien direkt zwischen zwei genehmigten Browsern, verschlüsselt und ohne Relais. Die Vermittlung über das Internet überträgt Metadaten zum Verbindungsaufbau, nie Dateien, Dateinamen oder Dateilisten. Gelöscht wird nie etwas."
live_hint = """
      Die Entwicklertools zeigen einen WebSocket zum Vermittlungsdienst für
      den Verbindungsaufbau. Wenn Sie den Eintrag in den verfügbaren
      Verbindungen einschalten oder „Verbindungen suchen“ wählen, öffnet sich
      ein separater WebSocket für die Verbindungssuche. Dateilisten und
      Dateien laufen über verschlüsseltes WebRTC direkt zwischen den Geräten.
      Der Netzwerkbereich und die CSP allein prüfen diesen Peer-Verkehr nicht.
      Der Rahmen der Website lädt wie gewohnt Ressourcen von Drittanbietern."""
read_first = """
, <code>src/plan.js</code> dafür, wie aus zwei Dateilisten die Liste der
      Unterschiede wird und warum nichts gelöscht wird, <code>src/transfer.js</code>
      für die Übertragung mit Empfangsbestätigungen, die eine große Datei aus dem
      Arbeitsspeicher heraushält, <code>src/folder.js</code> für die
      Schreibvorgänge, die eine Datei erst ersetzen, wenn sie vollständig ist,
      und <code>src/session.js</code> für die Genehmigung, bevor einer der
      beiden Ordner verglichen wird. Der Vermittlungsdienst ist neben dem
      Werkzeug unter <code>workers/rendezvous/</code> veröffentlicht."""
howto_heading = "So synchronisieren Sie einen Ordner zwischen zwei Geräten"
card = "Vergleichen Sie einen Ordner auf zwei Geräten und kopieren Sie, was fehlt oder neuer ist, direkt zwischen den Browsern in Ihrem Netzwerk. Nichts wird hochgeladen, nichts gelöscht."

