#
# Die geplante Liste auf der Roadmap - German.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a German list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#

note = "Noch nicht gebaut. Hier aufgeführt, damit Sie sehen, wohin das geht."

[[group]]
id = "images"
name = "Bilder"
items = [
  ["Text hinzufügen", "über dem Bild oder in einem Textkasten darüber"],
  ["AVIF", "das Format, das nur ein Browser schreibt und alle anderen bloß lesen"],
  ["DICOM anonymisieren", "die Patientendaten aus einem Scan nehmen, ohne den Scan anzufassen"],
]

[[group]]
id = "gif"
name = "GIF &amp; Animation"
items = [
  ["GIF zu MP4 oder WebM", "dieselbe Animation, meist ein Zehntel der Größe"],
  ["Ein GIF bearbeiten", "skalieren, zuschneiden, drehen, rückwärts laufen lassen oder das Tempo ändern"],
  ["Animiertes WebP", "dieselbe Animation bei einem Bruchteil der Größe &mdash; und das einzige hier, das einen mitgelieferten Encoder braucht"],
]

[[group]]
id = "video"
name = "Video"
items = [
  ["Skalieren", "herunter auf eine Größe, die sich wirklich verschicken lässt"],
  ["Drehen", "für den Clip, der quer gefilmt wurde &mdash; und kein einziges Einzelbild wird dafür dekodiert"],
  ["Video stummschalten", "den Ton weglassen und das Bild unangetastet lassen"],
  ["In MP4 umwandeln", "was auch immer aus der Kamera kam, als Datei, die sich wirklich hochladen lässt"],
  ["Untertitel einbrennen", "eine SRT-Datei fest ins Bild gezeichnet"],
  ["Untertitel umwandeln", "SRT, VTT, ASS, SBV und LRC in jede Richtung, samt verschiebbaren Zeiten"],
]

[[group]]
id = "audio"
name = "Audio"
items = [
  ["Format umwandeln", "MP3, WAV und Opus, in jede Richtung"],
]

[[group]]
id = "documents"
name = "Dokumente &amp; PDF"
items = [
  ["Seiten drehen &amp; zuschneiden", "einen quer eingelesenen Scan geraderücken oder seine Ränder beschneiden"],
  ["Bilder extrahieren", "die Bilder wieder aus einem Dokument herausholen"],
  ["PDF schwärzen", "die Wörter herausnehmen, statt einen schwarzen Kasten darüber zu malen"],
  ["Dokumentenscanner", "das Foto einer Seite, geradegerückt und sauber als Dokument"],
]

[[group]]
id = "beyond"
name = "Jenseits von Medien"
items = [
  ["CSV &amp; JSON", "in beide Richtungen umwandeln und aufräumen, was die Tabelle exportiert hat"],
  ["Zertifikate &amp; Schlüssel", "ein Zertifikat oder eine Zertifikatsanfrage lesen, ohne sie in einen fremden Server zu kopieren"],
]
