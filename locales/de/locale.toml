open_tool = "{{ tool.name | e }} öffnen"

[ui.picker]
# Das Substantiv aus [picker.urls] des Werkzeugs steht hier im Singular, und die
# Sätze sind um ein sächliches Substantiv herum gebaut - siehe den Kommentar in
# tools/images-to-video.toml, dem einzigen Werkzeug, das diese Tafel hat.
warning = """
      <strong>Das ist die einzige Funktion hier, die ins Netz geht.</strong>
      Rufen Sie eine Adresse ab, erfährt der Server dort Ihre IP-Adresse und welches {{ tool.picker.urls.noun }} Sie
      angefordert haben. Beim Eintreffen landet das {{ tool.picker.urls.noun }} im lokalen Speicher und wird nie
      erneut angefordert. Von Ihnen geht dabei nichts hinaus, denn hochladen kann
      diese Seite nach wie vor nichts."""
label = "Eine Adresse pro Zeile"
note = """
      Der Server muss erlauben, dass eine fremde Website sein {{ tool.picker.urls.noun }} lädt. Viele
