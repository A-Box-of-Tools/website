#
# Deutsch.
#
# The first locale, and therefore the one that had to prove the arrangement
# works. What is here is the frame: the hub, the guides index, the roadmap, the
# 404, the footer, and the words the templates themselves use. The tools and the
# guides are translated in tools/ and pages/ beside this file.
#
# Nothing structural is repeated here. There is no list of which tools exist, no
# category ids, no ordering, no Content-Security-Policy - all of that is decided
# once, in English, in config/site.toml, and a locale that tried to restate any
# of it would be told so by the build. See buildlib/i18n.py.
#
# The prose below is written in proper German orthography - umlauts and eszett
# as themselves, not as oe/ue/ae/ss. Pages are served as UTF-8 and say so, and
# the only thing on this site held to pure ASCII is the JSON-LD, which
# buildlib/site.py escapes on the way out. Transliteration is for URLs, and is
# confined to [slugs] below.
#
# German, not English in German words. The house style, decided here and
# followed by every file in this folder:
#
#   * Siezen throughout, warm rather than official.
#   * "Werkzeug" in body copy; "Tools" only where a string is a search result -
#     a title or a meta description - because that is the word that gets typed.
#   * "Gerät" for the reader's machine, never "Maschine".
#   * The em dash is an English habit. German carries that weight in a
#     subordinate clause or in a second sentence, so most of them are gone.
#   * No colon used for a revelation, and no " - " standing in for a dash.
#

lang = "de"
name = "German"
endonym = "Deutsch"

# The frame is finished: the nav, the footer, the hub and every [ui] word in
# this file are German. That is all this flag claims, and it is a set that does
# not grow when a tool ships - which is why it can stay true while tools and
# guides are still arriving untranslated.
#
# Those are held back one page at a time instead. A page that still falls back
# is built and readable at its own address, and is kept out of the sitemap,
# every hreflang set and the switcher until it is translated. See the note at
# the top of buildlib/i18n.py for why the unit is the page rather than the
# language.
complete = true

#
# ---------------------------------------------------------------------------
# The addresses.
#
# Keyed by the ENGLISH slug on the left, which is the name of the thing, and
# never by the German one. The German is an address and appears only on the
# right.
#
# These are the words a German speaker actually types into a search box, not
# translations of the English slugs - "bild-komprimieren", not
# "komprimieren-bild". That is the entire reason this site is not simply served
# at /de/compress-image/: the slug is the one part of a page's markup that is
# also a keyword, and leaving it in English throws that away in every market
# except the one the site was written for.
#
# No umlauts and no eszett HERE, unlike everywhere else in this file. Both
# survive a modern URL bar and neither survives being pasted into a forum, a
# chat client, or an older analytics pipeline intact, so addresses use the
# transliteration German URLs conventionally use: oe, ue, ae, ss.
# ---------------------------------------------------------------------------
#

[slugs]
# The tools.
"compress-image" = "bild-komprimieren"
"compress-pdf" = "pdf-verkleinern"
"crop-video" = "video-zuschneiden"
"edit-audio" = "audio-bearbeiten"
# Named for the job rather than for the format. Almost nobody searches for an
# "EXIF editor" in German; they search for how to get the data out of a photo.
"exif-editor" = "exif-daten-entfernen"
"images-to-pdf" = "bilder-in-pdf-umwandeln"
"images-to-video" = "bilder-in-video-umwandeln"
"resize-image" = "bildgroesse-aendern"
"trim-video" = "video-schneiden"
# Named for the job again: almost nobody searches for "Bild zu ICO",
# and a great many people search for how to make a favicon.
"image-to-ico" = "favicon-erstellen"
"svg-to-image" = "svg-in-png-umwandeln"
# Named for the job once more. "base64" rather than "data-uri" is what
# gets typed, even by the people who know it is a data URI.
"heic-to-jpg" = "heic-in-jpg-umwandeln"
"image-to-data-uri" = "bild-als-base64"
"qr-barcode" = "qr-code-erstellen"
"video-to-gif" = "video-in-gif-umwandeln"

# The indexes and the legal pages. "Ratgeber" rather than a literal
# "Anleitungen": it is the word German publishers use for exactly this kind of
# writing, the explanatory piece that sits beside a product.
"guides" = "ratgeber"
"roadmap" = "roadmap"
"privacy" = "datenschutz"
"terms" = "nutzungsbedingungen"

# The guides. Each one is the question its readers ask, in the words they ask it
# in, rather than a translation of the English title.
"guides/compress-an-image-to-a-target-size" = "ratgeber/bild-auf-groesse-komprimieren"
"guides/resize-an-image" = "ratgeber/bild-skalieren"
"guides/remove-exif-and-gps-data" = "ratgeber/exif-und-gps-daten-entfernen"
"guides/make-a-pdf-smaller" = "ratgeber/pdf-kleiner-machen"
"guides/combine-images-into-a-pdf" = "ratgeber/bilder-zu-pdf-zusammenfuegen"
"guides/turn-images-into-a-video" = "ratgeber/aus-bildern-ein-video-machen"
"guides/trim-a-video" = "ratgeber/video-kuerzen"
"guides/crop-a-video" = "ratgeber/video-bildausschnitt-aendern"
"guides/is-it-safe-to-upload-files" = "ratgeber/ist-das-hochladen-von-dateien-sicher"
"guides/make-a-favicon" = "ratgeber/favicon-selbst-erstellen"
"guides/convert-an-svg-to-png" = "ratgeber/svg-in-png-umwandeln"
"guides/convert-heic-to-jpg" = "ratgeber/heic-in-jpg-umwandeln"
"guides/embed-an-image-in-css" = "ratgeber/bild-in-css-einbetten"
"guides/make-a-qr-code" = "ratgeber/qr-code-selbst-erstellen"
"guides/turn-a-video-into-a-gif" = "ratgeber/aus-einem-video-ein-gif-machen"

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Kostenlose Browser-Tools &mdash; ohne Upload, ohne Anmeldung | abox.tools"
# Unter 155 Zeichen, wie im Englischen. Google schneidet eine Beschreibung dort
# ab, und der Schluss ist hier der Teil, der die Seite verkauft.
description = "Kostenlose Browser-Tools, die Ihre Dateien nie hochladen. Bilder zu PDF oder MP4 zusammenfügen, exakt komprimieren, Videos zuschneiden, EXIF entfernen."
heading = "Werkzeuge, die ohne Server auskommen"
og_title = "A Box of Tools &mdash; Werkzeuge, die ohne Server auskommen"
og_description = "Kleine Werkzeuge für je eine Aufgabe, die vollständig in Ihrem Browser laufen. Ihre Dateien verlassen Ihr Gerät nicht."
og_image_alt = "abox.tools - Werkzeuge, die ohne Server auskommen"
schema_description = "Kleine Werkzeuge für je eine Aufgabe, die ihre gesamte Arbeit im Browser erledigen. Nichts wird hochgeladen, und ein Konto brauchen Sie nicht."
schema_about = "Browser-Werkzeuge für Dateien, die lokal verarbeitet und nicht hochgeladen werden"

lede = """
    Kleine Werkzeuge für je eine Aufgabe, die ihre gesamte Arbeit in Ihrem
    Browser erledigen. Ihre Dateien bleiben dabei auf Ihrem Gerät. Sie laden
    nichts hoch, Sie legen kein Konto an, und niemand verfolgt, was Sie tun."""

support_note = """
      Diese Werkzeuge sind kostenlos und bleiben es. Hat Ihnen eines Arbeit
      erspart, finden Sie hier die einzige Stelle auf der Seite, die Sie um
      etwas bittet."""

# Drei nachprüfbare Tatsachen, kein Versprechen - genau wie im Englischen.
[[hub.guarantees]]
title = "Ihre Dateien verlassen Ihr Gerät nie"
body = """
        Ihr eigener Browser öffnet, liest und verarbeitet sie, auf Ihrer eigenen
        Hardware. In der <code>Content-Security-Policy</code> jedes Werkzeugs
        steht jede Adresse, die es überhaupt kontaktieren darf, und keine davon
        gehört uns."""

[[hub.guarantees]]
title = "Über Ihre Dateien wird nichts verschickt"
body = """
        Nicht die Datei, nicht das Vorschaubild, nicht der Name, die Größe oder
        die Anzahl. Keines der Werkzeuge hier liest so etwas aus, und am anderen
        Ende sitzt auch kein Server, der es entgegennehmen könnte."""

[[hub.guarantees]]
title = "Es funktioniert offline"
body = """
        Öffnen Sie ein Werkzeug einmal, trennen Sie die Internetverbindung, und
        es arbeitet unverändert an Ihren Dateien weiter. Vortäuschen lässt sich
        das kaum, denn ein Werkzeug, das Ihre Dateien zum Verarbeiten
        wegschickt, bliebe an dieser Stelle einfach stehen."""

[[hub.categories]]
id = "images-and-video"
name = "Bilder &amp; Video"
note = "Mit Fotos und Aufnahmen arbeiten, ohne sie aus der Hand zu geben."

[[hub.categories]]
id = "gif-and-animation"
name = "GIF &amp; Animation"
note = "Eine Animation bauen oder zerlegen, ohne dass sie Ihr Gerät verlässt."

[[hub.categories]]
id = "audio"
name = "Audio"
note = "An einer Aufnahme arbeiten, ohne sie aus der Hand zu geben. Auch am Ton in einem Video."

[[hub.categories]]
id = "documents-and-pdf"
name = "Dokumente &amp; PDF"
note = "Dokumente erstellen und umsortieren, ohne sie zum Verarbeiten wegzuschicken."

[[hub.categories]]
id = "codes-and-data"
name = "Codes &amp; Daten"
note = "Getipptes in etwas verwandeln, das eine Maschine lesen kann, ohne dass es die Seite verlässt."

[[hub.categories]]
id = "text-and-code"
name = "Text &amp; Code"
note = "Lesbar machen, vergleichen, kodieren, ohne dafür ein Token oder eine Konfigurationsdatei auf einen fremden Server zu kopieren."

#
# ---------------------------------------------------------------------------
# The guides index.
# ---------------------------------------------------------------------------
#

[guides]
nav = "Alle Ratgeber"
title = "Ratgeber &mdash; wie es geht und was jede Einstellung kostet"
description = "Verständliche Ratgeber zum Komprimieren, Skalieren, Zuschneiden und Umwandeln eigener Dateien. Was die Einstellungen bedeuten, was sie kosten, warum kein Upload nötig ist."
heading = "Ratgeber"
lede = """
    Zu jedem Werkzeug ein Ratgeber. Geschrieben für alle, denen jemand eine
    Größe oder ein Format vorgegeben hat und die vorher wissen möchten, was der
    Regler eigentlich tut, den sie gleich bewegen. Alles, was hier beschrieben
    wird, passiert auf Ihrem eigenen Gerät."""
og_title = "Die Ratgeber von abox.tools"
og_description = "Komprimieren, skalieren, zuschneiden, kürzen, umwandeln. Und was jede Einstellung kostet. Ganz ohne Upload."
og_image_alt = "abox.tools - Werkzeuge, die ohne Server auskommen"

[[guides.groups]]
id = "doing-the-job"
name = "Die Arbeit erledigen"
note = "Einer je Werkzeug: worum es geht, welche Einstellung zählt und was sie kostet."

[[guides.groups]]
id = "before-you-upload"
name = "Bevor Sie etwas hochladen"
note = "Was wirklich passiert, wenn Sie eine Datei an eine Website übergeben, und woran Sie erkennen, ob das nötig war."

#
# ---------------------------------------------------------------------------
# The roadmap.
#
# Only the frame. The list itself is config/planned.toml, translated beside this
# file in planned.toml.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roadmap"
title = "Roadmap &mdash; was abox.tools als Nächstes baut"
description = "Alle geplanten Werkzeuge für abox.tools, offen und nach Gruppen sortiert, dazu die bereits fertigen. Alle laufen im Browser und laden nichts hoch."
heading = "Was als Nächstes kommt"
lede = """
    Alles auf beiden Listen erledigt seine Arbeit in Ihrem Browser und lädt
    nichts hoch. Diese Regel muss ein Name bestehen, bevor er überhaupt hier
    landet. Die Zahlen stehen nirgends geschrieben; der Build zählt sie an den
    beiden Listen ab."""

intro_heading = "Wie diese Liste entstanden ist"
intro = """
    <p>
      Sie ist keine Wunschliste. Grundlage war die Werkzeugliste der größten
      Online-Seite für GIFs und Videos, denn etwas Näheres an einem Katalog
      dessen, was Menschen tatsächlich mit einer Datei gemacht haben wollen,
      gibt es nicht. Übrig geblieben ist daraus jeder Eintrag, der sich so bauen
      lässt, dass die Arbeit auf Ihrem eigenen Gerät stattfindet und auch ohne
      Netzverbindung weiterläuft.
    </p>
    <p>
      Das meiste davon läuft mit Schnittstellen, die der Browser ohnehin
      mitbringt. Ein paar brauchen einen Codec, der fest in genau das Werkzeug
      eingebaut wird, das ihn benutzt. Auch das ist erlaubt, denn die Datei
      verlässt das Gerät deshalb trotzdem nicht. Was diese Hürde nicht nimmt,
      wurde weggelassen statt versprochen. Manche der Lücken, die unten
      auffallen, sind also Absicht.
    </p>
    <p>
      Die bereits vorhandenen Werkzeuge stehen oben in ihrer Gruppe, als
      <em>Fertig</em> markiert und mit ihrer eigenen Seite verlinkt. Alles
      darunter steht noch aus, und ein Link wird daraus erst, wenn es fertig
      ist.
    </p>"""

planned_heading = "Jede Art von Datei und was sich damit machen lässt"

og_title = "Die Roadmap von abox.tools"
og_description = "Was fertig ist und was als Nächstes kommt. Alles läuft im Browser und lädt nichts hoch."
og_image_alt = "abox.tools - Werkzeuge, die ohne Server auskommen"

#
