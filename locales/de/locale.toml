# ---------------------------------------------------------------------------
#

[not_found]
title = "Seite nicht gefunden &mdash; abox.tools"
description = "Diese Adresse gibt es auf abox.tools nicht. Hier stehen die Werkzeuge, die es gibt. Alle kostenlos, und keines lädt Ihre Dateien irgendwohin."
heading = "Diese Seite gibt es hier nicht"
tools_heading = "Alle Werkzeuge auf einen Blick"
tools_note = "Alle kostenlos, alle im Browser, keines lädt irgendetwas hoch."

lede = """
    Entweder steckt in der Adresse ein Tippfehler, oder was dort einmal lag, ist
    umgezogen. Ihrer Datei ist nichts passiert, und verloren ist auch nichts.
    Diese Seite hatte noch nie etwas von Ihnen, das sie hätte verlieren
    können."""

