#
# ---------------------------------------------------------------------------
# The roadmap.
#
# Only the frame. The list itself is config/planned.toml, which has no locale
# file yet and is therefore still English on this page - one of the two reasons
# `complete` is false at the top of this file.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roadmap"
title = "Roadmap &mdash; was abox.tools als Nächstes baut"
description = "Jedes für abox.tools geplante Werkzeug, offen und gruppiert, dazu die bereits fertigen. Alle laufen im Browser und laden nichts hoch."
heading = "Was als Nächstes kommt"
lede = """
    Alles auf beiden Listen erledigt seine Arbeit in Ihrem Browser und lädt
    nichts hoch &mdash; das ist die Regel, die ein Name bestehen muss, bevor er
    überhaupt hier landet. Die Zahlen sind nirgends eingetragen; der Build
    zählt sie an den beiden Listen ab."""

intro_heading = "Wie diese Liste entstanden ist"
intro = """
    <p>
      Sie ist keine Wunschliste. Sie entstand, indem die Werkzeugliste der
      größten Online-GIF- und -Videoseite durchgegangen wurde &mdash; das
      Nächste, was es zu einem Katalog dessen gibt, was Menschen tatsächlich
      mit einer Datei gemacht haben wollen &mdash; und jeder Eintrag behalten
      wurde, der sich so bauen lässt, dass die Arbeit auf Ihrem eigenen Gerät
      stattfindet und auch ohne Netzverbindung weiterläuft.
    </p>
    <p>
      Das meiste davon läuft mit Schnittstellen, die der Browser ohnehin
      mitbringt. Einige wenige brauchen einen Codec, der in genau das Werkzeug
      eingebettet wird, das ihn benutzt &mdash; das ist erlaubt, die Datei
      verlässt das Gerät trotzdem nicht. Was diese Hürde nicht nimmt, wurde
      weggelassen statt versprochen; einige der offensichtlich wirkenden
      Lücken unten sind also Absicht.
    </p>
    <p>
      Die bereits vorhandenen Werkzeuge stehen oben in ihrer Gruppe, als
      <em>Fertig</em> markiert und mit ihrer eigenen Seite verlinkt. Alles
      darunter steht noch aus, und nichts wird zu einem Link, bevor es das ist.
    </p>"""

planned_heading = "Jede Art von Datei, und was sich damit machen lässt"

og_title = "abox.tools Roadmap"
og_description = "Was fertig ist und was als Nächstes kommt. Alles läuft im Browser und lädt nichts hoch."
og_image_alt = "abox.tools - Werkzeuge, die keinen Server anfassen"

