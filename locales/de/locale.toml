    Zu jedem Werkzeug ein Ratgeber. Geschrieben für alle, denen jemand eine
    Größe oder ein Format vorgegeben hat und die vorher wissen möchten, was der
    Regler eigentlich tut, den sie gleich bewegen. Alles, was hier beschrieben
