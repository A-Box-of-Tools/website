#
# ---------------------------------------------------------------------------
# The roadmap.
#
# Only the frame. The list itself is config/planned.toml, translated beside this
# file in planned.toml.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Roadmap"
title = "Roadmap &mdash; was abox.tools als Nächstes baut"
description = "Alle geplanten Werkzeuge für abox.tools, offen und nach Gruppen sortiert, dazu die bereits fertigen. Alle laufen im Browser und laden nichts hoch."
heading = "Was als Nächstes kommt"
lede = """
    Alles auf beiden Listen erledigt seine Arbeit in Ihrem Browser und lädt
    nichts hoch. Diese Regel muss ein Name bestehen, bevor er überhaupt hier
    landet. Die Zahlen stehen nirgends geschrieben; der Build zählt sie an den
    beiden Listen ab."""

intro_heading = "Wie diese Liste entstanden ist"
intro = """
    <p>
      Sie ist keine Wunschliste. Grundlage war die Werkzeugliste der größten
      Online-Seite für GIFs und Videos, denn etwas Näheres an einem Katalog
      dessen, was Menschen tatsächlich mit einer Datei gemacht haben wollen,
      gibt es nicht. Übrig geblieben ist daraus jeder Eintrag, der sich so bauen
      lässt, dass die Arbeit auf Ihrem eigenen Gerät stattfindet und auch ohne
      Netzverbindung weiterläuft.
    </p>
    <p>
      Das meiste davon läuft mit Schnittstellen, die der Browser ohnehin
      mitbringt. Ein paar brauchen einen Codec, der fest in genau das Werkzeug
      eingebaut wird, das ihn benutzt. Auch das ist erlaubt, denn die Datei
      verlässt das Gerät deshalb trotzdem nicht. Was diese Hürde nicht nimmt,
      wurde weggelassen statt versprochen. Manche der Lücken, die unten
      auffallen, sind also Absicht.
    </p>
    <p>
      Die bereits vorhandenen Werkzeuge stehen oben in ihrer Gruppe, als
      <em>Fertig</em> markiert und mit ihrer eigenen Seite verlinkt. Alles
      darunter steht noch aus, und ein Link wird daraus erst, wenn es fertig
      ist.
    </p>"""

planned_heading = "Jede Art von Datei und was sich damit machen lässt"

og_title = "Die Roadmap von abox.tools"
og_description = "Was fertig ist und was als Nächstes kommt. Alles läuft im Browser und lädt nichts hoch."
og_image_alt = "abox.tools - Werkzeuge, die ohne Server auskommen"

