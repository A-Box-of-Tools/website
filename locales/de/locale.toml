[ui.tool]
view_source = "Quellcode ansehen"
how_verified = "So lässt sich das nachprüfen"
live_check = "Live-Prüfung:"
offline = "Offline:"
checking = "wird geprüft&hellip;"
questions_heading = "Fragen"
guide_heading = "Die ausführliche Fassung"
