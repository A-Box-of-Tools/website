#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Kostenlose Browser-Tools &mdash; ohne Upload, ohne Anmeldung | abox.tools"
# Unter 155 Zeichen, wie im Englischen. Google schneidet eine Beschreibung dort
# ab, und der Schluss ist hier der Teil, der die Seite verkauft.
description = "Kostenlose Browser-Tools, die Ihre Dateien nie hochladen. Bilder zu PDF oder MP4 zusammenfügen, exakt komprimieren, Videos zuschneiden, EXIF entfernen."
heading = "Werkzeuge, die ohne Server auskommen"
og_title = "A Box of Tools &mdash; Werkzeuge, die ohne Server auskommen"
og_description = "Kleine Werkzeuge für je eine Aufgabe, die vollständig in Ihrem Browser laufen. Ihre Dateien verlassen Ihr Gerät nicht."
og_image_alt = "abox.tools - Werkzeuge, die ohne Server auskommen"
schema_description = "Kleine Werkzeuge für je eine Aufgabe, die ihre gesamte Arbeit im Browser erledigen. Nichts wird hochgeladen, und ein Konto brauchen Sie nicht."
schema_about = "Browser-Werkzeuge für Dateien, die lokal verarbeitet und nicht hochgeladen werden"

lede = """
    Kleine Werkzeuge für je eine Aufgabe, die ihre gesamte Arbeit in Ihrem
    Browser erledigen. Ihre Dateien bleiben dabei auf Ihrem Gerät. Sie laden
    nichts hoch, Sie legen kein Konto an, und niemand verfolgt, was Sie tun."""

support_note = """
      Diese Werkzeuge sind kostenlos und bleiben es. Hat Ihnen eines Arbeit
      erspart, finden Sie hier die einzige Stelle auf der Seite, die Sie um
      etwas bittet."""

# Drei nachprüfbare Tatsachen, kein Versprechen - genau wie im Englischen.
[[hub.guarantees]]
title = "Ihre Dateien verlassen Ihr Gerät nie"
body = """
        Ihr eigener Browser öffnet, liest und verarbeitet sie, auf Ihrer eigenen
        Hardware. In der <code>Content-Security-Policy</code> jedes Werkzeugs
        steht jede Adresse, die es überhaupt kontaktieren darf, und keine davon
        gehört uns."""

[[hub.guarantees]]
title = "Über Ihre Dateien wird nichts verschickt"
body = """
        Nicht die Datei, nicht das Vorschaubild, nicht der Name, die Größe oder
        die Anzahl. Keines der Werkzeuge hier liest so etwas aus, und am anderen
        Ende sitzt auch kein Server, der es entgegennehmen könnte."""

[[hub.guarantees]]
title = "Es funktioniert offline"
body = """
        Öffnen Sie ein Werkzeug einmal, trennen Sie die Internetverbindung, und
        es arbeitet unverändert an Ihren Dateien weiter. Vortäuschen lässt sich
        das kaum, denn ein Werkzeug, das Ihre Dateien zum Verarbeiten
        wegschickt, bliebe an dieser Stelle einfach stehen."""

[[hub.categories]]
id = "images"
name = "Bilder"
note = "Verkleinern, in der Größe ändern oder herausnehmen, was ein Foto still über Sie verrät. Nichts davon wird verschickt."

[[hub.categories]]
id = "video-and-animation"
name = "Video &amp; Animation"
note = "Schneiden, umwandeln oder aus Einzelbildern bauen, ohne dass die Aufnahme Ihr Gerät verlässt."

[[hub.categories]]
id = "documents-and-audio"
name = "Dokumente &amp; Audio"
note = "Ein Dokument umsortieren oder eine Aufnahme kürzen, ohne eines von beiden zum Verarbeiten wegzuschicken."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Text, Codes &amp; Passwörter"
note = "Lesen, prüfen oder hier erzeugen. Kein Token, keine Konfigurationsdatei und kein Passwort landet auf einem fremden Server."

