#
# 로드맵의 예정 목록 - Korean.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a Korean list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#
# Format names stay as they are written everywhere else: GIF, MP4, WebM, PNG,
# APNG, WebP, MP3, WAV, Opus, SRT, CSV, JSON. Translating a format name would
# make the one word a reader could have searched for unsearchable.
#

note = "아직 만들지 않았습니다. 어디로 가고 있는지 보시라고 목록만 올려 둡니다."

[[group]]
id = "images"
name = "이미지"
items = [
  ["글자 넣기", "사진 위에, 또는 위쪽 자막 칸에"],
  ["AVIF", "쓸 수 있는 브라우저는 하나뿐이고 나머지는 읽기만 하는 형식"],
  ["DICOM 익명화", "영상은 그대로 두고, 환자 정보만 지우기"],
]

[[group]]
id = "gif"
name = "GIF와 애니메이션"
items = [
  ["GIF를 MP4나 WebM으로", "같은 움직임을, 대개 10분의 1 용량으로"],
  ["GIF 편집", "크기, 자르기, 회전, 거꾸로, 속도까지"],
  ["애니메이션 WebP", "같은 움직임을 훨씬 적은 용량으로 &mdash; 그리고 여기서 유일하게 인코더를 함께 넣어야 하는 것"],
]

[[group]]
id = "video"
name = "동영상"
items = [
  ["크기 줄이기", "실제로 전송이 되는 크기까지"],
  ["회전", "옆으로 누워 찍힌 영상을 위해 &mdash; 프레임은 한 장도 디코딩하지 않고"],
  ["동영상 소리 지우기", "소리만 빼고, 화면은 그대로"],
  ["MP4로 변환", "카메라에서 나온 것이 무엇이든, 실제로 올라가는 파일로"],
  ["자막 입히기", "SRT 파일을 화면에 직접 그려 넣기"],
  ["자막 변환", "SRT, VTT, ASS, SBV, LRC를 어느 방향으로든, 시간도 밀거나 당겨서"],
]

[[group]]
id = "audio"
name = "오디오"
items = [
  ["형식 변환", "MP3, WAV, Opus를 어느 방향으로든"],
]

[[group]]
id = "documents"
name = "문서와 PDF"
items = [
  ["페이지 회전과 여백 자르기", "옆으로 들어온 스캔을 바로잡거나, 여백을 잘라내거나"],
  ["이미지 꺼내기", "문서 안의 사진을 다시 밖으로"],
  ["PDF 가리기", "검은 사각형을 덮는 대신, 글자를 실제로 들어내기"],
]

[[group]]
id = "beyond"
name = "미디어 너머"
items = [
  ["CSV와 JSON", "어느 쪽으로든 변환하고, 스프레드시트가 내보낸 파일을 정리하기"],
  ["인증서와 키", "인증서나 서명 요청을, 남의 서버에 붙여 넣지 않고 읽기"],
]
