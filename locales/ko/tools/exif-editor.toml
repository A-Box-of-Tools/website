[words]
plural = "사진"
choose = "사진"

[[facts]]
text = "업로드 없음"

[[facts]]
text = "가입 없음"

[[facts]]
text = "오프라인 동작"

[[facts]]
text = "오픈 소스"

[[facts]]
text = "사진은 다시 인코딩하지 않음"

[[privacy]]
title = "사진은 나갈 곳이 없습니다."
body = """
 이 페이지가 연결해도 되는 주소는
      Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트 것은 하나도
      없습니다. 파일이 모일 만한 수신 지점이 없고, 설령 있더라도 거기로 파일을
      보낼 코드가 없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 이 상자 안의 다른 도구들과 달리,
      이 도구에는 \"주소에서 불러오기\" 기능도 없고 선택으로 켜는 네트워크 단계조차
      없습니다. <code>src/</code> 어디에도 <code>fetch</code>도,
      <code>XMLHttpRequest</code>도, <code>sendBeacon</code>도 없습니다."""

[[privacy]]
title = "읽어 낸 메타데이터는 밖으로 새지 않습니다."
body = """
 GPS 좌표는 이 페이지에
      표시될 뿐 다른 어디로도 가지 않습니다. 이 저장소에는 태그나 파일 이름, 용량,
      개수를 실어 보내는 분석 이벤트가 하나도 없습니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서
      옵니다. 어느 쪽에도 내 사진에 관한 것은 넘어가지 않습니다. 파일을 읽고
      해석하고 다시 쓰는 코드는 한 줄도 빠짐없이 이 출처에서 제공되고 저장소에
      공개되어 있습니다."""

[[privacy]]
title = "후원 버튼이 불러오는 것과, 후원 버튼이 받지 못하는 것."
body = """

      헤더의 \"Buy me a coffee\" 버튼은 cdnjs.buymeacoffee.com의 스크립트가
      그리고, 글꼴은 Google Fonts에서 가져옵니다. 그저 링크일 뿐이에요. 방문을
      보고하지도, 나에 관한 것이나 내 파일에 관한 것을 받아 가지도 않습니다.
      누르지 않으면 아무 일도 일어나지 않고, 눌러서 가게 되는 곳은 남의
      사이트입니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 도구는 그대로입니다.
      애초에 네트워크를 쓰는 단계가 없었으니까요. 가장 간단한 증거입니다."""

[[howto]]
title = "사진을 고릅니다."
body = """
 선택 영역에 끌어다 놓거나 직접 골라
      주세요. 브라우저가 디스크에서 곧바로 읽습니다. 그동안 어디로도 아무것도
      나가지 않습니다."""

[[howto]]
title = "궁금하시면 무엇이 들었는지 읽어 봅니다."
body = """
 발견 목록이 알아 둘 만한
      것부터 짚어 줍니다. GPS 좌표, 촬영 시각, 일련번호 같은 것들이요. 모든 태그가
      담긴 전체 표는 그다음에 나옵니다."""

[[howto]]
title = "\"메타데이터 전부 지우기\"를 누릅니다."
body = """
 대부분은 여기서 일이
      끝납니다. 모든 태그와 XMP, IPTC 블록, 주석, 내장 미리보기가 목록에 올린 모든
      사진에서 한 번에 사라집니다."""

[[howto]]
title = "지우는 대신 고쳐도 됩니다."
body = """
 날짜를 바꾸고, 저작권 표기를
      손보고, 위치만 빼고 카메라 설정은 남기고. 그렇게 정리한 다음 그 사진만 따로
      저장하시면 됩니다."""

[[faq]]
q = "제 사진이 어딘가로 업로드되나요?"
a = """
        아닙니다. 파일을 읽고 해석하고 다시 쓰는 일은 내 기기에서 도는 내
        브라우저가 합니다. 이 도구에는 네트워크 기능이 하나도 없어서 무언가를
        가져오지도, 보내지도 않습니다. 이 페이지의
        <code>Content-Security-Policy</code>에 연결해도 되는 주소가 전부 적혀
        있는데, 그중 이 사이트 것은 하나도 없습니다."""

[[faq]]
q = "EXIF가 무엇이고, 사진에는 그 밖에 무엇이 숨어 있나요?"
a = """
        EXIF는 카메라가 사진 옆에 적어 두는 태그 묶음입니다. 제조사와 모델, 노출
        설정, 초 단위까지의 날짜와 시각, 흔히 GPS 좌표, 때로는 일련번호까지
        들어갑니다. 사진에는 그 밖에도 더 들어 있는 경우가 많습니다. 편집
        프로그램이 남긴 XML 형태의 XMP 패킷, 설명과 작성자 항목이 담긴 IPTC 블록,
        색 프로파일, 미리보기용으로 들어간 작은 사본, 그리고 문서로 공개되지 않은
        제조사 데이터인 메이커 노트가 그렇습니다. 이 도구는 그 전부를 나열합니다."""

[[faq]]
q = "메타데이터를 지우면 화질이 떨어지나요?"
a = """
        아닙니다. 사진을 다시 저장하는 대신 이런 도구를 쓰는 가장 큰 이유가 바로
        이것입니다. 메타데이터는 압축된 사진 안이 아니라 그것을 감싼 컨테이너에
        들어 있습니다. 지운다는 것은 목록에서 항목을 빼고 그 목록을 다시 쓰는
        일이고, 압축된 이미지 데이터는 바이트 그대로 복사됩니다. 그래서 결과는
        정확히 같은 픽셀로 디코딩됩니다. 디코딩되는 것도, 다시 압축되는 것도
        없습니다."""

[[faq]]
q = "어떤 파일 형식을 다루나요?"
a = """
        JPEG, PNG, WebP입니다. HEIC와 AVIF는 알아보기는 하지만 다시 쓰지는
        않습니다. 중첩된 아톰으로 이루어진 박스 형식이라 다른 파서가 필요하거든요.
        망가진 파일을 내놓는 대신 그렇다고 말합니다. 순수 TIFF도 다루지 않습니다.
        TIFF에서는 메타데이터와 픽셀을 같은 오프셋으로 가리키기 때문입니다."""

[[faq]]
q = "메타데이터를 지우면 사진이 돌아가 보일 수도 있나요?"
a = """
        그럴 수 있고, 그에 대비한 설정이 있습니다. 휴대폰은 대개 센서가 본 그대로
        사진을 기록하고 어떻게 돌려야 하는지를 Orientation 태그로 적어 둡니다. 그
        태그를 지우면 일부 뷰어가 사진을 옆으로 보여 줍니다. 기본으로 켜져 있는
        \"방향 태그는 남기기\" 항목은 그 태그 하나만 담은 아주 작은 EXIF 블록을 다시
        써 넣습니다. 그것도 사진이 실제로 필요로 할 때만요. EXIF를 티끌도 남기고
        싶지 않다면 꺼 두세요."""

[[faq]]
q = "GPS 위치도 지워지나요?"
a = """
        지워집니다. 전부 지우면 GPS 디렉터리 전체가 사라지고, 위치만 따로 지우고
        나머지를 남길 수도 있습니다. 좌표는 십진 도 단위로 먼저 보여 드립니다.
        \"51도 30분 26초\"라고 적혀 있으면 그 사진이 어느 건물에서 찍혔는지를 말하고
        있다는 사실이 잘 와닿지 않으니까요."""

[[faq]]
q = "태그를 지우는 대신 고칠 수도 있나요?"
a = """
        됩니다. 문자 태그, 날짜, ISO, 방향, 해상도는 모두 고칠 수 있고, 태그가
        하나도 없는 사진에 흔한 태그 몇 개를 새로 넣을 수도 있습니다. 한 가지
        주의할 점이 있습니다. 파일을 쓸 때 EXIF 블록을 새로 만드는데, 메이커 노트는
        원래 블록 안쪽을 가리키는 오프셋을 담고 있습니다. 그래서 새로 만들어진
        메이커 노트를 제조사 소프트웨어가 나중에 읽지 못할 수 있습니다. 그게
        중요하다면 메이커 노트를 지우거나, 파일을 아예 고치지 말고 두세요."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도 없습니다. 이 사이트는 광고로
        유지되는데, 그 광고에도 내 사진에 관한 것은 넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다.
        아무것도 업로드되지 않는다는 가장 간단한 증명이기도 하고요. 사진을
        어딘가로 보내서 처리하는 도구라면 선을 뽑는 순간 멈춰 버릴 테니까요."""

[schema]
description = "사진 안의 EXIF, GPS, XMP, IPTC 메타데이터를 읽고, 개별 태그를 고치고, 한 번에 전부 지웁니다. JPEG, PNG, WebP를 브라우저에서 처리하며 이미지를 다시 인코딩하지 않습니다."
features = [
  "GPS 좌표, 카메라 일련번호, 메이커 노트를 포함한 모든 EXIF 태그를 보여 줍니다",
  "개별 태그를 고치거나 지우고 파일을 다시 씁니다",
  "EXIF, GPS, XMP, IPTC, 주석, 내장 미리보기를 한 번에 지웁니다",
  "JPEG, PNG, WebP",
  "컨테이너만 다시 쓰기 때문에 이미지가 다시 압축되지 않습니다",
  "오프라인 동작. 업로드 없음, 가입 없음",
]

[picker]
title = "여기에 사진을 놓으세요"
hint = "또는 클릭해서 고르기. JPEG, PNG, WebP"
