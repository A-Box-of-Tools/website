[[privacy]]
title = "붙여 넣은 것이 나갈 곳이 없습니다."
body = """
 Content-Security-Policy에는 이
      페이지가 연결할 수 있는 모든 주소가 적혀 있고, 그중 우리 것은 하나도 없습니다.
      붙여 넣은 청구서가 수집될 만한 엔드포인트가 여기에는 없고, 설령 있다 해도 그리로
      보낼 코드가 없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 <code>src/</code> 어디에도
      <code>fetch</code>도, <code>XMLHttpRequest</code>도, <code>sendBeacon</code>도
      없습니다. 파서와 프린터는 문자열을 받아 문자열을 돌려주는, 이 페이지 안의
      함수입니다."""

[[privacy]]
title = "외부 엔티티는 결코 해석되지 않습니다."
body = """
 외부 엔티티가 들어 있는
      <code>DOCTYPE</code>은 XML 파서를 구슬려 파싱 중인 그 기기의 파일을 읽게 만드는
      방법이고, 이 형식의 가장 오래된 구멍입니다. <code>src/xml.js</code>는 엔티티
      해석이 아예 들어 있지 않은, 손으로 쓴 리더입니다. 꺼 둔 것이 아니라 없는 것이고,
      이 페이지는 사용자의 텍스트를 브라우저 자신의 <code>DOMParser</code>에 넘기지도
      않습니다."""

[[privacy]]
title = "XML에서 나오는 모든 값은 문자열입니다."
body = """
 <code>&lt;port&gt;8080&lt;/port&gt;</code>은
      그것이 숫자인지에 대해 아무 말도 하지 않으므로, JSON은 <code>"8080"</code>이라고
      씁니다. 대신 정해 주는 것은, 마치 파일에 있었던 것처럼 계속 실려 다니게 될 정보를
      지어내는 일입니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에 주지 않는 것."
body = """
 광고와 측정
      스크립트는 구글에서, 후원 버튼은 Buy Me a Coffee에서 옵니다. 그 어느 쪽에도
      사용자의 텍스트는 한 글자도 건네지지 않습니다. 그것을 읽고 파싱하고 쓰는 모든
      줄은 이 오리진에서 제공되며 저장소에 올라 있습니다."""

[[privacy]]
title = "오프라인에서 동작합니다."
body = """
 네트워크를 끊어도 이 도구는 그대로입니다.
      애초에 네트워크 단계가 없었기 때문입니다. 가장 간단한 증명입니다."""

[[howto]]
title = "할 일을 고르세요."
body = """
 탭 둘에 입력란 하나입니다. <em>포맷</em>은
      XML을 펼치거나 납작하게 누르고, <em>변환</em>은 그것을 JSON으로, 또는 JSON을 다시
      XML로 돌립니다. 방금 펼친 XML이 그대로 변환할 XML이라, 두 번 붙여 넣을 일이
      없습니다."""

[[howto]]
title = "붙여 넣거나, 파일을 놓으세요."
body = """
 선택해서 복사할 수 있는 것이면
      무엇이든 됩니다. <code>.xml</code>, <code>.svg</code>, <code>.rss</code>,
      <code>.xsd</code> 파일을 선택기에 놓으면 사용자의 브라우저가 읽어서 입력란에
      넣습니다. 건너뛸 업로드 단계 자체가 없습니다."""

[[howto]]
title = "들여쓰기를 고르거나, 납작하게 누르세요."
body = """
 공백 두 칸, 네 칸,
      또는 탭. 납작하게 누른 것은 읽기 좋으라고만 있던 공백을 모두 뺀 같은 문서이고,
      결과가 그것으로 몇 바이트를 아꼈는지 알려 줍니다."""

[[howto]]
title = "오류가 있는 자리에서 오류를 읽으세요."
body = """
 여기서 실패한 파서는,
      브라우저가 한 번에 읽어 낸 문서를 두고 하는 &lsquo;1행 오류&rsquo; 대신 <em>어떤
      태그가</em> 끝내 닫히지 않았는지를 몇 행 몇 열인지와 함께 말해 줍니다."""

[[howto]]
title = "결과를 가져가세요."
body = """
 복사하거나, 나온 형식의 이름이 붙은 파일로
      내려받으세요."""

[[faq]]
q = "제 XML이 어딘가로 업로드되나요?"
a = """
        아닙니다. 이 페이지의 파서와 프린터는 사용자의 브라우저에서, 사용자의 하드웨어
        위에서 도는 함수입니다. 이 도구에는 네트워크 기능 자체가 없어서 무언가를
        가져오지도, 보내지도 않습니다. 페이지의 <code>Content-Security-Policy</code>에는
        연결할 수 있는 모든 주소가 적혀 있고 그중 우리 것은 하나도 없습니다. 이것은
        XML에서 이 형식의 평판이 풍기는 것보다 더 무거운 이야기입니다. 여기 들어오는
        것은 대개 청구서나 은행 거래 내역서, 진료 기록, 아니면 헤더에 자격 증명이 들어
        있는 SOAP 요청이기 때문입니다."""

[[faq]]
q = "외부 엔티티를 해석하나요?"
a = """
        아닙니다. 끌 것도 없습니다. 외부 엔티티 해석은 XML 파서를 구슬려 그것을
        실행하는 기기의 파일을 읽게 만드는 방법이고, 보통 XXE라고 쓰는 공격입니다.
        <code>src/xml.js</code>는 엔티티 해석이 전혀 없는, 손으로 쓴 리더입니다.
        사용자의 텍스트가 브라우저 자신의 <code>DOMParser</code>로 넘어가는 일도
        없습니다. <code>DOCTYPE</code>은 한 번도 실행되지 않은 채 그대로 지나갑니다."""

[[faq]]
q = "XML을 JSON으로 바꾸면 무엇을 잃나요?"
a = """
        혼합 내용의 순서, 주석, 그리고 속성과 자식 요소의 차이입니다. 마지막 것은
        지워지기보다 누그러집니다. 속성은 이름이 <code>@</code>로 시작하는 멤버가 되기
        때문입니다. 요소 자신의 텍스트는 다른 것과 나란히 있어야 할 때
        <code>#text</code>가 되고, 반복되는 자식은 배열이 됩니다. 모든 값은 문자열로
        남습니다. XML에는 타입이 없고, <code>8080</code>이 숫자였다고 정하는 것은 정보를
        지어내는 일이 됩니다."""

[[faq]]
q = "JSON을 XML로 바꾸면 무엇을 잃나요?"
a = """
        빈 객체와 빈 배열과 빈 문자열의 차이입니다. 셋 다 빈 요소가 됩니다. 그리고 모든
        값의 타입도 잃습니다. XML에는 타입이 없기 때문입니다. 배열은 반복되는 요소가
        되는데, 그것이 다시 읽히는 유일한 모양입니다. 요소 이름이 감당하지 못하는 키는,
        어떤 파서도 읽지 않을 문서를 내놓는 대신 껄끄러운 문자를 바꿔 넣습니다."""

[[faq]]
q = "SVG나 RSS 피드, POM 파일도 포맷할 수 있나요?"
a = """
        됩니다. 셋 다 XML이고, 이것은 특정 방언이 아니라 XML을 읽습니다. 이렇게 펼친
        SVG는 손으로 고치기 쉬워집니다. RSS나 Atom 피드는 보통 납작하게 눌린 채로
        배포되어 무언가가 펼치기 전까지는 읽을 수 없습니다. 어떻게 늘어놓든 문서의 뜻은
        달라지지 않습니다."""

[[faq]]
q = "다시 들여쓰면 XML의 뜻이 달라지나요?"
a = """
        요소가 요소를 담고 있는 문서라면 달라지지 않습니다. 문제가 될 수 있는 것은
        텍스트입니다. 낱말을 담은 요소 안의 공백은 그 텍스트의 일부이므로, 텍스트만 담은
        요소는 펼치지 않고 한 줄에 그대로 둡니다. <code>CDATA</code> 구간은 있던 그대로
        옮겨집니다."""

[[faq]]
q = "왜 브라우저 자신의 XML 파서를 쓰지 않나요?"
a = """
        문서가 깨졌을 때 하는 말 때문입니다. <code>DOMParser</code>는 오류 문서를
        돌려주는데, 그 표현은 브라우저마다 다르고 흔히 &lsquo;1행 오류&rsquo;로
        귀결됩니다. 손으로 쓴 리더는 어떤 태그가 끝내 닫히지 않았는지, 그것이 어디서
        열렸는지를 말해 줄 수 있고, 그것이 바로 알고 싶었던 바입니다. 외부 엔티티를
        해석하지 않는다는 것이 나머지 이유입니다."""

[[faq]]
q = "얼마나 큰 파일까지 다룰 수 있나요?"
a = """
        여기에 걸어 둔 제한은 없습니다. 그 값을 치를 서버가 없기 때문입니다. 실제 한계는
        사용자의 기기입니다. 몇 메가바이트짜리 XML은 괜찮고, 아주 긴 문서에서는 키보드를
        두고 다투는 대신 입력이 멎기를 기다렸다가 다시 포맷합니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험 기간도 없으며 얼마나 붙여 넣든 제한이 없습니다.
        이 사이트에는 광고가 있고 그것이 비용을 댑니다. 광고에는 텍스트에 관한 것이
        아무것도 주어지지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 뒤 인터넷을 끊어도 계속 동작합니다. 이것이 아무것도
        업로드되지 않는다는 가장 간단한 증명이기도 합니다. XML을 포맷하러 밖으로 보내는
        도구라면 선을 뽑는 순간 멈췄을 것입니다."""

[schema]
description = "XML을 포맷하고 들여쓰고 압축하며, XML을 JSON으로 또는 JSON을 XML로 바꿉니다. 파서는 브라우저에서 돌고, 외부 엔티티를 전혀 해석하지 않으며, 아무것도 업로드되지 않습니다."
features = [
  "XML을 펼치거나, 납작하게 눌러 몇 바이트를 아꼈는지 알려 줌",
  "XML을 JSON으로, JSON을 XML로 바꾸며 각 방향이 무엇을 잃는지 말해 줌",
  "어떤 태그가 끝내 닫히지 않았는지, 몇 행 몇 열인지 알려 줌",
  "외부 엔티티를 전혀 해석하지 않아 XXE 페이로드는 언제나 그저 텍스트",
  "SVG, RSS, Atom, XSD를 비롯한 모든 XML을 읽음",
  "놓은 파일에서도 붙여 넣은 텍스트에서도 동작",
  "오프라인 동작, 업로드 없음, 가입 없음",
]

[picker]
title = "여기에 파일을 놓으세요"
hint = "클릭해서 고르셔도 됩니다 &mdash; .xml, .svg, .rss 파일"
