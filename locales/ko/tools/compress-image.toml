description = "JPEG, PNG, WebP를 원하는 용량에 딱 맞춰 압축합니다. 100KB든 2MB든 상관없습니다. 전부 브라우저 안에서 돌아갑니다. 업로드 없음, 회원가입 없음, 오프라인에서도 동작."
og_title = "이미지를 원하는 용량으로 압축하기"
og_description = "목표 용량만 정하면 거기 들어가는 가장 약한 압축을 찾아내고, 그 대가가 얼마였는지까지 재서 보여 줍니다. 내 기기에서 돌아가고 아무것도 업로드하지 않습니다."
og_image_alt = "이미지 압축 - 용량은 맞추고 화질은 지키고"

pledge = """
    압축은 내 브라우저가 내 기기의 성능으로, 브라우저에 이미 들어 있는 인코더를
    써서 합니다. 이 도구에는 네트워크 기능이 아예 없습니다. 가져올 것도 보낼
    것도 없어요. 설령 보내려 해도 이 페이지 반대편에는 사진을 받아 줄 서버가
    없습니다."""

live_hint = """
      그냥 믿지 마시고 직접 확인해 보세요. 개발자 도구의 '네트워크' 탭을 켜 놓고
      사진을 압축해 보십시오. 이미지도, 미리보기도, 파일 이름도, 고른 파일의 단
      1바이트도 실려 나가는 요청이 없습니다. 아니면 인터넷을 끊고 그냥 압축해
      보셔도 됩니다."""

read_first = """
, 화질을 어디까지 쓸지 정하는 탐색은
      <code>src/compress.js</code>, '육안 일치' 수치 뒤의 비교는
      <code>src/measure.js</code>에 있습니다."""

howto_heading = "이미지를 원하는 용량으로 압축하는 방법"

card = """
            필요한 용량만 말해 주세요. 100KB든 2MB든, 거기에 닿는 가장 약한
            압축을 찾아냅니다."""

