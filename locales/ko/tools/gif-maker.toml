[[privacy]]
title = "이미지는 나갈 곳이 없습니다."
body = """
 이 페이지가 연결해도 되는 주소는
      Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트 것은 하나도
      없습니다. 파일이 모일 만한 수신 지점이 없고, 설령 있더라도 거기로 파일을
      보낼 코드가 없습니다. 예전에는 이 줄이 <code>connect-src 'none'</code>이었고
      그건 절대적이었습니다. 광고를 넣으면서 그걸 잃었고, 그 사실을 말해 두는
      것까지가 약속입니다."""

[[privacy]]
title = "인코더는 이 저장소의 네 파일입니다."
body = """
 GIF에는 색 양자화기와 LZW 압축기가
      필요한데 브라우저에는 둘 다 없습니다. 그래서 둘 다 여기,
      <code>src/quantize.js</code>와 <code>src/lzw.js</code>에 적혀 있고
      컨테이너는 <code>src/gif.js</code>에 있습니다. 하나 만드는 데 가져오는 것이
      없고, 처음 쓸 때 내려받는 엔진도 없습니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서
      옵니다. 어느 쪽에도 내 이미지에 관한 것은 넘어가지 않습니다. 파일도,
      미리보기도, 이름도, 용량도, 개수도요. 이미지를 읽고 디코딩하고 그리고
      압축하는 코드는 한 줄도 빠짐없이 이 출처에서 제공되고 저장소에 공개되어
      있습니다."""

[[privacy]]
title = "후원 버튼이 불러오는 것과, 후원 버튼이 받지 못하는 것."
body = """

      헤더의 \"Buy me a coffee\" 버튼은 cdnjs.buymeacoffee.com의 스크립트가
      그리고, 글꼴은 Google Fonts에서 가져옵니다. 그저 링크일 뿐이에요. 방문을
      보고하지도, 나에 관한 것이나 내 이미지에 관한 것을 받아 가지도 않습니다.
      누르지 않으면 아무 일도 일어나지 않고, 눌러서 가게 되는 곳은 남의
      사이트입니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 이 페이지의 기능이
      전부 그대로 돌아갑니다. 가장 간단한 증거예요. 사진을 어딘가로 보내서 GIF로
      만드는 도구라면 선을 뽑는 순간 멈출 테니까요."""

[[howto]]
title = "이미지를 고릅니다."
body = """
 폴더를 통째로 선택 영역에 끌어다
      놓거나 파일을 직접 고르세요. 브라우저가 디스크에서 곧바로 읽습니다.
      그동안 어디로도 아무것도 나가지 않습니다."""

[[howto]]
title = "재생될 순서대로 놓습니다."
body = """
 손잡이를 잡고 끌거나 화살표를
      쓰세요. \"이름순 정렬\"이 사람이 기대하는 대로 세기 때문에
      <code>frame_2</code>가 <code>frame_10</code>보다 앞에 놓입니다."""

[[howto]]
title = "각 프레임이 얼마나 머무를지 정합니다."
body = """
 한 장에 0.5초면 슬라이드쇼이고,
      20분의 1초면 애니메이션입니다. 모든 프레임에 같은 시간을 한 번에 주거나,
      한 장만 따로 오래 머물게 할 수도 있습니다."""

[[howto]]
title = "크기와 색을 고르는 방식을 정합니다."
body = """
 GIF는 면적과 프레임 수에 따라
      커지는데 그걸 되돌릴 화질 슬라이더가 없습니다. 그래서 크기가 가장 중요한
      설정입니다. 프레임마다 256색을 쓰는 쪽이 가장 보기 좋은 기본값이고, 공유
      팔레트 하나를 쓰면 더 작고 더 차분해집니다."""

[[howto]]
title = "GIF를 만들고 내려받습니다."
body = """
 내 기기에서 만들어지므로, 걸리는
      시간은 대기열이 아니라 기기 성능에 달려 있습니다. 완성된 움직임은 저장하기
      전에 페이지에서 먼저 재생됩니다."""

[[faq]]
q = "제 이미지가 어딘가로 업로드되나요?"
a = """
        아닙니다. 이미지를 읽고 그리고 색을 고르고 압축하는 일은 내 기기에서
        도는 내 브라우저가 합니다. 이 도구에는 서버 쪽이라는 것이 없고, 이
        페이지의 <code>Content-Security-Policy</code>에 연결해도 되는 주소가
        전부 적혀 있는데 그중 이 사이트 것은 하나도 없습니다. 네트워크 선을
        뽑아도 GIF는 그대로 만들어집니다."""

[[faq]]
q = "어떤 이미지 형식을 쓸 수 있나요?"
a = """
        브라우저가 디코딩할 수 있는 정지 이미지 형식은 다 됩니다. 실제로는 JPG,
        PNG, WebP, GIF, AVIF, 그리고 애플 기기에서는 HEIC입니다. 여기서 따로
        관리할 목록이 없습니다. 디코딩은 우리가 아니라 브라우저의 일이니까요."""

[[faq]]
q = "제 GIF는 왜 이렇게 큰가요?"
a = """
        GIF가 모든 프레임을 픽셀 전체로 저장하기 때문입니다. 움직임 보상이 없고,
        \"지난번과 같은데 옆으로 옮겨졌다\"로 저장되는 것이 없으며, 화질 다이얼도
        없습니다. 크기는 대략 면적 곱하기 프레임 수이고, 그걸 끌어내리는 방법은
        셋뿐입니다.
        <br><br>
        먼저 작게 만드세요. 가로세로를 절반으로 줄이면 파일은 4분의 1이 됩니다.
        프레임을 줄이거나 한 장을 더 오래 머물게 하세요. 색을 64나 32로 내리고
        디더링을 끄세요. 평평한 그림에서는 대가가 생각보다 적고, 사진에서는 아주
        큽니다. 그래도 안 들어간다면 정직한 답은 이렇습니다. 지금 만들고 계신
        것은 사실 영상이고, MP4로 만들면 아마 10분의 1이 됩니다."""

[[faq]]
q = "GIF는 얼마나 빠르게 재생될 수 있나요?"
a = """
        숫자가 시사하는 만큼 빠르지는 않습니다. 이 형식은 각 프레임의 지연을
        100분의 1초 단위로 저장하는데, 브라우저들은 1990년대부터 그중 둘 미만인
        것을 10분의 1초로 묶어 왔습니다. 당시 빙글빙글 돌던 지구본 이미지 때문에
        생겨서 한 번도 걷히지 않은 규칙이에요. 그래서 0.01초 지연은 초당
        100프레임이 아니라 10프레임으로 재생됩니다. 이 도구가 0.02초 아래를
        내놓지 않는 것도 그래서이고, 0.05초(초당 20프레임)쯤이 요구할 만한 최고
        속도입니다."""

[[faq]]
q = "팔레트 설정은 무엇을 바꾸나요?"
a = """
        GIF 프레임은 최대 256색을 담고, 무언가는 그 256색을 골라야 합니다.
        <br><br>
        <strong>프레임마다 최적의 색</strong>은 사진마다 따로 256색을 고릅니다.
        가장 또렷해 보이고, 서로 무관한 사진 묶음에는 이쪽이 맞습니다.
        <strong>GIF 전체에 하나의 팔레트</strong>는 모든 프레임을 한 번에 훑어 표
        하나를 만듭니다. 파일이 더 작아지고, 같은 장면의 프레임 사이에서 팔레트가
        휙휙 바뀔 때 생기는 깜빡임도 사라집니다. 프레임이 이것저것 모아 놓은 것이
        아니라 이어지는 장면이라면 이쪽을 고르세요."""

[[faq]]
q = "투명한 배경을 유지할 수 있나요?"
a = """
        이미지에 투명한 영역이 있다면 됩니다. \"투명도\"를 \"투명한 영역 유지\"로
        바꾸세요. 다만 알아 두실 것이 하나 있습니다. GIF의 투명도는 1비트입니다.
        픽셀은 아예 보이지 않거나 완전히 칠해지거나 둘 중 하나이고 그 사이가
        없어요. 그래서 안티앨리어싱된 가장자리와 부드러운 그림자, 흐려지는 부분이
        모두 딱딱한 경계로 바뀝니다. 움직임이 놓일 배경 색을 알고 계신다면, 그 색
        위에 눌러 두는 편이 더 나아 보입니다."""

[[faq]]
q = "이미지를 몇 장까지 쓸 수 있나요?"
a = """
        도구에 정해 둔 제한은 없습니다. 현실적인 한계는 기기의 메모리, 그리고
        나오는 파일 크기를 견디는 인내심입니다. 사진은 한 장씩 읽으니 백 프레임도
        괜찮습니다만, 640px짜리 백 프레임이면 아주 큰 GIF가 됩니다. 위의 \"제 GIF는
        왜 이렇게 큰가요?\"를 보세요."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도 없습니다. 결과물에 워터마크도 붙지
        않고요. 이 사이트는 광고로 유지되는데, 그 광고에도 내 이미지에 관한 것은
        넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다.
        아무것도 업로드되지 않는다는 가장 간단한 증명이기도 하고요. 이미지를
        어딘가로 보내서 처리하는 도구라면 선을 뽑는 순간 멈춰 버릴 테니까요."""

[schema]
description = "여러 장의 이미지를 움직이는 GIF로 만듭니다. 프레임과 팔레트, 압축을 전부 브라우저에서 계산하므로 이미지가 업로드되는 일은 없습니다."
features = [
  "JPG, PNG, WebP, GIF, AVIF 이미지를 움직이는 GIF 하나로 묶습니다",
  "프레임마다 머무는 시간 지정, 끌어서 순서 바꾸기, 이름순·날짜순 정렬",
  "256, 128, 64, 32색을 지원하고 Floyd-Steinberg 디더링은 선택",
  "하나의 공유 팔레트, 또는 프레임마다 최적의 색",
  "1비트 투명도 선택 가능. 무한 반복, 한 번만, 또는 정해진 횟수만큼",
  "오프라인 동작. 업로드 없음, 가입 없음, 워터마크 없음",
]

[picker]
title = "여기에 이미지를 놓으세요"
hint = "또는 클릭해서 고르기. JPEG, PNG, WebP, GIF, AVIF"
