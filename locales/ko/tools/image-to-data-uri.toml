    반대편에 사진을 받을 서버 자체가 없습니다."""

live_hint = """
      그냥 믿지 마시고 확인해 보세요. 개발자 도구를 열고 네트워크 탭을 켠 채로
      사진을 넣어 보십시오. 이미지도, 미리보기도, 파일명도, 여러분이 고른 것의
      단 1바이트도 실려 나가는 요청이 없습니다. 아니면 인터넷을 끊고 그냥
