[[privacy]]
title = "여러분의 이미지는 나갈 곳이 없습니다."
body = """
 이 페이지가 연결할 수
      있는 주소는 Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트의
      것은 하나도 없습니다. 파일이 모일 만한 수신 지점이 없고, 설령 있더라도
      그것을 보낼 코드가 없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 <code>src/</code>
      어디에도 <code>fetch</code>도, <code>XMLHttpRequest</code>도,
      <code>sendBeacon</code>도 없습니다. 인코딩은 <code>btoa</code>와
      <code>encodeURIComponent</code>입니다 &mdash; 브라우저가 처음부터 갖고
      있던 두 함수이고, 둘 다 바이트를 받아 텍스트를 돌려줄 뿐 어디로도 가지
      않습니다."""

[[privacy]]
title = "미리보기가 곧 증거입니다."
body = """
 결과 옆의 그림은 여러분의
      파일이 아니라 이 페이지가 방금 만든 데이터 URI에서 그려집니다. 그것이
      보인다는 건 URI가 맞다는 뜻입니다. 여러분의 기기에서, 서버 없이요
      &mdash; 그리고 그려지지 않으면 망가진 것을 건네는 대신 그렇다고 말해
      줍니다."""

[[privacy]]
title = "메타데이터 경고는 여러분 편입니다."
body = """
 데이터 URI는 파일을 그대로
      복사하기 때문에, 사진의 GPS 좌표도 함께 여러분의 스타일시트로 들어갑니다.
      이 페이지는 그런 것이 얼마나 들어 있는지 읽어 알려 줍니다. 그러지 않으면
      커밋한 뒤에 알게 되니까요."""

[[privacy]]
title = "구글이 불러오는 것과, 구글이 받지 못하는 것."
body = """
 광고와 측정
      스크립트는 구글에서, 후원 버튼은 Buy Me a Coffee에서 옵니다. 그 어느
      쪽에도 여러분의 사진에 관한 것은 넘어가지 않습니다. 파일을 읽거나
      인코딩하는 코드는 한 줄도 빠짐없이 이 출처에서 제공되고 저장소에 공개되어
      있습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 도구는 그대로입니다.
      애초에 네트워크를 쓰는 단계가 없었으니까요. 가장 간단한 증거입니다."""

[[howto]]
title = "이미지를 고릅니다."
body = """
 선택 영역에 끌어다 놓거나 직접 골라
      주세요. 브라우저가 디스크에서 곧바로 읽습니다. 그동안 어디로도 아무것도
      전송되지 않습니다."""

[[howto]]
title = "결과가 어디로 갈지 말합니다."
body = """
 URI만, CSS 규칙, 사용자 지정
      속성, <code>&lt;img&gt;</code> 태그, 아니면 마크다운. 어느 쪽이든 URI에
      따옴표를 제대로 씌워 줍니다. 인라인 SVG가 동작하느냐 조용히 실패하느냐를
      가르는 것이 바로 그 세부입니다."""

[[howto]]
title = "대가를 읽습니다."
body = """
 결과마다 몇 글자가 되었는지, 파일보다
      얼마나 커졌는지, 이만한 크기를 인라인으로 넣는 것이 좋은 생각인지가
      적힙니다. base64는 3분의 1을 더합니다. 그 3분의 1이 요청 하나를 아낄
      값어치가 있는지는 전적으로 크기에 달렸고, 그래서 페이지가 여러분이 선의
      어느 쪽에 있는지 말해 줍니다."""

[[howto]]
title = "경고를 확인합니다."
body = """
 사진에 EXIF나 색 프로파일, XMP가 들어
      있으면 그것이 결과의 몇 바이트를 차지하는지와 함께 이름이 적힙니다.
      확장자가 실제 형식과 다르면 페이지는 형식을 따르고 그 사실을 알려 줍니다.
      브라우저가 결과를 그리지 못해도 그렇다고 말합니다."""

[[howto]]
title = "복사하거나 내려받습니다."
body = """
 결과마다 버튼이 하나씩 있고, 전부
      한 번에 처리하는 버튼도 있습니다 &mdash; 사용자 지정 속성은
      <code>:root</code> 블록에 싸여 나오므로 스타일시트 맨 위에 바로 붙여
      넣으면 됩니다."""

[[faq]]
q = "제 이미지가 어딘가로 업로드되나요?"
a = """
        아닙니다. 파일을 읽고 인코딩하는 것은 여러분의 기기에서 도는 여러분의
        브라우저이고, 브라우저가 이미 갖고 있는 두 함수를 씁니다. 이 도구에는
        네트워크 기능이 하나도 없어서 &mdash; 무언가를 가져오지도, 보내지도
        않습니다 &mdash; 이 페이지의 <code>Content-Security-Policy</code>가
        연결 가능한 주소를 전부 적어 두는데 그중 이 사이트의 것은 없습니다."""

[[faq]]
q = "데이터 URI가 무엇인가요?"
a = """
        보통 웹 주소가 들어갈 자리에 파일 전체를 적어 넣는 방법입니다.
        브라우저더러 가서 가져오라고 시키는 <code>url("logo.png")</code> 대신,
        사진 자체가 들어 있는
        <code>url("data:image/png;base64,iVBORw0...")</code>를 씁니다. 브라우저가
        그 자리에서 디코딩합니다. 실질적인 효과는 요청 하나가 줄어드는 것입니다.
        사진이 스타일시트나 페이지 뒤가 아니라 그것과 함께 도착합니다."""

[[faq]]
q = "제 SVG는 왜 base64가 아닌가요?"
a = """
        base64가 SVG에는 맞지 않는 인코딩이기 때문입니다. SVG는 텍스트이고 URL은
        이미 텍스트를 실어 나를 수 있습니다 &mdash; 이스케이프해야 하는 문자는
        몇 개뿐이에요. 그것만 퍼센트 인코딩하고 나머지를 그대로 두면 같은 파일의
        base64보다 대개 5분의 1쯤 짧은 URI가 나오고, 스타일시트 안에서 여전히
        읽을 수 있습니다. 요소 이름도, 색도, <code>viewBox</code>도 그대로 남아
        고칠 수 있습니다. base64를 고집하는 드문 도구 체인을 위해 강제로 base64를
        쓰는 체크박스도 있습니다."""

[[faq]]
q = "base64를 쓰면 이미지가 얼마나 커지나요?"
a = """
        3분의 1쯤입니다. 파일 3바이트가 base64 4글자가 되는데, 앞에 붙는
        <code>data:image/png;base64,</code>를 빼고 33%입니다. 그게 바닥이고
        피할 수 없습니다. URL이 허용하는 문자만으로 임의의 바이트를 적어 내는
        비용이니까요. 페이지가 파일 크기 옆에 글자 수를 나란히 보여 주는 것도
        같은 이유입니다. 스타일시트를 배포하고 나서 알게 되는 일이 없도록요."""

[[faq]]
q = "이미지를 인라인으로 넣는 게 실제로 좋은 경우는 언제인가요?"
a = """
        작고, 당장 필요할 때입니다. 모든 페이지가 불러오는 스타일시트에 들어간
        2KB짜리 아이콘은 분명한 이득입니다. 왕복이 하나 줄고, CSS가 도착하는
        순간 사진도 거기 있으니까요. 10KB쯤을 넘으면 손익이 뒤집힙니다. 인라인된
        사진은 더 이상 별개의 파일이 아니라서 따로 캐시될 수 없고, 다른 것과
        병렬로 받아 올 수도 없으며, 그것을 감싼 파일이 바뀔 때마다 통째로 다시
        내려받습니다 &mdash; 스타일시트 안의 200KB짜리 사진은 사이트 모든
        페이지의 임계 경로에 200KB를 얹는 것입니다. 각 결과가 그 선의 어느 쪽에
        떨어지는지는 페이지가 말해 줍니다."""

[[faq]]
q = "gzip을 쓰면 base64가 더한 만큼이 상쇄되나요?"
a = """
        사람들이 기대하는 것보다는 훨씬 덜합니다. 이미 압축된 파일 &mdash; PNG도
        JPEG도 WebP도 그렇습니다 &mdash; 의 base64는 잘 압축되지 않습니다.
        압축기가 찾아낼 중복이 거의 남아 있지 않으니까요. 대개 base64가 더한
        3분의 1 중 10분의 1쯤을 돌려받지, 전부를 돌려받지는 못합니다. 퍼센트
        인코딩한 SVG는 반대입니다. 여전히 텍스트라서 예전만큼 잘 압축되고,
        그것 또한 SVG를 base64로 만들지 않는 이유입니다."""

[[faq]]
q = "이 과정에서 제 이미지가 조금이라도 바뀌나요?"
a = """
        아닙니다. 여기 있는 다른 도구들과 일부러 다르게 만든 점입니다. 픽셀로
        디코딩했다가 다시 인코딩하는 일이 없습니다. 디스크에서 나온 바이트가
        그대로 URI로 들어갑니다. JPEG는 화질도 크기도 그대로인 바로 그 JPEG로
        남습니다. 결과를 사본이 아니라 같은 파일이라고 말할 수 있는 이유입니다."""

[[faq]]
q = "그러면 EXIF와 GPS 정보도 스타일시트로 들어가나요?"
a = """
        들어갑니다. 붙여 넣기 전에 생각해 볼 만한 대목입니다. 다시 인코딩하지
        않으므로 카메라가 쓴 모든 것이 사진과 함께 갑니다. 위치, 촬영 시각,
        카메라 일련번호까지요. 휴대폰 사진이라면 그것만 30KB가 되기도 하는데,
        base64로는 40KB가 되어 페이지의 임계 경로에 얹히고, 게다가 저장소에
        커밋될 무언가에 집 주소가 들어갑니다. 이 페이지는 JPEG, PNG, WebP에
        메타데이터가 얼마나 들었는지 읽어 알려 줍니다. 먼저 빼내려면
        <a href="../exif-정보-삭제/">EXIF 확인 및 제거</a>를 쓰세요."""

[[faq]]
q = "왜 제 파일 확장자와 다른 타입을 썼나요?"
a = """
        확장자는 틀릴 수 있지만 바이트는 틀릴 수 없기 때문입니다.
        <code>logo.png</code>라는 이름으로 실제로는 JPEG로 내보낸 파일은 어느
        이미지 도구든 감당해야 할 만큼 흔하고, 타입을 잘못 적은 데이터 URI는
        그냥 그려지지 않습니다 &mdash; 대체 수단도 없고 읽어 볼 만한 오류
        메시지도 없습니다. 그래서 타입은 파일의 첫 몇 바이트에서 읽습니다.
        여기서 다루는 모든 형식에서 그 바이트가 무엇인지를 분명히 말해 주고,
        둘이 어긋나면 페이지가 알려 줍니다."""

[[faq]]
q = "미리보기가 비어 있습니다. 무엇이 잘못됐나요?"
a = """
        URI 쪽은 아마 멀쩡합니다. HEIC와 TIFF는 완벽히 올바른 데이터 URI를
        만들지만 Safari 말고는 어떤 브라우저도 그리지 않습니다. 그러니 붙여 넣는
        곳에서도 사진은 보이지 않을 겁니다 &mdash;
        <a href="../이미지-압축/">이미지 압축</a>이나
        <a href="../이미지-크기-조절/">이미지 크기 조절</a>로 먼저 PNG나 JPEG, WebP로
        바꾸세요. 형식이 평범한 것이라면 파일 자체가 손상됐을 가능성이 큽니다.
        미리보기는 이 페이지가 만든 URI에서 그려지므로, 비어 있다는 것은 사진이
        디코딩되지 않았다는 뜻입니다."""

[[faq]]
q = "데이터 URI에 크기 제한이 있나요?"
a = """
        CSS나 <code>&lt;img&gt;</code> 태그에서 마주칠 만한 제한은 없습니다.
        요즘 브라우저는 거기에 현실적인 상한을 두지 않습니다. 브라우저가 제한하는
        것은 주소창에 데이터 URI를 입력하는 쪽인데, 대부분 웬만한 길이는
        거부합니다. 이 용도와는 무관한 보안상의 이유입니다. 진짜 제한은 위에서
        말한 그것입니다. 기술적으로 무엇이 깨지기 훨씬 전에, 그 페이지는 평범한
        이미지 파일을 썼을 때보다 느려져 있습니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고, 계정도 로그인도 체험판도 워터마크도 없습니다. 파일 개수나
        용량에도 제한이 없습니다. 그 값을 치르는 서버가 없으니까요 &mdash; 작업은
        여러분의 기기에서 일어납니다. 이 사이트는 광고로 유지되는데, 그 광고에도
        여러분의 이미지에 관한 것은 넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다.
        아무것도 업로드되지 않는다는 가장 간단한 증명이기도 합니다. 이미지를
        어딘가로 보내 인코딩하는 도구라면 선을 뽑는 순간 멈춰 버릴 테니까요."""

