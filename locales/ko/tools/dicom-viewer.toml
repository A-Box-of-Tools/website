#
# DICOM Viewer - Korean.
#
# Overrides for tools/dicom-viewer/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# DICOM 필드 이름은 영어와 번호를 그대로 둡니다. Pixel Spacing (0028,0030),
# Series Instance UID (0020,000E). 파일에 그렇게 적혀 있고 표준에도 그렇게 적혀
# 있어서, 필드를 찾아보는 사람은 바로 그 글자를 찾습니다. transfer syntax와
# PS3.15도 마찬가지입니다.
#
# 이 사이트의 약속이 가장 날카로워지는 페이지입니다. 이 파일은 그림이 들어 있는
# 진료 기록이기 때문입니다. 그래서 파일 안에 무엇이 들어 있는지에 대한 문장도,
# 파일이 어디로 가지 않는지에 대한 문장만큼 조심해서 옮겼습니다.
#

