read_first = """
, 파일을 쓰는 과정 전부는
      <code>src/pdf.js</code>와 <code>src/document.js</code>에 있습니다. 어느
      쪽도 네트워크에는 손을 대지 않습니다."""

howto_heading = "이미지를 PDF로 만드는 방법"

card = """
            이미지를 한 쪽에 한 장씩 넣어 PDF 하나로 묶습니다. JPEG 사진은 있는
            그대로 복사되므로 화질을 잃지 않습니다."""

[words]
plural = "이미지 파일은"
choose = "이미지 파일을"

