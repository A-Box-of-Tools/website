#
# QR과 바코드 스캔 - Korean.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# 규격 이름은 그대로 둡니다. EAN-13, UPC-A, ITF-14, Code 128, Code 39,
# ISO/IEC 18004. 인쇄소나 GS1에 말할 때 쓰는 이름이 그것뿐입니다.
#
# 검색되는 말은 "스캔"이고, "읽기"는 프로그램이 하는 일입니다. 둘 다 쓰되
# 각각 자연스러운 자리에 둡니다.
#

name = "QR과 바코드 스캔"
heading = "QR&nbsp;&amp;&nbsp;바코드 스캔 <span class=\"h1-kw\">&mdash; 이미지나 카메라로 QR 코드 읽기</span>"
tagline = "코드에 카메라를 대거나, 찍어 둔 사진을 올려놓으세요. 읽는 일은 여기서만 일어납니다."

title = "QR 코드 리더 &amp; 바코드 스캐너 &mdash; 이미지에서, 업로드 없이"
description = "사진, 스크린숏, 카메라로 QR 코드를 읽고, 열기 전에 링크가 실제로 어디로 가는지 확인하세요. EAN, UPC, Code 128, Code 39, ITF 바코드도 읽습니다. 아무것도 올라가지 않습니다."
og_title = "이미지를 누구에게도 보내지 않고 QR 코드 읽기"
og_description = "이미지나 카메라로 QR 코드를 스캔하고, 열지 말지 정하기 전에 주소 전체를 확인하세요. 이미지는 기기 밖으로 나가지 않고, 카메라 화면은 한 프레임도 저장되지 않습니다."
og_image_alt = "QR과 바코드 스캔 - 이미지나 카메라로 코드 읽기, 업로드 없음"

pledge = """
    코드를 읽는 일은 픽셀에 대한 산술이고, 그 픽셀은 이미 여기 있습니다. 심벌을
    찾고, 찍힌 각도를 보정하고, 마스크를 풀고, 리드-솔로몬으로 손상된 부분을
    복구하고, 비트를 다시 읽어 내는 일이 모두 이 페이지 안의 이천 줄 남짓한
    자바스크립트에서 일어납니다. 직접 읽어 보실 수 있습니다. <strong>카메라도
    같은 약속이지, 거기서 빠지는 예외가 아닙니다.</strong> 한 프레임은 이 탭
    안으로 픽셀이 되어 들어와, 살펴본 뒤 사라집니다. 저장되는 것도 남는 것도
    없고, 애초에 이 페이지에는 무언가를 보낼 네트워크 기능이 하나도
    없습니다."""

live_hint = """
      말만 믿지 마세요. 개발자 도구를 열고 네트워크 탭을 지켜보면서 카메라를 켠
      채로 코드를 읽어 보세요. 어느 요청도 화면 한 장이나 그 안에 적힌 글자
      하나를 실어 가지 않습니다. 아니면 인터넷을 끊고도 코드를 읽어 보세요."""

read_first = """
, 사진 속에서 심벌을 찾는
      <code>src/binarize.js</code>와 <code>src/detect.js</code>(임계값, 위치
      검출 패턴, 원근 보정), 다시 읽어 내는 <code>src/qr-decode.js</code>, 잘못
      읽은 부분을 복구하는 <code>src/reed-solomon.js</code>, 막대 쪽의
      <code>src/linear.js</code>, 그리고 이 페이지에서 카메라를 건드리는 모든
      줄인 <code>src/camera.js</code>입니다."""

howto_heading = "이미지를 올리지 않고 QR 코드를 읽는 방법"

card = """
            사진, 스크린숏, 카메라로 QR 코드를 읽고 &mdash; 열기 전에 주소
            전체를 확인하세요. 바코드도 됩니다."""

