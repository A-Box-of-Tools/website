title = "YAML → JSON 변환기 &mdash; 양방향, 업로드 없이"
description = "브라우저에서 YAML을 JSON으로, JSON을 YAML로 바꿉니다. YAML 1.2를 읽어서 yes와 no가 문자열로 남고, 각 방향이 무엇을 잃는지 정확히 말해 줍니다. 아무것도 업로드되지 않아서 설정 파일이 기기를 떠나지 않습니다."
og_title = "YAML을 서버에 붙여 넣지 않고 변환하기"
og_description = "사용자의 기기에서 도는 YAML·JSON 변환기. 키는 순서를 지키고 숫자는 자릿수를 지키며, 붙여 넣은 것은 어디로도 가지 않습니다."
og_image_alt = "YAML → JSON 변환기 - 양방향, 업로드 없이"

pledge = """
    변환은 문자열에 대한 산술이고, 그 일이 여기, 이 페이지에서 벌어집니다. 두 파서는
    모두 손으로 쓴 것이고 <code>src/</code>에 있습니다. <code>yaml.js</code>와
    <code>json.js</code>이며, 그 밖에는 아무것도 없습니다. 이 도구에는 네트워크 기능
    자체가 없어서 가져올 것도 보낼 것도 없습니다. 그것이 이 사이트의 거의 어느
    곳에서보다 여기서 더 무겁습니다. YAML 파일은 대개 배포 설정이고, 배포 설정은 대개
    호스트 이름과 버킷 이름과 비밀로 가득하기 때문입니다."""

live_hint = """
      말을 믿으실 필요는 없습니다. 개발자 도구를 열고 네트워크 탭을 보면서 무언가를
      변환해 보세요. 어느 요청에도 붙여 넣으신 내용의 한 글자조차 실리지 않습니다.
      아니면 인터넷을 끊고 그대로 변환해 보셔도 됩니다."""

read_first = """
, 앵커가 무슨 뜻이었는지 짐작하는 대신 거절하는 리더는
      <code>src/yaml.js</code>를, 변환이 왜 두 형식을 동시에 아는 무언가가 사이에 끼지
      않은 파서 하나와 프린터 하나인지는 <code>src/convert.js</code>를 보세요."""

howto_heading = "YAML을 업로드하지 않고 JSON으로 바꾸는 방법"

card = """
            YAML을 JSON으로, 또는 JSON을 YAML로 바꾸고, 그 여정이 무엇을 치르는지
            들으세요. 배포 설정을 누구에게도 넘기지 않고 붙여 넣을 수 있습니다."""

[words]
plural = "YAML과 JSON은"
choose = "파일을"
analytics_extra = """, 여기를 지나가는
  YAML이나 JSON에 대해서도"""

