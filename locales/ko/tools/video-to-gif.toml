[[privacy]]
title = "동영상은 나갈 곳이 없습니다."
body = """
 이 페이지가 연결해도 되는 주소는
      Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트 것은 하나도
      없습니다. 파일이 모일 만한 수신 지점이 없고, 설령 있더라도 거기로 파일을
      보낼 코드가 없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 이 도구에는 네트워크 기능이 아예
      없습니다. 붙여 넣을 주소도, 내려받을 것도, 처음 쓸 때 가져오는 엔진도
      없어요. 내 영상에 닿는 모든 바이트는 페이지를 불러올 때 이 출처에서 온
      것입니다."""

[[privacy]]
title = "디코딩은 내 기기에서 합니다."
body = """
 프레임은 브라우저 안에서 WebCodecs를
      지나가거나, 어차피 그 영상을 보여 줬을 바로 그 재생 엔진을 지나갑니다. 어느
      쪽을 썼는지는 페이지 위쪽에 적혀 있습니다. 그에 따라 프레임을 고르는 방식이
      달라지니, 알고 계시는 편이 낫거든요."""

[[privacy]]
title = "GIF는 여기서, 누구나 읽을 수 있는 코드가 씁니다."
body = """
 팔레트와 디더링, LZW
      압축은 이 도구 자신의 폴더에 있는 육백 줄 남짓입니다. 인코딩 서비스도,
      실행 중에 가져오는 라이브러리도 없고, 그중 어디에도 사진을 보낼 만한 자리가
      없습니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서
      옵니다. 어느 쪽에도 내 영상에 관한 것은 넘어가지 않습니다. 파일도,
      프레임도, 이름도, 용량도, 길이도, 어느 구간을 표시했는지도요. 읽고 뽑아내고
      색을 고르고 인코딩하는 코드는 한 줄도 빠짐없이 이 출처에서 제공되고 저장소에
      공개되어 있습니다."""

[[privacy]]
title = "후원 버튼이 불러오는 것과, 후원 버튼이 받지 못하는 것."
body = """

      헤더의 \"Buy me a coffee\" 버튼은 cdnjs.buymeacoffee.com의 스크립트가
      그리고, 글꼴은 Google Fonts에서 가져옵니다. 그저 링크일 뿐이에요. 방문을
      보고하지도, 나에 관한 것이나 내 영상에 관한 것을 받아 가지도 않습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 이 페이지의 기능이
      전부 그대로 돌아갑니다. 가장 간단한 증거입니다."""

[[howto]]
title = "동영상을 고릅니다."
body = """
 MP4, MOV, M4V, WebM을 선택 영역에
      끌어다 놓거나 직접 골라 주세요. 브라우저가 디스크에서 곧바로 읽습니다.
      그동안 어디로도 아무것도 나가지 않습니다."""

[[howto]]
title = "구간을 표시합니다."
body = """
 영상을 재생하면서 시작할 곳에서
      <kbd>I</kbd>를, 끝날 곳에서 <kbd>O</kbd>를 누르거나 막대의 손잡이를
      끄세요. GIF는 몇 초짜리입니다. 파일이 작을지 어마어마할지를 정하는 것은
      나머지 두 설정보다 이 길이입니다."""

[[howto]]
title = "너비와 프레임 레이트를 고릅니다."
body = """
 너비 480픽셀에 초당
      12프레임이면 GIF의 웬만한 용도에 맞습니다. 너비를 절반으로 줄이면 픽셀은
      4분의 1이 됩니다. 초당 12프레임이면 아무도 보지 못하는 프레임에 값을
      치르지 않고도 움직임으로 읽힙니다."""

[[howto]]
title = "만들고, 내려받습니다."
body = """
 프레임을 읽어 애니메이션 전체에 쓸
      256색 팔레트 하나를 고르고, 각 프레임은 달라진 부분만 써 냅니다. 다 되면
      페이지에서 재생되는데, 내려받기가 주는 것과 같은 파일입니다."""

[[faq]]
q = "제 동영상이 어딘가로 업로드되나요?"
a = """
        아닙니다. 읽고 뽑아내고 변환하는 일은 내 기기에서 도는 내 브라우저가
        합니다. 이 도구에는 서버 쪽이라는 것이 없고, 이 페이지의
        <code>Content-Security-Policy</code>에 연결해도 되는 주소가 전부 적혀
        있는데 그중 이 사이트 것은 하나도 없습니다. 말로 듣기보다 직접 확인하고
        싶다면, 인터넷을 끊고 그냥 GIF를 만들어 보세요."""

[[faq]]
q = "어떤 영상 형식을 변환할 수 있나요?"
a = """
        MP4, M4V, MOV는 안에 무엇이 들었든 곧바로 읽습니다. H.264, HEVC, AV1,
        VP9 가운데 무엇이든 브라우저가 그 코덱을 디코딩할 수 있으면 문제
        없습니다. 브라우저가 재생할 수 있는 나머지, 대표적으로 WebM은 플레이어를
        각 시점으로 옮겨 가며 읽습니다. 더 느리고, 어느 프레임이 어디에 놓이는지가
        조금 덜 정확합니다. 브라우저가 읽지도 재생하지도 못하는 파일, 실제로는
        AVI, WMV, FLV와 대부분의 MKV는 중간에 실패하는 대신 그렇다는 메시지와
        함께 거부합니다."""

[[faq]]
q = "제 GIF는 왜 이렇게 큰가요?"
a = """
        GIF가 움직임이 아니라 그림 전체를 저장하는 1987년의 형식이기 때문입니다.
        5초짜리 클립으로 만든 GIF를 그 5초짜리 MP4만큼 작게 만들 방법은 없습니다.
        영상으로 만든 GIF는 흔히 원본 영상의 열 배예요. 실제로 크기를 정하는 세
        가지는 순서대로 구간의 길이, 화면의 너비, 초당 프레임 수입니다. 너비를
        절반으로 줄이면 픽셀은 4분의 1이 되고, 값을 치르는 것은 픽셀입니다."""

[[faq]]
q = "왜 256색뿐인가요?"
a = """
        그게 형식입니다. GIF는 최대 256색짜리 표 하나를 싣고 각 픽셀을 그 표의
        번호로 저장합니다. 이 도구는 표시한 구간의 모든 프레임에 든 색을 세어
        256개 무리로 나눠 그 256색을 고릅니다. median cut이라는 표준적인
        방법이고요. 그래서 팔레트가 고정된 색 묶음이 아니라 그 영상에 맞습니다.
        없는 색이 있는 자리에서는 디더링이 가장 가까운 두 색을 섞어, 그러데이션이
        줄무늬가 되지 않고 그러데이션으로 남습니다."""

[[faq]]
q = "디더링 설정은 무엇을 하나요?"
a = """
        약간의 잡티를 내주고 심한 띠 현상을 막습니다. 켜면 평평한 네 개의 띠가
        되었을 하늘이 그러데이션으로 남고, 대신 옅은 결이 생기고 파일이 커집니다.
        끄면 그림이 더 평평해지고 파일이 작아지는데, 화면 녹화나 선화처럼 이미
        평평한 색으로 이루어진 것에 어울립니다. 여기 쓰는 디더링은 오차 확산
        방식이 아니라 정렬 방식이라, 달라지지 않은 배경이 프레임 사이에서
        일렁이지 않고 완전히 가만히 있습니다."""

[[faq]]
q = "길이나 용량에 제한이 있나요?"
a = """
        제한되는 것은 구간이고, 규칙이 아니라 메모리 때문입니다. 팔레트를 고르는
        동안 구간의 모든 프레임을 한꺼번에 들고 있어야 해서, 페이지가 지금 설정이
        얼마를 요구하는지 계산해 시작 전에 알려 줍니다. 탭이 메모리를 다 쓰고
        사라지게 두는 대신 거부하는 것이죠. 구간을 짧게, 너비를 작게, 프레임
        레이트를 낮게. 어느 쪽이든 그 값을 끌어내립니다."""

[[faq]]
q = "소리도 남나요?"
a = """
        GIF는 소리를 담을 수 없습니다. 오디오가 있는 판본이 아예 없고, 웹이 GIF를
        소리 없이 반복되는 영상으로 거의 대체한 가장 큰 이유이기도 합니다. 소리가
        중요하다면 영상 그대로 두세요.
        <a href=\"../동영상-자르기/\">동영상 구간 자르기</a>가 프레임 하나 다시
        인코딩하지 않고 원하는 구간을 잘라 줍니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도, 워터마크도 없습니다. 이 사이트는
        광고로 유지되는데, 그 광고에도 내 영상에 관한 것은 넘어가지 않습니다."""

[schema]
browser_requirements = "JavaScript가 필요합니다. MP4와 MOV에는 WebCodecs를 지원하는 브라우저가 필요하고, 브라우저가 재생할 수 있는 것은 그것 없이도 됩니다."
description = "브라우저에서 영상의 한 구간을 움직이는 GIF로 변환합니다. 고른 레이트로 프레임을 뽑고, median cut으로 애니메이션 전체에 쓸 256색 팔레트 하나를 고르며, 각 프레임은 달라진 영역만 써 냅니다. 아무것도 업로드되지 않습니다."
features = [
  "MP4, MOV, M4V, WebM 영상을 움직이는 GIF로 변환합니다",
  "H.264, HEVC, AV1, VP9 원본을 WebCodecs로 디코딩합니다",
  "타임라인에서 구간을 표시하거나 정확한 시각을 입력합니다",
  "너비는 자유롭게, 초당 5~25프레임, 정렬 디더링은 선택",
  "오프라인 동작. 업로드 없음, 가입 없음, 워터마크 없음",
]

[picker]
title = "여기에 동영상을 놓으세요"
hint = "또는 클릭해서 고르기. MP4, MOV, M4V, WebM을 비롯해 이 브라우저가 재생하는 형식이면 다 됩니다"
