live_hint = """
      그냥 믿지 마시고 직접 확인해 보세요. 개발자 도구의 '네트워크' 탭을 켜 놓고
      GIF를 만들어 보십시오. 프레임도, 파일 이름도, 고른 파일의 단 1바이트도 실려
