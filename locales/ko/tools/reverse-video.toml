      올라가는 반복문은 <code>src/reverse.js</code>에 있습니다. 어느 것도 요청을
      보낼 수 있는 무언가를 불러오지 않습니다."""

howto_heading = "동영상을 거꾸로 돌리는 방법"

card = """
            영상을 화면과 소리까지 통째로 거꾸로 재생합니다. 어디로도 보내지
            않고요."""

[words]
