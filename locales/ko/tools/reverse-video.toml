live_hint = """
      그냥 믿지 마시고 직접 확인해 보세요. 개발자 도구의 '네트워크' 탭을 켜 놓고
      영상을 거꾸로 돌려 보십시오. 프레임도, 파일 이름도, 고른 파일의 단
      1바이트도 실려 나가는 요청이 없습니다. 아니면 인터넷을 끊고 그냥 돌려
      보셔도 됩니다. 영상을 어딘가로 보내서 처리하는 도구라면 그대로 멈출
      테니까요."""

read_first = """
, 어느 프레임이 언제 나올지를 정하는
