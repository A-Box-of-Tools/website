[[privacy]]
title = "내용은 읽는 사람에게 가고, 다른 어디로도 가지 않습니다."
body = """
 텍스트와 파일은 WebRTC 데이터
      채널로 갑니다. 당신의 브라우저와 읽는 사람 각각의 브라우저 사이의
      직접적이고 DTLS로 암호화된 연결이며, 그 길에는 서버가 없습니다. 같은
      네트워크라면 바이트가 건물 밖으로도 나가지 않습니다 &mdash; 같은
      와이파이의 노트북 두 대는 모든 것을 로컬로 주고받습니다.
      단 하나의 예외는 네트워크에 직접 닿을 수 없어 자기 페이지에서 암호화된 중계를 고른 읽는 사람입니다. 중계는 같은 암호문을
      전달할 뿐 읽지 못합니다."""

[[privacy]]
title = "중개자란 무엇이고, 그가 보는 전부."
body = """
 직접 연결에는 소개가 필요하기에
      이 페이지는 &mdash; 이 사이트에서 유일하게 &mdash; 우리 서버로
      WebSocket 하나를 엽니다. 그 서버는 링크 이름을 입력한 사람과 그
      이름으로 공유 중인 사람을 만나게 하고, 몇 킬로바이트의 협상을
      전달하며, 아무것도 붙들지 않습니다. 저장소에 무언가 쓰는 일이 없고,
      공유하는 쪽 연결이 끊기는 순간 방은 사라집니다. 볼 수 있는 것: 어떤
      이름이 사용 중이라는 사실, 누가 언제 오가는지, IP 주소. 볼 수 없는
      것: 텍스트, 파일, 누가 입장을 허락받았는지, 누가 무엇을 썼는지
      &mdash; 비공개 공유의 노크조차 암호화된 직접 채널로 갑니다. 전체
      소스는 이 도구의 소스 옆, 저장소에 있습니다. 공유가 끝난 뒤 남는 것은 하나뿐입니다. 서버를 운영하는 Cloudflare가 각
      연결의 기록을 7일간 보관합니다 &mdash; 링크 이름, 주소, 시각뿐이며 내용은 결코 아닙니다."""

[[privacy]]
title = "아무것도 저장되지 않으니, 탭을 닫는 것이 곧 삭제입니다."
body = """
 공유는 당신의 탭이 열려 있는
      동안에만 존재합니다. 닫으면 새로 오는 사람은 아무것도 찾지 못하고,
      읽던 사람은 자기 사본이 사라지는 것을 봅니다 &mdash; 다만 누군가
      그전에 복사하거나 내려받은 것은 그 사람의 것입니다. 직접 건네준 모든
      것이 그렇듯이요. 입력하는 초안은 다음에도 남아 있도록 당신 자신의
      브라우저 저장소에만 있습니다. 일회용으로 표시하면 어디에도 남지
      않습니다."""

[[privacy]]
title = "링크 이름이 유일한 비밀이고, 비공개 모드가 그 자물쇠입니다."
body = """
 이름을 알거나 알아맞힌
      사람은 그 뒤의 공유를 열 수 있습니다. 제안이 무작위 단어 세 개인
      이유, 민감한 것일수록 알아맞힐 수 없는 이름이 필요한 이유가 그것이며
      &mdash; 아니면 기본으로 켜져 있는 비공개 스위치가 있습니다. 도착하는
      읽는 사람마다 직접 채널로 자기소개를 해야 하고, 당신이 들여보내기
      전에는 아무것도 전송되지 않습니다."""

[[privacy]]
title = "직접 연결은 서로에게 상대의 주소를 보여 줍니다."
body = """
 그것이 피어 투 피어의
      뜻이고, 읽는 사람은 그 일이 일어나기 전에 압니다. 공유 링크를 여는
      것은 중개자에게 누가 공유 중인지 묻기만 할 뿐이고, 그다음 페이지는
      연결하면 양쪽이 서로의 IP 주소를 보게 된다고 분명히 말한 뒤 클릭을
      기다립니다. 그 클릭 전까지 공유하는 쪽은 읽는 사람의 존재조차
      모릅니다."""

[[privacy]]
title = "Google이 불러오는 것, 그리고 받지 못하는 것."
body = """ 광고·측정 스크립트는
      Google에서, 후원 버튼은 Buy Me a Coffee에서 옵니다. 어느 쪽도 텍스트도,
      파일도, 그 이름이나 크기도, 누가 연결했는지도 받지 못합니다. 예외는 이
      페이지의 주소 자체입니다. 읽는 사람의 링크에는 링크 이름이 담기고, 광고
      스크립트가 그 주소를 읽습니다. 비밀로 두어야 할 공유라면 비공개 스위치를
      쓰세요. 내용에 닿는 모든 줄은 이 출처에서 제공되며 저장소에 있습니다."""

[[howto]]
title = "텍스트를 쓰거나, 파일을 첨부하세요."
body = """
 편집기가 곧 공유입니다. 읽는
      사람이 연결되는 순간 그 안에 있는 것이 그가 받는 것이고, 그 뒤의
      수정은 입력하는 대로 연결된 사람들에게 실시간으로 갑니다. 파일은
      같은 채널로, 한 개당 200&nbsp;MB까지 갑니다. 읽는 사람은 목록을 보고
      요청한 것만 받아 가므로, 원치 않은 파일에 누구의 대역폭도 쓰이지
      않습니다."""

[[howto]]
title = "텍스트가 서식을 갖출 만하면 마크다운을 켜세요."
body = """
 스위치 하나입니다.
      제목, 굵은 글씨, 목록, 코드, 링크가 입력하는 대로 편집기 옆에서
      실시간으로 렌더링되고, 읽는 사람은 기본으로 서식 적용된 화면을
      받으며 원문으로 돌아가는 전환 버튼이 있습니다. 렌더러는 이 페이지와
      함께 오고 전부 이스케이프합니다. 누가 썼든, 공유된 텍스트는 읽는
      사람의 기기에서 스크립트가 될 수 없습니다."""

[[howto]]
title = "링크에 이름을 붙이거나, 제안을 그대로 쓰세요."
body = """
 이름이 곧 주소입니다.
      <code>brave-otter-42</code>는 방 저편으로 외칠 수 있고, 전화로 읽어
      줄 수 있고, 칠판에서 베껴 적을 수 있습니다. 동시에 유일한
      비밀이기도 하니, 사적인 것이라면 아무도 알아맞히지 못할 이름을
      고르거나 비공개 스위치에 기대세요. 다른 사람이 지금 공유 중인 이름은
      거절되고, 당신의 이름은 멈추는 순간 다시 비워집니다."""

[[howto]]
title = "누구를 들일지 정하세요."
body = """
 비공개가 기본입니다. 읽으러 온
      사람마다 자기소개를 요청받고 &mdash; 이름이든, 힌트든, 당신이 알아볼
      무엇이든 &mdash; 당신은 그 메시지를 읽게 하거나 돌려보내는 버튼과
      함께 봅니다. 소개는 직접 채널로 가므로 누가 노크했는지는 중개자도
      모릅니다. 체크를 끄면 이름을 아는 누구나 읽을 수 있는 공개 공유가
      됩니다."""

[[howto]]
title = "공유를 시작하고, 탭을 열어 두세요."
body = """
 탭이 곧 서버입니다. 공유는
      탭이 열려 있고 깨어 있는 동안에만 닿을 수 있고, 그보다 한순간도 더
      가지 않습니다. 노트북 덮개를 닫아도 끝납니다. 링크를 복사하거나,
      그냥 이름을 말하세요 &mdash; 읽는 사람은 이 페이지 주소 끝에
      <code>#이름</code>처럼 입력하면 됩니다."""

[[howto]]
title = "반대편에서는: 먼저 동의, 그다음 노크."
body = """
 링크를 연 사람은 누군가 공유
      중임을 알게 되고, 직접 연결은 서로의 네트워크 주소를 보여 준다는
      경고를 받으며, 스스로 선택할 때에만 연결합니다. 비공개 공유라면
      자기소개를 하고 당신을 기다립니다. 받은 내용은 당신이 고치는 대로
      실시간으로 바뀌고, 탭을 닫으면 사라집니다."""

[[faq]]
q = "무엇이든, 어디로든 업로드되나요?"
a = """
        아니요. 텍스트와 파일은 암호화된 WebRTC 채널로 당신의 브라우저에서
        읽는 사람 각각의 브라우저로 곧장 갑니다. 관여하는 유일한 서버는
        소개만 나릅니다 &mdash; 연결 협상 몇 킬로바이트 &mdash; 내용은
        결코 나르지 않습니다. 그 서버에는 유출되거나 압수되거나 잃어버릴
        것이 없습니다. 당신의 바이트를 단 하나도 쥐지 않고, 연결을 끊는
        순간 방은 사라집니다."""

[[faq]]
q = "그런데 왜 이 도구는 하필 이 사이트에서 서버와 통신하나요?"
a = """
        브라우저 둘은 스스로 서로를 찾을 수 없기 때문입니다. 무언가가
        <code>brave-otter-42</code>를 입력한 사람과 그 이름으로 공유 중인
        사람을 만나게 하고, 연결 제안을 둘 사이에 날라야 합니다. 그
        무언가가 중개자입니다. 이 페이지의 유일한 네트워크 의존성으로,
        <code>Content-Security-Policy</code>에 이름이 있고 페이지와 같은
        저장소에 공개되어 있습니다. 그 일을 해낼 수 있는 가장 작은
        서버입니다. 아무것도 저장하지 않고, 아무것도 읽지 않으며, 두
        브라우저가 직접 채널을 쥐는 순간 물러납니다."""

[[faq]]
q = "그 서버가 정확히 무엇을 볼 수 있나요?"
a = """
        어떤 링크 이름이 사용 중이라는 것, 공유하는 쪽과 읽는 쪽이 언제
        연결하고 떠나는지, 그들의 IP 주소, 그리고 서로 주고받는 암호화
        연결 설정. 텍스트는 못 보고, 파일도, 그 이름과 크기도, 비공개
        공유에 누가 들어갔는지도, 자기소개에 누가 무엇을 썼는지도 못
        봅니다 &mdash; 그 모두는 서버를 지나가지 않는, 종단 간 암호화된
        직접 채널로 갑니다. 서버를 운영하는 Cloudflare는 각 연결의 기록을 7일간 보관합니다. 링크 이름, 주소,
        시각입니다. 그 밖에 공유가 끝난 뒤 남는 것은 없습니다."""

[[faq]]
q = "탭을 닫으면 어떻게 되나요?"
a = """
        공유가 모든 곳에서 동시에 끝납니다. 링크는 한두 초 안에 작동을
        멈추고, 페이지를 아직 열어 둔 사람들은 공유가 끝났다는 안내와 함께
        자기 사본이 사라지는 것을 봅니다. 서버에 삭제를 요청하는 것이
        아닙니다 &mdash; 삭제할 서버 사본이 없습니다. 공유가 존재하던
        유일한 곳이 그 탭이었고, 탭을 닫는 것이 정리의 전부입니다."""

[[faq]]
q = "읽는 사람이 내가 공유한 것을 가질 수 있나요?"
a = """
        공유가 열려 있는 동안에는, 네 &mdash; 공유란 그런 것입니다. 읽는
        사람은 텍스트를 복사하거나 파일을 내려받을 수 있고, 가져간 것은 그
        사람의 것입니다. 다른 어떤 방법으로 건네줬어도 마찬가지였을
        것처럼요. 끝내기가 보장하는 것은 미래입니다. 새로 오는 사람은 닿을
        수 없고, 열린 페이지는 더 이상 보여 주지 않습니다. 이미 도착한
        것을 되돌릴 수 있는 도구는 없고, 이 페이지는 그런 척하지
        않습니다."""

[[faq]]
q = "비공개 모드란 무엇인가요?"
a = """
        기본값입니다. 도착하는 읽는 사람마다 공유가 비공개라는 안내와 함께
        자기소개를 요청받습니다. 당신은 그 메시지를 &mdash; &ldquo;나야,
        스탠드업의 앨리스&rdquo; &mdash; 읽게 하거나 돌려보내는 버튼과
        함께 보고, 결정하기 전에는 아무것도 전송되지 않습니다. 소개는 이미
        암호화된 직접 채널로 가므로, 누가 노크했는지도 당신이 무엇을
        결정했는지도 서버는 영영 모릅니다. 공유 전에 체크를 끄면 공개
        공유가 됩니다."""

[[faq]]
q = "읽는 사람이 왜 내 IP 주소를 보게 되나요?"
a = """
        연결이 정말로 직접적이기 때문입니다. 직접 연결은 두 주소 사이를
        달리고, 전화 통화가 그렇듯 양 끝은 필연적으로 서로의 주소를 알게
        됩니다. 읽는 사람은 어떤 연결도 생기기 전에 경고를 받고 스스로
        선택할 때에만 연결합니다. 그때까지 당신은 그가 링크를 열었다는
        것조차 모릅니다. 이 교환이 어떤 공유에는 맞지 않는다면, 대안은
        서버를 거쳐 중계하는 서비스입니다 &mdash; 반대의 교환과
        함께요."""

[[faq]]
q = "파일은 얼마나 클 수 있고, 얼마나 빠른가요?"
a = """
        파일당 200&nbsp;MB까지, 종류는 무엇이든, 속도는 두 연결 중 느린
        쪽만큼입니다 &mdash; 중간에 늦추거나 계량하는 서버가 없습니다.
        같은 와이파이의 두 기기는 로컬 네트워크 속도로 전송하고, 바이트는
        건물을 떠나지 않습니다. 읽는 사람은 파일을 요청할 때마다 받아
        가므로, 큰 것을 첨부해도 누군가 정말로 원하기 전까지는 아무 비용이
        들지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        솔직히 말하면 절반만요. 편집기는 됩니다 &mdash; 페이지가 열리고,
        초안이 있고, 마크다운이 렌더링되고, 쓰고 저장하는 데는 네트워크가
        전혀 필요 없습니다. 공유는 안 되고, 될 수도 없습니다. 다른 사람의
        브라우저에 닿는 것은 네트워크 행위이고, 소개에는 중개자가
        필요합니다. 이 사이트에서 오프라인으로는 임무 자체가 불가능한
        유일한 도구이며, 다르게 암시한다면 정직하지 못한 일입니다."""

[[faq]]
q = "연결이 안 되면요?"
a = """
        브라우저 쌍 대부분은 소개만 받으면 직접 닿습니다. 소수는 닿지 못하는데, 보통 한쪽이 이동통신사의 주소 공유 네트워크에
        있거나 엄격한 회사망 뒤에 있을 때입니다. 이 페이지는 결코 몰래 중계로 넘어가지 않습니다 &mdash; 그것은 이 도구가
        무엇인지를 말없이 바꿔 버리는 일이니까요. 20초 뒤에 직접 연결이 이루어지지 않았다고 분명하게 말하고, 읽는 사람에게
        중계를 하나 제안합니다. Cloudflare가 운영하는 중계로, 두 브라우저 사이에서 암호화된 바이트를 전달만 하고 읽지는
        못합니다. 키가 두 끝을 떠나는 일이 없기 때문입니다. 읽는 사람은 중계가 무엇을 보는지 &mdash; 직접 연결이 그랬을
        것처럼 두 주소 &mdash; 를 들은 뒤 자기 페이지에서 직접 고르며, 거기에도 저장되는 것은 없습니다. 당신 쪽은
        달라지지 않습니다. 읽는 사람이 VPN 뒤에 있을 때와 마찬가지로, 당신의 브라우저는 여전히 그 한 사람에게만 보냅니다."""

[[faq]]
q = "누구나 무엇이든 공유할 수 있다면, 마크다운 렌더링은 안전한가요?"
a = """
        그 질문이 바로 렌더러가 라이브러리가 아니라 이 페이지 소스의 여든
        줄인 이유입니다. 어떤 태그를 내보내기 전에 모든 문자가
        이스케이프되고, 무해한 태그의 고정된 집합만 만들어질 수 있으며,
        링크는 <code>http</code>, <code>https</code>,
        <code>mailto</code>만 받습니다 &mdash; <code>javascript:</code>
        링크는 죽은 텍스트로 남습니다. 누가 썼든 공유된 텍스트는 당신의
        기기에서 스크립트가 될 수 없고, 그 여든 줄은 직접 읽어 볼 수
        있습니다."""

[[faq]]
q = "두 사람이 같은 이름으로 공유할 수 있나요?"
a = """
        동시에는 안 됩니다. 이름마다 살아 있는 공유 하나, 중개자에서
        강제됩니다. 두 번째로 온 사람은 거절되고 다른 이름을 고르라는
        안내를 받습니다. 공유가 끝나는 순간 이름은 다시 비워지는데, 이는
        저장해 둔 링크가 그 뒤의 공유만큼만 신선하다는 뜻이기도 합니다.
        같은 이름이 다음 주에는 다른 사람의 것일 수 있습니다. 링크는
        사람의 것이 아니라 순간의 것으로 대하세요."""

[[faq]]
q = "무료인가요? 계정이 필요한가요?"
a = """
        무료입니다. 계정도, 가입도 없고, 언급할 만한 제한도 없습니다
        &mdash; 공유당 동시 열여섯 명까지 읽을 수 있습니다. 사이트에는
        광고가 실리고, 그것이 비용을 댑니다. 광고는 이 페이지가 공유하는
        것에 관해 아무것도 받지 못하며, 중개자는 아무것도 저장하지 않고
        거의 아무 일도 하지 않기에 무료 요금제에 넉넉히 들어갑니다."""

