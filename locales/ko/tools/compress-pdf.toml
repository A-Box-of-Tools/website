tagline = "문서를 어디에도 보내지 않고 가볍게 만듭니다."

title = "PDF 용량 줄이기 &mdash; 무료, 브라우저에서, 업로드 없이"
description = "PDF를 업로드하지 않고 작게 만듭니다. 파일을 읽고 다시 압축하고 새로 쓰는 일을 전부 여러분의 브라우저가 합니다. 그리고 손대기 전에 용량이 실제로 어디에 쏠려 있는지 먼저 보여 줍니다."
og_title = "PDF 압축 &mdash; 무료, 아무것도 업로드하지 않습니다"
og_description = "PDF를 여러분의 기기에서 가볍게 만듭니다. 각 이미지가 지면에 얼마나 크게 그려지는지를 재기 때문에, 아무도 볼 수 없는 픽셀만 버립니다."
og_image_alt = "PDF 압축 - 업로드 없이 문서를 가볍게"

pledge = """
    문서를 열고 뜯어내고 다시 쓰는 일은 모두 이 기기의 메모리 안에서, 이
    주소에서 받아 온 코드가 합니다. 여기에는 업로드를 할 수 있는 것이 없고,
    이 페이지 반대편에 그것을 받을 서버도 없습니다."""

live_hint = """
      그냥 믿지 마시고 확인해 보세요. 개발자 도구를 열고 네트워크 탭을 켠 채로
      파일을 압축해 보십시오. 페이지도, 사진도, 파일명도 실려 나가는 요청이
      없습니다. 아니면 인터넷을 끊고 그냥 압축해 보세요."""

read_first = """
, 읽고 다시 쓰는 과정 전부는
      <code>src/reader.js</code>와 <code>src/writer.js</code>에 있습니다.
      둘 다 네트워크에는 닿지 못합니다."""

howto_heading = "PDF를 작게 만드는 방법"

card = """
            문서 안의 이미지를 다시 압축해 용량을 줄입니다. 먼저 용량이
            실제로 어디에 있는지 보여 주고, 건질 것이 없을 때는 없다고
            분명히 말합니다."""

[words]
plural = "PDF 파일"
choose = "PDF 파일"

[[facts]]
text = "업로드 없음"

[[facts]]
text = "가입 없음"

[[facts]]
text = "오프라인 동작"

[[facts]]
text = "오픈 소스"

[[facts]]
text = "파일은 기기에 그대로"

[[privacy]]
title = "여러분의 문서는 나갈 곳이 없습니다."
body = """
 이 페이지가 연결할 수 있는
      주소는 Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트의 것은
      하나도 없습니다. 이 도구는 그 목록에 아무것도 더하지 않습니다. 선택
      기능으로도 네트워크 기능이 없습니다. 파일이 모일 만한 수신 지점이 없고,
      설령 있더라도 그것을 보낼 코드가 없습니다."""

[[privacy]]
title = "형식 전체가 이 저장소 안에 있습니다."
body = """
 PDF는 객체의 목록과 각
      객체가 어디서 시작하는지 적은 표입니다. <code>src/objects.js</code>가 그
      문법을 읽고, <code>src/reader.js</code>가 표를 따라가고,
      <code>src/writer.js</code>가 새 표를 씁니다. 셋 중 어느 것도 요청을 보낼
      수 있는 무언가를 가져오지 않습니다. 라이브러리를 내려받지 않고, 서버에서
      그려 오는 것도 없습니다."""

[[privacy]]
title = "암호가 걸린 파일은 열지 않고 돌려보냅니다."
body = """

      암호가 걸린 PDF는 거부합니다. 스캐너가 빈 암호로 만들어 기술적으로는
      열리는 종류까지 포함해서요. 문서의 보호를 벗기는 일은 문서를 작게 만드는
      일과 다른 일이고, 그것을 말없이 해 버리는 도구는 놀라운 도구입니다."""

[[privacy]]
title = "무언가를 넣는 게 아니라 빼냅니다."
body = """
 완성된 파일에는 생성 날짜도,
      제작 프로그램 줄도, 이것을 만든 도구의 이름도 들어가지 않습니다. 해당
      항목을 켜면 XMP 패킷과 편집 프로그램이 남긴 비공개 블록까지 사라집니다
      &mdash; EXIF 도구가 하는 것과 같은 이야기를, 다른 컨테이너에 적용한
      것입니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글이 받지 못하는 것."
body = """
 광고와 측정
      스크립트는 구글에서 옵니다. 어느 쪽에도 여러분의 문서에 관한 것은
      넘어가지 않습니다. 파일도, 페이지도, 이름도, 용량도, 쪽수도요. PDF를 읽고
      디코딩하고 쓰는 코드는 한 줄도 빠짐없이 이 출처에서 제공되고 저장소에
      공개되어 있습니다."""

[[privacy]]
title = "후원 버튼이 불러오는 것과, 그것이 받지 못하는 것."
body = """

      헤더의 "Buy me a coffee" 버튼은 cdnjs.buymeacoffee.com의 스크립트가
      그리고 글꼴은 Google Fonts에서 가져옵니다. 그저 링크일 뿐입니다. 방문을
      보고하지 않고, 여러분이나 여러분의 문서에 관한 것을 받지도 않습니다.
      누르지 않으면 아무 일도 일어나지 않고, 눌러서 가게 되는 곳은 남의
      사이트입니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 이 페이지의 모든 기능이
      그대로 돌아갑니다. 가장 간단한 증거입니다. 문서를 어딘가로 보내 압축하는
      도구라면 그 자리에서 멈출 테니까요."""

[[howto]]
title = "PDF를 고릅니다."
body = """
 선택 영역에 끌어다 놓거나 직접 골라
      주세요. 브라우저가 디스크에서 곧바로 읽습니다. 그동안 어디로도 아무것도
      전송되지 않습니다."""

[[howto]]
title = "용량이 어디에 있는지 봅니다."
body = """
 두 번째 단계의 요점이 이
      분석입니다. 막대가 대부분 이미지라면 이 도구가 손댈 것이 있습니다. 대부분
      글꼴과 페이지 내용이라면 그렇다고 말해 줄 것이고, 정직한 절감폭은 몇
      퍼센트입니다 &mdash; 1분을 쓰기 전에 알아 두는 편이 낫습니다."""

[[howto]]
title = "얼마나 세게 짤지 정합니다."
body = """
 이름 붙은 설정들은 막연한
      등급이 아니라 해상도입니다. 화면에서 읽을 용도면 96 DPI, 메일로 보낼
      용도면 130, 그래도 인쇄해야 한다면 220. 각 값은 그 이미지가 지면에 실제로
      얼마나 크게 그려지는지를 기준으로 잽니다. 그래서 작게 넣은 사진이
      전면 스캔과 같은 취급을 받지 않습니다."""

[[howto]]
title = "압축하고, 검사했다고 적힌 줄을 확인합니다."
body = """

      다시 쓰기가 끝나면 완성된 파일을 이 페이지의 같은 리더가 다시 열어
      쪽수를 셉니다. 그 수가 원본과 다르면 실패로 보고하고 내려받기를
      제공하지 않습니다."""

[[faq]]
q = "제 PDF가 어딘가로 업로드되나요?"
a = """
        아닙니다. 파일을 읽고 다시 압축하고 쓰는 것은 여러분의 기기에서 도는
        여러분의 브라우저입니다. 이 도구에는 서버 쪽이 없고, 이 페이지의
        <code>Content-Security-Policy</code>가 연결 가능한 주소를 전부 적어
        두는데 &mdash; 그중 이 사이트의 것은 없습니다. 선택 기능으로도 네트워크
        기능이 아예 없습니다."""

[[faq]]
q = "제 PDF는 얼마나 작아지나요?"
a = """
        안에 무엇이 들었느냐에 전적으로 달렸습니다. 그래서 도구가 무엇이든
        압축하기 전에 먼저 재서 보여 주는 것입니다. 스캔한 문서는 거의 전부가
        사진이라 흔히 60&ndash;90% 작아집니다. 계약서나 논문은 글자와 벡터
        도형과 내장 글꼴인데, 전부 그것을 만든 프로그램이 이미 압축해 둔
        것들입니다. 이런 파일에서 절감폭은 보통 몇 퍼센트이고, 파일을 다시
        묶고 더 이상 참조되지 않는 것을 버려서 얻습니다. 파일을 보지도 않고
        몇 퍼센트를 약속하는 도구는 찍는 것입니다."""

[[faq]]
q = "PDF를 압축하면 품질이 떨어지나요?"
a = """
        안에 든 이미지는 다시 인코딩되니 그 부분은 떨어집니다. 나머지는 손대지
        않습니다. 글자는 글자로 남아 선택도 검색도 되고, 글꼴은 통째로
        보존되며, 벡터 도형은 그대로 복사됩니다. 게다가 도구는 아무 이득 없이
        이미지를 망가뜨리지 않습니다 &mdash; 다시 인코딩한 결과가 원본보다
        작지 않으면 원본 바이트를 그대로 문서에 되돌려 놓습니다."""

[[faq]]
q = "여기서 DPI가 무엇이고, 왜 물어보나요?"
a = """
        PDF에는 각 이미지가 지면에 얼마나 크게 그려지는지가 기록되어 있어서,
        도구가 실효 해상도를 계산할 수 있습니다. 4000픽셀짜리 스캔을 종이 8인치
        폭에 놓았다면 인치당 500픽셀을 싣고 있는 셈입니다. 화면에서는 그만큼을
        쓸 수 없고 종이에서도 거의 못 씁니다. 그래서 여러분이 고른 값을 넘는
        픽셀부터 버립니다 &mdash; 아무도 볼 수 없는 품질에 값을 치르고 있으니까요.
        작게 놓인 로고가 전면 스캔과 다르게 다뤄지는 것도 이 측정 덕분입니다."""

[[faq]]
q = "암호가 걸린 PDF도 열 수 있나요?"
a = """
        열지 않습니다. 일부러 그렇게 했습니다. 암호화된 문서는 그렇다는 메시지와
        함께 거부합니다. 암호가 비어 있을 때도 마찬가지인데 &mdash; 많은
        스캐너와 복합기가 그렇게 저장합니다. 파일의 보호를 벗기는 일은 압축하는
        일과 다른 일이고, 그것을 말없이 해 버리는 도구는 여러분이 부탁하지 않은
        일을 하는 것입니다."""

[[faq]]
q = "압축되지 않는 PDF도 있나요?"
a = """
        안에 든 일부 이미지는 그렇습니다. JPEG 2000, JBIG2, 팩스 코딩(CCITT)
        이미지는 어느 브라우저에도 디코더가 없어서 손대지 않고 통과시키고 그
        사실을 알려 드립니다 &mdash; 뒤의 둘은 흑백 2치 코덱이라 대개 이미 가장
        작은 상태에 가깝습니다. CMYK 이미지도 그대로 둡니다. 다시 인코딩하면
        인쇄기가 뽑을 색이 틀어질 위험이 있기 때문입니다. 도구가 건너뛴 것은
        전부 결과에 이유와 함께 적힙니다."""

[[faq]]
q = "압축한 파일이 어디서나 열리나요?"
a = """
        열립니다. 결과는 PDF 1.5로 쓰는데, 2003년 이후에 나온 모든 리더가
        이해하는 버전입니다. 게다가 도구가 여러분의 기기에서 그것을 증명합니다.
        완성된 파일을 다시 열어 쪽수를 센 다음에야 여러분에게 건넵니다. 양식,
        링크, 북마크, 접근성 구조, 첨부된 파일은 모두 그대로 옮겨집니다. 남겨
        두고 오는 것은 문서 안의 어떤 것도 더 이상 참조하지 않는 자료뿐입니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고, 계정도 로그인도 체험판도 없습니다. 파일 용량 제한도 여러분
        기기의 메모리가 허락하는 선까지입니다. 이 사이트는 광고로 유지되는데,
        그 광고에도 여러분의 문서에 관한 것은 넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다.
        아무것도 업로드되지 않는다는 가장 간단한 증명이기도 합니다. 문서를
        어딘가로 보내 압축하는 도구라면 선을 뽑는 순간 멈춰 버릴 테니까요."""

[schema]
description = "브라우저에서 PDF를 압축합니다. 이미지는 지면에 실제로 그려지는 크기를 기준으로 다시 압축되고, 문서는 로컬에서 새로 쓰입니다. 파일이 업로드되는 일은 없습니다."
features = [
  "무엇이든 압축하기 전에 문서의 용량이 실제로 어디에 있는지 보여 줍니다",
  "지면에서 측정한 해상도를 기준으로 이미지를 다시 압축합니다",
  "다시 인코딩해도 작아지지 않는 이미지는 그대로 둡니다",
  "이전 편집이 남긴 객체와, 원한다면 메타데이터까지 버립니다",
  "완성된 파일을 다시 열어 확인한 뒤에야 건넵니다",
  "오프라인 동작. 업로드 없음, 가입 없음, 용량 제한 없음",
]

[picker]
title = "여기에 PDF를 놓으세요"
hint = "또는 눌러서 고르기 &mdash; 한 번에 문서 하나"
