    도구에는 네트워크 기능이 아예 없어서 무언가를 가져올 수도 보낼 수도 없습니다.
    설령 있더라도 이 페이지 반대편에는 녹음을 받아 줄 서버가 없습니다."""

live_hint = """
      그냥 믿지 마시고 직접 확인해 보세요. 개발자 도구의 '네트워크' 탭을 켜 놓고
      무언가를 거꾸로 돌려 보십시오. 샘플도, 파일 이름도, 고른 파일의 단 1바이트도
      실려 나가는 요청이 없습니다. 아니면 인터넷을 끊고 그냥 편집해 보셔도 됩니다.
      오디오를 어딘가로 보내서 처리하는 도구라면 그대로 멈출 테니까요."""

read_first = """
, 파일을 브라우저 자체 디코더에 넘기는
      스무 줄은 <code>src/decode.js</code>, 타임 스트레처는
      <code>src/stretch.js</code>, 리샘플러는 <code>src/speed.js</code>, 샘플 앞에
      붙는 헤더는 <code>src/wav.js</code>에 있습니다. 어느 것도 요청을 보낼 수
      있는 무언가를 불러오지 않습니다."""

howto_heading = "오디오 파일을 편집하는 방법"

card = """
            음원을 거꾸로 돌리고, 음정을 붙들거나 함께 움직이며 배속을 바꾸고,
            작게 녹음된 소리를 키웁니다. 동영상에서 소리만 뽑아내는 것도
            됩니다."""

[words]
plural = "녹음 파일은"
choose = "파일을"

[[facts]]
text = "업로드 없음"

[[facts]]
text = "가입 없음"

[[facts]]
text = "워터마크 없음"

[[facts]]
text = "영상 넣고 소리 받기"

[[facts]]
text = "오프라인 동작"

[[privacy]]
title = "녹음 파일은 나갈 곳이 없습니다."
body = """
 이 페이지가 연결해도 되는 주소는
      Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트 것은 하나도
      없습니다. 파일이 모일 만한 수신 지점이 없고, 설령 있더라도 거기로 파일을
      보낼 코드가 없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 이 도구에는 네트워크 기능이 아예
      없습니다. 붙여 넣을 주소도, 내려받을 것도, 처음 쓸 때 가져오는 엔진도
      없어요. 내 오디오에 닿는 모든 바이트는 페이지를 불러올 때 이 출처에서 온
      것입니다."""

[[privacy]]
title = "디코더는 브라우저에 이미 들어 있는 그것입니다."
body = """

      파일은 <code>decodeAudioData</code>에 넘어갑니다.
      <code>&lt;audio&gt;</code> 요소가 음원을 재생할 때 쓰는 바로 그 코드예요.
      내 파일 형식을 읽겠다고 여기서 무언가를 들여오지도 않고, 읽어 달라고 이
      페이지 밖의 무언가에 부탁하지도 않습니다."""

[[privacy]]
title = "동영상의 화면은 애초에 디코딩되지 않습니다."
body = """
 동영상을 넣으면 오디오
      트랙만 요청합니다. 프레임은 읽히지도, 디코딩되지도, 그려지지도, 들여다보이지도
      않습니다. 이 페이지에는 그럴 수 있는 코드가 없고, 나오는 파일에는 소리 말고
      아무것도 들어 있지 않습니다."""

[[privacy]]
title = "샘플은 다시 인코딩되지 않고 그대로 적힙니다."
body = """

      WAV는 이 페이지가 계산한 샘플 앞에 헤더를 붙인 것입니다. 중간에서 내 녹음을
      두고 판단을 내리는 인코더가 없고, 그런 일이 벌어질 만한 업로드라고 부를
      것도 없습니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서
      옵니다. 어느 쪽에도 내 녹음에 관한 것은 넘어가지 않습니다. 파일도, 샘플도,
      이름도, 용량도, 길이도, 얼마나 컸는지도요. 읽고 편집하고 쓰는 코드는 한 줄도
      빠짐없이 이 출처에서 제공되고 저장소에 공개되어 있습니다."""

[[privacy]]
title = "후원 버튼이 불러오는 것과, 후원 버튼이 받지 못하는 것."
body = """

      헤더의 \"Buy me a coffee\" 버튼은 cdnjs.buymeacoffee.com의 스크립트가
      그리고, 글꼴은 Google Fonts에서 가져옵니다. 그저 링크일 뿐이에요. 방문을
      보고하지도, 나에 관한 것이나 내 파일에 관한 것을 받아 가지도 않습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 이 페이지의 기능이
      전부 그대로 돌아갑니다. 가장 간단한 증거입니다."""

[[howto]]
title = "파일을 고릅니다."
body = """
 MP3, WAV, FLAC, M4A, Ogg, Opus 파일을
      선택 영역에 끌어다 놓으세요. 필요한 것이 영상 속 소리라면 동영상을 놓아도
      됩니다. 브라우저가 디스크에서 곧바로 읽고, 그동안 어디로도 아무것도 나가지
      않습니다."""

[[howto]]
title = "그것 때문에 오셨다면, 거꾸로 돌립니다."
body = """
 체크박스 하나입니다. 샘플을
      마지막 것부터 차례로 적어 내는데, 이건 완전히 되돌릴 수 있습니다. 두 번
      하면 샘플 하나까지 처음 파일 그대로 돌아옵니다."""

[[howto]]
title = "배속을 정합니다."
body = """
 슬라이더를 끌거나, 배수를 입력하거나,
      미리 준비된 버튼을 누르세요. 그다음 음정을 어떻게 할지 고릅니다. 있던 자리에
      붙들어 두면 1.5배속으로 듣는 강의에 알맞고, 배속과 함께 움직이게 두면
      테이프가 하던 대로 목소리가 높아지거나 낮아집니다."""

[[howto]]
title = "음량을 정합니다."
body = """
 데시벨로 변화량을 지정하거나, 가장
      큰 순간이 천장 바로 아래에 놓일 때까지 올려 달라고 하면 됩니다. 그 순간이
      어디에 놓일지는 아무것도 누르기 전에 페이지가 알려 주고, 고른 설정이 그것을
      최대치 너머로 밀어낼 것 같으면 미리 경고합니다."""

[[howto]]
title = "저장합니다."
body = """
 작업이 내 기기에서 일어나므로, 걸리는
      시간은 대기열이 아니라 기기 성능에 달려 있습니다. 나오는 것은 WAV, 그러니까
      샘플 앞에 헤더만 붙인 파일입니다. 페이지에서 먼저 들어 본 다음 브라우저의
      다운로드로 바로 넘어갑니다."""

[[faq]]
q = "제 오디오가 어딘가로 업로드되나요?"
a = """
        아닙니다. 읽고 편집하고 쓰는 일은 내 기기에서 도는 내 브라우저가 합니다.
        이 도구에는 서버 쪽이라는 것이 없고, 이 페이지의
        <code>Content-Security-Policy</code>에 연결해도 되는 주소가 전부 적혀
        있는데 그중 이 사이트 것은 하나도 없습니다. 말로 듣기보다 직접 확인하고
        싶다면, 인터넷을 끊고 그냥 음원을 거꾸로 돌려 보세요."""

[[faq]]
q = "동영상에서 소리만 뽑을 수 있나요?"
a = """
        됩니다. 여기서는 MP3를 여는 것과 똑같은 일입니다. MP4, MOV, WebM을 넣으면
        오디오 트랙만 디코딩됩니다. 화면은 아예 읽지 않고, 나오는 것은 영상이
        들어 있지 않은 소리 파일입니다.
        원하시는 것이 그것뿐이라면 &mdash; 소리를, 그대로 &mdash; <a href="../동영상-오디오-추출/">동영상에서
        오디오 추출</a>이 다른 것은 아무것도 없는 페이지에서 같은 일을 합니다. 소리도 손봐야 할 때 이리로 돌아오세요."""

[[faq]]
q = "배속을 바꾸면 음정도 바뀌나요?"
a = """
        그렇게 해 달라고 할 때만 바뀝니다. \"음정 유지\"는 녹음을 50밀리초쯤 되는
        겹치는 창으로 잘라, 파형이 만나는 지점이 맞아떨어지는 자리를 골라 더
        촘촘하게 또는 더 성기게 다시 놓습니다. 그래서 1.5배속에서도 목소리는 같은
        목소리로 남습니다. \"함께 움직이게\"는 대신 리샘플링을 하는데, 테이프를
        빨리 감을 때 벌어지는 일과 같습니다. 2배속은 정확히 한 옥타브 위고요."""

[[faq]]
q = "왜 MP3가 아니라 WAV로 저장하나요?"
a = """
        MP3 인코더를 갖고 있는 브라우저가 없고, 그렇다고 인코더가 있는 서버로 내
        녹음을 보내는 일은 이 도구가 하지 않기 때문입니다. WAV는 인코더가 아예
        필요 없습니다. 샘플 앞에 44바이트 헤더를 붙인 것이니까요. 그래서 정직한
        선택이자 품질을 깎을 수 없는 유일한 선택입니다. 대신 큽니다. 스테레오로
        1분에 10메가바이트쯤 되니까요. 어떤 플레이어도, 휴대폰도, 편집기도 WAV를
        열고, MP3가 필요한 프로그램이라면 이걸로 MP3를 만들 수 있습니다."""

[[faq]]
q = "어떤 형식을 열 수 있나요?"
a = """
        브라우저가 디코딩하는 것은 다 됩니다. 실제로는 MP3, WAV, FLAC, M4A와 AAC,
        Ogg Vorbis와 Opus, 그리고 MP4, M4V, MOV, WebM 동영상 안의 오디오입니다.
        빠지는 것은 다른 곳과 같은 짧은 목록, AVI와 WMA와 대부분의 MKV입니다. 이
        브라우저가 읽지 못하는 파일은 중간에 실패하는 대신 그렇다는 메시지와 함께
        거부합니다."""

[[faq]]
q = "소리를 키우면 찌그러지나요?"
a = """
        최대치를 넘길 때만 그렇고, 넘기기 전에 페이지가 알려 줍니다. 디지털
        오디오에는 딱딱한 천장이 있습니다. 샘플은 최대치보다 커질 수 없어서, 그
        위의 것은 천장에 눌려 납작해집니다. 그게 찌그러짐이에요. \"최대한 크게\"는
        그런 일이 일어날 수 없는 설정입니다. 녹음에 남은 여유를 계산해 딱 그만큼만
        쓰니까요. 천장 아래에서는 그저 곱셈일 뿐이라, 6 dB 올렸다가 6 dB 내리면
        샘플은 시작한 자리로 돌아옵니다."""

[[faq]]
q = "거꾸로 돌리거나 배속을 바꾸면 품질이 떨어지나요?"
a = """
        거꾸로 돌리는 것은 떨어지지 않습니다. 같은 샘플이 반대 순서로 나올 뿐이고,
        이건 정확합니다. 배속을 바꾸는 것은 모든 샘플을 옮기는 일이라 복사가 아니라
        계산입니다. 그래도 리샘플러가 지나가면서 제대로 필터링을 하기 때문에 빠르게
        감아도 높은 음이 금속성 울림으로 되접히지 않고, 스트레처의 창도 계산이
        떨어진 자리가 아니라 파형이 맞아떨어지는 자리에 놓입니다. 어느 쪽도 다시
        인코딩하지 않습니다. 다시 인코딩할 인코더가 여기에 없으니까요."""

[[faq]]
q = "파일 길이에 제한이 있나요?"
a = """
        도구에 정해 둔 제한은 없습니다. 현실적인 한계는 메모리입니다. 녹음 전체가
        한 번에 이 페이지로 디코딩되고 내려받기 전에 WAV가 메모리에서 조립되므로,
        스테레오 한 시간이면 1기가바이트에 조금 못 미치는 작업 공간이 필요합니다.
        4기가바이트짜리 WAV는 아예 거부합니다. 형식 자체의 크기 필드가 그런 파일을
        표현하지 못하니까요."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도, 워터마크도 없습니다. 이 사이트는
        광고로 유지되는데, 그 광고에도 내 녹음에 관한 것은 넘어가지 않습니다."""

[schema]
browser_requirements = "JavaScript와 Web Audio를 지원하는 브라우저가 필요한데, 요즘 브라우저는 전부 지원합니다. 파일을 재생하는 데 브라우저가 이미 갖춘 것 말고 따로 필요한 코덱은 없습니다."
description = "브라우저에서 음원을 거꾸로 돌리고, 음정을 붙들거나 함께 움직이며 배속을 바꾸고, 음량을 정합니다. 동영상 안의 오디오에도 됩니다. 아무것도 업로드되지 않고 결과는 WAV로 쓰이므로 다시 인코딩되는 것이 없습니다."
features = [
  "음원을 정확하게 거꾸로 재생합니다",
  "0.25배에서 4배까지 배속을 바꾸며, 음정은 붙들 수도 함께 옮길 수도 있습니다",
  "음량을 올리거나 내리고, 최대치 바로 아래로 노멀라이즈합니다",
