title = "오디오 거꾸로 재생, 배속 변경, 볼륨 키우기 &mdash; 무료, 업로드 없이"
description = "음원을 거꾸로 돌리고, 빠르거나 느리게 만들고, 작게 녹음된 소리를 키웁니다. 동영상에서 소리만 뽑아내는 것도 됩니다. 브라우저에서 돌아가고 아무것도 업로드하지 않습니다."
