[[privacy]]
title = "사진은 나갈 곳이 없습니다."
body = """
 이 페이지가 연결해도 되는 주소는
      Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트 것은 하나도
      없습니다. 파일이 모일 만한 수신 지점이 없고, 설령 있더라도 거기로 파일을
      보낼 코드가 없습니다."""

[[privacy]]
title = "디코더는 여기서 왔고, 어디로도 가지 않습니다."
body = """
 HEIC는 박스 형식에 담긴
      HEVC이고 Safari 말고는 어떤 브라우저도 디코딩하지 못합니다. 그래서 이
      페이지가 WebAssembly로 컴파일한 <code>libheif</code>를 싣고 옵니다. 1.4 MB쯤
      되고, 이 저장소에 커밋되어 있고, 이 출처에서 제공되며, 여기 다른 파일들과
      똑같이 서비스 워커가 캐시합니다. CDN에서 가져오지 않습니다. 그러면 모든
      방문 경로에 제삼자가 끼어들고 오프라인 동작도 멈추니까요. 바이너리를
      스크립트 옆이 아니라 안에 넣어 둔 것도 정확히 같은 이유입니다. 시작하는 데
      요청이 필요 없도록요."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 이 도구를 위해 쓴 파일
      어디에도 <code>fetch</code>도, <code>XMLHttpRequest</code>도,
      <code>sendBeacon</code>도 없습니다. 싣고 온 엔진에는 모든 Emscripten 빌드가
      그렇듯 <code>.wasm</code>을 주소에서 가져오는 로더 경로가 들어 있지만, 그
      길로는 가지 않습니다. 바이너리를 이미 손에 쥐고 있으니까요. 설령 간다 해도
      <code>connect-src</code>에는 구글의 측정 엔드포인트 말고 아무것도 적혀 있지
      않아 브라우저가 거부합니다. 증거는 약속이 아니라 정책입니다."""

[[privacy]]
title = "메타데이터는 여기서 읽어 화면에 보여 드립니다."
body = """
 페이지의 목록이 각 사진에
      무엇이 담겨 있는지 말해 줍니다. 날짜, 카메라, 그리고 GPS 좌표가 들어
      있는지까지요. JPEG를 누군가에게 건네기 전에 알고 싶은 것들이니까요. 그걸
      파일에서 읽는 것은 이 브라우저 안의 <code>src/boxes.js</code>이고, 결과는
      이 페이지에 표시되며, JPEG에 쓸지 뺄지는 전적으로 고르시기 나름입니다. 이
      저장소에는 파일 이름이나 날짜, 좌표, 개수를 실어 보내는 분석 이벤트가
      하나도 없습니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서,
      후원 버튼은 Buy Me a Coffee에서 옵니다. 어느 쪽에도 내 사진에 관한 것은
      넘어가지 않습니다. 파일을 읽고 디코딩하고 쓰는 코드는 한 줄도 빠짐없이 이
      출처에서 제공되고 저장소에 공개되어 있습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 페이지를 한 번 불러온 뒤 네트워크를
      끊어도 도구는 그대로입니다. 디코더도 함께 캐시되어 있으니까요. 가장 간단한
      증거이고, 이 사이트의 다른 어디보다 여기서 더 강한 증거입니다. 사진을
      어딘가로 보내서 디코딩하는 변환기라면 결코 해낼 수 없는 일이니까요."""

[[howto]]
title = "HEIC 사진을 고릅니다."
body = """
 휴대폰 백업이든 바탕화면 폴더든,
      선택 영역에 끌어다 놓거나 직접 골라 주세요. 브라우저가 디스크에서 읽고,
      그동안 어디로도 아무것도 나가지 않습니다. 목록에 각 파일이 무엇이고 안에
      무엇이 들었는지가 적힙니다."""

[[howto]]
title = "사진이 무엇을 담고 있는지 확인합니다."
body = """
 각 줄에 촬영 날짜와 카메라가
      적히고, 그 파일에 GPS 좌표가 들어 있는지는 눈에 띄라고 초록색으로 적힙니다.
      사진을 디코딩하지 않고 컨테이너에서 읽어 내므로 비용이 들지 않고 곧바로
      나타납니다."""

[[howto]]
title = "형식을 고르고, 세부 정보를 어떻게 할지 정합니다."
body = """
 특별한 이유가 없다면
      JPEG입니다. 어디서나 열리는 형식이고, 변환하는 목적도 바로 그것이니까요.
      화질 슬라이더는 92에 놓여 있는데, 사진을 원본과 구별하기 어려운
      설정입니다. 체크박스는 날짜와 카메라, 위치가 함께 갈지를 정합니다."""

[[howto]]
title = "\"변환\"을 누르고 내려받습니다."
body = """
 디코더는 첫 변환 때 1.4 MB쯤
      도착하고, 그것도 딱 한 번뿐입니다. 그 뒤로는 모든 사진이 내 기기에서
      디코딩되고 쓰입니다. 파일이 하나면 내려받기 버튼이, 여러 개면 zip도 함께
      나옵니다."""

[[faq]]
q = "제 사진이 어딘가로 업로드되나요?"
a = """
        아닙니다. 파일을 읽고 디코딩하고 쓰는 일은 내 기기에서 도는 내 브라우저가
        합니다. 이 도구에는 네트워크 기능이 하나도 없어서 무언가를 가져오지도,
        보내지도 않습니다. 이 페이지의 <code>Content-Security-Policy</code>에
        연결해도 되는 주소가 전부 적혀 있는데, 그중 이 사이트 것은 하나도
        없습니다. 실제로 불려 오는 것은 디코더 하나뿐이고, 그것도 이 사이트에서,
        한 번, 내 사진이 관여하기 전에 옵니다."""

[[faq]]
q = "이 페이지는 왜 처음에 1.4 MB를 내려받나요?"
a = """
        HEIC가 브라우저로 열 수 없는 유일한 사진 형식이기 때문입니다. 박스
        컨테이너에 담긴 HEVC 프레임이고, 애플 하드웨어의 Safari에만 디코더가
        있습니다. Chrome, Firefox, Edge는 그냥 거부합니다. 그래서 HEIC 변환기는
        어딘가에서 디코더를 구해야 하는데, 올 곳은 두 군데뿐입니다. 서버 아니면
        페이지. 다른 변환기는 전부 서버를 골랐고, 그래서 하나같이 사진을
        업로드받아야 합니다. 이 도구는 대신 WebAssembly로 컴파일한
        <code>libheif</code>를 싣고 다닙니다. 이 사이트에서 제공되고, 첫 방문
        이후에는 캐시되며, 사진이 아무 데도 가지 않는 대가는 그것이 전부입니다."""

[[faq]]
q = "JPEG에 날짜와 카메라, 위치가 남나요?"
a = """
        원하신다면 남고, 페이지의 체크박스로 정합니다. 켜 두면 EXIF 블록을
        HEIC에서 꺼내 휴대폰이 쓴 그대로 JPEG에 써 넣습니다. 그래서 변환한 사진이
        변환한 날이 아니라 찍은 날 기준으로 정렬됩니다. HEIC 변환기를 두고 가장
        흔히 나오는 불만이 바로 그거니까요. 딱 한 태그만 바뀝니다. 방향 태그를
        \"똑바로\"로 맞추는데, 회전이 이미 픽셀에 적용되어 있어서 뷰어가 한 번 더
        적용하면 세로 사진이 전부 옆으로 눕기 때문입니다. 체크박스를 끄면 JPEG에는
        사진 말고 아무것도 들어가지 않습니다."""

[[faq]]
q = "GPS 좌표를 지워 주나요?"
a = """
        좌표가 있다고 알려 드리고, 그다음은 시키시는 대로 합니다. 무엇을 변환하기
        전에 각 사진 줄에 좌표가 들어 있는지가 적히는데, 휴대폰도 그 정도는 해
        주지 않습니다. \"날짜, 카메라, 설정 유지\"를 끄면 나머지와 함께 좌표도
        JPEG에서 빠지고, 켜 두면 그대로 옮겨집니다. 태그를 자세히 들여다보거나
        이미 JPEG인 사진에서 태그를 지우고 싶다면
        <a href=\"../exif-정보-삭제/\">EXIF 확인 및 제거</a>가 그 일을 하는
        도구이고, 사진을 다시 압축하지 않고 해냅니다."""

[[faq]]
q = "사진이 다시 압축되나요?"
a = """
        됩니다. 그럴 수밖에 없습니다. HEIC와 JPEG는 다른 코덱이라, 사진을
        디코딩했다가 다시 인코딩하지 않고는 한쪽에서 다른 쪽으로 갈 방법이
        없습니다. 정하실 수 있는 것은 그 대가를 얼마로 할지입니다. 화질 슬라이더의
        기본값은 92인데, 사진을 원본과 구별하기가 아주 어려운 값입니다. 손실을
        전혀 원하지 않고 파일이 5~10배 커져도 괜찮다면 PNG도 고를 수 있습니다."""

[[faq]]
q = "이름은 .jpg인데 실은 HEIC라면요?"
a = """
        그래도 됩니다. 여기 놓인 파일은 이름이 아니라 첫 바이트로 판별합니다.
        이름은 그 파일을 마지막으로 만진 앱이 정한 것일 뿐이고, \".jpg\"라는 이름으로
        도착한 HEIC야말로 사람들이 이런 도구를 찾게 되는 가장 흔한 경로 가운데
        하나입니다. 진짜 JPEG나 PNG인 파일은 자기 자신의 사본으로 변환되는 대신
        그렇다는 메시지와 함께 거부됩니다."""

[[faq]]
q = "라이브 포토나 연사도 변환되나요?"
a = """
        그 안의 정지 사진은 됩니다. HEIC 하나에 사진이 여러 장 들어갈 수 있는데,
        들어 있는 것을 전부 변환하고 원본 이름 뒤에 번호를 붙여 이름 짓습니다.
        라이브 포토의 영상 쪽은 휴대폰이 HEIC 옆에 따로 두는 별개의 파일이라,
        여기 변환할 대상으로 들어오지 않습니다. 깊이 맵과 미리보기는 컨테이너 안에
        있지만 누가 달라고 한 사진이 아니므로 그대로 둡니다."""

[[faq]]
q = "제 AVIF는 왜 안 받나요?"
a = """
        할 일이 없기 때문입니다. AVIF는 HEIC와 같은 컨테이너에 HEVC 대신 AV1이
        들어간 것이고, 요즘 브라우저는 전부 그걸 자체적으로 디코딩합니다. 그러니
        변환기가 있지도 않은 문제를 풀겠다고 1메가바이트짜리 엔진을 싣고 다니는
        셈이 됩니다. AVIF를 JPEG로 만들어야 한다면
        <a href=\"../이미지-압축/\">이미지 압축</a>과
        <a href=\"../이미지-크기-조절/\">이미지 크기 조절</a>이 둘 다 브라우저가 이미
        가진 디코더로 AVIF를 읽고 JPEG로 씁니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도, 워터마크도 없습니다. 파일 개수나
        용량 제한도 없습니다. 그 값을 치를 서버가 없으니까요. 작업은 내 기기에서
        일어납니다. 이 사이트는 광고로 유지되는데, 그 광고에도 내 사진에 관한
        것은 넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 디코더까지 포함해서요. 페이지를 한 번 불러온 다음 인터넷을 끊어도
        사진 작업이 이전과 똑같이 이어집니다. 아무것도 업로드되지 않는다는 가장
        강력한 증명이기도 합니다. HEIC를 어딘가로 보내서 디코딩하는 변환기라면 선을
