name = "키 비교 차트"
heading = "키&nbsp;비교 <span class=\"h1-kw\">&mdash; 나란히 세워 내려받는 차트</span>"
tagline = "키를 적으면 그림을 가져갑니다. 그리려고 어디로도 보내지 않습니다."

title = "키 비교 차트 &mdash; 무료, 가입 없이, 업로드 없이"
description = "키를 나란히 비교하세요. 남성과 여성, 남자아이와 여자아이, 유아, 그리고 사물 &mdash; 문, 창문, 화이트보드, 자동판매기 &mdash; 을 센티미터나 피트·인치로 넣고, 차트를 PNG나 SVG로 내려받으세요. 그림은 브라우저에서 그려집니다."
og_title = "키를 나란히 비교하고 그림을 가져가세요"
og_description = "어른 둘과 아이 하나, 유아 하나, 그리고 출입문을 같은 눈금자 위에 세우세요. 센티미터로도 피트·인치로도 되고, 결과는 그대로 내려받습니다. 계정도 워터마크도 없고, 이름 목록이 기기를 떠나지도 않습니다."
og_image_alt = "키 비교 차트 - 키를 나란히 비교, 업로드 없이"

pledge = """
    키 차트는 산술과 그림입니다. 보낼 파일도 없고 물어볼 서비스도 없습니다. 남성과
    여성, 남자아이와 여자아이는 이 페이지와 함께 실려 오는 퍼블릭 도메인 그림이고,
    유아는 신체 비율 표를 바탕으로 여기서 만들어집니다. 그래서 작아진 어른이 아니라
    유아의 모습을 하고 있습니다. 그 모든 단계가 이 페이지의, 읽어 보실 수 있는 육백
    줄 남짓한 자바스크립트 안에서 일어납니다. 네트워크 기능은 어떤 종류도 없고, 그것이
    여기서 중요한 이유는 입력하시는 것이 사람들의 목록이고 각자의 키이기 때문입니다."""

live_hint = """
      말을 믿으실 필요는 없습니다. 개발자 도구를 열고 네트워크 탭을 보면서 이름과 키를
      적어 보세요. 어느 요청에도 둘 중 어느 것의 한 글자도 실리지 않습니다. 아니면
      인터넷을 끊고 그대로 차트를 만들어 보셔도 됩니다."""

read_first = """
, 네 개의 그려진 인물과 그 그림의 출처는
      <code>src/traced.js</code>와 <code>vendor/</code>를, 유아를 만들어 내는 비율 표는
      <code>src/figures.js</code>를, 적어 넣은 키가 어떻게 숫자가 되고 눈금자에 어떻게
      표시가 붙는지는 <code>src/units.js</code>를, 배치는 <code>src/chart.js</code>를,
      두 가지 내려받기는 <code>src/save.js</code>를 보세요. 뒤의 것은 화면에 있는 SVG와,
      바로 그 SVG를 캔버스에 그린 것입니다."""

howto_heading = "키 비교 차트를 만드는 방법"

card = """
            어른 둘과 아이 하나, 그리고 출입문을 같은 눈금자 위에 세우고 &mdash;
            센티미터로든 피트·인치로든 &mdash; PNG나 SVG로 내려받으세요."""

