[[privacy]]
title = "사람들의 목록은 넘겨주기에 가벼운 것이 아닙니다."
body = """
 키 차트는 대개
      계정을 요구하고, 요구하지 않는 것들도 적어 넣는 이름과 숫자를 전부 보는 서버가
      여전히 있습니다. 여기서 적어 넣으시는 것은 가족이 누구이고 각자 키가 얼마인지이며,
      이름 옆의 인물에서 아이의 나이까지 드러나는 일이 흔합니다. 그중 어느 것도 어디로도
      보내지지 않습니다. 여기에는 갈 곳이 없기 때문입니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 <code>src/</code> 어디에도
      <code>fetch</code>도, <code>XMLHttpRequest</code>도, <code>sendBeacon</code>도
      없습니다. Content-Security-Policy에는 이 페이지가 연결할 수 있는 모든 주소가 적혀
      있고, 그중 우리 것은 하나도 없습니다."""

[[privacy]]
title = "방문과 방문 사이에도 기억되는 것이 없습니다."
body = """
 차트는 페이지
      안에서만 살아 있습니다. 탭을 닫으면 목록은 사라집니다. 그것을 붙들고 있는 계정도,
      실어 나르는 쿠키도 없고, 이 브라우저의 저장소에 쓰이는 것도 없습니다 &mdash;
      간직하고 싶은 차트가 곧 내려받는 차트인 이유이기도 합니다."""

[[privacy]]
title = "링크는 차트를 실어 나르지 않습니다."
body = """
 이런 종류의 도구 여럿은
      공유할 수 있도록 목록 전체를 주소창에 넣습니다. 그러면 모든 이름과 모든 키가, 그
      링크가 지나가는 모든 것이 기록하는 무언가로 바뀝니다. 채팅 서버, 메일 검사기,
      누군가의 브라우저 기록 같은 것들 말입니다. 이 페이지의 주소는 입력하는 동안 한
      번도 바뀌지 않습니다."""

[[privacy]]
title = "PNG는 화면에 있는 SVG로 만듭니다."
body = """
 내려받는 것은 미리보기와
      어긋날 수 있는 두 번째 렌더링이 아닙니다. 같은 마크업을 브라우저에 넘겨 캔버스에
      그릴 뿐이고, 그래서 네트워크를 뽑아 둔 채로도 됩니다. 가져올 글꼴도, 안에 불러올
      이미지도 없기 때문입니다."""

[[privacy]]
title = "그림은 여기에 있고, 가져오는 것이 아닙니다."
body = """
 네 개의 그려진
      인물은 퍼블릭 도메인 그림이고, 페이지의 나머지와 함께 이 오리진에서 제공됩니다
      &mdash; 아이콘 글꼴도, CDN도, 입력하는 동안 남의 서버에서 끌어오는 스프라이트도
      없습니다. 네트워크를 뽑아도 차트가 그려지는 이유이기도 합니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에 주지 않는 것."
body = """
 광고와 측정
      스크립트는 구글에서, 후원 버튼은 Buy Me a Coffee에서 옵니다. 그 어느 쪽에도 이름
      하나 키 하나 건네지지 않습니다. 목록을 그림으로 바꾸는 모든 줄은 이 오리진에서
      제공되며 저장소에 올라 있습니다."""

[[privacy]]
title = "오프라인에서 동작합니다."
body = """
 네트워크를 끊어도 이 도구는 그대로입니다.
      애초에 네트워크 단계가 없었기 때문입니다. 가장 간단한 증명입니다."""

[[howto]]
title = "먼저 모두 넣고, 모양은 그다음에 신경 쓰세요."
body = """
 한 줄이 인물 하나,
      이름 하나, 키 하나, 색 하나입니다. 이름은 선택입니다 &mdash; 이름 없는 실루엣 둘에
      키만 위에 적힌 차트가 바로 원하시던 것인 경우도 많습니다 &mdash; 순서가 중요하면 각
      줄의 화살표로 왼쪽이나 오른쪽으로 옮기시면 됩니다."""

[[howto]]
title = "키는 평소 쓰시는 대로 적으세요."
body = """
 <code>173</code>,
      <code>1.73 m</code>, <code>5'8\"</code>, <code>68 in</code>,
      <code>5 ft 8</code> 모두 제대로 읽힙니다. 칸 아래 줄이 무엇으로 이해했는지를 두
      체계로 함께 보여 주므로, 잘못 읽힌 것은 인쇄한 뒤가 아니라 그려지기 전에 눈에
      띕니다. 단위 없는 숫자는 미터법 차트에서는 센티미터, 야드파운드법 차트에서는
      인치이고, 3보다 작은 맨 숫자는 미터입니다 &mdash; 키가 1.73 cm인 사람은
      없으니까요."""

[[howto]]
title = "그 사람에게 맞는 인물을 고르세요."
body = """
 두 살 아이는 머리 넷 반쯤,
      어른은 일곱 반쯤 되는 키입니다. 그래서 줄여 놓은 어른처럼 그려진 유아는 뭐라
      집어 말하기는 어렵지만 보면 바로 알 수 있게 어색합니다. 학령기에는 남자아이와
      여자아이가, 그 아래에는 유아가 있고, 저마다 어른을 줄인 것이 아니라 자기 비율을
      갖고 있습니다. 가족 차트가 가족처럼 보이는지는 대개 여기서 갈립니다."""

[[howto]]
title = "익숙한 것을 차트에 놓으세요."
body = """
 숫자는 추상적이고 출입문은 그렇지
      않습니다. 누구나 크기를 아는 물건 하나를 넣는 것 &mdash; 문, 창문, 교실 화이트보드,
      자동판매기 &mdash; 이 두 키를 말하기만 하던 차트를 그 키를 보여 주는 차트로
      바꿉니다. 메뉴에는 스무 가지가 묶음별로 들어 있고, 하나하나가 직접 숫자를 덮어쓸
      수 있는 평범한 줄로 들어옵니다. 사물은 높이 말고 너비도 받기 때문에, 문은 줄이
      아니라 203 곱하기 81입니다."""

[[howto]]
title = "읽는 사람이 익숙한 단위로 눈금자를 맞추세요."
body = """
 센티미터와 피트를
      오가는 것은 칸에 든 값을 다시 해석하는 것이 아니라 다시 쓰는 일입니다. 그래서
      차트 자체는 움직이지 않고 표기만 바뀝니다. 차트가 두 부류의 독자를 위한 것이라면,
      각 인물 위에 적히는 키는 차트의 단위로 나오고 각 칸 아래 줄에는 둘 다 나옵니다."""

[[howto]]
title = "붙여 넣을 때는 PNG, 인쇄할 때는 SVG."
body = """
 PNG는 설정하신 픽셀
      높이의 그림이고, 대화창이나 문서나 슬라이드가 원하는 것이 그것입니다. SVG는 차트를
      지시로 담고 있어서 어떤 크기로도 또렷하게 인쇄되고, 나중에 벡터를 여는 무엇으로든
      색을 다시 입힐 수 있습니다."""

[[faq]]
q = "제가 적은 것이 어딘가로 보내지나요?"
a = """
        아닙니다. 차트는 이 페이지의 자바스크립트가 사용자의 기기 위에서 그립니다. 이
        도구에는 네트워크 기능 자체가 없어서 무언가를 가져오지도, 보내지도 않습니다.
        페이지의 <code>Content-Security-Policy</code>에는 연결할 수 있는 모든 주소가 적혀
        있고 그중 우리 것은 하나도 없습니다. 여기서 이 말을 분명히 해 두는 것은, 입력이
        사람들의 이름과 각자의 키로 이루어진 목록이고, 이 사이트가 다루는 대부분의 것보다
        더 사적이기 때문입니다."""

[[faq]]
q = "차트를 내려받을 수 있나요?"
a = """
        네, PNG로도 SVG로도 가능하고 워터마크도 계정도 없습니다. PNG는 설정하신 픽셀
        높이로 그려지며 문서나 슬라이드, 대화창에 붙여 넣을 것입니다. SVG는 차트를
        픽셀이 아니라 지시로 담습니다. 어떤 크기로도 또렷하게 인쇄되고, 나중에 어떤 벡터
        편집기에서든 열어 색을 다시 입힐 수 있습니다. 둘 다 화면에 있는 것과 같은
        마크업으로 만들어지므로, 어느 쪽도 미리보기와 어긋날 수 없습니다."""

[[faq]]
q = "키는 어떻게 적나요 &mdash; 센티미터인가요, 피트인가요?"
a = """
        어느 쪽이든, 어느 줄에서든, 평소 쓰시는 방식대로 하시면 됩니다.
        <code>173</code>, <code>173 cm</code>, <code>1.73 m</code>,
        <code>5'8\"</code>, <code>5 ft 8 in</code>, <code>68 in</code> 모두
        이해되고, 칸 아래 줄이 무엇으로 읽었는지를 두 체계로 보여 줍니다. 단위 없는
        숫자는 차트가 미터법일 때 센티미터, 야드파운드법일 때 인치입니다. 3보다 작은 맨
        숫자는 미터로 봅니다. 1.73 cm는 아무도 적지 않는 키니까요."""

[[faq]]
q = "유아가 왜 작은 어른처럼 보이지 않나요?"
a = """
        유아는 작은 어른이 아니기 때문입니다. 신체 비율은 나이에 따라 달라집니다. 두 살
        아이는 대략 머리 넷 반, 여덟 살은 여섯, 어른은 일곱 반입니다 &mdash; 그래서
        머리가 유아의 거의 4분의 1, 어른의 8분의 1을 차지합니다. 남자아이와 여자아이는
        실제 아이들을 그린 것이고, 유아는 줄여 놓은 실루엣이 아니라 자기 비율 표를 갖고
        있습니다. 가족 차트가 크기만 다른 어른 넷이 아니라 가족처럼 보이는 이유입니다."""

[[faq]]
q = "인물들은 어디서 왔나요?"
a = """
        다섯 중 넷은 다른 분들의 그림이고 모두 퍼블릭 도메인입니다. 남성은 pitr, 여성은
        Madeleine Price Ball, 여자아이는 OpenClipart-Vectors, 남자아이는 NIH BioArt
        라이브러리를 위해 Ryan Kissinger가 그렸습니다. 각 파일은 공개된 그대로
        <code>vendor/</code>에 담겨 이 페이지와 함께 실려 오므로 원본과 대조하실 수
        있습니다. 퍼블릭 도메인은 아무것도 요구하지 않고, 바로 그 점이 중요합니다. 그림은
        사용자가 내려받는 이미지 안에 들어가게 되고, 출처 표시를 요구하는 라이선스라면 그
        요구가 사용자의 차트에 따라붙었을 것입니다. 이 페이지 자신의 코드가 그리는 것은
        유아뿐입니다 &mdash; 학령기 아래로는 자유롭게 쓸 수 있는 것이 없었습니다."""

[[faq]]
q = "차트 하나에 몇 명까지 넣을 수 있나요?"
a = """
        열둘입니다. 기술적 한계는 아닙니다 &mdash; 그리기만 하자면 서른도 기꺼이 합니다
        &mdash; 다만 열두어 명을 넘기면 열의 폭이 그 위에 적힌 이름보다 좁아지고 그림이
        읽히지 않게 됩니다. 더 필요하시면 이름을 끄면 폭이 돌아오고, 아니면 두 장으로
        나누는 편이 한 장보다 낫습니다."""

[[faq]]
q = "차트에 사물을 놓을 수 있나요?"
a = """
        네 &mdash; 단순한 직사각형이 높이와 너비를 받으므로, 두 치수를 가진 것이라면
        사람들 옆에 함께 섭니다. 메뉴에는 시작할 만한 스무 가지가 네 묶음으로 있습니다.
        문과 창, 학교와 사무실(화이트보드, 책상, 서류 캐비닛, 프로젝터 스크린), 동네의
        것들(자동판매기, 바퀴 달린 쓰레기통, 농구 골대, 20&nbsp;ft 해상 컨테이너), 그리고
        집 안의 것들입니다. 그중 일부는 실제 규격이고 일부는 흔한 크기이며, 페이지가 그
        점을 분명히 말합니다. 하나하나가 덮어쓸 수 있는 평범한 줄로 들어옵니다. 익숙한
        사물 하나가 사람을 더 넣는 것보다 차트에 더 큰 일을 합니다. 비교를 크기의 감각으로
        바꿔 주니까요."""

[[faq]]
q = "개나 고양이 인물이 있나요?"
a = """
        없고, 실수가 아니라 일부러 비워 둔 자리입니다. 둘 다 만들어는 봤습니다 &mdash;
        옆모습으로, 서 있고, 머리를 어깨 높이에 맞춰서, 그림의 꼭대기가 옆에 적힌 키가
        되도록 말입니다. 모든 견종 표준이 동물을 그 지점에서 재니까요. 내놓을 만큼 좋게
        나오지 않았습니다. 앞을 보고 선 네 사람 옆에 옆을 보고 선 네발짐승은 그림이 좋아도
        잘못된 것처럼 읽힙니다. 그동안은 그 동물의 어깨 높이에 맞춘 직사각형이 정직한
        답입니다."""

[[faq]]
q = "차트를 링크로 공유할 수 있나요?"
a = """
        여기서는 안 되고, 그것도 일부러입니다. 그 기능을 제공하는 도구들은 목록 전체를
        주소에 넣는 방식으로 합니다. 그러면 모든 이름과 모든 키가 그 링크가 지나가는 모든
        곳에 남습니다. 채팅 서버의 로그, 메일 검사기, 누군가의 브라우저 기록, 링크
        미리보기를 가져가는 서비스 같은 곳들 말입니다. 그림을 내려받아 그것을 보내세요.
        같은 이야기를 하면서 목록은 들고 가지 않습니다."""

[[faq]]
q = "무료인가요? 차트를 상업적으로 써도 되나요?"
a = """
        무료이고 계정도 워터마크도 없으며, 결과물을 보고서나 발표 자료, 광고나 제품에
        넣으셔도 됩니다. 이 사이트에는 광고가 있고 그것이 비용을 댑니다. 여기서 만드신
        차트 가운데 우리 것은 아무것도 없고, 남겨 두는 것도 없습니다."""

[[faq]]
q = "눈금자가 왜 1이 아니라 10 단위인가요?"
a = """
        간격이 정해진 숫자가 아니라 그림이 감당할 수 있는 선의 개수에서 정해지기
        때문입니다. 어른 둘짜리 차트는 10센티미터마다 선이 하나 들어갑니다. 거기에 농구
        골대를 올리면 선이 25로 옮겨 갑니다. 한 그림에 아흔 개의 선은 눈금자가 아니라
        회색 얼룩이니까요. 피트와 인치에서는 1, 3, 6, 12인치가 사다리라서, 선이 어중간한
        데가 아니라 정수 인치에 떨어집니다."""

[[faq]]
q = "차트를 어두운 슬라이드에 올려도 되나요?"
a = """
        됩니다. 배경을 올려 둘 색으로 맞추면 눈금자와 글씨가 거기에 어울리게 어두운 쪽과
        밝은 쪽을 오갑니다 &mdash; 짐작이 아니라 그 색의 휘도에서 계산합니다. 그런 다음
        그림 자체를 투명하게 하고 싶으시면 &lsquo;배경을 아예 두지 않기&rsquo;에 표시하세요.
        잉크를 정하는 것은 여전히 고르신 색이라, 남색 슬라이드로 향하는 투명한 차트도 그
        위에서 읽히게 나옵니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 뒤 인터넷을 끊어도 계속 동작합니다. 이것이 아무것도
        업로드되지 않는다는 가장 간단한 증명이기도 합니다. 차트를 그려 달라고 목록을
        밖으로 보내는 도구라면 선을 뽑는 순간 멈췄을 것입니다."""

