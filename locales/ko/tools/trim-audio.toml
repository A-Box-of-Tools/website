[[privacy]]
title = "내 녹음은 나갈 곳이 없습니다."
body = """
 Content-Security-Policy에는 이 페이지가
      연결할 수 있는 주소가 전부 적혀 있고, 그중 이 사이트 것은 하나도 없습니다.
      파일이 모일 수 있는 수신처가 여기엔 없고, 있다 한들 그리로 보낼 코드도
      없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 이 도구에는 네트워크 기능이 아예
      없습니다. 붙여 넣을 주소도 없고, 내려받을 것도 없고, 처음 쓸 때 들어오는
      엔진도 없습니다. 내 오디오에 닿는 코드는 한 바이트도 빠짐없이 페이지를
      불러올 때 이 출처에서 온 것입니다."""

[[privacy]]
title = "디코더는 브라우저에 이미 들어 있는 그것입니다."
body = """

      파일은 <code>decodeAudioData</code>에 넘겨집니다.
      <code>&lt;audio&gt;</code> 요소에서 노래를 재생하는 바로 그 코드입니다. 내
      포맷을 읽으려고 여기서 무언가를 함께 보내지도 않고, 읽으려고 이 페이지 바깥의
      무엇에 부탁하지도 않습니다."""

[[privacy]]
title = "동영상의 화면은 아예 디코딩되지 않습니다."
body = """
 동영상을 끌어다 놓으면
      오디오 트랙만 요청됩니다. 프레임은 읽히지도, 풀리지도, 그려지지도, 들여다
      보이지도 않습니다. 이 페이지에는 그럴 수 있는 코드가 없고, 나오는 파일에는
      소리 말고는 아무것도 없습니다."""

[[privacy]]
title = "자르기는 이 기기 메모리 안에서의 복사입니다."
body = """

      자른다는 것은 구간마다, 채널마다 <code>set</code>을 한 번씩 하는 일입니다.
      남긴 샘플들이 내가 놓은 순서대로 새 배열로 옮겨집니다. 무언가와 곱해지는
      샘플은 각 페이드 안의 수백 개뿐이고, 그 개수는 버튼을 누르기 전에 페이지가
      알려 줍니다."""

[[privacy]]
title = "샘플은 그대로 적힐 뿐, 다시 인코딩되지 않습니다."
body = """

      WAV는 이 페이지가 들고 있는 샘플 앞에 헤더를 붙인 것입니다. 중간에서 내
      녹음에 대해 판단을 내리는 인코더는 없고, 그런 일이 벌어질 '업로드'라고 부를
      만한 것도 없습니다."""

[[privacy]]
title = "표시 파일은 이 페이지 안에서 만들어집니다."
body = """
 표시를 저장하면 이미 화면에
      있는 숫자들로 텍스트 파일을 만들어 바로 다운로드로 보냅니다. 불러오기도
      여기서 읽습니다. 둘 다 네트워크 근처에 가지 않고, 둘 다 시간 말고는 아무것도
      싣지 않습니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는
      구글에서 옵니다. 둘 중 어느 쪽에도 내 녹음에 관한 것은 넘어가지 않습니다.
      파일도, 샘플도, 이름도, 크기도, 길이도, 어디서 잘랐는지도 마찬가지입니다.
      읽고 자르고 써 내는 코드는 한 줄도 빠짐없이 이 출처에서 제공되고 저장소에
      공개되어 있습니다."""

[[privacy]]
title = "후원 버튼이 불러오는 것과, 거기에 주지 않는 것."
body = """

      머리글의 'Buy me a coffee' 버튼은 cdnjs.buymeacoffee.com의 스크립트가
      그리고 글꼴은 Google Fonts에서 가져옵니다. 그것은 링크 이상은 아닙니다.
      방문을 알리지도 않고, 나에 대해서도 내 녹음에 대해서도 건네받는 것이
      없습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 이 페이지의 모든 것이
      그대로 동작합니다. 가장 간단한 증거입니다."""

[[howto]]
title = "녹음을 고릅니다."
body = """
 MP3, WAV, FLAC, M4A, Ogg, Opus 파일을 선택
      영역에 끌어다 놓으십시오. 원하는 것이 동영상 소리의 일부라면 동영상을 놓아도
      됩니다. 브라우저가 디스크에서 바로 읽어 파형으로 그리고, 그동안 무엇도
      어디로 나가지 않습니다."""

[[howto]]
title = "재생하면서 원하는 부분에 표시합니다."
body = """
 구간이 시작될 자리에서
      <kbd>I</kbd>를, 끝날 자리에서 <kbd>O</kbd>를 누르십시오. 몇 번이든 좋습니다.
      한 쌍마다 아래 표의 한 줄이 되고, 파형 위의 한 띠가 됩니다. <kbd>U</kbd>는
      직전 하나를 되돌리고, <kbd>스페이스</kbd>는 재생과 일시정지, 화살표 키는 5초씩
      건너뛰며, <kbd>Shift</kbd>를 함께 누르면 10밀리초씩 움직입니다. 그 순간을
      잡기 어려우면 재생 속도를 늦추십시오."""

[[howto]]
title = "표시를 다듬습니다."
body = """
 각 줄은 따로 들어 볼 수 있고, 정확한 시간을
      적어 넣어 다시 맞추거나, 순서를 위아래로 옮기거나, 지울 수 있습니다. 고른
      구간의 양 끝은 파형 위에서 끌 수도 있는데, 숨소리가 아니라 무음 쪽에 표시를
      놓는 가장 빠른 방법입니다. 위에 나오는 합계가 완성된 녹음의 길이입니다."""

[[howto]]
title = "남기거나, 잘라 냅니다."
body = """
 남기는 쪽이 보통입니다. 완성된 녹음은
      표시한 구간들을 순서대로 이어 붙인 것이 됩니다. 잘라 내는 쪽은 사람들이
      원하면서도 좀처럼 찾지 못하는 기능입니다. '음...' 하는 소리, 울린 전화, 잘못
      시작한 부분에 표시하면 나머지가 그것들을 뺀 채로 이어집니다."""

[[howto]]
title = "자르고 내려받습니다."
body = """
 모든 자름은 표시한 샘플 자리에 떨어집니다.
      여기에는 키프레임으로 반올림하는 일이 없습니다. 소리에는 그런 것이 없으니까요.
      고를 만한 것은 이음매마다 페이드를 얼마나 줄지 하나뿐입니다. 5밀리초면 딱
      소리를 막기에 충분하고, 페이드로 들리기에는 턱없이 짧습니다. 나오는 것은
      WAV이고, 페이지에서 먼저 재생된 다음 바로 브라우저의 다운로드로 넘어갑니다."""

[[faq]]
q = "제 오디오가 어딘가로 업로드되나요?"
a = """
        아닙니다. 읽고, 표시하고, 자르고, 써 내는 일은 내 브라우저가 내 하드웨어에서
        합니다. 이 도구에는 서버 쪽이 없고, 페이지의
        <code>Content-Security-Policy</code>에는 연결할 수 있는 주소가 전부 적혀
        있는데 그중 이 사이트 것은 없습니다. 듣는 것보다 확인이 낫다면 인터넷을 끊고
        그냥 녹음을 잘라 보십시오."""

[[faq]]
q = "같은 녹음에서 여러 구간을 남길 수 있나요?"
a = """
        그러라고 만든 도구입니다. 재생하는 동안 <kbd>I</kbd>와 <kbd>O</kbd>를 원하는
        만큼 누르십시오. 한 쌍마다 한 줄이 되고, 완성된 파일은 그 줄들을 순서대로
        이어 붙인 것이며 나머지는 전부 빠집니다. 대부분의 온라인 자르기 도구는 손잡이
        한 쌍만 주고 어느 한 구간을 남길지 묻습니다. 시그널 음악의 앞뒤를 정리하는
        데는 충분하지만, 한 시간짜리 인터뷰를 한 번만 들으면서 쓸 만한 답변 여섯 개를
        남기는 데는 전혀 쓸모가 없습니다."""

[[faq]]
q = "자르는 자리가 표시한 곳에 정확히 떨어지나요?"
a = """
        떨어집니다. 모든 구간에서, 어떤 재생기에서든 그렇습니다. 여기가 오디오가
        영상보다 단순한 유일한 지점입니다. 디코딩된 녹음은 숫자의 연속이고 하나하나가
        스스로 서 있어서, 키프레임에 해당하는 것도 없고 되돌려 반올림할 자리도 없으며
        자름이 앞당겨질 이유도 없습니다. 페이지는 결과가 시작되는 샘플 번호를 보여
        주는데, 이는 내가 찍은 표시에 표본화 주파수를 곱해 가장 가까운 정수 샘플로
        반올림한 값입니다."""

[[faq]]
q = "이음매에서 왜 딱 소리가 나고, 페이드는 무엇을 위한 건가요?"
a = """
        어떤 낱말 가운데에서 다른 낱말 가운데로 자르면 아무 상관 없는 두 파형이 나란히
        놓이고, 그 사이를 뛰라고 요구받은 스피커가 딱 소리를 내기 때문입니다. 자름의
        결함이 아니라, 불연속이라는 것이 원래 그렇게 들립니다. 해법은 이음매 양쪽에
        몇 밀리초짜리 페이드를 주는 것입니다. 콘이 따라올 만큼은 길고, 페이드로 들리기에는
        턱없이 짧습니다. 기본값은 5밀리초이고 끌 수도 있습니다. 페이드는 실제로 자른
        가장자리에만 붙으므로, 녹음의 맨 앞이나 맨 끝 가장자리는 있던 그대로 남습니다."""

[[faq]]
q = "반대로 나쁜 부분을 잘라 낼 수도 있나요?"
a = """
        있습니다. 그 부분에 표시하고 '잘라 내기'를 고르십시오. 표시하지 <em>않은</em>
        쪽이 대신 순서대로 이어집니다. 같은 표시 목록이 두 질문에 다 답하므로, 오가며
        길이가 달라지는 것을 확인해도 아무것도 두 번 표시할 필요가 없습니다."""

[[faq]]
q = "표시를 저장했다가 나중에 이어서 할 수 있나요?"
a = """
        있습니다. '표시 저장'은 일반 텍스트 파일을 씁니다. 한 줄이 한 구간이고 시작과
        끝이 쉼표로 나뉩니다. '표시 불러오기'는 그것을 다시 읽습니다. 형식은 두 가지가
        있습니다. 순수한 초와 <code>HH:MM:SS.mmm</code>인데, 둘 다 이 사이트의 동영상
        자르기가 쓰는 것과 같은 배열입니다. 그래서 동영상에 맞춰 만든 파일을 그
        오디오에 놓을 수도 있고 그 반대도 됩니다. 표시는 품이 드는 일이고, 두 번 할
        일은 아닙니다."""

[[faq]]
q = "어떤 형식을 열 수 있나요?"
a = """
        브라우저가 디코딩할 수 있는 것이면 무엇이든입니다. 실제로는 MP3, WAV, FLAC,
        M4A와 AAC, Ogg Vorbis와 Opus, 그리고 MP4, M4V, MOV, WebM 동영상 속의 오디오가
        됩니다. 빠지는 것은 어디서나 같은 짧은 목록, AVI와 WMA, 그리고 대부분의
        MKV입니다. 이 브라우저가 읽지 못할 파일은 중간에 실패하는 대신 그렇다고 알려
        주며 받지 않습니다."""

[[faq]]
q = "왜 MP3가 아니라 WAV로 저장하나요?"
a = """
        어떤 브라우저도 MP3 인코더를 갖고 나오지 않고, 이 도구는 그걸 가진 서버로 내
        녹음을 보내기를 거부하기 때문입니다. WAV에는 인코더가 전혀 필요 없습니다.
        샘플 앞에 짧은 헤더를 붙인 것이니까요. 그래서 정직한 선택인 동시에, 나가는
        길에 품질을 깎지 않는 유일한 선택이기도 합니다. 대신 큽니다. 스테레오로 1분에
        10메가바이트쯤 됩니다. 어떤 재생기도, 휴대폰도, 편집 프로그램도 열 수 있고,
        MP3가 필요하면 거기서 만들면 됩니다. MP3를 프레임 복사로 자르면 파일은 작게
        유지되지만, 모든 자름이 가장 가까운 프레임 경계로 옮겨 갑니다. 그 반올림을
        하지 않으려고 이 도구가 있는 것입니다."""

[[faq]]
q = "녹음 길이에 제한이 있나요?"
a = """
        도구에 박아 둔 제한은 없습니다. 실제 한계는 메모리입니다. 녹음 전체가 이
        페이지 안으로 한 번에 디코딩되고, WAV도 내려받기 전에 메모리에서 조립되므로,
        스테레오 한 시간이면 1기가바이트에 조금 못 미치는 작업 공간이 필요합니다.
        4기가바이트짜리 WAV는 아예 거절합니다. 그 포맷의 크기 필드 자체가 그런 파일을
        표현하지 못하니까요."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도, 워터마크도 없습니다. 이 사이트는 광고로
        유지되는데, 그 광고에도 내 녹음에 관한 것은 넘어가지 않습니다."""

