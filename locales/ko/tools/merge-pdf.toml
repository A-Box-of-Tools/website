description = "PDF를 합치고, 하나를 여럿으로 나누고, 페이지를 끌어서 원하는 순서로 놓습니다. 전부 내 브라우저 안에서 일어납니다. 업로드도 계정도 없고, 완성된 파일은 건네기 전에 한 번 더 열어서 페이지를 세어 봅니다."
og_title = "PDF 페이지 합치기, 나누기, 순서 바꾸기 &mdash; 아무것도 업로드되지 않습니다"
og_description = "문서를 붙이고, 하나를 잘라 나누고, 페이지를 옮기고, 돌리고, 빼냅니다. 내 브라우저가 직접 하니까 파일은 기기 밖으로 나가지 않습니다."
og_image_alt = "PDF 페이지를 업로드 없이 합치고 나누고 순서 바꾸기"

pledge = """
    고른 문서는 모두 이 주소에서 제공된 코드가 이 기기의 메모리 안에서 열고, 뜯고,
    다시 써 냅니다. 여기에는 업로드를 일으킬 수 있는 것이 없고, 이 페이지 반대편에는
    그걸 받아 줄 서버도 없습니다."""

live_hint = """
      그냥 믿지 마시고 직접 확인해 보세요. 개발자 도구의 '네트워크' 탭을 켜 놓고
      파일 두 개를 합쳐 보십시오. 페이지도, 그림도, 파일 이름도 실려 나가는 요청이
      없습니다. 아니면 인터넷을 끊고 그냥 합쳐 보셔도 됩니다."""

read_first = """
, 그리고 복사 전체, 즉 한 문서에서 페이지를 들어내
      다른 문서에 넣는 방식과 일부러 두고 오는 것들에 대해서는
      <code>src/assemble.js</code>를 보십시오. 그 파일은 네트워크에 닿을 수 없고,
      그 옆의 판독기와 기록기도 마찬가지입니다."""

howto_heading = "PDF를 합치거나 나누거나 순서를 바꾸는 방법"

card = """
            문서를 붙이고, 하나를 여럿으로 자르고, 페이지를 끌어서 원하는 순서로
            놓습니다. 링크와 북마크는 가리키던 페이지를 따라가도록 다시 만들어지고,
            완성된 파일은 건네기 전에 한 번 더 열어서 페이지를 세어 봅니다."""

[words]
plural = "문서는"
choose = "PDF를"

