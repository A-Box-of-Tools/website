[[privacy]]
title = "붙여 넣은 것은 나갈 곳이 없습니다."
body = """
 이 페이지가 연결해도 되는 주소는
      Content-Security-Policy에 모두 적혀 있는데, 그중 이 사이트 것은 하나도
      없습니다. 붙여 넣은 토큰이 모일 만한 수신 지점이 없고, 설령 있더라도 거기로
      무언가를 보낼 코드가 없습니다."""

[[privacy]]
title = "여기서는 아무것도 가져오지 않습니다."
body = """
 <code>src/</code> 어디에도
      <code>fetch</code>도, <code>XMLHttpRequest</code>도,
      <code>sendBeacon</code>도 없습니다. 모든 인코더와 모든 디코더는 문자열을
      받아 문자열을 돌려주는 이 페이지 안의 함수입니다."""

[[privacy]]
title = "무언가 잘못되면 디코더가 말해 줍니다."
body = """
 브라우저의 <code>atob</code>는
      거부해야 할 입력을 받아 놓고 그럴듯한 것을 돌려줍니다. 여기의 Base64는 직접
      손으로 쓴 것이고 RFC&nbsp;4648의 테스트 벡터로 검증하며, 붙여 넣은 것이
      Base64가 아니면 아니라고, 왜 아닌지까지 말합니다.
      <code>tests/js/text-encode.test.js</code>의 테스트가 정확히 그것을
      확인합니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서,
      후원 버튼은 Buy Me a Coffee에서 옵니다. 어느 쪽에도 내 텍스트는 한 글자도
      넘어가지 않습니다. 그것을 읽고 해석하고 쓰는 코드는 한 줄도 빠짐없이 이
      출처에서 제공되고 저장소에 공개되어 있습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 도구는 그대로입니다.
      애초에 네트워크를 쓰는 단계가 없었으니까요. 가장 간단한 증거입니다."""

[[howto]]
title = "인코딩을 고릅니다."
body = """
 두 알파벳의 Base64, 값 하나 또는 URL 전체를
      위한 퍼센트 인코딩, HTML 엔티티 다섯 가지, 16진수 바이트, 그리고 문자열
      리터럴의 역슬래시 이스케이프. 메뉴 아래의 설명이 각각의 쓰임새를
      말해 줍니다."""

[[howto]]
title = "방향을 고릅니다."
body = """
 <em>인코딩</em>은 일반 텍스트를 받아 인코딩된
      형태를 만들고, <em>디코딩</em>은 인코딩된 형태를 일반 텍스트로 되돌립니다.
      결과는 타이핑을 따라오니 방향을 바꾸는 것은 클릭 한 번이고, 다시 입력할
      것은 없습니다."""

[[howto]]
title = "붙여 넣거나, 파일을 놓습니다."
body = """
 선택해서 복사할 수 있는 것이면
      무엇이든 됩니다. 선택 영역에 놓인 파일은 브라우저가 읽어 상자에 넣습니다.
      빼놓을 업로드 단계 자체가 없어요."""

[[howto]]
title = "오류가 있으면 읽어 봅니다."
body = """
 여기서 실패하는 디코더는 무엇을 만났는지
      말합니다. Base64가 쓰지 않는 문자, 잘못된 자리의 패딩, 텍스트가 아닌 바이트.
      그럴듯하지만 틀린 것을 돌려주는 대신에요."""

[[howto]]
title = "결과를 가져갑니다."
body = """
 복사하거나 텍스트 파일로 내려받으세요. 상자
      아래 카운터가 몇 바이트가 들어가서 몇 바이트가 나왔는지 알려 줍니다."""

[[faq]]
q = "제 텍스트가 어딘가로 업로드되나요?"
a = """
        아닙니다. 이 페이지의 모든 인코더와 디코더는 내 기기에서, 내 브라우저
        안에서 도는 함수입니다. 이 도구에는 네트워크 기능이 하나도 없어서 무언가를
        가져오지도, 보내지도 않습니다. 이 페이지의
        <code>Content-Security-Policy</code>에 연결해도 되는 주소가 전부 적혀
        있는데, 그중 이 사이트 것은 하나도 없습니다. 액세스 토큰이나 세션 쿠키에
        이 도구를 써야 하는 이유가 그것입니다. 그런 것을 남의 디코더에 붙여 넣는
        것은 그들에게 그것을 주는 일이니까요."""

[[faq]]
q = "여기 Base64는 다른 데의 Base64와 같은 것인가요?"
a = """
        같습니다. 자기 자신이 아니라 RFC 4648의 테스트 벡터에 맞춰 확인하니까요.
        두 알파벳 모두 디코딩되므로 <code>-</code>와 <code>_</code>로 쓴 JWT도
        <code>+</code>와 <code>/</code>로 쓴 것만큼 잘 읽히고, 64자로 접힌 입력은
        대신 펴 드립니다. 인코딩은 UTF-8 바이트 기준이라 악센트가 붙은 글자나
        이모지도 왕복을 견딥니다."""

[[faq]]
q = "Base64는 암호화인가요?"
a = """
        아니고, 그렇게 여기는 것이 고전적인 착각입니다. Base64는 표기법입니다.
        같은 바이트를 URL과 이메일과 JSON 문자열에서 살아남는 알파벳으로 적은
        것뿐이에요. 누구나 되읽을 수 있고 &mdash; 이 페이지는 1밀리초면 합니다
        &mdash; 그러니 아무것도 숨기지 못하고 아무것도 지키지 못합니다. 가진 것이
        비밀이라면 인코딩 전에 진짜 암호화가 필요합니다. 암호화 대신이 아니라요."""

[[faq]]
q = "디코딩이 왜 실패했나요?"
a = """
        붙여 넣은 것이 코덱에 말해 준 그것과 정확히 같지 않아서이고, 오류가 어느
        쪽이 문제인지 말해 줍니다. Base64 알파벳 밖의 문자, 잘못된 자리의 패딩,
        뒤에 16진수 두 자리가 없는 퍼센트 기호, 또는 Base64에서는 풀리지만 UTF-8
        텍스트가 아닌 바이트 &mdash; 마지막 경우는 대개 원본이 문자열이 아니라
        파일이었다는 뜻입니다. 브라우저의 <code>atob</code>였다면 대신 그럴듯한
        것을 돌려줬을 겁니다. 무엇이 문제인지 들을 수 있다는 것, 그게 디코더에
        무언가를 붙여 넣는 이유의 전부입니다."""

[[faq]]
q = "두 가지 웹 주소 인코딩은 뭐가 다른가요?"
a = """
        값 하나냐, 주소 전체냐입니다. <em>값 하나</em>를 인코딩하면 URL이 의미를
        두는 모든 것 &mdash; 슬래시, 물음표, 앰퍼샌드 &mdash; 이 이스케이프되는데,
        쿼리 문자열의 매개변수 하나에 원하는 것이 바로 그것입니다. <em>URL
        전체</em>를 인코딩하면 주소는 계속 동작합니다. 슬래시와 <code>?</code>는
        남고, URL이 아예 실을 수 없는 문자만 이스케이프됩니다. 앞의 것을 주소
        전체에 쓰면 주소가 깨지고, 뒤의 것을 값에 쓰면 값이 어디서 끝나는지
        잃어버립니다."""

[[faq]]
q = "얼마나 큰 파일까지 다룰 수 있나요?"
a = """
        여기 정해 둔 제한은 없습니다. 그 값을 치를 서버가 없으니까요. 현실적인
        한계는 기기 쪽입니다. 몇 메가바이트짜리 텍스트는 괜찮고, 아주 긴 문서라면
        페이지가 키보드를 두고 다투는 대신 타이핑이 잠시 멎기를 기다렸다가 다시
        인코딩합니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도 없으며 붙여 넣는 양에도 제한이
        없습니다. 이 사이트는 광고로 유지되는데, 그 광고에도 내 텍스트에 관한 것은
        넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다.
        아무것도 업로드되지 않는다는 가장 간단한 증명이기도 하고요. 텍스트를
        어딘가로 보내서 디코딩해 오는 도구라면 선을 뽑는 순간 멈춰 버릴 테니까요."""

[schema]
description = "Base64를 두 알파벳 모두로 인코딩·디코딩하고, 값 하나나 URL 전체를 퍼센트 인코딩하고, HTML 엔티티와 16진수 바이트와 역슬래시 이스케이프를 만들고 되읽습니다. 전부 브라우저 안에서 돌아가고 아무것도 업로드되지 않습니다."
features = [
  "두 알파벳의 Base64, 인코딩과 디코딩 모두",
  "줄바꿈된 Base64를 읽고, 잘못된 입력이 왜 잘못됐는지 정확히 말합니다",
  "RFC 4648의 테스트 벡터로 검증",
  "값 하나를 위한, 그리고 URL 전체를 위한 퍼센트 인코딩",
  "HTML 엔티티 다섯 가지, 숫자·이름 엔티티 되읽기",
  "아무 구분자나 쓴 16진수 바이트, 역슬래시 이스케이프",
  "UTF-8 바이트로 인코딩하니 이모지도 왕복을 견딥니다",
  "붙여 넣은 것뿐 아니라 놓아 둔 파일에도 동작합니다",
  "오프라인 동작. 업로드 없음, 가입 없음",
]

[picker]
title = "여기에 파일을 놓으세요"
hint = "또는 클릭해서 고르기. 아무 텍스트 파일이나 됩니다."
