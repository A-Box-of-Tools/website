#
# Redact a PDF - Korean.
#
# Overrides for tools/redact-pdf/tool.toml. Only words: the slug, the category,
# the icon, the CSP and the list of shared parts stay where they are.
#
# '가리기'는 이미지-가리기와 같은 말이고, 같은 약속을 담고 있습니다. 글자가
# 파일에서 빠지는 것이지 위에 무언가를 덮는 것이 아닙니다. '덮기'나 '가림막'은
# 이 페이지가 경고하는 바로 그 실패를 가리키는 말이 되어 버립니다.
#

name = "PDF 가리기"
