[[privacy]]
title = "검은 칸은 가린 것이 아니고, 여기서는 그것을 무엇 위에도 그리지 않습니다."
body = """

      한 장을 가려 주겠다는 프로그램 거의 전부에서 &mdash; PDF 뷰어든, 워드
      프로세서든, 디자인 도구든 &mdash; 그 칸은 글자 안이 아니라 글자 옆에 저장된
      객체입니다. 글자는 같은 파일, 같은 자리에 그대로 있고, 그 영역을 선택해서
      복사하면 그대로 돌아옵니다. 그 실패가 법원 제출 서류와 정보기관 보고서를,
      그리고 2025년 12월에는 미국 법무부 문서를 대량 공개하면서 검게 칠한 이름들을
      세상에 내놓았습니다. 몇 시간 만에 읽혔습니다. 이 도구는 그 장을 그리는
      명령에서 글자를 지웁니다. 밑에 무언가가 있는 칸이 없습니다. 밑에 아무것도
      없기 때문입니다."""

[[privacy]]
title = "완성된 파일은 당신에게 건네지기 전에, 여기서 다시 열려 검색됩니다."
body = """

      그 일이 있기 전까지 위의 모든 말은 이 도구가 제 답안지를 제가 채점하는
      것입니다. 그래서 곧 당신의 다운로드가 될 바이트를 낯선 사람이 보낸 것처럼
      같은 읽기 쪽에 도로 넘겨, 모든 장을 다시 읽고, 모든 북마크와 주석과 양식
      칸과 문서 속성을 모으고, 당신이 뺀 낱말을 검색합니다. 그 개수가 결과에
      나옵니다. 무언가가 살아남았다면 그 실행은 실패로 보고되고 다운로드는
      없습니다."""

[[privacy]]
title = "낱말은 탭을 벗어나지 않고, 검색도 마찬가지입니다."
body = """
 Content-Security-Policy에는
      이 페이지가 접속할 수 있는 주소가 모두 적혀 있고, 그중 이 사이트의 것은
      하나도 없습니다. 이 도구는 그 목록에 아무것도 더하지 않습니다. 선택 사항으로
      조차 자기 네트워크 기능이 없습니다. 검색창에 입력한 것은 이 탭의 메모리에
      있는 글자와 견주는 문자열이고, 둘 중 어느 쪽도 갈 곳이 없습니다."""

[[privacy]]
title = "가리기는 업로드를 가장 견디지 못하는 일입니다."
body = """

      사람들이 가리는 것이 바로 그것을 올려서는 안 되는 이유입니다. 진술서, 진단서,
      집주인에게 갈 통장 거래내역, 한 고객의 이름이 들어간 채로 다른 고객에게 갈
      계약서입니다. 사적인 부분을 빼 달라고 그것을 낯선 사람의 서버에 건넨다는 것은
      사적인 부분이 온전한 채로 먼저 도착한다는 뜻이고, 그쪽이 보관하는 것도 그
      판본입니다. 이 페이지에는 나머지 반쪽이 없습니다."""

[[privacy]]
title = "남는 것은 손대지 않고 그대로 옮겨집니다."
body = """

      한 장에서 바뀌는 바이트는 빠진 글자가 속해 있던 글자 그리기 명령뿐입니다.
      다른 모든 명령과, 그 장이 참조하는 모든 글꼴과 그림과 선은 들어온 그대로
      정확히 복사됩니다. 다시 그리지도, 다시 인코딩하지도, 다시 흘리지도 않습니다.
      빠진 것의 너비는 재어서 간격 명령으로 되돌려 넣으므로, 줄의 나머지는 문서가
      놓아 둔 자리에 그대로 있습니다."""

[[privacy]]
title = "사진에서는 낱말을 뺄 수 없고, 어느 장이 그런지 말해 줍니다."
body = """

      스캔한 장은 그림입니다. 그 위의 낱말은 글자가 아니라 픽셀이고, 여기 있는
      어느 것도 그것을 건드리지 못합니다. 스캔에 스캐너의 OCR이 만든 보이지 않는
      검색용 층이 실려 있다면 이 도구는 그 층을 없앱니다. 검색과 복사가 찾아냈을
      것이 바로 그것입니다. 그리고 그림에는 낱말이 여전히 보인다고 페이지에
      분명히 적어 둡니다. 그 그림을 덮는 것은 다른 일입니다. 픽셀을 덮어쓰는
      도구는 <a href=\"../이미지-가리기/\">이미지 가리기</a>입니다."""

[[privacy]]
title = "문서가 자기 출처를 말하지 않게 됩니다."
body = """

      속성과 XMP 패킷은 실행할 때마다 사라집니다. producer 줄도, 만든 날짜도,
      작성자도, 제목도, 편집 프로그램이 남기는 비공개 블록도 없습니다. 장에서
      이름을 뺐는데 속성에는 여전히 <code>김OO 합의서 초안 3.docx</code>라고 적힌
      파일은 가려진 것이 아니고, 그것은 체크박스에 맡길 일이 아닙니다."""

[[privacy]]
title = "암호가 걸린 파일은 열지 않고 돌려보냅니다."
body = """

      비밀번호가 걸린 PDF는 거부합니다. 스캐너가 빈 비밀번호로 만들어서 기술적으로는
      열릴 종류까지 그렇습니다. 문서의 보호를 벗기는 것은 문서에서 낱말을 빼는 것과
      다른 일이고, 그것을 조용히 해 버리는 것은 당신을 대신해 움직이는 도구로서
      놀라운 짓이 될 것입니다."""

[[privacy]]
title = "구글이 무엇을 불러오고, 무엇을 받지 못하는가."
body = """
 광고와 측정 스크립트는
      구글에서 옵니다. 둘 중 어느 쪽에도 문서에 대한 것은 전해지지 않습니다.
      파일도, 한 장도, 이름도, 크기도, 장수도, 검색한 낱말도 아닙니다. PDF를 읽고
      고치고 쓰는 모든 줄은 이 출처에서 제공되고 저장소에 적혀 있습니다."""

[[privacy]]
title = "후원 버튼이 무엇을 불러오고, 무엇을 받지 못하는가."
body = """

      상단의 &ldquo;Buy me a coffee&rdquo; 버튼은 cdnjs.buymeacoffee.com의
      스크립트가 그리고 글꼴은 Google Fonts에서 가져옵니다. 그것은 링크일 뿐이고,
      방문을 알리지도 않으며, 당신이나 당신의 문서에 대한 것을 받지도 않습니다.
      누르지 않으면 아무 일도 일어나지 않고, 눌러서 가게 되는 곳은 다른 사람의
      사이트입니다."""

[[privacy]]
title = "오프라인에서 작동합니다."
body = """
 네트워크를 끊어도 이 페이지의 모든 것이
      그대로 동작합니다. 가장 간단한 증거입니다. 문서를 어딘가로 보내 가려 오는
      도구였다면 멈췄을 것입니다."""

[[howto]]
title = "PDF를 고르십시오."
body = """
 한 번에 한 문서씩이고, 일부러
      그렇습니다. 가리기는 장마다 눈으로 봐야 하는 일이고, 한 파일에서 낱말을
      체크하게 해 놓고 그것을 조용히 다른 파일에 적용하는 도구야말로 엉뚱한 것이
      보내지는 경로입니다. 파일은 브라우저가 디스크에서 바로 읽습니다."""

[[howto]]
title = "무엇이 빠져야 하는지 말하십시오."
body = """
 낱말을 입력하십시오.
      이름, 주소, 사건번호 같은 것입니다. 그러면 그것이 나오는 모든 자리가 그
      낱말이 있는 줄과 함께, 체크할 칸을 달고 나열됩니다. 칸 옆의 찾기 항목들은
      이메일 주소, 카드번호, IBAN, 주민등록번호와 사회보장번호, 전화번호를
      찾습니다. 그것들은 제안될 뿐 대신 체크되지 않습니다. 패턴은 전화번호와
      사건번호를 가리지 못하니까요."""

[[howto]]
title = "장을 읽고 그 위에서 낱말을 집으십시오."
body = """

      이 칸은 문서의 글자를 실제로 저장된 그대로, 읽는 사람이 복사할 순서대로 보여
      줍니다. 아무 낱말이나 눌러서 빼고, 다시 눌러서 남기십시오. 취소선이 그어진
      것이 사라질 것입니다. 그래서 이것은 고르는 일이자 동시에 검토이고, 버튼을
      누르기 전에 장마다 한 번씩 해 볼 만한 일입니다."""

[[howto]]
title = "빼내고, 확인했다는 줄을 읽으십시오."
body = """

      글자를 지우고, 그 자리가 남긴 빈틈을 벌려 두고, 요청했다면 그 위에 검은 칸을
      그리고, 북마크와 주석과 양식 칸과 문서 속성에서도 같은 낱말을 뺍니다. 그다음
      완성된 파일을 여기서 다시 열어 검색합니다. 뺀 낱말이 여전히 찾아진다면
      다운로드는 주어지지 않고, 그렇다고 말하는 메시지가 나옵니다."""

[[faq]]
q = "PDF 뷰어에서 검은 칸을 그리는 것과 무엇이 다른가요?"
a = """
        뷰어에서 그린 사각형은 주석입니다. 위치를 가진 객체이고 장 옆에 저장됩니다.
        그 밑의 글자는 손대지 않은 그대로입니다. 그 영역을 선택해서 복사하는
        사람이든, 파일을 다른 프로그램에서 여는 사람이든, 아무 텍스트 추출기를
        돌리는 사람이든 낱말을 도로 얻습니다. 어떤 뷰어는 삭제를 제대로 적용하는
        &lsquo;redact&rsquo; 명령을 제공하고, 또 여럿은 그리기만 제공합니다. 이
        도구에는 옆으로 치울 사각형이 없습니다. 글자는 그 장의 그리기 명령에서
        잘려 나가고, 검은 칸은 켜 두었다면 이미 비어 있는 자리 위에 나중에
        그려집니다."""

[[faq]]
q = "낱말이 정말 사라졌는지 어떻게 아나요?"
a = """
        이 도구가 이 기기에서 확인하고 그 개수를 보여 주기 때문입니다. 파일을 다
        쓰고 나면 이 페이지의 같은 읽기 쪽이 그것을 다시 열어, 모든 장을 읽고, 모든
        북마크와 주석과 양식 칸과 속성을 모으고, 뺀 낱말을 하나하나 검색합니다.
        결과 줄이 몇 개였고 몇 개가 남았는지를 말합니다. 답이 마땅한 답이 아니면
        실행은 실패하고 내려받을 것이 주어지지 않습니다. 나중에 아무 뷰어에서나
        직접 확인해도 됩니다. Ctrl+F를 눌러 그 낱말을 찾아보십시오."""

[[faq]]
q = "낱말을 빼면 장의 나머지가 밀리나요?"
a = """
        아닙니다. 글자는 펜을 장 위로 밀어 가며 그리기 때문에, 다섯 글자를 지우면
        보통은 줄의 나머지가 다섯 글자만큼 왼쪽으로 끌려옵니다. 빠진 것의 정확한
        너비를 글꼴 자신의 메트릭에서 재어 간격 명령으로 되돌려 넣는데, 그것은
        아무것도 그리지 않으면서 펜만 옮깁니다. 표의 열은 그대로 맞고 합계는 제
        머리글 아래에 남습니다."""

[[faq]]
q = "스캔한 문서를 가릴 수 있나요?"
a = """
        그림은 못 하고, 할 수 있는 척하지 않고 그렇다고 말합니다. 스캔은 한 장을 찍은
        사진입니다. 낱말은 픽셀이고 뺄 글자가 없습니다. 다만 스캔에는 페이지를 검색할
        수 있게 스캐너의 OCR이 그림 위에 써 놓은 보이지 않는 글자 층이 실려 있는 일이
        많습니다. 이 도구는 그 층을 찾아 고른 것을 빼내고, 그림은 그대로라고 페이지에
        말해 줍니다. 그래서 검색과 복사는 그 낱말을 더 이상 찾지 못하고, 페이지를
        보는 사람은 여전히 읽습니다. 그림이라면
        <a href=\"../이미지-가리기/\">이미지 가리기</a>가 픽셀 자체를 덮어씁니다."""

[[faq]]
q = "장 위에 있지 않은 문서의 다른 부분은요?"
a = """
        함께 처리합니다. 가리기가 새는 곳이 보통 거기이기 때문입니다. 북마크와
        주석과 메모, 양식 칸에 입력된 것, 화면 낭독기에 주어지는 글자, 그리고 장
        위의 글자 <em>대신</em> 읽는 프로그램이 복사하는 대체 글자에서도 같은
        낱말을 뺍니다. 마지막 것은 합자와 줄 끝에서 하이픈으로 나뉜 낱말이 제대로
        복사되도록 있는 것이고, 문장 하나를 통째로 담을 수도 있습니다. 문서 속성과
        XMP 패킷은 아예 없앱니다. 첨부 파일과 파일을 열 때 실행되는 것은 버립니다.
        둘 다 당신이 빼는 낱말을 검색할 수 있는 대상이 아니기 때문입니다."""

[[faq]]
q = "제 문서가 어딘가로 업로드되나요?"
a = """
        아닙니다. 파일을 읽고 고치고 쓰는 일은 모두 이 브라우저가 이 기기의
        하드웨어에서 합니다. 이 도구에는 서버 쪽이 없고, 페이지의
        <code>Content-Security-Policy</code>에는 접속할 수 있는 주소가 모두 적혀
        있는데 그중 이 사이트의 것은 하나도 없습니다. 검색창에 입력한 것은 이 탭의
        메모리에 있는 글자와 견줄 뿐이고 그것도 어디로 가지 않습니다."""

[[faq]]
q = "다른 도구처럼 장 위에 상자를 끌어 그릴 수 없는 이유는요?"
a = """
        한 장을 그리려면 완전한 PDF 렌더러가 필요하기 때문입니다. 글꼴, 그러데이션,
        투명도, 혼합 모드까지 갖춘 엔진은 1메가바이트가 넘고, 이 사이트는 그런 것을
        싣지 않습니다. 그런데 그것이 이 일에는 오히려 맞습니다. 사각형을 끄는 것은
        <em>종이의 어떤 영역</em>을 고르는 것이고, 종이의 영역은 그 밑의 글자와 같은
        것이 아닙니다. 검은 칸 실패가 시작되는 지점이 바로 거기입니다. 대신 얻는
        것은 문서의 글자를 읽는 순서대로, 낱말마다 누를 수 있게 늘어놓은 화면입니다.
        그리고 그것은 장의 그림이 알려 줄 수 없는 것을 알려 주는 유일한 보기이기도
        합니다. 눈앞의 낱말이 애초에 글자이기는 한지 말입니다."""

[[faq]]
q = "완성된 파일이 어디서나 열리나요?"
a = """
        예. 결과는 PDF 1.5로, 또는 준 파일이 필요로 한 가장 높은 버전으로 쓰이고,
        1.5는 2003년 이후에 나온 모든 뷰어가 이해합니다. 장의 어떤 것도 다시
        인코딩되지 않습니다. 글꼴과 그림과 벡터 그림이 바이트 단위로 그대로
        지나가므로, 남은 글자는 이전과 똑같이 선택되고 검색됩니다."""

[[faq]]
q = "비밀번호가 걸린 PDF를 열 수 있나요?"
a = """
        못 하고, 일부러 그렇습니다. 암호화된 문서는 그렇다고 말하는 메시지와 함께
        거부합니다. 비밀번호가 비어 있을 때도 그렇습니다. 많은 스캐너와 복합기가
        그렇게 저장합니다. 파일의 보호를 벗기는 것은 파일에서 낱말을 빼는 것과 다른
        일이고, 조용히 그렇게 하는 도구는 당신이 부탁하지 않은 일을 하는
        것입니다."""

[[faq]]
q = "크기 제한이 있나요? 돈이 드나요?"
a = """
        도구 안에 적힌 제한은 없습니다. 제한은 이 기기입니다. 작업하는 동안 문서를
        메모리에 두므로, 노트북은 수백 메가바이트까지는 불평 없이 견디고 그 위
        어딘가부터 버거워집니다. 무료이고, 계정도 로그인도 체험판도 없습니다. 이
        사이트는 광고로 운영되고, 광고 쪽에는 문서에 대한 것이 전해지지 않습니다."""

[[faq]]
q = "오프라인에서 작동하나요?"
a = """
        예. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다. 아무것도
        업로드되지 않는다는 것을 보이는 가장 간단한 방법이기도 합니다. 문서를
        어딘가로 보내 가려 오는 도구였다면 선을 뽑는 순간 멈췄을 테니까요."""

[schema]
description = "브라우저에서 PDF를 가립니다. 글자를 덮는 것이 아니라 지웁니다. 글자를 그 장의 content stream에서 빼내고, 완성된 파일을 다시 열어 검색해서 사라졌음을 증명하며, 아무것도 업로드되지 않습니다."
features = [
  "글자 위에 사각형을 그리는 대신 글자를 장에서 지웁니다",
  "완성된 파일을 다시 열어 검색해서 낱말이 사라졌음을 증명합니다",
  "한 낱말이 나오는 모든 자리를 찾거나, 이메일과 카드번호와 IBAN과 주민등록번호를 찾습니다",
  "문서의 글자를 읽는 순서대로 보여 주어 낱말마다 누를 수 있게 합니다",
  "북마크와 주석과 양식 칸과 속성에서도 같은 낱말을 뺍니다",
  "줄의 나머지가 밀리지 않도록 빈틈을 벌려 둡니다",
  "어느 장이 스캔이라 뺄 글자가 없는지 말해 줍니다",
  "오프라인 작동. 업로드도, 계정도, 크기 제한도 없습니다",
]

[picker]
title = "여기에 PDF를 놓으십시오"
hint = "또는 클릭해서 고르십시오 &mdash; 한 번에 한 문서씩"
