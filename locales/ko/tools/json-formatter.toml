[[privacy]]
title = "포매터는 받은 것을 그대로 지킵니다."
body = """
 JSON 객체는 쓰신 순서대로 키를
      달고, 적으신 대로 숫자를 적은 채 돌아옵니다. <code>src/shared/parse-json.js</code>가
      <code>JSON.parse</code> 호출이 아니라 직접 쓴 파서이기 때문입니다.
      <code>JSON.parse</code>는 정수처럼 생긴 키의 순서를 바꾸고 스무 자리 id를
      가장 가까운 배정밀도 수로 만들어 버립니다.
      <code>tests/js/text-format.test.js</code>의 테스트가 정확히 그것을
      확인합니다."""

[[privacy]]
title = "구글이 불러오는 것과, 구글에게 주지 않는 것."
body = """
 광고와 측정 스크립트는 구글에서,
      후원 버튼은 Buy Me a Coffee에서 옵니다. 어느 쪽에도 내 텍스트는 한 글자도
      넘어가지 않습니다. 그것을 읽고 해석하고 쓰는 코드는 한 줄도 빠짐없이 이
      출처에서 제공되고 저장소에 공개되어 있습니다."""

[[privacy]]
title = "오프라인에서도 동작합니다."
body = """
 네트워크를 끊어도 도구는 그대로입니다.
      애초에 네트워크를 쓰는 단계가 없었으니까요. 가장 간단한 증거입니다."""

[[howto]]
title = "할 일을 고릅니다."
body = """
 탭 두 개에 상자 하나. <em>정렬</em>은
      JSON, XML, HTML, CSS, YAML을 보기 좋게 펼치거나 납작하게 압축하고,
      <em>변환</em>은 JSON을 YAML이나 XML로 바꾸고 되돌립니다. 방금 정렬한
      텍스트가 곧 변환할 텍스트라서 두 번 붙여 넣을 일이 없습니다."""

[[howto]]
title = "붙여 넣거나, 파일을 놓습니다."
body = """
 선택해서 복사할 수 있는 것이면
      무엇이든 됩니다. 선택 영역에 놓인 파일은 브라우저가 읽어 상자에 넣습니다.
      빼놓을 업로드 단계 자체가 없어요."""

[[howto]]
title = "언어를 알아서 알아내게 두거나, 직접 알려 줍니다."
body = """
 메뉴에 그 텍스트를 무엇으로
      읽었는지가 적히고, 고치는 데는 한 번의 클릭이면 됩니다. 추측은 출발점일
      뿐이라, 말없이 적용하는 대신 보여 드립니다."""

[[howto]]
title = "들여쓰기를 고르거나, 납작하게 눌러 담습니다."
body = """
 공백 두 칸, 네 칸, 아니면
      탭. 납작하게 누른다는 것은 읽기 위해서만 있던 공백을 전부 걷어 낸 같은
      문서라는 뜻이고, 결과에 그것으로 몇 바이트를 아꼈는지가 적힙니다."""

[[howto]]
title = "오류가 있는 자리에서 오류를 읽습니다."
body = """
 여기서 실패하는 파서는 \"위치
      4193에서 예상치 못한 토큰\"이 아니라, 무엇을 발견했는지와 몇째 줄 몇째
      칸인지를 말합니다. 대개 다른 것을 열지 않고도 설정 파일을 고치기에
      충분합니다."""

[[howto]]
title = "결과를 가져갑니다."
body = """
 복사하거나, 결과가 나온 언어의 이름이
      붙은 파일로 내려받으세요."""

[[faq]]
q = "제 텍스트가 어딘가로 업로드되나요?"
a = """
        아닙니다. 이 페이지의 모든 파서와 프린터는 내 기기에서, 내 브라우저
        안에서 도는 함수입니다. 이 도구에는 네트워크 기능이 하나도 없어서 무언가를
        가져오지도, 보내지도 않습니다. 이 페이지의
        <code>Content-Security-Policy</code>에 연결해도 되는 주소가 전부 적혀
        있는데, 그중 이 사이트 것은 하나도 없습니다. 액세스 토큰이나 세션 쿠키,
        고객 기록에 이 도구를 써야 하는 이유가 그것입니다. 그런 것을 남의 포매터에
        붙여 넣는 것은 그들에게 그것을 주는 일이니까요."""

[[faq]]
q = "JSON을 정렬하면 배치 말고 달라지는 것이 있나요?"
a = """
        없습니다. 들리는 것보다 어려운 일입니다. 키는 쓰신 순서를 지킵니다.
        <code>JSON.parse</code> 위에 세운 포매터는 정수처럼 생긴 키를 말없이 앞으로
        옮겨서, <code>{\"10\":a,\"2\":b}</code>가 <code>{\"2\":b,\"10\":a}</code>로
        돌아옵니다. 숫자는 입력하신 자릿수를 지켜서, 스무 자리 id가 배정밀도 수
        때문에 마지막 세 자리를 잃지 않고 <code>1e999</code>가
        <code>null</code>이 되지도 않습니다. 중복된 키는 둘 다 남깁니다. 표준이
        어느 쪽이 이기는지 말하지 않는데, 하나를 버리는 것은 대신 골라 드리는
        일이기 때문입니다."""

[[faq]]
q = "어떤 언어를 정렬할 수 있나요?"
a = """
        JSON, XML, HTML, CSS, YAML입니다. JSON과 XML, HTML, CSS는 납작하게 눌러
        담을 수도 있습니다. YAML은 안 됩니다. 그 짧은 형태가 플로 스타일인데 읽을
        수가 없고, 읽을 수 없다는 것은 파일을 YAML로 두는 이유의 정반대이기
        때문입니다. JavaScript는 일부러 목록에 없습니다. 아래의 그에 대한 질문을
        보세요."""

[[faq]]
q = "JavaScript나 Python, SQL은 왜 정렬하지 않나요?"
a = """
        프로그래밍 언어를 배치한다는 것은 그것을 제대로 파싱한다는 뜻이고, 거의
        맞게 해내는 포매터는 없느니만 못하기 때문입니다. 멀쩡해 보이면서 다른 일을
        하는 코드를 만들어 내니까요. JSON, XML, CSS, YAML은 문법이 손으로 읽고
        누구나 돌려 볼 수 있는 테스트로 확인할 만큼 작습니다. JavaScript 포매터는
        Prettier이고, 그건 1메가바이트짜리 파서이며, 웹페이지가 아니라 편집기에
        있어야 할 물건입니다."""

[[faq]]
q = "제 YAML의 no가 JSON에서 문자열로 나왔습니다. 왜죠?"
a = """
        문자열이 맞기 때문이고, 이 도구가 YAML 1.1이 아니라 1.2로 읽기 때문입니다.
        YAML 1.1에서는 <code>yes</code>, <code>no</code>, <code>on</code>,
        <code>off</code>가 불리언이었는데, 노르웨이의 국가 코드를
        <code>false</code>로 만들어 버리는 그 유명한 버그가 거기서 나옵니다.
        YAML 1.2가 그것을 걷어 냈고 이 도구도 그렇습니다. <code>true</code>,
        <code>false</code>, <code>null</code>, <code>~</code>만 글자 아닌 것으로
        읽습니다. 반대 방향에서는 그 낱말들을 <em>따옴표로 감싸</em> 씁니다. 이
        도구라면 따옴표 없이도 글자로 읽겠지만, 다음에 그 파일을 여는 것이 그러지
        않을 수 있기 때문입니다. PyYAML은 아직 1.1이 기본입니다. 엄격하게 읽고
        보수적으로 쓰는 것이 양쪽 모두에서 옳은 유일한 조합입니다."""

[[faq]]
q = "YAML을 JSON으로 바꾸면 무엇을 잃나요?"
a = """
        주석입니다. JSON에는 그걸 넣을 자리가 없습니다. 앵커와 별칭, 태그는
        짐작하는 대신 아예 거부합니다. 각각이 JSON은 말할 수 없는 것을 말하고
        있는데, 조용히 하나를 골라 해석하는 변환기는 그 파일이 말한 것이 아닌
        문서를 건네주는 셈이니까요. 반대 방향은 잃는 것이 없습니다. 모든 JSON
        문서는 이미 YAML 문서입니다."""

[[faq]]
q = "JSON을 XML로 바꾸면 무엇을 잃나요?"
a = """
        빈 객체와 빈 배열, 빈 문자열의 차이입니다. 셋 다 빈 요소가 됩니다. 그리고
        모든 값의 타입입니다. XML에는 타입이 없기 때문인데, 반대 변환이
        <code>8080</code>을 숫자라고 판단하는 대신 전부 문자열로 두는 이유이기도
        합니다. 배열은 되풀이되는 요소가 되는데, 다시 읽히는 형태가 그것뿐입니다.
        요소 이름이 담을 수 없는 키는 어떤 파서도 읽지 않을 문서로 내보내지 않고
        곤란한 글자를 바꿔 둡니다."""

[[faq]]
q = "HTML을 다시 들여쓰면 페이지 모양이 달라지나요?"
a = """
        달라질 수 있고, 그 점은 정직하게 말씀드립니다. 인라인 요소 둘 사이의
        공백은 두 낱말 사이의 공백이라, 그걸 옮기는 것은 공짜가 아닙니다. 그걸
        붙들어 두는 장치가 둘 있습니다. <code>&lt;pre&gt;</code>와
        <code>&lt;textarea&gt;</code>는 있던 그대로 복사되고, 글자만 담고 있는
        요소는 한 줄에 그대로 남습니다. 그 밖의 것들이 배치됩니다."""

[[faq]]
q = "얼마나 큰 파일까지 다룰 수 있나요?"
a = """
        여기 정해 둔 제한은 없습니다. 그 값을 치를 서버가 없으니까요. 현실적인
        한계는 기기 쪽입니다. 몇 메가바이트짜리 JSON은 괜찮고, 아주 긴 문서라면
        페이지가 키보드를 두고 다투는 대신 타이핑이 잠시 멎기를 기다렸다가 다시
        정렬합니다."""

[[faq]]
q = "무료인가요? 가입해야 하나요?"
a = """
        무료이고 계정도, 로그인도, 체험판도 없으며 붙여 넣는 양에도 제한이
        없습니다. 이 사이트는 광고로 유지되는데, 그 광고에도 내 텍스트에 관한 것은
        넘어가지 않습니다."""

[[faq]]
q = "오프라인에서도 되나요?"
a = """
        됩니다. 페이지를 한 번 불러온 다음 인터넷을 끊어도 계속 동작합니다.
        아무것도 업로드되지 않는다는 가장 간단한 증명이기도 하고요. 텍스트를
        어딘가로 보내서 정렬해 오는 도구라면 선을 뽑는 순간 멈춰 버릴 테니까요."""

[schema]
description = "JSON, XML, HTML, CSS, YAML을 정렬하고 압축하고, JSON을 YAML이나 XML로 바꾸고 되돌립니다. 파서는 브라우저 안에서 돌아가고 아무것도 업로드되지 않습니다."
features = [
  "JSON, XML, HTML, CSS를 정렬하고 눌러 담으며 YAML을 펼칩니다",
  "JSON 키의 순서와 모든 숫자의 자릿수를 그대로 지킵니다",
  "오류가 몇째 줄 몇째 칸에 있는지 말로 알려 줍니다",
  "JSON을 YAML과 XML로, 또 그 반대로 변환하며 각 방향이 무엇을 잃는지 말해 줍니다",
  "YAML 1.2로 읽으므로 yes와 no가 문자열로 남습니다",
  "붙여 넣은 것뿐 아니라 놓아 둔 파일에도 동작합니다",
  "오프라인 동작. 업로드 없음, 가입 없음",
]

[picker]
title = "여기에 파일을 놓으세요"
hint = "또는 클릭해서 고르기. 아무 텍스트 파일이나 됩니다."
