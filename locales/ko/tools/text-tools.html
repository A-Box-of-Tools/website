<main id="main">
  <!-- 1단계 &mdash; 네 가지 일 중 무엇인지 -->
  <section class="card">
    <h2><span class="step">1</span> 할 일 고르기</h2>

    <!--
      A tab strip rather than four pages, because the four jobs share an input:
      the JSON you just formatted is the JSON you want to diff against the one
      from the other branch, and retyping it into a second tool is the thing
      this arrangement exists to avoid. `role="tablist"` and the arrow keys are
      wired in main.js.
    -->
    <div class="tabs" role="tablist" aria-label="텍스트로 무엇을 할지">
      <button type="button" role="tab" id="tab-format" class="tab" data-mode="format"
              aria-selected="true" aria-controls="options-format">정렬</button>
      <button type="button" role="tab" id="tab-convert" class="tab" data-mode="convert"
              aria-selected="false" tabindex="-1" aria-controls="options-convert">변환</button>
      <button type="button" role="tab" id="tab-encode" class="tab" data-mode="encode"
              aria-selected="false" tabindex="-1" aria-controls="options-encode">인코딩</button>
      <button type="button" role="tab" id="tab-diff" class="tab" data-mode="diff"
              aria-selected="false" tabindex="-1" aria-controls="options-diff">비교</button>
    </div>

    <div class="settings" id="options-format" role="tabpanel" aria-labelledby="tab-format">
      <div class="field">
        <label for="language">언어</label>
        <select id="language">
          <option value="auto" selected>텍스트를 보고 알아내기</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="yaml">YAML</option>
        </select>
        <p class="field-note" id="language-note">
          추측은 출발점일 뿐이고, 고치는 데는 한 번의 클릭이면 됩니다.
        </p>
      </div>

      <div class="field">
        <label for="indent">들여쓰기</label>
        <select id="indent">
          <option value="2" selected>공백 두 칸</option>
          <option value="4">공백 네 칸</option>
          <option value="tab">탭</option>
        </select>
      </div>

      <div class="field">
        <label for="style">배치</label>
        <select id="style">
          <option value="pretty" selected>펼치기</option>
          <option value="minify">납작하게 눌러 담기</option>
        </select>
        <p class="field-note" id="style-note"></p>
      </div>

      <div class="field checks">
        <label class="check" for="sort-keys">
          <input type="checkbox" id="sort-keys">
          모든 객체의 키를 정렬하기
        </label>
        <p class="field-note">
          코드 포인트가 아니라 읽히는 대로 정렬하므로 <code>item2</code>가
          <code>item10</code>보다 앞에 옵니다. JSON에만 해당합니다.
        </p>
      </div>
    </div>

    <div class="settings" id="options-convert" role="tabpanel" aria-labelledby="tab-convert" hidden>
      <div class="field">
        <label for="conversion">변환</label>
        <select id="conversion"></select>
        <p class="field-note" id="conversion-note"></p>
      </div>

      <div class="field" id="root-field" hidden>
        <label for="root-name">바깥 요소의 이름</label>
        <input type="text" id="root-name" value="root" spellcheck="false" autocomplete="off">
        <p class="field-note">
          XML에는 맨 위에 요소가 하나 있어야 하는데 JSON에는 없으므로, 하나를
          지어내야 합니다.
        </p>
      </div>
    </div>

    <div class="settings" id="options-encode" role="tabpanel" aria-labelledby="tab-encode" hidden>
      <div class="field">
        <label for="codec">인코딩</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>어느 방향으로</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>인코딩</strong> 평문을 넣으면 인코딩된 것이 나옵니다.</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>디코딩</strong> 인코딩된 것을 넣으면 평문이 나옵니다.</span>
          </label>
        </fieldset>
      </div>
    </div>

    <div class="settings" id="options-diff" role="tabpanel" aria-labelledby="tab-diff" hidden>
      <div class="field">
        <label for="view">보여 주는 방식</label>
        <select id="view">
          <option value="split" selected>좌우로 나란히</option>
          <option value="unified">한 열로</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          달라진 곳만, 위아래 세 줄과 함께 보기
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          공백 무시
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          대소문자 무시
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          빈 줄 무시
        </label>
      </div>
    </div>
  </section>

  <!-- 2단계 &mdash; 텍스트 자체 -->
  <section class="card">
    <h2><span class="step">2</span> 붙여 넣기</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes" id="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input" id="input-label">입력한 텍스트</label>
          <span class="count" id="input-count">비어 있음</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="여기에 JSON, XML, HTML, CSS, YAML을 붙여 넣거나 위에 파일을 놓으세요."></textarea>
      </div>

      <div class="pane" id="pane-b" hidden>
        <div class="pane-head">
          <label for="input-b">비교할 다른 쪽</label>
          <span class="count" id="input-b-count">비어 있음</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="비교 대상이 될 판본을 붙여 넣으세요."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count" id="detected"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">예시로 해 보기</button>
        <button type="button" id="swap" class="ghost" hidden>좌우 바꾸기</button>
        <button type="button" id="clear" class="ghost danger">지우기</button>
      </div>
    </div>
  </section>

  <!-- 3단계 &mdash; 나온 것 -->
  <section class="card">
    <h2><span class="step">3</span> 결과 가져가기</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">아직 없습니다.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>복사</button>
        <a id="download" class="ghost as-button" hidden download>내려받기</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>

    <div id="diff-view" class="diff" hidden></div>
  </section>
</main>
