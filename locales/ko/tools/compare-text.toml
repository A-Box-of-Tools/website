howto_heading = "업로드하지 않고 두 텍스트를 비교하는 방법"

card = """
            두 텍스트를 비교해 무엇이 달라졌는지 줄 단위, 단어 단위로 봅니다.
            계약서나 공개 전 코드를 누구에게도 넘기지 않고 붙여 넣으세요."""

