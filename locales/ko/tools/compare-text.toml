live_hint = """
      그냥 믿지 마시고 직접 확인해 보세요. 개발자 도구의 '네트워크' 탭을 켜 놓고
      무언가를 비교해 보십시오. 붙여 넣은 것의 한 글자도 실려 나가는 요청이
      없습니다. 아니면 인터넷을 끊고 그냥 비교해 보셔도 됩니다."""

read_first = """
, 그리고 <code>src/diff.js</code>를 보시면
      됩니다. 마이어스 알고리즘, 달라진 줄 안에서 단어 단위로 한 번 더 도는 부분,
      그리고 병적인 비교가 페이지를 얼리지 못하게 막는 세 가지 안전장치가 거기
