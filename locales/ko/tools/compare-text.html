<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> 두 텍스트 붙여 넣기</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">원본</label>
          <span class="count" id="input-count">비어 있음</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="원본을 여기에 붙여 넣으세요 - 또는 위에 파일 두 개를 놓으세요."></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">바뀐 쪽</label>
          <span class="count" id="input-b-count">비어 있음</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="비교 대상이 될 판본을 붙여 넣으세요."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">예시로 해 보기</button>
        <button type="button" id="swap" class="ghost">좌우 바꾸기</button>
        <button type="button" id="clear" class="ghost danger">지우기</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> 읽는 방식 고르기</h2>

    <div class="settings">
      <div class="field">
        <label for="view">보여 주는 방식</label>
        <select id="view">
          <option value="split" selected>좌우로 나란히</option>
          <option value="unified">한 열로</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          달라진 곳만, 위아래 세 줄과 함께 보기
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          공백 무시
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          대소문자 무시
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          빈 줄 무시
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> 무엇이 달라졌는지 읽기</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">아직 없습니다.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>복사</button>
        <a id="download" class="ghost as-button" hidden download>내려받기</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
