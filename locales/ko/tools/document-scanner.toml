live_hint = """
      말만 믿지 마십시오. 개발자 도구를 열고 네트워크 탭을 보면서 종이를 스캔해
      보십시오. 사진도, 축소판도, 파일 이름도, 모서리 한 점의 위치도 실어 나르는
      요청은 하나도 없습니다. 아니면 인터넷을 끊고 그냥 스캔해 보십시오."""

read_first = """
, 모델 없이 모서리를 찾는 방법은
      <code>src/detect.js</code>, 반듯하게 펴는 일은 <code>src/warp.js</code>,
      고르지 않은 빛을 나눠서 걷어 내는 일은 <code>src/clean.js</code>입니다."""

howto_heading = "휴대폰 카메라로 문서 스캔하는 법"

card = """
            종이 사진을 반듯하게 펴고 정리해서 문서로 만듭니다. 네 모서리는 찾아
