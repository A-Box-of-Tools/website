og_image_alt = "문서 스캐너 - 종이 사진을 반듯하게 펴고 정리하되, 업로드하지 않고"

pledge = """
    사진을 디코딩하고, 반듯하게 펴고, 정리하고, PDF로 쓰는 일은 모두 이 브라우저가
    산술과 이미 들어 있는 코덱만으로 합니다. 이 도구에는 네트워크 기능이 아예
    없어서 가져올 것도 보낼 것도 없습니다. 여기서 그것이 중요한 이유는 사람들이
    어떤 종이를 찍는지에 있습니다. 여권, 급여명세서, 임대차 계약서, 관공서가
