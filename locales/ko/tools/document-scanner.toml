#

name = "문서 스캐너"
heading = "문서&nbsp;스캐너 <span class=\"h1-kw\">&mdash; 종이 사진을 반듯하게</span>"
tagline = "종이를 찍으십시오. 스캔한 것처럼 생긴 것이 돌아옵니다."

title = "문서 스캐너 &mdash; 사진을 스캔한 PDF로, 업로드 없이"
description = "휴대폰으로 찍은 종이 사진을 반듯하고 고르게 밝은 PDF로 만듭니다. 네 모서리는 찾아 주고, 원근은 되돌리고, 그림자는 나눠서 걷어 냅니다. 전부 브라우저 안에서 돌아갑니다. 아무것도 업로드되지 않습니다."
