#
# ---------------------------------------------------------------------------
# The frame's own words. Everything with {{ }} in it is a name the build
# resolves, and the build refuses to render a name it cannot find.
#
# Korean is verb-final without exception, so a sentence assembled from two
# fragments either side of a value could never come out right. Written whole,
# the value sits where Korean puts it.
#
# One consequence worth writing down, because it reaches into every file in
# tools/ beside this one. Korean particles agree with the sound before them:
# 은/는, 을/를. The sentences below put 은 and 을 straight after a value the
# build substitutes, so every noun those values may hold has to end in a
# 받침 - "이미지 파일", not "이미지". That is why the [words] tables under
# tools/ read the way they do. Writing the particle both ways in the frame was
# the alternative, and it puts a slash in the middle of the one sentence on the
# page that has to sound like a person said it.
# ---------------------------------------------------------------------------
#

[ui]
languages = "언어"
lang_auto = "브라우저의 언어 설정에 따라 이 페이지를 한국어로 표시하고 있습니다."
breadcrumb = "탐색 경로"
