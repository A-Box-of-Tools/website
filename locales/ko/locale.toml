#
# 한국어.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# The addresses are Hangul, in [slugs] below. That is the same decision every
# other language here made and for the same reason: the slug is the one part of
# a page's markup that is also a keyword, and a Korean reader looking for this
# tool types 이미지 압축, not "compress image". Leaving the English word in the
# URL throws that away in the one market the page was translated for.
#
# The alternative considered and rejected was a romanised slug -
# "imiji-apchuk" - which is readable in a URL bar and is a phrase nobody has
# ever typed into a search box. Percent-encoding is a display detail: a browser
# shows 한국어 in the bar and encodes it on the wire, and Naver, Daum and Google
# all index Hangul URLs.
#
# 합니다체 throughout, softened with the occasional 해요 ending where a sentence
# is an aside rather than a statement of fact. That mixture is the register a
# consumer tool speaks in Korean: formal enough to be believed on the sentences
# that make a promise, warm enough not to read as a legal notice. Every file
# under this folder holds to it; nothing drifts into 한다체 or plain 해요체.
#

lang = "ko"
name = "Korean"
endonym = "한국어"

# Finished: every tool, every guide, the two prose pages and the roadmap list
# are Korean. While this is true a missing key is a build failure rather than a
# quiet fall back to English, and the link check runs over the Korean pages as
# well - see check_complete in buildlib/i18n.py.
complete = true

#
# ---------------------------------------------------------------------------
# The addresses.
#
# Keyed by the ENGLISH slug on the left, which is the name of the thing, and
# never by the Korean one. The Korean is an address and appears only on the
# right.
#
# These are the words a Korean speaker actually types into a search box, not
# translations of the English slug. Where the English names a format and the
# search names a job, the job wins: "image-to-ico" is 파비콘-만들기, because
# nobody looks for "image to ICO" and a great many people look for how to make
# a favicon.
#
# Hangul as itself, hyphens between words, and a Latin token wherever the Latin
# token is what gets typed - pdf, heic, svg, gif, json, qr, base64. Korean
# search queries are written that way and a slug that spelled them out in
# Hangul would be a slug for a query nobody makes.
# ---------------------------------------------------------------------------
#

[slugs]
# The tools.
"compress-image" = "이미지-압축"
"compress-pdf" = "pdf-용량-줄이기"
"crop-video" = "동영상-화면-자르기"
"edit-audio" = "오디오-편집"
# Named for the job rather than for the format, like the German. "EXIF 편집기"
# is not a thing anybody searches for; deleting the data out of a photo is.
"exif-editor" = "exif-정보-삭제"
# 한국어로 이 작업을 찾을 때 실제로 치는 말이 "가리기"입니다.
"redact-image" = "이미지-가리기"
"gif-maker" = "gif-만들기"
"heic-to-jpg" = "heic-jpg-변환"
# The job again, and the clearest case of it: 증명사진 is a word every Korean
# adult has typed, and "ID photo" is not.
"id-photo" = "증명사진-만들기"
# base64 rather than "data URI": the encoding is what gets searched, and the
# URI is what the result happens to be called.
"image-to-data-uri" = "이미지-base64-변환"
"image-to-ico" = "파비콘-만들기"
"images-to-pdf" = "이미지-pdf-변환"
"images-to-video" = "사진으로-동영상-만들기"
# QR rather than barcode. The page makes both and the description says so, but
# the searches are not close: one address has to pick the louder half.
"qr-barcode" = "qr코드-만들기"
# 만들기의 반대쪽. 스캔이 검색되는 말이고, 읽기는 프로그램이 하는 일입니다.
"qr-barcode-reader" = "qr코드-스캔"
"resize-image" = "이미지-크기-조절"
"reverse-video" = "동영상-거꾸로-재생"
"svg-to-image" = "svg-png-변환"
# Four jobs, one address, and the one people arrive looking for is the JSON
# formatter. 포맷터 rather than the standard 포매터, because the slug follows
# what is typed and dev writing types 포맷터.
"format-json" = "json-포맷터"
"encode-text" = "base64-인코딩"
"compare-text" = "텍스트-비교"
# 자르기 on its own reads as trimming in Korean, which is what this tool does.
# Cropping the picture is 화면-자르기, above.
"trim-video" = "동영상-자르기"
"video-to-gif" = "동영상-gif-변환"
"gif-analyzer" = "gif-분석"
"grab-frame" = "동영상-캡처"
"merge-pdf" = "pdf-합치기"
"split-gif" = "gif-프레임-분리"
"trim-audio" = "오디오-자르기"
# 암호가 아니라 비밀번호입니다. 암호는 암호학의 암호고, 로그인에 쓰는 것을
# 한국 사이트는 모두 비밀번호라고 부릅니다.
"password-generator" = "비밀번호-생성기"
# 사전에 있는 '저속 촬영'이 아니라 실제로 검색창에 치는 '타임랩스'.
"timelapse-video" = "타임랩스-만들기"
"hash-checksum" = "체크섬-확인"
# DICOM은 DICOM으로 둡니다. 병원이 건네는 CD에 그렇게 적혀 있고, 번역된 말로
# 찾는 사람은 없습니다.
"dicom-viewer" = "dicom-뷰어"
"document-scanner" = "문서-스캔"
# 이미지-가리기와 같은 말입니다. 같은 약속이기 때문입니다. 글자가 파일에서
# 빠지는 것이지, 위에 검은 칸을 덮는 것이 아닙니다.
"redact-pdf" = "pdf-가리기"
"stack-images" = "이미지-스택"

# The indexes and the legal pages. 개인정보처리방침 is the name that page has in
# Korean law and on every Korean site, so it is what a reader scans for.
"guides" = "가이드"
"roadmap" = "로드맵"
"privacy" = "개인정보처리방침"
"terms" = "이용약관"

# The guides. Each one is the question its readers ask, in the words they ask it
# in, rather than a translation of the English title.
"guides/combine-images-into-a-pdf" = "가이드/이미지-pdf-합치기"
"guides/compress-an-image-to-a-target-size" = "가이드/이미지-용량-줄이기"
