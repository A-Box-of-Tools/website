[hub]
title = "무료 브라우저 도구 &mdash; 업로드 없이, 회원가입 없이 | abox.tools"
# 한국어 검색 결과는 대략 이 길이에서 잘립니다.
description = "파일을 업로드하지 않는 무료 브라우저 도구. 이미지를 PDF나 MP4로 묶고, 원하는 용량에 맞춰 압축하고, 영상 화면을 자르고, EXIF 정보를 지웁니다. 전부 브라우저 안에서."
heading = "서버를 거치지 않는 도구 상자"
og_title = "A Box of Tools &mdash; 서버를 거치지 않는 도구들"
og_description = "한 가지 일만 하는 작은 도구들이 브라우저 안에서 모든 작업을 끝냅니다. 파일은 내 기기 밖으로 나가지 않아요."
og_image_alt = "abox.tools - 서버를 거치지 않는 도구들"
schema_description = "한 가지 일만 하는 작은 도구들이 모든 작업을 브라우저 안에서 끝냅니다. 업로드되는 것은 없고 계정도 필요 없습니다."
schema_about = "파일을 업로드하지 않고 내 기기에서 바로 처리하는 브라우저 파일 도구"

lede = """
    한 가지 일만 하는 작은 도구들이 모든 작업을 브라우저 안에서 끝냅니다.
    파일은 내 기기에 그대로 남습니다. 올릴 것도, 만들 계정도 없고 추적하지도
    않습니다."""

support_note = """
      이 도구들은 무료이고 앞으로도 무료입니다. 덕분에 일 하나 덜었다면, 이
      사이트에서 뭔가를 부탁하는 자리는 여기 하나뿐이에요."""

# 약속이 아니라 확인할 수 있는 세 가지 사실로 적었습니다(영어판과 같습니다).
[[hub.guarantees]]
title = "파일이 내 기기 밖으로 나가지 않습니다"
body = """
        파일을 열고 읽고 처리하는 일은 내 브라우저가 내 기기의 성능으로 합니다.
        도구마다 <code>Content-Security-Policy</code>에 연결해도 되는 주소가
        빠짐없이 적혀 있는데, 그중 우리 것은 하나도 없습니다."""

[[hub.guarantees]]
title = "파일 정보도 어디로든 보내지 않습니다"
body = """
        파일은 물론이고 미리보기 이미지도, 파일 이름도, 용량도, 몇 개를
        골랐는지도 보내지 않습니다. 여기 있는 어떤 도구도 그런 것을 읽어
        내보내지 않아요. 읽어 갈 서버가 반대편에 아예 없으니까요."""

[[hub.guarantees]]
title = "오프라인에서도 동작합니다"
body = """
        도구를 한 번 연 다음 인터넷을 끊어도 파일 작업은 하던 그대로 이어집니다.
        흉내 내기 어려운 대목이에요. 처리하려고 파일을 어디론가 보내는 도구라면
        그 순간 멈춰 버릴 테니까요."""

[[hub.categories]]
id = "images"
name = "이미지"
note = "용량을 줄이고, 크기를 바꾸고, 사진이 조용히 담아둔 정보를 지웁니다. 어느 것도 기기 밖으로 나가지 않습니다."

[[hub.categories]]
id = "video-and-animation"
name = "영상과 애니메이션"
note = "자르고, 변환하고, 사진으로 만들어냅니다. 영상이 기기 밖으로 나갈 일은 없습니다."

[[hub.categories]]
id = "documents-and-audio"
name = "문서와 오디오"
note = "문서 순서를 바꾸거나 녹음을 다듬는 일까지, 어느 쪽도 어디로 보내지 않고 끝냅니다."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "텍스트와 코드와 비밀번호"
note = "읽고, 확인하고, 여기서 만듭니다. 토큰도 설정 파일도 비밀번호도 남의 서버로 가지 않습니다."

