[[privacy]]
title = "Le contenu va à votre lecteur, et nulle part ailleurs."
body = "Le texte et les fichiers voyagent par un canal de données WebRTC : une connexion directe, chiffrée en DTLS, entre votre navigateur et celui de chaque lecteur. Aucun serveur ne se trouve sur ce chemin. Le mode Réseau local utilise les adresses réseau propres aux navigateurs, sans découverte publique d'adresses ni relais internet. Un VPN ou les règles réseau du navigateur peuvent modifier le trajet de ces adresses ; cela ne garantit pas que les données restent dans un bâtiment. En mode habituel, un lecteur dont le réseau ne peut pas être atteint directement peut choisir, sur sa propre page, un relais chiffré : il fait suivre le même texte chiffré et ne peut pas le lire."

[[privacy]]
title = "Ce qu'est l'entremetteur, et tout ce qu'il voit."
body = "Une connexion directe a besoin d’une présentation. Cette page d’accueil ouvre automatiquement un WebSocket vers l’entremetteur pour les noms de lien locaux visibles ; commencer un partage en ouvre un autre pour le partage lui-même. Un lecteur utilise une seule connexion de présentation. Le serveur rapproche le lecteur et la personne qui partage sous ce nom et transmet quelques kilooctets de négociation. Il n’écrit aucun stockage ; les salles et les entrées de l’annuaire s’arrêtent avec leurs connexions ouvertes. Il voit les noms, les heures de connexion, les adresses IP et la négociation, mais pas le texte, les fichiers, les décisions d’admission ou les présentations privées. L’annuaire affiche les noms des personnes connectées utilisant la même adresse IP publique. Un VPN ou une adresse partagée par le fournisseur peut inclure d’autres réseaux ; des appareils voisins avec une autre adresse publique peuvent manquer. Tout le code est dans le dépôt. Cloudflare garde les journaux de connexion sept jours : adresse, nom de lien et heure, jamais de contenu."

[[privacy]]
title = "Rien n'est stocké : fermer l'onglet, c'est l'effacement."
body = "Le partage n'existe que tant que votre onglet est ouvert. Fermez-le : les nouveaux lecteurs ne trouvent plus rien, et ceux qui lisaient voient leur copie disparaître &mdash; ce que quelqu'un avait copié ou téléchargé avant reste à lui, comme tout ce que vous lui auriez remis en main propre. Le brouillon que vous tapez reste dans le stockage de votre propre navigateur, pour être encore là la prochaine fois, et seulement là ; marqué éphémère, il n'est nulle part."

[[privacy]]
title = "Le nom de lien est une adresse, et Privé est le verrou."
body = "Toute personne qui connaît ou devine un nom peut ouvrir le partage correspondant. Les partages locaux visibles affichent leur nom aux autres navigateurs utilisant la même adresse IP publique. Le nom est alors public au sein de ce groupe. Gardez Privé activé pour tout contenu sensible. Il est activé par défaut : chaque lecteur se présente par le canal chiffré entre navigateurs, et rien n’est envoyé avant votre approbation."

[[privacy]]
title = "Une connexion directe montre à chaque bout l'adresse de l'autre."
body = "C'est cela, le pair à pair, et le lecteur le sait avant que cela n'arrive : ouvrir un lien de partage ne fait que demander à l'entremetteur si quelqu'un partage ; la page dit ensuite clairement que se connecter révèle à chaque bout l'adresse IP de l'autre, et attend un clic. Jusqu'à ce clic, qui partage ne sait même pas que le lecteur existe."

[[privacy]]
title = "Ce que Google charge, et ce qu'il ne reçoit pas."
body = "Les scripts de publicité et de mesure viennent de Google, le bouton de don de Buy Me a Coffee. Aucun d'eux ne reçoit le texte, les fichiers, leurs noms ou tailles, ni qui s'est connecté. L'exception est l'adresse de cette page elle-même : le lien d'un lecteur porte le nom du lien, et le script publicitaire lit l'adresse. Un partage qui doit rester entre vous veut l'interrupteur privé. Chaque ligne qui touche au contenu est servie depuis cette origine et figure dans le dépôt."

[[howto]]
title = "Écrivez le texte, ou joignez les fichiers."
body = "L'éditeur est le partage : ce qu'il contient quand un lecteur se connecte est ce qu'il reçoit, et toute modification atteint ensuite les lecteurs connectés en direct, pendant que vous tapez. Les fichiers voyagent par le même canal, jusqu'à 200&nbsp;Mo pièce ; les lecteurs voient la liste et ne récupèrent que ce qu'ils demandent &mdash; personne ne dépense de bande passante pour un fichier dont il ne voulait pas."

[[howto]]
title = "Activez Markdown si le texte mérite une mise en forme."
body = "Un seul interrupteur. Titres, gras, listes, code et liens se rendent en direct à côté de l'éditeur pendant la frappe, et les lecteurs reçoivent la vue mise en forme par défaut, avec un bouton pour revenir à la source. Le moteur de rendu est livré avec cette page et échappe tout : un texte partagé ne peut pas devenir un script sur la machine d'un lecteur, quel qu'en soit l'auteur."

[[howto]]
title = "Nommez le lien, ou gardez la suggestion."
body = "Le nom est l’adresse : <code>brave-otter-42</code> peut se dire à travers une pièce, au téléphone ou se recopier d’un tableau. Les partages locaux visibles affichent leur nom ; gardez donc Privé activé pour les contenus sensibles. Pour un partage accessible uniquement par lien, un nom difficile à deviner est aussi utile. Un nom déjà utilisé par un partage actif est refusé et se libère dès que vous arrêtez."

[[howto]]
title = "Décidez qui entre."
body = "Privé est le réglage par défaut : chaque lecteur est invité à se présenter &mdash; un nom, un indice, n'importe quoi que vous reconnaîtriez &mdash; et vous voyez le message avec un bouton pour le laisser lire ou l'éconduire. La présentation voyage par le canal direct, si bien que même l'entremetteur ignore qui a frappé. Décochez pour un partage ouvert, lisible par quiconque a le nom."

[[howto]]
title = "Lancez le partage, et laissez l'onglet ouvert."
body = "L'onglet est le serveur : le partage est joignable tant qu'il est ouvert et éveillé, et pas un instant de plus. Un portable qu'on referme y met fin aussi. Copiez le lien, ou dites simplement le nom &mdash; un lecteur peut le taper en <code>#name</code> au bout de l'adresse de cette page. Pour le mode Réseau local, copiez le lien : il contient <code>?local=1</code> avant le nom. Un lecteur utilisant un autre mode est invité à choisir avant de réessayer avec le vôtre."

[[howto]]
title = "De l'autre côté : consentir, puis frapper."
body = "Qui ouvre le lien apprend que quelqu'un partage, est prévenu qu'une connexion directe montre à chaque bout l'adresse réseau de l'autre, et ne se connecte que par choix. Sur un partage privé, il se présente et vous attend. Ce qu'il reçoit se met à jour en direct pendant que vous écrivez, et disparaît quand vous fermez l'onglet."

[[faq]]
q = "Quelque chose est-il téléversé, quelque part ?"
a = "Aucun texte ou fichier n’est téléversé. Ils vont directement de votre navigateur à celui de chaque lecteur par un canal WebRTC chiffré. Le serveur transporte la présentation et les noms de lien locaux publiés, jamais le contenu. Les salles et les entrées de l’annuaire s’arrêtent avec leurs connexions ouvertes. Les journaux de connexion de Cloudflare conservés sept jours contiennent des métadonnées, jamais de contenu."

[[faq]]
q = "Alors pourquoi cet outil parle-t-il à un serveur, sur ce site précisément ?"
a = "Parce que deux navigateurs ne se trouvent pas seuls : l’entremetteur rapproche la personne qui a saisi <code>brave-otter-42</code> et celle qui partage sous ce nom, puis transmet la négociation. Il est nommé dans la <code>Content-Security-Policy</code> de cette page, et son code est dans le même dépôt. Il liste aussi les noms de lien locaux publiés pour les navigateurs utilisant la même adresse IP publique. Il ne détient aucun contenu et ne peut pas lire le canal chiffré entre navigateurs."

[[faq]]
q = "Que peut voir ce serveur, exactement ?"
a = "Il voit les noms de lien utilisés, les arrivées et départs des personnes qui partagent et des lecteurs, leurs adresses IP et la négociation. L’annuaire groupe les noms publiés selon l’adresse IP publique vue par le serveur. Il ne voit ni texte, ni fichiers, ni leurs noms ou tailles, ni admissions privées, ni présentations. Tout cela passe par le canal chiffré de bout en bout entre navigateurs. Cloudflare garde les journaux de connexion sept jours : nom de lien, adresse et heure, jamais de contenu."

[[faq]]
q = "Que se passe-t-il quand je ferme l'onglet ?"
a = "Le partage s'arrête partout à la fois. Le lien cesse de fonctionner en une seconde ou deux, et les lecteurs qui ont encore la page ouverte voient leur copie disparaître, avec un mot disant que le partage est terminé. Ce n'est pas une demande d'effacement adressée à un serveur &mdash; il n'y a pas de copie serveur à effacer. L'onglet était le seul endroit où le partage existait, et le fermer est tout le ménage qu'il y a à faire."

[[faq]]
q = "Un lecteur peut-il garder ce que j'ai partagé ?"
a = "Tant que le partage est ouvert, oui &mdash; c'est cela, partager. Un lecteur peut copier le texte ou télécharger un fichier, et ce qu'il a pris est à lui, exactement comme si vous le lui aviez remis par n'importe quel autre moyen. Ce que garantit l'arrêt, c'est l'avenir : personne de nouveau n'y accède, et les pages ouvertes cessent de l'afficher. Aucun outil ne peut rappeler ce qui est déjà arrivé, et cette page ne prétend pas le contraire."

[[faq]]
q = "Qu'est-ce que le mode privé ?"
a = "Le réglage par défaut. Chaque lecteur qui arrive apprend que le partage est privé et est invité à se présenter ; vous voyez le message &mdash; &laquo;&nbsp;c'est Alice, du stand-up&nbsp;&raquo; &mdash; avec des boutons pour le laisser lire ou l'éconduire, et rien n'est envoyé avant votre décision. La présentation voyage par le canal direct déjà chiffré, si bien que le serveur ne sait jamais qui a frappé ni ce que vous avez décidé. Décoché avant le partage, cela donne un partage ouvert."

[[faq]]
q = "Pourquoi le lecteur verra-t-il mon adresse IP ?"
a = "Parce que la connexion est réellement directe, et qu'une connexion directe relie deux adresses : chaque bout apprend nécessairement celle de l'autre, comme lors d'un appel téléphonique. Le lecteur est prévenu avant qu'aucune connexion n'existe et ne se connecte que par choix ; jusque-là, vous ne savez même pas qu'il a ouvert le lien. Si cet échange ne convient pas à un partage donné, un service qui relaie par un serveur est l'alternative &mdash; avec l'échange inverse."

[[faq]]
q = "Quelle taille pour les fichiers, et quelle vitesse ?"
a = "Jusqu'à 200&nbsp;Mo par fichier, de tout type, et aussi vite que la plus lente des deux connexions &mdash; aucun serveur au milieu pour freiner ou compter. Deux machines disposant d'une connexion locale qui fonctionne transfèrent à la vitesse de ce réseau ; les VPN et le routage du navigateur peuvent modifier le trajet. Les lecteurs récupèrent chaque fichier à la demande : joindre quelque chose de gros ne coûte rien tant que personne ne le demande vraiment."

[[faq]]
q = "Cela fonctionne-t-il hors ligne ?"
a = "À moitié, honnêtement : l'éditeur, oui &mdash; la page se charge, votre brouillon est là, le Markdown se rend, écrire et enregistrer se passent de tout réseau. Partager, non, et c'est impossible : atteindre le navigateur de quelqu'un d'autre est un acte réseau, et la présentation exige l'entremetteur. C'est le seul outil de ce site dont la tâche est impossible hors ligne, et laisser entendre autre chose serait malhonnête."

[[faq]]
q = "Et si nous n'arrivons pas à nous connecter ?"
a = "L'offre de relais décrite ci-dessous concerne seulement le mode de connexion habituel. La plupart des paires de navigateurs s'atteignent directement une fois présentées ; une minorité non, typiquement quand l'un des bouts est sur le réseau à adresses partagées d'un opérateur mobile ou derrière un réseau d'entreprise strict. Cette page ne passe jamais à un relais en douce &mdash; cela changerait ce qu'est cet outil sans le dire &mdash; : au bout de vingt secondes, elle dit clairement qu'aucune connexion directe n'a abouti, et en propose un au lecteur : un relais exploité par Cloudflare, qui fait suivre les octets chiffrés entre les deux navigateurs sans pouvoir les lire, puisque la clé ne quitte jamais les deux bouts. Le lecteur le choisit en connaissance de cause, sur sa propre page, après avoir appris ce que le relais voit &mdash; les deux adresses, comme la connexion directe &mdash;, et rien n'y est stocké non plus. Votre côté du partage ne change pas : votre navigateur n'envoie toujours qu'à ce lecteur-là, comme il le ferait s'il était derrière un VPN. Le mode Réseau local ne propose jamais de relais. Vérifiez que les deux appareils utilisent le même réseau Wi-Fi ou Ethernet et que l'isolation du réseau invité, un pare-feu ou un VPN ne bloque pas la connexion."

[[faq]]
q = "Le rendu Markdown est-il sûr, si n'importe qui peut partager n'importe quoi ?"
a = "Cette question est la raison pour laquelle le moteur de rendu tient en quatre-vingts lignes dans le code de cette page plutôt que dans une bibliothèque. Chaque caractère est échappé avant qu'aucune balise ne soit émise, seul un jeu fixe de balises inoffensives peut être produit, et les liens n'acceptent que <code>http</code>, <code>https</code> et <code>mailto</code> &mdash; un lien <code>javascript:</code> reste du texte inerte. Un texte partagé ne peut pas devenir un script sur votre machine, quel qu'en soit l'auteur, et les quatre-vingts lignes se lisent."

[[faq]]
q = "Deux personnes peuvent-elles partager sous le même nom ?"
a = "Pas en même temps. Un partage vivant par nom, imposé chez l'entremetteur : qui arrive en second est refusé et invité à choisir un autre nom. Dès qu'un partage s'arrête, son nom redevient libre &mdash; ce qui veut aussi dire qu'un lien conservé ne vaut que ce que vaut le partage derrière : le même nom, la semaine prochaine, peut appartenir à quelqu'un d'autre. Traitez un lien comme appartenant à un moment, pas à une personne."

[[faq]]
q = "Est-ce gratuit, et faut-il un compte ?"
a = "Gratuit, sans compte, sans inscription, et sans limite digne d'être mentionnée &mdash; seize lecteurs simultanés par partage. Le site porte de la publicité, qui le finance ; les annonces ne reçoivent rien de ce que cette page partage, et l'entremetteur tient largement dans une offre gratuite, précisément parce qu'il ne stocke rien et ne fait presque rien."

[[faq]]
q = "Puis-je partager des fichiers sur mon réseau local&nbsp;?"
a = "Oui. Avant de commencer, choisissez Réseau local — sans relais internet, connectez les deux appareils au même réseau Wi-Fi ou Ethernet et copiez le lien pour le lecteur. Le lien inclut le mode&nbsp;; un lecteur utilisant un autre mode doit choisir explicitement avant de réessayer avec celui de la personne qui partage. Internet reste nécessaire pour mettre les navigateurs en relation. Ce mode n’utilise pas de découverte publique d’adresses et ne passe jamais à un relais internet. Un VPN ou les règles réseau du navigateur peuvent modifier le trajet ou empêcher la connexion&nbsp;; ce réglage ne prouve pas que les données restent dans un bâtiment. L’approbation privée reste activée par défaut et les fichiers restent limités à 200&nbsp;Mo chacun. Un partage peut contenir jusqu’à 256 fichiers. Visible est activé par défaut dans ce mode : l’autre navigateur peut ouvrir la page d’accueil et choisir votre nom dans la liste de cette connexion. Décochez Visible pour partager uniquement par lien. Gardez Privé activé sur les réseaux partagés."

[[faq]]
q = "Comment la liste trouve-t-elle les partages locaux ?"
a = "Cette liste affiche les noms de lien des navigateurs utilisant la même adresse IP publique que le vôtre. Cela correspond généralement au même routeur ; un VPN partagé ou une adresse partagée par le fournisseur d’accès peut inclure d’autres réseaux. IPv6 ou des routes différentes peuvent masquer des appareils voisins. Internet est nécessaire. Ouvrir un partage demande toujours votre accord avant la connexion, et les partages privés exigent encore l’approbation de la personne qui partage. Les partages locaux sont publiés par défaut ; décochez Visible pour partager uniquement par lien. Choisir un nom ouvre la page de consentement, sans connexion automatique ni contournement de l’approbation privée. L’annuaire ne conserve que les noms de lien tant que la personne qui partage est connectée, jamais le texte, les noms de fichier ou leur contenu. Si la recherche est indisponible, le lien de partage fonctionne toujours."

[schema]
description = "Partagez du texte et des fichiers d'un navigateur à un autre par une connexion WebRTC directe et chiffrée de bout en bout. Noms de lien prononçables, mise à jour en direct pendant la frappe, Markdown et approbation lecteur par lecteur. Aucun serveur ne stocke rien ; le partage s'arrête quand qui partage ferme l'onglet."
features = ["Le texte et les fichiers vont de navigateur à navigateur, chiffrés de bout en bout, jamais par un serveur", "Le partage vit dans l'onglet ouvert : le fermer y met fin et vide les pages des lecteurs", "Des noms de lien prononçables - brave-otter-42 -, modifiables, un partage vivant par nom", "Privé par défaut : chaque lecteur se présente, et qui partage admet ou refuse", "Les lecteurs consentent avant toute connexion, prévenus que les IP deviennent visibles", "Mise à jour en direct : les modifications atteignent les lecteurs connectés pendant la frappe", "Markdown, commutable des deux côtés, rendu par un moteur intégré qui échappe d'abord", "Des fichiers jusqu'à 200 Mo pièce, récupérés à la demande, avec progression par fichier", "Le brouillon ne reste que dans le navigateur de qui partage - ou nulle part, marqué éphémère", "Tout le composant serveur est un entremetteur sans stockage, publié dans le dépôt", "Mode réseau local facultatif sans découverte publique d’adresses ni relais internet", "Noms de lien locaux visibles pour les navigateurs partageant une adresse IP publique, avec consentement et approbation privée préservés"]
