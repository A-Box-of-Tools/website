name = "Partager du texte et des fichiers"
heading = "Partager texte &amp; fichiers <span class=\"h1-kw\">&mdash; de votre navigateur au leur, sans rien téléverser</span>"
tagline = "Le partage vit dans cet onglet ouvert. Les lecteurs le reçoivent chiffré, directement depuis votre navigateur, et fermer l'onglet y met fin - aucun serveur ne conserve quoi que ce soit."
title = "Partager du texte et des fichiers entre appareils &mdash; direct, chiffré, rien de stocké"
description = "Envoyez du texte ou des fichiers d'un navigateur à un autre par une connexion directe et chiffrée. Un nom de lien prononçable, mise à jour en direct pendant la frappe, approbation lecteur par lecteur - et jamais rien sur aucun serveur. Gratuit, sans inscription."
og_title = "Un partage qui s'arrête dès que vous fermez l'onglet"
og_description = "Le texte et les fichiers voyagent chiffrés, directement de votre navigateur à celui du lecteur. Le serveur ne fait que les présenter et ne voit jamais le contenu. Pas de stockage, pas d'historique, pas de compte - fermez l'onglet et tout disparaît, partout."
og_image_alt = "Partager du texte et des fichiers - de navigateur à navigateur, rien de stocké"
pledge = "Ce que vous partagez ici voyage de votre navigateur à celui de chaque lecteur par un canal WebRTC chiffré de bout en bout, et nulle part ailleurs. Le seul serveur impliqué — nommé dans la <code>Content-Security-Policy</code> de cette page, code dans le dépôt — présente les navigateurs et liste les noms de lien locaux visibles. Il ne conserve aucun texte ou fichier partagé, et le contenu ne transite jamais par lui. Les noms visibles restent seulement tant que la personne qui partage est connectée. Il n’y a ni historique du contenu ni compte. Fermez cet onglet et le partage s’arrête partout à la fois, y compris sur les pages ouvertes des lecteurs."
live_hint = "Ouvrez les outils de développement et surveillez l’onglet Réseau pendant le partage. Un WebSocket vers l’entremetteur apparaît pour les noms de lien locaux dès l’ouverture de cette page d’accueil. Commencer un partage en ajoute un autre pour la négociation. Un lecteur utilise une seule connexion de présentation. Quoi que vous tapiez ou joigniez, aucune ne transporte le texte ou les fichiers."
read_first = ", <code>src/main.js</code> pour les deux moitiés de l'échange &mdash; l'onglet de qui partage et celui du lecteur sont le même fichier &mdash; et <code>src/markdown.js</code> pour le moteur de rendu qui traite du texte venu de l'autre bout du fil, et qui échappe donc tout avant d'émettre quoi que ce soit. Le code complet du serveur est <code>workers/rendezvous/worker.js</code>, dans le même dépôt : une salle par nom de lien, qui ne tient rien d'autre que les connexions ouvertes. L’annuaire supplémentaire ne conserve que les noms de lien publiés dans les connexions ouvertes, jamais le texte ou les fichiers."
howto_heading = "Comment partager du texte et des fichiers sans les téléverser nulle part"
card = "Texte et fichiers, de navigateur à navigateur par une connexion directe chiffrée. Rien de stocké nulle part ; le partage s'arrête quand vous fermez l'onglet."

