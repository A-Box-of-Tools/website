[[privacy]]
title = "Votre GIF n'a nulle part où aller."
body = """
 La
      Content-Security-Policy nomme chaque adresse que cette page a le droit de
      contacter, et pas une seule ne nous appartient. Il n'existe ici aucun point
      de collecte où vos fichiers pourraient atterrir, ni rien dans le code qui
      les y enverrait s'il en existait un. Cette ligne disait autrefois
      <code>connect-src 'none'</code>, ce qui ne souffrait aucune
      exception&nbsp;; la publicité a coûté cela, et le dire fait partie du
      marché."""

[[privacy]]
title = "Le lecteur de GIF, ce sont deux fichiers de ce dépôt."
body = """
 Un navigateur
      joue un GIF mais ne vous en rend pas les morceaux, alors le format est lu
      ici&nbsp;: <code>src/gif.js</code> pour le conteneur et le décompresseur
      LZW, <code>src/compose.js</code> pour les règles d'effacement qui décident
      de quoi a l'air chaque image une fois les précédentes posées dessous. Rien
      n'est téléchargé pour ouvrir un fichier, et aucun moteur ne se charge à la
      première utilisation."""

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = """
 Les scripts
      publicitaires et de mesure viennent de Google. Aucun des deux ne reçoit
      quoi que ce soit sur votre animation&nbsp;: ni un fichier, ni une image, ni
      un nom, une taille ou un nombre. Chaque ligne qui lit, décompresse, dessine
      ou encode une image est servie depuis cette origine et figure dans le
      dépôt."""

[[privacy]]
title = "Ce que charge le bouton de don, et ce qu'on ne lui donne pas."
body = """

      Le bouton &laquo;&nbsp;Buy me a coffee&nbsp;&raquo; de l'en-tête est
      dessiné par un script de cdnjs.buymeacoffee.com et prend sa typographie sur
      Google Fonts. Ce n'est rien de plus qu'un lien&nbsp;: il ne signale aucune
      visite et ne reçoit rien sur vous ni sur vos fichiers. Rien ne se produit
      tant que vous ne cliquez pas, et ce sur quoi vous cliqueriez alors est le
      site de quelqu'un d'autre."""

[[privacy]]
title = "Tout fonctionne hors ligne."
body = """
 Coupez le réseau et chaque partie de cette
      page continue de marcher. C'est la preuve la plus simple de
      toutes&nbsp;: un outil qui expédierait votre animation ailleurs pour la
      démonter s'arrêterait à l'instant où vous débranchez."""

[[howto]]
title = "Choisissez le GIF."
body = """
 Déposez-le sur le sélecteur ou allez le
      chercher à la main. Le navigateur le lit directement sur votre disque, et
      la page vous dit ce qu'elle a trouvé&nbsp;: la taille, le nombre d'images,
      la durée de lecture et le nombre de répétitions."""

[[howto]]
title = "Décidez de ce que contient chaque PNG."
body = """
 <strong>L'image telle
      qu'elle apparaît</strong>, c'est ce que veut presque tout le monde&nbsp;:
      l'image entière à cet instant de l'animation. <strong>Seulement les pixels
      que cette image stocke</strong>, c'est la pièce que le fichier transporte
      réellement, à sa propre taille et à sa propre place&nbsp;: c'est ainsi
      qu'un GIF reste petit, et ce n'est pas à quoi ressemble l'animation."""

[[howto]]
title = "Décidez du sort de la transparence."
body = """
 Le PNG la
      conserve, et c'est le choix honnête. Remplissez-la d'une couleur si les
      images partent vers un endroit qui ignore la transparence et la
      transformerait en noir."""

[[howto]]
title = "Choisissez les images voulues."
body = """
 Toutes, par défaut.
      &laquo;&nbsp;Garder une image sur deux&nbsp;&raquo; allège un long
      enregistrement, et les cases de la grille l'emportent dessus. La
      numérotation ne change jamais&nbsp;: l'image 42 s'appelle toujours image
      42, si peu de ses voisines que vous ayez gardées."""

[[howto]]
title = "Téléchargez-les."
body = """
 Une par une depuis la grille, ou toutes
      dans un seul ZIP pour n'avoir qu'une demande d'enregistrement au lieu de
      plusieurs centaines. Le ZIP peut emporter un <code>frames.txt</code>
      indiquant la durée d'affichage de chaque image, la seule chose qu'un
      dossier de PNG ne sait pas dire tout seul."""

[[faq]]
q = "Mon GIF est-il envoyé quelque part&nbsp;?"
a = """
        Non. Le fichier est lu, décompressé et dessiné par votre propre navigateur
        sur votre propre matériel, et chaque PNG est encodé ici, en mémoire. Cet
        outil n'a aucune partie serveur, et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse
        qu'elle a le droit de contacter&nbsp;: aucune ne nous appartient. Coupez
        le réseau, il découpe toujours des GIF."""

[[faq]]
q = "Pourquoi une image ressemble-t-elle à un petit bout de l'image&nbsp;?"
a = """
        Parce que c'est ce que contient le fichier. Un GIF, c'est une première
        image suivie de rustines&nbsp;: chaque image ultérieure ne stocke que le
        rectangle qui a changé, et tout le reste à l'écran est ce que les
        précédentes y ont laissé. Une tête qui parle devant un mur immobile
        stocke donc un visage par image plutôt qu'une image par image, et c'est
        toute la raison pour laquelle le format n'est pas énorme.
        <br><br>
        Vous voyez cela parce que &laquo;&nbsp;Seulement les pixels que cette
        image stocke&nbsp;&raquo; est sélectionné. Passez à &laquo;&nbsp;L'image
        telle qu'elle apparaît&nbsp;&raquo; et chaque PNG sera l'image entière,
        telle que l'animation la montre à cet instant."""

[[faq]]
q = "La transparence est-elle conservée&nbsp;?"
a = """
        Oui. La transparence d'un GIF tient dans un seul bit&nbsp;: un pixel est
        soit peint, soit invisible, sans rien entre les deux, et le PNG stocke
        exactement cela. Les images ressortent donc avec leurs zones
        transparentes intactes. Si vous préférez un fond opaque, réglez
        &laquo;&nbsp;Zones transparentes&nbsp;&raquo; sur un remplissage de
        couleur&nbsp;: elle est écrite dans le PNG et ne pourra plus en être
        retirée."""

[[faq]]
q = "Pourquoi les durées ne sont-elles pas celles que j'attendais&nbsp;?"
a = """
        Un GIF stocke chaque durée en centièmes de seconde, et les navigateurs
        remontent depuis les années 1990 toute valeur inférieure à deux centièmes
        à un dixième de seconde&nbsp;: une règle écrite pour les globes tournants
        de l'époque et jamais retirée. Une image dont le fichier dit 0,01&nbsp;s
        est donc jouée à 0,10&nbsp;s partout. Cet outil affiche la durée telle
        qu'elle est réellement jouée, et indique à côté ce que stocke le fichier
        quand les deux diffèrent."""

[[faq]]
q = "Puis-je remonter les images ensuite&nbsp;?"
a = """
        Oui, avec le <a href="../creer-un-gif/">Créateur de GIF</a> de ce site ou
        avec n'importe quoi d'autre qui accepte un dossier d'images. C'est à cela
        que sert le <code>frames.txt</code> du ZIP&nbsp;: découper une animation
        jette les durées, puisqu'un PNG n'a nulle part où noter combien de temps
        il est resté affiché, et la liste emporte donc avec elle la durée et la
        position de chaque image."""

[[faq]]
q = "Dans quels formats les images peuvent-elles être enregistrées&nbsp;?"
a = """
        En PNG, et délibérément en PNG seulement. Une image de GIF, c'est au plus
        256 couleurs et un bit de transparence&nbsp;; le PNG stocke cela
        exactement et sans perte, là où le JPEG jetterait la transparence,
        inventerait des couleurs que l'image n'a jamais eues et ferait le plus
        souvent un fichier <em>plus gros</em> à partir d'un aplat. S'il vous faut
        des JPEG, convertissez les PNG ensuite avec le
        <a href="../redimensionner-une-image/">Redimensionneur d'images</a>."""

[[faq]]
q = "Y a-t-il une limite au nombre d'images lues&nbsp;?"
a = """
        Il n'y a pas de limite fixe. Le plafond réel est la mémoire de votre
        machine&nbsp;: un GIF gonfle à environ un octet par pixel et par image
        pendant sa lecture, si bien qu'un petit fichier peut représenter énormément
        de mémoire. La page préfère alors cesser de lire plutôt que de laisser
        mourir l'onglet. Si cela arrive, elle le dit et vous rend les images
        qu'elle a obtenues."""

[[faq]]
q = "Ouvre-t-il un GIF abîmé&nbsp;?"
a = """
        Le plus souvent, oui. Les téléchargements tronqués, la marque de fin
        absente et une dernière image qui s'arrête au milieu du flux sont
        courants, et un lecteur qui les refuse est inutile pour précisément les
        fichiers que les gens veulent le plus démonter. Toutes les images
        complètes reviennent, avec une note disant ce qui n'allait pas. Seul un
        fichier qui n'est pas du tout un GIF est refusé d'emblée."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période
        d'essai. Les images ne portent aucun filigrane non plus. Le site affiche
        de la publicité, et c'est elle qui le finance&nbsp;; les annonces ne
        reçoivent rien sur vos fichiers."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle
        continue de travailler. C'est aussi la façon la plus simple de prouver que
        rien n'est envoyé, car un outil qui expédierait votre animation ailleurs
        pour la traiter s'arrêterait à l'instant où vous débranchez."""

