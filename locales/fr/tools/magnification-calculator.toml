#
# Calculateur de grossissement - French.
#
# Overrides for tools/magnification-calculator/tool.toml. Only words: the slug,
# the category, the icon and the list of shared parts stay where they are.
#
# What is printed on an instrument is quoted as printed, decimal point included:
# 8×42, 40×/0.65, 10×/18. A figure the prose works out takes the French comma
# and its spaces, so the objective marked 40×/0.65 has an ouverture numérique
# de 0,65. A magnification is the exception to the spaces: the page never
# groups one, so it is 1000× here as well, beside 1 000 fois and 1 000 m.
#
# What a visitor reads off an instrument and types is a nombre, as in
# Explorateur de nombres. Chiffre is kept for a figure somebody quotes at them,
# le chiffre de 675× sur la boîte or le chiffre de zoom, because that is the
# word a claim takes in French and the one people search with.
#

