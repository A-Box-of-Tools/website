[[privacy]]
title = "Votre examen n'a nulle part où aller."
body = "La Content-Security-Policy énumère toutes les adresses que cette page peut contacter, et aucune ne nous appartient. Il n&rsquo;y a ici aucun point de collecte pour votre fichier, et rien dans le code qui l&rsquo;y enverrait s&rsquo;il en existait un. Cette ligne disait autrefois <code>connect-src 'none'</code>, ce qui était absolu&nbsp;; la publicité a coûté cela, et le dire fait partie du marché."

[[privacy]]
title = "Ici, cela compte davantage que sur les autres pages."
body = "Un fichier DICOM n'est pas une image avec quelques métadonnées dessus. C'est un dossier médical avec une image dedans&nbsp;: le nom du patient, sa date de naissance, son numéro de dossier, le numéro de demande, le médecin prescripteur, l'établissement et le numéro de série de la machine sont autant de champs de l'en-tête, et ils voyagent avec le fichier partout où il va. Envoyer un tel fichier à un site web pour le regarder revient à remettre tout cela à qui exploite ce site. C'est précisément ce que cette page existe pour ne pas faire."

[[privacy]]
title = "Le lecteur, ce sont quatorze fichiers de ce dépôt."
body = "Rien ici n'utilise une bibliothèque récupérée ailleurs. <code>src/dicom.js</code> parcourt le fichier, <code>src/dictionary.js</code> sait comment s'appellent les étiquettes, <code>src/pixels.js</code> retransforme les octets en mesures, <code>src/rle.js</code> et <code>src/jpeg-lossless.js</code> décompressent les deux formes compressées que cette page sait décoder, et <code>src/window.js</code> projette le mesuré sur les gris de votre écran."

[[privacy]]
title = "Les identifiants vous sont énumérés, à vous et à personne d'autre."
body = "La page affiche chaque champ de votre fichier qui nomme la personne concernée ou qui réduit le cercle de qui elle peut être, parce que c'est la question à laquelle quelqu'un sur le point de partager une coupe a besoin d'une réponse et qu'aucune visionneuse ne la donne. Cela apparaît sur l'écran devant vous et ne va nulle part ailleurs&nbsp;: il n'existe dans ce dépôt aucun événement de mesure qui transporte quoi que ce soit de cela, et la page ne pourrait pas l'envoyer même s'il en existait un."

[[privacy]]
title = "Elle lit. Elle n'écrit pas."
body = "Il n'y a ici aucun bouton qui modifie votre fichier, ni de code qui le pourrait. Ce que vous pouvez emporter, c'est un PNG de l'image à l'écran et une copie texte de l'en-tête, construits tous deux dans la page à partir de ce qui s'y trouve déjà. Votre original reste intact sur votre disque, ce qui est aussi la réponse honnête à la question de ce qui se passe si vous fermez l'onglet."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts de publicité et de mesure viennent de Google. Ni l'un ni l'autre ne reçoit quoi que ce soit sur votre fichier&nbsp;: ni les pixels, ni une vignette, ni un nom, ni une étiquette, ni un patient, ni un nom de fichier. Chaque ligne qui analyse, décode ou dessine un examen est servie depuis cette origine et figure dans le dépôt."

[[privacy]]
title = "Ce que le bouton de don charge, et ce qu'on ne lui donne pas."
body = "Le bouton &laquo;&nbsp;Buy me a coffee&nbsp;&raquo; de l'en-tête est dessiné par un script de cdnjs.buymeacoffee.com et prend sa typographie sur Google Fonts. Ce n'est rien de plus qu'un lien&nbsp;: il ne signale aucune visite et ne reçoit rien sur vous ni sur vos fichiers. Rien ne se produit tant que vous ne cliquez pas, et ce sur quoi vous cliqueriez alors est le site de quelqu'un d'autre."

[[privacy]]
title = "Cela fonctionne hors ligne."
body = "Débranchez-vous du réseau et chaque partie de cette page continue de fonctionner. C'est la preuve la plus simple de toutes&nbsp;: un outil qui enverrait votre examen ailleurs pour l'afficher s'arrêterait à l'instant où vous tirez la prise."

[[howto]]
title = "Choisissez les fichiers."
body = "Un seul fichier <code>.dcm</code>, ou le dossier entier du disque&nbsp;: un scanner ou une IRM, c'est un fichier par coupe, et les déposer tous d'un coup est ce qui remet la série en place. Le navigateur les lit directement sur votre disque&nbsp;; rien n'est envoyé nulle part pendant ce temps."

[[howto]]
title = "Choisissez la série."
body = "Un examen en contient généralement plusieurs&nbsp;: le scout, puis chaque acquisition. Chacune est empilée dans l'ordre où la machine l'a prise, déduit de la position de chaque coupe dans le patient plutôt que de la numérotation, qui ne va pas toujours dans le même sens."

[[howto]]
title = "Réglez le fenêtrage."
body = "C'est la commande qui rend un examen lisible, et celle qu'un logiciel de retouche n'a pas. Faites glisser sur l'image pour élargir la fenêtre et vers le haut ou le bas pour déplacer son centre, ou prenez l'une des fenêtres nommées &mdash; poumon, os, cerveau, parties molles &mdash; sur un scanner, où les unités sont les mêmes sur toutes les machines du monde."

[[howto]]
title = "Parcourez la pile."
body = "Le curseur sous l'image avance dans les coupes, et les flèches du clavier font la même chose une fois que vous avez cliqué sur l'image. Un fichier multi-image &mdash; une boucle d'échographie, une angiographie &mdash; se lit avec le bouton d'à côté."

[[howto]]
title = "Mesurez quelque chose."
body = "Passez sur Mesurer et tracez une ligne. Là où le fichier indique l'écartement de ses pixels, la réponse est en millimètres et tient compte des pixels non carrés&nbsp;; là où il ne l'indique pas, la réponse est en pixels et le dit, plutôt que d'inventer une échelle."

[[howto]]
title = "Lisez l'en-tête."
body = "Chaque élément du fichier, avec son numéro, le nom que lui donne la norme et son contenu, le tout consultable. Au-dessus, la liste de ce qui, dans ce fichier précis, identifie le patient&nbsp;: bien davantage que le nom."

[[howto]]
title = "Emportez ce dont vous avez besoin."
body = "L'image à l'écran en PNG, avec le fenêtrage que vous avez réglé et sans rien d'incrusté dessus, ou l'en-tête entier en texte brut. Les deux sont construits dans la page à partir de ce qui s'y trouve déjà."

[[faq]]
q = "Mon examen est-il envoyé quelque part&nbsp;?"
a = "Non. Le fichier est lu, décodé et dessiné par votre propre navigateur, sur votre propre matériel. Cet outil n'a pas de partie serveur, et la <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle peut contacter, dont aucune ne nous appartient. Débranchez-vous du réseau&nbsp;: elle continue d'ouvrir des examens. <br><br> Cela vaut ici plus que sur toute autre page du site. Un fichier DICOM porte dans son en-tête le nom du patient, sa date de naissance et son numéro de dossier&nbsp;; envoyer un tel fichier à une visionneuse revient donc à remettre à un inconnu un dossier médical, pas une image."

[[faq]]
q = "Comment ouvrir un fichier .dcm&nbsp;?"
a = "Déposez-le dans la zone en haut. Un <code>.dcm</code> est un fichier DICOM, le format des appareils d’imagerie médicale. Cette page le lit et affiche l’examen dans votre navigateur, sans installation ni envoi. Elle fonctionne sur Windows, Mac, Linux, Chromebook et téléphone.<br><br>Pour un disque ou un dossier, déposez le dossier entier&nbsp;: un scanner ou une IRM comporte un fichier par coupe, souvent sans extension <code>.dcm</code>. Les ouvrir ensemble remet l’examen dans l’ordre. Le fichier <code>DICOMDIR</code> et le lecteur Windows fourni sur le disque ne sont pas nécessaires."

[[faq]]
q = "Qu’est-ce qu’un fichier .dcm et pourquoi le double-clic ne fait-il rien&nbsp;?"
a = "C’est une image ou une boucle d’images d’un appareil médical au format DICOM&nbsp;: un en-tête de centaines de champs sur le patient, l’appareil et les pixels, puis les pixels. Ce n’est pas un JPEG renommé&nbsp;: logiciels photo, éditeurs et onglets de navigateur ne l’ouvrent pas directement. Sans lecteur médical installé, aucun programme n’est associé au format.<br><br>Un fichier <code>.dcm</code> n’est pas toujours médical&nbsp;: cette extension sert aussi à des catalogues de disques et à des calibrages de moteurs automobiles. La page vérifie le contenu et annonce clairement s’il ne s’agit pas de DICOM."

[[faq]]
q = "Quels fichiers DICOM peut-elle ouvrir&nbsp;?"
a = "Les fichiers non compressés dans les trois syntaxes de transfert de base &mdash; implicit et explicit little endian, ainsi que la big-endian retirée &mdash; plus deflated, RLE Lossless, JPEG baseline et JPEG Lossless, avec lequel est compressée la majorité des examens de scanner et d'IRM d'un disque hospitalier. <br><br> Elle ne sait décoder ni JPEG 2000, ni JPEG-LS, ni les syntaxes MPEG et HEVC employées pour la vidéo. Celles-ci exigent des codecs qui pèsent plusieurs mégaoctets de bibliothèque compilée, et une page qui en téléchargerait un à la demande ne serait pas une page qui fonctionne hors ligne. Un fichier dans l'une d'elles s'ouvre quand même&nbsp;: l'en-tête est lu et affiché en entier, et l'image est remplacée par une ligne qui nomme le codec, plutôt que par une icône d'image cassée qui ne vous apprend rien."

[[faq]]
q = "Qu'est-ce que le &laquo;&nbsp;fenêtrage&nbsp;&raquo;, et pourquoi en ai-je besoin&nbsp;?"
a = "Une coupe de scanner contient environ quatre mille valeurs distinctes et votre écran affiche deux cent cinquante-six gris. La fenêtre est le choix de la tranche de cette plage qui les reçoit tous&nbsp;: tout ce qui est en dessous est noir, tout ce qui est au-dessus est blanc, et ce qui se trouve entre les deux se répartit sur les gris. <br><br> C'est pourquoi le même fichier ressemble à deux examens différents sous deux réglages, et pourquoi le poumon et l'os ne peuvent pas être vus en même temps. Sur un scanner, les nombres sont des unités Hounsfield, définies de façon absolue &mdash; l'eau vaut 0 et l'air &minus;1000 &mdash;, si bien que les fenêtres nommées de cette page portent les nombres mêmes qu'emploie un radiologue sur sa console. Sur une IRM ou une échographie, une telle échelle n'existe pas, et la fenêtre d'ouverture est celle que demande le fichier lui-même."

[[faq]]
q = "Pourquoi indique-t-elle que ma mesure est en pixels&nbsp;?"
a = "Parce que ce fichier n'indique pas la taille d'un pixel. C'est Pixel Spacing (0028,0030) qui la porte, en millimètres, et quantité d'images d'échographie, de documents numérisés et de captures secondaires ne l'ont tout simplement pas. <br><br> Là où il est présent, la mesure est en millimètres et chaque axe est mesuré avec son propre écartement, ce qui compte sur les images dont les pixels ne sont pas carrés. Là où il est absent, la réponse honnête est un décompte de pixels, et c'est celle qui s'affiche, plutôt que de choisir une échelle et de présenter le résultat comme une longueur."

[[faq]]
q = "Elle a ouvert mon dossier en plusieurs séries. Pourquoi&nbsp;?"
a = "Parce que c'est ce qu'il contient. Un examen est fait de séries &mdash; le scout, puis chaque acquisition ou reconstruction &mdash; et chaque fichier indique à laquelle il appartient dans Series Instance UID (0020,000E). La liste déroulante est construite à partir de cela et non du dossier, qui les mélange le plus souvent dans une seule liste de noms. <br><br> À l'intérieur d'une série, les coupes sont ordonnées par leur position dans le patient, déduite d'Image Position et d'Image Orientation. Instance Number serait la clé évidente et n'est ici que le recours&nbsp;: elle est attribuée par ce qui a écrit les fichiers et n'a pas à suivre le sens dans lequel le patient est allongé."

[[faq]]
q = "Que signifie la liste &laquo;&nbsp;ce qui identifie le patient&nbsp;&raquo;&nbsp;?"
a = "C'est chaque champ de votre fichier qui nomme la personne concernée, ou qui réduit le cercle de qui elle peut être, lu depuis ce fichier sur votre machine. La liste vient de PS3.15 de la norme DICOM, la partie qui énonce ce qui doit disparaître avant qu'un jeu de données puisse être dit dé-identifié. <br><br> Elle est là parce que ce que les gens sous-estiment n'est pas qu'un examen contienne un nom. C'est tout ce qu'il contient en plus&nbsp;: la date de naissance, le numéro de demande, le médecin prescripteur, l'établissement, le numéro de série de la machine et les UID de l'examen, qui sont des clés parfaites vers l'archive dont il provient. Un examen dont on a seulement effacé le nom n'est pas anonyme. <br><br> Cet outil se contente de vous les montrer. Il n'écrit rien et ne modifie rien, il ne peut donc rien en retirer."

[[faq]]
q = "Peut-elle anonymiser un examen&nbsp;?"
a = "Non, et elle ne fait délibérément pas semblant. Cette page lit&nbsp;; elle n'a aucun code qui écrive un fichier DICOM. Ce qu'elle fait, c'est vous dire exactement ce que contient le vôtre, et c'est la partie difficile à découvrir et celle sur laquelle on se trompe. <br><br> Un outil qui retire les identifiants est un autre travail, avec une barre bien plus haute&nbsp;: il doit réécrire le fichier sans toucher aux pixels, remplacer les UID de façon cohérente sur un examen entier, et voir juste sur les éléments privés dans lesquels certaines machines cachent une seconde copie du nom. Il est à la feuille de route de ce site, plutôt que greffé sur une visionneuse."

[[faq]]
q = "Peut-elle ouvrir un fichier sans extension .dcm, ou un fichier abîmé&nbsp;?"
a = "Les deux, oui. L'extension n'est pas regardée&nbsp;: ce qui est vérifié, c'est le fichier lui-même. Un jeu de données écrit sans le préambule habituel de 128 octets &mdash; ce à quoi ressemble un examen tiré directement du réseau &mdash; est lu en déduisant son encodage de son premier élément, et la page dit que c'est ce qu'elle a fait. <br><br> Un fichier qui s'arrête en cours de route est lu jusqu'où il va. Tout ce qui précède la coupure est affiché, avec une note indiquant à quel octet cela s'est arrêté. C'est précisément le cas où l'on veut le plus une visionneuse, et jeter le fichier entier pour ses douze derniers octets serait le mauvais comportement."

[[faq]]
q = "Est-ce une visionneuse de diagnostic&nbsp;?"
a = "Non. Ce n'est pas un dispositif médical, elle n'a fait l'objet d'aucune évaluation réglementaire, et rien ici ne devrait servir à prendre une décision clinique. Votre écran n'est pas calibré, le navigateur n'est pas une chaîne de rendu validée, et ni l'un ni l'autre ne se corrige depuis l'intérieur d'une page web. <br><br> Ce à quoi elle sert, c'est à tout le reste pour quoi on ouvre un examen&nbsp;: vérifier ce qu'il y a sur un disque, extraire une coupe pour un cours ou un article, lire un en-tête, comprendre pourquoi un autre logiciel refuse le fichier, et voir ce qu'un examen transporte sur la personne concernée."

[[faq]]
q = "Est-ce que cela modifie mon fichier&nbsp;?"
a = "Non. Cet outil ne fait que lire. Il n'y a pas de fichier de sortie, pas de réencodage et aucun bouton qui écrive un DICOM&nbsp;: ce que vous pouvez télécharger, c'est un PNG de l'image à l'écran et une copie en texte brut de l'en-tête. Votre original reste intact sur votre disque."

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = "C'est gratuit, et il n'y a ni compte, ni connexion, ni période d'essai. Il n'y a pas non plus de limite de taille de fichier ni de nombre de fichiers ouverts, hormis la mémoire de votre propre machine. Le site porte de la publicité, et c'est elle qui le paie&nbsp;; on ne donne rien aux annonces sur votre fichier."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page une fois, débranchez-vous ensuite d'internet&nbsp;: elle continue de fonctionner. C'est aussi la façon la plus simple de prouver que rien n'est envoyé&nbsp;: un outil qui expédierait votre examen ailleurs pour l'afficher s'arrêterait à l'instant où vous tirez la prise."

