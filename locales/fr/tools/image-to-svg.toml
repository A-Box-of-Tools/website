    <code>src/fit.js</code> &mdash; six cents lignes environ, que vous pouvez
    lire, sans moteur derrière et sans rien à télécharger pour les exécuter.
    Cet outil n'a aucune fonction réseau&nbsp;: rien à aller chercher, rien à
