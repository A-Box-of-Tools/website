title = "Image en SVG &mdash; vectoriser un logo ou une silhouette, sans envoi"
description = "Vectorisez une image en noir et blanc en un vrai contour SVG, dans votre navigateur. Logos, pochoirs, signatures, dessins au trait et silhouettes deviennent des courbes qui se redimensionnent à toute taille. Un clic retire ce que le tracé a pris à tort. Rien n'est envoyé."
og_title = "Transformer un logo ou une silhouette en SVG, sans l'envoyer nulle part"
og_description = "Un bitmap agrandi est un escalier&nbsp;; un contour est une instruction. Cet outil trouve la forme, y ajuste des courbes et vous laisse retirer d'un clic ce qui ne devrait pas y être, le tout sur votre propre machine."
og_image_alt = "Image en SVG - vectoriser un logo, un pochoir ou une silhouette en courbes"

pledge = """
    L'image est lue sur votre disque par votre propre navigateur, ramenée à un
    bit par pixel par <code>src/mask.js</code>, parcourue le long de son bord
