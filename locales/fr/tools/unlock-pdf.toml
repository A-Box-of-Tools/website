[[privacy]]
title = "La plupart des PDF protégés ne sont pas réellement verrouillés."
body = "Un <em>mot de passe d’ouverture</em> empêche vraiment la lecture&nbsp;: sans lui, cet outil n’ouvre rien. Les <em>restrictions</em> d’impression, copie et édition n’empêchent pas l’ouverture. Le fichier contient donc de quoi dériver sa clé, comme le fait votre lecteur. Les permissions sont un champ respecté par accord entre logiciels, documenté ainsi par Adobe. Les retirer ne casse pas un verrou&nbsp;: l’outil choisit de ne pas les appliquer. Il distingue les deux et ne demande un mot de passe que si nécessaire."

[[privacy]]
title = "Aucun mot de passe n’est deviné."
body = "Vous fournissez le mot de passe d’ouverture ou le document reste fermé. Aucun dictionnaire, liste de mots ni recherche sur les anciennes clés de 40 bits. C’est un choix explicite&nbsp;: tester des millions de mots de passe serait un autre outil. Le mot de passe d’ouverture comme celui du propriétaire sont acceptés."

[[privacy]]
title = "Le mot de passe est saisi et utilisé ici."
body = "Il sert à dériver une clé dans cet onglet seul. Il n’est ni stocké, conservé entre fichiers ni placé dans l’adresse. La <code>Content-Security-Policy</code> énumère les adresses autorisées, aucune n’appartenant au site. Un outil qui envoyait une requête après avoir reçu votre mot de passe exposerait ce que vous lui confiez."

[[privacy]]
title = "Le résultat est rouvert avant téléchargement."
body = "Les octets passent au lecteur partagé par <a href=\"../compresser-un-pdf/\">le compresseur</a>, <a href=\"../fusionner-des-pdf/\">la fusion</a> et <a href=\"../caviarder-un-pdf/\">le caviardage</a>, qui refuse les documents chiffrés. Il doit ouvrir sans mot de passe et retrouver le même nombre de pages. Tout chiffrement résiduel ou échec empêche le téléchargement."

[[privacy]]
title = "Les pages ne sont ni rendues, réencodées ni réorganisées."
body = "Seul le chiffrement est retiré. Instructions, polices et images sont conservées exactement&nbsp;: texte sélectionnable et recherchable, scans à leur résolution, aucune mise en page déplacée. Les anciennes versions d’objets abandonnées ne sont pas reprises, ce qui réduit souvent le poids."

[[privacy]]
title = "Une signature numérique ne survit pas à la réécriture."
body = "Une signature couvre les octets exacts du fichier. Toute réécriture l’invalide. La copie obtenue n’est plus signée et le résultat vous avertit si l’original l’était. Gardez l’original signé. Aucun outil ne peut contourner cette propriété."

[[privacy]]
title = "La page indique la valeur réelle de la protection."
body = "Un PDF en RC4 40 bits de 1998 et un PDF en AES-256 actuel affichent le même libellé de protection. La page nomme mécanisme, longueur de clé et révision, puis indique les modes cassés, dépassés ou actuels, information rarement visible dans un lecteur."

[[privacy]]
title = "Les documents protégés par certificat sont refusés clairement."
body = "Certaines clés résident dans une carte à puce ou un magasin de clés, pas dans un mot de passe. Ces documents sont refusés avec une explication. Un champ de mot de passe ne peut pas remplacer une clé privée."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts publicitaires et de mesure de Google ne reçoivent ni document, page, nom, poids, nombre de pages, mot de passe ni protection. Tout le code qui lit, déchiffre et écrit vient du site et figure dans le dépôt."

[[privacy]]
title = "Ce que le bouton de don charge, et ce qu'on ne lui donne pas."
body = "Le bouton &laquo;&nbsp;Buy me a coffee&nbsp;&raquo; de l'en-tête est dessiné par un script de cdnjs.buymeacoffee.com et va chercher sa police chez Google Fonts. C'est un lien et rien de plus&nbsp;: il ne signale aucune visite, et on ne lui donne rien sur vous ni sur vos documents. Rien ne se produit tant que vous ne cliquez pas, et ce vers quoi vous cliquez alors est le site de quelqu'un d'autre."

[[privacy]]
title = "Cela fonctionne hors ligne."
body = "Déconnectez le réseau&nbsp;: toutes les fonctions restent disponibles. Un outil envoyant le document ailleurs pour le déverrouiller s’arrêterait."

[[howto]]
title = "Choisissez le PDF."
body = "Un document à la fois, lu depuis votre disque. L’outil essaie d’abord un mot de passe vide, suffisant pour la plupart des PDF protégés uniquement par des permissions."

[[howto]]
title = "Lisez ce que la page a trouvé."
body = "Elle indique le type de protection, le mécanisme et sa valeur actuelle, puis toutes les permissions&nbsp;: impression, copie, édition, commentaires, formulaires, réorganisation et même lecture à voix haute."

[[howto]]
title = "Saisissez le mot de passe seulement si demandé."
body = "Le champ apparaît si le mot de passe vide n’a pas ouvert le document. Celui d’ouverture ou celui du propriétaire convient. Rien n’est deviné, votre saisie reste dans l’onglet."

[[howto]]
title = "Retirez la protection et lisez la vérification."
body = "Le document est déchiffré avec sa clé puis réécrit sans dictionnaire de chiffrement. Le lecteur qui refuse les documents chiffrés le rouvre sans mot de passe. S’il échoue ou si le nombre de pages change, aucun téléchargement n’est proposé."

[[faq]]
q = "Ai-je besoin du mot de passe&nbsp;?"
a = "Souvent non&nbsp;: relevés, fiches de paie, rapports et PDF avec restrictions d’édition s’ouvrent à tous et portent seulement des permissions, retirables en un clic. La page l’indique dès le choix. Un document qui demande réellement un mot de passe à l’ouverture exige que vous le fournissiez."

[[faq]]
q = "Peut-il ouvrir un PDF dont je n’ai pas le mot de passe&nbsp;?"
a = "Non, il n’essaie pas. <code>src/shared/pdf-crypt.js</code> ne contient ni dictionnaire, liste de mots ni boucle de recherche par force brute. Même les anciennes clés de 40 bits, explorables, ne sont pas recherchées. Si le mot de passe est perdu, cette page ne le récupère pas."

[[faq]]
q = "Quelle différence entre les deux mots de passe&nbsp;?"
a = "Le mot de passe <em>utilisateur</em> ouvre le fichier. Celui du <em>propriétaire</em> lève les permissions d’impression, copie et édition. Un propriétaire peut en définir un sans mot de passe utilisateur&nbsp;: le PDF s’ouvre mais refuse l’impression. Cet outil accepte les deux et indique lequel l’a ouvert."

[[faq]]
q = "Retirer les restrictions est-il légal&nbsp;?"
a = "Cela dépend du document, de vos droits et de votre lieu. Le format les définit comme des permissions respectées par accord, pas une barrière cryptographique. Cet outil est destiné aux documents que vous avez le droit d’utiliser&nbsp;: votre relevé qui refuse l’impression, un rapport acquis, un scan à réorganiser. Retirer une restriction ne crée aucun droit sur le contenu."

[[faq]]
q = "Quels chiffrements sont pris en charge&nbsp;?"
a = "Tous les publiés&nbsp;: RC4 40 et 128 bits, révisions 2 et 3&nbsp;; AES-128, révision 4&nbsp;; AES-256 ancien de 2008 et PDF 2.0, révisions 5 et 6. Les certificats et une variante Adobe non publiée sont refusés avec un message précis."

[[faq]]
q = "L’aspect du document change-t-il&nbsp;?"
a = "Non. Instructions de dessin, polices et images sont copiées exactement. Le texte reste sélectionnable, les scans gardent leur résolution et rien ne bouge. Le poids peut diminuer car la réécriture abandonne les anciennes versions d’objets."

[[faq]]
q = "Que devient un document signé&nbsp;?"
a = "Toute modification invalide sa signature, qui couvre les octets exacts. L’outil écrit une nouvelle copie et vous avertit si l’original était signé. Gardez cet original signé."

[[faq]]
q = "Mes documents ou mots de passe sont-ils envoyés&nbsp;?"
a = "Non. Votre navigateur lit, déchiffre et écrit sur votre appareil. Le mot de passe sert à dériver la clé dans cet onglet. Aucun serveur&nbsp;: la <code>Content-Security-Policy</code> énumère les adresses autorisées, aucune n’appartenant au site. Déconnectez Internet et utilisez la page pour le vérifier."

[[faq]]
q = "Comment savoir si la protection a disparu&nbsp;?"
a = "Le résultat est relu sur votre appareil par le lecteur partagé, qui refuse les PDF chiffrés. Il doit s’ouvrir sans mot de passe avec le même nombre de pages. Un échec empêche le téléchargement. Vérifiez aussi les propriétés dans un autre lecteur&nbsp;: toutes les permissions doivent être autorisées."

[[faq]]
q = "Y a-t-il une limite de taille, et cela coûte-t-il quelque chose&nbsp;?"
a = "Aucune limite n'est écrite dans l'outil. La limite, c'est votre propre machine&nbsp;: le document est tenu en mémoire pendant le travail, un portable encaissera donc quelques centaines de mégaoctets sans broncher et peinera quelque part au-dessus. C'est gratuit, il n'y a ni compte, ni connexion, ni période d'essai. Le site porte de la publicité, et c'est elle qui le paie&nbsp;; on ne donne rien aux annonces sur vos documents."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page une fois puis déconnectez Internet&nbsp;: elle continue. Un outil envoyant votre document ailleurs pour le déverrouiller s’arrêterait."

