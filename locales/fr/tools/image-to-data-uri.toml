#
# Image en base64 - French.
#
# Overrides for tools/image-to-data-uri/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "Data URI" is left in English throughout. It is the name of the thing in the
# specification and in every stylesheet a reader will meet, and a French
# rendering of it would name something they could not then search for. It is
# masculine here ("un data URI"), consistently.
#
# "Inline" is "intégrer", the verb this locale's own guide slug already uses
# (guides/integrer-une-image-dans-le-css). "Mettre en ligne" would read as
# publishing the image on the web, which is the opposite of the point.
#
# [schema] is emitted as JSON-LD, where HTML entities are never decoded, so
# that table alone uses plain spaces and plain punctuation.
#

