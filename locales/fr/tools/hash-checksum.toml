[[howto]]
title = "Laissez-la lire."
body = """
 MD5 et SHA-256 sont calculés par
      défaut, en une seule passe. La barre indique où en est la lecture et à
      quelle vitesse. Une grande image disque prend à peu près le temps
      qu&rsquo;il faudrait pour la copier, puisque c&rsquo;est la même quantité
