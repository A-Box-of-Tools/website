[[howto]]
title = "Collez ce qu&rsquo;elle devrait donner."
body = """

      Ce que la page de téléchargement vous a donné, sous n&rsquo;importe quelle
      forme&nbsp;: de l&rsquo;hexadécimal seul, une ligne de sortie de
      <code>sha256sum</code>, un fichier <code>SHA256SUMS</code> entier, ou
      l&rsquo;attribut <code>integrity</code> pris sur une balise de script.
      L&rsquo;algorithme se déduit de la longueur, et la bonne case se coche
      toute seule."""

[[howto]]
title = "Lisez la réponse, pas la couleur."
body = """
 La page dit
      en une phrase si c&rsquo;est bien le fichier que décrit cette somme de
      contrôle. Si elle correspond, les octets sont identiques à ceux qu&rsquo;a
      mesurés l&rsquo;auteur. Sinon, ils ne le sont pas, et il vaut mieux
      retélécharger avant d&rsquo;ouvrir quoi que ce soit."""

[[howto]]
title = "Emportez les sommes si vous en avez besoin."
body = """

      Copiez-en une, copiez-les toutes, ou enregistrez-les dans un petit fichier
      texte, sous la forme avec l&rsquo;algorithme en tête qu&rsquo;écrivent les
      outils en ligne de commande. Le nom de l&rsquo;algorithme voyage ainsi avec
      le nombre."""

[[faq]]
q = "Mon fichier est-il envoyé quelque part&nbsp;?"
a = """
        Non. Votre propre navigateur le lit sur votre disque et le calcule sur
        votre propre processeur, par tranches de quatre mégaoctets. Cet outil
        n&rsquo;a pas de partie serveur, et la
        <code>Content-Security-Policy</code> de la page énumère toutes les
        adresses qu&rsquo;elle peut contacter&nbsp;: aucune ne nous appartient.
        Débranchez le réseau et cela continue de fonctionner."""

[[faq]]
q = "Y a-t-il une limite de taille&nbsp;?"
a = """
        Non. Le fichier n&rsquo;est jamais gardé entier&nbsp;: il est lu par
        morceaux, et chaque morceau est compté puis jeté, de sorte
        qu&rsquo;une image disque de quarante gigaoctets consomme les mêmes
        quelques mégaoctets de mémoire qu&rsquo;un fichier texte. Ce que cela
        coûte, c&rsquo;est du temps, et la page vous dit combien au fur et à
        mesure.
        <br><br>
        C&rsquo;est la raison pour laquelle les algorithmes sont écrits ici
        plutôt que confiés au <code>crypto.subtle.digest</code> du navigateur,
        qui serait plus rapide. Cet appel prend le message entier dans un seul
        tampon et il n&rsquo;existe aucun moyen de lui donner un fichier par
        morceaux&nbsp;: s&rsquo;en servir aurait fait dépendre la taille du plus
        gros fichier vérifiable de la mémoire que cet onglet obtient. Sur un
        téléphone, cela fait quelques centaines de mégaoctets, et ce que les gens
        veulent le plus vérifier, ce sont des images disque."""

[[faq]]
q = "La somme correspond. Qu&rsquo;est-ce que cela prouve au juste&nbsp;?"
a = """
        Que les octets présents sur votre disque sont ceux que quelqu&rsquo;un
        avait sous les yeux en notant ce nombre. Rien de plus, et les limites
        méritent d&rsquo;être précises.
        <br><br>
        Cela prouve que le téléchargement n&rsquo;a pas été tronqué, ni abîmé par
        un disque défaillant, ni remplacé en chemin. Cela ne prouve
        <strong>pas</strong> que le fichier est sans danger, car un auteur peut
        mesurer un logiciel malveillant aussi exactement qu&rsquo;autre chose. Et
        cela prouve très peu si la somme venait de la même page, par la même
        connexion, que le fichier&nbsp;: qui pouvait changer l&rsquo;un pouvait
        changer l&rsquo;autre. Une somme de contrôle vaut surtout quand elle vous
        parvient par une autre voie&nbsp;: un fichier <code>SHA256SUMS</code>
        signé, l&rsquo;annonce de version d&rsquo;une distribution, un second
        miroir, ou un gestionnaire de paquets qui la connaît déjà."""

[[faq]]
q = "Elle ne correspond pas. Et maintenant&nbsp;?"
a = """
        Retéléchargez d&rsquo;abord le fichier, au même endroit. Un transfert
        interrompu ou repris est de très loin la cause la plus fréquente, et une
        deuxième copie règle généralement l&rsquo;affaire.
        <br><br>
        Si la deuxième copie donne la même mauvaise réponse, vérifiez que vous
        comparez à la bonne ligne&nbsp;: les pages de version listent plusieurs
        fichiers, et la somme de la version ARM ne correspondra jamais à celle de
        la version x86. Vérifiez ensuite le numéro de version. Si tout cela est
        juste et que cela ne correspond toujours pas, n&rsquo;ouvrez pas le
        fichier. Prenez-le sur un autre miroir et comparez les deux sommes entre
        elles."""

[[faq]]
q = "Lequel choisir&nbsp;?"
a = """
        Celui que l&rsquo;auteur a publié. Tout l&rsquo;exercice consiste à
        comparer à son nombre, et vous ne pouvez pas choisir le sien à sa place.
        <br><br>
        Si vous produisez une somme plutôt que d&rsquo;en vérifier une, prenez
        SHA-256. MD5 et SHA-1 sont cassés au sens qui compte&nbsp;: deux fichiers
        différents ayant la même empreinte peuvent être fabriqués exprès, en
        quelques heures pour MD5 et pour un coût modéré pour SHA-1. Cela ne les
        rend pas inutiles contre les accidents, car un téléchargement tronqué ne
        tombera pas par hasard sur la même empreinte&nbsp;; mais cela veut dire
        qu&rsquo;aucun des deux ne peut plus vous assurer que personne n&rsquo;a
        touché au fichier. SHA-384 et SHA-512 vont très bien et ne valent pas
        mieux en pratique&nbsp;; ils sont là parce que certains projets les
        publient."""

[[faq]]
q = "Pourquoi MD5 est-il là s&rsquo;il est cassé&nbsp;?"
a = """
        Parce que c&rsquo;est encore ce qui est imprimé. Des miroirs, des pages
        de micrologiciels, des serveurs universitaires et quantité de sites de
        constructeurs ont publié un MD5 il y a vingt ans et n&rsquo;ont pas
        rouvert la page depuis. Un outil qui refuserait d&rsquo;en calculer un
        refuserait de répondre à la question avec laquelle ses visiteurs
        arrivent vraiment.
        <br><br>
        Ce qu&rsquo;il peut faire, en revanche, c&rsquo;est dire ce que la
        réponse vaut, et c&rsquo;est le rôle de la note à côté de la case. Un MD5
        qui correspond écarte toujours un téléchargement abîmé. Il n&rsquo;écarte
        pas un téléchargement trafiqué."""

[[faq]]
q = "Quels formats puis-je coller dans le champ de comparaison&nbsp;?"
a = """
        Tous les formats courants, et la page reconnaît elle-même lequel
        c&rsquo;est.
        <br><br>
        De l&rsquo;hexadécimal seul, avec ou sans espaces. Une ligne de sortie de
        <code>md5sum</code> ou <code>sha256sum</code>, avec le nom de fichier
        derrière. Un fichier <code>SHA256SUMS</code> entier de quarante
        lignes&nbsp;: c&rsquo;est alors la ligne qui nomme votre fichier qui est
        retenue. La forme BSD, <code>SHA256 (disk.iso) = &hellip;</code>. Une
        étiquette devant, comme <code>SHA-256&nbsp;: &hellip;</code>. Et un
        attribut de subresource integrity, <code>sha384-&hellip;</code>, qui est
        en base64 plutôt qu&rsquo;en hexadécimal et qui est décodé avant la
        comparaison.
        <br><br>
        L&rsquo;algorithme se déduit de la longueur&nbsp;: 32 caractères
        hexadécimaux font un MD5, 40 un SHA-1, 64 un SHA-256, 96 un SHA-384 et
        128 un SHA-512. Aucun n&rsquo;a la longueur d&rsquo;un autre, il n&rsquo;y
        a donc rien à choisir et rien à se tromper."""

[[faq]]
q = "Le résultat sera-t-il le même que celui de sha256sum ou de certutil&nbsp;?"
a = """
        Oui, octet pour octet. Ce sont des spécifications exactes avec des
        vecteurs de test publiés, et chaque algorithme d&rsquo;ici est vérifié à
        chaque construction face à ces vecteurs et face à
        l&rsquo;implémentation du système d&rsquo;exploitation.
        <br><br>
        La seule différence visible est la présentation. Le
        <code>certutil -hashfile</code> de Windows écrit en majuscules avec des
        espaces&nbsp;; cette page écrit en minuscules, ce qu&rsquo;emploie la
        quasi-totalité des auteurs. La comparaison ignore les deux, si bien
        qu&rsquo;une somme copiée depuis certutil correspond à une somme en
        minuscules collée ici."""

[[faq]]
q = "Puis-je comparer deux fichiers entre eux&nbsp;?"
a = """
        Oui, avec une étape de plus&nbsp;: vérifiez le premier, copiez sa somme,
        choisissez ensuite le second et collez cette somme dans le champ. Si les
        deux fichiers sont identiques, la page le dira.
        <br><br>
        Cela vaut d&rsquo;être connu pour le cas où les sommes de contrôle sont
        discrètement imbattables&nbsp;: savoir si la copie sur le disque de
        sauvegarde est vraiment le même fichier que celui de l&rsquo;ordinateur
        portable, quand les deux annoncent la même taille et la même date."""

[[faq]]
q = "Est-ce que cela modifie mon fichier&nbsp;?"
a = """
        Non. Cet outil ne fait que lire. Il n&rsquo;y a pas de fichier de sortie,
        pas de réencodage et rien qui soit réécrit&nbsp;: la seule chose
        téléchargeable est un petit fichier texte listant les sommes. Votre
        original reste intact sur votre disque, ce qui est aussi la réponse
        honnête à la question de ce qui se passe si vous fermez l&rsquo;onglet."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C&rsquo;est gratuit, et il n&rsquo;y a ni compte, ni inscription, ni
        période d&rsquo;essai. Il n&rsquo;y a pas de limite de taille de fichier
        ni de limite au nombre de fichiers vérifiés. Le site porte de la
        publicité, et c&rsquo;est elle qui le paie&nbsp;; on ne lui donne rien
        sur votre fichier."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, débranchez internet, et elle continue de
        fonctionner. C&rsquo;est aussi la façon la plus simple de prouver que
        rien n&rsquo;est envoyé&nbsp;: un outil qui expédierait votre fichier
        ailleurs pour le calculer s&rsquo;arrêterait à la seconde où vous
        débranchez."""

