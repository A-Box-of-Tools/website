# Overrides for tools/hash-checksum/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# "Somme de contrôle" is the French term and "checksum" is what gets typed, so
# the searchable strings carry both and the body copy uses the French. The
# algorithm names are never translated: MD5 and SHA-256 are what is printed on
# the download page the reader has open.
