 La
      Content-Security-Policy énumère toutes les adresses que cette page peut
      contacter, et aucune ne nous appartient. Il n&rsquo;y a ici aucun point de
      collecte pour votre fichier, et rien dans le code qui l&rsquo;y enverrait
      s&rsquo;il en existait un. Cette ligne disait autrefois
      <code>connect-src 'none'</code>, ce qui était absolu&nbsp;; la publicité a
      coûté cela, et le dire fait partie du marché."""

[[privacy]]
title = "Le fichier n&rsquo;est jamais gardé entier, quelle que soit sa taille."
body = """

      Il est lu par tranches de quatre mégaoctets, et chaque tranche est intégrée
      à l&rsquo;état courant puis jetée. La mémoire utilisée est donc la même
      pour une image disque de quarante gigaoctets que pour un fichier texte, et
      il n&rsquo;existe pas de taille à partir de laquelle la page renonce.
      C&rsquo;est aussi pourquoi le <code>crypto.subtle.digest</code> du
      navigateur n&rsquo;est pas utilisé&nbsp;: il veut le fichier entier en
      mémoire d&rsquo;un coup, ce qui est exactement le plafond que cet outil
      existe pour ne pas avoir."""

