pledge = "Les photos sont décodées et lues sur cet appareil. Le moteur OCR et les données anglaises sont fournis avec la page, et aucune photo ni aucun champ extrait n’est envoyé pour l’OCR. Les taux manuels, la copie du rapport et les téléchargements sont aussi locaux. Seul le bouton Obtenir le taux historique contacte <a href=\"https://frankfurter.dev/\" target=\"_blank\" rel=\"noopener noreferrer\">Frankfurter</a> avec les deux codes de devise et la date choisie. Ce service voit la requête et votre adresse IP, mais ne reçoit aucune image, aucun montant, texte OCR, nom de fichier ou adresse de courriel. Le courriel et le partage sont votre étape suivante&nbsp;: ces boutons transmettent le rapport ou les fichiers que vous choisissez de partager à une application sur votre appareil. Vous choisissez le destinataire, vérifiez ce qui sera transmis et envoyez vous-même le message."
live_hint = "Ouvrez les DevTools et observez Réseau pendant la lecture d’une photo. La page peut charger ses propres ressources OCR, mais aucune requête ne transporte votre photo, son nom de fichier, le commerçant ou le montant. Une fois la page mise en cache, recommencez hors ligne avec des taux manuels. Appuyez sur Obtenir le taux historique pour voir une requête à api.frankfurter.dev contenant uniquement les codes de devise et la date choisie. L’envoi ultérieur du courriel utilise la connexion de votre application de messagerie."
read_first = ", <code>src/ocr.js</code> pour l’interface OCR locale, <code>src/main.js</code> pour la vérification et les transmissions au courriel ou au partage, <code>src/attachments.js</code> pour les copies JPEG, <code>src/email.js</code> pour le fichier de courriel, <code>src/fx.js</code> pour la conversion et les requêtes facultatives de taux historiques, et <code>vendor/</code> pour le moteur et ses licences. Le rapport et les pièces jointes sont assemblés dans l’onglet&nbsp;; vous choisissez une application de messagerie ou téléchargez un fichier de courriel, puis l’envoyez vous-même."
howto_heading = "Comment extraire les renseignements des reçus et factures à partir de photos"
card = "Lisez les photos de reçus et factures en local, vérifiez les champs suggérés et préparez un rapport avec chaque montant, le nombre de documents et un total général dans une seule devise de courriel. Utilisez des taux manuels ou des taux historiques en ligne facultatifs. Recadrez et compressez les images pour le courriel, ou enregistrez le rapport en CSV."

