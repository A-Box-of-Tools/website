[[faq]]
q = "Mon texte est-il envoyé quelque part&nbsp;?"
a = """
        Non. Chaque encodeur et chaque décodeur de cette page sont des fonctions qui
        s'exécutent dans votre propre navigateur, sur votre propre matériel. Cet
        outil n'a aucune fonction réseau&nbsp;: il ne va jamais rien chercher et
        n'envoie jamais rien, et la <code>Content-Security-Policy</code> de la page
        nomme chaque adresse qu'elle a le droit de contacter, dont aucune ne nous
        appartient. C'est la raison de s'en servir pour un jeton d'accès ou un
        cookie de session&nbsp;: coller l'un de ceux-là dans le décodeur de
        quelqu'un d'autre, c'est le lui donner."""

[[faq]]
q = "Le Base64 d'ici est-il le même Base64 que partout ailleurs&nbsp;?"
a = """
        Oui &mdash; il est vérifié par rapport aux vecteurs de test du RFC 4648 plutôt
        que par rapport à lui-même. Les deux alphabets se décodent, si bien qu'un JWT
        écrit avec <code>-</code> et <code>_</code> se lit aussi facilement qu'un autre
        écrit avec <code>+</code> et <code>/</code>, et une entrée coupée à 64
        caractères est recollée pour vous. L'encodage passe par les octets UTF-8, si
        bien qu'une lettre accentuée ou un émoji survit à l'aller-retour."""

[[faq]]
q = "Le Base64 est-il un chiffrement&nbsp;?"
a = """
        Non, et le prendre pour tel est l'erreur classique. Le Base64 est une
        orthographe&nbsp;: les mêmes octets, écrits dans un alphabet qui survit à une
        URL, à un courriel ou à une chaîne JSON. N'importe qui peut le relire &mdash;
        cette page le fait en une milliseconde &mdash;, il ne cache donc rien et ne
        protège rien. Si ce que vous avez est secret, il lui faut un vrai chiffrement
        avant d'être encodé, pas à la place."""

[[faq]]
q = "Pourquoi le décodage a-t-il échoué&nbsp;?"
a = """
        Parce que ce qui a été collé n'est pas tout à fait ce que le codec croyait
        recevoir, et l'erreur dit en quoi&nbsp;: un caractère hors de l'alphabet
        Base64, un remplissage au mauvais endroit, un signe pourcent sans deux
        chiffres hexadécimaux derrière, ou des octets qui se décodent bien depuis le
        Base64 mais ne sont pas du texte UTF-8 &mdash; ce qui veut généralement dire
        que l'original était un fichier et non une chaîne. Le <code>atob</code> du
        navigateur aurait renvoyé quelque chose de plausible à la place&nbsp;; être
        prévenu est tout l'intérêt de coller quelque chose dans un décodeur."""

[[faq]]
q = "Quelle est la différence entre les deux encodages d'adresse web&nbsp;?"
a = """
        Une valeur seule, ou l'adresse entière. Encoder <em>une valeur</em> échappe
        tout ce à quoi une URL donne un sens &mdash; les barres obliques, les points
        d'interrogation, les esperluettes &mdash;, ce que vous voulez pour un seul
        paramètre de requête. Encoder une <em>URL entière</em> laisse l'adresse
        fonctionner&nbsp;: les barres obliques et le <code>?</code> restent, et seuls
        les caractères qu'une URL ne peut pas porter du tout sont échappés. Le
        premier appliqué à une adresse entière casse l'adresse&nbsp;; le second
        appliqué à une valeur perd l'endroit où la valeur s'arrête."""

[[faq]]
q = "Quelle taille de fichier peut-il traiter&nbsp;?"
a = """
        Aucune limite n'est fixée ici, puisqu'aucun serveur ne la paie. Le plafond réel
        est votre machine&nbsp;: quelques mégaoctets de texte ne posent pas de
        problème, et sur un très long document la page attend une pause dans votre
        frappe avant de réencoder, plutôt que de vous disputer le clavier."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai, ni
        limite sur ce que vous collez. Le site affiche de la publicité, et c'est elle
        qui le finance&nbsp;; les annonces ne reçoivent rien sur votre texte."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue
        de travailler. C'est aussi la façon la plus simple de prouver que rien n'est
        envoyé, car un outil qui expédierait votre texte ailleurs pour le décoder
        s'arrêterait à l'instant où vous débranchez."""

