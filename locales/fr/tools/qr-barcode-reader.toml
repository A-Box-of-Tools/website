#
# Lecteur de QR codes et de codes-barres - French.
#
# Overrides for tools/qr-barcode-reader/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# Vouvoiement, comme le générateur d'à côté.
#
# The format names stay as they are - EAN-13, UPC-A, ITF-14, Code 128, Code 39,
# ISO/IEC 18004 - because those are the names printed on the specification and
# on whatever is going to scan the label.
#
# "Code-barres" is hyphenated everywhere, which is the standard spelling; the
# older "code a barres" is not used here.
#

name = "Lecteur de QR codes et de codes-barres"
heading = "Lecteur de QR&nbsp;codes&nbsp;et&nbsp;codes-barres <span class=\"h1-kw\">&mdash; scanner un QR code depuis une image ou la caméra</span>"
tagline = "Visez un code, ou déposez-en une photo. La lecture se fait ici, et nulle part ailleurs."

title = "Lecteur de QR code &amp; scanner de codes-barres &mdash; depuis une image, sans rien envoyer"
description = "Lisez un QR code depuis une photo, une capture d'écran ou votre caméra, et voyez exactement où mène le lien avant de l'ouvrir. Codes-barres EAN, UPC, Code 128, Code 39 et ITF aussi. Rien n'est envoyé."
og_title = "Lire un QR code sans envoyer l'image à qui que ce soit"
og_description = "Scannez un QR code depuis une image ou avec votre caméra, et lisez l'adresse entière avant de décider de l'ouvrir. L'image ne quitte pas votre machine, et aucune image de la caméra n'est enregistrée."
og_image_alt = "Lecteur de QR codes et de codes-barres - lire un code depuis une image ou la caméra, sans rien envoyer"

pledge = """
    Lire un code, c'est de l'arithmétique sur des pixels, et les pixels sont
    déjà là. Trouver le symbole, corriger l'angle de la prise de vue, défaire le
    masque, réparer les dégâts avec Reed-Solomon et relire les bits&nbsp;: tout
    cela se passe dans environ deux mille lignes de JavaScript que vous pouvez
    lire, dans cette page. <strong>La caméra, c'est la même promesse, pas une
    exception&nbsp;:</strong> une image arrive sous forme de pixels dans cet
    onglet, elle est examinée, elle disparaît. Rien n'est enregistré, rien n'est
    conservé, et cette page n'a aucune fonction réseau qui permettrait d'envoyer
    quoi que ce soit."""

live_hint = """
      Ne nous croyez pas sur parole&nbsp;: ouvrez les outils de développement,
      surveillez l'onglet &laquo;&nbsp;Réseau&nbsp;&raquo; et scannez un code
      avec la caméra allumée. Pas une seule requête ne transporte une image ni
      un caractère de ce qu'elle disait. Vous pouvez aussi couper la connexion
      et lire le code quand même."""

read_first = """
, <code>src/binarize.js</code>
      et <code>src/detect.js</code> pour trouver un symbole dans une photo
      &mdash; le seuil, les motifs de repérage et la correction de perspective
      &mdash;, <code>src/qr-decode.js</code> pour le relire,
      <code>src/reed-solomon.js</code> pour réparer ce qui a été mal lu,
      <code>src/linear.js</code> pour ceux à barres, et
      <code>src/camera.js</code>, qui est chaque ligne de cette page qui touche
      à une caméra."""

howto_heading = "Comment lire un QR code sans envoyer l'image"

card = """
            Lisez un QR code depuis une photo, une capture d'écran ou votre
            caméra &mdash; et voyez l'adresse entière avant de l'ouvrir. Les
            codes-barres aussi."""

[picker]
title = "Déposez ici une image contenant un code"
hint = "ou cliquez pour parcourir &mdash; une photo, une capture d'écran, un PNG, tout ce que votre navigateur sait ouvrir"

[words]
plural = "images et les codes qu'elles contiennent"
choose = "l'image à lire"

