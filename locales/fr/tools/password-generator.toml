[[privacy]]
title = "Le mot de passe est fabriqué là où vous lisez ces lignes."
body = """
 Il est tiré dans
      cette page, par cette page, à partir de l'aléa que votre propre système
      d'exploitation remet au navigateur. Rien n'est demandé pour le produire et
      rien n'est signalé une fois qu'il existe. La
      <code>Content-Security-Policy</code> nomme chaque adresse que cette page a
      le droit de contacter, et aucune ne nous appartient&nbsp;: il n'y a ici
      aucun point de collecte où un mot de passe généré pourrait aboutir, ni rien
      dans le code qui l'y enverrait s'il en existait un."""

[[privacy]]
title = "Rien ici ne va rien chercher."
body = """
 Il n'y a ni
      <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code> nulle part dans <code>src/</code>. La liste de mots
      n'est pas téléchargée&nbsp;: c'est <code>src/wordlist.js</code>, servie
      depuis cette origine avec le reste de la page, et vous pouvez la lire."""

[[privacy]]
title = "L'aléa est celui du navigateur, et c'est le bon."
body = """
 <code>crypto.getRandomValues</code>
      est le générateur que les navigateurs fournissent pour les clés et les
      jetons, alimenté et réalimenté par le système d'exploitation.
      <code>Math.random</code> n'apparaît nulle part dans ce dossier, et ce
      serait un vrai défaut s'il y était&nbsp;: son état interne se reconstitue à
      partir d'une poignée de sorties, ce qui rend calculable, pour quiconque en
      a vu un seul, chacun des mots de passe qu'il produira."""

[[privacy]]
title = "Rien n'est enregistré, il n'y a donc pas d'historique à effacer."
body = """
 Pas de localStorage, pas de
      sessionStorage, pas de cookie, pas de paramètre d'URL et pas de
      <code>&lt;input&gt;</code> que le navigateur proposerait de retenir. Ce qui
      est à l'écran vit dans un seul tableau en mémoire dans cette page, et
      fermer l'onglet suffit à tout nettoyer. Les seules copies de ce qui est
      fabriqué ici sont celles que vous emportez."""

[[privacy]]
