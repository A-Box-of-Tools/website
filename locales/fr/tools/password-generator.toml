[[howto]]
title = "Choisissez un mot de passe ou une phrase secrète."
body = """
 Un mot de passe est une suite de
      caractères aléatoires&nbsp;: court à stocker, pénible à taper, et
      exactement ce qu'il faut pour les centaines de comptes que votre
      gestionnaire remplit à votre place. Une phrase secrète, ce sont des mots
      tirés au hasard dans une liste&nbsp;: plus longue, mais mémorisable et
      prononçable, ce dont vous avez besoin pour les quelques secrets que vous
      devez taper de tête &mdash; celui du gestionnaire lui-même, celui de votre
      ordinateur portable, le code de récupération de votre téléphone."""

[[howto]]
title = "Réglez la longueur, ou le nombre de mots."
body = """
 C'est le réglage qui compte, et les
      autres pour l'essentiel non. Vingt caractères, ou six mots, est un plancher
      raisonnable pour tout ce qui mérite d'être protégé&nbsp;; montez au-dessus
      pour le compte qui permettrait de réinitialiser tous les autres. L'affichage
      en dessous bouge pendant que vous faites glisser le curseur, vous voyez donc
      ce que chaque caractère supplémentaire vous apporte."""

[[howto]]
title = "Activez les règles sur lesquelles le formulaire va insister."
body = """
 &laquo;&nbsp;Au moins un de
      chaque&nbsp;&raquo;, un chiffre à la fin, un symbole pris dans la courte
      liste que tous les sites acceptent. Rien de tout cela ne renforce quoi que
      ce soit, et le premier affaiblit très légèrement, ce que la page a déjà
      retranché. Mais c'est ainsi qu'on passe un formulaire d'inscription sans en
      générer six d'affilée."""

[[howto]]
title = "Lisez le nombre, pas la couleur."
body = """
 Les bits sont comptés à partir des
      réglages qui ont produit la chaîne&nbsp;: la taille de l'alphabet, le
      nombre de tirages, et rien d'autre. C'est une vraie mesure, contrairement à
      la jauge d'une page d'inscription, qui ne peut que noter les caractères
      qu'elle a devant elle et n'a aucun moyen de savoir si c'est vous ou un
      générateur qui les a choisis."""

[[howto]]
title = "Copiez-le et rangez-le quelque part avant de partir."
body = """
 Il n'y a pas d'historique ici, ni
      moyen de le redemander&nbsp;; recharger la page le détruit. Collez-le
      d'abord dans le gestionnaire de mots de passe, ensuite dans le formulaire
      d'inscription, pour que celui qui doit s'en souvenir l'ait avant que quoi
      que ce soit puisse mal tourner."""

[[howto]]
title = "Prenez un lot si vous en avez besoin."
body = """
 Le curseur du bas en fabrique jusqu'à
      cent d'un coup et les enregistre en fichier texte brut, écrit par cette page
      à partir de ce qui est déjà à l'écran. Utile pour créer des comptes en série
      ou distribuer des accès initiaux, et à supprimer dès qu'ils sont ailleurs&nbsp;:
      un fichier plein de mots de passe sur un disque reste un fichier plein de
      mots de passe."""

[[faq]]
q = "Les mots de passe sont-ils envoyés quelque part, ou enregistrés&nbsp;?"
a = """
        Ni l'un ni l'autre. Ils sont fabriqués dans votre navigateur, sur votre
        propre matériel, et cet outil n'a aucune fonction réseau&nbsp;: il ne va
        jamais rien chercher et n'envoie jamais rien. Rien n'est écrit non plus
        dans le stockage&nbsp;: pas de localStorage, pas de cookie, pas
        d'historique. Rechargez la page et tous les mots de passe qu'elle vous a
        montrés ont disparu, de l'écran comme de sa propre mémoire. La
        <code>Content-Security-Policy</code> de la page nomme chaque adresse
        qu'elle peut contacter et aucune n'est la nôtre&nbsp;: il n'y a donc nulle
        part où un mot de passe pourrait être collecté, même si quelque chose
        essayait."""

[[faq]]
q = "D'où vient l'aléa&nbsp;?"
a = """
        De <code>crypto.getRandomValues</code>, le générateur que les navigateurs
        fournissent pour un usage cryptographique, alimenté et réalimenté par la
        réserve d'entropie de votre système d'exploitation. C'est la source dans
        laquelle le navigateur puise le matériel de clés TLS.
        <code>Math.random</code> n'est utilisé nulle part dans cet outil, et la
        distinction n'est pas du pinaillage&nbsp;: <code>Math.random</code> est un
        générateur arithmétique rapide dont l'état interne complet se reconstitue
        à partir de quelques sorties consécutives, si bien qu'un générateur de
        mots de passe bâti dessus produit des mots de passe qui ont l'air
        aléatoires et que peut énumérer quiconque en a vu un."""

[[faq]]
q = "Un mot de passe fabriqué dans un navigateur vaut-il celui d'un logiciel installé&nbsp;?"
a = """
        Pour l'aléa, oui&nbsp;: c'est la même source du système d'exploitation
        dans les deux cas, atteinte par une autre porte. Ce qui diffère, c'est ce
        qu'il y a d'autre dans la pièce. Un onglet de navigateur cohabite avec vos
        extensions, et une extension autorisée à lire les pages peut lire
        celle-ci. C'est vrai de tout générateur web, celui-ci compris, et c'est la
        raison honnête d'utiliser le générateur intégré à votre gestionnaire de
        mots de passe quand vous en avez un&nbsp;: c'est la même arithmétique,
        dans un processus où il y a moins de monde autour. Cette page est pour
        quand vous n'en avez pas sous la main."""

[[faq]]
q = "Mot de passe ou phrase secrète&nbsp;? Que faut-il utiliser&nbsp;?"
a = """
        Un mot de passe pour tout ce qu'un gestionnaire tape à votre place, parce
        que vous ne le regarderez jamais et que la longueur ne coûte rien. Une
        phrase secrète pour les rares choses que vous devez taper de tête ou dire
        à voix haute&nbsp;: le mot de passe maître du gestionnaire, la clé de
        chiffrement d'un disque, un appareil configuré à distance. Six mots de la
        liste longue font 77&nbsp;bits, plus qu'un mot de passe aléatoire de douze
        caractères, et infiniment plus faciles à saisir correctement à quatre
        heures du matin."""

[[faq]]
q = "Quelle longueur doit faire un mot de passe&nbsp;?"
a = """
        Vingt caractères sur l'alphabet complet font environ 130&nbsp;bits, bien
        au-delà du point où la longueur cesse d'être le sujet. Seize suffit
        largement. Douze est le plancher pour tout ce dont la perte vous
        ennuierait, et c'est le plancher, pas la cible. En dessous, vous pariez
        sur le fait que le site l'a stocké correctement, pari que vingt ans
        d'annonces de fuites déconseillent. La longueur l'emporte sur tous les
        autres réglages de cette page&nbsp;: un caractère de plus apporte davantage
        que n'importe quelle règle sur les caractères qui doivent y figurer."""

[[faq]]
q = "Combien de mots doit faire une phrase secrète&nbsp;?"
a = """
        Six de la liste longue, et sept si elle en protège d'autres. La fameuse
        image à quatre mots date de 2011, vaut 51&nbsp;bits et est aujourd'hui à
        portée d'une attaque hors ligne sérieuse. Cinq font 64. Six font 77, soit
        au-delà de ce qu'un attaquant dépensera pour un compte ordinaire. Chaque
        mot supplémentaire de la liste longue ajoute 12,9&nbsp;bits, et les mots
        sont la seule chose qui ajoute quelque chose&nbsp;: ni les traits d'union,
        ni les majuscules."""

[[faq]]
q = "Qu'est-ce qu'un &laquo;&nbsp;bit&nbsp;&raquo;, et pourquoi cette page les compte-t-elle&nbsp;?"
a = """
        Un bit est un doublement. Soixante bits, cela veut dire qu'il y avait 2^60
        résultats également probables que cette page aurait pu produire&nbsp;:
        celui qui sait exactement comment elle fonctionne en a donc toujours
        autant à essayer. C'est une propriété du <em>procédé</em>, pas de la
        chaîne&nbsp;: la page peut la donner exactement parce que c'est elle qui a
        choisi et qu'elle sait combien de choix elle a faits. C'est là toute la
        différence avec la barre colorée d'un formulaire d'inscription, qui lit
        les caractères et devine. Sur cette barre,
        <code>correct horse battery staple</code> obtient une mauvaise note et
        vaut 44&nbsp;bits, tandis que <code>P@ssw0rd!</code> obtient une bonne note
        et ne vaut presque rien."""

[[faq]]
q = "Pourquoi &laquo;&nbsp;doit contenir un symbole&nbsp;&raquo; affaiblit-il un mot de passe&nbsp;?"
a = """
        Parce qu'une règle ne peut que retirer des possibilités. Exiger au moins
        un caractère de chaque ensemble écarte tous les mots de passe auxquels il
        n'en était pas tombé, et un ensemble plus petit de mots de passe possibles
        est un ensemble plus petit à parcourir. L'effet est faible &mdash; environ
        un demi-bit à une longueur courante &mdash; il est réel, et cette page le
        retranche au lieu de citer le chiffre qui l'avantage. Il est calculé
        exactement, en comptant les mots de passe que la règle autorise vraiment
        plutôt que ceux qu'elle écarte."""

[[faq]]
q = "Quelle est cette liste de mots, et le fait qu'un attaquant puisse la télécharger change-t-il quelque chose&nbsp;?"
a = """
        Ce sont les listes diceware de l'Electronic Frontier Foundation, livrées
        telles quelles&nbsp;: 7&nbsp;776 mots pour la longue, 1&nbsp;296 pour la
        courte. Elles ont été construites exactement pour cela&nbsp;: rien
        d'offensant, pas d'homophones, aucune paire qui se recolle en un troisième
        mot, et dans la liste courte aucun mot qui soit le début d'un autre. Et
        non, que la liste soit publique ne change rien&nbsp;: la solidité annoncée
        ici suppose que l'attaquant l'a, qu'il lit le code source de cette page et
        qu'il connaît tous vos réglages. La seule chose qu'il ignore, c'est lequel
        des 7&nbsp;776 mots est sorti à chaque fois. C'est précisément cette
        hypothèse qui rend le nombre digne de confiance."""

[[faq]]
q = "Une phrase secrète, n'est-ce pas une attaque par dictionnaire qui s'annonce&nbsp;?"
a = """
        Pas quand les mots sont choisis ainsi. Une attaque par dictionnaire
        fonctionne contre les phrases que composent des <em>humains</em>, parce
        que les humains choisissent des mots qui vont ensemble, dans un ordre qui
        a du sens, parmi les quelques milliers qu'ils emploient tous les jours.
        Cette page choisit chaque mot indépendamment, uniformément, dans une liste
        fixe, sans se soucier de savoir si le résultat se lit bien &mdash; ce qui
        explique qu'il ne se lise généralement pas bien. Un attaquant qui connaît
        la liste et le nombre de mots a encore devant lui 7&nbsp;776 puissance ce
        nombre."""

[[faq]]
q = "Puis-je récupérer un mot de passe après avoir quitté la page&nbsp;?"
a = """
        Non, et c'est délibéré. Rien n'est noté nulle part, il n'y a donc rien à
        récupérer&nbsp;: pas de panneau d'historique, pas de liste
        &laquo;&nbsp;générés récemment&nbsp;&raquo;, pas de cache. Un générateur
        capable de vous montrer le mot de passe de mardi dernier serait un
        générateur qui l'a stocké, et stocké là où vous pouvez l'atteindre veut
        dire stocké là où autre chose peut l'atteindre. Copiez-le dans un
        gestionnaire de mots de passe avant de quitter la page."""

[[faq]]
q = "Le copier dans le presse-papiers, est-ce prudent&nbsp;?"
a = """
        C'est le risque ordinaire, et il vaut mieux le connaître que s'en
        inquiéter. Le presse-papiers est partagé avec tout ce qui tourne sous
        votre compte, il survit en général jusqu'à la copie suivante, et sur
        certaines configurations il se synchronise entre appareils. Autant de
        raisons de le coller tout de suite là où il va et de copier autre chose
        ensuite, et aucune raison de taper à la main un mot de passe plus faible.
        Cette page ne peut pas lire votre presse-papiers&nbsp;; elle peut
        seulement y écrire, et seulement quand vous appuyez sur le bouton."""

[[faq]]
q = "Puis-je utiliser le même à plusieurs endroits&nbsp;?"
a = """
        Non, et c'est le seul conseil de cette page qui prime sur tous les autres.
        Presque tous les comptes piratés le sont avec un mot de passe qui était
        correct ailleurs d'abord&nbsp;: un site est compromis, la liste est
        publiée, et la même adresse avec le même mot de passe est essayée partout.
        Un mot de passe unique par site transforme une fuite en un seul compte
        plutôt qu'en la totalité, et c'est la raison d'avoir un gestionnaire de
        mots de passe &mdash; pas la solidité de tel ou tel mot de passe qu'il
        contient."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, il n'y a pas de compte, pas de connexion, pas d'essai et
        pas de limite au nombre que vous générez. Le site porte de la publicité,
        c'est ce qui le finance&nbsp;; les annonces ne reçoivent absolument rien de
        ce que fabrique cette page, ni sa longueur, ni sa solidité."""

[[faq]]
q = "Est-ce que ça marche hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, débranchez-vous d'internet, et elle
        continue à fabriquer des mots de passe. L'aléa vient de votre propre
        machine et la liste de mots est déjà dans la page. C'est aussi la façon la
        plus simple de prouver que rien n'est demandé ni envoyé&nbsp;: un
        générateur qui irait chercher ses nombres sur un serveur s'arrêterait à la
        seconde où vous débranchez."""

