name = "Synchroniser un dossier"
heading = "Synchroniser un dossier <span class=\"h1-kw\">&mdash; gardez un dossier identique sur deux appareils</span>"
tagline = "Choisissez un dossier sur chaque appareil, voyez toutes les différences et copiez ce qui manque ou est plus récent directement entre les deux navigateurs de votre réseau. Rien n’est envoyé sur un serveur, et rien n’est jamais supprimé."
title = "Synchroniser un dossier entre deux appareils &mdash; de navigateur à navigateur, sans envoi sur un serveur"
description = "Gardez un dossier identique sur deux ordinateurs. Comparez les deux dossiers, examinez chaque changement et copiez les fichiers directement entre les navigateurs de votre réseau. Sans envoi sur un serveur, sans compte et sans rien supprimer."
og_title = "Gardez un dossier identique sur deux appareils"
og_description = "Comparez deux dossiers et copiez ce qui manque ou est plus récent, directement entre les navigateurs de votre réseau. Sans envoi sur un serveur, sans compte et sans rien supprimer."
og_image_alt = "Synchroniser un dossier - gardez un dossier identique sur deux appareils"
pledge = "Vous choisissez un dossier sur chaque appareil et vous approuvez l’appareil qui vous rejoint. Les deux navigateurs comparent ensuite les noms, tailles et dates des fichiers par une connexion chiffrée établie directement entre eux, puis copient les fichiers que vous acceptez, sans aucun serveur intermédiaire. Il n’y a pas de relais&nbsp;: les deux appareils doivent donc partager un réseau sur lequel ils peuvent se joindre. L’appairage passe par un service de mise en relation sur internet, qui voit les métadonnées d’établissement de la connexion, jamais un fichier, un nom de fichier ni la comparaison. Un fichier reçu ne remplace l’ancien qu’une fois arrivé en entier, et rien n’est jamais supprimé. Arrêtez, ou fermez l’une des deux pages, pour mettre fin à la session."
pledge_line = "Les fichiers circulent <strong>directement entre vos deux appareils</strong>, chiffrés. Rien n’est envoyé sur un serveur&nbsp;; un service de mise en relation connecte les navigateurs."
md_note = "Comparaison de dossiers et copie de fichiers directement entre deux navigateurs approuvés, chiffrées et sans relais. La mise en relation par internet transporte des métadonnées d’établissement, jamais de fichiers, de noms de fichiers ni de listes. Rien n’est jamais supprimé."
live_hint = "Les outils de développement montrent un WebSocket vers le service de mise en relation pour les messages d’établissement de la connexion. Accepter d’apparaître dans la liste ou choisir «&nbsp;Rechercher des connexions&nbsp;» ouvre un WebSocket de découverte distinct. Les listes de fichiers et les fichiers passent par WebRTC chiffré, directement entre les appareils. L’onglet Réseau et la CSP ne suffisent pas à inspecter ce trafic entre pairs. Le cadre du site charge ses ressources tierces habituelles."
read_first = ", <code>src/plan.js</code> pour la façon dont deux listes deviennent la liste des différences et la raison pour laquelle rien n’est supprimé, <code>src/transfer.js</code> pour le transfert avec accusés de réception qui évite de garder un gros fichier en mémoire, <code>src/folder.js</code> pour les écritures qui ne remplacent un fichier qu’une fois celui-ci complet, et <code>src/session.js</code> pour l’approbation qui précède toute comparaison des dossiers. Le service de mise en relation est publié à côté de l’outil, sous <code>workers/rendezvous/</code>."
howto_heading = "Comment synchroniser un dossier entre deux appareils"
card = "Comparez un dossier sur deux appareils et copiez ce qui manque ou est plus récent, directement entre les navigateurs de votre réseau. Rien n’est envoyé sur un serveur, rien n’est supprimé."

