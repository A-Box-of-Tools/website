[[howto]]
title = "Inversez et téléchargez."
body = """
 Le travail se fait sur votre propre
      matériel&nbsp;: la durée dépend donc de votre machine et non d'une file
      d'attente. La vidéo finie part directement dans les téléchargements de votre
      navigateur."""

[[faq]]
q = "Ma vidéo est-elle envoyée quelque part&nbsp;?"
a = """
        Non. Elle est lue, décodée, inversée et encodée par votre propre navigateur
        sur votre propre matériel. Cet outil n'a aucune partie serveur, et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle
        a le droit de contacter&nbsp;: aucune ne nous appartient. Si vous préférez
        vérifier plutôt qu'être cru sur parole, coupez la connexion et inversez un
        clip quand même."""

[[faq]]
q = "Quels formats vidéo puis-je inverser&nbsp;?"
a = """
        MP4, M4V et MOV sont lus directement, quoi qu'ils contiennent&nbsp;: H.264,
        HEVC, AV1 ou VP9, tant que votre navigateur sait décoder ce codec. Tout ce
        que votre navigateur sait lire par ailleurs, WebM en tête, est inversé en
        faisant reculer pas à pas le lecteur du navigateur&nbsp;: cela marche, mais
        c'est plus lent. Un fichier que le navigateur ne sait ni lire ni jouer, ce
        qui en pratique veut dire AVI, WMV, FLV et la plupart des MKV, est refusé
        avec un message qui le dit plutôt que d'échouer à mi-parcours. Ce qui
        ressort est toujours un MP4."""

[[faq]]
q = "Le son est-il inversé lui aussi&nbsp;?"
a = """
        Oui, sauf si vous le désactivez. Toute la piste est décodée, les
        échantillons sont remis dans l'autre sens, et elle est réencodée en AAC. Ce
        deuxième encodage est inévitable&nbsp;: un paquet audio, ce sont quelques
        dizaines de millisecondes de son codées par rapport au paquet précédent, si
        bien qu'écrire les paquets à l'envers ferait entendre de courts morceaux lus
        à l'endroit dans le mauvais ordre, ce qui sonne comme une panne et non comme
        une inversion."""

[[faq]]
q = "Inverser fait-il perdre de la qualité&nbsp;?"
a = """
        L'image est encodée une deuxième fois, ce qui coûte un peu. On ne peut pas
        l'éviter ici comme on l'évite en découpant&nbsp;: un clip inversé montre ses
        images dans un ordre pour lequel rien dans le fichier d'origine n'avait été
        codé, donc chaque image doit être réécrite. Ce que l'outil ne fera pas,
        c'est dépenser <em>plus</em> que l'original, puisque encoder au-delà ne fait
        que grossir le fichier sans améliorer l'image."""

[[faq]]
q = "Y a-t-il une limite de taille ou de durée de la vidéo&nbsp;?"
a = """
        Aucune limite n'est inscrite dans l'outil, et le fichier n'est pas chargé
        d'un coup en mémoire&nbsp;: il est parcouru groupe d'images par groupe
        d'images, à rebours. Les plafonds réels sont la vidéo finie, assemblée en
        mémoire avant le téléchargement, et le son, qui doit être gardé en entier
        puisqu'une inversion a besoin du dernier échantillon avant de pouvoir écrire
        le premier."""

[[faq]]
q = "Pourquoi est-ce plus lent sur certains fichiers&nbsp;?"
a = """
        Parce qu'il y a deux voies d'entrée. Un MP4 ou un MOV est lu directement par
        cet outil et décodé un groupe d'images à la fois, ce qui va aussi vite que
        votre machine. Le reste est inversé en demandant au lecteur du navigateur un
        instant du clip après l'autre, et chacun de ces sauts oblige le navigateur à
        décoder depuis l'image clé précédente. La page indique laquelle des deux
        voies elle emprunte, et pourquoi, avant que vous ne commenciez."""

[[faq]]
q = "Puis-je n'inverser qu'une partie du clip&nbsp;?"
a = """
        Pas ici. Cet outil inverse la totalité&nbsp;: le clip qui sort dure
        exactement autant que celui qui est entré, avec la dernière image en
        premier. Découpez d'abord la partie voulue avec le
        <a href="../couper-une-video/">Découpeur de vidéo</a>, qui le fait sans
        réencoder une seule image, puis inversez ce qui en sort."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai,
        ni filigrane. Le site affiche de la publicité, et c'est elle qui le
        finance&nbsp;; les annonces ne reçoivent rien sur votre vidéo."""

