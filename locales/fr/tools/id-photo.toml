[[privacy]]
title = "Une photographie de votre visage ne quitte jamais cette machine."
body = """
 Cela pèse plus lourd
      ici que sur la plupart des outils&nbsp;: le fichier que cette page manipule est
      une image de votre visage, et ce que vous vous apprêtez à en faire nomme aussi
      le pays dont vous demandez le document. La
      <code>Content-Security-Policy</code> nomme chaque adresse que cette page a le
      droit de contacter, et pas une seule ne nous appartient. Il n'existe ici aucun
      point de collecte où votre photographie pourrait atterrir."""

[[privacy]]
title = "Rien ici ne va chercher quoi que ce soit."
body = """
 Il n'y a nulle part dans
      <code>src/</code> ni <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code>. Le recueil de règles est une table dans
      <code>src/specs.js</code>, servie avec la page et mise en cache avec elle&nbsp;:
      il n'y a aucune liste de pays à consulter et rien à quoi comparer votre photo à
      distance."""

[[privacy]]
title = "Le visage est trouvé sans modèle de visage."
body = """
 Aucun poids à
      télécharger, aucun moteur d&rsquo;inférence pour les exécuter et rien qui
      soit récupéré&nbsp;: le sommet du crâne vient du contour de votre tête sur le
      mur derrière vous, les pupilles des zones du visage plus sombres que ce qui
      les entoure. Rien là-dedans ne lit la couleur de peau, et c&rsquo;est
      précisément pour cela que c&rsquo;est écrit ainsi &mdash; un modèle qui se
      trompe se trompe inégalement, plus sur certains visages que sur d&rsquo;autres.
      C&rsquo;est une position de départ plutôt qu&rsquo;un verdict&nbsp;: la page
      dit lequel des quatre points elle n&rsquo;a pas pu mesurer, chaque point reste
      déplaçable, et <em>Je les place moi-même</em> désactive tout cela."""

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = """
 Les scripts
      publicitaires et de mesure viennent de Google, et le bouton de don de Buy Me a
      Coffee. Aucun d'eux ne reçoit quoi que ce soit sur votre photographie, votre
      visage ou le pays dont vous avez choisi la règle. Chaque ligne qui lit, recadre,
      mesure ou écrit un fichier est servie depuis cette origine et figure dans le
      dépôt."""

[[privacy]]
title = "Tout fonctionne hors ligne."
body = """
 Coupez le réseau&nbsp;: l'outil reste
      identique, puisqu'il n'a jamais comporté la moindre étape réseau. C'est la
      preuve la plus simple de toutes."""

[[howto]]
title = "Choisissez la photographie."
body = """
 Une photo de téléphone devant un mur
      uni, à la lumière du jour, prise à un mètre cinquante environ. Le navigateur la
      lit directement sur votre disque, et rien ne part nulle part pendant ce
      temps."""

[[howto]]
title = "Choisissez le pays et le document."
body = """
 Le panneau affiche alors la
      taille d'impression, la fourchette de hauteur de tête, la ligne des yeux, la
      couleur de fond et les limites d'envoi de cette règle, avec pour chaque chiffre
      l'autorité dont il vient et la date à laquelle il a été relevé. Rien dans cette
      liste n'est deviné, et tout ce qu'on vous a envoyé et qui n'y figure pas se
      saisit sous &laquo;&nbsp;Ailleurs dans le monde&nbsp;&raquo;."""

[[howto]]
title = "Vérifiez les quatre points sur votre visage."
body = """
 Sommet du crâne, menton
      et chaque pupille&nbsp;: ces quatre points constituent la totalité de ce que la
      règle mesure. Ils sont posés en mesurant la photo elle-même, et la ligne
      au-dessous dit lesquels ont été mesurés et lesquels ont dû être déduits.
      Déplacez ceux qui sont tombés à côté, ou passez à
      <em>Je les place moi-même</em> et posez les quatre vous-même. Appuyez ensuite
      sur <em>Ajuster le cadre</em> et le recadrage tombe là où ce pays le veut."""

[[howto]]
title = "Lisez les quatre contrôles, et le fond."
body = """
 Hauteur de tête, ligne des
      yeux, centrage et inclinaison, chacun mesuré sur le cadre tel qu'il est et
      chacun indiquant dans quel sens tirer s'il est hors norme. Le fond est lu en
      haut et sur les côtés du recadrage puis comparé à la couleur exigée par la
      règle&nbsp;; l'irrégularité, qui est ce qui fait réellement refuser les photos,
      est mesurée séparément de la couleur."""

[[howto]]
title = "Prenez les trois fichiers."
body = """
 L'impression, au millimètre exact, avec
      la résolution inscrite dans le fichier pour qu'un magasin l'imprime à la bonne
      taille. La planche, avec autant de copies qu'un 10&nbsp;&times;&nbsp;15 en
      contient et des repères de coupe dans les intervalles. Et le fichier d'envoi, à
      la taille en pixels que le portail impose et dans la fourchette en Ko qu'il fait
      respecter aux deux extrémités."""

[[faq]]
q = "Ma photo est-elle envoyée quelque part&nbsp;?"
a = """
        Non. L'image est décodée, recadrée, mesurée et écrite par votre propre
        navigateur sur votre propre matériel, avec l'encodeur JPEG que le navigateur
        embarque déjà. Cet outil n'a aucune fonction réseau&nbsp;: il ne va jamais rien
        chercher et n'envoie jamais rien, et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle a
        le droit de contacter, dont aucune ne nous appartient. Cela vaut ici plus que
        sur la plupart des outils&nbsp;: le fichier est une photographie de votre
        visage."""

[[faq]]
q = "Quels pays sont couverts&nbsp;?"
a = """
        Les spécifications transcrites à ce jour sont la norme de l'OACI elle-même, les
        États-Unis (passeport et inscription à la loterie des visas, qui ont des règles
        d'envoi différentes), le Royaume-Uni, le visa Schengen, l'Allemagne, le Canada,
        l'Australie, l'Inde (passeport, tirage 35&nbsp;&times;&nbsp;45&nbsp;mm, ainsi
        que la photo de formulaire et la signature SSC/UPSC), la Chine et le Japon.
        Chaque entrée nomme l'autorité dont elle vient et la date à laquelle elle a été
        relevée. Tout le reste se saisit sous &laquo;&nbsp;Ailleurs dans le
        monde&nbsp;&raquo;, où chaque chiffre est à vous&nbsp;; et comme la plus grande
        partie du monde délivre selon la géométrie de l'OACI, cette entrée démarre
        dessus."""

[[faq]]
q = "Comment trouve-t-il le sommet du crâne, le menton et les yeux sans modèle de visage&nbsp;?"
a = """
        En supposant ce qu&rsquo;un détecteur de visage généraliste n&rsquo;a pas le
        droit de supposer et que cet outil, lui, peut supposer&nbsp;: chacune de ces
        règles exige la même scène &mdash; une personne, face à l&rsquo;objectif,
        devant un mur uni et régulièrement éclairé. La couleur du mur est donc relevée
        sur le bord de la photo, tout ce qui n&rsquo;est pas cette couleur est la
        personne, et le haut de celle-ci est le sommet du crâne, cheveux compris. Les
        pupilles sont cherchées comme la meilleure paire de taches plus sombres que
        leur propre entourage, à la même hauteur et de part et d&rsquo;autre du milieu
        de la tête&nbsp;: une comparaison purement locale, donc rien n&rsquo;y dépend
        de la couleur d&rsquo;un visage. Le menton est le seul qui ne se trouve pas
        ainsi, car une mâchoire devant un cou est un bord doux sans changement de
        couleur&nbsp;; il est déduit des pupilles, qui se situent à presque exactement
        la moitié de la hauteur d&rsquo;une tête, puis confronté au contour. Tout cela
        est du calcul, dans <code>src/detect.js</code>&nbsp;: pas de poids, pas de
        moteur d&rsquo;inférence, rien de récupéré, et le même calcul pour chaque
        visage. C&rsquo;est ce dernier point qui compte, car un détecteur livré avec
        l&rsquo;outil se trompe inégalement &mdash; plus sur certains visages que sur
        d&rsquo;autres &mdash; et les personnes dont les photos sont déjà le plus
        souvent refusées sont précisément celles qu&rsquo;il laisserait tomber."""

[[faq]]
q = "Quelle confiance accorder aux points qu&rsquo;il place&nbsp;?"
a = """
        Assez pour partir de là, pas assez pour ne pas les regarder. Chacun des quatre
        a une photo sur laquelle il se trompe&nbsp;: un mur à motifs ou une bibliothèque
        ne laisse aucun contour sur lequel détourer une tête, une tête coupée en haut
        n&rsquo;a pas de sommet du crâne dans la photo, et des lunettes, une frange
        épaisse ou des yeux fermés peuvent poser les pupilles sur le mauvais trait.
        L&rsquo;outil dit donc explicitement lesquels des quatre il a mesurés et
        lesquels il a dû déduire, refuse net une photo sans fond uni plutôt que
        d&rsquo;inventer une réponse, et laisse chaque point déplaçable. Le recadrage
        est pris là où les points finissent, jamais là où ils ont commencé. Si vous
        préférez poser les quatre vous-même, l&rsquo;interrupteur au-dessus de la photo
        indique <em>Je les place moi-même</em>, et déplacer un point à la main y bascule
        tout seul&nbsp;: à partir de là ils sont les vôtres et rien ne les déplacera."""

[[faq]]
q = "C'est quoi la règle de hauteur de tête, et pourquoi la mienne échoue toujours&nbsp;?"
a = """
        Chacune de ces spécifications indique quelle part du cadre la tête doit remplir,
        mesurée du bas du menton au sommet du crâne, cheveux compris&nbsp;: en général
        70 à 80 pour cent, soit 31,5 à 36&nbsp;mm pour une photo de 45&nbsp;mm. La
        raison habituelle de l'échec est le selfie&nbsp;: un bras fait environ
        60&nbsp;cm, ce qui déforme le visage et met la tête trop grande dans le cadre.
        La deuxième raison habituelle est le sommet du crâne&nbsp;: c'est le haut des
        cheveux, pas la naissance des cheveux, et marquer la naissance fait sortir
        toutes les têtes trop petites."""

[[faq]]
q = "Pourquoi le fichier doit-il faire au moins 20&nbsp;Ko, et comment le remplir&nbsp;?"
a = """
        Les portails d'examen indiens, le formulaire de visa chinois et l'envoi du
        passeport britannique indiquent une taille minimale en plus d'une taille
        maximale, parce qu'un fichier en dessous est le plus souvent une vignette
        envoyée par erreur. Une photographie de 200&nbsp;&times;&nbsp;230 fait 46 000
        pixels et, à la meilleure qualité qu'un navigateur écrira, peut encore tomber à
        15&nbsp;Ko, sans aucun moyen de l'agrandir en compressant moins. L'outil ajoute
        donc un segment de commentaire JPEG rempli d'espaces. Cela fait partie de la
        norme JPEG, tous les décodeurs le sautent, et l'image est bit pour bit la même
        image&nbsp;: seul le fichier est plus long. Le remplissage dit exactement cela,
        en anglais, à l'intérieur du fichier."""

[[faq]]
q = "Vérifie-t-il le fond, et peut-il en remplacer un&nbsp;?"
a = """
        Il vérifie et ne remplace pas. La couleur est lue sur une bande en haut du
        recadrage et le long de chaque côté, au-dessus des épaules, puis comparée à la
        couleur de la règle en CIE Lab plutôt qu'en RVB&nbsp;: deux gris distants de
        quarante unités RVB sont indiscernables, alors que quarante unités de bleu font
        une autre couleur. L'irrégularité est mesurée à part, parce qu'une ombre sur un
        mur blanc est ce qui fait réellement refuser les photographies, et que ce n'est
        pas un problème de couleur. Remplacer un fond suppose de découper une personne
        dans une image, donc un modèle de segmentation&nbsp;; un mauvais mange les
        cheveux. Se reculer de trente centimètres du mur règle davantage de ces cas que
        n'importe quel filtre."""

[[faq]]
q = "À quoi sert la planche 10 x 15&nbsp;?"
a = """
        Une cabine facture plusieurs euros six photographies. Un comptoir photo imprime
        un 10&nbsp;&times;&nbsp;15 pour quelques centimes, et tous savent le faire.
        L'outil dispose donc sur la feuille autant de copies de votre photo qu'elle en
        contient &mdash; huit, pour un 35&nbsp;&times;&nbsp;45 sur un
        10&nbsp;&times;&nbsp;15 &mdash; avec des repères de coupe dans les intervalles
        et rien d'imprimé par-dessus une image. Rien n'est mis à l'échelle&nbsp;: chaque
        copie fait exactement la taille exigée par la règle, car une planche qui les
        réduirait de deux pour cent pour en caser une de plus donnerait huit
        photographies toutes à la mauvaise taille. Imprimez-la à 100 pour
        cent&nbsp;; c'est &laquo;&nbsp;ajuster à la page&nbsp;&raquo; qui fait sortir
        une planche fausse."""

[[faq]]
q = "Pourquoi les DPI comptent-ils si les pixels sont les mêmes&nbsp;?"
a = """
        Parce qu'un JPEG peut dire quelle taille il fait, et s'il ne le dit pas, ce qui
        l'imprime devine. La résolution vit dans l'en-tête JFIF, et un canevas de
        navigateur écrit cet en-tête avec le champ d'unités réglé sur
        &laquo;&nbsp;ceci est un rapport d'aspect, pas une résolution&nbsp;&raquo;. Cet
        outil réécrit ces quelques octets pour que le fichier annonce 300&nbsp;dpi, ce
        qui transforme 413&nbsp;&times;&nbsp;531 pixels en une photographie de
        35&nbsp;&times;&nbsp;45&nbsp;mm plutôt qu'en une image sans taille particulière.
        Rien n'est décodé pour cela et aucune qualité n'est dépensée."""

[[faq]]
q = "Peut-il faire aussi le fichier de signature&nbsp;?"
a = """
        Oui&nbsp;: les formulaires SSC et UPSC en veulent une à
        140&nbsp;&times;&nbsp;60 pixels et entre 10 et 20&nbsp;Ko, et elle figure dans
        la liste comme spécification à part entière. Les repères de visage sont coupés
        pour elle, puisqu'une signature n'a pas de ligne des yeux&nbsp;; ce qui est
        vérifié à la place, c'est que le papier est clair, qu'il y a de l'encre dessus
        et que le recadrage n'a pas emporté une ligne réglée ou le bord de la page.
        Atteindre 10&nbsp;Ko est la partie difficile de cette règle, pas rester sous
        20."""

[[faq]]
q = "Cela garantit-il que ma demande sera acceptée&nbsp;?"
a = """
        Non, et aucun outil ne peut honnêtement le garantir. Ce qu'il fait, c'est
        appliquer exactement les chiffres publiés et vous montrer chaque mesure qu'il a
        prise, pour que ce qu'un formulaire mesure automatiquement &mdash; taille en
        pixels, poids du fichier, format &mdash; soit juste, et que ce qu'un examinateur
        humain mesure &mdash; hauteur de tête, ligne des yeux, fond &mdash; soit devant
        vous, chiffres à l'appui. Les règles changent aussi&nbsp;: chaque spécification
        indique de quelle autorité elle vient et quand elle a été relevée, pour que vous
        puissiez la comparer au formulaire que vous avez sous les yeux plutôt que de
        faire confiance à un tableau."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai, ni
        filigrane imprimé en travers de votre visage. Le nombre de photographies n'est
        pas limité non plus, puisqu'aucun serveur ne les paie. Le site affiche de la
        publicité, et c'est elle qui le finance&nbsp;; les annonces ne reçoivent rien
        sur votre photographie."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue
        de travailler&nbsp;: le recueil de règles est un fichier servi avec la page, pas
        une consultation. C'est aussi la façon la plus simple de prouver que rien n'est
        envoyé, car un outil qui expédierait votre photographie ailleurs pour la
        recadrer s'arrêterait à l'instant où vous débranchez."""

