 La
      Content-Security-Policy énumère toutes les adresses que cette page peut
      contacter, et aucune n'appartient à ce site. Il n'existe ici aucun point de
      collecte où vos fichiers pourraient aboutir, ni rien dans le code qui les y
      enverrait s'il en existait un."""

[[privacy]]
title = "Rien ici ne va rien chercher."
body = """
 On ne trouve ni
      <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code> nulle part dans <code>src/</code>. La mise à
      l'échelle est un <code>drawImage</code> sur un canvas&nbsp;; chaque icône
      est un en-tête écrit devant ces pixels par <code>src/ico.js</code> ou
      <code>src/icns.js</code>, dans cette page."""

[[privacy]]
title = "Le fichier est décrit à partir de ses propres octets."
body = """
 La liste des tailles
      montrée à côté d'une icône finie n'est pas la liste des tailles que vous
      avez demandées&nbsp;: elle est relue dans le fichier qui vient d'être
      écrit, par <code>readIcoDirectory</code> ou
      <code>readIcnsElements</code>. Si ce qui écrit le fichier contredisait un
      jour les réglages, la page le dirait, plutôt que vous ne l'appreniez en
      voyant Windows ne rien dessiner et macOS afficher une feuille blanche."""

[[privacy]]
