[[faq]]
q = "Mon image est-elle envoyée quelque part&nbsp;?"
a = """
        Non. Le fichier est décodé, compressé et mesuré par votre propre navigateur
        sur votre propre matériel, avec les encodeurs JPEG, PNG et WebP qu'il embarque
        déjà. Cet outil ne comporte aucune fonction réseau, si bien qu'il ne va jamais
        rien chercher et n'envoie jamais rien. Sa
        <code>Content-Security-Policy</code> énumère par ailleurs toutes les adresses
        qu'il peut contacter, dont aucune n'appartient à ce site."""

[[faq]]
q = "Comment atteint-il une taille exacte&nbsp;?"
a = """
        En essayant. Aucune formule ne transforme un réglage de qualité en un nombre
        d'octets, puisque tout dépend de l'image&nbsp;; l'outil encode donc celle-ci
        plusieurs fois et cherche la réponse. Il part du haut de la plage de qualité
        et resserre par dichotomie, ce qui lui fait trouver la meilleure qualité
        acceptable en huit encodages environ. Chaque taille affichée sur la page
        correspond à un vrai fichier encodé, et non à une estimation."""

[[faq]]
q = "Que veut dire &laquo;&nbsp;perte minimale&nbsp;&raquo; exactement, ici&nbsp;?"
a = """
        Trois choses précises. D'abord, une image déjà sous votre taille visée est
        transmise octet pour octet plutôt que réencodée. Ensuite, la qualité est
        dépensée avant la résolution, et seulement jusqu'à un plancher où les
        artefacts de compression commencent à se voir. En dessous de ce plancher,
        l'outil réduit plutôt l'image et remonte la qualité, car moins de bons pixels
        valent mieux que davantage de pixels abîmés. Enfin, une fois trouvé un
        résultat qui tient, la recherche remonte jusqu'à épuiser le budget, ce qui
        vous évite un fichier de 300&nbsp;KB quand vous en aviez demandé 500."""

[[faq]]
q = "Que sont les valeurs SSIM et PSNR sur chaque résultat&nbsp;?"
a = """
        Ce sont des mesures de ce que la compression a coûté, prises en décodant le
        résultat et en le comparant à l'image d'origine. Le SSIM compare la
        luminosité, le contraste et la structure locales, ce qui se rapproche bien
        davantage de ce qui gêne l'œil que le comptage des pixels modifiés&nbsp;;
        au-dessus de 0,98 environ, les deux images sont difficiles à distinguer côte à
        côte. Le PSNR est le traditionnel chiffre en décibels. L'un comme l'autre sont
        calculés sur votre machine et affichés, pour que l'annonce d'une faible perte
        se vérifie au lieu de se décréter."""

[[faq]]
q = "Quels formats sait-il lire et écrire&nbsp;?"
a = """
        Il lit tout ce que votre navigateur sait décoder, ce qui revient en pratique
        au JPEG, au PNG, au WebP, au GIF, au BMP, ainsi qu'à l'AVIF sur la plupart des
        navigateurs actuels. Il écrit du JPEG, du PNG et du WebP, parce que ce sont là
        les encodeurs que les navigateurs embarquent. En mode
        &laquo;&nbsp;auto&nbsp;&raquo;, il garde le format dans lequel votre fichier
        est arrivé et ne bascule sur WebP que lorsque le conserver aurait imposé un
        redimensionnement ou une baisse de qualité visible."""

[[faq]]
q = "Pourquoi ne peut-il pas compresser un PNG bien loin&nbsp;?"
a = """
        Parce que le PNG est un format sans perte, dépourvu de toute molette de
        qualité à tourner. Le seul moyen d'alléger un PNG consiste à lui donner moins
        de pixels ou moins de couleurs&nbsp;; avec PNG sélectionné, l'outil n'atteint
        donc sa cible que par le redimensionnement. Si l'image est une photographie,
        le JPEG ou le WebP s'approcheront bien davantage de cette cible, à une qualité
        dont vous verrez qu'elle convient. Et s'il s'agit d'un logo ou d'une capture
        d'écran avec transparence, le WebP conserve la transparence que le JPEG
        remplirait de blanc."""

[[faq]]
q = "Compresser une image supprime-t-il ses données EXIF et GPS&nbsp;?"
a = """
        Oui, par effet de bord. Compresser revient à décoder l'image en pixels puis à
        réencoder ces pixels, or un canvas rempli de pixels ne porte aucune
        étiquette&nbsp;: le lieu, le modèle d'appareil, les horodatages et tout le
        reste ne sont tout simplement pas écrits dans le nouveau fichier. Si vous
        voulez faire disparaître les métadonnées en laissant l'image intacte, passez
        plutôt par le <a href="../supprimer-les-donnees-exif/">lecteur et effaceur
        EXIF</a>, qui réécrit le conteneur sans rien recompresser."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai,
        ni filigrane. Le nombre et la taille des fichiers ne sont pas limités non
        plus, parce qu'aucun serveur ne les paie et que tout le travail se fait sur
        votre propre machine. Le site affiche de la publicité, et c'est elle qui le
        finance&nbsp;; les annonces ne reçoivent rien sur vos images."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue
        de travailler. C'est aussi la façon la plus simple de prouver que rien n'est
        envoyé, car un outil qui expédierait vos images ailleurs pour les compresser
        s'arrêterait à l'instant où vous débranchez."""

