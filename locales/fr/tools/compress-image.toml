[[privacy]]
title = "Vos images n'ont nulle part où aller."
body = "La Content-Security-Policy énumère toutes les adresses que cette page peut contacter, et aucune n'appartient à ce site. Il n'existe ici aucun point de collecte où vos fichiers pourraient aboutir, ni rien dans le code qui les y enverrait s'il en existait un."

[[privacy]]
title = "Rien ici ne va rien chercher."
body = "On ne trouve ni <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni <code>sendBeacon</code> nulle part dans <code>src/</code>. La compression passe par <code>canvas.toBlob</code>, c'est-à-dire par l'encodeur déjà installé dans votre navigateur."

[[privacy]]
title = "Les chiffres sont mesurés, pas remontés."
body = "Les tailles, la valeur de qualité et la comparaison SSIM sont toutes calculées sur cette page, puis affichées. Aucun événement d'analytique maison, dans tout ce dépôt, ne transporte un nom de fichier, une taille, un nombre ou un résultat."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts publicitaires et de mesure viennent de Google, et le bouton de don de Buy Me a Coffee. Aucun d'eux ne reçoit quoi que ce soit sur vos images. Chaque ligne qui lit, compresse ou mesure un fichier est servie depuis cette origine et figure dans le dépôt."

[[privacy]]
title = "Tout fonctionne hors ligne."
body = "Coupez le réseau&nbsp;: l'outil reste identique, puisqu'il n'a jamais comporté la moindre étape réseau. C'est la preuve la plus simple de toutes."

[[howto]]
title = "Choisissez vos images."
body = "Déposez-les sur la zone prévue ou sélectionnez-les à la main. Le navigateur les lit directement sur votre disque, sans que rien parte où que ce soit pendant ce temps."

[[howto]]
title = "Tapez la taille qu'on vous a imposée."
body = "100&nbsp;KB pour le formulaire d'envoi qui refuse obstinément votre photo, 500&nbsp;KB pour le portail de candidature, 2&nbsp;MB pour une page qui doit charger vite. Les quatre plus courantes sont des boutons."

[[howto]]
title = "Appuyez sur &laquo;&nbsp;Compresser à la taille visée&nbsp;&raquo;."
body = "Chaque image est encodée plusieurs fois pendant que l'outil resserre autour de la meilleure qualité qui tienne. Ce qui passe déjà sous la taille visée reste exactement tel quel."

[[howto]]
title = "Regardez ce que cela a coûté, puis téléchargez."
body = "Chaque résultat indique dans quel format il a été écrit, à quelle qualité, si les dimensions ont changé, et à quel point il correspond à l'original une fois mesuré. Le bouton &laquo;&nbsp;Comparer&nbsp;&raquo; met les deux images côte à côte."

[[faq]]
q = "Mon image est-elle envoyée quelque part&nbsp;?"
a = "Non. Le fichier est décodé, compressé et mesuré par votre propre navigateur sur votre propre matériel, avec les encodeurs JPEG, PNG et WebP qu'il embarque déjà. Cet outil ne comporte aucune fonction réseau, si bien qu'il ne va jamais rien chercher et n'envoie jamais rien. Sa <code>Content-Security-Policy</code> énumère par ailleurs toutes les adresses qu'il peut contacter, dont aucune n'appartient à ce site."

[[faq]]
q = "Comment atteint-il une taille exacte&nbsp;?"
a = "En essayant. Aucune formule ne transforme un réglage de qualité en un nombre d'octets, puisque tout dépend de l'image&nbsp;; l'outil encode donc celle-ci plusieurs fois et cherche la réponse. Il part du haut de la plage de qualité et resserre par dichotomie, ce qui lui fait trouver la meilleure qualité acceptable en huit encodages environ. Chaque taille affichée sur la page correspond à un vrai fichier encodé, et non à une estimation."

[[faq]]
q = "Que veut dire &laquo;&nbsp;perte minimale&nbsp;&raquo; exactement, ici&nbsp;?"
a = "Trois choses précises. D'abord, une image déjà sous votre taille visée est transmise octet pour octet plutôt que réencodée. Ensuite, la qualité est dépensée avant la résolution, et seulement jusqu'à un plancher où les artefacts de compression commencent à se voir. En dessous de ce plancher, l'outil réduit plutôt l'image et remonte la qualité, car moins de bons pixels valent mieux que davantage de pixels abîmés. Enfin, une fois trouvé un résultat qui tient, la recherche remonte jusqu'à épuiser le budget, ce qui vous évite un fichier de 300&nbsp;KB quand vous en aviez demandé 500."

[[faq]]
q = "Que sont les valeurs SSIM et PSNR sur chaque résultat&nbsp;?"
a = "Ce sont des mesures de ce que la compression a coûté, prises en décodant le résultat et en le comparant à l'image d'origine. Le SSIM compare la luminosité, le contraste et la structure locales, ce qui se rapproche bien davantage de ce qui gêne l'œil que le comptage des pixels modifiés&nbsp;; au-dessus de 0,98 environ, les deux images sont difficiles à distinguer côte à côte. Le PSNR est le traditionnel chiffre en décibels. L'un comme l'autre sont calculés sur votre machine et affichés, pour que l'annonce d'une faible perte se vérifie au lieu de se décréter."

[[faq]]
q = "Quels formats sait-il lire et écrire&nbsp;?"
a = "Il lit les images que votre navigateur peut décoder, dont JPEG, PNG, WebP, GIF, BMP et AVIF. Les nouveaux encodages utilisent JPEG, PNG ou WebP. Les fichiers déjà sous la taille cible sont rendus inchangés, avec leur format et leurs métadonnées d’origine. Si un encodage est nécessaire, Automatique commence avec le format source si le navigateur sait l’écrire ; sinon, GIF commence en PNG, tandis qu’AVIF, BMP ou un type MIME inconnu commencent en JPEG. Automatique peut ensuite choisir WebP s’il atteint la cible avec moins de perte visible."

[[faq]]
q = "Pourquoi ne peut-il pas compresser un PNG bien loin&nbsp;?"
a = "Parce que le PNG est un format sans perte, dépourvu de toute molette de qualité à tourner. Le seul moyen d'alléger un PNG consiste à lui donner moins de pixels ou moins de couleurs&nbsp;; avec PNG sélectionné, l'outil n'atteint donc sa cible que par le redimensionnement. Si l'image est une photographie, le JPEG ou le WebP s'approcheront bien davantage de cette cible, à une qualité dont vous verrez qu'elle convient. Et s'il s'agit d'un logo ou d'une capture d'écran avec transparence, le WebP conserve la transparence que le JPEG remplirait de blanc."

[[faq]]
q = "Compresser une image supprime-t-il ses données EXIF et GPS&nbsp;?"
a = "Un résultat réencodé omet l’EXIF, le GPS, les horodatages et les autres métadonnées d’origine, car le canevas ne contient que les pixels. Un fichier déjà sous la taille cible est rendu inchangé, avec ses métadonnées. <a href=\"../supprimer-les-donnees-exif/\">lecteur et effaceur EXIF</a> lit et modifie les métadonnées JPEG, PNG et WebP sans réencoder leurs images. Pour AVIF, il montre l’EXIF disponible en lecture seule et nettoie en convertissant la première image décodée vers un nouveau PNG ; les couleurs ou le HDR peuvent changer."

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = "C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai, ni filigrane. Le nombre et la taille des fichiers ne sont pas limités non plus, parce qu'aucun serveur ne les paie et que tout le travail se fait sur votre propre machine. Le site affiche de la publicité, et c'est elle qui le finance&nbsp;; les annonces ne reçoivent rien sur vos images."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue de travailler. C'est aussi la façon la plus simple de prouver que rien n'est envoyé, car un outil qui expédierait vos images ailleurs pour les compresser s'arrêterait à l'instant où vous débranchez."

