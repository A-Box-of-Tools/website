[[privacy]]
title = "Vos photographies n'ont nulle part où aller."
body = "La Content-Security-Policy nomme chaque adresse que cette page peut contacter, et aucune ne nous appartient. Il n'y a ici aucun point de collecte où vos fichiers pourraient atterrir, ni de code qui les enverrait s'il y en avait un&nbsp;: pas de <code>fetch</code>, pas de <code>XMLHttpRequest</code>, pas de <code>sendBeacon</code>, ni dans <code>src/</code> ni dans le worker."

[[privacy]]
title = "Les aperçus RAW sont lus sur cet appareil."
body = "De nombreux RAW contiennent un aperçu JPEG rendu par l'appareil. Cet outil parcourt les répertoires du fichier et extrait le plus grand aperçu utilisable. Le chiffre de lecture pour inspection compte les en-têtes et répertoires lus pour le trouver et le décrire. Le décodage lit aussi la tranche JPEG. Les données du capteur ne sont jamais décodées, et la ligne indique les dimensions réelles de l'aperçu."

[[privacy]]
title = "Le travail se fait dans un Worker sur cette machine, pas sur un serveur."
body = "C'est le seul outil d'ici qui en emploie un, parce qu'empiler se compte en minutes de calcul plutôt qu'en secondes, et qu'une page figée ne peut ni montrer sa progression ni être annulée. Un Worker est un second fil dans ce même navigateur &mdash; voir <code>src/worker.js</code>. On lui remet les fichiers eux-mêmes, ce qui ne coûte rien, car une poignée de fichier n'est pas les octets&nbsp;; et il a exactement la même Content-Security-Policy que la page, c'est-à-dire nulle part où les envoyer."

[[privacy]]
title = "Rien de la série n'est rapporté nulle part."
body = "Combien de prises vous avez empilées, quel appareil les a écrites, de combien chacune avait bougé, quelle méthode vous avez choisie et combien de temps cela a pris restent dans la mémoire de cette page jusqu'à ce que vous la fermiez. Il n'existe dans ce dépôt aucun événement de mesure qui transporte quoi que ce soit de cela, et la seule question que ce site pose après un téléchargement envoie un pouce en haut ou en bas et le nom de l'outil, rien d'autre."

[[privacy]]
title = "Il fonctionne hors ligne."
body = "Débranchez-vous du réseau et l'outil ne change pas, parce qu'il n'y a jamais eu d'étape réseau dedans. Le worker et chaque module qu'il charge sont mis en cache par le service worker de cette page&nbsp;: une copie installée empile donc des fichiers RAW la prise débranchée."

[[howto]]
title = "Choisissez les prises."
body = "Une rafale, une série à l'intervallomètre ou un dossier de RAW avec des aperçus JPEG utilisables. Attendez la fin de l'ouverture des fichiers. Chaque ligne indique ce qui a été trouvé&nbsp;: pour un RAW, l'appareil et la taille réelle de l'aperçu intégré. Les fichiers impossibles à ouvrir sont listés pour vérifier lesquels ont été écartés."

[[howto]]
title = "Prenez la méthode qui correspond à ce que vous cherchez à perdre."
body = "Bruit&nbsp;: moyenne, ou écrêtage sigma pour rejeter les valeurs qui diffèrent des autres. Personnes, voitures ou avion&nbsp;: médiane, s'ils occupent chaque partie de la scène dans moins de la moitié des prises. Filés d'étoiles&nbsp;: éclaircir. Macro prise le long de la bague de mise au point&nbsp;: empilement de mise au point. La note sous le menu explique la méthode et ses limites."

[[howto]]
title = "Décidez si les prises ont besoin d'être alignées."
body = "À main levée&nbsp;: oui, décalage seul. À main levée et en tournant aussi&nbsp;: décalage, rotation et échelle. Trépied fixe ou intervallomètre&nbsp;: non, et ce sera plus rapide. Chaque prise est mesurée par rapport à celle qui porte la marque de référence, la première tant que vous n'en décidez pas autrement&nbsp;: &laquo;&nbsp;Prendre comme référence&nbsp;&raquo; déplace la marque et laisse la liste dans l'ordre où vous l'avez mise."

[[howto]]
title = "Lisez les quatre chiffres, puis appuyez sur le bouton."
body = "Avant de commencer, la page affiche la taille prévue du résultat, la mémoire estimée de l'empilement, les décodages prévus pour empiler et les octets lus pendant l'inspection. Le fonctionnement interne du navigateur et la récupération de mémoire peuvent dépasser les tampons modélisés&nbsp;: ces chiffres sont un plan, pas une garantie d'usage total. Si des bandes sont nécessaires, la page suggère une résolution de travail plus petite. Ensuite, comparez la référence au résultat à la taille réelle des pixels et vérifiez les détails d'alignement avant de télécharger."

[[faq]]
q = "Mes photographies sont-elles envoyées quelque part&nbsp;?"
a = "Non. Chaque prise est ouverte, décodée, alignée, empilée et écrite par votre propre navigateur, sur votre propre matériel. Cet outil n'a aucune fonction réseau, il ne va jamais rien chercher et n'envoie jamais rien, et la <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle peut contacter, dont aucune ne nous appartient. Chargez la page une fois, débranchez-vous d'internet&nbsp;: elle continue de fonctionner. Cela compte ici plus que sur la plupart des outils, simplement à cause du volume&nbsp;: une pile de vingt prises RAW fait environ un gigaoctet, et envoyer un gigaoctet de photographies pour qu'on en fasse la moyenne est précisément ce que cet outil existe pour éviter."

[[faq]]
q = "Quels formats RAW peut-il lire, et comment&nbsp;?"
a = "<span id=\"faq-raw\"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF, RAF, RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL et les formats proches sont pris en charge si le fichier contient un aperçu JPEG utilisable. L'outil parcourt les répertoires et utilise le plus grand aperçu trouvé. Il peut être plus petit que l'image du capteur ou absent. <strong>Les données du capteur ne sont pas décodées.</strong> Les pixels gardent la balance des blancs et le style d'image de l'appareil, sur huit bits par canal. Vérifiez les dimensions dans la ligne. Le compteur d'inspection couvre les en-têtes et les répertoires&nbsp;; le décodage lit aussi la tranche JPEG."

[[faq]]
q = "Alors pourquoi ne pas décoder correctement les données du capteur&nbsp;?"
a = "Le décodage du capteur demanderait un moteur RAW comme LibRaw ou dcraw et les compressions propres à chaque appareil. Un JPEG intégré garde cet outil petit et utilise le décodeur du navigateur. Cela impose aussi le rendu de l'appareil et la résolution de l'aperçu présent dans le fichier. Pour choisir vos réglages de développement RAW, développez d'abord les prises et exportez des JPEG ou PNG à empiler ici."

[[faq]]
q = "Combien de prises peut-il traiter, et de quelle taille&nbsp;?"
a = "Six des sept méthodes ont des accumulateurs dont la taille ne dépend pas du nombre de prises. Moyenne, éclaircir, assombrir, additionner et empilement de mise au point demandent une passe par bande&nbsp;; l'écrêtage sigma en demande deux. La médiane garde les valeurs de chaque prise pour la bande actuelle, donc sa mémoire augmente avec le nombre de prises. Toute méthode peut être divisée en bandes si ses tampons dépassent le budget de l'outil, ce qui demande de décoder à nouveau les prises pour chaque bande. La page estime ces tampons et affiche les décodages prévus pour l'empilement. L'inspection et l'alignement ajoutent du travail, et les mécanismes internes des codecs et du GPU du navigateur peuvent demander plus de mémoire que l'estimation."

[[faq]]
q = "Que fait réellement l'alignement des prises&nbsp;?"
a = "L'outil mesure le décalage de chaque prise par rapport à la référence et la remet en place avec une précision inférieure au pixel. Il utilise la corrélation de phase&nbsp;: le décalage apparaît comme une différence de phase entre les spectres, donc une transformée de Fourier par image trouve un décalage de deux cents pixels aussi facilement qu'un de deux. Le second réglage retrouve aussi rotation et échelle avec le spectre en coordonnées logarithmiques polaires. La correction est globale&nbsp;: un décalage, un angle et une échelle pour toute la prise. Elle corrige le mouvement de l'appareil, mais ni un sujet mobile ni une photo prise un pas plus loin sur le côté. Une prise décalée à gauche ne couvre plus le bord droit. Le résultat est donc recadré à la zone commune et peut être un peu plus petit, ce qui évite les bordures sombres des zones non couvertes."

[[faq]]
q = "Quelle méthode dois-je utiliser&nbsp;?"
a = "<strong>Moyenne</strong> contre le bruit si rien n'a bougé&nbsp;: le bruit aléatoire indépendant diminue environ de la racine carrée du nombre de prises. <strong>Médiane</strong> pour retirer ce qui occupe une partie de la scène dans moins de la moitié des prises. <strong>Écrêtage sigma</strong> fait la moyenne des valeurs proches de leur moyenne et rejette celles hors du seuil choisi. Il peut garder des objets mobiles dans une petite série ou s'ils apparaissent souvent&nbsp;; la médiane est plus sûre si les retirer est la priorité. <strong>Éclaircir</strong> pour les filés d'étoiles, les feux d'artifice et le light painting. <strong>Assombrir</strong> contre les éléments clairs qui ont bougé. <strong>Additionner</strong> mélange de façon additive les prises décodées. Il agit sur des valeurs d'image de huit bits et ne reproduit pas une pose plus longue de l'appareil. <strong>Empilement de mise au point</strong> pour une macro prise le long de la bague de mise au point."

[[faq]]
q = "Pourquoi mon résultat fait-il huit bits alors que mes RAW en font quatorze&nbsp;?"
a = "L'entrée RAW est l'aperçu JPEG de l'appareil, et la sortie est un PNG ou JPEG de huit bits. Moyenne et écrêtage sigma utilisent des accumulateurs plus larges et arrondissent à la fin, pour estimer une valeur plus propre à partir de prises bruitées sans arrondir chaque étape. L'image enregistrée garde huit bits par canal&nbsp;; elle ne gagne ni la profondeur ni la dynamique des données linéaires du capteur."

[[faq]]
q = "Puis-je empiler des prises de tailles différentes, ou de plusieurs appareils&nbsp;?"
a = "Oui, mais vérifiez que c'est voulu. La plus grande prise définit le cadre de travail&nbsp;; les autres sont ajustées et centrées. Le résultat enregistré est recadré à la zone commune. Des formes différentes ou l'alignement peuvent donc le rendre plus petit que le cadre prévu. Mélanger des appareils mélange aussi leur rendu des couleurs. Gardez une exposition et un cadrage constants et utilisez la comparaison avec la référence pour examiner le résultat."

[[faq]]
q = "Il dit que le passage se fera en bandes. Qu'est-ce que cela veut dire&nbsp;?"
a = "Que la mémoire de travail dont la méthode a besoin dépasse ce que l'outil est prêt à réserver d'un coup&nbsp;: l'image sera donc découpée en bandes horizontales et empilée bande par bande. Le résultat est exactement le même&nbsp;; l'outil relit simplement les prises pour chaque bande, cela prend donc plus longtemps, et la page vous dit combien de décodages cela représentera. Baisser la résolution de travail d'un cran divise la mémoire par quatre, ce qui transforme presque toujours un passage en bandes en un seul passage&nbsp;; la note indique le réglage qui le ferait."

[[faq]]
q = "Pourquoi cet outil emploie-t-il un Worker et aucun des autres&nbsp;?"
a = "Parce qu'il est le seul dont le travail se compte en minutes. Tous les autres outils d'ici font quelque chose qui prend une seconde ou deux, et sortir ce travail du fil principal y serait une cérémonie. Empiler vingt grandes prises, c'est du calcul massif sur des centaines de mégaoctets, et sur le fil principal cela veut dire une page figée&nbsp;: aucune barre de progression qui bouge, un bouton Annuler qui ne répond pas, et pour finir un navigateur qui propose de tuer l'onglet. Le Worker est un second fil dans ce même navigateur, exécutant un fichier de ce même dossier, sous cette même politique. Ce n'est pas un serveur et ce n'est pas une fonction réseau."

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = "C'est gratuit, sans compte, connexion, essai ni filigrane. Le service n'impose aucun quota de nombre ou de taille des prises. Les limites pratiques sont la mémoire de votre appareil, les limites du canevas et du décodeur du navigateur, et le temps nécessaire. La publicité finance la page et ne reçoit rien concernant vos photos."

