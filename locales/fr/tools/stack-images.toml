name = "Empileur d'images"
heading = """Empileur&nbsp;d'images <span class="h1-kw">&mdash; réduire le bruit, retirer les passants, créer des filés d’étoiles</span>"""
tagline = "Faites la moyenne d’une rafale stable, prenez la médiane pour un arrière-plan dégagé ou éclaircissez une séquence de ciel nocturne."
title = "Empileur d’images &mdash; réduire le bruit et retirer les passants"
description = "Empilez des photos pour réduire le bruit, retirer les passants ou créer des filés d’étoiles. Alignez les prises et enregistrez en PNG ou JPEG dans le navigateur. Les fichiers RAW utilisent leurs aperçus JPEG intégrés."
og_title = "Empiler une rafale de photographies, fichiers RAW compris"
og_description = "Moyenne, médiane, écrêtage sigma, éclaircir, assombrir, additionner ou empilement de mise au point, avec les prises alignées au préalable. Les fichiers RAW sont ouverts depuis l'aperçu JPEG intégré par l'appareil, lorsqu'il existe, sans décoder les données du capteur. Rien n'est envoyé."
og_image_alt = "Empileur d'images - plusieurs prises combinées en une seule, dans le navigateur"
pledge = "Chaque prise est ouverte, décodée, alignée, combinée et écrite par votre propre navigateur, sur votre propre machine. Une pile de vingt fichiers RAW de 60&nbsp;Mo, c'est environ un gigaoctet de photographies, et pas un octet ne bouge&nbsp;: l'outil n'a aucune fonction réseau, et les fichiers sont lus directement sur votre disque par un worker qui les traite localement sans les envoyer."
live_hint = "Ne nous croyez pas sur parole&nbsp;: ouvrez les DevTools, regardez l'onglet Réseau et empilez un dossier de fichiers RAW. Aucune requête ne transporte une photographie, une vignette, un nom de fichier ou un modèle d'appareil. Ou débranchez-vous d'internet et empilez-les quand même&nbsp;: rien ne change à l'outil."
