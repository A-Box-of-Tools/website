name = "Empileur d'images"
heading = "Empileur&nbsp;d'images <span class=\"h1-kw\">&mdash; combiner une rafale, fichiers RAW compris</span>"
tagline = "Vingt prises n'en font plus qu'une, sans vingt envois et sans dérawtiseur."
title = "Empileur d'images &mdash; moyenne, médiane et empilement de mise au point dans le navigateur"
description = "Combinez une rafale de photographies en une seule&nbsp;: moyennez-les pour tuer le bruit, prenez la médiane pour retirer les gens d'une scène, éclaircissez pour des filés d'étoiles, ou empilez la mise au point d'une macro. Lit CR2, NEF, ARW, DNG, RAF et CR3 en extrayant l'aperçu de l'appareil lui-même. Tout se passe dans votre navigateur."
og_title = "Empiler une rafale de photographies, fichiers RAW compris"
og_description = "Moyenne, médiane, écrêtage sigma, éclaircir, assombrir, additionner ou empilement de mise au point, avec les prises alignées au préalable. Les fichiers RAW sont ouverts depuis l'aperçu JPEG intégré par l'appareil, lorsqu'il existe, sans décoder les données du capteur. Rien n'est envoyé."
og_image_alt = "Empileur d'images - plusieurs prises combinées en une seule, dans le navigateur"
pledge = "Chaque prise est ouverte, décodée, alignée, combinée et écrite par votre propre navigateur, sur votre propre machine. Une pile de vingt fichiers RAW de 60&nbsp;Mo, c'est environ un gigaoctet de photographies, et pas un octet ne bouge&nbsp;: l'outil n'a aucune fonction réseau, et les fichiers sont lus directement sur votre disque par un worker qui n'a nulle part où envoyer quoi que ce soit."
live_hint = "Ne nous croyez pas sur parole&nbsp;: ouvrez les DevTools, regardez l'onglet Réseau et empilez un dossier de fichiers RAW. Aucune requête ne transporte une photographie, une vignette, un nom de fichier ou un modèle d'appareil. Ou débranchez-vous d'internet et empilez-les quand même&nbsp;: rien ne change à l'outil."
read_first = ", <code>src/raw.js</code> explique comment trouver les aperçus RAW intégrés sans décoder le capteur, <code>src/stack.js</code> donne le calcul de chaque méthode et <code>src/plan.js</code> explique la mémoire de travail estimée et les décodages prévus de l'empilement. Le fonctionnement interne du navigateur et la récupération de mémoire peuvent ajouter de la mémoire au-delà des tampons modélisés."
howto_heading = "Comment empiler une série de photographies dans votre navigateur"
card = "Combinez une rafale en une seule image&nbsp;: moyennez le bruit jusqu'à le faire disparaître, prenez la médiane pour perdre les passants, ou éclaircissez pour des filés d'étoiles. Lit les fichiers RAW sans dérawtiseur."

