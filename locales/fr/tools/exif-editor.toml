[[faq]]
q = "Ma photo est-elle envoyée quelque part&nbsp;?"
a = """
        Non. Le fichier est lu, analysé et réécrit par votre propre navigateur sur
        votre propre matériel. Cet outil ne comporte aucune fonction réseau, si bien
        qu'il ne va jamais rien chercher et n'envoie jamais rien. Sa
        <code>Content-Security-Policy</code> énumère par ailleurs toutes les adresses
        que la page peut contacter, dont aucune n'appartient à ce site."""

[[faq]]
q = "Qu'est-ce que l'EXIF, et quoi d'autre se cache dans une photo&nbsp;?"
a = """
        L'EXIF est un bloc d'étiquettes qu'un appareil écrit à côté de l'image&nbsp;:
        la marque et le modèle, les réglages d'exposition, la date et l'heure à la
        seconde près, souvent une position GPS, et parfois un numéro de série. Les
        photos portent fréquemment davantage&nbsp;: un paquet XMP de XML laissé par un
        logiciel de retouche, un bloc IPTC de légendes et de signatures, un profil
        colorimétrique, une petite deuxième copie de l'image en vignette, et une note
        de fabricant remplie de données non documentées. Cet outil liste tout cela."""

[[faq]]
q = "Supprimer les métadonnées réduit-il la qualité de l'image&nbsp;?"
a = """
        Non, et c'est la principale raison d'utiliser un outil comme celui-ci plutôt
        que de réenregistrer la photo. Les métadonnées se trouvent dans le conteneur
        autour de l'image compressée, et non dedans. Les supprimer revient à effacer
        des entrées d'une liste puis à réécrire la liste&nbsp;; les données d'image
        compressées, elles, sont recopiées octet pour octet, si bien que le résultat
        décode exactement les mêmes pixels. Rien n'est décodé et rien n'est
        recompressé."""

[[faq]]
q = "Quels formats de fichier prend-il en charge&nbsp;?"
a = """
        Le JPEG, le PNG et le WebP. Le HEIC et l'AVIF sont reconnus mais pas
        réécrits&nbsp;: ce sont des formats à boîtes faits d'atomes imbriqués, qui
        demandent un autre analyseur, si bien que l'outil le dit plutôt que de
        produire un fichier cassé. Un TIFF nu n'est pas pris en charge non plus,
        parce que dans un TIFF les métadonnées et les pixels sont adressés par les
        mêmes décalages."""

[[faq]]
q = "Ma photo apparaîtra-t-elle tournée une fois les métadonnées retirées&nbsp;?"
a = """
        C'est possible, et il y a un réglage pour cela. Les téléphones enregistrent
        d'habitude l'image telle que le capteur l'a vue et ajoutent une étiquette
        d'orientation qui dit comment la tourner. Retirez cette étiquette et
        certaines visionneuses montreront la photo couchée. L'option
        &laquo;&nbsp;garder l'étiquette d'orientation&nbsp;&raquo;, active par défaut,
        réécrit un minuscule bloc EXIF ne contenant que cette seule étiquette, et
        seulement quand la photo en avait réellement besoin. Décochez-la si vous
        préférez que le fichier ne porte plus le moindre EXIF."""

[[faq]]
q = "Supprime-t-il la position GPS&nbsp;?"
a = """
        Oui. Tout supprimer supprime le répertoire GPS entier, et vous pouvez aussi
        effacer le lieu seul en gardant le reste. La position est d'abord montrée en
        degrés décimaux, parce que
        &laquo;&nbsp;51&nbsp;degrés, 30&nbsp;minutes, 26&nbsp;secondes&nbsp;&raquo; ne
        rend pas évident qu'une photo nomme le bâtiment où elle a été prise."""

[[faq]]
q = "Puis-je modifier une étiquette au lieu de la supprimer&nbsp;?"
a = """
        Oui. Les étiquettes de texte, les dates, l'ISO, l'orientation et la résolution
        peuvent toutes être modifiées, et quelques étiquettes courantes peuvent être
        ajoutées à une photo qui n'en a aucune. Une réserve, toutefois&nbsp;: écrire
        le fichier reconstruit le bloc EXIF, or une note de fabricant contient des
        décalages vers le bloc d'origine&nbsp;; une note reconstruite peut donc ne
        plus être lisible ensuite par le logiciel du fabricant. Supprimez-la, ou
        laissez le fichier tel quel, si cela compte pour vous."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai.
        Le site affiche de la publicité, et c'est elle qui le finance&nbsp;; les
        annonces ne reçoivent rien sur vos photos."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue
        de travailler. C'est aussi la façon la plus simple de prouver que rien n'est
        envoyé, car un outil qui expédierait vos photos ailleurs pour les traiter
        s'arrêterait à l'instant où vous débranchez."""

