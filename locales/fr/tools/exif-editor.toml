[[privacy]]
title = "Vos photos n'ont nulle part où aller."
body = "La Content-Security-Policy énumère toutes les adresses que cette page peut contacter, et aucune n'appartient à ce site. Il n'existe ici aucun point de collecte où vos fichiers pourraient aboutir, ni rien dans le code qui les y enverrait s'il en existait un."

[[privacy]]
title = "Rien ici ne va rien chercher."
body = "Contrairement aux autres outils de cette boîte, celui-ci n'a pas de fonction &laquo;&nbsp;charger depuis une adresse web&nbsp;&raquo; ni la moindre étape réseau facultative. On ne trouve ni <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni <code>sendBeacon</code> nulle part dans <code>src/</code>."

[[privacy]]
title = "Les métadonnées que nous lisons ne sont jamais relayées."
body = "Votre position GPS est affichée sur cette page et ne va nulle part ailleurs. Aucun événement d'analytique maison, dans tout ce dépôt, ne transporte une étiquette, un nom de fichier, une taille ou un nombre."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts publicitaires et de mesure viennent de Google. Ni l'un ni l'autre ne reçoit quoi que ce soit sur vos photos. Chaque ligne qui lit, analyse ou réécrit un fichier est servie depuis cette origine et figure dans le dépôt."

[[privacy]]
title = "Ce que le bouton de don charge, et ce qu'on ne lui donne pas."
body = "Le bouton &laquo;&nbsp;Buy me a coffee&nbsp;&raquo; dans l'en-tête est dessiné par un script de cdnjs.buymeacoffee.com et se compose avec Google Fonts. C'est un lien, rien de plus&nbsp;: il ne signale aucune visite, et on ne lui donne rien sur vous ni sur vos fichiers. Rien ne se passe tant que vous ne cliquez pas, et ce vers quoi vous cliqueriez est le site de quelqu'un d'autre."

[[privacy]]
title = "Tout fonctionne hors ligne."
body = "Coupez le réseau&nbsp;: l'outil reste identique, puisqu'il n'a jamais comporté la moindre étape réseau. C'est la preuve la plus simple de toutes."

[[howto]]
title = "Choisissez vos photos."
body = "Déposez-les sur la zone prévue ou sélectionnez-les à la main. Le navigateur les lit directement sur votre disque, sans que rien parte où que ce soit pendant ce temps."

[[howto]]
title = "Lisez ce qu'il y a dedans, si vous voulez."
body = "La liste des trouvailles nomme d'abord ce qui vaut d'être su, à savoir la position GPS, les horodatages et les numéros de série, avant le tableau complet de toutes les étiquettes. Pour JPEG, PNG et WebP, ces blocs sont inventoriés. AVIF montre seulement l’EXIF extrait disponible ; les autres métadonnées AVIF ne sont pas inventoriées."

[[howto]]
title = "Appuyez sur &laquo;&nbsp;Tout supprimer&nbsp;&raquo;."
body = "Pour JPEG, PNG et WebP : C'est tout le travail pour la plupart des gens. Chaque étiquette, les blocs XMP et IPTC, les commentaires et la vignette incorporée partent, sur toutes les photos de la liste d'un coup. AVIF est décodé par votre navigateur et enregistré dans un nouveau PNG sans copier les métadonnées d’origine. Les balises EXIF disponibles sont consultables ici, mais ne peuvent pas être modifiées. Le PNG peut être plus gros et la conversion peut changer les couleurs ou le HDR. Votre original reste inchangé."

[[howto]]
title = "Ou modifiez au lieu de supprimer."
body = "Pour JPEG, PNG et WebP : Changez une date, corrigez une ligne de copyright, retirez le lieu en gardant les réglages de l'appareil, puis enregistrez cette photo seule."

[[faq]]
q = "Ma photo est-elle envoyée quelque part&nbsp;?"
a = "Non. Le fichier est lu, analysé et réécrit par votre propre navigateur sur votre propre matériel. Cet outil ne comporte aucune fonction réseau, si bien qu'il ne va jamais rien chercher et n'envoie jamais rien. Sa <code>Content-Security-Policy</code> énumère par ailleurs toutes les adresses que la page peut contacter, dont aucune n'appartient à ce site."

[[faq]]
q = "Qu'est-ce que l'EXIF, et quoi d'autre se cache dans une photo&nbsp;?"
a = "Pour JPEG, PNG et WebP : L'EXIF est un bloc d'étiquettes qu'un appareil écrit à côté de l'image&nbsp;: la marque et le modèle, les réglages d'exposition, la date et l'heure à la seconde près, souvent une position GPS, et parfois un numéro de série. Les photos portent fréquemment davantage&nbsp;: un paquet XMP de XML laissé par un logiciel de retouche, un bloc IPTC de légendes et de signatures, un profil colorimétrique, une petite deuxième copie de l'image en vignette, et une note de fabricant remplie de données non documentées. Cet outil liste tout cela. Pour JPEG, PNG et WebP, ces blocs sont inventoriés. AVIF montre seulement l’EXIF extrait disponible ; les autres métadonnées AVIF ne sont pas inventoriées."

[[faq]]
q = "Supprimer les métadonnées réduit-il la qualité de l'image&nbsp;?"
a = "Le nettoyage JPEG, PNG et WebP modifie leurs conteneurs et copie les données d’image compressées octet pour octet sans décodage ni recompression. AVIF est décodé et sa première image est écrite dans un nouveau PNG sans perte et sans métadonnées d’origine. Le PNG peut être plus gros et le décodage du navigateur peut changer les couleurs ou le HDR. L’original reste inchangé."

[[faq]]
q = "Quels formats de fichier prend-il en charge&nbsp;?"
a = "JPEG, PNG et WebP permettent de consulter, modifier et nettoyer les métadonnées dans leur conteneur. AVIF permet un aperçu de l’EXIF extrait disponible et un nettoyage vers un nouveau PNG. Les balises AVIF sont en lecture seule ; les autres métadonnées ne sont pas inventoriées. AVIF animé utilise la première image. HEIC et TIFF brut sont reconnus, mais ne sont pas réécrits."

[[faq]]
q = "Ma photo apparaîtra-t-elle tournée une fois les métadonnées retirées&nbsp;?"
a = "Pour JPEG, PNG et WebP, conserver l’orientation écrit au besoin un petit bloc EXIF avec cette seule balise. Désactivez l’option pour la retirer. AVIF est nettoyé à partir de l’image décodée dans le bon sens par le navigateur, puis converti en PNG. Les options d’orientation et de profil colorimétrique concernent seulement JPEG, PNG et WebP."

[[faq]]
q = "Supprime-t-il la position GPS&nbsp;?"
a = "Le nettoyage retire les données GPS. Pour JPEG, PNG et WebP, vous pouvez aussi supprimer seulement la position et garder le reste. Les balises AVIF sont en lecture seule ; la conversion PNG ne copie aucune métadonnée d’origine."

[[faq]]
q = "Puis-je modifier une étiquette au lieu de la supprimer&nbsp;?"
a = "JPEG, PNG et WebP permettent de modifier et d’ajouter des balises. Reconstruire une note du fabricant peut invalider ses décalages internes ; gardez l’original si cela compte. L’EXIF AVIF est en lecture seule. Le nettoyage crée un PNG sans métadonnées d’origine au lieu de réécrire le conteneur AVIF."

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = "C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai. Le site affiche de la publicité, et c'est elle qui le finance&nbsp;; les annonces ne reçoivent rien sur vos photos."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue de travailler. C'est aussi la façon la plus simple de prouver que rien n'est envoyé, car un outil qui expédierait vos photos ailleurs pour les traiter s'arrêterait à l'instant où vous débranchez."

