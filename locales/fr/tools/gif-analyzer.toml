[[faq]]
q = "Mon GIF est-il envoyé quelque part&nbsp;?"
a = """
        Non. Le fichier est lu, décompressé et dessiné par votre propre navigateur
        sur votre propre matériel. Cet outil n'a aucune partie serveur, et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle
        a le droit de contacter&nbsp;: aucune ne nous appartient. Coupez le réseau,
        il analyse toujours des GIF."""

[[faq]]
q = "Pourquoi mon GIF joue-t-il plus lentement que ne le disent les durées&nbsp;?"
a = """
        Parce que tous les navigateurs refusent de respecter une durée inférieure à
        deux centièmes de seconde et maintiennent l'image un dixième à la place. La
        règle a été écrite dans Netscape en 1996, pour les globes tournants et les
        panneaux &laquo;&nbsp;en construction&nbsp;&raquo; de l'époque, et elle a été
        recopiée dans tous les navigateurs depuis&nbsp;; personne ne l'a jamais
        enlevée.
        <br><br>
        Un GIF dont toutes les images annoncent 0,01&nbsp;s ne joue donc pas à 100
        images par seconde. Il joue à 10, soit cinq à dix fois plus lentement que ce
        que voulait le logiciel qui l'a fabriqué. Cette page affiche les deux
        chiffres, ce que dit le fichier et ce qu'il fera vraiment, et marque les
        images concernées. Le remède, dans le logiciel qui a écrit le fichier, est
        d'écrire 0,02 plutôt que 0,01."""

[[faq]]
q = "Que veut dire &laquo;&nbsp;effacement&nbsp;&raquo;&nbsp;?"
a = """
        Ce qu'il faut laisser à l'écran quand le temps d'une image est écoulé.
        C'est le champ qui décide si une animation est propre ou si elle bave.
        <br><br>
        <strong>Laisser en place</strong> veut dire que l'image suivante peint
        par-dessus celle-ci, ce que l'on veut quand les images sont opaques et se
        recouvrent. <strong>Effacer jusqu'au fond</strong> nettoie d'abord le
        rectangle de l'image, ce dont la transparence a besoin&nbsp;: sans cela, les
        parties transparentes de l'image suivante laissent voir la précédente en
        dessous. <strong>Restaurer ce qu'il y avait dessous</strong> remet ce qui
        était là avant que cette image ne se dessine, et c'est ainsi qu'on stocke un
        petit objet mobile sur un fond fixe. Enfin, <strong>non
        précisé</strong> signifie que le fichier n'a rien dit, et toutes les visionneuses
        le traitent comme &laquo;&nbsp;laisser en place&nbsp;&raquo;."""

[[faq]]
q = "Pourquoi mon GIF est-il aussi gros&nbsp;?"
a = """
        Le tableau &laquo;&nbsp;Où sont passés les octets&nbsp;&raquo; répond à cela
        pour votre fichier plutôt qu'en général, et il n'y a que quelques réponses
        possibles.
        <br><br>
        Si presque tout est en <strong>pixels compressés</strong>, le fichier est
        simplement beaucoup d'image&nbsp;: un GIF stocke chaque image en pixels
        entiers, sans compensation de mouvement ni réglage de qualité, si bien que la
        taille vaut à peu près la surface multipliée par le nombre d'images. Moins
        d'images, un format plus petit ou moins de couleurs sont les seuls leviers.
        <br><br>
        Si une grosse part est en <strong>tables de couleurs</strong>, le fichier
        écrit une palette par image, à 768 octets pièce. Si une grosse part est en
        <strong>métadonnées</strong>, un logiciel de retouche a laissé derrière lui
        un paquet XMP, et il peut être retiré sans toucher à l'image. Et si toutes
        les images couvrent le canevas entier, l'encodeur n'a jamais cherché quelle
        partie avait réellement changé&nbsp;: sur une captation ou un enregistrement,
        c'est l'essentiel du fichier."""

[[faq]]
q = "Quelle est la différence entre les deux vues d'image&nbsp;?"
a = """
        <strong>Le canevas après chaque image</strong>, c'est ce qu'une visionneuse
        montre à cet instant&nbsp;: cette image dessinée par-dessus ce que les
        précédentes ont laissé. <strong>Seulement ce que chaque image
        stocke</strong>, c'est le rectangle que le fichier détient vraiment pour
        cette image, seul, sans rien dessous.
        <br><br>
        C'est la seconde qui est intéressante. Un GIF peut ne stocker d'une image que
        la partie du dessin qui a changé, et c'est pour cela qu'un enregistrement
        d'écran d'une fenêtre presque immobile peut être petit. Si chaque image de
        votre fichier occupe le canevas entier, personne n'a fait ce travail&nbsp;;
        et regarder l'animation ne vous l'apprendra pas, seul l'examen de ce qui est
        stocké le fera."""

[[faq]]
q = "Il dit que mon fichier contient un commentaire ou du XMP. Qu'est-ce que c'est&nbsp;?"
a = """
        Du texte qui voyage avec l'image et qu'aucune visionneuse ne dessine. Un bloc
        de commentaire est le plus souvent le nom du logiciel qui a écrit le fichier.
        Un paquet XMP est le XML qu'un logiciel de retouche écrit pour consigner ce
        qu'il a fait, et il peut contenir l'historique des modifications, la version
        du logiciel et parfois le nom de l'auteur.
        <br><br>
        Cette page les imprime tous deux en entier, parce que la question
        intéressante sur les métadonnées est ce qu'elles disent, pas le fait qu'elles
        existent. Elles vous sont montrées, à vous et à personne d'autre&nbsp;: rien
        dans ce dépôt n'en lit quoi que ce soit à qui que ce soit."""

[[faq]]
q = "Peut-il ouvrir un GIF abîmé&nbsp;?"
a = """
        Il essaie, et il vous dit où il a renoncé. Un fichier qui s'arrête au milieu
        d'un bloc, qui a un octet là où un marqueur devrait se trouver, ou qui porte
        une image dont les données compressées s'épuisent trop tôt, affichera quand
        même tout ce qui était lisible jusque-là, avec le problème nommé en haut.
        C'est justement le cas où l'on veut le plus un analyseur, alors jeter le
        fichier entier pour un octet fautif serait le mauvais comportement."""

[[faq]]
q = "Est-ce qu'il modifie mon fichier&nbsp;?"
a = """
        Non. Cet outil ne fait que lire. Il n'y a pas de fichier de sortie, pas de
        réencodage et aucun bouton ici qui écrive un GIF&nbsp;: la seule chose
        téléchargeable est une copie de l'analyse en texte brut. Votre original reste
        intact sur votre disque, ce qui est aussi la réponse honnête à la question de
        ce qui se passe si vous fermez l'onglet."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai.
        La taille des fichiers n'est limitée que par la mémoire de votre machine. Le
        site affiche de la publicité, et c'est elle qui le finance&nbsp;; les annonces
        ne reçoivent rien sur votre fichier."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle
        continue de travailler. C'est aussi la façon la plus simple de prouver que
        rien n'est envoyé, car un outil qui expédierait votre GIF ailleurs pour
        l'analyser s'arrêterait à l'instant où vous débranchez."""

