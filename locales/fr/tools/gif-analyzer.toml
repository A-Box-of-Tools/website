 La
      Content-Security-Policy nomme chaque adresse que cette page a le droit de
      contacter, et pas une seule ne nous appartient. Il n'existe ici aucun point de
      collecte où votre fichier pourrait atterrir, ni rien dans le code qui l'y
      enverrait s'il en existait un. Cette ligne disait autrefois
      <code>connect-src 'none'</code>, ce qui ne souffrait aucune
      exception&nbsp;; la publicité a coûté cela, et le dire fait partie du
      marché."""

[[privacy]]
title = "Le lecteur, ce sont quatre fichiers de ce dépôt."
body = """
 Rien ici n'utilise le
      décodeur GIF du navigateur pour savoir ce que contient le fichier, parce que ce
      décodeur ne dira jamais où est passé un octet. Le format est donc lu à la
      main&nbsp;: <code>src/gif.js</code> parcourt les blocs,
      <code>src/lzw.js</code> déplie les pixels, <code>src/frames.js</code> les
      empile, et <code>src/budget.js</code> rassemble les morceaux et vérifie qu'ils
      font bien la taille du fichier."""

