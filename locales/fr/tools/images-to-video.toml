#
# Images en vidéo - French.
#
# Overrides for tools/images-to-video/tool.toml. Only words: the slug, the
# category, the icon, the CSP and the list of shared parts stay where they are.
#
# This is the one tool with a [picker.urls] table, so it is also the one whose
# translation has to supply the noun the importer's warning in [ui.picker] is
# written around. French needs it in the singular, and feminine, because that
# warning still says "quelle ... vous réclamez". The rest of the warning was
# rewritten to stop leaning on the noun's gender, so this is now the only
# agreement the two files share.
#
# [schema] is emitted as JSON-LD, where HTML entities are never decoded, so
# that table alone uses plain spaces and plain punctuation.
#

