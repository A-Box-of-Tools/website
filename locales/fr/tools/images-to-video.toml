  "Convertit des images JPG, PNG, WebP, GIF et AVIF en vidéo",
  "Sortie MP4 (H.264), avec le WebM comme repli",
  "Résolutions jusqu'à 3840 × 2160, cadences de 12 à 60 images par seconde",
