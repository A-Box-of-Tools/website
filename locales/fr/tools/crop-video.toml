 La
      Content-Security-Policy énumère toutes les adresses que cette page peut
      contacter, et aucune n'appartient à ce site. Il n'existe ici aucun point de
      collecte où votre fichier pourrait aboutir, ni rien dans le code qui l'y
      enverrait s'il en existait un."""

[[privacy]]
title = "Rien ici ne va rien chercher."
body = """
 Cet outil n'a aucune fonction
      réseau&nbsp;: pas d'adresse à coller, rien à télécharger, aucun moteur
      récupéré à la première utilisation. Chaque octet qui touche à votre vidéo
      vient de cette origine, au chargement de la page."""

[[privacy]]
title = "Le décodage et l'encodage sont locaux."
body = """
 Les images passent par
      WebCodecs dans votre propre navigateur, ou par le moteur de lecture qui
      vous montrerait le clip de toute façon. Le fichier fini est construit en
      mémoire sur cette machine, puis remis directement à un
      téléchargement."""

[[privacy]]
title = "Le son est copié, pas écouté."
body = """
 Sur le chemin MP4, les
      échantillons audio sont déplacés sans être décodés le moins du monde. Rien
