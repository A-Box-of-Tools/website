#
# Explorateur de nombres - French.
#
# Overrides for tools/number-explorer/tool.toml. Only words: the slug, the
# category, the icon and the list of shared parts stay where they are.
#
# Every figure here was carried over by value and not by word. The English
# billion is un milliard and the French billion is the English trillion, so a
# sentence that keeps the word keeps it a thousand times too large.
#

name = "Explorateur de nombres"
heading = "Explorateur&nbsp;de&nbsp;nombres <span class=\"h1-kw\">&mdash; se représenter un million, un milliard et au-delà</span>"
tagline = "Tapez n'importe quel nombre et regardez-le grandir&nbsp;: une pile de livres, un filet d'eau, un ciel d'étoiles, un tas de sable, un très long comptage."

title = "Visualiser un nombre &mdash; comprendre les millions et les milliards &mdash; gratuit, hors ligne"
description = "Voyez la vraie taille d'un nombre. Il grandit en pile de livres, en filet d'eau, en ciel d'étoiles, en tas de sable et en temps de comptage, à côté de repères allant de l'Everest à la Voie lactée. Gratuit et hors ligne."
og_title = "À quoi ressemble un milliard&nbsp;?"
og_description = "Transformez un nombre immense en quelque chose de visible&nbsp;: livres, eau, étoiles, sable et temps, avec des hypothèses claires, sans IA ni envoi."
og_image_alt = "Explorateur de nombres - se représenter les grands nombres en livres, eau, étoiles, sable et temps"

pledge = "Une comparaison, c'est un nombre, une référence choisie et un peu d'arithmétique, le tout dans cette page. Il n'y a aucun service d'IA à interroger et aucune saisie à envoyer. Les livres, l'eau, les étoiles, le sable et le temps de comptage restent séparés, et leurs hypothèses sont écrites à côté du résultat au lieu d'être cachées derrière l'image."
live_hint = "Changez le nombre avec l'onglet Réseau ouvert. La calculatrice ne fait aucune requête. Chargez la page une fois, déconnectez-vous et continuez à explorer."
read_first = ", <code>src/scale.js</code> pour la lecture du nombre, les modèles et les repères, <code>src/containers.js</code> pour ce que mesure une zone colorée, <code>src/stage.js</code> et les fichiers <code>src/scene-*.js</code> pour les images, et <code>src/main.js</code> pour la façon dont la page s'assemble."
howto_heading = "Comment se représenter un grand nombre"
card = "Quelle hauteur fait une pile d'un milliard de livres&nbsp;? Combien d'eau font un milliard de gouttes&nbsp;? Tapez n'importe quel nombre et regardez-le devenir livres, eau, étoiles, sable et temps, hypothèses en vue."

