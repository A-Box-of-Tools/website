[[howto]]
title = "Choisissez le travail."
body = """
 Quatre onglets qui partagent une même
      zone&nbsp;: <em>Formater</em> met en forme ou compacte du JSON, du XML, du HTML,
      du CSS et du YAML&nbsp;; <em>Convertir</em> transforme du JSON en YAML ou en XML
      et inversement&nbsp;; <em>Encoder</em> fait le Base64, les URL, les entités HTML,
      l'hexadécimal et les échappements antislash, dans les deux sens&nbsp;;
      <em>Comparer</em> montre ce qui a changé entre deux textes."""

[[howto]]
title = "Collez-le, ou déposez le fichier."
body = """
 Tout ce que vous pouvez
      sélectionner et copier fonctionne. Un fichier déposé sur le sélecteur est lu par
      votre propre navigateur et mis dans la zone&nbsp;: il n'y a pas d'étape d'envoi à
      éviter. Déposez deux fichiers pendant une comparaison et ils atterrissent un de
      chaque côté."""

[[howto]]
title = "Laissez-le deviner le langage, ou dites-le-lui."
body = """
 Le menu indique ce qu'il a
      lu, et le corriger prend un clic. Une supposition n'est qu'un point de départ,
      c'est pourquoi elle est affichée plutôt qu'appliquée en silence."""

[[howto]]
title = "Choisissez l'indentation, ou compactez tout."
body = """
 Deux espaces, quatre, ou
      une tabulation. Compacter, c'est le même document dont on a retiré chaque espace
      qui n'était là que pour la lecture, et le résultat indique combien d'octets cela
      a fait gagner."""

[[howto]]
title = "Lisez l'erreur là où elle est."
body = """
 Un analyseur qui échoue ici dit ce qu'il a
      trouvé, et à quelle ligne et quelle colonne, plutôt que
      &laquo;&nbsp;jeton inattendu à la position 4193&nbsp;&raquo;. Cela suffit
      généralement à réparer un fichier de configuration sans rien ouvrir d'autre."""

[[howto]]
title = "Emportez le résultat."
body = """
 Copiez-le, ou téléchargez-le comme fichier.
      Une comparaison se télécharge en <code>.patch</code> au format unifié, ce
      qu'attendent une revue de code, <code>git apply</code> et toutes les visionneuses
      de différences."""

[[faq]]
q = "Mon texte est-il envoyé quelque part&nbsp;?"
a = """
        Non. Chaque analyseur, chaque encodeur et la comparaison de cette page sont des
        fonctions qui s'exécutent dans votre propre navigateur, sur votre propre
        matériel. Cet outil n'a aucune fonction réseau&nbsp;: il ne va jamais rien
        chercher et n'envoie jamais rien, et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle a
        le droit de contacter, dont aucune ne nous appartient. C'est la raison de s'en
        servir pour un jeton d'accès, un cookie de session ou une fiche client&nbsp;:
        coller l'un de ceux-là dans le formateur de quelqu'un d'autre, c'est le lui
        donner."""

[[faq]]
q = "Formater du JSON change-t-il autre chose que la mise en forme&nbsp;?"
a = """
        Non, et c'est plus difficile qu'il n'y paraît. Les clés gardent l'ordre dans
        lequel vous les avez écrites&nbsp;: un formateur bâti sur
        <code>JSON.parse</code> déplace silencieusement en tête les clés ressemblant à
        des entiers, si bien que <code>{"10":a,"2":b}</code> revient en
        <code>{"2":b,"10":a}</code>. Les nombres gardent les chiffres que vous avez
        tapés&nbsp;: un identifiant de vingt chiffres ne perd pas ses trois derniers au
        profit d'un double, et <code>1e999</code> ne devient pas <code>null</code>. Les
        clés en double sont toutes les deux conservées, parce que la norme ne dit pas
        laquelle l'emporte et qu'en supprimer une reviendrait à choisir à votre
        place."""

[[faq]]
q = "Quels langages sait-il formater&nbsp;?"
a = """
        JSON, XML, HTML, CSS et YAML. JSON, XML, HTML et CSS peuvent aussi être
        compactés&nbsp;; YAML non, car sa forme courte est le style de flux, qui est
        illisible, et l'illisible est l'inverse de la raison qui pousse à garder un
        fichier en YAML. JavaScript n'est délibérément pas sur la liste&nbsp;: voyez la
        question à ce sujet plus bas."""

[[faq]]
q = "Pourquoi ne formate-t-il pas JavaScript, Python ou SQL&nbsp;?"
a = """
        Parce que mettre en forme un langage de programmation suppose de l'analyser
        correctement, et qu'un formateur qui y arrive presque est pire que rien&nbsp;:
        il produit du code qui a l'air correct et qui fait autre chose. JSON, XML, CSS
        et YAML ont des grammaires assez petites pour être lues à la main et vérifiées
        par des tests que vous pouvez lancer. Un formateur JavaScript, c'est Prettier,
        soit un mégaoctet d'analyseur, et sa place est dans votre éditeur, pas sur une
        page web."""

[[faq]]
q = "Que fait la comparaison, au juste&nbsp;?"
a = """
        Elle trouve le plus petit ensemble de modifications qui transforme le texte de
        gauche en celui de droite, avec l'algorithme de Myers &mdash; celui qu'utilise
        <code>git diff</code>. C'est le fait d'être le plus court qui rend une
        comparaison lisible&nbsp;: une ligne insérée au milieu doit apparaître comme une
        insertion, et non comme si toutes les lignes suivantes avaient changé. À
        l'intérieur d'une ligne modifiée, les mots qui diffèrent sont marqués aussi, si
        bien que comparer deux paragraphes montre le mot qui a bougé plutôt que deux
        paragraphes entiers."""

[[faq]]
q = "Peut-il comparer deux fichiers plutôt que deux collages&nbsp;?"
a = """
        Oui. Déposez les deux sur le sélecteur pendant que l'onglet Comparer est ouvert
        et ils atterrissent un de chaque côté, dans l'ordre où vous les avez déposés.
        Votre navigateur les lit dans cette page, qui est le seul endroit où ils vont.
        Échangez les côtés si vous les avez déposés à l'envers."""

[[faq]]
q = "Que sort-il d'une comparaison, et puis-je l'appliquer&nbsp;?"
a = """
        Le téléchargement est un diff unifié &mdash; le format
        <code>@@ -3,5 +3,5 @@</code> que lisent <code>git apply</code>,
        <code>patch</code> et tous les outils de revue de code. Copier fait la même
        chose vers votre presse-papiers. Ce qui est à l'écran en est une vue&nbsp;: côte
        à côte, ou sur une colonne, avec les parties inchangées repliées en un décompte,
        sauf si vous demandez à les voir toutes."""

[[faq]]
q = "Le Base64 d'ici est-il le même Base64 que partout ailleurs&nbsp;?"
a = """
        Oui &mdash; il est vérifié par rapport aux vecteurs de test du RFC 4648 plutôt
        que par rapport à lui-même. Les deux alphabets se décodent, si bien qu'un JWT
        écrit avec <code>-</code> et <code>_</code> se lit aussi facilement qu'un autre
        écrit avec <code>+</code> et <code>/</code>, et une entrée coupée à 64
        caractères est recollée pour vous. L'encodage passe par les octets UTF-8, si
        bien qu'une lettre accentuée ou un émoji survit à l'aller-retour."""

[[faq]]
q = "Mon YAML dit no et le JSON est ressorti en chaîne. Pourquoi&nbsp;?"
a = """
        Parce que c'est une chaîne, et que ceci lit le YAML 1.2 et non le 1.1. En YAML
        1.1, <code>yes</code>, <code>no</code>, <code>on</code> et <code>off</code>
        étaient des booléens, ce qui est le fameux bogue qui transforme le code pays de
        la Norvège en <code>false</code>. YAML 1.2 a supprimé cela, et cet outil
        aussi&nbsp;: seuls <code>true</code>, <code>false</code>, <code>null</code> et
        <code>~</code> sont lus comme autre chose que du texte. Dans l'autre sens, ces
        mots sont réécrits <em>entre guillemets</em>, alors même que cet outil les
        lirait comme du texte sans les guillemets &mdash; parce que ce qui ouvrira le
        fichier ensuite, peut-être pas. PyYAML est toujours en 1.1 par défaut. Lire
        strictement et écrire prudemment est la seule combinaison juste dans les deux
        sens."""

[[faq]]
q = "Que perd-on en convertissant du YAML en JSON&nbsp;?"
a = """
        Les commentaires, parce que JSON n'a nulle part où en mettre. Les ancres, les
        alias et les balises sont refusés d'emblée plutôt que devinés&nbsp;: chacun dit
        quelque chose que JSON ne sait pas dire, et un convertisseur qui choisirait
        discrètement une interprétation vous rendrait un document qui n'est pas ce que
        disait le fichier. Dans l'autre sens, on ne perd rien&nbsp;: tout document JSON
        est déjà un document YAML."""

[[faq]]
q = "Que perd-on en convertissant du JSON en XML&nbsp;?"
a = """
        La différence entre un objet vide, un tableau vide et une chaîne vide, qui
        deviennent tous un élément vide, et le type de chaque valeur, puisque XML n'a
        pas de types &mdash; c'est pourquoi la conversion inverse laisse tout en chaîne
        plutôt que de décider que <code>8080</code> était un nombre. Un tableau devient
        un élément répété, seule forme qui se relit, et une clé qu'un nom d'élément ne
        peut pas porter voit ses caractères gênants remplacés, plutôt que de produire un
        document qu'aucun analyseur ne lira."""

[[faq]]
q = "Réindenter du HTML change-t-il l'apparence de la page&nbsp;?"
a = """
        Cela peut arriver, et c'est dit honnêtement ici. Un blanc entre deux éléments en
        ligne est une espace entre deux mots&nbsp;: le déplacer n'est donc pas gratuit.
        Deux choses tiennent cela en bride&nbsp;: <code>&lt;pre&gt;</code> et
        <code>&lt;textarea&gt;</code> sont recopiés exactement tels quels, et un élément
        qui ne contient que du texte reste sur une seule ligne. Tout le reste est mis en
        forme."""

[[faq]]
q = "Quelle taille de fichier peut-il traiter&nbsp;?"
a = """
        Aucune limite n'est fixée ici, puisqu'aucun serveur ne la paie. Le plafond réel
        est votre machine&nbsp;: quelques mégaoctets de JSON ne posent pas de problème.
        La comparaison de deux textes qui n'ont absolument rien en commun s'arrête tôt
        et le dit, plutôt que de passer une minute à démontrer l'évidence&nbsp;; et une
        comparaison très longue affiche les premiers milliers de lignes et laisse le
        reste au correctif téléchargé."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai, ni
        limite sur ce que vous collez. Le site affiche de la publicité, et c'est elle
        qui le finance&nbsp;; les annonces ne reçoivent rien sur votre texte."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue
        de travailler. C'est aussi la façon la plus simple de prouver que rien n'est
        envoyé, car un outil qui expédierait votre texte ailleurs pour le formater
        s'arrêterait à l'instant où vous débranchez."""

