 Il n'y a nulle part dans
      <code>src/</code> ni <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code>. Chaque analyseur, chaque encodeur et la comparaison sont
      des fonctions de cette page qui prennent une chaîne et renvoient une chaîne."""

[[privacy]]
