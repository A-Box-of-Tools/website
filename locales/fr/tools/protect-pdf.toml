[[privacy]]
title = "L’outil pour lequel un envoi irait contre le but."
body = "Un document à protéger est précisément celui qu’on ne veut pas confier à d’autres. Les outils en ligne demandent souvent l’original ouvert puis votre mot de passe, sans visibilité sur la conservation. Ici, le navigateur lit le fichier, dérive la clé dans l’onglet et écrit la copie en mémoire. La <code>Content-Security-Policy</code> énumère les adresses autorisées, aucune n’appartenant au site. L’outil fonctionne déconnecté."

[[privacy]]
title = "Un mot de passe verrouille. Une restriction demande."
body = "Un <em>mot de passe d’ouverture</em> chiffre vraiment le contenu avec une clé dérivée, sans stocker le mot de passe dans le fichier. Les <em>restrictions</em> d’impression, copie et édition sont différentes&nbsp;: un document ouvert à tous contient nécessairement de quoi dériver sa clé. Le lecteur respecte volontairement un champ de permissions et peut l’ignorer, comme Adobe le documente et comme le fait le <a href=\"../deverrouiller-un-pdf/\">déverrouilleur PDF</a>. Elles expriment vos souhaits et la plupart des lecteurs les suivent, sans être un verrou."

[[privacy]]
title = "AES-256 actuel, sauf demande explicite du mode ancien."
body = "Le chiffrement PDF a connu cinq générations, toutes affichées comme protection par mot de passe. Le défaut est AES-256 avec le hachage coûteux de PDF 2.0, seul mode encore considéré robuste. Sa sécurité dépend du mot de passe. AES-128 avec dérivation de 1994 sert uniquement à un lecteur antérieur à 2010 et est présenté comme plus faible."

[[privacy]]
title = "Le mot de passe est demandé deux fois, car aucun retour n’est possible."
body = "Un document chiffré solidement avec un mot de passe oublié est perdu. Cet outil ne devine aucun mot de passe. Les deux saisies doivent correspondre et la page avertit clairement. Gardez l’original, qui reste intact."

[[privacy]]
title = "Le résultat est rouvert avant téléchargement."
body = "Les octets du téléchargement passent deux fois au lecteur PDF partagé&nbsp;: sans mot de passe, il doit refuser&nbsp;; avec le vôtre, il doit ouvrir, retrouver le nombre de pages et les restrictions. Tout échec empêche le téléchargement et affiche une erreur."

[[privacy]]
title = "Les pages ne sont ni rendues, réencodées ni réorganisées."
body = "Seul le chiffrement autour du document change. Instructions de dessin, polices et images sont conservées puis chiffrées&nbsp;: le texte reste sélectionnable et recherchable avec le mot de passe, les scans gardent leur résolution et rien ne bouge. Les anciennes versions d’objets abandonnées par des modifications précédentes ne sont pas reprises."

[[privacy]]
title = "Une signature numérique ne peut pas survivre à la réécriture."
body = "Une signature couvre les octets exacts du fichier. Toute réécriture l’invalide&nbsp;: la copie obtenue n’est plus signée et le résultat vous avertit. L’original reste signé. Protégez d’abord, puis signez la copie protégée."

[[privacy]]
title = "Un document déjà verrouillé doit d’abord être déverrouillé."
body = "Un PDF demandant un mot de passe est refusé avec un lien vers le <a href=\"../deverrouiller-un-pdf/\">déverrouilleur PDF</a>. Retirez sa protection dans le même navigateur puis revenez avec la copie. Un document ouvert à tous avec seulement des restrictions est accepté&nbsp;: vos réglages remplacent les anciens."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts publicitaires et de mesure de Google ne reçoivent ni document, page, nom, taille, nombre de pages, mot de passe ni mécanisme de protection. Tout le code de lecture, chiffrement et écriture vient du site et figure dans son dépôt."

[[privacy]]
title = "Ce que le bouton de don charge, et ce qu'on ne lui donne pas."
body = "Le bouton &laquo;&nbsp;Buy me a coffee&nbsp;&raquo; de l'en-tête est dessiné par un script de cdnjs.buymeacoffee.com et va chercher sa police chez Google Fonts. C'est un lien et rien de plus&nbsp;: il ne signale aucune visite, et on ne lui donne rien sur vous ni sur vos documents. Rien ne se produit tant que vous ne cliquez pas, et ce vers quoi vous cliquez alors est le site de quelqu'un d'autre."

[[privacy]]
title = "Cela fonctionne hors ligne."
body = "Déconnectez le réseau&nbsp;: toutes les fonctions restent disponibles. Un outil envoyant votre document ailleurs pour le chiffrer s’arrêterait."

[[howto]]
title = "Choisissez le PDF."
body = "Un document à la fois, lu directement depuis votre disque. Un mot de passe existant conduit au déverrouilleur&nbsp;; des restrictions seules sont acceptées et remplacées par vos réglages."

[[howto]]
title = "Définissez le mot de passe et confirmez-le."
body = "C’est le vrai verrou. Sans ce mot de passe, le document ne s’ouvre pas et aucun outil ici ne le récupère. Les deux champs doivent correspondre. Laissez-les vides pour limiter uniquement les permissions d’un document ouvert à tous."

[[howto]]
title = "Cochez les restrictions souhaitées."
body = "Impression, copie de texte et d’images, modification&nbsp;: ce sont des demandes, pas un verrou. Un mot de passe propriétaire les lève. Vide, le mot de passe d’ouverture sert aux deux rôles. Sans mot de passe défini, une valeur aléatoire oubliée empêche leur levée par un champ vide."

[[howto]]
title = "Protégez et lisez la vérification."
body = "Le document est chiffré sous une nouvelle clé puis rouvert sans mot de passe, où il doit être refusé, et avec le vôtre, où il doit garder le même nombre de pages. Un échec empêche le téléchargement et affiche un message."

[[faq]]
q = "Un PDF avec mot de passe est-il vraiment sûr&nbsp;?"
a = "Avec AES-256 et le hachage PDF 2.0 par défaut, sa sécurité dépend du mot de passe, sans raccourci connu. Les cinq générations PDF ne se valent pas&nbsp;: une clé de 40 bits de 1994 est explorable par un ordinateur portable, mais les lecteurs utilisent le même libellé. Cette page écrit le mode actuel et explique le mode ancien."

[[faq]]
q = "Quelle différence entre mot de passe et restrictions&nbsp;?"
a = "Le mot de passe <em>utilisateur</em> bloque réellement l’ouverture. Le mot de passe <em>propriétaire</em> lève les <em>restrictions</em> d’impression, copie et édition. Un PDF ouvert sans mot de passe contient de quoi dériver sa clé&nbsp;: les lecteurs choisissent de respecter les permissions. Le <a href=\"../deverrouiller-un-pdf/\">déverrouilleur PDF</a> les ignore. Les restrictions expriment vos souhaits&nbsp;; le mot de passe les fait respecter pour l’ouverture."

[[faq]]
q = "Que faire si j’oublie le mot de passe&nbsp;?"
a = "Le document est perdu. <code>src/shared/pdf-crypt.js</code> ne comporte aucune boucle de recherche de mots de passe, et le mode actuel ne se récupère pas honnêtement sans le connaître. Les deux saisies préviennent les erreurs. Gardez votre original, non modifié."

[[faq]]
q = "Faut-il choisir AES-256 ou AES-128&nbsp;?"
a = "AES-256, sauf si un lecteur antérieur à 2010 doit ouvrir le fichier. PDF 2.0 est lu par Acrobat X et suivants, navigateurs, téléphones et lecteurs actuels. AES-128 est le mode de 2005, affaibli par sa dérivation de clé de 1994 plutôt que par AES lui-même. En cas de doute, choisissez 256."

[[faq]]
q = "Puis-je protéger un PDF déjà protégé&nbsp;?"
a = "Oui s’il s’ouvre sans mot de passe&nbsp;: vos restrictions remplacent les anciennes. Sinon, utilisez d’abord le <a href=\"../deverrouiller-un-pdf/\">déverrouilleur PDF</a>, puis revenez avec la copie. Le format ne peut pas empiler deux verrous&nbsp;: changer un mot de passe exige de retirer puis remettre la protection."

[[faq]]
q = "L’aspect du document change-t-il&nbsp;?"
a = "Non. Dessins, polices et images sont conservés exactement puis chiffrés. Avec le mot de passe, le texte reste sélectionnable, les scans gardent leur résolution et rien ne bouge. Le poids peut diminuer en supprimant les anciens objets, ou augmenter de seize octets par flux chiffré."

[[faq]]
q = "Que devient un document signé&nbsp;?"
a = "Sa signature est invalidée, comme toute modification des octets couverts, même par le logiciel signataire. Cet outil écrit une nouvelle copie et vous avertit. Pour les deux protections, chiffrez d’abord, puis signez le résultat."

[[faq]]
q = "Mes documents ou mots de passe sont-ils envoyés&nbsp;?"
a = "Non. Votre navigateur lit, chiffre et écrit sur votre appareil. Le mot de passe sert à dériver une clé dans cet onglet. Aucun serveur&nbsp;: la <code>Content-Security-Policy</code> énumère les adresses autorisées, aucune n’appartenant au site. Déconnectez le réseau et utilisez la page pour le vérifier."

[[faq]]
q = "Comment savoir si la protection est active&nbsp;?"
a = "Le fichier est relu deux fois sur votre appareil. Sans mot de passe, il doit être refusé&nbsp;; avec le vôtre, il doit retrouver pages et permissions. Un échec empêche le téléchargement. Vérifiez aussi dans un lecteur&nbsp;: demande de mot de passe et permissions dans les propriétés."

[[faq]]
q = "Y a-t-il une limite de taille, et cela coûte-t-il quelque chose&nbsp;?"
a = "Aucune limite n'est écrite dans l'outil. La limite, c'est votre propre machine&nbsp;: le document est tenu en mémoire pendant le travail, un portable encaissera donc quelques centaines de mégaoctets sans broncher et peinera quelque part au-dessus. C'est gratuit, il n'y a ni compte, ni connexion, ni période d'essai. Le site porte de la publicité, et c'est elle qui le paie&nbsp;; on ne donne rien aux annonces sur vos documents."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page une fois puis déconnectez Internet&nbsp;: elle continue. Un outil envoyant votre document ailleurs pour le chiffrer s’arrêterait."

