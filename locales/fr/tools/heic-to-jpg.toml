[[privacy]]
title = "Vos photos n'ont nulle part où aller."
body = """
 La
      Content-Security-Policy énumère toutes les adresses que cette page peut
      contacter, et aucune n'appartient à ce site. Il n'existe ici aucun point de
      collecte où vos fichiers pourraient aboutir, ni rien dans le code qui les y
      enverrait s'il en existait un."""

[[privacy]]
title = "Le décodeur est venu d'ici, et il ne va nulle part."
body = """
 Le HEIC, c'est du
      HEVC dans un format à boîtes, qu'aucun navigateur sauf Safari ne sait
      décoder&nbsp;; cette page livre donc <code>libheif</code> compilé en
      WebAssembly, soit environ 1,4&nbsp;MB, versionnés dans ce dépôt, servis
      depuis cette origine et mis en cache par le service worker comme tous les
      autres fichiers d'ici. Il n'est pas récupéré sur un CDN, parce que cela
      mettrait un tiers sur le chemin de chaque visite et empêcherait l'outil de
      fonctionner hors ligne. Le binaire est à l'intérieur du script plutôt qu'à
      côté, précisément pour qu'aucune requête ne soit nécessaire à son
      démarrage."""

[[privacy]]
title = "Rien ici ne va rien chercher."
body = """
 On ne trouve ni
      <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code> dans aucun fichier écrit pour cet outil. Le moteur
      embarqué, comme toute compilation Emscripten, contient les chemins de
      chargement qui iraient chercher un <code>.wasm</code> à une URL&nbsp;; ils
      ne sont pas empruntés, puisque le binaire est déjà en main. Et s'ils
      l'étaient, <code>connect-src</code> ne nomme que les points de mesure de
      Google et rien d'autre, de sorte que le navigateur refuserait. La politique
      est la preuve, pas la promesse."""

[[privacy]]
title = "Les métadonnées sont lues ici et vous sont rapportées."
body = """
 La liste sur
      la page dit ce que porte chaque photo, à savoir la date, l'appareil et la
      présence éventuelle de coordonnées GPS, parce que c'est une chose que vous
      pourriez vouloir savoir avant de remettre le JPEG à quelqu'un. Elle est lue
      dans le fichier par <code>src/boxes.js</code> dans ce navigateur, montrée sur
      cette page, puis écrite dans votre JPEG ou laissée de côté, entièrement
      comme vous le décidez. Aucun événement d'analytique maison, dans tout ce
      dépôt, ne transporte un nom de fichier, une date, une coordonnée ou un
      nombre."""

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = """
 Les scripts
      publicitaires et de mesure viennent de Google, et le bouton de don de Buy
      Me a Coffee. Aucun d'eux ne reçoit quoi que ce soit sur vos photos. Chaque
      ligne qui lit, décode ou écrit un fichier est servie depuis cette origine et
      figure dans le dépôt."""

[[privacy]]
title = "Tout fonctionne hors ligne."
body = """
 Chargez la page une fois puis coupez le
      réseau&nbsp;: l'outil reste identique, le décodeur étant mis en cache avec
      lui. C'est la preuve la plus simple de toutes, et elle est ici plus forte
      que partout ailleurs sur ce site, car un convertisseur qui expédierait vos
      photos ailleurs pour les décoder n'y arriverait tout simplement pas."""

[[howto]]
title = "Choisissez vos photos HEIC."
body = """
 Déposez-les sur la zone prévue ou
      sélectionnez-les à la main, directement depuis une sauvegarde de téléphone
      ou un dossier du bureau. Le navigateur les lit sur votre disque, sans que
      rien parte où que ce soit pendant ce temps. La liste dit ce qu'est chacune
      et ce qu'elle a dedans."""

[[howto]]
title = "Regardez ce que portent les photos."
body = """
 Chaque ligne nomme la date de
      prise de vue, l'appareil, et, en vert parce que c'est la partie qui mérite
      l'attention, la présence de coordonnées GPS. Tout cela est lu dans le
      conteneur sans décoder l'image, ce qui ne coûte rien et apparaît
