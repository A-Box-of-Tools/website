[[privacy]]
title = "Ce que vous collez n'a nulle part où aller."
body = """
 La
      Content-Security-Policy nomme chaque adresse que cette page a le droit de
      contacter, et pas une seule ne nous appartient. Il n'existe ici aucun point de
      collecte où un jeton collé pourrait atterrir, ni rien dans le code qui l'y
      enverrait s'il en existait un."""

[[privacy]]
title = "Rien ici ne va chercher quoi que ce soit."
body = """
 Il n'y a nulle part dans
      <code>src/</code> ni <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code>. La comparaison est une fonction de cette page qui
      prend deux chaînes et renvoie ce qui a changé."""

[[privacy]]
title = "L'algorithme est le classique, lisible en entier."
body = """
 L'algorithme du plus court script
      d'édition de Myers, celui-là même qu'utilise <code>git diff</code>, écrit à la
      main dans <code>src/diff.js</code> avec les décisions commentées. Les tests
      dans <code>tests/js/text-diff.test.js</code> prouvent que les suppressions
      reconstruisent le texte de gauche et les insertions celui de droite, ce qui
      est la définition même de &laquo;&nbsp;correct&nbsp;&raquo; pour un diff."""

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = """
 Les scripts
      publicitaires et de mesure viennent de Google, et le bouton de don de Buy Me a
      Coffee. Aucun d'eux ne reçoit un caractère de votre texte. Chaque ligne qui le
      lit, l'analyse ou l'écrit est servie depuis cette origine et figure dans le
      dépôt."""

[[privacy]]
title = "Tout fonctionne hors ligne."
body = """
 Coupez le réseau&nbsp;: l'outil reste
      identique, puisqu'il n'a jamais comporté la moindre étape réseau. C'est la preuve
      la plus simple de toutes."""

[[howto]]
title = "Collez les deux textes, ou déposez les deux fichiers."
body = """
 L'original à gauche, la
      version modifiée à droite. Deux fichiers déposés en même temps sur le
      sélecteur atterrissent un de chaque côté, dans l'ordre où vous les avez
      déposés&nbsp;; échangez les côtés si c'était à l'envers."""

[[howto]]
title = "Choisissez comment le lire."
body = """
 Côte à côte, ou en une colonne. Un
      téléphone commence en une colonne, car côte à côte demande deux colonnes de
      texte et un téléphone a la place d'environ une&nbsp;; le menu est juste là de
      toute façon."""

[[howto]]
title = "Ignorez ce qui ne compte pas."
body = """
 Les espaces, les majuscules et
      minuscules, les lignes vides &mdash; chacun peut être ignoré, pour qu'un
      fichier reformaté ne se lise pas comme cent changements. Par défaut, la
      partie inchangée du milieu est repliée en un compte, avec trois lignes
      gardées de part et d'autre de chaque changement."""

[[howto]]
title = "Lisez ce qui a changé."
body = """
 Les lignes supprimées sont marquées à
      gauche, les lignes ajoutées à droite, et dans une ligne modifiée, les mots qui
      diffèrent sont surlignés &mdash; un diff de deux paragraphes montre donc le
      mot qui a bougé plutôt que deux paragraphes entiers."""

[[howto]]
title = "Emportez le correctif."
body = """
 Le téléchargement est un
      <code>.patch</code> au format unifié, ce qu'attendent une revue de code,
      <code>git apply</code> et toutes les visionneuses de différences. Copier met
      la même chose dans votre presse-papiers."""

[[faq]]
q = "Mes textes sont-ils envoyés quelque part&nbsp;?"
a = """
        Non. La comparaison est une fonction qui s'exécute dans votre propre
        navigateur, sur votre propre matériel. Cet outil n'a aucune fonction
        réseau&nbsp;: il ne va jamais rien chercher et n'envoie jamais rien, et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle
        a le droit de contacter, dont aucune ne nous appartient. C'est la raison de
        s'en servir pour un contrat, un fichier de configuration ou du code non
        publié&nbsp;: coller ceux-là dans le comparateur de quelqu'un d'autre, c'est
        donner les deux versions à la fois."""

[[faq]]
q = "Que fait la comparaison, au juste&nbsp;?"
a = """
        Elle trouve le plus petit ensemble de modifications qui transforme le texte de
        gauche en celui de droite, avec l'algorithme de Myers &mdash; celui qu'utilise
        <code>git diff</code>. C'est le fait d'être le plus court qui rend une
        comparaison lisible&nbsp;: une ligne insérée au milieu doit apparaître comme une
        insertion, et non comme si toutes les lignes suivantes avaient changé. À
        l'intérieur d'une ligne modifiée, les mots qui diffèrent sont marqués aussi, si
        bien que comparer deux paragraphes montre le mot qui a bougé plutôt que deux
        paragraphes entiers."""

[[faq]]
q = "Peut-il comparer deux fichiers plutôt que deux collages&nbsp;?"
a = """
        Oui. Déposez les deux en même temps sur le sélecteur et ils atterrissent un
        de chaque côté, dans l'ordre où vous les avez déposés. Votre navigateur les
        lit dans cette page, qui est le seul endroit où ils vont. Échangez les côtés
        si vous les avez déposés à l'envers."""

[[faq]]
q = "Que sort-il d'une comparaison, et puis-je l'appliquer&nbsp;?"
a = """
        Le téléchargement est un diff unifié &mdash; le format
        <code>@@ -3,5 +3,5 @@</code> que lisent <code>git apply</code>,
        <code>patch</code> et tous les outils de revue de code. Copier fait la même
        chose vers votre presse-papiers. Ce qui est à l'écran en est une vue&nbsp;: côte
        à côte, ou sur une colonne, avec les parties inchangées repliées en un décompte,
        sauf si vous demandez à les voir toutes."""

[[faq]]
q = "Peut-il ignorer les espaces, la casse ou les lignes vides&nbsp;?"
a = """
        Oui, chacun séparément. Ignorer les espaces fait qu'un fichier reformaté se
        compare comme inchangé&nbsp;; ignorer la casse traite <code>Error</code> et
        <code>error</code> comme le même mot&nbsp;; ignorer les lignes vides saute
        les lignes qui ne contiennent rien. Les compteurs au-dessus du résultat
        disent alors que les deux sont identiques une fois ignorées les différences
        que vous avez demandé d'ignorer &mdash; ce qui n'est pas la même affirmation
        que &laquo;&nbsp;identiques&nbsp;&raquo;, et la page garde les deux
        affirmations distinctes."""

[[faq]]
q = "Quelle taille de comparaison peut-il traiter&nbsp;?"
a = """
        Aucune limite n'est fixée ici, puisqu'aucun serveur ne la paie. Deux textes de
        vingt mille lignes avec une poignée de changements se comparent
        instantanément, car le début et la fin communs sont retirés avant que le vrai
        travail commence. La comparaison de deux textes qui n'ont absolument rien en
        commun s'arrête tôt et le dit, plutôt que de passer une minute à démontrer
        l'évidence&nbsp;; et une comparaison très longue affiche les premiers
        milliers de lignes et laisse le reste au correctif téléchargé."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai, ni
        limite sur ce que vous collez. Le site affiche de la publicité, et c'est elle
        qui le finance&nbsp;; les annonces ne reçoivent rien sur votre texte."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, coupez ensuite votre connexion et elle continue
        de travailler. C'est aussi la façon la plus simple de prouver que rien n'est
        envoyé, car un outil qui expédierait vos textes ailleurs pour les comparer
        s'arrêterait à l'instant où vous débranchez."""

