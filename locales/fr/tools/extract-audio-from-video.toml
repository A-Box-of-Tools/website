[[howto]]
title = "Déposez la vidéo."
body = """
 Un MP4, MOV, M4V ou WebM, venant
      d'un téléphone, d'un appareil photo, d'un enregistreur d'écran ou d'un
      téléchargement. C'est votre propre navigateur qui le lit&nbsp;; il n'y a
      pas d'étape d'envoi à omettre."""

[[howto]]
title = "Lisez ce qui a été trouvé."
body = """
 La durée, le nombre de canaux et
      la fréquence d'échantillonnage, directement tirés du fichier. Si le fichier
      n'a pas déclaré sa fréquence, la page le dit, plutôt que de
      rééchantillonner en silence en prétendant n'avoir rien touché."""

[[howto]]
title = "Choisissez le mono si vous le voulez plus léger."
body = """
 Laisser les
      canaux tels quels garde l'enregistrement exactement comme il était. Le
      mixage en mono divise le fichier par deux et c'est ce que veut une
      transcription ou un enregistrement de voix&nbsp;; il fait la moyenne des
      canaux plutôt que d'en jeter un."""

[[howto]]
title = "Écoutez-le avant de l'enregistrer."
body = """
 Le lecteur joue le fichier qui
      est sur le point d'être téléchargé, pas la vidéo&nbsp;: si cela sonne
      juste, le téléchargement est juste."""

[[howto]]
title = "Emportez-le, ou passez-le à la suite."
body = """
 Téléchargez le WAV, ou
      envoyez-le directement au découpeur ou à l'éditeur sans l'enregistrer
      d'abord."""

[[faq]]
q = "Ma vidéo est-elle envoyée quelque part&nbsp;?"
a = """
        Non. Le décodage et l'écriture se font tous deux dans votre propre
        navigateur, sur votre propre matériel. Cet outil n'a aucune fonction
        réseau d'aucune sorte &mdash; il ne récupère jamais rien et n'envoie
        jamais rien &mdash; et la <code>Content-Security-Policy</code> de la page
        nomme chaque adresse qu'elle peut contacter, dont aucune ne nous
        appartient. Si vous préférez vérifier qu'on vous le dise, débranchez
        internet et récupérez le son quand même."""

[[faq]]
q = "Peut-il me donner un MP3&nbsp;?"
a = """
        Non, et il ne fera pas semblant. Aucun navigateur ne livre d'encodeur
        MP3, et le seul moyen d'en atteindre un est d'envoyer votre vidéo à un
        serveur qui en possède un &mdash; ce qui est précisément la seule chose
        que ce site existe pour ne pas faire. Ce que vous obtenez est un
        WAV&nbsp;: les échantillons avec un en-tête de quarante-quatre octets
        devant, ce qui ne demande aucun encodeur et ne peut coûter aucune
        qualité. Il est plus lourd, environ dix mégaoctets la minute en stéréo,
        et tout lecteur, téléphone ou éditeur l'ouvre. Ce qui veut un MP3 peut en
        faire un à partir de là en une seconde."""

[[faq]]
q = "L'image est-elle regardée à un moment&nbsp;?"
a = """
        Non, et il n'y a rien ici qui pourrait la regarder. On remet le fichier
        au décodeur du navigateur en lui demandant sa piste audio&nbsp;; la piste
        vidéo n'est jamais décodée, jamais dessinée et n'atteint même pas le code
        de cette page. Il n'y a dans <code>src/</code> aucun décodeur vidéo à
        exécuter. Le fichier qui sort contient du son et rien d'autre."""

[[faq]]
q = "Il dit qu'aucun son n'a pu être lu, mais la vidéo se lit très bien."
a = """
        Alors la vidéo n'a presque certainement aucune piste audio. Un
        enregistrement d'écran fait sans micro sélectionné est muet, et un extrait
        exporté par un logiciel de montage avec le son coupé l'est aussi&nbsp;;
        les deux se lisent parfaitement, parce qu'il y a une image à afficher. Le
        message nomme ce cas en premier parce que c'est le plus probable des
        deux&nbsp;; l'autre est un format que ce navigateur ne lira pas. Ouvrez
        le fichier dans un lecteur et cherchez un réglage de volume qui ne fait
        rien&nbsp;: c'est le moyen le plus rapide de savoir lequel des deux vous
        avez."""

[[faq]]
q = "Quels formats vidéo puis-je ouvrir&nbsp;?"
a = """
        Tout ce que votre navigateur décode, ce qui en pratique veut dire MP4,
        M4V, MOV et WebM, et tous les formats audio par ailleurs. Ce qui reste
        dehors est la même courte liste que partout ailleurs sur ce site&nbsp;:
        AVI, WMV et la plupart des MKV. Un fichier que votre navigateur ne lira
        pas est refusé avec un message qui le dit, plutôt que d'échouer à
        mi-chemin."""

[[faq]]
q = "Y a-t-il une perte de qualité&nbsp;?"
a = """
        Rien au-delà de ce que la vidéo avait déjà fait subir à son propre audio
        au moment de sa création. Les échantillons rendus par le décodeur sont
        écrits tels quels&nbsp;: il n'y a pas de second encodage, donc pas de
        seconde génération de perte. La seule chose à savoir est la fréquence
        d'échantillonnage&nbsp;: celle du fichier est lue d'abord dans son
        en-tête et le décodage se fait à cette fréquence, si bien que votre
        enregistrement n'est pas rééchantillonné en silence. Si un fichier n'en
        déclare aucune, la page dit quelle fréquence elle a supposée."""

[[faq]]
q = "Pourquoi le WAV est-il tellement plus lourd que la vidéo&nbsp;?"
a = """
        Parce qu'un WAV n'est pas compressé et que la piste audio de la vidéo
        l'était. Du son de qualité CD pèse environ dix mégaoctets la minute en
        stéréo, quel qu'en soit le contenu&nbsp;; la piste AAC d'un MP4 en fait
        peut-être un dixième. Le mixage en mono divise cela par deux. C'est le
        prix de ne pas réencoder, et il se paie une fois&nbsp;: ce avec quoi vous
        ouvrirez le fichier ensuite pourra le compresser."""

[[faq]]
q = "Quelle durée de vidéo peut-il traiter&nbsp;?"
a = """
        Aucune limite n'est inscrite ici, parce qu'aucun serveur ne la paie. Le
        plafond réel est la mémoire de votre propre machine&nbsp;: le fichier est
        lu en entier et toute la piste audio est conservée sous forme
        d'échantillons, si bien qu'un enregistrement très long sur une petite
        machine peut manquer de place. Quelques heures de vidéo passent
        ordinairement bien, et un téléphone en supportera moins qu'un portable."""

[[faq]]
q = "Puis-je le raccourcir ou monter le volume&nbsp;?"
a = """
        Oui, mais pas ici&nbsp;: cette page fait un seul travail. Dès qu'il y a
        un résultat, une rangée de liens à côté du téléchargement l'emporte
        directement vers le <a href="../couper-un-audio/">découpeur audio</a> ou
        l'<a href="../modifier-un-audio/">éditeur audio</a> sans l'enregistrer d'abord,
        et sans que l'un ou l'autre ne l'envoie non plus."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période
        d'essai, ni limite au nombre de vidéos que vous ouvrez. Le site affiche
        de la publicité, et c'est elle qui le finance&nbsp;; les annonces ne
        reçoivent rien sur votre fichier."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, puis débranchez internet et elle continue
        de fonctionner. C'est aussi la façon la plus simple de prouver que rien
        n'est envoyé&nbsp;: un outil qui expédierait votre vidéo pour la traiter
        s'arrêterait à l'instant où vous débranchez."""

