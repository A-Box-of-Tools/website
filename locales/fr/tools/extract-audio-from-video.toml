[[privacy]]
title = "Votre vidéo n'a nulle part où aller."
body = """
 La
      Content-Security-Policy nomme chaque adresse que cette page peut
      contacter, et aucune ne nous appartient. Il n'y a ici aucun point de
      collecte où un fichier pourrait aboutir, et rien dans le code qui l'y
      enverrait s'il en existait un."""

[[privacy]]
title = "L'image n'est jamais décodée du tout."
body = """
 Seule la piste audio est
      demandée. Les images ne sont ni lues, ni décodées, ni dessinées, ni
      regardées &mdash; il n'y a sur cette page aucun code qui le pourrait
      &mdash; et le fichier qui sort contient du son et rien d'autre. Ce n'est
      pas une promesse de retenue&nbsp;: on remet les octets à
      <code>decodeAudioData</code>, qui renvoie du son, et il n'y a dans
      <code>src/</code> aucun décodeur vidéo à exécuter."""

[[privacy]]
title = "Le décodeur est celui que votre navigateur possède déjà."
body = """
 Rien
      n'est livré ici pour lire votre format, et rien hors de cette page n'est
      sollicité pour le lire non plus. Les fichiers qui fonctionnent sont donc
      exactement ceux que votre navigateur sait déjà lire."""

[[privacy]]
title = "Les échantillons sont écrits tels quels, pas réencodés."
body = """

      Un WAV, ce sont les échantillons rendus par le décodeur avec un en-tête
      devant. Aucun encodeur ne prend de décision sur votre enregistrement, et
      il n'y a rien qu'on puisse appeler un envoi sur lequel cela se
      produirait."""

[[privacy]]
