title = "Convertisseur YAML vers JSON &mdash; dans les deux sens, sans envoi"
description = "Convertissez un sous-ensemble pris en charge de YAML 1.2 en JSON et inversement dans le navigateur. Ancres, alias, balises et documents multiples sont refusés ; JSON perd les commentaires. Aucun envoi."
og_title = "Convertir du YAML sans le coller dans un serveur"
og_description = "Un convertisseur YAML et JSON qui tourne sur votre propre machine. Les clés gardent leur ordre, les nombres leurs chiffres, et ce que vous collez ne va nulle part."
og_image_alt = "Convertisseur YAML vers JSON - les deux sens, sans envoi"
pledge = "Convertir, c'est de l'arithmétique sur une chaîne de caractères, faite ici, dans cette page. Les deux analyseurs sont écrits à la main et se trouvent dans <code>src/</code> &mdash; <code>shared/parse-yaml.js</code> et <code>shared/parse-json.js</code> &mdash; et il n'y a rien d'autre. Cet outil n'a aucune fonction réseau d'aucune sorte &mdash; rien à récupérer, rien à envoyer &mdash; et cela compte ici plus que presque partout ailleurs sur ce site&nbsp;: un fichier YAML est le plus souvent une configuration de déploiement, et une configuration de déploiement est le plus souvent pleine de noms d'hôtes, de noms de buckets et de secrets."
live_hint = "Inutile de nous croire sur parole&nbsp;: ouvrez les DevTools, regardez l'onglet réseau et convertissez quelque chose. Pas une requête ne transporte un caractère de ce que vous avez collé. Ou débranchez internet et convertissez-le quand même."
