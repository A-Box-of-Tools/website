[[privacy]]
title = "Ce que vous collez n'a nulle part où aller."
body = """
 La
      Content-Security-Policy nomme chaque adresse que cette page peut contacter,
      et aucune ne nous appartient. Il n'y a ici aucun point de collecte où une
      configuration collée pourrait aboutir, et rien dans le code qui l'y
      enverrait s'il en existait un."""

[[privacy]]
title = "Rien ici ne récupère quoi que ce soit."
body = """
 Il n'y a aucun
      <code>fetch</code>, aucun <code>XMLHttpRequest</code> et aucun
      <code>sendBeacon</code> nulle part dans <code>src/</code>. Les deux
      analyseurs et les deux imprimeurs sont des fonctions de cette page qui
      prennent une chaîne et renvoient une chaîne."""

[[privacy]]
title = "Il lit le YAML 1.2, donc la Norvège reste la Norvège."
body = """
 En YAML 1.1,
      <code>no</code> était un booléen, ce qui est le fameux bogue qui transforme
      le code pays de la Norvège en <code>false</code>. Ceci lit la 1.2, où c'est
      la chaîne qu'il paraît être. Dans l'autre sens, ces mots sont réécrits
      <em>entre guillemets</em>, parce que ce qui ouvrira le fichier ensuite peut
      encore être un lecteur 1.1. <code>tests/js/text-convert.test.js</code>
      vérifie les deux moitiés."""

[[privacy]]
title = "Une conversion qui ne peut pas être honnête s'arrête."
body = """
 Une ancre,
      un alias ou une étiquette dans le YAML met fin à la conversion avec un
      message indiquant à quelle ligne elle se trouve, plutôt qu'un document JSON
      qui voudrait discrètement dire autre chose. Le JSON n'a aucun moyen de dire
      &laquo;&nbsp;le même nœud deux fois&nbsp;&raquo;, et choisir une
      interprétation reviendrait à choisir à votre place."""

