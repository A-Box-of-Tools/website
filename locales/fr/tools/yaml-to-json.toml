[[faq]]
q = "Mon YAML est-il envoyé quelque part&nbsp;?"
a = """
        Non. Les deux analyseurs et les deux imprimeurs de cette page sont des
        fonctions qui tournent dans votre propre navigateur, sur votre propre
        matériel. Cet outil n'a aucune fonction réseau d'aucune sorte &mdash; il
        ne récupère jamais rien et n'envoie jamais rien &mdash; et la
        <code>Content-Security-Policy</code> de la page nomme chaque adresse
        qu'elle peut contacter, dont aucune ne nous appartient. C'est
        précisément la raison de l'utiliser pour une configuration de
        déploiement&nbsp;: elles sont pleines de noms d'hôtes, de noms de buckets
        et parfois d'un secret que quelqu'un comptait déplacer, et en coller une
        dans le convertisseur de quelqu'un d'autre, c'est la lui donner."""

[[faq]]
q = "Que perd-on en convertissant du YAML en JSON&nbsp;?"
a = """
        Les commentaires, parce que le JSON n'a nulle part où en mettre. Les
        ancres, les alias et les étiquettes sont refusés d'emblée plutôt que
        devinés &mdash; chacun dit quelque chose que le JSON ne sait pas dire, et
        un convertisseur qui choisirait discrètement une interprétation vous
        rendrait un document qui n'est pas ce que disait le fichier. L'autre sens
        ne perd rien&nbsp;: tout document JSON est déjà un document YAML."""

[[faq]]
q = "Mon YAML dit no et le JSON est sorti en chaîne. Pourquoi&nbsp;?"
a = """
        Parce que c'en est une, et que ceci lit le YAML 1.2 plutôt que le 1.1. En
        YAML 1.1, <code>yes</code>, <code>no</code>, <code>on</code> et
        <code>off</code> étaient des booléens, ce qui est le fameux bogue qui
        transforme le code pays de la Norvège en <code>false</code>. Le YAML 1.2
        a abandonné cela, et ceci aussi&nbsp;: seuls <code>true</code>,
        <code>false</code>, <code>null</code> et <code>~</code> sont lus comme
        autre chose que du texte. Dans l'autre sens, ces mots sont réécrits
        <em>entre guillemets</em>, alors même que ceci les lirait comme du texte
        sans eux &mdash; parce que ce qui ouvrira le fichier ensuite ne le fera
        peut-être pas. PyYAML utilise toujours la 1.1 par défaut. Lire
        strictement et écrire prudemment est la seule combinaison qui soit juste
        dans les deux sens."""

[[faq]]
q = "Garde-t-il l'ordre de mes clés&nbsp;?"
a = """
        Oui, dans les deux sens, et c'est plus difficile qu'il n'y paraît. Un
        convertisseur bâti sur <code>JSON.parse</code> ramène discrètement en tête
        les clés qui ressemblent à des entiers, si bien que
        <code>{"10":a,"2":b}</code> revient en <code>{"2":b,"10":a}</code>. Les
        nombres gardent les chiffres que vous avez tapés, donc un identifiant de
        compte à vingt chiffres ne perd pas ses trois derniers au profit d'un
        double. Si vous <em>voulez</em> les trier, il y a une case pour cela, et
        elle trie selon la façon dont les clés se lisent plutôt que selon leurs
        points de code."""

[[faq]]
q = "Peut-il convertir plusieurs documents YAML à la fois&nbsp;?"
a = """
        Non, et il le dit plutôt que d'en choisir un. Un fichier avec des
        séparateurs <code>---</code> contient plus d'un document, et le JSON n'a
        aucune forme qui veuille dire &laquo;&nbsp;plusieurs
        documents&nbsp;&raquo; &mdash; un tableau serait une affirmation que le
        fichier n'a jamais faite. Convertissez-les un par un."""

[[faq]]
q = "Pourquoi n'y a-t-il pas de formateur YAML ici&nbsp;?"
a = """
        Parce que le YAML n'a pas de forme compactée qui vaille la peine d'être
        écrite &mdash; la courte est le style de flux, qui est illisible, et
        l'illisible est le contraire de la raison de garder un fichier en YAML.
        Mettre en forme du JSON, du XML, du HTML et du CSS est le travail du
        <a href="../formater-du-json/">formateur JSON</a>, et il met aussi le YAML
        en forme."""

[[faq]]
q = "Quelle taille de fichier peut-il traiter&nbsp;?"
a = """
        Aucune limite n'est inscrite ici, parce qu'aucun serveur ne la paie. Le
        plafond réel est votre propre machine&nbsp;: quelques mégaoctets de YAML
        passent bien, et pour un document très long la page attend une pause dans
        votre frappe avant de convertir, plutôt que de vous disputer le
        clavier."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni identification, ni période
        d'essai, ni limite à ce que vous collez. Le site affiche de la publicité,
        et c'est elle qui le finance&nbsp;; les annonces ne reçoivent rien sur
        votre texte."""

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = """
        Oui. Chargez la page une fois, puis débranchez internet et elle continue
        de fonctionner. C'est aussi la façon la plus simple de prouver que rien
        n'est envoyé&nbsp;: un outil qui expédierait votre configuration pour la
        convertir s'arrêterait à l'instant où vous débranchez."""

