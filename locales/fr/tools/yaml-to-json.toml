[[privacy]]
title = "Le traitement se fait dans ce navigateur."
body = "L’outil traite entrées et résultats dans le navigateur. Son code ne les envoie pas pour traitement. Content-Security-Policy limite ressources et destinations, mais les hôtes autorisés peuvent recevoir des requêtes : elle n’inspecte pas les données et ne prouve pas seule une absence d’envoi. Comparez code et requêtes de l’opération ou terminez l’opération locale déconnecté."

[[privacy]]
title = "Rien ici ne récupère quoi que ce soit."
body = "Il n'y a aucun <code>fetch</code>, aucun <code>XMLHttpRequest</code> et aucun <code>sendBeacon</code> nulle part dans <code>src/</code>. Les deux analyseurs et les deux imprimeurs sont des fonctions de cette page qui prennent une chaîne et renvoient une chaîne."

[[privacy]]
title = "Le sous-ensemble pris en charge utilise les règles scalaires de YAML 1.2."
body = "En YAML 1.1, <code>no</code> était un booléen, ce qui est le fameux bogue qui transforme le code pays de la Norvège en <code>false</code>. Ceci lit la 1.2, où c'est la chaîne qu'il paraît être. Dans l'autre sens, ces mots sont réécrits <em>entre guillemets</em>, parce que ce qui ouvrira le fichier ensuite peut encore être un lecteur 1.1. <code>tests/js/text-convert.test.js</code> vérifie les deux moitiés."

[[privacy]]
title = "Une conversion qui ne peut pas être honnête s'arrête."
body = "JSON supprime les commentaires. Ce parseur prend volontairement en charge un sous-ensemble de YAML 1.2 et refuse ancres, alias et balises plutôt que de choisir leur expansion ou conversion de type. JSON représente un arbre de valeurs ; YAML accepte des nœuds partagés et des valeurs typées. Les flux de documents multiples sont refusés plutôt qu’enveloppés dans un tableau inventé. JSON vers YAML conserve les valeurs représentées."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts publicitaires et de mesure viennent de Google, et le bouton de don de Buy Me a Coffee. Aucun d'eux ne reçoit un caractère de votre texte. Chaque ligne qui le lit, l'analyse ou l'écrit est servie depuis cette origine et figure dans le dépôt."

[[privacy]]
title = "Cela fonctionne hors ligne."
body = "Débranchez le réseau et l'outil est inchangé, parce qu'il n'y a jamais eu d'étape réseau dedans. C'est la preuve la plus simple qui soit."

[[howto]]
title = "Choisissez le sens."
body = "<em>YAML vers JSON</em> ou <em>JSON vers YAML</em>. La note sous le menu dit ce que ce sens perd avant que vous ne colliez quoi que ce soit, et non après."

[[howto]]
title = "Collez-le, ou déposez le fichier."
body = "Tout ce que vous pouvez sélectionner et copier convient. Un fichier déposé sur le sélecteur est lu par votre propre navigateur et placé dans la boîte &mdash; il n'y a pas d'étape d'envoi à omettre &mdash; et une extension <code>.json</code> ou <code>.yaml</code> choisit le sens pour vous."

[[howto]]
title = "Choisissez l'indentation."
body = "Deux espaces, quatre, ou une tabulation. La tabulation n'est proposée que pour le JSON&nbsp;: le YAML est défini en termes d'espaces, et une tabulation n'y est pas une indentation légale."

[[howto]]
title = "Lisez l'erreur là où elle est."
body = "Un analyseur qui échoue ici dit ce qu'il a trouvé et à quelle ligne et quelle colonne, plutôt que &laquo;&nbsp;jeton inattendu à la position 4193&nbsp;&raquo;. Cela suffit d'ordinaire à réparer un fichier de configuration sans rien ouvrir d'autre."

[[howto]]
title = "Emportez le résultat."
body = "Copiez-le, ou téléchargez-le sous forme de fichier, nommé d'après le format dans lequel il est sorti."

[[faq]]
q = "Mon YAML est-il envoyé quelque part&nbsp;?"
a = "Non. Les deux analyseurs et les deux imprimeurs de cette page sont des fonctions qui tournent dans votre propre navigateur, sur votre propre matériel. Cet outil n'a aucune fonction réseau d'aucune sorte &mdash; il ne récupère jamais rien et n'envoie jamais rien &mdash; et la <code>Content-Security-Policy</code> de la page nomme chaque adresse qu'elle peut contacter, dont aucune ne nous appartient. C'est précisément la raison de l'utiliser pour une configuration de déploiement&nbsp;: elles sont pleines de noms d'hôtes, de noms de buckets et parfois d'un secret que quelqu'un comptait déplacer, et en coller une dans le convertisseur de quelqu'un d'autre, c'est la lui donner."

[[faq]]
q = "Que perd-on en convertissant du YAML en JSON&nbsp;?"
a = "JSON supprime les commentaires. Ce parseur prend volontairement en charge un sous-ensemble de YAML 1.2 et refuse ancres, alias et balises plutôt que de choisir leur expansion ou conversion de type. JSON représente un arbre de valeurs ; YAML accepte des nœuds partagés et des valeurs typées. Les flux de documents multiples sont refusés plutôt qu’enveloppés dans un tableau inventé. JSON vers YAML conserve les valeurs représentées. <a href=\"https://yaml.org/spec/1.2.2/\">La spécification YAML</a> définit le format complet."

[[faq]]
q = "Mon YAML dit no et le JSON est sorti en chaîne. Pourquoi&nbsp;?"
a = "YAML 1.1 lisait <code>yes</code>, <code>no</code>, <code>on</code> et <code>off</code> comme des booléens, transformant le code de la Norvège en <code>false</code>. Ce sous-ensemble utilise YAML 1.2 : ces mots restent des chaînes, <code>true</code> et <code>false</code> sont des booléens, <code>null</code> et <code>~</code> sont null et les scalaires numériques sont des nombres. L’écriture YAML met les mots ambigus entre guillemets pour les lecteurs aux anciennes règles."

[[faq]]
q = "Garde-t-il l'ordre de mes clés&nbsp;?"
a = "Oui, dans les deux sens, et c'est plus difficile qu'il n'y paraît. Un convertisseur bâti sur <code>JSON.parse</code> ramène discrètement en tête les clés qui ressemblent à des entiers, si bien que <code>{\"10\":a,\"2\":b}</code> revient en <code>{\"2\":b,\"10\":a}</code>. Les nombres gardent les chiffres que vous avez tapés, donc un identifiant de compte à vingt chiffres ne perd pas ses trois derniers au profit d'un double. Si vous <em>voulez</em> les trier, il y a une case pour cela, et elle trie selon la façon dont les clés se lisent plutôt que selon leurs points de code."

[[faq]]
q = "Peut-il convertir plusieurs documents YAML à la fois&nbsp;?"
a = "Non, et il le dit plutôt que d'en choisir un. Un fichier avec des séparateurs <code>---</code> contient plus d'un document, et le JSON n'a aucune forme qui veuille dire &laquo;&nbsp;plusieurs documents&nbsp;&raquo; &mdash; un tableau serait une affirmation que le fichier n'a jamais faite. Convertissez-les un par un."

[[faq]]
q = "Pourquoi n'y a-t-il pas de formateur YAML ici&nbsp;?"
a = "Parce que le YAML n'a pas de forme compactée qui vaille la peine d'être écrite &mdash; la courte est le style de flux, qui est illisible, et l'illisible est le contraire de la raison de garder un fichier en YAML. Mettre en forme du JSON, du XML, du HTML et du CSS est le travail du <a href=\"../formater-du-json/\">formateur JSON</a>, et il met aussi le YAML en forme."

[[faq]]
q = "Quelle taille de fichier peut-il traiter&nbsp;?"
a = "Aucune limite n'est inscrite ici, parce qu'aucun serveur ne la paie. Le plafond réel est votre propre machine&nbsp;: quelques mégaoctets de YAML passent bien, et pour un document très long la page attend une pause dans votre frappe avant de convertir, plutôt que de vous disputer le clavier."

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = "C'est gratuit, et il n'y a ni compte, ni identification, ni période d'essai, ni limite à ce que vous collez. Le site affiche de la publicité, et c'est elle qui le finance&nbsp;; les annonces ne reçoivent rien sur votre texte."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page une fois, puis débranchez internet et elle continue de fonctionner. C'est aussi la façon la plus simple de prouver que rien n'est envoyé&nbsp;: un outil qui expédierait votre configuration pour la convertir s'arrêterait à l'instant où vous débranchez."

