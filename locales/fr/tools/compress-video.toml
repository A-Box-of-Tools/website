[[privacy]]
title = "L’envoi est la partie lente, absente ici."
body = "Une vidéo de 900 Mo destinée à devenir 25 Mo devrait d’abord partir entière vers un compresseur en ligne. Cet envoi prend souvent plus longtemps que l’encodage, avant même la question de conservation. Ici, les codecs du navigateur travaillent sur votre appareil. La <code>Content-Security-Policy</code> énumère les adresses autorisées, aucune n’appartenant au site. L’outil fonctionne déconnecté."

[[privacy]]
title = "Le poids demandé est le point de départ."
body = "Messagerie, courriel ou formulaire imposent un poids. Le son copié et le conteneur prennent leur part&nbsp;; le reste, divisé par la durée, donne le débit vidéo. L’outil descend les dimensions usuelles jusqu’à donner assez de bits à chaque pixel, sans agrandissement. Il annonce le choix avant lancement et vous laisse changer le cadre."

[[privacy]]
title = "Compresser une vidéo signifie la réencoder."
body = "Contrairement au ZIP, ce n’est pas sans perte. L’image est décodée, réduite puis réencodée en H.264 au débit permis, une génération de plus depuis la caméra. Le son reste intact. Le résultat est MP4, lisible par téléphones, navigateurs et messageries."

[[privacy]]
title = "Le résultat est mesuré, puis resserré une fois si nécessaire."
body = "Un encodeur approche le débit sans l’atteindre exactement. L’outil vise un peu sous la cible puis mesure. En cas de dépassement, il recalcule le débit depuis l’écart et encode une seconde fois, en le signalant. Le résultat est rouvert pour vérifier durée et son&nbsp;: un fichier tronqué serait aussi plus petit."

[[privacy]]
title = "Le coût sur votre appareil est annoncé."
body = "L’encodage dépend du matériel&nbsp;: souvent plus rapide que la durée avec un encodeur matériel, plus lent sans lui, et long en 4K. L’entrée est lue par morceaux, même au-delà de la mémoire. Le résultat reste en mémoire jusqu’au téléchargement, ce qui fixe la limite pratique. L’annulation reste disponible."

[[privacy]]
title = "Formats lus et non lus."
body = "MP4 et MOV avec H.264, HEVC, VP9 ou AV1, selon les codecs du navigateur. HEVC d’iPhone nécessite une licence sur l’appareil. WebM, MKV et AVI ne sont pas encore lus ici et sont refusés clairement."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts publicitaires et de mesure de Google ne reçoivent ni vidéo, image, nom, taille, durée ni poids demandé. Tout le code de lecture, encodage et écriture vient du site et figure dans le dépôt."

[[privacy]]
title = "Ce que le bouton de don charge, et ce qu'on ne lui donne pas."
body = "Le bouton de don est dessiné par cdnjs.buymeacoffee.com avec Google Fonts. C’est un lien qui ne signale aucune visite et ne reçoit rien sur vous ou vos vidéos. Il mène à un autre site uniquement si vous cliquez."

[[privacy]]
title = "Cela fonctionne hors ligne."
body = "Déconnectez le réseau&nbsp;: toutes les fonctions restent disponibles. Un outil envoyant votre vidéo ailleurs pour la compresser s’arrêterait."

[[howto]]
title = "Choisissez la vidéo."
body = "Un clip MP4 ou MOV à la fois, lu directement sur votre disque. La page indique durée, poids, dimensions et débit."

[[howto]]
title = "Donnez le poids maximal."
body = "Saisissez des mégaoctets ou choisissez 8, 16, 25, 50, 100, la moitié ou le quart du poids actuel. La page affiche dimensions, débit et estimation selon durée et son. Retirez le son pour donner tout le budget à l’image."

[[howto]]
title = "Changez les dimensions si nécessaire."
body = "L’outil choisit un palier. Vous pouvez imposer un cadre pour garder une capture lisible à 1080p ou viser un téléphone. Le débit est réparti sur ce cadre. C’est un plafond&nbsp;: aucune image n’est agrandie."

[[howto]]
title = "Compressez et lisez la mesure."
body = "L’image est décodée, réduite et réencodée avec progression. Le poids final est mesuré et le fichier rouvert pour vérifier sa durée. S’il dépasse, un second encodage est annoncé. Le résultat se lit en mémoire sous le téléchargement."

[[faq]]
q = "Jusqu’où peut-on réduire une vidéo&nbsp;?"
a = "Jusqu’à la limite où aucune image regardable ne tient, annoncée par la page. Le son garde son poids, environ un mégaoctet par minute en stéréo courante. La petite image nécessite quelques centaines de kilobits par seconde. Retirer le son peut suffire pour un clip court à limite serrée."

[[faq]]
q = "Pourquoi les dimensions ont-elles changé&nbsp;?"
a = "Le débit dépend du nombre de pixels. Deux mégabits par seconde conviennent à 720p mais brouillent la 4K. Le cadre descend donc pour garder une image nette plutôt qu’une grande image floue. Le choix est annoncé et modifiable."

[[faq]]
q = "La qualité diminue-t-elle&nbsp;?"
a = "Oui, selon la réduction demandée. L’image est réencodée à débit inférieur, une génération de plus&nbsp;; le son reste intact. Passer de 900 à 25 Mo coûte davantage que réduire de moitié. Dimensions et débit rendent ce compromis visible."

[[faq]]
q = "Quel format est écrit&nbsp;?"
a = "MP4 avec H.264 et piste audio copiée intacte, pour la compatibilité avec téléphones, navigateurs, messageries et courriels. Pas de WebM, HEVC ni AV1, plus efficaces mais moins largement acceptés."

[[faq]]
q = "Quels fichiers sont lus&nbsp;?"
a = "MP4 et MOV avec H.264, HEVC, VP9 ou AV1 si le navigateur les décode. HEVC exige une licence sur l’appareil. WebM, MKV et AVI sont clairement refusés car non pris en charge ici."

[[faq]]
q = "Combien de temps cela prend-il&nbsp;?"
a = "Le temps d’encodage de votre appareil. Avec le matériel dédié, une minute de 1080p prend généralement moins d’une minute&nbsp;; sans lui, plus longtemps. La 4K reste coûteuse. La barre indique l’image traitée et l’annulation arrête sans écrire de résultat."

[[faq]]
q = "Pourquoi deux passages&nbsp;?"
a = "L’encodeur approche le débit demandé et peut dépasser sur un clip animé. Le résultat est mesuré&nbsp;; s’il est trop gros, le débit est recalculé depuis l’écart et un second passage est lancé. La page indique quand il a été nécessaire."

[[faq]]
q = "Mes vidéos sont-elles envoyées&nbsp;?"
a = "Non. Votre navigateur lit, décode, encode et écrit sur votre appareil. La <code>Content-Security-Policy</code> énumère les adresses autorisées, aucune n’appartenant au site. Déconnectez Internet pour vérifier. Pour ces gros fichiers, l’envoi serait souvent plus long que l’encodage."

[[faq]]
q = "Est-ce que cela marche sur téléphone&nbsp;?"
a = "Oui si le navigateur du téléphone sait encoder. Son encodeur matériel est rapide, mais la mémoire peut manquer pour un long résultat. Coupez d’abord avec le <a href=\"../couper-une-video/\">coupeur vidéo</a> ou utilisez un ordinateur."

[[faq]]
q = "Y a-t-il une limite de taille, et cela coûte-t-il quelque chose&nbsp;?"
a = "Aucune limite imposée par l’outil. L’entrée est lue par morceaux&nbsp;; le résultat doit tenir en mémoire jusqu’au téléchargement, généralement quelques centaines de mégaoctets sur ordinateur. Gratuit, sans compte, connexion ni essai limité. Les publicités ne reçoivent aucune vidéo."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez la page puis déconnectez Internet&nbsp;: elle continue. Un outil envoyant votre vidéo ailleurs pour la compresser s’arrêterait."

