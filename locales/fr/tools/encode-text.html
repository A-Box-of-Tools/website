<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> Choisir l'encodage</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">Encodage</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>Dans quel sens</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>Encoder</strong> Texte clair en entrée, encodé en sortie.</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>Décoder</strong> Encodé en entrée, texte clair en sortie.</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> Collez-le</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Votre texte</label>
          <span class="count" id="input-count">vide</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Collez le texte à encoder, ou le Base64 à décoder - ou déposez un fichier ci-dessus."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Essayer un exemple</button>
        <button type="button" id="clear" class="ghost danger">Vider</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> Emportez le résultat</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Rien pour l'instant.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Copier</button>
        <a id="download" class="ghost as-button" hidden download>Télécharger</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
