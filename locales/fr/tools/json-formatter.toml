[[howto]]
title = "Choisissez le travail."
body = """
 Deux onglets, une même zone&nbsp;:
      <em>Formater</em> met en forme ou compacte du JSON, du XML, du HTML, du CSS
      et du YAML&nbsp;; <em>Convertir</em> transforme du JSON en YAML ou en XML et
      inversement. Le texte que vous venez de formater est celui que vous
      convertissez, sans le coller deux fois."""

[[howto]]
title = "Collez-le, ou déposez le fichier."
body = """
 Tout ce que vous pouvez
      sélectionner et copier fonctionne. Un fichier déposé sur le sélecteur est lu par
      votre propre navigateur et mis dans la zone&nbsp;: il n'y a pas d'étape d'envoi à
