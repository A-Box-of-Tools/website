[[privacy]]
title = "Ce que vous collez n'a nulle part où aller."
body = """
 La
      Content-Security-Policy nomme chaque adresse que cette page a le droit de
      contacter, et pas une seule ne nous appartient. Il n'existe ici aucun point de
      collecte où un jeton collé pourrait atterrir, ni rien dans le code qui l'y
      enverrait s'il en existait un."""

[[privacy]]
title = "Rien ici ne va chercher quoi que ce soit."
body = """
 Il n'y a nulle part dans
      <code>src/</code> ni <code>fetch</code>, ni <code>XMLHttpRequest</code>, ni
      <code>sendBeacon</code>. Chaque analyseur et chaque scripteur sont des
      fonctions de cette page qui prennent une chaîne et renvoient une chaîne."""

[[privacy]]
title = "Les formateurs gardent ce qu'on leur a donné."
body = """
 Un objet JSON revient avec ses
      clés dans l'ordre où vous les avez écrites et ses nombres écrits comme vous les
      avez écrits, parce que <code>src/json.js</code> est un analyseur et non un appel
      à <code>JSON.parse</code>, qui réordonne les clés ressemblant à des entiers et
      transforme un identifiant de vingt chiffres en le double le plus proche. Les
      tests de <code>tests/js/text-format.test.js</code> vérifient exactement cela."""

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = """
 Les scripts
      publicitaires et de mesure viennent de Google, et le bouton de don de Buy Me a
