name = "Comparateur de tailles"
heading = "Comparer&nbsp;des&nbsp;tailles <span class=\"h1-kw\">&mdash; un graphique côte à côte, téléchargeable</span>"
tagline = "Tapez les tailles, emportez l'image. Rien n'est envoyé pour la dessiner."

title = "Comparer des tailles &mdash; gratuit, sans inscription, sans envoi"
description = "Comparez des tailles côte à côte. Ajoutez un homme, une femme, un garçon, une fille, un tout-petit et des objets &mdash; une porte, une fenêtre, un tableau blanc, un distributeur &mdash; en centimètres ou en pieds et pouces, et téléchargez le graphique en PNG ou en SVG. Il est dessiné dans votre navigateur."
og_title = "Comparez des tailles côte à côte et gardez l'image"
og_description = "Mettez deux adultes, un enfant, un tout-petit et une porte sur la même règle, en centimètres ou en pieds et pouces, et téléchargez le résultat. Sans compte, sans filigrane, et sans aucune liste de noms qui quitte votre machine."
og_image_alt = "Comparateur de tailles - comparer des tailles côte à côte, sans envoi"

pledge = """
    Un graphique de tailles, c'est de l'arithmétique et un dessin&nbsp;: il n'y a
    aucun fichier à envoyer ni aucun service à interroger. L'homme, la femme, le
    garçon et la fille sont des illustrations du domaine public livrées avec
    cette page&nbsp;; le tout-petit est construit ici à partir d'une table de
    proportions corporelles, et c'est pourquoi il a la forme d'un tout-petit et
    non d'un adulte en réduction. Chaque étape se déroule dans environ six cents
    lignes de JavaScript de cette page que vous pouvez lire. Il n'y a aucune
    fonction réseau d'aucune sorte, et cela compte ici parce que ce que vous
    tapez est une liste de personnes et la taille de chacune."""

live_hint = """
      Inutile de nous croire sur parole&nbsp;: ouvrez les DevTools, regardez
      l'onglet réseau et tapez un nom et une taille. Pas une requête n'en
      transporte un caractère. Ou débranchez internet et faites le graphique
      quand même."""

read_first = """
, <code>src/traced.js</code> et
      <code>vendor/</code> pour les quatre figures dessinées et l'origine de
      leurs illustrations, <code>src/figures.js</code> pour la table de
      proportions à partir de laquelle le tout-petit est construit,
      <code>src/units.js</code> pour la façon dont une taille tapée devient un
      nombre et dont la règle est graduée, <code>src/chart.js</code> pour la
      mise en page, et <code>src/save.js</code> pour les deux téléchargements
      &mdash; qui sont le SVG à l'écran, et ce même SVG peint sur un canvas."""

howto_heading = "Comment faire un graphique de comparaison de tailles"

