[[privacy]]
title = "Les PDF à convertir sont ceux qu’on peut le moins se permettre d’envoyer."
body = "Personne n’a besoin de convertir un tableau facile à retaper. Ici arrivent relevés, factures, fiches de paie et rapports : tous les bénéficiaires d’un paiement et ce qui restait après, les prix d’un client, les chiffres d’une entreprise. Confier cela à un serveur inconnu pour obtenir un tableur lui donne ces données, qu’il peut garder et qui en font une cible. Cette page n’a pas d’autre moitié : il n’y a nulle part où les envoyer."

[[privacy]]
title = "Un solde courant contrôle les variations nettes, avec des limites explicites."
body = "Repérer un tableau dans un PDF repose sur des déductions : les limites des colonnes et le regroupement des lignes peuvent être erronés. L’outil compare les montants entre deux soldes lisibles à leur différence. Il indique les comparaisons concordantes et les lignes non vérifiées, y compris avant le premier solde, après le dernier ou dans un intervalle illisible. Une concordance est un indice utile, pas la preuve que chaque valeur est correcte : des erreurs compensées peuvent passer. Sans solde reconnu, aucun contrôle n’est effectué."

[[privacy]]
title = "Les tableaux sont déduits de la page, sans modèle par banque ou formulaire."
body = "L’outil n’a aucune liste de banques ou de mises en page, donc aucun modèle absent. Une colonne de petits caractères à côté du contenu principal est séparée, puis chaque zone est examinée pour trouver des cellules alignées. Cela fonctionne pour un relevé d’une banque inconnue ou un rapport inédit, mais peut échouer si les colonnes se chevauchent réellement."

[[privacy]]
title = "Les mots de passe ne sont pas retirés ici ; la page indique où le faire."
body = "Un PDF protégé est refusé. Retirer sa protection est un autre travail que lire ses tableaux ; le faire silencieusement serait surprenant. La page propose des méthodes qui gardent le fichier sur votre machine : le <a href=\"../deverrouiller-un-pdf/\">déverrouilleur PDF</a> du site, qui retire le mot de passe dans votre navigateur sans réécrire les pages, ou une impression en PDF depuis le navigateur ou Aperçu. Elle indique aussi de ne confier le document à aucun autre site de déverrouillage &mdash; c’est précisément l’envoi qu’elle évite."

[[privacy]]
title = "Il ne peut pas lire une photographie de page et ne prétend pas le faire."
body = "Un scan est une image : ses lignes sont des pixels, sans texte à aligner. L’outil l’indique et propose des solutions sans envoi. Pour un relevé, la première est souvent oubliée : la banque fournit presque toujours directement le même document en CSV. Reconnaître les lettres d’une image relève de l’OCR, un autre outil."

[[privacy]]
title = "Ce que Google charge, et ce qu'on ne lui donne pas."
body = "Les scripts de publicité et de mesure proviennent de Google. Ils ne reçoivent rien sur votre document : ni fichier, ni tableau, ni ligne, ni nombre, ni nom, ni nombre de pages. Tout le code lisant un PDF ou écrivant un CSV est servi depuis cette origine et figure dans le dépôt."

[[privacy]]
title = "Ce que le bouton de don charge, et ce qu'on ne lui donne pas."
body = "Le bouton &laquo;&nbsp;Buy me a coffee&nbsp;&raquo; de l'en-tête est dessiné par un script de cdnjs.buymeacoffee.com et va chercher sa police chez Google Fonts. C'est un lien et rien de plus&nbsp;: il ne signale aucune visite, et on ne lui donne rien sur vous ni sur vos documents. Rien ne se produit tant que vous ne cliquez pas, et ce vers quoi vous cliquez alors est le site de quelqu'un d'autre."

[[privacy]]
title = "Cela fonctionne hors ligne."
body = "Déconnectez le réseau : tout sur cette page fonctionne encore. C’est la preuve la plus simple ; un outil qui envoyait votre document pour le convertir s’arrêterait."

[[howto]]
title = "Choisissez le PDF."
body = "Un fichier à la fois. Le navigateur lit directement toutes ses pages sur votre disque avant de décider : l’écriture 1.240,00 ou 1,240.00 et l’ordre des dates concernent le document entier, pas une page isolée."

[[howto]]
title = "Regardez les tableaux repérés."
body = "Chaque tableau de chaque page conserve ses colonnes et ses en-têtes, si la page en possède. Un tableau continuant dans deux sections ou sur deux pages avec les mêmes en-têtes est réuni sans répéter ceux-ci au milieu. Les cellules sur plusieurs lignes sont rassemblées. Totaux, sous-totaux et libellés restent des lignes à part entière."

[[howto]]
title = "Choisissez-en un ou prenez-les tous."
body = "S’il y a plusieurs tableaux, la commande au-dessus choisit lesquels mettre dans le CSV : tous à la suite ou un seul. Pour un solde courant, la ligne indique les comparaisons concordantes et les lignes non vérifiées. Les dates avec année deviennent YYYY-MM-DD et les montants des nombres signés simples ; une date sans année reste telle qu’imprimée, car son année serait une supposition."

[[howto]]
title = "Récupérez le CSV."
body = "Le fichier respecte RFC 4180 &mdash; guillemets corrects et fins de ligne CRLF &mdash; en UTF-8 avec marque d’ordre des octets, pour qu’Excel conserve les symboles monétaires. Si tous les tableaux sont réunis, chacun garde son en-tête et une ligne vide les sépare. Aucun fichier n’a été envoyé pour le produire."

[[faq]]
q = "Comment repère-t-il les tableaux alors qu’un PDF n’en contient pas ?"
a = "Grâce à la position du texte. Une colonne de petits caractères à côté du contenu est d’abord séparée : les cellules d’un tableau partagent exactement une ligne de base, contrairement aux annotations voisines. Chaque zone est parcourue de haut en bas, puis découpée aux titres et espaces. Les colonnes correspondent aux positions où plusieurs cellules commencent ou finissent ensemble. Les blocs ayant les mêmes colonnes sont réunis. Aucun modèle par banque ou formulaire n’est nécessaire."

[[faq]]
q = "Fonctionne-t-il uniquement avec les relevés bancaires ?"
a = "Non. Le convertisseur a été reconstruit pour repérer tous les tableaux : son premier vrai relevé contenait deux opérations et cinq autres tableaux, et une recherche limitée aux opérations ne trouvait rien. Factures, tarifs, horaires, résultats et rapports comportent les mêmes tableaux. Un relevé ajoute un solde courant ; lorsqu’il est lisible, l’outil compare les variations nettes entre soldes."

[[faq]]
q = "Que devient une description trop longue pour sa colonne ?"
a = "Elle est réunie à sa ligne, ce qui corrige un défaut courant des conversions PDF en CSV. Une ligne contenant une seule cellule de texte, proche d’une autre ligne, prolonge cette cellule. Elle rejoint celle du dessous si elle en est plus proche, comme un long libellé imprimé au-dessus de sa valeur. Une ligne à plusieurs cellules, ou contenant un nombre, reste indépendante."

[[faq]]
q = "Que m’indique le contrôle du solde courant ?"
a = "Il compare la somme des montants entre deux soldes lisibles à leur différence, puis compte les concordances. Les mêmes calculs repèrent les colonnes probables de solde et montant sans dépendre des en-têtes. La page liste les lignes non vérifiées : avant le premier solde, après le dernier ou dans des intervalles incomplets ou illisibles. Une cellule débit ou crédit inutilisée et vide vaut zéro ; une valeur illisible ne vaut pas zéro. Des soldes concordants n’excluent pas les erreurs compensées et ne vérifient ni descriptions ni dates. Comparez le CSV au PDF avant de vous y fier."

[[faq]]
q = "Mes dates sont inversées : 03/04 signifie le 4 mars, pas le 3 avril."
a = "Changez la commande au-dessus des tableaux : tout est recalculé immédiatement. L’outil résout les dates numériques ambiguës depuis le document, pas votre localisation. Un jour supérieur à douze suffit à établir l’ordre de toutes les dates, et la page l’indique. Si tous les jours sont inférieurs ou égaux à douze, elle explique <em>cette ambiguïté</em> et choisit le jour d’abord jusqu’à votre modification. Une date sans année, courante sur les relevés de carte, reste telle qu’imprimée."

[[faq]]
q = "Fonctionne-t-il sur un PDF numérisé ?"
a = "Non ; il l’explique au lieu de fournir un fichier vide. Un scan est une photographie, sans texte à aligner. La page propose alors d’autres méthodes. Pour un relevé, la première est souvent négligée : presque toutes les banques en ligne fournissent directement le même relevé en CSV, OFX ou QIF, sans conversion et plus précisément qu’une lecture d’image."

[[faq]]
q = "Peut-il ouvrir un PDF protégé par mot de passe&nbsp;?"
a = "Non, volontairement. Les banques verrouillent souvent les relevés avec une date de naissance ou des chiffres de compte. Retirer cette protection est un autre travail. L’outil refuse donc le fichier et propose des méthodes locales. La meilleure est le <a href=\"../deverrouiller-un-pdf/\">déverrouilleur PDF</a> du site : il retire le mot de passe dans votre navigateur sans modifier les pages, et préserve la position du texte. Imprimer depuis Chrome ou Edge en PDF ou exporter depuis Aperçu sur Mac fonctionne aussi. N’utilisez aucun autre site de déverrouillage &mdash; il recevrait exactement le document que cette page garde hors d’Internet."

[[faq]]
q = "Mon PDF est-il envoyé quelque part&nbsp;?"
a = "Non. Votre navigateur lit le fichier et écrit le CSV sur votre matériel. L’outil n’a pas de serveur, et la <code>Content-Security-Policy</code> nomme chaque adresse joignable &mdash; aucune n’appartient à ce site. Déconnectez Internet puis convertissez un PDF pour le vérifier."

[[faq]]
q = "Pourquoi un caractère étrange apparaît-il au début du CSV ?"
a = "C’est une marque d’ordre des octets, volontaire. Sans elle, Excel sur Windows utilise l’ancienne page de codes du système et peut remplacer les symboles euro ou livre par des lettres. La marque indique UTF-8. Les lecteurs usuels l’ignorent ; un analyseur très strict peut rendre le premier en-tête précédé d’un caractère invisible. C’est le compromis choisi."

[[faq]]
q = "Y a-t-il une limite de taille, et cela coûte-t-il quelque chose&nbsp;?"
a = "L’outil n’impose aucune limite. Votre machine fixe la capacité : le document est gardé en mémoire pendant sa lecture, et un portable traite généralement plusieurs centaines de pages. C’est gratuit, sans compte, connexion ou essai. La publicité finance le site et ne reçoit rien sur vos documents."

[[faq]]
q = "Est-ce que cela fonctionne hors ligne&nbsp;?"
a = "Oui. Chargez une fois la page, puis déconnectez Internet : elle continue de fonctionner. C’est aussi une preuve simple qu’aucun fichier n’est envoyé ; un convertisseur distant s’arrêterait aussitôt."

