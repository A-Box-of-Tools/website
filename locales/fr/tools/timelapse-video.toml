[[faq]]
q = "Ma vidéo est-elle envoyée quelque part&nbsp;?"
a = """
        Non. Votre propre navigateur la lit, la décode, choisit les images et les
        encode, sur votre propre matériel. Cet outil n'a pas de partie serveur,
        et la <code>Content-Security-Policy</code> de la page énumère toutes les
        adresses qu'elle peut contacter&nbsp;: aucune n'appartient à ce site. Si
        vous préférez vérifier plutôt qu'on vous le dise, coupez la connexion et
        faites un timelapse quand même."""

[[faq]]
q = "Que veut dire la vitesse, au juste&nbsp;?"
a = """
        Le rapport entre ce qui entre et ce qui sort. À 60&times;, une heure de
        rushes devient une minute, quelle que soit la cadence de lecture. En
        dessous, l'outil prend une image toutes les <em>vitesse &divide;
        cadence</em> secondes&nbsp;: 60&times; à 30 images par seconde, c'est une
        image toutes les deux secondes. La page vous montre cet intervalle avant
        de lancer, parce que c'est le nombre qui dit ce qui se passe
        réellement."""

[[faq]]
q = "Quels formats vidéo puis-je accélérer&nbsp;?"
a = """
        Les MP4, M4V et MOV sont lus directement, quel que soit leur
        contenu&nbsp;: H.264, HEVC, AV1 ou VP9, du moment que votre navigateur
        sait décoder ce codec. Tout le reste que votre navigateur sait lire, le
        WebM en premier lieu, est parcouru en amenant le lecteur sur chaque
        instant, ce qui marche avec tous les formats qu'il ouvre. Un fichier que
        le navigateur ne sait ni lire ni jouer, c'est-à-dire en pratique les AVI,
        WMV, FLV et la plupart des MKV, est refusé avec un message qui le dit,
        plutôt que d'échouer à mi-parcours. Ce qui sort est toujours un MP4."""

[[faq]]
q = "Pourquoi le timelapse n'a-t-il pas de son&nbsp;?"
a = """
        Parce qu'il n'y a rien à garder. Un son passé trente fois trop vite n'est
        ni de la parole ni de la musique, c'est un couinement&nbsp;; et
        l'inverse, garder l'audio à sa vitesse d'origine sous une image qui a
        filé devant, donnerait un autre clip que celui que vous avez demandé. La
        piste est donc abandonnée, ce qui explique aussi pour l'essentiel qu'une
        heure de vidéo tienne en quelques mégaoctets. Si c'est le son que vous
        vouliez, l'<a href="../modifier-un-audio/">Éditeur audio</a>
        l'enregistre."""

[[faq]]
q = "Est-ce plus rapide que de convertir la vidéo entière&nbsp;?"
a = """
        Beaucoup plus, et c'est tout l'intérêt de lire le fichier directement.
        Une image ne se décode qu'en partant de l'image clé qui la précède, mais
        rien n'oblige à garder celles du milieu&nbsp;: un timelapse à 60&times;
        d'une heure décode quelques milliers d'images au lieu de cent mille. Le
        récapitulatif dit exactement combien il en lira avant que vous n'appuyiez
        sur le bouton."""

[[faq]]
q = "Est-ce que cela coûte de la qualité&nbsp;?"
a = """
        Les images gardées sont encodées une seconde fois, ce qui coûte un peu.
        C'est inévitable&nbsp;: le clip fini les montre à des instants pour
        lesquels rien n'avait été encodé dans le fichier d'origine. Ce que cet
        outil dépense plus que les autres outils vidéo d'ici, c'est le débit, et
        c'est voulu&nbsp;: deux images séparées de deux secondes ont bien moins
        en commun que deux images séparées d'un trentième de seconde, donc le
        codec a moins à réutiliser, et un chiffre calibré pour des rushes
        ordinaires sortirait en gros carrés."""

[[faq]]
q = "Y a-t-il une limite de taille ou de durée&nbsp;?"
a = """
        Aucune limite n'est inscrite dans l'outil, et le fichier n'est pas non
        plus chargé en mémoire d'un bloc&nbsp;: seules de courtes portions autour
        de chaque instant sont lues. Le plafond réel, c'est le timelapse fini,
        assemblé en mémoire avant que vous le téléchargiez, et un timelapse est
        court par définition. Le récapitulatif montre à peu près ce qu'il pèsera
        avant de lancer."""

[[faq]]
q = "Puis-je n'accélérer qu'une partie du clip&nbsp;?"
a = """
        Pas ici. Cet outil prend tout, de la première image à la dernière.
        Découpez d'abord le passage voulu avec le
        <a href="../couper-une-video/">Découpeur de vidéos</a>, qui le fait sans
        réencoder une seule image, puis accélérez ce qui en sort."""

[[faq]]
q = "Est-ce gratuit, et faut-il un compte&nbsp;?"
a = """
        C'est gratuit, et il n'y a ni compte, ni inscription, ni période d'essai,
        ni filigrane. Le site est financé par la publicité, et on ne donne rien
        aux annonces sur votre vidéo."""

