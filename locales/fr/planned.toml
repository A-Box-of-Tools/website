#
# La liste des outils prévus, sur la feuille de route - French.
#
# Overrides for config/planned.toml. Only words: the group `id` stays as it is,
# because that is what a tool's roadmap_group matches on, and the order of the
# groups and of the items inside them is decided once, in English.
#
# Every group and every item has to be here. They are merged in order, so a
# missing entry would render in English in the middle of a French list with
# nothing on the page to say which one it was - the build refuses a list whose
# length has changed for exactly that reason.
#

note = "Pas encore construits. Ils figurent ici pour que vous voyiez où tout cela va."

[[group]]
id = "images"
name = "Images"
items = [
  ["Ajouter du texte", "sur l'image, ou dans un bandeau au-dessus"],
  ["AVIF", "le format qu'un seul navigateur sait écrire, et que les autres se contentent de lire"],
  ["Anonymiser un DICOM", "retirer le patient d'un examen sans toucher à l'image"],
]

[[group]]
id = "gif"
name = "GIF &amp; animation"
items = [
  ["GIF en MP4 ou WebM", "la même animation, en général au dixième du poids"],
  ["Modifier un GIF", "redimensionner, recadrer, faire pivoter, inverser ou changer la vitesse"],
  ["WebP animé", "la même animation pour une fraction du poids &mdash; et le seul ici qui exige un encodeur embarqué"],
]

[[group]]
id = "video"
name = "Vidéo"
items = [
  ["Redimensionner", "jusqu'à une taille qui passera vraiment"],
  ["Faire pivoter", "pour le clip filmé de travers, sans décoder une seule image"],
  ["Couper le son d'une vidéo", "retirer le son sans toucher à l'image"],
  ["Convertir en MP4", "ce qui est sorti de la caméra, sous la forme qui passera vraiment"],
  ["Incruster des sous-titres", "un fichier SRT dessiné dans l'image"],
  ["Convertir des sous-titres", "SRT, VTT, ASS, SBV et LRC dans tous les sens, et des minutages que l'on peut décaler"],
]

[[group]]
id = "audio"
name = "Audio"
items = [
  ["Convertir le format", "MP3, WAV et Opus, dans tous les sens"],
]

[[group]]
id = "documents"
name = "Documents &amp; PDF"
items = [
  ["Faire pivoter &amp; recadrer des pages", "redresser un scan couché, ou rogner ses marges"],
  ["Extraire les images", "ressortir les images d'un document"],
  ["Caviarder un PDF", "retirer les mots, au lieu de peindre un rectangle noir par-dessus"],
]

[[group]]
id = "beyond"
name = "Au-delà des médias"
items = [
  ["CSV &amp; JSON", "convertir dans les deux sens, et remettre d'aplomb ce que le tableur a exporté"],
  ["Certificats &amp; clés", "lire un certificat ou une demande de signature sans la coller dans le serveur de quelqu'un d'autre"],
]
