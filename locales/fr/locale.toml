tools_note = "Tous gratuits, tous dans votre navigateur, aucun n'envoie quoi que ce soit."
lede = "Soit l'adresse contient une faute de frappe, soit ce qui s'y trouvait a déménagé. Il n'est rien arrivé à votre fichier et rien n'a été perdu, ce site n'ayant jamais rien détenu de vous qu'il puisse perdre."

