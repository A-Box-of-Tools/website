[hub]
privacy_heading = "Vos fichiers restent les vôtres."
privacy_lede = "Les outils traitent vos fichiers sur votre appareil. Après une première ouverture, ils continuent de fonctionner hors ligne."
support_heading = "Des outils gratuits, grâce à votre soutien."
title = "Outils en ligne gratuits, sans envoi ni inscription | abox.tools"
description = "Des outils gratuits qui n'envoient jamais vos fichiers. Réunir des images en PDF ou en MP4, compresser une image à la taille voulue, recadrer une vidéo."
heading = "Outils gratuits. Fichiers privés."
og_title = "A Box of Tools &mdash; des outils qui ne passent jamais par un serveur"
og_description = "De petits outils à usage unique qui travaillent entièrement dans votre navigateur. Vos fichiers ne quittent pas votre machine."
og_image_alt = "abox.tools - des outils qui ne passent jamais par un serveur"
schema_description = "De petits outils à usage unique qui font tout leur travail dans votre navigateur. Rien n'est envoyé et aucun compte n'est nécessaire."
schema_about = "Des utilitaires de fichiers qui s'exécutent dans le navigateur et traitent les fichiers en local, sans jamais les envoyer"
lede = "Tout se fait dans votre navigateur. Aucun envoi, aucun compte."
support_note = "Ces outils sont gratuits et le resteront. Si l'un d'eux vous a épargné une corvée, voici la seule chose, sur tout ce site, qui vous demande quelque chose."

[[hub.guarantees]]
title = "Vos fichiers ne quittent jamais votre machine"
body = "C'est votre navigateur qui les ouvre, les lit et les traite, sur votre propre matériel. La <code>Content-Security-Policy</code> de chaque outil énumère toutes les adresses qu'il a le droit de contacter, et aucune ne nous appartient."

[[hub.guarantees]]
title = "Aucune information sur vos fichiers n'est transmise"
body = "Ni le fichier, ni une vignette, ni son nom, ni sa taille, ni le nombre que vous avez choisi. Aucun outil d'ici n'en dit quoi que ce soit, et il n'y a de toute façon, à l'autre bout, aucun serveur pour l'entendre."

[[hub.guarantees]]
title = "Tout fonctionne hors ligne"
body = "Ouvrez un outil une fois, coupez votre connexion, et il continue de travailler sur vos fichiers exactement comme avant. La démonstration est difficile à truquer, puisqu'un outil qui expédierait vos fichiers ailleurs pour les traiter s'arrêterait net."

[[hub.categories]]
id = "images"
name = "Images"
short_name = "Images"
note = "La réduire, la redimensionner ou lui retirer ce qu'elle raconte de vous sans le dire. Rien de tout cela n'est envoyé ailleurs."

[[hub.categories]]
id = "video-and-animation"
name = "Vidéo &amp; animation"
short_name = "Vidéo &amp; GIF"
note = "La couper, la convertir ou la fabriquer à partir de photos, sans que les rushes quittent votre machine."

[[hub.categories]]
id = "documents-and-audio"
name = "Documents &amp; audio"
short_name = "PDF &amp; audio"
note = "Réorganiser un document ou couper un enregistrement, sans envoyer ni l'un ni l'autre se faire traiter ailleurs."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Texte, codes &amp; mots de passe"
short_name = "Texte &amp; codes"
note = "Le lire, le vérifier ou le fabriquer ici. Aucun jeton, aucun fichier de configuration et aucun mot de passe sur le serveur d'un inconnu."

[guides]
nav = "Tous les guides"
title = "Guides&nbsp;: comment faire, et ce que chaque choix coûte"
description = "Des guides pour compresser, redimensionner, recadrer, couper et convertir ses fichiers&nbsp;: ce que veulent dire les réglages, ce qu'ils coûtent, et pourquoi aucun envoi n'est nécessaire."
heading = "Guides"
lede = "Un guide par outil, écrit pour qui s'est vu imposer une taille ou un format et aimerait savoir ce que fait vraiment le réglage qu'il s'apprête à déplacer. Tout ce qui est décrit ici se passe sur votre propre machine."
og_title = "Les guides d'abox.tools"
og_description = "Compresser, redimensionner, recadrer, couper et convertir ses fichiers, et ce que chaque réglage coûte. Sans le moindre envoi."
