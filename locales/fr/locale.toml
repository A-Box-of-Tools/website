[roadmap]
nav = "Feuille de route"
title = "Feuille de route&nbsp;: ce qu'abox.tools construit ensuite"
description = "Tous les outils prévus pour abox.tools, groupés et à découvert, avec ceux qui sont déjà finis. Tous s'exécutent dans le navigateur et n'envoient rien."
heading = "Ce qui arrive ensuite"
lede = "Tout ce qui figure sur les deux listes ci-dessous travaille dans votre navigateur et n'envoie rien, car c'est la condition qu'un nom doit remplir pour y entrer. Aucun de ces nombres n'est écrit à la main&nbsp;: la compilation les relève elle-même sur les deux listes."
intro_heading = "Comment cette liste a été établie"
intro = "<p> Ce n'est pas une liste de souhaits. Elle a été dressée en dépouillant le catalogue du plus grand site de GIF et de vidéo en ligne, ce qui se rapproche le plus d'un inventaire de ce que les gens veulent réellement faire à un fichier, puis en gardant chaque entrée réalisable de telle sorte que le travail se fasse sur votre propre machine et continue de se faire une fois le réseau débranché. </p> <p> L'essentiel de ce qui a survécu repose sur des interfaces que le navigateur fournit déjà. Quelques entrées réclament un codec embarqué dans le seul outil qui l'utilise, ce qui reste permis, puisque le fichier ne quitte toujours pas la machine. Ce qui ne franchissait pas cette barre a été écarté plutôt que promis, si bien que certains des manques évidents ci-dessous sont voulus. </p> <p> Les outils qui existent déjà figurent en haut de leur groupe, marqués <em>Terminé</em> et reliés à leur propre page. Tout ce qui se trouve en dessous reste à venir, et rien n'y devient un lien avant de l'être. </p>"
planned_heading = "Chaque type de fichier, et ce qu'on peut en faire"
og_title = "La feuille de route d'abox.tools"
og_description = "Ce qui est fait, et ce qui arrive ensuite. Tout s'exécute dans le navigateur et n'envoie rien."
og_image_alt = "abox.tools - des outils qui ne passent jamais par un serveur"

