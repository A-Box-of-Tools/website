dlp_note = "<strong>Si le logiciel de sécurité de votre employeur signale un envoi.</strong> Il surveille le moment où un fichier est choisi dans un navigateur, et il ne peut pas savoir si la page compte l'envoyer &mdash; il alerte donc au choix. Rien n'est envoyé ici : ouvrez les outils de développement, allez dans Réseau, et choisissez un fichier. Aucune requête ne le transporte, et aucune requête du tout hormis l'aperçu local de la page. C'est la vérification que votre service informatique peut faire en trente secondes."

[ui.feedback]
prompt = "Est-ce que ça a marché&nbsp;?"
up = "Oui"
down = "Non"
dismiss = "Fermer"
reason_prompt = "Qu'est-ce qui n'a pas marché&nbsp;?"
reason_wrong = "Mauvais résultat"
reason_failed = "N'a pas abouti"
reason_slow = "Trop lent"
reason_confusing = "Peu clair"
thanks = "Merci &mdash; c'est utile."
note = "Seule la réponse est envoyée, et seulement quand vous cliquez. Jamais votre fichier, ni son nom, ni quoi que ce soit à son sujet."

[ui.guide]
open_tool = "Ouvrir {{ tool.name | e }}"

[ui.picker]
warning = "<strong>C'est la seule fonction de la page qui touche au réseau.</strong> Aller chercher une adresse révèle au serveur concerné votre adresse IP et lui apprend quelle {{ tool.picker.urls.noun }} vous réclamez. Le fichier reçu est recopié en mémoire locale dès son arrivée et n'est jamais redemandé. Rien de vous ne sort d'ici, et cette page reste tout aussi incapable d'envoyer quoi que ce soit."
label = "Une adresse par ligne"
note = "Le serveur d'en face doit autoriser l'usage multi-origine de ses {{ tool.picker.urls.noun }}s. Beaucoup ne le font pas, auquel cas vous aurez un message d'erreur plutôt qu'une panne silencieuse plus tard."
