[hub]
title = "Outils de navigateur gratuits &mdash; traitement local | abox.tools"
description = "Outils gratuits traitant vos fichiers dans le navigateur : images en PDF ou MP4, compression vers une taille cible, recadrage vidéo, suppression EXIF."
heading = "Outils gratuits. Traitement local."
og_title = "A Box of Tools &mdash; traitement local dans le navigateur"
og_description = "De petits outils traitent les fichiers sur votre appareil. Le partage volontaire et les fonctions en ligne facultatives sont expliqués là où ils apparaissent."
og_image_alt = "abox.tools - outils de navigateur pour le traitement local des fichiers"
schema_description = "Utilitaires de navigateur pour traiter les fichiers localement, sans envoi pour traitement ni compte. Les fonctions réseau sont expliquées sur leurs pages."
schema_about = "Utilitaires de navigateur pour le traitement local et le partage volontaire entre navigateurs"
lede = "Traitez vos fichiers dans le navigateur. Aucun envoi pour traitement, aucun compte."
support_note = "Ces outils sont gratuits et le resteront. Si l'un d'eux vous a épargné une corvée, voici la seule chose, sur tout ce site, qui vous demande quelque chose."

privacy_heading = "Vos fichiers restent les vôtres."

privacy_lede = "Le traitement local fonctionne hors ligne une fois l’outil enregistré. Récupérer et partager du contenu nécessite une connexion."

support_heading = "Des outils gratuits, grâce à votre soutien."

[[hub.guarantees]]
title = "Vos fichiers sont traités sur votre appareil"
body = "Votre navigateur ouvre, lit et modifie les fichiers choisis. Aucun envoi pour traitement. Partager du texte et des fichiers et Caméra distante transmettent volontairement du contenu à un autre navigateur ; leurs pages expliquent la connexion."

[[hub.guarantees]]
title = "Vos fichiers ne sont pas transmis aux statistiques"
body = "Les visites et les réponses fixes aux avis facultatifs sont comptées. Ni votre fichier, ni son nom, sa taille ou son contenu ne leur sont transmis. Les imports d’images et les demandes de taux de change des reçus expliquent leurs données près des commandes."

[[hub.guarantees]]
title = "Le traitement local fonctionne hors ligne"
body = "Attendez que l’indicateur hors ligne signale que l’outil est prêt, puis déconnectez-vous et utilisez des fichiers de votre appareil. Récupérer une image web, demander un taux en ligne et connecter deux navigateurs nécessitent un réseau."

