#
# Français.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# Nothing structural is repeated here - no list of which tools exist, no
# category ids, no ordering, no Content-Security-Policy. See buildlib/i18n.py.
#
# Typography follows the French rules the rest of this locale already used and
# this file did not: &nbsp; before : ; ! ?, and &laquo;&nbsp;...&nbsp;&raquo;
# around a quoted UI label. Headings capitalise the first word only.
#

lang = "fr"
name = "French"
endonym = "Français"

complete = true

#
# ---------------------------------------------------------------------------
# The addresses.
#
# Keyed by the ENGLISH slug, which is the name of the thing. The French is an
# address and appears only on the right.
#
# Written as the infinitive verb phrase a French speaker types - "compresser
# une image" - because that is how the search is phrased in French, where an
# English speaker would type the bare noun phrase. The articles are kept:
# "compresser-image" is the sort of French nobody writes and nobody searches.
#
# Unaccented, and only here. Accents survive a modern URL bar and do not
# survive being pasted around, so addresses drop them; the prose below does
# not.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "compresser-une-image"
"compress-pdf" = "compresser-un-pdf"
"crop-video" = "recadrer-une-video"
"edit-audio" = "modifier-un-audio"
# Nobody searches for an "éditeur EXIF" in French; they search for how to get
# the data out of a photo.
"exif-editor" = "supprimer-les-donnees-exif"
# "Caviarder" est le mot exact, et c'est celui qui porte la distinction
# dont vit la page : supprimer plutot que recouvrir.
"redact-image" = "caviarder-une-image"
"images-to-pdf" = "images-en-pdf"
"images-to-video" = "images-en-video"
"resize-image" = "redimensionner-une-image"
"trim-video" = "couper-une-video"
# Named for the job rather than for the format, like the EXIF tool above:
# hardly anyone types "image en ICO", and a great many people type "créer un
# favicon".
"image-to-ico" = "creer-un-favicon"
# The article drops out where the two format names carry the phrase. "Convertir
# SVG en PNG" is what gets typed, and "convertir-un-svg-en-une-png" is not
# French anybody writes - the formats behave like proper nouns here.
"svg-to-image" = "convertir-svg-en-png"
"heic-to-jpg" = "convertir-heic-en-jpg"
# The same shape as "images-en-pdf" and "images-en-video" above: a conversion
# named by its two ends.
"video-to-gif" = "video-en-gif"
# L'anglicisme, parce que c'est ce qui se tape : "acceleration" ou
# "hyperlapse" ne sont pas ce que cherche quelqu'un qui veut cet outil.
"timelapse-video" = "faire-un-timelapse"
"image-to-data-uri" = "image-en-base64"
# The one tool here named by a noun rather than by a verb, because that is the
# phrase: "générateur de QR code" is what French speakers type, in a way that
# "créer un QR code" - which is the GUIDE below - is not. The barcodes are left
# out of the address and carried by the page title; QR is what the search is
# about, and a slug naming both would be too long to read in a URL bar.
"qr-barcode" = "generateur-de-qr-code"
"gif-analyzer" = "analyser-un-gif"
"gif-maker" = "creer-un-gif"
"grab-frame" = "extraire-une-image-d-une-video"
"id-photo" = "photo-d-identite"
"merge-pdf" = "fusionner-des-pdf"
"reverse-video" = "inverser-une-video"
"split-gif" = "decouper-un-gif-en-images"
"format-json" = "formater-du-json"
"encode-text" = "encoder-base64"
"compare-text" = "comparer-des-textes"
"trim-audio" = "couper-un-audio"
# Un nom, comme le générateur de QR code au-dessus, et pour la même raison :
# c'est la formule qui se tape. Le singulier, parce que la recherche est
# faite par quelqu'un qui en veut un.
"password-generator" = "generateur-de-mot-de-passe"
# Un nom, comme "generateur-de-qr-code" plus haut, et pour la même raison :
# "lecteur de QR code" est la formule qui se tape. Les codes-barres restent
# hors de l'adresse, portés par le titre de la page.
"qr-barcode-reader" = "lecteur-de-qr-code"
"hash-checksum" = "verifier-une-somme-de-controle"
"share-text" = "partager-du-texte"

"guides" = "guides"
"roadmap" = "feuille-de-route"
"privacy" = "confidentialite"
"terms" = "conditions-d-utilisation"

"guides/compress-an-image-to-a-target-size" = "guides/compresser-une-image-a-une-taille-precise"
"guides/resize-an-image" = "guides/redimensionner-une-image"
"guides/remove-exif-and-gps-data" = "guides/supprimer-les-donnees-exif-et-gps"
"guides/redact-an-image" = "guides/caviarder-une-image"
"guides/make-a-pdf-smaller" = "guides/reduire-la-taille-d-un-pdf"
"guides/combine-images-into-a-pdf" = "guides/reunir-des-images-dans-un-pdf"
"guides/turn-images-into-a-video" = "guides/transformer-des-images-en-video"
"guides/trim-a-video" = "guides/couper-une-video"
"guides/crop-a-video" = "guides/recadrer-une-video"
"guides/is-it-safe-to-upload-files" = "guides/est-il-sur-d-envoyer-ses-fichiers"
# "Son favicon" rather than "un favicon", which is the tool's address just
# above: the guide is the long way round and the possessive says so, and two
# addresses one word apart would be a coin toss for whoever pastes one.
"guides/make-a-favicon" = "guides/creer-son-favicon"
# The guides keep the article the tool slugs drop, because a question is asked
# in full sentences even when a search box is not.
"guides/convert-an-svg-to-png" = "guides/convertir-un-svg-en-png"
"guides/convert-heic-to-jpg" = "guides/convertir-un-heic-en-jpg"
"guides/turn-a-video-into-a-gif" = "guides/transformer-une-video-en-gif"
"guides/embed-an-image-in-css" = "guides/integrer-une-image-dans-le-css"
"guides/make-a-qr-code" = "guides/creer-un-qr-code"
"guides/format-json-without-uploading-it" = "guides/formater-du-json"
"guides/share-text-between-devices" = "guides/partager-du-texte-entre-appareils"
"guides/grab-a-frame-from-a-video" = "guides/extraire-une-image-d-une-video"
"guides/make-a-gif-from-images" = "guides/creer-un-gif-a-partir-d-images"
"guides/make-a-passport-photo" = "guides/faire-une-photo-d-identite"
"guides/merge-and-split-pdf-files" = "guides/fusionner-et-diviser-des-pdf"
"guides/reverse-a-video" = "guides/inverser-une-video"
"guides/split-a-gif-into-frames" = "guides/decouper-un-gif-en-images"
"guides/trim-an-audio-file" = "guides/couper-un-fichier-audio"
"guides/whats-inside-a-gif" = "guides/ce-qu-il-y-a-dans-un-gif"
"guides/verify-a-file-checksum" = "guides/verifier-la-somme-de-controle-d-un-telechargement"

# Les quatre pages arrivees apres cette liste. Toujours la locution verbale a
# l'infinitif que l'on tape reellement, et "visionneuse" plutot que "viewer"
# parce que c'est le mot que le milieu medical emploie en francais.
"dicom-viewer" = "visionneuse-dicom"
"document-scanner" = "scanner-un-document"
"redact-pdf" = "caviarder-un-pdf"
"stack-images" = "empiler-des-images"
"guides/open-a-dicom-file" = "guides/ouvrir-un-fichier-dicom"
"guides/redact-a-pdf" = "guides/caviarder-un-pdf"
"guides/scan-a-document-with-your-phone" = "guides/scanner-un-document-avec-son-telephone"
"guides/stack-photos-to-reduce-noise" = "guides/empiler-des-photos-contre-le-bruit"
"guides/make-a-gif-from-part-of-a-video" = "guides/gif-a-partir-d-un-extrait-video"
"guides/make-a-boomerang-video" = "guides/faire-une-video-boomerang"
"guides/scan-multiple-pages-into-one-pdf" = "guides/scanner-plusieurs-pages-en-un-pdf"
"guides/get-photos-ready-for-the-web" = "guides/preparer-des-photos-pour-le-web"
"guides/compare-two-json-files" = "guides/comparer-deux-fichiers-json"
"guides/turn-a-long-video-into-a-timelapse" = "guides/transformer-une-longue-video-en-timelapse"
"guides/make-a-video-thumbnail" = "guides/creer-une-miniature-de-video"
"guides/edit-a-gif-frame-by-frame" = "guides/modifier-un-gif-image-par-image"
"guides/make-a-qr-code-and-prove-it-scans" = "guides/creer-un-code-qr-et-prouver-qu-il-se-scanne"
"guides/clean-up-a-voice-memo" = "guides/nettoyer-un-memo-vocal"
"guides/is-it-safe-to-scan-a-qr-code" = "guides/est-il-sur-de-scanner-un-qr-code"
"guides/is-it-safe-to-upload-a-photo-of-your-id" = "guides/est-il-sur-d-envoyer-sa-piece-d-identite"
