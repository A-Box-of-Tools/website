dlp_note = "<strong>Si le logiciel de sécurité de votre employeur signale un envoi.</strong> Une alerte lors du choix d’un fichier ne prouve pas son transfert. Pour une opération locale, examinez les adresses et les données des requêtes dans l’onglet Réseau et comparez-les au code de cette page. Les récupérations facultatives et les partages volontaires sont expliqués séparément. Votre service informatique peut effectuer la même vérification."

