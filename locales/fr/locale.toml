#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Outils en ligne gratuits, sans envoi ni inscription | abox.tools"
# Sous 155 caractères, comme en anglais : Google coupe une description à peu
# près là, et la fin est ici la partie qui vend le site.
description = "Des outils gratuits qui n'envoient jamais vos fichiers. Réunir des images en PDF ou en MP4, compresser une image à la taille voulue, recadrer une vidéo."
heading = "Des outils qui ne passent jamais par un serveur"
og_title = "A Box of Tools &mdash; des outils qui ne passent jamais par un serveur"
og_description = "De petits outils à usage unique qui travaillent entièrement dans votre navigateur. Vos fichiers ne quittent pas votre machine."
og_image_alt = "abox.tools - des outils qui ne passent jamais par un serveur"
schema_description = "De petits outils à usage unique qui font tout leur travail dans votre navigateur. Rien n'est envoyé et aucun compte n'est nécessaire."
schema_about = "Des utilitaires de fichiers qui s'exécutent dans le navigateur et traitent les fichiers en local, sans jamais les envoyer"

lede = """
    De petits outils à usage unique qui font tout leur travail dans votre
    navigateur. Vos fichiers restent sur votre machine, car il n'y a rien à
    envoyer, aucun compte à créer et rien qui vous suive."""

support_note = """
      Ces outils sont gratuits et le resteront. Si l'un d'eux vous a épargné une
      corvée, voici la seule chose, sur tout ce site, qui vous demande quelque
      chose."""

# Trois faits vérifiables plutôt qu'une promesse, comme en anglais.
[[hub.guarantees]]
title = "Vos fichiers ne quittent jamais votre machine"
body = """
        C'est votre navigateur qui les ouvre, les lit et les traite, sur votre
        propre matériel. La <code>Content-Security-Policy</code> de chaque outil
        énumère toutes les adresses qu'il a le droit de contacter, et aucune ne
        nous appartient."""

[[hub.guarantees]]
title = "Aucune information sur vos fichiers n'est transmise"
body = """
        Ni le fichier, ni une vignette, ni son nom, ni sa taille, ni le nombre
        que vous avez choisi. Aucun outil d'ici n'en dit quoi que ce soit, et il
        n'y a de toute façon, à l'autre bout, aucun serveur pour l'entendre."""

[[hub.guarantees]]
title = "Tout fonctionne hors ligne"
body = """
        Ouvrez un outil une fois, coupez votre connexion, et il continue de
        travailler sur vos fichiers exactement comme avant. La démonstration est
        difficile à truquer, puisqu'un outil qui expédierait vos fichiers
        ailleurs pour les traiter s'arrêterait net."""

[[hub.categories]]
id = "images"
name = "Images"
note = "La réduire, la redimensionner ou lui retirer ce qu'elle raconte de vous sans le dire. Rien de tout cela n'est envoyé ailleurs."

[[hub.categories]]
id = "video-and-animation"
name = "Vidéo &amp; animation"
note = "La couper, la convertir ou la fabriquer à partir de photos, sans que les rushes quittent votre machine."

[[hub.categories]]
id = "documents-and-audio"
name = "Documents &amp; audio"
note = "Réorganiser un document ou couper un enregistrement, sans envoyer ni l'un ni l'autre se faire traiter ailleurs."

[[hub.categories]]
id = "text-codes-and-passwords"
name = "Texte, codes &amp; mots de passe"
note = "Le lire, le vérifier ou le fabriquer ici. Aucun jeton, aucun fichier de configuration et aucun mot de passe sur le serveur d'un inconnu."

