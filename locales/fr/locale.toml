#
# Français.
#
# The frame: the hub, the guides index, the roadmap, the 404, the footer, and
# the words the templates themselves use. Tools and guides are translated in
# tools/ and pages/ beside this file.
#
# Nothing structural is repeated here - no list of which tools exist, no
# category ids, no ordering, no Content-Security-Policy. See buildlib/i18n.py.
#

lang = "fr"
name = "French"
endonym = "Français"

complete = false

#
# ---------------------------------------------------------------------------
# The addresses.
#
# Keyed by the ENGLISH slug, which is the name of the thing. The French is an
# address and appears only on the right.
#
# Written as the infinitive verb phrase a French speaker types - "compresser
# une image" - because that is how the search is phrased in French, where an
# English speaker would type the bare noun phrase. The articles are kept:
# "compresser-image" is the sort of French nobody writes and nobody searches.
#
# Unaccented, and only here. Accents survive a modern URL bar and do not
# survive being pasted around, so addresses drop them; the prose below does
# not.
# ---------------------------------------------------------------------------
#

[slugs]
"compress-image" = "compresser-une-image"
"compress-pdf" = "compresser-un-pdf"
"crop-video" = "recadrer-une-video"
"edit-audio" = "modifier-un-audio"
# Nobody searches for an "éditeur EXIF" in French; they search for how to get
# the data out of a photo.
"exif-editor" = "supprimer-les-donnees-exif"
"images-to-pdf" = "images-en-pdf"
"images-to-video" = "images-en-video"
"resize-image" = "redimensionner-une-image"
"trim-video" = "couper-une-video"

"guides" = "guides"
"roadmap" = "feuille-de-route"
"privacy" = "confidentialite"
"terms" = "conditions-d-utilisation"

"guides/compress-an-image-to-a-target-size" = "guides/compresser-une-image-a-une-taille-precise"
"guides/resize-an-image" = "guides/redimensionner-une-image"
"guides/remove-exif-and-gps-data" = "guides/supprimer-les-donnees-exif-et-gps"
"guides/make-a-pdf-smaller" = "guides/reduire-la-taille-d-un-pdf"
"guides/combine-images-into-a-pdf" = "guides/reunir-des-images-dans-un-pdf"
"guides/turn-images-into-a-video" = "guides/transformer-des-images-en-video"
"guides/trim-a-video" = "guides/couper-une-video"
"guides/crop-a-video" = "guides/recadrer-une-video"
"guides/is-it-safe-to-upload-files" = "guides/est-il-sur-d-envoyer-ses-fichiers"

#
# ---------------------------------------------------------------------------
# The hub.
# ---------------------------------------------------------------------------
#

[hub]
title = "Outils en ligne gratuits &mdash; sans envoi, sans compte | abox.tools"
# Sous 155 caractères, comme en anglais : Google coupe une description à peu
# près là, et la fin est ici la partie qui vend le site.
description = "Des outils gratuits qui n'envoient jamais vos fichiers. Réunir des images en PDF ou en MP4, compresser une image à une taille précise, recadrer une vidéo."
heading = "Des outils qui ne touchent jamais un serveur"
og_title = "A Box of Tools &mdash; des outils qui ne touchent jamais un serveur"
og_description = "De petits outils à usage unique qui fonctionnent entièrement dans votre navigateur. Vos fichiers ne quittent pas votre machine."
og_image_alt = "abox.tools - des outils qui ne touchent jamais un serveur"
schema_description = "De petits outils à usage unique qui font tout leur travail dans votre navigateur. Rien n'est envoyé et aucun compte n'est nécessaire."
schema_about = "Des utilitaires de fichiers qui s'exécutent dans le navigateur et traitent les fichiers localement, sans les envoyer"

lede = """
    De petits outils à usage unique qui font tout leur travail dans votre
    navigateur. Vos fichiers restent sur votre machine : il n'y a rien à
    envoyer, aucun compte à créer et rien qui vous suive."""

support_note = """
      Ces outils sont gratuits et le resteront. Si l'un d'eux vous a évité du
      travail, c'est la seule chose sur ce site qui vous demande quoi que ce
      soit."""

# Trois faits vérifiables plutôt qu'une promesse, comme en anglais.
[[hub.guarantees]]
title = "Vos fichiers ne quittent jamais votre machine"
body = """
        Ils sont ouverts, lus et traités par votre propre navigateur, sur votre
        propre matériel. La <code>Content-Security-Policy</code> de chaque outil
        nomme toutes les adresses qu'il peut contacter, et aucune ne nous
        appartient."""

[[hub.guarantees]]
title = "Rien de vos fichiers n'est transmis"
body = """
        Ni le fichier, ni une vignette, ni le nom, la taille ou le nombre que
        vous avez choisi. Aucun outil ici n'en communique quoi que ce soit. Il
        n'y a, à l'autre bout, aucun serveur pour le lire."""

[[hub.guarantees]]
title = "Cela fonctionne hors ligne"
body = """
        Ouvrez un outil une fois, coupez votre connexion, et il continue de
        travailler sur vos fichiers exactement comme avant. C'est difficile à
        simuler : un outil qui enverrait vos fichiers ailleurs pour les traiter
        s'arrêterait tout simplement."""

