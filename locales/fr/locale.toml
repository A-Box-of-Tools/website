#
# ---------------------------------------------------------------------------
# The roadmap. Only the frame - the list itself is config/planned.toml, which
# has no locale file yet and is therefore still English on this page.
# ---------------------------------------------------------------------------
#

[roadmap]
nav = "Feuille de route"
title = "Feuille de route &mdash; ce qu'abox.tools construit ensuite"
description = "Tous les outils prévus pour abox.tools, groupés et à découvert, avec ceux qui sont déjà finis. Tous s'exécutent dans le navigateur et n'envoient rien."
heading = "Ce qui arrive ensuite"
lede = """
    Tout ce qui figure sur les deux listes ci-dessous fait son travail dans
    votre navigateur et n'envoie rien &mdash; c'est la règle qu'un nom doit
    passer avant même d'y entrer. Les nombres ne sont écrits nulle part ; la
    compilation les compte sur les listes elles-mêmes."""

intro_heading = "Comment cette liste a été établie"
intro = """
    <p>
      Ce n'est pas une liste de souhaits. Elle a été établie en parcourant le
      catalogue d'outils du plus grand site de GIF et de vidéo en ligne &mdash;
      ce qui se rapproche le plus d'un inventaire de ce que les gens veulent
      réellement faire à un fichier &mdash; et en gardant chaque entrée qui
      peut être construite de sorte que le travail se fasse sur votre propre
      machine et continue de se faire une fois le réseau débranché.
    </p>
    <p>
      L'essentiel de ce qui a survécu repose sur des interfaces que le
      navigateur fournit déjà. Quelques-unes demandent un codec embarqué dans
      le seul outil qui l'utilise, ce qui est permis &mdash; le fichier ne
      quitte toujours pas la machine. Ce qui ne franchissait pas cette barre a
      été écarté plutôt que promis, si bien que certains des manques évidents
      ci-dessous sont voulus.
    </p>
    <p>
      Les outils qui existent déjà figurent en haut de leur groupe, marqués
      <em>Terminé</em> et reliés à leur propre page. Tout ce qui se trouve en
      dessous reste à venir, et rien n'est un lien tant que ce n'est pas le
      cas.
    </p>"""

planned_heading = "Chaque type de fichier, et ce qu'on peut en faire"

og_title = "La feuille de route d'abox.tools"
og_description = "Ce qui est fait, et ce qui arrive ensuite. Tout s'exécute dans le navigateur et n'envoie rien."
og_image_alt = "abox.tools - des outils qui ne touchent jamais un serveur"

