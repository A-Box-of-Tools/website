lede = "Montrez à quelqu'un le site que vous utilisez tout en en gardant le contrôle. Votre navigateur capture un onglet choisi et envoie son image animée au spectateur. Direct utilise un réseau local accessible ; Cloud relay est une option explicite qui transmet la vidéo chiffrée via Cloudflare. Invitez par lien ou découverte à proximité, puis approuvez le spectateur avant l'envoi de vidéo."
