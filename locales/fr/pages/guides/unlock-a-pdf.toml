title = "Comment déverrouiller un PDF&nbsp;: mot de passe ou restrictions"
description = "Un PDF qui refuse l’impression et un PDF qui refuse de s’ouvrir sont deux problèmes différents portant le même nom. Ce que chacun signifie, pourquoi l’un se retire en un clic tandis que l’autre ne peut pas être retiré sans son mot de passe, et comment les distinguer."
heading = "Comment déverrouiller un PDF, et reconnaître son type de verrouillage"
lede = "&laquo;&nbsp;Protégé&nbsp;&raquo; recouvre deux choses complètement différentes. L’une est un mot de passe qui bloque réellement l’accès. L’autre est une note dans le fichier demandant au lecteur de ne pas l’imprimer, demande que ce lecteur a accepté de respecter. Les distinguer prend une seconde et détermine toute la suite."
