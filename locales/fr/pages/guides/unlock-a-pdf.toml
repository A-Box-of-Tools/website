og_description = "Pourquoi la plupart des PDF &laquo;&nbsp;protégés&nbsp;&raquo; n’exigent aucun mot de passe, pourquoi un mot de passe d’ouverture perdu reste réellement perdu, et comment reconnaître le type de fichier que vous avez."
