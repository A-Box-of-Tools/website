title = "Comment voir la caméra d’un autre appareil dans le navigateur"
description = "Réutilisez un téléphone pour les animaux, l’entrée ou une inspection de bricolage. Approuvez le spectateur et utilisez Direct sur un réseau local accessible ou un Cloud relay chiffré facultatif."
heading = "Voir une caméra depuis un autre appareil"
lede = "Donnez une seconde fonction à un ancien téléphone : voir un animal, surveiller une entrée ou disposer d’une seconde paire d’yeux sous un évier. Ouvrez la caméra dans un navigateur et approuvez le spectateur dans un autre. Direct utilise un réseau local accessible ; l’hôte peut choisir Cloud relay pour transmettre la vidéo chiffrée via Cloudflare."
