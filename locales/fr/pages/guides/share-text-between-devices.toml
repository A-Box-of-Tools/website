title = "Partager du texte et des fichiers sans les stocker sur un serveur"
description = "Partagez du texte et des fichiers entre navigateurs, directement par défaut ou avec un relais chiffré via Cloudflare. Sans compte ni copie stockée sur le serveur ; les destinataires peuvent garder leurs propres copies."
heading = "Comment partager du texte et des fichiers sans copie stockée sur un serveur"
lede = "Déplacez une note ou un fichier sans laisser de copie dans une messagerie, un historique de discussion ou un serveur de partage. Les navigateurs se connectent directement par défaut. Si cela échoue, l’hôte peut créer un nouveau partage avec le relais cloud : Cloudflare transmet le contenu chiffré. Les destinataires peuvent toujours enregistrer ce qu’ils reçoivent."
