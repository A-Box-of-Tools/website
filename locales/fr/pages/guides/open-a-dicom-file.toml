description = "Qu’est-ce qu’un fichier .dcm, quel logiciel l’ouvre, que contient le disque d’un hôpital, pourquoi certains fichiers n’ont pas d’extension, comment les lire dans le navigateur, régler fenêtre et niveau et voir les informations sur le patient."
