title = "Recevoir la voix en direct d'appareils à proximité"
description = "Ouvrez un récepteur vocal dans le navigateur avec admission par mot de passe et commandes individuelles. Choisissez Direct ou un relais cloud chiffré facultatif avant l'hébergement."
heading = "Recevoir la voix en direct des personnes à proximité"
lede = "Un hôte écoute pendant que plusieurs personnes parlent depuis leur navigateur. L'hôte nomme le récepteur et choisit Direct ou Cloud relay avant de commencer ; les appelants n'ont pas besoin de nom d'affichage. La découverte à proximité aide à le trouver, un mot de passe facultatif contrôle l'admission et l'hôte choisit les voix à entendre. Cloud relay transmet la voix chiffrée via Cloudflare après confirmation de ce choix par les appelants."
updated = "14 octobre 2026"
