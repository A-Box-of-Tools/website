#
# The "Planned" section of the hub page.
#
# Written as plain text on purpose. A card that links nowhere, or a category
# heading with nothing under it, reads as a broken page rather than an honest
# one. Move a name out of this file when the tool actually ships, and add its
# folder to tools/ at the same time.
#
# Why each line is here - and why the lines that used to be here are not - is
# argued one paragraph at a time in ROADMAP.md. A card of four words cannot
# carry its own reason, and a list nobody can argue with is a list nobody
# prunes. Read it before adding a name back: several of the obvious-looking
# gaps below are gaps on purpose, and a couple of the lines that look small
# need an encoder vendored into them to keep the promise the rest of the site
# keeps for free.
#
# Every line costs eleven files. The translations in locales/*/planned.toml are
# merged positionally, so a line added here without its ten translations - or a
# locale list left one item longer than this one - fails the build.
#

note = "Not built yet. Listed so you can see where this is going."

[[group]]
id = "images"
name = "Images"
items = [
  ["Add text", "over the picture, or in a caption box above it"],
  ["AVIF", "the format one browser writes and the rest only read"],
  ["DICOM anonymizer", "take the patient out of a scan without touching the scan"],
]

[[group]]
id = "gif"
name = "GIF &amp; animation"
items = [
  ["GIF to MP4 or WebM", "the same animation, usually a tenth of the size"],
  ["Edit a GIF", "resize, crop, rotate, reverse it, or change how fast it plays"],
  ["Animated WebP", "the same animation at a fraction of the size &mdash; and the one here that needs a vendored encoder"],
]

[[group]]
id = "video"
name = "Video"
items = [
  ["Resize", "down to a size that will actually send"],
  ["Rotate", "for the clip that was filmed sideways &mdash; and not one frame is decoded to do it"],
  ["Mute a video", "drop the sound and leave the picture untouched"],
  ["Convert to MP4", "whatever came off the camera, as the file that will actually upload"],
  ["Burn in subtitles", "an SRT file drawn into the picture"],
  ["Subtitle converter", "SRT, VTT, ASS, SBV and LRC in any direction, and timings that can be shifted"],
]

[[group]]
id = "audio"
name = "Audio"
items = [
  ["Convert format", "MP3, WAV and Opus, in any direction"],
]

[[group]]
id = "documents"
name = "Documents &amp; PDF"
items = [
  ["Rotate &amp; crop pages", "fix a scan that came in sideways, or trim its margins"],
  ["Extract images", "pull the pictures back out of a document"],
]

[[group]]
id = "beyond"
name = "Beyond media"
items = [
  ["CSV &amp; JSON", "convert either way, and tidy up what the spreadsheet exported"],
  ["Certificates &amp; keys", "read a certificate or a signing request without pasting it into someone's server"],
]
