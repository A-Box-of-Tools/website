#
# Site-wide configuration. Everything here is true of every page; anything that
# differs between tools lives in that tool's own tools/<slug>/tool.toml.
#
# This file is the single source of truth for the things that used to have to be
# kept in step by hand across four hand-written HTML files: the ad and analytics
# ids, the source-code link, and above all the Content-Security-Policy. A tool
# missing an origin showed a blank ad slot; a tool with an extra one was a wider
# hole than the site had agreed to. Now there is one list and the build copies
# it, so they cannot drift.
#

name = "abox.tools"
alternate_name = "A Box of Tools"
domain = "https://abox.tools/"
lang = "en"
lastmod = "2026-10-24"     # the hub page's own sitemap date
source_url = "https://github.com/A-Box-of-Tools/website"
source_label = "github.com/A-Box-of-Tools/website"
contact_email = "hi@abox.tools"

# Languages that are no longer built here, and are still served: frozen as they
# were deployed in 1.4.2 and kept in A-Box-of-Tools/translations, whose folders
# the deploy copies into the site at the commit named below. English, Simplified
# Chinese, German, Spanish, Brazilian Portuguese, French and Japanese are
# maintained here. The latter five were restored from the archived sources and
# brought up to date, so their pages follow the current tools again.
#
# Why. Every change to a tool in English had to be made again in each
# translated copy of its page, or the build refused it, and nearly nobody was
# reading the copies. Over the 28 days to 6 September 2026 the site was landed
# on 56,713 times: 99.05% of arrivals were on an English page and 0.95% on all
# fourteen translations together. Only Chinese had a readership worth the name
# - 395, from China, Hong Kong and Singapore. The best of the rest was Arabic on
# 35, and Italian, Indonesian and Traditional Chinese had one apiece. These
# thirteen were already out of the sitemap, the hreflang sets and the switcher,
# with `noindex` on every page, because at 102 URLs a locale they were 1,326 of
# the site's 1,530 indexed pages and translation at that scale is what Google's
# spam policy calls an automated transformation. So the work is kept and the
# upkeep is not: every frozen page still answers at its address, in its
# language, and nothing written in English after the freeze reaches it.
#
# What a name here does. The build refuses a folder under locales/ for it, so a
# language cannot be built and copied in over itself; `--check` leaves its
# folder out of the comparison, since the dist branch holds a copy the build
# never writes; and the deploy refuses an archive that does not hold exactly
# these folders. To bring one back, copy its archived sources into locales/,
# translate what English has gained since, and drop it from this list. Remove
# its generated site folder in a new archive revision and pin that revision
# here too, so the deploy cannot copy an old page over a maintained one.
frozen_languages = [
  "ar", "hi", "id", "it", "ko", "nl", "tr", "zh-TW",
]

# Where the frozen languages are kept, and at which commit. A commit rather
# than a branch, so a push to the archive reaches abox.tools only through a pull
# request here that moves this line.
frozen_archive = { repository = "A-Box-of-Tools/translations", commit = "3311738e9deda4c0510e983ad0b4510574174db2" }

# The account the site posts from. It is here rather than in the footer markup
# because it is the same fact twice: the link a reader follows, and the `sameAs`
# a search engine reads off the Organization node to decide that the profile and
# the site are one publisher. Two copies of a handle is one that gets renamed.
x_url = "https://x.com/aboxtools"

# The version is deliberately NOT here. It is a git tag, worked out by the
# deploy from what the change touched - see buildlib/version.py and "The
# version" in CLAUDE.md. The footer now links to that tag's GitHub release,
# using metadata supplied by the build rather than a number kept in this file.
# A counter that every branch has to edit makes concurrent pull requests
# conflict; deriving it from the tags keeps the source free of that counter.

# The one guide that is linked to from inside a sentence rather than from a
# list. The hub's three guarantees end by pointing at it, so it cannot be moved
# or renamed without the build noticing - which is the whole reason its slug is
# written here and not in the middle of the markup. Not translatable: a locale
# changes the address this resolves to through [slugs], and never which guide
# the sentence is about.
safety_guide = "guides/is-it-safe-to-upload-files"

adsense_client = "ca-pub-5997711677062324"
analytics_id = "G-SCBN29XZ31"

#
# The build needs nothing but Python. There is no minifier to install, no
# bundler, and nothing pinned: `python build.py` produces exactly what is
# deployed, which is what makes `--check` worth having. Identifiers are left
# alone deliberately - see the note at the top of build.py.
#

#
# Who publishes this, in the form a machine reads it. The About and Contact
# pages say the same things in prose, at length, in fifteen languages; this is
# the half that goes into the Organization node on the hub, and it is
# deliberately only the facts that are identical in every language. The
# publisher's description reuses each language's hub description.
#
# `contact_slug` is written down for the same reason `safety_guide` above is:
# the structured data has to name that page's address, and a slug spelled out
# in the middle of buildlib/site.py is a slug that gets left behind when the
# page is renamed. Each locale translates it through its own [slugs] table.
#
[publisher]
region = "Ontario"
country = "CA"
contact_slug = "contact"

# A public browser-workflow skill, advertised by the generated discovery files.
# It describes the existing tools; it does not expose a processing endpoint.
[agents]
name = "abox-tools"
display_name = "abox.tools browser tools"
description = "Use this skill when a person asks to find or use a browser tool for a supported file or text task, including image, PDF and structured-data work. Choose a matching abox.tools tool for conversion, compression, inspection or editing within its documented formats, limits and privacy boundaries."
representative_queries = [
  "Find a browser tool that compresses my image without uploading it.",
  "Help me choose an abox.tools tool and save its result.",
  "Can an agent use abox.tools while keeping processing on my device?",
]

# This service searches public catalogue text, separately from file processing.
# Deploy and verify the production Worker before releasing these discovery links.
[agents.mcp]
server_card = "https://mcp.abox.tools/mcp/server-card"
display_name = "abox.tools public catalogue"
description = "Find browser tools by public task or format keywords. Initial keywords are sent to this catalogue service; it accepts no files and performs no file processing. MCP Apps hosts can display an interactive catalogue, while other hosts receive public tool links."
representative_queries = [
  "Find a browser tool for PNG to WebP.",
  "Browse the public abox.tools tool catalogue in an MCP Apps host.",
]

# This card describes the catalogue's real A2A interface, not file processing.
# Its version and supported interfaces remain on the separately deployed service.
[agents.a2a]
agent_card = "https://mcp.abox.tools/.well-known/agent-card.json"
display_name = "abox.tools public catalogue agent"
description = "Find browser tools through A2A using public task or format keywords. Initial keywords are sent to the catalogue service, which returns public tool descriptions and links. It accepts no files and performs no file processing."
representative_queries = [
  "Find a browser tool for PNG to WebP through A2A.",
  "Get public abox.tools catalogue links for PDF compression.",
]

[bmc]
# Buy Me a Coffee. The build writes their snippet out unchanged; these are the
# data- attributes it is configured with.
slug = "aboxtools"
text = "Buy me a coffee"
color = "#FFDD00"
font = "Cookie"

#
# ---------------------------------------------------------------------------
# The Content-Security-Policy every page carries.
#
# As narrow as AdSense can be made to work with: Google's own script, frame and
# measurement origins, plus the two the donate button needs, and no wildcards
# except on img-src where creatives legitimately come from anywhere.
#
# A CSP wildcard stands in for a whole label, so https://*.analytics.google.com
# does NOT cover the bare host analytics.google.com - and the bare host is where
# gtag sends its measurement hit. Both forms are listed. Adding a Google origin
# here means checking whether the bare host is needed as well as the wildcard.
#
# Known gap: Google sends the ads conversion ping to the visitor's own country
# domain - www.google.ca, www.google.co.uk - and CSP cannot wildcard a TLD. Only
# www.google.com can be named, so that one ping is still refused for a visitor
# routed to a country domain. Nothing short of widening the directive to https:
# would express it, which is not a trade worth making for a conversion ping.
#
# AdSense does not officially support a strict CSP. If an ad renders blank, open
# DevTools and look for a violation naming an origin not listed here. Add the
# origin; do not widen a directive to https: to make it go away.
#
# A tool may add values to any of these, and may add directives of its own, in
# its tool.toml [csp] table. It can only ever widen its own page - there is no
# way for a tool to remove an origin the site has decided on, and no way for one
# tool's policy to affect another's.
# ---------------------------------------------------------------------------
#

[csp]
"default-src" = ["'none'"]
"script-src" = [
  "'self'",
  "https://www.googletagmanager.com",
  "https://pagead2.googlesyndication.com",
  "https://tpc.googlesyndication.com",
  "https://partner.googleadservices.com",
  "https://www.googletagservices.com",
  "https://adservice.google.com",
  "https://ep1.adtrafficquality.google",
  "https://ep2.adtrafficquality.google",
  "https://cdnjs.buymeacoffee.com",
]
"frame-src" = [
  "https://googleads.g.doubleclick.net",
  "https://tpc.googlesyndication.com",
  "https://ep1.adtrafficquality.google",
  "https://ep2.adtrafficquality.google",
  "https://www.google.com",
]
"connect-src" = [
  "https://www.google-analytics.com",
  "https://*.google-analytics.com",
  "https://analytics.google.com",
  "https://*.analytics.google.com",
  "https://*.googletagmanager.com",
  "https://pagead2.googlesyndication.com",
  "https://googleads.g.doubleclick.net",
  "https://stats.g.doubleclick.net",
  "https://www.google.com",
  "https://ep1.adtrafficquality.google",
  "https://ep2.adtrafficquality.google",
  "https://csi.gstatic.com",
]
"style-src" = ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
"font-src" = ["https://fonts.gstatic.com"]
"img-src" = ["'self'", "data:", "https:"]
"form-action" = ["'none'"]
"base-uri" = ["'none'"]

# Added to every tool page, and not to the hub. Every tool draws previews and
# results from the file you chose, and those are blob: URLs made in the page;
# the hub has no such thing and does not need the permission.
[tool_csp]
"img-src" = ["blob:"]

# Added to the two kinds of page that can be installed as an app - every tool
# page, and each language's front page - and to no other. manifest-src has no
# default of its own: it falls back to default-src, which is 'none' here, so
# without this the browser refuses the manifest and the only symptom anywhere is
# that the install button never appears. The page is otherwise unaffected, so
# nothing would ever tell you.
[app_csp]
"manifest-src" = ["'self'"]

#
# ---------------------------------------------------------------------------
# The web app manifest, which is what lets a browser install a page as an app.
#
# There are two kinds and both are written per language: one per tool, scoped to
# that tool's folder, and one per front page, scoped to that language's root and
# called "abox.tools". Each is scoped to exactly what the service worker
# beside it has already cached, which is the whole point - an app installed from
# here opens with the network unplugged.
#
# The name and the description come from the page, in the language it is in, so
# the German tool page installs a German-named app. Only what is true of all of
# them is written here.
#
# The colours are `--bg` from shared/css/tool-frame.css, light and dark: the
# ground the page is already drawn on, so the window frame a browser puts around
# an installed tool is the same surface rather than a second one. That stylesheet
# is where they are decided; these are copies, and a change to the palette is a
# change here as well.
# ---------------------------------------------------------------------------
#

[manifest]
display = "standalone"
theme_color = "#f6f7f9"
background_color = "#f6f7f9"
# The dark half of the pair above, for the <meta name="theme-color"> that a
# browser reads when the page is merely open rather than installed. A manifest
# has one colour and no way to ask which theme is in force.
theme_color_dark = "#14171b"

# What the front page installs as: the site mark, drawn by og-image.ps1 from
# shared/logo.svg and shipped at the root, because it belongs to the site rather
# than to any one page. The maskable copy is the same drawing with a wider
# margin, because Android crops an icon to whatever shape the launcher uses and
# only the middle of it is guaranteed to survive.
[[manifest.icons]]
src = "/icon-192.png"
sizes = "192x192"
type = "image/png"

[[manifest.icons]]
src = "/icon-512.png"
sizes = "512x512"
type = "image/png"

[[manifest.icons]]
src = "/icon-512-maskable.png"
sizes = "512x512"
type = "image/png"
purpose = "maskable"

# What a TOOL installs as: its own emoji, the one beside its heading, on the same
# tile. A launcher full of identical toolboxes tells you nothing, and the emoji
# is already how the site distinguishes one tool from another - it is the tab
# icon too.
#
# Relative, unlike the site's: the file sits in the tool's folder and is copied
# into all ten of that tool's folders, so the German app gets the copy under
# /de/ and no path has to know which language it is in.
#
# One size, where the site has three. Nothing reads these but the install UI,
# which scales what it is given; 512 is large enough for every launcher and
# there is no iOS home-screen tile in the picture.
[[manifest.tool_icons]]
src = "icon.png"
sizes = "512x512"
type = "image/png"

[[manifest.tool_icons]]
src = "icon-maskable.png"
sizes = "512x512"
type = "image/png"
purpose = "maskable"

#
# ---------------------------------------------------------------------------
# The hub page at the root of the site.
# ---------------------------------------------------------------------------
#

#
# ---------------------------------------------------------------------------
# The 404 page.
#
# GitHub Pages serves one file, at the root of the publishing source, for every
# address it cannot find. It is the only page on the site that is read at an
# address it was not built for, which is why every URL on it is root-absolute -
# templates/404.html says more about that.
#
# It carries no advertising and is not indexed. Both on purpose, both explained
# in the template.
# ---------------------------------------------------------------------------
#

[not_found]
title = "Page not found &mdash; abox.tools"
description = "That address does not exist on abox.tools. Here are the free browser tools for processing files on your device."
heading = "That page is not here"
tools_heading = "Every tool, in one place"
tools_note = "All free, all processing files in your browser."

lede = """
    Either the address has a typo in it, or something that used to be at that
    address has moved. Nothing is wrong with your file and nothing was lost:
    this site has never held anything of yours to lose."""

[hub]
title = "abox.tools &mdash; Image Compression &amp; Free Browser Tools"
# Kept under 155 characters. Google truncates a description around there, and
# the tail of this one is the part that sells the site, so it cannot be the
# part that gets cut.
description = "Free image compression, PDF, video, audio and text tools from abox.tools (A Box of Tools). Process files in your browser without processing uploads."
heading = "Free tools. Local processing."
og_title = "abox.tools &mdash; image compression and free browser tools"
og_description = "Free image compression, PDF, video, audio and text tools that process files on your device. Intentional sharing and optional online features are explained where they appear."
og_image_alt = "abox.tools - browser tools for local file processing"
schema_description = "Free browser tools for local image compression, PDF editing, video, audio and text. No processing uploads or accounts. Intentional sharing and optional online features are explained on their own pages."
schema_about = "Browser tools for image compression, PDF editing, video, audio, text and intentional browser-to-browser sharing"

# Keep the introduction brief so a phone reaches the catalogue quickly.
# Network use and the limits of offline processing stay in the details below.
lede = "abox.tools (A Box of Tools) offers image compression, PDF editing and text tools in your browser. No processing uploads, no sign-in."

support_note = """
      These tools are free and always will be. If one saved you a job, this is
      the only thing on the site that asks you for anything."""

# The distinction is local processing versus a deliberate transfer. Networking
# features name their payloads and limits where they are used; a global claim
# must not erase those exceptions or treat CSP as proof of every data path.
privacy_heading = "Your files stay yours."

privacy_lede = "Local file processing works offline after the tool is saved. Fetching and sharing require a connection."

support_heading = "Free, with your support."

[[hub.guarantees]]
title = "Your files are processed on your device"
body = "Your browser opens, reads and edits the files you choose. There is no upload for processing. Share Text &amp; Files, Share a Browser Tab, Remote Camera and the live voice tools deliberately send content to another browser; their own pages explain the connection."

[[hub.guarantees]]
title = "Your files are not given to analytics"
body = "Page visits, fixed tool-use stages, the first successful result per page load, selected workflow links and optional fixed feedback are counted. No files, filenames, contents or input or output details go with those counts. Optional image imports and receipt exchange-rate requests name their data beside their controls."

[[hub.guarantees]]
title = "Local processing works offline"
body = "Wait for a tool's offline indicator to say ready, then disconnect and use files from your device. Fetching a web image, looking up an online rate and connecting two browsers require a network."

# Categories the shipped tools are grouped under. A tool joins one by naming its
# id in `category` in its own tool.toml; the order of tools within a category is
# the order they are listed in `order` below.
#
# There were seven of these and they had stopped grouping anything. One held
# sixteen tools; the other six held three or fewer, which at three cards to a
# row is a heading over a single row. So somebody after a video tool scrolled
# past nine image tools inside one section, and then past six headings that were
# mostly heading. A heading earns its space by letting a reader skip everything
# under it, and a heading with one card under it never does.
#
# File categories follow what a reader arrived with. Connecting browsers is a
# different job: keep those tools together rather than scattering a live camera,
# a voice channel and a text share among tools that edit a local file.
[[hub.categories]]
id = "images"
name = "Images"
short_name = "Images"
note = "Resize one, shrink one, take out what it quietly records about you, or draw one from nothing - none of it sent anywhere."
order = ["compress-image", "resize-image", "image-layout", "heic-to-jpg", "webp-to-jpg", "png-to-webp", "avif-to-jpg", "id-photo", "stack-images", "redact-image", "exif-editor", "dicom-viewer", "image-to-ico", "image-to-data-uri", "svg-to-image", "image-to-svg", "compare-heights", "business-profile-preview"]

# Video and GIF were two categories, and the line between them was one this site
# cared about and a reader did not: a GIF is what somebody makes when the MP4
# will not send, and half of these tools turn one into the other. Under a single
# heading, "video to GIF" stops being a choice between two sections.
[[hub.categories]]
id = "video-and-animation"
name = "Video &amp; animation"
short_name = "Video &amp; GIFs"
note = "Trim, convert or build a clip from photos, with the footage staying on your device."
order = ["compress-video", "convert-to-mp4", "rotate-video", "images-to-video", "trim-video", "crop-video", "reverse-video", "timelapse-video", "grab-frame", "gif-to-mp4", "video-to-gif", "gif-maker", "split-gif", "gif-analyzer"]

# Documents and audio have nothing in common except the thing that matters here:
# they are what people are most often told to upload to a stranger to have
# something simple done to them. Three tools and two tools were two headings
# that each fitted on one row; together they are a section worth a heading.
[[hub.categories]]
id = "documents-and-audio"
name = "Documents &amp; audio"
short_name = "PDF &amp; audio"
note = "Rearrange a document or trim a recording without sending either away for processing."
order = ["merge-pdf", "compress-pdf", "unlock-pdf", "protect-pdf", "watermark-pdf", "redact-pdf", "pdf-to-csv", "receipt-invoice-extractor", "images-to-pdf", "document-scanner", "extract-audio-from-video", "trim-audio", "edit-audio"]

# Everything that is not a file being edited. What goes in is something you
# typed, something you want read back, or something you want checked, and what
# comes out is not a changed copy of it. This was three headings - codes, text,
# secrets - split along a line that only means anything to somebody who already
# knows what all five tools do. The promise underneath them is one promise, and
# it is the strongest one on the page: what a reader has here is a token, a
# config file, or a password that nobody else has ever held a copy of.
[[hub.categories]]
id = "text-codes-and-passwords"
name = "Text, codes &amp; passwords"
short_name = "Text &amp; codes"
note = "Read it, check it, or make it here - no token, no config file and no password on somebody else's server."
order = ["json-formatter", "yaml-to-json", "xml-formatter", "text-diff", "base64", "qr-barcode", "qr-barcode-reader", "hash-checksum", "password-generator"]

[[hub.categories]]
id = "connect-devices"
name = "Connect devices"
short_name = "Connect devices"
note = "Share text and files, talk live, or watch a camera or browser tab on another device. Each tool explains what it sends and how the browsers connect."
order = ["share-text", "walkie-talkie", "voice-oncall", "remote-camera", "share-tab"]

# Addresses that moved. Each key is a slug a tool used to answer at, each
# value the slug of the tool that answers now; build.py writes a stub at the
# old address for every locale whose address actually changed. text-tools was
# one page doing four jobs, and in 2026 it became three tools - the locales
# that had renamed their slug to a search phrase kept their address, so the
# stubs are for English and the locales that write no slugs at all.
#
# The three English slugs then moved a second time. The split had named them
# for what the page does - format-json, compare-text, encode-text - while
# every locale that writes its own slug had already named them for what gets
# typed into a search box: json-formatieren, base64-kodieren, comparar-textos.
# English was the odd one out, and worst on the page it cost the most:
# /encode-text/ did not contain the word "base64" anywhere, which is the whole
# reason anybody arrives there. The English addresses now say what the
# localized ones have said all along, and the names in [words] already did.
#
# text-tools points straight at json-formatter rather than at format-json:
# a meta refresh landing on a second meta refresh is a chain a crawler is
# entitled to abandon, and there is no reason to build one when the address
# it ends at is known right here.
[redirects]
"text-tools" = "json-formatter"
"format-json" = "json-formatter"
"compare-text" = "text-diff"
"encode-text" = "base64"
"bank-statement-to-csv" = "pdf-to-csv"

#
# ---------------------------------------------------------------------------
# The roadmap page.
#
# The planned list used to sit at the foot of the hub, under the shipped tools.
# It had grown to about fifty names across six groups, which meant the last
# thing a visitor saw on the front page was a long list of things this site
# cannot do yet. It reads as an apology, and it pushed the tools that do exist
# off the bottom of the screen.
#
# It is worth keeping - saying out loud where this is going is the same habit as
# saying out loud what the tools do with your files - so it moved here instead
# of being deleted. The page lists what is built first and what is planned
# second, which is the honest order and also the useful one.
#
# The content itself is still config/planned.toml. This is only the frame.
# ---------------------------------------------------------------------------
#

[roadmap]
slug = "roadmap"
nav = "Roadmap"
lastmod = "2026-10-12"

title = "Roadmap &mdash; what abox.tools is building next"
description = "Every tool planned for abox.tools, grouped and in the open, plus the ones already finished. File processing happens in your browser."

heading = "What is coming next"
lede = "Tools for local file processing and deliberate browser-to-browser sharing, without a processing upload. A feature whose job needs networking explains it on its own page. The counts are not written down anywhere; the build reads the lists."

intro_heading = "How this list was drawn up"
intro = """
    <p>
      It is not a wishlist. It was drawn up by going through the tool list of
      the largest online GIF and video site, the closest thing there is to a
      catalogue of what people actually want done to a file, and keeping every
      entry that can be built so the work happens on your own machine and keeps
      happening with the network unplugged.
    </p>
    <p>
      Most of what survived runs on APIs the browser already ships. A few need
      a codec vendored into the one tool that uses it, which is allowed &mdash;
      the file still never leaves the machine. Anything that cannot clear that
      bar was left off rather than promised, so a few of the obvious-looking
      gaps below are gaps on purpose.
    </p>
    <p>
      The tools that already exist sit at the top of their group, marked
      <em>Built</em> and linked to their own page. Everything under them is
      still to come, and nothing is a link until it is.
    </p>"""

planned_heading = "Every kind of file, and what can be done to it"

og_title = "abox.tools roadmap"
og_description = "What is built, and what is next. Local file processing, with networking explained where a feature needs it."
og_image_alt = "abox.tools - browser tools for local file processing"

#
# ---------------------------------------------------------------------------
# The guides index at /guides/.
#
# Guides themselves live under pages/guides/<slug>/, one folder each, and the
# build finds them there - this is only the frame around the list, in exactly
# the way [roadmap] above is only the frame around config/planned.toml.
#
# The one thing written here rather than derived is the grouping and the order
# within each group, in [[guides.groups]] below. A guide names the group it
# joins in its own page.toml, and the build refuses to finish if a guide names
# a group that does not exist, if a group lists a guide that does not exist, or
# if a guide exists that no group lists - the same three checks the hub makes
# about tools, and for the same reason: a page nothing links to is a page that
# might as well not have been written.
# ---------------------------------------------------------------------------
#

[guides]
slug = "guides"
# The footer label, sitting directly under "All tools" and deliberately matching
# it: the two are the front door to each half of the site. It is the only guide
# link in the footer - the guides themselves are reached from the index rather
# than listed one by one, which is what stops that column growing by a line
# every time one is written.
nav = "All guides"
