# The heading over the handful of other tools at the foot of every tool page.
# "Also in the box" rather than "Related tools" because the tools under it are
# not always related - two categories hold one tool each, and those two pages
# get the nearest thing the hub has instead. See related_tools() in build.py.
related_heading = "Also in the box"

# The lead-in on the carry-the-result-on row - see shared/handoff.js. It ends
# in a colon because the links that follow are the sentence's object: the
# names of the tools the result can go straight into, in this language.
handoff_lead = "Carry the result straight into:"
privacy_heading = "How the privacy claim is verifiable"

# The first paragraph of a tool page's Markdown twin. A twin carries the
# written half of the page and none of the interface, so the one thing it has
# to say for itself is that the page it stands for is a tool, where that tool
# is, and that the promise holds there. Plain text: the twin is a text file.
md_note = "This is an interactive browser tool at {{ tool.url }}. Files are processed on the device running that browser. Any deliberate sharing or optional network feature is described on the page. What follows is its written explanation; open the address to use it."

# What a step says while it is still waiting. Every tool's last card is on the
# page from the start and dimmed, so the whole job can be read before anything
# is handed over - but a dimmed heading over a dimmed button says only that
# something is unavailable, not what would make it available. This says it.
#
# One sentence rather than one per card, because `inert` comes off in exactly
# one place - the moment files arrive, in shared/js/file-picker.js - so it is
# the same answer on all of them.
card_waiting = "This opens as soon as you choose a file above."

# The button beside the drop zone on a tool that ships a worked example, and
# what it says while it works and when it cannot.
#
# The example is BUILT IN THE PAGE, never fetched. `connect-src` in the policy
# above names no origin belonging to this site, so a fetch for a sample file
# would be refused outright - and the live check counts every real fetch, so
# even if it were allowed, the one line on the page that exists to be checked
# would start reporting a request the visitor did not make. A file assembled in
# the page is neither: blob: and data: are not fetches and trust.js leaves them
# out of everything. See shared/js/example.js.
# "Try an example" and not "Load example" because five tools said the first of
# those before this button existed - the text tools have had their own since
# they were built, in their own body.html, with the words translated in each
# locale's copy. Those stay where they are; this is what the other thirty-six
# get, and it had better be the same sentence.
example_load = "Try an example"
example_busy = "Building an example&hellip;"

# Said when building the example throws - a codec the browser will not give us,
# or memory it will not spare. It names the way out rather than the cause,
# because the cause is never the visitor's to fix and their own file was always
# the better input anyway.
example_failed = "This browser could not build the example. Choose a file instead."

# The headline claim. The noun in the middle is this tool's own - "files",
# "pictures", "clips" - and the sentence is written round it rather than in two
# pieces either side of it, so a language that puts the verb last can.
pledge_line = "Your {{ tool.words.plural }} are <strong>processed in your browser</strong>. No processing upload."

boot_title = "This page's code did not start."
boot_body = """
    Opening <code>index.html</code> directly from a folder blocks JavaScript modules,
    so nothing will happen when you choose {{ tool.words.choose }}. Serve the folder over http instead:"""
boot_then = "Then open <code>http://localhost:8080/</code>."

noscript_title = "JavaScript is disabled."
noscript_body = "This app does all of its work in your browser, so it cannot run without it."

#
# The sentences the frame's own JavaScript puts on screen.
#
# They were written twenty-nine times, once in each tools/<slug>/src/main.js,
# and nothing under src/ is translated - the build copies it byte for byte into
# every language - so a reader whose browser refused the service worker was
# told about it in English on an otherwise translated page.
#
# They are here instead. templates/tool.html renders them into a hidden block
# of <span data-phrase> elements and shared/js/phrases.js reads them back out,
# which is how qr-barcode-reader has said everything it says since it shipped.
# A tool that wants to put it differently defines the same key in its own
# body.html, and that one wins; heic-to-jpg does, for `offline.ready`.
#
# `{detail}` and `{count}` are filled in by shared/js/phrases.js and not by the
# build. Single braces on purpose: these strings pass through the build's own
# {{ ... }} templating first, and a placeholder it recognised would be one a
# translator could fill in and have quietly rendered away.
#

# The one way offline caching succeeds, and the three ways it does not. Each is
# read as the tail of the "Offline:" label, so in the languages that have a
# lower case each begins in it.
offline_ready = "ready &mdash; disconnect from the internet and this still works."
offline_none = "not available in this browser (everything else still works)."
offline_insecure = "needs https:// or localhost to cache for offline use."
offline_failed = "caching unavailable here, but nothing is uploaded either way."

# What the live network check says, read as the tail of the "Live check:"
# label. `{total}`, `{hosts}` and `{platform}` are filled in by
# shared/js/trust.js; the platform note is one phrase per number rather than a
# pluralising helper, so a language whose plural is not a suffix can say the
# two separately. These are the frame's defaults, and they say "files": a tool
# that would rather name its subject - "your video has gone nowhere" - defines
# the same four keys in the #phrases block of its own body.html, which wins.
net_clean = "your files have gone nowhere. {total} files loaded, all of them this page's own. {platform}"
net_dirty = "something contacted {hosts}, which this tool never does. Treat that as worth investigating. {platform}"
net_platform_one = "The page's own ad, measurement and donate-button scripts loaded from {hosts} host; not one of them was given a file or a byte of one."
net_platform_many = "The page's own ad, measurement and donate-button scripts loaded from {hosts} hosts; not one of them was given a file or a byte of one."

# What the window's own `error` and `unhandledrejection` handlers say. `detail`
# is the browser's own message, which stays in whatever language the browser
# speaks: it comes from the engine, and no translation here can reach it.
error_broke = "Something broke: {detail}. Reload the page to start over."

# The drop zone while it reads. Two keys rather than one with an `s` appended,
# for the same reason `guide_one` and `guide_many` are two keys.
reading_one = "Reading {count} file&hellip;"
reading_many = "Reading {count} files&hellip;"

check_yourself = """
      <strong>Check it yourself.</strong> None of the above has to be taken on trust.
      This page is generated from the templates and config in the repository by a
      build script you can read and run yourself, and the result is committed to
      the <code>dist</code> branch &mdash; so you can diff what is served against
      what a build of the sources produces:"""

read_first_lead = """
      The files worth reading first are <code>config/site.toml</code> for the
      Content-Security-Policy"""

# For the reader on a work laptop whose security software has just shouted at
# them. It is the commonest way somebody is told this site uploaded their file,
# and the tool cannot answer it from inside the page - the alert comes from
# software on their machine, not from anything served here.
#
# Written to be shown to whoever raised it: it says what the monitor saw, why
# it is not what it looks like, and how to check in the one place both sides
# can look at together.
dlp_note = "<strong>If your employer's security software warns about an upload.</strong> A warning when a file is selected does not establish that it was sent. For a local processing action, inspect request URLs and payloads in your browser's Network tab, and compare them with this page's source. Optional fetching and intentional sharing have their own explanations. Your IT team can run the same check."

#
# The one question this site asks, on the tool page, after a download. Its own
# table rather than more of [ui.tool] because it is the only part of the frame
# that sends anything, and the words that say so should be as easy to find as
# the code that does it - shared/feedback.js.
#

[ui.feedback]
prompt = "Did this do the job?"

# Labels rather than visible words: the buttons are a thumb up and a thumb down,
# which need no translation, and these are what a screen reader and a tooltip
# say instead. "Yes" and "No" rather than "Good" and "Bad" - the question above
# them is a question, and the answer to it is not a rating.
up = "Yes"
down = "No"
dismiss = "Close"

reason_prompt = "What went wrong?"

# Four fixed answers, and there will never be a fifth without a reason. They are
# chips and not a comment box on purpose: this panel appears on a page that has
# just handled somebody's passport scan or their payslip, and a free-text field
# there collects filenames and worse - see shared/feedback.js. Each one is a
# thing the site could actually go and fix.
reason_wrong = "Wrong result"
reason_failed = "Did not finish"
reason_slow = "Too slow"
reason_confusing = "Confusing"

thanks = "Thank you &mdash; that helps."

# Said where the asking happens rather than in a policy page nobody opens. It
# has to stay true of shared/feedback.js: the answer, the tool it is about, and
# nothing else.
note = """
      Only the answer is sent, and only when you press a button. Never your
      file, its name, or anything about it."""

#
# The one line a guide carries that a legal page does not: the link to the
# tool the guide is about. Its own table because it needs {{ tool }}, and a
# guide about no tool in particular - "is it safe to upload files" - has not
# got one.
#

[ui.guide]
# The name goes inside the string rather than after it. English puts the verb
# first and German puts it last, and a label built as "Open the" plus a name
# can only ever be the first of those.
open_tool = "Open the {{ tool.name | e }}"

#
# The "add from a web address" panel, on the tools that have one. It may use
# {{ tool.picker.urls }}, which only those tools define.
#

[ui.picker]
warning = "<strong>Fetching this address uses the network.</strong> That server sees your IP address and the address of the {{ tool.picker.urls.noun }} you request, including any query string. The image is copied into local memory on arrival. Files you choose from your device are not sent as part of this import."
label = "One address per line"
note = """
      The server must permit cross-origin use of its {{ tool.picker.urls.noun }}s. Many sites do not,
      and those will fail with a message rather than silently breaking later."""

#
# ---------------------------------------------------------------------------
# The footer, which is now the same on every page - hub, tool and legal alike.
#
# The tool list and the legal-page list in it are not written here: build.py
# derives them from the folders under tools/ and pages/, so a new one appears
# in the footer of every page without anybody remembering to add it.
# ---------------------------------------------------------------------------
#

[footer]
blurb = "Tools that process files on your device. No processing uploads, no account to make."
base = "Every claim on this site is meant to be checked, not believed."

# What the site licenses, rather than what it reserves. The conventional footer
# line is a copyright notice, and here that would be a false one: LICENSE puts
# the code under MIT and LICENSE-CONTENT puts every sentence a visitor reads
# under CC BY 4.0, so "all rights reserved" would deny, on the page itself, the
# thing those two files grant. Copyright attaches on creation under the Berne
# Convention and a notice has not been required since 1989, so the notice was
# never buying anything a licence line does not buy better.
#
# The <a> sits inside the translated string for the reason given above
# `guarantees_note`: which words carry the link is a translator's decision. The
# two URLs are written out rather than built from `source_url`, because strings
# under [footer] are substituted into the template and not themselves rendered -
# a {{ }} here ships to the visitor verbatim. pages/terms/body.html spells the
# same repository out for the same reason.
#
# The year is deliberately absent. A year computed at build time would rewrite
# twelve hundred pages every 1 January, which `--check` would report as the
# whole site changing and the deploy would then submit wholesale to IndexNow.
