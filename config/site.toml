#
# ---------------------------------------------------------------------------
# The frame's own words.
#
# Everything below used to be typed into templates/. That was fine while the
# site was written in one language and stopped being fine the moment it was not:
# a string sitting in markup is a string no locale file can reach, so it renders
# in English inside a German page with nothing to say why.
#
# These are read as small templates rather than as plain strings, using the same
# {{ }} the rest of the build uses, so a translator can put the moving part
# wherever their language puts it. "Your files are never uploaded" is
# subject-verb-object; the German is not, and a string split into a before-half
# and an after-half around {{ tool.words.plural }} could only ever be one or the
# other. Written whole, it can be either.
#
# The names inside the braces are checked. buildlib/template.py refuses to
# render a name it cannot resolve, so a translation that mistypes
# {{ tool.words.plural }} fails the build rather than shipping a sentence with a
# hole in it - which is the same bargain every other value here is on.
#
# [ui.tool] and [ui.picker] are separate because they are the ones that reach
# for {{ tool }}, and only a tool page has one. A hub page rendering them would
# be asking for a name that is not there.
# ---------------------------------------------------------------------------
#

[ui]
favorites_heading = "Favorites"
favorites_note = "Saved in this browser."
favorite_tool = "Favorite"
favorites_unavailable = "Favorites could not be saved in this browser."
# The language switcher. `languages` labels it for a screen reader; the
# languages themselves are never translated - each is written in its own
# language, in locales/<lang>/locale.toml, because somebody looking for German
# is looking for the word "Deutsch".
languages = "Language"

# The line the language script shows on a page it has just sent somebody to,
# so that a redirect nobody asked for is at least a redirect they can see and
# undo. Each language names ITSELF here - the reader is being told which
# language they are looking at - and the link out of it is labelled with the
# other language's own name, taken from the switcher rather than written here.
lang_auto = "This page is shown in English, the language your browser asks for."

# The first focusable thing on every page. A keyboard or screen-reader visitor
# otherwise crosses the breadcrumb, the header and the whole pledge before
# reaching the tool they came for - on every page, every visit. Invisible until
# it is focused; sighted mouse users never see it.
skip_to_content = "Skip to content"

breadcrumb = "Breadcrumb"
all_tools = "All tools"
last_updated = "Last updated"
built_tag = "Built"
planned_count = "planned"
built_count = "built"

# The guides index counts itself. Two forms, because "1 guides" is the kind of
# thing that is only ever noticed by the reader. Languages with more plural
# forms than two would need more than this, and none of the ten this site is
# translated into does for a count that starts at nine.
guide_one = "guide"
guide_many = "guides"

footer_tools = "Tools"
footer_site = "This site"
footer_contact = "Get in touch"
footer_sitemap = "Sitemap"

# The three links under "Get in touch" are drawn rather than written - a
# repository, an account and an address are things a reader recognises by their
# marks - so these two lines are no longer the words on screen. They are the
# accessible names: what a screen reader announces, and what the tooltip says.
# That is why they still have to be translated, and why each names where it
# goes rather than saying "GitHub" or "X", which a link already looks like.
footer_source = "Read the code on GitHub"
footer_x = "abox.tools on X"

# The row beside every page's Markdown twin - see buildlib/markdown.py. The
# button names the reader it is for and its tooltip names the format: a
# person about to paste a page into a chat is looking for the first, and asks
# the second only once they have found it. The link beside it names the
# format outright, because a link's text is its promise. `md_copied` and
# `md_failed` are what the status beside the button says for two seconds
# after a press.
md_copy = "Copy for LLM"
md_copy_title = "Copies the page as Markdown"
md_copied = "Copied"
md_failed = "Could not copy"
md_view = "View as Markdown"

# The three lines that carry a link inside a sentence. The <a> is part of the
# translated string on purpose: which words are the link, and where in the
# sentence they fall, is a decision only the translator can make.
guarantees_note = """
    None of that has to be taken on trust.
    <a href="{{ base }}{{ links.safety_guide }}/">
      How to tell whether a tool really needs your files</a>
    sets out four checks you can run yourself, on this site or any other."""

# The box above the categories that narrows them as you type. Two strings and
# no count: "3 of 37" would need a plural rule per language for a number that
# the reader can already see, since what it is counting is on the screen.
#
# The label is used twice on one control - as the placeholder a sighted reader
# sees and as the <label> a screen reader hears - so it has to read as an
# instruction rather than as a heading. "Find a tool", not "Search".
hub_categories_label = "Tool categories"
hub_view_all = "View all"
hub_show_fewer = "Show fewer"
hub_privacy_details = "How it stays private"

hub_filter_label = "Find a tool"
hub_filter_none = "No tool matches that. Try fewer words or a file format, such as PDF or PNG."

# Browser agents read the same public catalogue a person sees. Keeping their
# tool metadata here lets each hub describe that search in its own language.
hub_agent_title = "Find a browser tool"
hub_agent_description = "Search the tools listed on this page by task, name or file format. Returns public tool names, descriptions and links; does not open tools or process files. Matches short keywords in this page's language."
hub_agent_query_description = "Keywords such as PNG to WebP or JSON. An empty query lists tools."

