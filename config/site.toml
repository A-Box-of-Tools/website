#
# Site-wide configuration. Everything here is true of every page; anything that
# differs between tools lives in that tool's own tools/<slug>/tool.toml.
#
# This file is the single source of truth for the things that used to have to be
# kept in step by hand across four hand-written HTML files: the ad and analytics
# ids, the source-code link, and above all the Content-Security-Policy. A tool
# missing an origin showed a blank ad slot; a tool with an extra one was a wider
# hole than the site had agreed to. Now there is one list and the build copies
# it, so they cannot drift.
#

name = "A Box of Tools"
domain = "https://abox.tools/"
brand_mark = "&#129520;"          # the toolbox emoji, used on the hub header
lang = "en"
lastmod = "2026-08-20"     # the hub page's own sitemap date
source_url = "https://github.com/A-Box-of-Tools/website"
source_label = "github.com/A-Box-of-Tools/website"
contact_email = "hi@abox.tools"

# The one guide that is linked to from inside a sentence rather than from a
# list. The hub's three guarantees end by pointing at it, so it cannot be moved
# or renamed without the build noticing - which is the whole reason its slug is
# written here and not in the middle of the markup. Not translatable: a locale
# changes the address this resolves to through [slugs], and never which guide
# the sentence is about.
safety_guide = "guides/is-it-safe-to-upload-files"

adsense_client = "ca-pub-5997711677062324"
analytics_id = "G-SCBN29XZ31"

#
# The build. `python build.py` needs nothing but Python and produces a readable,
# working site; that is the default and stays the default. `--mangle` renames
# identifiers as well, which needs esbuild, and is what CI runs and what gets
# deployed - so `--check` needs it too.
#
# The version is pinned rather than merely requested. Two versions of esbuild do
# not have to invent the same names, and if the checker and the deploy disagree
# then --check reports tampering where there was none, which is worse than
# having no checker at all. The build refuses to run against any other version.
#
[build]
esbuild_version = "0.25.0"

[bmc]
# Buy Me a Coffee. The build writes their snippet out unchanged; these are the
# data- attributes it is configured with.
slug = "aboxtools"
text = "Buy me a coffee"
color = "#FFDD00"
font = "Cookie"

#
# ---------------------------------------------------------------------------
# The Content-Security-Policy every page carries.
#
# As narrow as AdSense can be made to work with: Google's own script, frame and
# measurement origins, plus the two the donate button needs, and no wildcards
# except on img-src where creatives legitimately come from anywhere.
#
# A CSP wildcard stands in for a whole label, so https://*.analytics.google.com
# does NOT cover the bare host analytics.google.com - and the bare host is where
# gtag sends its measurement hit. Both forms are listed. Adding a Google origin
# here means checking whether the bare host is needed as well as the wildcard.
#
# Known gap: Google sends the ads conversion ping to the visitor's own country
# domain - www.google.ca, www.google.co.uk - and CSP cannot wildcard a TLD. Only
# www.google.com can be named, so that one ping is still refused for a visitor
# routed to a country domain. Nothing short of widening the directive to https:
# would express it, which is not a trade worth making for a conversion ping.
#
# AdSense does not officially support a strict CSP. If an ad renders blank, open
# DevTools and look for a violation naming an origin not listed here. Add the
# origin; do not widen a directive to https: to make it go away.
#
# A tool may add values to any of these, and may add directives of its own, in
# its tool.toml [csp] table. It can only ever widen its own page - there is no
# way for a tool to remove an origin the site has decided on, and no way for one
# tool's policy to affect another's.
# ---------------------------------------------------------------------------
#

[csp]
"default-src" = ["'none'"]
"script-src" = [
  "'self'",
  "https://www.googletagmanager.com",
  "https://pagead2.googlesyndication.com",
  "https://tpc.googlesyndication.com",
  "https://partner.googleadservices.com",
  "https://www.googletagservices.com",
  "https://adservice.google.com",
  "https://ep1.adtrafficquality.google",
  "https://ep2.adtrafficquality.google",
  "https://cdnjs.buymeacoffee.com",
]
"frame-src" = [
  "https://googleads.g.doubleclick.net",
  "https://tpc.googlesyndication.com",
  "https://ep1.adtrafficquality.google",
  "https://ep2.adtrafficquality.google",
  "https://www.google.com",
]
"connect-src" = [
  "https://www.google-analytics.com",
  "https://*.google-analytics.com",
  "https://analytics.google.com",
  "https://*.analytics.google.com",
  "https://*.googletagmanager.com",
  "https://pagead2.googlesyndication.com",
  "https://googleads.g.doubleclick.net",
  "https://stats.g.doubleclick.net",
  "https://www.google.com",
  "https://ep1.adtrafficquality.google",
  "https://ep2.adtrafficquality.google",
  "https://csi.gstatic.com",
]
"style-src" = ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com"]
"font-src" = ["https://fonts.gstatic.com"]
"img-src" = ["'self'", "data:", "https:"]
"form-action" = ["'none'"]
"base-uri" = ["'none'"]

# Added to every tool page, and not to the hub. Every tool draws previews and
# results from the file you chose, and those are blob: URLs made in the page;
# the hub has no such thing and does not need the permission.
[tool_csp]
"img-src" = ["blob:"]

#
# ---------------------------------------------------------------------------
# The hub page at the root of the site.
# ---------------------------------------------------------------------------
#

#
# ---------------------------------------------------------------------------
# The 404 page.
#
# GitHub Pages serves one file, at the root of the publishing source, for every
# address it cannot find. It is the only page on the site that is read at an
# address it was not built for, which is why every URL on it is root-absolute -
# templates/404.html says more about that.
#
# It carries no advertising and is not indexed. Both on purpose, both explained
# in the template.
# ---------------------------------------------------------------------------
#

[not_found]
title = "Page not found &mdash; abox.tools"
description = "That address does not exist on abox.tools. Here are the tools that do - all of them free, and none of them uploading your files anywhere."
heading = "That page is not here"
tools_heading = "Every tool, in one place"
tools_note = "All free, all running in your browser, none of them uploading anything."

lede = """
    Either the address has a typo in it, or something that used to be at that
    address has moved. Nothing is wrong with your file and nothing was lost:
    this site has never held anything of yours to lose."""

[hub]
title = "Free Browser Tools &mdash; No Upload, No Sign-In | abox.tools"
# Kept under 155 characters. Google truncates a description around there, and
# the tail of this one is the part that sells the site, so it cannot be the
# part that gets cut.
description = "Free browser tools that never upload your files. Combine images into a PDF or an MP4, compress an image to an exact size, crop a video, or strip EXIF data."
heading = "A box of tools that never touch a server"
og_title = "A Box of Tools &mdash; tools that never touch a server"
og_description = "Small, single-purpose tools that run entirely in your browser. Your files never leave your machine."
og_image_alt = "abox.tools - tools that never touch a server"
schema_description = "Small, single-purpose utilities that do all of their work inside your browser. Nothing is uploaded and no account is needed."
schema_about = "Browser-based file utilities that process files locally without uploading them"

# "tools" rather than "utilities": this is the first line of body copy on the
# site and the only place the phrase people actually search for can appear
# early without being forced. The sentence is otherwise unchanged.
lede = """
    Small, single-purpose tools that do all of their work inside your
    browser. Your files stay on your machine: there is nothing to upload,
    no account to make, and nothing to track."""

support_note = """
      These tools are free and always will be. If one saved you a job, this is
      the only thing on the site that asks you for anything."""

# The guarantee, stated as three checkable facts rather than a promise. Every
# tool here is expected to hold all three; if one ever cannot, it says so on its
# own page instead of quietly weakening this claim.
[[hub.guarantees]]
title = "Your files never leave your machine"
body = """
        They are opened, read, and processed by your own browser, using your own
        hardware. Each tool's <code>Content-Security-Policy</code> names every
        address it may contact, and not one of them belongs to us."""

[[hub.guarantees]]
title = "Nothing about your files is sent anywhere"
body = """
        Not the file, not a thumbnail, not the name, the size, or how many you
        chose. No tool here reads any of that out. There is no server on the
        other end of these tools to read it."""

[[hub.guarantees]]
title = "It works offline"
body = """
        Open a tool once, disconnect from the internet, and it keeps working on
        your files exactly as before. That is hard to fake: a tool that sent your
        files somewhere to be processed would simply stop."""

# Categories the shipped tools are grouped under. A tool joins one by naming its
# id in `category` in its own tool.toml; the order of tools within a category is
# the order they are listed in `order` below.
[[hub.categories]]
id = "images-and-video"
name = "Images &amp; video"
note = "Work with pictures and footage without handing them to anyone."
order = ["images-to-video", "trim-video", "crop-video", "reverse-video", "grab-frame", "video-to-gif", "exif-editor", "redact-image", "heic-to-jpg", "image-to-data-uri", "image-to-ico", "svg-to-image", "id-photo", "resize-image", "compress-image"]

[[hub.categories]]
id = "gif-and-animation"
name = "GIF &amp; animation"
note = "Build an animation, or take one apart, without it leaving your machine."
order = ["gif-maker", "split-gif", "gif-analyzer"]

[[hub.categories]]
id = "audio"
name = "Audio"
note = "Work on a recording without handing it to anyone, including the sound inside a video."
order = ["trim-audio", "edit-audio"]

[[hub.categories]]
id = "documents-and-pdf"
name = "Documents &amp; PDF"
note = "Make and rearrange documents without sending them to be processed."
order = ["merge-pdf", "compress-pdf", "images-to-pdf"]

# The first category here that is not about a file at all. Everything above
# takes something off your disk; this one takes a string and hands back a
# picture of it, which is why the note says "typed" rather than "chosen".
[[hub.categories]]
id = "codes-and-data"
name = "Codes &amp; data"
note = "Turn something you typed into something a machine can read, without it leaving the page."
order = ["qr-barcode"]

# The second of those, and the one where the promise matters most: what people
# paste into an online formatter is tokens, config files and customer records.
[[hub.categories]]
id = "text-and-code"
name = "Text &amp; code"
note = "Read it, compare it, encode it - without pasting a token or a config file into somebody else's server."
order = ["text-tools"]

#
# ---------------------------------------------------------------------------
# The roadmap page.
#
# The planned list used to sit at the foot of the hub, under the shipped tools.
# It had grown to about fifty names across six groups, which meant the last
# thing a visitor saw on the front page was a long list of things this site
# cannot do yet. It reads as an apology, and it pushed the tools that do exist
# off the bottom of the screen.
#
# It is worth keeping - saying out loud where this is going is the same habit as
# saying out loud what the tools do with your files - so it moved here instead
# of being deleted. The page lists what is built first and what is planned
# second, which is the honest order and also the useful one.
#
# The content itself is still config/planned.toml. This is only the frame.
# ---------------------------------------------------------------------------
#

[roadmap]
slug = "roadmap"
nav = "Roadmap"
lastmod = "2026-08-20"

title = "Roadmap &mdash; what abox.tools is building next"
description = "Every tool planned for abox.tools, grouped and in the open, plus the ones already finished. All of them run in your browser and upload nothing."

heading = "What is coming next"
lede = """
    Everything on both lists below does its work inside your browser and
    uploads nothing &mdash; that is the rule a name has to pass before it goes
    on here at all. The counts are not written down anywhere; the build reads
    them off the two lists."""

intro_heading = "How this list was drawn up"
intro = """
    <p>
      It is not a wishlist. It was drawn up by going through the tool list of
      the largest online GIF and video site, the closest thing there is to a
      catalogue of what people actually want done to a file, and keeping every
      entry that can be built so the work happens on your own machine and keeps
      happening with the network unplugged.
    </p>
    <p>
      Most of what survived runs on APIs the browser already ships. A few need
      a codec vendored into the one tool that uses it, which is allowed &mdash;
      the file still never leaves the machine. Anything that cannot clear that
      bar was left off rather than promised, so a few of the obvious-looking
      gaps below are gaps on purpose.
    </p>
    <p>
      The tools that already exist sit at the top of their group, marked
      <em>Built</em> and linked to their own page. Everything under them is
      still to come, and nothing is a link until it is.
    </p>"""

planned_heading = "Every kind of file, and what can be done to it"

og_title = "abox.tools roadmap"
og_description = "What is built, and what is next. Everything runs in your browser and uploads nothing."
og_image_alt = "abox.tools - tools that never touch a server"

