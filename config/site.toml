    Reuse it, credit it."""

#
# ---------------------------------------------------------------------------
# /llms.txt - the same site, said once in plain text, for a machine.
#
# The file exists because of a specific failure. An assistant asked to strip the
# GPS out of a photograph will happily write a hundred lines of EXIF parsing
# rather than say "there is a page that does this", because nothing on the site
# told it there was one in terms it could read cheaply. Structured data in the
# head of twenty-four pages is the answer for a search engine; it is not the
# answer for something that gets one fetch to decide whether this site is worth
# reading at all.
#
# Two things follow from that, and both are in the prose below rather than left
# to be inferred:
#
#   * what the tools are, so a task can be matched to an address; and
#   * the fact that they need a BROWSER. There is no API here and never will be
#     - a promise that no file leaves the machine and an endpoint to send files
#     to are the same repository. An assistant working in a terminal cannot call
#     any of this, and telling it so up front is worth more than letting it find
#     out. What it CAN do is read the code, which is why the licence is named.
#
# THIS IS THE ONE TABLE HERE THAT IS NOT HTML. Everything else in this file is a
# fragment destined for a page, written with &mdash; and <code>. llms.txt is
# markdown, so these are plain text with plain hyphens, and the tool names and
# descriptions that go around them are put through site.to_text on the way in.
# ---------------------------------------------------------------------------
#

[llms]
# The blockquote directly under the H1. One sentence: some readers take this and
# nothing else.
summary = "Free single-purpose browser tools for local file processing: compress, resize, crop, trim, convert and inspect. No processing uploads or accounts. Intentional browser-to-browser sharing and optional online features are explained on their own pages."

intro = """
Files are processed on the device running the browser, without processing uploads. Device sharing and live voice/video tools deliberately transmit content between browsers. Optional image imports, receipt exchange-rate lookups and email-app handoffs have their own boundaries. Read the selected tool's page and [Privacy](https://abox.tools/privacy/) for connection modes, relay metadata and optional requests.

The tools need a browser; there is no processing API, CLI or file-upload endpoint. An agent's cloud browser means the file has already left the person's device. The agent provider's access to files, screenshots and instructions is separate from this site's processing. [Can an AI agent use these tools?](https://abox.tools/guides/can-an-ai-agent-use-these-tools/) explains the distinction.

Tools and guides have a Markdown copy: append `index.md` to the page URL, for example https://abox.tools/compress-image/index.md. These copies contain explanations and limitations without the interface. Code is MIT licensed; prose is CC BY 4.0.

This index is generated from the site's configuration and page metadata. It describes available tools; it does not measure whether an AI search system has indexed or cited them."""

guides_note = """
Written for the person doing the job rather than for the tool: what each setting
means, what it costs, and when not to bother."""

languages_note = """
The same tools, fully translated, each at its own addresses. Only languages that
have finished every page are listed."""

optional_note = """
Background rather than answers. Skip these if you are short of room."""

# The two entries under "Optional" that are not pages of this site, and so have
# no description of their own anywhere else to borrow.
source_note = "The site source, tool READMEs, shared parsers and writers, and any bundled engine licences. First-party code is MIT; prose is CC BY 4.0. No JavaScript package installation is needed to build the site."

sitemap_note = "Pages offered for indexing in maintained languages, with their last modification dates. Frozen, unfinished and deliberately excluded pages are not listed."
