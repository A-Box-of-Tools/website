#
# Receipt & Invoice Extractor
#
# OCR suggests fields; it does not verify them. A person compares each result
# with the photograph before confirming it for totals and email. Keep that
# distinction in the prose: a plausible total is not an accounting check, and a currency symbol
# alone may not identify a currency. Address inference is a fallback using the
# issuer's printed address, never a customer address or the visitor's location.
#
# Email and device sharing are deliberate handoffs after local processing.
# The page creates an email file or opens a share sheet; the visitor chooses
# the recipient and sends. Email apps vary in their support for draft files.
# Never extend the local-processing promise to what another app does with
# information the visitor has explicitly handed to it.
#

