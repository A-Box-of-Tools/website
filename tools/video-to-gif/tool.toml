[[howto]]
title = "Choose a video."
body = """
 Drop an MP4, MOV, M4V or WebM onto
      the picker, or select one by hand. It is read straight off your disk by the
      browser; nothing is sent anywhere while you do it."""

[[howto]]
title = "Mark the section."
body = """
 Play the clip and press
      <kbd>I</kbd> where it should start and <kbd>O</kbd> where it should end, or
      drag the grips on the bar. A GIF is a few seconds long &mdash; this is the
      setting that decides whether the file is small or enormous, far more than
      the other two."""

[[howto]]
title = "Choose the width and the frame rate."
body = """
 480 pixels
      wide and 12 frames a second suits most things a GIF is for. Halving the
      width quarters the pixels; twelve frames a second reads as motion without
      paying for the ones nobody sees."""

[[howto]]
title = "Make it, and download."
body = """
 The frames are read, one
      palette of 256 colours is chosen for the whole animation, and each frame is
      written as only the part of the picture that changed. It plays on the page
      when it is done, which is the same file the download gives you."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my video uploaded anywhere?"
a = """
        No. It is read, sampled and converted by your own browser on your own
        hardware. There is no server side to this tool, and the page's
        <code>Content-Security-Policy</code> names every address it may contact
        &mdash; none of them belongs to this site. Unplug from the internet and
        make a GIF anyway if you would rather check than be told."""

[[faq]]
q = "Which video formats can I convert?"
a = """
        MP4, M4V and MOV are read directly, whatever is inside them: H.264,
        HEVC, AV1 or VP9, as long as your browser can decode that codec. Anything
        else your browser can play &mdash; WebM most obviously &mdash; is read by
        seeking the player to each instant instead, which is slower and slightly
        less exact about which frame lands where. A file the browser can neither
        read nor play, which in practice means AVI, WMV, FLV and most MKVs, is
        refused with a message saying so rather than failing halfway through."""

[[faq]]
q = "Why is my GIF so big?"
a = """
        Because GIF is a format from 1987 that stores whole pictures rather than
        motion. There is no way to make one of a five-second clip that is as
        small as the five-second MP4 it came from &mdash; a GIF of a video is
        routinely ten times the size of the video. The three settings that
        actually decide it are, in order: how long the section is, how wide the
        picture is, and how many frames a second. Halving the width quarters the
        pixels, and it is pixels that cost."""

[[faq]]
q = "Why only 256 colours?"
a = """
        That is the format: a GIF carries one table of at most 256 colours and
        stores each pixel as a number into it. This tool chooses those 256 by
        counting the colours in every frame of your section and splitting them
        into 256 groups &mdash; median cut, the standard method &mdash; so the
        palette fits your clip rather than being a fixed set of colours. Where a
        colour is missing, dithering mixes the two nearest ones so a gradient
        stays a gradient instead of becoming stripes."""

[[faq]]
q = "What does the dithering setting do?"
a = """
        It trades a little noise for a lot of banding. With it on, a sky that
        would otherwise become four flat bands stays a gradient, at the cost of a
        faint texture and a larger file. With it off the picture is flatter and
        the file smaller, which suits screen recordings, line art and anything
        already made of flat colour. The dither used here is ordered rather than
        the error-diffusion kind, so an unchanged background stays perfectly
        still between frames instead of shimmering."""

[[faq]]
q = "Is there a limit on the length or the size?"
a = """
        The section is what is limited, and by memory rather than by a rule: every
        frame of it is held at once while the palette is chosen, so the page works
        out what your settings would cost and says so before you start. It
        refuses rather than letting the tab run out of memory and vanish. A
        shorter section, a smaller width or a lower frame rate all bring it
        down."""

[[faq]]
q = "Does it keep the sound?"
a = """
        A GIF cannot carry sound. There is no version of the format that has
        audio, which is the main reason the web mostly replaced GIFs with silent
        looping video. If the sound matters, keep the video &mdash; the
        <a href="../trim-video/">Video Cutter</a> will cut a section out of it
        without re-encoding a frame."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no
        watermark. The site carries advertising, which is what pays for it; the
        ads are not given anything about your video."""

[schema]
browser_requirements = "Requires JavaScript. MP4 and MOV need a browser with WebCodecs; anything the browser can play works without it."
category = "MultimediaApplication"
description = "Convert a section of a video into an animated GIF in the browser. The frames are sampled at the chosen rate, one 256-colour palette is chosen for the whole animation by median cut, and each frame is written as only the region that changed. Nothing is uploaded."
features = [
  "Converts MP4, MOV, M4V and WebM video to animated GIF",
  "H.264, HEVC, AV1 and VP9 sources, decoded through WebCodecs",
  "Mark the section on a timeline, or type exact times",
  "Any width, 5 to 25 frames a second, optional ordered dithering",
  "Runs offline; no upload, no account, no watermark",
]

# This tool needs one thing the rest of the site does not: blob: on media-src,
# because the clip you chose is played from memory on this machine rather than
# from a URL. A tool can only ever widen its own page this way - it cannot
# narrow the site policy, and it cannot touch any other tool's.
# The carry-on row reads the finished result back out of this page's own
# blob: URL before parking it for the next tool (see shared/handoff.js), and
# reading a blob: URL is a fetch the policy has to permit. blob: names bytes
# inside this page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
"media-src" = ["'self'", "blob:"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "video/*"
multiple = false
title = "Drop a video here"
hint = "or click to browse &mdash; MP4, MOV, M4V, WebM, and anything else this browser plays"
