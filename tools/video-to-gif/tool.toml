[[privacy]]
title = "Your videos have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your file
      could be collected at, and nothing in the code that would send it if there
      were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 This tool has no network feature at
      all: no address to paste, nothing to download, no engine fetched on first
      use. Every byte that touches your video came from this origin when the page
      loaded."""

[[privacy]]
title = "The decoding is local."
body = """
 The frames go through WebCodecs
      in your own browser, or through the same playback engine that would show
      you the clip anyway. Which one was used is written at the top of the page,
      because it changes how the frames are chosen and you should be able to see
      that."""

[[privacy]]
title = "The GIF is written here, in code you can read."
body = """
 The
      palette, the dithering and the LZW compression are about six hundred lines
      in this tool's own folder. There is no encoder service, no library fetched
      at run time, and no place in any of it that a picture could be sent."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about your
      video: not a file, not a frame, not a name, a size, a length, or the
