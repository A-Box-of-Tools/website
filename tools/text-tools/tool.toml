[[privacy]]
title = "What you paste has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that a pasted
      token could be collected at, and nothing in the code that would send it if
      there were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. Every parser,
      every encoder and the comparison are functions in this page that take a
      string and return a string."""

[[privacy]]
title = "The formatters keep what they were given."
body = """
 A JSON object comes back with its keys
      in the order you wrote them and its numbers spelled the way you spelled
      them, because <code>src/json.js</code> is a parser rather than a call to
      <code>JSON.parse</code>, which reorders integer-like keys and turns a
      twenty-digit id into the nearest double. The tests in
      <code>tests/js/text-format.test.js</code> check exactly that."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed a character of your text. Every line that
      reads, parses or writes it is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Pick the job."
body = """
 Four tabs, and they share one box:
      <em>Format</em> lays out or squeezes JSON, XML, HTML, CSS and YAML;
      <em>Convert</em> turns JSON into YAML or XML and back; <em>Encode</em>
      does Base64, URLs, HTML entities, hex and backslash escapes, both ways;
      <em>Compare</em> shows what changed between two texts."""

[[howto]]
title = "Paste it in, or drop the file."
body = """
 Anything you can select and copy
      works. A file dropped on the picker is read by your own browser and put in
      the box &mdash; there is no upload step to leave out. Drop two files while
      comparing and they land one either side."""

[[howto]]
title = "Let it work out the language, or tell it."
body = """
 The menu says what it read
      the text as, and correcting it is one click. A guess is only a starting
      point, which is why it is shown rather than applied silently."""

[[howto]]
title = "Choose the indentation, or squeeze it flat."
body = """
 Two spaces, four, or a
      tab. Squeezing it flat is the same document with every space that was only
      there for reading taken out, and the result says how many bytes that
      saved."""

[[howto]]
title = "Read the error where the error is."
body = """
 A parser that fails here says what
      it found and on which line and column, rather than "unexpected token at
      position 4193". That is usually enough to fix a config file without
      opening anything else."""

[[howto]]
title = "Take the result."
body = """
 Copy it, or download it as a file. A
      comparison downloads as a <code>.patch</code> in the unified format, which
      is what a code review, <code>git apply</code> and every diff viewer
      expect."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my text uploaded anywhere?"
a = """
        No. Every parser, encoder and comparison on this page is a function that
        runs in your own browser, on your own hardware. This tool has no network
        feature of any kind &mdash; it never fetches anything and never sends
        anything &mdash; and the page's <code>Content-Security-Policy</code>
        names every address it may contact, none of which belongs to this site.
        That is the reason to use it for an access token, a session cookie or a
        customer record: pasting one of those into somebody else's formatter is
        giving it to them."""

[[faq]]
q = "Does formatting JSON change anything but the layout?"
a = """
        No, and that is harder than it sounds. Keys keep the order you wrote
        them in &mdash; a formatter built on <code>JSON.parse</code> silently
        moves integer-like keys to the front, so <code>{"10":a,"2":b}</code>
        comes back as <code>{"2":b,"10":a}</code>. Numbers keep the digits you
        typed, so a twenty-digit id does not lose its last three to a double and
        <code>1e999</code> does not become <code>null</code>. Duplicate keys are
        both kept, because the standard does not say which one wins and dropping
        one would be choosing for you."""

[[faq]]
q = "Which languages can it format?"
a = """
        JSON, XML, HTML, CSS and YAML. JSON, XML, HTML and CSS can also be
        squeezed flat; YAML cannot, because its short form is flow style, which
        is unreadable, and unreadable is the opposite of the reason to keep a
        file in YAML. JavaScript is deliberately not on the list &mdash; see the
        question about it below."""

[[faq]]
q = "Why does it not format JavaScript, Python or SQL?"
a = """
        Because laying out a programming language means parsing it properly, and
        a formatter that gets it nearly right is worse than none at all: it
        produces code that looks fine and does something else. JSON, XML, CSS
        and YAML have small enough grammars to be read by hand and checked with
        tests you can run. A JavaScript formatter is Prettier, which is a
        megabyte of parser, and it belongs in your editor rather than on a web
        page."""

[[faq]]
q = "What does the comparison actually do?"
a = """
        It finds the shortest set of edits that turns the left-hand text into
        the right-hand one, using Myers' algorithm &mdash; the one
        <code>git diff</code> uses. Shortest is what makes a diff readable: a
        line inserted in the middle should show as one insertion rather than as
        every line after it having changed. Inside a changed line the words that
        differ are marked as well, so a diff of two paragraphs shows the word
        that moved rather than two whole paragraphs."""

[[faq]]
q = "Can it compare two files rather than two pastes?"
a = """
        Yes. Drop both onto the picker while the Compare tab is open and they
        land one either side, in the order you dropped them. They are read by
        your browser into this page, which is the only place they go. Swap sides
        if you dropped them the wrong way round."""

[[faq]]
q = "What comes out of a comparison, and can I apply it?"
a = """
        The download is a unified diff &mdash; the <code>@@ -3,5 +3,5 @@</code>
        format that <code>git apply</code>, <code>patch</code> and every code
        review tool read. Copy does the same thing to your clipboard. What is on
        screen is a view of it: side by side, or one column, with the unchanged
        parts collapsed to a count unless you ask for all of them."""

[[faq]]
q = "Is Base64 here the same Base64 as everywhere else?"
a = """
        Yes &mdash; it is checked against the test vectors in RFC 4648 rather
        than against itself. Both alphabets decode, so a JWT written with
        <code>-</code> and <code>_</code> reads as easily as one written with
        <code>+</code> and <code>/</code>, and input wrapped at 64 characters is
        unwrapped for you. Encoding is by UTF-8 bytes, so an accented letter or
        an emoji survives the round trip."""

[[faq]]
q = "My YAML says no and the JSON came out as a string. Why?"
a = """
        Because it is a string, and this reads YAML 1.2 rather than 1.1. In YAML
        1.1, <code>yes</code>, <code>no</code>, <code>on</code> and
        <code>off</code> were booleans, which is the famous bug that turns the
        country code for Norway into <code>false</code>. YAML 1.2 dropped that
        and so does this: only <code>true</code>, <code>false</code>,
        <code>null</code> and <code>~</code> are read as anything but text.
        Going the other way, those words are written back <em>quoted</em>, even
        though this would read them as text without the quotes &mdash; because
        whatever opens the file next may not. PyYAML still defaults to 1.1.
        Reading strictly and writing conservatively is the only combination
        that is right either way."""

[[faq]]
q = "What does converting YAML to JSON lose?"
a = """
        Comments, because JSON has nowhere to put one. Anchors, aliases and tags
        are refused outright rather than guessed at &mdash; each of them says
        something JSON cannot say, and a converter that quietly picked an
        interpretation would hand you a document that is not what the file said.
        The other direction loses nothing: every JSON document is already a YAML
        document."""

[[faq]]
q = "What does converting JSON to XML lose?"
a = """
        The difference between an empty object, an empty array and an empty
        string, all of which become an empty element, and the type of every
        value, because XML has no types &mdash; which is why the reverse
        conversion leaves everything a string rather than deciding that
        <code>8080</code> was a number. An array becomes a repeated element,
        which is the only shape that reads back, and a key that an element name
        cannot hold has its awkward characters replaced rather than being
        emitted as a document no parser will read."""

[[faq]]
q = "Does reindenting HTML change how the page looks?"
a = """
        It can, and this is honest about it. Whitespace between two inline
        elements is a space between two words, so moving it is not free. Two
        things keep that in check: <code>&lt;pre&gt;</code> and
        <code>&lt;textarea&gt;</code> are copied through exactly as they were,
        and an element holding nothing but text stays on one line. Everything
        else is laid out."""

[[faq]]
q = "How big a file can it handle?"
a = """
        There is no limit set here, because there is no server paying for one.
        The practical ceiling is your own machine: a few megabytes of JSON is
        fine. A comparison of two texts with nothing whatever in common stops
        early and says so, rather than spending a minute proving what was
        already obvious, and a very long comparison draws the first few thousand
        rows and leaves the rest to the downloaded patch."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no limit on
        how much you paste. The site carries advertising, which is what pays for
        it; the ads are not given anything about your text."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your text away to be formatted would stop the
        moment you unplugged."""

[schema]
category = "DeveloperApplication"
description = "Format and minify JSON, XML, HTML, CSS and YAML, compare two texts with a line and word diff, encode and decode Base64, URLs, HTML entities and hex, and convert JSON to YAML or XML and back. Everything runs in the browser and nothing is uploaded."
features = [
  "Formats and minifies JSON, XML, HTML and CSS, and lays out YAML",
  "Keeps the order of JSON keys and the exact digits of every number",
  "Says which line and column an error is on, in words",
  "Compares two texts with Myers' algorithm, side by side or in one column",
  "Marks the words that changed inside a changed line",
  "Downloads a comparison as a unified diff a code review can read",
  "Base64 in both alphabets, percent-encoding, HTML entities, hex and backslash escapes",
  "Converts JSON to YAML and XML, and back, saying what each direction loses",
  "Reads YAML 1.2, so yes and no stay strings",
  "Works on a dropped file as well as on a paste",
  "Runs offline; no upload, no account",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = ".txt,.json,.xml,.html,.htm,.css,.yaml,.yml,.md,.csv,.log,.svg,.sql,.js,.ts,.toml,.ini,.conf,text/*,application/json,application/xml"
multiple = true
title = "Drop a file here"
hint = "or click to browse &mdash; any text file. Two of them, while comparing."
