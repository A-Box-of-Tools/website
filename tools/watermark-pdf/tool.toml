#
# Watermark a PDF
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is what a watermark is and is not. It is words laid over every
# page so that a copy of the document says where it went and what it was for
# - "for Acme Bank only", a date, a name - which is a real defence against a
# scan being reused somewhere it was never meant to go, because the reuse is
# visible. It is not protection: anybody with an editor can take it off
# again, and this page never suggests otherwise. The tool that locks a
# document is next door, and the page points at it.
#
# The second is that the stamp is a picture, not text. The browser draws the
# words with its own fonts, in any script, and the picture is placed on each
# page with its transparency in a soft mask. That is why a Chinese or Arabic
# watermark works without a font being embedded, and why the words cannot be
# selected or searched afterwards. The page says both halves of that, and
# the preview it shows is the placement the file will get, computed by the
# same arithmetic, on a blank page the size of the visitor's first page -
# never a rendering of their document, which this site cannot do.
#

slug = "watermark-pdf"
name = "PDF Watermark"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Watermark&nbsp;PDF <span class=\"h1-kw\">&mdash; stamp every page with who it is for</span>"
tagline = "A scan that says where it went is a scan that cannot quietly go somewhere else."
icon = "&#127991;"                  # the label tag, beside the page heading
favicon = "&#127991;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "tags"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "documents"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works, chips
# is the rows of small choices - size, angle, colour - and results carries
# the file name and size lines the other PDF tools use.
css_parts = ["progress", "form", "chips", "checks", "notes", "results"]

# file-picker brings in the drop zone. The four pdf-* parts every PDF tool
# starts from are the PDF itself - the object grammar, the stream filters,
# the reader and the writer - and travel together, because the reader and the
# writer import the other two. pdf-pages is the page walk the merger wrote:
# a page's box, its rotation and the resources it inherits from the nodes
# above it, which is everything placing a stamp on it takes.
#
# example-pdf, pdf-page-writer and example-statement are for the example
# alone: an ordinary two-page statement, which is what somebody arriving here
# is holding.
js_parts = ["file-picker", "pdf-objects", "pdf-filters", "pdf-reader", "pdf-writer", "pdf-pages", "message-box", "format", "example-pdf", "pdf-page-writer", "example-statement"]
# Where a finished result can be carried without being saved first: the row
# of links shared/handoff.js shows under the result once there is one. A
# stamped document usually wants locking next, and often shrinking.
handoff = ["protect-pdf", "compress-pdf"]
lastmod = "2026-09-12"

