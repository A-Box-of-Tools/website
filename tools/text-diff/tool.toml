[[privacy]]
title = "What you paste has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that a pasted
      contract could be collected at, and nothing in the code that would send it
      if there were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. The comparison is
      a function in this page that takes two strings and returns what
      changed."""

[[privacy]]
title = "The algorithm is the standard one, readable in full."
body = """
 Myers' shortest-edit-script
      algorithm, the one <code>git diff</code> uses, hand-written in
      <code>src/diff.js</code> with the decisions commented. The tests in
      <code>tests/js/text-diff.test.js</code> prove the deletions rebuild the
      left-hand text and the insertions rebuild the right-hand one, which is
      what correct means for a diff."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed a character of either text. Every line
      that reads or compares them is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Paste the two texts, or drop the two files."
body = """
 The original on the left, the
      changed one on the right. Two files dropped on the picker at once land
      one either side, in the order you dropped them; swap sides if that was
      the wrong way round."""

[[howto]]
title = "Choose how to read it."
body = """
 Side by side, or one column. A phone
      starts on one column, because side by side needs two columns of text and
      a phone has room for about one; the menu is right there either way."""

[[howto]]
title = "Ignore what does not matter."
body = """
 Whitespace, upper and lower case,
      blank lines &mdash; each can be ignored so that a reformatted file does
      not read as a hundred changes. By default the unchanged middle is folded
      to a count, with three lines kept either side of every change."""

[[howto]]
title = "Read what changed."
body = """
 Removed lines are marked on the left,
      added ones on the right, and inside a changed line the words that differ
      are highlighted &mdash; so a diff of two paragraphs shows the word that
      moved rather than two whole paragraphs."""

[[howto]]
title = "Take the patch."
body = """
 The download is a <code>.patch</code> in
      the unified format, which is what a code review, <code>git apply</code>
      and every diff viewer expect. Copy puts the same thing on your
      clipboard."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Are my texts uploaded anywhere?"
a = """
        No. The comparison is a function that runs in your own browser, on your
        own hardware. This tool has no network feature of any kind &mdash; it
        never fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may
        contact, none of which belongs to this site. That is the reason to use
        it for a contract, a config file or unreleased code: pasting those into
        somebody else's diff checker is giving them away, both versions at
        once."""

[[faq]]
q = "What does the comparison actually do?"
a = """
        It finds the shortest set of edits that turns the left-hand text into
        the right-hand one, using Myers' algorithm &mdash; the one
        <code>git diff</code> uses. Shortest is what makes a diff readable: a
        line inserted in the middle should show as one insertion rather than as
        every line after it having changed. Inside a changed line the words that
        differ are marked as well, so a diff of two paragraphs shows the word
        that moved rather than two whole paragraphs."""

[[faq]]
q = "Can it compare two files rather than two pastes?"
a = """
        Yes. Drop both onto the picker at once and they land one either side,
        in the order you dropped them. They are read by your browser into this
        page, which is the only place they go. Swap sides if you dropped them
        the wrong way round."""

[[faq]]
q = "What comes out of a comparison, and can I apply it?"
a = """
        The download is a unified diff &mdash; the <code>@@ -3,5 +3,5 @@</code>
        format that <code>git apply</code>, <code>patch</code> and every code
        review tool read. Copy does the same thing to your clipboard. What is on
        screen is a view of it: side by side, or one column, with the unchanged
        parts collapsed to a count unless you ask for all of them."""

[[faq]]
q = "Can it ignore whitespace, case or blank lines?"
a = """
        Yes, each separately. Ignoring whitespace makes a reformatted file
        compare as unchanged; ignoring case treats <code>Error</code> and
        <code>error</code> as the same word; ignoring blank lines skips the
        lines that hold nothing. The counts above the result then say the two
        are the same once the differences you asked to ignore are ignored
        &mdash; which is not the same claim as identical, and the page keeps
        the two claims apart."""

[[faq]]
q = "How big a comparison can it handle?"
a = """
        There is no limit set here, because there is no server paying for one.
        Two texts of twenty thousand lines with a handful of edits compare
        instantly, because the common beginning and end are trimmed before the
        real work starts. A comparison of two texts with nothing whatever in
        common stops early and says so, rather than spending a minute proving
        what was already obvious, and a very long comparison draws the first
        few thousand rows and leaves the rest to the downloaded patch."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no limit on
        how much you paste. The site carries advertising, which is what pays for
        it; the ads are not given anything about your texts."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your texts away to be compared would stop
        the moment you unplugged."""

[schema]
category = "DeveloperApplication"
description = "Compare two texts with a line and word diff, side by side or in one column, and download the result as a unified patch. The comparison runs in the browser and nothing is uploaded."
features = [
  "Compares two texts with Myers' algorithm, the one git diff uses",
  "Marks the words that changed inside a changed line",
  "Side by side or one column, with the unchanged middle folded to a count",
  "Ignores whitespace, case or blank lines, each separately",
  "Downloads a unified diff that git apply and every review tool read",
  "Compares two dropped files as easily as two pastes",
  "Trims the common beginning and end, so long similar files compare instantly",
  "Runs offline; no upload, no account",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = ".txt,.json,.xml,.html,.htm,.css,.yaml,.yml,.md,.csv,.log,.svg,.sql,.js,.ts,.toml,.ini,.conf,text/*,application/json,application/xml"
multiple = true
title = "Drop two files here"
hint = "or click to browse &mdash; any text files, one for each side"
