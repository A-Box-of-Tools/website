#
# Text Diff
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# This page, json-formatter and base64 used to be one tool at /text-tools/,
# four jobs behind four tabs. The comparison was the only tab with a second
# box, which made it the odd one out in the shared layout as well as in the
# search results - so the split gave it a page shaped for two texts and an
# address of its own. src/diff.js moved here unchanged.
#
# That address was /compare-text/ first. "Text diff" is the phrase, it is
# what the name below has always been, and the German and Dutch slugs were
# already built that way round - so the English one followed them.
#

slug = "text-diff"
name = "Text Diff"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Text&nbsp;Diff <span class=\"h1-kw\">&mdash; compare two texts, side by side</span>"
tagline = "Two texts in, every difference marked, line by line and word by word. Nothing is pasted into anyone else's server."
icon = "&#9878;&#65039;"    # the mark beside the page heading
favicon = "&#9878;"        # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "diff"
category = "text-codes-and-passwords"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "beyond"

# Shared stylesheet parts this tool asks for, put before its own rules by
# the build so that its own can override them.
css_parts = ["form", "panes"]

# Shared modules this tool asks for. file-picker brings in the drop zone, which
# is here for the two files that are easier to drop than to open, select all
# and copy - twice.
js_parts = ["file-picker", "message-box", "download"]
lastmod = "2026-08-30"

# --- what search engines and chat apps are told ------------------------------

title = "Text Compare &amp; Diff Checker &mdash; Side by Side &mdash; No Upload"
description = "Compare two texts and see every difference, line by line and word by word, side by side or in one column. The comparison runs in your browser - nothing is uploaded, so unreleased code never leaves your machine."
og_title = "Compare two texts without pasting them into a server"
og_description = "A diff checker running on your own machine. Line and word differences, side by side, and a patch a code review can read - and what you paste goes nowhere."
og_image_alt = "Text Diff - compare two texts, no upload"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Line by line and word by word, every difference marked - and neither text goes anywhere."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  This tool needs no directive of its own. It fetches nothing, decodes nothing
  from the network, and draws no picture: the one blob: URL it makes is the
  download link for the patch, which is a link rather than an image, and
  needs no permission at all.
  img-src still carries blob: because every tool page does, and https: because
  ad creatives come from anywhere."""

