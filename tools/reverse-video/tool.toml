[[privacy]]
title = "Your videos have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your file
      could be collected at, and nothing in the code that would send it if there
      were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 This tool has no network feature at
      all: no address to paste, nothing to download, no engine fetched on first
      use. Every byte that touches your video came from this origin when the page
      loaded."""

[[privacy]]
title = "The decoding and encoding are local."
body = """
 The frames go through
      WebCodecs in your own browser, or through the same playback engine that
      would show you the clip anyway. The finished file is built in memory on
      this machine and handed straight to a download."""

[[privacy]]
title = "The sound is turned round here too."
body = """
 Reversing a track means
      decoding it, and that decoding is the browser's own, running on this
      machine. Nothing listens to it, nothing keeps it, and nothing could pass it
      anywhere: there is no code path here that sends a byte."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about your
      video: not a file, not a frame, not a name, a size or a length. Every line
      that reads, decodes, reverses or encodes is served from this origin and
      listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The "Buy me a coffee" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about you
      or your video."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and everything on
      this page still works. That is the simplest proof of all."""

[[howto]]
title = "Choose a video."
body = """
 Drop an MP4, MOV, M4V or WebM onto
      the picker, or select one by hand. It is read straight off your disk by the
      browser; nothing is sent anywhere while you do it."""

[[howto]]
title = "Decide about the sound."
body = """
 &ldquo;Reverse the sound
      too&rdquo; turns the track round sample by sample, which is what makes
      speech come out as speech played backwards rather than as silence. Turn it
      off for a silent clip, which is quicker."""

[[howto]]
title = "Choose how much quality to spend."
body = """
 The picture has to
      be encoded again, because the frames come out in an order nothing in the
      file was coded for. &ldquo;Balanced&rdquo; keeps close to what the original
      spent; &ldquo;Best quality&rdquo; spends more."""

[[howto]]
title = "Reverse it and download."
body = """
 The work happens on your own
      hardware, so how long it takes depends on your machine rather than on a
      queue. The finished video is handed straight to your browser's
      downloads."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my video uploaded anywhere?"
a = """
        No. It is read, decoded, reversed and encoded by your own browser on your
        own hardware. There is no server side to this tool, and the page's
        <code>Content-Security-Policy</code> names every address it may contact
        &mdash; none of them belongs to this site. Unplug from the internet and
        reverse a clip anyway if you would rather check than be told."""

[[faq]]
q = "Which video formats can I reverse?"
a = """
        MP4, M4V and MOV are read directly, whatever is inside them: H.264,
        HEVC, AV1 or VP9, as long as your browser can decode that codec. Anything
        else your browser can play &mdash; WebM most obviously &mdash; is
        reversed by stepping the browser's own player backwards through it
        instead, which works but is slower. A file the browser can neither read
        nor play, which in practice means AVI, WMV, FLV and most MKVs, is refused
        with a message saying so rather than failing halfway through. What comes
        out is always an MP4."""

[[faq]]
q = "Does the sound get reversed as well?"
a = """
        Yes, unless you turn it off. The whole track is decoded, the samples are
        put in the other order, and it is encoded again as AAC. There is no way
        to avoid that second encode: an audio packet is a few tens of
        milliseconds of sound coded against the packet before it, so writing the
        packets out back to front would play short pieces forwards in the wrong
        order &mdash; which sounds like a fault rather than like a reversal."""

[[faq]]
q = "Does reversing lose quality?"
a = """
        The picture is encoded a second time, which costs a little. It cannot be
        avoided here the way it can when trimming: a reversed clip shows its
        frames in an order nothing in the original file was coded for, so every
        frame has to be written afresh. What the tool will not do is spend more
        than the original did, since encoding above that only makes the file
        bigger without making it look better."""

[[faq]]
q = "Is there a limit on the size or length of the video?"
a = """
        There is no limit built into the tool, and the file is not read into
        memory all at once &mdash; it is walked group of frames by group of
        frames, backwards. The practical ceilings are the finished video, which
        is assembled in memory before you download it, and the sound, which has
        to be held whole because reversing needs the last sample before it can
        write the first."""

[[faq]]
q = "Why is it slower on some files than others?"
a = """
        Because there are two ways in. An MP4 or MOV is read by this tool
        directly and decoded a group of frames at a time, which is as fast as
        your machine goes. Anything else is reversed by asking the browser's own
        player for one moment of the clip after another, and each of those seeks
        makes the browser decode from the keyframe in front of it. The page says
        which of the two it is using, and why, before you start."""

[[faq]]
q = "Can I reverse only part of a clip?"
a = """
        Not here. This tool reverses the whole thing: the clip that comes out is
        exactly as long as the one that went in, with the last frame first. Cut
        the part you want first with the
        <a href="../trim-video/">Video Cutter</a> &mdash; which does it without
        re-encoding a frame &mdash; and reverse what comes out of that."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no
        watermark. The site carries advertising, which is what pays for it; the
        ads are not given anything about your video."""

[schema]
browser_requirements = "Requires JavaScript and a browser with WebCodecs video encoding: Chrome, Edge, Safari 16.4 or newer, or Firefox 133 or newer."
category = "MultimediaApplication"
description = "Reverse a video in the browser, sound included. MP4, MOV and M4V are decoded group by group from the end and encoded again with the original frame times; anything else the browser can play is stepped through backwards instead. Nothing is uploaded."
features = [
  "Reverses MP4, MOV, M4V and WebM video",
  "H.264, HEVC, AV1 and VP9 sources, decoded through WebCodecs",
  "Reverses the sound sample by sample, or leaves it out",
  "Keeps the original frame times, uneven frame rates included",
  "Runs offline; no upload, no account, no watermark",
]

# This tool needs one thing the rest of the site does not: blob: on media-src,
# because both the clip you chose and the reversed result are played from memory
# on this machine rather than from a URL. A tool can only ever widen its own
# page this way - it cannot narrow the site policy, and it cannot touch any
# other tool's.
# The carry-on row reads the finished result back out of this page's own
# blob: URL before parking it for the next tool (see shared/handoff.js), and
# reading a blob: URL is a fetch the policy has to permit. blob: names bytes
# inside this page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
"media-src" = ["'self'", "blob:"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "video/*"
multiple = false
title = "Drop a video here"
hint = "or click to browse &mdash; MP4, MOV, M4V, WebM, and anything else this browser plays"
