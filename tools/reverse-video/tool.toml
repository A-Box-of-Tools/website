#
# Video Reverser
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "reverse-video"
name = "Video Reverser"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Video&nbsp;Reverser <span class=\"h1-kw\">&mdash; play a video backwards</span>"
tagline = "Last frame first, sound and all."
icon = "&#9194;&#65039;"          # the mark beside the page heading
favicon = "&#9194;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "rewind"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker"]
# Where a finished result can be carried without being saved first: the row of
# links shared/handoff.js shows beside the download once there is one. Slugs of
# tools whose picker takes what this page produces; checked against the tools
# that exist by the build.
handoff = ["trim-video", "video-to-gif"]
lastmod = "2026-08-28"

# --- what search engines and chat apps are told ------------------------------

title = "Reverse a Video Online &mdash; Free, No Upload, Works Offline"
description = "Play an MP4, MOV or WebM backwards, with the sound reversed too. Runs in your browser: nothing is uploaded, there is no watermark, and it works offline."
og_title = "Video Reverser &mdash; play a clip backwards without uploading it"
og_description = "Reverse a video and the sound in it, frame by frame, on your own machine. The file is read, decoded and written by your own browser."
og_image_alt = "Video Reverser - play a clip backwards in your browser, with nothing uploaded"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Play a clip backwards - the picture and the sound - without it leaving your machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  media-src needs blob: because both the clip you chose and the reversed result
  are played from memory on this machine rather than from a URL. That is the
  only addition: this tool fetches nothing, so connect-src is left exactly as
  the site sets it."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Every frame is decoded, turned round and encoded again by your own browser,
    on your own hardware. Nothing here can fetch or send anything &mdash; there is
    no network feature in this tool at all &mdash; and there is no server on the
    other end of this page to send a video to even if there were."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and
      reverse a clip. Not one request carries a frame, a filename, or a byte of
      what you chose. Or unplug from the internet and reverse one anyway &mdash; a
      tool that sent your video away to be processed would simply stop."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/timeline.js</code> for the arithmetic that
      decides which frame comes out when, and <code>src/reverse.js</code> for the
      loop that walks the file backwards a group of frames at a time. None of
      them imports anything that can make a request."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to reverse a video"

# --- the card on the hub page ------------------------------------------------

card = """
            Play a clip backwards &mdash; the picture and the sound both &mdash;
            without sending it anywhere."""

