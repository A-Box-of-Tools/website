  "MD5, SHA-1, SHA-256, SHA-384 and SHA-512, in one pass over the file",
  "No size limit: the file is read in pieces and never held whole",
  "Paste the expected value in any published form and it works out which algorithm it is",
  "Reads sha256sum output, SHA256SUMS files, the BSD tagged form and integrity attributes",
  "Says in a sentence whether the file matches, not just in a colour",
  "Copy one checksum, all of them, or save them as a tagged text file",
