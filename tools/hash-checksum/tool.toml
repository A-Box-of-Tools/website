description = "Work out the MD5, SHA-1, SHA-256, SHA-384 or SHA-512 of any file and compare it with the checksum the download page published. The file is read in your browser and never uploaded, at any size."
og_title = "Verify a download without uploading it to anybody"
og_description = "MD5, SHA-1, SHA-256, SHA-384 and SHA-512, worked out in your own browser. Paste the checksum the publisher printed and the page says whether it matches. No size limit, because the file is read in pieces."
