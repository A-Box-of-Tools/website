#
# Hash & Checksum
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The words below have one job the others do not: they have to be honest about
# what a checksum proves. It proves the bytes arrived unaltered. It does not
# prove the publisher is trustworthy, and it does not prove much at all if the
# checksum came down the same wire as the file. Both of those are said out loud
# on the page rather than left to be inferred, because the visitor most likely
# to be here is one who has just been told to "verify the download" and has not
# been told what that is worth.
#

slug = "hash-checksum"
name = "Hash & Checksum"
