# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  This tool needs no directive of its own, and it is the clearest case on the
  site of why: it fetches nothing, decodes nothing from the network, and draws
  nothing. The only blob: URL it makes is the download link for the list of
  checksums, which is a link rather than an image and needs no permission.
  img-src still carries blob: because every tool page does, and https: because
  ad creatives come from anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    A checksum is arithmetic over the bytes of your file, and it is done here, in
    this page, on your own processor. The file is read off your disk four
    megabytes at a time and each piece is thrown away as soon as it has been
    counted, so nothing is ever assembled anywhere &mdash; not in memory, and
    certainly not on a server. There is no server on the other end of this page
    to send a file to even if anything here wanted to."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and check
      a file. Not one request carries a byte of it, or its name, or its size. Or
      unplug from the internet and check one anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/md5.js</code>,
      <code>src/sha1.js</code>, <code>src/sha256.js</code> and
      <code>src/sha512.js</code> for the four compression functions,
      <code>src/blocks.js</code> for the padding they share, and
      <code>src/hash.js</code> for the loop that reads your file in pieces
      &mdash; none of which has a line that could reach the network."""

