[[privacy]]
title = "The calculator runs in this browser."
body = "The tool's processing code calculates results and draws pictures locally. It sends no input or result to a service. Content-Security-Policy restricts connection destinations but does not inspect payloads; compare the source with the Network tab, or use the calculator while disconnected."
[[privacy]]
title = "There is no model or live lookup."
body = "Landmarks and formulas ship with this page. Comparisons are selected by arithmetic over that catalogue. Source links open only when you choose to read them."
[[privacy]]
title = "Your entries stay in the page."
body = "The calculator writes no inputs to storage or to the address bar. Reloading resets the exploration. A saved picture is a file you deliberately keep on your device."
[[privacy]]
title = "The site's other scripts have their own boundaries."
body = "The frame may load advertising and measurement scripts. The calculator does not send them your inputs or results. The live network panel reports the page's connections."

[[howto]]
title = "Type a number or drag the dial."
body = "Try a billion, 1.5b or 1e12. Whole numbers from zero to 10³⁰ are accepted. The dial moves through powers of ten, and the picture follows as you drag."
[[howto]]
title = "Choose books, water, stars, sand or time."
body = "Each pictures the same number in a different way and says what one of them is. In books, each one can also be a word or an AI text token, which turns the count into a length of writing."
[[howto]]
title = "Watch it grow, and compare."
body = "The camera pulls back as the number climbs. Press × 10 or Grow from 1 to see it again, and read the landmarks beside your number to see how many times bigger each one is. Guess whether ten times more will reach the next one."
[[howto]]
title = "Check the assumptions, then keep the picture."
body = "Change the book thickness, drop size, grain diameter or counting rate, and read where each landmark's figure comes from. Save the picture as a PNG with its assumptions written beneath it."

[[faq]]
q = "Does this need an AI model?"
a = "No. The browser places your number among a small catalogue of landmarks and calculates the results itself. There is no API key, model download or ongoing AI charge."
[[faq]]
q = "How tall is a stack of a billion books?"
a = "With books 3 cm thick, about 30,000 km: more than twice the width of the Earth, and about 8% of the way to the Moon. It would take about 13 billion books to reach the Moon. You can change the thickness in the assumptions."
[[faq]]
q = "How much water is a billion drops?"
a = "With drops of 0.05 mL, the size a dropper gives, 50,000 liters: about 250 bathtubs of 200 liters, or 2% of an Olympic pool. A dripping tap's larger drop of about 0.25 mL makes it five times as much."
[[faq]]
q = "How many stars is a billion?"
a = "About 1% of the Milky Way, taking ESA's round figure of 100 billion stars, and the true number may be several times that. It is also about 110,000 times the 9,100 or so stars bright enough to see without a telescope across the whole sky."
[[faq]]
q = "How much sand is a billion grains?"
a = "With the chosen model of spherical grains 0.5 mm across and a container holding 60% grains and 40% air, about 109 liters: roughly eleven 10-liter buckets. Real grains vary, so this is an estimate under those assumptions."
[[faq]]
q = "How many books is a million tokens?"
a = "For English text, the rough estimate of 0.75 words per token gives about 750,000 words. With the default example of 75,000 words per book, that is ten books, a stack about 30 cm high. Language, tokenization and book length change the answer. It is a writing equivalent, not evidence of books actually read or generated."
[[faq]]
q = "What mountain is used?"
a = "A deliberately defined example: a cone 1,000 meters tall with a base radius of 1,000 meters. Its volume is one third of pi times radius squared times height. A real mountain needs its own geometry; height alone cannot tell you its volume."
[[faq]]
q = "Can it compare with all the sand on Earth?"
a = "This version does not invent an exact global grain count. Such an estimate first needs a scope, such as beaches or deserts, and assumptions about area, depth and grain size. Use the defined containers and landmarks for comparisons whose assumptions can be inspected."
[[faq]]
q = "Are the pictures drawn to physical scale?"
a = "The book stack and its landmarks share one true ruler, except that the stack is drawn wider than real once it would otherwise vanish, and the timeline is true in the same way. Water and sand are not on one ruler: the containers are illustrations, and the colored area is the true share of the named container. Stars are one to a dot until there are too many to draw, and after that the caption says how many each dot stands for."
[[faq]]
q = "Can I turn the animation off?"
a = "Yes. Pause motion stops everything moving and leaves the finished picture on screen. If your device is set to reduce motion, the page shows the finished picture from the start."
[[faq]]
q = "Does the tool work offline?"
a = "Yes. After the page is loaded, all calculations, comparisons, drawings and saved pictures work without a connection. No input is uploaded for processing."

