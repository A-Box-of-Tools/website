#
# Protect a PDF
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is the same one /unlock-pdf/ holds on to, seen from the other
# side: "protected" means two different things and this page must never let
# them blur. An *open password* is real - the document is genuinely enciphered
# and nobody without the password reads it. *Restrictions* - no printing, no
# copying, no editing - are a request that well-behaved readers honour and any
# reader may decline, documented as such by Adobe from the beginning, and this
# site publishes the page that declines them. So a tool that offers both has
# to say, beside the checkboxes, which of the two it is writing and what each
# is worth. Every sentence here is written so that somebody who knows the
# format cannot catch it overstating either.
#
# The second is that a password set here is the only way back in. Nothing on
# this site guesses passwords, and neither does anything honest elsewhere, so
# the page asks for the password twice, says once in plain words that a
# forgotten one means a lost document, and never writes a file nobody could
# open by accident: an owner password left blank is filled in, never left
# empty, and a document is only ever closed by the password the visitor typed
# twice.
#

slug = "protect-pdf"
name = "PDF Protector"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Protect&nbsp;PDF <span class=\"h1-kw\">&mdash; put a password on it, and restrictions if you want them</span>"
tagline = "Lock a document you would rather not hand to a website in order to lock it."
icon = "&#128274;"                  # the padlock, beside the page heading
favicon = "&#128274;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "file-lock"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "documents"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works, modes
# is the choice between the two encryption schemes, checks is the row of
# restrictions, and results carries the file name and size lines the other
# PDF tools use.
css_parts = ["progress", "form", "checks", "modes", "notes", "results"]

# file-picker brings in the drop zone. The four pdf-* parts the compressor, the
# merger, the redactor and the unlocker also ask for are the PDF itself - the
# object grammar, the stream filters, the reader and the writer - and travel
# together, because the reader and the writer import the other two.
#
# pdf-crypt is the standard security handler, shared with /unlock-pdf/ since
# this tool needed the other half of it: the same file that derives a key from
# a password to open a document builds the dictionary and the cipher that lock
# one. aes and rc4 are its two ciphers, pdf-permissions is /P as a list, and
# md5 with hash-blocks is the checksum tool's MD5, which every version of PDF
# encryption before 2017 runs a password through and no browser offers.
#
# example-pdf, pdf-page-writer and example-statement are for the example alone:
# an ordinary two-page statement with nothing on it, which is what somebody
# arriving here is holding.
js_parts = ["file-picker", "pdf-objects", "pdf-filters", "pdf-reader", "pdf-writer", "pdf-crypt", "aes", "rc4", "pdf-permissions", "md5", "hash-blocks", "message-box", "format", "example-pdf", "pdf-page-writer", "example-statement"]
lastmod = "2026-09-11"

