#
# DICOM Viewer
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# This is the tool on this site where the promise has the sharpest edge. The
# other pages handle holiday photographs and invoices; this one handles a file
# that is a person's medical record, and whose header carries their name, their
# date of birth, their hospital number and the name of the doctor who ordered
# the scan. "Nothing is uploaded" stops being a nice property of a website and
# becomes the reason to use this rather than the first result on a search
# engine, most of which have an upload box.
#
# Which is why the words below say what the file contains as well as where it
# goes. A viewer that quietly showed the picture and said nothing about the
# forty identifying fields behind it would be keeping the letter of the promise
# and missing the point of it.
#

slug = "dicom-viewer"
name = "DICOM Viewer"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "DICOM&nbsp;Viewer <span class=\"h1-kw\">&mdash; open a .dcm scan in your browser</span>"
tagline = "CT, MR, X-ray and ultrasound, with the window, the header and the measurements."
icon = "&#129659;"         # the mark beside the page heading
favicon = "&#129659;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "scan"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "images"

# Shared modules this tool asks for. file-picker brings in the drop zone; it is
# set to accept many files because a CT is three hundred of them and dropping a
# folder is the only sane way to open one.
js_parts = ["file-picker"]
lastmod = "2026-08-25"

# --- what search engines and chat apps are told ------------------------------

title = "DICOM Viewer &mdash; Open a .dcm File in Your Browser, No Upload"
description = "Open CT, MR, X-ray and ultrasound scans in your browser. Window and level, scroll a whole series, measure in millimetres, read every DICOM tag, and see exactly what in the file identifies the patient. Nothing is uploaded."
og_title = "DICOM Viewer &mdash; open a scan without uploading it"
og_description = "A .dcm file opened on your own machine: window and level, the whole series stacked in order, measurements in millimetres, and every tag in the header. No upload, no account."
og_image_alt = "DICOM Viewer - open a CT, MR or X-ray scan in the browser"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "A scan, its window, its measurements and its header - none of it uploaded."

# --- the pledge block --------------------------------------------------------

pledge = """
    The scan is opened and decoded by your own browser: the header, the pixels, the
    window, the measurements. There is no server on the other end of this page to
    send protected health information to even if anything here wanted to, and
    nothing about the file - not the patient's name, not the study, not the
    filename - is read out to anyone."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and open a
      scan. Not one request carries an image, a tag, or a filename. Or unplug from
      the internet and open one anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/dicom.js</code> for the parser that
      walks the file, <code>src/pixels.js</code> for the pixel decoding,
      <code>src/jpeg-lossless.js</code> for the codec most hospital exports use,
      and <code>src/window.js</code> for the window and level &mdash; none of which
      has a line that could reach the network."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to open a DICOM file"

# --- the card on the hub page ------------------------------------------------

card = """
            Open a CT, MR, X-ray or ultrasound scan on your own machine.
            Window and level it, scroll the whole series, measure in
            millimetres, and read every tag in the header."""

