  "Multi-frame files play as a loop",
  "Measures in millimetres, with non-square pixels accounted for",
  "Reads the pixel value under the cursor in Hounsfield units",
  "Every DICOM tag with its name and value, searchable",
  "Lists what in the file identifies the patient, from the PS3.15 profile",
  "Decodes RLE, baseline JPEG and JPEG Lossless without a vendored library",
  "Saves the frame as a PNG and the header as plain text",
  "Runs offline; no upload, no account, no change to your file",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
#
# `accept` is everything, and that is the considered answer rather than a
# shrug. A great many DICOM files have no extension at all - a hospital disc is
# a folder of files called IM000001 - so a picker filtered to `.dcm` would hide
# exactly the files that most need a viewer, and hide them in the file dialog
# where nobody would know why.
[picker]
accept = "*/*"
multiple = true
title = "Drop a scan here"
hint = "or click to browse &mdash; one .dcm file, or a whole folder of them"
