#
# Image to SVG
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# THE ONE THING TO KNOW ABOUT THIS TOOL
#
# It traces SHAPES, not photographs, and the page says so in several places on
# purpose. A photograph traced as though it were line art comes back as four
# thousand overlapping blobs and a megabyte and a half of path, which is worse
# than the JPEG in every way a person could measure. That is not a bug to fix
# later: it is what tracing is, and docs/what-can-be-built-here.md ruled the
# whole idea out on those grounds until the tool was built with the refusal in
# it. src/main.js stops drawing past a thousand loops and says what happened.
#

