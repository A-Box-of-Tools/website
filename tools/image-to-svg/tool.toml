# vendored. It is the mark gif-analyzer wears too, and for the same reason:
# both pages look at a picture and work out what is in it. `shapes` would have
# been the obvious choice and belongs to /svg-to-image/, which is this tool
# backwards; two neighbouring cards in one category wearing one mark would say
# they were the same tool.
