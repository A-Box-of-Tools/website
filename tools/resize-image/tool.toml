#
# Image Resizer
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "resize-image"
name = "Image Resizer"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Image&nbsp;Resizer <span class=\"h1-kw\">&mdash; resize, crop and convert</span>"
tagline = "Say the size. Draw the box. Pick the format."
icon = "&#128208;"          # the mark beside the page heading
favicon = "&#128208;"       # the tab icon, drawn into an inline SVG
category = "images-and-video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. file-list is the drop-a-file-then-see-a-row widget that
# more than one tool needs and that no tool should own.
css_parts = ["file-list"]

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker"]
lastmod = "2026-08-20"

# --- what search engines and chat apps are told ------------------------------

title = "Resize an Image &mdash; Crop and Convert Too, No Upload"
description = "Resize, crop and convert JPEG, PNG and WebP images in your browser. Exact pixels, a percentage, or a long edge - one image or a whole folder. Nothing is uploaded."
og_title = "Resize, crop and convert an image without uploading it"
og_description = "Set the size in pixels or as a percentage, drag a crop box, change the format - for one picture or a whole batch. It all runs on your own machine."
og_image_alt = "Image Resizer - resize, crop and convert without uploading"

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  img-src needs blob: for the crop preview and the results this page draws from
  the files you chose, and https: because ad creatives come from anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    The resizing, the cropping and the format change all run in your own
    browser, on your own hardware, using the image encoders it already ships
    with. This tool has no network feature of any kind &mdash; nothing to fetch,
    nothing to send &mdash; and there is no server on the other end of this page
    to send a picture to even if there were."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and resize
      a photo. Not one request carries an image, a thumbnail, a filename, or a byte
      of what you chose. Or unplug from the internet and resize one anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/geometry.js</code> for the arithmetic
      that decides what is kept and how large it comes out, and
      <code>src/codecs.js</code> for the single <code>drawImage</code> call that
      does the crop and the resize together."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to resize an image without uploading it"

# --- the card on the hub page ------------------------------------------------

card = """
            Exact pixels, a percentage, or a long edge &mdash; with a crop box
            and a format change on the way through. One picture or a folder."""

