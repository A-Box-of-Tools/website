lastmod = "2026-08-20"

# --- what search engines and chat apps are told ------------------------------

title = "Reverse Audio, Change Speed &amp; Boost Volume &mdash; Free, No Upload"
description = "Play a track backwards, speed it up or slow it down, and make a quiet recording louder. Takes the sound out of a video too. Runs in your browser: nothing uploaded."
og_title = "Audio Editor &mdash; reverse, retime and amplify without uploading anything"
og_description = "Reverse a track, change its speed with or without moving the pitch, and set the level - then download a WAV. The file is read and written by your own browser."
og_image_alt = "Audio Editor - reverse, retime and amplify audio in your browser"

