# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Reverse a track, change its speed, or lift a quiet recording - on your own machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  media-src needs blob: because both the file you chose and the edited result
  are played from memory on this machine rather than from a URL. That is the
  only addition: this tool fetches nothing, so connect-src is left exactly as
  the site sets it."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Your file is read, edited and written by your own browser, on your own
    hardware. Nothing here can fetch or send anything &mdash; there is no network
    feature in this tool at all &mdash; and there is no server on the other end of
    this page to send a recording to even if there were."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and
      reverse something. Not one request carries a sample, a filename, or a byte
      of what you chose. Or unplug from the internet and edit a track anyway
      &mdash; a tool that sent your audio away to be processed would simply
      stop."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/decode.js</code> for the twenty lines
      that hand your file to the browser's own decoder, <code>src/stretch.js</code>
      for the time-stretcher, <code>src/speed.js</code> for the resampler, and
      <code>src/wav.js</code> for the header that goes in front of the samples.
      None of them imports anything that can make a request."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to edit an audio file"

# --- the card on the hub page ------------------------------------------------

card = """
            Reverse a track, change its speed with or without moving the pitch,
            and bring a quiet recording up. Takes the sound out of a video
            too."""

