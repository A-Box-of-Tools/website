# --- the pledge block --------------------------------------------------------

pledge = """
    The scaling and the icon files themselves are both made in your own
    browser. The picture is drawn by the canvas your browser already ships
    with, and each container &mdash; the Windows <code>.ico</code>, the macOS
    <code>.icns</code> &mdash; is assembled from those pixels by a couple of
    hundred lines in <code>src/ico.js</code> and <code>src/icns.js</code> that
    you can read. This tool has no network feature
    of any kind &mdash; nothing to fetch, nothing to send &mdash; and there is no
    server on the other end of this page to send a logo to even if there were."""

