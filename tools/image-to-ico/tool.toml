slug = "image-to-ico"
name = "Image to ICO"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Image&nbsp;to&nbsp;ICO <span class=\"h1-kw\">&mdash; favicon, Windows and macOS icon maker</span>"
tagline = "One picture in. Every size a browser, Windows or a Mac asks for, out."
icon = "&#128278;"          # the mark beside the page heading
favicon = "&#128278;"       # the tab icon, drawn into an inline SVG
category = "images-and-video"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "images"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. file-list is the drop-a-file-then-see-a-row widget that
# more than one tool needs and that no tool should own.
css_parts = ["file-list"]

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker"]
lastmod = "2026-08-20"

# --- what search engines and chat apps are told ------------------------------

title = "Image to ICO &mdash; Make a Favicon, App Icon or ICNS, No Upload"
description = "Convert a PNG, JPEG or SVG into a real multi-size .ico or a macOS .icns in your browser. Favicon, Windows app icon, Mac app icon, plus the Apple and Android files a site needs. Nothing is uploaded."
og_title = "Make an .ico or an .icns with every size in it, without uploading anything"
og_description = "A favicon.ico for a website, an app.ico for a Windows program, an .icns for a Mac - with a preview at 16 pixels before you download. It all runs on your own machine."
og_image_alt = "Image to ICO - favicon, Windows and macOS icon maker, no upload"

