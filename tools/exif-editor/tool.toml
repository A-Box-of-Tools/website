# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my photo uploaded anywhere?"
a = """
        No. The file is read, parsed and rewritten by your own browser on your own
        hardware. This tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site."""

[[faq]]
q = "What is EXIF, and what else is hiding in a photo?"
a = """
        EXIF is a block of tags a camera writes beside the picture: the make and
        model, the exposure settings, the date and time to the second, often a GPS
        position, and sometimes a serial number. Photos frequently carry more
        besides &mdash; an XMP packet of XML from an editor, an IPTC block of caption
        and byline fields, a colour profile, a small second copy of the image as a
        thumbnail, and a maker note of undocumented manufacturer data. JPEG, PNG and WebP inventories list these blocks. AVIF shows available
        extracted EXIF only; other AVIF metadata is not inventoried."""

[[faq]]
q = "Does removing metadata reduce the image quality?"
a = """
JPEG, PNG and WebP cleaning edits their containers and copies their
        compressed picture data byte for byte, without decoding or recompressing
        it. AVIF cleaning instead decodes the first image and writes a new
        lossless PNG without copying original metadata. That PNG may be larger,
        and the browser's decoding can change HDR or colour representation.
        The original file stays unchanged.
"""

[[faq]]
q = "Which file formats does it handle?"
a = """
JPEG, PNG and WebP support metadata viewing, editing and container
        cleaning. AVIF supports a preview of available extracted EXIF and
        cleaning to a new PNG; AVIF tags are read-only and other metadata is not
        inventoried. Animated AVIF uses the first image. HEIC and bare TIFF are
        recognised but not rewritten. Convert HEIC first when needed.
"""

[[faq]]
q = "Will my photo appear rotated after the metadata is removed?"
a = """
For JPEG, PNG and WebP, keeping the orientation tag writes a small
        EXIF block containing only that tag when needed. Turn the option off
        to drop it. AVIF cleaning uses the browser's upright decoded image and
        creates a PNG; the orientation and colour-profile checkboxes apply
        only to JPEG, PNG and WebP.
"""

[[faq]]
q = "Does it remove the GPS location?"
a = """
        Cleaning removes the original location metadata. For JPEG, PNG and WebP,
        you can also delete location tags individually and keep the rest.
        AVIF cleaning creates a PNG without copying original metadata. The position is shown in
        decimal degrees first, because "51 degrees, 30 minutes, 26 seconds" does not
        make it obvious that a photo names the building it was taken in."""

[[faq]]
q = "Can I change a tag instead of deleting it?"
a = """
JPEG, PNG and WebP support tag editing and additions. A rewritten
        maker note may contain invalid manufacturer-specific offsets, so keep
        the original when that matters. AVIF's extracted EXIF is read-only;
        its cleaning action creates a PNG without original metadata rather
        than rewriting the AVIF container.
"""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in and no trial. The site
        carries advertising, which is what pays for it; the ads are not given
        anything about your photos."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being uploaded:
        a tool that sent your photos away to be processed would stop the moment you
        unplugged."""

[schema]
category = "MultimediaApplication"
description = "Read the EXIF, GPS, XMP and IPTC metadata inside a photo, edit individual tags, or remove all of it in one click. JPEG, PNG and WebP use container edits; AVIF shows available EXIF and cleans to a new PNG in the browser."
features = [
  "Shows every EXIF tag, including GPS position, camera serial numbers and maker notes",
  "Edits or deletes individual tags and writes the file back",
  "Removes EXIF, GPS, XMP, IPTC, comments and the embedded thumbnail in one click",
  "JPEG, PNG and WebP container editing; AVIF EXIF preview and PNG cleaning",
  "Keeps JPEG, PNG and WebP encoding; AVIF cleaning decodes the first image to PNG",
  "Runs offline; no upload, no account",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "image/jpeg,image/png,image/webp,image/avif,.jpg,.jpeg,.png,.webp,.avif"
multiple = true
title = "Drop photos here"
hint = "or click to browse &mdash; JPEG, PNG, WebP and AVIF"
# A JPEG carrying a hand-written EXIF block - camera, lens, exposure,
# date and GPS. A picture with an empty header would say nothing, which is the
# one thing this tool is for reading.
example = true

# The carry-on row reads the finished result back out of this page's own
# blob: URL before parking it for the next tool (see shared/handoff.js), and
# reading a blob: URL is a fetch the policy has to permit. blob: names bytes
# inside this page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
