#

slug = "grab-frame"
name = "Video Frame Grabber"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Video&nbsp;Frame&nbsp;Grabber <span class=\"h1-kw\">&mdash; save a frame from a video</span>"
tagline = "A full-quality still from any point."
icon = "&#127902;&#65039;"          # the mark beside the page heading
favicon = "&#127902;"      # the tab icon, drawn into an inline SVG
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker", "zip", "crc32"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Grab a Frame From a Video &mdash; Free, No Upload, Works Offline"
description = "Save any frame of an MP4, MOV or WebM as a full-size PNG or JPEG. Step frame by frame, or take one every few seconds. Runs in your browser: nothing uploaded."
og_title = "Video Frame Grabber &mdash; a still from any point, without uploading the clip"
og_description = "Find the moment, step to the exact frame, and save it at the video's own resolution. The frames are decoded on your own machine and the picture is never re-encoded twice."
og_image_alt = "Video Frame Grabber - save a frame from a video in your browser, with nothing uploaded"

