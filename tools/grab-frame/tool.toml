# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Save any frame of a clip as a picture, at the size the video really is."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  media-src needs blob: because the clip you chose is played from memory on this
  machine rather than from a URL. That is the only addition: this tool fetches
  nothing, so connect-src is left exactly as the site sets it."""

