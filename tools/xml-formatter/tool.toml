[[privacy]]
title = "What you paste has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that a pasted
      invoice could be collected at, and nothing in the code that would send it
      if there were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. The parser and the
      printer are functions in this page that take a string and return a
      string."""

[[privacy]]
title = "No external entities are resolved, ever."
body = """
 A
      <code>DOCTYPE</code> with an external entity in it is how an XML parser is
      talked into reading a file off the machine that parsed it, and it is the
      oldest hole in the format. <code>src/shared/parse-xml.js</code> is a hand-written
      reader that has no entity resolution in it at all &mdash; not disabled,
      absent &mdash; and this page never hands your text to the browser's own
      <code>DOMParser</code>."""

[[privacy]]
title = "Every value out of XML is a string."
body = """
 <code>&lt;port&gt;8080&lt;/port&gt;</code> says
      nothing about whether that is a number, so the JSON says
      <code>"8080"</code>. Deciding for you would be inventing information that
      then travels on as though it had been in the file."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed a character of your text. Every line that
      reads, parses or writes it is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Pick the job."
body = """
 Two tabs, one box: <em>Format</em> lays
      XML out or squeezes it flat; <em>Convert</em> turns it into JSON, or JSON
      back into XML. The XML you just laid out is the XML you convert, without
      pasting it twice."""

[[howto]]
title = "Paste it in, or drop the file."
body = """
 Anything you can select and copy
      works, and an <code>.xml</code>, <code>.svg</code>, <code>.rss</code> or
      <code>.xsd</code> file dropped on the picker is read by your own browser
      and put in the box &mdash; there is no upload step to leave out."""

[[howto]]
title = "Choose the indentation, or squeeze it flat."
body = """
 Two spaces, four, or a
      tab. Squeezing it flat is the same document with every space that was only
      there for reading taken out, and the result says how many bytes that
      saved."""

[[howto]]
title = "Read the error where the error is."
body = """
 A parser that fails here says
      <em>which tag</em> was never closed and on which line and column, rather
      than &ldquo;error on line 1&rdquo;, which is what a browser says about a
      document it read all at once."""

[[howto]]
title = "Take the result."
body = """
 Copy it, or download it as a file,
      named for the format it came out in."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my XML uploaded anywhere?"
a = """
        No. The parser and the printer on this page are functions that run in
        your own browser, on your own hardware. This tool has no network feature
        of any kind &mdash; it never fetches anything and never sends anything
        &mdash; and the page's <code>Content-Security-Policy</code> names every
        address it may contact, none of which belongs to this site. That matters
        more for XML than the format's reputation suggests: what arrives in it is
        usually an invoice, a bank statement, a health record, or a SOAP request
        with credentials in the header."""

[[faq]]
q = "Does it resolve external entities?"
a = """
        No, and there is nothing to switch off. External entity resolution is
        how an XML parser is talked into reading files off the machine running
        it &mdash; the attack usually written XXE &mdash; and
        <code>src/shared/parse-xml.js</code> is a hand-written reader with no entity
        resolution in it at all. Your text is never handed to the browser's own
        <code>DOMParser</code> either. A <code>DOCTYPE</code> is carried through
        without ever being acted on."""

[[faq]]
q = "What does converting XML to JSON lose?"
a = """
        The order of mixed content, comments, and the difference between an
        attribute and a child element &mdash; the last of which is softened
        rather than erased, because an attribute becomes a member whose name
        starts with <code>@</code>. An element's own text becomes
        <code>#text</code> when it has to sit beside something else, and
        repeated children become an array. Every value stays a string: XML has
        no types, and deciding that <code>8080</code> was a number would be
        inventing information."""

[[faq]]
q = "What does converting JSON to XML lose?"
a = """
        The difference between an empty object, an empty array and an empty
        string, all of which become an empty element, and the type of every
        value, because XML has no types. An array becomes a repeated element,
        which is the only shape that reads back, and a key that an element name
        cannot hold has its awkward characters replaced rather than being
        emitted as a document no parser will read."""

[[faq]]
q = "Can it format an SVG, an RSS feed or a POM file?"
a = """
        Yes. All three are XML, and this reads XML rather than any particular
        dialect of it. An SVG laid out this way is easier to hand-edit; an RSS
        or Atom feed is usually shipped squeezed flat and is unreadable until
        something opens it out. Nothing about the layout changes what the
        document means."""

[[faq]]
q = "Does reindenting XML change what it means?"
a = """
        For a document whose elements hold other elements, no. Where it can
        matter is text: whitespace inside an element that holds words is part of
        that text, so an element holding nothing but text is left on one line
        rather than being opened out. <code>CDATA</code> sections are copied
        through exactly as they were."""

[[faq]]
q = "Why not just use the browser's own XML parser?"
a = """
        Because of what it says when the document is broken. <code>DOMParser</code>
        hands back an error document whose wording is different in every browser
        and often amounts to &ldquo;error on line 1&rdquo;. A hand-written reader
        can say which tag was never closed, and where it was opened, which is
        the thing you actually needed to know. Not resolving external entities
        is the other reason."""

[[faq]]
q = "How big a file can it handle?"
a = """
        There is no limit set here, because there is no server paying for one.
        The practical ceiling is your own machine: a few megabytes of XML is
        fine, and the page waits for a pause in your typing before it
        re-formats a very long document rather than fighting you for the
        keyboard."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no limit on
        how much you paste. The site carries advertising, which is what pays for
        it; the ads are not given anything about your text."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your XML away to be formatted would stop the
        moment you unplugged."""

[schema]
category = "DeveloperApplication"
description = "Format, indent and minify XML, and convert XML to JSON or JSON to XML. The parser runs in the browser, resolves no external entities, and nothing is uploaded."
features = [
  "Lays out XML, or squeezes it flat and says how many bytes that saved",
  "Converts XML to JSON and JSON to XML, saying what each direction loses",
  "Says which tag was never closed, and on which line and column",
  "Resolves no external entities, so an XXE payload is only ever text",
  "Reads SVG, RSS, Atom, XSD and any other XML",
  "Works on a dropped file as well as on a paste",
  "Runs offline; no upload, no account",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = ".xml,.svg,.rss,.atom,.xsd,.xsl,.xslt,.plist,.pom,.config,.txt,.json,text/xml,application/xml,image/svg+xml,application/json"
multiple = false
title = "Drop a file here"
hint = "or click to browse &mdash; an .xml, .svg or .rss file"
