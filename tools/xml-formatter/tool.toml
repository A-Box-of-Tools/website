#
# XML Formatter
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# WHY THIS IS NOT A TAB ON json-formatter
#
# It was one. XML was an entry in that page's language menu and "XML to JSON"
# an entry in its conversion menu, both of them real, both working, and neither
# reachable by anybody searching for them: a page whose address, heading and
# title all say "JSON Formatter" does not answer "xml formatter". A tool is
# found at the address that says what it does.
#
# What stays behind on that page is the language menu it is named for, HTML and
# CSS included. This one is XML and the JSON it converts to, and nothing else -
# the two link to each other rather than duplicating each other.
#
# THE PARSERS ARE SHARED PARTS, AND ONLY THE ONES THIS PAGE READS
#
# The XML parser, the JSON parser and the error they throw are
# shared/js/parse-xml.js, parse-json.js and parse-errors.js, asked for in
# js_parts below and copied into this tool at src/shared/ by the build - the
# same files json-formatter ships. They were byte-for-byte copies until the
# JavaScript tests could follow a ./shared/ import. parse-yaml is deliberately
# NOT asked for: this page never mentions YAML, and tests/js/xml-formatter.test.js
# fails if it ever ships the six hundred lines of parser for it. src/convert.js
# stays this tool's own for the same reason - json-formatter's carries the YAML
# pair too - and its two functions are lifted from that file unchanged, so the
# two copies can still be read side by side.
#

slug = "xml-formatter"
name = "XML Formatter"
# The trailing span is the rest of what the page does. The product name stays
# the loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "XML&nbsp;Formatter <span class=\"h1-kw\">&mdash; lay it out, squeeze it flat, or turn it into JSON</span>"
tagline = "XML laid out to read or squeezed to ship, and converted to JSON both ways. Nothing is pasted into anyone else's server."
icon = "&#128209;"          # the mark beside the page heading
favicon = "&#128209;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
#
# Shared with image-to-data-uri, the site having thirty-six marks for
# thirty-eight tools and no Lucide icon that says "XML" more plainly than the
# angle brackets of this one.
glyph = "code"
category = "text-codes-and-passwords"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "beyond"

# Shared stylesheet parts this tool asks for, put before its own rules by
# the build so that its own can override them.
css_parts = ["form"]

# Shared modules this tool asks for. file-picker brings in the drop zone, which
# is here for the file that is easier to drop than to open, select all and copy.
js_parts = ["file-picker", "parse-errors", "parse-json", "parse-xml", "message-box", "download", "format"]
lastmod = "2026-09-02"

