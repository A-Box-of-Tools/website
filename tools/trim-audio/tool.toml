#
# Audio Trimmer
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# This is the video cutter's shape applied to sound: a list of marks rather
# than one pair of handles. What it is not is a copy of that tool's caveats.
# A decoded recording has no keyframes, so a cut lands on the sample you
# marked, in every player, always - and the one thing that does need saying is
# the opposite problem, the click at a join, which is why "soften the joins"
# is a setting on the page rather than a footnote.
#

