#
# AVIF to JPG
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# AVIF is the exact mirror of HEIC, and the two pages should be read together.
# HEIC cannot be decoded by anything but Safari, so heic-to-jpg ships 1.4 MB of
# libheif and spends its words justifying the download. AVIF is decoded by
# everything current and encoded by nothing at all - `canvas.toBlob` asked for
# image/avif hands back a PNG, silently, with the wrong type on the blob - so
# this page ships no engine and the honest claim is the absence of one.
#
# That asymmetry has one consequence worth stating in the config rather than
# leaving to be discovered: this is the only tool on the site whose example
# could not be drawn in the page, apart from the HEIC one, and for the opposite
# reason. Nothing here can write an AVIF, so the example is committed bytes.
# See src/example-data.js.
#
# The roadmap's "AVIF" line is NOT this tool and is not resolved by it. That
# line is about *writing* AVIF, which is real container work on top of
# VideoEncoder's AV1 - see the AVIF section of ROADMAP.md. This page only
# reads, which the browser already does.
#

slug = "avif-to-jpg"
name = "AVIF to JPG"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "AVIF&nbsp;to&nbsp;JPG <span class=\"h1-kw\">&mdash; open the picture that will not open</span>"
tagline = "The format websites save now, in the one everything has always taken."
icon = "&#127912;"          # the artist's palette, beside the page heading
favicon = "&#127912;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1 rasterises
# for the share card and the two installed-app icons, which want a filled
# colourful mark rather than a line drawing.
glyph = "arrow-right-left"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
roadmap_group = "images"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules.
css_parts = ["file-list", "progress", "results", "form", "notes"]
# Shared modules this tool asks for. image-convert is the decode-and-encode
# engine the three format converters share. There is no example-photo here:
# this tool's example is real bytes in src/example-data.js, because nothing in
# a browser can draw an AVIF.
js_parts = ["file-picker", "image-convert", "zip", "crc32", "message-box", "download", "format"]
# The tool to offer next, on the carry-on row under the result.
handoff = ["compress-image", "resize-image"]
lastmod = "2026-09-17"

