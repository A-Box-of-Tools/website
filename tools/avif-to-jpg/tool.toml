[[privacy]]
title = "Your pictures have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your
      files could be collected at, and nothing in the code that would send them
      if there were."""

[[privacy]]
title = "The decoder is already in your browser, which is the whole trick."
body = """
 An AVIF that
      will not open in your photo viewer opens fine in a browser tab, because
      Chrome and Firefox have decoded AVIF since 2021 and Safari since 2023.
      This page is that decoder with a save button: it opens the file the way
      the browser already can, draws it, and writes a JPEG. So there is no
      engine to download, nothing to wait for on the first conversion, and no
      reason for a server to be involved &mdash; which is exactly what the
      converters asking you to upload are not telling you."""

[[privacy]]
title = "The see-through parts, and what goes behind them."
body = """
 AVIF can carry an
      alpha channel and a JPEG cannot, so something has to go underneath. This
      page asks which colour and defaults to white, and it only asks when a file
      on the list really has transparency in it &mdash; which is read off the
      decoded pixels rather than guessed. Most AVIFs saved from websites are
      photographs with nothing see-through in them at all, so the field usually
      stays out of the way."""

[[privacy]]
title = "What a JPEG cannot carry over from an AVIF."
body = """
 AVIF can hold more
      colours than a JPEG can and can describe brighter highlights &mdash; ten
      or twelve bits a channel, and HDR. A JPEG is eight bits and no HDR, so a
      picture that used any of that arrives flattened to ordinary range. On the
      overwhelming majority of pictures there is nothing to flatten and you will
      see no difference; on a screenshot of an HDR photo you may. It is said
      here rather than discovered later."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed anything about your pictures. Every line
      that reads, decodes or writes a file is served from this origin and listed
      in the repository."""

[[privacy]]
title = "It works offline."
body = """
 Load the page once and disconnect from the
      network, and the tool is unchanged. That is the simplest proof of all: a
      converter that sent your pictures away to be converted could not possibly
      manage it."""

[[howto]]
title = "Choose your AVIF files."
body = """
 Drop them onto the picker or select
      them by hand. Every file is identified by its first bytes rather than by
      its name, so an AVIF that a download renamed still works, and a file that
      is genuinely a PNG is turned away with a line saying what it actually
      is."""

[[howto]]
title = "Set the quality, and the colour behind any transparency."
body = """
 The
      slider starts at 92, which is where a photograph is hard to tell from the
      original. The colour field appears only if something on the list is
      see-through, because a JPEG has to put something there."""

[[howto]]
title = "Press &ldquo;Convert&rdquo;, and download."
body = """
 Each result says what it came
      from, what it weighs now and how that compares &mdash; usually a good deal
      more, because AVIF is a much better codec and you are trading bytes for
      compatibility. One file gives you a download button; several give you a zip
      as well."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree.

[[faq]]
q = "Is my picture uploaded anywhere?"
a = """
        No. The file is read, decoded and written by your own browser on your own
        hardware. This tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site. There is not even a decoder to load
        first: your browser already had one."""

[[faq]]
q = "Why will nothing on my computer open this file?"
a = """
        Because AVIF is new where it counts. Websites started serving it because
        it is dramatically smaller than a JPEG at the same quality, so saving a
        picture from one now hands you a <code>.avif</code> &mdash; and the
        software you then open it in is often older than the format. Windows
        needs an extension for it, a lot of desktop editors still refuse it, and
        most e-readers, printers and upload forms have never heard of it. Your
        browser, meanwhile, reads it perfectly, which is why this page can help
        and is also why the file arrived in the first place."""

[[faq]]
q = "Will the JPG be bigger than the AVIF?"
a = """
        Almost certainly, often by several times, and the result says by how much
        rather than hiding it. AVIF is one of the best still-image codecs there
        is and JPEG is one of the oldest, so a picture that is 40 KB as an AVIF
        can easily be 200 KB as a JPEG of the same visible quality. That is the
        trade: bytes for compatibility. If the size matters afterwards, the
        <a href="../compress-image/">Image Compressor</a> will take the JPEG down
        to a figure you name."""

[[faq]]
q = "What happens to transparency?"
a = """
        It is filled with a colour you choose, and the page says so before you
        press anything. AVIF has an alpha channel and a JPEG does not, so there
        is no version of this where the transparency survives &mdash; only a
        question of what goes underneath, which is your decision rather than the
        converter's. In practice most AVIFs are photographs with nothing
        see-through in them, so the field never appears. If you need the
        transparency kept, convert to PNG or WebP with the
        <a href="../compress-image/">Image Compressor</a>, which reads AVIF and
        writes both."""

[[faq]]
q = "What about HDR and 10-bit colour?"
a = """
        They do not survive, because a JPEG cannot hold them. AVIF can store ten
        or twelve bits a channel and describe highlights brighter than a normal
        screen shows; a JPEG is eight bits with no such notion. So an HDR AVIF
        comes out as an ordinary picture &mdash; which is what you wanted if the
        goal was a file that opens everywhere, and a real loss if you were
        archiving. Almost nothing saved from an ordinary web page is HDR, so for
        almost everybody this costs nothing."""

[[faq]]
q = "Is the picture re-compressed?"
a = """
        Yes, and it has to be: AVIF and JPEG are different codecs, so there is no
        way to move from one to the other without decoding the picture and
        encoding it again. That is true of every AVIF converter there is,
        including the ones that ask you to upload. What you control is how much
        it costs, and the slider defaults to 92, where a photograph is very hard
        to tell from the original."""

[[faq]]
q = "Can you convert the other way, JPG to AVIF?"
a = """
        Not here, and the reason is worth knowing: no browser will write one. Ask
        a canvas for an AVIF and it quietly hands back a PNG with the wrong type
        on it &mdash; so a page claiming to write AVIF in your browser is either
        wrong or is sending your picture to a server to be encoded. Doing it
        properly without a server means shipping an encoder, and that is a real
        piece of work that is on <a href=\"../../roadmap/\">the roadmap</a> rather
        than pretended at here."""

[[faq]]
q = "Does it keep the date, camera and location?"
a = """
        No. The picture is drawn onto a canvas and a canvas holds pixels and
        nothing else, so EXIF, GPS, colour profiles and XMP are left behind. For
        a picture saved off a web page there is usually nothing there anyway. If
        you need to see or edit what a file carries, the
        <a href="../exif-editor/">EXIF Viewer &amp; Remover</a> does that without
        re-compressing the picture."""

[[faq]]
q = "Can it do a whole folder at once?"
a = """
        Yes. Drop in as many as you like &mdash; there is no limit on the number
        or the size, because there is no server paying for them. Each one gets
        its own row and its own download, and two or more give you a zip of the
        lot."""

[[faq]]
q = "Is it free, and does it work offline?"
a = """
        It is free, with no account, no sign-in, no trial and no watermark; the
        site carries advertising, which is what pays for it, and the ads are not
        given anything about your pictures. And yes &mdash; load the page once,
        then disconnect from the internet and it keeps working exactly as before,
        which is also the strongest proof available that nothing is being
        uploaded."""

[schema]
category = "MultimediaApplication"
description = "Convert AVIF images to JPG in the browser. The browser's own AVIF decoder reads the file and its own encoder writes the JPEG, so nothing is uploaded and no codec is downloaded. Transparency is filled with a colour of your choosing, and batches come back as a zip."
features = [
  "Converts AVIF to JPEG using the decoder the browser already has",
  "Nothing is uploaded, and the tool works with the network unplugged",
  "Asks which colour goes behind transparency, and only when a file has any",
  "Identifies files by their contents, so a renamed AVIF still works",
  "Quality slider, defaulting to 92",
  "Reports what each file weighed before and after",
  "Says plainly when a browser is too old to read AVIF at all",
  "Batches, with all results in one zip",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
# Wider than ".avif" on purpose: every file is identified by its first bytes
# anyway, and a narrow accept list hides a misnamed file inside the browser's
# own dialog, where no message this page writes could reach it.
accept = "image/*,.avif"
multiple = true
title = "Drop AVIF pictures here"
hint = "or click to browse &mdash; .avif files, whatever they happen to be named"
# Real AVIF bytes in src/example-data.js, because no browser will encode one -
# which is the whole reason this tool exists. Only the HEIC converter's example
# is the same kind of thing, and for the opposite reason.
example = true
