#
# Password & Passphrase Generator
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The first tool here whose output is a secret rather than a document, which
# changes what the claims on the page have to carry. Everywhere else "nothing
# is uploaded" protects a file you already had; here there is no file, and the
# thing being protected is something that did not exist until this page made
# it. A generator that sent its output anywhere would not be a weak tool, it
# would be a collection.
#

slug = "password-generator"
name = "Password & Passphrase Generator"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Password&nbsp;&amp;&nbsp;passphrase <span class=\"h1-kw\">&mdash; a strong random one, made in your browser</span>"
tagline = "Made here, by your own browser, and never sent anywhere. Nothing is stored and there is no history."
icon = "&#128273;"          # the mark beside the page heading
favicon = "&#128273;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "key-round"
category = "text-codes-and-passwords"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "beyond"
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Strong Random Password &amp; Passphrase Generator &mdash; Nothing Uploaded"
description = "Make a strong random password, or a diceware passphrase from a bundled 7,776-word list. Drawn by your browser's own cryptographic generator, never sent anywhere, never stored. Free, no sign-up."
og_title = "A password generator that could not send your password anywhere"
og_description = "Random passwords and diceware passphrases, drawn by crypto.getRandomValues in your own browser from a wordlist that ships with the page. No server, no account, no history, and an honest count of how strong the result actually is."
og_image_alt = "Password & Passphrase Generator - strong random passwords, nothing uploaded"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "A strong random password, or a passphrase you can remember - made on your own machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  This tool needs no directive of its own. It fetches nothing and decodes
  nothing from the network: the wordlist is a file in this folder, and the
  randomness comes from the browser itself. The one blob: URL it makes is the
  text file of a batch, which is a download rather than a resource the page
  loads, and needs no permission at all.
  img-src still carries blob: because every tool page does, and https: because
  ad creatives come from anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Every character comes from <code>crypto.getRandomValues</code>, the
    browser's own cryptographic generator, and every word from a list that
    ships in this folder as <code>src/wordlist.js</code>. There is no
    <code>fetch</code>, no <code>XMLHttpRequest</code> and no
    <code>sendBeacon</code> anywhere in <code>src/</code>, so there is no code
    path by which a password made here could reach us or anybody else &mdash;
