# whatever this tool needs that the rest of the site does not.
csp_note = """
  This tool widens two directives on its own page and narrows nothing.
  media-src carries blob: because the WAV is played back from memory on this
  machine rather than from a URL, and connect-src carries blob: because the
  carry-on row reads that same result back out of this page before parking it
  for the next tool. blob: names bytes inside this page; neither gains any
  reach over the network."""

