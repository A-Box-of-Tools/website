#
# Extract Audio from Video
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# WHY THIS IS NOT A SETTING ON edit-audio
#
# It was one, and it worked: dropping a video on the Audio Editor and pressing
# the button with every setting left alone has always saved the sound out of it.
# That page even answers "Can I get the audio out of a video?" in its FAQ. What
# it does not do is answer anybody who searched for it - the page is called
# Audio Editor, its address says edit-audio, and the whole job is described as
# a by-the-way clause at the end of a tagline about reversing tracks.
#
# "Extract audio from video" is the phrase, and it is a bigger one than
# anything else the audio pages do. So it has an address that says it, a page
# with one job on it and nothing to configure, and an FAQ of its own.
#
# WHY THE FILE THAT COMES OUT IS A WAV, AND WHY THE ADDRESS DOES NOT SAY MP3
#
# "video to mp3" is the larger phrase again, and this tool cannot honestly
# answer it. No browser ships an MP3 encoder; the only route to one is sending
# the video to a server that has it, which is the single thing this site exists
# not to do. ROADMAP.md is explicit that MP3 out waits on a vendored
# libmp3lame, and edit-audio has answered "Why does it save a WAV rather than
# an MP3?" in public for as long as it has existed.
#
# An address promising a file the page cannot produce would be the first
# dishonest URL on the site, and it would be dishonest about the exact thing
# the site is for. So the address says what actually happens. If libmp3lame is
# ever vendored, this is the page that gains the option - and the address still
# reads true, because extracting is what it does and MP3 would only be the
# format it wrote.
#
# THE DECODER MODULES ARE COPIES, ON PURPOSE
#
# src/decode.js, src/samplerate.js and src/wav.js are byte for byte the ones in
# edit-audio and trim-audio, declared in tests/python/test_duplicates.py so that
# a fix to any of them is a fix to all three tools. They are copies from before
# the JavaScript tests could follow a ./shared/ import (build.py copies
# shared/js into a tool at src/shared/ at build time, and the tests import
# these modules straight off the disk); tests/js/resolve-shared.mjs resolves
# that path now, so moving the three to shared/js is the next step.
#

slug = "extract-audio-from-video"
name = "Extract Audio from Video"
# The trailing span says what comes out, because that is the question a reader
# arrives with and the one the format makes for them. The product name stays
# the loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Extract&nbsp;Audio&nbsp;from&nbsp;Video <span class=\"h1-kw\">&mdash; the sound on its own, as a WAV</span>"
tagline = "Drop a video in and take the sound out of it. The picture is never decoded, and nothing is uploaded."
icon = "&#128266;"          # the mark beside the page heading
favicon = "&#128266;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
#
# Shared with trim-audio: the site has thirty-six marks for thirty-seven tools,
# and a waveform is what both of these hand back.
glyph = "audio-waveform"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "audio"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar the shared picker draws while it reads.
css_parts = ["progress"]

# Shared modules this tool asks for. file-picker brings in the drop zone.
js_parts = ["file-picker"]
# Where a finished result can be carried without being saved first: the row of
# links shared/handoff.js shows beside the download once there is one. The sound
# out of a video is very often wanted shorter, or louder, which is the next two
# tools exactly.
handoff = ["trim-audio", "edit-audio"]
lastmod = "2026-08-30"

