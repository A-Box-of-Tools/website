[[privacy]]
title = "Your video has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that a file
      could be collected at, and nothing in the code that would send it if there
      were."""

[[privacy]]
title = "The picture is never decoded at all."
body = """
 Only the audio track is
      asked for. The frames are not read, not decoded, not drawn and not looked
      at &mdash; there is no code on this page that could &mdash; and the file
      that comes out holds sound and nothing else. That is not a promise about
      restraint: <code>decodeAudioData</code> is handed the bytes and returns
      sound, and there is no video decoder in <code>src/</code> to run."""

[[privacy]]
title = "The decoder is the one already in your browser."
body = """
 Nothing is
      shipped here to read your format and nothing is asked of anything outside
      this page to read it either. Which files work is therefore whatever your
      browser already plays."""

[[privacy]]
title = "The samples are written down, not encoded again."
body = """

      A WAV is the samples the decoder handed back with a header in front of
      them. There is no encoder in the loop making decisions about your
      recording, and nothing that could be described as an upload for one to
      happen on."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed anything about your video: not a file, not
      a sample, not a name, a size or a length."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Drop the video in."
body = """
 An MP4, MOV, M4V or WebM, from a
      phone, a camera, a screen recorder or a download. It is read by your own
      browser; there is no upload step to leave out."""

[[howto]]
title = "Read what it found."
body = """
 The length, the number of channels
      and the sample rate, straight out of the file. If the file did not declare
      its rate the page says so, rather than quietly resampling and claiming
      nothing was touched."""

[[howto]]
title = "Choose mono, if you want it smaller."
body = """
 Leaving the channels
      alone keeps the recording exactly as it was. Mixing down to mono halves
      the file and is what a transcriber or a voice recording wants; it averages
      the channels rather than throwing one away."""

[[howto]]
title = "Play it before you save it."
body = """
 The player is the file that
      is about to be downloaded, not the video &mdash; so if it sounds right,
      the download is right."""

[[howto]]
title = "Take it, or carry it on."
body = """
 Download the WAV, or send it
      straight to the trimmer or the editor without saving it first."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my video uploaded anywhere?"
a = """
        No. The decoding and the writing both happen in your own browser, on
        your own hardware. This tool has no network feature of any kind &mdash;
        it never fetches anything and never sends anything &mdash; and the
        page's <code>Content-Security-Policy</code> names every address it may
        contact, none of which belongs to this site. Unplug from the internet
        and take the sound out anyway if you would rather check than be
        told."""

[[faq]]
q = "Can it give me an MP3?"
a = """
        No, and it will not pretend to. No browser ships an MP3 encoder, and the
        only way to reach one is to send your video to a server that has it
        &mdash; which is the one thing this site exists not to do. What you get
        is a WAV: the samples with a forty-four-byte header in front, which
        needs no encoder at all and cannot cost any quality. It is larger, about
        ten megabytes a minute in stereo, and every player, phone and editor
        opens one. Anything that wants an MP3 can make one from it in a
        second."""

[[faq]]
q = "Is the picture ever looked at?"
a = """
        No, and there is nothing here that could look at it. The browser's
        decoder is handed the file and asked for its audio track; the video
        track is never decoded, never drawn and never reaches this page's code
        at all. There is no video decoder in <code>src/</code> to run. The file
        that comes out holds sound and nothing else."""

[[faq]]
q = "It says no sound could be read, but the video plays fine."
a = """
        Then the video almost certainly has no audio track. A screen recording
        made without a microphone selected is silent, and so is a clip exported
        by an editor with the sound left muted &mdash; both play perfectly,
        because there is a picture to play. The message names this first because
        it is the likelier of the two causes; the other is a format this browser
        will not read. Open the file in a player and look for a volume control
        that does nothing: that is the quickest way to tell which you have."""

[[faq]]
q = "Which video formats can I open?"
a = """
        Whatever your browser decodes, which in practice means MP4, M4V, MOV and
        WebM, and every audio format besides. What is left out is the same short
        list as everywhere else on this site: AVI, WMV, and most MKVs. A file
        your browser will not read is refused with a message saying so, rather
        than failing halfway through."""

[[faq]]
q = "Does it lose any quality?"
a = """
        Nothing beyond what the video already did to its own audio when it was
        made. The samples the decoder hands back are written down as they are
        &mdash; there is no second encode, so there is no second generation of
        loss. The one thing to know is the sample rate: the file's own rate is
        read out of its header first and the decode is done at that rate, so
        your recording is not quietly resampled. If a file does not declare one,
        the page says which rate it assumed."""

[[faq]]
q = "Why is the WAV so much bigger than the video?"
a = """
        Because a WAV is not compressed and the video's audio track was. Sound
        at CD quality is about ten megabytes a minute in stereo, whatever it
        holds; the AAC track inside an MP4 is perhaps a tenth of that. Mixing
        down to mono halves it. This is the cost of not re-encoding, and it is
        paid once: whatever you open the file in next can compress it."""

[[faq]]
q = "How long a video can it handle?"
a = """
        There is no limit set here, because there is no server paying for one.
        The practical ceiling is your own machine's memory: the file is read in
        and the whole audio track is held as samples, so a very long recording
        on a small machine can run out of room. A few hours of video is
        ordinarily fine, and a phone will manage less than a laptop."""

[[faq]]
q = "Can I cut it down or make it louder?"
a = """
        Yes, but not here &mdash; this page does one job. When there is a result
        there is a row of links beside the download that carries it straight
        into the <a href="../trim-audio/">audio trimmer</a> or the
        <a href="../edit-audio/">audio editor</a> without saving it first, and
        without either of them uploading it either."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no limit on
        how many videos you open. The site carries advertising, which is what
        pays for it; the ads are not given anything about your file."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your video away to be processed would stop
        the moment you unplugged."""

[schema]
category = "MultimediaApplication"
description = "Extract the audio track from an MP4, MOV or WebM and save it as a WAV. Only the audio is decoded, the picture is never read, and nothing is uploaded."
features = [
  "Saves the audio from MP4, M4V, MOV and WebM video as a WAV",
  "Decodes only the audio track; the picture is never read",
  "Reads the file's own sample rate first, so nothing is quietly resampled",
  "Mixes down to mono by averaging, for half the file size",
  "Plays the result before you save it",
  "Carries the result into the audio trimmer or editor without saving",
  "Runs offline; no upload, no account",
]

# This tool widens two directives on its own page. blob: on media-src because
# the WAV is played from memory rather than from a URL, and blob: on
# connect-src because the carry-on row reads that result back out of this page
# before parking it for the next tool (see shared/handoff.js), and reading a
# blob: URL is a fetch the policy has to permit. A tool can only ever widen its
# own page this way - it cannot narrow the site policy, and it cannot touch any
# other tool's.
[csp]
"connect-src" = ["blob:"]
"media-src" = ["'self'", "blob:"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "video/*,audio/*"
multiple = false
title = "Drop a video here"
hint = "or click to browse &mdash; MP4, MOV, M4V or WebM"
