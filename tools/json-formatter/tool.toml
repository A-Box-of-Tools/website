# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# This page, text-diff and base64 used to be one tool at /text-tools/, four
# jobs behind four tabs. The split gave each job an address of its own, but
# it named the English ones for what the page does rather than for what gets
# typed: /format-json/ is the reverse of "json formatter", which is the
