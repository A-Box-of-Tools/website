  "Merges any number of PDFs, and lets you keep adding files as you go",
  "Drag pages into order, turn them, remove them, or act on a range at once",
  "Splits into one file per page, every so many pages, at page numbers, or back into the files the pages came from",
  "Rebuilds bookmarks and internal links against the pages that survived",
  "Keeps filled-in form fields, and says so when two of them share a name",
  "Reopens and counts every finished file before offering it",
  "Runs offline; no upload, no account, no file size limit",
]

