[[privacy]]
title = "The pictures stay here."
body = """
 Your browser reads the files you choose
      and draws the combined picture in memory. This tool has no network feature
      and no endpoint to receive your files. The page's
      <code>Content-Security-Policy</code> names the addresses it may contact;
      your pictures, their names and their thumbnails are never handed to them."""

[[privacy]]
title = "The layout is made by this page."
body = """
 There is no image service
      behind the preview and no remote renderer behind the download. The same
      rectangles decide where the pictures land in both, and the browser's own
      encoder turns the finished canvas into a PNG, JPEG or WebP."""

[[privacy]]
title = "The original files are left alone."
body = """
 A layout is a new image.
      The files you picked stay as they were; no edited copy is written over
      them. Source EXIF, GPS, camera and date tags are not copied into the
      layout, because it is made from pixels rather than from the original
      file containers."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The page's advertising
      and measurement scripts come from Google. Neither is given your images,
      their names, their dimensions, their number, or anything drawn from them.
      The code that reads and arranges a picture is served from this origin."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """
 The
      &ldquo;Buy me a coffee&rdquo; button is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link,
      and it is handed nothing about your pictures. Clicking it opens the
      service's own page."""

[[privacy]]
title = "Disconnect and check."
body = """
 After the page has loaded, it can import,
      preview and export with the network disconnected. The example is drawn in
      the page too; it is never downloaded from somewhere else."""

[[howto]]
title = "Choose your pictures."
body = """
 Drop several images onto the picker, or
      browse for them. The tiles show what the browser could open. The example
      makes pictures on this page if you want to try the controls first."""

[[howto]]
title = "Put them in order."
body = """
 Drag a tile to move it, or use its arrow
      buttons. Remove a picture that does not belong. The order runs across each
      row of a grid, from left to right in a horizontal strip, and from top to
      bottom in a vertical one."""

[[howto]]
title = "Choose the arrangement and spacing."
body = """
 Pick a grid, a horizontal
      strip or a vertical strip. Set the output width, the grid columns, the cell
      shape, the gap between images and the outer margin around them. &ldquo;Fit whole image&rdquo; keeps every edge; &ldquo;Fill box (crop edges)&rdquo; fills the
      cell by trimming the overflow."""

[[howto]]
title = "Check the preview, then save one image."
body = """
 The preview shows the
      arrangement and crop used by the download. Choose PNG, JPEG or WebP, set a
      background or transparency where the format permits it, and create the
      image. Export draws from the original files at the output size."""

[[faq]]
q = "Are my images uploaded anywhere?"
a = """
        No. Reading, arranging and exporting happen in your browser on your own
        machine. This tool adds no network feature to the page, and the files,
        thumbnails and names are never handed to the advertising or measurement
        scripts. It also works with the network disconnected after loading."""

[[faq]]
q = "Can I make a collage, a contact sheet or a strip?"
a = """
        Yes. A grid puts the pictures into equal cells with the column count
        you choose. A horizontal strip places them side by side; a vertical
        strip places them one above another. Drag the tiles or use their arrow
        buttons to change the order. This makes one flat image rather than an
        editable design document."""

[[faq]]
q = "How do I keep the whole of every picture?"
a = """
        Choose &ldquo;Fit whole image&rdquo;. Each picture is scaled to fit
        its cell, with background showing wherever their shapes differ.
        &ldquo;Fill box (crop edges)&rdquo; fills the cell and cuts off the overflow,
        centred on the picture. A strip's &ldquo;Keep original shapes (strips)&rdquo; option
        keeps the pictures' own proportions, so their cells need no crop."""

[[faq]]
q = "Can the gaps and background be transparent?"
a = """
        Yes, when you choose PNG or WebP and turn on transparency. That also
        preserves see-through parts of the input pictures. JPEG has no alpha
        channel, so it always uses a solid background. The background colour
        also fills the space around a picture shown whole in a cell."""

[[faq]]
q = "Which formats can I use?"
a = """
        The input must be an image your browser can decode, including JPEG,
        PNG, WebP, GIF, BMP, AVIF and supported SVG files. HEIC support depends
        on your browser; <a href=\"../heic-to-jpg/\">HEIC to JPG</a> can convert
        one first. Output is PNG, JPEG or WebP. If the browser cannot write WebP,
        that choice is disabled rather than saving a PNG with a WebP extension."""

[[faq]]
q = "Does it keep an animation?"
a = """
        No. This is a still-image layout. An animated GIF, WebP or AVIF is
        reduced to the first frame the browser decodes. To arrange separate
        frames from a GIF, extract them first with
        <a href=\"../split-gif/\">GIF Splitter</a>."""

[[faq]]
q = "Does the preview use the full-resolution pictures?"
a = """
        The live preview uses small copies so changing a gap or column count
        stays quick. Export uses the original files. Both use the same layout
        geometry, but fine detail should be checked in the finished file,
        especially when a small source is enlarged."""

[[faq]]
q = "What are the size limits?"
a = """
        The finished canvas is limited to 8192 pixels on either side and
        32 megapixels in total. A tall strip can reach the height limit even
        when its width is small. Reduce the output width, use more grid columns,
        or split the pictures into several layouts if the page reports a limit.
        Your browser can still run out of memory below those limits with very
        large source files; export opens one full-size picture at a time."""

[[faq]]
q = "Will the picture quality, colours and metadata stay the same?"
a = """
        This makes a new image by drawing your pictures onto a browser canvas.
        Resizing or cropping changes the pixels, and JPEG or WebP compression
        can lose detail. PNG keeps the pixels of the finished canvas, which is
        not the same as preserving the original files. The canvas makes an
        8-bit SDR image, so wide-gamut colour, HDR and partly transparent colours
        may change. Source EXIF, GPS, date and camera tags are not copied.
        Keep the originals if you need an archival copy."""

[[faq]]
q = "Is it free, and does it work offline?"
a = """
        It is free, with no account, trial or watermark. Load the page once,
        then disconnect and the arrangement and export still work. Advertising
        pays for the site; it is not given anything about your pictures."""

