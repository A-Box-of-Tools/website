[[privacy]]
title = "Discovery is a nearby hint."
body = " Opening this page connects to the rendezvous to list live pagers sharing your public IPv4 address or IPv6 subnet and page origin. A host explicitly opens and advertises its named pager. Shared carrier gateways can include strangers, and VPNs or different internet routes can hide devices beside you. Pager names and whether a password is required are visible to that discovery group. A copied pager link provides another way to connect. Neither discovery nor a direct connection proves membership of a physical LAN."
[[privacy]]
title = "Passwords control admission without a host approval prompt."
body = " An open pager accepts reachable participants without asking its host to approve them. A protected pager checks a credential derived from its password in the participant's browser before negotiating voice. The password is not put in an invitation or sent as plain text. The derived credential travels inside encrypted signaling messages and acts as an access credential. Choose a strong password and share it separately. A display name is self-chosen, not a verified identity."
[[privacy]]
title = "The host hears separate direct audio streams."
body = " Each admitted participant sends encrypted WebRTC audio directly to the host browser. Other participants do not receive it. No STUN server, TURN relay or recording feature is configured. The host never requests microphone access. Participants grant the browser microphone permission and start with transmission stopped; Hold to talk or Start talking deliberately enables it. Hiding or leaving a speaking page releases its microphone. Recipients can independently record what they hear."
[[privacy]]
title = "Mute and Remove belong to the host."
body = " Mute silences that participant's stream in the host browser even if a modified participant page keeps sending audio. The normal participant page also stops transmission when muted. Remove closes that participant's direct connection and rejects its retained session identity. This is a session block, not a permanent ban on a person: someone can create a new identity, especially in an open pager. Per-pager moderation history is bounded; ending the pager clears it."
[[privacy]]
title = "Temporary browser credentials support recovery."
body = " Host and participant credentials are separate and stay in per-tab session storage when available. Invitation fragments identify a pager without carrying its host secret or password. Reconnection retains the participant identity so moderation can still apply. Waiting participants check for the host with a one-second foreground target; background timers, connection limits and sleeping devices can delay recovery. End pager and Disconnect stop retries."
[[privacy]]
title = "The rendezvous carries metadata, never voice."
body = " The service receives pager and participant names, password-derived credentials, mute and removal commands, host availability and bounded connection setup messages. Temporary pager state lives on open socket attachments without a stored pager history. Cloudflare keeps seven-day invocation metadata logs including request addresses, pager identifiers and timing. Credentials travel in secure socket payloads rather than request URLs. The website's regular scripts also run here and can read the page address and browser storage; trust the page before granting microphone access or using sensitive credentials."

[[howto]]
title = "Open the listening pager."
body = " Choose Host a pager, give the pager a name, optionally set a password and choose Start pager. The host needs speaker output but does not grant microphone access. Keep its page open and its device awake. If sound is interrupted, return here and choose Restore sound when shown."
[[howto]]
title = "Find it nearby or use its link."
body = " On a participating device, open this page and choose the named pager from the nearby list. Use the copied link or QR code if discovery does not find it. Both devices need internet for discovery and pairing, plus a reachable direct network path for audio."
[[howto]]
title = "Connect and deliberately speak."
body = " Enter a display name and the pager password if required, then Connect and allow microphone access. No host acceptance prompt is needed. Hold Talk or focus it and hold Space; release to stop. Start talking offers a hands-free toggle. Only the host hears your audio. After a microphone interruption, use Resume microphone and deliberately start talking again."
[[howto]]
title = "Control individual participants."
body = " The host can Mute, Unmute or Remove a participant. Several people may speak at once, so their voices can overlap. Disconnect closes one participant; End pager closes the pager. Starting a new pager creates a fresh invitation and resets its moderation history. Removal is pending until the service confirms it; local playback is silenced immediately."

[[faq]]
q = "Is this the reverse of Local Walkie-Talkie?"
a = "Yes. Walkie-Talkie sends one host's voice to many listeners. Voice Oncall sends each participant's live voice to one listening host. Participants do not hear one another."
[[faq]]
q = "Do I need Python, installation or an account?"
a = "No. Both sides use this HTTPS website. The host never requests microphone access. A participant must grant the browser's normal microphone permission when connecting."
[[faq]]
q = "Does the host approve each person?"
a = "No. Admission is automatic while the pager is open and below its ten-participant limit. If the host sets a password, a participant must enter it before connecting. The host can mute or remove participants afterwards."
[[faq]]
q = "Can it discover every device on my Wi-Fi?"
a = "No. Nearby discovery groups active pages by their public internet address and this website's origin. It does not scan the LAN and cannot prove physical Wi-Fi membership. VPNs, shared carrier gateways and different routes affect the list. Use an invitation link when discovery misses the pager."
[[faq]]
q = "Does any server receive our voice?"
a = "The rendezvous carries discovery, admission and connection details, never audio. Audio travels on separate direct encrypted browser connections. No audio relay fallback is configured. Internet remains necessary for introductions and recovery."
[[faq]]
q = "Can a removed person return?"
a = "Their retained participant session is blocked in the active pager. This is not a verified account or permanent person-level ban: a new browser identity can try again. A password helps control who can connect. End the pager and create a new protected one if you need a fresh invitation."
[[faq]]
q = "Why does the same Wi-Fi sometimes fail?"
a = "Guest isolation, firewalls, VPN routes, browser local-network permissions or sleeping devices may prevent a direct connection. There is no public audio relay fallback. Try the actual phones and computers you intend to use."

