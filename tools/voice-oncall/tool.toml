[[privacy]]
title = "Choose local discovery or a private group."
body = " Opening this page connects to the rendezvous to list live pagers. Local network groups pages sharing your public IPv4 address or IPv6 subnet and page origin; shared carrier gateways can include strangers and VPNs can hide devices beside you. Private group uses the same random group code on each device and lists the pager only within that group, including across networks. Pager names, routes and password requirements are visible to the chosen group. The group code grants discovery, not admission to a password-protected pager, and never enters its invitation link. It stays in page memory; reloading a private host requires starting again in the chosen group. Neither discovery nor a direct connection proves membership of a physical LAN."
[[privacy]]
title = "Passwords control admission without a host approval prompt."
body = " An open pager accepts reachable participants without asking its host to approve them. A protected pager checks a credential derived from its password in the participant's browser before negotiating voice. The password is not put in an invitation or sent as plain text. The derived credential travels inside encrypted signaling messages and acts as an access credential. Choose a strong password and share it separately. Callers do not need a name; their temporary session identifiers do not verify who they are."
[[privacy]]
title = "The host hears separate encrypted audio streams."
body = " Each admitted participant sends encrypted WebRTC audio to the host browser. Other participants do not receive it. Direct uses host candidates only and no relay. Cloud relay must be chosen explicitly and uses relay candidates only; Cloudflare forwards encrypted audio and sees connection metadata, but cannot decrypt the audio. There is no automatic fallback or recording feature. The host never requests microphone access. Participants grant permission and start with transmission stopped; Hold to talk or Start talking deliberately enables it. Physical holds release on blur or hiding. Hands-free speech can continue while the browser permits it. An interruption clears talking. Recipients can independently record what they hear."
[[privacy]]
title = "Mute and Remove belong to the host."
body = " Mute silences that participant's stream in the host browser even if a modified participant page keeps sending audio. The normal participant page also stops transmission when muted. Remove closes that participant's direct connection and rejects its retained session identity. This is a session block, not a permanent ban on a person: someone can create a new identity, especially in an open pager. Per-pager moderation history is bounded; ending the pager clears it."
[[privacy]]
title = "Temporary browser credentials support recovery."
body = " Host and participant credentials are separate and stay in per-tab session storage when available. Invitation fragments identify a pager without carrying its host secret or password. Healthy hidden connections remain open while the browser allows. An ended microphone can be replaced within the same pairing on returning to the page or through Resume microphone. After page suspension, returning attempts to restore the same pager or caller identity, retaining moderation and leaving caller transmission off. Waiting participants check for the host with a one-second foreground target. Screen-lock continuity is not guaranteed; browser suspension, connection limits and sleeping devices can delay recovery. End pager and Disconnect prevent automatic restart and stop retries."
[[privacy]]
title = "The rendezvous carries metadata, never voice."
body = " The service receives pager names, temporary participant identifiers, password-derived credentials, mute and removal commands, host availability and bounded connection setup messages. Older pages may also send participant display names. Temporary pager state lives on open socket attachments without a stored pager history. Cloudflare keeps seven-day invocation metadata logs including request addresses, pager identifiers and timing. Credentials travel in secure socket payloads rather than request URLs. The website's regular scripts also run here and can read the page address and browser storage; trust the page before granting microphone access or using sensitive credentials."

[[howto]]
title = "Open the listening pager."
body = " Choose Host a pager, give the pager a name, optionally set a password and choose Start pager. The host needs speaker output but does not grant microphone access. Keep its page open. Healthy connections can continue in the background while the browser allows; screen-lock operation is not guaranteed. If sound is interrupted, return here and choose Restore sound when shown."
[[howto]]
title = "Find it in Available connections or use its link."
body = " On a participating device, choose the pager from Available connections or open its invitation. Icons show the host's route and whether a password is required. Check them before choosing Connect. To discover across networks, enter the same private group code on both devices before the host starts. Selecting alone never connects or requests a microphone. Both devices need internet for discovery and pairing. Direct needs a reachable network path; Cloud relay needs internet throughout. A pager keeps its host's chosen route, so changing that choice requires a new invitation."
[[howto]]
title = "Connect and deliberately speak."
body = " Enter the pager password if required, then Connect and allow microphone access. You do not need to enter a name or wait for host approval. Hold Talk or focus it and hold Space; release to stop. Physical holds also release on blur or hiding. Start talking enables hands-free speech, which can continue in the background while the browser permits. Only the host hears your audio. A microphone interruption clears talking. Return to the page or choose Resume microphone if recovery is needed, then deliberately start talking again."
[[howto]]
title = "Control individual participants."
body = " The host sees each caller with a short identifier and can Mute, Unmute or Remove them. Several people may speak at once, so their voices can overlap. Disconnect closes one participant; End pager closes the pager. Starting a new pager creates a fresh invitation and resets its moderation history. Removal is pending until the service confirms it; local playback is silenced immediately."

[[faq]]
q = "Is this the reverse of Local Walkie-Talkie?"
a = "Yes. Walkie-Talkie sends one host's voice to many listeners. Voice Oncall sends each participant's live voice to one listening host. Participants do not hear one another."
[[faq]]
q = "Do I need Python, installation or an account?"
a = "No. Both sides use this HTTPS website, and callers do not need to enter a name. The host names the pager and never requests microphone access. A participant must grant the browser's normal microphone permission when connecting."
[[faq]]
q = "Does the host approve each person?"
a = "No. Admission is automatic while the pager is open and below its ten-participant limit. If the host sets a password, a participant must enter it before connecting. The host can mute or remove participants afterwards."
[[faq]]
q = "Can it discover every device on my Wi-Fi?"
a = "No. Local network discovery groups active pages by their public internet address and this website's origin. It does not scan the LAN and cannot prove physical Wi-Fi membership. VPNs, shared carrier gateways and different routes affect the list. Use the same private group code to discover across networks, or use an invitation link. Direct still needs a reachable path; Cloud relay is the host's separate choice."
[[faq]]
q = "Does any server receive our voice?"
a = "Direct sends encrypted audio between the browsers without a relay. When the host chooses Cloud relay and the participant confirms Connect, Cloudflare forwards encrypted WebRTC audio and sees addresses, timing and traffic volume, but cannot decrypt the audio. The introduction service carries setup and status only. Internet remains necessary for pairing and for relayed audio."
[[faq]]
q = "Can a removed person return?"
a = "Their retained participant session is blocked in the active pager. This is not a verified account or permanent person-level ban: a new browser identity can try again. A password helps control who can connect. End the pager and create a new protected one if you need a fresh invitation."
[[faq]]
q = "Can I keep talking with the screen locked?"
a = "Hands-free speech and healthy connections remain active while the browser allows; physical holds release when the page loses focus or becomes hidden. A phone can still interrupt audio, suspend the page or close connections when locked, so this is not guaranteed. A microphone interruption stops talking and recovery stays silent until you deliberately speak again. Test the actual phones and browsers you plan to use. Disconnect and End pager prevent automatic restart."
[[faq]]
q = "Can we use a phone hotspot?"
a = "A phone hotspot can work with Direct if it allows the devices to reach one another. Keep internet for discovery and pairing, and use the pager link or QR code if discovery misses it. Cloud relay offers another route when both devices permit it; it requires an explicit choice and internet throughout."
[[faq]]
q = "Why does the same Wi-Fi sometimes fail?"
a = "Guest isolation, firewalls, VPN routes, browser permissions or sleeping devices may prevent Direct. Try a reachable trusted network or explicitly start a new Cloud relay pager. Managed devices may restrict either route. Test the actual phones and computers you intend to use."

