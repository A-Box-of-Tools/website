#
# Time-Lapse Maker
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "timelapse-video"
name = "Time-Lapse Maker"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Time&#8209;Lapse&nbsp;Maker <span class=\"h1-kw\">&mdash; speed a long video up</span>"
tagline = "An hour of footage, in twenty seconds."
icon = "&#9193;&#65039;"          # the mark beside the page heading
favicon = "&#9193;"      # the tab icon, drawn into an inline SVG
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker"]
lastmod = "2026-08-23"

# --- what search engines and chat apps are told ------------------------------

title = "Time-Lapse Video Maker &mdash; Free, No Upload, Works Offline"
description = "Turn a long video into a time-lapse: 10x, 60x or any speed you type. Runs in your browser, so nothing is uploaded, there is no watermark, and it works offline."
og_title = "Time-Lapse Maker &mdash; speed up a video without uploading it"
og_description = "Take one frame every few seconds of a long clip and write them back as a short one. The file is read, decoded and encoded by your own browser."
og_image_alt = "Time-Lapse Maker - speed a long video up in your browser, with nothing uploaded"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Turn hours of footage into seconds - without the file leaving your machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  media-src needs blob: because both the clip you chose and the finished
  time-lapse are played from memory on this machine rather than from a URL. That
  is the only addition: this tool fetches nothing, so connect-src is left
  exactly as the site sets it."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Every frame is chosen, decoded and encoded again by your own browser, on
    your own hardware. Nothing here can fetch or send anything &mdash; there is
    no network feature in this tool at all &mdash; and there is no server on the
    other end of this page to send a video to even if there were."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and make
      a time-lapse. Not one request carries a frame, a filename, or a byte of
      what you chose. Or unplug from the internet and make one anyway &mdash; a
      tool that sent your video away to be processed would simply stop."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/plan.js</code> for the arithmetic that
      decides which instant each frame comes from, and <code>src/decode.js</code>
      for the loop that reads only the parts of the file those instants need.
      None of them imports anything that can make a request."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to make a time-lapse from a video"

# --- the card on the hub page ------------------------------------------------

card = """
            Turn a long clip into a short one &mdash; hours into seconds &mdash;
            without sending it anywhere."""

