slug = "trim-video"
name = "Video Trimmer"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Video&nbsp;Trimmer <span class=\"h1-kw\">&mdash; cut a video online</span>"
tagline = "Keep the part that matters, without losing a single byte of it."
icon = "&#127902;&#65039;"        # the mark beside the page heading
favicon = "&#127902;"     # the tab icon, drawn into an inline SVG
category = "images-and-video"

# Shared modules this tool asks for. The same arrangement as css_parts, and for
# the same reason: a component more than one tool needs and no tool should own.
# file-picker brings in the drop zone.
js_parts = ["file-picker"]
lastmod = "2026-08-20"

# --- what search engines and chat apps are told ------------------------------

title = "Trim a Video Online &mdash; Free, No Upload, No Quality Lost"
description = "Cut an MP4, MOV or WebM down to the part you want, or take a piece out of the middle. Runs in your browser: nothing uploaded, nothing re-encoded, works offline."
og_title = "Video Trimmer &mdash; cut a clip without uploading or re-encoding it"
og_description = "Mark a start and an end and cut. The frames are moved into the new file exactly as they were, so the result is the quality you started with. Nothing is uploaded."
og_image_alt = "Video Trimmer - cut a clip in your browser, with nothing uploaded"

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  media-src needs blob: because both the clip you chose and the trimmed result
  are played from memory on this machine rather than from a URL. That is the
  only addition: this tool fetches nothing, so connect-src is left exactly as
  the site sets it."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Your video is read, cut and written by your own browser, on your own
    hardware. Nothing here can fetch or send anything &mdash; there is no network
    feature in this tool at all &mdash; and there is no server on the other end of
    this page to send a video to even if there were."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and trim a
      clip. Not one request carries a frame, a filename, or a byte of what you
      chose. Or unplug from the internet and trim one anyway &mdash; a tool that
      sent your video away to be cut would simply stop."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/demux.js</code> for the reader that finds
      the frames in an MP4, <code>src/ranges.js</code> for the arithmetic that
      decides which of them a cut consists of, and <code>src/copy.js</code> for
      the twenty lines that move them into the new file. None of them imports
      anything that can make a request."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to trim a video"

# --- the card on the hub page ------------------------------------------------

card = """
            Mark a start and an end and cut &mdash; or take a piece out of the
            middle. The frames are copied rather than re-encoded, so nothing is
            lost."""

