# Video Cutter
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "trim-video"
name = "Video Cutter"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Video&nbsp;Cutter <span class=\"h1-kw\">&mdash; cut a video online</span>"
tagline = "Mark the parts worth keeping as it plays. Get them back as one video."
icon = "&#127902;&#65039;"        # the mark beside the page heading
favicon = "&#127902;"     # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "scissors"
category = "video-and-animation"

# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

# Shared modules this tool asks for. The same arrangement as css_parts, and for
# the same reason: a component more than one tool needs and no tool should own.
# file-picker brings in the drop zone.
js_parts = ["file-picker", "codec-support", "mp4-reader", "mp4-writer", "video-support", "message-box", "media", "format", "errors", "webcodecs", "mp4-boxes", "segments", "timeline"]
# Where a finished result can be carried without being saved first: the row of
# links shared/handoff.js shows beside the download once there is one. Slugs of
# tools whose picker takes what this page produces; checked against the tools
# that exist by the build.
handoff = ["video-to-gif", "reverse-video"]
lastmod = "2026-09-02"

# --- what search engines and chat apps are told ------------------------------

title = "Cut a Video Online &mdash; Keep Only the Parts You Want, No Upload"
description = "Watch a video and mark every part worth keeping as it plays, then save those parts as one file. Runs in your browser: nothing uploaded, nothing re-encoded, works offline."
og_title = "Video Cutter &mdash; keep only the parts you want, without uploading anything"
og_description = "Press I and O as it plays to mark each part worth keeping. The marked parts are written back out as one video, frame for frame, with nothing uploaded."
og_image_alt = "Video Cutter - mark the parts you want and save them as one video, in your browser"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Mark the parts worth keeping as it plays, and save them as one video."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  media-src needs blob: because both the video you chose and the finished result
  are played from memory on this machine rather than from a URL. That is the
  only addition: this tool fetches nothing, so connect-src is left exactly as
  the site sets it."""

