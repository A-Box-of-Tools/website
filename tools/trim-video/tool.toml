# --- what search engines and chat apps are told ------------------------------

title = "Trim &amp; Join Videos Online &mdash; Free, No Upload, No Quality Lost"
description = "Cut MP4, MOV or WebM clips down to the parts you want and combine them into one video. Runs in your browser: nothing uploaded, nothing re-encoded, works offline."
og_title = "Video Trimmer &amp; Joiner &mdash; cut and combine clips without uploading them"
og_description = "Add your clips, mark what to keep in each, put them in order, and save one video. The frames are moved into the new file exactly as they were. Nothing is uploaded."
