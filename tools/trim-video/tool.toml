      chose. Or unplug from the internet and trim one anyway &mdash; a tool that
      sent your video away to be cut would simply stop."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/demux.js</code> for the reader that finds
      the frames in an MP4, <code>src/ranges.js</code> for the arithmetic that
      decides which of them a cut consists of, <code>src/clips.js</code> for the
      rules that say whether two clips can share a track, and
      <code>src/copy.js</code> for the loop that moves the frames into the new
      file. None of them imports anything that can make a request."""

