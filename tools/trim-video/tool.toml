[[privacy]]
title = "Your videos have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your file
      could be collected at, and nothing in the code that would send it if there
      were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 This tool has no network feature at
      all: no address to paste, nothing to download, no engine fetched on first
      use. Every byte that touches your video came from this origin when the page
      loaded."""

[[privacy]]
title = "On the normal path, nothing is even decoded."
body = """

      A trim does not change what any frame looks like, so the encoded frames are
      moved into the new file exactly as they were found. Each one is stored as a
      slice of the file on your disk &mdash; a note saying which bytes, not the
      bytes themselves &mdash; and your browser reads them for the first time as
      it writes the download. Nothing here ever turns your video back into a
      picture."""

[[privacy]]
title = "The sound is copied, not listened to."
body = """
 On both MP4 paths the
      audio samples are moved across without being decoded at all &mdash; nothing
      here ever turns them back into sound, and nothing could pass them anywhere
      if it did."""

[[privacy]]
title = "Where frames are decoded, it happens here."
body = """
 The exact
      cut, and the preview for a file this browser will not play, go through
      WebCodecs on your own machine. That is the same decoder that would show you
      the clip anyway, running in the same place."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about your
      video: not a file, not a frame, not a name, a size, a length, or where you
      cut it. Every line that reads, cuts and writes is served from this origin
      and listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The "Buy me a coffee" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about you
      or your video."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and everything on
      this page still works. That is the simplest proof of all."""

[[howto]]
title = "Choose a video."
body = """
 Drop an MP4, MOV, M4V or WebM onto
      the picker, or select one by hand. It is read straight off your disk by the
      browser; nothing is sent anywhere while you do it."""

[[howto]]
title = "Mark the start and the end."
body = """
 Play the clip and press
      <kbd>I</kbd> where it should start and <kbd>O</kbd> where it should end, or
      drag the two marks along the bar. The arrow keys step one frame at a time,
      so a cut can be placed exactly rather than nearly. The faint lines under
      the bar are the keyframes, which matter for the next step."""

[[howto]]
title = "Keep that part, or take it out."
body = """
 Keeping it is a trim:
      everything outside the marks goes. Taking it out is the other job people
      want and rarely find &mdash; the marked section is removed and what is left
      on either side is joined up, in one pass, with the sound still in step."""

[[howto]]
title = "Choose how much to spend."
body = """
 "Keep every byte" moves the
      frames across untouched: quick, and it cannot cost quality, but it begins
      at the keyframe before your mark. "Cut exactly here" starts on the frame
      you chose and encodes the picture again. The page says which one you are
      about to get and what it will cost, before you press the button."""

[[howto]]
title = "Trim it and download."
body = """
 The work happens on your own
      hardware, so how long it takes depends on your machine rather than on a
      queue &mdash; and a copy is usually over before you have let go of the
      mouse. The finished video is handed straight to your browser's downloads."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my video uploaded anywhere?"
a = """
        No. It is read, cut and written by your own browser on your own
        hardware. There is no server side to this tool, and the page's
        <code>Content-Security-Policy</code> names every address it may contact
        &mdash; none of them belongs to this site. Unplug from the internet and
        trim a clip anyway if you would rather check than be told."""

[[faq]]
q = "Does trimming lose quality?"
a = """
        Not on the normal path, and not in the way that matters. A trim does not
        change what any frame looks like, so the frames are moved into the new
        file exactly as they were: the same bytes, the same encoder settings,
        the same everything. The only path here that re-encodes anything is the
        exact cut, and it says so on the button."""

[[faq]]
q = "Why does my cut start earlier than I marked it?"
a = """
        Because of how video is stored, and only on players that ignore a
        standard part of the format. Most frames are kept as a description of how
        they differ from their neighbours, so they cannot be decoded without
        them; only a keyframe stands alone, and keyframes are typically one to
        ten seconds apart. A cut that copies frames therefore has to carry the
        run from the keyframe in front of your mark &mdash; and the file says
        <em>start playing at your mark</em>, which every mainstream player
        honours. If you need it exact in every player, choose "Cut exactly here",
        which re-encodes that opening stretch. The page tells you which case you
        are in and by how much before you export."""

[[faq]]
q = "Can I cut a piece out of the middle?"
a = """
        Yes. Mark the part you do not want and choose "Cut the section out": what
        is left on either side is joined into one clip, with the sound carried
        across in step. It works on both MP4 paths. It is the one thing the
        recording path cannot do, because a recording is made in one pass from
        one playhead."""

[[faq]]
q = "Which video formats can I trim?"
a = """
        MP4, M4V and MOV are read directly, whatever is inside them: H.264,
        HEVC, AV1 or VP9. Copying frames does not involve decoding them, so this
        path works even for a codec your browser has no decoder for at all.
        Anything else your browser can play &mdash; WebM most obviously &mdash;
        is trimmed by playing it and recording the result instead, which works
        but takes as long as the section is long. A file the browser can neither
        read nor play, which in practice means AVI, WMV, FLV and most MKVs, is
        refused with a message saying so rather than failing halfway through."""

[[faq]]
q = "Is there a limit on the size or length of the video?"
a = """
        There is no limit built into the tool, and on the copy path the file is
        barely read at all: the frames you keep are pointed at rather than loaded,
        so cutting a minute out of a four-gigabyte recording costs about what
        writing that minute to disk costs. The exact cut walks the file a few
        megabytes at a time. Either way the practical ceiling is the finished
        file, which is assembled in memory before you download it."""

[[faq]]
q = "Does the sound survive?"
a = """
        On both MP4 paths, exactly: the audio is copied across sample by sample
        without ever being decoded, so it is byte for byte what was in the file,
        and an edit mark keeps it lined up with the picture to within a
        thousandth of a second. On the recording path it is captured from
        playback and encoded again, which costs a little quality. Either way
        there is a checkbox to leave it out entirely."""

[[faq]]
q = "Does it keep the video the right way up?"
a = """
        Yes. A phone films in landscape and writes a rotation into the file
        rather than turning the pixels. The copy path carries that instruction
        across untouched, so a portrait clip comes out portrait; the exact path
        turns the frames as it re-encodes them and writes a file that needs no
        rotation at all. Both were the first thing tested, because getting it
        wrong is the classic way a trimmed clip ends up on its side."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no
        watermark. The site carries advertising, which is what pays for it; the
        ads are not given anything about your video."""

[schema]
browser_requirements = "Requires JavaScript. Copying frames needs no video codec support at all; the exact cut needs a browser with WebCodecs, and other formats fall back to recording."
category = "MultimediaApplication"
description = "Trim a video, or cut a section out of the middle of one, in the browser. MP4, MOV and M4V are cut by moving the encoded frames into a new file untouched, with the original audio carried across sample by sample; nothing is uploaded and nothing is re-encoded."
features = [
  "Trims MP4, MOV, M4V and WebM video",
  "Cuts without re-encoding, so no quality is lost",
  "Removes a section from the middle and joins what is left",
  "Frame-accurate marks, with keyframes shown on the timeline",
  "Keeps the original audio without re-encoding it",
  "Runs offline; no upload, no account, no watermark",
]

# This tool needs one thing the rest of the site does not: blob: on media-src,
# because both the clip you chose and the trimmed result are played from memory
# on this machine rather than from a URL. A tool can only ever widen its own
# page this way - it cannot narrow the site policy, and it cannot touch any
# other tool's.
[csp]
"media-src" = ["'self'", "blob:"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "video/*"
multiple = false
title = "Drop a video here"
hint = "or click to browse &mdash; MP4, MOV, M4V, WebM, and anything else this browser plays"
