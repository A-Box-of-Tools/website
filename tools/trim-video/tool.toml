[[privacy]]
title = "Your videos have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your file
      could be collected at, and nothing in the code that would send it if there
      were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 This tool has no network feature at
      all: no address to paste, nothing to download, no engine fetched on first
      use. Every byte that touches your video came from this origin when the page
      loaded."""

[[privacy]]
title = "On the normal path, nothing is even decoded."
body = """

      Cutting does not change what any frame looks like, so the encoded frames of
      the parts you marked are moved into the new file exactly as they were
      found. Each one is stored as a slice of the file on your disk &mdash; a
      note saying which bytes, not the bytes themselves &mdash; and your browser
      reads them for the first time as it writes the download. Nothing here ever
      turns your video back into a picture."""

[[privacy]]
title = "The marks file is made in the page."
body = """
 Saving your marks
      writes a text file out of the numbers already on screen, straight to your
      downloads. Loading one reads it here. Neither goes near a network, and
      neither carries anything but times."""

[[privacy]]
title = "The sound is copied, not listened to."
body = """
 On both MP4 paths the
      audio samples are moved across without being decoded at all &mdash; nothing
      here ever turns them back into sound, and nothing could pass them anywhere
      if it did."""

[[privacy]]
title = "Where frames are decoded, it happens here."
body = """
 The exact
      cut, and the preview for a file this browser will not play, go through
      WebCodecs on your own machine. That is the same decoder that would show you
      the video anyway, running in the same place."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about your
      video: not a file, not a frame, not a name, a size, a length, or where you
      cut it. Every line that reads, cuts and writes is served from this origin
      and listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The "Buy me a coffee" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about you
      or your video."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and everything on
      this page still works. That is the simplest proof of all."""

[[howto]]
title = "Choose a video."
body = """
 Drop an MP4, MOV, M4V or WebM onto
      the picker. It is read straight off your disk by the browser; nothing is
      sent anywhere while you do it. Drop several and they are joined, in the
      order you put them in."""

[[howto]]
title = "Play it, and mark the parts you want."
body = """
 Press
      <kbd>I</kbd> where a part should start and <kbd>O</kbd> where it should
      end. Do that as many times as you like &mdash; every pair becomes a row in
      the table underneath, and a band on the timeline. <kbd>U</kbd> takes the
      last one back, <kbd>Space</kbd> plays and pauses, and the arrow keys jump
      five seconds at a time. Slow the playback down if the moment is hard to
      catch."""

[[howto]]
title = "Fix up the marks."
body = """
 Each row can be played back on its own,
      retimed by typing an exact time into it, moved up or down the order, or
      deleted. The two ends of the selected part can also be dragged along the
      timeline. The total at the top is what the finished video will run to."""

[[howto]]
title = "Keep them, or cut them out."
body = """
 Keeping is the usual way
      round: the finished video is the parts you marked, joined in order.
      Cutting them out is the other job people want and rarely find &mdash; mark
      the adverts, the silences or the false starts, and what is left is joined
      up without them."""

[[howto]]
title = "Cut it, and download."
body = """
 "Keep every byte" moves the
      frames across untouched: quick, and it cannot cost quality, but each part
      begins at the keyframe before your mark. "Cut exactly here" decodes and
      writes the picture again so every part starts on the frame you chose. The
      page says which one you are about to get, and what it costs, before you
      press the button."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my video uploaded anywhere?"
a = """
        No. It is read, marked, cut and written by your own browser on your own
        hardware. There is no server side to this tool, and the page's
        <code>Content-Security-Policy</code> names every address it may contact
        &mdash; none of them belongs to this site. Unplug from the internet and
        cut a video anyway if you would rather check than be told."""

[[faq]]
q = "Can I keep several parts of the same video?"
a = """
        That is what this is for. Press <kbd>I</kbd> and <kbd>O</kbd> as many
        times as you like while it plays; each pair becomes a row, and the
        finished video is every row joined in order with everything else gone.
        Most online cutters give you one pair of handles and ask which single
        stretch to keep, which is fine for topping and tailing a clip and no use
        at all for watching an hour of footage once and keeping the six moments
        worth having."""

[[faq]]
q = "Does cutting lose quality?"
a = """
        Not on the normal path, and not in the way that matters. Cutting does
        not change what any frame looks like, so the frames are moved into the
        new file exactly as they were: the same bytes, the same encoder
        settings, the same everything. The only path here that re-encodes
        anything is the exact cut, and it says so on the button."""

[[faq]]
q = "Why does a part start earlier than I marked it?"
a = """
        Because of how video is stored, and only on players that ignore a
        standard part of the format. Most frames are kept as a description of how
        they differ from their neighbours, so they cannot be decoded without
        them; only a keyframe stands alone, and keyframes are typically one to
        ten seconds apart. A cut that copies frames therefore has to carry the
        run from the keyframe in front of your mark &mdash; and the file says
        <em>start playing at your mark</em>, which every mainstream player
        honours. If you need it exact in every player, choose "Cut exactly here",
        which re-encodes. The page tells you which case you are in, and by how
        much, before you export."""

[[faq]]
q = "Can I cut the adverts out instead?"
a = """
        Yes. Mark them, then choose "Cut them out": everything you did
        <em>not</em> mark is joined up instead, in order. The same list of marks
        answers both questions, so you can switch between them and see the length
        change without marking anything twice."""

[[faq]]
q = "Can I save my marks and come back to them?"
a = """
        Yes. "Save marks" writes a plain text file &mdash; one line a part, a
        start and an end separated by a comma &mdash; and "Load marks" reads one
        back. Two formats are offered, plain seconds and
        <code>HH:MM:SS.mmm</code>, and both keep to the layout other tools that
        work this way already use, so a file written here can be handed to one of
        those and a file written there can be dropped onto this page. Marking is
        careful work and nobody should have to do it twice."""

[[faq]]
q = "Which video formats can I cut?"
a = """
        MP4, M4V and MOV are read directly, whatever is inside them: H.264,
        HEVC, AV1 or VP9. Copying frames does not involve decoding them, so this
        path works even for a codec your browser has no decoder for at all.
        Anything else your browser can play &mdash; WebM most obviously &mdash;
        is cut by playing it and recording the result instead, which works, takes
        as long as the result is long, and can only keep one part. A file the
        browser can neither read nor play, which in practice means AVI, WMV, FLV
        and most MKVs, is refused with a message saying so rather than failing
        halfway through."""

[[faq]]
q = "Is there a limit on the size or length of the video?"
a = """
        There is no limit built into the tool, and on the copy path the file is
        barely read at all: the frames you keep are pointed at rather than
        loaded, so keeping four minutes out of a four-gigabyte recording costs
        about what writing those four minutes to disk costs. The exact cut walks
        the file a few megabytes at a time. Either way the practical ceiling is
        the finished file, which is assembled in memory before you download
        it."""

[[faq]]
q = "Does the sound survive?"
a = """
        On both MP4 paths it is copied across sample by sample without ever being
        decoded, so it is byte for byte what was in the file, and an edit mark
        keeps every part lined up with its picture to within a thousandth of a
        second. The one exception is joining separate videos whose sound is
        described differently &mdash; different sample rates, say &mdash; where
        there is no way to put both into one track without decoding them, and the
        page says so before it does. On the recording path it is captured from
        playback and encoded again. Either way there is a checkbox to leave it
        out entirely."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no
        watermark. The site carries advertising, which is what pays for it; the
        ads are not given anything about your video."""

[schema]
browser_requirements = "Requires JavaScript. Copying frames needs no video codec support at all; the exact cut needs a browser with WebCodecs, and other formats fall back to recording."
category = "MultimediaApplication"
description = "Mark any number of parts of a video while it plays, then save those parts as a single file - or cut them out and keep the rest. MP4, MOV and M4V are cut by moving the encoded frames into a new file untouched, with the original audio carried across sample by sample; nothing is uploaded and nothing is re-encoded."
features = [
  "Marks any number of parts with I and O while the video plays",
  "Joins the marked parts into one file, in the order you choose",
  "Cuts the marked parts out instead, keeping everything else",
  "Cuts without re-encoding, so no quality is lost",
  "Saves and reloads the marks as a plain text timestamps file",
  "Frame-accurate marks, with keyframes shown on the timeline",
  "Keeps the original audio without re-encoding it",
  "Runs offline; no upload, no account, no watermark",
]

# This tool needs one thing the rest of the site does not: blob: on media-src,
# because both the video you chose and the finished result are played from
# memory on this machine rather than from a URL. A tool can only ever widen its
# own page this way - it cannot narrow the site policy, and it cannot touch any
# other tool's.
# The carry-on row reads the finished result back out of this page's own
# blob: URL before parking it for the next tool (see shared/handoff.js), and
# reading a blob: URL is a fetch the policy has to permit. blob: names bytes
# inside this page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
"media-src" = ["'self'", "blob:"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "video/*"
multiple = true
title = "Drop a video here"
hint = "or click to browse &mdash; MP4, MOV, M4V, WebM. Drop several to join them."
