[[privacy]]
title = "Processing happens in this browser."
body = "This tool processes input and results inside your browser. Its processing code does not upload them for processing. Content-Security-Policy restricts permitted resources and connection destinations, but allowed hosts can still receive requests: the policy does not inspect payloads and alone cannot prove that nothing is sent. Compare the source with the requests for the operation you use, or complete that local operation while disconnected."

[[privacy]]
title = "Encoding is local."
body = """
 WebCodecs runs in your browser and the finished
      file is handed straight to a download. There is no server side to this app."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about your
      images: not a file, not a thumbnail, not a name, a size, or a count. Every
      line that reads, decodes, composites or encodes an image is served from this
      origin and listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The "Buy me a coffee" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about
      you or your images. Nothing happens unless you click it, and what you
      would be clicking through to is somebody else's site."""

[[privacy]]
title = "One deliberate exception."
body = """
 If you use "Add from a web address",
      that server is contacted to fetch the image and will see your IP address. Only
      images you paste in are ever fetched, and only inbound: <code>img-src</code> is
      opened, <code>connect-src</code> is not. The counter below lists every outside
      origin contacted."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and everything except
      web-address loading still functions. That is the simplest proof of all."""

[[howto]]
title = "Choose your images."
body = """
 Drop a folder onto the picker, or
      select the files by hand. They are read straight off your disk by the
      browser; nothing is sent anywhere while you do it."""

[[howto]]
title = "Choose frames for a sequence, or seconds for a slideshow."
body = """
 Use Sort by name for numbered render frames and check the first and last
      tiles. Keep one frame per image for a render sequence or photo timelapse;
      match the frame rate to your source. For a slideshow, switch to seconds,
      enter a hold such as three, and press Apply to all. Drag to reorder or
      override an individual image's hold."""

[[howto]]
title = "Pick a resolution and frame rate."
body = """
 Choose 1080p for a first export, or use the destination's square or vertical
      shape. Match highest resolution takes the widest width and tallest height
      across the images. Fit inside keeps the whole picture; Fill frame crops
      the edges. Check the duration and output-size summary before encoding."""

[[howto]]
title = "Create the video and download it."
body = """
 Encoding runs on your
      own hardware, so how long it takes depends on your machine rather than on
      a queue. The finished MP4 is handed straight to your browser's downloads."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Are my images uploaded anywhere?"
a = """
        No. Your images are read, composited and encoded by your own browser on
        your own hardware. There is no server side to this tool, and the page's
        <code>Content-Security-Policy</code> names every address it may contact
        &mdash; none of them belongs to this site. The one exception is the
        optional "add from a web address" feature, which fetches an image you
        paste in, and that server sees your IP address."""

[[faq]]
q = "Which image formats can I use?"
a = """
        Any still image format your browser can decode, which in practice means
        JPG, PNG, WebP, GIF, AVIF and, on Apple devices, HEIC. There is no
        separate list to keep up to date here, because the decoding is the
        browser's job rather than ours."""

[[faq]]
q = "What video format does it produce?"
a = """
        MP4 with H.264 video is the preferred output. The fallback records in
        real time, usually as WebM, which fewer editors accept. Keep the tab
        visible during fallback recording; timing is approximate and images can
        be skipped if decoding falls behind. Use the MP4 encoder for exact
        numbered sequences when your browser supports it."""

[[faq]]
q = "Can I use this for a Blender or After Effects render sequence?"
a = """
        Yes &mdash; a numbered render sequence is exactly what this is for. Add
        the frames your renderer wrote, leave the hold time at one frame each,
        and set the frame rate to match the render. "Sort by name" counts the
        way you would expect, so <code>frame_2</code> lands before
        <code>frame_10</code> rather than after it.
        <br><br>
        One thing worth knowing before you start: H.264 has no alpha channel,
        so transparency is flattened onto the backdrop colour rather than
        carried through. If you need to keep the alpha, composite the frames in
        your editor instead."""

[[faq]]
q = "Can I make a timelapse from photos?"
a = """
        Yes, and it is the same job as a render sequence: hold each photo for a
        single frame and pick a frame rate. At 30 fps every thirty photos
        becomes one second of video; at 12 fps those same photos run for two
        and a half seconds.
        <br><br>
        "Sort by date" uses the files' modification dates, which may change
        when photographs are copied or edited. Check the order when filenames
        have restarted at 0001. Photos of
        different sizes are fine &mdash; "Match highest resolution" starts with
        the widest width and tallest height, then limits the longest edge to
        7680 pixels and rounds to even dimensions. Check the output-size summary;
        very large originals can still be scaled down."""

[[faq]]
q = "Is there a limit on how many images, or how long the video can be?"
a = """
        There is no fixed image-count limit, but MP4 exports must stay below
        4 GiB (about 4.3 GB). The finished video is assembled in memory before
        download, so your device can run out of memory well before that cap.
        The browser's encoder also limits output dimensions. If a large export
        fails, reduce resolution, shorten the sequence or split it into parts."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in and no trial. The site
        carries advertising, which is what pays for it; the ads are not given
        anything about your images."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your images away to be processed would stop
        the moment you unplugged."""

[[faq]]
q = "Can I add music or a soundtrack?"
a = """
        Not yet. The tool produces video only: the MP4 it writes has a single
        video track and no audio track. Add a soundtrack afterwards in a video
        editor if you need one."""

[schema]
# Overrides the default "Requires JavaScript." - this tool needs more than
# that to produce its headline output format.
browser_requirements = "Requires JavaScript. MP4 output needs a browser with WebCodecs; others fall back to WebM."
category = "MultimediaApplication"
description = "Turn a folder of images into an MP4 slideshow video. Every step runs in your browser, so no image is ever uploaded."
features = [
  "Converts JPG, PNG, WebP, GIF and AVIF images to video",
  "MP4 (H.264) output, with WebM as a fallback",
  "Resolution presets through 4K, custom dimensions subject to browser limits, and custom whole frame rates from 1 to 120 fps",
  "Per-image hold time in frames or seconds",
  "Runs offline; no upload, no account",
]

# This tool needs three things the rest of the site does not: http: on img-src,
# because "add from a web address" is allowed to pull an image IN from a plain
# http host; and blob: on media-src and worker-src, because the finished video
# and the encoder that makes it live in memory on this machine rather than at a
# URL. A tool can only ever widen its own page this way - it cannot narrow the
# site policy, and it cannot touch any other tool's.
[csp]
"media-src" = ["'self'", "blob:"]
"worker-src" = ["'self'", "blob:"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "image/*,image/avif,.avif"
multiple = true
title = "Drop images here"
hint = "or click to browse &mdash; JPEG, PNG, WebP, GIF, AVIF"

# Switching this on ships the importer module, its stylesheet and the widened
# img-src this page needs, together - see shared/js/url-import.js. It is only
# honest here because the pictures are headed into a lossy video codec anyway,
# so arriving as a re-encoded JPEG costs nothing a viewer could see. A tool that
# would have to tell the truth about the bytes it was given must go without.
# Twelve frames panning across one scene, so the frame rate and
# the order are both checkable by eye.
example = true

[picker.urls]
summary = "Add from a web address"
button = "Download images"
noun = "image"
