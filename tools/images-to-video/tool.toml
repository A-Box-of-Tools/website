#
# Images to Video
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "images-to-video"
name = "Images to Video"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Images&nbsp;to&nbsp;Video <span class=\"h1-kw\">&mdash; make an MP4 slideshow</span>"
tagline = "Turn a folder of images into a video."
icon = "&#127902;&#65039;"          # the mark beside the page heading
favicon = "&#127902;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "clapperboard"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker", "codec-support", "mp4-muxer", "message-box", "format", "webcodecs", "errors", "mp4-boxes"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Image Sequence to MP4 &mdash; Free, No Upload, Works Offline"
description = "Turn JPG, PNG or WebP images into an MP4 slideshow video, free and entirely in your browser. Nothing is uploaded, no sign-up, and it works offline."
og_title = "Image Sequence to MP4 &mdash; free, in your browser"
og_description = "Turn a render sequence, a timelapse or a folder of photos into an MP4. Encoding runs on your own machine; nothing is uploaded."
og_image_alt = "Images to Video - turn a folder of images into an MP4 slideshow"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Turn a folder of images into an MP4 slideshow, encoded on your own machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  img-src allows http/https so the "add from web address" feature can pull an
  image IN, and because ad creatives come from anywhere. media-src and
  worker-src need blob: because the finished video and the encoder both live in
  memory on this machine rather than at a URL."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Every frame is encoded by your own browser and the video is built in memory on
    this machine. The encoder never touches the network, and there is no server on
    the other end of this page to send an image to even if it did."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and make a
      video. Not one request carries an image, a thumbnail, or a filename. Or
      unplug from the internet and make one anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, and <code>src/encoder.js</code> for the encoding loop
      that never touches the network."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to turn images into a video"

# --- the card on the hub page ------------------------------------------------

card = """
            Turn a folder of images into an MP4 slideshow. Encoding runs on
            your own machine, using your own hardware."""

