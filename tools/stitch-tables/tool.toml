[[privacy]]
title = "Both tables are processed in this browser."
body = "The processing code reads selected files or pasted text on your device, creates match keys locally and builds the result in memory. It does not upload the tables for processing. You can inspect the source and compare it with browser requests, or complete the job while disconnected."
[[privacy]]
title = "A pattern is applied locally."
body = "The rules extract part of a value or remove punctuation before comparing keys. There is no remote lookup, AI service or third-party spreadsheet parser. Original cell contents are preserved in the result; only comparison keys are transformed."
[[privacy]]
title = "The result leaves the page when you choose an export."
body = "Copy writes the prepared CSV or TSV to your clipboard. Download gives your browser a local file. The table-processing code does not store either source or the result on a server. Keep the original files if you need to repeat or check the work later."
[[privacy]]
title = "The site frame explains its own requests."
body = "The page's advertising, measurement and feedback features are described separately in the site's privacy information and live network panel. The table-processing code does not hand them source files, cells, filenames or match keys."

[[howto]]
title = "Add table A and table B."
body = "Paste CSV or tab-separated cells copied from a spreadsheet, or choose a text file for each side. Check the delimiter and automatic heading guess. Without a clear heading row, all rows are kept and column names are suggested from value patterns. You can choose the heading-row setting manually. Values stay as text, so an identifier such as 00123 keeps its leading zeroes."
[[howto]]
title = "Choose how the rows meet."
body = "Match rows by columns and an exact value or extraction pattern, pair individual rows manually, or use Simple merge to add rows, columns, or both. The combined direction matches a selected key, retains every unmatched row, and combines shared fields when their values agree or one is empty. Conflicting fields keep separate A/B columns. For matching and manual pairing, choose whether to keep every row, all of table A, or only paired rows."
[[howto]]
title = "Review the matches and the preview."
body = "Blank keys do not match. Repeated automatic keys produce every matching combination, so check the duplicate count and result size. Manual pairing lets you choose a particular B row for an A row. The preview is limited; the result count describes the full export."
[[howto]]
title = "Copy or download the joined table."
body = "Choose CSV or TSV and check formula protection. Protection adds an apostrophe to cells that a spreadsheet might treat as a formula; turn it off only when you want the original text exported unchanged. Copy and Download use the current prepared result."

[[faq]]
q = "Can I use tables copied from Excel or Google Sheets?"
a = "Yes. Copy a rectangular range and paste it into a table box; spreadsheet cells usually arrive separated by tabs. You can also save a sheet as CSV or TSV and choose that file. This tool reads delimited text, not an XLSX workbook, its formulas, cell styles or multiple sheets."
[[faq]]
q = "What if my table has no header row?"
a = "Automatic detection keeps the first row as data unless it looks like headings. Headerless columns receive suggested names such as Email, Date, ID, Number or Text based on up to 50 rows. Repeated suggested names become Email 1, Email 2 and so on. Guesses do not change cell values. Review the notice and choose First row is headings or No heading row if needed; ambiguous all-text tables cannot always be distinguished automatically. Stacking still aligns headerless tables by column position."
[[faq]]
q = "What kinds of pattern matching are available?"
a = "Compare the whole value, take its first run of digits, keep letters and digits while removing punctuation and spacing, or take text before or after the first separator you supply. For example, the first-number rule extracts 001 from both invoice-001 and paid/001. The extracted text is a comparison key; source cells remain unchanged. These are fixed extraction rules, not fuzzy matching or arbitrary regular expressions."
[[faq]]
q = "What happens to blank keys, duplicates and unmatched rows?"
a = "Blank keys and values from which the chosen pattern extracts nothing remain unmatched. If a key appears twice in table A and three times in table B, matching produces six joined rows. All rows from both tables retains unpaired rows with empty cells for the missing side; All rows from table A omits B-only rows; Matching pairs only omits every unpaired row. Manual pairing is one-to-one."
[[faq]]
q = "Can I merge more rows, more columns, or both?"
a = "Yes. Add rows stacks B below A and aligns headed columns, keeping extra columns; without headings it aligns by position. Add columns places tables side by side and retains the longer table's rows. Add rows and columns matches records by your chosen key and keeps unmatched records from both sides. Shared headings combine equal values or fill exactly empty cells. If a shared field has any conflicting nonempty values, its full A/B columns remain separate. Headerless fields stay separate because inferred names do not establish that they mean the same thing."
[[faq]]
q = "How large can the tables be?"
a = "Each source is limited to 2,097,152 text characters, 5,000 data rows, 100 columns and 100,000 data cells. Selected files are also limited to 2 MiB. The stitched result is limited to 20,000 rows and 500,000 cells. These bounds keep the browser responsive and stop duplicate keys from expanding into an unexpectedly large result. A preview shows part of the result; export includes every prepared row."
[[faq]]
q = "Does export change my values?"
a = "Cells remain text without number or date conversion. Quoting and delimiters may change when written. Formula protection is enabled by default and prefixes potentially active spreadsheet cells with an apostrophe; turn it off for unchanged-text export. Your spreadsheet may still infer dates or numbers when opening CSV, so import columns as text when preserving identifiers matters."
[[faq]]
q = "Are either of my tables uploaded?"
a = "The table-processing code does not upload source files, pasted cells, match keys or results. It runs in this browser and works offline after the page is loaded. Copy intentionally places the result on your clipboard, and Download saves a file through your browser."

