# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  script-src carries 'wasm-unsafe-eval' here and on no other page. This is the
  one tool with a codec of its own - libheif, compiled to WebAssembly - because
  HEIC is the one format no browser but Safari will decode. Instantiating a
  WebAssembly module is what that keyword permits, and nothing else: it does not
  allow eval, it does not allow inline script, and it does not open a single
  network directive. connect-src is untouched, which is why the engine ships
  with its binary inside it rather than fetching one.

  img-src needs blob: for the converted pictures this page draws from the files
  you chose, and https: because ad creatives come from anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    The decoding runs in your own browser, on your own hardware. HEIC is the one
    picture format a browser will not open by itself, so this page carries the
    decoder with it &mdash; about 1.4 MB, served from this site, cached after the
    first visit. That is the entire reason every other HEIC converter asks you to
    upload: they put the codec on a server and your photos have to go to it. This
