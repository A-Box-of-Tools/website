# --- the policy this page adds to the site's -------------------------------
#
# The only widening any tool here has ever asked for, and it is one keyword.
# 'wasm-unsafe-eval' lets the page instantiate a WebAssembly module; without it
# the decoder loads and then refuses to start. Note what is NOT here:
# connect-src is left exactly as the site set it, so this page still cannot
# fetch, XHR, WebSocket or beacon anything anywhere - which is the reason the
# vendored engine is the build with its binary embedded rather than the smaller
# one that would have to go and get it.
[csp]
"script-src" = ["'wasm-unsafe-eval'"]

[[privacy]]
title = "Your photos have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your files
      could be collected at, and nothing in the code that would send them if there
      were."""

[[privacy]]
title = "The decoder came from here, and it goes nowhere."
body = """
 HEIC is HEVC
      in a box format, and no browser but Safari will decode one, so this page
      ships <code>libheif</code> compiled to WebAssembly &mdash; about 1.4 MB,
      committed to this repository, served from this origin, and cached by the
      service worker like every other file here. It is not fetched from a CDN,
      because that would put a third party in the path of every visit and would
      stop the tool working offline. The binary is inside the script rather than
      beside it precisely so that no fetch is needed to start it."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> in any file written for this tool. The vendored
      engine, like every Emscripten build, contains the loader paths that would
      fetch a <code>.wasm</code> from a URL; they are not taken, because the
      binary is already in hand &mdash; and if one were, <code>connect-src</code>
      names Google's measurement endpoints and nothing else, so the browser would
      refuse it. The policy is the proof, not the promise."""

[[privacy]]
title = "The metadata is read here and reported to you."
body = """
 The list on
      the page says what each photo carries &mdash; the date, the camera, and
      whether there are GPS coordinates in it &mdash; because that is a thing you
      might want to know before you hand the JPEG to somebody. It is read out of
      the file by <code>src/boxes.js</code> in this browser, shown on this page,
      and written into your JPEG or left out, entirely as you choose. There is no
      custom analytics event in this repository that carries a filename, a date,
      a coordinate or a count."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed anything about your photos. Every line that
      reads, decodes or writes a file is served from this origin and listed in
      the repository."""

[[privacy]]
title = "It works offline."
body = """
 Load the page once and disconnect from the
      network, and the tool is unchanged &mdash; the decoder is cached with it.
      That is the simplest proof of all, and it is a stronger one here than
      anywhere else on this site: a converter that sent your photos away to be
      decoded could not possibly manage it."""

[[howto]]
title = "Choose your HEIC photos."
body = """
 Drop them onto the picker or select them
      by hand, straight out of a phone backup or a folder on the desktop. They
      are read off your disk by the browser; nothing is sent anywhere while you
      do it. The list says what each one is and what it has inside it."""

[[howto]]
title = "Check what the photos carry."
body = """
 Each row names the date it was
      taken, the camera, and &mdash; in green, because it is the part worth
      noticing &mdash; whether the file holds GPS coordinates. That is read out
      of the container without decoding the picture, so it costs nothing and
      appears immediately."""

[[howto]]
title = "Pick a format, and decide about the details."
body = """
 JPEG unless you have a
      reason: it is the format that opens everywhere, which is the whole point of
      converting. The quality slider is at 92, which is the setting at which a
      photograph is hard to tell from the original. The checkbox decides whether
      the date, camera and location come along."""

[[howto]]
title = "Press \"Convert\", and download."
body = """
 The decoder arrives on the
      first conversion &mdash; about 1.4 MB, once &mdash; and every photo after
      that is decoded and written on your own machine. One file gives you a
      download button; several give you a zip as well."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree.

[[faq]]
q = "Is my photo uploaded anywhere?"
a = """
        No. The file is read, decoded and written by your own browser on your own
        hardware. This tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site. The one thing that does load is the
        decoder itself, and that comes from this site, once, before your photo is
        ever involved."""

[[faq]]
q = "Why does this page download 1.4 MB the first time?"
a = """
        Because HEIC is the one picture format a browser will not open. It is an
        HEVC frame in a box container, and only Safari, on Apple hardware, has a
        decoder for it; Chrome, Firefox and Edge simply refuse the file. So a HEIC
        converter needs a decoder from somewhere, and there are two places it can
        come from: a server, or the page. Every other converter chose the server,
        which is exactly why they all need your photos uploaded. This one carries
        <code>libheif</code> compiled to WebAssembly instead. It is served from
        this site, cached after the first visit, and it is the entire price of
        your photos not going anywhere."""

[[faq]]
q = "Does the JPEG keep the date, the camera and the location?"
a = """
        If you want it to, and it is a checkbox on the page. Left on, the EXIF
        block is copied out of the HEIC and written into the JPEG exactly as the
        phone wrote it, so the converted photo still sorts by the day it was taken
        rather than the day it was converted &mdash; which is the usual complaint
        about HEIC converters. One tag is changed and only one: the orientation,
        which is set to "upright", because the rotation has already been applied
        to the pixels and a viewer that applied it again would turn every portrait
        photo on its side. Turn the checkbox off and the JPEG comes out with the
        picture and nothing else."""

[[faq]]
q = "Does it strip GPS coordinates?"
a = """
        It tells you they are there, and then it does whatever you ask. The row
        for each photo says whether the file carries coordinates before you
        convert anything, which is more than the phone does. Unticking "keep the
        date, the camera and the settings" leaves them out of the JPEG along with
        everything else; leaving it ticked carries them across. If what you want
        is to look through the tags in detail, or to strip them from photos that
        are already JPEGs, the <a href="../exif-editor/">EXIF Viewer &amp;
        Remover</a> is the tool for that, and it does it without re-compressing
        the picture."""

[[faq]]
q = "Is the picture re-compressed?"
a = """
        Yes, and it has to be: HEIC and JPEG are different codecs, so there is no
        way to move from one to the other without decoding the picture and
        encoding it again. What you can control is how much that costs. The
        quality slider defaults to 92, at which a photograph is very hard to
        distinguish from the original, and PNG is on the menu for the case where
        you want no loss at all and do not mind the file being five to ten times
        the size."""

[[faq]]
q = "What if the file is called .jpg but is really a HEIC?"
a = """
        It still works. Every file dropped here is identified by its first bytes
        rather than by its name, because the name is whatever the last app to
        touch the file decided to call it &mdash; and a HEIC that arrived called
        ".jpg" is one of the commonest ways people end up looking for a tool like
        this. A file that genuinely is a JPEG or a PNG is refused with a message
        saying so, rather than being converted into a copy of itself."""

[[faq]]
q = "Can it convert a Live Photo, or a burst?"
a = """
        The still pictures in it, yes. A HEIC can hold more than one picture, and
        every one it holds is converted and named after the original with a number
        on the end. The video half of a Live Photo is a separate file that the
        phone keeps beside the HEIC, so it is not in here to convert. Depth maps
        and thumbnails are in the container but are not pictures anybody asked
        for, and are left alone."""

[[faq]]
q = "Why will it not take my AVIF?"
a = """
        Because there is nothing to do to it. AVIF is the same container as HEIC
        with AV1 inside instead of HEVC, and every current browser decodes one
        natively &mdash; so a converter would be shipping a megabyte of engine to
        solve a problem you do not have. If you need an AVIF as a JPEG, the
        <a href="../compress-image/">Image Compressor</a> and the
        <a href="../resize-image/">Image Resizer</a> both read AVIF and write
        JPEG using the decoder your browser already has."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no
        watermark. There is no limit on the number or the size of the files
        either, because there is no server paying for them &mdash; the work
        happens on your own machine. The site carries advertising, which is what
        pays for it; the ads are not given anything about your photos."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes, decoder included. Load the page once, then disconnect from the
        internet and it keeps working on your photos exactly as before. That is
        also the strongest proof available that nothing is being uploaded: a
        converter that sent your HEICs away to be decoded would stop the moment
        you unplugged, and this one does not."""

[schema]
category = "MultimediaApplication"
description = "Convert HEIC and HEIF photos from an iPhone into JPEG, PNG or WebP. The HEIC decoder is WebAssembly served from the page itself, so the pictures are decoded on your own machine and never uploaded. The date, camera and location can be carried into the JPEG or left out."
features = [
  "Converts HEIC and HEIF to JPEG, PNG or WebP",
  "Decodes in the browser, on any browser - not only Safari",
  "Nothing is uploaded, and the tool works with the network unplugged",
  "Carries the date, camera and GPS across into the JPEG, or leaves them out",
  "Says which photos hold GPS coordinates before anything is converted",
  "Corrects the orientation tag, so portrait photos do not come out sideways",
  "Identifies files by their contents, so a HEIC named .jpg still works",
  "Converts every picture in a burst or Live Photo, not just the first",
  "Batches, with all results in one zip",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
# Deliberately wider than ".heic". A HEIC that arrived called ".jpg" is one
# of the commonest reasons somebody is on this page, and an accept list of
# just the two extensions would hide that file in the browser's own dialog.
# Every file is identified by its first bytes anyway, and anything that is
# not a HEIC is refused with a message saying what it actually is.
accept = "image/*,.heic,.heif"
multiple = true
title = "Drop HEIC photos here"
hint = "or click to browse &mdash; .heic and .heif, whatever they happen to be named"
