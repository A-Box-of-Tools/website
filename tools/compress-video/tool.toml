#
# Compress a video
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is that this page is about a number, not a preference. People
# arrive because a file will not send - a chat app's limit, an email's, a
# form's - and what they want is the file under that number with as little
# lost as the number allows. So the page asks for the number, says what it
# buys before anything is encoded, and measures what came out against it.
# Every sentence here keeps the number in front.
#
# The second is that a compressed video is a re-encoded video, and the page
# says so rather than letting "compress" suggest the lossless thing it means
# for a zip file. The picture is decoded and written again, a generation
# further from the camera; the sound is copied through untouched; the
# result is H.264 in an MP4, because that is the one thing every phone,
# browser and chat app plays and the site has already ruled out promising
# WebM. Nothing here claims the picture is unchanged.
#

slug = "compress-video"
name = "Video Compressor"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Compress&nbsp;Video <span class=\"h1-kw\">&mdash; down to a size that will actually send</span>"
tagline = "Say how big it may be. The tool works out the rest, and measures the result before you get it."
icon = "&#128230;"                  # the package, beside the page heading
favicon = "&#128230;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "film"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works, chips
# is the rows of limits and frame sizes, and results carries the file name
# and size lines the other tools use.
css_parts = ["progress", "form", "chips", "checks", "notes", "results"]

# file-picker brings in the drop zone. mp4-reader is the demuxer six other
# tools ship, mp4-writer and mp4-boxes the writer that puts a re-encoded
# picture beside a copied sound track, reencode-video the decode-draw-encode
# loop this tool shares with the converter, and video-support, codec-support
# and webcodecs the questions asked of the browser's codecs and the wait
# that keeps a feed loop behind them. frame-canvas is the canvas each frame
# is drawn smaller into. format is sizes and durations as words, and errors is
# the cancellation every page ignores by name.
#
# example-photo, example-video, example-audio, example-video-sound, mp4-muxer,
# aac and wav are for the example alone: a clip with sound, built in the page,
# whose frames are drawn from the shared photograph and whose sound is the
# shared recording, the same set the trimmer asks for.
js_parts = ["file-picker", "mp4-reader", "mp4-writer", "mp4-boxes", "reencode-video", "video-support", "codec-support", "webcodecs", "frame-canvas", "message-box", "format", "errors", "example-photo", "example-video", "example-audio", "example-video-sound", "mp4-muxer", "aac", "wav"]
# Where a finished result can be carried without being saved first: the row
# of links shared/handoff.js shows under the result once there is one. A
# clip made small enough to send is often then cut, or turned into a GIF.
handoff = ["trim-video", "video-to-gif"]
lastmod = "2026-09-12"

