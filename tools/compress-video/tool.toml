[[privacy]]
title = "The upload is the slow part, and it is the part that does not happen."
body = """

      A video is the largest file most people ever try to send, which is why
      it will not send. Every online compressor asks for the whole thing
      first &mdash; the 900 MB goes up on your connection so that 25 MB can
      come back &mdash; and that upload is usually longer than the encoding
      it pays for, before any question of who keeps the file. This page
      encodes with the codecs already inside your browser, on your own
      machine, so the only bytes that move are from your disk to your
      memory and back. The page's <code>Content-Security-Policy</code> names
      every address it may contact &mdash; not one of them belongs to this
      site &mdash; and it works with the network unplugged."""

[[privacy]]
title = "It starts from the number, because the number is the point."
body = """

      A chat app allows 8 MB, or 25; an email 25; a form whatever it says.
      What you want is the file under that, with as little lost as the number
      allows. So the page asks for the number and works out the rest: the
      sound is copied as it is, the container takes a little, and what is
      left over the length of the clip is what the picture may spend. That
      bitrate is only worth something relative to how many pixels it has to
      paint, so the frame is stepped down a ladder of the sizes people know
      until each frame gets enough of it to look like a picture &mdash; and
      never up. The page says all of this before it starts, and you can
      overrule the frame size."""

[[privacy]]
title = "A compressed video is an encoded-again video, and the page says so."
body = """

      &ldquo;Compress&rdquo; means something lossless for a zip file and
      nothing of the kind for a video. The picture is decoded, drawn smaller,
      and encoded again with H.264 at the bitrate the number allows, which
      leaves it one generation further from the camera than the file you
      started with. The sound is not: its samples are copied into the new
      file exactly as they were. The result is an MP4, because that is the
      one container every phone, browser and chat app plays, and this site
      has already ruled out promising a format half its visitors could not
      have made."""

[[privacy]]
title = "The result is measured, and tightened once if it missed."
body = """

      An encoder lands near a bitrate rather than on it, so the file is
      asked for a little under the number and then measured. If it still
      came out over, the bitrate is worked out again from how far it missed
      and the clip is encoded a second time; two passes are always enough,
      and the page says when it took two. Then the finished file is opened
      again here and has to be the length it was: a compressor that dropped
      the last second, or the sound, would still be a smaller file, and only
      reading the result back can tell the difference."""

[[privacy]]
title = "What it costs on your machine, honestly."
body = """

      Encoding takes as long as your machine takes. With a hardware encoder
      &mdash; most laptops and every phone made in the last decade &mdash;
      it is faster than the clip is long; without one it is slower, and a
      long 4K clip is a long wait either way. The whole file is read from
      your disk in pieces, so a clip larger than your memory is fine, but
      the finished file is held in memory until you download it, which is
      where a laptop's limit is. Cancel is always live."""

[[privacy]]
title = "Which files it reads, and which it does not."
body = """

      MP4 and MOV &mdash; what phones, cameras and screen recorders write
      &mdash; with H.264, HEVC, VP9 or AV1 inside, whichever your browser
      will decode. An iPhone HEVC clip opens wherever the machine has a
      licence for it, which is most of them. WebM, MKV and AVI are not read
      here yet, and the page says so rather than failing vaguely."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about
      your video: not a file, not a frame, not a name, a size, a length, or
      the number you asked for. Every line that reads, encodes or writes a
      video is served from this origin and listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The \"Buy me a coffee\" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about
      you or your videos. Nothing happens unless you click it, and what you
      would be clicking through to is somebody else's site."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and everything on this
      page still functions. That is the simplest proof of all: a tool that sent
      your video away to be compressed would stop."""

[[howto]]
title = "Choose the video."
body = """
 One clip at a time, MP4 or MOV. It is read
      straight off your disk by the browser, and the page says what it is:
      how long, how big, what frame size, and what it spends per second."""

[[howto]]
title = "Say how big it may be."
body = """
 Type a number of megabytes, or press
      the limit you were given &mdash; 8, 16, 25, 50, 100 &mdash; or half or
      a quarter of what the file is. The line underneath says what that buys:
      the frame size and bitrate the clip's length and sound leave room for,
      and what the result should come out at. Leave the sound out if you
      would rather all of the number went to the picture."""

[[howto]]
title = "Overrule the frame size if you want to."
body = """

      The number picks a rung of the ladder on its own. Pick one yourself
      when you know better &mdash; a screen recording that must stay readable
      at 1080p, a clip that only needs to be watched on a phone &mdash; and
      the bitrate is spread over that instead. A rung is a ceiling: the
      picture is never made larger than it came."""

[[howto]]
title = "Compress it, and read the line that says it was measured."
body = """

      The picture is decoded, drawn smaller and encoded again, frame by frame,
      with a bar that says where it is. Then the finished file is measured
      against the number and opened again here to check its length; if it
      came out over, it is encoded once more, tighter, and the page says so.
      The result plays from memory under the download, so you can see it
      survived."""

[[faq]]
q = "How small can a video get?"
a = """
        As small as the number you type, down to the point where nothing
        watchable fits &mdash; and the page tells you where that is. The
        sound is copied as it is, so it costs what it costs (about a
        megabyte a minute for ordinary stereo), and the picture needs a few
        hundred kilobits a second at the smallest frame size to be a picture
        at all. Leaving the sound out gives its share to the picture, which
        for a short clip with a tight limit is often the difference."""

[[faq]]
q = "Why did the frame size change?"
a = """
        Because a bitrate only means something relative to how many pixels it
        has to paint. Two megabits a second is generous at 720p and mud at 4K,
        so once the number has decided the bitrate, the frame is stepped down
        the ladder until each frame gets enough bits to look like a picture.
        A smaller clear picture beats a large smeared one, and it is what
        every service that compresses uploads does silently. Here it is said
        before it starts, and you can pick the rung yourself."""

[[faq]]
q = "Will the quality be worse?"
a = """
        Yes, by exactly as much as the number requires and no more. A
        compressed video is a re-encoded video: the picture is written again
        at a lower bitrate, one generation further from the camera. The sound
        is not touched. What you lose is decided by the number you typed
        &mdash; a 900 MB clip made 25 MB has lost most of its bits, and a
        clip made half its size has lost few &mdash; and the page says the
        bitrate and frame size it chose so that the trade is visible rather
        than hidden."""

[[faq]]
q = "What format does it write?"
a = """
        MP4 with H.264 video, and the sound track copied through as it was.
        That is the one combination every phone, browser, chat app and email
        client plays, which is what a file that has to send needs. It does
        not write WebM, HEVC or AV1: smaller for the same quality, and not
        something half of the people you would send it to could open."""

[[faq]]
q = "Which files does it read?"
a = """
        MP4 and MOV &mdash; what phones, cameras and screen recorders write
        &mdash; with H.264, HEVC, VP9 or AV1 inside, as long as your browser
        will decode them. An iPhone HEVC clip opens wherever the machine has a
        licence for HEVC, which is most machines. WebM, MKV and AVI are not
        read here yet; the page says so when it meets one rather than
        failing vaguely."""

[[faq]]
q = "How long does it take?"
a = """
        As long as your machine takes to encode the clip. With a hardware
        encoder &mdash; most laptops and every recent phone &mdash; it is
        faster than the clip is long; a minute of 1080p usually takes less
        than a minute. Without one it is slower, and a long 4K clip is a long
        wait either way. The bar says which frame it is on, and cancelling
        stops it at once and writes nothing."""

[[faq]]
q = "Why did it take two passes?"
a = """
        Because an encoder lands near the bitrate it is asked for rather than
        on it, and on a busy clip it can land over. The file is asked for a
        little under the number and measured; if it still came out over, the
        bitrate is worked out again from how far it missed and the clip is
        encoded once more. Two passes are always enough, and the page says
        when it took two."""

[[faq]]
q = "Are my videos uploaded anywhere?"
a = """
        No. The clip is read, decoded, encoded and written by your own browser
        on your own hardware, and the page's <code>Content-Security-Policy</code>
        names every address it may contact &mdash; none of them belongs to
        this site. The simplest way to satisfy yourself is to unplug from the
        network and use the page anyway. On a tool for files this size, that
        is also the fastest way: the upload is usually longer than the
        encoding."""

[[faq]]
q = "Does it work on a phone?"
a = """
        On a phone whose browser can encode video, yes, and a phone's own
        hardware encoder is quick. What a phone lacks is memory: the finished
        file is held in memory until you save it, so a very long clip may be
        more than a phone can hold. Cut it first with the
        <a href=\"../trim-video/\">Video Trimmer</a>, or compress it on a
        laptop."""

[[faq]]
q = "Is there a size limit, and does it cost anything?"
a = """
        There is no limit written into the tool. The clip is read from your
        disk in pieces, so a file larger than your memory is fine going in;
        the limit is the finished file, which is held in memory until you
        download it, and a laptop will take a few hundred megabytes of result
        without complaint. It is free, there is no account, no sign-in and no
        trial. The site carries advertising, which is what pays for it; the
        ads are not given anything about your videos."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your video away to be compressed would stop
        the moment you unplugged."""

[schema]
category = "MultimediaApplication"
description = "Compress a video to under a chosen number of megabytes in your browser. The tool picks the frame size and bitrate the number allows, encodes H.264 into an MP4 on your machine, copies the sound through, and measures the result. Nothing is uploaded."
features = [
  "Takes a target size in megabytes, or a preset limit, or half or a quarter of the file",
  "Works out the bitrate the target leaves the picture once the sound and the container have taken theirs",
  "Steps the frame down a ladder of known sizes until each frame can afford its bits, never up",
  "Lets you overrule the frame size",
  "Copies the sound through untouched, or leaves it out to give the picture more",
  "Measures the result and encodes once more, tighter, if it missed",
  "Reopens the finished file to check it is the length it was, and plays it from memory",
  "Runs offline; no upload, no account, no file size limit",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
#
# One file, deliberately: a target size belongs to one clip, and a queue that
# gave twelve clips one number would give eleven of them the wrong one.
[picker]
accept = "video/mp4,video/quicktime,.mp4,.mov,.m4v"
multiple = false
title = "Drop a video here"
hint = "or click to browse &mdash; MP4 or MOV, one at a time"
# An eight-second clip with sound, built in the page. See src/example.js.
example = true

# blob: on media-src, because the finished result is played from memory on
# this page so that it can be looked at; blob: on connect-src, because the
# carry-on row reads the finished result back out of this page before parking
# it for the next tool (see shared/handoff.js). blob: names bytes inside this
# page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
"media-src" = ["'self'", "blob:"]
