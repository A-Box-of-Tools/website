#
# Image Redactor
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "redact-image"
name = "Image Redactor"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Image&nbsp;Redactor <span class=\"h1-kw\">&mdash; black out, pixelate or blur</span>"
tagline = "What you cover is deleted from the file, not covered up in it."
icon = "&#11035;"          # the mark beside the page heading
favicon = "&#11035;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "eye-off"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "images"

# Shared stylesheet parts this tool asks for, put before its own rules by
# the build so that its own can override them.
css_parts = ["results", "form"]

# Shared modules this tool asks for. file-picker brings in the drop zone; the
# list of boxes underneath the picture is this tool's own, because it is a list
# of rectangles rather than a list of files.
js_parts = ["file-picker", "message-box"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Redact an Image &mdash; Black Out, Pixelate or Blur, No Upload"
description = "Cover a name, an address or an account number in a photo or screenshot and re-encode the picture, so the hidden pixels are gone from the file rather than sitting under a rectangle. Runs entirely in your browser."
og_title = "Redact an image so the covered part is really gone"
og_description = "Draw boxes over what should not be seen. The pixels underneath are overwritten before the file is written, so there is no layer to move and nothing to recover. Nothing is uploaded."
og_image_alt = "Image Redactor - the covered pixels are overwritten, not hidden"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Draw a box, and the pixels under it stop existing before the file is written."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  img-src needs blob: because the finished picture is shown to you by decoding
  the file this page just made, and https: because ad creatives come from
  anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    The picture is decoded, painted over and encoded again by your own browser,
    using the codecs it already ships with. This tool has no network feature of
    any kind &mdash; nothing to fetch, nothing to send &mdash; which matters more
    here than almost anywhere else on this site: the pictures people bring to a
    redaction tool are the ones with a name, an address or an account number
    still legible on them."""

live_hint = """
