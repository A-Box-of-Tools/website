# Keeping a folder in step between two devices is a network feature, not
# local file processing: files cross from one browser to the other. They
# cross directly, encrypted, over the network the two devices share. The
# rendezvous introduces the browsers and never carries a file, a file name or
# a listing; those travel the peer connection, and only after the host has
# approved the device that asked to join.
#
# Unlike the other Connect Devices tools there is no Cloud relay. A relay
# forwards a few kilobytes of text or a stream of video through a metered
# service; this one would forward whole folders. Direct is host candidates
# only, so the devices must reach each other on a shared network.
#
# Nothing is ever deleted. Without a record of the last sync there is no way
# to tell a file deleted on one side from a file created on the other, and
# guessing wrong destroys somebody's work. A file missing on one side is
# offered to it, and the visitor can leave it alone instead.
