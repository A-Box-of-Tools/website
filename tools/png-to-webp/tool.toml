#
# PNG to WebP
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# This is the one of the three format converters that has a real decision on
# its page, and the decision is the tool: a PNG is lossless, so the only
# question worth asking is whether the WebP stays that way. Lossless WebP is
# the straight swap - same pixels, smaller file - and lossy WebP is the one
# that takes a photograph down by an order of magnitude at a cost.
#
# "Same pixels" carries one measured footnote, and the FAQ entry about
# half-transparent pixels is where it is spelled out: a canvas stores colour
# premultiplied by alpha, so a solid pixel survives bit for bit and the colour
# stored under a nearly-invisible one does not. That is the canvas rather than
# WebP - it is true of every browser converter, and of the two JPEG converters
# here as well - and it is invisible, because the pixels whose colour moves
# most are the ones showing least of it. It is written down because a claim
# of "lossless" that turns out to have an asterisk is worse than one that
# never made the claim.
#
# The awkward fact underneath it, recorded here because it is not visible in
# the code: a canvas has no flag for lossless WebP. Chromium switches codings
# at quality 1.0 exactly and that is how encodeWebp asks for one, but it is the
# behaviour of an engine rather than a promise of the HTML specification. So
# every result is read back out of its own bytes - VP8L means lossless, `VP8 `
# means not - and the row says which coding actually came out. If a browser
# ever stops honouring 1.0, this page will say so on the day rather than
# quietly handing people lossy files they were told were lossless.
#

slug = "png-to-webp"
name = "PNG to WebP"
