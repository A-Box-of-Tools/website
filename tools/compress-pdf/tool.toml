# --- what search engines and chat apps are told ------------------------------

title = "Compress PDF &mdash; Free, In Your Browser, No Upload"
description = "Make a PDF smaller without uploading it. The file is read, recompressed and rewritten by your own browser, and the tool shows you where its size actually is before it touches anything."
og_title = "Compress PDF &mdash; free, and nothing is uploaded"
og_description = "Shrink a PDF on your own machine. It measures how big each picture is drawn on the page, so it only throws away pixels nobody could see."
og_image_alt = "Compress PDF - make a document smaller without uploading it"

