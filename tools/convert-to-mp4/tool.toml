#
# Convert to MP4
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is that "MP4" here means one specific thing: H.264 picture and
# AAC sound in a plain MP4 container, because that is the file every phone,
# browser, chat app and upload form takes without argument. A WebM, an MKV,
# or an MP4 with HEVC or VP9 inside is refused by enough of them that people
# arrive here with one. The page never writes anything else, and never
# copies a picture codec that is not H.264 into the result, however good it
# is: a file that opens in fewer places than the original is not a
# conversion.
#
# The second is that a conversion is not always a re-encode, and the page
# says which it is, track by track, before it starts. H.264 in an MKV is
# copied frame for frame; VP9 in a WebM is decoded and encoded again. The
# word "convert" is not allowed to hide the difference, because one of them
# loses nothing and the other loses a generation.
#

slug = "convert-to-mp4"
name = "MP4 Converter"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Convert&nbsp;to&nbsp;MP4 <span class=\"h1-kw\">&mdash; WebM, MKV and MOV into the file that uploads</span>"
tagline = "Whatever came off the screen recorder, the ripper or the camera, as H.264 and AAC in an MP4. Copied where it can be, re-encoded only where it must."
icon = "&#127916;"                  # the clapper board, beside the page heading
favicon = "&#127916;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "clapperboard"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works,
# checks is the checkbox row, and results carries the file name and size
# lines the other tools use.
css_parts = ["progress", "form", "checks", "notes", "results"]

# file-picker brings in the drop zone. mp4-reader is the demuxer the video
# tools ship and mkv-reader its Matroska twin, which imports it. mp4-writer
# and mp4-boxes write the result; aac opens and writes the AAC description;
# copy-tracks carries a track across as it is, reencode-video is the
# decode-draw-encode loop the compressor runs too, reencode-sound the streamed
# AAC re-encode - the rotator shares all three - and
# video-support, codec-support, webcodecs and frame-canvas are what it is
# built from. format is sizes and durations as words, and errors is the
# cancellation every page ignores by name.
#
# example-photo, example-video, example-audio, mp4-muxer, wav and mkv-writer
# are for the example alone: a WebM with sound, built in the page, whose
# frames are drawn from the shared photograph and whose sound is the shared
# recording, encoded as VP8 and Opus and written by the Matroska writer.
js_parts = ["file-picker", "mp4-reader", "mkv-reader", "mp4-writer", "mp4-boxes", "aac", "copy-tracks", "reencode-video", "reencode-sound", "video-support", "codec-support", "webcodecs", "frame-canvas", "message-box", "format", "errors", "example-photo", "example-video", "example-audio", "mp4-muxer", "wav", "mkv-writer"]
# Where a finished result can be carried without being saved first: the row
# of links shared/handoff.js shows under the result once there is one. A
# file converted so that it will upload is often then too big to, or wants
# cutting.
handoff = ["compress-video", "trim-video"]
lastmod = "2026-09-12"

