# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Image&nbsp;to&nbsp;Data&nbsp;URI <span class=\"h1-kw\">&mdash; base64 encode a picture for CSS or HTML</span>"
tagline = "The whole picture as one line of text. Paste it straight into CSS or HTML."
icon = "&#128203;"          # the mark beside the page heading
favicon = "&#128203;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "code"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "images"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. file-list is the drop-a-file-then-see-a-row widget that
# more than one tool needs and that no tool should own.
css_parts = ["file-list", "form"]

# Shared modules this tool asks for. The same arrangement as css_parts,
# and for the same reason: a component more than one tool needs and no
# tool should own. file-picker brings in the drop zone.
js_parts = ["file-picker", "message-box", "format"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Image to Data URI &mdash; Base64 Encode for CSS, Free, No Upload"
description = "Turn a PNG, JPEG, SVG or WebP into a data URI you can paste into CSS or HTML. SVGs are percent-encoded rather than base64, so they stay readable and shorter. Runs in your browser; nothing is uploaded."
og_title = "Turn an image into a line you can paste into CSS"
og_description = "Base64 for pictures, percent-encoding for SVG, and the ready-made rule, custom property or img tag around it. Runs on your own machine; nothing is uploaded."
og_image_alt = "Image to Data URI - paste the picture into the stylesheet"

