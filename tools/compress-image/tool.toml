title = "Press \"Compress to the target\"."
body = """
 Each image is encoded
      several times while the tool narrows in on the highest quality that fits.
      Anything already under the target is left exactly as it is."""

[[howto]]
title = "Check what it cost, then download."
body = """
 Every result says what it
      was written as, at what quality, whether the dimensions changed, and how
