# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my image uploaded anywhere?"
a = """
        No. The file is decoded, compressed and measured by your own browser on your
        own hardware, using the JPEG, PNG and WebP encoders the browser already
        ships with. This tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site."""

[[faq]]
q = "How does it hit an exact size?"
a = """
        By trying. There is no formula that turns a quality setting into a byte
        count &mdash; it depends entirely on the picture &mdash; so the tool encodes
        the image several times and searches for the answer. It starts at the top of
        the quality range and narrows in by halving, which finds the highest quality
        that fits in about eight encodes. Every size you see on the page is a real
        encoded file, not an estimate."""

[[faq]]
q = "What does \"minimal loss\" actually mean here?"
a = """
        Three specific things. First, an image already under your target is passed
        through byte for byte rather than re-encoded. Second, quality is spent
        before resolution, and only down to a floor where compression artefacts
        start to show &mdash; past that point the tool makes the picture smaller and
        puts the quality back up, because fewer good pixels look better than more
        ruined ones. Third, once a fitting result is found the search pushes back up
        until the budget is used, so you do not get a 300 KB file when you asked for
        500 KB."""

[[faq]]
q = "What are the SSIM and PSNR figures on each result?"
a = """
        They are a measurement of what the compression cost, taken by decoding the
        result and comparing it with the original picture. SSIM compares local
        brightness, contrast and structure, which is much closer to what an eye
        objects to than counting changed pixels; above about 0.98 the two are hard
        to tell apart side by side. PSNR is the traditional decibel figure. Both are
        computed on your machine, and both are shown so that the claim of low loss
        is checkable rather than just asserted."""

[[faq]]
q = "Which formats can it read and write?"
a = """
        It reads anything your browser can decode, which in practice means JPEG,
        PNG, WebP, GIF, BMP and &mdash; on most current browsers &mdash; AVIF. It
        writes JPEG, PNG and WebP, because those are the encoders browsers ship. On
        "auto" it keeps the format your file arrived in, and switches to WebP only
        when keeping it would have meant a resize or a visible drop in quality."""

[[faq]]
q = "Why can it not compress a PNG very far?"
a = """
        Because PNG is lossless: it has no quality dial to turn. The only way to
        make a PNG smaller is to give it fewer pixels or fewer colours, so with PNG
        selected the tool reaches a target by resizing alone. If the picture is a
        photograph, JPEG or WebP will get far closer to your target at a size you
        can see is fine &mdash; and if it is a logo or a screenshot with
        transparency, WebP keeps the transparency that JPEG would fill in with
        white."""

[[faq]]
q = "Does compressing an image remove its EXIF and GPS data?"
a = """
        Yes, as a side effect. Compressing means decoding the picture to pixels and
        encoding those pixels again, and a canvas full of pixels carries no tags, so
        the location, camera model, timestamps and everything else are simply not
        written to the new file. If you want the metadata gone but the picture
        untouched, use the <a href="../exif-editor/">EXIF Viewer &amp; Remover</a>
        instead &mdash; it rewrites the container without re-compressing anything."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no watermark.
        There is no limit on the number or the size of the files either, because
        there is no server paying for them &mdash; the work happens on your own
        machine. The site carries advertising, which is what pays for it; the ads
        are not given anything about your images."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being uploaded:
        a tool that sent your images away to be compressed would stop the moment you
        unplugged."""

[schema]
category = "MultimediaApplication"
description = "Compress JPEG, PNG and WebP images to a size you name. The tool searches for the highest quality that fits the target, resizing only when quality alone cannot get there, and measures the result against the original. Runs entirely in the browser with no upload."
features = [
  "Compresses to a target file size you choose, not a quality number you have to guess",
  "Keeps full resolution where it can, and resizes only when quality alone cannot reach the target",
  "Spends the whole budget: the result lands just under the target rather than far below it",
  "Measures the result against the original with SSIM and PSNR",
  "Leaves files that are already under the target completely untouched",
  "JPEG, PNG and WebP, with an automatic format choice",
  "Batches, with all results in one zip",
  "Runs offline; no upload, no account",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif"
multiple = true
title = "Drop images here"
hint = "or click to browse &mdash; JPEG, PNG, WebP and anything else your browser can open"
