[[privacy]]
title = "A turn is nine numbers in the header, and the page changes only those."
body = """

      A phone that films sideways does not turn its pixels. It stores the
      frames as the sensor saw them and writes a quarter turn into the track
      header &mdash; a display matrix of nine numbers &mdash; which every
      player applies on the way to the screen. So a video that shows
      sideways needs a different matrix, not a different picture. This page
      writes the matrix for the turn you chose and copies every frame and
      every packet across exactly as they were, without decoding one. That
      is why a gigabyte takes seconds, why the picture is bit for bit what
      it was, and why the file comes out almost exactly the size it went
      in."""

[[privacy]]
title = "The upload is the slow part, and it is the part that does not happen."
body = """

      Every online rotator asks for the whole file first: the gigabyte goes
      up on your connection so that a turned gigabyte can come back, and the
      upload is usually longer than the work it pays for, before any
      question of who keeps the file. Most of them then re-encode it, which
      costs a generation of quality for a job that needed nine numbers.
      This page reads the file with code served from this address and
      writes the new one in memory, so the only bytes that move are from
      your disk to your memory and back. The page's
      <code>Content-Security-Policy</code> names every address it may
      contact &mdash; not one of them belongs to this site &mdash; and it
      works with the network unplugged."""

[[privacy]]
title = "Who honours the header, and what to do about the few who do not."
body = """

      Every phone, every browser, every modern player and every editor
      applies the display matrix; it is how phone footage has been shown the
      right way up since 2010. A few old desktop players ignore it and show
      the stored frames, sideways. For them, and for a clip that is going
      somewhere you cannot check, the page offers to bake the turn in: every
      frame is drawn turned on to a canvas and encoded again as H.264. That
      costs a generation of quality and takes as long as an encode, so it is
      the second choice and is named as one."""

[[privacy]]
title = "The result is opened again and checked."
body = """

      A rotator that wrote the wrong matrix, or the right one at the wrong
      size, would still produce a file that opens. So the finished file is
      opened again here, by the same reader that reads what you bring, and
      has to be the length it was, shown the way you asked at the size that
      implies, and carrying the sound it was meant to. It plays from memory
      under the download, so you can see it the right way up before you
      save it."""

[[privacy]]
title = "Which files it reads, and what it writes."
body = """

      MP4, MOV and M4V with any picture inside &mdash; H.264, HEVC, VP9 or
      AV1 &mdash; since a turn written into the header does not care what
      the frames are; and WebM and MKV, where the frames are copied if they
      are H.264 and baked in otherwise, because an MP4 header can be built
      round nothing else. AAC sound is copied; Opus, Vorbis, MP3 or FLAC is
      encoded again as AAC; a sound the browser cannot decode is named and
      left out. The result is always an MP4, because it is the one container
      everything plays."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about
      your video: not a file, not a frame, not a name, a size, a length, or
      which way you turned it. Every line that reads, turns or writes a
      video is served from this origin and listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The \"Buy me a coffee\" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about
      you or your videos. Nothing happens unless you click it, and what you
      would be clicking through to is somebody else's site."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and everything on this
      page still functions. That is the simplest proof of all: a tool that sent
      your video away to be turned would stop."""

[[howto]]
title = "Choose the video."
body = """
 One file at a time: MP4, MOV, M4V, WebM or MKV. It
      is read straight off your disk by the browser, and the page says what
      it is and which way up it is shown at the moment."""

[[howto]]
title = "Pick the turn, and look at the preview."
body = """
 A quarter turn right, a
      quarter turn left, or upside down. The first frame is drawn turned as
      chosen through the same arithmetic the file will carry, so what you
      see is what a player will do. Tick &ldquo;bake&rdquo; only if a
      player has shown you the clip sideways; leave the sound out if you
      would rather the clip went silent."""

[[howto]]
title = "Rotate it, and read the line that says it was checked."
body = """

      The header is written and every frame copied across, which takes
      seconds; a bake takes as long as an encode, with a bar that says where
      it is. Then the finished file is opened again here and has to be the
      length it was, shown the way you asked, and carrying its sound. It
      plays from memory under the download, so you can see it the right way
      up."""

[[faq]]
q = "Does rotating lose quality?"
a = """
        No, not the ordinary way. The turn is written into the file's header
        and every frame is copied across byte for byte, so the picture is
        exactly what it was and the file is almost exactly the size it was.
        Only &ldquo;bake it in&rdquo; re-encodes, and the page says so
        before you tick it. A rotator that re-encodes by default &mdash; most
        online ones &mdash; is doing a re-encode for a job that needed nine
        numbers."""

[[faq]]
q = "Why does the file still look sideways in one player?"
a = """
        Because that player ignores the display matrix. Every phone,
        browser, modern player and editor honours it; a few old desktop
        players do not, and show the frames as stored. Tick &ldquo;bake the
        turn into the picture&rdquo; and the frames themselves are turned
        and encoded again as H.264, which every player shows the same way at
        the cost of a generation of quality."""

[[faq]]
q = "Which way is a quarter turn right?"
a = """
        Clockwise, the way the top of the picture would move if you turned
        your phone to the right. The preview shows the first frame turned
        as chosen, so pick the button that makes it look right and press
        the big one."""

[[faq]]
q = "Which files does it read?"
a = """
        MP4, MOV and M4V with any picture inside, because a turn written
        into the header does not care what the frames are. WebM and MKV,
        where H.264 frames are copied and anything else is baked in, since
        an MP4 header can be built round nothing else. AAC sound is copied;
        Opus, Vorbis, MP3 and FLAC are encoded again as AAC; sound the
        browser cannot decode is named and left out. The result is always an
        MP4."""

[[faq]]
q = "How long does it take?"
a = """
        Seconds, for the ordinary turn: the file is read once for its layout
        and once more as the browser writes the result out, and a gigabyte
        goes at the speed of your disk. Baking the turn in takes as long as
        your machine takes to encode the clip &mdash; with a hardware
        encoder, most laptops and every recent phone, faster than the clip is
        long; without one, slower."""

[[faq]]
q = "Are my videos uploaded anywhere?"
a = """
        No. The file is read, given a new header and written again by your
        own browser on your own hardware, and the page's
        <code>Content-Security-Policy</code> names every address it may
        contact &mdash; none of them belongs to this site. The simplest way
        to satisfy yourself is to unplug from the network and use the page
        anyway. On a tool for files this size, that is also the fastest way:
        the upload is longer than the whole job."""

[[faq]]
q = "Does it work on a phone?"
a = """
        Yes. The ordinary turn decodes nothing, so a phone does it as fast
        as a laptop; the finished file is held in memory until you save it,
        which is the only limit, and a phone will hold a few hundred
        megabytes of result without complaint. Baking in is an encode, and a
        phone's own hardware encoder is quick at it."""

[[faq]]
q = "Is there a size limit, and does it cost anything?"
a = """
        The file is read from your disk in pieces, so a file larger than your
        memory is fine going in; the finished file is held in memory until
        you download it, and an MP4 written here cannot be over 4 GB. It is
        free, there is no account, no sign-in and no trial. The site carries
        advertising, which is what pays for it; the ads are not given
        anything about your videos."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your video away to be turned would stop
        the moment you unplugged."""

[schema]
category = "MultimediaApplication"
description = "Rotate a video a quarter or half turn in your browser. The turn is written into the file's header and every frame is copied across untouched, so nothing is re-encoded and nothing is lost; or bake it into the picture for old players. Nothing is uploaded."
features = [
  "A quarter turn right, a quarter turn left, or upside down",
  "Writes the turn into the display matrix and copies every frame and packet across as it is",
  "Shows the first frame turned as chosen, through the same arithmetic the file will carry",
  "Bakes the turn into the picture on request, for the few players that ignore the header",
  "Reads MP4, MOV, M4V, WebM and MKV; writes MP4",
  "Reopens the finished file to check its length, its turn and its sound, and plays it from memory",
  "Runs offline; no upload, no account, no file size limit",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
#
# One file, deliberately: a turn is chosen by looking at the preview, and
# twelve clips would want twelve looks.
[picker]
accept = "video/mp4,video/quicktime,video/webm,video/x-matroska,.mp4,.mov,.m4v,.webm,.mkv"
multiple = false
title = "Drop a video here"
hint = "or click to browse &mdash; MP4, MOV, WebM or MKV, one at a time"
# A six-second landscape clip with sound, built in the page. See src/example.js.
example = true

# blob: on media-src, because the finished result is played from memory on
# this page so that it can be looked at; blob: on connect-src, because the
# carry-on row reads the finished result back out of this page before parking
# it for the next tool (see shared/handoff.js). blob: names bytes inside this
# page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
"media-src" = ["'self'", "blob:"]
