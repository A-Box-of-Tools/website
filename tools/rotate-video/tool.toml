#
# Rotate a video
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is that a turn is a change to the file's header, not to its
# frames. A phone that films sideways writes a quarter turn into the display
# matrix and every player applies it; this page writes a different matrix
# and copies every frame and every packet across untouched. That is why it
# is fast, why it loses nothing, and why the page keeps saying "not one
# frame is decoded" - it is the claim, and it is true.
#
# The second is that the header is honoured by every phone, browser and
# modern player and ignored by a few old desktop ones, and the page says so
# rather than pretending either half away. "Bake it in" exists for those
# players and for a WebM or MKV whose picture is not H.264; it re-encodes,
# costs a generation, and is named as the second choice it is.
#

slug = "rotate-video"
name = "Video Rotator"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Rotate&nbsp;Video <span class=\"h1-kw\">&mdash; for the clip that was filmed sideways</span>"
tagline = "A quarter turn, a half turn, the other way. Written into the file's header, so not one frame is decoded and nothing is lost."
icon = "&#128260;"                  # the arrows going round, beside the page heading
favicon = "&#128260;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "rotate-cw"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "video"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works, chips
# the row of turns, checks the checkbox rows, and results carries the file
# name and size lines the other tools use.
css_parts = ["progress", "form", "chips", "checks", "notes", "results"]

# file-picker brings in the drop zone. mp4-reader is the demuxer the video
# tools ship and mkv-reader its Matroska twin, which imports it. mp4-writer
# and mp4-boxes write the result; aac opens and writes the AAC description;
# copy-tracks carries a track across as it is, reencode-video is the
# decode-draw-encode loop behind "bake it in", reencode-sound the streamed
# AAC re-encode for a sound an MP4 cannot carry - all three shared with the
# converter - and video-support, codec-support, webcodecs and frame-canvas
# are what they are built from. format is sizes and durations as words, and
# errors is the cancellation every page ignores by name.
#
# example-photo, example-video, example-audio, example-video-sound, mp4-muxer
# and wav are for the example alone: a clip with sound, built in the page,
# the same set the trimmer and the compressor ask for.
js_parts = ["file-picker", "mp4-reader", "mkv-reader", "mp4-writer", "mp4-boxes", "aac", "copy-tracks", "reencode-video", "reencode-sound", "video-support", "codec-support", "webcodecs", "frame-canvas", "message-box", "format", "errors", "example-photo", "example-video", "example-audio", "example-video-sound", "mp4-muxer", "wav"]
# Where a finished result can be carried without being saved first: the row
# of links shared/handoff.js shows under the result once there is one. A
# clip turned the right way up is then often cut, or made small enough to
# send.
handoff = ["trim-video", "compress-video"]
lastmod = "2026-09-13"

