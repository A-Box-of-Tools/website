# warning, the pledge line and the analytics comment, which is why they are a
# setting rather than three copies of the same word in three files.
[words]
plural = "profiles and the pictures of them"
# The boot warning reads "nothing will happen when you choose ...". The one
# control on this page that opens without any JavaScript is the photo
# picker, so naming it makes that sentence literally true rather than
# nearly so.
choose = "a cover photo"
analytics_extra = """, and not a
  character of what you type"""

