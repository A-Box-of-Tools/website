#
# Business Profile Preview
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The second tool here whose input is typed rather than dropped, after the QR
# generator, and the first whose subject is a page on somebody else's site. Two
# consequences worth writing down.
#
# It needs no [csp] table. The PNG is the page's own SVG painted onto a canvas
# through a blob: URL, and img-src already carries blob: on every tool page -
# see [tool_csp] in config/site.toml. The cover photograph is embedded as a
# data: URI this page's own canvas produced, so the finished picture has no
# reference to anywhere else in it and rasterises with the network unplugged.
#
# It names Google throughout, because the thing being previewed is a Google
# Business Profile and there is no way to say that without saying it. What the
# page must never do is imply that Google had anything to do with this one, so
# the FAQ says outright that it is unaffiliated and that the drawing is a
# drawing rather than a screenshot. That sentence is not decoration; it is the
# condition on which the rest of the page's language is honest.
#

slug = "business-profile-preview"
name = "Business Profile Preview"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Business Profile Preview <span class=\"h1-kw\">&mdash; see your Google listing before it goes live</span>"
tagline = "Type it, and it becomes the card Google would draw. Nothing is sent to draw it."
icon = "&#127978;"          # the mark beside the page heading
favicon = "&#127978;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "store"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "beyond"
# Shared stylesheet parts this tool asks for, put before its own rules by
# the build so that its own can override them.
css_parts = ["form", "checks", "notes", "chips"]
js_parts = ["download"]
lastmod = "2026-09-07"

# --- what search engines and chat apps are told ------------------------------

title = "Google Business Profile Preview &mdash; Free, No Sign-Up, Nothing Uploaded"
description = "See how your Google Business Profile will look before it goes live: the knowledge panel, the phone card and the search result, drawn from the name, category, hours, rating and photo you type. Import an existing listing by pasting it. Download as PNG or SVG. It all happens in your browser."
og_title = "Preview a Google Business Profile without giving anyone your details"
og_description = "The knowledge panel, the place card on a phone and the local search result, drawn in your own browser from what you type. Paste an existing listing to start from it. No account, no watermark, nothing uploaded."
og_image_alt = "Business Profile Preview - see your Google listing before it goes live"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
# Two lines is what the card has room for; the first draft ran to three and
# arrived with "machine." missing off the end.
og_card = "The knowledge panel, the phone card and the search result - drawn on your own machine."

# --- the pledge block --------------------------------------------------------

pledge = """
    Every field you type is drawn into a picture by about a thousand lines of
    JavaScript in this page that you can read, and there is no step in that
    which contacts anybody. Not to look your business up, not to check an
    address, not to draw a star. This tool has no network feature of any kind
    &mdash; which matters here because a business profile is a home address as
    often as it is a shopfront, and a telephone number that goes to somebody's
    own phone."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and type
      your address and phone number into the boxes. Not one request carries a
      character of them. Or unplug from the internet and make the whole mock-up
      anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/surfaces.js</code>
      for the three cards themselves &mdash; every coordinate in them is
      written out &mdash; <code>src/profile.js</code> for the one piece of
      arithmetic on the page, which is whether the place is open at this
      moment, and <code>src/parse-listing.js</code> for what happens to a
      listing you paste in."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to preview a Google Business Profile before it goes live"

# --- the card on the hub page ------------------------------------------------

card = """
            How your Google listing will look: the knowledge panel, the card on
            a phone, and the local search result. Paste an existing one to
