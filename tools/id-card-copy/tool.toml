[[privacy]]
title = "Processing happens in this browser."
body = "This tool processes input and results inside your browser. Its processing code does not upload them for processing. Content-Security-Policy restricts permitted resources and connection destinations, but allowed hosts can still receive requests: the policy does not inspect payloads and alone cannot prove that nothing is sent. Compare the source with the requests for the operation you use, or complete that local operation while disconnected."

[[privacy]]
title = "There is no model, so there is nothing to download."
body = """
 Finding the
      card is done with arithmetic &mdash; the gradient of the photo, a vote for
      the straight lines in it, and a check of what is under each side of the
      rectangle that wins. It is the document scanner's corner finder, shared
      with it: no weights, no inference runtime, nothing fetched on first use
      &mdash; see <code>src/shared/document-detect.js</code>."""

[[privacy]]
title = "The copy carries nothing from your photos but the card."
body = """
 Each side
      is redrawn from the pixels, so the location, the camera and the time a
      phone writes into a photo are not in the copy. The PDF records the name of
      this tool and nothing else: no date, no author, no machine name &mdash;
      see <code>src/document.js</code>."""

[[privacy]]
title = "The words across the card are in the picture, not on top of it."
body = """
 What
      you type is drawn into the pixels of each side before it is saved, so it
      cannot be lifted off the copy the way a layer or an annotation in a PDF
      can &mdash; see <code>src/card.js</code>."""

[[privacy]]
title = "Nothing here fetches anything, and it works offline."
body = """
 There
      is no <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>, and this page does
      not open <code>connect-src</code> for anything. Disconnect from the
      network and the tool is unchanged &mdash; the proof worth running before
      you photograph a passport."""

[[howto]]
title = "Photograph both sides."
body = """
 Lay the card on something darker
      or lighter than itself, hold the phone above it so the whole card is in
      the frame, and fill as much of the frame as you can. Tilt it a little if
      the light shines off the card: a reflection hides what is under it, and
      nothing afterwards can bring that back."""

[[howto]]
title = "Add the two photos."
body = """
 Drop both at once and the first is
      taken as the front, or use the button on each side. &ldquo;Swap front and
      back&rdquo; puts them the other way round."""

[[howto]]
title = "Check the corners."
body = """
 The card is found in each photo and
      outlined. Press anywhere on a photo and the nearest corner comes to your
      finger, or reach one with <kbd>Tab</kbd> and move it with the arrow keys.
      The turn buttons put a card the right way up."""

[[howto]]
title = "Lay out the copy."
body = """
 Choose the paper &mdash; A4, Letter,
      or no sheet at all for one picture of both sides &mdash; and whether the
      two sit one above the other or side by side. Type the purpose of the copy
      to have it written across the card, if you want it there."""

[[howto]]
title = "Save it, and print it at 100%."
body = """
 The PDF is the file to
      print: set the printer to &ldquo;actual size&rdquo; or 100%, not
      &ldquo;fit to page&rdquo;, and lay the card on the paper to check. A JPEG
      or PNG is for uploading or emailing."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head.

[[faq]]
q = "Are my ID card photos uploaded anywhere?"
a = """
        No. Both photos are decoded, straightened, laid out and written into the
        copy by your own browser on your own hardware. This tool has no network
        feature of any kind &mdash; it never fetches anything and never sends
        anything &mdash; and the page's <code>Content-Security-Policy</code> does
        not let it open a connection even to read its own result back. Load the
        page once, turn on airplane mode, and it still works."""

[[faq]]
q = "Will the card come out the right size when I print it?"
a = """
        Yes, if the printer is told to print at 100%. The PDF places each side
        at exactly the card's size &mdash; 85.6 by 53.98 millimetres for a
        bank-card sized card &mdash; in the file's own measurements, not by
        scaling a picture of a page. What makes copies come out small is the
        print dialog's &ldquo;fit to page&rdquo; or &ldquo;shrink to
        fit&rdquo;, which scales the whole sheet down a few per cent; choose
        &ldquo;actual size&rdquo; instead, and lay the card on the printed copy
        to check that the two match."""

[[faq]]
q = "Why does the card come out the right shape and not squashed?"
a = """
        Because the shape is not measured off the photo at all: it is the card's
        own. A card photographed at an angle looks shorter at the far end, and a
        tool that crops the rectangle it sees and stretches it into a box
        produces a card that is visibly squat or tall. Here the four corners are
        mapped through a perspective transform onto a rectangle of exactly the
        card's proportions, so every line that is straight on the card is
        straight on the copy and the card is its own shape whatever angle it was
        photographed from."""

[[faq]]
q = "What does &ldquo;words across the card&rdquo; do, and should I use it?"
a = """
        It writes whatever you type &mdash; usually what the copy is for and the
        date, like &ldquo;Copy for the tenancy at 12 Elm Street only,
        March 2027&rdquo; &mdash; in slanting, repeated rows across both sides,
        in the ink and strength you choose. It is drawn into the pixels before
        the file is saved, so it cannot be removed from the copy the way a note
        on top of a PDF can. A copy of an identity card that says what it was
        handed over for is much less use to anybody who wants to reuse it for
        something else, which is the advice some governments give for copies
        of identity documents. Keep it light enough that the card underneath
        can still be read."""

[[faq]]
q = "The corners it found are wrong. What now?"
a = """
        Drag them. The corners are a starting position, not a decision: each
        side is taken from wherever its four corners end up. Press anywhere on
        the photo and the nearest corner jumps to your finger, and the arrow
        keys move a focused corner one pixel at a time. The card is hardest to
        find on a surface of nearly its own colour, so a white card on a white
        desk is the usual reason &mdash; put it on something darker and take
        the photo again, or place the corners yourself. Cards have rounded
        corners: put each corner where its two straight edges would meet."""

[[faq]]
q = "Which cards does it work for?"
a = """
        Any card whose two sides are worth copying together. Nearly every
        identity card, driving licence, residence permit, health insurance card,
        student card and bank card is the same size &mdash; the ISO ID-1 size
        of a bank card &mdash; which is the default. The larger ID-2 size of
        some older identity cards is there too, and a passport's photo page
        (ID-3) can be put on a sheet on its own. Some licences are printed
        upright rather than across; turn that side with the turn buttons and it
        is laid out upright."""

[[faq]]
q = "Can I get one image of both sides instead of a page?"
a = """
        Yes. Choose &ldquo;No sheet &mdash; just the two sides&rdquo; as the
        paper and JPEG or PNG as the file, and the copy is one picture of the
        two sides with a narrow white border, which is what an online form that
        asks for both sides in one upload wants. The picture records its own
        resolution, so a program that prints by it prints the card at its real
        size; many simply fit a picture to the paper, which is why the PDF is
        the file for printing."""

[[faq]]
q = "The download does nothing. Why?"
a = """
        Usually because the page is open inside another app &mdash; a messaging
        app or a social network &mdash; whose built-in browser does not save
        downloads. Open the page in your phone's own browser instead and the
        same steps will save the file. It needs nothing from the network once
        it has loaded, so it works there offline too."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial, no limit on
        how many copies you make and no watermark of ours on them &mdash; the
        only words written across a card are the ones you type. The site
        carries advertising, which is what pays for it; the ads are not given
        anything about your card."""

