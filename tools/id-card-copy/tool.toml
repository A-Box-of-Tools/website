# The drop zone. Rendered by templates/partials/file-picker.html, which body.html
# includes, and driven by src/shared/file-picker.js. Several files are allowed
# so that both sides can be dropped at once; main.js uses the first two.
[picker]
accept = "image/*,image/avif,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif"
multiple = true
title = "Drop the photos of the front and back here"
hint = "or click to browse &mdash; front first, then back (JPEG, PNG, WebP, AVIF)"
