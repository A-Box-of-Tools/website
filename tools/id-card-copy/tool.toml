#
# ID Card Copy
#
# Two photographs of a card - the front and the back - straightened and put on
# one sheet at the card's real size, or into one picture for a form that asks
# for both sides together. It is the document scanner's job applied to a smaller
# rectangle and a fixed shape: the corner finder, the straightening and the
# corner handles are that tool's, shared through shared/js/, and what is this
# tool's own is that the shape is known (85.6 by 53.98 mm) rather than worked
# out, that there are two of them, and where they go on the paper.
#
# What people photograph for this is the single most sensitive thing anybody
# puts through a tool on this site, which is why it has no network feature at
# all, not even the carry-on row: connect-src stays shut.
#

slug = "id-card-copy"
name = "ID Card Copy"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "ID&nbsp;Card&nbsp;Copy <span class=\"h1-kw\">&mdash; front and back on one page</span>"
tagline = "Both sides of the card, on one sheet, at its real size."
icon = "&#129706;"          # the identification card, beside the heading
favicon = "&#129706;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons.
glyph = "id-card"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
roadmap_group = "documents"

css_parts = ["form", "checks", "notes", "corner-handles"]

# The corner finder, the straightening and the handles are the document
# scanner's, shared rather than copied. crc32 is for the pHYs chunk that tells a
# PNG's reader how many pixels make an inch; pdf-page-writer is the same writer
# the scanner and Images to PDF use. example-mark is the made-up emblem on the
# example card, and example-photo turns its canvases into files.
js_parts = ["document-detect", "document-geometry", "document-warp", "corner-handles", "file-picker", "image-input", "message-box", "pdf-page-writer", "crc32", "example-mark", "example-photo"]
# No carry-on row. It would need connect-src to read the finished file back out
# of a blob: URL, and this is the one tool on the site where keeping that
# directive shut is worth more than saving somebody a download.
handoff = []
lastmod = "2026-11-27"

