[[privacy]]
title = "You select the tab, then approve the viewer."
body = """
      The browser opens its own capture picker after you choose to start.
      Select a browser tab: this tool refuses a window or whole screen, and
      refuses capture when the browser cannot confirm that it is a tab.
      The first peer connection contains only an encrypted control channel.
      A viewer can add an introduction, you approve the request, and the viewer
      acknowledges that approval before a video track is added. Only one
      approved viewer can watch at a time, with up to four waiting requests.
      A note is self-chosen text, not verified identity; recognise the expected
      person and request before approving."""
[[privacy]]
title = "The viewer gets video, including anything visible in that tab."
body = """
      The stream includes the chosen tab's changing picture while you scroll,
      navigate or open content. That can include private account pages,
      messages and secrets you reveal there. The viewer receives neither your
      login cookies nor an interactive copy of the website. Their clicks and
      typing cannot operate your browser. Text in the video is not selectable.
      The tool requests no microphone or camera access and sends no audio.
      It has no recording feature, but a viewer can independently capture
      their screen or record received video. Ending the session cannot erase
      anything they already kept."""
[[privacy]]
title = "Pairing exposes setup metadata to the introduction service."
body = """
      Starting or connecting opens a WebSocket to
      <code>rendezvous.abox.tools</code>. The service sees the random room code,
      IP addresses, connection times, WebRTC descriptions and ICE candidates;
      these setup messages are not hidden from it. Video, viewer notes and
      approval decisions travel the encrypted peer connection. No room content
      is written to storage. Cloudflare, which runs the service, keeps
      connection logs for seven days containing request metadata such as the
      code, address and time, never video. Internet access is required for
      discovery and connection setup."""
[[privacy]]
title = "Nearby discovery is optional and lists only the invitation code."
body = """
      Show in nearby shared tabs is off by default. Check it
      before starting to publish the random room code; the setting stays
      fixed until you stop. A viewer chooses Find nearby tabs to open a
      discovery connection. The listing includes no captured tab title,
      address, picture or viewer note. Selecting a result only fills the
      invitation: Request to watch, host approval and the viewer's
      acknowledgement still come before video. The service groups this tool's
      pages by public IPv4 address or IPv6 /64 subnet and website origin.
      Shared carrier gateways or VPNs can include strangers, while different
      routes can hide nearby devices. This is a network hint, not a Wi-Fi scan
      or proof of proximity. Listings live on open connections without stored
      history; stopping the host withdraws its listing."""
[[privacy]]
title = "Video requires a reachable local connection, with no relay."
body = """
      The browsers configure no public STUN server or TURN relay. Only host
      connection addresses are accepted in setup descriptions and candidate
      messages. Pairing exposes network addresses to the other browser before
      video approval. Use a reachable Wi-Fi, Ethernet or hotspot network;
      guest isolation, firewalls, VPN routes and browser local-network
      permissions can prevent a connection. Host addresses can include public
      interfaces or follow a VPN route, so this setting does not prove that
      traffic stays inside a physical building. The tool does not create a
      hotspot, Wi-Fi Direct or Bluetooth connection."""
[[privacy]]
title = "Stop ends capture; returning does not grant a new capture."
body = """
      Stop sharing releases the captured track and closes this session.
      The browser's own Stop sharing control, closing the captured tab, or
      closing this sharing page also ends the source. Hiding this sharing
      page keeps healthy capture where the browser permits, so you can work
      in the selected tab. Sleep or browser suspension can interrupt it.
      An ended track is never captured again automatically: starting again
      requires another click and the browser's picker. A viewer disconnection
      releases that viewer without granting a new request access."""
[[privacy]]
title = "Invitations are visible to page scripts."
body = """
      A session uses a fresh random link. Possessing it permits a connection attempt,
      and approval still controls the video. This page has the site's usual
      Google advertising and measurement scripts and Buy Me a Coffee button.
      The tool does not deliberately pass video or viewer notes to them, but
      scripts running in the page can read its address and same-page state,
      including a link code. A URL fragment is not a secret from page scripts
      or a guarantee against browser history. Treat the expected person's
      request and your approval as the admission step."""

[[howto]]
title = "Open the website and this sharing tool on your computer."
body = "Keep the website in its own tab. Use a desktop browser that supports browser-tab capture, such as Chrome or Edge, and open this tool at its HTTPS address. The viewer needs only a browser with WebRTC video playback."
[[howto]]
title = "Connect the devices to the same local network."
body = "Use a reachable local network such as home Wi-Fi or Ethernet, and keep internet access available on both devices for discovery and pairing. Optionally check Show in nearby shared tabs before starting. A phone hotspot can work if it permits direct connections, but is not guaranteed."
[[howto]]
title = "Choose one browser tab."
body = "Click Choose a tab to share, then select the website tab in the browser's picker. A window or whole screen is refused. No audio is requested. Check the local preview before inviting anyone."
[[howto]]
title = "Exchange the invitation, then approve the viewer."
body = "Copy the viewer link, or have the viewer choose Find nearby tabs and select your code if you opted into discovery. They optionally add a note and choose Request to watch. Approve the request you recognise before any video is sent."
[[howto]]
title = "Browse in the selected tab, then end the session."
body = "The viewer watches your scrolling and navigation as live video, without controlling the page or selecting its text. Keep both host tabs open and the device awake. Stop sharing here or in the browser when finished. If capture ends, starting again requires a new picker choice and a fresh invitation."

[[faq]]
q = "Do I need a Chrome extension?"
a = "No. A supporting desktop browser supplies its own tab-capture picker after you click Choose a tab to share. The tool uses that capture stream and WebRTC. Browser-tab capture support varies; Chrome and Edge on a computer are the intended hosts. The viewer needs no extension either."
[[faq]]
q = "Can the viewer click my website or copy its text?"
a = "They receive live video, not an interactive webpage. Their clicks and typing cannot operate your browser, and text in the video is not selectable. They can take screenshots, record their own view or use their own text-recognition tools. For copyable text or files, use Share Text &amp; Files instead."
[[faq]]
q = "Can I share a window, screen, camera or sound?"
a = "This version accepts one browser tab only. It refuses window and whole-screen selections and does not request microphone or camera access. It sends no tab audio. Choose a tab in the browser's own picker; if your browser cannot confirm tab capture, this tool cannot host there."
[[faq]]
q = "Does the viewer need an account on the website I show?"
a = "No. They see the pixels your browser can show, including content in your logged-in account, without receiving your cookies or login session. That also means private information visible in the chosen tab becomes visible to the approved viewer. Some protected content may appear black or be unavailable for capture."
[[faq]]
q = "Can anyone with the link watch?"
a = "A viewer link permits a connection request and network-address exchange. You must approve the viewer before video is sent, and their browser must acknowledge the approval. Their introduction is not verified identity. Invitations are fresh for each session. Nearby listing is off by default; opting in publishes the random invitation code, without the tab's title, address or picture."
[[faq]]
q = "Can the other device find my tab without a link?"
a = "Yes. Check Show in nearby shared tabs before choosing the tab. The viewer chooses Find nearby tabs, selects your random code, then chooses Request to watch. Selection alone does not request a connection or grant video. Nearby discovery groups this tool's pages by public IPv4 address or IPv6 /64 subnet and website origin, not physical location. VPNs and shared carrier gateways can include strangers or hide nearby devices. Use the copied link if the listing is missing."
[[faq]]
q = "Can several viewers watch together?"
a = "One approved viewer can watch at a time, with up to four waiting requests. A waiting or refused viewer receives no video."
[[faq]]
q = "Is the video uploaded or recorded on a server?"
a = "The tool makes no recording and stores no video on a server. Video travels directly between the browsers over an encrypted connection, without an internet relay. Internet introductions carry setup metadata, never video. A viewer can independently record what reaches their device."
[[faq]]
q = "What does the connection service learn?"
a = "The rendezvous sees the code, IP addresses, connection times and WebRTC setup descriptions and host candidates. If the host opts into discovery, its network group can see the random room code, never the captured tab's title, address or picture. Cloudflare retains request metadata for seven days. Pairing shares connection addresses with the other browser and uses no public STUN or TURN service. Viewer notes and approval controls use the encrypted peer channel. The tool page explains its usual third-party scripts separately."
[[faq]]
q = "Can I share without an internet connection?"
a = "Internet access is required on both devices to discover and introduce the browsers. Video then uses a separate direct connection; an established view may continue through a brief internet interruption while that direct connection survives, but this is not guaranteed. New viewers and reconnection need the introduction service. The page's saved browser cache does not provide an alternative pairing method."
[[faq]]
q = "Does being on the same Wi-Fi or hotspot guarantee a connection?"
a = "No. Guest networks or hotspot client isolation can prevent devices from reaching each other. Firewalls, VPN routes and browser local-network permissions can also block it. Both browsers accept only host connection addresses; that controls address types, not a physical building or the routes your device chooses. There is no internet relay fallback."
[[faq]]
q = "Will switching tabs reveal another tab?"
a = "The capture belongs to the browser tab you selected; simply activating another tab does not choose a new source. Changes and navigation inside the selected tab remain visible. Use the browser's capture indicator to check the source, and stop the session before showing anything private."
[[faq]]
q = "Can I hide the sharing page or close my laptop?"
a = "You can work in the selected website tab while the sharing page remains open. Healthy capture is kept when the page is hidden where the browser permits. A sleeping computer, closed laptop or suspended browser may interrupt or end it. Returning never silently starts a new capture after the track ends; start again and choose the tab again."
[[faq]]
q = "What if the connection fails?"
a = "Keep both pages open, keep internet access available for pairing, and check that the devices can reach each other on the local network. Check client isolation, firewalls, VPN routes and browser local-network permissions. Use the viewer link if nearby discovery misses the host. If the session has ended, start again, choose the tab and share its fresh invitation. Starting again requires your action; the tool does not silently capture a tab or fall back to an internet relay."

