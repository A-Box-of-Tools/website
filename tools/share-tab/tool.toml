title = "Share a Browser Tab Live &mdash; Read-Only Viewing, No Extension"
description = "Stream one browser tab to an approved viewer over encrypted WebRTC. No extension, audio or remote control. Direct connection first, optional relay retry."
og_title = "Show a browser tab, keep control of it"
og_description = "Choose one tab, invite a viewer and approve their request. They watch live video in their browser while you browse. No extension or remote control."
og_image_alt = "Share a Browser Tab - a live view for one approved viewer"
og_card = "One tab, one approved viewer, a live view you control."
csp_note = """
  Choosing a tab to share and requesting to watch open a WebSocket to rendezvous.abox.tools using
  the separate share-tab room namespace. It carries WebRTC descriptions,
  candidates and optional TURN credentials, never video or viewer notes.
  This tool does not use discovery. STUN discovers connection addresses in
  the ordinary direct attempt. If that attempt fails, the viewer can
  explicitly retry through Cloudflare's TURN relay, which forwards encrypted
  traffic without media keys. WebRTC media, STUN and TURN are outside CSP's
  connect-src vocabulary. Video is added only after host approval and the
