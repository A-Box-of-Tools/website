# Sharing a tab is an intentional network feature, not local file processing.
# The host must choose one browser tab after a click, and must approve the
# viewer over an encrypted control channel before a video track is attached.
# A window or whole-screen capture is refused, even when a browser offers it.
# Both methods use host-only ICE, with no public STUN service or TURN relay.
# Online pairing uses the rendezvous for setup metadata and opt-in code-only
# nearby discovery. Offline pairing
# exchanges complete connection blocks without opening a signaling socket.
slug = "share-tab"
name = "Share a Browser Tab"
heading = "Share a browser tab <span class=\"h1-kw\">&mdash; a live view, with you in control</span>"
tagline = "Choose a tab on your computer and let one approved viewer watch it on your local network. Pair online or exchange connection blocks offline. No extension, sound or remote control."
icon = "&#128421;"
favicon = "&#128421;"
glyph = "app-window"
category = "connect-devices"
roadmap_group = "video"
css_parts = ["form", "notes", "paired-tools"]
js_parts = ["peer-pairing", "peer-endpoint", "peer-network", "peer-discovery", "room-names", "clipboard-feedback"]
lastmod = "2026-10-15"

title = "Share a Browser Tab Live &mdash; Read-Only Viewing, No Extension"
description = "Share a browser tab with one approved viewer on your local network. Online invitations or offline pairing. No extension, audio or remote control."
og_title = "Show a browser tab, keep control of it"
og_description = "Share one tab with an approved viewer on reachable Wi-Fi, Ethernet or a hotspot. Use an online invitation or exchange connection blocks without internet."
og_image_alt = "Share a Browser Tab - a live view for one approved viewer"
og_card = "One tab, one approved viewer, a live view you control."
csp_note = """
  Local builds and HTTPS abox-preview.pages.dev previews use the separate
  rendezvous-dev.abox.tools service; other page addresses use production.
  Online pairing opens a WebSocket to rendezvous.abox.tools in the separate
  share-tab room namespace. It carries WebRTC descriptions and host
  candidates, never video or viewer notes. Opt-in online discovery uses a
  separate socket and lists only the random room code, without the captured
  tab's title, URL or pixels. A viewer explicitly opens the nearby list;
  selecting a result only fills the invitation. Offline pairing exchanges
  connection blocks manually and opens no rendezvous socket. Both methods
  configure no STUN server or TURN relay and reject non-host candidates in
  descriptions and trickled messages. Offline pairing uses no discovery.
  WebRTC media is outside CSP's connect-src vocabulary. Video is added only
  after host approval and the viewer's encrypted acknowledgement. There is
  no audio or remote control."""
pledge = """
    You choose a browser tab in your browser's own picker and approve the
    viewer before video is sent. The viewer receives an encrypted live
    picture of that tab over a direct connection on a reachable local network,
    without control of your browser. Online pairing uses an introduction
    service that sees setup metadata, never video or the viewer note. You can
    opt into listing the random invitation code for nearby discovery before
    starting; the tab's title, address and picture are not listed.
    Offline pairing exchanges connection blocks instead and needs no
    introduction service. Neither method uses public address discovery or an
    internet relay. No recording is made by this tool. A viewer can still
    capture what they see. Stop sharing, end capture in the browser, or close
    this sharing page to end the session."""
pledge_line = "Tab video goes <strong>directly to one viewer you approve</strong>. Pair online or exchange connection blocks offline on a reachable local network."
md_note = "Live tab video on a reachable local network, with mandatory approval. Online introductions carry setup metadata; offline block exchange needs the cached HTTPS tool on both devices. No public STUN, internet relay, audio, extension, recording feature or remote control."
live_hint = """
      In Online mode, DevTools shows a rendezvous WebSocket for introduction
