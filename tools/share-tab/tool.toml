description = "Share a browser tab with one approved viewer on your local network. Invite by link or nearby discovery. No extension, audio or remote control."
og_title = "Show a browser tab, keep control of it"
og_description = "Share one tab with an approved viewer on a reachable local network. Internet introduces the browsers; live video travels directly between them."
