# Sharing a tab is an intentional network feature, not local file processing.
# The host must choose one browser tab after a click, and must approve the
# viewer over an encrypted control channel before a video track is attached.
# A window or whole-screen capture is refused, even when a browser offers it.
# The rendezvous carries setup metadata, never video; an explicit viewer
# retry can use the existing TURN relay when a direct connection fails.
