# Sharing a tab is an intentional network feature, not local file processing.
# The host must choose one browser tab after a click, and must approve the
# viewer over an encrypted control channel before a video track is attached.
# A window or whole-screen capture is refused, even when a browser offers it.
# Pairing uses the rendezvous for setup metadata and opt-in code-only
# discovery. Direct is the default; Cloud relay is an explicit session choice.
slug = "share-tab"
name = "Share a Browser Tab"
heading = "Share a browser tab <span class=\"h1-kw\">&mdash; a live view, with you in control</span>"
tagline = "Choose a tab on your computer and let one approved viewer watch it using Direct or Cloud relay. Invite by link, network discovery or a private group. No extension, sound or remote control."
icon = "&#128421;"
favicon = "&#128421;"
glyph = "app-window"
category = "connect-devices"
roadmap_group = "video"
css_parts = ["form", "notes", "paired-tools"]
js_parts = ["peer-pairing", "peer-endpoint", "peer-network", "peer-transport", "peer-transport-ui", "peer-discovery", "discovery-group", "peer-discovery-ui", "peer-approval-ui", "room-names", "clipboard-feedback"]
supports_relay = true
lastmod = "2026-10-17"

title = "Share a Browser Tab Live &mdash; Read-Only Viewing, No Extension"
description = "Share a browser tab with one approved viewer using Direct or optional Cloud relay. Invite by link, network discovery or a private group. No extension, audio or remote control."
og_title = "Show a browser tab, keep control of it"
og_description = "Share one tab with an approved viewer. Direct is the default; optional Cloud relay forwards encrypted live video. Internet introduces the browsers."
og_image_alt = "Share a Browser Tab - a live view for one approved viewer"
og_card = "One tab, one approved viewer, a live view you control."
csp_note = """
  Local builds and HTTPS abox-preview.pages.dev previews use the separate
  rendezvous-dev.abox.tools service; other page addresses use production.
  Pairing opens a WebSocket to rendezvous.abox.tools in the separate
  share-tab room namespace. It carries WebRTC descriptions, candidates and short-lived
  relay credentials, never video or viewer notes. Opt-in discovery uses a
  separate socket and lists only the random room code, without the captured
  tab's title, URL or pixels. A viewer explicitly opens Available connections;
  private groups exchange their code over that socket and scope host publication
  by a derived identifier, with no group information in viewer links.
  Join on a result starts a viewing request using its displayed route. Direct configures no STUN or TURN
  and accepts only host candidates. Explicit Cloud relay forces relay-only ICE with
  short-lived TURN credentials and accepts only relay candidates. There is no automatic
  fallback. Discovery and pairing require internet access.
  WebRTC media is outside CSP's connect-src vocabulary. Video is added only
  after host approval and the viewer's encrypted acknowledgement. There is
  no audio or remote control."""
pledge = """
    You choose a browser tab in your browser's own picker and approve the
    viewer before video is sent. The viewer receives an encrypted live
    picture of that tab over Direct on a reachable local network or an explicitly selected Cloud relay,
    without control of your browser. Pairing uses an internet introduction
    service that sees setup metadata, never video or the viewer note. You can
    opt into listing the random invitation code for network or private-group discovery before
    starting; its connection mode is listed too, but the tab's title, address and picture are not.
    The relay forwards encrypted traffic and sees connection addresses, timing and volume,
    not decrypted video. Direct never falls back to the relay. No recording is
    made by this tool. A viewer can still
    capture what they see. Stop sharing, end capture in the browser, or close
    this sharing page to end the session."""
pledge_line = "Tab video is <strong>encrypted for one viewer you approve</strong>. Direct is the default; Cloud relay is optional. Internet introduces the browsers."
md_note = "Encrypted live tab video with mandatory approval, Direct by default or explicit Cloud relay. Internet introductions carry setup metadata, never video. The relay forwards encrypted traffic and sees connection metadata. No audio, extension, recording feature or remote control."
live_hint = """
