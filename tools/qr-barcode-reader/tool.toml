#
# QR & Barcode Reader
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The other half of /qr-barcode/. That page turns a string into a picture; this
# one turns a picture back into a string, which is a considerably larger job -
# finding a symbol in a photograph, correcting for the angle it was taken at
# and repairing the damage are three problems the generator does not have.
#
# It is also the first tool here that asks the browser for anything: the
# camera. What that does and does not mean is written out in src/camera.js and
# said again in the pledge below, because "this page uses your camera" is the
# one sentence on this site that sounds like the opposite of the promise.
#

slug = "qr-barcode-reader"
name = "QR & Barcode Reader"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "QR&nbsp;&amp;&nbsp;Barcode Reader <span class=\"h1-kw\">&mdash; scan a QR code from an image or your camera</span>"
tagline = "Point it at a code, or drop a picture of one. It is read here, and nowhere else."
icon = "&#128269;"          # the mark beside the page heading
favicon = "&#128269;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "scan-line"
category = "text-codes-and-passwords"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
roadmap_group = "beyond"
lastmod = "2026-08-23"

# The drop zone brings in shared/js/file-picker.js. Several files at once is
# deliberate: a folder of screenshots, or a photograph of a page of codes, is a
# real thing people have, and reading them one at a time is the annoying way.
js_parts = ["file-picker"]

# --- what search engines and chat apps are told ------------------------------

title = "QR Code Reader &amp; Barcode Scanner &mdash; From an Image, Nothing Uploaded"
description = "Read a QR code from a photo, a screenshot or your camera, and see exactly where the link goes before you open it. EAN, UPC, Code 128, Code 39 and ITF barcodes too. Nothing is uploaded."
og_title = "Read a QR code without sending the picture to anyone"
og_description = "Scan a QR code from an image or your camera and see the whole address before you decide to open it. The picture never leaves your machine, and no camera frame is ever recorded."
og_image_alt = "QR & Barcode Reader - scan a code from an image or camera, nothing uploaded"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Read a QR code from a picture or your camera - and see where it goes before you go there."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  The camera needs nothing added to it: a MediaStream handed to a &lt;video&gt;
  through srcObject is not a fetch, so no directive governs it and none has
  been widened for it. img-src needs blob: for the one decoding path that goes
  through an &lt;img&gt; rather than createImageBitmap, and https: because ad
  creatives come from anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    Reading a code is arithmetic over pixels, and the pixels are already here.
    Finding the symbol, correcting for the angle, undoing the mask, repairing
    the damage with Reed-Solomon and reading the bits back out all happen in
    about two thousand lines of JavaScript in this page that you can read.
    <strong>The camera is the same promise, not an exception to it:</strong> a
    frame arrives as pixels in this tab, is examined, and is gone. Nothing is
    recorded, nothing is kept, and this page has no network feature of any kind
    to send one with."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and
      scan a code with the camera running. Not one request carries a frame or a
      character of what it said. Or unplug from the internet and read the code
      anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/binarize.js</code>
      and <code>src/detect.js</code> for finding a symbol in a photograph
      &mdash; the threshold, the finder patterns and the perspective transform
      &mdash; <code>src/qr-decode.js</code> for reading it back,
      <code>src/reed-solomon.js</code> for repairing what was misread,
      <code>src/linear.js</code> for the striped ones, and
      <code>src/camera.js</code>, which is every line in this page that touches
      a camera."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to read a QR code without uploading the picture"

# --- the card on the hub page ------------------------------------------------

card = """
            Read a QR code from a photo, a screenshot or your camera &mdash; and
            see the whole address before you open it. Barcodes too."""

[picker]
accept = "image/*"
multiple = true
title = "Drop a picture of a code here"
hint = "or click to browse &mdash; a photograph, a screenshot, a PNG, anything your browser can open"

# The nouns this tool uses for the things it works on. They appear in the boot
# warning, the pledge line and the analytics comment, which is why they are a
# setting rather than three copies of the same word in three files.
[words]
plural = "pictures and the codes in them"
choose = "the picture to read"
analytics_extra = """, and not a
  character of what a code turned out to say"""

