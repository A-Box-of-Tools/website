[[privacy]]
title = "What you paste has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that a pasted
      config could be collected at, and nothing in the code that would send it
      if there were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. Both parsers and
      both printers are functions in this page that take a string and return a
      string."""

[[privacy]]
title = "It reads YAML 1.2, so Norway is still Norway."
body = """
 In YAML 1.1,
      <code>no</code> was a boolean, which is the famous bug that turns the
      country code for Norway into <code>false</code>. This reads 1.2, where it
      is the string it looks like. Going the other way those words are written
      back <em>quoted</em>, because whatever opens the file next may still be a
      1.1 reader. <code>tests/js/text-convert.test.js</code> checks both
      halves."""

[[privacy]]
title = "A conversion that cannot be honest stops instead."
body = """
 An
      anchor, an alias or a tag in the YAML ends the conversion with a message
      saying which line it is on, rather than a JSON document that quietly
      means something else. JSON has no way to say &ldquo;the same node
      twice&rdquo;, and picking an interpretation would be choosing for
      you."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed a character of your text. Every line that
      reads, parses or writes it is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

