description = "Convert YAML to JSON and JSON to YAML in the browser. Reads YAML 1.2, keeps the order of keys and the exact digits of every number, and says what each direction loses. Nothing is uploaded."
features = [
  "Converts YAML to JSON and JSON to YAML",
  "Reads YAML 1.2, so yes and no stay strings",
  "Keeps the order of keys and the exact digits of every number",
  "Refuses anchors, aliases and tags rather than guessing what they meant",
  "Says which line and column an error is on, in words",
  "Works on a dropped file as well as on a paste",
  "Runs offline; no upload, no account",
]

