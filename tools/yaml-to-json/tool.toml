title = "Pick the direction."
body = """
 <em>YAML to JSON</em> or <em>JSON to
      YAML</em>. The note under the menu says what that direction loses before
      you paste anything, rather than after."""

[[howto]]
title = "Paste it in, or drop the file."
body = """
 Anything you can select and copy
      works. A file dropped on the picker is read by your own browser and put in
      the box &mdash; there is no upload step to leave out &mdash; and a
      <code>.json</code> or <code>.yaml</code> extension sets the direction for
      you."""

[[howto]]
title = "Choose the indentation."
body = """
 Two spaces, four, or a tab. The tab
      is offered for JSON only: YAML is defined in terms of spaces, and a tab
      is not legal indentation in it."""

[[howto]]
title = "Read the error where the error is."
body = """
 A parser that fails here says what
      it found and on which line and column, rather than &ldquo;unexpected
      token at position 4193&rdquo;. That is usually enough to fix a config file
      without opening anything else."""

[[howto]]
title = "Take the result."
body = """
 Copy it, or download it as a file,
      named for the format it came out in."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my YAML uploaded anywhere?"
a = """
        No. Both parsers and both printers on this page are functions that run
        in your own browser, on your own hardware. This tool has no network
        feature of any kind &mdash; it never fetches anything and never sends
        anything &mdash; and the page's <code>Content-Security-Policy</code>
        names every address it may contact, none of which belongs to this site.
        That is the reason to use it for a deployment config: those are full of
        hostnames, bucket names and occasionally a secret somebody meant to
        move, and pasting one into somebody else's converter is giving it to
        them."""

[[faq]]
q = "What does converting YAML to JSON lose?"
a = """
        Comments, because JSON has nowhere to put one. Anchors, aliases and tags
        are refused outright rather than guessed at &mdash; each of them says
        something JSON cannot say, and a converter that quietly picked an
        interpretation would hand you a document that is not what the file said.
        The other direction loses nothing: every JSON document is already a YAML
        document."""

[[faq]]
q = "My YAML says no and the JSON came out as a string. Why?"
a = """
        Because it is a string, and this reads YAML 1.2 rather than 1.1. In YAML
        1.1, <code>yes</code>, <code>no</code>, <code>on</code> and
        <code>off</code> were booleans, which is the famous bug that turns the
        country code for Norway into <code>false</code>. YAML 1.2 dropped that
        and so does this: only <code>true</code>, <code>false</code>,
        <code>null</code> and <code>~</code> are read as anything but text.
        Going the other way, those words are written back <em>quoted</em>, even
        though this would read them as text without the quotes &mdash; because
        whatever opens the file next may not. PyYAML still defaults to 1.1.
        Reading strictly and writing conservatively is the only combination
        that is right either way."""

[[faq]]
q = "Does it keep the order of my keys?"
a = """
        Yes, in both directions, and that is harder than it sounds. A converter
        built on <code>JSON.parse</code> silently moves integer-like keys to the
        front, so <code>{"10":a,"2":b}</code> comes back as
        <code>{"2":b,"10":a}</code>. Numbers keep the digits you typed, so a
        twenty-digit account id does not lose its last three to a double. If you
        <em>want</em> them sorted there is a checkbox, and it sorts by how the
        keys read rather than by their code points."""

[[faq]]
q = "Can it convert several YAML documents at once?"
a = """
        No, and it says so rather than picking one. A file with
        <code>---</code> separators holds more than one document, and JSON has
        no shape that means &ldquo;several documents&rdquo; &mdash; an array
        would be a claim the file never made. Convert them one at a time."""

[[faq]]
q = "Why is there no YAML formatter here?"
a = """
        Because YAML has no squeezed form worth writing &mdash; the short one is
        flow style, which is unreadable, and unreadable is the opposite of the
        reason to keep a file in YAML. Laying out JSON, XML, HTML and CSS is
        <a href="../json-formatter/">the JSON formatter</a>'s job, and it lays
        out YAML too."""

[[faq]]
q = "How big a file can it handle?"
a = """
        There is no limit set here, because there is no server paying for one.
        The practical ceiling is your own machine: a few megabytes of YAML is
        fine, and the page waits for a pause in your typing before it converts
        a very long document rather than fighting you for the keyboard."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no limit on
        how much you paste. The site carries advertising, which is what pays for
        it; the ads are not given anything about your text."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your config away to be converted would stop
        the moment you unplugged."""

