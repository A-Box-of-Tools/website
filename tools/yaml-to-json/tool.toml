#
# YAML to JSON Converter
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# WHY THIS IS NOT A TAB ON json-formatter
#
# It was one, and that was the problem. "yaml to json" is the phrase people
# type, and a page whose address, heading and title all say "JSON Formatter"
# cannot answer it - the conversion was real, worked well and was invisible,
# four clicks behind a tab strip on a page named after something else. A tool
# is found at the address that says what it does, and this one does.
#
# What is here is the conversion and only the conversion, both ways. Formatting
# JSON is still json-formatter's job and this page does not duplicate it; the
# two link to each other.
#
# THE PARSERS ARE SHARED PARTS, AND ONLY THE ONES THIS PAGE READS
#
# The JSON parser, the YAML parser and the error they throw are
# shared/js/parse-json.js, parse-yaml.js and parse-errors.js, asked for in
# js_parts below and copied into this tool at src/shared/ by the build - the
# same files json-formatter ships. They were byte-for-byte copies until the
# JavaScript tests could follow a ./shared/ import. parse-xml is deliberately
# NOT asked for: this page never mentions XML, and tests/js/yaml-to-json.test.js
# fails if it ever ships the three hundred lines of parser for it.
# src/convert.js stays this tool's own for the same reason - json-formatter's
# carries the XML pair too.
#

slug = "yaml-to-json"
name = "YAML to JSON Converter"
# The trailing span is the other direction. The product name stays the loud
# half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "YAML&nbsp;to&nbsp;JSON <span class=\"h1-kw\">&mdash; and JSON back to YAML</span>"
tagline = "Both directions, and it says what each one costs. Nothing is pasted into anyone else's server."
icon = "&#128260;"          # the mark beside the page heading
favicon = "&#128260;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
#
# Shared with heic-to-jpg, which is the only other tool on the site whose whole
# job is turning one format into another. The mark means the same thing on both
# and there is no Lucide icon for "YAML" to prefer over it.
glyph = "arrow-right-left"
category = "text-codes-and-passwords"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "beyond"

# Shared stylesheet parts this tool asks for, put before its own rules by
# the build so that its own can override them.
css_parts = ["form", "panes", "checks", "notes"]

# Shared modules this tool asks for. file-picker brings in the drop zone, which
# is here for the config file that is easier to drop than to open, select all
# and copy.
js_parts = ["file-picker", "parse-errors", "parse-json", "parse-yaml", "message-box", "download", "format"]
lastmod = "2026-09-02"

