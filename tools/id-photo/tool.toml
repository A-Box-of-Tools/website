#
# ID Photo Maker
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "id-photo"
name = "ID Photo Maker"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "ID&nbsp;Photo Maker <span class=\"h1-kw\">&mdash; passport and visa photos to spec</span>"
tagline = "Pick the country. It applies that country's rule, exactly."
icon = "&#128706;"          # the mark beside the page heading
favicon = "&#128706;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "scan-face"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
roadmap_group = "images"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress", "form"]

# Shared modules this tool asks for. file-picker brings in the drop zone.
js_parts = ["file-picker", "message-box"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Passport Photo Maker &mdash; Every Country's Size, No Upload"
description = "Make a passport or visa photo to your country's published rule: exact mm and DPI, a live head-height and eye-line overlay, a background check, a printable 4x6 sheet, and a file squeezed to the portal's KB limit. Nothing is uploaded."
og_title = "Make a passport photo to your country's exact rule, without uploading it"
og_description = "Pick a country and a document and the crop box takes that rule's head height and eye line. Prints at the mandated size and DPI, and writes the upload file inside the KB band the form insists on."
og_image_alt = "ID Photo Maker - passport and visa photos to spec, without uploading"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Pick a country and a document, and it applies that rule exactly - on your own machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  img-src needs blob: for the preview, the crop and the finished files this page
  draws from the photograph you chose, and https: because ad creatives come from
  anywhere."""

# --- the pledge block --------------------------------------------------------

pledge = """
    The cropping, the measuring, the background reading and the printing all run
    in your own browser, on your own hardware, using the JPEG encoder it already
    ships with. This tool has no network feature of any kind &mdash; nothing to
    fetch, nothing to send &mdash; and there is no server on the other end of this
    page to send a photograph of your face to even if there were."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and make a
      passport photo. Not one request carries a picture, a thumbnail, a filename,
      or a byte of what you chose. Or unplug from the internet and make one anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/specs.js</code> for the rulebook &mdash;
      every country's published figures, with the authority and the date each one
      was read &mdash; <code>src/detect.js</code> for how the four
      points are found &mdash; an outline and two dark patches, with no model in
      it anywhere &mdash; <code>src/geometry.js</code> for the arithmetic that turns
      those four points into a crop, and <code>src/jpeg.js</code> for the two
      header edits that put the print resolution into the file and bring a
      too-small upload up to the size a form insists on."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to make a passport photo that is not sent back"

# --- the card on the hub page ------------------------------------------------

card = """
            Pick a country and a document, and the crop box takes that rule's
            head height and eye line. Prints at the exact mm and DPI, with a
            4&nbsp;&times;&nbsp;6 sheet, and squeezes the upload into the
            portal's KB band."""

