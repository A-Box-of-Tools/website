[[privacy]]
title = "A photograph of your face never leaves this machine."
body = """
 That matters more
      here than on most tools: the file this page handles is a picture of your
      face, and the thing you are about to do with it names the country whose
      document you are applying for. The
      <code>Content-Security-Policy</code> names every address this page may
      contact, and not one of them belongs to this site. There is no endpoint
      here your photograph could be collected at."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. The rulebook is a
      table in <code>src/specs.js</code>, served with the page and cached with
      it &mdash; there is no country list to look up and nothing to check your
      photo against remotely."""

[[privacy]]
title = "The face is found without a face model."
body = """
 There are no weights
      to download, no inference runtime and nothing fetched: the crown comes
      from the outline of your head against the wall behind it, the pupils from
      the patches of the face that are darker than what surrounds them. Nothing
      in it reads skin colour, which is the whole reason it is written that way
      &mdash; a model that is wrong is wrong unevenly, worse on some faces than on
      others. It is a starting position rather than a verdict: the page says
      which of the four points it could not measure, every dot stays draggable,
      and switching to <em>I&rsquo;ll place them</em> turns it off entirely."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed anything about your photograph, your face,
      or which country's rule you picked. Every line that reads, crops, measures
      or writes a file is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Choose the photograph."
body = """
 A phone picture against a plain wall, in
      daylight, taken from about a metre and a half away. It is read straight off
      your disk by the browser; nothing is sent anywhere while you do it."""

[[howto]]
title = "Pick the country and the document."
body = """
 The panel then shows
      that rule's print size, head-height band, eye line, background colour and
      upload limits &mdash; along with the authority each figure came from and the
      date it was read. Nothing on that list is guessed at, and anything you were
      sent that is not on it goes in under &ldquo;Anywhere else&rdquo;."""

[[howto]]
title = "Check the four dots on your face."
body = """
 Crown, chin, and each
      pupil &mdash; those four points are the whole of what the rule measures. They
      are placed by measuring the picture itself, and the line under them says
      which of the four that managed and which it had to work out; drag any that
      landed wrong, or switch to <em>I&rsquo;ll place them</em> and do all four
      yourself. Then press <em>Fit the box</em> and the crop lands where that
      country wants it."""

[[howto]]
title = "Read the four checks, and the background."
body = """
 Head height, eye
      line, centring and tilt, each measured from the box as it stands and each
      saying which way to drag if it is out. The background is read from the top
      and the sides of the crop and compared with the colour the rule asks for
      &mdash; unevenness, which is what actually gets photos rejected, is measured
      separately from colour."""

[[howto]]
title = "Take the three files."
body = """
 The print, at the exact millimetres
      with the resolution written into the file so a shop prints it at the right
      size. The sheet, with as many copies as a 4&nbsp;&times;&nbsp;6 holds and
      cut marks in the gaps. And the upload, at the pixel size the portal demands
      and inside the KB band it enforces at both ends."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree.

[[faq]]
q = "Is my photo uploaded anywhere?"
a = """
        No. The picture is decoded, cropped, measured and written by your own
        browser on your own hardware, using the JPEG encoder the browser already
        ships with. This tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site. That is worth more here than on most
        tools: the file is a photograph of your face."""

[[faq]]
q = "Which countries are covered?"
a = """
        The specifications transcribed so far are the ICAO standard itself, the
        United States (passport and the Diversity Visa entry, which have different
        upload rules), the United Kingdom, the Schengen visa, Germany, Canada,
        Australia, India (passport, the 35&nbsp;&times;&nbsp;45&nbsp;mm print, and
        the SSC/UPSC form photo and signature), China and Japan. Every entry names
        the authority it came from and the date it was read. Anything else goes in
        under &ldquo;Anywhere else&rdquo;, where every figure is yours to type &mdash;
        and since most of the world issues against the ICAO geometry, that entry
        starts on it."""

[[faq]]
q = "How does it find the crown, the chin and the eyes without a face model?"
a = """
        By using something a general face detector is not allowed to assume and this
        tool is: every one of these specifications demands the same scene &mdash;
        one person, facing the camera, against a plain evenly-lit wall. So the
        colour of the wall is read from the border of the picture, everything that
        is not that colour is the person, and the top of them is the crown, hair
        included. The pupils are found as the best pair of patches that are darker
        than their own surroundings, level with each other and either side of the
        middle of the head &mdash; a comparison that is local, so nothing in it
        depends on what colour a face is. The chin is the one that cannot be found
        this way, because a jaw against a neck is a soft edge with no colour change
        across it; it is worked out from the pupils, which sit at almost exactly
        half the height of a head, and then checked against the outline. All of it
        is arithmetic in <code>src/detect.js</code>: no weights, no inference
        runtime, nothing fetched, and the same arithmetic for every face put through
        it. That last part is the one that matters, because a shipped detector is
        wrong unevenly &mdash; worse on some faces than on others &mdash; and the
        people whose photographs already get rejected most often are the ones it
        would let down."""

[[faq]]
q = "How much should I trust the dots it places?"
a = """
        Enough to start from, not enough to skip looking at. Each of the four has a
        photograph it is wrong on: a patterned wall or a bookcase leaves no outline
        to find a head against, a head cropped at the top has no crown in the
        picture at all, and spectacles, a heavy fringe or closed eyes can put the
        pupils on the wrong feature. So the tool says out loud which of the four it
        measured and which it had to work out, refuses outright on a picture with no
        plain background in it rather than inventing an answer, and leaves every dot
        draggable. The crop is taken from where the dots end up, never from where
        they started. If you would rather place all four yourself, the switch above
        the picture says <em>I&rsquo;ll place them</em>, and moving any dot by hand
        flips to that on its own &mdash; from that moment they are yours and nothing
        will move them again."""

[[faq]]
q = "What is the head height rule, and why does mine keep failing it?"
a = """
        Every one of these specifications states how much of the frame the head has
        to fill, measured from the bottom of the chin to the top of the head, hair
        included &mdash; usually 70 to 80 per cent, which for a 45&nbsp;mm photo is
        31.5 to 36&nbsp;mm. The usual reason it fails is a selfie: an arm's length
        is about 60&nbsp;cm, which distorts the face and puts the head too large in
        the frame. The usual second reason is the crown &mdash; it is the top of the
        hair, not the hairline, and marking the hairline makes every head come out
        too small."""

[[faq]]
q = "Why does the file have to be at least 20 KB, and how can it be padded?"
a = """
        Indian examination portals, the Chinese visa form and the UK passport upload
        all state a minimum file size as well as a maximum, because a file under it
        is usually a thumbnail somebody uploaded by mistake. A 200&nbsp;&times;&nbsp;230
        photograph is 46,000 pixels, and at the best quality a browser will write it
        can still land at 15&nbsp;KB, with no way to make it larger by compressing
        less. So the tool adds a JPEG comment segment full of spaces. That is part of
        the JPEG standard, every decoder skips it, and the picture is bit-for-bit the
        same picture &mdash; only the file is longer. The padding says exactly that,
        in English, inside the file."""

[[faq]]
q = "Does it check the background, and can it replace one?"
a = """
        It checks and will not replace. The colour is read from a band across the top
        of the crop and down each side, above the shoulders, and compared with the
        rule's colour in CIE Lab rather than in RGB &mdash; two greys forty RGB units
        apart are indistinguishable and forty units of blue is a different colour.
        Unevenness is measured separately, because a shadow on a white wall is what
        actually gets photographs rejected, and it is not a colour problem. Replacing
        a background means cutting a person out of a picture, which is a segmentation
        model, and a bad one eats hair. Standing a foot further from the wall fixes
        more of these than any filter would."""

[[faq]]
q = "What is the 4 x 6 sheet for?"
a = """
        A booth charges several pounds for six photographs. A photo counter prints a
        6&nbsp;&times;&nbsp;4 for pennies and every one of them will do it. So the
        tool lays as many copies of your photo as the paper holds &mdash; eight, for a
        35&nbsp;&times;&nbsp;45 on a 6&nbsp;&times;&nbsp;4 &mdash; with cut marks in
        the gaps and nothing printed over a picture. Nothing is scaled to fit: every
        copy is exactly the size the rule asks for, because a sheet that shrank them
        by two per cent to fit one more on would be eight photographs that are all the
        wrong size. Print it at 100 per cent; &ldquo;fit to page&rdquo; is what makes
        a sheet come out wrong."""

[[faq]]
q = "Why does the DPI matter if the pixels are the same?"
a = """
        Because a JPEG can say what size it is, and if it does not, whatever prints it
        guesses. The resolution lives in the JFIF header, and a browser canvas writes
        that header with the units field set to &ldquo;this is an aspect ratio, not a
        resolution&rdquo;. This tool rewrites those few bytes so the file says
        300&nbsp;dpi, which is what turns 413&nbsp;&times;&nbsp;531 pixels into a
        35&nbsp;&times;&nbsp;45&nbsp;mm photograph rather than an image of no
        particular size. Nothing is decoded to do it and no quality is spent."""

[[faq]]
q = "Can it do the signature file as well?"
a = """
        Yes &mdash; the SSC and UPSC forms want one at 140&nbsp;&times;&nbsp;60 pixels
        and between 10 and 20&nbsp;KB, and it is on the list as its own specification.
        The face overlay is switched off for it, since a signature has no eye line, and
        what is checked instead is that the paper is light, that there is ink on it, and
        that the crop has not taken in a ruled line or the edge of the page. Reaching
        10&nbsp;KB is the hard part of that rule, not staying under 20."""

[[faq]]
q = "Will this guarantee my application is accepted?"
a = """
        No, and no tool honestly can. What it does is apply the published figures
        exactly and show you every measurement it made, so that the things a form
        measures automatically &mdash; pixel size, file size, format &mdash; are right,
        and the things a human examiner measures &mdash; head height, eye line, the
        background &mdash; are in front of you with numbers on them. The rules also
        change: every specification here says which authority it came from and when it
        was read, so you can check it against the form in front of you rather than
        trusting a table."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no watermark
        printed across your face. There is no limit on how many photographs you make
        either, because there is no server paying for them. The site carries
        advertising, which is what pays for it; the ads are not given anything about
        your photograph."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working &mdash; the rulebook is a file served with the page, not a lookup. That
        is also the simplest way to prove nothing is being uploaded: a tool that sent
        your photograph away to be cropped would stop the moment you unplugged."""

[schema]
category = "MultimediaApplication"
description = "Make a passport, visa or ID photograph to a country's published specification in the browser. Applies the print size, DPI, head-height band, eye line and background colour of the chosen document, places the crown, chin and pupils by measuring the picture rather than by running a face model, shows a live overlay and measurement of each, checks the background, lays out a printable 4x6 sheet with cut marks, and writes an upload file at the mandated pixel size inside the portal's KB band. Nothing is uploaded."
features = [
  "A rulebook of published specifications, each naming its authority and the date it was read",
  "ICAO Doc 9303 geometry: head height as a fraction of the frame, and the eye line above the bottom edge",
  "A crop box locked to the specification's shape, with the eye band and chin band drawn inside it",
  "Crown, chin and both pupils found from the outline of the head and the dark of the eyes, with no model shipped and nothing fetched",
  "Every one of the four still draggable, with the page saying which it measured and which it worked out",
  "Live head height, eye line, centring and tilt, each saying which way to correct",
  "Background colour and evenness measured in CIE Lab, with the two reported separately",
  "Prints at the exact millimetres, with the resolution written into the JPEG header",
  "A 4 x 6, 5 x 7, A4 or Letter sheet, tiled with cut marks in the gaps and nothing over a picture",
  "An upload file at the mandated pixel size, searched into the portal's KB band at both ends",
  "SSC and UPSC form photos at 200 x 230 in 20-50 KB, and signatures at 140 x 60 in 10-20 KB",
  "Runs offline; no upload, no account, no face model",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
accept = "image/*,.jpg,.jpeg,.png,.webp,.heic"
multiple = false
title = "Drop a photo here"
hint = "or click to browse &mdash; one photograph, JPEG, PNG, WebP or anything else your browser can open"
