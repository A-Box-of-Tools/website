category = "DeveloperApplication"
description = "Encode and decode Base64 in both alphabets, percent-encode a value or a whole URL, escape and unescape HTML entities, hex bytes and backslash escapes. Everything runs in the browser and nothing is uploaded."
features = [
  "Base64 in both alphabets, encoded and decoded",
  "Reads wrapped Base64 and says exactly why bad input is bad",
  "Checked against the RFC 4648 test vectors",
  "Percent-encoding for a single value and for a whole URL",
  "The five HTML entities, and numeric and named entities read back",
  "Hex bytes with any separator, and backslash escapes",
  "Encodes by UTF-8 bytes, so emoji survive the round trip",
  "Works on a dropped file as well as on a paste",
  "Runs offline; no upload, no account",
]

