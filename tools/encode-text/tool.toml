[[privacy]]
title = "What you paste has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that a pasted
      token could be collected at, and nothing in the code that would send it if
      there were."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. Every encoder and
      every decoder is a function in this page that takes a string and returns
      a string."""

[[privacy]]
title = "The decoder tells you when something is wrong."
body = """
 The browser's own <code>atob</code>
      accepts input it should refuse and returns something plausible. The
      Base64 here is written out by hand and checked against the test vectors
      in RFC&nbsp;4648, and when what you pasted is not Base64 it says so, and
      says why. The tests in <code>tests/js/text-encode.test.js</code> check
      exactly that."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed a character of your text. Every line that
      reads, encodes or decodes it is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Pick the encoding."
body = """
 Base64 in both alphabets, percent-encoding
      for a single value or a whole URL, the five HTML entities, hex bytes, and
      the backslash escapes a string literal uses. The note under the menu says
      what each one is for."""

[[howto]]
title = "Pick the direction."
body = """
 <em>Encode</em> takes plain text and
      produces the encoded form; <em>Decode</em> takes the encoded form back to
      plain text. The result updates as you type, so switching direction is one
      click and no retyping."""

[[howto]]
title = "Paste it in, or drop the file."
body = """
 Anything you can select and copy
      works. A file dropped on the picker is read by your own browser and put in
      the box &mdash; there is no upload step to leave out."""

[[howto]]
title = "Read the error if there is one."
body = """
 A decoder that fails here says what
      it found &mdash; a character Base64 does not use, padding in the wrong
      place, bytes that are not text &mdash; rather than returning something
      plausible and wrong."""

[[howto]]
title = "Take the result."
body = """
 Copy it, or download it as a text
      file. The counts under the box say how many bytes went in and how many
      came out."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my text uploaded anywhere?"
a = """
        No. Every encoder and decoder on this page is a function that runs in
        your own browser, on your own hardware. This tool has no network
        feature of any kind &mdash; it never fetches anything and never sends
        anything &mdash; and the page's <code>Content-Security-Policy</code>
        names every address it may contact, none of which belongs to this site.
        That is the reason to use it for an access token or a session cookie:
        pasting one of those into somebody else's decoder is giving it to
        them."""

[[faq]]
q = "Is Base64 here the same Base64 as everywhere else?"
a = """
        Yes &mdash; it is checked against the test vectors in RFC 4648 rather
        than against itself. Both alphabets decode, so a JWT written with
        <code>-</code> and <code>_</code> reads as easily as one written with
        <code>+</code> and <code>/</code>, and input wrapped at 64 characters is
        unwrapped for you. Encoding is by UTF-8 bytes, so an accented letter or
        an emoji survives the round trip."""

[[faq]]
q = "Is Base64 encryption?"
a = """
        No, and treating it as encryption is the classic mistake. Base64 is a
        spelling: the same bytes written in an alphabet that survives being put
        in a URL, an email or a JSON string. Anyone can read it back &mdash;
        this page does it in a millisecond &mdash; so it hides nothing and
        protects nothing. If what you have is secret, it needs actual
        encryption before it is encoded, not instead of it."""

[[faq]]
q = "Why did decoding fail?"
a = """
        Because what was pasted is not quite what the codec was told it was,
        and the error says which way: a character outside the Base64 alphabet,
        padding in the wrong place, a percent sign with no two hex digits after
        it, or bytes that decode from Base64 but are not UTF-8 text &mdash;
        which usually means the original was a file rather than a string. The
        browser's own <code>atob</code> would have returned something plausible
        instead; being told is the whole point of pasting something into a
        decoder."""

[[faq]]
q = "What is the difference between the two web-address encodings?"
a = """
        One value, or the whole address. Encoding <em>one value</em> escapes
        everything a URL gives a meaning to &mdash; slashes, question marks,
        ampersands &mdash; which is what you want for a single query-string
        parameter. Encoding a <em>whole URL</em> leaves the address working:
        the slashes and the <code>?</code> stay, and only the characters a URL
        cannot carry at all are escaped. Using the first on a whole address
        breaks the address; using the second on a value loses where the value
        ends."""

[[faq]]
q = "How big a file can it handle?"
a = """
        There is no limit set here, because there is no server paying for one.
        The practical ceiling is your own machine: a few megabytes of text is
        fine, and the page waits for a pause in your typing before it re-encodes
        a very long document rather than fighting you for the keyboard."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no limit on
        how much you paste. The site carries advertising, which is what pays for
        it; the ads are not given anything about your text."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your text away to be decoded would stop the
        moment you unplugged."""

