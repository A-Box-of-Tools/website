<main id="main">
  <!-- Step 1 &mdash; which codec, and which way -->
  <section class="card">
    <h2><span class="step">1</span> Pick the encoding</h2>

    <div class="settings">
      <div class="field">
        <label for="codec">Encoding</label>
        <select id="codec"></select>
        <p class="field-note" id="codec-note"></p>
      </div>

      <div class="field">
        <fieldset class="modes">
          <legend>Which way</legend>
          <label class="mode">
            <input type="radio" name="direction" value="encode" checked>
            <span><strong>Encode</strong> Plain text in, encoded out.</span>
          </label>
          <label class="mode">
            <input type="radio" name="direction" value="decode">
            <span><strong>Decode</strong> Encoded in, plain text out.</span>
          </label>
        </fieldset>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; the text itself -->
  <section class="card">
    <h2><span class="step">2</span> Paste it in</h2>

    <!--
      The picker is here for the file that is easier to drop than to open,
      select all and copy. Nothing about it leaves the machine: the file is
      read with FileReader into the box below, and that is the whole journey.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">Your text</label>
          <span class="count" id="input-count">empty</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Paste the text to encode, or the Base64 to decode - or drop a file above."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Try an example</button>
        <button type="button" id="clear" class="ghost danger">Clear</button>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what came out -->
  <section class="card">
    <h2><span class="step">3</span> Take the result</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Nothing yet.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Copy</button>
        <a id="download" class="ghost as-button" hidden download>Download</a>
      </div>
    </div>

    <pre id="output" class="output" tabindex="0"></pre>
  </section>
</main>
