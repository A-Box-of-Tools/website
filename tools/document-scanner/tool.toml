[[privacy]]
title = "Your documents have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your
      photos could be collected at, and nothing in the code that would send them
      if there were."""

[[privacy]]
title = "There is no model, so there is nothing to download and nothing to ask."
body = """
 Finding
      the four corners of a page is done with arithmetic: the gradient of the
      picture, a vote for the straight lines in it, and a check of what is
      actually underneath each side of the rectangle that wins. No weights, no
      inference runtime, nothing fetched on first use, and nothing that behaves
      differently on somebody else's document than on yours &mdash; see
      <code>src/detect.js</code>."""

[[privacy]]
title = "The document carries no date, no author and no machine name."
body = """
 A scan is
      something people send to other people, usually because an office asked for
      it. The only thing written into the PDF besides the pages themselves is the
      name of this tool, and a title if you type one. There is no creation date,
      no author, no serial number and nothing derived from your clock, your
      filenames or your computer &mdash; see <code>src/document.js</code>."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. The work is
      <code>getImageData</code>, some loops over the bytes, and the browser's own
      JPEG encoder &mdash; all of it already installed on your machine."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool is
      unchanged, because there was never a network step in it. That is the
      simplest proof of all &mdash; and the one worth running before you scan a
      passport."""

[[howto]]
title = "Photograph the page."
body = """
 From above, with the whole page in the
      frame and the four corners visible or nearly so. It does not have to be
      square-on and it does not have to be evenly lit: the angle and the shadow
      are what this tool is for. What does matter is filling the frame &mdash; a
      page photographed from across the room has no detail in it to recover."""

[[howto]]
title = "Check the four corners."
body = """
 They are found for you when the
      photo is read, and the page says so when it is not sure &mdash; a page on a
      desk the same colour as the paper is genuinely hard to see the edge of.
      Press anywhere on the photo and the nearest corner comes to your finger, or
      reach one with <kbd>Tab</kbd> and move it with the arrow keys."""

[[howto]]
title = "Choose what to do with the light."
body = """
 &ldquo;Colour, evened
      out&rdquo; measures the paper across the page and divides it out, so the
      shadow goes and a stamp or a signature keeps its colour. &ldquo;Black and
      white&rdquo; goes further and is what makes a scan small enough to email.
      What you see on screen is the real result, produced by the same code that
      writes the file."""

[[howto]]
title = "Add the other pages."
body = """
 Every photo you add becomes another page
      of the same document, in the order they are listed, and each one keeps its
      own corners. The arrows on a page in the strip move it earlier or later."""

[[howto]]
title = "Save the PDF, and open it before you send it."
body = """
 The
      document is written here, in this page's memory. Nothing was uploaded to
      make it, and nothing about it was reported anywhere."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my document uploaded anywhere?"
a = """
        No. The photo is decoded, straightened, cleaned up and written into a PDF
        by your own browser on your own hardware. This tool has no network feature
        of any kind &mdash; it never fetches anything and never sends anything
        &mdash; and the page's <code>Content-Security-Policy</code> names every
        address it may contact, none of which belongs to this site. Load the page
        once, unplug from the internet, and it still works."""

[[faq]]
q = "How does it find the corners of the page without a model?"
a = """
        By looking for the four long straight edges a rectangle is made of. The
        photo is shrunk, the gradient is taken &mdash; where the picture changes,
        and in which direction &mdash; and every pixel that sits on an edge votes
        for the straight line it would lie on. The strong lines are paired into
        candidate rectangles, and each candidate is scored by walking its four
        sides and asking how much of each one really has an edge under it, and
        whether the four of them are the boundary of one thing: a page is lighter
        than what is around it, or darker, but it is the same one on all four
        sides, which is what stops a line of text being mistaken for the bottom of
        the page. There are no weights, nothing is downloaded, and the arithmetic
        is the same arithmetic for every document put through it."""

[[faq]]
q = "The corners it found are wrong. What now?"
a = """
        Drag them. The corners are a starting position and never a decision: the
        scan is taken from wherever the four of them end up. Press anywhere on the
        photo and the nearest corner jumps to your finger, which is easier than
        hitting a small handle, and the arrow keys move the focused corner one
        pixel at a time. The page also tells you when the corners are a guess
        rather than a finding, and marks that page in the strip &mdash; a page
        lying on a desk of about its own colour is the usual reason, because
        there is genuinely almost no edge there to find."""

[[faq]]
q = "Why does the straightened page come out the right shape, and not squashed?"
a = """
        Because the shape is recovered from the perspective rather than measured
        off the edges. A page photographed at an angle has its far edge
        foreshortened, so the obvious method &mdash; take the longest pair of
        opposite edges and call that the ratio &mdash; produces a visibly squat
        A4, which is what most web scanners give you. A photograph of a rectangle
        actually carries enough information to recover both the rectangle's aspect
        ratio and the camera's focal length, given only that the camera is an
        ordinary one; that is a result of Zhang and He's from 2003, and it is what
        <code>src/geometry.js</code> does. Where the photo was taken square-on
        there is no perspective to work from and none is needed, because the edges
        are then exact &mdash; so it falls back to them, and the page says which
        of the two answered."""

[[faq]]
q = "What does &ldquo;cleaned up&rdquo; actually do to the picture?"
a = """
        It divides out the light. The paper's own brightness is measured across
        the page &mdash; a grid of tiles, and in each tile a high percentile of
        the brightness, which text is too dark and too sparse to move &mdash; and
        every pixel is divided by the paper estimated at that point. What is left
        is the ink, evenly lit, with the shadow and the falloff gone. That is not
        the same as raising the contrast: raising the contrast of a photographed
        page makes the bright part white, the dark part black, and the writing in
        the dark part unreadable, which is why &ldquo;auto levels&rdquo; makes
        these pictures worse rather than better."""

[[faq]]
q = "Why is the black and white mode so much smaller?"
a = """
        Because a picture with two colours in it is genuinely a fraction of the
        data of a picture with sixteen million, and it is stored that way here:
        one bit per pixel, packed eight to the byte and compressed exactly, rather
        than as a JPEG of a black and white picture. On the same pages it comes out
        about eighteen times smaller than the colour mode does, so a twenty page
        contract lands under a megabyte rather than at something like fifteen.
        The threshold is Sauvola's, which decides each pixel
        against the mean and the spread of its own neighbourhood rather than
        against one number for the whole page &mdash; that is what keeps the
        writing inside a shadow. It has no half tones, so a page with a photograph
        on it should use one of the other modes."""

[[faq]]
q = "Can I put several pages in one PDF?"
a = """
        Yes. Every photo you add becomes another page, in the order they are
        listed, and each page keeps its own corners &mdash; so a stack of pages
        photographed one after another becomes one document. The arrows on each
        page in the strip move it earlier or later. The cleanup setting is shared
        by all of them on purpose: pages in one document that were cleaned up
        differently look like two documents."""

[[faq]]
q = "Does it read the text, so I can search the PDF?"
a = """
        No. There is no text layer and no character recognition: what comes out is
        a picture of the page on a page. Doing it properly would mean an OCR
        engine, which is tens of megabytes of model to download &mdash; and a
        document scanner that fetched a model before it could read your payslip
        would be a document scanner that had a reason to phone home about
        payslips. If you need the text, the black and white mode produces exactly
        the sort of file that OCR software on your own machine works best on."""

[[faq]]
q = "It came out blurry. Why?"
a = """
        Almost always because the page was small in the photo. The panel under the
        preview says how much of the frame the page filled and roughly how many
        dots per inch that works out at across a sheet of that size &mdash; below
        about 150 DPI a printed scan looks soft, and there is nothing any tool can
        do about detail that was never in the file. Move closer rather than
        zooming, hold still, and let the camera focus on the page before pressing
        the button. Camera shake is the other cause, and it is not recoverable
        either."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial, no page limit
        and no watermark. There is no limit on the size of the photos either,
        because there is no server paying for it &mdash; the work happens on your
        own machine. The site carries advertising, which is what pays for it; the
        ads are not given anything about your documents."""

[schema]
category = "MultimediaApplication"
description = "Scan a document in the browser: photograph a page, and the four corners are found, the perspective is undone, the uneven light is divided out, and the result is written into a PDF. Multiple pages become one document. Nothing is uploaded."
features = [
  "Finds the four corners of the page with no model, nothing downloaded and nothing fetched",
  "Recovers the page's real shape from the perspective, so an angled photo does not come out squashed",
  "Divides out uneven light and shadow instead of raising the contrast",
  "Black and white pages stored at one bit per pixel, which is what makes a scan small enough to email",
  "Several photos become the pages of one PDF, each with its own corners",
  "Corners can be dragged, or moved from the keyboard a pixel at a time",
  "Says when the corners are a guess rather than a finding",
  "Writes no date, no author and no machine name into the document",
  "Runs offline; no upload, no account",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which body.html
# includes, and driven by src/shared/file-picker.js.
[picker]
accept = "image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp,.avif"
multiple = true
title = "Drop photos of your pages here"
hint = "or click to browse &mdash; one photo per page, in page order"

# The carry-on row reads the finished result back out of this page's own
# blob: URL before parking it for the next tool (see shared/handoff.js), and
# reading a blob: URL is a fetch the policy has to permit. blob: names bytes
# inside this page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
