#
# Document Scanner
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "document-scanner"
name = "Document Scanner"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Document&nbsp;Scanner <span class=\"h1-kw\">&mdash; a photo of a page, straightened</span>"
tagline = "Photograph the page. Get back something that looks scanned."
icon = "&#128195;"          # the curled page, beside the heading
favicon = "&#128195;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "scan-text"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "documents"

# Shared modules this tool asks for. file-picker brings in the drop zone; zip is
# for saving several pages as pictures rather than as a document, and needs crc32
# beside it because the archive stores a checksum per entry.
js_parts = ["file-picker", "zip", "crc32"]
# Where a finished result can be carried without being saved first: the row of
# links shared/handoff.js shows beside the download once there is one. Slugs of
# tools whose picker takes what this page produces; checked against the tools
# that exist by the build.
handoff = ["merge-pdf", "compress-pdf"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "Document Scanner &mdash; Photo to PDF Scan, No Upload"
description = "Turn a phone photo of a page into a straightened, evenly lit PDF. The corners are found for you, the perspective is undone, the shadow is divided out. Runs entirely in your browser: nothing is uploaded."
og_title = "Scan a document with a photo, without uploading it"
og_description = "The corners of the page are found, the angle is undone and the uneven light is divided out, in your own browser. What people photograph this way is a passport, a payslip or a contract, which is exactly what should not be uploaded."
og_image_alt = "Document Scanner - a photo of a page, straightened and cleaned up, without uploading it"

# The subtitle on the share card that og-image.ps1 draws into og.png. The card's
# heading is `name` above and its footer is the same line on every card, so this
# is the only part of it that belongs to this tool.
og_card = "Photograph a page. The corners are found, the angle undone, the shadow divided out."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  This tool widens nothing. The photo and the straightened page are drawn
  straight into a canvas rather than loaded through a URL, and the finished
  document is a blob: link you download rather than anything this page
  fetches."""

