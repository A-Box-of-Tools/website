# --- what search engines and chat apps are told ------------------------------

title = "Share Text &amp; Files Between Devices &mdash; Direct, Encrypted, Nothing Stored"
description = "Send text or files from one browser to another over a direct encrypted connection. A speakable link name, live updates as you type, approval for each reader - and nothing stored on any server, ever. Free, no sign-up."
og_title = "A share that ends the moment you close the tab"
og_description = "Text and files travel straight from your browser to the reader's, encrypted. The server only introduces the two of you and never sees the content. No storage, no history, no account - close the tab and it is gone, everywhere."
og_image_alt = "Share Text & Files - direct from browser to browser, nothing stored"

og_card = "Text and files, straight from your open tab to theirs - and gone the moment you close it."

# Appended to the Content-Security-Policy comment in the generated page.
csp_note = """
  The one tool on this site whose CSP names an origin of ours: connect-src
  carries the rendezvous, the WebSocket that matches the two ends of a link
  name and relays their WebRTC negotiation. It is the introduction only -
  the text and files travel the peer-to-peer channel, which CSP does not
  govern and no server touches, unless a reader who could not be reached
  directly chooses Cloudflare's TURN relay, which forwards the encrypted
  channel without a key to it. The worker's whole source is in the
  repository at workers/rendezvous/. Local network mode uses only host ICE
  candidates, with no public STUN server or TURN relay; its introduction
  still uses the rendezvous. The start page automatically opens a discovery
  WebSocket for opted-in link names on the same public IPv4 address or IPv6 subnet. Sharing
  opens a second socket for the actual share; a reader uses its own single
  introduction socket. The discovery directory never carries text or files."""

