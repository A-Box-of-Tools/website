#
# Share Text & Files
#
# Everything on the generated page that is particular to this tool. The frame
# around it comes from templates/tool.html, and the site-wide parts, the
# Content-Security-Policy among them, from config/site.toml.
#
# The first tool on this site with a network step, which is why every claim
# below is worded from scratch rather than copied. The product is a share
# that lives only in the sharer's open tab: readers fetch the text and files
# over a direct, encrypted, browser-to-browser channel, and closing the tab
# is the whole of the deletion. An encrypted channel needs an introduction, so
# this tool names a server of ours in its CSP: the
# rendezvous, a Cloudflare Worker whose entire code is in workers/rendezvous/
# that matches the two ends of a code word, forwards their negotiation, and
# lists opted-in local link names to browsers sharing a public IPv4 address or IPv6 subnet.
# It keeps no content and cannot read anything exchanged by the peers.
# The docs' rule for network features is that a tool says so on its own page,
# in plain language, and does not weaken the site-wide claim quietly; this
# file is where most of that saying happens.
#

slug = "share-text"
name = "Share Text & Files"
heading = "Share text &amp; files <span class=\"h1-kw\">&mdash; an encrypted share that ends with your tab</span>"
tagline = "Share text and files from your open browser, encrypted. Direct is the default; Cloud relay is an optional route when devices cannot connect directly."
icon = "&#128279;"           # the mark beside the page heading
favicon = "&#128279;"        # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "send"
category = "connect-devices"
