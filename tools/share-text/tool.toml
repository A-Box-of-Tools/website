# Appended to the Content-Security-Policy comment in the generated page.
csp_note = """
  Local builds and project previews use rendezvous-dev.abox.tools; production
  pages use rendezvous.abox.tools. These WebSockets carry introductions,
  discovery metadata and short-lived relay credentials, never shared content.
  Direct uses browser-to-browser WebRTC; its ordinary mode uses public STUN
  address discovery, while Local network uses host candidates only.
  Explicit Cloud relay uses Cloudflare TURN to forward end-to-end encrypted
  packets. WebRTC transport is outside connect-src. Source and retention
  details are documented in workers/rendezvous/."""

