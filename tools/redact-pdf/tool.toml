#
# Redact a PDF
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The one thing to keep hold of while editing any of the prose below: this page
# is making a claim other redaction tools cannot make, and the claim is worth
# nothing if it is overstated. What this removes is text. A page that is a
# photograph of a page has no text on it and this tool says so rather than
# pretending. Every sentence here is written to survive somebody checking it.
#

slug = "redact-pdf"
name = "PDF Redactor"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Redact&nbsp;PDF <span class=\"h1-kw\">&mdash; the words come out, not a box over them</span>"
tagline = "The letters are deleted from the file, and the file is searched afterwards to prove it."
icon = "&#128274;"                  # the padlock, beside the page heading
favicon = "&#128274;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "file-lock"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "documents"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

js_parts = ["file-picker"]
lastmod = "2026-09-01"

# --- what search engines and chat apps are told ------------------------------

title = "Redact a PDF &mdash; Really Delete the Text, Free, No Upload"
description = "Take words out of a PDF instead of drawing a black rectangle over them. The letters are deleted from the page's own drawing instructions, the finished file is opened again and searched to prove they have gone, and nothing is uploaded."
og_title = "Redact a PDF properly &mdash; the words are deleted, not covered"
og_description = "A black rectangle in most tools sits on top of the text and can be copied out from underneath. This one deletes the letters from the file and then searches the result to show they are not there."
og_image_alt = "Redact a PDF by deleting the text, not by covering it"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
