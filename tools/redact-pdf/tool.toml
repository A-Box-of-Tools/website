    tab."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and
      redact something. Not one request carries a page, a word, or a filename.
      Or unplug from the internet and redact it anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/text.js</code> for how every word on a
      page is found and located, and <code>src/edit.js</code> for the deletion
      itself &mdash; what is cut out of the page's instructions and what is put
      back so the rest of the line does not move. None of them can reach the
      network, and neither can the reader or the writer beside them."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to redact a PDF so the words are really gone"

# --- the card on the hub page ------------------------------------------------

card = """
            Delete words from a PDF rather than covering them. The letters are
            taken out of the page's own drawing instructions, the gap is held
            open so nothing else moves, and the finished file is opened again
            and searched here to prove the words are not in it."""

