#
# WebP to JPG
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# This tool is the opposite of heic-to-jpg in the one way that matters to the
# promise. That one carries 1.4 MB of libheif because HEIC is the format no
# browser but Safari will open; this one carries nothing at all, because every
# browser has decoded WebP since 2020 and every canvas has written JPEG since
# long before that. So the honest claim here is not "we brought the decoder" -
# it is that there was never anything to bring, and that a converter asking you
# to upload a WebP is asking for something it does not need.
#
# The two facts the page keeps returning to are the two a WebP has and a JPEG
# does not: transparency and more than one frame. Both are read off the file
# before anything is converted and both are said out loud, because the failure
# this tool is most likely to be blamed for is a logo whose background came out
# black, and the tool that caused it was the one that never mentioned it.
#

slug = "webp-to-jpg"
name = "WebP to JPG"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "WebP&nbsp;to&nbsp;JPG <span class=\"h1-kw\">&mdash; convert without uploading</span>"
tagline = "The pictures the web saves, in the format everything still takes."
icon = "&#128444;&#65039;"  # the framed picture, beside the page heading
favicon = "&#128444;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1 rasterises
# for the share card and the two installed-app icons, which want a filled
# colourful mark rather than a line drawing.
glyph = "arrow-right-left"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
roadmap_group = "images"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules.
css_parts = ["file-list", "progress", "results", "form", "notes"]
# Shared modules this tool asks for. image-convert is the decode-and-encode
# engine the three format converters share; example-photo and example-mark draw
# the two files behind the "Try an example" button.
js_parts = ["file-picker", "image-convert", "zip", "crc32", "message-box", "download", "format", "example-photo", "example-mark"]
# The tool to offer next, on the carry-on row under the result. A JPEG that has
# just been written is the thing people most often need smaller.
handoff = ["compress-image", "resize-image"]
lastmod = "2026-09-17"

# --- what search engines and chat apps are told ------------------------------

title = "WebP to JPG Converter &mdash; Free, No Upload"
description = "Convert WebP images to JPG in your browser. Your browser already decodes WebP, so nothing is uploaded, there is no account, and it works offline. Transparency is filled with a colour you choose."
og_title = "Turn WebP images into JPGs without uploading them"
og_description = "The converter that does not want your pictures. Your browser already reads WebP and writes JPEG, so the files never leave your machine."
og_image_alt = "WebP to JPG - the pictures the web saves, in the format everything takes"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every card,
# so this is the only part of it that belongs to this tool.
og_card = "The pictures the web saves, in the format everything takes - converted on your own machine."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  Nothing is widened here, and that is worth saying rather than leaving to be
  noticed: this tool needs no policy of its own. It has no codec to instantiate,
  so it does not ask for 'wasm-unsafe-eval' the way the HEIC converter has to,
  and it fetches nothing, so connect-src is exactly what the site set.

  img-src needs blob: for the pictures this page draws from the files you chose,
  and https: because ad creatives come from anywhere."""

