[[privacy]]
title = "Your pictures have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your
      files could be collected at, and nothing in the code that would send them
      if there were."""

[[privacy]]
title = "There is no decoder to ship, which is why there is no server."
body = """
 Every browser
      released since 2020 decodes WebP, and every one of them has written JPEG
      since long before that. So this tool carries no engine, downloads nothing
      on first use, and has no reason to exist on a server &mdash; which is
      exactly what the converters that ask you to upload are not telling you.
      The one tool here that does carry a codec is the
      <a href="../heic-to-jpg/">HEIC converter</a>, because HEIC genuinely is a
      format no browser but Safari will open, and it says so on its own page."""

[[privacy]]
title = "The see-through parts, and what goes behind them."
body = """
 A WebP can be
      transparent and a JPEG cannot &mdash; there is no alpha channel in the
      format, so something has to go underneath. This page asks which colour and
      defaults to white, and it only asks when a file on the list actually has
      transparency in it, which is read off the decoded pixels rather than
      guessed from the format. A converter that does not ask is not keeping your
      transparency; it is choosing black for you, which is where the
      black-background logo comes from."""

[[privacy]]
title = "What a canvas does not carry across."
body = """
 The picture is
      decoded and drawn onto a canvas, and a canvas holds pixels and nothing
      else, so EXIF, ICC colour profiles, XMP and any copyright block do not
      survive the trip. For most people that is a bonus and for some it is a
      loss, so it is said here rather than discovered later. If what you wanted
      was the metadata, the <a href="../exif-editor/">EXIF Viewer &amp;
      Remover</a> reads and writes it without re-compressing anything."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed anything about your pictures. Every line
      that reads, decodes or writes a file is served from this origin and listed
      in the repository."""

[[privacy]]
title = "It works offline."
body = """
 Load the page once and disconnect from the
      network, and the tool is unchanged. That is the simplest proof of all: a
      converter that sent your pictures away to be converted could not possibly
      manage it."""

[[howto]]
title = "Choose your WebP files."
body = """
 Drop them onto the picker or select
      them by hand. Every file is identified by its first bytes rather than by
      its name, so a WebP that arrived called &ldquo;.jpg&rdquo; still works
      &mdash; and a file that is genuinely a PNG is turned away with a line
      saying what it actually is, rather than converted into a copy of
      itself."""

[[howto]]
title = "Read what each row says about the file."
body = """
 The list names the size and
      the dimensions, and then the three things worth knowing before you convert:
      whether the WebP is lossless, whether it has see-through parts, and whether
      it is animated. Each one only appears when it is true of that file."""

[[howto]]
title = "Set the quality, and the colour behind the transparency."
body = """
 The
      slider starts at 92, which is where a photograph is hard to tell from the
      original. The colour field appears only if something on the list is
      see-through, because a JPEG has to put something there."""

[[howto]]
title = "Press &ldquo;Convert&rdquo;, and download."
body = """
 Each result says what it
      came from, what it weighs now and how that compares, and carries a note if
      its transparency was filled in or if only the first frame of an animation
      was written. One file gives you a download button; several give you a zip
      as well."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree.

[[faq]]
q = "Is my picture uploaded anywhere?"
a = """
        No. The file is read, decoded and written by your own browser on your own
        hardware. This tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything &mdash; and the page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site. Unlike the HEIC converter next door,
        there is not even a decoder to load first: your browser already had
        one."""

[[faq]]
q = "Why would I convert a WebP to a JPG at all?"
a = """
        Because the software you are handing it to has not caught up. WebP is
        what a browser saves when you right-click a picture on the web, and it is
        excellent at being small &mdash; but plenty of things still will not take
        one: older versions of Office and Photoshop, some print shops, a good
        number of upload forms that check the extension, most e-readers, and a
        surprising amount of software that came with a camera or a printer. A JPG
        is the format that has never been turned away."""

[[faq]]
q = "What happens to the transparent parts?"
a = """
        They are filled with a colour you choose, and the page tells you it is
        going to before you press anything. A JPEG has no alpha channel, so there
        is no version of this where the transparency survives &mdash; the only
        question is what goes underneath, and the honest answer is that it is
        your decision rather than the converter's. White is the default because
        it is right for a logo going into a document. If you need the
        transparency kept, keep the WebP, or convert it to a PNG with the
        <a href="../compress-image/">Image Compressor</a>, which writes PNG and
        WebP as well as JPEG."""

[[faq]]
q = "Can it convert an animated WebP?"
a = """
        It converts the first frame, and it says so on the row before you press
        anything and again on the result afterwards. A JPEG holds one picture, so
        there is nothing else it could do with the other frames. If what you want
        is every frame as a separate file, or the animation as a video, the tools
        for that are <a href="../split-gif/">Split a GIF</a> and
        <a href="../gif-to-mp4/">GIF to MP4</a> once the animation is a GIF."""

[[faq]]
q = "Is the picture re-compressed?"
a = """
        Yes, and it has to be: WebP and JPEG are different codecs, so there is no
        way to move from one to the other without decoding the picture and
        encoding it again. That is true of every WebP-to-JPG converter there is,
        including the ones that ask you to upload. What you control is how much
        it costs &mdash; the slider defaults to 92, where a photograph is very
        hard to tell from the original. A lossless WebP is the case worth knowing
        about: the JPEG made from one will be the first lossy copy that picture
        has ever had, and the row on the list says when a file is lossless so
        that is not a surprise."""

[[faq]]
q = "Will the JPG be bigger than the WebP?"
a = """
        Often, yes, and the result says by how much rather than hiding it. WebP
        is simply a better codec than JPEG at the same visual quality &mdash;
        that is why the web moved to it &mdash; so converting the other way
        usually costs you some size back. You are trading bytes for
        compatibility, which is a perfectly good trade when the thing on the
        other end will not take a WebP. If the size matters afterwards, the
        <a href="../compress-image/">Image Compressor</a> will take the JPEG down
        to a figure you name."""

[[faq]]
q = "Does it keep the date, camera and location?"
a = """
        No. The picture is drawn onto a canvas and a canvas holds pixels and
        nothing else, so EXIF, GPS, colour profiles and XMP are all left behind.
        In practice most WebPs on the web have already had that stripped, and for
        anybody converting a picture to send somewhere it is usually the outcome
        they wanted. If you need to see or edit what a file carries, the
        <a href="../exif-editor/">EXIF Viewer &amp; Remover</a> does that without
        re-compressing the picture."""

[[faq]]
q = "Can it do a whole folder at once?"
a = """
        Yes. Drop in as many as you like &mdash; there is no limit on the number
        or the size, because there is no server paying for them. Each one gets
        its own row and its own download, and two or more give you a zip of the
        lot. Files that share a name get a number added before the extension, so
        nothing quietly replaces anything else in the archive."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in, no trial and no
        watermark. The site carries advertising, which is what pays for it; the
        ads are not given anything about your pictures."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working exactly as before. That is also the strongest proof available
        that nothing is being uploaded: a converter that sent your files away to
        be processed would stop the moment you unplugged, and this one does
        not."""

[schema]
category = "MultimediaApplication"
description = "Convert WebP images to JPG in the browser. The browser's own decoder reads the WebP and its own encoder writes the JPEG, so nothing is uploaded and no codec is downloaded. Transparency is filled with a colour of your choosing, animated WebP files give their first frame, and batches come back as a zip."
features = [
  "Converts WebP to JPEG using the decoder the browser already has",
  "Nothing is uploaded, and the tool works with the network unplugged",
  "Asks which colour goes behind transparency, and only when a file has any",
  "Says which files are lossless, see-through or animated before converting",
  "Identifies files by their contents, so a WebP named .jpg still works",
  "Quality slider, defaulting to 92",
  "Reports what each file weighed before and after",
  "Batches, with all results in one zip",
]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
[picker]
# Deliberately wider than ".webp". A WebP that arrived called ".jpg" is one of
# the commonest reasons somebody is on this page, and an accept list of the one
# extension would hide that file in the browser's own dialog. Every file is
# identified by its first bytes anyway, and anything that is not a WebP is
# refused with a message saying what it actually is.
accept = "image/*,.webp"
multiple = true
title = "Drop WebP pictures here"
hint = "or click to browse &mdash; .webp files, whatever they happen to be named"
# Two files, drawn in the page: a photograph and a transparent mark. The second
# is what makes the background colour appear, which is the half of this tool
# worth demonstrating. See src/example.js.
example = true
