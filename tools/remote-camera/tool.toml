# Viewer approval is on by default; the owner may accept new viewers
# automatically instead. The first connection contains a control channel,
# and its acknowledgement precedes video and optional audio in either mode.
# Direct is the default; Cloud relay is an explicit session choice and never
# an automatic fallback. Both modes preserve the same media consent boundary.
