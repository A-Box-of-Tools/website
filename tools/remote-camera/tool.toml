[[privacy]]
title = "You choose whether viewers need approval."
body = """
      The first WebRTC connection carries only an encrypted control channel.
      Require my approval is on by default. Turning it off accepts new
      viewers automatically: anyone who knows the link or finds the listed
      camera can watch while it is free. The camera track is added only after
      the viewer acknowledges acceptance, and only one viewer receives it.
      Changing the setting applies to new requests, not waiting requests or
      an already connected viewer. Video uses the browser's encrypted media transport
      directly between devices. It never passes through the rendezvous.
      A viewer can still capture their own screen; ending the link stops future
      video and cannot remove anything they already kept."""
[[privacy]]
title = "The introduction requires internet and exposes connection metadata."
body = """
      Opening this page opens a discovery WebSocket to
      <code>rendezvous.abox.tools</code>. Start camera, Connect or choosing an online camera adds a room
      socket that stays open while the session is active. The service sees the code, IP addresses, connection times, and
      WebRTC setup descriptions and candidates; those setup messages are not
      encrypted from the service. It does not receive video or the viewer note.
      Discovery lists only opted-in camera names, grouped by the public IPv4
      address or IPv6 /64 seen by the service and the page origin. Shared VPNs
      or carrier networks can include strangers; nearby devices can be missed.
      Turn off listing before starting for a link-only camera. Choosing a
      listed name requests a connection immediately. The source
      chooses whether its owner must approve the request.
      Rooms and listings exist only on open connections. Cloudflare keeps connection logs
      for seven days: the code, address and time, never a payload."""
[[privacy]]
title = "A direct connection shares addresses before video is approved."
body = """
      Opening a viewer link selects the viewing form and waits. Connect or choosing an online camera asks
      the rendezvous to introduce the devices, and each browser then learns
      addresses offered by the other. Approval controls video, not that address
      exchange. The name you enter is a note for the source, not verified identity.
      Recognise the person and expected request before approving. If you turn
      approval off, a viewer can receive video without an owner action."""
[[privacy]]
title = "Host candidates are a connection policy, not proof of a building."
body = """
      No STUN server or TURN relay is configured, and non-host candidates are
      removed from descriptions and trickled messages. A VPN, public interface
      or operating-system route can affect where host addresses lead. Use a
      reachable local network; guest isolation, firewalls and local-network
      permissions may prevent the connection. There is no relay fallback."""
[[privacy]]
title = "Stop releases the camera and ends the invitation."
body = """
      Stop on the source closes its tracks, peers and introduction connection.
      Hiding or closing its page does the same, as does losing the introduction
      connection. A permission granted after Stop is immediately released.
      Disconnect on the viewer ends its connection while the source keeps its
      local preview available for a new request. Codes and notes are not saved
      by this tool."""
[[privacy]]
title = "The site frame still loads its usual third parties."
body = """
      Advertising and measurement scripts come from Google, and the donate
      button from Buy Me a Coffee. The tool does not pass them video or notes.
      Third-party scripts can read the page address, which includes the camera
      code in a viewer link. Keep approval on by recognising the intended
      viewer. With approval off, knowing a code permits viewing while the
      camera is free, so leave approval on when you want to control admission."""

[[howto]]
title = "Start on the camera device."
body = "Open this HTTPS page on the phone or computer whose camera you want. Choose a viewer link name or keep the random suggestion, choose Start camera, and allow camera access. Your browser chooses the initial camera. After permission, a Camera selector appears if this browser exposes more than one camera; use it to switch without ending the invitation. No microphone is requested."
[[howto]]
title = "Invite the viewing device."
body = "Open the viewer link or scan the QR code on the other device. You can also choose a name under Online cameras, or enter the code in Watch a camera. Both devices need internet for pairing and a network that lets them reach each other."
[[howto]]
title = "Connect the viewer."
body = "Choosing an online camera requests a connection immediately. For a viewer link or manually entered code, choose Connect to camera. If Require my approval is on, approve the request you recognise on the source. With it off, the first accepted viewer connects automatically. Live video then appears in the viewer; use Play live video if the browser pauses playback."
[[howto]]
title = "Keep the source visible, then stop."
body = "Keep the source page visible and its device awake while watching. Stop camera and end the link releases the camera. Switching away from the source page also stops it."

[[faq]]
q = "Must both devices use the same Wi-Fi?"
a = "They need a route to each other. Wi-Fi and Ethernet on the same reachable local network can work together. A shared Wi-Fi name alone does not establish reachability: guest isolation, firewalls, VPN routing and browser permissions can block it."
[[faq]]
q = "Does it work without internet?"
a = "No. The introduction uses our public rendezvous and its connection stays open during the session. Video travels directly between the browsers, with no configured internet relay. Losing the introduction connection ends the session."
[[faq]]
q = "Does this turn my phone into a webcam for meeting apps?"
a = "It provides a live view in another browser. It does not install a system webcam or make that camera available to desktop meeting applications."
[[faq]]
q = "Why must the camera page use HTTPS?"
a = "A browser requires a secure context and camera permission. Use the site's trusted HTTPS address. Ordinary HTTP on a local-network IP cannot request a camera; localhost is a development exception on the same computer."
[[faq]]
q = "Can anyone with the link watch?"
a = "With Require my approval on, a link or code permits a request and network-address exchange; the owner must approve before video. Turn approval off to let anyone with the link or a listed camera name watch while the camera is free. The optional viewer note is not proof of identity, so approve only the person and request you expect."
[[faq]]
q = "Can several devices watch at once?"
a = "One viewer at a time. Disconnect the current viewer before another can watch. Up to four peer connections may be pending; further requests are refused while busy."
[[faq]]
q = "Why did sharing stop when I changed apps?"
a = "Hiding or closing the source page deliberately stops capture and ends the link. Keep it visible and awake. Start again to create a new invitation after returning."
[[faq]]
q = "Can I change cameras while sharing?"
a = "After camera permission, the Camera selector appears when this browser exposes multiple video devices. Choose another to keep the same invitation and viewer connection. Some devices need a brief pause while the old hardware is released. If switching fails, the tool keeps or restores the previous camera where possible; if neither camera can be opened, sharing ends and you can start again."
[[faq]]
q = "Does it send sound or record video?"
a = "The tool requests video only and has no recording feature. It does not ask for microphone access. A viewer can independently capture their screen, as with anything they can see."
[[faq]]
q = "Why can pairing fail on the same Wi-Fi?"
a = "Guest networks and client isolation can separate devices. Firewalls, blocked local address discovery, OS and browser local-network permissions, or VPN routes can also prevent a direct connection. Stop on both devices, check permissions and network reachability, and try a fresh link. The tool will not switch to an internet relay."

