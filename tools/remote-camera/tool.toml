# Viewer approval is on by default; the owner may accept new viewers
# automatically instead. The first connection contains a control channel,
# and its acknowledgement precedes the single video track in either mode.
# The rendezvous introduces browsers without carrying their media. Host-only
# ICE is deliberate: this tool does not fall back to an internet relay.
