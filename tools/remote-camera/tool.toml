  directory authenticates with its code over the socket; host publication uses
  its derived identifier. Viewer links contain no group code or identifier.
  Start camera or Connect adds a room WebSocket carrying
  WebRTC descriptions, candidates and short-lived relay credentials, never video or audio. The encrypted control channel carries the viewer note and
  viewer acceptance; video and enabled audio are added only after the viewer acknowledges it.
  The owner chooses manual approval or automatic acceptance of new requests. Direct configures no STUN
