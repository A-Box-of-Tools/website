[[privacy]]
title = "You choose whether viewers need approval."
body = """
      The first WebRTC connection carries only an encrypted control channel.
      Require my approval is on by default. Turning it off accepts new
      viewers automatically: anyone who knows the link or finds the listed
      camera can watch while space is available. The camera track and enabled audio are added to each connection only after
      that viewer acknowledges acceptance. Up to eight viewers can watch together.
      Changing the setting applies to new requests, not waiting requests or
      an already connected viewer. Video uses the browser's encrypted media transport
      directly between devices. It never passes through the rendezvous.
      A viewer can still capture their own screen; ending the link stops future
      video and cannot remove anything they already kept."""
[[privacy]]
title = "The introduction requires internet and exposes connection metadata."
body = """
      Opening this page opens a discovery WebSocket to
      <code>rendezvous.abox.tools</code>. Start camera, Connect or choosing an online camera adds a room
      socket that stays open while the session is active. The service sees the code, IP addresses, connection times, and
      WebRTC setup descriptions and candidates; those setup messages are not
      encrypted from the service. It does not receive video, audio or the viewer note.
      Discovery lists only opted-in camera names, grouped by the public IPv4
      address or IPv6 /64 seen by the service and the page origin. Shared VPNs
      or carrier networks can include strangers; nearby devices can be missed.
      Turn off listing before starting for a link-only camera. Choosing a
      listed name requests a connection immediately. The source
      chooses whether its owner must approve the request.
      Rooms and listings exist only on open connections. Cloudflare keeps connection logs
      for seven days: the code, address and time, never a payload."""
[[privacy]]
title = "A direct connection shares addresses before video is approved."
body = """
      Opening a viewer link selects the viewing form and waits. Connect or choosing an online camera asks
      the rendezvous to introduce the devices, and each browser then learns
      addresses offered by the other. Approval controls video and enabled audio, not that address
      exchange. The name you enter is a note for the source, not verified identity.
      Recognise the person and expected request before approving. If you turn
      approval off, a viewer can receive video and enabled audio without an owner action."""
[[privacy]]
title = "Host candidates are a connection policy, not proof of a building."
body = """
      No STUN server or TURN relay is configured, and non-host candidates are
      removed from descriptions and trickled messages. A VPN, public interface
      or operating-system route can affect where host addresses lead. Use a
      reachable local network; guest isolation, firewalls and local-network
      permissions may prevent the connection. There is no relay fallback."""
[[privacy]]
title = "Stop releases the camera and ends the invitation."
body = """
      Stop on the source closes its tracks, peers and introduction connection.
      If viewers are connected or connecting, choosing Stop first asks you to
      confirm; Keep sharing leaves the camera and connections running.
      Closing its page does the same without waiting for confirmation. Hiding
      the tab keeps healthy capture and connections where the browser permits.
      If a phone interrupts capture, returning offers recovery with the same
      viewer link; interrupted microphone audio waits for Resume microphone.
      A lost introduction connection leaves an already accepted direct view
      running while the source retries its invitation. A permission granted after
      Stop is immediately released.
      Disconnect on the viewer ends its connection while the source keeps its
      local preview available for a new request. Codes and notes are not saved
      by this tool."""
[[privacy]]
title = "Viewer alerts analyze media locally."
body = """
      Notification options appear only when this browser supports them. Enabling
      motion or sound alerts requests notification permission. Small video frames
      and received audio are analyzed on the viewer device, without recordings or
      uploads. The browser and operating system display generic activity notices;
      notices contain no camera image, audio, link name or viewer note. Disconnect
      stops detection and closes this session's notifications. Keep the viewer
      page open; a browser may pause analysis in the background or during sleep."""

[[privacy]]
title = "The site frame still loads its usual third parties."
body = """
      Advertising and measurement scripts come from Google, and the donate
      button from Buy Me a Coffee. The tool does not pass them video, audio or notes.
      Third-party scripts can read the page address, which includes the camera
      code in a viewer link. Keep approval on by recognising the intended
      viewer. With approval off, knowing a code permits viewing while the
      camera is free, so leave approval on when you want to control admission."""

[[howto]]
title = "Start on the camera device."
body = "Open this HTTPS page on the phone or computer whose camera you want. Choose a viewer link name or keep the random suggestion, choose Start camera, and allow camera access. Your browser chooses the initial camera. After permission, a Camera selector appears if this browser exposes more than one camera; use it to switch without ending the invitation. Audio is off by default. Select Enable microphone before starting to request microphone access; stop before changing this choice."
[[howto]]
title = "Invite the viewing device."
body = "Open the viewer link or scan the QR code on the other device. You can also choose a name under Online cameras, or enter the code in Watch a camera. Both devices need internet for pairing and a network that lets them reach each other."
[[howto]]
title = "Connect the viewer."
body = "Choosing an online camera requests a connection immediately. For a viewer link or manually entered code, choose Connect to camera. If Require my approval is on, approve each request you recognise on the source. With it off, viewers connect automatically while space is available. Live video then appears in each viewer; use Play live video if the browser pauses playback. Shared audio starts automatically when your browser allows it; otherwise choose Unmute audio. Mute and Full screen are on the video. Supported browsers also offer optional motion or sound notifications."
[[howto]]
title = "Resume if the browser pauses video, then stop."
body = "The connection stays open when the source tab is hidden where the browser permits. A phone can pause its camera when locked. Return to the source; choose Resume camera if needed to keep the same viewer link. If the microphone was interrupted, choose Resume microphone when ready. Stop camera and end the link releases the camera and microphone. If a viewer is connected or connecting, confirm Stop sharing or choose Keep sharing to cancel."

[[faq]]
q = "Must both devices use the same Wi-Fi?"
a = "They need a route to each other. Wi-Fi and Ethernet on the same reachable local network can work together. A shared Wi-Fi name alone does not establish reachability: guest isolation, firewalls, VPN routing and browser permissions can block it."
[[faq]]
q = "Does it work without internet?"
a = "Internet is required to pair and invite new viewers through our public rendezvous. An already accepted direct view can continue if the introduction service disconnects; the camera retries its invitation without restarting capture or the existing view. Video and enabled audio travel directly between the browsers, with no configured internet relay. Losing that direct route still ends the view."
[[faq]]
q = "Does this turn my phone into a webcam for meeting apps?"
a = "It provides a live view in another browser. It does not install a system webcam or make that camera available to desktop meeting applications."
[[faq]]
q = "Why must the camera page use HTTPS?"
a = "A browser requires a secure context and camera permission. Use the site's trusted HTTPS address. Ordinary HTTP on a local-network IP cannot request a camera; localhost is a development exception on the same computer."
[[faq]]
q = "Can anyone with the link watch?"
a = "With Require my approval on, a link or code permits a request and network-address exchange; the owner must approve each viewer before video. Turn approval off to let anyone with the link or a listed camera name watch while space is available. The optional viewer note is not proof of identity, so approve only the people and requests you expect."
[[faq]]
q = "Can several devices watch at once?"
a = "Up to eight accepted viewers can watch together, with separate encrypted connections. Shared video bandwidth divides a chosen video ceiling between them; browsers can lower each connection's quality when congested. A 1 Mbps ceiling permits four new viewers and higher choices permit eight. Audio and network overhead are additional. The browser cannot measure total Wi-Fi capacity, and device performance can also limit how many views work well. Lower the ceiling or disconnect individual viewers if sharing slows down. Lowering the ceiling keeps existing viewers connected, with fewer new admissions until space is available."
[[faq]]
q = "Can the tool measure my Wi-Fi bandwidth?"
a = "The browser does not expose the total capacity shared by your Wi-Fi devices. Choose a shared video ceiling that leaves room for other traffic. The tool divides that ceiling among viewers and WebRTC adapts each stream to its connection. If the browser cannot apply sender bitrate limits, the page reports that and its normal connection adaptation continues; the selected shared ceiling cannot be guaranteed there."
[[faq]]
q = "Can the camera keep working when my phone is locked?"
a = "It keeps the live connection and camera where your browser allows background use. Phone browsers can pause or end camera capture when locked; this page cannot override that. Return to the source to recover the same viewer link, or choose Resume camera if permission is needed again. A healthy approved video connection can survive loss of the introduction service. Returning to the source tries to restore pairing without replacing that video connection; Restore pairing offers a manual retry. If the direct connection itself ends, the viewer must reconnect and receive fresh approval when required. Stop and Disconnect remain final for that session."
[[faq]]
q = "Can I change cameras while sharing?"
a = "After camera permission, the Camera selector appears when this browser exposes multiple video devices. Choose another to keep the same invitation and viewer connection. Some devices need a brief pause while the old hardware is released. If switching fails, the tool keeps or restores the previous camera where possible; if neither camera can be opened, sharing ends and you can start again."
[[faq]]
q = "Does it send sound or record video?"
a = "Audio is off by default on the host. Select Enable microphone before starting to request the microphone and send it directly to an accepted viewer. Stop before changing this choice. If the browser interrupts the microphone, it stays quiet until you choose Resume microphone. The viewer tries to play shared audio automatically; if the browser requires a tap, choose Unmute audio on the video. Mute silences playback while sound detection remains available. Reload older viewer pages to receive audio; they can still watch video. There is no recording feature. A viewer can independently capture their screen, as with anything they can see."
[[faq]]
q = "Can I receive motion or sound alerts?"
a = "Supported browsers offer optional notifications in the connected viewer. Enable motion or sound detection and allow notifications. Sound detection requires audio from the host; playback can stay muted. Detection runs locally while the viewer page can run, and may pause in the background or during sleep. Lighting changes can trigger motion alerts and activity can be missed. This is not a safety monitor. On iPhone or iPad, browser notifications may require adding the site to the Home Screen."
[[faq]]
q = "Why can pairing fail on the same Wi-Fi?"
a = "Guest networks and client isolation can separate devices. Firewalls, blocked local address discovery, OS and browser local-network permissions, or VPN routes can also prevent a direct connection. Stop on both devices, check permissions and network reachability, and try a fresh link. The tool will not switch to an internet relay."

