# A live camera is shared only after its owner approves a viewer. The first
# connection contains a control channel; approval adds the single video track.
# The rendezvous introduces browsers without carrying their media. Host-only
# ICE is deliberate: this tool does not fall back to an internet relay.
slug = "remote-camera"
name = "Remote Camera"
heading = "Watch a camera <span class=\"h1-kw\">&mdash; from another device on your local network</span>"
tagline = "Open a camera on one device and approve one viewer in another browser. Live video travels directly between them, encrypted."
icon = "&#128247;"
favicon = "&#128247;"
glyph = "camera"
category = "video-and-animation"
roadmap_group = "video"
css_parts = ["form", "notes"]
js_parts = ["peer-network", "gf256", "qr-tables", "qr-encode", "qr"]
lastmod = "2026-10-09"
title = "Remote Camera &mdash; Watch Another Device's Camera in Your Browser"
description = "Watch a phone or computer camera from another browser on a reachable local network. Direct encrypted video, source approval, no microphone or recording."
og_title = "Watch another device's camera"
og_description = "A direct camera view between two browsers, with camera permission and viewer approval on the source device."
og_image_alt = "Remote Camera - watch a camera from another device"
og_card = "A live camera, straight from one browser to another."
csp_note = """
  This tool opens a WebSocket to the rendezvous only after Start camera or
  Connect is chosen. It carries WebRTC descriptions and host candidates,
  never video. The encrypted control channel carries the viewer note and
  approval; video is added only after approval. Both peers configure no STUN
  server or TURN relay and filter remote descriptions and candidates too.
  WebRTC media is outside CSP's connect-src. The existing worker source is
  workers/rendezvous/worker.js; it keeps no media or room content."""
pledge = """
    Your camera video goes directly to the one viewer you approve over an
    encrypted WebRTC connection. Our introduction service carries connection
    negotiation, never the video or the viewer's note. There is no recording
    feature and no microphone request. Stop, hide or close the camera page
    and capture ends. Internet access is required for the introduction;
    pairing also reveals network addresses to the other browser."""
live_hint = """
      Watch DevTools while connecting: one WebSocket to the rendezvous carries
      setup messages. Camera frames and the viewer's note travel the encrypted
      peer connection. The page stays available offline; pairing needs internet."""
read_first = """
, <code>src/capture.js</code> for permission cancellation and track cleanup,
      and <code>src/session.js</code> for approval before video and host-only
      connection policy. The introduction service source is
      <code>workers/rendezvous/worker.js</code> in the same repository"""
howto_heading = "How to watch another device's camera"
card = "A phone or computer camera in another browser, with one approved viewer and direct encrypted video."

