#
# GIF Splitter
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "split-gif"
name = "GIF Splitter"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "GIF&nbsp;Splitter <span class=\"h1-kw\">&mdash; every frame as its own PNG</span>"
tagline = "Every frame out as its own PNG."
icon = "&#128209;"         # the mark beside the page heading
favicon = "&#128209;"      # the tab icon, drawn into an inline SVG
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "gif"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

# Shared modules this tool asks for. The same arrangement as css_parts, and for
# the same reason: a component more than one tool needs and no tool should own.
# file-picker brings in the drop zone.
js_parts = ["file-picker", "zip", "crc32"]
lastmod = "2026-08-27"

# --- what search engines and chat apps are told ------------------------------

title = "GIF Splitter &mdash; Every Frame as a PNG, Free and No Upload"
description = "Split an animated GIF into its frames and save each one as a PNG, free and entirely in your browser. Keeps the transparency and the timing. Nothing is uploaded, and it works offline."
og_title = "GIF Splitter &mdash; take an animation apart, in your browser"
og_description = "Every frame of a GIF as its own PNG, with the delays and the transparency intact. The file is read on your own machine and never uploaded."
og_image_alt = "GIF Splitter - every frame of a GIF as its own PNG"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Every frame of an animation as its own PNG, with the timing written down."

# --- the pledge block --------------------------------------------------------

pledge = """
    The GIF is read, decompressed and drawn by your own browser, and every PNG is
    encoded in memory on this machine. There is no server on the other end of this
    page to send an animation to even if anything here wanted to."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and split a
      GIF. Not one request carries an image, a frame, or a filename. Or unplug from
      the internet and split one anyway."""

