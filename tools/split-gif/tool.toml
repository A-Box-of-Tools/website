[[privacy]]
title = "Your GIF has nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your files
      could be collected at, and nothing in the code that would send them if there
      were. This used to read <code>connect-src 'none'</code>, which was absolute;
      adding advertising cost that, and saying so is part of the deal."""

[[privacy]]
title = "The GIF reader is two files in this repository."
body = """
 A browser will
      play a GIF but will not hand you its parts, so the format is read out here:
      <code>src/gif.js</code> is the container and the LZW decompressor,
      <code>src/compose.js</code> is the disposal rules that decide what each frame
      looks like once the ones before it are underneath. Nothing is fetched to
      open a file, and there is no engine downloaded on first use."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google. Neither is handed anything about your
      animation: not a file, not a frame, not a name, a size, or a count. Every
      line that reads, decompresses, draws or encodes a picture is served from this
      origin and listed in the repository."""

[[privacy]]
title = "What the donate button loads, and what it is not given."
body = """

      The "Buy me a coffee" button in the header is drawn by a script from
      cdnjs.buymeacoffee.com and letters itself from Google Fonts. It is a link
      and nothing more: it reports no visit, and it is handed nothing about
      you or your files. Nothing happens unless you click it, and what you
      would be clicking through to is somebody else's site."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and every part of this
      page still works. That is the simplest proof of all: a tool that sent your
      animation away to be taken apart would stop the moment you unplugged."""

[[howto]]
title = "Choose the GIF."
body = """
 Drop it onto the picker, or select it by
      hand. It is read straight off your disk by the browser, and the page tells
      you what it found: the size, the frame count, how long it plays and how
      many times it repeats."""

[[howto]]
title = "Decide what each PNG should hold."
body = """
 <strong>The
      frame as it appears</strong> is what almost everybody wants: the whole
      picture at that moment of the animation. <strong>Only the pixels that
      frame stores</strong> is the patch the file actually carries, at its own
      size and in its own place, which is how a GIF stays small and is not what
      the animation looks like."""

[[howto]]
title = "Decide what happens to the transparency."
body = """
 PNG keeps
      it, which is the honest default. Fill it with a colour instead if the
      frames are headed somewhere that ignores transparency and would otherwise
      turn it black."""

[[howto]]
title = "Pick the frames you want."
body = """
 All of them by default.
      "Keep every second frame" thins a long recording out, and the tick boxes
      on the grid override it &mdash; the numbering never changes, so frame 42
      is called frame 42 however few of its neighbours you kept."""

[[howto]]
title = "Download them."
body = """
 One frame at a time from the grid, or
      all of them as a single ZIP so there is one save prompt instead of
      hundreds. The ZIP can carry a <code>frames.txt</code> listing how long
      each frame was held, which is the one thing a folder of PNGs cannot say
      on its own."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is my GIF uploaded anywhere?"
a = """
        No. The file is read, decompressed and drawn by your own browser on your
        own hardware, and every PNG is encoded here in memory. There is no server
        side to this tool, and the page's <code>Content-Security-Policy</code>
        names every address it may contact &mdash; none of them belongs to this
        site. Unplug from the network and it still splits GIFs."""

[[faq]]
q = "Why does one frame look like a small piece of the picture?"
a = """
        Because that is what the file holds. A GIF is a first picture followed by
        patches: each later frame stores only the rectangle that changed, and
        everything else on screen is what the frames before it left there. A
        talking head against a still wall therefore stores a face per frame
        rather than a picture per frame, which is the whole reason the format is
        not enormous.
        <br><br>
        You are seeing that because "Only the pixels that frame stores" is
        selected. Switch to "The frame as it appears" and every PNG is the whole
        picture as the animation looks at that moment."""

[[faq]]
q = "Does it keep the transparency?"
a = """
        Yes. GIF transparency is a single bit &mdash; a pixel is either painted
        or invisible, with nothing in between &mdash; and PNG stores exactly
        that, so the frames come out with their transparent areas intact. If you
        would rather have a solid background, set "Transparent areas" to fill
        with a colour; that is written into the PNG and cannot be undone
        afterwards."""

[[faq]]
q = "Why are the frame delays not the numbers I expected?"
a = """
        A GIF stores each delay in hundredths of a second, and browsers have
        clamped anything under two of them to a tenth of a second since the
        1990s &mdash; a rule written for the spinning globes of the time and
        never removed. So a frame whose file says 0.01s is played at 0.10s
        everywhere. This tool shows the delay as it is really played, and says
        what the file stores next to it when the two differ."""

[[faq]]
q = "Can I put the frames back together again?"
a = """
        Yes, with the <a href="../gif-maker/">GIF Maker</a> on this site or with
        anything else that takes a folder of images. That is what the
        <code>frames.txt</code> in the ZIP is for: splitting an animation throws
        away the timing, because a PNG has nowhere to record how long it was
        held, so the list carries each frame's delay and position out with
        it."""

[[faq]]
q = "What formats can the frames be saved in?"
a = """
        PNG, and deliberately only PNG. A GIF frame is at most 256 colours with
        one bit of transparency; PNG stores that exactly and losslessly, while
        JPEG would throw the transparency away, invent colours the frame never
        had, and usually make a <em>larger</em> file out of flat artwork. If you
        need JPEGs, convert the PNGs afterwards with the
        <a href="../resize-image/">Image Resizer</a>."""

[[faq]]
q = "Is there a limit on how many frames it will read?"
a = """
        There is no fixed limit. The practical ceiling is your own machine's
        memory: a GIF expands to about one byte per pixel per frame while it is
        being read, so a small file can be a very large amount of memory, and
        this page stops reading rather than letting the tab die. If that happens
        it says so and hands back the frames it did get."""

[[faq]]
q = "Will it open a damaged GIF?"
a = """
        Usually. Truncated downloads, a missing end marker and a last frame that
        stops mid-stream are all common, and a reader that refuses them is
        useless for exactly the files people most want taken apart. Whatever
        frames are complete come back, with a note saying what was wrong. Only a
        file that is not a GIF at all is refused outright."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, and there is no account, no sign-in and no trial. There is no
        watermark on the frames either. The site carries advertising, which is
        what pays for it; the ads are not given anything about your files."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your animation away to be processed would stop
        the moment you unplugged."""

[schema]
category = "MultimediaApplication"
description = "Split an animated GIF into its frames and save each one as a PNG. The file is decompressed in your browser, so no animation is ever uploaded."
features = [
  "Every frame of a GIF as its own PNG, with the transparency kept",
  "The frame as it appears, or only the pixels that frame stores",
  "Per-frame delay, position, size and disposal shown for every frame",
  "Keep every second or every fifth frame, or tick the ones you want",
  "One ZIP for the lot, with an optional timing list for rebuilding the animation",
  "Runs offline; no upload, no account, no watermark",
]

