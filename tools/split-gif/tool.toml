      reach the network."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to split a GIF into frames"

# --- the card on the hub page ------------------------------------------------

card = """
            Take an animation apart: every frame as its own PNG, with the
            transparency kept and the timing written down. The GIF is
            decompressed on your own machine."""

