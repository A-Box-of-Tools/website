slug = "stack-images"
name = "Image Stacker"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Image&nbsp;Stacker <span class=\"h1-kw\">&mdash; combine a burst, RAW files included</span>"
tagline = "Twenty frames into one, without twenty uploads or a RAW converter."
icon = "&#128450;&#65039;"  # the mark beside the page heading
favicon = "&#128450;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "layers"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "images"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress", "results", "form", "notes"]

# Shared modules this tool asks for. Only the drop zone: the list underneath it
# is this tool's own, because a row in it carries what was found inside a RAW
# file rather than what the operating system said about the file.
js_parts = ["file-picker", "message-box", "example-photo"]
# Where a finished result can be carried without being saved first: the row of
# links shared/handoff.js shows beside the download once there is one. Slugs of
# tools whose picker takes what this page produces; checked against the tools
# that exist by the build.
handoff = ["compress-image", "resize-image"]
lastmod = "2026-10-08"

# --- what search engines and chat apps are told ------------------------------

title = "Image Stacker &mdash; Average, Median &amp; Focus Stack in Your Browser"
description = "Combine a burst of photographs into one: average them to kill noise, take the median to remove people from a scene, lighten for star trails, or focus stack a macro shot. Reads CR2, NEF, ARW, DNG, RAF and CR3 by pulling out the camera's own preview. Runs entirely in your browser."
og_title = "Stack a burst of photographs, RAW files included"
og_description = "Average, median, sigma-clip, lighten, darken, add or focus stack &mdash; with the frames aligned first. RAW files are opened from the camera's embedded JPEG preview when one is available, without decoding the sensor data. Nothing is uploaded."
og_image_alt = "Image Stacker - several frames combined into one, in the browser"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Twenty frames become one. The noise averages away; the tourists do not survive the median."

# Appended to the Content-Security-Policy comment in the generated page, for
# whatever this tool needs that the rest of the site does not.
csp_note = """
  worker-src is named explicitly because this is the only tool here that runs
  its work in a Worker, and a directive that is merely inherited is one nobody
  reading the policy can see was intended. It is 'self' and nothing else: the
  worker is a file in this folder, cached by the service worker beside it.

  connect-src carries blob: for the other reason a directive is named here: the
  carry-on row reads the stacked image back out of this page before parking it
  for the next tool. blob: names bytes inside this page; neither directive
  gains any reach over the network."""

