[[privacy]]
title = "Your photographs have nowhere to go."
body = """
 The
      Content-Security-Policy names every address this page may contact, and not
      one of them belongs to this site. There is no endpoint here that your files
      could be collected at, and nothing in the code that would send them if there
      were &mdash; no <code>fetch</code>, no <code>XMLHttpRequest</code>, no
      <code>sendBeacon</code>, in <code>src/</code> or in the worker."""

[[privacy]]
title = "RAW previews are read on this machine."
body = """
  Many camera RAW files
      contain a JPEG preview rendered by the camera. This tool finds the largest
      usable one by walking the file's directories and taking a slice. The
      inspection-read figure counts the headers and directories read to find and
      describe it; decoding reads the JPEG slice too. The sensor data is never
      decoded, and the row shows the preview's actual dimensions."""

[[privacy]]
title = "The work happens in a Worker on this machine, not on a server."
body = """
 This is the
      only tool here that uses one, because stacking is minutes of arithmetic
      rather than seconds and a frozen page cannot show progress or be cancelled.
      A Worker is a second thread in this same browser &mdash; see
      <code>src/worker.js</code>. It is handed the files themselves, which is
      free, because a file handle is not the bytes; and it has exactly the same
      Content-Security-Policy as the page, which is to say nowhere to send them."""

[[privacy]]
title = "Nothing about the set is reported anywhere."
body = """
 How many frames you
      stacked, what camera wrote them, how far each one had moved, which method
      you chose and how long it took are held in this page's memory until you
      close it. There is no custom analytics event in this repository that
      carries any of it, and the one question this site asks after a download
      sends a thumb up or down and the name of the tool, nothing else."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. The worker and
      every module it loads are cached by this page's own service worker, so an
      installed copy stacks RAW files with the network unplugged."""

[[howto]]
title = "Choose the frames."
body = """
  A burst, an
      intervalometer sequence, or a folder of RAW files with usable JPEG previews.
      Wait for the files to finish opening. Each row tells you what came out of it
      &mdash; for a RAW file, the camera and the actual size of the embedded
      preview. Files that could not be opened are listed so you can check what was
      left out."""

[[howto]]
title = "Pick the method that matches what you are trying to lose."
body = """
  Noise:
      average, or sigma-clip to reject values that differ from the rest. People,
      cars or a passing aeroplane: median, provided they cover any given part of
      the scene in fewer than half the frames. A dark sky you want turned into
      star trails: lighten. A macro shot taken along the focus ring: focus
      stacking. The note under the menu explains the method and its limits."""

[[howto]]
title = "Decide whether the frames need aligning."
body = """
 Hand-held: yes,
      shift only. Hand-held and you were also turning: shift, rotation and scale.
      Locked-off tripod or an intervalometer: no, and it will be quicker. Every
      frame is measured against the one marked as the reference, which is the
      first one until you say otherwise: &ldquo;use as reference&rdquo; moves the
      mark and leaves the list in the order you put it in."""

[[howto]]
title = "Read the four figures, then press the button."
body = """
  Before anything
      runs, the page shows the planned result size, estimated working memory, planned
      stacking decodes and bytes read during inspection. Browser internals and
      garbage collection can add memory beyond the modeled buffers; the figures are a plan, not a guarantee of the
      browser's total use. If the stack needs bands, the page suggests a smaller
      working resolution. After the run, compare the reference with the result at
      actual pixel size and check the alignment details before downloading."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Are my photographs uploaded anywhere?"
a = """
        No. Every frame is opened, decoded, aligned, stacked and written by your
        own browser on your own hardware. This tool has no network feature of any
        kind &mdash; it never fetches anything and never sends anything &mdash;
        and the page's <code>Content-Security-Policy</code> names every address it
        may contact, none of which belongs to this site. Load the page once,
        unplug from the internet, and it still works. That matters more here than
        on most tools simply because of the volume: a stack of twenty RAW frames
        is about a gigabyte, and uploading a gigabyte of photographs to have an
        average taken of them is the thing this tool exists to avoid."""

[[faq]]
q = "Which RAW formats can it read, and how?"
a = """
        <span id="faq-raw"></span>CR2, CR3, NEF, NRW, ARW, SR2, SRF, DNG, ORF,
        RAF, RW2, PEF, SRW, 3FR, IIQ, DCR, KDC, MRW, MEF, RWL and related
        formats are supported when the file contains a usable JPEG preview. The
        tool walks the file's directories and uses the largest preview it can
        find, which may be smaller than the sensor image or absent altogether.
        <strong>It does not decode the sensor data.</strong> The pixels carry
        the camera's white balance and picture style at eight bits a channel.
        Check the dimensions shown in the row; the inspection-read count covers
        headers and directories, and decoding also reads the JPEG slice."""

[[faq]]
q = "Then why not decode the sensor data properly?"
a = """
        Sensor decoding would require a RAW engine such as LibRaw or dcraw,
        with its camera-specific compression schemes. Using an embedded JPEG
        keeps this tool small and uses the browser's own image decoder. It also
        means using the camera's rendering and whatever preview resolution the
        file contains. To choose your own RAW development settings, develop the
        frames first and export JPEG or PNG files to stack here."""

[[faq]]
q = "How many frames can it handle, and how large?"
a = """
        Six of the seven methods have accumulators whose size does not grow
        with the frame count. Average, lighten, darken, add and focus stacking
        need one stacking pass per band; sigma clipping needs two. Median holds
        every frame's values for the current band, so its memory grows with the
        frame count. Any method can be split into bands when its working buffers
        exceed the tool's budget, which means decoding the frames again for each
        band. The page estimates those buffers and shows the planned stacking
        decodes. Inspection and alignment add work, and browser codec and GPU
        internals can need memory beyond the estimate."""

[[faq]]
q = "What does aligning the frames actually do?"
a = """
        It finds how far each frame moved relative to the reference frame and
        moves it back, to a fraction of a pixel. The method is phase correlation:
        the shift between two pictures shows up as a phase difference between their
        spectra, so one Fourier transform each finds a two-hundred-pixel offset as
        cheaply as a two-pixel one. The second setting also recovers rotation and
        scale, by the same trick applied to the spectrum in log-polar coordinates.
        All of it is global &mdash; one shift, one angle, one scale for the whole
        frame &mdash; so it corrects a camera that moved and cannot correct a
        subject that moved, or a photograph taken from a step to the left. One
        visible consequence: a frame moved twenty pixels left no longer reaches
        the right-hand edge, so the result is trimmed to the part every frame
        covers. That is why an aligned stack comes back very slightly smaller
        than the frames that went into it, and it is the only alternative to a
        dark border made of the frames that were not there."""

[[faq]]
q = "Which method should I use?"
a = """
        <strong>Average</strong> for noise, on a set where nothing moved:
        independent random noise falls by roughly the square root of the frame
        count. <strong>Median</strong> to remove things that cover a given part
        of the scene in fewer than half the frames. <strong>Sigma clipping</strong>
        averages values near their mean and rejects values outside the chosen
        threshold. It can retain moving objects in small sets or when they appear
        often, so median is the safer choice when removing them is the priority.
        <strong>Lighten</strong> for star trails, fireworks and light painting.
        <strong>Darken</strong> to remove bright things that moved.
        <strong>Add</strong> for additive blending of the decoded frames; this
        works on eight-bit image values, so it does not model a longer camera
        exposure. <strong>Focus stacking</strong> for a macro shot taken along
        the focus ring."""

[[faq]]
q = "Why is my result eight bits when my RAW files are fourteen?"
a = """
        The RAW input is the camera's JPEG preview, and the output is an
        eight-bit PNG or JPEG. Average and sigma clipping use wider accumulators
        and round at the end, which helps estimate a cleaner value from noisy
        frames without rounding each intermediate step. The saved image still
        has eight bits a channel; it does not gain the bit depth or dynamic range
        of linear sensor data."""

[[faq]]
q = "Can I stack frames of different sizes, or from different cameras?"
a = """
        Yes, though check that you meant to. The largest frame defines the
        working box; other frames are scaled to fit and centred. The saved result
        is cropped to the area the frames share, so different shapes or alignment
        can make it smaller than the planned box. Mixing cameras also mixes their
        colour rendering. Keep the exposure and framing consistent if you want a
        useful average, and use the reference comparison to inspect the result."""

[[faq]]
q = "It says the run will be banded. What does that mean?"
a = """
        That the working memory the method needs is more than the tool is willing
        to allocate in one go, so the picture will be cut into horizontal strips
        and stacked a strip at a time. It still produces exactly the same result;
        it just reads the frames again for each strip, so it takes longer, and the
        page tells you how many decodes that will be. Dropping the working
        resolution one step cuts the memory by four, which almost always turns a
        banded run into a single pass &mdash; the note says which setting would do
        it."""

[[faq]]
q = "Why does this tool use a Worker when none of the others do?"
a = """
        Because it is the only one whose work is measured in minutes. Every other
        tool here does something that takes a second or two, where moving the work
        off the main thread would be ceremony. Stacking twenty large frames is
        solid arithmetic over hundreds of megabytes, and on the main thread that
        means a frozen page: no progress bar moving, a Cancel button that does not
        answer, and eventually a browser offering to kill the tab. The Worker is a
        second thread in this same browser, running a file from this same folder,
        under this same policy. It is not a server and it is not a network
        feature."""

[[faq]]
q = "Is it free, and do I need an account?"
a = """
        It is free, with no account, sign-in, trial or watermark. There is no
        service quota on the number or size of frames. The practical limits are
        your device's memory, the browser's canvas and decoder limits, and the
        time the stack takes. The site carries advertising, which pays for it;
        the ads are not given anything about your photographs."""

[schema]
category = "MultimediaApplication"
description = "Stack a burst of photographs in the browser: average, median, sigma-clipped mean, lighten, darken, add or focus stack, with the frames aligned first by phase correlation. Reads camera RAW files with usable embedded JPEG previews, without decoding sensor data. Nothing is uploaded."
features = [
  "Seven stacking methods: average, median, sigma-clipped mean, lighten, darken, add and focus stacking",
  "Reads CR2, CR3, NEF, ARW, DNG, ORF, RAF, RW2 and more when a usable embedded JPEG preview is available",
  "Finds RAW previews through small directory and header reads, then decodes the JPEG slice",
  "Automatic alignment: shift only, or shift with rotation and scale, or none",
  "Sub-pixel alignment by phase correlation, not by searching offsets",
  "Six methods have accumulators whose size does not grow with the frame count; median holds values per frame",
  "Estimated working memory and planned stacking decodes shown before the run starts",
  "The work runs in a Worker, so progress moves and Cancel answers",
  "PNG or JPEG out; runs offline; no upload, no account",
]

# This tool needs one directive the rest of the site does not: worker-src, for
# the Worker the stacking runs in. It is 'self' - a file in this folder, cached
# by the service worker beside it - and there is no blob: on it, because nothing
# here ever builds a script at runtime. A tool can only widen its own page this
# way; it cannot narrow the site policy and cannot touch another tool's.
# The carry-on row reads the finished result back out of this page's own
# blob: URL before parking it for the next tool (see shared/handoff.js), and
# reading a blob: URL is a fetch the policy has to permit. blob: names bytes
# inside this page; nothing here gains any reach over the network.
[csp]
"connect-src" = ["blob:"]
"worker-src" = ["'self'"]

# The drop zone. Rendered by templates/partials/file-picker.html, which
# body.html includes, and driven by src/shared/file-picker.js.
#
# The accept list names the RAW extensions one at a time because a browser's
# file dialog matches on extension and the operating system does not agree that
# a .CR3 is an image/*. Leaving it at image/* hides every RAW file in the folder
# somebody opened the dialog to find.
[picker]
accept = "image/*,image/avif,.cr2,.cr3,.crw,.nef,.nrw,.arw,.srf,.sr2,.dng,.orf,.raf,.rw2,.pef,.srw,.erf,.mrw,.dcr,.kdc,.mos,.iiq,.3fr,.rwl,.mef,.avif"
multiple = true
title = "Drop the frames here"
hint = "or click to browse &mdash; JPEG, PNG, WebP, AVIF and camera RAW with JPEG previews"
# Six frames of one scene differing only in grain, which is what a
# burst in poor light actually is, and the one input whose result can be
# checked by eye.
example = true
