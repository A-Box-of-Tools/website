#
# GIF to MP4
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is that the video keeps the GIF's timing frame for frame. A GIF
# has no frame rate, only a delay on each frame, and those delays vary; a
# converter that resamples on to a fixed rate doubles some frames and drops
# others, and a slideshow comes out wrong. Here each frame is one sample
# whose duration is its delay, and the check counts the frames back.
#
# The second is honesty about what changes: a GIF loops by itself and a
# video does not (the player decides), and a GIF can let what is under it
# show through where a video cannot (the page asks what colour goes there).
# Both are said on the page rather than discovered afterwards.
#

slug = "gif-to-mp4"
name = "GIF to MP4"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "GIF&nbsp;to&nbsp;MP4 <span class=\"h1-kw\">&mdash; the same animation at a tenth of the size</span>"
tagline = "Every frame, with the delay the GIF gave it, as H.264 in an MP4. Converted on your machine; the file never goes up."
icon = "&#127902;"                  # the film frames, beside the page heading
favicon = "&#127902;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "film"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "gif"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works, and
# results carries the file name and size lines the other tools use.
css_parts = ["progress", "form", "notes", "results"]

# file-picker brings in the drop zone. gif-decode and gif-compose are the
# splitter's reader and its replay of the disposal rules, moved to shared
# parts for this tool; mp4-muxer and mp4-boxes write the one H.264 track a
# GIF becomes, mp4-reader reads it back for the check, and video-support,
# codec-support and webcodecs are the questions asked of the browser's
# encoder and the wait that keeps the feed loop behind it. format is sizes
# and durations as words, and errors is the cancellation every page ignores
# by name.
#
# example-gif and example-photo are for the example alone: the animated GIF
# the splitter and the analyser demonstrate on, drawn in the page.
js_parts = ["file-picker", "gif-decode", "gif-compose", "mp4-muxer", "mp4-boxes", "mp4-reader", "video-support", "codec-support", "webcodecs", "message-box", "format", "errors", "example-gif", "example-photo"]
# Where a finished result can be carried without being saved first: the row
# of links shared/handoff.js shows under the result once there is one. A
# GIF made into a video is often then too big for where it is going, or
# wants a piece cut out.
handoff = ["compress-video", "trim-video"]
lastmod = "2026-09-13"

