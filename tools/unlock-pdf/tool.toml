#
# Unlock a PDF
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# TWO THINGS TO HOLD ON TO WHILE EDITING ANY OF THE PROSE BELOW.
#
# The first is that "protected" means two different things and this page must
# never let them blur. A document with an *open password* cannot be read by
# anybody who does not have it, and nothing here will find one. A document with
# *restrictions* opens for everybody and merely asks readers not to print or
# copy it - a request enforced by agreement between well-behaved programs, not
# by cryptography, and documented as such by Adobe from the beginning. The
# second is by far the commoner case, and it is the one this tool answers with
# a single click and no password at all. Every sentence here is written so that
# somebody who knows the format cannot catch it overstating either.
#
# The second is that this tool does not guess passwords. There is no loop
# anywhere in src/, and the page says so rather than leaving it to be inferred.
# A 40-bit RC4 key genuinely would fall to a search, which is exactly why the
# refusal has to be stated instead of implied.
#

slug = "unlock-pdf"
name = "PDF Unlocker"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Unlock&nbsp;PDF <span class=\"h1-kw\">&mdash; take off the password and the restrictions</span>"
tagline = "Most locked PDFs need no password at all. This one says which kind you have before it touches it."
icon = "&#128273;"                  # the key, beside the page heading
favicon = "&#128273;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "file-key"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "documents"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works, and
# results carries the file name and size lines the other PDF tools use.
css_parts = ["progress", "form", "checks", "notes", "results"]

# file-picker brings in the drop zone. The four pdf-* parts the compressor, the
# merger and the redactor also ask for are the PDF itself - the object grammar,
# the stream filters, the reader and the writer - and travel together, because
# the reader and the writer import the other two.
#
# pdf-crypt is the standard security handler, aes and rc4 its two ciphers, and
# pdf-permissions is /P as a list. All four were this tool's own until
# /protect-pdf/ needed the other half of the same file - the export that
# builds an /Encrypt dictionary rather than reading one - and a second copy
# is what tests/python/test_duplicates.py exists to refuse, so they moved.
#
# md5 and hash-blocks are the checksum tool's MD5, which moved to shared/js
# when this tool needed one: every version of PDF encryption before 2017
# derives its key by running the password through MD5 a few dozen times, and no
# browser offers one. The SHA family this needs for PDF 2.0 comes from
# crypto.subtle instead.
#
# pdf-page-writer and example-statement are for the example alone: it has to be
# a document that really is locked, which means writing one.
js_parts = ["file-picker", "pdf-objects", "pdf-filters", "pdf-reader", "pdf-writer", "pdf-crypt", "aes", "rc4", "pdf-permissions", "message-box", "format", "md5", "hash-blocks", "pdf-page-writer", "example-statement"]
# Where a finished result can be carried without being saved first: the row
# of links shared/handoff.js shows under the result once there is one. This
# tool is the way IN to the PDF chain - every tool that refuses a locked file
# sends its reader here - so it needs a way out, or the journey ends on a
# download and a second upload to the tool they wanted in the first place.
handoff = ["merge-pdf", "compress-pdf", "redact-pdf"]
lastmod = "2026-09-12"

