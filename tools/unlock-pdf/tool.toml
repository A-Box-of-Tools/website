og_title = "Unlock a PDF without uploading it anywhere"
og_description = "Most \"protected\" PDFs open for anybody and only ask readers not to print or copy them. This removes that, in your browser, and tells you what the protection was actually worth."
og_image_alt = "Unlock a PDF in your browser, without uploading it"

