[[privacy]]
title = "A list of people is not a small thing to hand over."
body = """
 Most
      height charts want an account, and the ones that do not still have a
      server that sees every name and number you type. What you are typing here
      is who is in your family and how tall each of them is, often with a
      child's age implied by the figure beside the name. None of it is sent
      anywhere, because there is nowhere here for it to go."""

[[privacy]]
title = "Nothing here fetches anything."
body = """
 There is no
      <code>fetch</code>, no <code>XMLHttpRequest</code> and no
      <code>sendBeacon</code> anywhere in <code>src/</code>. The
      Content-Security-Policy names every address this page may contact, and
      not one of them belongs to this site."""

[[privacy]]
title = "Nothing is remembered between visits, either."
body = """
 The
      chart lives in the page and nowhere else. Close the tab and the list is
      gone: there is no account holding it, no cookie carrying it, and nothing
      written into this browser's storage &mdash; which is also why a chart you
      want to keep is a chart you download."""

[[privacy]]
title = "The link does not carry the chart."
body = """
 Several tools like this one
      put the whole list into the address bar so it can be shared, which turns
      every name and height into something logged by whatever the link passes
      through &mdash; a chat server, a mail scanner, somebody's browser history.
      The address of this page never changes as you type."""

[[privacy]]
title = "The PNG is made from the SVG that is on screen."
body = """
 The
      download is not a second rendering that might disagree with the preview.
      The same markup is handed to the browser and painted onto a canvas, which
      is also why it can be done with the network unplugged: there is no font to
      fetch and no image to load inside it."""

[[privacy]]
title = "A picture you add is read here, and never sent."
body = """
 The file
      never leaves this page &mdash; it is read with the browser's own
      <code>FileReader</code> and parsed into an inert document that runs
      nothing. What is drawn is not that file: <code>src/import-svg.js</code>
      builds a NEW drawing out of a whitelist of shapes and geometry, so a
      script, a stylesheet, a font, a linked image or a reference to another
      document is left behind rather than carried through. That matters twice
      over, because the chart you download is a file you send to other people:
      anything that survived would be their browser calling a stranger's server,
      days later, from something this page wrote.

      A photograph or a PNG is not a program and has nothing to rebuild: the
      browser's own decoder reads it, and it is redrawn onto a canvas here
      before it goes on the chart. That redrawing is what leaves the file's
      metadata behind &mdash; the camera, the place, the profile, whatever was
      in it &mdash; because none of that survives a canvas. What ends up in the
      chart is a picture this page encoded, written in as data rather than as
      an address, so the chart still points at nothing."""

[[privacy]]
title = "The artwork is here, not fetched."
body = """
 All four figures
      are public-domain artwork, and they are served from this origin with the
      rest of the page &mdash; no icon font, no CDN, no sprite sheet pulled off
      somebody else's server as you type. It is also why the chart still draws
      with the network unplugged."""

[[privacy]]
title = "What Google loads, and what it is not given."
body = """
 The ad and
      measurement scripts come from Google, and the donate button from Buy Me a
      Coffee. None of them is handed a name or a height. Every line that turns
      your list into a picture is served from this origin and listed in the
      repository."""

[[privacy]]
title = "It works offline."
body = """
 Disconnect from the network and the tool
      is unchanged, because there was never a network step in it. That is the
      simplest proof of all."""

[[howto]]
title = "Add everybody first, then worry about how it looks."
body = """
 A row is a
      figure, a name, a height and a colour. The name is optional &mdash; a
      chart of two unnamed silhouettes with their heights over them is often
      exactly what somebody wants &mdash; and the arrows on each row move it
      left or right if the order matters."""

[[howto]]
title = "Type the height however you write it."
body = """
 <code>173</code>,
      <code>1.73 m</code>, <code>5'8"</code>, <code>68 in</code> and
      <code>5 ft 8</code> are all read correctly. The line under the box shows
      what was understood, in both systems, so a misread is visible before it
      is drawn rather than after it is printed. A bare number is centimetres on
      a metric chart and inches on an imperial one, and a bare number under
      three is metres &mdash; nobody is 1.73 cm tall."""

[[howto]]
title = "Pick the figure that matches the person."
body = """
 A child is
      about six head-heights tall and an adult seven and a half, so a child
      drawn as a shrunken adult looks wrong in a way that is hard to name and
      easy to see. The boy and the girl are drawings of actual children rather
      than adults made small, which is most of what makes a family chart look
      like a family. Every row also arrives with a height already in it, so
      adding somebody draws somebody &mdash; type straight over it."""

[[howto]]
title = "Put something familiar on the chart."
body = """
 A number is abstract and a
      doorway is not. Adding one object of a size everybody knows &mdash; a
      door, a window, a classroom whiteboard, a vending machine &mdash; is what
      turns a chart that states two heights into one that shows them. The menu
      holds twenty of them, grouped, and every one becomes an ordinary row you
      can type your own numbers over. Objects take a width as well as a height,
      so a door is 203 by 81 rather than a stripe."""

[[howto]]
title = "Or put your own drawing on it."
body = """
 <strong>Add your own
      picture</strong> takes a file from your machine and puts it on the ruler at
      whatever height you give it &mdash; the thing to reach for when the chart
      is about a product, a vehicle or a building rather than a person. An SVG
      is drawn in the row's own colour like every other figure; a photograph or
      a PNG goes on as itself. Either keeps its own proportions, and either is
      read here rather than sent anywhere."""

[[howto]]
title = "Set the ruler to the units your reader thinks in."
body = """
 Switching
      between centimetres and feet rewrites what is in the boxes rather than
      reinterpreting it, so the chart itself does not move &mdash; only the
      notation does. If the chart is for two audiences, the height written above
      each figure is in the chart's unit and the line under each box has both."""

[[howto]]
title = "Take the PNG for pasting, the SVG for printing."
body = """
 The PNG is a
      picture at the pixel height you set, which is what a chat window, a
      document or a slide wants. The SVG is the chart as instructions, so it
      prints sharp at any size and can still be recoloured afterwards by
      anything that opens vectors."""

# Each answer renders twice: as the <details> block at the foot of the page, and
# as FAQPage structured data in the head. The build derives the plain-text half
# from this HTML, so the two cannot disagree - which they could, and once did,
# when both were written out by hand.

[[faq]]
q = "Is anything I type sent anywhere?"
a = """
        No. The chart is drawn by JavaScript in this page, on your own machine,
        and this tool has no network feature of any kind &mdash; it never
        fetches anything and never sends anything. The page's
        <code>Content-Security-Policy</code> names every address it may contact,
        none of which belongs to this site. That is worth saying plainly here
        because the input is a list of people's names and how tall each of them
        is, which is more personal than most of what this site handles."""

[[faq]]
q = "Can I download the chart?"
a = """
        Yes, as a PNG or as an SVG, with no watermark and no account. The PNG is
        drawn at whatever pixel height you set and is the one to paste into a
        document, a slide or a chat. The SVG is the chart as instructions rather
        than pixels: it prints sharp at any size and can be opened and
        recoloured later in any vector editor. Both are made from the same
        markup that is on screen, so neither can disagree with the preview."""

[[faq]]
q = "How do I write the height &mdash; centimetres or feet?"
a = """
        Either, in any row, whichever way you normally write it.
        <code>173</code>, <code>173 cm</code>, <code>1.73 m</code>,
        <code>5'8"</code>, <code>5 ft 8 in</code> and <code>68 in</code> are all
        understood, and the line under the box shows what was read in both
        systems. A bare number is centimetres when the chart is metric and
        inches when it is imperial; a bare number under three is taken as
        metres, because 1.73 cm is not a height anybody types."""

[[faq]]
q = "Why do the children not look like small adults?"
a = """
        Because a child is not one. Body proportions change with age: a
        two-year-old is roughly four and a half head-heights tall, an
        eight-year-old six, an adult seven and a half &mdash; so the head is
        nearly a quarter of a small child and an eighth of a grown-up. The boy
        and the girl here are drawings of actual children rather than one
        silhouette scaled down, which is why a family chart looks like a family
        instead of like four adults at different sizes."""

[[faq]]
q = "Where do the figures come from?"
a = """
        All four are artwork by other people, all of it in the public domain:
        the man by pitr, the woman by Madeleine Price Ball, the girl by
        OpenClipart-Vectors, and the boy by Ryan Kissinger for the NIH BioArt
        library. Every file ships with this page in <code>vendor/</code> as it
        was published, so you can check them against the originals. Public domain
        asks for nothing, which is the point: the artwork ends up inside a picture
        you download, and a licence needing attribution would attach that
        requirement to your chart."""

[[faq]]
q = "Can I put my own picture on the chart?"
a = """
        Yes &mdash; <strong>Add your own picture</strong> takes a drawing or a
        photograph and puts it on the ruler at whatever height you type: a logo,
        a floor plan, a piece of machinery, a car, or a photo of the thing
        itself. Its proportions are its own, so there is no width to fill in.
        <br><br>
        An <strong>SVG</strong> is drawn as one solid colour, the one that row
        is set to, because that is what the rest of the chart is &mdash; so a
        drawing made of thin outlines rather than filled shapes comes out as a
        blob, and this is the wrong tool for it. Only the <em>shapes</em> are
        kept: the file is rebuilt from scratch out of paths and rectangles and
        circles, and anything that could reach the network &mdash; a linked
        image, a stylesheet, a font, a script &mdash; is left behind.
        <br><br>
        A <strong>photo or a PNG</strong> goes on as itself and keeps its own
        colours, so the row's colour only names it. It is redrawn here before it
        goes on, which bounds how much it adds to the chart and leaves the
        file's metadata behind. Transparency is kept, so a cut-out stands on the
        ruler cleanly &mdash; and a photo brings its background with it, which is
        worth cropping off first.
        <br><br>
        Neither file goes anywhere. That matters twice over, because the chart
        you download is a file you might send to somebody else."""

[[faq]]
q = "Why is there no toddler or baby?"
a = """
        Because nobody has drawn one and put it in the public domain. Wikimedia
        Commons has exactly one usable free child &mdash; the girl &mdash; and
        the NIH BioArt library the boy; below school age the search comes back
        empty, and every coherent free set of people is a restroom pictogram the
        same shape at every age, which is the mistake this whole tool is built
        to avoid. There was a toddler built by this page's own code for a while,
        and it was the only figure on the chart nobody had drawn: it looked it,
        standing next to four that somebody had. For anybody smaller than the
        boy or the girl, set one of them to the real height &mdash; the ruler is
        what carries the comparison, and it will be right."""

[[faq]]
q = "How many people can I put on one chart?"
a = """
        Twelve. That is not a technical limit &mdash; the drawing would happily
        do thirty &mdash; but past a dozen the columns get narrower than the
        names written over them and the picture stops being readable. If you
        need more, turning the names off gives you back the width, or two charts
        will say it better than one."""

[[faq]]
q = "Can I put an object on the chart?"
a = """
        Yes &mdash; and most of them arrive drawn. The menu holds twenty to
        start from, in four groups: doors and windows, school and office
        (a whiteboard, a desk, a filing cabinet, a projector screen), things
        around town (a vending machine, a wheelie bin, a basketball hoop, a
        20&nbsp;ft shipping container) and things around the house. Seventeen
        of them come with a picture &mdash; a door with a handle, a fridge with
        its freezer above it, a sofa you can see is a sofa &mdash; and the
        picture is fitted to the height and width in the row, so the numbers
        still decide the size and your own numbers typed over them still hold.
        The other three are plain rectangles, because no free drawing of them
        turned out to be both right and correctly proportioned, and a wrong
        drawing is worse than an honest block on a chart about scale.
        <br><br>
        Some of these sizes are genuine standards and some are typical, which
        the page says out loud. One familiar object does more for a chart than
        any number of extra people: it is what turns a comparison into a sense
        of scale."""

[[faq]]
q = "Is there a figure for a dog or a cat?"
a = """
        No, and it is a deliberate gap rather than an oversight. Both were built
        &mdash; in profile, standing with the head level with the shoulder, so
        that the top of the drawing would be the height written beside it, which
        is where every breed standard measures an animal. They did not come out
        well enough to ship: a quadruped seen from the side standing next to
        four people seen from the front reads as a mistake even when the drawing
        is good. A rectangle at the animal's shoulder height is honest in the
        meantime."""

[[faq]]
q = "Can I share the chart with a link?"
a = """
        Not from here, and that is deliberate. Tools that offer it do it by
        putting the whole list into the address, which means every name and
        every height ends up in whatever the link travels through &mdash; a chat
        server's logs, a mail scanner, somebody's browser history, a link
        preview fetcher. Download the picture and send that instead: it says
        the same thing and carries no list with it."""

[[faq]]
q = "Is it free, and can I use the chart commercially?"
a = """
        It is free, there is no account and no watermark, and you can put the
        result in a report, a presentation, a listing or a product. The site
        carries advertising, which is what pays for it. Nothing about a chart
        you make here is owned by us, and nothing is kept."""

[[faq]]
q = "Why is the ruler in tens and not in ones?"
a = """
        Because the spacing is chosen from how many lines the picture can carry
        rather than from a fixed number. A chart of two adults gets a line every
        ten centimetres; put a basketball hoop on it and the lines move to
        twenty-five, because ninety lines on one picture is a grey wash rather
        than a ruler. In feet and inches the ladder is one, three, six and
        twelve inches, so the lines land on whole inches instead of near them."""

[[faq]]
q = "Can I put the chart on a dark slide?"
a = """
        Yes. Set the background to the colour it will sit on and the ruler and
        the writing switch between dark and light to suit it &mdash; worked out
        from the colour's luminance rather than from a guess. Then tick "no
        background at all" if you want the picture itself transparent: the
        colour you chose still decides the ink, so a transparent chart headed
        for a navy slide comes out legible on it."""

[[faq]]
q = "Does it work offline?"
a = """
        Yes. Load the page once, then disconnect from the internet and it keeps
        working. That is also the simplest way to prove nothing is being
        uploaded: a tool that sent your list away to have a chart drawn would
        stop the moment you unplugged."""

