#
# Height Comparison Chart
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The second tool here whose input is typed rather than dropped, after the QR
# generator, so it has no [picker] table either. It does take one optional
# file - a picture of your own to put on the ruler - and that is a bare
# <input type="file"> behind a button rather than the shared picker: the
# picker draws a drop zone and owns a page's main flow, and here the main flow
# is still typing. Two readers sit behind it, and both are worth reading:
# src/import-svg.js, which rebuilds a drawing out of a whitelist because an SVG
# is a program, and src/import-image.js, which has the opposite job - a raster
# is only pixels, so what needs proving there is that the href it WRITES can
# only ever be a picture this page encoded.") What is unusual about it is
# what the input IS: a list of people's names and how tall each of them is,
# which is the most personal thing anything on this site is handed and the
# reason the privacy panel below is written about a list rather than a file.
#
# It needs no [csp] table. The PNG is the page's own SVG painted onto a canvas
# through a blob: URL, and img-src already carries blob: on every tool page -
# see [tool_csp] in config/site.toml.
#
# It is the second tool with a vendor/ folder, after heic-to-jpg, and the first
# whose vendored files are pictures rather than code: every person on the chart
# is public-domain artwork somebody else drew. vendor/LICENSE.md says who, why
# the licence had to ask for nothing rather than merely be free, and why the
# man is smoothed on the way in.
#

slug = "compare-heights"
name = "Height Comparison Chart"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Height&nbsp;Comparison <span class=\"h1-kw\">&mdash; a side-by-side chart you can download</span>"
tagline = "Type the heights, take the picture. Nothing is sent to draw it."
icon = "&#128207;"          # the straight ruler, beside the page heading
favicon = "&#128207;"       # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1 rasterises
# for the share card and the two installed-app icons, which want a filled
# colourful mark rather than a line drawing.
glyph = "ruler"
category = "images"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "beyond"
lastmod = "2026-08-30"

# --- what search engines and chat apps are told ------------------------------

title = "Height Comparison Chart &mdash; Free, No Sign-Up, Nothing Uploaded"
description = "Compare heights side by side. Add a man, a woman, a boy, a girl and objects &mdash; a door, a window, a whiteboard, a vending machine &mdash; in centimetres or feet and inches, and download the chart as a PNG or an SVG. It is drawn in your browser."
og_title = "Compare heights side by side, and keep the picture"
og_description = "Put two adults, a boy, a girl and a doorway on the same ruler, in centimetres or feet and inches, and download the result. No account, no watermark, and no list of names leaving your machine."
og_image_alt = "Height Comparison Chart - compare heights side by side, nothing uploaded"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every card,
# so this is the only part of it that belongs to this tool.
og_card = "Two adults, a child and a doorway on one ruler - drawn on your own machine."

# --- the pledge block --------------------------------------------------------

pledge = """
    A height chart is arithmetic and a drawing: there is no file to send and no
    service to ask &mdash; and the one file this page will take, a picture of
    your own to put on the ruler, is read here and goes nowhere. The man, the woman, the boy and the girl are public-domain
    artwork that ships with this page, and the boy and the girl are drawings of
    actual children rather than adults made small &mdash; which is what stops a
    family chart looking wrong in a way nobody can name. Every step of it
    happens in a few hundred lines of JavaScript in this page that you can
    read. There is no network feature of any kind, which matters here because
    what you type is a list of people and how tall each of them is."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and type
      a name and a height. Not one request carries a character of either. Or
      unplug from the internet and make the chart anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/traced.js</code>
      and <code>vendor/</code> for the four figures and where their artwork came
      from, <code>src/figures.js</code> for the list the menu is built out of,
      <code>src/units.js</code> for how a typed height becomes a number and how
      the ruler is labelled, <code>src/chart.js</code> for the layout,
      <code>src/save.js</code> for the two downloads &mdash; which are the SVG on
      screen, and that same SVG painted onto a canvas &mdash; and
      <code>src/import-svg.js</code> for the whitelist an uploaded SVG is
      rebuilt from, which is the one file here where being wrong would
      matter."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to make a height comparison chart"

# --- the card on the hub page ------------------------------------------------

card = """
            Put two adults, a child and a doorway on the same ruler &mdash; in
            centimetres or feet and inches &mdash; and download it as a PNG or
            an SVG."""

# Shared stylesheet parts this tool asks for, put before its own rules by
# the build so that its own can override them.
css_parts = ["form", "checks", "notes"]

# Shared modules this tool asks for, copied into it at src/shared/ by the
# build: download hands the chart to the browser as a file.
