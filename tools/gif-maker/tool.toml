#
# GIF Maker
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#

slug = "gif-maker"
name = "GIF Maker"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "GIF&nbsp;Maker <span class=\"h1-kw\">&mdash; images into an animated GIF</span>"
tagline = "Turn a set of pictures into one animation."
icon = "&#127916;"         # the mark beside the page heading
favicon = "&#127916;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "images"
category = "video-and-animation"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "gif"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules. progress is the bar this tool draws while it works.
css_parts = ["progress"]

# Shared modules this tool asks for. The same arrangement as css_parts, and for
# the same reason: a component more than one tool needs and no tool should own.
# file-picker brings in the drop zone.
js_parts = ["file-picker", "message-box", "format"]
# Where a finished result can be carried without being saved first: the row of
# links shared/handoff.js shows beside the download once there is one. Slugs of
# tools whose picker takes what this page produces; checked against the tools
# that exist by the build.
handoff = ["gif-analyzer"]
lastmod = "2026-08-28"

# --- what search engines and chat apps are told ------------------------------

title = "GIF Maker &mdash; Images to Animated GIF, Free and No Upload"
description = "Turn JPG, PNG or WebP images into an animated GIF, free and entirely in your browser. Set the order, the speed and the size. Nothing is uploaded, and it works offline."
og_title = "GIF Maker &mdash; images into an animated GIF, in your browser"
og_description = "Order the frames, set how long each one is held, pick a size, and get a GIF. The palette and the compression are worked out on your own machine; nothing is uploaded."
og_image_alt = "GIF Maker - turn a set of images into one animated GIF"

# The subtitle on the share card that og-image.ps1 draws into og.png. The
# card's heading is `name` above and its footer is the same line on every
# card, so this is the only part of it that belongs to this tool.
og_card = "Put pictures in order, set the speed, and get one animated GIF."

# --- the pledge block --------------------------------------------------------

pledge = """
    Every frame is drawn, quantized and compressed by your own browser, and the
    finished GIF is assembled in memory on this machine. There is no server on the
    other end of this page to send a picture to even if anything here wanted to."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and make a
      GIF. Not one request carries an image, a thumbnail, or a filename. Or unplug
      from the internet and make one anyway."""

# --- the "how this is verified" panel ----------------------------------------

read_first = """
, <code>src/quantize.js</code> for the palette every
      frame is reduced to, and <code>src/lzw.js</code> and <code>src/gif.js</code>
      for the compressor and the file it goes into &mdash; none of which has a line
      that could reach the network."""

# --- the written half of the page --------------------------------------------

howto_heading = "How to make a GIF from images"

# --- the card on the hub page ------------------------------------------------

card = """
            Put pictures in order, say how long each one is held, and get one
            animated GIF. The colours and the compression are worked out on
            your own machine."""

