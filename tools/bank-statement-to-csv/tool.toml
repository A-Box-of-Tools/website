#
# Bank statement PDF to CSV
#
# Everything on the generated page that is particular to this tool. The frame
# around it - the header, the pledge, the live check, the privacy panel and the
# footer - comes from templates/tool.html, and the parts that are true of the
# whole site, the Content-Security-Policy among them, from config/site.toml.
#
# The thing to hold on to while editing the prose below: this tool infers. It
# is not reading a table out of the file, because there is no table in the
# file - there is text at positions, and the columns are strips of paper
# nobody printed in. Every sentence here has to leave that true. The tool's
# answer to it is the balance check, which is a proof and is described as one;
# where there is no balance to check against, the page says so plainly instead
# of implying the rows are verified. Do not let a rewrite quietly upgrade
# "this is what the pages say" into "this is correct".
#

slug = "bank-statement-to-csv"
name = "Bank Statement Converter"
# The trailing span is the phrase people search for. The product name stays the
# loud half; see .brand h1 .h1-kw in shared/css/tool-frame.css.
heading = "Bank&nbsp;Statement to&nbsp;CSV <span class=\"h1-kw\">&mdash; and it checks its own arithmetic</span>"
tagline = "Every row is proved against the running balance printed on your statement."
icon = "&#128202;"                  # the bar chart, beside the page heading
favicon = "&#128202;"      # the tab icon, drawn into an inline SVG
# The drawn mark the pages wear, by its name in shared/icons - Lucide,
# vendored. `icon` above stays the emoji: it is what og-image.ps1
# rasterises for the share card and the two installed-app icons, which
# want a filled colourful mark rather than a line drawing.
glyph = "table"
category = "documents-and-audio"
# Which group on the roadmap this tool joins, by the id in config/planned.toml.
# It sits at the top of that group as a link, above the names still to be built.
roadmap_group = "documents"

# Optional stylesheets from shared/css, dropped in between the frame and this
# tool's own rules.
css_parts = ["form", "notes", "results"]

# file-picker brings in the drop zone. The rest is the PDF reading stack, which
# this tool shares with the redactor: the object grammar, the stream filters
# and the reader open the file; pdf-content, pdf-base14, pdf-fonts and
# pdf-strings resolve a page's fonts and encodings; pdf-text on top of them all
# says where every word landed on the paper. No pdf-writer - nothing here
# writes a PDF, and listing a part a tool never calls would ship it to every
# visitor for nothing.
js_parts = ["file-picker", "pdf-objects", "pdf-filters", "pdf-reader", "pdf-content", "pdf-base14", "pdf-fonts", "pdf-strings", "pdf-text", "message-box", "download", "format", "example-pdf", "pdf-page-writer", "example-statement"]
lastmod = "2026-09-09"

