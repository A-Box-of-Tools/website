<main id="main">
  <!-- Step 1 &mdash; the two texts -->
  <section class="card">
    <h2><span class="step">1</span> Paste the two texts</h2>

    <!--
      The picker is here for the files that are easier to drop than to open,
      select all and copy - twice. Nothing about it leaves the machine: each
      file is read with FileReader into a box below, and that is the whole
      journey. Two at once land one either side.
    -->
    {% include "partials/file-picker.html" %}

    <div class="panes">
      <div class="pane">
        <div class="pane-head">
          <label for="input">The original</label>
          <span class="count" id="input-count">empty</span>
        </div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Paste the original here - or drop both files above."></textarea>
      </div>

      <div class="pane">
        <div class="pane-head">
          <label for="input-b">The changed one</label>
          <span class="count" id="input-b-count">empty</span>
        </div>
        <textarea id="input-b" spellcheck="false" autocomplete="off" autocapitalize="off"
                  autocorrect="off" wrap="off"
                  placeholder="Paste the version to compare against."></textarea>
      </div>
    </div>

    <div class="toolbar">
      <p class="count"></p>
      <div class="toolbar-actions">
        <button type="button" id="sample" class="ghost">Try an example</button>
        <button type="button" id="swap" class="ghost">Swap sides</button>
        <button type="button" id="clear" class="ghost danger">Clear</button>
      </div>
    </div>
  </section>

  <!-- Step 2 &mdash; how to read it -->
  <section class="card">
    <h2><span class="step">2</span> Choose how to read it</h2>

    <div class="settings">
      <div class="field">
        <label for="view">How to show it</label>
        <select id="view">
          <option value="split" selected>Side by side</option>
          <option value="unified">One column</option>
        </select>
      </div>

      <div class="field checks">
        <label class="check" for="only-changes">
          <input type="checkbox" id="only-changes" checked>
          Show only what changed, with three lines either side
        </label>
        <label class="check" for="ignore-whitespace">
          <input type="checkbox" id="ignore-whitespace">
          Ignore whitespace
        </label>
        <label class="check" for="ignore-case">
          <input type="checkbox" id="ignore-case">
          Ignore upper and lower case
        </label>
        <label class="check" for="ignore-blank">
          <input type="checkbox" id="ignore-blank">
          Ignore blank lines
        </label>
      </div>
    </div>
  </section>

  <!-- Step 3 &mdash; what changed -->
  <section class="card">
    <h2><span class="step">3</span> Read what changed</h2>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <p class="count" id="result-note">Nothing yet.</p>
      <div class="toolbar-actions">
        <button type="button" id="copy" class="ghost" disabled>Copy</button>
        <a id="download" class="ghost as-button" hidden download>Download</a>
      </div>
    </div>

    <div id="diff-view" class="diff"></div>
  </section>
</main>
