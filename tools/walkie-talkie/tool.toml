[[privacy]]
title = "Internet discovery and pairing carry setup, never audio."
body = " Opening the page opens a secure discovery WebSocket. Starting or joining opens a separate channel connection. Show this channel nearby shares its name and listener invitation with browsers grouped by public IPv4 address or IPv6 /64 subnet and website origin. That group can include strangers behind shared gateways; VPNs can hide nearby devices. Turn the option off before starting for link-only invitations. Browsing never opens an audio connection or asks for a microphone. Channel state and directory entries live on open sockets without a stored history. Cloudflare keeps seven-day request metadata logs; keys travel inside secure messages, not request URLs. Each listener has a separate encrypted WebRTC audio connection to the host. There is no recording feature, STUN server or TURN relay. Recipients can independently record what they hear."
[[privacy]]
title = "A listener invitation cannot control the host."
body = " Host and listener keys differ. The host key remains in its browser tab's session storage and is never included in a shared link. A listener link carries its invitation key in the fragment after the # character. The tool saves it in per-tab session storage and removes the fragment when that storage is available, so a reload can rejoin. These are temporary browser credentials, not accounts. Anyone with the listener invitation and direct reachability can join; an invitation is not proof that someone is on your physical Wi-Fi."
[[privacy]]
title = "Direct reachability still depends on your network."
body = " Both browsers offer and accept host candidates only, without an internet audio relay fallback. VPNs, public interfaces and operating-system routes can affect their path, so this cannot prove a physical LAN boundary. Guest isolation, firewalls and browser local-network permissions may prevent a connection even on the same Wi-Fi. Keep pages open and try the actual devices you intend to use. Background or locked-screen operation depends on the browser and operating system and is not guaranteed."
[[privacy]]
title = "Temporary loss reconnects; End and Leave stop retries."
body = " A waiting receiver checks host availability with a one-second foreground target and keeps its mute choice. Healthy hidden connections and explicitly enabled hands-free speech continue while the browser allows. A physical hold releases on blur or hiding. A microphone interruption stops talking while preserving the channel; an ended microphone can be replaced on returning to the page or with Resume microphone. Recovery stays silent until you deliberately talk again. If the browser suspends the page, returning attempts to restore the same channel and invitation, with Resume channel available when an action is required. End broadcast prevents automatic resumption and creates a new invitation on the next Start. Leave closes one listener and its retries. Background timers, connection limits and sleeping devices can delay recovery."
[[privacy]]
title = "The website's regular scripts still run on this page."
body = " The page uses the site's usual advertising, measurement and donate-button scripts. The tool does not hand them audio, but scripts running in the page can read its address and browser storage, including temporary invitations. Removing a URL fragment reduces its later exposure; it cannot make those scripts a separate security boundary. Trust this page and its scripts before granting microphone access or using a sensitive invitation."

[[howto]]
title = "Start directly on this website."
body = " On the speaking device, choose Start channel and allow microphone access. Use the website's HTTPS address. There is no Python helper, download, account or installation."
[[howto]]
title = "Invite listeners."
body = " Listeners select your channel with Choose in Nearby channels, then choose Join channel when you start with Show this channel nearby selected. Choosing alone does not connect. You can also share the listener link or QR code. Opening an invitation starts the receive-only connection automatically and never asks for microphone access. Both sides need internet access for discovery and pairing."
[[howto]]
title = "Hold to talk or speak hands-free."
body = " Hold the Talk button, or focus it and hold Space. Release, leave the page or switch focus to release a physical hold. For hands-free speech, choose Start talking; it can continue with the page hidden while the browser allows. Choose Stop talking to stop, and check the displayed talking state before setting the device down. Microphone mute overrides both modes, and a microphone interruption clears hands-free speech. Listening starts automatically where permitted; Unmute starts sound if the browser blocks playback."
[[howto]]
title = "Recover or end the channel."
body = " Receivers retry a temporarily missing host in place. If the microphone is interrupted, talking stops while the channel remains connected. Return to the page or choose Resume microphone to replace an ended microphone; then deliberately start talking again. If the page was suspended, it attempts to restore the same channel silently, with Resume channel as a fallback. End broadcast prevents automatic resumption and creates a fresh invitation on the next Start; Leave closes one listener. Keep the pages open; screen-lock continuity is not guaranteed."

[[faq]]
q = "Do I need Python or a download?"
a = "No. The host starts directly in this website and listeners open its link. Only the host requests microphone access."
[[faq]]
q = "Does voice go through an internet server?"
a = "No. The internet service exchanges connection setup and status; voice uses a separate direct encrypted browser connection to each listener. No audio relay fallback is configured."
[[faq]]
q = "Does it work without internet?"
a = "Internet access is required for new pairing and recovery. A healthy direct audio connection may continue during a brief internet or pairing-service outage. A cached page alone cannot introduce new devices."
[[faq]]
q = "Can a phone host the channel?"
a = "Yes, if its browser supports microphone access and WebRTC on this HTTPS website. Healthy connections and hands-free speech can continue with the page hidden while the browser permits. Screen lock, browser suspension or operating-system interruptions may still stop them; try your actual phone before relying on background use. Phones can also listen without granting microphone access."
[[faq]]
q = "How do listeners join?"
a = "Select a nearby channel with Choose, then choose Join channel, or open its listener link. Playback starts automatically where permitted. If the browser requires an interaction for sound, Unmute starts it. Joining never requests microphone access; Mute/Unmute and Leave control the listening session."
[[faq]]
q = "Can we use a phone hotspot?"
a = "A phone hotspot can work if it allows the participating devices to reach each other directly. Connect the devices to the same hotspot and keep internet access for discovery and pairing. Use the listener link or QR code when the nearby list misses a channel. Some hotspots, VPNs and managed devices block direct traffic; there is no audio relay fallback."
[[faq]]
q = "What happens when the host disappears?"
a = "Receivers wait and check availability with a one-second target while active, keeping their mute choice. Hiding a healthy page does not deliberately disconnect it. A microphone interruption clears talking and keeps the pairing; an ended microphone can be replaced with Resume microphone or on returning to the page. If the browser suspends the page, returning tries to restore the same channel and invitation, with Resume channel as a fallback. Recovery leaves talking off. Background timers or service connection limits can delay retries. End broadcast stops receivers and prevents automatic resumption; the next channel uses a new invitation."
[[faq]]
q = "How many listeners are supported?"
a = "A channel admits up to ten listeners, including waiting connections. The host sends a separate audio stream to each. Actual capacity depends on its browser, device and network; ten is a limit, not a guarantee for every phone."
[[faq]]
q = "Why can the same Wi-Fi fail?"
a = "Guest isolation, firewalls, VPN routes or browser local-network permissions can block direct connectivity. Use a reachable trusted network. There is no public audio relay fallback."

