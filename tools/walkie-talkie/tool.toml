[[privacy]]
title = "The helper introduces browsers without receiving audio."
body = "The ZIP includes all browser assets and a Python service. It serves the local interface and keeps bounded connection setup messages and channel state in memory. Each listener has a separate encrypted WebRTC audio connection to the host. No public STUN server, TURN relay, audio storage or recording feature is used. A listener can independently record what they hear."
[[privacy]]
title = "Use a trusted LAN and share invitations carefully."
body = "Anyone with the listener link and a route to the helper can listen. The helper uses HTTP: setup descriptions and tokens are not encrypted on that leg and an active local-network attacker can alter them. Audio uses WebRTC encryption; that does not make HTTP signaling safe against that attacker. Host controls require a different token and loopback access. The helper rejects cross-origin requests and does not log invitations or payloads."
[[privacy]]
title = "Local reachability does not prove a physical Wi-Fi boundary."
body = "Only host candidates are offered and accepted. A VPN, public interface or operating-system route can affect their path. Guest isolation, firewalls and browser local-network permissions can prevent a connection. The helper binds loopback and private IPv4 interfaces. Choose the intended address and keep the host computer and page awake."
[[privacy]]
title = "Temporary loss reconnects; End and Leave stop retries."
body = "Leave closes one listener and its retries. End broadcast releases the microphone and tells listeners the session ended. A temporarily lost host puts listeners into Reconnecting, with a one-second foreground retry target and their mute choice preserved. Hiding the host stops capture. Start it again through the same running helper to resume. Restarting the helper creates new invitations. Background browsers can delay timers."
[[privacy]]
title = "The local bundle contains no platform scripts."
body = "This public page has the site's usual platform scripts. The downloadable local interface includes none of them and requests no remote assets. Its invitation links are never passed to this public page."

[[howto]]
title = "Run the local bundle on the host computer."
body = "Download and extract the ZIP, then run <code>python helper.py</code> from its folder with Python 3.10 or later. Open the printed <code>http://localhost:</code> host address on the same computer. No additional packages are needed."
[[howto]]
title = "Start the channel and invite listeners."
body = "Choose Start channel and allow microphone access. Choose the intended LAN address if several are listed, then share its listener link or QR code. Listeners open it on reachable devices and are never asked for a microphone."
[[howto]]
title = "Hold or tap to talk."
body = "Hold the Talk button, or focus it and hold Space. Release to stop sending voice. The tap control offers click-to-start and click-to-stop. Microphone mute overrides both. Listeners start sound automatically where permitted; their existing Unmute control starts it if the browser blocks autoplay."
[[howto]]
title = "Recover or end the channel."
body = "Listeners reconnect in place after a temporary host loss. Start the host again through the same helper to resume. End broadcast closes the current session; Leave closes one listener. Keep pages open and devices awake."

[[faq]]
q = "Does it work without internet?"
a = "Yes, once the ZIP is downloaded and extracted. Its pages and pairing service only need a reachable LAN. The host computer needs Python 3.10 or later; listeners need only a browser."
[[faq]]
q = "Why do I need a helper?"
a = "Browsers need to exchange connection setup messages. A local service enables link-based pairing and automatic rejoining without a cloud introduction. It carries setup and status, never voice."
[[faq]]
q = "Can a phone host the channel?"
a = "This version hosts from a computer running the helper. Its localhost page can request microphone access. Phones can listen through the LAN link; ordinary HTTP on a LAN IP cannot request a microphone."
[[faq]]
q = "Do listeners press Listen?"
a = "There is no Listen button. Audio playback is attempted automatically. If the browser requires an interaction before playing sound, Unmute starts it. Mute/Unmute and Leave are the only listener controls."
[[faq]]
q = "What happens when the host disappears?"
a = "Listeners show Reconnecting and check again with a one-second target while active. Their mute choice stays the same. Start the host through the same running helper to resume. Background timers may run later. Restarting the helper creates new invitations."
[[faq]]
q = "How many listeners are supported?"
a = "The helper admits up to ten, including pending connections. The host sends a separate stream to each. Actual performance depends on its browser, computer and network; the cap does not guarantee capacity on every device."
[[faq]]
q = "Why can the same Wi-Fi fail?"
a = "Guest isolation, a firewall, an incorrect LAN interface or local-network permissions can block reachability. Choose the correct address and permit the helper on your trusted private network. No public relay fallback is used."

