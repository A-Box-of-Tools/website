# A magnification is a ratio, and a ratio says nothing about what limits it. So the
# page never shows the number alone: beside it are the width of the lens that sets
# the detail, the width of the beam that sets the brightness, and three pictures
# drawn to one scale. Four instruments are kept as four sets of numbers because
# that is how they are printed, and one rule about blur is what joins them.
