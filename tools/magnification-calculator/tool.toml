[[howto]]
title = "Pick the instrument and type what is printed on it."
body = "A telescope carries its aperture and focal length, and each eyepiece its own focal length. Binoculars carry two numbers, such as 8×42. A microscope objective carries its magnification and numerical aperture, such as 40×/0.65. A magnifier carries a power, a focal length or diopters."
[[howto]]
title = "Drag the dial through the zones."
body = "The dial changes the magnification: by changing the eyepiece on a telescope or a microscope, and the printed power on binoculars or a magnifier. Its track is colored from the instrument's own limits. Watch the verdict as you cross from sharp into the useful top and then into empty magnification."
[[howto]]
title = "Compare the three pictures."
body = "The first is the whole circle you look into, with its subject at true scale. The second looks closely at its middle, as sharply as a good eye would. The third is that same close look with no instrument, so the difference between the last two is the magnification."
[[howto]]
title = "Read what each number means, then check the assumptions."
body = "Field of view, exit pupil, finest detail and light gathered are worked out beside the result. Change the width of your eye's pupil, the eyepiece's field or the way a magnifier's power is counted, and read where each rule comes from."

[[faq]]
q = "What does 8×42 mean on binoculars?"
a = "The first number is the magnification: things look eight times wider, as if you stood eight times closer. The second is the width of each front lens, 42 mm. Dividing the second by the first gives the exit pupil, here 5.25 mm, which is the width of the beam of light reaching your eye. It is why 8×42 stays bright at dusk when 8×21 does not."
[[faq]]
q = "How do I work out a telescope's magnification?"
a = "Divide the telescope's focal length by the eyepiece's. A 700 mm telescope with a 10 mm eyepiece gives 70×, and a 2× Barlow lens doubles it. The telescope has no single magnification of its own, so a box that prints one is describing its shortest eyepiece and not the view."
[[faq]]
q = "What is the highest useful magnification of a telescope?"
a = "About twice the aperture in millimeters, or 50× per inch: 140× for a 70 mm telescope and 400× for a 200 mm one. Detail is set by the width of the lens or mirror, and by that point all of it is comfortably visible. Past it the picture only gets bigger, softer and dimmer, which is called empty magnification. The air adds its own ceiling of about 300× on most nights, however large the telescope."
[[faq]]
q = "Is a 675× telescope better than a 100× one?"
a = "Not by that number. A 60 mm telescope sold as 675× can show real detail up to about 120×, and the rest is the same blur enlarged and dimmed. Compare apertures instead: the wider lens or mirror shows finer detail and fainter things at any magnification."
[[faq]]
q = "What magnification shows Saturn's rings or Jupiter's moons?"
a = "Less than most people expect. Jupiter's four large moons show as points in ordinary binoculars at 7× to 10×. Saturn's rings appear from about 25× to 30× as a tiny oval, and 100× or more in a telescope 60 mm wide or wider shows them clearly apart from the planet. Try both above: the planets stay small in the view, and that is how they really look."
[[faq]]
q = "What can I see with a microscope at 40×, 100×, 400× and 1000×?"
a = "At 40× the view is about 4.5 mm wide: salt crystals, the parts of an insect, the weave of cloth. At 100× it is 1.8 mm: plant cells such as onion skin, and a hair like a thick cable. At 400× it is 0.45 mm: single cells with their nuclei, and red blood cells as small discs. At 1000× with an oil-immersion objective it is 0.18 mm: bacteria as distinct rods and dots. These widths assume a common 10× eyepiece with an 18 mm field number."
[[faq]]
q = "Why does 1000× sometimes show nothing new?"
a = "Because a microscope's detail is set by the objective's numerical aperture, the number after the slash, and not by the total magnification. The useful range is about 500 to 1000 times that number, so 325× to 650× for a 40×/0.65 objective. Reaching 1000× on it with a 25× eyepiece only enlarges the blur. A 100×/1.25 oil objective reaches the same 1000× and separates detail about half the size."
[[faq]]
q = "What is the exit pupil?"
a = "The width of the beam of light that leaves the eyepiece and enters your eye: the aperture divided by the magnification. If it is wider than your own pupil, about 7 mm in the dark and 2 to 3 mm in daylight, the extra light misses your eye. Below about 1 mm the view starts to soften and dim, and under half a millimeter you are into empty magnification."
[[faq]]
q = "How does a magnifying glass's power relate to diopters and focal length?"
a = "The focal length in millimeters is 1000 divided by the diopters, and the magnification is 250 mm divided by the focal length, so a 10× loupe has a 25 mm focal length and 40 diopters. Lamp and reading magnifiers marked in diopters are usually counted with one added, the eye being focused close: +3 diopters is sold as 1.75×, and a +20 diopter lens as 6×, or as 5× by a maker who does not add it. Stronger lenses have to be smaller and held closer: a 10× loupe works about 25 mm from the object."
[[faq]]
q = "Is 10× zoom on a camera the same as 10× binoculars?"
a = "No. A camera's zoom number is the ratio between its longest and shortest focal lengths, so a 24&ndash;240 mm lens is 10× whatever it shows. Compared with your eye, taking 50 mm as a normal view on a full-frame camera, that lens runs from about half life size to about 5×. Binoculars and telescopes state their magnification against the eye itself."
[[faq]]
q = "Does a USB microscope's 1000× mean the same thing?"
a = "It is a different sum. A digital microscope's figure is the size of the picture on a screen divided by the size of the object, so it grows with the monitor and says nothing about detail. What it can separate is still set by its lens. Its field of view is a better guide: an instrument that shows an area about 2 mm wide is working at roughly the level of a 100× optical microscope, whatever the box says."
[[faq]]
q = "Are the pictures photographs?"
a = "No. They are drawings made in the page from the numbers. Sizes are true to scale, the softness is the instrument's own blur at that scale, and the dimming follows the exit pupil. The Moon's seas and largest craters, Jupiter's moons, Saturn's rings and the brightest Pleiades are placed from published figures, and the smaller craters, cells and feathers are illustration. A real view also depends on the air, the quality of the optics and your own eyes."
[[faq]]
q = "Does the tool work offline?"
a = "Yes. After the page has loaded, every calculation and drawing works without a connection. Nothing you type is uploaded or stored."

