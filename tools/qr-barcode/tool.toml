# --- the pledge block --------------------------------------------------------

pledge = """
    A QR code is arithmetic over a string: there is no file to send and no
    service to ask. Every step &mdash; picking the mode, choosing the version,
    the Reed-Solomon error correction, the mask, the bars of a barcode and the
    check digit under it &mdash; happens in about a thousand lines of JavaScript
    in this page that you can read. This tool has no network feature of any kind,
    which matters more here than on most pages: the thing being encoded is
    often a Wi-Fi password."""

live_hint = """
      Don't take our word for it: open DevTools, watch the Network tab, and type
      a password into the Wi-Fi form. Not one request carries a character of it.
      Or unplug from the internet and make the code anyway."""

