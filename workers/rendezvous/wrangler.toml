# The rendezvous for direct browser connections. Deployed by hand with `npx wrangler
# deploy` from this directory; nothing in build.py reads this folder.

name = "rendezvous"
main = "worker.js"
compatibility_date = "2026-08-01"

# The worker answers on a name under the site's own domain, not only on the
# workers.dev one it was born with. The whole workers.dev domain is blocked
# inside mainland China, and a reader there saw the page load and then wait
# forever for an introduction that could never arrive; abox.tools itself is
# reachable, so its subdomain is too. `custom_domain = true` has the deploy
# create the DNS record and the certificate in the zone, which is on the same
# account, so there is nothing to click. The workers.dev address keeps
# answering alongside it - a page cached before the switch still finds the
# switchboard. Each connected tool names this hostname in its client endpoint
# and the connect-src line of its tool.toml, and both must follow a move.
#
# `workers_dev` has to be said out loud: the moment a worker declares a route,
# wrangler turns the workers.dev name off unless told otherwise, and the first
# deploy of this file did exactly that - every page already out there dialled
# the old name and found nothing. Both names stay on, deliberately.
workers_dev = true
routes = [
  { pattern = "rendezvous.abox.tools", custom_domain = true },
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DISCOVERY"
class_name = "Discovery"

[[durable_objects.bindings]]
name = "BROADCASTS"
class_name = "Broadcast"

[[durable_objects.bindings]]
name = "INBOXES"
class_name = "Inbox"

# SQLite-backed classes are the kind the free plan allows. The object never
# touches its storage - its whole state is the sockets connected to it - but
# the class still has to be declared this way to deploy at all.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Discovery also keeps its complete state in hibernating socket attachments.
# A separate class leaves existing room ids and older clients unchanged.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Discovery"]

# Voice rooms authenticate capabilities inside the socket. Their namespace
# cannot reinterpret an existing text/camera room or grant its authority.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Broadcast"]

# Incoming voice retains password and moderation authority separately from the
# outgoing broadcast protocol, without writing audio or room state to storage.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["Inbox"]

# One address may open thirty sockets a minute. The start page opens one for
# discovery, a host adds one for its room, and each reader opens one. It is
# the difference between a script
# spending the free plan's daily quota in an hour and spending its own patience.
# Counted per Cloudflare location, so it is a cap on nuisance rather than a
# wall. The namespace id is an arbitrary label that keeps this counter apart
# from any other the account might declare.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# The explicit Cloud relay option uses
# Cloudflare's TURN service, and minting a credential for it takes a TURN key:
# made in the dashboard under Realtime, and handed to the worker as two secrets
# rather than two lines here, since one of them is a bearer token -
#
#     npx wrangler secret put TURN_KEY_ID
#     npx wrangler secret put TURN_KEY_TOKEN
#
# Without them the worker returns unavailable. TURN traffic is separately
# billed; these admission and issuance limits are not a byte or spending cap.
[vars]
RELAY_TOOLS = "share-text,share-tab,remote-camera,walkie-talkie,voice-oncall"
RELAY_MAX_PEERS = "10"
RELAY_MAX_SESSION_SECONDS = "28800"
RELAY_MAX_CREDENTIALS = "12"

# Persisted logs, switched on in the dashboard and written down here so a later
# `wrangler deploy` from this file agrees with it rather than quietly switching
# them back off. Text/camera refusals add only a close code and reason; voice
# prints nothing of its own. What Cloudflare also keeps is
# Cloudflare's autogenerated record of each invocation - the request, the
# response and the metadata around them - for seven days. That record includes
# the URL, which on this switchboard carries the code word and the role, and it
# never includes a payload: the negotiation blobs travel inside the socket, and
# the text and the files never come near this worker at all.
[observability.logs]
enabled = true
invocation_logs = true

# Tracing off, said out loud rather than left to the default, because the
# default is the half of this that can move underneath us: Cloudflare has said
# it intends to start tracing automatically alongside logs, gated on a
# `compatibility_date` past the change. Bumping the date above for some
# unrelated reason would then quietly add a second stream to a worker whose
# whole appeal is how little of it there is to keep. A written `false` costs
# nothing and cannot drift.
[observability.traces]
enabled = false

# A dev deployment is a separate Worker, not a version of the live switchboard.
# Routes are inherited unless replaced, so this complete override must never
# carry rendezvous.abox.tools. The workers.dev address remains a fallback.
[env.dev]
name = "rendezvous-dev"
workers_dev = true
routes = [
  { pattern = "rendezvous-dev.abox.tools", custom_domain = true },
]

# Environment vars are not inherited. Development has its own TURN secrets
# and the same bounded admission policy; an empty RELAY_TOOLS disables relay.
[env.dev.vars]
RELAY_TOOLS = "share-text,share-tab,remote-camera,walkie-talkie,voice-oncall"
RELAY_MAX_PEERS = "10"
RELAY_MAX_SESSION_SECONDS = "28800"
RELAY_MAX_CREDENTIALS = "12"

# Bindings are not inherited. Omitting script_name binds each class to this
# environment's Worker and therefore creates separate object namespaces/state.
# The v1-v4 migration history and observability policy above are inherited.
[[env.dev.durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[env.dev.durable_objects.bindings]]
name = "DISCOVERY"
class_name = "Discovery"

[[env.dev.durable_objects.bindings]]
name = "BROADCASTS"
class_name = "Broadcast"

[[env.dev.durable_objects.bindings]]
name = "INBOXES"
class_name = "Inbox"

# Rate-limit namespace ids are shared across Workers in the account. A dev
# address must not spend the live switchboard's allowance under namespace 1001.
[[env.dev.ratelimits]]
name = "LIMIT"
namespace_id = "1002"

  [env.dev.ratelimits.simple]
  limit = 30
  period = 60
