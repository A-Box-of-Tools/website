# The rendezvous for /share-text/. Deployed by hand with `npx wrangler
# deploy` from this directory; nothing in build.py reads this folder.

name = "rendezvous"
main = "worker.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed classes are the kind the free plan allows. The object never
# touches its storage - its whole state is the sockets connected to it - but
# the class still has to be declared this way to deploy at all.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# One address may open thirty sockets a minute. A person never comes near it -
# a host opens one, each reader one - and it is the difference between a script
# spending the free plan's daily quota in an hour and spending its own patience.
# Counted per Cloudflare location, so it is a cap on nuisance rather than a
# wall. The namespace id is an arbitrary label that keeps this counter apart
# from any other the account might declare.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# The relay a reader may ask for after a direct attempt has failed is
# Cloudflare's TURN service, and minting a credential for it takes a TURN key:
# made in the dashboard under Realtime, and handed to the worker as two secrets
# rather than two lines here, since one of them is a bearer token -
#
#     npx wrangler secret put TURN_KEY_ID
#     npx wrangler secret put TURN_KEY_TOKEN
#
# Without them the worker answers a relay ask with nothing and the page says so.
# The first 1,000 GB a month of relayed traffic are free; a relay carries the
# same encrypted bytes the direct path would, and only for the pairs that
# could not connect directly.

# Persisted logs, switched on in the dashboard and written down here so a later
# `wrangler deploy` from this file agrees with it rather than quietly switching
# them back off. The worker prints nothing of its own, so what is kept is
# Cloudflare's autogenerated record of each invocation - the request, the
# response and the metadata around them - for seven days. That record includes
# the URL, which on this switchboard carries the code word and the role, and it
# never includes a payload: the negotiation blobs travel inside the socket, and
# the text and the files never come near this worker at all.
[observability.logs]
enabled = true
invocation_logs = true

# Tracing off, said out loud rather than left to the default, because the
# default is the half of this that can move underneath us: Cloudflare has said
# it intends to start tracing automatically alongside logs, gated on a
# `compatibility_date` past the change. Bumping the date above for some
# unrelated reason would then quietly add a second stream to a worker whose
# whole appeal is how little of it there is to keep. A written `false` costs
# nothing and cannot drift.
[observability.traces]
enabled = false
