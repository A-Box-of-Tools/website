#
# Build the site and publish it to the `dist` branch.
#
# The repository holds the sources: templates/, config/, tools/ and shared/.
# The `dist` branch holds what a browser is actually served. GitHub Pages is
# pointed at `dist`, so a push to `main` becomes a deploy once this finishes.
#
# Why a separate branch rather than Pages' own build: the point of this site is
# that a reader can check its claims, and the strongest form of that is being
# able to run `python build.py` locally and diff the result against the branch
# that is being served. `python build.py --check` does exactly that. That is
# only meaningful if the served files are committed somewhere a reader can see.
#
# WHERE A CHANGE GOES, AND IN WHAT ORDER
#
# Work is opened against `dev`, `dev` is opened against `main`, and `main` is
# production:
#
#   pull request  ->  dev  ->  pull request  ->  main  ->  dist  ->  Pages
#
# The middle branch is the point of the arrangement. A fix no longer has to be
# a release on its own: a week of them are bundled on `dev` and reach
# production as one deploy, one version tag and one IndexNow submission rather
# than fifteen of each. What it costs is that `main` is now two merges away
# from a change rather than one, which is the trade being made.
#
# The second of those two merges is made by hand, and nothing in this file
# will ever make it: no schedule, no auto-merge, and no step anywhere here
# pushes `main`. A release is somebody deciding the bundle is ready, having
# read its preview and its QA run - and that decision is the one thing
# everything else is automated in order to leave room for.
#
# So this workflow has three destinations rather than two. The `build` job
# names them once in its `env`, because the four steps that read them have to
# agree with each other:
#
#   a pull request    builds, is checked, and goes to a preview of its own at
#                     pr-<number>.abox-preview.pages.dev, which the QA suite
#                     is then run against
#   a push to `dev`   the same, to a preview at dev.abox-preview.pages.dev -
#                     one stable address holding the bundle as it currently
#                     stands, for looking at between releases
#   a push to `main`  publishes to `dist`, tags the version, and tells
#                     IndexNow. Nothing else does any of those
#
# Anything else - a manual run against a feature branch - builds, is checked,
# and goes nowhere at all.
#
# On none of them but the last is anything published, so a change that breaks
# the build is caught twice before it can reach production. The preview is why
# the browser suite sees a change before visitors do rather than twenty
# minutes after; see the `preview` job for the rest of that.
#
# The unit tests run first, in their own job, and the build waits on them. They
# cover the hand-written code on both sides: the generator in Python and the
# parsers and writers the browser runs. See tests/README.md.
#

name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Only what is needed: the publish step writes one branch.
permissions:
  contents: write

# A second push while the first is still deploying should not race it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The unit tests, for the code in this repository that was written by hand:
  # the site generator in Python, and the parsers and writers the browser runs.
  # Neither suite needs anything installed - unittest and node:test are both
  # standard library - so this job installs nothing at all. See tests/README.md.
  #
  # It runs before the build rather than beside it, and the build needs it, so
  # a failing test cannot deploy.
  #
  # WHY THE STEPS ARE SKIPPED AND NOT THE JOB
  #
  # A change that touches only the repository's own prose - the READMEs, docs/,
  # and the agent instructions in CLAUDE.md and .claude/ - cannot alter what
  # the build produces or what a test asserts. Running either suite over it
  # answers a question nobody asked and delays the ones somebody did, so the
  # first step below works out whether that is the case and the rest read its
  # answer.
  #
  # The obvious shape - a job of its own, an `if:` on this one - was not taken,
  # and the reason is the line above. A skipped job skips everything that needs
  # it, so `build` would stop running too; keeping it would mean rewriting its
  # `needs: test` as an expression that has to accept a skipped test. That
  # `needs` is the only thing standing between a broken test and the deployed
  # branch, and an expression that gets it wrong is invisible until the day it
  # matters. This way `build` is untouched. A test job that reports success
  # having skipped its steps costs half a minute of runner, and the deploy
  # still cannot happen without it.
  test:
    runs-on: ubuntu-latest
    # Read by `build` and `preview` below. One decision, three consumers: the
    # suites, the build, and the preview and QA run that follow it.
    outputs:
      site: ${{ steps.covered.outputs.code }}
      generator: ${{ steps.covered.outputs.generator }}
    steps:
      # What this actually changed, asked of the API rather than worked out
      # from a clone: it is one request, and fetching enough history to diff
      # for it would cost more than the job it is deciding about. `gh` is on
      # the runner already, so this adds no dependency - the same bargain the
      # rest of the repository makes.
      #
      # NOT KNOWING MEANS RUNNING THEM. Every branch here that cannot answer -
      # a manual run with no `before`, a new branch, a request that failed, a
      # comparison too long to come back whole - leaves `code` at true. The
      # failure mode is a suite that ran when it need not have, and never a
      # change that shipped untested.
      #
      # The exempt list is an allowlist, and short on purpose: files the build
      # never reads and no test opens. Anything else - anything new, anything
      # unrecognised - builds and runs the suites until somebody decides
      # otherwise here.
      #
      # THE STANDARD AN ENTRY HAS TO MEET is that no test OPENS it, which is
      # not the same as no test mentioning it. Nearly every path on this list
      # appears in tests/python/test_version.py, as a string in the fixture
      # asserting the version rule cannot see it; naming a path is not reading
      # one. Three that look like they belong here do not, and each was checked
      # rather than assumed:
      #
      #   workers/    tests/js/rendezvous.test.js imports worker.js outright
      #   serve.ps1   tests/python/test_serve.py reads its MIME table
      #   tests/      the suites are the thing being changed
      #
      # `.github/` is OFF the list, and for a different reason from the three
      # above - it would qualify under the rule, because no test opens a
      # workflow. A workflow exempt from the run it defines never gets one:
      # the first thing to exercise a step edited here would be the deploy
      # that needed it, and the first sign of a mistake a release that did not
      # happen. GitHub parsing the file is not the same assurance, because a
      # workflow can load perfectly and still hold a condition that never
      # fires - which is most of what this file is made of. So a change here
      # builds and runs both suites like any other.
      - name: Is there anything here a test could see?
        id: covered
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          code=true
          why='what changed could not be worked out'
          zero=0000000000000000000000000000000000000000

          if [ -n "$BASE" ] && [ "$BASE" != "$zero" ]; then
            range="repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD"
            files=$(gh api "$range" --jq '.files[].filename') || files=''
            count=$(printf '%s\n' "$files" | grep -c . || true)

            # 300 is where the compare endpoint stops listing files. A reply
            # that long may have been cut short, and the file it left out is
            # exactly the one this is looking for.
            if [ "$count" -gt 0 ] && [ "$count" -lt 300 ]; then
              code=false
              while IFS= read -r path; do
                case "$path" in
                  README.md|CLAUDE.md|ROADMAP.md) continue ;;
                  LICENSE|LICENSE-CONTENT|LICENSE-BRAND) continue ;;
                  docs/*|.claude/*|media/*|cloudflare/*) continue ;;
                esac
                code=true
                why="\`$path\` is a file a test could see"
                break
              done <<< "$files"
            fi
          fi

          # IS EVERYTHING HERE THE GENERATOR RATHER THAN THE SITE?
          #
          # `build.py`, `buildlib/`, `scripts/` and `indexnow.py` produce the
          # site and are never served from it. A change to one of them may
          # alter every page or no page at all, and no rule about paths can
          # tell which: a rewritten template and a corrected `print` look
          # identical from here, and the safe answer - assume every page - is
          # what sends twelve runners of browser tests after a change to a log
          # line. So the question is only ASKED here. The build answers it
          # below, by building both sides and comparing, which is the one
          # method that cannot be wrong about it.
          generator=false
          if [ "$code" = true ] && [ -n "$files" ]; then
            generator=true
            while IFS= read -r path; do
              case "$path" in
                build.py|indexnow.py) continue ;;
                buildlib/*|scripts/*) continue ;;
              esac
              generator=false
              break
            done <<< "$files"
          fi
          echo "generator=$generator" >> "$GITHUB_OUTPUT"

          if [ "$code" = true ]; then
            said="Building and running both suites, because $why."
          else
            said="Nothing here reaches the site: everything this changed is a file the build never reads and no test opens, so the build and both suites are skipped."
          fi

          # Twice on purpose. The summary is where somebody looks to find out
          # why a pull request did not run the tests; the log is where somebody
          # looks when they suspect this step of never having worked. Said only
          # in the summary, a step that always answered "run" because the API
          # call was failing would look exactly like one doing its job.
          echo "$said"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo '### Tests'
            echo
            echo "$said"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: steps.covered.outputs.code == 'true'

      - uses: actions/setup-python@v5
        if: steps.covered.outputs.code == 'true'
        with:
          python-version: '3.12'

      # Newer than the build job's Node, and deliberately: `node --test` only
      # learned to take a glob in 21, and on 20 the same argument is read as a
      # path that does not exist; and the resolve hook the tests run under,
      # tests/js/resolve-shared.mjs, needs module.registerHooks, which arrived
      # in 22.15. Nothing is installed with either, so the two versions are
      # free to differ.
      - uses: actions/setup-node@v4
        if: steps.covered.outputs.code == 'true'
        with:
          node-version: '24'

      - name: The build (Python)
        if: steps.covered.outputs.code == 'true'
        run: python -m unittest discover -t . -s tests/python -v

      - name: The tools (JavaScript)
        if: steps.covered.outputs.code == 'true'
        run: node --import ./tests/js/resolve-shared.mjs --test "tests/js/*.test.js"

  build:
    needs: test
    runs-on: ubuntu-latest
    # The two questions the steps below ask, answered in one place. Here
    # rather than four times over because the four answers have to agree: a
    # run that published to `dist` without tagging the version, or tagged one
    # without publishing, would be worse than either on its own.
    #
    # DEPLOYS used to read `github.event_name != 'pull_request'`, which was
    # right while `main` was the only branch this ran on and is wrong now for
    # two separate reasons. A push to `dev` is not a pull request; neither is
    # a `workflow_dispatch` against a feature branch, which could therefore
    # already publish an unreviewed branch straight to production. Naming the
    # branch is what makes both impossible, and it is why these are conditions
    # on the ref rather than on the event.
    #
    # All three rest on the `test` job's answer, so a change that reaches no
    # page is not built, not published and not previewed. The steps are skipped
    # and the job is not, for the reason given over that job: a skipped job
    # skips everything that needs it, and `needs: test` is the only thing
    # standing between a broken test and the deployed branch.
    outputs:
      # Whether the site this change builds differs from the one the base
      # builds. Empty unless it was worth asking; the preview job reads it.
      moved: ${{ steps.moved.outputs.moved }}
    env:
      BUILDS: ${{ needs.test.outputs.site }}
      GENERATOR: ${{ needs.test.outputs.generator }}
      DEPLOYS: ${{ needs.test.outputs.site == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      PREVIEWS: ${{ needs.test.outputs.site == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') }}
    steps:
      # The version is a tag, so the deploy has to be able to see the tags. The
      # default checkout brings none: it fetches the one commit being deployed
      # at depth 1, `git tag --list` on the runner is empty, and
      # scripts/next_version.py has no span to measure. Two fixes have been
      # tried here, and the first did not work.
      #
      # `fetch-tags: true` on the checkout action was the first. All it does is
      # drop `--no-tags` from the fetch and leave git to follow tags by itself,
      # and git follows only the tags that point at a commit it fetched - which
      # at depth 1 is the head alone, and no version tag points at the head. So
      # the runner stayed blind: the script proposed 1.0.0 on every deploy, the
      # rerun guard below found 1.0.0 already on the remote, and the step
      # exited 0 saying there was nothing to do. A hundred and seventy-seven
      # commits and five new tools went out under 1.0.2 before anyone read the
      # line it printed.
      #
      # The fetch below is the second. It names the tags as a refspec, which
      # git fetches whether or not their commits are in the shallow history:
      # each tagged commit arrives as a shallow root of its own, and `git diff
      # <tag>..HEAD` compares two commit objects rather than walking between
      # them, so depth 1 is still enough. `fetch-depth: 0` would work too and
      # would drag in the whole of the dist branch to do it. And the script now
      # refuses to name the first version while the remote holds one, so if
      # this fetch ever stops working the step fails instead of agreeing.
      - uses: actions/checkout@v4
        if: env.BUILDS == 'true'
      - name: Fetch the version tags the checkout leaves behind
        if: env.BUILDS == 'true'
        run: git fetch --depth=1 origin '+refs/tags/*:refs/tags/*'

      # The build uses tomllib, which is standard library from 3.11 onwards.
      # Python alone produces a working, readable site: that is what plain
      # `python build.py` does, and it needs nothing installed.
      - uses: actions/setup-python@v5
        if: env.BUILDS == 'true'
        with:
          python-version: '3.12'

      # Node is here only to parse the emitted scripts below. Nothing is
      # installed from npm: the build itself is Python and the standard
      # library, start to finish.
      - uses: actions/setup-node@v4
        if: env.BUILDS == 'true'
        with:
          node-version: '20'

      # The unminified build, kept as the reference the deployed one is judged
      # against. Cheap, and it means a file that went missing has something to
      # go missing from.
      - name: Build (readable)
        if: env.BUILDS == 'true'
        run: python build.py --out _plain --clean --no-minify

      - name: Build (deployed)
        if: env.BUILDS == 'true'
        run: python build.py --out _site --clean

      # DID THIS CHANGE THE SITE AT ALL?
      #
      # Asked only when everything the change touched is generator code, and
      # then it is worth a whole build to answer. A change to `build.py` can
      # reach every page, so the path rule has to assume it did and run the
      # browser suite over the lot - twelve runners and a quarter of an hour
      # after a corrected log line. Building the base and diffing settles it
      # for about four minutes on this one runner, and unlike any rule about
      # paths it cannot be wrong: identical bytes are an identical site, and
      # no browser test can see a difference that is not there.
      #
      # A base that will not build, or a build that differs for a reason as
      # dull as a date, both answer "it moved" and everything runs. The only
      # mistake available here is the cheap one.
      - name: Did this change the site at all?
        id: moved
        if: env.BUILDS == 'true' && env.GENERATOR == 'true' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          moved=true
          if git fetch --depth=1 origin "$BASE" 2>/dev/null &&
             git worktree add .base "$BASE" > /dev/null 2>&1 &&
             (cd .base && python build.py --out "$GITHUB_WORKSPACE/_base" --clean --quiet); then
            if diff -r _site "$GITHUB_WORKSPACE/_base" > /dev/null 2>&1; then
              moved=false
              echo 'The site this builds is byte-identical to the one the base builds.'
            else
              echo 'The site this builds differs from the one the base builds.'
            fi
          else
            echo '::notice::The base could not be built for comparison, so this runs everything.'
          fi
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          {
            echo '### The site itself'
            echo
            if [ "$moved" = false ]; then
              echo 'Unchanged: this builds the same bytes as the base, so the browser suite is not asked to run.'
            else
              echo 'Changed, so the browser suite runs.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Minifying is the one step here that could break the site quietly, so
      # it is checked rather than assumed. buildlib/minify.py already compares
      # its own tokens on every file and fails the build if they moved; this is
      # the second opinion, from a real parser rather than the one that did the
      # work.
      #
      # Every emitted script is parsed by Node as a real ES module - copied to
      # .mjs first, because a bare .js is read as CommonJS and `import` would be
      # a syntax error for the wrong reason. Then the two builds are compared by
      # filename, so a module that vanished is caught even if everything left
      # behind parses.
      - name: Check the minified output
        if: env.BUILDS == 'true'
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          status=0

          count=0
          while IFS= read -r script; do
            cp "$script" "$work/check.mjs"
            if ! node --check "$work/check.mjs" 2>"$work/err"; then
              echo "::error file=$script::does not parse after minifying"
              sed 's/^/    /' "$work/err"
              status=1
            fi
            count=$((count + 1))
          done < <(find _site -name '*.js' | sort)
          echo "parsed $count scripts"

          diff <(cd _plain && find . -type f | sort) \
               <(cd _site  && find . -type f | sort) \
            || { echo '::error::the two builds do not contain the same files'; status=1; }

          exit $status

      # A build bound for a preview rather than for `dist` - a pull request,
      # or a push to `dev` - reaches the job below through an artifact. A day
      # is plenty: the preview is uploaded within minutes, and the next push
      # builds again.
      - name: Hand the build to the preview
        if: env.PREVIEWS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          include-hidden-files: true
          retention-days: 1

      - name: Publish to the dist branch
        id: publish
        if: env.DEPLOYS == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # The deployed tree, beside the working tree. A worktree rather than
          # a second clone, so the push reuses the credentials actions/checkout
          # already configured; --depth=1 because one commit is all there is to
          # fetch - see the root commit at the bottom of this step.
          #
          # `deployed` is the tree id of what is live, and it is wanted for the
          # comparison below rather than for the commit. Empty on the first
          # deploy, when there is no branch yet and everything is new.
          deployed=
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch --depth=1 origin dist
            git worktree add --detach .publish FETCH_HEAD
            deployed=$(git rev-parse 'FETCH_HEAD^{tree}')
          else
            git worktree add --detach .publish
          fi

          # A fingerprint of every deployed page's <main>, taken before
          # the line below deletes the tree. It is the baseline the
          # IndexNow step diffs against to work out which pages actually
          # changed, and this is the last moment the deployed tree exists
          # to be measured.
          if [ -f .publish/sitemap.xml ]; then
            python indexnow.py --tree .publish \
              --write-hashes "$RUNNER_TEMP/deployed-hashes.json"
          fi

          # Replace the tree wholesale rather than copying over it: a page that
          # was deleted from the sources has to disappear from the branch too.
          git -C .publish rm -rq --cached . --ignore-unmatch
          find .publish -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a _site/. .publish/

          git -C .publish add -A

          # Two trees compared, rather than the index against HEAD. The commit
          # below has no parent for an index to be diffed against, and a tree
          # id is the same question asked of the thing itself: equal ids are
          # equal sites, whatever history stands either side of them.
          built=$(git -C .publish write-tree)
          if [ "$built" = "$deployed" ]; then
            echo 'The build is identical to what is already deployed; nothing to push.'
            exit 0
          fi

          # A ROOT COMMIT EVERY TIME, force-pushed over the last one, so `dist`
          # holds one build and never a history of them.
          #
          # It used to accumulate. Every deploy committed on top of the last,
          # and a frame-wide change - a footer, a hub listing - rewrites all
          # 19,672 files, so those deploys added 1,600 to 3,000 new blobs each,
          # 59 to 102 MB of content apiece before compression. The repository
          # was 449 MB of a GitHub Pages source limit that is recommended at
          # 1 GB, and nothing was reading a byte of what it was spending that
          # on.
          #
          # NOTHING READS THE HISTORY, which is what makes this safe rather
          # than merely cheap. `--check` asks for `dist^{tree}` and compares
          # blob ids against a fresh build (buildlib/deployed.py); the IndexNow
          # baseline a few lines up reads the checked-out worktree, not a
          # commit range. The record of how the site got here is `main`'s
          # history, which is the sources and is kept forever - and each build
          # commit still names the `main` commit it was built from, so the tip
          # points back into that record.
          #
          # WHAT IT COSTS a reader: `dist` is force-pushed, so a fetched copy
          # will not fast-forward. `git fetch origin dist` still updates
          # `origin/dist` - the default refspec is forced - but a local `dist`
          # branch has to be reset onto it rather than pulled. The published
          # size will not drop the day this lands either; unreachable objects
          # are GitHub's to reclaim, on their schedule. What changes today is
          # that the branch stops growing.
          subject=$(git log -1 --pretty=%s "$SHA")
          commit=$(git -C .publish commit-tree "$built" \
            -m "Build ${SHA:0:7}: ${subject}")
          git -C .publish push --force origin "$commit:refs/heads/dist"

      # The version, as a tag on the commit that shipped it.
      #
      # The tag is where the version lives: there is no number in a file to
      # keep in step with it, and no pull request has to remember to move one.
      # scripts/next_version.py works out what this deploy earned by asking
      # git what has changed since the last tag, and the answer is recorded
      # here so that `git show 1.2.0` can say which commit shipped it - which
      # is the half of a version that makes it worth having.
      #
      # Idempotent, because most merges do not move it. A change to the tests,
      # to CI or to the documentation is REQUIRED by the rule to leave the
      # version alone, so the ordinary run finds the tag already there and that
      # is a no-op rather than a failure.
      #
      # It reads the number through buildlib/version.py rather than with a
      # regular expression of its own. The rule's own comment makes the point:
      # a decision that only exists inside a workflow can only be tested by
      # opening pull requests against it.
      #
      # After the publish and not before: a tag is a claim that this version is
      # live, and a tag pushed ahead of a deploy that then failed would be a
      # claim about something that never happened.
      #
      # Bundling through `dev` does not disturb any of this, and it is worth
      # saying why rather than leaving it to be rediscovered. The span
      # measured is the last version tag to what is being deployed, not the
      # previous commit - so a merge from `dev` carrying fifteen changes is
      # counted exactly the way fifteen merges from fifteen branches were, and
      # moves the number once. A bundle that adds a tool still earns the
      # middle digit, because `next_version.py` sees every added `tool.toml`
      # in the span whatever order they arrived in.
      - name: Tag the version, if this deploy moved it
        if: env.DEPLOYS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Two lines, or nothing at all: the version to tag and why it moved.
          # Nothing is the ordinary answer - the rule requires a change to the
          # tests, to CI or to the documentation to leave the version alone -
          # so an empty answer ends the step successfully.
          python scripts/next_version.py > "$RUNNER_TEMP/next"
          if [ ! -s "$RUNNER_TEMP/next" ]; then
            echo 'The version stands; nothing here reaches a page.'
            exit 0
          fi

          version=$(sed -n '1p' "$RUNNER_TEMP/next")
          reason=$(sed -n '2p' "$RUNNER_TEMP/next")

          # Belt and braces against a re-run of the same deploy: next_version
          # measures from the highest tag, so it cannot propose one that
          # exists - but a step that pushes a ref should say what it does when
          # it is asked twice rather than fail the workflow after the site is
          # already live.
          #
          # Asked of the REMOTE, which is where the push will be refused. This
          # used to be `git rev-parse refs/tags/$version`, a local lookup, and
          # a local lookup is worth nothing on a checkout that has no tags -
          # the guard and the thing it guards against were both blind to the
          # same fact. The step above now fetches them, so the local answer
          # would be right today; asking the remote is right whether or not
          # that stays true.
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Version $version is already tagged; nothing to do."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "$reason"
          git push origin "refs/tags/$version"

          # The release is the tag with a page: it is what shows in the
          # repository sidebar and what a person lands on from a changelog.
          # Its note is the same sentence as the tag's, plus the merge that
          # caused it, so the two can never say different things.
          printf '%s\n\n%s\n' "$reason" "$(git log -1 --pretty=%s)" \
            > "$RUNNER_TEMP/notes.md"
          gh release create "$version" --title "$version" \
            --notes-file "$RUNNER_TEMP/notes.md"

          echo "### Version" >> "$GITHUB_STEP_SUMMARY"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

      # Bing, Yandex, Seznam, Naver and Yep accept being told that a page
      # changed, and fetch it within hours instead of whenever a crawler next
      # comes round. Google takes no part in this and is still reached through
      # the sitemap alone; see the comment at the top of indexnow.py, which
      # also explains why the URLs come from a diff of the two sitemaps rather
      # than from a diff of the deployed files.
      #
      # It runs after the publish, deliberately: it announces pages that are
      # already live, and a URL submitted a minute before it exists is fetched,
      # found stale, and believed.
      #
      # It cannot fail the workflow. The deploy has already happened by now and
      # a refused submission does not undo it, so a red run here would say
      # something untrue about the build. The status goes to the step summary
      # instead, and the step marks itself failed without stopping the job.
      # Named against the publish rather than against whatever happens to sit
      # above it. It carried `continue-on-error` and no condition, which reads
      # as "this must never fail the deploy" and is only half of that: a step
      # with an ordinary condition is SKIPPED once an earlier one has failed,
      # so `continue-on-error` protected the job from IndexNow and left
      # IndexNow at the mercy of the tag step. When tagging broke, nine deploys
      # went out and no search engine was told about any of them - the exact
      # failure the sitemap's `lastmod` work exists to prevent, and a silent
      # one, because a skipped step is not a red mark on the run.
      #
      # `!cancelled()` rather than `always()`: a cancelled run should stop.
      # The `steps.publish` test is the real dependency - there is nothing to
      # announce if nothing was published, and `_site/sitemap.xml` might not
      # even exist.
      - name: Tell IndexNow what changed
        if: ${{ !cancelled() && env.DEPLOYS == 'true' && steps.publish.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail

          status=0
          python indexnow.py \
            --tree _site \
            --old-hashes "$RUNNER_TEMP/deployed-hashes.json" \
            --out "$RUNNER_TEMP/submitted.txt" \
            --submit || status=$?

          {
            echo '### IndexNow'
            echo
            # The list is written even when it is empty, so a missing file
            # means the script did not get that far - which is worth reading
            # as nothing submitted rather than as an error in the summary.
            count=0
            if [ -f "$RUNNER_TEMP/submitted.txt" ]; then
              count=$(wc -l < "$RUNNER_TEMP/submitted.txt")
            fi
            if [ "$count" -gt 0 ]; then
              if [ "$count" -eq 1 ]; then echo 'Submitted 1 URL:'
              else echo "Submitted $count URLs:"; fi
              echo
              echo '```'
              cat "$RUNNER_TEMP/submitted.txt"
              echo '```'
            else
              echo 'No page moved its `lastmod`, so nothing was submitted.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Summary
        if: always()
        run: |
          {
            echo '### Build'
            echo
            if [ -d _site ]; then
              echo '```'
              find _site -type f | sort | sed 's|^_site/|  |'
              echo '```'
            else
              echo 'Not built: nothing this changed reaches a page. See the Tests section above.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # A PREVIEW OF EVERY PULL REQUEST AND OF `dev`, AND THE QA SUITE RUN
  # AGAINST THE PULL REQUESTS
  #
  # Until this job existed the browser suite only ever saw a change after it
  # was live: merge, build, push to dist, Pages, and then QA (post-deploy)
  # asked the qa repository to run. The first browser test of a change ran
  # some twenty minutes after visitors had it, and the net was a report and
  # an issue rather than a gate. Everything that suite found in its first
  # months, it found on production.
  #
  # So a pull request gets a deployment of its own. Not a standing staging
  # server - the site is static and stateless, and a server to keep in step
  # can hold one change at a time - but a preview per pull request on
  # Cloudflare Pages, a second project there, uploaded directly from the
  # build above. The site already sits behind Cloudflare; Pages reads the
  # `_headers` the repository keeps "in case the site ever moves to a host
  # that reads it", so a preview carries the security headers from the file;
  # Pages marks every non-production deployment noindex on its own; and each
  # preview is an origin of its own, so root-absolute paths and the offline
  # worker behave exactly as on production. The bytes are the ones the build
  # job made - the same `_site` that would have gone to dist - which is the
  # point: what is tested is what ships.
  #
  # `dev` gets one too, at `dev.<project>.pages.dev`. Every other address here
  # belongs to a pull request and goes away with it; this one stays, and it is
  # the only place the bundle as it currently stands can be looked at -
  # `main` is the last release, and a pull request's preview is one change
  # against `dev` rather than the sum of them. It is one more branch alias in
  # the same project, so it costs no second project, no second token and no
  # standing server.
  #
  # AND A SECOND ADDRESS PER MERGE, `dev-pr-<n>.<project>.pages.dev`. The
  # stable one has the fault that comes with being stable: the next merge
  # replaces it, so the state somebody was looking at an hour ago is gone and
  # there is nothing to compare against. Each merge therefore also goes to an
  # address named after the pull request that caused it, and those accumulate
  # on purpose - they are the visual history of the bundle, and the way to
  # find which merge changed something is to open the two either side of it.
  # A second upload rather than a second alias, because Pages gives a
  # deployment one branch and one alias; wrangler has the files already, so
  # what it costs is seconds.
  #
  # The QA suite is NOT run against that one, and that is a decision rather
  # than an oversight. Every pull request into `dev` has already been through
  # the suite, and the pull request from `dev` to `main` goes through it again
  # on the whole bundle - which is the run that decides whether production
  # gets it. A third run on every merge into `dev` would re-test what was
  # tested minutes earlier, twelve runners at a time, and gate nothing. To
  # change that, drop the `github.event_name == 'pull_request'` from the
  # dispatch step below: the qa repository is handed a `base_url` and does not
  # care where it came from.
  #
  # The suite itself runs in the qa repository, as it does after a deploy,
  # dispatched with the preview's address and this pull request's head
  # commit. Its result comes back as a commit status, `qa/preview`, on that
  # commit, with the run as its link. Report-only for now; once it has been
  # green for a while, branch protection can require it.
  #
  # THAT HEAD COMMIT IS DOING TWO JOBS, and the second one is why this
  # arrangement depends on a change over there. It is where the status is
  # written; it is also the tree the suite reads this repository's tool list
  # and CSP out of, because it keeps no copy of either. Basing pull requests
  # on `dev` makes that second job load-bearing. A preview used to differ from
  # `main` by one pull request, so a suite reading `main` miscounted the hub's
  # cards only on a pull request that shipped a tool; a preview now differs by
  # the whole bundle, so it would miscount on every pull request opened
  # between one release and the next. A-Box-of-Tools/qa#94 is what makes the
  # suite read the commit it was given rather than a branch, and this
  # arrangement wants it merged.
  #
  # SETUP, ONCE: a Cloudflare Pages project (direct upload) and two secrets
  # here, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; a WEBSITE_STATUS_TOKEN
  # in the qa repository for the status; QA_DISPATCH_TOKEN as before. The
  # steps are in cloudflare/README.md. Until the Cloudflare secrets exist this
  # job says so and stops, and the pull request stays green.
  #
  # A pull request from a fork gets no secrets and therefore no preview. That
  # is GitHub's rule, and the right one: a fork's workflow must not be able to
  # deploy with this repository's credentials.
  preview:
    needs: [test, build]
    # There is no artifact to take when the build did not run, and nothing to
    # look at or test if there were: the site it would have made is the one
    # already deployed. A pull request that changes only prose therefore gets
    # no preview and no `qa/preview` check - worth knowing before that check is
    # ever made a required one.
    if: >-
      needs.test.outputs.site == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the sticky comment that carries the preview's address. A push to
      # `dev` has no pull request to write one on, and the step that would is
      # skipped rather than the permission being made conditional.
      pull-requests: write
    env:
      # Empty on a push to `dev`, which is how the steps that only make sense
      # for a pull request tell the two apart.
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The Pages branch alias, which is the whole of the address. Never
      # `main`: that is the preview project's own production branch, and
      # deploying to it would turn a build from here into that project's
      # production deployment - losing the noindex Pages puts on every other
      # deployment, and pointing the project's bare address at it.
      ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'dev' }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'abox-preview' }}
    steps:
      - name: Is there somewhere to put it?
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::No preview: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set. See cloudflare/README.md, "Previews".'
          fi

      - name: Take the build
        if: steps.gate.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: _site

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: '20'

      # `--branch` is what makes this a preview rather than the project's
      # production: Pages gives every non-production branch an alias of its
      # own, <branch>.<project>.pages.dev, stable across the pushes that
      # follow it, which is the address the comment and the QA run use. There
      # is no git checkout in this job, so the commit is named by hand.
      - name: Upload it to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then what="pull request #$PR"; else what='the dev branch'; fi
          npx --yes wrangler@3 pages deploy _site \
            --project-name "$PROJECT" \
            --branch "$ALIAS" \
            --commit-hash "$SHA" \
            --commit-message "Preview of $what at ${SHA:0:7}" \
            --commit-dirty=true
          echo "url=https://$ALIAS.$PROJECT.pages.dev/" >> "$GITHUB_OUTPUT"

      # WHICH PULL REQUEST THIS MERGE CAME FROM, for the address below.
      #
      # Asked of the API rather than read out of the commit subject. A squash
      # merge writes "Title (#379)" and would parse, but a merge commit and a
      # direct push would not, and a number guessed out of prose is a wrong
      # address rather than no address - `dev-pr-42` holding something that
      # has nothing to do with pull request 42 is worse than there being no
      # copy at all. The subject is the fallback for the one case the API
      # cannot answer: a commit that reached `dev` before its pull request
      # was recorded against it.
      #
      # Empty is an ordinary answer, not a failure. A commit that came from no
      # pull request - a direct push, a merge forward from `main` after a
      # hotfix - gets the stable address and nothing else, and the step after
      # this one is skipped. `set -e` is deliberately absent: neither lookup
      # may take the job down over an address that is a convenience.
      - name: Which pull request this merge came from
        id: merged
        if: steps.gate.outputs.ready == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          n=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number') || n=''
          if [ -z "$n" ] || [ "$n" = 'null' ]; then
            subject=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -n1) || subject=''
            n=$(printf '%s' "$subject" | sed -n 's/.*(#\([0-9][0-9]*\))[[:space:]]*$/\1/p')
          fi

          if [ -n "$n" ]; then
            echo "This merge came from pull request #$n."
          else
            echo 'This commit names no pull request, so only the stable address is written.'
          fi
          echo "pr=$n" >> "$GITHUB_OUTPUT"

      # The same bytes again, at an address that the next merge will not
      # replace. Its failure to answer is a warning and not an error: the
      # stable address above has already been deployed and waited for, and
      # this one is a convenience that must not turn a good build red.
      - name: Keep this state at an address of its own
        id: keep
        if: steps.merged.outputs.pr != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          N: ${{ steps.merged.outputs.pr }}
        run: |
          set -euo pipefail
          kept="dev-pr-$N"
          npx --yes wrangler@3 pages deploy _site \
            --project-name "$PROJECT" \
            --branch "$kept" \
            --commit-hash "$SHA" \
            --commit-message "The dev branch after pull request #$N, at ${SHA:0:7}" \
            --commit-dirty=true

          url="https://$kept.$PROJECT.pages.dev/"
          echo "url=$url" >> "$GITHUB_OUTPUT"

          answered=no
          for _ in $(seq 1 18); do
            if curl -fsS -o /dev/null "$url"; then answered=yes; break; fi
            sleep 10
          done
          if [ "$answered" = yes ]; then
            echo "Answering: $url"
          else
            echo "::warning::$url has not answered yet. The deployment is made; Cloudflare usually catches the alias up within a few minutes."
          fi

      # The alias takes a moment to answer after the first upload for a
      # branch. Waiting here, as QA (post-deploy) waits for production, keeps
      # the qa repository's workflow honest about what it tests.
      - name: Wait until it answers
        if: steps.gate.outputs.ready == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$URL"; then
              echo "Answering: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL never answered after five minutes."
          exit 1

      # One comment per pull request, edited on every push rather than added
      # to, so the address is always at the top of the conversation and never
      # repeated down it.
      - name: Say where it is, on the pull request
        if: steps.gate.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- preview-address -->'
          body=$(printf '%s\n**Preview:** %s\n\nBuilt from %s. The QA suite runs against it; its result is the `qa/preview` check below.' \
            "$marker" "$URL" "${SHA:0:7}")
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      # WHAT THIS PULL REQUEST CAN REACH, and therefore how much of the suite
      # has to see it.
      #
      # The suite is twelve runners and about fourteen minutes, and a pull
      # request that edits one tool spends all of it re-testing forty others
      # that its diff cannot touch. So a change confined to `tools/<slug>/`
      # asks the qa repository for that tool's cases and no more: a slug is
      # enough to find them, because every case about a tool carries the slug
      # in its title. Measured over the forty-one tools the site ships, a slug
      # selects between 29 and 71 cases of the 1573 a project runs - 37 on
      # average, and never none of that tool's own functional spec.
      #
      # EVERYTHING ELSE RUNS EVERYTHING, and the list of reasons is meant to
      # be read as "what can reach a page this diff does not name":
      #
      #   the base is not `dev`   The `dev` -> `main` pull request is the
      #                           release. It is one per release and the last
      #                           gate before production, so it is never
      #                           scoped, whatever it happens to contain.
      #   a tool.toml added or    The footer, the hub, the 404, the sitemap
      #   deleted                 and llms.txt all list every tool, so a tool
      #                           arriving or leaving rewrites every page -
      #                           and the cases that count the list say
      #                           "lists every shipped tool", naming no slug,
      #                           so a scoped run would be exactly blind to
      #                           what changed. This is the failure
      #                           A-Box-of-Tools/qa#94 was written for, met
      #                           from the other direction.
      #   anything outside one    `shared/`, `templates/`, `config/`,
      #   tool's folder           `build.py`, `buildlib/`, `locales/`, a
      #                           script, the root of `tools/` - all of them
      #                           reach pages this diff does not name.
      #   the diff could not be   The compare endpoint stops listing at 300
      #   listed                  files, and a reply that was cut short is
      #                           missing exactly the path this is looking
      #                           for.
      #
      # The exempt list is short and is an allowlist: prose that cannot reach
      # a page at all. Anything unrecognised runs the whole suite. This is the
      # same bargain the `test` job makes above and for the same reason - the
      # failure mode has to be a suite that ran when it need not have, and
      # never a change that shipped untested.
      #
      # A pull request that changes only prose still runs the whole suite,
      # deliberately: it builds a site identical to `dev`'s, so the run is
      # wasted either way, and inventing a third answer here to save it would
      # be a rule to get wrong for no gain.
      #
      # The judgement lives here because this is the end that can see the
      # diff. The qa repository is handed a list and filters; it does not
      # second-guess it.
      - name: What the suite has to cover
        id: scope
        if: steps.gate.outputs.ready == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail

          everything() {
            echo 'tools=' >> "$GITHUB_OUTPUT"
            echo "why=$1" >> "$GITHUB_OUTPUT"
            echo "The whole suite, because $1."
            exit 0
          }

          if [ "$BASE" != 'dev' ]; then
            everything "this pull request is against \`$BASE\` rather than \`dev\`, so it is the release"
          fi

          listed=$(gh api "repos/$REPO/compare/$BASE_SHA...$SHA" --jq '.files[] | .status + " " + .filename') || listed=''
          count=$(grep -c . <<< "$listed" || true)
          if [ "$count" -eq 0 ] || [ "$count" -ge 300 ]; then
            everything 'what this changed could not be listed in full'
          fi

          slugs=''
          while read -r status path; do
            [ -n "$path" ] || continue
            case "$path" in
              tools/*/tool.toml)
                if [ "$status" != 'modified' ]; then
                  everything "\`$path\` was $status, so every page that lists the tools changed with it"
                fi ;;
            esac
            case "$path" in
              tools/*/*)
                slug=${path#tools/}
                slug=${slug%%/*}
                case " $slugs " in
                  *" $slug "*) ;;
                  *) slugs="${slugs:+$slugs }$slug" ;;
                esac ;;
              README.md|CLAUDE.md|ROADMAP.md|LICENSE|LICENSE-CONTENT|LICENSE-BRAND) ;;
              docs/*|.claude/*|.github/*) ;;
              *) everything "\`$path\` is not inside one tool, so it can reach pages this diff does not name" ;;
            esac
          done <<< "$listed"

          if [ -z "$slugs" ]; then
            everything 'nothing here is a tool, and a run that covers everything is the safe answer'
          fi

          echo "tools=$slugs" >> "$GITHUB_OUTPUT"
          echo "why=only these tools changed: $slugs" >> "$GITHUB_OUTPUT"
          echo "Only the cases naming: $slugs"

      # The same token QA (post-deploy) uses; see that workflow's header for
      # why the default token cannot start a run in another repository.
      #
      # `pr_base` is the branch this pull request is against, and it decides
      # one thing over there: whether a tool may exist without a functional
      # spec. A tool and its spec live in different repositories and cannot
      # land in one change, so on a pull request into `dev` the qa repository
      # reports that rather than failing, and on the `dev` -> `main` pull
      # request - the release - it fails as it always did. A tool reaches
      # `dev` without a spec; it does not reach production without one. See
      # tests/coverage.spec.ts there, and A-Box-of-Tools/qa#97.
      #
      # It is a fact sent from here rather than a policy decided here: this end
      # knows what the pull request is against, and the end that owns the check
      # decides what to do about it. That is the opposite of the split above,
      # where the scope is judged here because this is the end that can see the
      # diff - each decision sits with whoever can actually answer it.
      # Not when the build proved the site did not move. The suite tests a
      # deployed site, and this one is byte-for-byte the site the base already
      # builds - so every case would be re-testing a page that is not the
      # subject of this change. The preview is still uploaded and still
      # comment-ed, because a reviewer may want to look at it; what is skipped
      # is a quarter of an hour of browser tests that cannot see the diff.
      - name: Ask the QA suite to run against it
        if: >-
          steps.gate.outputs.ready == 'true' && github.event_name == 'pull_request'
          && needs.build.outputs.moved != 'false'
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          URL: ${{ steps.upload.outputs.url }}
          TOOLS: ${{ steps.scope.outputs.tools }}
          WHY: ${{ steps.scope.outputs.why }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::QA_DISPATCH_TOKEN is not set - see .github/workflows/qa-on-deploy.yml.'
            exit 1
          fi
          gh workflow run report.yml --repo A-Box-of-Tools/qa \
            -f "base_url=$URL" -f "pr=$PR" -f "sha=$SHA" -f "tools=$TOOLS" -f "pr_base=$BASE"
          echo "Dispatched against $URL - $WHY"

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.upload.outputs.url }}
          KEPT: ${{ steps.keep.outputs.url }}
          MOVED: ${{ needs.build.outputs.moved }}
        run: |
          {
            echo '### Preview'
            echo
            if [ -z "$URL" ]; then
              echo 'Not deployed: the Cloudflare secrets are not set. See cloudflare/README.md, "Previews".'
            elif [ -n "$PR" ] && [ "$MOVED" = 'false' ]; then
              echo "- $URL"
              echo '- The QA suite is not run: this builds the same bytes as the base, so there is nothing on the page for it to see.'
            elif [ -n "$PR" ]; then
              echo "- $URL"
              echo '- The QA suite runs against it in [A-Box-of-Tools/qa](https://github.com/A-Box-of-Tools/qa/actions); the result is the `qa/preview` status on this commit.'
            else
              echo "- $URL - the bundle as \`dev\` currently stands, which the next merge replaces."
              if [ -n "$KEPT" ]; then
                echo "- $KEPT - this same state, kept at an address the next merge will not touch."
              fi
              echo '- The QA suite is not run against these. It runs on the pull request from `dev` to `main`, on the same bundle, which is the run that gates production.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
