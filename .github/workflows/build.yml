#
# Build the site and publish it to the `dist` branch.
#
# The repository holds the sources: templates/, config/, tools/ and shared/.
# The `dist` branch holds what a browser is actually served. GitHub Pages is
# pointed at `dist`, so a push to `main` becomes a deploy once this finishes.
#
# Why a separate branch rather than Pages' own build: the point of this site is
# that a reader can check its claims, and the strongest form of that is being
# able to run `python build.py` locally and diff the result against the branch
# that is being served. `python build.py --check` does exactly that. That is
# only meaningful if the served files are committed somewhere a reader can see.
#
# On a pull request this builds but does not publish, so a change that breaks
# the build is caught before it reaches main.
#

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only what is needed: the publish step writes one branch.
permissions:
  contents: write

# A second push while the first is still deploying should not race it.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build uses tomllib, which is standard library from 3.11 onwards.
      # Python alone produces a working, readable site: that is what plain
      # `python build.py` does, and it needs nothing installed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # esbuild is the one exception, and only for renaming identifiers. The
      # version is read out of config/site.toml rather than written here as
      # well, and build.py refuses to run against any other one: two versions of
      # esbuild need not invent the same names, and `--check` is only worth
      # something if a fresh build reproduces the deployed bytes exactly.
      - name: Read the pinned esbuild version
        id: pin
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('config/site.toml','rb'))['build']['esbuild_version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pinned esbuild: $version"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install esbuild
        run: npm install --global --no-audit --no-fund esbuild@${{ steps.pin.outputs.version }}

      # The readable build, kept as the reference the mangled one is judged
      # against. Cheap, and it means a file that went missing has something to
      # go missing from.
      - name: Build (readable)
        run: python build.py --out _plain --clean --no-minify

      - name: Build (deployed)
        run: python build.py --out _site --clean --mangle

      # Renaming is the one step here that could break the site quietly, so it
      # is checked rather than assumed.
      #
      # Every emitted script is parsed by Node as a real ES module - copied to
      # .mjs first, because a bare .js is read as CommonJS and `import` would be
      # a syntax error for the wrong reason. A file esbuild had corrupted would
      # fail here. Then the two builds are compared by filename, so a module
      # that vanished is caught even if everything left behind parses.
      - name: Check the mangled output
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          status=0

          count=0
          while IFS= read -r script; do
            cp "$script" "$work/check.mjs"
            if ! node --check "$work/check.mjs" 2>"$work/err"; then
              echo "::error file=$script::does not parse after mangling"
              sed 's/^/    /' "$work/err"
              status=1
            fi
            count=$((count + 1))
          done < <(find _site -name '*.js' | sort)
          echo "parsed $count scripts"

          diff <(cd _plain && find . -type f | sort) \
               <(cd _site  && find . -type f | sort) \
            || { echo '::error::the two builds do not contain the same files'; status=1; }

          exit $status

      - name: Publish to the dist branch
        if: github.event_name != 'pull_request'
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Check out the dist branch beside the working tree, creating it as an
          # orphan the first time. A worktree rather than a second clone, so the
          # push reuses the credentials actions/checkout already configured.
          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            git fetch origin dist
            git worktree add .publish FETCH_HEAD
            git -C .publish switch -C dist
          else
            git worktree add --detach .publish
            git -C .publish checkout --orphan dist
          fi

          # Replace the tree wholesale rather than copying over it: a page that
          # was deleted from the sources has to disappear from the branch too.
          git -C .publish rm -rq --cached . --ignore-unmatch
          find .publish -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -a _site/. .publish/

          git -C .publish add -A
          if git -C .publish diff --cached --quiet; then
            echo 'The build is identical to what is already deployed; nothing to push.'
            exit 0
          fi

          subject=$(git log -1 --pretty=%s "$SHA")
          git -C .publish commit -m "Build ${SHA:0:7}: ${subject}"
          git -C .publish push origin dist

      - name: Summary
        if: always()
        run: |
          {
            echo '### Build'
            echo
            echo '```'
            find _site -type f | sort | sed 's|^_site/|  |'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
