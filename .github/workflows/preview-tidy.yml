#
# Takes down the Cloudflare Pages previews that nothing needs any more.
#
# The `preview` job in build.yml uploads two kinds of address, and they stop
# being useful at different moments:
#
#   pr-<n>       one pull request, as it currently stands. Finished with the
#                moment that pull request closes - merged or not, there is
#                nothing left to review and the branch behind it is usually
#                gone too.
#   dev-pr-<n>   the bundle as it stood just after one merge into `dev`, kept
#                so that the state before the next merge is still there to
#                compare against. Finished with once that change is in `main`,
#                because from then on the thing to compare against is
#                production itself.
#
# There is a third, and it is the same upload as the second wearing the branch
# `dev`: the stable dev.<project>.pages.dev that a release is read at. Exactly
# one of those is that address - the newest - and it is the only one worth
# keeping. Every copy under it is reachable by its own hash and by nothing
# else, and the `dev-pr-<n>` at the same commit is holding the same bytes for
# as long as anybody could want them, so the next push to `dev` is what
# finishes with it.
#
# So a closed pull request takes its own preview down, and a push to `main`
# takes down every `dev-pr-<n>` whose change has been released, and every `dev`
# but the newest. NOT all of the first: `dev` carries on while a release is in
# flight, and a merge that is on `dev` and not yet released is exactly the case
# those addresses exist for. The copies under `dev` are asked nothing, because
# the question has only one answer: one of them is the address and the rest are
# unreachable.
#
# WHICH ONES HAVE BEEN RELEASED IS ASKED BY NUMBER, and that is the whole of
# what this gets right. A release replays the commits it carries - `main` holds
# `... (#371)` at a hash of its own - and `dev` is rebased on to `main`
# afterwards, so the hash a `dev-pr-<n>` was uploaded with belongs to no branch
# at all within minutes of the release that shipped it. Asking
# `compare/main...<that hash>` then answers `diverged`, which is
# indistinguishable from "still waiting for a release" and kept every one of
# them for ever. The number is in the subject of the commit wherever the change
# is replayed, so the pull requests on `dev` and not in `main` are the
# unreleased ones, and every `dev-pr-<n>` outside that set has shipped.
#
# RUN BY HAND, it does all of that and one thing more: it takes down every
# `pr-<n>` whose pull request has closed, however long ago that was. Those two
# events only ever see what is in front of them - a pull request closing knows
# one number, and a release knows the merges below it - so a preview uploaded
# before this workflow existed, or while it was broken, is invisible to both
# for ever. A dispatch is how that backlog is swept, and asking GitHub the
# state of every pull request it finds a preview for is worth doing on demand
# and not on every release.
#
# Nothing here gates anything. It runs after the fact, on addresses nobody is
# reading, so it reports rather than fails: a tidy that goes wrong must not put
# a red mark on a release that went out perfectly well. There are two things it
# will fail for, both of the same kind - being unable to list the deployments,
# and listing them without being able to tell one branch from another. A tidy
# that has quietly stopped working looks exactly like a tidy with nothing to
# do, and the only other place that would ever say so is the bill.
#
# A pull request from a fork carries no secrets and therefore never had a
# preview; the gate below finds no token and stops, as it does in build.yml.
#
name: Tidy the previews

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One at a time. Two releases close together would otherwise both list the
# deployments, both decide the same ones are finished with, and the second
# would spend its time being told they are already gone.
concurrency:
  group: preview-tidy
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'abox-preview' }}
    steps:
      - name: Is there anything to tidy with?
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Nothing to tidy: the Cloudflare secrets are not set, so no preview was ever uploaded.'
          fi

      - name: Take down what nothing needs any more
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # Every deployment the project holds, as
          # `id<TAB>branch<TAB>created`.
          # Paged, because a busy month is more than one page of them and the
          # oldest are the ones most likely to be finished with.
          #
          # NO `per_page`, and that is not an oversight. Asking for 100 is
          # refused outright - `Invalid list options provided. Review the page
          # or per_page parameter.`, error 8000024 - and the endpoint does not
          # document what it will accept, so any number here would be a guess
          # that fails the same way the day it changes. Taking the page size
          # the API chooses and reading until it hands back an empty page
          # needs no such number. The cap below is a runaway guard, not a
          # limit anybody should meet.
          : > all.tsv
          page=1
          while [ "$page" -le 40 ]; do
            body=$(curl -sS -H "$auth" "$api?page=$page") || body=''
            if [ "$(printf '%s' "$body" | jq -r '.success // false')" != 'true' ]; then
              echo "::error::Could not list the deployments of $PROJECT."
              printf '%s' "$body" | head -c 800
              exit 1
            fi
            n=$(printf '%s' "$body" | jq '.result | length')
            if [ "$n" -eq 0 ]; then break; fi
            # The branch is the one `wrangler pages deploy` was given as
            # --branch. Read back defensively:
            # this part of the API has been renamed before, and the failure it
            # would cause here is a tidy that matches nothing and says nothing.
            printf '%s' "$body" | jq -r '.result[] | [
                .id,
                (.deployment_trigger.metadata.branch // "?"),
                (.created_on // "")
              ] | @tsv' >> all.tsv
            page=$((page + 1))
          done

          total=$(wc -l < all.tsv)
          echo "The project holds $total deployment(s)."

          # If not one of them came back with a branch, the shape has moved and
          # every decision below would be "nothing to do" - which is also what
          # a healthy run says. Better to be loud once than quiet for ever.
          named=$(cut -f2 all.tsv | grep -cv '^?$' || true)
          if [ "$total" -gt 0 ] && [ "$named" -eq 0 ]; then
            echo '::error::No deployment came back with a branch name, so this cannot tell them apart. The API shape has moved; see the jq above.'
            exit 1
          fi

          # What became of pull request #n - `open`, `closed`, or nothing at
          # all when the question could not be asked. `closed` covers a merged
          # pull request as well as an abandoned one, which is the point:
          # neither has anything left to review.
          pull_state() {
            gh api "repos/$REPO/pulls/$1" --jq '.state' 2>/dev/null || true
          }

          # THE PULL REQUESTS THAT ARE ON `dev` AND NOT YET RELEASED, one
          # number per line. Read out of the subjects rather than the hashes,
          # for the reason at the top of this file: the hashes do not survive a
          # release and the numbers do.
          #
          # One question for the whole run, not one per deployment. An empty
          # answer is a true and ordinary one - it is what `dev` looks like the
          # moment a release lands - so the failure to ask has to be told apart
          # from it, and is: nothing is taken down on a question that went
          # unanswered.
          if unreleased=$(gh api "repos/$REPO/compare/main...dev" \
               --jq '.commits[].commit.message | split("\n")[0]' 2>/dev/null \
               | sed -n 's/.*(#\([0-9][0-9]*\))[[:space:]]*$/\1/p'); then
            asked=yes
            echo "Unreleased on dev: $(printf '%s' "${unreleased:-none}" | tr '\n' ' ')"
          else
            asked=no
            echo '::warning::Could not ask which merges are still unreleased, so every dev-pr is being left alone.'
          fi

          # The one `dev` deployment that IS dev.<project>.pages.dev, and so
          # the one address a release is being read at while this runs. Chosen
          # by date rather than by the position it came back in: the API hands
          # them back newest first today, and a tidy that took the live one
          # down the day that changed would be the single worst thing this
          # workflow could do. `created_on` is ISO-8601 in UTC, so the newest
          # is the largest as text.
          keep_dev=$(awk -F'\t' 'BEGIN { newest = "" }
            $2 == "dev" && $3 > newest { newest = $3; keep = $1 }
            END { print keep }' all.tsv)

          # And if that question came back empty while `dev` deployments exist,
          # the live one cannot be told from the copies - so none of them is
          # touched. Deleting the address a release is being read at, to save a
          # few megabytes, is not a trade this workflow is allowed to make.
          if [ -z "$keep_dev" ] && cut -f2 all.tsv | grep -qx dev; then
            echo '::warning::No dev deployment came back with a date, so the stable address cannot be told from the superseded copies. Leaving every dev deployment alone.'
          fi

          # WHICH ARE FINISHED WITH
          : > doomed.tsv
          while IFS="$(printf '\t')" read -r id branch created; do
            case "$EVENT:$branch" in
              "pull_request:pr-$PR")
                printf '%s\t%s\n' "$id" "$branch" >> doomed.tsv
                ;;
              workflow_dispatch:pr-*)
                # The backlog sweep, and the only place any pull request but
                # the one that just closed is asked about.
                n=${branch#pr-}
                state=$(pull_state "$n")
                case "$state" in
                  closed)
                    printf '%s\t%s\n' "$id" "$branch" >> doomed.tsv ;;
                  open)
                    echo "  $branch: still open; left alone." ;;
                  *)
                    echo "  $branch: could not ask what became of #$n; left alone." ;;
                esac
                ;;
              push:dev-pr-*|workflow_dispatch:dev-pr-*)
                n=${branch#dev-pr-}
                if [ "$asked" = no ]; then
                  : # Said once above, for all of them rather than each.
                elif printf '%s\n' "$unreleased" | grep -qx "$n"; then
                  echo "  $branch: #$n is on dev and not released yet; left alone."
                else
                  # The number on one of these is not always the merge that
                  # made it: a commit on `dev` is claimed by any open pull
                  # request whose branch contains it, the release itself
                  # included, so `dev-pr-392` can be the state after #391. A
                  # number that names something still open is therefore about
                  # work in flight whatever it is, and stays.
                  case "$(pull_state "$n")" in
                    closed)
                      printf '%s\t%s\n' "$id" "$branch" >> doomed.tsv ;;
                    open)
                      echo "  $branch: #$n is still open; left alone." ;;
                    *)
                      echo "  $branch: could not ask what became of #$n; left alone." ;;
                  esac
                fi
                ;;
              push:dev|workflow_dispatch:dev)
                # One is kept - the newest, which is the address - and every
                # copy under it goes, whatever commit it holds. Nothing is
                # asked about them: `main` is the wrong question for a
                # deployment nobody can reach and nothing points at.
                if [ -z "$keep_dev" ]; then
                  : # Said once above, for all of them rather than each.
                elif [ "$id" = "$keep_dev" ]; then
                  echo "  dev: the stable address (${created:0:10}); left alone."
                else
                  printf '%s\t%s\n' "$id" "$branch" >> doomed.tsv
                fi
                ;;
            esac
          done < all.tsv

          count=$(wc -l < doomed.tsv)
          echo '### Previews taken down' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -eq 0 ]; then
            echo 'Nothing was finished with.'
            echo 'Nothing was finished with.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A failure to delete one is a warning and not an error. The address
          # is unreachable from the pull request either way, it will be offered
          # again on the next run, and a release must not go red over a
          # deployment that has outlived its usefulness.
          gone=0
          while IFS="$(printf '\t')" read -r id branch; do
            if curl -sS -X DELETE -H "$auth" "$api/$id?force=true" | jq -e '.success' > /dev/null; then
              echo "  deleted $branch ($id)"
              echo "- \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
              gone=$((gone + 1))
            else
              echo "::warning::Could not delete $branch ($id). It will be offered again next time."
            fi
          done < doomed.tsv
          echo "Deleted $gone of $count."
