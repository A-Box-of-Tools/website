#
# Asks A-Box-of-Tools/qa to re-run its suite once a deploy actually lands.
#
# Triggered by the Build workflow finishing, rather than by the push to
# `dist` that it makes.
#
# `on: push: branches: [dist]` is the obvious way to write this and it does
# not work. build.yml publishes with the GITHUB_TOKEN that actions/checkout
# configured, and GitHub deliberately does not let a GITHUB_TOKEN push start
# another workflow run - otherwise a workflow that commits could trigger
# itself forever. The symptom is silence: `dist` moves, Pages redeploys, and
# nothing here ever runs. It was written that way first, and the only runs
# this workflow had were manual ones.
#
# `workflow_run` is the trigger meant for chaining and is not suppressed. It
# only fires for workflows defined on the default branch, which build.yml is.
#
# And only when the Build actually deployed something: a merge that changes
# no built file - a README, a workflow, the worker, a test - finishes a Build
# that pushes nothing, and re-testing an unchanged site is a full run of the
# suite for nothing. The first step below asks the dist branch.
#
# Nor when the Build was a `dev` one. Work is merged to `dev` and released
# from there to `main`; only `main` publishes, so only a Build on `main` can
# have deployed anything. That is a condition on the job below rather than
# something left to the dist check inside it - the check would catch it, since
# a `dev` build pushes nothing and the head of dist would not name its commit,
# but only after a runner had started, and every merge in the repository is a
# push to `dev`.
#
# This only dispatches; it does not run the suite itself. The qa repo's own
# report.yml runs it and publishes the result to that repo's gh-pages
# branch, so there is one place the suite runs and one report to read -
# rather than this workflow keeping a second copy of the run whose result
# lived only in an artifact here.
#
# Results appear at https://a-box-of-tools.github.io/qa/ and in that repo's
# Actions tab, not in this one - this job going green means "the run was
# asked for", not "the site passed".
#
# SETUP: needs a QA_DISPATCH_TOKEN secret in this repository - a
# fine-grained PAT scoped to A-Box-of-Tools/qa with Actions: write. The
# default GITHUB_TOKEN cannot be used: it is scoped to this repository
# alone and cannot trigger a workflow in another one. Without the secret
# this job fails with a clear message rather than silently doing nothing.
#

name: QA (post-deploy)

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

# A second deploy landing while this is still running should not race it -
# only the newest deploy is worth checking.
concurrency:
  group: qa-post-deploy
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    # Only a build that succeeded on `main` and actually published. build.yml
    # runs on pull requests and on `dev` as well and publishes on neither, so
    # neither of those finishing is a deploy and there is nothing new to check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # A Build that finished is not a deploy. The publish step pushes to dist
      # only when the built site differs from what is there, and says
      # "identical ... nothing to push" otherwise - which is every merge that
      # touches only a README, a workflow, the worker's source or a test. The
      # suite then re-tested a production that had not changed: two such
      # merges seven minutes apart cost two full runs and two published
      # reports of the same site. So this asks dist whether it moved for the
      # commit that triggered this run. The publish commit names its source -
      # "Build <short sha>: <subject>" - and if the head of dist does not name
      # this one, nothing was deployed and there is nothing to check. A manual
      # run is a person asking, and is never second-guessed.
      - name: Did this build deploy anything?
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 scripts/wait_for_deploy.py --repository "$GITHUB_REPOSITORY" --receipt --source "$SHA"

      # The immutable dist commit is the receipt, not an HTTP 200 from the old
      # homepage. Check Pages' completed revision and every emitted scope's
      # HTML generation and worker bytes before QA tests that source revision.
      - name: Wait for the deploy to actually be live
        if: steps.deployed.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIST: ${{ steps.deployed.outputs.dist }}
          DEADLINE: ${{ steps.deployed.outputs.deadline }}
        run: python3 scripts/wait_for_deploy.py --repository "$GITHUB_REPOSITORY" --dist "$DIST" --deadline "$DEADLINE"

      # Supplying the verified source SHA keeps QA's tool inventory on the
      # deployment just checked, even if main advances while the suite waits.
      # No tools/pr/base_url input: this remains the full production run.
      - name: Ask the QA repo to run its suite
        if: steps.deployed.outputs.deployed == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          SOURCE: ${{ steps.deployed.outputs.source }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::QA_DISPATCH_TOKEN is not set - see the comment at the top of this workflow.'
            exit 1
          fi

          gh workflow run report.yml --repo A-Box-of-Tools/qa -f "sha=$SOURCE"
          echo 'Dispatched. The run and its report:'
          echo '  https://github.com/A-Box-of-Tools/qa/actions'
          echo '  https://a-box-of-tools.github.io/qa/'

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.deployed.outcome }}" != 'success' ]; then
              echo '### Deployment receipt could not be verified'
              echo
              echo 'QA was not dispatched; see the receipt lookup error above.'
              exit 0
            fi
            if [ "${{ steps.deployed.outputs.deployed }}" != 'true' ]; then
              echo '### QA not asked to run'
              echo
              echo 'This build deployed nothing - the site is identical to what was already live - so there was nothing new to test.'
              exit 0
            fi
            if [ "${{ steps.dispatch.outcome }}" != 'success' ]; then
              echo '### QA not dispatched'
              echo
              echo 'Deployment verification or dispatch failed; see the failing step.'
              exit 0
            fi
            echo '### QA dispatched'
            echo
            echo 'The suite runs in the QA repository, not here.'
            echo
            echo '- [Runs](https://github.com/A-Box-of-Tools/qa/actions)'
            echo '- [Report](https://a-box-of-tools.github.io/qa/)'
          } >> "$GITHUB_STEP_SUMMARY"
