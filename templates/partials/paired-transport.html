{% if tool.supports_relay %}<div class="card paired-transport" data-pairing-transport>
  <label for="pairing-transport">{{ ui.tool.transport_label }}</label>
  <select id="pairing-transport" aria-describedby="pairing-transport-note">
    <option value="direct" selected>{{ ui.tool.transport_direct }}</option>
    <option value="relay">{{ ui.tool.transport_relay }}</option>
  </select>
  <p id="pairing-transport-note" class="field-note">{{ ui.tool.transport_note_direct }}</p>
  <p id="pairing-route" role="status" aria-live="polite" hidden></p>
</div>{% endif %}
