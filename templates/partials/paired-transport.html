{% if tool.supports_relay %}<div class="paired-transport" data-pairing-transport>
  <label class="paired-transport-toggle">
    <input type="checkbox" role="switch" aria-label="{{ ui.tool.transport_relay | e }}" data-transport-toggle data-no-remember>
    <span class="paired-transport-direct" aria-hidden="true">{{ ui.tool.transport_direct }}</span>
    <span class="paired-transport-track" aria-hidden="true"></span>
    <span class="paired-transport-relay" aria-hidden="true">{{ ui.tool.transport_relay }}</span>
  </label>
  <details class="paired-transport-help info-fold">
    <summary><span class="visually-hidden">{{ ui.tool.transport_label }}</span></summary>
    <p class="paired-transport-note" data-transport-note>{{ ui.tool.transport_note_direct }}</p>
  </details>
</div>{% endif %}
