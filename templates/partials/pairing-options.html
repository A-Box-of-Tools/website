<details id="pairing-options" class="paired-options" data-pairing-setup data-pairing-mode="online">
  <summary>{{ ui.tool.pairing_options }}</summary>
  <fieldset id="pairing-methods" aria-describedby="pairing-method-help">
    <legend>{{ ui.tool.pairing_methods }}</legend>
    <label><input type="radio" id="pairing-auto" name="pairing-method" value="auto" checked data-no-remember> {{ ui.tool.pairing_auto }}</label>
    <label><input type="radio" id="pairing-online" name="pairing-method" value="online" data-no-remember> {{ ui.tool.pairing_online }}</label>
    <label><input type="radio" id="pairing-offline" name="pairing-method" value="offline" data-no-remember> {{ ui.tool.pairing_offline }}</label>
    <p id="pairing-method-help" class="field-note">{{ ui.tool.pairing_method_help }}</p>
  </fieldset>
</details>
<p id="pairing-status" class="field-note" role="status" aria-live="polite" hidden></p>
<p id="offline-help" class="field-note" hidden>{{ ui.tool.pairing_offline_help }}</p>
