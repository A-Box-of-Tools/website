<div id="offline-viewer-fields" class="paired-blocks" hidden>
  <div class="field"><label for="offline-offer-input">{{ ui.tool.pairing_offer_input }}</label><textarea id="offline-offer-input" rows="5" maxlength="65536" autocomplete="off" spellcheck="false" dir="ltr" data-no-remember></textarea></div>
  <input type="file" id="load-offer" accept=".json,.txt,application/json,text/plain" aria-label="{{ ui.tool.pairing_load_offer }}" hidden data-no-remember>
  <button type="button" id="choose-offer">{{ ui.tool.pairing_load_offer }}</button>
  <p class="field-note">{{ ui.tool.pairing_reply_help }}</p>
</div>
