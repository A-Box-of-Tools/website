<details class="paired-network info-fold" data-pairing-network-help>
  <summary>{{ ui.tool.transport_label }}</summary>
  <p>{{ ui.tool.pairing_network }}</p>
  <h3>{{ ui.tool.pairing_hotspot_heading }}</h3>
  <ol>
    <li>{{ ui.tool.pairing_hotspot_enable }}</li>
    <li>{{ ui.tool.pairing_hotspot_join }}</li>
    <li>{{ ui.tool.pairing_hotspot_connect }}</li>
  </ol>
  <p>{{ ui.tool.pairing_hotspot_limits }}</p>
  <p class="paired-network-links"><a href="https://support.apple.com/111785">iPhone / iPad</a><a href="https://support.google.com/android/answer/9059108">Android</a></p>
</details>
