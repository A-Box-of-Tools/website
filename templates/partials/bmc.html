<!--
  An ordinary link, and it should stay one. This used to be Buy Me a Coffee's own
  snippet: a classic script that drew the button with document.writeln, which
  cannot be deferred, so everything after this point in the page - the tool
  included - waited for a third party to answer, and a web font came with it. A
  link costs none of that and does the same job. The cup is drawn here and the
  lettering is the page's own, so nothing is fetched from anybody until somebody
  follows the link. The look is in shared/css/tool-frame.css.
-->
<a class="bmc-link" href="https://www.buymeacoffee.com/{{ site.bmc.slug }}" target="_blank" rel="noopener noreferrer">
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          d="M5 7h14M6.2 7l1.3 14h9l1.3-14M8 7l.7-4h6.6l.7 4M6.8 12h10.4"/>
  </svg>
  {{ site.bmc.text }}
</a>
