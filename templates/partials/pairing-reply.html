<button type="button" id="offline-reply" hidden>{{ ui.tool.pairing_reply }}</button>
<div id="offline-viewer-reply" class="paired-blocks" hidden>
  <div class="field"><label for="offline-answer">{{ ui.tool.pairing_reply_label }}</label><textarea id="offline-answer" rows="5" maxlength="65536" readonly spellcheck="false" dir="ltr" data-no-remember></textarea></div>
  <div class="paired-actions"><button type="button" id="copy-answer">{{ ui.tool.pairing_copy_answer }}</button><button type="button" id="save-answer">{{ ui.tool.pairing_save_answer }}</button><span id="answer-copy-status" role="status" aria-live="polite"></span></div>
  <p class="field-note">{{ ui.tool.pairing_return_help }}</p>
</div>
