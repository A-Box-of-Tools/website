<!--
  "Add from a web address". Rendered only for a tool whose tool.toml sets
  [picker.urls]; that flag also brings in shared/js/url-import.js, the matching
  stylesheet, and the img-src this page needs, so none of the four can be
  present without the others.

  The warning is not small print and is not collapsed away with the rest: this
  is the only feature on the site that contacts anything, and a visitor who
  opens this panel is owed the reason in full before they use it.
-->
<details id="url-panel" class="url-panel">
  <summary>{{ tool.picker.urls.summary }}</summary>
  <div class="url-body">
    <p class="url-warning">
{{ ui.picker.warning }}
    </p>
    <label for="url-input">{{ ui.picker.label }}</label>
    <textarea id="url-input" rows="3" spellcheck="false"
              placeholder="https://example.com/photo1.jpg&#10;https://example.com/photo2.jpg"></textarea>
    <div class="url-actions">
      <button type="button" id="fetch-urls" class="primary">{{ tool.picker.urls.button }}</button>
      <span id="url-status" class="url-status" role="status" aria-live="polite"></span>
    </div>
    <p class="url-note">
{{ ui.picker.note }}
    </p>
  </div>
</details>
