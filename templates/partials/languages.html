<!--
  The language switcher.

  Plain links, and that is the whole design of THIS control. No JavaScript is
  needed to render it or to use it, and a crawler can walk from one language
  into the next on foot.

  There is now a guess as well - shared/lang.js sends a first-time visitor from
  the English page to the one their browser asks for - and this list is what it
  reads its facts out of: the name of each language, and that language's address
  for this page. It is also the only thing that writes anything down. A detected
  language is used and forgotten; a CLICK here is a statement, and is remembered
  in localStorage so that the next page is the language you asked for. The
  privacy page says so in as many words.

  Every link points at THIS page in that language, not at that language's front
  door. Somebody reading about compressing an image who wants it in German wants
  that page in German; dropping them on the hub to find it again is the
  commonest way a switcher gets built wrong.

  Only the languages this page is actually translated into are listed. A page
  nobody has translated yet therefore offers English alone - which is a list of
  one, and is rendered anyway, because on a page the reader cannot read it is
  the way out rather than furniture. The control disappears only on a site with
  a single language, where there is genuinely nothing to switch to.

  Each language is written in its own language - Deutsch, not German - because
  that is the word a reader looking for it will be scanning for. `lang` and
  `hreflang` are on every link so that a screen reader announces the name in the
  language it belongs to rather than in the language of the page around it.

  Root-absolute hrefs, unlike everything else in this footer. The slug in each
  URL is itself localized, so there is no relative path from
  /de/bild-komprimieren/ to /es/comprimir-imagen/ that could be worked out from
  `base`.
-->
{% if languages %}<nav class="lang-switch" aria-label="{{ ui.languages }}">
  <ul>
{% for lang in languages %}    <li>
{% if lang.current %}      <span class="lang-current" lang="{{ lang.hreflang }}" aria-current="true">{{ lang.endonym }}</span>
{% else %}      <a href="{{ lang.href }}" lang="{{ lang.hreflang }}" hreflang="{{ lang.hreflang }}">{{ lang.endonym }}</a>
{% endif %}    </li>
{% endfor %}  </ul>
</nav>
{% endif %}
