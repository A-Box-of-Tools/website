<!doctype html>
<html lang="{{ lang | e }}" data-local-broadcast>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>{{ tool.name }}</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="local-heading"><h1>{{ tool.heading }}</h1><p>{{ tool.tagline }}</p></header>
{{ body }}
  <script type="module" src="src/main.js?v={{ js_v }}"></script>
</body>
</html>
